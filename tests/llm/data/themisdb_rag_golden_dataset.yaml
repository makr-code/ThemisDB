# ThemisDB RAG Golden Dataset
# ─────────────────────────────────────────────────────────────────────────────
# Format:
#   id                   — unique test identifier (RAG-GD-NNN)
#   question             — natural-language retrieval query
#   expected_keywords    — list of strings; at least one must appear in Top-5
#   expected_source_hint — optional source/doc_id hint (case-insensitive)
#   knowledge_level      — one of: general | specific | specialized
#   rarity_tier          — required "rare" for knowledge_level=specialized
#   min_recall_score     — minimum fraction [0..1] for Recall@5 gate
#   category             — thematic grouping (informational only)
#
# Hard gates:
#   - Minimum size: >= 110 entries
#   - Distribution: 20% general / 30% specific / 50% specialized (±3%)
#   - Specialized policy: specialized entries must encode rare, non-generic points
# Acceptance gates:
#   - RAG-08 keyword hit in Top-5
#   - RAG-09 overall Recall@5 >= 0.80
#   - RAG-10 source hint gate
#   - RAG-11 latency median gate
#   - RAG-12 dataset schema/size/distribution guard

version: 2
dataset_name: themisdb_rag_golden_dataset
created: "2026-08-24"
description: >
  Scientific golden dataset for ThemisDB RAG quality gating.
  Curated with enforced size/distribution constraints and a mandatory
  rare-specialized knowledge segment to reduce overlap with generic model priors.
target_min_entries: 110
target_distribution: {general: 0.20, specific: 0.30, specialized: 0.50}
specialized_policy: "rare_non_generic_mandatory"

