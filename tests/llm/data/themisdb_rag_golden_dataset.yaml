# ThemisDB RAG Golden Dataset
# ─────────────────────────────────────────────────────────────────────────────
# Format:
#   id                  — unique test identifier (RAG-GD-NNN)
#   question            — natural-language retrieval query
#   expected_keywords   — list of strings; at least one must appear in Top-5
#   expected_source_hint— substring that should appear in a retrieved source/
#                         doc_id field (case-insensitive, optional)
#   min_recall_score    — minimum fraction [0..1] for Recall@5 gate
#   category            — thematic grouping (informational only)
#
# Acceptance gate (RAG-09): overall Recall@5 across all entries >= 0.80
# Keyword gate (RAG-08): every entry must hit >= 1 expected_keyword in Top-5
# Source gate (RAG-10): expected_source_hint (if non-empty) must appear in
#                        at least one Top-5 chunk's source/doc_id field
# ─────────────────────────────────────────────────────────────────────────────

version: 1
dataset_name: themisdb_rag_golden_dataset
created: "2026-08-24"
description: >
  Curated question/answer pairs for ThemisDB RAG quality gating.
  Questions derive exclusively from ThemisDB documentation, roadmaps,
  and architecture specifications.  This dataset is the authoritative
  golden reference for RAG-08..RAG-12 test gates.

