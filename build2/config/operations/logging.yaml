# ThemisDB Centralized Logging Configuration
# Version: 1.5.0
# Last Updated: 2026-02-03

logging:
  # Global logging settings
  global:
    format: "json"                        # Output format: json | text
    level: "info"                         # Default log level: debug | info | warn | error | critical
    timestamp_format: "iso8601"           # Timestamp format
    include_caller: true                  # Include file/line information
    include_hostname: true                # Include hostname in logs
    include_stacktrace_on_error: true     # Full stacktrace for errors
    
  # Output destinations
  outputs:
    # Local file output
    file:
      enabled: true
      base_path: "/var/log/themisdb"
      rotation:
        enabled: true
        max_size_mb: 100                  # Rotate when file reaches this size
        max_files: 10                     # Keep this many rotated files
        max_age_days: 30                  # Delete files older than this
        compress: true                    # Compress rotated files
        
    # Centralized logging (ELK/Splunk/etc)
    remote:
      enabled: false                      # Enable for production
      type: "elasticsearch"               # elasticsearch | splunk | loki | fluentd
      endpoint: "https://logs.example.com:9200"
      index_pattern: "themisdb-%{+YYYY.MM.dd}"
      tls:
        enabled: true
        verify_certificate: true
        ca_cert: "/etc/themisdb/certs/ca.crt"
      authentication:
        type: "bearer"                    # basic | bearer | api_key
        credentials_file: "/etc/themisdb/secrets/log_credentials"
      buffer:
        size: 1000                        # Buffer up to N messages
        flush_interval_seconds: 10        # Flush every N seconds
        retry_attempts: 3
        
    # Console output (development/debugging)
    console:
      enabled: false                      # Enable for development
      format: "text"                      # json | text
      color: true                         # Colorized output
      
  # Log categories and their specific configurations
  categories:
    # Application logs
    application:
      enabled: true
      level: "info"
      file: "app.log"
      retention_days: 90
      
    # Audit logs (compliance-critical)
    audit:
      enabled: true
      level: "info"
      file: "audit.log"
      retention_days: 2555                # 7 years for compliance
      immutable: true                     # Cannot be modified once written
      cryptographic_signature: true       # Sign each log entry
      archive:
        enabled: true
        destination: "s3://themisdb-audit-logs"
        compression: "gzip"
      
    # Security logs
    security:
      enabled: true
      level: "warn"
      file: "security.log"
      retention_days: 730                 # 2 years
      alert_on_critical: true
      siem_integration: true
      
    # Performance logs
    performance:
      enabled: true
      level: "info"
      file: "performance.log"
      retention_days: 30
      slow_query_threshold_ms: 1000       # Log queries slower than this
      high_cpu_threshold_percent: 80
      high_memory_threshold_percent: 85
      
    # System logs
    system:
      enabled: true
      level: "info"
      file: "system.log"
      retention_days: 90
  
  # Log filtering and redaction
  filters:
    # Exclude noisy endpoints
    - type: "exclude"
      field: "path"
      patterns:
        - "/health"
        - "/metrics"
        - "/_ping"
    
    # Redact sensitive fields
    - type: "redact"
      fields:
        - "password"
        - "secret"
        - "token"
        - "api_key"
        - "private_key"
        - "credit_card"
        - "ssn"
      replacement: "[REDACTED]"
    
    # Mask partial data (e.g., credit cards)
    - type: "mask"
      field: "credit_card"
      keep_first: 4
      keep_last: 4
      mask_char: "*"
  
  # Sampling (for high-volume production)
  sampling:
    enabled: false                        # Enable to reduce log volume
    rate: 0.1                             # Sample 10% of logs
    exclude_levels:                       # Always log these levels
      - "error"
      - "critical"
    exclude_categories:                   # Always log these categories
      - "audit"
      - "security"
  
  # Performance optimizations
  performance:
    async_logging: true                   # Asynchronous logging for performance
    buffer_size: 1024                     # Log buffer size
    flush_interval_seconds: 5             # Flush interval
    
  # Compliance settings
  compliance:
    gdpr:
      enabled: true
      anonymize_ip: true                  # Anonymize last octet of IP
      data_retention_days: 2555           # 7 years
    
    iso27001:
      enabled: true
      audit_all_access: true
      log_admin_actions: true
      log_config_changes: true
    
    bsi_c5:
      enabled: true
      centralized_logging: true
      log_integrity: true
      retention_compliance: true
