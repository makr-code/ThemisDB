# Shard Capability Configuration Template
# Copy this file and customize for your shard

# Basic shard identification
shard_id: shard_<location>_<domain>_<number>
shard_name: "Descriptive Name"
datacenter: <datacenter_id>
region: <primary_region>

# Last updated timestamp (automatically updated by sync scripts)
last_updated: "YYYY-MM-DDTHH:MM:SSZ"
version: "1.0.0"

# Domain specializations - what areas this shard covers
capabilities:
  # Primary domains this shard specializes in
  # Use consistent domain names: construction, law, health, finance, etc.
  domains:
    - domain1
    - domain2
  
  # Organizations this shard serves
  # Use lowercase with underscores: hamburg_bauamt, berlin_health
  organizations:
    - organization1
    - organization2
  
  # Geographic regions covered
  # Use hierarchical naming: hamburg, hamburg_nord, germany
  regions:
    - region1
    - region2
  
  # Data types stored in this shard
  # Be specific: building_permits, not just "documents"
  data_types:
    - data_type1
    - data_type2
  
  # Keywords for text-based matching
  # Include both German and English terms, technical terminology
  keywords:
    # Domain-specific terms
    - keyword1
    - keyword2
    
    # Alternative spellings/synonyms
    - synonym1
    - synonym2
    
    # Technical terms
    - technical_term1
    - technical_term2
  
  # Optional: Specialized sub-domains for finer-grained matching
  sub_capabilities:
    category1:
      - item1
      - item2
    category2:
      - item1
      - item2

# Semantic embeddings (optional, but recommended for better matching)
embeddings:
  model: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  dimension: 384
  last_generated: "YYYY-MM-DDTHH:MM:SSZ"
  # Embedding vector stored separately for efficiency
  embedding_file: "embeddings/shard_<name>.bin"

# Metadata for matching optimization
metadata:
  # Data volume
  document_count: 0
  total_size_gb: 0.0
  
  # Common query patterns (learned from logs)
  common_query_patterns:
    - "pattern1"
    - "pattern2"
  
  # Performance characteristics
  avg_query_time_ms: 50
  p95_query_time_ms: 150
  cache_hit_ratio: 0.7
  
  # Update information
  update_frequency: "hourly"  # hourly, daily, weekly, real-time
  last_major_update: "YYYY-MM-DDTHH:MM:SSZ"
  
  # Contact information
  owner_team: "team-name"
  contact: "team@example.com"

# Quality indicators for matching algorithm
quality_indicators:
  # 0.0-1.0: How complete is this shard's coverage?
  completeness_score: 0.9
  
  # 0.0-1.0: How current is the data?
  recency_score: 0.9
  
  # 0.0-1.0: How reliable/available is the shard?
  availability_score: 0.99
  
  # 0.0-1.0: How specialized is this shard?
  specialization_score: 0.9

# Notes for future updates
# Add comments here about planned enhancements, known issues, etc.
