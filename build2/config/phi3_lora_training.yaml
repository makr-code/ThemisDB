# Phi-3-Mini-4k LoRA Training Configuration
# Optimized settings for training LoRA adapters on Phi-3
# Version: 1.0.0

phi3_lora_training:
  # Base model configuration
  base_model:
    model_id: "phi-3-mini-4k-default"
    model_path: "models/default/phi-3-mini-4k-instruct-q4.gguf"
    architecture: "phi3"
    
  # Phi-3 specific target modules (Grouped Query Attention architecture)
  target_modules:
    - "qkv_proj"      # Combined Q/K/V projection (Phi-3 uses single linear layer)
    - "o_proj"        # Attention output projection
    - "gate_up_proj"  # Combined gate and up projection (MLP)
    - "down_proj"     # MLP down projection
  
  # LoRA hyperparameters (optimized for Phi-3)
  hyperparameters:
    # LoRA rank - balance between capacity and efficiency
    rank: 16
    
    # LoRA alpha - scaling factor (typically 2 * rank)
    alpha: 32.0
    
    # Dropout rate - prevent overfitting
    dropout: 0.05
    
    # Learning rate - conservative for stability
    learning_rate: 0.0002
    
    # Batch size - adjust based on available memory
    batch_size: 4
    
    # Gradient accumulation - effective batch size = batch_size * accumulation_steps
    gradient_accumulation_steps: 4
    
    # Training epochs
    num_epochs: 3
    
    # Maximum sequence length
    max_seq_length: 512
    
    # Optimizer settings
    optimizer:
      type: "adamw"
      weight_decay: 0.01
      beta1: 0.9
      beta2: 0.999
      eps: 1e-8
    
    # Learning rate scheduler
    lr_scheduler:
      type: "cosine_with_warmup"
      warmup_steps: 100
      min_lr_ratio: 0.1  # Minimum LR = 10% of base LR
  
  # Training features
  training:
    # Checkpointing
    checkpointing:
      enabled: true
      checkpoint_interval_steps: 100
      checkpoint_dir: "data/lora_checkpoints/phi3"
      keep_last_n: 3
      save_optimizer_state: true
    
    # Mixed precision training (FP16)
    mixed_precision:
      enabled: true
      fp16: true
      bf16: false  # Use FP16 for wider hardware support
      loss_scale: "dynamic"
    
    # Gradient clipping
    gradient_clipping:
      enabled: true
      max_grad_norm: 1.0
      clip_type: "norm"  # "norm" or "value"
    
    # Early stopping
    early_stopping:
      enabled: true
      patience: 3
      min_delta: 0.001
      monitor: "validation_loss"
    
    # Validation
    validation:
      enabled: true
      split_ratio: 0.1
      eval_steps: 50
      metrics:
        - "loss"
        - "perplexity"
        - "accuracy"
  
  # QLoRA configuration (for memory-constrained environments)
  qlora:
    enabled: false  # Disabled by default; enable for low-VRAM scenarios
    quantization_type: "nf4"  # NormalFloat4 quantization
    block_size: 64
    double_quantization: true
    compute_dtype: "float16"
    
    # Memory optimization
    memory:
      gradient_checkpointing: true
      paged_attention: true
      max_memory_mb: 16384  # 16GB max
  
  # Data preprocessing
  preprocessing:
    # Tokenization
    tokenizer:
      type: "sentencepiece"
      add_special_tokens: true
      padding: "max_length"
      truncation: true
      
    # Data augmentation (optional)
    augmentation:
      enabled: false
      techniques:
        - "synonym_replacement"
        - "back_translation"
      probability: 0.1
    
    # Shuffling
    shuffle: true
    seed: 42
  
  # Hardware configuration
  hardware:
    # Device selection
    device: "cuda"  # "cuda", "cpu", "mps" (Apple Silicon)
    device_id: 0
    
    # Multi-GPU settings
    multi_gpu:
      enabled: false
      strategy: "ddp"  # "ddp" (DistributedDataParallel) or "fsdp" (FullyShardedDataParallel)
      num_gpus: 1
    
    # CPU threads (for data loading)
    num_workers: 4
    pin_memory: true
  
  # Monitoring and logging
  monitoring:
    # Logging
    logging:
      enabled: true
      log_level: "INFO"
      log_interval_steps: 10
      log_file: "logs/phi3_lora_training.log"
      
    # Metrics export
    metrics:
      enabled: true
      export_to_prometheus: true
      prometheus_port: 9090
      
      # Tracked metrics
      tracked_metrics:
        - "loss"
        - "learning_rate"
        - "gradient_norm"
        - "epoch"
        - "step"
        - "tokens_per_second"
        - "memory_usage_mb"
        - "gpu_utilization_percent"
    
    # Progress callbacks
    callbacks:
      enabled: true
      update_frequency: "step"  # "step", "epoch", "batch"
  
  # Quality assurance
  quality:
    # Validation tests (run after training)
    validation_tests:
      - prompt: "What is ThemisDB?"
        expected_keywords:
          - "database"
          - "multi-model"
        min_confidence: 0.8
        
      - prompt: "How to create a collection?"
        expected_keywords:
          - "CREATE COLLECTION"
          - "syntax"
        min_confidence: 0.7
    
    # Minimum quality thresholds
    thresholds:
      min_accuracy: 0.80
      max_perplexity: 50.0
      min_validation_accuracy: 0.75
  
  # Deployment
  deployment:
    # Adapter versioning
    versioning:
      enabled: true
      version_format: "v{major}.{minor}.{patch}"
      auto_increment: true
    
    # A/B testing
    ab_testing:
      enabled: false
      traffic_split: 0.1  # 10% to new adapter
      duration_hours: 24
      
    # Auto-rollback on quality degradation
    auto_rollback:
      enabled: true
      triggers:
        - "accuracy_drop > 0.1"
        - "avg_rating < 3.0"
        - "error_rate > 0.05"
      cooldown_hours: 6
  
  # Storage
  storage:
    # Adapter storage
    adapter_dir: "data/lora_adapters/phi3"
    enable_compression: true
    compression_algorithm: "zstd"
    
    # Backend
    backend: "themisdb"  # "themisdb", "filesystem", "s3"
    collection_name: "phi3_lora_adapters"
    
    # Versioning
    max_versions: 5
    
    # Security
    enable_encryption: true
    enable_signatures: true

# Example training datasets for Phi-3
example_datasets:
  themis_help:
    description: "ThemisDB documentation and help queries"
    size: 100
    format: "instruction_following"
    samples:
      - instruction: "How do I create a vector index in ThemisDB?"
        output: "Use CREATE VECTOR INDEX idx ON collection(field) WITH METRIC 'cosine'."
        
      - instruction: "What are the supported vector similarity metrics?"
        output: "ThemisDB supports cosine, euclidean, and dot product similarity metrics."
        
      - instruction: "How do I query a graph in ThemisDB?"
        output: "Use MATCH (n)-[r]->(m) RETURN n, r, m for graph pattern matching."
