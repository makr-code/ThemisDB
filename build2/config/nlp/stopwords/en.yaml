# Stop Words Configuration for NLP Text Analyzer
# Language: English (en)
# Version: 1.0
# 
# Usage: Place this file in config/nlp/stopwords/en.yaml
# The NLP analyzer will automatically load stop words from this file

language:
  code: "en"
  name: "English"
  
stopwords:
  # Articles
  - "a"
  - "an"
  - "the"
  
  # Conjunctions
  - "and"
  - "or"
  - "but"
  - "nor"
  - "yet"
  - "so"
  
  # Prepositions
  - "in"
  - "on"
  - "at"
  - "to"
  - "for"
  - "of"
  - "with"
  - "by"
  - "from"
  - "as"
  - "into"
  - "through"
  - "during"
  - "before"
  - "after"
  - "above"
  - "below"
  - "between"
  - "under"
  - "over"
  
  # Pronouns
  - "i"
  - "you"
  - "he"
  - "she"
  - "it"
  - "we"
  - "they"
  - "me"
  - "him"
  - "her"
  - "us"
  - "them"
  - "my"
  - "your"
  - "his"
  - "its"
  - "our"
  - "their"
  - "this"
  - "that"
  - "these"
  - "those"
  
  # Verbs (common auxiliary/modal)
  - "is"
  - "am"
  - "are"
  - "was"
  - "were"
  - "been"
  - "be"
  - "being"
  - "have"
  - "has"
  - "had"
  - "having"
  - "do"
  - "does"
  - "did"
  - "doing"
  - "will"
  - "would"
  - "should"
  - "could"
  - "may"
  - "might"
  - "must"
  - "can"
  - "shall"
  
  # Common adverbs
  - "not"
  - "no"
  - "yes"
  - "very"
  - "too"
  - "also"
  - "just"
  - "only"
  - "now"
  - "then"
  - "here"
  - "there"
  - "where"
  - "when"
  - "how"
  - "why"
  - "what"
  - "which"
  - "who"
  - "whom"
  
  # Other common words
  - "all"
  - "any"
  - "both"
  - "each"
  - "few"
  - "more"
  - "most"
  - "other"
  - "some"
  - "such"

# Optional: Custom stop words for specific domains
custom_stopwords:
  database:
    - "query"
    - "select"
    - "insert"
    - "update"
    - "delete"
  
  # These can be enabled/disabled based on context
  enabled: false
