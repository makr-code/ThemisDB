# ThemisDB – Nginx API Gateway Configuration
#
# This file configures Nginx as a reverse-proxy / API gateway in front of one or
# more ThemisDB instances.  It provides:
#   - TLS termination (HTTP → HTTPS redirect)
#   - Upstream health checking and load balancing
#   - Per-IP and per-connection rate limiting
#   - Request-ID injection for end-to-end tracing
#   - Correct X-Forwarded-* header forwarding so ThemisDB can resolve the
#     originating client IP for rate limiting and audit logging
#   - WebSocket upgrade support (/v2/changes, /ws)
#   - gRPC proxy support (/grpc)
#
# Usage:
#   nginx -c /path/to/config/gateway/nginx-gateway.conf
# or include from the main nginx.conf:
#   include /etc/nginx/conf.d/themisdb-gateway.conf;

# ---------------------------------------------------------------------------
# Rate-limit zones (defined in http context)
# ---------------------------------------------------------------------------
# 10 MB shared memory → ~160 000 unique client IPs tracked simultaneously.
limit_req_zone  $binary_remote_addr zone=themisdb_per_ip:10m   rate=100r/s;
limit_conn_zone $binary_remote_addr zone=themisdb_conn:10m;

# ---------------------------------------------------------------------------
# Upstream pool
# ---------------------------------------------------------------------------
upstream themisdb_backend {
    # Least-connection load balancing works well for long-lived DB connections.
    least_conn;

    server themisdb:8080 max_fails=3 fail_timeout=10s;

    # Add additional replicas here, e.g.:
    # server themisdb-2:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;          # Reuse backend connections
    keepalive_timeout 60s;
}

# gRPC upstream (ThemisDB gRPC port)
upstream themisdb_grpc_backend {
    server themisdb:50051;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen      80;
    server_name _;

    # Allow health probes over plain HTTP so Kubernetes liveness checks work.
    location = /health {
        proxy_pass         http://themisdb_backend;
        proxy_set_header   Host $host;
        access_log         off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS reverse proxy
# ---------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    server_name themisdb.example.com;   # Replace with your domain

    # ------------------------------------------------------------------
    # TLS
    # ------------------------------------------------------------------
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------------
    # General proxy settings
    # ------------------------------------------------------------------
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";  # Required for keepalive upstream

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Buffer settings – avoid writing large responses to disk
    proxy_buffering            on;
    proxy_buffer_size          16k;
    proxy_buffers              8 16k;
    proxy_busy_buffers_size    32k;
    client_max_body_size       16m;

    # ------------------------------------------------------------------
    # Request-ID injection
    # Generate a UUID-like ID when the client does not supply one so that
    # ThemisDB can correlate every log line back to an originating request.
    # ------------------------------------------------------------------
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;   # Nginx built-in unique ID (Nginx ≥ 1.11.0)
    }

    proxy_set_header  X-Request-ID $req_id;
    add_header        X-Request-ID $req_id always;

    # ------------------------------------------------------------------
    # Health check (no auth, no rate limit)
    # ------------------------------------------------------------------
    location = /health {
        proxy_pass         http://themisdb_backend;
        access_log         off;
        proxy_set_header   Host $host;
    }

    location = /metrics {
        proxy_pass   http://themisdb_backend;
        # Restrict metrics to internal networks only
        allow        10.0.0.0/8;
        allow        172.16.0.0/12;
        allow        192.168.0.0/16;
        deny         all;
    }

    # ------------------------------------------------------------------
    # WebSocket endpoints  (/v2/changes, /ws)
    # ------------------------------------------------------------------
    location ~ ^/(ws|v2/changes) {
        limit_req   zone=themisdb_per_ip burst=20 nodelay;
        limit_conn  themisdb_conn 10;

        proxy_pass          http://themisdb_backend;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "Upgrade";

        # WebSocket connections can stay open for long periods
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ------------------------------------------------------------------
    # gRPC proxy
    # ------------------------------------------------------------------
    location /grpc {
        limit_req   zone=themisdb_per_ip burst=50 nodelay;

        grpc_pass           grpc://themisdb_grpc_backend;
        grpc_set_header     X-Real-IP        $remote_addr;
        grpc_set_header     X-Forwarded-For  $proxy_add_x_forwarded_for;
        grpc_set_header     X-Request-ID     $req_id;

        grpc_connect_timeout 5s;
        grpc_read_timeout    60s;
        grpc_send_timeout    60s;
    }

    # ------------------------------------------------------------------
    # REST API
    # ------------------------------------------------------------------
    location / {
        # Rate limiting: allow bursts up to 200 requests, then enforce 100 r/s
        limit_req        zone=themisdb_per_ip burst=200 nodelay;
        limit_req_status 429;

        # Max 50 simultaneous connections per client IP
        limit_conn        themisdb_conn 50;
        limit_conn_status 503;

        proxy_pass http://themisdb_backend;

        # Expose ThemisDB API versioning headers to the client
        add_header API-Version       $upstream_http_api_version always;
        add_header Deprecation       $upstream_http_deprecation always;
        add_header Sunset            $upstream_http_sunset always;
        add_header Link              $upstream_http_link always;

        # Propagate the request ID back to the caller
        add_header X-Request-ID $req_id always;

        # CORS – adjust origins as needed for your environment
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID";
            add_header Access-Control-Max-Age       3600;
            return 204;
        }
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Expose-Headers "API-Version, Deprecation, Sunset, X-Request-ID" always;
    }

    # ------------------------------------------------------------------
    # Error pages
    # ------------------------------------------------------------------
    error_page 429 /429.json;
    error_page 502 503 /5xx.json;

    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"error":"Rate limit exceeded","status":429}';
    }

    location = /5xx.json {
        internal;
        default_type application/json;
        return 503 '{"error":"Service temporarily unavailable","status":503}';
    }
}
