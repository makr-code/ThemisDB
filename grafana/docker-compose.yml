version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: themisdb-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./provisioning/alerts.yml:/etc/prometheus/alerts.yml
      - ./alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"  # Prometheus UI and API
    networks:
      - themisdb-monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: themisdb-grafana
    volumes:
      - ./provisioning:/etc/grafana/provisioning
      - ./dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-jaeger-datasource
    ports:
      - "3000:3000"
    networks:
      - themisdb-monitoring
    depends_on:
      - prometheus
      - jaeger
    restart: unless-stopped

  # Jaeger all-in-one: receives OTLP spans, provides trace UI
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: themisdb-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger HTTP collector (thrift)
      - "14250:14250"  # Jaeger gRPC collector
      - "4317:4317"    # OTLP gRPC (used by OTel Collector)
      - "4318:4318"    # OTLP HTTP
    networks:
      - themisdb-monitoring
    restart: unless-stopped

  # OpenTelemetry Collector: receives OTLP spans, fans out to Jaeger + Prometheus
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    container_name: themisdb-otel-collector
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4319:4317"   # OTLP gRPC ingress (application → collector)
      - "4320:4318"   # OTLP HTTP ingress
      - "8888:8888"   # OTel Collector self-metrics (Prometheus scrape)
      - "8889:8889"   # Prometheus exporter (spans → metrics)
    networks:
      - themisdb-monitoring
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped

  # ThemisDB service – build from repository source
  themisdb:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: release
    container_name: themisdb
    environment:
      - THEMIS_ENABLE_METRICS=true
      - THEMIS_METRICS_PORT=9091
      - THEMIS_OTEL_ENDPOINT=http://otel-collector:4317
      - THEMIS_OTEL_SERVICE_NAME=themisdb
    ports:
      - "9091:9091"   # Prometheus metrics endpoint
      - "8080:8080"   # REST API endpoint
    networks:
      - themisdb-monitoring
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  themisdb-monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
