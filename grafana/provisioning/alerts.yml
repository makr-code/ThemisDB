# Alert rule loader for Grafana's built-in alerting.
# All rule files live under grafana/alerts/ and are mounted into Prometheus
# as /etc/prometheus/alerts/*.  Grafana provisioning mirrors the same tree.
#
# For Prometheus-native rule loading see prometheus.yml → rule_files section.
# This file provisions alerting contact points / notification policies in Grafana UI.
apiVersion: 1

contactPoints: []   # configure via Grafana UI or add entries here
notificationPolicies: []
