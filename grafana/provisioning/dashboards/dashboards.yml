apiVersion: 1

# One provider per dashboard category folder.
# foldersFromFilesStructure: true causes Grafana to create a Grafana folder
# that mirrors each subdirectory automatically.
providers:
  - name: 'ThemisDB LLM Dashboards'
    orgId: 1
    folder: 'LLM'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/llm
      foldersFromFilesStructure: false

  - name: 'ThemisDB Security Dashboards'
    orgId: 1
    folder: 'Security'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
