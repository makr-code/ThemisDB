global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    cluster: 'themisdb'
    environment: 'production'

# Load alert rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  - job_name: 'themisdb-llm'
    static_configs:
      - targets: ['themisdb:9091']
        labels:
          service: 'themisdb'
          component: 'llm'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 4s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
