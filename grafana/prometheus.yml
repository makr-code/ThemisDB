global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'themisdb-raid'
    environment: 'benchmark'

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts/siem_security_alerts.yaml'
  - '/etc/prometheus/alerts/graph_security.yaml'
  - '/etc/prometheus/rules/llm_alerts.yml'
  - '/etc/prometheus/rules/sla-rules.yml'
  - '/etc/prometheus/alerts/bt4_flare_alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Grafana monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'

  # ThemisDB LLM Inference Metrics (NEW)
  - job_name: 'themisdb-llm'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          service: 'themisdb-llm'
          component: 'inference'
    metrics_path: '/metrics'
    scrape_interval: 5s

  # RAID 0 - Striping (Shards 1-3, mapped to ports 9091-9093)
  - job_name: 'raid0-stripe'
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          raid_group: 'raid0'
          raid_mode: 'stripe'
          shard_id: 'shard1'
      - targets: ['host.docker.internal:9092']
        labels:
          raid_group: 'raid0'
          raid_mode: 'stripe'
          shard_id: 'shard2'
      - targets: ['host.docker.internal:9093']
        labels:
          raid_group: 'raid0'
          raid_mode: 'stripe'
          shard_id: 'shard3'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # RAID 1 - Mirroring (Primary + Secondary, mapped to ports 9094-9095)
  - job_name: 'raid1-mirror'
    static_configs:
      - targets: ['host.docker.internal:9094']
        labels:
          raid_group: 'raid1'
          raid_mode: 'mirror'
          raid_role: 'primary'
      - targets: ['host.docker.internal:9095']
        labels:
          raid_group: 'raid1'
          raid_mode: 'mirror'
          raid_role: 'secondary'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # RAID 5 - Parity (Shards 1-3, mapped to ports 9096-9098)
  - job_name: 'raid5-parity'
    static_configs:
      - targets: ['host.docker.internal:9096']
        labels:
          raid_group: 'raid5'
          raid_mode: 'parity'
          shard_id: 'shard1'
      - targets: ['host.docker.internal:9097']
        labels:
          raid_group: 'raid5'
          raid_mode: 'parity'
          shard_id: 'shard2'
      - targets: ['host.docker.internal:9098']
        labels:
          raid_group: 'raid5'
          raid_mode: 'parity'
          shard_id: 'shard3'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # GGML Bridge – BT-4 adapter metrics
  - job_name: 'ggml-bridge'
    static_configs:
      - targets: ['host.docker.internal:9200']
        labels:
          component: 'ggml_bridge'
          service: 'bt4_adapter'
    metrics_path: '/metrics'
    scrape_interval: 5s

  # FLARE Retrieval – retrieval pipeline metrics
  - job_name: 'flare-retrieval'
    static_configs:
      - targets: ['host.docker.internal:9201']
        labels:
          component: 'flare_retrieval'
          service: 'flare_pipeline'
    metrics_path: '/metrics'
    scrape_interval: 5s

  # OpenTelemetry Collector – self-metrics and span RED metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          service: 'otel-collector'
          component: 'observability'
      - targets: ['otel-collector:8889']
        labels:
          service: 'otel-collector-spans'
          component: 'span_metrics'
    metrics_path: '/metrics'
    scrape_interval: 15s
