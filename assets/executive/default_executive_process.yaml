method_id: default_executive_process
version: 1.0.0
name: Default Executive Process
domain: executive
description: Default BPMN-oriented process for the executive domain with ThemisDB
  governance guards.
runtime:
  mode_required: dream_research
  fail_closed: true
  promotion_requires_human_approval: true
bpmn:
  model_type: default
  entry_event: intake
  exit_event: decision_or_handover
phases:
- id: intake
  name: Intake
- id: assessment
  name: Assessment
- id: validation
  name: Validation
- id: decision
  name: Decision
- id: monitoring
  name: Monitoring
themisdb_module_bindings:
- process
- network
- observability
- updates
hazard_analysis:
  default_threats:
  - data_drift
  - policy_misclassification
  - insufficient_evidence
  kritis_threats:
  - availability_loss
  - integrity_loss
  - dependency_cascade
  controls:
  - fail_closed
  - human_approval
  - traceability
  - rollback_checkpoint
observability:
  required_metadata:
  - run_id
  - knowledge_source_class
  - wiki_context_refs
  - risk_register_ref
