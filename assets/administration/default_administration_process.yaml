method_id: default_administration_process
version: 1.0.0
name: Default Administration Process
domain: administration
description: Generic administrative workflow from intake to issued and monitored decision.
runtime:
  mode_required: dream_research
  fail_closed: true
phases:
  - id: intake
    name: Intake
  - id: competence_check
    name: Competence Check
  - id: procedure_execution
    name: Procedure Execution
  - id: decision_preparation
    name: Decision Preparation
  - id: issuance_and_monitoring
    name: Issuance and Monitoring
observability:
  required_metadata:
    - run_id
    - authority_ref
    - decision_ref
