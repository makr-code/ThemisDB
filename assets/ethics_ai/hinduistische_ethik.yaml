main_theses:
- thesis_id: hinduistische_ethik:dharma_kosmische_ordnung
  name: Dharma — Kosmische Ordnung und kontextuelle Pflicht
  description: Dharma bezeichnet die kosmische Ordnung und die ethischen Pflichten, die aus ihr folgen. Richtiges Handeln
    ist kontextuell — situationsgemäß und rollengemäß — aber eingebettet in eine universale Ordnung.
  explanation: 'Dharma (Sanskrit: Ordnung, Recht, Pflicht) umfasst kosmisches Recht

    (rita), universale ethische Pflichten (samanya dharma) und situationsspezifische

    Rollenpflichten (vishishta dharma).  Im Unterschied zu Kants kategorischem

    Imperativ sind Dharma-Pflichten kontextuell: was richtiges Handeln ist, hängt

    von Situation, Rolle und Stadium des Lebens (ashrama) ab.

    In der KI-Ethik: KI-Systeme müssen kontextuelle Pflichten und nicht nur

    abstrakte Universalregeln berücksichtigen.

    '
  implications:
  - Ethik ist kontextuell, nicht nur formal-universalistisch
  - Rollenpflichten sind moralisch relevant (ohne Hierarchismus zu rechtfertigen)
  - KI-Systeme müssen situativen Kontext bei ethischen Entscheidungen berücksichtigen
  - Kosmische Ordnung schließt ökologische und soziale Verantwortung ein
  token_budget: 180
