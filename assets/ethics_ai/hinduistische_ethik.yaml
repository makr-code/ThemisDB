decision_framework:
  question_sequence:
  - Entspricht die Handlung dem Dharma — der kosmischen Ordnung und den situativen Pflichten?
  - Verletzt die Handlung das Prinzip Ahimsa (Nicht-Schaden) gegenüber allen Lebewesen?
  - Entspringt die Handlung selbstloser Absicht (Nishkama Karma) oder ego-getriebenem Eigeninteresse?
  - Fördert die Handlung Satya (Wahrheit und Transparenz)?
  - Stärkt die Handlung das Bewusstsein universaler Verbundenheit (Vasudhaiva Kutumbakam)?
  tests:
  - name: Dharma-Test
    procedure: Welches Dharma gilt in diesem Kontext? Entspricht die Handlung der situativen und universalen Ordnung?
  - name: Ahimsa-Test
    procedure: Schadet die Handlung einem Lebewesen — direkt oder indirekt, kurz- oder langfristig?
  - name: Karma-Intentionstest
    procedure: Entspringt die Handlung ego-freier, selbstloser Absicht oder ego-getriebenem Kalkül?
strengths:
- point: Kontextuelle Tiefe
  elaboration: Dharma ermöglicht ethische Differenzierung nach Kontext und Rolle, ohne in relativistischen Situationalismus zu verfallen
- point: Universales Mitgefühl
  elaboration: Ahimsa gegenüber allen Lebewesen und Vasudhaiva Kutumbakam begründen globale und ökologische Verantwortung
- point: Intentionsethik
  elaboration: Karma-Ethik ergänzt konsequentialistische Analyse durch Fokus auf Absicht und Einstellung
- point: Praxis-Wirksamkeit
  elaboration: Gandhis Satyagraha ist das historisch bedeutsamste Beispiel ethischer Theorie in politischer Praxis
weaknesses:
- point: Kastensystem
  elaboration: Historische Auslegungen von Dharma haben das Kastensystem legitimiert — ein Missbrauch des Konzepts, der explizit abgelehnt werden muss
- point: Interne Vielfalt
  elaboration: Hinduismus ist keine homogene Tradition; Advaita, Vishishtadvaita, Dvaita und andere Schulen haben unterschiedliche ethische Implikationen
- point: Karma-Missverständnis
  elaboration: Karma wird oft falistisch verstanden — als Legitimation von Ungleichheit; dies widerspricht dem Reformpotenzial der Tradition
internal_debate:
  advaita_vs_vishistadvaita:
    issue: Ist das Selbst mit Brahman identisch (Advaita) oder nur verbunden (Vishishtadvaita)?
    positions:
    - 'Advaita Shankara: Atman = Brahman; Differenz ist Maya (Illusion)'
    - 'Vishishtadvaita Ramanuja: Seelen sind real, aber Teil Brahmans; Bhakti als Weg'
  kaste_vs_reform:
    issue: Legitimiert Varna (Kaste) durch Dharma soziale Ungleichheit?
    positions:
    - 'Traditionalismus: Varna ist kosmische Ordnung, nicht soziale Hierarchie'
    - 'Reform (Gandhi, Ambedkar-Kontra): Kastensystem ist Dharma-Verrat; universale Gleichheit ist das authentische Dharma'
philosophical_positioning:
  relation_to_buddhism: 'Gemeinsame Wurzeln: Karma, Ahimsa; Unterschied: Hinduismus bejaht Atman; Buddhismus lehnt dauerhaftes Selbst ab'
  relation_to_care_ethics: 'Seva und Karuṇā überschneiden sich; hinduistische Ethik fügt kosmisch-metaphysischen Rahmen hinzu'
  relation_to_kant: 'Dharma hat universale und kontextuelle Dimensionen; Ahimsa ist absoluter als Kants Beispiele; Intention gemeinsam'
  relation_to_virtue_ethics: 'Nächste Verwandte: Dharma = Tugendordnung; Karma = Tugendpraxis; Moksha = Eudaimonia-Analogon'
