    REBUTTAL: 0.65
- thesis_id: hinduistische_ethik:ahimsa_satya
  name: Ahimsa und Satya — Nicht-Schaden und Wahrheit
  description: Ahimsa (Nicht-Schaden, Gewaltlosigkeit) und Satya (Wahrheit) sind die höchsten ethischen Grundsätze des Hinduismus,
    die Gandhi zur politischen Praxis entwickelte.
  explanation: 'Ahimsa (avihiṃsā) gebietet das Unterlassen jeglichen Schadens —

    physisch, verbal, mental — gegenüber allen Lebewesen.  Satya (Wahrheit) verpflichtet

    zur Übereinstimmung von Gedanken, Worten und Taten.  Gandhis Satyagraha

    (Kraft der Wahrheit) verbindet beide zu einer politischen Methode des

    gewaltlosen Widerstands.

    In der KI-Ethik: KI-Systeme müssen Schaden minimieren (Ahimsa) und transparent

    (Satya) operieren; täuschende KI verletzt Satya; schädende KI verletzt Ahimsa.

    '
  implications:
  - Gewaltlosigkeit als absolutes Prinzip in allen Handlungsbereichen
  - Wahrheit als ethische Pflicht — Täuschung ist immer verboten
  - KI-Systeme müssen transparent und nicht-täuschend sein (Satya)
  - Minimierung von Schaden als primäres KI-Designprinzip (Ahimsa)
  token_budget: 175
  activation_rounds:
  - 1
  - 2
  - 4
  round_role_weights:
    PRO: 0.9
    SYNTHESIS: 0.8
    REBUTTAL: 0.7
- thesis_id: hinduistische_ethik:karma_intention
  name: Karma und intentionale Handlung
  description: Karma bezeichnet moralische Kausalität — Handlungen haben Folgen, aber die Absicht ist moralisch entscheidend.
    Selbstloses Handeln ohne Erwartung von Früchten (Nishkama Karma) ist höchste Tugend.
  explanation: 'Karma ist nicht Fatalismus, sondern moralische Kausalität: Handlungen

    prägen Charakter und haben Konsequenzen.  Entscheidend ist die Absicht

    (sankalpa), nicht nur das Ergebnis.  Nishkama Karma (Bhagavad Gita 3.19):

    handeln ohne ego-getriebene Erwartung von Früchten — dies ist der Weg zur

    Befreiung (Moksha).  In der KI-Ethik: intentionsbasierte Ethik ergänzt

    konsequentialistische Analyse; schlechte Absicht hinter guten Ergebnissen

    bleibt ethisch problematisch.

    '
  implications:
  - Moralische Absicht und Einstellung sind entscheidend, nicht nur Outcomes
  - Selbstloses Handeln als Ideal; egoistische Optimierung ist ethisch inferior
  - Langfristige karmische Konsequenzen müssen in Technikfolgenabschätzung einbezogen werden
  token_budget: 160
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 0.8
    REBUTTAL: 0.7
    SYNTHESIS: 0.75
- thesis_id: hinduistische_ethik:vasudhaiva_kutumbakam
  name: Vasudhaiva Kutumbakam — Die Welt ist eine Familie
  description: '"Die Welt ist eine Familie" (Maha Upanishad 6.71) — ein Universalismus der Verwandtschaft, der alle Menschen
    und Lebewesen als eine große Familie versteht.'
  explanation: 'Vasudhaiva Kutumbakam (Sanskrit: वसुधैव कुटुम्बकम्) ist ein

    Universalismus der Verbundenheit: alle Lebewesen sind miteinander verbunden

    wie eine Familie.  Dies begründet globale Solidarität, Umweltverantwortung

    und die Überwindung nationaler Grenzen.

    In der KI-Ethik: KI-Systeme und ihre Auswirkungen betreffen die gesamte

    Menschheitsfamilie — globale KI-Governance muss dieser Verbundenheit Rechnung tragen.

    '
