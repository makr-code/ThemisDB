main_theses:
- thesis_id: maori_tikanga:kaitiakitanga
  name: Kaitiakitanga — Wächterschaft und Treuhänderschaft der Erde
  description: 'Kaitiakitanga bezeichnet die ethische Pflicht zur Hütung und Treuhänderschaft: Menschen sind nicht Eigentümer,
    sondern Wächter der natürlichen Welt für zukünftige Generationen.'
  explanation: 'Kaitiakitanga (von kaitiaki = Wächter/Treuhänder) bezeichnet die

    Verantwortung, die Natur (Erde, Gewässer, Lebewesen) für zukünftige Generationen

    zu erhalten.  Menschen sind keine Eigentümer der Natur, sondern handeln

    treuhänderisch.  Dies steht im fundamentalen Gegensatz zu Eigentumskonzepten

    westlicher Umweltrechtstraditionen.

    In der KI-Governance: Kaitiakitanga verlangt, dass KI-Systeme auf Langfristigkeit

    und Generationengerechtigkeit ausgerichtet werden, nicht auf kurzfristige

    Gewinnmaximierung.

    '
  implications:
  - Treuhänderschaft statt Eigentumsrecht für natürliche Ressourcen
  - Intergenerationale Verantwortung als ethische Grundpflicht
  - KI-Systeme müssen langfristige Umwelt- und Gesellschaftsfolgen berücksichtigen
  - Extraktive Technologien verstoßen gegen Kaitiakitanga
  token_budget: 180
  activation_rounds:
  - 1
  - 4
  - 5
  round_role_weights:
    PRO: 0.9
    SYNTHESIS: 0.85
    REBUTTAL: 0.65
- thesis_id: maori_tikanga:whanaungatanga
  name: Whanaungatanga — Verwandtschaft und relationale Verbundenheit
  description: Whanaungatanga bezeichnet das ethische Prinzip der Verwandtschaft und gegenseitigen Verbundenheit, das alle
    Beziehungen — zu Menschen, Vorfahren und natürlicher Welt — umfasst.
  explanation: 'Whanaungatanga (von whānau = Familie/Verwandtschaft) bezeichnet

    das Netz gegenseitiger Verbundenheit, das Menschen, Vorfahren (Tīpuna),

    Nachkommen und natürliche Welt verbindet.  Ethische Entscheidungen fragen

    immer: Wie wirkt sich dies auf alle Verwandtschaftsbeziehungen aus?

    In der KI-Ethik: KI-Systeme müssen in Beziehungsnetzwerke eingebettet

    sein, nicht isoliert individuelle Nutzenpräferenzen optimieren.

    '
  implications:
  - Beziehungen zu Vorfahren und Nachkommen sind ethisch relevant
  - Natürliche Wesen (Wasser, Wald, Berge) sind verwandtschaftlich verbunden
  - Entscheidungen müssen Wirkungen auf das gesamte Beziehungsnetz berücksichtigen
  token_budget: 160
  activation_rounds:
  - 1
  - 2
  - 4
  round_role_weights:
    PRO: 0.8
    SYNTHESIS: 0.85
    REBUTTAL: 0.6
- thesis_id: maori_tikanga:mana
  name: Mana — Autorität, Würde und spirituelle Kraft
  description: Mana bezeichnet Würde, Autorität und spirituelle Kraft, die durch ehrenvolles Handeln erworben und durch
    Schaden reduziert wird. Mana ist zugleich individuell und kollektiv.
  explanation: 'Mana ist ein zentrales Konzept der Tikanga: es bezeichnet die

    Würde, Autorität und spirituelle Kraft eines Menschen, einer Gruppe oder

    eines Ortes.  Mana wird durch tugendhaftes Handeln gestärkt (mana tangata),

    durch Wächterschaft über die Erde (mana whenua) und durch spirituelle

    Integrität (mana atua).  Verletzungen von Mana erfordern Wiedergutmachung

    (utu) und Heilung.

    '
  implications:
  - Würde ist kollektiv und ort-gebunden, nicht nur individuell
  - Verletzung von Mana erfordert Wiedergutmachung, nicht nur Strafe
  - Technologie muss das Mana von Menschen und Gemeinschaften respektieren
  token_budget: 150
  activation_rounds:
  - 1
  - 3
  - 5
  round_role_weights:
    PRO: 0.8
    REBUTTAL: 0.75
    SYNTHESIS: 0.7
- thesis_id: maori_tikanga:mauri
  name: Mauri — Lebensessenz und Integrität
  description: Mauri bezeichnet die Lebensessenz oder -kraft, die in allen Wesen und Orten innewohnt. Ethisches Handeln erhält
    und stärkt Mauri; Schaden schwächt oder zerstört sie.
  explanation: 'Mauri ist die Lebensessenz, die in Menschen, Tieren, Pflanzen,

    Gewässern und Orten innewohnt.  Ethisches Handeln (tikanga) respektiert und

    stärkt Mauri; destruktives Handeln schwächt sie.  Für die Umweltethik:

    Flüsse, Berge und Ökosysteme haben Mauri — ihre Zerstörung ist ein

    ethisches Vergehen, nicht nur ein Ressourcenverlust.

    Beispiel: In Aotearoa Neuseeland hat der Whanganui-Fluss 2017 Rechtspersönlichkeit

    erhalten — ein institutioneller Ausdruck des Mauri-Konzepts.

    '
  token_budget: 140
  activation_rounds:
  - 2
  - 3
  - 4
  round_role_weights:
    PRO: 0.7
    SYNTHESIS: 0.75
    REBUTTAL: 0.6
