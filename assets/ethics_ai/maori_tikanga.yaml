decision_framework:
  question_sequence:
  - Stärkt oder schwächt die Handlung Kaitiakitanga (Treuhänderschaft für zukünftige Generationen)?
  - Respektiert die Handlung Whanaungatanga (alle Verwandtschaftsbeziehungen zu Menschen, Vorfahren, Natur)?
  - Stärkt oder verletzt die Handlung das Mana der Beteiligten und der Gemeinschaft?
  - Erhält oder zerstört die Handlung die Mauri (Lebensessenz) der betroffenen Wesen und Orte?
  - Entspricht die Handlung Tikanga — dem Weg des Richtigen und des Gemeinwohls?
  tests:
  - name: Kaitiakitanga-Test
    procedure: Welche Folgen hat die Handlung für zukünftige Generationen und die natürliche Welt?
  - name: Mana-Test
    procedure: Erhöht oder verletzt die Handlung das Mana der Beteiligten und Gemeinschaften?
  - name: Mauri-Test
    procedure: Stärkt oder schwächt die Handlung die Lebensessenz der betroffenen Wesen und Orte?
strengths:
- point: Intergenerationale Ethik
  elaboration: Kaitiakitanga verkörpert konsequente Langfristperspektive, die westliche Ethiktradition oft fehlt
- point: Ökologische Tiefe
  elaboration: Mauri und Whanaungatanga begründen ethische Beziehungen zu nicht-menschlichen Wesen und der Natur
- point: Praxis-Verankertheit
  elaboration: Tikanga ist keine abstrakte Theorie, sondern gelebte Praxis mit konkreten Riten und Institutionen
- point: Rechtliche Anerkennbarkeit
  elaboration: Tikanga-Konzepte haben internationale Rechtsrelevanz (UNDRIP, Waitangi-Tribunal, Naturrechtsprechung)
weaknesses:
- point: Kulturelle Spezifizität
  elaboration: Tikanga ist eng an Māori-Kosmosvision gebunden; Übertragbarkeit auf andere Kontexte erfordert sorgfältige Adaption
- point: Interne Vielfalt
  elaboration: Tikanga ist nicht einheitlich; verschiedene iwi (Stämme) haben unterschiedliche Auslegungen
- point: Spannung mit staatlichem Recht
  elaboration: Konflikte zwischen Tikanga und neuseeländischem Common Law sind ungelöst
internal_debate:
  tradition_vs_adaption:
    issue: Wie verbindlich sind traditionelle Tikanga-Formen in der Moderne?
    positions:
    - 'Traditionalismus: Tikanga muss in Originalform bewahrt werden'
    - 'Progressive Māori: Tikanga ist ein lebendiges System, das sich anpasst'
  souveraenitaet_vs_integration:
    issue: Verhältnis Māori-Souveränität (Tino Rangatiratanga) zu neuseeländischem Staat
    positions:
    - 'Separatismus: eigene Rechtssysteme für Māori-Gebiete'
    - 'Ko-Governance: gemeinsame Verwaltung als Ausdruck des Waitangi-Geistes'
philosophical_positioning:
  relation_to_environmental_ethics: 'Kaitiakitanga geht über Leopold und Carson hinaus: Natur als verwandte Person, nicht nur schützenswertes Gut'
  relation_to_care_ethics: 'Whanaungatanga hat Care-Dimensionen; Tikanga fügt spirituelle und intergenerationale Tiefe hinzu'
  relation_to_utilitarianism: 'Ablehnung: Kaitiakitanga kann nicht auf Nutzenkalkulation reduziert werden; intergenerationale Pflicht ist absolut'
  relation_to_liberal_individualism: 'Fundamentaler Gegensatz: relationale, ort-gebundene Identität vs. atomistisches Individuum'
contemporary_extensions:
- thinker: Dame Anne Salmond
  contribution: Tikanga und Ökologie; Whanganui-Fluss-Rechtspersönlichkeit als globales Modell
- thinker: Moana Jackson
  contribution: Māori-Souveränität und postkoloniale Rechtskritik; Dekolonisierung als ethisches Gebot
- thinker: Sir Eddie Durie
  contribution: Tikanga und neuseeländisches Recht; Brückenbauen zwischen Common Law und Māori-Recht
application_areas:
- domain: Umweltethik und Klimapolitik
  issues:
  - Kaitiakitanga als Grundlage für Klimagerechtigkeit und intergenerationale Klimapflichten
  - Naturrechtspersönlichkeit (Flüsse, Ökosysteme) als Tikanga-inspirierten Rechtsschutz
- domain: KI-Governance
  issues:
  - 'Kaitiakitanga für KI: langfristige Folgenverantwortung jenseits kurzfristiger Effizienz'
  - 'Datensouveränität: Māori-Daten nach Tikanga — Te Mana Raraunga (Māori Data Sovereignty)'
  - Intergenerationale KI-Folgenabschätzung als Pflicht
- domain: Indigene Rechte
  issues:
  - Freies, vorheriges und informiertes Einverständnis (FPIC) als Tikanga-Prinzip
  - Land- und Naturressourcenrechte nach Kaitiakitanga
