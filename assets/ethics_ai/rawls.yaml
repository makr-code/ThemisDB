main_theses:
- thesis_id: justice_as_fairness
  name: Justice as Fairness (Rawls)
  description: Principles of justice chosen behind 'veil of ignorance'
  explanation: 'Two principles: (1) Equal basic liberties for all

    (2) Social and economic inequalities arranged for greatest benefit to least advantaged

    Political institutions must be fair to all citizens regardless of position.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: deliberative_democracy
  name: Deliberative Democracy (Habermas)
  description: Legitimate decisions through reasoned public deliberation
  explanation: 'Democratic legitimacy comes from free and equal deliberation among citizens.

    Decisions should be justified through reasons all can accept.

    Public sphere enables rational discourse on common concerns.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: political_obligation
  name: Political Obligation and Legitimacy
  description: When is political authority justified?
  explanation: 'Political power must be exercised in ways that citizens can reasonably accept.

    Governments derive legitimacy from serving public interest and respecting rights.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
secondary_theses:
- Separation of powers prevents tyranny
- Rule of law ensures equal treatment
- Human rights as universal moral claims
- Democratic accountability of leaders
- Transparency in government
- Civic participation as political virtue
- Political compromise and coalition-building
- International justice and global governance
decision_framework:
  primary_test: Public Justification Test
  description: Does policy respect fundamental rights and liberties?
  steps:
  - Identify all affected stakeholders
  - Consider policy from each perspective
  - Develop reasons that respect all viewpoints
  - Ensure policy treats all fairly
  secondary_test: Rights and Liberty Test
  criteria:
  - Protects basic civil and political rights
  - Does not unnecessarily restrict liberty
  - Treats citizens as free and equal
  - Provides fair opportunities
strengths:
- Provides framework for legitimate governance
- Protects individual rights and freedoms
- Promotes fairness and equality
- Enables peaceful resolution of conflicts
- Encourages civic participation
- Holds leaders accountable
- Applicable to domestic and international politics
weaknesses:
- Tension between individual rights and collective good
- Difficulty achieving genuine deliberation at scale
- Risk of majority tyranny
- Challenge of political polarization
- Influence of money and power in politics
- Cultural differences in political values
- Gap between ideal theory and practice
internal_debate:
  liberal_vs_communitarian:
    issue: Should politics prioritize individual rights or community values?
    positions:
    - 'Liberalism: Individual rights and autonomy primary'
    - 'Communitarianism: Community and shared values shape identity'
    - 'Compromise: Balance individual and communal goods'
  procedural_vs_substantive:
    issue: Is democracy primarily about procedures or outcomes?
    positions:
    - 'Proceduralist: Fair process is what matters'
    - 'Substantive: Democracy must deliver just outcomes'
    - 'Both: Fair process tends to produce good outcomes'
  ideal_vs_nonideal:
    issue: Should political theory focus on ideal or realistic conditions?
    positions:
    - 'Ideal theory: Define perfect justice as aspiration'
    - 'Non-ideal theory: Address actual injustices pragmatically'
    - 'Both: Ideal guides action in non-ideal circumstances'
philosophical_positioning:
  relation_to_kantian: Respect for persons as autonomous moral agents
  relation_to_utilitarian: Considers welfare but constrains by rights
  relation_to_social_contract: Legitimacy through hypothetical or actual consent
  relation_to_virtue_ethics: Importance of civic virtues and character
practical_applications:
  policy_making:
    principle: Democratic legitimacy through deliberation
    considerations:
    - Public consultation and hearings
    - Transparent decision-making processes
    - Justification of policies with public reasons
    - Impact assessment on all groups
  electoral_systems:
    principle: Fair representation
    considerations:
    - Equal voting rights
    - Proportional representation vs. majority rule
    - Campaign finance reform
    - Access to political participation
  rights_protection:
    principle: Constitutional safeguards
    considerations:
    - Bill of rights
    - Judicial review
    - Protection of minorities
    - Due process and rule of law
  international_relations:
    principle: Justice beyond borders
    considerations:
    - Human rights in foreign policy
    - Just war theory
    - Global distributive justice
    - International institutions
modern_developments:
  deliberative_democracy:
