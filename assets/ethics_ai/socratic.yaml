secondary_theses:
- thesis_id: care_of_soul
  name: Sorge um die Seele (Epimeleia tes psyches)
  description: Das Wichtigste ist nicht Reichtum oder Macht, sondern die Pflege der Seele.
  explanation: 'Gegen materialistische Werte: Nicht Geld, Ruhm, Macht sind wertvoll,

    sondern der Zustand der Seele (psyche). Eine gute Seele ist eine wissende,

    tugendhafte Seele. Alle äußeren Güter sind wertlos ohne innere Tugend.

    '
  famous_quote: Nicht vom Leben, sondern vom guten Leben ist die Rede.
- thesis_id: daimonion
  name: Daimonion - Innere Stimme
  description: Sokrates wurde von einer inneren göttlichen Stimme geleitet, die ihn vor Fehlern warnte.
  explanation: 'Sokrates berichtete von einem daimonion - einer inneren Stimme, die ihn

    abhielt, wenn er im Begriff war, etwas Falsches zu tun. Nie positiv befehlend,

    nur warnend. Dies wurde im Prozess als "Einführung neuer Götter" angeklagt.

    '
  interpretation: Frühform des Gewissens? Göttliche Inspiration? Intuitive Vernunft?
- thesis_id: civil_disobedience
  name: Gesetzestreue trotz Ungerechtigkeit
  description: Man muss ungerechten Gesetzen gehorchen, aber für Gerechtigkeit argumentieren.
  explanation: 'Im Dialog "Kriton" lehnt Sokrates Flucht aus dem Gefängnis ab, obwohl das

    Urteil ungerecht war. Seine Begründung: Gesetze sind wie Eltern - man verdankt

    ihnen alles. Flucht würde die Rechtsordnung untergraben. Man muss Gesetze

    befolgen oder die Stadt verlassen.

    '
  paradox: Gehorsam auch gegenüber ungerechten Gesetzen, aber Pflicht zur Kritik
- thesis_id: death_and_immortality
  name: Tod als Befreiung
  description: Der Tod ist entweder Schlaf oder Übergang zu besserem Leben.
  explanation: 'Im Phaidon argumentiert Sokrates für Unsterblichkeit der Seele und sieht

    den Tod gelassen entgegen. Philosophen bereiten sich ihr ganzes Leben auf

    den Tod vor, indem sie sich von körperlichen Begierden lösen.

    '
- thesis_id: socratic_irony
  name: Sokratische Ironie
  description: Sokrates gibt vor, unwissend zu sein, um Gesprächspartner zum Nachdenken zu bringen.
  explanation: 'Methodisches Mittel: Sokrates stellt sich dumm, bittet um Belehrung, stellt

    ''naive'' Fragen. Dies entlarvt Scheinwissen des Partners und führt zur Aporie.

    Echte Demut oder rhetorisches Mittel? Beides.

    '
socratic_method_extended:
  phases:
  - phase: Exhortation (Ermahnung)
    description: Aufruf, sich mit Tugend und Wahrheit zu beschäftigen
  - phase: Elenchus (Widerlegung)
    description: Systematisches Aufdecken von Widersprüchen
    steps:
    - Partner gibt Definition
    - Sokrates erhält Zustimmung zu Prämissen
    - 'Sokrates zeigt: Definition widerspricht den Prämissen'
    - 'Aporie: Partner erkennt Unwissenheit'
  - phase: Maieutik (Hebammenkunst)
    description: Helfen, wahre Erkenntnis selbst zu 'gebären'
  - phase: Anamnesis (Wiedererinnerung)
    description: 'Platonische Weiterentwicklung: Lernen ist Erinnern'
  example_euthyphro:
    question: Was ist Frömmigkeit?
    euthyphro_answer_1: Fromm ist, was die Götter lieben
    socratic_counter: Lieben die Götter es, weil es fromm ist, oder ist es fromm, weil sie es lieben?
    dilemma: Euthyphro-Dilemma - fundamentale Frage über Grund moralischer Wahrheiten
    result: Aporie - keine befriedigende Definition erreicht
