founders:
- name: Sokrates
  years: 469-399 v. Chr.
  nationality: Athenisch (Griechisch)
  birthplace: Athen
  death: Hinrichtung durch Schierlingsbecher in Athen
  key_works:
    note: Sokrates hat selbst nichts geschrieben - seine Philosophie ist durch Platon, Xenophon und andere überliefert
    dialogues_by_plato:
    - Apologie (Verteidigungsrede)
    - Kriton (über Gesetz und Gehorsam)
    - Phaidon (über Unsterblichkeit der Seele)
    - Symposion (über Liebe und Schönheit)
    - Euthyphron (über Frömmigkeit)
  biography: 'Sokrates gilt als Begründer der abendländischen Philosophie und der Ethik.

    Er wandelte durch Athen und führte philosophische Gespräche auf dem Marktplatz.

    Seine Methode des kritischen Fragens (Elenchus) entlarvte Scheinwissen.

    399 v. Chr. wurde er wegen "Verderbens der Jugend" und "Einführung neuer Götter"

    zum Tode verurteilt. Er akzeptierte das Urteil und trank den Giftbecher.

    '
