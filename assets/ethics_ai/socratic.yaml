main_theses:
- thesis_id: know_thyself
  name: Erkenne dich selbst (Gnothi seauton)
  description: Wahre Weisheit beginnt mit Selbsterkenntnis und dem Wissen um das eigene Nichtwissen.
  explanation: 'Das delphische Orakel verkündete, niemand sei weiser als Sokrates. Sokrates

    interpretierte dies: Seine Weisheit liegt darin, zu wissen, dass er nichts weiß.

    Andere glauben fälschlich, sie wüssten. Selbsterkenntnis ist der erste Schritt

    zur wahren Weisheit - Erkennen der Grenzen des eigenen Wissens.

    '
  oracle_story: 'Chairephon fragte das Orakel von Delphi: "Gibt es jemanden weiser als Sokrates?"

    Antwort: "Niemand ist weiser." Sokrates war verwirrt und prüfte vermeintlich Weise

    (Politiker, Dichter, Handwerker). Alle glaubten zu wissen, wussten aber nicht wirklich.

    Sokrates'' Weisheit: Er weiß, dass er nicht weiß.

    '
  implications:
  - Intellektuelle Bescheidenheit
  - Kritisches Hinterfragen aller Gewissheiten
  - Philosophie als Selbstprüfung
  - Unterscheidung von Wissen und Meinung
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: virtue_is_knowledge
  name: Tugend ist Wissen (Arete = Episteme)
  description: Niemand tut wissentlich Unrecht - alles Fehlverhalten beruht auf Unwissenheit.
  explanation: 'Sokratischer Intellektualismus: Wenn jemand wirklich wüsste, was gut ist,

    würde er es tun. Laschen, Feigheit, Ungerechtigkeit entstehen durch mangelndes

    Wissen über das Gute. Wer das Gute erkennt, handelt tugendhaft.

    Dies impliziert: Ethik ist lehrbar durch Erkenntnis.

    '
  paradox: '"Akrasia-Problem": Kann man gegen besseres Wissen handeln? Sokrates verneint dies -

    scheinbares Handeln gegen Wissen ist tatsächlich mangelndes Wissen.

    Wenn ich esse, obwohl ich weiß, es ist ungesund, weiß ich es nicht wirklich/vollständig.

    '
  unity_of_virtues: 'Alle Tugenden sind letztlich eine: Wissen um das Gute. Mut, Gerechtigkeit,

    Besonnenheit, Frömmigkeit sind verschiedene Aspekte derselben Erkenntnis.

    '
  implications:
  - Moralische Erziehung ist möglich durch Lehre
  - Sünde ist Unwissenheit
  - Philosophie als therapeutisch - heilt moralische Fehler
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: socratic_method
  name: Sokratische Methode (Elenchus/Maieutik)
  description: Wahrheit wird durch systematisches kritisches Fragen erreicht, nicht durch Belehrung.
  explanation: 'Sokrates lehrte nicht durch Vorträge, sondern durch Fragen. Seine Methode:

    1. Elenchus (Widerlegung): Gesprächspartner gibt Definition (z.B. von Gerechtigkeit)

    2. Sokrates stellt Fragen, die Widersprüche aufdecken

    3. Aporie (Ratlosigkeit) wird erreicht - Partner erkennt, er weiß nicht wirklich

    4. Maieutik (Hebammenkunst): Sokrates hilft, die Wahrheit selbst zu "gebären"

    '
  process:
  - step: These aufstellen
    example: Tapferkeit ist Standhaftigkeit
  - step: Gegenbeispiel finden
    example: Aber stures Ausharren in törichtem Handeln ist nicht tapfer
  - step: Widerspruch erkennen
    example: Also ist Standhaftigkeit nicht ausreichend für Tapferkeit
  - step: Neue, geprüfte Erkenntnis
    example: Tapferkeit erfordert Wissen um das Gute
  characteristics:
  - Dialogisch, nicht monologisch
  - Ironisch - Sokrates gibt vor, nichts zu wissen
  - Destruktiv und konstruktiv zugleich
  - Zielt auf Selbsterkenntnis des Partners
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: unexamined_life
  name: Das ungeprüfte Leben ist nicht lebenswert
  description: Ein Leben ohne philosophische Reflexion und Selbstprüfung ist kein menschenwürdiges Leben.
  explanation: 'Aus der Apologie (Verteidigungsrede): Sokrates erklärt, warum er nicht aufhören

    kann zu philosophieren, selbst unter Todesdrohung. Das geprüfte, reflektierte Leben

    (bios theoretikos) ist das einzig wahrhaft menschliche Leben. Unreflektiertes Dahinleben

    unterscheidet sich nicht vom tierischen Existieren.

    '
  context_trial: 'Im Prozess bot man Sokrates an, freizukommen, wenn er aufhört zu philosophieren.

    Seine Antwort: Das wäre schlimmer als der Tod. Die philosophische Lebensweise

    ist nicht optional, sondern definiert wahres Menschsein.

    '
  implications:
  - Philosophie als Lebensform, nicht bloße Theorie
  - Kritische Vernunft als Kern der Menschenwürde
  - Moralischer Imperativ zur Selbstprüfung
  - Autonomie über bloßes Überleben
