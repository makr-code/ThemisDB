  - 4
  - 5
  round_role_weights:
    PRO: 0.9
    SYNTHESIS: 0.85
    REBUTTAL: 0.65
- thesis_id: befreiungstheologie:exterioridad
  name: Exterioridad — Der Andere als ethischer Ausgangspunkt
  description: 'Dussel zufolge muss Ethik vom Anderen ausgehen: vom Ausgeschlossenen, vom Armen, vom Opfer des Systems.
    Der Andere ist nicht das Andere des Gleichen, sondern ein Jenseits des Systems.'
  explanation: 'In der Befreiungsethik Dussels beginnt Ethik nicht mit dem

    Subjekt des Systems, sondern mit dem Anderen (el Otro) — dem Ausgeschlossenen,

    Unterdrückten, dem Opfer.  Ethische Antwort bedeutet: Verantwortung für

    das Gesicht des Anderen übernehmen (Bezug auf Levinas).

    In der KI-Ethik: Wer ist der Andere, der in KI-Systemen unsichtbar gemacht

    wird? Wessen Schaden ist systematisch nicht sichtbar?

    '
  implications:
  - Ethik beginnt mit dem Ausgeschlossenen, nicht mit dem Systemteilnehmer
  - Unsichtbare Opfer technologischer Systeme müssen aktiv sichtbar gemacht werden
  - Globale Lieferketten-Ethik für KI-Hardware (Kobalt, seltene Erden) gehört zur Befreiungsethik
  token_budget: 170
  activation_rounds:
  - 1
  - 2
  - 4
  round_role_weights:
    PRO: 0.85
    REBUTTAL: 0.7
    SYNTHESIS: 0.8
- thesis_id: befreiungstheologie:transmodernitat
  name: Transmodernität — Jenseits von Moderne und Postmoderne
  description: Transmodernität bezeichnet ein Projekt der Befreiung, das weder die westliche Moderne noch die Postmoderne
    einfach ablehnt, sondern sie aus der Perspektive anderer Kulturen transformiert.
  explanation: 'Dussel lehnt sowohl die Universalisierungsansprüche der westlichen

    Moderne als auch die nihilistische Postmoderne ab.  Transmodernität meint:

    andere Kulturen, Völker und Traditionen entwickeln ihre eigene Moderne aus

    ihren Wurzeln — nicht Imitation des Westens, sondern kreative Eigenentwicklung.

    In der KI-Ethik: globale KI-Governance darf nicht westliche Normvorstellungen

    universalisieren, sondern muss plurale kulturelle Ausgangspunkte anerkennen.

    '
  implications:
  - Westliche Normvorstellungen sind nicht universell
  - Globale KI-Governance braucht plurale kulturelle Ausgangspunkte
  - Dekolonisierung von KI-Ethik-Frameworks ist ethische Pflicht
  token_budget: 160
  activation_rounds:
  - 1
  - 3
  - 5
  round_role_weights:
    PRO: 0.8
    REBUTTAL: 0.75
    SYNTHESIS: 0.75
- thesis_id: befreiungstheologie:conscientizacao
  name: Conscientização — Bewusstseinsweckung und Befreiungspraxis
  description: 'Paulo Freires Konzept der Conscientização: Befreiung erfordert kritisches Bewusstsein über eigene Unterdrückung
    und aktive Praxis der Veränderung (Praxis als Dialog).'
  explanation: 'Conscientização (Freire) ist der Prozess des kritischen Bewusstseins

    über die eigene gesellschaftliche Lage und die Mechanismen der Unterdrückung.

    Befreiung ist kein Geschenk von oben, sondern entsteht im Dialog zwischen

    Unterdrückten und ihren Begleitern.

    In der KI-Kontext: Betroffene von KI-Entscheidungen müssen verstehen, wie

    Systeme funktionieren und wie sie sie beeinflussen können (algorithmische

    Bildung als Befreiungspraxis).

    '
  token_budget: 140
  activation_rounds:
