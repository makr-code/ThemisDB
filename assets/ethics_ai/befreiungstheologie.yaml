decision_framework:
  question_sequence:
  - Wessen Perspektive wird privilegiert — die der Herrschenden oder die der Ausgeschlossenen?
  - Wer ist der Andere, der durch die Handlung oder das System unsichtbar gemacht wird?
  - Stärkt die Handlung Strukturen der Unterdrückung oder trägt sie zur Befreiung bei?
  - Ist die Analyse der Situation von unten (von den Betroffenen) gemacht worden?
  - Verbindet die Handlung Theorie mit konkreter Praxis der Befreiung?
  tests:
  - name: Option-für-Arme-Test
    procedure: Würde eine unterdrückte, marginalisierte Person diese Entscheidung als befreiend erfahren?
  - name: Exterioridad-Test
    procedure: Wessen Gesicht, Leid und Würde wird durch die Handlung ignoriert oder sichtbar gemacht?
  - name: Transmodernitäts-Test
    procedure: Reproduziert die Entscheidung westliche Normvorstellungen oder öffnet sie Raum für plurale Kulturen?
strengths:
- point: Strukturelle Analyse
  elaboration: Verbindet individuelle Ethik mit Kritik gesellschaftlicher Strukturen und Machtverhältnisse
- point: Globale Perspektive
  elaboration: Bezieht Perspektiven des globalen Südens ein, die in westlicher Ethiktradition marginalisiert sind
- point: Praxisorientierung
  elaboration: Ethik ohne Praxis ist Ideologie; Befreiungstheologie verbindet Reflexion mit Handlung
- point: Epistemische Stärke
  elaboration: Standpunkt der Unterdrückten enthüllt Wahrheiten, die aus der Herrschendenperspektive unsichtbar sind
weaknesses:
- point: Ideologieverdacht
  elaboration: Kritiker werfen Befreiungstheologie marxistische Einseitigkeit und politische Instrumentalisierung vor
- point: Kirchlicher Konflikt
  elaboration: Vatikan-Konflikte (Kardinal Ratzinger) haben Befreiungstheologie institutionell geschwächt
- point: Skalierbarkeit der Praxis
  elaboration: Gemeinschaftsbasierte Praxis ist schwer auf staatliche oder globale Governance-Ebene zu übertragen
internal_debate:
  theologie_vs_philosophie:
    issue: Ist Befreiungstheologie primär Theologie oder säkulare Philosophie?
    positions:
    - 'Gutiérrez: theologische Basis ist unverzichtbar — Befreiung ist eschatologisches Projekt'
    - 'Dussel: Befreiungsethik ist säkulare Philosophie mit theologischen Quellen'
  reform_vs_revolution:
    issue: Ist Befreiung durch Reform oder Revolution zu erreichen?
    positions:
    - 'Reformismus: schrittweise Transformation durch Institutionen'
    - 'Radikale Strömung: struktureller Wandel erfordert Systembruch'
philosophical_positioning:
  relation_to_marx: 'Selektive Anlehnung: Sozialanalyse ja; atheistischer Materialismus nein; Eschatologie als Unterschied'
  relation_to_kant: 'Kritik: formaler Universalismus blendet konkrete Unterdrückungserfahrungen aus; Exterioridad als Korrektur'
  relation_to_rawls: 'Kritik: Schleier des Nichtwissens neutralisiert real bestehende Machtasymmetrien; Option für Arme bevorzugt Betroffene'
  relation_to_care_ethics: 'Überschneidung: Fürsorge für Verletzliche; Befreiungstheologie fügt Machtanalyse und Strukturkritik hinzu'
