main_theses:
- thesis_id: befreiungstheologie:option_fuer_arme
  name: Option für die Armen (Opción preferencial por los pobres)
  description: 'Die preferentielle Option für die Armen: ethische Entscheidungen werden aus der Perspektive der Marginalisierten,
    Unterdrückten und Ausgeschlossenen getroffen. Der Standpunkt der Armen ist epistemisch privilegiert.'
  explanation: 'Die Option für die Armen ist kein Mitleids-Prinzip, sondern eine

    epistemische und ethische Privilegierung: die Perspektive der Unterdrückten

    enthüllt die Wahrheit gesellschaftlicher Verhältnisse besser als die Perspektive

    der Herrschenden.  Ethik muss von unten beginnen.

    In der KI-Ethik: Wessen Perspektive wird in Trainingsdaten und Algorithmen

    privilegiert? Globale Süd-Perspektiven müssen aktiv einbezogen werden.

    '
  implications:
  - Ethische Analyse muss strukturelle Ungleichheit und Ausschluss berücksichtigen
  - Stimmen der Marginalisierten sind epistemisch privilegiert
  - KI-Trainingsdaten und Governance-Prozesse müssen globale Süd-Perspektiven einschließen
  - Technologie darf Machtasymmetrien nicht verstärken
  token_budget: 180
  activation_rounds:
