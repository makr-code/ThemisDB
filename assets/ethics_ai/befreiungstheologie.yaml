famous_quotes:
- quote: "El punto de partida de la ética de la liberación es el pobre, el excluido, la víctima. — Der Ausgangspunkt der
    Befreiungsethik ist der Arme, der Ausgeschlossene, das Opfer."
  source: Enrique Dussel, Ética de la Liberación, 1998
  context: Exterioridad als ethischer Grundsatz; Option für die Armen als methodischer Ausgangspunkt
- quote: "La opción preferencial por los pobres es el sello de la teología de la liberación. — Die preferentielle Option
    für die Armen ist das Markenzeichen der Befreiungstheologie."
  source: Gustavo Gutiérrez, A Theology of Liberation, 1971
  context: Option für die Armen als Kernprinzip der Befreiungstheologie
- quote: "No es posible pensar eticamente sin partir de las víctimas. — Es ist nicht möglich, ethisch zu denken, ohne von
    den Opfern auszugehen."
  source: Enrique Dussel
  context: Epistemischer Vorrang der Opfer in der Befreiungsethik
