secondary_theses:
- thesis_id: guter_wille
  name: Der gute Wille
  description: Das einzige uneingeschränkt Gute ist der gute Wille.
  explanation: 'Alle anderen Güter (Talente, Glück, Macht) können zum Schlechten verwendet werden.

    Nur der gute Wille - der Wille, aus Pflicht zu handeln - ist intrinsisch und

    bedingungslos gut. Selbst wenn der gute Wille nichts erreicht, behält er seinen vollen Wert.

    '
  implications:
  - Konsequenzen sind für moralischen Wert sekundär
  - Intentionen und Motive sind zentral
  - Moralischer Wert ist handlungsimmanent, nicht resultatabhängig
- thesis_id: hypothetischer_imperativ
  name: Hypothetische vs. Kategorische Imperative
  description: Hypothetische Imperative sind bedingt, kategorische unbedingt.
  explanation: 'Hypothetische Imperative haben die Form: "Wenn du X willst, dann tu Y."

    Sie gelten nur unter Bedingung eines bestimmten Ziels. Kategorische Imperative

    gelten unbedingt für alle rationalen Wesen, unabhängig von individuellen Zielen.

    '
  examples:
    hypothetical:
    - Wenn du gesund sein willst, treibe Sport
    - Wenn du reich werden willst, investiere klug
    categorical:
    - Lüge nicht
    - Respektiere die Würde anderer
- thesis_id: rigorismus
  name: Moralischer Rigorismus
  description: Moralische Pflichten gelten ausnahmslos.
  explanation: 'Kant vertritt einen strengen moralischen Rigorismus: Moralische Gebote kennen

    keine Ausnahmen. Selbst in Extremfällen bleibt die Pflicht bestehen. Dies führt

    zu kontroversen Positionen (z.B. Lügenverbot auch zum Schutz Unschuldiger).

    '
  controversial_implications:
  - Lügen ist immer falsch, auch um Leben zu retten
  - Versprechen müssen immer gehalten werden
  - Keine Güterabwägung bei moralischen Konflikten
  defenses: 'Kant argumentiert, dass Ausnahmen die Universalität und damit die Rationalität

    der Moral untergraben würden. Neuere Kantianer schlagen differenziertere

    Lösungen vor (z.B. konkretere Maximenspezifikation).

    '
- thesis_id: vernunftreligion
  name: Religion innerhalb der Grenzen der bloßen Vernunft
  description: Moralisches Gesetz führt zu Postulaten der praktischen Vernunft.
  explanation: 'Die Moral selbst erfordert keine religiösen Grundlagen. Jedoch führen

    praktische Anforderungen der Moral zu "Postulaten": Freiheit, Unsterblichkeit

    der Seele, und Existenz Gottes als notwendige Annahmen für die Möglichkeit

    des höchsten Guts.

    '
  postulates:
  - name: Freiheit
    reason: Moralität setzt Freiheit des Willens voraus
  - name: Unsterblichkeit
    reason: Vollkommene Tugend erfordert unendlichen Fortschritt
  - name: Gott
    reason: Übereinstimmung von Tugend und Glückseligkeit erfordert höchstes Wesen
- thesis_id: rechtslehre
  name: Recht und Moral
  description: Äußeres Recht unterscheidet sich von innerer Moral.
  explanation: 'Recht betrifft äußere Handlungen und deren Vereinbarkeit mit der Freiheit anderer.

    Moral betrifft innere Gesinnung und Motive. Das Recht darf äußeren Zwang ausüben,

    die Moral nicht. Beide entspringen jedoch dem kategorischen Imperativ.

    '
  key_principles:
  - 'Allgemeines Rechtsgesetz: Handle so, dass dein Wille mit der Freiheit aller nach einem allgemeinen Gesetz zusammen bestehen
    kann'
  - Recht auf Eigentum basiert auf ursprünglicher Besitznahme
  - Rechtsstaat als Realisierung äußerer Freiheit
- thesis_id: tugendlehre
  name: Tugendlehre
  description: Tugendpflichten sind Pflichten gegen sich selbst und andere.
  explanation: 'Während die Rechtslehre erzwingbare Pflichten behandelt, befasst sich die

    Tugendlehre mit nicht-erzwingbaren ethischen Pflichten. Diese umfassen

    Selbstvervollkommnung und Beförderung fremder Glückseligkeit.

    '
  duties:
    to_self:
    - Erhaltung der eigenen moralischen Integrität
    - Entwicklung der eigenen Talente
    - Vermeidung von Lastern (Lüge, Geiz, Völlerei)
    to_others:
    - Wohltätigkeit (nach Vermögen)
    - Dankbarkeit
    - Teilnehmende Empfindung
decision_framework:
  question_sequence:
  - Was ist die Maxime meiner Handlung?
  - Kann ich wollen, dass diese Maxime ein allgemeines Gesetz werde?
  - Behandle ich alle Betroffenen als Selbstzweck?
  - Handle ich aus Pflicht oder nur pflichtgemäß?
  tests:
  - name: Universalisierungstest
    procedure: Prüfe, ob die Maxime widerspruchsfrei universalisiert werden kann
  - name: Selbstzwecktest
    procedure: Prüfe, ob die Handlung die Menschheit als bloßes Mittel behandelt
  - name: Autonomietest
    procedure: Prüfe, ob die Handlung die Autonomie respektiert
strengths:
- point: Klare, rationale Prinzipien
  elaboration: Bietet eindeutige Orientierung durch universelle Gesetze
- point: Schutz der Menschenwürde
  elaboration: Absolutes Verbot der Instrumentalisierung von Personen
- point: Unabhängig von Konsequenzen
  elaboration: Moralität hängt nicht von unvorhersehbaren Folgen ab
- point: Respekt vor Autonomie
  elaboration: Zentrale Stellung der Selbstbestimmung
- point: Egalitarismus
  elaboration: Alle rationalen Wesen haben gleiche Würde
weaknesses:
- point: Übermäßiger Rigorismus
  elaboration: Keine Ausnahmen selbst in Extremfällen erscheint unrealistisch
- point: Konflikte zwischen Pflichten
  elaboration: Keine klare Methode zur Auflösung von Pflichtenkollisionen
- point: Vernachlässigung von Emotionen
  elaboration: Mitgefühl und Fürsorge werden als moralisch irrelevant behandelt
- point: Abstraktheit
  elaboration: Schwierig, auf konkrete Situationen anzuwenden
- point: Maximenspezifikation unklar
  elaboration: Auf welcher Ebene ist die Handlungsmaxime zu formulieren?
