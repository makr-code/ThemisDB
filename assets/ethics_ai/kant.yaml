main_theses:
- thesis_id: kategorischer_imperativ
  name: Kategorischer Imperativ
  description: Handle nur nach derjenigen Maxime, durch die du zugleich wollen kannst, dass sie ein allgemeines Gesetz werde.
  explanation: 'Der kategorische Imperativ ist der oberste Grundsatz der Moral. Er verlangt, dass

    Handlungsmaximen universalisierbar sein müssen. Eine Handlung ist nur dann moralisch,

    wenn ihre zugrunde liegende Maxime ohne Widerspruch als allgemeines Gesetz gelten könnte.

    '
  formulations:
  - name: Allgemeines Gesetz Formel
    text: Handle nur nach derjenigen Maxime, durch die du zugleich wollen kannst, dass sie ein allgemeines Gesetz werde.
    explanation: Prüft die Universalisierbarkeit von Handlungsgrundsätzen
  - name: Naturgesetz Formel
    text: Handle so, als ob die Maxime deiner Handlung durch deinen Willen zum allgemeinen Naturgesetze werden sollte.
    explanation: Stellt sich vor, die Maxime würde naturgesetzlich gelten
  - name: Selbstzweckformel
    text: Handle so, dass du die Menschheit sowohl in deiner Person, als in der Person eines jeden anderen jederzeit zugleich
      als Zweck, niemals bloß als Mittel brauchst.
    explanation: Verbietet Instrumentalisierung von Personen
  - name: Autonomie Formel
    text: Handle so, dass dein Wille durch seine Maxime sich selbst zugleich als allgemein gesetzgebend betrachten könne.
    explanation: Betont die Selbstgesetzgebung rationaler Wesen
  - name: Reich der Zwecke Formel
    text: Handle so, als ob du durch deine Maxime jederzeit ein gesetzgebendes Glied im allgemeinen Reich der Zwecke wärst.
    explanation: Ideal einer Gemeinschaft rationaler Wesen
  practical_application: 'Beispiel Lügen: Kann ich wollen, dass jeder lügt, wenn es vorteilhaft ist?

    Nein - denn wenn alle lügen würden, würde das Konzept der Wahrhaftigkeit

    zusammenbrechen und damit auch die Möglichkeit zu lügen.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: selbstzweck
  name: Menschen als Selbstzweck
  description: Menschen haben intrinsischen Wert und dürfen niemals bloß als Mittel behandelt werden.
  explanation: 'Jeder Mensch besitzt Würde (nicht bloß Preis) kraft seiner Rationalität und Autonomie.

    Dies begründet ein absolutes Verbot, Menschen bloß als Werkzeug für andere Zwecke zu benutzen.

    Menschen dürfen nur unter Bedingungen als Mittel behandelt werden, denen sie rational

    zustimmen könnten.

    '
  implications:
  - Verbot von Sklaverei und Ausbeutung
  - Recht auf informierte Zustimmung
  - Achtung der Autonomie anderer
  - Verbot manipulativer Praktiken
  examples:
    positive: Einem Arbeitnehmer faire Löhne zahlen respektiert seine Würde
    negative: Jemanden ohne sein Wissen für Experimente nutzen verletzt seine Würde
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: autonomie_wuerde
  name: Autonomie und Würde
  description: Die Würde des Menschen liegt in seiner Fähigkeit zur autonomen Selbstgesetzgebung.
  explanation: 'Moralische Subjekte sind rationale Wesen, die sich selbst Gesetze geben können.

    Diese Autonomie - die Fähigkeit, nach selbstgegebenen vernünftigen Gesetzen zu handeln -

    ist die Quelle aller Würde und allen moralischen Werts.

    '
  components:
  - aspect: Positive Freiheit
    description: Fähigkeit zur Selbstbestimmung nach Vernunftprinzipien
  - aspect: Würde (Dignitas)
    description: Unbedingter, unvergleichlicher Wert rationaler Wesen
  - aspect: Selbstgesetzgebung
    description: Das moralische Gesetz entspringt der eigenen Vernunft
  relation_to_heteronomy: 'Heteronomie (Fremdgesetzgebung) - etwa durch Neigung, Autorität oder Konsequenzen -

    untergräbt moralischen Wert. Wahre Moralität erfordert Handeln aus Achtung

    vor dem selbstgegebenen Gesetz.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: pflicht_neigung
  name: Pflicht über Neigung
  description: Der moralische Wert einer Handlung liegt in der Pflicht, nicht in Neigungen oder Konsequenzen.
  explanation: 'Eine Handlung hat nur dann moralischen Wert, wenn sie aus Pflicht geschieht -

    d.h. aus Achtung vor dem moralischen Gesetz. Handlungen aus Neigung (Wunsch, Sympathie)

    oder zur Erlangung bestimmter Zwecke haben keinen genuinen moralischen Wert,

    selbst wenn sie pflichtgemäß sind.

    '
  distinctions:
  - case: Aus Pflicht
    description: Handlung wird vollzogen, weil sie moralisch geboten ist
    moral_worth: Hoch
    example: Jemandem helfen, weil es richtig ist, auch wenn man keine Sympathie empfindet
  - case: Pflichtgemäß aus Neigung
    description: Handlung entspricht der Pflicht, wird aber aus Neigung vollzogen
    moral_worth: Keinen (obwohl lobenswert)
    example: Jemandem helfen, weil man Mitgefühl empfindet
  - case: Pflichtwidrig
    description: Handlung verstößt gegen moralisches Gesetz
    moral_worth: Negativ
    example: Lügen aus Eigeninteresse
  controversies: 'Kritiker argumentieren, dass diese Sicht Emotionen und Mitgefühl unzulässig abwertet.

    Kant entgegnet, dass Neigungen unzuverlässig sind und nur die Pflicht universelle

    moralische Orientierung bietet.

    '
  token_budget: 180
  activation_rounds:
