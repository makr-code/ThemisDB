  source: Kritik der praktischen Vernunft
  context: Grundformel des kategorischen Imperativs
- quote: 'Zwei Dinge erfüllen das Gemüt mit immer neuer und zunehmender Bewunderung und Ehrfurcht: der bestirnte Himmel über
