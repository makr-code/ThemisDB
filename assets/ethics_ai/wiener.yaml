    significance: Legal enforcement of digital rights
  explainable_ai:
    description: Technical methods for AI transparency and interpretability
    significance: Making AI decisions understandable
  tech_ethics_boards:
    description: Companies and institutions establishing ethics oversight
    significance: Institutional embedding of ethics in tech development
critiques:
  technological_solutionism: Over-reliance on technology to solve social problems
  surveillance_capitalism: Business models based on behavioral data extraction
  digital_colonialism: Technology imposing Western values globally
  ethics_washing: Superficial ethics talk without meaningful change
  power_asymmetries: Technology concentrating power in few hands
