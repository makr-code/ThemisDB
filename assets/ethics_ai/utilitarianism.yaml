major_criticisms:
- criticism: Repugnant Conclusion (Parfit)
  description: 'Eine Welt mit riesiger Population bei niedrigem aber positivem Wohlergehen

    wäre besser als kleinere Population mit hohem Wohlergehen.

    '
  response: 'Verschiedene Antworten: Durchschnitts- statt Total-Utilitarismus,

    Zurückweisung der Repugnanz, Komplexere Aggregationsfunktionen.

    '
- criticism: Organ-Harvesting-Beispiel
  description: 'Utilitarismus könnte rechtfertigen, einen Gesunden zu töten, um fünf Organbedürftige zu retten.

    '
  response: 'Regel-Utilitarismus, indirekte Effekte (Angst in Gesellschaft), langfristige Konsequenzen,

    Vertrauensschaden im Gesundheitssystem überwiegt Nutzen.

    '
- criticism: Demandingness Objection
  description: Utilitarismus fordert zu viel - permanente Selbstaufopferung
  response: 'Differenz zwischen ideal und satisfaktionistisch, Skalierbarkeit von Pflichten,

    Zwei-Ebenen-Utilitarismus erlaubt pragmatische Kompromisse.

    '
