secondary_theses:
- thesis_id: mill_quality
  name: Qualitätsunterschiede der Lust (Mill)
  description: Manche Lustformen sind qualitativ höherwertig als andere.
  explanation: 'Mill modifizierte Benthams rein quantitativen Hedonismus: "Es ist besser,

    ein unzufriedener Sokrates zu sein als ein zufriedenes Schwein." Geistige

    Freuden sind höherwertiger als körperliche. Diese Unterscheidung wird durch

    kompetente Richter bestimmt.

    '
  famous_quote: Es ist besser, ein unzufriedener Mensch zu sein als ein zufriedenes Schwein; besser ein unzufriedener Sokrates
    als ein zufriedener Narr.
  competent_judge_criterion: 'Wer beide Arten von Vergnügen erfahren hat, präferiert höhere Freuden.

    Diese kompetenten Richter definieren Qualitätshierarchie.

    '
  problems:
  - Wie misst man Qualität objektiv?
  - Ist dies noch wahrer Utilitarismus oder versteckte Tugendethik?
  - Was, wenn kompetente Richter sich nicht einig sind?
- thesis_id: rule_utilitarianism
  name: Regel-Utilitarismus
  description: Regeln, deren allgemeine Befolgung den Nutzen maximiert, sollten befolgt werden.
  explanation: 'Eine Antwort auf Kritiken am Handlungs-Utilitarismus: Statt einzelne Handlungen

    zu beurteilen, prüft man, welche Regeln bei allgemeiner Akzeptanz den Nutzen

    maximieren würden. Diese Regeln sind dann zu befolgen, auch wenn Einzelverletzungen

    höheren Nutzen brächten.

    '
  advantages:
  - Berücksichtigt indirekte Effekte und Präzedenzwirkung
  - Mehr Übereinstimmung mit moralischer Intuition
  - Praktikabel - erfordert nicht permanente Nützlichkeitsberechnung
  criticism: 'Wenn Regelbefolgung wirklich schlechteren Nutzen bringt, scheint sie

    utilitaristisch irrational. Kollaps in Handlungs-Utilitarismus?

    '
- thesis_id: preference_utilitarianism
  name: Präferenz-Utilitarismus
  description: Nicht Lust/Leid, sondern Präferenzerfüllung ist das Gute.
  explanation: 'Moderne Variante (Hare, Singer): Das Gute ist nicht hedonistisch definiert,

    sondern als Erfüllung von Präferenzen. Dies vermeidet Probleme der Lustmessung

    und respektiert verschiedene Konzeptionen des guten Lebens.

    '
  advantages:
  - Pluralistischer - verschiedene Werte möglich
  - Respektiert Autonomie
  - Weniger paternalistisch
  problems:
  - Was ist mit irrationalen Präferenzen?
  - Zählen nur informierte Präferenzen?
  - Wie aggregiert man verschiedene Präferenzen?
- thesis_id: act_utilitarianism
  name: Handlungs-Utilitarismus
  description: Jede einzelne Handlung ist direkt durch ihren Nutzen zu beurteilen.
  explanation: 'Die ursprüngliche Form: In jeder Situation soll man die Handlung wählen,

    die den größten Nettonutzen erzeugt. Keine vermittelnden Regeln, direkte

    Konsequenzenbewertung.

    '
  strengths:
  - Theoretisch einfach und direkt
  - Flexibel für komplexe Situationen
  - Keine arbiträren Regeln
  weaknesses:
  - Kann zu kontraintuitiven Urteilen führen
  - Epistemisch überfordernd
  - Ignoriert Fairness und Rechte
- thesis_id: negative_utilitarianism
  name: Negativer Utilitarismus
  description: Priorität hat die Minimierung von Leid über Maximierung von Lust.
  explanation: 'Eine radikale Variante (Popper, Smart): Leidminimierung ist wichtiger als

    Lustmaximierung. Extremform: Einziges Ziel ist Leidvermeidung.

    '
  motivation: Leid wiegt moralisch schwerer als Lust - asymmetrische Bewertung
  extreme_implication: Könnte Antinatalism oder sogar Aussterben der Menschheit empfehlen
- thesis_id: two_level_utilitarianism
  name: Zwei-Ebenen-Utilitarismus (Hare)
  description: Intuitive und kritische Ebenen moralischen Denkens.
  explanation: 'R.M. Hare unterscheidet:

    - Intuitive Ebene: Alltägliche Moralregeln für schnelle Entscheidungen

    - Kritische Ebene: Utilitaristische Berechnung zur Reflexion und Ausnahmen

    Dies vereint Praktikabilität mit theoretischer Konsistenz.

    '
decision_framework:
  steps:
  - Identifiziere alle verfügbaren Handlungsoptionen
  - Bestimme alle von jeder Option Betroffenen
  - Schätze die erwarteten Konsequenzen für jede Option
  - Bewerte den Nutzen/Schaden für jede betroffene Person
  - Aggregiere den Gesamtnutzen jeder Option
  - Wähle die Option mit maximalem Nettonutzen
  considerations:
  - Langfristige vs. kurzfristige Konsequenzen
  - Direkte vs. indirekte Effekte
  - Unsicherheit und Risiko
  - Präzedenzwirkung
  - Kosten der Entscheidungsfindung selbst
strengths:
- point: Intuitiv plausibel
  elaboration: Konsequenzen scheinen moralisch relevant - gute Ergebnisse sind wichtig
- point: Demokratisch und egalitär
  elaboration: Alle zählen gleich, keine privilegierten Perspektiven
- point: Pragmatisch anwendbar
  elaboration: Bietet klare Grundlage für Politik und Recht
- point: Flexibel
  elaboration: Kann neue Situationen und Informationen berücksichtigen
- point: Fokus auf Leiden
  elaboration: Nimmt reales Leid ernst, motiviert zu Hilfeleistung
weaknesses:
- point: Schwierigkeit der Nutzenmessung
  elaboration: Interpersonelle Nutzenvergleiche sind problematisch
- point: Demandingness Problem
  elaboration: Fordert möglicherweise extreme Opfer
- point: Verletzung von Rechten
  elaboration: Kann Minderheitenrechte für Mehrheitswohl opfern
- point: Unvorhersehbarkeit
  elaboration: Können wir Konsequenzen wirklich gut genug einschätzen?
- point: Ignoriert Fairness
  elaboration: Verteilung des Nutzens ist irrelevant, nur Gesamtsumme zählt
- point: Vernachlässigt persönliche Beziehungen
  elaboration: Strikte Impartialität scheint Freundschaft, Familie zu untergraben
contemporary_extensions:
- thinker: Peter Singer
  contribution: 'Präferenz-Utilitarismus, angewandte Ethik (Tierrechte, globale Armut, Euthanasie).

    Fordert radikale Wohltätigkeit: Wohlhabende sollten bis zur Grenze der Vergleichbarkeit

    mit eigenen Opfern spenden.

    '
- thinker: Derek Parfit
  contribution: 'Analyse von Identität und Personhood, "Repugnant Conclusion", Konvergenz

    verschiedener ethischer Theorien.

    '
- thinker: R.M. Hare
  contribution: 'Universelle Präskriptivismus, Zwei-Ebenen-Theorie, Versöhnung von Utilitarismus

    mit moralischer Intuition.

    '
- thinker: J.J.C. Smart
  contribution: Verteidigung des Handlungs-Utilitarismus, Kritik an Regel-Utilitarismus
