main_theses:
- thesis_id: greatest_happiness
  name: Prinzip des größten Glücks (Greatest Happiness Principle)
  description: Eine Handlung ist richtig, wenn sie das größte Glück für die größte Zahl produziert.
  explanation: 'Das zentrale Prinzip: Die moralische Qualität einer Handlung bemisst sich

    ausschließlich an ihren Konsequenzen für das Wohlergehen (Glück, Lust, Nutzen)

    aller Betroffenen. Die richtige Handlung maximiert den Gesamtnutzen.

    '
  formulations:
    bentham: Das größte Glück der größten Zahl ist das Maß für richtig und falsch.
    mill: Handlungen sind richtig im Maße, wie sie das Glück fördern, falsch, wie sie das Gegenteil von Glück hervorbringen.
  key_components:
  - 'Konsequentialismus: Nur Folgen zählen'
  - 'Aggregation: Nutzen aller wird summiert'
  - 'Maximierung: Streben nach größtmöglichem Gesamtnutzen'
  - 'Impartialität: Jeder zählt als einer, niemand als mehr'
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: consequentialism
  name: Konsequentialismus
  description: Die Moralität einer Handlung wird ausschließlich durch ihre Folgen bestimmt.
  explanation: 'Intentionen, Motive, Handlungstypen sind moralisch irrelevant. Allein die

    tatsächlichen oder erwartbaren Konsequenzen für das Wohlergehen bestimmen,

    ob eine Handlung richtig ist. Es gibt keine intrinsisch guten oder schlechten Handlungen.

    '
  implications:
  - Lügen kann richtig sein, wenn es bessere Konsequenzen hat
  - Regelbruch ist gerechtfertigt bei besserem Resultat
  - Keine absoluten moralischen Verbote
  - Fokus auf vorausschauende Beurteilung
  practical_consideration: 'Da wir Konsequenzen nicht perfekt vorhersehen können, nutzen Utilitaristen

    oft "erwartbaren Nutzen" - gewichtete Wahrscheinlichkeiten verschiedener Ausgänge.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: hedonistic_calculus
  name: Hedonistisches Kalkül (Bentham)
  description: Lust und Leid sind messbar und vergleichbar; ethische Entscheidungen erfordern Kalkulation.
  explanation: 'Bentham entwickelte ein "hedonistisches Kalkül" zur Messung von Lust und Leid.

    Sieben Dimensionen: Intensität, Dauer, Gewissheit, Nähe, Fruchtbarkeit,

    Reinheit, Ausmaß. Durch diese Parameter lässt sich der Nutzen quantifizieren.

    '
  felicific_calculus_dimensions:
  - dimension: Intensität
    question: Wie stark ist die Lust/Leid?
  - dimension: Dauer
    question: Wie lange dauert sie?
  - dimension: Gewissheit
    question: Wie wahrscheinlich tritt sie ein?
  - dimension: Nähe
    question: Wie bald tritt sie ein?
  - dimension: Fruchtbarkeit
    question: Führt sie zu weiterer Lust?
  - dimension: Reinheit
    question: Ist sie frei von Leidbeimischung?
  - dimension: Ausmaß
    question: Wie viele Personen sind betroffen?
  criticism: Quantitative Messung von Lust erscheint oft unpraktikabel oder inadäquat
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: impartiality
  name: Unparteilichkeit und Gleichheit
  description: Jeder zählt als einer und niemand als mehr als einer.
  explanation: 'Das Wohlergehen jeder Person hat gleiches Gewicht. Es gibt keine moralisch

    privilegierte Perspektive. Mein eigenes Wohlergehen zählt nicht mehr als das

    eines Fremden. Dies führt zu radikalem moralischen Egalitarismus.

    '
  implications:
  - Keine Sonderpflichten gegenüber Nahen
  - Kosmopolitische Verpflichtungen
  - Radikale Forderungen der Wohltätigkeit (Singer)
  - Keine Diskriminierung nach Rasse, Geschlecht, etc.
  controversial_aspects: 'Diese strikte Impartialität kollidiert mit intuitions über besondere

    Verpflichtungen gegenüber Familie, Freunden, Mitbürgern.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
