school_id: adam_smith
name: Business Ethics (Adam Smith)
name_de: Wirtschaftsethik (Adam Smith)
taxonomy_class: consequentialist
tags:
- adam_smith
- oekonomiethik
- unsichtbare_hand
- eigeninteresse
- marktwirtschaft
- moralische_gefuehle
applicable_domains:
- economic_ethics
- social_justice
- technology
convergence_compatible:
- utilitarianism
activation_conditions:
- condition: dilemma.tags enthält market ODER self_interest ODER economic
  effect: boost_weight
regulatory_constraints:
  override_permitted: true
  applicable_regulations: []
  note: Marktethische Überlegungen
domain_overrides:
  economic_ethics:
    weight_boost: 0.3
    note: 'Originäre Domäne: Marktethik und Wohlstandsverteilung'
founders:
- name: Adam Smith
  years: 1723-1790
  nationality: Scottish
  birthplace: Kirkcaldy, Scotland
  key_works:
  - title: The Theory of Moral Sentiments
    year: 1759
    significance: Foundation of ethical economic theory, moral sympathy
  - title: The Wealth of Nations
    year: 1776
    significance: Economic foundation with moral constraints
  biography: Scottish philosopher and economist, founder of modern economics with strong ethical foundations
- name: R. Edward Freeman
  years: 1951-present
  nationality: American
  key_works:
  - title: 'Strategic Management: A Stakeholder Approach'
    year: 1984
    significance: Introduced stakeholder theory
  biography: Pioneer of stakeholder theory, challenging pure shareholder primacy
- name: Amartya Sen
  years: 1933-present
  nationality: Indian
  key_works:
  - title: Development as Freedom
    year: 1999
    significance: Capabilities approach to economic development
  biography: Nobel Prize economist, developed capability approach to welfare economics
historical_context:
  period: 20th-21st Century
  philosophical_movement: Applied Ethics, Business Studies
  zeitgeist: Corporate responsibility, sustainability, stakeholder capitalism
  influences:
  - source: Utilitarianism
    thinkers:
    - Mill
    - Bentham
    impact: Greatest good principle in business decisions
  - source: Kantian Ethics
    thinkers:
    - Kant
    impact: Duty-based approach to corporate responsibility
  - source: Social Contract Theory
    thinkers:
    - Rawls
    impact: Justice in economic distribution
  reactions_against:
  - Pure profit maximization
  - Shareholder primacy doctrine
  - Exploitation of stakeholders
  - Environmental degradation for profit
main_theses:
- thesis_id: stakeholder_theory
  name: Stakeholder Theory
  description: Businesses have responsibilities to all stakeholders, not just shareholders
  explanation: "Companies should balance the interests of employees, customers, suppliers, \ncommunities, and shareholders.\
    \ Long-term value creation requires considering \nall stakeholder groups.\n"
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: corporate_social_responsibility
  name: Corporate Social Responsibility (CSR)
  description: Businesses have obligations beyond legal compliance to contribute to societal welfare
  explanation: "Companies should voluntarily integrate social and environmental concerns \ninto their operations and stakeholder\
    \ interactions.\n"
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: sustainable_capitalism
  name: Sustainable Capitalism
  description: Economic activity must be ecologically and socially sustainable
  explanation: 'Business models must account for environmental limits and social equity,

    ensuring long-term viability for society and planet.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
secondary_theses:
- Fair competition and market ethics
- Transparency and accountability in corporate governance
- Ethical leadership and organizational culture
- Fair wages and labor rights
- Responsible supply chain management
- Consumer protection and product safety
- Anti-corruption and integrity
- Corporate philanthropy and community engagement
decision_framework:
  primary_test: Stakeholder Impact Analysis
  description: Ensure decision is economically, socially, and environmentally sustainable
  steps:
  - Identify all affected stakeholders
  - Assess benefits and harms for each group
  - Balance competing interests fairly
  - Choose action that optimizes overall stakeholder welfare
  secondary_test: Sustainability Test
  criteria:
  - Long-term economic viability
  - Social equity and justice
  - Environmental responsibility
  - Intergenerational fairness
strengths:
- Practical applicability to business decisions
- Balances multiple legitimate interests
- Promotes long-term thinking
- Addresses modern corporate challenges
- Compatible with market economy
- Measurable through ESG metrics
- Increasingly adopted by corporations globally
weaknesses:
- Potential conflicts between stakeholder interests
- Difficulty in measuring and balancing trade-offs
- May reduce short-term profitability
- Challenges in enforcement and accountability
- Risk of 'greenwashing' and performative ethics
- Tension with fiduciary duties to shareholders
- Cultural and regulatory variations across countries
internal_debate:
  shareholder_vs_stakeholder:
    issue: 'Primary corporate purpose: shareholder value or stakeholder welfare?'
    positions:
    - 'Shareholder primacy (Friedman): Only responsibility is profit maximization'
    - 'Stakeholder theory (Freeman): Balance all stakeholder interests'
    - 'Enlightened shareholder value: Long-term shareholder value through stakeholder consideration'
  voluntary_vs_mandatory:
    issue: Should CSR be voluntary or legally mandated?
    positions:
    - 'Voluntary CSR: Market-driven, flexible, innovation-friendly'
    - 'Mandatory CSR: Ensures compliance, level playing field, prevents free-riding'
  profit_vs_purpose:
    issue: Can companies serve both profit and social purpose?
    positions:
    - 'Shared value: Social good and profit are complementary'
    - 'Trade-off model: Sometimes profit must be sacrificed for ethics'
philosophical_positioning:
  relation_to_utilitarianism: Adopts consequentialist analysis but extends beyond utility to include rights and justice
  relation_to_kantian: Incorporates duty-based obligations to stakeholders and respect for persons
  relation_to_virtue_ethics: Emphasizes character of business leaders and organizational culture
  relation_to_rawlsian: Applies justice principles to economic institutions and distributions
practical_applications:
  hiring_decisions:
    principle: Fair employment practices
    considerations:
    - Equal opportunity and non-discrimination
    - Fair compensation and benefits
    - Work-life balance
    - Career development opportunities
  supply_chain:
    principle: Responsible sourcing
    considerations:
    - Labor standards in supplier countries
    - Environmental impact of suppliers
    - Fair trade practices
    - Transparency and traceability
  product_development:
    principle: Safe and ethical products
    considerations:
    - Consumer safety and health
    - Environmental impact
    - Privacy and data protection
    - Accessibility and inclusivity
  financial_reporting:
    principle: Transparency and honesty
    considerations:
    - Accurate financial statements
    - Non-financial reporting (ESG)
    - Stakeholder communication
    - Regulatory compliance
modern_developments:
  esg_investing:
    description: Environmental, Social, Governance criteria in investment decisions
    significance: Mainstream integration of ethics into finance
  b_corporations:
    description: Benefit corporations legally committed to stakeholder value
    significance: Legal framework for purpose-driven businesses
  conscious_capitalism:
    description: Movement promoting higher purpose and stakeholder orientation
    significance: Cultural shift in business mindset
  circular_economy:
    description: Business models eliminating waste through循 closed-loop systems
    significance: Sustainability integrated into business model
critiques:
  marxist_critique: CSR as tool to legitimize capitalism and obscure exploitation
  greenwashing_concern: Gap between ethical rhetoric and actual practice
  measurement_challenge: Difficulty in quantifying and comparing stakeholder impacts
  regulatory_capture: Risk of industry self-regulation being ineffective
key_literature:
- author: Freeman, R.E.
  title: 'Strategic Management: A Stakeholder Approach'
  year: 1984
