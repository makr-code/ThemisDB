founders:
- name: René Descartes
  years: 1596-1650
  nationality: Französisch
  birthplace: La Haye en Touraine, Frankreich
  key_works:
  - title: Meditationes de prima philosophia (Meditationen über die Erste Philosophie)
    year: 1641
    significance: Methodischer Zweifel, Cogito ergo sum, Gottesbeweis
  - title: Discours de la méthode (Abhandlung über die Methode)
    year: 1637
    significance: Vier Regeln der Methode, Grundlegung wissenschaftlicher Methodik
  - title: Principia philosophiae (Prinzipien der Philosophie)
    year: 1644
    significance: Systematische Darstellung der cartesischen Philosophie
  biography: 'Descartes gilt als Begründer des modernen Rationalismus und der analytischen Geometrie.

    Sein methodischer Zweifel und das "Cogito ergo sum" revolutionierten die Philosophie.

    Er verband mathematische Präzision mit philosophischer Spekulation.

    '
- name: Baruch de Spinoza
  years: 1632-1677
  nationality: Niederländisch
  key_works:
  - title: Ethica ordine geometrico demonstrata
    year: 1677
    significance: Systematische Ethik nach geometrischer Methode
  biography: 'Spinoza entwickelte einen monistischen Rationalismus: Eine Substanz (Deus sive Natura).

    Sein System folgt der geometrischen Methode mit Axiomen, Definitionen und Beweisen.

    '
- name: Gottfried Wilhelm Leibniz
  years: 1646-1716
  nationality: Deutsch
  key_works:
  - title: Monadologie
    year: 1714
    significance: Metaphysik der Monaden, prästabilierte Harmonie
  - title: Nouveaux essais sur l'entendement humain
    year: 1765
    significance: Kritik an Lockes Empirismus, Verteidigung angeborener Ideen
  biography: 'Leibniz war Universalgelehrter: Mathematiker, Philosoph, Logiker.

    Er entwickelte unabhängig von Newton die Infinitesimalrechnung und eine

    rationalistische Metaphysik basierend auf Monaden und prästabilierter Harmonie.

    '
