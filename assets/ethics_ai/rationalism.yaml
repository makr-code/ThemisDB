main_theses:
- thesis_id: cogito_ergo_sum
  name: Cogito ergo sum - Ich denke, also bin ich
  description: Das denkende Selbst ist die erste unbezweifelbare Gewissheit.
  explanation: 'Descartes'' methodischer Zweifel führt zum Cogito: Selbst wenn ich an allem zweifle,

    kann ich nicht daran zweifeln, dass ich zweifle/denke. Das denkende Ich ist

    unmittelbar gewiss und bildet das Fundament aller weiteren Erkenntnis.

    '
  method: '1. Universeller methodischer Zweifel (Sinne täuschen, Traum vs. Wachen, böser Geist)

    2. Das Zweifelnd-Denkende selbst ist unbezweifelbar

    3. Sum res cogitans - Ich bin ein denkendes Ding

    '
  significance: Fundament der neuzeitlichen Subjektphilosophie, Gewissheit ohne externe Autorität
  implications:
  - Subjekt als Ausgangspunkt der Erkenntnis
  - Selbstbewusstsein als unmittelbare Evidenz
  - Primat des Geistes über Körper
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: innate_ideas
  name: Angeborene Ideen (Ideae innatae)
  description: Der Geist besitzt von Geburt an bestimmte Ideen unabhängig von Erfahrung.
  explanation: 'Gegen empiristische Tabula-rasa-Theorie: Einige Ideen (Gott, Mathematik, Logik)

    sind angeboren. Sie stammen nicht aus Sinneserfahrung, sondern sind dem Verstand

    eingepflanzt. Dies ermöglicht apriorische Erkenntnis.

    '
  types_of_innate_ideas:
  - type: Idee Gottes
    description: Perfektes, unendliches Wesen - kann nicht aus Erfahrung stammen
  - type: Mathematische Ideen
    description: Geometrische Wahrheiten, Zahlen - universell und notwendig
  - type: Logische Prinzipien
    description: Satz vom Widerspruch, Identitätsprinzip
  argument: 'Objektivität und Notwendigkeit mathematischer Wahrheiten lässt sich nicht aus

    kontingenter Erfahrung erklären. Diese Wahrheiten müssen im Verstand angelegt sein.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: clear_distinct_ideas
  name: Klare und deutliche Ideen als Wahrheitskriterium
  description: Ideen, die klar und deutlich erfasst werden, sind wahr.
  explanation: 'Descartes'' epistemologisches Kriterium: Was ich klar und deutlich erkenne,

    ist wahr. "Klar" = gegenwärtig und offenkundig; "deutlich" = präzise abgegrenzt

    von anderen. Dies ist durch die Garantie eines nicht-täuschenden Gottes gesichert.

    '
  examples:
    clear_and_distinct:
    - Mathematische Wahrheiten (2+2=4)
    - Logische Gesetze
    - Cogito ergo sum
    not_clear_distinct:
    - Sinneswahrnehmungen (können täuschen)
    - Vorurteile und konfuse Ideen
  problem_circular: 'Zirkulärproblem (Cartesischer Zirkel): Gott garantiert klare und deutliche Ideen,

    aber Gottesbeweis basiert auf klaren und deutlichen Ideen. Kritiker sehen

    hier einen Zirkelschluss.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
- thesis_id: substance_dualism
  name: Substanzdualismus (Res cogitans vs. Res extensa)
  description: Geist und Materie sind zwei grundlegend verschiedene Substanzen.
  explanation: 'Ontologischer Dualismus: Res cogitans (denkendes Ding, Geist) und res extensa

    (ausgedehntes Ding, Körper) sind wesensverschieden. Geist ist unausgedehnt,

    denkend, unteilbar. Materie ist ausgedehnt, nicht-denkend, teilbar.

    '
  attributes:
    res_cogitans:
    - Denken, Wollen, Fühlen
    - Keine räumliche Ausdehnung
    - Unteilbar, einfach
    - Unmittelbar zugänglich
    res_extensa:
    - Räumliche Ausdehnung
    - Mechanische Gesetze
    - Teilbar, zusammengesetzt
    - Mathematisch beschreibbar
  interaction_problem: 'Mind-Body-Problem: Wie interagieren zwei wesensverschiedene Substanzen?

    Descartes'' Lösung (Zirbeldrüse) ist unbefriedigend. Dies wurde zum

    zentralen Problem nachfolgender Philosophie.

    '
  token_budget: 180
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 1.0
    REBUTTAL: 0.9
    SURREBUTTAL: 0.8
    SYNTHESIS: 0.4
    META_VERDICT: 0.2
secondary_theses:
- thesis_id: method_doubt
  name: Methodischer Zweifel
  description: Systematisches Anzweifeln aller Überzeugungen, um sichere Grundlagen zu finden.
  explanation: 'Descartes beginnt mit radikalem Zweifel: An Sinneswahrnehmungen (können täuschen),

    an Unterscheidung Traum/Wachen, sogar an mathematischen Wahrheiten (böser Geist

    könnte täuschen). Ziel ist nicht Skeptizismus, sondern absolute Gewissheit.

    '
  stages:
  - Zweifel an Sinneswahrnehmungen
  - Traumargument
  - Täuschender Gott / böser Dämon
  result: Nur das Cogito übersteht den Zweifel
- thesis_id: god_proofs
  name: Gottesbeweise
  description: Rationale Beweise der Existenz Gottes aus klaren und deutlichen Ideen.
  explanation: 'Descartes bietet mehrere Gottesbeweise:

    1. Kausalbeweis: Idee des unendlichen Gottes muss unendliche Ursache haben

    2. Ontologischer Beweis: Gottes Wesen schließt Existenz ein (wie Dreieck drei Winkel hat)

    Gott garantiert Wahrheit klarer und deutlicher Ideen - er ist kein Betrüger.

    '
  function: Gott als epistemologische Garantie - verbindet Metaphysik und Erkenntnistheorie
- thesis_id: mechanical_universe
  name: Mechanisches Weltbild
  description: Materielle Welt funktioniert nach mechanischen Gesetzen ohne Zweckursachen.
  explanation: 'Physik ist Geometrie in Bewegung. Keine Qualitäten, nur Quantitäten.

    Tiere sind Automaten (Tier-Maschinen). Nur Menschen haben Geist/Seele.

    Dies legt Grundstein für moderne mechanistische Naturwissenschaft.

    '
- thesis_id: four_rules_method
  name: Vier Regeln der Methode
  description: Methodische Prinzipien für sichere Erkenntnis.
  rules:
  - rule: Evidenz
    description: Akzeptiere nur, was klar und deutlich ist
  - rule: Analyse
    description: Teile Probleme in kleinste Teile
  - rule: Synthese
    description: Vom Einfachen zum Komplexen fortschreiten
  - rule: Enumeration
    description: Vollständige Überprüfung, nichts auslassen
  application: Nicht nur Philosophie, sondern alle Wissenschaften
- thesis_id: pineal_gland
  name: Zirbeldrüse als Sitz der Seele
  description: Interaktion zwischen Geist und Körper erfolgt in der Zirbeldrüse.
  explanation: 'Descartes'' Lösung des Interaktionsproblems: Zirbeldrüse (glandula pinealis)

    ist Schnittstelle zwischen Geist und Körper. Lebensgeister (esprits animaux)

    vermitteln. Heute als physiologisch unhaltbar angesehen, aber zeigt das

    grundsätzliche Problem des Dualismus.

    '
