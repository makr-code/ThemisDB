main_theses:
- thesis_id: ubuntu_ethik:umuntu_ngumuntu
  name: Umuntu ngumuntu ngabantu — Ich bin, weil wir sind
  description: 'Das Kernprinzip: Der Mensch ist Mensch durch andere Menschen. Individualität konstituiert sich durch Gemeinschaft,
    nicht umgekehrt. Menschlichkeit ist grundlegend relational.'
  explanation: '"Umuntu ngumuntu ngabantu" (Zulu/Nguni): Ich bin, weil wir sind.

    Das Selbst ist kein atomistisches Individuum, sondern wird im Netz gegenseitiger

    Anerkennungsverhältnisse konstituiert.  Ethisches Handeln heißt: Gemeinschaft

    stärken, Verletzlichkeit anderer erkennen, Würde durch Verbundenheit schützen.

    In der KI-Ethik: Systeme, die gemeinschaftliche Bindungen schwächen oder

    Isolation fördern, handeln gegen das Ubuntu-Prinzip.

    '
  implications:
  - Identität ist inhärent relational, nicht solipsistisch
  - Gemeinschaftswohl hat Vorrang vor individuellem Vorteil
  - KI-Systeme müssen Gemeinschaftsbindungen stärken, nicht auflösen
  - Würde entsteht durch gegenseitige Anerkennung, nicht durch Rechtsansprüche allein
  token_budget: 180
  activation_rounds:
  - 1
  - 4
  - 5
  round_role_weights:
    PRO: 0.9
    SYNTHESIS: 0.85
    REBUTTAL: 0.6
- thesis_id: ubuntu_ethik:ubuntu_menschlichkeit
  name: Ubuntu — Menschlichkeit durch Mitgefühl und Gemeinschaft
  description: Ubuntu bezeichnet die Tugend der Menschlichkeit in ihrer gemeinschaftlichen Dimension — Mitgefühl, Großzügigkeit,
    Verbundenheit. Eine Person mit Ubuntu ist warmherzig, fürsorglich und respektvoll.
  explanation: 'Ubuntu ist keine abstrakte Pflicht, sondern gelebte Tugend.

    Tugendhafte Handlung heißt: achtsam für die Bedürfnisse der Gemeinschaft sein,

    teilen, vergeben, Heilung ermöglichen.  Der Wahrheits- und Versöhnungsprozess

    Südafrikas ist das wichtigste politische Beispiel.  In der KI-Governance:

    algorithmische Systeme müssen das Gemeinwohl, nicht nur individuelle Präferenzen,

    optimieren.

    '
  implications:
  - Fürsorge und Mitgefühl als Tugenden mit gemeinschaftlicher Basis
  - Vergebung als aktiver Prozess kollektiver Heilung
  - Teilen als ethische Verpflichtung, nicht bloße Großzügigkeit
  token_budget: 160
  activation_rounds:
  - 1
  - 2
  - 4
  round_role_weights:
    PRO: 0.85
    SYNTHESIS: 0.9
    REBUTTAL: 0.6
- thesis_id: ubuntu_ethik:kollektive_verantwortung
  name: Kollektive Verantwortung und gemeinsames Schicksal
  description: Entscheidungen betreffen nicht nur das Individuum, sondern die gesamte Gemeinschaft. Verantwortung ist gemeinschaftlich
    getragen.
  explanation: 'In Ubuntu-Gemeinschaften sind Entscheidungen kollektive Angelegenheiten:

    ältere Mitglieder, Betroffene und zukünftige Generationen werden einbezogen.

    Dies entspricht dem Indaba-Konsulationsprozess im südlichen Afrika.

    In der KI-Governance: Entscheidungen über KI-Systeme müssen alle

    Betroffenen einschließen, nicht nur die Nutzerinnen.

    '
  implications:
  - Entscheidungsprozesse müssen gemeinschaftlich und inklusiv sein
  - Schaden für einen Einzelnen betrifft die gesamte Gemeinschaft
  - Intergenerationelle Verantwortung ist explizit
  token_budget: 150
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 0.8
    REBUTTAL: 0.7
    SYNTHESIS: 0.75
- thesis_id: ubuntu_ethik:wuerde_durch_verbundenheit
  name: Würde durch Verbundenheit
  description: Menschenwürde ist nicht abstrakt-individuell, sondern wird durch gemeinschaftliche Anerkennung konstituiert
    und geschützt.
  explanation: 'Während westliche Rechtstraditionen Würde als unveräußerliches Individualrecht

    fassen, versteht Ubuntu Würde als gemeinschaftlich konstituiert: ich erfahre

    Würde, weil andere mich als Mensch anerkennen.  Verlust von Würde entsteht

    durch Ausgrenzung, Verachtung und Isolation.  KI-Systeme, die soziale

    Ausgrenzung verstärken, verletzen Ubuntu-Würde.

    '
  token_budget: 140
  activation_rounds:
  - 1
  - 3
  - 5
  round_role_weights:
    PRO: 0.75
    SYNTHESIS: 0.8
    REBUTTAL: 0.6
