decision_framework:
  question_sequence:
  - Stärkt oder schwächt die Handlung die Gemeinschaft und gegenseitige Verbundenheit?
  - Schützt die Handlung die Würde aller Betroffenen durch gemeinschaftliche Anerkennung?
  - Sind alle betroffenen Stimmen im Entscheidungsprozess einbezogen (Indaba)?
  - Entspringt die Handlung Mitgefühl und Großzügigkeit (Ubuntu) oder Eigeninteresse?
  tests:
  - name: Umuntu-Test
    procedure: Würde die gesamte Gemeinschaft diese Handlung als menschlich anerkennen?
  - name: Verbundenheits-Test
    procedure: Stärkt oder schwächt die Handlung die sozialen Bindungen?
  - name: Würde-Test
    procedure: Wird die Würde aller Betroffenen durch Anerkennung geschützt?
strengths:
- point: Relationalität
  elaboration: Berücksichtigt soziale Einbettung und gegenseitige Abhängigkeit als Grundlage von Identität und Ethik
- point: Inklusivität
  elaboration: Kollektive Entscheidungsprozesse schließen marginalisierte Stimmen ein
- point: Versöhnungspotenzial
  elaboration: Ubuntu-Ethik hat sich in der Praxis als Grundlage für Konfliktlösung und Wiederaufbau bewährt (Südafrika)
- point: Intergenerationale Perspektive
  elaboration: Zukünftige Generationen sind explizit Teil der ethischen Gemeinschaft
weaknesses:
- point: Spannungsfeld mit Individualrechten
  elaboration: Kollektive Entscheidungen können individuelle Rechte und Minderheitenperspektiven übergehen
- point: Skalierbarkeit
  elaboration: Ubuntu-Konsultationsprozesse sind für kleine Gemeinschaften konzipiert; Skalierung auf Nationalstaaten oder globale Systeme ist komplex
- point: Traditionelle Hierarchien
  elaboration: In manchen Ubuntu-Praktiken sind Älteste-Hierarchien und Geschlechterdynamiken problematisch
internal_debate:
  kollektiv_vs_individuum:
    issue: Wie verhält sich Ubuntu zu individuellen Rechten und persönlicher Autonomie?
    positions:
    - 'Ubuntu-Traditionalismus: Gemeinschaft vor Individuum; Rechte sind relational'
    - 'Neo-Ubuntu: Synthese aus Gemeinschaft und Individualrechten; Ubuntu stärkt,
      schränkt nicht ein'
  kulturell_vs_universal:
    issue: Ist Ubuntu ein kulturspezifisches oder universell anwendbares Prinzip?
    positions:
    - 'Partikularismus: Ubuntu ist afrikanisches Kulturerbe; Universalisierung ist Aneignung'
    - 'Universalismus (Tutu): Ubuntu beschreibt menschliche Grundverfassung, die kulturübergreifend gilt'
philosophical_positioning:
  relation_to_kant: Ablehnung atomistischer Subjektivität; Würde durch Verbundenheit statt apriorische Autonomie
  relation_to_utilitarianism: Teilt Gemeinwohl-Fokus; lehnt Aggregation ab — Gemeinschaft ist nicht die Summe von Individuen
  relation_to_virtue_ethics: 'Nähe zu Aristoteles (soziales Wesen); aber Ubuntu ist explizit gemeinschaftskonstituierend'
  relation_to_care_ethics: 'Starke Überschneidung: Beziehungssorge und gegenseitige Verantwortung; Ubuntu fügt kollektive Dimension hinzu'
  relation_to_liberal_individualism: 'Fundamentaler Gegensatz: Gemeinschaftsidentität vs. vorsozialer Individualismus'
