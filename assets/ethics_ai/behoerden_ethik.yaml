  - Datensouveränität staatlicher Systeme
famous_quotes:
- quote: Die vollziehende Gewalt und die Rechtsprechung sind an Gesetz und Recht gebunden.
  source: Grundgesetz Art. 20 Abs. 3
  context: Grundprinzip der Verwaltungsbindung im deutschen Rechtsstaat
- quote: Der Verwaltungsakt ist eine Verfügung, Entscheidung oder andere hoheitliche Maßnahme, die eine Behörde zur Regelung
    eines Einzelfalls auf dem Gebiet des öffentlichen Rechts trifft.
  source: § 35 VwVfG
  context: Legaldefinition — Grundlage der Begründungspflicht
- quote: Jeder hat das Recht auf Auskunft und auf Einsicht in das ihn betreffende automatisierte Profiling.
  source: DSGVO Art. 22
  context: Recht auf menschliche Überprüfung automatisierter Entscheidungen
