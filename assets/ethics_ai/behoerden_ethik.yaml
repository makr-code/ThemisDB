main_theses:
- thesis_id: behoerden_ethik:rechtsstaatlichkeit
  name: Rechtsstaatlichkeit und Gesetzesbindung
  description: Behördliches Handeln ist ausschließlich an Recht und Gesetz gebunden. Kein Ermessen ohne gesetzliche Grundlage.
  explanation: 'Das Rechtsstaatsprinzip (Art. 20 Abs. 3 GG) verpflichtet alle Behörden,

    nur auf Basis gesetzlicher Ermächtigung tätig zu werden. Für KI-Systeme

    bedeutet dies: Automatisierte Entscheidungen in Verwaltungsverfahren

    bedürfen einer expliziten Rechtsgrundlage (§ 35a VwVfG).

    '
  implications:
  - Kein automatisierter Verwaltungsakt ohne gesetzliche Ermächtigung
  - Begründungspflicht für alle Verwaltungsentscheidungen
  - Rechtsbehelfe gegen algorithmische Entscheidungen müssen möglich sein
  token_budget: 180
  activation_rounds:
  - 1
  - 4
  - 5
  round_role_weights:
    PRO: 0.95
    SYNTHESIS: 0.85
    REBUTTAL: 0.7
- thesis_id: behoerden_ethik:gleichbehandlung
  name: Gleichbehandlungsgebot
  description: Gleiche Sachverhalte sind gleich, ungleiche Sachverhalte sind entsprechend ungleich zu behandeln (Art. 3 GG).
  explanation: 'Das Diskriminierungsverbot und der allgemeine Gleichheitssatz verpflichten

    Behörden zur konsistenten Entscheidungspraxis. KI-Systeme dürfen keine

    geschützten Merkmale (Rasse, Geschlecht, Herkunft) als Entscheidungsbasis

    verwenden, auch nicht indirekt über Proxy-Variablen.

    '
  implications:
  - Algorithmen müssen auf Bias gegen geschützte Gruppen geprüft werden
  - Einheitliche Anwendung identischer Kriterien bei identischen Fällen
  - Mittelbare Diskriminierung durch Proxy-Variablen ist verboten
  token_budget: 170
  activation_rounds:
  - 1
  - 2
  - 3
  round_role_weights:
    PRO: 0.9
    REBUTTAL: 0.8
    SYNTHESIS: 0.75
- thesis_id: behoerden_ethik:verhaeltnismaessigkeit
  name: Verhältnismäßigkeitsprinzip
  description: Behördliche Maßnahmen müssen geeignet, erforderlich und angemessen sein. Kein überschießendes Handeln.
  explanation: 'Das Verhältnismäßigkeitsprinzip (Art. 20 Abs. 3 GG i.V.m. Grundrechten)

    verlangt dreistufige Prüfung: Geeignetheit (taugt das Mittel zum Zweck?),

    Erforderlichkeit (ist es das mildeste Mittel?), Angemessenheit (steht Eingriff

    im Verhältnis zum Ziel?). Bei KI-Systemen: Datensparsamkeit als Ausdruck

    der Erforderlichkeit; Transparenz als Ausdruck der Angemessenheit.

    '
  token_budget: 160
  activation_rounds:
  - 1
  - 2
  - 4
  round_role_weights:
    PRO: 0.85
    REBUTTAL: 0.75
    SYNTHESIS: 0.8
- thesis_id: behoerden_ethik:transparenz_erklaerbarkeit
  name: Transparenz und Erklärbarkeit algorithmischer Entscheidungen
  description: Bürger haben Anspruch auf nachvollziehbare Begründung behördlicher Entscheidungen. Algorithmische Black Boxes
    verstoßen gegen Begründungspflicht.
  explanation: 'Nach § 39 VwVfG müssen schriftliche Verwaltungsakte begründet werden.

    Dies gilt auch für KI-unterstützte Entscheidungen: der Algorithmus selbst

    ist keine ausreichende Begründung. Die Begründung muss die wesentlichen

    Gesichtspunkte enthalten, von denen die Behörde ausgegangen ist.

    '
  token_budget: 150
  activation_rounds:
  - 2
  - 3
  - 4
  - 5
  round_role_weights:
    PRO: 0.8
    REBUTTAL: 0.85
    SYNTHESIS: 0.7
- thesis_id: behoerden_ethik:menschliche_letztverantwortung
  name: Menschliche Letztverantwortung
  description: Finale Entscheidungsverantwortung verbleibt beim Menschen. KI kann vorbereiten und unterstützen, aber nicht
    final entscheiden.
  explanation: 'Vollautomatisierte Verwaltungsakte (§ 35a VwVfG) sind nur ausnahmsweise

    zulässig. Bei Ermessensentscheidungen und Grundrechtseingriffen ist

    menschliche Prüfung und Verantwortungsübernahme zwingend erforderlich.

    Der EU AI Act stuft viele Behördenanwendungen als Hochrisiko-KI ein

    und schreibt menschliche Überwachung vor.

    '
  token_budget: 190
  activation_rounds:
  - 1
  - 4
  - 5
  round_role_weights:
    PRO: 0.9
    SYNTHESIS: 0.9
    REBUTTAL: 0.65
