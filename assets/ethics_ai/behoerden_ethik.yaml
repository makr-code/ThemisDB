decision_framework:
  question_sequence:
  - Liegt eine gesetzliche Ermächtigungsgrundlage vor?
  - Ist die Maßnahme verhältnismäßig (geeignet, erforderlich, angemessen)?
  - Werden alle Betroffenen gleich behandelt?
  - Ist die Entscheidung transparent begründbar?
  - Trägt ein Mensch die finale Verantwortung?
  tests:
  - name: Rechtsgrundlagen-Check
    procedure: Prüfe Ermächtigungsgrundlage im einschlägigen Fachgesetz und VwVfG
  - name: Verhältnismäßigkeitsprüfung
    procedure: 'Dreistufige Prüfung: Geeignetheit → Erforderlichkeit → Angemessenheit'
  - name: Diskriminierungsfolgenabschätzung
    procedure: Prüfe mittelbare und unmittelbare Diskriminierung gemäß AGG und Art. 3 GG
strengths:
- point: Rechtssicherheit
  elaboration: Klare gesetzliche Bindung bietet berechenbare, angreifbare Entscheidungen
- point: Gleichbehandlung
  elaboration: Systematische Gleichbehandlung schützt vor Willkür und Korruption
- point: Demokratische Legitimation
  elaboration: Gesetzgebungsprozess verleiht Verwaltungshandeln demokratische Legitimation
- point: Rechtsschutz
  elaboration: Betroffene können Entscheidungen vor Gerichten anfechten
weaknesses:
- point: Bürokratismus
  elaboration: Strikte Gesetzesbindung kann Flexibilität und schnelle Anpassung bremsen
- point: Ermessensspielräume
  elaboration: Algorithmen können Ermessen nicht vollständig abbilden; menschliche Nachprüfung erforderlich
- point: Technologische Lücken
  elaboration: Bestehendes Verwaltungsrecht war nicht für KI-Entscheidungen konzipiert; Lücken entstehen
internal_debate:
  automatisierung_vs_kontrolle:
    issue: Wie weit darf Verwaltungshandeln automatisiert werden?
    positions:
    - 'Effizienz: Vollautomatisierung bei massengeschäftsähnlichen Vorgängen'
    - 'Rechtsschutz: Menschliche Prüfung bei jedem Grundrechtseingriff'
    - 'Kompromiss: § 35a VwVfG als Rechtsrahmen'
  transparenz_vs_datenschutz:
    issue: Offenlegung von KI-Algorithmen vs. Betriebs- und Datenschutzgeheimnis
    positions:
    - 'Transparenz: Öffentliche Algorithmen für öffentliche Gewalt'
    - 'Schutz: Missbrauch durch Offenlegung ermöglicht'
philosophical_positioning:
  relation_to_kant: 'Gesetzesbindung = kategorialer Imperativ der Verwaltung: handle stets nach universalisierbaren Vorschriften'
  relation_to_rawls: Öffentliche Rechtfertigung aller Entscheidungen entspricht Rawlsianischer Transparenz
  relation_to_utilitarianism: Opportunitätsprinzip als begrenzter Utilitarismus im Ermessen; Gesetzesbindung schlägt Nützlichkeit
  relation_to_care_ethics: Bürgerorientierung integriert Sorge-Perspektive; Gleichbehandlung setzt Grenze
