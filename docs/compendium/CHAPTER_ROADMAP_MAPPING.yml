# docs/compendium/CHAPTER_ROADMAP_MAPPING.yml
#
# Canonical mapping between compendium chapters and ThemisDB v2.4.0-alpha
# roadmap/future-enhancement topics.
#
# Used by: scripts/compendium-drift-scan.py
#          .github/workflows/maintenance-compendium-sync.yml
#
# Schema per chapter entry:
#   file:           Path relative to docs/compendium/docs/
#   title:          Human-readable chapter title
#   chapter_number: Display number used in mkdocs-nav (e.g. "16a", "16b")
#                   — used to clarify cases where multiple files share the same
#                     numeric prefix (e.g. chapter_16_ml.md = 16a,
#                     chapter_16_sharding.md = 16b). See INTEGRATION_MAPPING.md.
#   target_version: Version the chapter should reflect
#   roadmap_topics: Keywords from ROADMAP.md that indicate this chapter is relevant
#   sot_paths:      Root SOT files most relevant to this chapter
#   priority:       high | medium | low
#   notes:          Free text for maintainers
#
# Naming note: appendix_literatur.md uses correct German spelling
# (Literatur = literature) and matches the actual filename on disk.
#
# Duplicate-number chapters (e.g. chapter_16_ml.md / chapter_16_sharding.md):
# The compendium intentionally reuses chapter numbers with topic suffixes for
# closely related sub-topics. These are addressed in mkdocs-nav.yml as "16a / 16b"
# entries. See docs/compendium/docs/INTEGRATION_MAPPING.md §Konsolidierte
# Kapitelzuordnung for the canonical a/b assignments.
#
# gap_topics section:
#   Top-level list of roadmap/FUTURE_ENHANCEMENTS topics not yet covered by any
#   existing chapter. The drift scan uses this list to emit new-chapter proposals
#   in the report. Add entries here as new roadmap areas emerge.

