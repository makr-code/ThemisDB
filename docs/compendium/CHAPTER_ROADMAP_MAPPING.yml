# ---------------------------------------------------------------------------
# Gap Topics — Roadmap areas not yet covered by any compendium chapter
# ---------------------------------------------------------------------------
# The drift scan will check each entry's `sot_paths` for `keywords`, and when
# they appear, will emit a "new chapter proposed" item in the report.
#
# Format per entry:
#   topic:       Short descriptive name for the gap
#   keywords:    Terms to look for in the SOT files
#   sot_paths:   SOT files most likely to describe this topic
#   priority:    high | medium | low
#   rationale:   Why a dedicated chapter is warranted
#   suggested_file:  Proposed filename (maintainer can rename before creating)

gap_topics:
  - topic: "Voice & Streaming Interface"
    keywords: [voice, speech, audio, stream, voice session, anti-spoof, liveness]
    sot_paths: [ROADMAP.md, src/voice/ROADMAP.md, FUTURE_ENHANCEMENTS.md]
    priority: high
    rationale: >
      Voice module is Wave-A complete (40 tests, all PASS); a dedicated chapter
      would cover the real-time voice ingestion pipeline, session lifecycle,
      fail-closed behavior, and adversarial hardening — topics not covered by
      chapter_11_realtime.md or chapter_38_observability_sre.md.
    suggested_file: "chapter_43_voice_streaming.md"

  - topic: "Plugin Architecture & Private Plugin SDK"
    keywords: [plugin, SDK, private plugin, plugin boundary, plugin-boundary, edition plugin]
    sot_paths: [ROADMAP.md, FUTURE_ENHANCEMENTS.md]
    priority: high
    rationale: >
      The private plugin externalization program is now a first-class roadmap item
      (Wave C policy gates complete). There is no standalone chapter explaining the
      public plugin SDK, plugin boundary governance, or how community vs. enterprise
      plugins are structured.
    suggested_file: "chapter_44_plugin_sdk.md"

  - topic: "Federated Learning & AI Governance"
    keywords: [federated learning, federated, CAI safety, AI safety, responsible AI wave]
    sot_paths: [ROADMAP.md, src/ai/ROADMAP.md, FUTURE_ENHANCEMENTS.md]
    priority: medium
    rationale: >
      Wave C AI safety (CAI / federated learning / graph phase gate) is complete.
      The existing chapter_24_ai_ethics.md covers ethics at a high level but not
      the concrete federated learning architecture or AI governance hooks.
    suggested_file: "chapter_45_federated_ai.md"

  - topic: "WASM Kernel Sandbox"
    keywords: [WASM, WebAssembly, sandbox, kernel sandbox, wasm kernel]
    sot_paths: [ROADMAP.md, src/gpu/ROADMAP.md, FUTURE_ENHANCEMENTS.md]
    priority: medium
    rationale: >
      WASMKernelSandbox is listed as complete in the source-validated roadmap.
      No existing chapter covers the WASM execution sandbox for user-defined
      kernels, its security boundary, or its integration with the GPU acceleration
      path.
    suggested_file: "chapter_46_wasm_sandbox.md"

  - topic: "Multi-Tenancy & Isolation"
    keywords: [multi-tenant, tenant isolation, namespace isolation, tenant, quota]
    sot_paths: [ROADMAP.md, FUTURE_ENHANCEMENTS.md, src/llm/ROADMAP.md]
    priority: medium
    rationale: >
      Multi-tenant isolation is explicitly mentioned as remaining work in the LLM
      module roadmap and appears in the FUTURE_ENHANCEMENTS. There is no dedicated
      chapter for multi-tenancy patterns, namespace isolation, or per-tenant quota
      enforcement.
    suggested_file: "chapter_47_multitenancy.md"

  - topic: "Change Data Capture & CDC Integration"
    keywords: [CDC, change data capture, change stream, event sourcing, WAL replication]
    sot_paths: [FUTURE_ENHANCEMENTS.md, src/FUTURE_ENHANCEMENTS.md]
