site_name: ThemisDB - Das vollständige Handbuch
site_description: Umfassendes Kompendium für ThemisDB v2.4.0 - Von Grundlagen bis Mastery
site_url: https://makr-code.github.io/ThemisDB/compendium/
repo_name: makr-code/ThemisDB
repo_url: https://github.com/makr-code/ThemisDB
edit_uri: ''
docs_dir: .
site_dir: site

theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Zu dunklem Modus wechseln
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Zu hellem Modus wechseln
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/book-open-page-variant

plugins:
  - search:
      lang: de
  - with-pdf:
      output_path: pdf/ThemisDB-Kompendium-v2.4.0.pdf
      cover_title: "ThemisDB"
      cover_subtitle: "Das vollständige Handbuch - Version 2.4.0 GA"
      author: "ThemisDB Team"
      toc_title: "Inhaltsverzeichnis"
      heading_shift: false
      toc_level: 3
      two_columns_level: 3
      enabled_if_env: ENABLE_PDF_EXPORT
      # PDF Optimization: reduce file size by hiding decorative elements
      custom_template_path: .
      # Note: styles_pdf_optimization.scss will be automatically picked up

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/makr-code/ThemisDB
    - icon: fontawesome/solid/book
      link: https://makr-code.github.io/ThemisDB/

