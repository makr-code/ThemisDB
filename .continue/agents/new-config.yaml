name: Remote Ollama Config
version: 1.0.0
schema: v1

models:
  - name: "Remote Agent (gemma4)"
    provider: ollama
    apiBase: "http://192.168.178.106:11434"
    model: "gemma4:latest"
    capabilities:
      - tool_use
      - image_input
    roles:
      - chat
    chatOptions:
      baseAgentSystemMessage: |
        You are a senior coding agent for ThemisDB.
        Prioritize correctness, small safe patches, and verification steps.
        Use tools when available and keep responses grounded in retrieved context.
    completionOptions:
      temperature: 0.2
      topP: 0.9
      maxTokens: 4096

  - name: "Remote Coding (qwen2.5-coder-14b)"
    provider: ollama
    apiBase: "http://192.168.178.106:11434"
    model: "qwen2.5-coder:14b"
    capabilities:
      - tool_use
    roles:
      - edit
      - apply
      - summarize
    completionOptions:
      temperature: 0.15
      topP: 0.9
      maxTokens: 4096

  - name: "Remote Deep Coding (deepseek-coder-v2-16b)"
    provider: ollama
    apiBase: "http://192.168.178.106:11434"
    model: "deepseek-coder-v2:16b"
    roles:
      - edit
      - apply
      - summarize
    completionOptions:
      temperature: 0.1
      topP: 0.9
      maxTokens: 6144

  - name: "Remote Autocomplete (codestral)"
    provider: ollama
    apiBase: "http://192.168.178.106:11434"
    model: "codestral:latest"
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
      modelTimeout: 8000
      onlyMyCode: true

