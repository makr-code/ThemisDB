version: '3.8'

services:
  themis-benchmark:
    image: themisdb/themisdb:latest
    container_name: themis-benchmark
    ports:
      - "8765:8765"
      - "9090:9090"  # Metrics
    volumes:
      - ./data:/data
      - ./config/config.json:/etc/themis/config.json:ro
    environment:
      - THEMIS_LOG_LEVEL=info
      - THEMIS_ENABLE_METRICS=true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8765/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - benchmark-net
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G

networks:
  benchmark-net:
    driver: bridge
