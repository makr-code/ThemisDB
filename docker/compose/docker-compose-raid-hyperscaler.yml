version: "3.8"

# ThemisDB RAID Benchmark Suite - Hyperscaler Edition
# Multi-container setup for comprehensive RAID testing
# Supports RAID0, RAID1, RAID5, RAID6, RAID10 configurations

services:
  # Primary RAID Controller
  themis-raid-controller:
    image: themisdb:1.4.0-hyperscaler
    container_name: themis-raid-controller
    hostname: raid-controller
    restart: unless-stopped
    ports:
      - "8080:8080"     # HTTP REST API
      - "18765:18765"   # Wire Protocol
      - "4318:4318"     # Prometheus metrics
      - "9091:9091"     # Benchmark metrics
    volumes:
      - raid_controller_data:/var/lib/themisdb
      - ./config/raid-controller.json:/etc/themis/config.json:ro
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "raid_controller"
      THEMIS_EDITION: "HYPERSCALER"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
      THEMIS_LOG_LEVEL: "info"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "4318"
    networks:
      - themis-raid-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # RAID Node 1
  themis-raid-node-1:
    image: themisdb:1.4.0-hyperscaler
    container_name: themis-raid-node-1
    hostname: raid-node-1
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "18766:18765"
    volumes:
      - raid_node_1_data:/var/lib/themisdb
      - ./config/raid-node.json:/etc/themis/config.json:ro
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "raid_node"
      THEMIS_NODE_ID: "1"
      THEMIS_CONTROLLER: "raid-controller:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    networks:
      - themis-raid-network
    depends_on:
      themis-raid-controller:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # RAID Node 2
  themis-raid-node-2:
    image: themisdb:1.4.0-hyperscaler
    container_name: themis-raid-node-2
    hostname: raid-node-2
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "18767:18765"
    volumes:
      - raid_node_2_data:/var/lib/themisdb
      - ./config/raid-node.json:/etc/themis/config.json:ro
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "raid_node"
      THEMIS_NODE_ID: "2"
      THEMIS_CONTROLLER: "raid-controller:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    networks:
      - themis-raid-network
    depends_on:
      themis-raid-controller:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # RAID Node 3
  themis-raid-node-3:
    image: themisdb:1.4.0-hyperscaler
    container_name: themis-raid-node-3
    hostname: raid-node-3
    restart: unless-stopped
    ports:
      - "8083:8080"
      - "18768:18765"
    volumes:
      - raid_node_3_data:/var/lib/themisdb
      - ./config/raid-node.json:/etc/themis/config.json:ro
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "raid_node"
      THEMIS_NODE_ID: "3"
      THEMIS_CONTROLLER: "raid-controller:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    networks:
      - themis-raid-network
    depends_on:
      themis-raid-controller:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # RAID Node 4 (for RAID5/6/10)
  themis-raid-node-4:
    image: themisdb:1.4.0-hyperscaler
    container_name: themis-raid-node-4
    hostname: raid-node-4
    restart: unless-stopped
    ports:
      - "8084:8080"
      - "18769:18765"
    volumes:
      - raid_node_4_data:/var/lib/themisdb
      - ./config/raid-node.json:/etc/themis/config.json:ro
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "raid_node"
      THEMIS_NODE_ID: "4"
      THEMIS_CONTROLLER: "raid-controller:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    networks:
      - themis-raid-network
    depends_on:
      themis-raid-controller:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # RAID Node 5 (for RAID6)
  themis-raid-node-5:
    image: themisdb:1.4.0-hyperscaler
    container_name: themis-raid-node-5
    hostname: raid-node-5
    restart: unless-stopped
    ports:
      - "8085:8080"
      - "18770:18765"
    volumes:
      - raid_node_5_data:/var/lib/themisdb
      - ./config/raid-node.json:/etc/themis/config.json:ro
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "raid_node"
      THEMIS_NODE_ID: "5"
      THEMIS_CONTROLLER: "raid-controller:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    networks:
      - themis-raid-network
    depends_on:
      themis-raid-controller:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # RAID Node 6 (for RAID6)
  themis-raid-node-6:
    image: themisdb:1.4.0-hyperscaler
    container_name: themis-raid-node-6
    hostname: raid-node-6
    restart: unless-stopped
    ports:
      - "8086:8080"
      - "18771:18765"
    volumes:
      - raid_node_6_data:/var/lib/themisdb
      - ./config/raid-node.json:/etc/themis/config.json:ro
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "raid_node"
      THEMIS_NODE_ID: "6"
      THEMIS_CONTROLLER: "raid-controller:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    networks:
      - themis-raid-network
    depends_on:
      themis-raid-controller:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: themis-prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - themis-raid-network
    depends_on:
      - themis-raid-controller

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: themis-grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "themis_admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
    networks:
      - themis-raid-network
    depends_on:
      - prometheus

networks:
  themis-raid-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  raid_controller_data:
    driver: local
  raid_node_1_data:
    driver: local
  raid_node_2_data:
    driver: local
  raid_node_3_data:
    driver: local
  raid_node_4_data:
    driver: local
  raid_node_5_data:
    driver: local
  raid_node_6_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
