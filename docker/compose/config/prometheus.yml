global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'themisdb-raid-benchmark'
    monitor: 'prometheus'

scrape_configs:
  - job_name: 'themis-raid-controller'
    static_configs:
      - targets: ['raid-controller:4318']
        labels:
          role: 'controller'

  - job_name: 'themis-raid-nodes'
    static_configs:
      - targets: 
        - 'raid-node-1:4318'
        - 'raid-node-2:4318'
        - 'raid-node-3:4318'
        - 'raid-node-4:4318'
        - 'raid-node-5:4318'
        - 'raid-node-6:4318'
        labels:
          role: 'node'

  - job_name: 'themis-benchmarks'
    static_configs:
      - targets: ['raid-controller:9091']
        labels:
          type: 'benchmark'
