version: "3.8"

# ThemisDB RAID Cluster Setup
# Simuliert verschiedene RAID-Modi:
# - RAID 0 (Striping): Shards 1-3 - Daten verteilt für Performance
# - RAID 1 (Mirror): Shards 4-5 - Daten gespiegelt für Redundanz
# - RAID 5 (Striping+Parity): Shards 6-8 - Daten+Parität verteilt
# - Prometheus + Grafana für Monitoring

services:
  # RAID 0 - Striping (Performance)
  themis-raid0-shard1:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid0-shard1
    restart: unless-stopped
    ports:
      - "18765:18765"
      - "8080:8080"
      - "9091:9090"
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "shard"
      THEMIS_SHARD_ID: "raid0-1"
      THEMIS_RAID_MODE: "stripe"
      THEMIS_RAID_GROUP: "raid0"
      THEMIS_SHARDS: "themis-raid0-shard1:18765,themis-raid0-shard2:18765,themis-raid0-shard3:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "9090"
    volumes:
      - raid0_shard1_data:/var/lib/themisdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - themis-network
    labels:
      - "raid_mode=stripe"
      - "raid_group=raid0"

  themis-raid0-shard2:
    image: themisdb/themisdb:latest
    container_name: themis-raid0-shard2
    restart: unless-stopped
    ports:
      - "18766:18765"
      - "8081:8080"
      - "9092:9090"
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "shard"
      THEMIS_SHARD_ID: "raid0-2"
      THEMIS_RAID_MODE: "stripe"
      THEMIS_RAID_GROUP: "raid0"
      THEMIS_SHARDS: "themis-raid0-shard1:18765,themis-raid0-shard2:18765,themis-raid0-shard3:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "9090"
    volumes:
      - raid0_shard2_data:/var/lib/themisdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - themis-network
    labels:
      - "raid_mode=stripe"
      - "raid_group=raid0"

  themis-raid0-shard3:
    image: themisdb/themisdb:latest
    container_name: themis-raid0-shard3
    restart: unless-stopped
    ports:
      - "18767:18765"
      - "8082:8080"
      - "9093:9090"
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "shard"
      THEMIS_SHARD_ID: "raid0-3"
      THEMIS_RAID_MODE: "stripe"
      THEMIS_RAID_GROUP: "raid0"
      THEMIS_SHARDS: "themis-raid0-shard1:18765,themis-raid0-shard2:18765,themis-raid0-shard3:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "9090"
    volumes:
      - raid0_shard3_data:/var/lib/themisdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - themis-network
    labels:
      - "raid_mode=stripe"
      - "raid_group=raid0"

  # RAID 1 - Mirroring (Redundanz)
  themis-raid1-primary:
    image: themisdb/themisdb:latest
    container_name: themis-raid1-primary
    restart: unless-stopped
    ports:
      - "18768:18765"
      - "8083:8080"
      - "9094:9090"
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "shard"
      THEMIS_SHARD_ID: "raid1-primary"
      THEMIS_RAID_MODE: "mirror"
      THEMIS_RAID_GROUP: "raid1"
      THEMIS_MIRROR_PEER: "themis-raid1-secondary:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "9090"
    volumes:
      - raid1_primary_data:/var/lib/themisdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - themis-network
    labels:
      - "raid_mode=mirror"
      - "raid_group=raid1"
      - "raid_role=primary"

  themis-raid1-secondary:
    image: themisdb/themisdb:latest
    container_name: themis-raid1-secondary
    restart: unless-stopped
    ports:
      - "18769:18765"
      - "8084:8080"
      - "9095:9090"
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "shard"
      THEMIS_SHARD_ID: "raid1-secondary"
      THEMIS_RAID_MODE: "mirror"
      THEMIS_RAID_GROUP: "raid1"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "9090"
      THEMIS_MIRROR_PEER: "themis-raid1-primary:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    volumes:
      - raid1_secondary_data:/var/lib/themisdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - themis-network
    labels:
      - "raid_mode=mirror"
      - "raid_group=raid1"
      - "raid_role=secondary"

  # RAID 5 - Striping + Parity (Balance)
  themis-raid5-shard1:
    image: themisdb/themisdb:latest
    container_name: themis-raid5-shard1
    restart: unless-stopped
    ports:
      - "18770:18765"
      - "8085:8080"
      - "9096:9090"
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "shard"
      THEMIS_SHARD_ID: "raid5-1"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "9090"
      THEMIS_RAID_MODE: "parity"
      THEMIS_RAID_GROUP: "raid5"
      THEMIS_SHARDS: "themis-raid5-shard1:18765,themis-raid5-shard2:18765,themis-raid5-shard3:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    volumes:
      - raid5_shard1_data:/var/lib/themisdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - themis-network
    labels:
      - "raid_mode=parity"
      - "raid_group=raid5"

  themis-raid5-shard2:
    image: themisdb/themisdb:latest
    container_name: themis-raid5-shard2
    restart: unless-stopped
    ports:
      - "18771:18765"
      - "8086:8080"
      - "9097:9090"
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ROLE: "shard"
      THEMIS_SHARD_ID: "raid5-2"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "9090"
      THEMIS_RAID_MODE: "parity"
      THEMIS_RAID_GROUP: "raid5"
      THEMIS_SHARDS: "themis-raid5-shard1:18765,themis-raid5-shard2:18765,themis-raid5-shard3:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    volumes:
      - raid5_shard2_data:/var/lib/themisdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - themis-network
    labels:
      - "raid_mode=parity"
      - "raid_group=raid5"

  themis-raid5-shard3:
    image: themisdb/themisdb:latest
    container_name: themis-raid5-shard3
    restart: unless-stopped
    ports:
      - "18772:18765"
      - "8087:8080"
      - "9098:9090"
    environment:
      THEMIS_PORT: "18765"
      THEMIS_ENABLE_METRICS: "true"
      THEMIS_METRICS_PORT: "9090"
      THEMIS_ROLE: "shard"
      THEMIS_SHARD_ID: "raid5-3"
      THEMIS_RAID_MODE: "parity"
      THEMIS_RAID_GROUP: "raid5"
      THEMIS_SHARDS: "themis-raid5-shard1:18765,themis-raid5-shard2:18765,themis-raid5-shard3:18765"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    volumes:
      - raid5_shard3_data:/var/lib/themisdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:18765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - themis-network
    labels:
      - "raid_mode=parity"
      - "raid_group=raid5"

  # Prometheus für Metriken
  prometheus:
    image: prom/prometheus:latest
    container_name: themis-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - themis-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: themis-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/themis_raid_benchmark_dashboard.json"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
    depends_on:
      - prometheus
    networks:
      - themis-network

networks:
  themis-network:
    driver: bridge

volumes:
  raid0_shard1_data:
    driver: local
  raid0_shard2_data:
    driver: local
  raid0_shard3_data:
    driver: local
  raid1_primary_data:
    driver: local
  raid1_secondary_data:
    driver: local
  raid5_shard1_data:
    driver: local
  raid5_shard2_data:
    driver: local
  raid5_shard3_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
