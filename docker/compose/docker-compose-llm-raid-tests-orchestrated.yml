version: '3.8'

services:
  # RAID 0 Shards (Striping)
  themis-raid0-shard1:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid0-shard1
    environment:
      - THEMIS_SHARD_ID=raid0-shard1
      - THEMIS_SHARD_MODE=RAID0
      - THEMIS_CLUSTER_MODE=true
      - THEMIS_REST_PORT=8080
      - THEMIS_METRICS_PORT=9090
      - THEMIS_ENABLE_LLM=true
    ports:
      - "18765:9091"
      - "8080:8080"
      - "9090:9090"
    volumes:
      - raid0_shard1_data:/var/lib/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - themis-network

  themis-raid0-shard2:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid0-shard2
    environment:
      - THEMIS_SHARD_ID=raid0-shard2
      - THEMIS_SHARD_MODE=RAID0
      - THEMIS_CLUSTER_MODE=true
      - THEMIS_REST_PORT=8080
      - THEMIS_METRICS_PORT=9091
      - THEMIS_ENABLE_LLM=true
    ports:
      - "18766:9091"
      - "8081:8080"
      - "9091:9091"
    volumes:
      - raid0_shard2_data:/var/lib/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - themis-network

  themis-raid0-shard3:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid0-shard3
    environment:
      - THEMIS_SHARD_ID=raid0-shard3
      - THEMIS_SHARD_MODE=RAID0
      - THEMIS_CLUSTER_MODE=true
      - THEMIS_REST_PORT=8080
      - THEMIS_METRICS_PORT=9092
      - THEMIS_ENABLE_LLM=true
    ports:
      - "18767:9091"
      - "8082:8080"
      - "9092:9092"
    volumes:
      - raid0_shard3_data:/var/lib/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - themis-network

  # RAID 1 Shards (Mirroring)
  themis-raid1-primary:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid1-primary
    environment:
      - THEMIS_SHARD_ID=raid1-primary
      - THEMIS_SHARD_MODE=RAID1
      - THEMIS_CLUSTER_MODE=true
      - THEMIS_REST_PORT=8080
      - THEMIS_METRICS_PORT=9093
      - THEMIS_ENABLE_LLM=true
    ports:
      - "18768:9091"
      - "8083:8080"
      - "9093:9093"
    volumes:
      - raid1_primary_data:/var/lib/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - themis-network

  themis-raid1-mirror:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid1-mirror
    environment:
      - THEMIS_SHARD_ID=raid1-mirror
      - THEMIS_SHARD_MODE=RAID1
      - THEMIS_CLUSTER_MODE=true
      - THEMIS_REST_PORT=8080
      - THEMIS_METRICS_PORT=9094
      - THEMIS_ENABLE_LLM=true
    ports:
      - "18769:9091"
      - "8084:8080"
      - "9094:9094"
    volumes:
      - raid1_mirror_data:/var/lib/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - themis-network

  # RAID 5 Shards (Parity Stripe)
  themis-raid5-shard1:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid5-shard1
    environment:
      - THEMIS_SHARD_ID=raid5-shard1
      - THEMIS_SHARD_MODE=RAID5
      - THEMIS_CLUSTER_MODE=true
      - THEMIS_REST_PORT=8080
      - THEMIS_METRICS_PORT=9095
      - THEMIS_ENABLE_LLM=true
    ports:
      - "18770:9091"
      - "8085:8080"
      - "9095:9095"
    volumes:
      - raid5_shard1_data:/var/lib/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - themis-network

  themis-raid5-shard2:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid5-shard2
    environment:
      - THEMIS_SHARD_ID=raid5-shard2
      - THEMIS_SHARD_MODE=RAID5
      - THEMIS_CLUSTER_MODE=true
      - THEMIS_REST_PORT=8080
      - THEMIS_METRICS_PORT=9096
      - THEMIS_ENABLE_LLM=true
    ports:
      - "18771:9091"
      - "8086:8080"
      - "9096:9096"
    volumes:
      - raid5_shard2_data:/var/lib/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - themis-network

  themis-raid5-shard3:
    image: themisdb/themisdb:hyperscaler
    container_name: themis-raid5-shard3
    environment:
      - THEMIS_SHARD_ID=raid5-shard3
      - THEMIS_SHARD_MODE=RAID5
      - THEMIS_CLUSTER_MODE=true
      - THEMIS_REST_PORT=8080
      - THEMIS_METRICS_PORT=9097
      - THEMIS_ENABLE_LLM=true
    ports:
      - "18772:9091"
      - "8087:8080"
      - "9097:9097"
    volumes:
      - raid5_shard3_data:/var/lib/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - themis-network

  # Test Orchestration Service
  # Pusht Daten in RAID -> Sammelt Metriken -> Validiert Ergebnisse
  themis-llm-raid-tests:
    image: themisdb/themis-llm-raid-tests:latest
    container_name: themis-llm-raid-tests
    environment:
      - TEST_TYPE=${TEST_TYPE:-all}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - RAID0_SHARDS=themis-raid0-shard1:8080,themis-raid0-shard2:8080,themis-raid0-shard3:8080
      - RAID1_SHARDS=themis-raid1-primary:8080,themis-raid1-mirror:8080
      - RAID5_SHARDS=themis-raid5-shard1:8080,themis-raid5-shard2:8080,themis-raid5-shard3:8080
      - METRICS_RAID0_PORTS=9090,9091,9092
      - METRICS_RAID1_PORTS=9093,9094
      - METRICS_RAID5_PORTS=9095,9096,9097
    ports:
      - "8888:8888"
      - "9999:9999"
    volumes:
      - test_data:/test_data
      - test_models:/test_models
      - test_loras:/test_loras
      - test_results:/test_results
    depends_on:
      themis-raid0-shard1:
        condition: service_healthy
      themis-raid0-shard2:
        condition: service_healthy
      themis-raid0-shard3:
        condition: service_healthy
      themis-raid1-primary:
        condition: service_healthy
      themis-raid1-mirror:
        condition: service_healthy
      themis-raid5-shard1:
        condition: service_healthy
      themis-raid5-shard2:
        condition: service_healthy
      themis-raid5-shard3:
        condition: service_healthy
    networks:
      - themis-network
    entrypoint: /docker/test-entrypoint-orchestrated.sh

  # Prometheus für Metriken-Sammlung
  prometheus:
    image: prom/prometheus:latest
    container_name: themis-prometheus
    environment:
      - TZ=UTC
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - themis-network
    depends_on:
      - themis-raid0-shard1
      - themis-raid0-shard2
      - themis-raid0-shard3
      - themis-raid1-primary
      - themis-raid1-mirror
      - themis-raid5-shard1
      - themis-raid5-shard2
      - themis-raid5-shard3

  # Grafana für Visualisierung
  grafana:
    image: grafana/grafana:latest
    container_name: themis-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=themis
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - themis-network
    depends_on:
      - prometheus

volumes:
  raid0_shard1_data:
  raid0_shard2_data:
  raid0_shard3_data:
  raid1_primary_data:
  raid1_mirror_data:
  raid5_shard1_data:
  raid5_shard2_data:
  raid5_shard3_data:
  test_data:
  test_models:
  test_loras:
  test_results:
  prometheus_data:
  grafana_data:

networks:
  themis-network:
    driver: bridge
