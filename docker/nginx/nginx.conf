# Nginx Load Balancer Configuration for ThemisDB Hyperscaler Sharding Test
# Distributes traffic across 10 shards with health checks

upstream themis_raid1_backend {
    least_conn;
    server themis-shard-0:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-1:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-2:8080 max_fails=3 fail_timeout=30s;
}

upstream themis_raid2_backend {
    least_conn;
    server themis-shard-3:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-4:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-5:8080 max_fails=3 fail_timeout=30s;
}

upstream themis_raid5_backend {
    least_conn;
    server themis-shard-6:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-7:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-8:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-9:8080 max_fails=3 fail_timeout=30s;
}

upstream themis_all_shards {
    least_conn;
    server themis-shard-0:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-1:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-2:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-3:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-4:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-5:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-6:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-7:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-8:8080 max_fails=3 fail_timeout=30s;
    server themis-shard-9:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name themis-lb;

    # General load balancing across all shards
    location / {
        proxy_pass http://themis_all_shards;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Health check
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # RAID 1 specific endpoint
    location /raid1/ {
        rewrite ^/raid1/(.*)$ /$1 break;
        proxy_pass http://themis_raid1_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RAID 2 specific endpoint
    location /raid2/ {
        rewrite ^/raid2/(.*)$ /$1 break;
        proxy_pass http://themis_raid2_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RAID 5 specific endpoint
    location /raid5/ {
        rewrite ^/raid5/(.*)$ /$1 break;
        proxy_pass http://themis_raid5_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Nginx status
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 172.30.0.0/16;
        deny all;
    }
}
