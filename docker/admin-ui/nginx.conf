# ============================================================================
# ThemisDB Admin UI - nginx configuration
# ============================================================================
# Serves the static admin UI and reverse-proxies /api/ to the ThemisDB backend.
# The upstream address is resolved via Docker's internal DNS (service name).
#
# TLS NOTE (Phase 2):
#   For HTTPS, either:
#   a) Place this deployment behind QNAP's built-in reverse proxy
#      (Control Panel → Application Portal → Reverse Proxy) and let QNAP
#      handle TLS termination — no changes to this file required.
#   b) Include the optional nginx.ssl.conf alongside this file to enable
#      direct TLS on the container (requires cert/key mounts; see
#      docker-compose.qnap.yml TLS volume hints).
# ============================================================================

# ---------------------------------------------------------------------------
# Rate limiting (Phase 2)
# Protects /api/ endpoints from brute-force and flooding.
#   zone=admin_api  — 10 MB shared memory (~160k IPs)
#   rate=30r/m      — 30 requests per minute per IP (~0.5 req/s)
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=30r/m;

# Stricter zone for the login endpoint (POST /api/auth/sessions)
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

upstream themisdb_backend {
    # "themis" is the default service name in docker-compose.qnap.yml.
    # Override by setting resolver + variable when using envsubst entrypoint.
    server themis:8080;
}

# ---------------------------------------------------------------------------
# Allowed origins map (Phase 2 — CORS/Origin validation)
# Add the exact origin(s) from which the Admin UI is served.
# "1" = allowed, default "" = denied.
# ---------------------------------------------------------------------------
map $http_origin $cors_allowed {
    default             "";
    # Same-origin access (LAN, no Origin header) — always allowed
    ""                  "1";
    # Explicit origins — adjust to match your QNAP hostname/IP:
    ~^https?://localhost(:[0-9]+)?$     "1";
    ~^https?://127\.0\.0\.1(:[0-9]+)?$ "1";
    # Example: ~^https?://qnap\.local(:[0-9]+)?$ "1";
}

server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"                   always;
    add_header X-Frame-Options          "SAMEORIGIN"                always;
    add_header X-XSS-Protection         "1; mode=block"             always;
    add_header Referrer-Policy          "strict-origin"             always;
    add_header Permissions-Policy       "geolocation=(), camera=()" always;

    # -------------------------------------------------------------------------
    # Static admin UI
    # -------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # UI health probe endpoint (used by Docker HEALTHCHECK)
    location = /health-ui {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # API reverse proxy → ThemisDB backend
    # Phase 2 additions:
    #   - Rate limiting (burst=10, nodelay)
    #   - CSRF header enforcement on state-changing methods
    #   - CORS/Origin validation
    # -------------------------------------------------------------------------
    location /api/ {
        # Rate limiting — general API endpoints
        limit_req zone=admin_api burst=10 nodelay;
        limit_req_status 429;

        # CORS — reject requests from disallowed origins
        if ($cors_allowed = "") {
            return 403 '{"error":"cors_forbidden","message":"Origin not allowed"}';
        }

        # CSRF enforcement — state-changing requests MUST include X-CSRF-Token
        # (set to any non-empty value; the SPA generates a random nonce at login)
        set $csrf_check 0;
        if ($request_method = POST)   { set $csrf_check 1; }
        if ($request_method = PUT)    { set $csrf_check 1; }
        if ($request_method = PATCH)  { set $csrf_check 1; }
        if ($request_method = DELETE) { set $csrf_check 1; }

        # Allow POST /api/auth/sessions without CSRF (login itself cannot carry
        # a prior CSRF token; login endpoint is protected by rate-limiting instead)
        set $is_login_post 0;
        if ($request_uri ~ "^/api/auth/sessions$") { set $is_login_post 1; }
        set $csrf_required "${csrf_check}${is_login_post}";
        # csrf_required == "10" means: state-change AND NOT login
        if ($csrf_required = "10") {
            set $csrf_header $http_x_csrf_token;
            if ($csrf_header = "") {
                return 403 '{"error":"csrf_required","message":"X-CSRF-Token header missing"}';
            }
        }

        proxy_pass         http://themisdb_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Remove the /api prefix before forwarding
        rewrite ^/api/(.*)$ /$1 break;
    }

    # Stricter rate limit on the login endpoint
    location = /api/auth/sessions {
        limit_req zone=admin_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://themisdb_backend/auth/sessions;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # -------------------------------------------------------------------------
    # Proxy the OpenAPI spec from the backend
    # -------------------------------------------------------------------------
    location = /openapi.json {
        proxy_pass http://themisdb_backend/api/openapi.json;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 429 /429.html;
    location = /429.html {
        return 429 '{"error":"rate_limit_exceeded","message":"Too many requests — please wait and retry."}';
        add_header Content-Type application/json;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
