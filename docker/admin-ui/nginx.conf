# ============================================================================
# ThemisDB Admin UI - nginx configuration
# ============================================================================
# Serves the static admin UI and reverse-proxies /api/ to the ThemisDB backend.
# The upstream address is resolved via Docker's internal DNS (service name).
#
# Environment variable THEMISDB_UPSTREAM is not supported in the nginx:alpine
# image without envsubst; use the docker-compose resolver approach instead.
# Adjust the upstream host below if the ThemisDB service name differs.
# ============================================================================

upstream themisdb_backend {
    # "themis" is the default service name in docker-compose.qnap.yml.
    # Override by setting resolver + variable when using envsubst entrypoint.
    server themis:8080;
}

server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "strict-origin"   always;

    # -------------------------------------------------------------------------
    # Static admin UI
    # -------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # UI health probe endpoint (used by Docker HEALTHCHECK)
    location = /health-ui {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # API reverse proxy → ThemisDB backend
    # Strips the /api prefix so ThemisDB receives paths as-is.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://themisdb_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Remove the /api prefix before forwarding
        rewrite ^/api/(.*)$ /$1 break;
    }

    # -------------------------------------------------------------------------
    # Proxy the OpenAPI spec from the backend
    # -------------------------------------------------------------------------
    location = /openapi.json {
        proxy_pass http://themisdb_backend/api/openapi.json;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------------
    # Error pages
    # -------------------------------------------------------------------------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
