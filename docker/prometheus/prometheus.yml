# ============================================================================
# Prometheus Configuration for ThemisDB LoRA Framework
# ============================================================================
# Monitors ThemisDB instances with LoRA framework metrics
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'themis-lora-dev'
    environment: 'development'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load rules for alerts (optional)
rule_files:
  # - 'alerts/*.yml'

scrape_configs:
  # ThemisDB with LoRA Framework
  - job_name: 'themisdb-lora'
    static_configs:
      - targets:
          - 'themisdb:9090'
        labels:
          service: 'themisdb'
          component: 'lora-framework'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Test Database Instance
  - job_name: 'themisdb-test'
    static_configs:
      - targets:
          - 'test-db:9090'
        labels:
          service: 'themisdb'
          component: 'test-instance'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          service: 'prometheus'
    scrape_interval: 30s
