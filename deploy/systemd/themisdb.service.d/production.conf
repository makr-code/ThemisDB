# ThemisDB production drop-in
# Install at: /etc/systemd/system/themisdb.service.d/production.conf
#
# Requires systemd ≥ 235 (shipped with Ubuntu 18.04+, Debian 10+, RHEL 8+).
#
# Usage:
#   sudo mkdir -p /etc/systemd/system/themisdb.service.d/
#   sudo cp production.conf /etc/systemd/system/themisdb.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart themisdb
#
# IMPORTANT: The actual secret values (tokens, PINs, passphrases) must NOT
# be stored in this file. Store them in /etc/themisdb/themisdb.env (mode 600,
# owned by root, readable by the themisdb user via supplementary group or ACL)
# or inject them via your secrets management platform.

[Service]
# -----------------------------------------------------------------------
# Required: Production mode
# -----------------------------------------------------------------------
Environment="THEMIS_PRODUCTION_MODE=1"
Environment="THEMIS_ENVIRONMENT=production"

# -----------------------------------------------------------------------
# Required: Disable unsafe development features
# -----------------------------------------------------------------------
# Use UnsetEnvironment (systemd ≥ 235) to guarantee these variables are
# absent from the process environment, overriding any value set in the base
# unit file or EnvironmentFile.
UnsetEnvironment=THEMIS_ALLOW_HSM_STUB THEMIS_DEBUG_ENC_DIR THEMIS_DEBUG_PKI THEMIS_PII_FORCE_INIT_FAIL

# -----------------------------------------------------------------------
# Required: Admin token  (value loaded from EnvironmentFile)
# -----------------------------------------------------------------------
# Set THEMIS_TOKEN_ADMIN in /etc/themisdb/themisdb.env — do not put the
# value here. Example entry in themisdb.env:
#   THEMIS_TOKEN_ADMIN=<openssl rand -base64 32>

# -----------------------------------------------------------------------
# Required: TLS certificates
# -----------------------------------------------------------------------
Environment="THEMIS_PKI_CERTIFICATE=/etc/themisdb/tls/server.crt"
Environment="THEMIS_PKI_PRIVATE_KEY=/etc/themisdb/tls/server.key"
# Passphrase for encrypted private key (set in themisdb.env):
# THEMIS_PKI_KEY_PASSPHRASE=<passphrase>

# -----------------------------------------------------------------------
# Key management — choose ONE of the options below
# -----------------------------------------------------------------------
# Option A: HashiCorp Vault
Environment="THEMIS_VAULT_ADDR=https://vault.example.com:8200"
Environment="THEMIS_VAULT_TRANSIT_MOUNT=transit"
# THEMIS_VAULT_TOKEN must be set in /etc/themisdb/themisdb.env
# or provided by Vault agent / AppRole / platform credential injection.

# Option B: Hardware HSM (PKCS#11) — comment out Option A if using this
# Environment="THEMIS_HSM_ENABLED=1"
# Environment="THEMIS_HSM_SESSION_POOL=8"
# THEMIS_HSM_PIN must be set in /etc/themisdb/themisdb.env

# -----------------------------------------------------------------------
# Data safety
# -----------------------------------------------------------------------
Environment="THEMIS_PII_STRICT=1"
Environment="THEMIS_DISABLE_AUTO_DOWNLOAD=1"

# -----------------------------------------------------------------------
# WAL gRPC mTLS  (required for multi-node clusters)
# -----------------------------------------------------------------------
Environment="THEMIS_WAL_GRPC_ENABLE_MTLS=1"
Environment="THEMIS_WAL_GRPC_REQUIRE_CLIENT_CERT=1"
Environment="THEMIS_WAL_GRPC_CERT_PATH=/etc/themisdb/tls/wal-client.crt"
Environment="THEMIS_WAL_GRPC_KEY_PATH=/etc/themisdb/tls/wal-client.key"
Environment="THEMIS_WAL_GRPC_CA_CERT_PATH=/etc/themisdb/tls/ca.crt"

# -----------------------------------------------------------------------
# Health endpoint (bind to loopback for internal probes only)
# -----------------------------------------------------------------------
Environment="THEMIS_HEALTH_PORT=8081"
Environment="THEMIS_HEALTH_BIND_ADDRESS=127.0.0.1"

# -----------------------------------------------------------------------
# Audit rate limiting
# -----------------------------------------------------------------------
Environment="THEMIS_AUDIT_RATE_LIMIT=10000"
