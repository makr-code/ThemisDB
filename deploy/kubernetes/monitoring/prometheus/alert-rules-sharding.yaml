# ThemisDB Sharding Alert Rules for Prometheus
# Place in Prometheus rules directory and reference in prometheus.yml

groups:
  - name: themisdb-sharding-alerts
    interval: 30s
    rules:
      # ========== Critical Alerts ==========
      
      - alert: ShardDown
        expr: themis_shard_health_status{status="unhealthy"} == 1
        for: 2m
        labels:
          severity: critical
          component: sharding
        annotations:
          summary: "Shard {{ $labels.shard_id }} is unhealthy"
          description: "Shard {{ $labels.shard_id }} has been unhealthy for more than 2 minutes. This may impact data availability."
          runbook: "https://docs.themisdb.io/operations/runbooks/shard-unhealthy"

      - alert: HighRoutingErrorRate
        expr: rate(themis_routing_errors_total[5m]) / rate(themis_routing_requests_total[5m]) > 0.05
        for: 3m
        labels:
          severity: critical
          component: sharding
        annotations:
          summary: "High routing error rate on shard {{ $labels.shard_id }}"
          description: "Routing error rate is {{ humanizePercentage $value }} over the last 5 minutes."
          runbook: "https://docs.themisdb.io/operations/runbooks/routing-errors"

      - alert: CertificateExpiringSoon
        expr: themis_shard_certificate_expiry_seconds < 604800  # 7 days
        for: 1h
        labels:
          severity: critical
          component: security
        annotations:
          summary: "Certificate expiring soon for shard {{ $labels.shard_id }}"
          description: "Certificate expires in {{ $value | humanizeDuration }}. Renew immediately."
          runbook: "https://docs.themisdb.io/operations/runbooks/certificate-renewal"

      - alert: MigrationStalled
        expr: |
          increase(themis_migration_progress_percent[30m]) == 0 
          and themis_migration_progress_percent > 0 
          and themis_migration_progress_percent < 100
        for: 10m
        labels:
          severity: critical
          component: migration
        annotations:
          summary: "Data migration stalled for {{ $labels.operation_id }}"
          description: "No migration progress in 30 minutes. Current progress: {{ $value }}%"
          runbook: "https://docs.themisdb.io/operations/runbooks/migration-stalled"

      # ========== Warning Alerts ==========

      - alert: SlowScatterGather
        expr: histogram_quantile(0.95, rate(themis_routing_latency_seconds_bucket{operation="scatter_gather"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Slow scatter-gather queries"
          description: "P95 scatter-gather latency is {{ $value }}s. Expected < 5s."
          runbook: "https://docs.themisdb.io/operations/runbooks/slow-queries"

      - alert: SlowCrossShardJoins
        expr: histogram_quantile(0.95, rate(themis_cross_shard_join_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "Slow cross-shard joins"
          description: "P95 cross-shard join latency is {{ $value }}s for strategy {{ $labels.strategy }}."
          runbook: "https://docs.themisdb.io/operations/runbooks/optimize-joins"

      - alert: GossipPeerCountLow
        expr: themis_gossip_peer_count < 2
        for: 5m
        labels:
          severity: warning
          component: gossip
        annotations:
          summary: "Low gossip peer count"
          description: "Only {{ $value }} known peers. Expected >= 2 for redundancy."
          runbook: "https://docs.themisdb.io/operations/runbooks/gossip-peers"

      - alert: HighCrossDCTraffic
        expr: rate(themis_cross_dc_requests_total[5m]) > 100
        for: 10m
        labels:
          severity: warning
          component: network
        annotations:
          summary: "High cross-datacenter traffic"
          description: "Cross-DC request rate is {{ $value }}/s from {{ $labels.source }} to {{ $labels.target }}."
          runbook: "https://docs.themisdb.io/operations/runbooks/cross-dc-traffic"

      - alert: ClusterSizeChanged
        expr: changes(themis_cluster_size[10m]) > 0
        for: 1m
        labels:
          severity: warning
          component: topology
        annotations:
          summary: "Cluster size changed"
          description: "Cluster size is now {{ $value }} shards. Verify this is expected."
          runbook: "https://docs.themisdb.io/operations/runbooks/cluster-size-change"

      - alert: HealthCheckFailures
        expr: rate(themis_health_check_results_total{result="critical"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          component: health
        annotations:
          summary: "Frequent health check failures"
          description: "Health check {{ $labels.type }} failing at {{ $value }}/s rate."
          runbook: "https://docs.themisdb.io/operations/runbooks/health-checks"

      # ========== Info Alerts ==========

      - alert: TopologyChange
        expr: changes(themis_virtual_nodes_total[10m]) > 0
        for: 1m
        labels:
          severity: info
          component: topology
        annotations:
          summary: "Topology change detected"
          description: "Virtual nodes changed to {{ $value }}. This may trigger rebalancing."

      - alert: MigrationCompleted
        expr: themis_migration_progress_percent == 100
        for: 1m
        labels:
          severity: info
          component: migration
        annotations:
          summary: "Migration completed for {{ $labels.operation_id }}"
          description: "Migration successfully completed. {{ $labels.records }} records transferred."
