apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: themisdb
  labels:
    app: prometheus
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'themisdb-cluster'
        env: 'production'

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      # ThemisDB Sharding Metrics
      - job_name: 'themisdb-shards'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - themisdb
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: themisdb
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: 'true'
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_shard_id]
            target_label: shard_id
          - source_labels: [__meta_kubernetes_pod_label_datacenter]
            target_label: datacenter

      # ThemisDB Content Processors
      - job_name: 'themisdb-content-processors'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - themisdb
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_component]
            regex: content-processor
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: processor

      # Gossip Protocol Metrics
      - job_name: 'themisdb-gossip'
        static_configs:
          - targets: ['themisdb-shard-0:9091', 'themisdb-shard-1:9091', 'themisdb-shard-2:9091']
        metrics_path: /metrics/gossip

      # etcd Metadata Store
      - job_name: 'etcd'
        static_configs:
          - targets: ['etcd-0:2379', 'etcd-1:2379', 'etcd-2:2379']
        scheme: https
        tls_config:
          ca_file: /etc/prometheus/certs/etcd-ca.crt
          cert_file: /etc/prometheus/certs/etcd-client.crt
          key_file: /etc/prometheus/certs/etcd-client.key

  alert-rules.yaml: |
    groups:
      - name: themisdb-sharding-alerts
        rules:
          # Shard Health Alerts
          - alert: ShardUnhealthy
            expr: themisdb_shard_status{status="unhealthy"} > 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Shard {{ $labels.shard_id }} is unhealthy"
              description: "Shard {{ $labels.shard_id }} has been unhealthy for more than 2 minutes."

          - alert: ShardStorageCritical
            expr: themisdb_shard_storage_used_percent > 90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Shard {{ $labels.shard_id }} storage above 90%"
              description: "Shard {{ $labels.shard_id }} storage usage is {{ $value }}%."

          # Routing Alerts
          - alert: HighRoutingErrorRate
            expr: rate(themisdb_routing_errors_total[5m]) / rate(themisdb_routing_requests_total[5m]) > 0.05
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "High routing error rate"
              description: "Routing error rate is {{ $value | humanizePercentage }}."

          # Gossip Protocol Alerts
          - alert: GossipPeerCountLow
            expr: themisdb_gossip_known_peers < 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Low gossip peer count"
              description: "Instance {{ $labels.instance }} has only {{ $value }} known peers."

          - alert: GossipMessageFailures
            expr: rate(themisdb_gossip_message_failures_total[5m]) > 10
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "High gossip message failure rate"
              description: "Gossip message failures: {{ $value }} per second."

          # Migration Alerts
          - alert: MigrationStalled
            expr: increase(themisdb_migration_batches_completed_total[30m]) == 0 and themisdb_migration_batches_pending > 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Data migration stalled"
              description: "No migration progress in 30 minutes with {{ $value }} batches pending."

          # Query Performance Alerts
          - alert: HighQueryLatency
            expr: histogram_quantile(0.99, rate(themisdb_query_duration_seconds_bucket[5m])) > 5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High p99 query latency"
              description: "p99 query latency is {{ $value | humanizeDuration }}."

          # Certificate Alerts
          - alert: CertificateExpiringSoon
            expr: themisdb_certificate_expiry_seconds < 604800
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Certificate expiring soon"
              description: "Certificate for {{ $labels.shard_id }} expires in {{ $value | humanizeDuration }}."

          # Cross-Shard Join Alerts
          - alert: CrossShardJoinSlow
            expr: histogram_quantile(0.95, rate(themisdb_cross_shard_join_duration_seconds_bucket[5m])) > 30
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Slow cross-shard joins"
              description: "p95 cross-shard join latency is {{ $value | humanizeDuration }}."
