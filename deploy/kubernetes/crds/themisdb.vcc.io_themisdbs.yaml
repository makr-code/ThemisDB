apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: themisdbs.vcc.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: vcc.io
  names:
    kind: ThemisDB
    listKind: ThemisDBList
    plural: themisdbs
    singular: themisdb
    shortNames:
      - tdb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - replicas
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 99
                  description: Number of ThemisDB replicas
                version:
                  type: string
                  description: ThemisDB version to deploy
                  default: "latest"
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                      description: Storage size (e.g., 100Gi)
                      default: "100Gi"
                    storageClass:
                      type: string
                      description: Kubernetes StorageClass name
                      default: "standard"
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                          default: "4Gi"
                        cpu:
                          type: string
                          default: "2"
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                          default: "8Gi"
                        cpu:
                          type: string
                          default: "4"
                sharding:
                  type: object
                  description: Sharding configuration
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    shards:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 3
                    replicationFactor:
                      type: integer
                      minimum: 1
                      maximum: 5
                      default: 2
                    gossipEnabled:
                      type: boolean
                      description: Enable P2P gossip protocol for peer discovery
                      default: false
                    gossipInterval:
                      type: integer
                      description: Gossip interval in seconds
                      default: 30
                security:
                  type: object
                  properties:
                    mtls:
                      type: boolean
                      description: Enable mutual TLS
                      default: true
                    rbac:
                      type: boolean
                      description: Enable RBAC
                      default: true
                    fieldEncryption:
                      type: boolean
                      description: Enable field-level encryption
                      default: false
                monitoring:
                  type: object
                  properties:
                    prometheus:
                      type: boolean
                      description: Enable Prometheus metrics
                      default: true
                    grafana:
                      type: boolean
                      description: Deploy Grafana dashboard
                      default: false
                    opentelemetry:
                      type: boolean
                      description: Enable OpenTelemetry tracing
                      default: false
                backup:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    schedule:
                      type: string
                      description: Cron schedule for backups
                      default: "0 2 * * *"
                    retention:
                      type: integer
                      description: Number of backups to retain
                      default: 7
                    destination:
                      type: string
                      description: S3/GCS/Azure blob URL
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase (Pending, Running, Failed, Updating)
                replicas:
                  type: integer
                  description: Current number of replicas
                readyReplicas:
                  type: integer
                  description: Number of ready replicas
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
