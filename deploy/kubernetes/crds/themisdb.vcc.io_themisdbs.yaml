apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: themisdbs.vcc.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: vcc.io
  names:
    kind: ThemisDB
    listKind: ThemisDBList
    plural: themisdbs
    singular: themisdb
    shortNames:
      - tdb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - replicas
              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 99
                  description: Number of ThemisDB replicas
                version:
                  type: string
                  description: ThemisDB version to deploy
                  default: "latest"
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                      description: Storage size (e.g., 100Gi)
                      default: "100Gi"
                    storageClass:
                      type: string
                      description: Kubernetes StorageClass name
                      default: "standard"
                resources:
                  type: object
                  properties:
                    requests:
                      type: object
                      properties:
                        memory:
                          type: string
                          default: "4Gi"
                        cpu:
                          type: string
                          default: "2"
                    limits:
                      type: object
                      properties:
                        memory:
                          type: string
                          default: "8Gi"
                        cpu:
                          type: string
                          default: "4"
                replication:
                  type: object
                  description: Replication topology configuration
                  properties:
                    mode:
                      type: string
                      description: "Replication mode: SYNC, SEMI_SYNC, or ASYNC"
                      enum: ["SYNC", "SEMI_SYNC", "ASYNC"]
                      default: "SEMI_SYNC"
                    minSyncReplicas:
                      type: integer
                      description: Minimum number of in-sync replicas required for quorum writes
                      minimum: 1
                      default: 1
                    leaderElection:
                      type: object
                      description: Leader election configuration
                      properties:
                        electionTimeoutMinMs:
                          type: integer
                          description: Minimum leader election timeout in milliseconds
                          minimum: 150
                          default: 150
                        electionTimeoutMaxMs:
                          type: integer
                          description: Maximum leader election timeout in milliseconds
                          minimum: 300
                          default: 300
                        heartbeatIntervalMs:
                          type: integer
                          description: Leader heartbeat interval in milliseconds
                          minimum: 50
                          default: 100
                        leaderPreferencePriority:
                          type: integer
                          description: Priority for leader election (higher is preferred)
                          minimum: 0
                          default: 1
                    failover:
                      type: object
                      description: Automatic failover policy
                      properties:
                        enabled:
                          type: boolean
                          description: Enable automatic leader failover
                          default: true
                        failureDetectionTimeoutMs:
                          type: integer
                          description: Timeout before a node is declared failed (milliseconds)
                          minimum: 1000
                          default: 5000
                        maxFailoverAttempts:
                          type: integer
                          description: Maximum number of failover attempts before giving up
                          minimum: 1
                          default: 3
                        failoverCooldownMs:
                          type: integer
                          description: Minimum time between consecutive failovers (milliseconds)
                          minimum: 0
                          default: 30000
                    lagThresholds:
                      type: object
                      description: Thresholds for lag-based topology decisions
                      properties:
                        degradedLagMs:
                          type: integer
                          description: Replication lag (ms) above which a replica is considered degraded
                          minimum: 0
                          default: 5000
                        criticalLagMs:
                          type: integer
                          description: Replication lag (ms) above which a replica is excluded from reads
                          minimum: 0
                          default: 30000
                        readShiftEnabled:
                          type: boolean
                          description: Automatically shift read traffic away from lagging replicas
                          default: true
                    wal:
                      type: object
                      description: Write-Ahead Log (WAL) configuration
                      properties:
                        compression:
                          type: boolean
                          description: Enable Zstd WAL compression
                          default: true
                        syncOnCommit:
                          type: boolean
                          description: Fsync WAL on every commit (durable but slower)
                          default: true
                        retentionHours:
                          type: integer
                          description: Hours to retain WAL files
                          minimum: 1
                          default: 168
                    topologyAware:
                      type: object
                      description: Topology-aware scheduling hints
                      properties:
                        spreadAcrossZones:
                          type: boolean
                          description: Spread replicas across availability zones
                          default: true
                        spreadAcrossNodes:
                          type: boolean
                          description: Spread replicas across Kubernetes nodes
                          default: true
                        preferredDatacenters:
                          type: array
                          description: Preferred datacenters/regions for replica placement
                          items:
                            type: string
                sharding:
                  type: object
                  description: Sharding configuration
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    shards:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 3
                    replicationFactor:
                      type: integer
                      minimum: 1
                      maximum: 5
                      default: 2
                    gossipEnabled:
                      type: boolean
                      description: Enable P2P gossip protocol for peer discovery
                      default: false
                    gossipInterval:
                      type: integer
                      description: Gossip interval in seconds
                      default: 30
                security:
                  type: object
                  properties:
                    mtls:
                      type: boolean
                      description: Enable mutual TLS
                      default: true
                    rbac:
                      type: boolean
                      description: Enable RBAC
                      default: true
                    fieldEncryption:
                      type: boolean
                      description: Enable field-level encryption
                      default: false
                monitoring:
                  type: object
                  properties:
                    prometheus:
                      type: boolean
                      description: Enable Prometheus metrics
                      default: true
                    grafana:
                      type: boolean
                      description: Deploy Grafana dashboard
                      default: false
                    opentelemetry:
                      type: boolean
                      description: Enable OpenTelemetry tracing
                      default: false
                backup:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    schedule:
                      type: string
                      description: Cron schedule for backups
                      default: "0 2 * * *"
                    retention:
                      type: integer
                      description: Number of backups to retain
                      default: 7
                    destination:
                      type: string
                      description: S3/GCS/Azure blob URL
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current phase (Pending, Running, Failed, Updating)
                replicas:
                  type: integer
                  description: Current number of replicas
                readyReplicas:
                  type: integer
                  description: Number of ready replicas
                replicationTopology:
                  type: object
                  description: Current replication topology status
                  properties:
                    currentLeader:
                      type: string
                      description: Node ID of the current leader/primary
                    leaderTerm:
                      type: integer
                      format: int64
                      description: Current Raft term of the leader
                    lastFailoverTime:
                      type: string
                      format: date-time
                      description: Timestamp of the most recent leader failover
                    failoverCount:
                      type: integer
                      description: Total number of leader failovers since cluster creation
                    inSyncReplicas:
                      type: array
                      description: List of replica node IDs that are in-sync with the leader
                      items:
                        type: string
                    laggingReplicas:
                      type: array
                      description: List of replica node IDs that are lagging beyond the degraded threshold
                      items:
                        type: string
                    replicaHealth:
                      type: array
                      description: Health status of each replica
                      items:
                        type: object
                        properties:
                          nodeId:
                            type: string
                          role:
                            type: string
                            enum: ["LEADER", "FOLLOWER", "CANDIDATE", "OBSERVER"]
                          health:
                            type: string
                            enum: ["HEALTHY", "DEGRADED", "FAILED", "UNKNOWN"]
                          lagMs:
                            type: integer
                            format: int64
                          lastHeartbeat:
                            type: string
                            format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.replicas
      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Ready
          type: integer
          jsonPath: .status.readyReplicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Leader
          type: string
          jsonPath: .status.replicationTopology.currentLeader
          priority: 1
        - name: InSync
          type: string
          jsonPath: .status.replicationTopology.inSyncReplicas
          priority: 1
