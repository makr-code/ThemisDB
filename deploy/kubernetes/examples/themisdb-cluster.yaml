# ThemisDB Cluster Example
# Deploys a 3-node ThemisDB cluster with sharding enabled

apiVersion: vcc.io/v1alpha1
kind: ThemisDB
metadata:
  name: themisdb-cluster
  namespace: themisdb
  labels:
    app: themisdb
    environment: production
spec:
  replicas: 3
  version: "1.0.0"
  
  storage:
    size: 100Gi
    storageClass: standard
  
  resources:
    requests:
      memory: "4Gi"
      cpu: "2"
    limits:
      memory: "8Gi"
      cpu: "4"
  
  sharding:
    enabled: true
    shards: 3
    replicationFactor: 2
    gossipEnabled: true   # P2P peer discovery enabled
    gossipInterval: 30
  
  security:
    mtls: true
    rbac: true
    fieldEncryption: false
  
  monitoring:
    prometheus: true
    grafana: true
    opentelemetry: true
  
  backup:
    enabled: true
    schedule: "0 2 * * *"  # Daily at 2 AM
    retention: 7
    # destination: "s3://my-bucket/themisdb-backups"
