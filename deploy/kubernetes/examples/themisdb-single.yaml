# ThemisDB Single Node Example
# Deploys a single ThemisDB instance for development/testing

apiVersion: vcc.io/v1alpha1
kind: ThemisDB
metadata:
  name: themisdb-dev
  namespace: themisdb
  labels:
    app: themisdb
    environment: development
spec:
  replicas: 1
  version: "1.0.0"
  
  storage:
    size: 10Gi
    storageClass: standard
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1"
  
  sharding:
    enabled: false
  
  security:
    mtls: false
    rbac: true
  
  monitoring:
    prometheus: true
    grafana: false
