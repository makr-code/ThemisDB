// ThemisDB Wire Protocol v1 - Protocol Buffers Definitions
// Version: 1.0.0
// Date: December 4, 2025

syntax = "proto3";

package themis.wire.v1;

option optimize_for = SPEED;
option cc_enable_arenas = true;

// =============================================================================
// Connection Lifecycle Messages
// =============================================================================

message HelloRequest {
  uint32 protocol_version = 1;  // 1 = v1
  string client_name = 2;        // "themis-python-native/1.0"
  string client_version = 3;     // "1.0.0"
  repeated string capabilities = 4; // ["compression", "tls", "streaming"]
}

message HelloAck {
  uint32 protocol_version = 1;
  string server_version = 2;     // "ThemisDB/1.0.0"
  repeated string capabilities = 3;
  bool auth_required = 4;
  string session_id = 5;         // Unique session identifier
}

message AuthRequest {
  string challenge = 1;          // SCRAM-SHA-256 challenge
  repeated string mechanisms = 2; // ["SCRAM-SHA-256", "PLAIN"]
}

message AuthResponse {
  string username = 1;
  string password_hash = 2;      // Hashed password (SCRAM-SHA-256)
  string namespace = 3;          // Default: "default"
  map<string, string> metadata = 4; // Client metadata (hostname, etc.)
  string mechanism = 5;          // Selected auth mechanism
}

message AuthSuccess {
  string user_id = 1;
  repeated string roles = 2;     // User roles
  map<string, string> session_params = 3; // Session configuration
}

message AuthFailure {
  uint32 error_code = 1;
  string error_message = 2;
}

// =============================================================================
// Core CRUD Messages
// =============================================================================

message GetRequest {
  string model = 1;              // "documents"
  string collection = 2;         // "articles"
  string uuid = 3;               // "doc_12345"
  bool decrypt = 4;              // Return decrypted entity
  repeated string fields = 5;    // Projection (empty = all fields)
  uint64 version = 6;            // Read specific MVCC version (0 = latest)
}

message GetResponse {
  bool found = 1;
  bytes entity = 2;              // Serialized entity (JSON or Protobuf)
  uint64 version = 3;            // MVCC version
  uint64 timestamp_ns = 4;       // Creation timestamp (nanoseconds since epoch)
  map<string, string> metadata = 5; // Entity metadata
}

message PutRequest {
  string model = 1;
  string collection = 2;
  string uuid = 3;
  bytes entity = 4;              // Serialized entity
  bool encrypt = 5;              // Enable encryption
  uint64 expected_version = 6;   // CAS (0 = any, >0 = require match)
  map<string, string> metadata = 7; // Custom metadata
}

message PutResponse {
  bool success = 1;
  uint64 version = 2;            // New MVCC version
  string error = 3;              // Error message (if success=false)
  uint64 timestamp_ns = 4;       // Write timestamp
}

message DeleteRequest {
  string model = 1;
  string collection = 2;
  string uuid = 3;
  uint64 expected_version = 4;   // CAS (0 = any)
}

message DeleteResponse {
  bool success = 1;
  uint64 deleted_version = 2;    // Version of deleted entity
  string error = 3;
}

message BatchGetRequest {
  string model = 1;
  string collection = 2;
  repeated string uuids = 3;     // Batch of UUIDs
  bool decrypt = 4;
  repeated string fields = 5;
}

message BatchGetResponse {
  repeated GetResponse results = 1; // Ordered by request UUIDs
  uint32 found_count = 2;
  uint32 not_found_count = 3;
}

message BatchPutRequest {
  string model = 1;
  string collection = 2;
  repeated PutItem items = 3;
}

message PutItem {
  string uuid = 1;
  bytes entity = 2;
  bool encrypt = 3;
  uint64 expected_version = 4;
}

message BatchPutResponse {
  repeated PutResponse results = 1;
  uint32 success_count = 2;
  uint32 failure_count = 3;
}

// =============================================================================
// Query Messages
// =============================================================================

message QueryRequest {
  string aql = 1;                // AQL query string
  map<string, Value> bind_vars = 2; // Bind variables
  uint32 batch_size = 3;         // Results per batch (default: 100)
  bool stream = 4;               // Enable cursor streaming
  uint64 timeout_ms = 5;         // Query timeout (0 = no timeout)
}

message QueryResult {
  repeated bytes results = 1;    // Array of serialized entities
  bool has_more = 2;             // More results available
  string cursor_id = 3;          // Cursor ID (if has_more=true)
  uint64 total_count = 4;        // Total result count (if available)
  uint64 query_time_us = 5;      // Query execution time (microseconds)
  QueryStats stats = 6;          // Query execution statistics
}

message QueryStats {
  uint64 scanned_documents = 1;
  uint64 returned_documents = 2;
  uint64 index_hits = 3;
  uint64 cache_hits = 4;
}

message CursorNextRequest {
  string cursor_id = 1;
  uint32 batch_size = 2;
}

message CursorCloseRequest {
  string cursor_id = 1;
}

// =============================================================================
// Transaction Messages
// =============================================================================

message TransactionBeginRequest {
  string namespace = 1;
  repeated string collections = 2; // Collections to lock
  uint64 timeout_ms = 3;         // Transaction timeout
  string isolation_level = 4;    // "read_committed", "snapshot"
}

message TransactionBeginResponse {
  string transaction_id = 1;
  uint64 timestamp_ns = 2;       // Transaction start time
}

message TransactionCommitRequest {
  string transaction_id = 1;
}

message TransactionCommitResponse {
  bool success = 1;
  uint64 commit_timestamp_ns = 2;
  string error = 3;
}

message TransactionAbortRequest {
  string transaction_id = 1;
}

message TransactionAbortResponse {
  bool success = 1;
}

// =============================================================================
// Vector Search Messages
// =============================================================================

message VectorSearchRequest {
  string collection = 1;
  repeated float vector = 2;     // Query vector (384-dim, etc.)
  uint32 k = 3;                  // Top-k results
  DistanceMetric distance_metric = 4;
  map<string, Value> filters = 5; // Document filters (AQL-like)
  uint32 ef_search = 6;          // HNSW search parameter
}

enum DistanceMetric {
  COSINE = 0;
  EUCLIDEAN = 1;
  DOT_PRODUCT = 2;
  MANHATTAN = 3;
}

message VectorSearchResponse {
  repeated VectorResult results = 1;
  uint64 search_time_us = 2;
}

message VectorResult {
  string uuid = 1;
  float distance = 2;
  bytes entity = 3;              // Document content
  uint64 vector_id = 4;          // Internal vector ID
}

// =============================================================================
// Geospatial Messages
// =============================================================================

message GeoQueryRequest {
  string collection = 1;
  oneof query {
    BoundingBox bbox = 2;
    RadiusSearch radius = 3;
    PolygonSearch polygon = 4;
  }
  uint32 limit = 5;
  map<string, Value> filters = 6;
}

message BoundingBox {
  double min_lat = 1;
  double min_lon = 2;
  double max_lat = 3;
  double max_lon = 4;
}

message RadiusSearch {
  double center_lat = 1;
  double center_lon = 2;
  double radius_meters = 3;
}

message PolygonSearch {
  repeated GeoPoint vertices = 1;
}

message GeoPoint {
  double latitude = 1;
  double longitude = 2;
}

message GeoQueryResponse {
  repeated GeoResult results = 1;
  uint64 query_time_us = 2;
}

message GeoResult {
  string uuid = 1;
  double latitude = 2;
  double longitude = 3;
  bytes entity = 4;
  double distance_meters = 5;    // Distance from query point/edge
}

// =============================================================================
// Time-Series Messages
// =============================================================================

message TimeSeriesQueryRequest {
  string collection = 1;
  uint64 start_time_ns = 2;      // Start timestamp (nanoseconds since epoch)
  uint64 end_time_ns = 3;        // End timestamp
  Aggregation aggregation = 4;
  uint64 bucket_size_ns = 5;     // Time bucket size (nanoseconds)
  map<string, Value> filters = 6; // Additional filters
}

enum Aggregation {
  AVG = 0;
  SUM = 1;
  MIN = 2;
  MAX = 3;
  COUNT = 4;
  STDDEV = 5;
  PERCENTILE_50 = 6;
  PERCENTILE_95 = 7;
  PERCENTILE_99 = 8;
}

message TimeSeriesQueryResponse {
  repeated TimeSeriesBucket buckets = 1;
  uint64 query_time_us = 2;
  TimeSeriesStats stats = 3;
}

message TimeSeriesBucket {
  uint64 timestamp_ns = 1;       // Bucket start time
  double value = 2;              // Aggregated value
  uint64 count = 3;              // Number of data points
  double min = 4;                // Min value in bucket (optional)
  double max = 5;                // Max value in bucket (optional)
}

message TimeSeriesStats {
  uint64 total_data_points = 1;
  uint64 buckets_returned = 2;
  double data_density = 3;       // Points per bucket average
}

// =============================================================================
// BPMN Process Messages
// =============================================================================

message BpmnStartProcessRequest {
  string process_definition_key = 1;
  map<string, Value> variables = 2;
  string business_key = 3;       // Optional business identifier
}

message BpmnStartProcessResponse {
  string process_instance_id = 1;
  ProcessStatus status = 2;
  repeated string active_task_ids = 3;
}

enum ProcessStatus {
  RUNNING = 0;
  COMPLETED = 1;
  FAILED = 2;
  SUSPENDED = 3;
  TERMINATED = 4;
}

message BpmnTaskCompleteRequest {
  string task_id = 1;
  map<string, Value> variables = 2;
  string assignee = 3;           // User completing task
}

message BpmnTaskCompleteResponse {
  bool success = 1;
  string next_task_id = 2;       // Next task in flow (if any)
  string error = 3;
}

message BpmnQueryInstanceRequest {
  string process_instance_id = 1;
  bool include_variables = 2;
  bool include_history = 3;
}

message BpmnQueryInstanceResponse {
  ProcessStatus status = 1;
  repeated BpmnTask active_tasks = 2;
  map<string, Value> variables = 3;
  repeated BpmnHistoryEvent history = 4;
  uint64 start_time_ns = 5;
  uint64 end_time_ns = 6;        // 0 if still running
}

message BpmnTask {
  string task_id = 1;
  string task_name = 2;
  string task_type = 3;          // "userTask", "serviceTask", etc.
  string assignee = 4;
  uint64 created_at_ns = 5;
}

message BpmnHistoryEvent {
  string event_type = 1;         // "task_completed", "gateway_passed", etc.
  uint64 timestamp_ns = 2;
  map<string, Value> data = 3;
}

// =============================================================================
// Generic Value Type (for bind vars, filters, etc.)
// =============================================================================

message Value {
  oneof kind {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    ValueList list_value = 6;
    ValueMap map_value = 7;
  }
}

message ValueList {
  repeated Value values = 1;
}

message ValueMap {
  map<string, Value> fields = 1;
}

// =============================================================================
// Error Messages
// =============================================================================

message ErrorResponse {
  uint32 error_code = 1;         // ThemisDB error codes
  string error_message = 2;
  string error_detail = 3;       // Stack trace (debug mode)
  map<string, string> context = 4; // Additional error context
}

message OkResponse {
  string message = 1;            // Optional success message
}

// =============================================================================
// Utility Messages
// =============================================================================

message PingRequest {
  uint64 timestamp_ns = 1;
}

message PongResponse {
  uint64 timestamp_ns = 1;       // Echo client timestamp
  uint64 server_timestamp_ns = 2; // Server timestamp
}

message CloseRequest {
  string reason = 1;             // Optional close reason
}

message CloseAck {
  string message = 1;
}
