site_name: ThemisDB Dokumentation
site_description: Offizielle Dokumentation für ThemisDB v1.3.5 (Architektur, Storage, Query/AQL, Sicherheit, APIs und Betrieb)
site_url: https://makr-code.github.io/ThemisDB/
repo_name: makr-code/ThemisDB
repo_url: https://github.com/makr-code/ThemisDB
edit_uri: ''

theme:
  name: material
  language: de
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
    - search:
        lang: de
    - with-pdf:
            output_path: artifacts/docs/ThemisDB-Documentation-v1.3.5.pdf
            cover_title: "ThemisDB Dokumentation"
            cover_subtitle: "Version 1.3.5"
            toc_title: "Inhaltsverzeichnis"
            toc_depth: 3
            enabled_if_env: ENABLE_PDF_EXPORT
    - print-site:
            add_to_navigation: true
            print_page_title: 'Gesamte Dokumentation (Druckansicht)'
            add_print_site_banner: true
            print_site_banner_template: "docs/print-banner.html"
            enumerate_headings: true
            enumerate_figures: true
            add_table_of_contents: true
            toc_title: 'Inhaltsverzeichnis'
            toc_depth: 3
            add_full_urls: false
            add_cover_page: true
            cover_page_template: "docs/print-cover.html"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3

