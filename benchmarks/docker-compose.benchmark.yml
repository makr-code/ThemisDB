version: '3.8'

services:
  # =========================================================================
  # ThemisDB - Multi-Model Database
  # =========================================================================
  themis:
    image: themis-db:wire-protocol-latest
    container_name: benchmark_themis
    ports:
      - "8765:8765"  # HTTP API
      - "8766:8766"  # Wire Protocol
    volumes:
      - themis_data:/data
    networks:
      - benchmark_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  # =========================================================================
  # PostgreSQL - Relational Database
  # =========================================================================
  postgresql:
    image: postgres:16
    container_name: benchmark_postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benchmark
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - benchmark_net
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "work_mem=50MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  # =========================================================================
  # MongoDB - Document Database
  # =========================================================================
  mongodb:
    image: mongo:7.0
    container_name: benchmark_mongodb
    environment:
      MONGO_INITDB_DATABASE: benchmark
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - benchmark_net
    command: ["mongod", "--wiredTigerCacheSizeGB", "2"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  # =========================================================================
  # Redis - In-Memory Key-Value Store
  # =========================================================================
  redis:
    image: redis:7.2
    container_name: benchmark_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - benchmark_net
    command: ["redis-server", "--maxmemory", "2gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

  # =========================================================================
  # Elasticsearch - Search & Analytics
  # =========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: benchmark_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - benchmark_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G

networks:
  benchmark_net:
    driver: bridge

volumes:
  themis_data:
  postgres_data:
  mongo_data:
  redis_data:
  elastic_data:
