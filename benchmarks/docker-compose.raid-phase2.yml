version: '3.8'

services:
  # Phase 2: RAID Under Load - RAID5 with Wikipedia Data
  themis-raid-parity-node-0:
    image: themisdb:latest
    container_name: themis-raid-parity-node-0
    hostname: themis-raid-parity-0
    ports:
      - "8710:8765"
    volumes:
      - raid_parity_node0:/data
      - ./wikipedia-data:/wikipedia:ro  # Wikipedia dump mounted read-only
    environment:
      - THEMIS_RAID_LEVEL=parity
      - THEMIS_SHARD_KEY=shard_0
      - THEMIS_REPLICA_COUNT=2
      - THEMIS_NODE_ID=0
      - THEMIS_CLUSTER_SIZE=5
      - THEMIS_CLUSTER_NAME=raid-parity-load-test
      - THEMIS_PEER_NODES=themis-raid-parity-node-1,themis-raid-parity-node-2,themis-raid-parity-node-3,themis-raid-parity-node-4
      - THEMIS_STRIPE_SIZE=65536
      - THEMIS_PARITY_BLOCKS=1
      - THEMIS_ENABLE_COMPRESSION=true
      - THEMIS_ENABLE_METRICS=true
    networks:
      - themis-raid-load
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  themis-raid-parity-node-1:
    image: themisdb:latest
    container_name: themis-raid-parity-node-1
    hostname: themis-raid-parity-1
    ports:
      - "8711:8765"
    volumes:
      - raid_parity_node1:/data
      - ./wikipedia-data:/wikipedia:ro
    environment:
      - THEMIS_RAID_LEVEL=parity
      - THEMIS_SHARD_KEY=shard_1
      - THEMIS_REPLICA_COUNT=2
      - THEMIS_NODE_ID=1
      - THEMIS_CLUSTER_SIZE=5
      - THEMIS_CLUSTER_NAME=raid-parity-load-test
      - THEMIS_PEER_NODES=themis-raid-parity-node-0,themis-raid-parity-node-2,themis-raid-parity-node-3,themis-raid-parity-node-4
      - THEMIS_STRIPE_SIZE=65536
      - THEMIS_PARITY_BLOCKS=1
      - THEMIS_ENABLE_COMPRESSION=true
      - THEMIS_ENABLE_METRICS=true
    networks:
      - themis-raid-load
    depends_on:
      - themis-raid-parity-node-0
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  themis-raid-parity-node-2:
    image: themisdb:latest
    container_name: themis-raid-parity-node-2
    hostname: themis-raid-parity-2
    ports:
      - "8712:8765"
    volumes:
      - raid_parity_node2:/data
      - ./wikipedia-data:/wikipedia:ro
    environment:
      - THEMIS_RAID_LEVEL=parity
      - THEMIS_SHARD_KEY=shard_2
      - THEMIS_REPLICA_COUNT=2
      - THEMIS_NODE_ID=2
      - THEMIS_CLUSTER_SIZE=5
      - THEMIS_CLUSTER_NAME=raid-parity-load-test
      - THEMIS_PEER_NODES=themis-raid-parity-node-0,themis-raid-parity-node-1,themis-raid-parity-node-3,themis-raid-parity-node-4
      - THEMIS_STRIPE_SIZE=65536
      - THEMIS_PARITY_BLOCKS=1
      - THEMIS_ENABLE_COMPRESSION=true
      - THEMIS_ENABLE_METRICS=true
    networks:
      - themis-raid-load
    depends_on:
      - themis-raid-parity-node-0
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  themis-raid-parity-node-3:
    image: themisdb:latest
    container_name: themis-raid-parity-node-3
    hostname: themis-raid-parity-3
    ports:
      - "8713:8765"
    volumes:
      - raid_parity_node3:/data
      - ./wikipedia-data:/wikipedia:ro
    environment:
      - THEMIS_RAID_LEVEL=parity
      - THEMIS_SHARD_KEY=shard_3
      - THEMIS_REPLICA_COUNT=2
      - THEMIS_NODE_ID=3
      - THEMIS_CLUSTER_SIZE=5
      - THEMIS_CLUSTER_NAME=raid-parity-load-test
      - THEMIS_PEER_NODES=themis-raid-parity-node-0,themis-raid-parity-node-1,themis-raid-parity-node-2,themis-raid-parity-node-4
      - THEMIS_STRIPE_SIZE=65536
      - THEMIS_PARITY_BLOCKS=1
      - THEMIS_ENABLE_COMPRESSION=true
      - THEMIS_ENABLE_METRICS=true
    networks:
      - themis-raid-load
    depends_on:
      - themis-raid-parity-node-0
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  themis-raid-parity-node-4:
    image: themisdb:latest
    container_name: themis-raid-parity-node-4
    hostname: themis-raid-parity-4
    ports:
      - "8714:8765"
    volumes:
      - raid_parity_node4:/data
      - ./wikipedia-data:/wikipedia:ro
    environment:
      - THEMIS_RAID_LEVEL=parity
      - THEMIS_SHARD_KEY=shard_4
      - THEMIS_REPLICA_COUNT=2
      - THEMIS_NODE_ID=4
      - THEMIS_CLUSTER_SIZE=5
      - THEMIS_CLUSTER_NAME=raid-parity-load-test
      - THEMIS_PEER_NODES=themis-raid-parity-node-0,themis-raid-parity-node-1,themis-raid-parity-node-2,themis-raid-parity-node-3
      - THEMIS_STRIPE_SIZE=65536
      - THEMIS_PARITY_BLOCKS=1
      - THEMIS_ENABLE_COMPRESSION=true
      - THEMIS_ENABLE_METRICS=true
    networks:
      - themis-raid-load
    depends_on:
      - themis-raid-parity-node-0
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  # Monitoring Stack for Load Testing
  prometheus-raid-load:
    image: prom/prometheus:latest
    container_name: prometheus-raid-load
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus-raid-load.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_raid_load_data:/prometheus
    networks:
      - themis-raid-load
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'

  grafana-raid-load:
    image: grafana/grafana:latest
    container_name: grafana-raid-load
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_raid_load_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - themis-raid-load
    depends_on:
      - prometheus-raid-load

  # Log Collection (optional but useful for debugging)
  loki-raid-load:
    image: grafana/loki:latest
    container_name: loki-raid-load
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_raid_load_data:/loki
    networks:
      - themis-raid-load
    command: -config.file=/etc/loki/local-config.yml

volumes:
  raid_parity_node0:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=500GB"
  raid_parity_node1:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=500GB"
  raid_parity_node2:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=500GB"
  raid_parity_node3:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=500GB"
  raid_parity_node4:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=500GB"
  prometheus_raid_load_data:
  grafana_raid_load_data:
  loki_raid_load_data:

networks:
  themis-raid-load:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.10.0/24
