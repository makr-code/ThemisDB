# Lightweight Benchmark Environment - 4 Core Databases
# Optimized for: 30GB free disk space, 16GB RAM
# Total Memory Usage: ~10GB (4 DBs × 2-4GB)

version: '3.8'

services:
  # ============================================================================
  # ThemisDB - Multi-Model Unified Database
  # ============================================================================
  themisdb:
    image: themisdb/themisdb:latest
    container_name: benchmark-themisdb
    ports:
      - "8765:8765"  # HTTP REST API
      - "8766:8766"  # Wire Protocol (Native Binary)
    volumes:
      - themisdb-data:/data
    environment:
      - THEMIS_LOG_LEVEL=info
      - THEMIS_DATA_PATH=/data
      - THEMIS_MAX_MEMORY=4G
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8765/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - benchmark-net

  # ============================================================================
  # PostgreSQL 16 + pgvector Extension
  # ============================================================================
  postgresql:
    image: ankane/pgvector:latest  # PostgreSQL 16 with pgvector
    container_name: benchmark-postgresql
    ports:
      - "5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark123
      POSTGRES_DB: benchmark
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - benchmark-net

  # ============================================================================
  # Elasticsearch 8 (Hybrid Search: Full-Text + kNN Vector)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: benchmark-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.routing.allocation.disk.threshold_enabled=false
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - benchmark-net

  # ============================================================================
  # MongoDB 7 (Document Store)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: benchmark-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: benchmark
      MONGO_INITDB_ROOT_PASSWORD: benchmark123
    command: mongod --wiredTigerCacheSizeGB 1
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - benchmark-net

  # ============================================================================
  # Optional: ClickHouse (OLAP Time-Series) - Uncomment if needed
  # ============================================================================
  # clickhouse:
  #   image: clickhouse/clickhouse-server:latest
  #   container_name: benchmark-clickhouse
  #   ports:
  #     - "8123:8123"
  #     - "9000:9000"
  #   volumes:
  #     - clickhouse-data:/var/lib/clickhouse
  #   environment:
  #     CLICKHOUSE_USER: benchmark
  #     CLICKHOUSE_PASSWORD: benchmark123
  #     CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '2'
  #         memory: 2G
  #   networks:
  #     - benchmark-net

volumes:
  themisdb-data:
    driver: local
  postgresql-data:
    driver: local
  elasticsearch-data:
    driver: local
  mongodb-data:
    driver: local
  # clickhouse-data:
  #   driver: local

networks:
  benchmark-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
