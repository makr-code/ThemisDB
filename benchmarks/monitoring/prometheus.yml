# Prometheus Configuration for Multi-Shard ThemisDB Monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'themis-benchmark'
    environment: 'test'

# Alerting configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files
rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  # ThemisDB Shards Metrics (HTTP endpoint on port 8765)
  - job_name: 'themis-shards'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'themis-shard-0:8765'
          - 'themis-shard-1:8765'
          - 'themis-shard-2:8765'
          - 'themis-shard-3:8765'
          - 'themis-shard-4:8765'
          - 'themis-shard-5:8765'
        labels:
          cluster: 'themis-benchmark'
          datacenter: 'dc_1'
    relabel_configs:
      - source_labels: [__address__]
        regex: 'themis-shard-(\d+):.*'
        target_label: shard_id
        replacement: 'shard_$1'

  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'benchmark-host'

  # Prometheus Self-Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
