version: '3.8'

services:
  # Phase 1: Pure RAID Cluster - RAID1 (Mirroring)
  themis-raid-mirror-node-0:
    image: themisdb:latest
    container_name: themis-raid-mirror-node-0
    hostname: themis-raid-node-0
    ports:
      - "8700:8765"
    volumes:
      - raid_mirror_node0:/data
    environment:
      - THEMIS_RAID_LEVEL=mirror
      - THEMIS_SHARD_KEY=shard_0
      - THEMIS_REPLICA_COUNT=2
      - THEMIS_NODE_ID=0
      - THEMIS_CLUSTER_SIZE=3
      - THEMIS_CLUSTER_NAME=raid-mirror-test
      - THEMIS_PEER_NODES=themis-raid-mirror-node-1,themis-raid-mirror-node-2
    networks:
      - themis-raid
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  themis-raid-mirror-node-1:
    image: themisdb:latest
    container_name: themis-raid-mirror-node-1
    hostname: themis-raid-node-1
    ports:
      - "8701:8765"
    volumes:
      - raid_mirror_node1:/data
    environment:
      - THEMIS_RAID_LEVEL=mirror
      - THEMIS_SHARD_KEY=shard_1
      - THEMIS_REPLICA_COUNT=2
      - THEMIS_NODE_ID=1
      - THEMIS_CLUSTER_SIZE=3
      - THEMIS_CLUSTER_NAME=raid-mirror-test
      - THEMIS_PEER_NODES=themis-raid-mirror-node-0,themis-raid-mirror-node-2
    networks:
      - themis-raid
    depends_on:
      - themis-raid-mirror-node-0
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  themis-raid-mirror-node-2:
    image: themisdb:latest
    container_name: themis-raid-mirror-node-2
    hostname: themis-raid-node-2
    ports:
      - "8702:8765"
    volumes:
      - raid_mirror_node2:/data
    environment:
      - THEMIS_RAID_LEVEL=mirror
      - THEMIS_SHARD_KEY=shard_2
      - THEMIS_REPLICA_COUNT=2
      - THEMIS_NODE_ID=2
      - THEMIS_CLUSTER_SIZE=3
      - THEMIS_CLUSTER_NAME=raid-mirror-test
      - THEMIS_PEER_NODES=themis-raid-mirror-node-0,themis-raid-mirror-node-1
    networks:
      - themis-raid
    depends_on:
      - themis-raid-mirror-node-0
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Monitoring: Prometheus for metrics collection
  prometheus-raid:
    image: prom/prometheus:latest
    container_name: prometheus-raid
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-raid.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_raid_data:/prometheus
    networks:
      - themis-raid
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'

  # Monitoring: Grafana for visualization
  grafana-raid:
    image: grafana/grafana:latest
    container_name: grafana-raid
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_raid_data:/var/lib/grafana
    networks:
      - themis-raid
    depends_on:
      - prometheus-raid

volumes:
  raid_mirror_node0:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=50GB"
  raid_mirror_node1:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=50GB"
  raid_mirror_node2:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=50GB"
  prometheus_raid_data:
  grafana_raid_data:

networks:
  themis-raid:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.9.0/24
