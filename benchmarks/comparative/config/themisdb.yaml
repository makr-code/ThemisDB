# ThemisDB Configuration for Comparative Benchmarks
# Optimized for fair comparison with other databases

server:
  host: 0.0.0.0
  port: 8765
  worker_threads: 4

storage:
  rocksdb_path: /data/rocksdb
  memtable_size_mb: 256
  block_cache_size_mb: 1024
  enable_blobdb: true
  compression:
    default: lz4
    bottommost: zstd
  wal:
    enabled: true
    sync_mode: batch

vector_index:
  engine: hnsw
  hnsw_m: 16
  hnsw_ef_construction: 200
  use_gpu: false

features:
  semantic_cache: false  # Disabled for fair comparison
  llm_store: false       # Disabled for fair comparison
  cdc: true

logging:
  level: info
  format: json

metrics:
  enabled: true
  prometheus_port: 9090
