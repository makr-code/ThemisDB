version: '3.9'

services:
  # ============================================================================
  # CORE INFRASTRUCTURE
  # ============================================================================
  
  themis_vector:
    image: themis-db:v1.0.1-nightly
    container_name: themis-llm-integration
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      # Vector Index Configuration
      - VECTOR_INDEX_TYPE=hnsw
      - HNSW_M=32
      - HNSW_EF=200
      - HNSW_SEED=42
      - INDEX_BUILD_PARALLELISM=8
      
      # Sharding Configuration
      - SHARD_COUNT=4
      - SHARD_STRATEGY=hash
      - REPLICATION_FACTOR=2
      
      # Performance Tuning
      - BATCH_SIZE=32
      - VECTOR_CACHE_SIZE_MB=2048
      - QUERY_CACHE_SIZE_MB=1024
      - MAX_CONCURRENT_QUERIES=50
      
      # Logging
      - LOG_LEVEL=info
      - METRICS_ENABLED=true
    volumes:
      - themis_data:/var/lib/themis
      - themis_logs:/var/log/themis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-integration
    cpus: '8'
    mem_limit: 16g
    depends_on:
      - prometheus

  # ============================================================================
  # EMBEDDING & CACHING LAYER
  # ============================================================================
  
  embedding_cache:
    image: redis:7-alpine
    container_name: embedding-cache
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cache:/data
    networks:
      - llm-integration
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # LOCAL LLM PROVIDERS
  # ============================================================================
  
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-llm-server
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_NUM_GPU=1
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - llm-integration
    cpus: '8'
    mem_limit: 16g
    # GPU support (optional - requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # vLLM Server (alternative faster inference)
  vllm_server:
    image: vllm/vllm-openai:latest
    container_name: vllm-inference
    ports:
      - "8001:8000"
    environment:
      - MODEL_NAME=mistralai/Mistral-7B-Instruct-v0.2
      - CUDA_VISIBLE_DEVICES=0
      - TENSOR_PARALLEL_SIZE=1
      - GPU_MEMORY_UTILIZATION=0.9
    volumes:
      - vllm_models:/root/.cache/huggingface
    networks:
      - llm-integration
    cpus: '8'
    mem_limit: 16g
    # GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - themis_vector

  # ============================================================================
  # MONITORING & OBSERVABILITY
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-metrics
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-llm-integration.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - llm-integration
    cpus: '2'
    mem_limit: 4g

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dashboard
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - llm-integration
    depends_on:
      - prometheus
    cpus: '1'
    mem_limit: 2g

  loki:
    image: grafana/loki:latest
    container_name: loki-logs
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - llm-integration
    cpus: '1'
    mem_limit: 2g

  # ============================================================================
  # SUPPORTING SERVICES
  # ============================================================================
  
  # PostgreSQL for relational metadata
  postgres_metadata:
    image: postgres:15-alpine
    container_name: postgres-metadata
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=themis_metadata
      - POSTGRES_USER=themis
      - POSTGRES_PASSWORD=themis_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema_metadata.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - llm-integration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themis"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: '2'
    mem_limit: 4g

  # Milvus for comparison benchmarking
  milvus_comparison:
    image: milvusdb/milvus:latest
    container_name: milvus-comparison
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - COMMON_STORAGETYPE=local
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - llm-integration
    depends_on:
      - etcd
      - minio
    cpus: '4'
    mem_limit: 8g

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd-milvus
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    networks:
      - llm-integration
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    cpus: '1'
    mem_limit: 2g

  minio:
    image: minio/minio:latest
    container_name: minio-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/minio_data
    networks:
      - llm-integration
    command: minio server /minio_data --console-address ":9001"
    cpus: '2'
    mem_limit: 4g

  # Pinecone Mock (for API testing)
  pinecone_mock:
    image: mockserver/mockserver:latest
    container_name: pinecone-mock
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/pinecone-mock.json
    volumes:
      - ./pinecone-mock-config.json:/config/pinecone-mock.json:ro
    networks:
      - llm-integration
    cpus: '1'
    mem_limit: 1g

volumes:
  themis_data:
    driver: local
  themis_logs:
    driver: local
  redis_cache:
    driver: local
  ollama_models:
    driver: local
  vllm_models:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  postgres_data:
    driver: local
  milvus_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local

networks:
  llm-integration:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.8.0/24
