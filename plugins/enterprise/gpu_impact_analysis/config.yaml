# GPU Impact Analysis Plugin Configuration
# ThemisDB Enterprise Plugin

plugin:
  id: "themis.enterprise.gpu_impact_analysis"
  name: "GPU Impact Analysis"
  version: "1.0.0"
  vendor: "ThemisDB Enterprise"
  description: "GPU-accelerated cause-effect analysis for document changes (FEM-inspired)"
  license: "enterprise"
  
  # Binary files (platform-specific)
  binary:
    windows: "themis_gpu_impact_analysis.dll"
    linux: "libthemis_gpu_impact_analysis.so"
    macos: "libthemis_gpu_impact_analysis.dylib"
  
  # Auto-load on startup
  auto_load: false
  load_priority: 50

# GPU Configuration
gpu:
  # Backend selection: auto, cuda, vulkan, hip, opencl, directx
  backend: "auto"
  
  # Device selection
  device_id: 0
  
  # Memory limits
  max_gpu_memory_mb: 4096
  
  # Fallback to CPU if GPU unavailable
  cpu_fallback: true

# FEM Propagation Configuration
fem:
  # Damping factor for impact propagation (0.0-1.0)
  # Similar to PageRank damping
  damping_factor: 0.85
  
  # Minimum impact threshold for propagation
  # Nodes with impact below this are ignored
  impact_threshold: 0.01
  
  # Maximum iterations for convergence
  max_iterations: 100
  
  # Convergence threshold
  # Stop when max change < this value
  convergence_threshold: 0.001
  
  # Temporal decay
  use_temporal_decay: true
  temporal_half_life_hours: 24.0

# Monte Carlo Simulation Configuration
monte_carlo:
  # Number of simulations for risk assessment
  num_simulations: 10000
  
  # Uncertainty factor for impact estimation
  # Standard deviation as fraction of mean
  uncertainty_factor: 0.2
  
  # Random seed (0 = random)
  random_seed: 0
  
  # Use GPU for Monte Carlo
  use_gpu: true

# Pattern Detection Configuration
pattern_detection:
  # FFT-based pattern detection
  fft:
    enabled: true
    min_pattern_frequency: 2
    significance_threshold: 0.05
  
  # DTW-based similarity search
  dtw:
    enabled: true
    window_size: -1  # -1 = auto (Sakoe-Chiba band)
    distance_metric: "euclidean"
  
  # Anomaly detection
  anomaly:
    enabled: true
    algorithm: "isolation_forest"  # isolation_forest, autoencoder, statistical
    contamination: 0.01  # Expected anomaly ratio
    confidence_threshold: 0.95

# Time Series Forecasting Configuration
forecasting:
  # Algorithm: arima, prophet, lstm, linear
  algorithm: "arima"
  
  # ARIMA parameters (auto-detect if not specified)
  arima:
    p: -1  # AR order (-1 = auto)
    d: -1  # Integration order (-1 = auto)
    q: -1  # MA order (-1 = auto)
  
  # Confidence level for prediction intervals
  confidence_level: 0.95
  
  # Use GPU for forecasting
  use_gpu: true

# Performance Configuration
performance:
  # Number of worker threads for CPU operations
  num_threads: -1  # -1 = auto (CPU cores)
  
  # Batch size for GPU operations
  gpu_batch_size: 1000
  
  # Enable performance metrics collection
  collect_metrics: true
  
  # Cache size for graph structures (MB)
  graph_cache_size_mb: 512

# Logging Configuration
logging:
  # Log level: trace, debug, info, warn, error, critical
  level: "info"
  
  # Include timing information
  include_timing: true
  
  # Log file path (empty = stdout only)
  file_path: ""
  
  # Audit logging for enterprise compliance
  audit:
    enabled: true
    log_all_analyses: false
    log_high_impact_only: true
    high_impact_threshold: 0.8

# Integration Configuration
integration:
  # ThemisDB connection
  themisdb:
    # Graph index to use for impact propagation
    default_graph: "document_dependencies"
    
    # Use graph cache
    use_cache: true
    cache_ttl_seconds: 3600
  
  # External services
  external:
    # Notification service for high-impact changes
    notifications:
      enabled: false
      webhook_url: ""
      high_impact_threshold: 0.9
    
    # Export results to external analytics
    export:
      enabled: false
      format: "json"  # json, csv, parquet
      destination: ""

# Security Configuration
security:
  # Require license key for activation
  require_license: true
  
  # License validation endpoint
  license_validation_url: ""
  
  # Audit all plugin operations
  audit_all_operations: true
  
  # Sandbox plugin execution
  sandbox_enabled: true
  
  # Resource limits
  limits:
    max_memory_mb: 8192
    max_cpu_time_sec: 300
    max_concurrent_analyses: 10

# Examples and Presets
presets:
  # Low impact threshold (catch everything)
  sensitive:
    fem:
      impact_threshold: 0.001
      damping_factor: 0.9
    
  # High impact threshold (only significant changes)
  conservative:
    fem:
      impact_threshold: 0.1
      damping_factor: 0.7
  
  # Balanced (default)
  balanced:
    fem:
      impact_threshold: 0.01
      damping_factor: 0.85
  
  # Fast (fewer iterations, GPU-only)
  fast:
    fem:
      max_iterations: 50
      convergence_threshold: 0.01
    monte_carlo:
      num_simulations: 1000
    gpu:
      cpu_fallback: false

# Metadata
metadata:
  created: "2025-12-07"
  updated: "2025-12-07"
  schema_version: "1.0"
