# Wilhelm Dilthey - Lebensphilosophie / Hermeneutik
# Verstehen, Geisteswissenschaften, Erlebnis

school: lebensphilosophie_dilthey
name: "Diltheysche Lebensphilosophie"
philosopher_name: "Wilhelm Dilthey"
philosopher_life: "1833-1911"
nationality: "Deutsch"

description: |
  Hermeneutische Philosophie, die das Verstehen menschlicher Ausdrucksformen und die 
  Methodik der Geisteswissenschaften untersucht. Leben und Erleben als Ausgangspunkt.

# Hauptthesen
main_theses:
  geisteswissenschaften:
    title: "Geisteswissenschaften vs. Naturwissenschaften"
    description: |
      Die Geisteswissenschaften (human sciences) unterscheiden sich grundlegend von den 
      Naturwissenschaften in Gegenstand und Methode. Sie erforschen geistig-geschichtliche Welt.
    key_concepts:
      - "Geisteswissenschaften: Geschichte, Kultur, Gesellschaft"
      - "Naturwissenschaften: physikalische Welt"
      - "Eigenständige Methodik für Geisteswissenschaften"
      - "Keine Reduktion auf Naturwissenschaft"
  
  verstehen_vs_erklaeren:
    title: "Verstehen vs. Erklären"
    description: |
      Naturwissenschaften erklären (Erklären) durch Kausalgesetze. Geisteswissenschaften 
      verstehen (Verstehen) durch Nacherleben und Interpretation von Bedeutungen.
    key_concepts:
      - "Verstehen: Nacherleben, Interpretation"
      - "Erklären: Kausalität, Gesetze"
      - "Sinnzusammenhänge vs. Ursache-Wirkungs-Ketten"
      - "Hermeneutische Methode"
  
  erlebnis:
    title: "Erlebnis (Lived Experience)"
    description: |
      Das Erlebnis ist die Grundeinheit der Geisteswissenschaften. Im Erleben ist das 
      Subjekt unmittelbar mit sich selbst und der Welt verbunden.
    key_concepts:
      - "Unmittelbare Selbstgegebenheit"
      - "Erlebnis als Basis des Verstehens"
      - "Leben drückt sich in Erlebnissen aus"
      - "Strukturzusammenhang des Erlebens"
  
  historical_consciousness:
    title: "Geschichtliches Bewusstsein"
    description: |
      Der Mensch ist ein geschichtliches Wesen. Unser Denken und Handeln ist durchdrungen 
      von historischer Bedingtheit. Kein Standpunkt außerhalb der Geschichte.
    key_concepts:
      - "Geschichtlichkeit des Menschen"
      - "Relativität historischer Standpunkte"
      - "Geschichte als Selbstbesinnung des Menschen"
      - "Keine überzeitlichen Wahrheiten"
  
  hermeneutic_circle:
    title: "Hermeneutischer Zirkel"
    description: |
      Das Verstehen bewegt sich zirkulär zwischen Teil und Ganzem. Wir verstehen Teile 
      durch das Ganze und das Ganze durch die Teile.
    key_concepts:
      - "Wechselspiel von Teil und Ganzem"
      - "Vorverständnis und Interpretation"
      - "Horizontverschmelzung"
      - "Zirkelstruktur des Verstehens"

# Nebenthesen
secondary_theses:
  structural_psychology:
    title: "Strukturpsychologie"
    description: |
      Das Seelenleben ist ein Strukturzusammenhang, kein Bündel atomarer Elemente. 
      Verstehen erfasst diesen ganzheitlichen Zusammenhang.
  
  types_of_worldview:
    title: "Weltanschauungstypen"
    description: |
      Drei Grundtypen der Weltanschauung: Naturalismus (Materialismus), Idealismus der 
      Freiheit, objektiver Idealismus. Sie sind nicht widerlegbar, nur verstehbar.
  
  expression:
    title: "Ausdruck (Expression)"
    description: |
      Leben drückt sich aus in objektivierten Formen (Texte, Kunst, Institutionen). 
      Diese Ausdrucksformen sind Gegenstand des Verstehens.
  
  autobiography:
    title: "Autobiographie und Biographie"
    description: |
      Die Selbstreflexion des Lebens in Autobiographie ist ein Modell für das 
      geschichtliche Verstehen überhaupt.

# Stärken
strengths:
  - "Eigenständige Methodologie für Geisteswissenschaften"
  - "Anerkennung der Geschichtlichkeit menschlicher Existenz"
  - "Ganzheitlicher Ansatz - gegen Reduktionismus"
  - "Fundierung der Hermeneutik als Wissenschaft"
  - "Brücke zwischen Philosophie und Einzelwissenschaften"

# Schwächen
weaknesses:
  - "Gefahr des Historismus und Relativismus"
  - "Keine klaren Wahrheitskriterien"
  - "Verstehen schwer intersubjektiv zu validieren"
  - "Unterscheidung Verstehen/Erklären vielleicht zu scharf"
  - "Psychologismus-Vorwurf"

# Anwendungsbeispiel
example_application: |
  Interkultureller Dialog: Um eine fremde Kultur zu verstehen, müssen wir ihre 
  Ausdrucksformen (Rituale, Texte, Institutionen) in ihrem Lebenszusammenhang erfassen, 
  nicht durch unsere Kategorien erklären. Das Verstehen erfordert Einfühlung und die 
  Bereitschaft, den eigenen Horizont zu erweitern. Es gibt keinen neutralen Standpunkt 
  außerhalb der Geschichte, von dem aus man urteilen könnte.

# Entscheidungsrahmen
decision_framework: |
  Verstehe Handlungen in ihrem historischen und lebendigen Kontext. Interpretiere 
  Bedeutungen holistisch. Erkenne die Geschichtlichkeit aller Urteile an. Keine 
  abstrakten Universalien, sondern kontextgebundenes Verstehen.

# Kernprinzipien für Debatten
core_principles:
  - "Geisteswissenschaften vs. Naturwissenschaften"
  - "Verstehen (Interpretation) vs. Erklären (Kausalität)"
  - "Erlebnis als Basis des Verstehens"
  - "Geschichtliches Bewusstsein - Mensch als historisches Wesen"
  - "Hermeneutischer Zirkel - Teil und Ganzes"
  - "Leben drückt sich in strukturierten Formen aus"
  - "Kontextabhängigkeit von Bedeutung"

# Wichtige Werke
key_works:
  - title: "Einleitung in die Geisteswissenschaften"
    year: 1883
    description: "Grundlegung der Geisteswissenschaften"
  
  - title: "Der Aufbau der geschichtlichen Welt in den Geisteswissenschaften"
    year: 1910
    description: "Hauptwerk zur Hermeneutik"
  
  - title: "Ideen über eine beschreibende und zergliedernde Psychologie"
    year: 1894
    description: "Strukturpsychologie"
  
  - title: "Die Typen der Weltanschauung"
    year: 1911
    description: "Weltanschauungslehre"

# Relevante Dimensionen
relevant_dimensions:
  - "epistemological"    # Erkenntnistheorie
  - "methodological"     # Methodologie der Geisteswissenschaften
  - "historical"         # Geschichtlichkeit
  - "hermeneutic"        # Hermeneutik
  - "phenomenological"   # Erlebnis
