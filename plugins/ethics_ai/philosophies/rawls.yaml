## Hauptthesen / Main Theses
main_theses:
  - thesis_id: "justice_as_fairness"
    name: "Justice as Fairness (Rawls)"
    description: "Principles of justice chosen behind 'veil of ignorance'"
    explanation: |
      Two principles: (1) Equal basic liberties for all
      (2) Social and economic inequalities arranged for greatest benefit to least advantaged
      Political institutions must be fair to all citizens regardless of position.
  
  - thesis_id: "deliberative_democracy"
    name: "Deliberative Democracy (Habermas)"
    description: "Legitimate decisions through reasoned public deliberation"
    explanation: |
      Democratic legitimacy comes from free and equal deliberation among citizens.
      Decisions should be justified through reasons all can accept.
      Public sphere enables rational discourse on common concerns.
  
  - thesis_id: "political_obligation"
    name: "Political Obligation and Legitimacy"
    description: "When is political authority justified?"
    explanation: |
      Political power must be exercised in ways that citizens can reasonably accept.
      Governments derive legitimacy from serving public interest and respecting rights.

