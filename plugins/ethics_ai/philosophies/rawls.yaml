## Entscheidungsrahmen / Decision Framework
decision_framework:
  primary_test: "Public Justification Test"
  description: "Can this policy be justified to all affected citizens with reasons they could reasonably accept?"
  steps:
    - "Identify all affected stakeholders"
    - "Consider policy from each perspective"
    - "Develop reasons that respect all viewpoints"
    - "Ensure policy treats all fairly"
  
  secondary_test: "Rights and Liberty Test"
  description: "Does policy respect fundamental rights and liberties?"
  criteria:
    - "Protects basic civil and political rights"
    - "Does not unnecessarily restrict liberty"
    - "Treats citizens as free and equal"
    - "Provides fair opportunities"

## Stärken / Strengths
strengths:
  - "Provides framework for legitimate governance"
  - "Protects individual rights and freedoms"
  - "Promotes fairness and equality"
  - "Enables peaceful resolution of conflicts"
  - "Encourages civic participation"
  - "Holds leaders accountable"
  - "Applicable to domestic and international politics"

## Schwächen / Weaknesses
weaknesses:
  - "Tension between individual rights and collective good"
  - "Difficulty achieving genuine deliberation at scale"
  - "Risk of majority tyranny"
  - "Challenge of political polarization"
  - "Influence of money and power in politics"
  - "Cultural differences in political values"
  - "Gap between ideal theory and practice"

## Interne Debatten / Internal Debates
internal_debate:
  liberal_vs_communitarian:
    issue: "Should politics prioritize individual rights or community values?"
    positions:
      - "Liberalism: Individual rights and autonomy primary"
      - "Communitarianism: Community and shared values shape identity"
      - "Compromise: Balance individual and communal goods"
  
  procedural_vs_substantive:
    issue: "Is democracy primarily about procedures or outcomes?"
    positions:
      - "Proceduralist: Fair process is what matters"
      - "Substantive: Democracy must deliver just outcomes"
      - "Both: Fair process tends to produce good outcomes"
  
  ideal_vs_nonideal:
    issue: "Should political theory focus on ideal or realistic conditions?"
    positions:
      - "Ideal theory: Define perfect justice as aspiration"
      - "Non-ideal theory: Address actual injustices pragmatically"
      - "Both: Ideal guides action in non-ideal circumstances"

