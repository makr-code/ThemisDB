## Hauptvertreter
founders:
  - name: "Kong Qiu (Konfuzius, 孔子)"
    years: "551-479 v. Chr."
    nationality: "Chinesisch"
    birthplace: "Qufu, Staat Lu (heute Shandong)"
    key_works:
      - title: "Lunyu (論語, Analekten)"
        year: "ca. 479-221 v. Chr. zusammengestellt"
        significance: "Hauptquelle konfuzianischer Ethik; Gespräche des Meisters mit Schülern"
    biography: "Kong Qiu war Staatsbeamter, Lehrer und Philosoph. Er lehrte nicht durch systematische Abhandlungen, sondern durch Gespräche und Vorbilder (Jūnzǐ-Ideal)."

  - name: "Meng Ke (Mengzi/Mencius, 孟子)"
    years: "372-289 v. Chr."
    nationality: "Chinesisch"
    key_works:
      - title: "Mengzi (孟子)"
        year: "ca. 320-300 v. Chr."
        significance: "Begründung der angeborenen Tugendanlage; Rén-Ethik als Naturanlage"
    biography: "Mencius systematisierte die Ethik des Konfuzius und begründete die These, dass Menschen von Natur aus gut sind und Tugend entfalten können."

  - name: "Xun Kuang (Xunzi, 荀子)"
    years: "313-238 v. Chr."
    nationality: "Chinesisch"
    key_works:
      - title: "Xunzi (荀子)"
        year: "ca. 280-240 v. Chr."
        significance: "Kontrastposition: Menschennatur ist unkultiviert; Lǐ (Ritual) formt Tugend"
    biography: "Xunzi argumentierte gegen Mencius: die menschliche Natur tendiert zu Eigennutz; Ritual und Bildung formen Tugend. Begründete den legalistischen Zweig."

  - name: "Wang Yangming (王陽明)"
    years: "1472-1529"
    nationality: "Chinesisch"
    key_works:
      - title: "Chuanxilu (傳習錄)"
        year: 1572
        significance: "Neo-konfuzianische Einheit von Wissen und Handeln; Gewissen als moralische Instanz"
    biography: "Begründer der Wang-Yangming-Schule des Neo-Konfuzianismus; sein Konzept des intuitiven Wissens (liangzhi) beeinflusste Japan und Korea."

