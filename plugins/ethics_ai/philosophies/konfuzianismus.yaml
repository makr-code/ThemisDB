  - care_ethics               # Beziehungsethik und Fürsorge; Familienorientierung
  - buddhistische_ethik       # Harmonie, Mitgefühl, Gemeinschaft
  - neo_aristotelian          # Communitarianism: Gemeinschaft vor Individuum

cross_school_tensions:
  - kant:                 "Konfuzianismus kennt keine universalen formalen Imperatives; kontextuelle Rollenpflichten ersetzen das kategorische Universalgesetz"
  - liberal_individualism: "Individuelle Autonomie vs. relationale Identität: konfuzianische Ethik priorisiert soziale Harmonie und Rollenpflichten"
  - utilitarianism:       "Aggregiertes Wohlbefinden vs. Erhalt relationaler Ordnung; Konfuzianismus lehnt Opfern von Beziehungsqualität für Gesamtnutzen ab"

