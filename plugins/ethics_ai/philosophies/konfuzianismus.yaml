school_id: "konfuzianismus"
name: "Konfuzianische Ethik"
description: |
  Die konfuzianische Ethik (儒家, Rújiā) wurde von Konfuzius (孔子, Kǒng Zǐ,
  551–479 v. Chr.) und seinen Schülern Mencius (孟子), Xunzi (荀子) und
  Dong Zhongshu begründet.  Sie ist keine Religionsethik im monotheistischen
  Sinne, sondern eine normative Tugend- und Beziehungsethik, die auf den
  fünf Grundbeziehungen (五倫, wǔlún) und den Kardinaltugenden Rén (仁,
  Menschlichkeit/Humanität), Yì (義, Rechtschaffenheit), Lǐ (禮, Ritualität/
  Sitte), Zhì (智, Weisheit) und Xìn (信, Integrität/Treue) aufbaut.
  In der modernen Bioethik und KI-Ethik wird Konfuzianismus als Alternativ-
  perspektive zur westlich-individualistischen Autonomieethik diskutiert,
  die relationale Identität und kollektive Harmonie in den Vordergrund stellt.

