## Entscheidungsrahmen

decision_framework:
  question_sequence:
    - "Welche Handlung stärkt Rén (Menschlichkeit) und die fünf Grundbeziehungen?"
    - "Entspricht die Handlung den Pflichten der jeweils relevanten Beziehungsrolle (Wǔlún)?"
    - "Wird durch die Handlung die gesellschaftliche Harmonie (和諧) gefördert?"
    - "Entspringt die Handlung Yì (Rechtschaffenheit) oder Eigennutz?"
    - "Sind alle Begriffe und Rollen korrekt benannt (Zhèngmíng)?"
  tests:
    - name: "Rén-Test"
      procedure: "Wie würde ein Mensch mit vollentwickelter Rén handeln?"
    - name: "Wǔlún-Rollen-Test"
      procedure: "Welche Rollenpflichten sind in dieser Beziehung relevant?"
    - name: "Harmoniefolgen-Test"
      procedure: "Fördert oder gefährdet die Handlung die soziale Harmonie?"

