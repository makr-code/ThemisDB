## Hauptthesen

main_theses:
  - thesis_id: "konfuzianismus:ren_humanitaet"
    name: "Rén (仁) — Menschlichkeit und Humanität"
    description: "Rén ist die höchste Tugend: die Fähigkeit, den anderen als Mensch anzuerkennen und mit ihm in authentischer, fürsorglich-liebender Beziehung zu stehen. Grundlage aller konfuzianischen Ethik."
    explanation: |
      Rén (仁) bedeutet zugleich: Humanität, Menschenliebe, Mitgefühl, Empathie.
      Ein Mensch handelt rén-voll, wenn er anderen gegenüber das wünscht, was er
      sich selbst wünscht (Silberne Regel: 己所不欲，勿施於人, Analekten 12.2).
      In der KI-Ethik: Systeme, die Rén verkörpern, fördern echte menschliche
      Verbindungen statt Isolation.
    implications:
      - "Empathie und aktives Mitgefühl als Grundlage aller Tugenden"
      - "Silberne Regel als universalisierbare Handlungsmaxime"
      - "Selbstkultivierung (修身 xiū shēn) als lebenslanger Prozess"
      - "KI sollte Rén-förderliche Interaktionen unterstützen"
    token_budget: 180
    activation_rounds: [1, 4, 5]
    round_role_weights:
      PRO: 0.9
      SYNTHESIS: 0.85
      REBUTTAL: 0.6

  - thesis_id: "konfuzianismus:wu_lun_beziehungen"
    name: "Wǔlún (五倫) — Die fünf Grundbeziehungen"
    description: "Die fünf Grundbeziehungen (Herrscher-Untergebener, Eltern-Kind, Gatte-Gattin, älterer-jüngerer Bruder, Freund-Freund) definieren kontextuelle Rollenpflichten. Ethik ist relational, nicht individualistisch."
    explanation: |
      Jede der fünf Beziehungen definiert reziproke Pflichten: Loyalität (忠)
      gegenüber dem Herrscher, Pietät (孝) gegenüber Eltern, Gegenseitigkeit
      (信) unter Freunden.  Ethische Urteile sind immer kontextuell und relational.
      Implikation für KI: AI-Systeme sollten relationale Kontexte berücksichtigen,
      nicht nur individuelle Präferenzen aggregieren.
    implications:
      - "Ethische Entscheidungen sind immer kontextuell und relational"
      - "Reziprokes Pflichten-System: keine unilaterale Autorität"
      - "KI-Governance braucht relationale Verantwortungsstrukturen"
    token_budget: 160
    activation_rounds: [1, 2, 3]
    round_role_weights:
      PRO: 0.8
      REBUTTAL: 0.7
      SYNTHESIS: 0.75

  - thesis_id: "konfuzianismus:yi_rechtschaffenheit"
    name: "Yì (義) — Rechtschaffenheit und Pflichterfüllung"
    description: "Yì bezeichnet die Pflicht, das Richtige zu tun, unabhängig von persönlichem Vorteil. Edle Handlungen entspringen Yì, nicht Eigeninteresse."
    explanation: |
      Yì (義) ergänzt Rén als Handlungsmotivation: nicht Eigennutz (利, lì),
      sondern das Gerechte tun.  Mencius argumentiert: Menschen haben angeborene
      moralische Sensitivität für das Rechte (Schamgefühl als Keim von Yì).
      Dies unterscheidet Konfuzianismus von Utilitarismus.
    token_budget: 150
    activation_rounds: [1, 2, 4]
    round_role_weights:
      PRO: 0.8
      REBUTTAL: 0.75
      SYNTHESIS: 0.7

  - thesis_id: "konfuzianismus:li_ritualitaet"
    name: "Lǐ (禮) — Ritualität und soziale Ordnung"
    description: "Lǐ bezeichnet das System von Riten, Zeremonien und sozialen Normen, das Beziehungen strukturiert. Ritual ist verinnerlichte Ethik und institutionalisiertes Rén."
    explanation: |
      Lǐ (禮) umfasst: formale Zeremonien, soziale Etikette, institutionelle
      Normen.  Konfuzius versteht Lǐ als externalisierte Rén: durch Rituale werden
      Menschen in tugendhafte Gewohnheiten sozialisiert.  In der Governance-Ethik:
      institutionelle Prozesse sollen das Gute internalisieren, nicht nur erzwingen.
    token_budget: 140
    activation_rounds: [2, 3, 5]
    round_role_weights:
      PRO: 0.7
      SYNTHESIS: 0.75
      REBUTTAL: 0.5

  - thesis_id: "konfuzianismus:zhengming_richtige_benennung"
    name: "Zhèngmíng (正名) — Richtige Benennung"
    description: "Dinge, Rollen und Akteure müssen korrekt benannt werden, damit Handlungen angemessen sind. 'Wenn Begriffe nicht korrekt sind, gelingen Werke nicht.' (Analekten 13.3)"
    explanation: |
      Zhèngmíng ist das Prinzip der Begriffsklarheit als ethische Verpflichtung.
      Fehlbenennung (z.B. Algorithmus-Bias als 'Effizienz' bezeichnen) verzerrt
      moralisches Urteilen.  In der KI-Governance: präzise Benennung von
      Systemverhalten, Verantwortlichkeiten und Wirkungen ist ethisch geboten.
    token_budget: 130
    activation_rounds: [1, 3, 4]
    round_role_weights:
      PRO: 0.7
      REBUTTAL: 0.8
      SYNTHESIS: 0.6

