## Interne Debatten

internal_debate:
  mencius_vs_xunzi:
    issue: "Ist die menschliche Natur gut (Mencius) oder unkultiviert (Xunzi)?"
    positions:
      - "Mencius: Tugendsamen sind angeboren; Kultivierung entfaltet sie"
      - "Xunzi: Natur neigt zu Eigennutz; Lǐ und Bildung formen Tugend"
  tradition_vs_reform:
    issue: "Konfuzianismus und moderne Demokratie/Menschenrechte kompatibel?"
    positions:
      - "Traditionalismus: Harmonie geht vor individuelle Rechte"
      - "Neu-Konfuzianismus: demokratische Institutionen als modernes Lǐ"
      - "Konfuzianische Demokratie: Deliberation und Harmonie verbindbar"

