## Entscheidungsrahmen / Decision Framework
decision_framework:
  primary_test: "Value-Sensitive Design Test"
  description: "Does technology respect human values and dignity?"
  steps:
    - "Identify stakeholders and their values"
    - "Analyze how technology affects these values"
    - "Design to support important human values"
    - "Test for unintended consequences"
  
  secondary_test: "Fairness, Accountability, Transparency (FAT) Test"
  description: "Is system fair, accountable, and transparent?"
  criteria:
    - "No discriminatory bias"
    - "Clear responsibility chains"
    - "Explainable decisions"
    - "Human oversight possible"

## Stärken / Strengths
strengths:
  - "Addresses urgent contemporary challenges"
  - "Practical guidance for technology development"
  - "Interdisciplinary approach (tech + ethics + law)"
  - "Growing institutional adoption"
  - "Proactive rather than reactive"
  - "Considers systemic impacts"
  - "Applicable across technology domains"

## Schwächen / Weaknesses
weaknesses:
  - "Rapid technological change outpaces ethical reflection"
  - "Difficulty enforcing ethical standards globally"
  - "Tension between innovation and caution"
  - "Challenge of predicting long-term impacts"
  - "Economic pressures may override ethics"
  - "Cultural variations in technological values"
  - "Complexity of sociotechnical systems"

## Interne Debatten / Internal Debates
internal_debate:
  regulation_vs_innovation:
    issue: "Should technology be heavily regulated or allowed to innovate freely?"
    positions:
      - "Precautionary: Regulate before deployment"
      - "Permissive: Allow innovation, regulate harms"
      - "Adaptive: Context-specific governance"
  
  human_vs_technological:
    issue: "Should humans adapt to technology or technology to humans?"
    positions:
      - "Human-centered: Technology must serve human needs"
      - "Co-evolution: Humans and technology co-adapt"
      - "Posthumanist: Technology transforms what it means to be human"
  
  privacy_vs_utility:
    issue: "Balance between data privacy and technological benefits?"
    positions:
      - "Privacy maximalism: Strong privacy protections"
      - "Utilitarian: Trade privacy for benefits"
      - "Privacy by design: Both privacy and functionality"

