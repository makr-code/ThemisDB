## Hauptthesen / Main Theses
main_theses:
  - thesis_id: "technological_values"
    name: "Technologies Embody Values"
    description: "Technologies are not neutral tools but embody and promote specific values"
    explanation: |
      Design choices in technology reflect and reinforce particular social values.
      Technologies shape human behavior, relationships, and possibilities.
      Ethical evaluation must examine embedded values and social impacts.
  
  - thesis_id: "algorithmic_fairness"
    name: "Algorithmic Fairness and Accountability"
    description: "AI systems must be fair, transparent, and accountable"
    explanation: |
      Algorithms making decisions about people must not discriminate,
      should be explainable, and subject to human oversight.
      Developers and deployers bear responsibility for AI impacts.
  
  - thesis_id: "digital_rights"
    name: "Digital Rights and Autonomy"
    description: "Humans have rights to privacy, data sovereignty, and technological autonomy"
    explanation: |
      Privacy is fundamental right in digital age.
      Individuals should control their personal data.
      Technology should enhance rather than diminish human autonomy.

