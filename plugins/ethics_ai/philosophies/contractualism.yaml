# Kontraktualismus - John Rawls & T.M. Scanlon

school_id: contractualism
name: "Contractualism"
name_de: "Kontraktualismus"

## Hauptvertreter

founders:
  - name: "Thomas Hobbes"
    years: "1588-1679"
    nationality: "Englisch"
    role: "Früher politischer Kontraktualismus"
    key_works:
      - title: "Leviathan"
        year: 1651
        significance: "Grundlegung der Sozialvertragstheorie"
    note: "Hobbes' Vertrag ist egoistisch-prudentiell, nicht moralisch im engeren Sinne"

  - name: "John Rawls"
    years: "1921-2002"
    nationality: "Amerikanisch"
    birthplace: "Baltimore, Maryland, USA"
    key_works:
      - title: "A Theory of Justice"
        year: 1971
        significance: "Wiederbelebung der Vertragstheorie, Gerechtigkeitsprinzipien"
      - title: "Political Liberalism"
        year: 1993
        significance: "Politischer Liberalismus, overlapping consensus"
      - title: "The Law of Peoples"
        year: 1999
        significance: "Internationale Gerechtigkeit"
    biography: |
      Rawls revolutionierte die politische Philosophie im 20. Jahrhundert durch
      "A Theory of Justice". Seine Theorie verbindet kantische Moralphilosophie
      mit der Vertragsidee, um Prinzipien sozialer Gerechtigkeit zu begründen.
    awards: "Schock Prize in Logic and Philosophy (1999), National Humanities Medal (1999)"

  - name: "T.M. (Tim) Scanlon"
    years: "1940-heute"
    nationality: "Amerikanisch"
    key_works:
      - title: "What We Owe to Each Other"
        year: 1998
        significance: "Kontraktualistische Moraltheorie, vernünftige Zurückweisung"
      - title: "The Difficulty of Tolerance"
        year: 2003
        significance: "Anwendungen auf Toleranz und Meinungsfreiheit"
    biography: |
      Scanlon entwickelte eine kontraktualistische Ethik, die nicht auf Eigeninteresse
      basiert, sondern auf dem Wunsch nach gegenseitiger Rechtfertigung. Seine
      Theorie ist explizit moralisch, nicht politisch.

