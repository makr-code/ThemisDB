## Interne Debatten

internal_debate:
  freiheit_vs_verantwortung:
    issue: "Grenzen der Wissenschaftsfreiheit bei gesellschaftlich gefährlichen Forschungsfeldern"
    positions:
      - "Absolute Freiheit: keine Vorabzensur, nur Veröffentlichungsverantwortung"
      - "Verantwortungsprinzip: Dual-Use-Forschung braucht institutionelle Vorabprüfung"
  open_vs_closed:
    issue: "Open Science vs. Schutz vor Missbrauch sensibler Daten"
    positions:
      - "Offenheit als Default: Transparenz ist wissenschaftliche Pflicht"
      - "Datenschutz: Personendaten und sicherheitsrelevante Daten brauchen Schutz"

## Philosophische Positionierung

philosophical_positioning:
  relation_to_kant: "Wissenschaftsfreiheit als Ausdruck rationaler Autonomie; Pflicht zur Wahrheit als kategorischer Imperativ"
  relation_to_utilitarianism: "Gesellschaftlicher Nutzen der Wissenschaft wichtig; aber Integrität nicht für Nützlichkeit opferbar"
  relation_to_virtue_ethics: "Wissenschaftliche Tugenden (Sorgfalt, Redlichkeit) als Charakterbildung des Forschers"
  relation_to_care_ethics: "Verantwortung für Forschungsteilnehmer und wissenschaftlichen Nachwuchs als Sorgebeziehung"

