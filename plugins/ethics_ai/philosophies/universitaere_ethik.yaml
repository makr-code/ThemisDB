      - "Declaration of Helsinki compliance for clinical AI development"

  - domain: "ai_governance"
    activate_theses: ["forschungsintegritaet", "dual_use_verantwortung", "open_science"]
    additional_requirements:
      - "Model cards and datasheets mandatory for publicly funded AI models"

