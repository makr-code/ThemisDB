## Hauptthesen

main_theses:
  - thesis_id: "universitaere_ethik:wissenschaftsfreiheit"
    name: "Wissenschaftsfreiheit und intellektuelle Integrität"
    description: "Forschung und Lehre sind frei (GG Art. 5 Abs. 3). Diese Freiheit ist konstitutiv für Wahrheitssuche und darf nicht durch wirtschaftliche oder politische Interessen eingeschränkt werden."
    explanation: |
      Wissenschaftsfreiheit ist ein Grundrecht mit institutioneller Dimension:
      nicht nur Forscher, sondern auch Universitäten als Institutionen sind
      grundrechtlich geschützt. In der KI-Forschung bedeutet dies: keine
      Vorabzensur durch Drittmittelgeber; Publikationsfreiheit auch bei
      unerwünschten Ergebnissen; Schutz vor staatlicher Einflussnahme.
    implications:
      - "Ergebnisoffenheit: keine vorab festgelegten Ergebnisse"
      - "Publikationsfreiheit auch bei negativen Resultaten"
      - "Schutz von Whistleblowern in der Wissenschaft"
      - "Keine vollständige Drittmittelabhängigkeit (Institutional Independence)"
    token_budget: 180
    activation_rounds: [1, 4, 5]
    round_role_weights:
      PRO: 0.9
      SYNTHESIS: 0.85
      REBUTTAL: 0.65

  - thesis_id: "universitaere_ethik:forschungsintegritat"
    name: "Forschungsintegrität und gute wissenschaftliche Praxis"
    description: "Wissenschaftler sind verpflichtet, ehrlich, sorgfältig, transparent und verantwortungsbewusst zu forschen. Datenfälschung, Plagiat und selektives Berichten sind schwere Verstöße."
    explanation: |
      Die DFG-Leitlinien 2022 definieren 19 Leitlinien guter wissenschaftlicher
      Praxis: u.a. Leitlinie 7 (Aufbewahrung von Forschungsdaten), Leitlinie 12
      (Autorenschaft), Leitlinie 17 (wissenschaftliches Fehlverhalten).
      Für KI-Forschung: Transparenz über Trainingsdaten, Modellarchitektur
      und Evaluationsverfahren als Integritätsanforderung.
    implications:
      - "Nachvollziehbarkeit: vollständige Methoden- und Datendokumentation"
      - "Kollaborationsregeln: klare Autorschaft und Beitragsdokumentation"
      - "Aufbewahrungspflicht von Primärdaten (10 Jahre)"
      - "Meldepflicht bei Verdacht auf wissenschaftliches Fehlverhalten"
    token_budget: 170
    activation_rounds: [1, 2, 3]
    round_role_weights:
      PRO: 0.85
      REBUTTAL: 0.8
      SYNTHESIS: 0.75

  - thesis_id: "universitaere_ethik:probandenethik"
    name: "Schutz von Forschungsteilnehmern"
    description: "Forschung an und mit Menschen erfordert informierte Einwilligung, Risikominimierung und das Recht auf Widerruf. Die Helsinki-Deklaration setzt internationale Standards."
    explanation: |
      Das Prinzip des informierten Einverständnisses (Informed Consent) verpflichtet
      Forscher zur vollständigen Aufklärung über Zweck, Methoden, Risiken und
      Rechte der Teilnehmer. Ethikkommissionen prüfen klinische und
      humanwissenschaftliche Forschungsprojekte. Für KI: Verwendung von
      Personendaten zu Trainingszwecken erfordert DSGVO-konforme Einwilligung.
    token_budget: 160
    activation_rounds: [1, 2, 4]
    round_role_weights:
      PRO: 0.8
      REBUTTAL: 0.75
      SYNTHESIS: 0.7

  - thesis_id: "universitaere_ethik:open_science"
    name: "Open Science und Replizierbarkeit"
    description: "Wissenschaftliche Ergebnisse sollen öffentlich zugänglich und reproduzierbar sein. Open Data, Open Access und Preregistrierung erhöhen die Qualität und Integrität der Wissenschaft."
    explanation: |
      Die Reproduzierbarkeitskrise (Open Science Collaboration, 2015) hat gezeigt,
      dass ein erheblicher Anteil psychologischer und medizinischer Studien nicht
      reproduzierbar ist. Open Science-Praktiken (Preregistrierung, Open Data,
      Open Code) adressieren Verzerrungen durch Publikationsbias und HARKing.
      Für KI: Modellkarten, Datensatzdokumentation und Reproduzierbarkeits-Checks
      als wissenschaftliche Sorgfaltspflicht.
    token_budget: 150
    activation_rounds: [2, 3, 5]
    round_role_weights:
      PRO: 0.75
      REBUTTAL: 0.7
      SYNTHESIS: 0.8

  - thesis_id: "universitaere_ethik:gesellschaftliche_verantwortung"
    name: "Gesellschaftliche Verantwortung der Wissenschaft"
    description: "Wissenschaft hat Verantwortung für gesellschaftliche Folgen ihrer Erkenntnisse und Technologien. Dual-Use-Forschung und technologische Risiken erfordern prospektive Ethikfolgenabschätzung."
    explanation: |
      Das Konzept der Responsible Research and Innovation (RRI) verpflichtet
      Wissenschaftler, gesellschaftliche Implikationen bereits in der
      Forschungsplanung zu berücksichtigen. Für KI: ELSI-Analyse (Ethical,
      Legal, Social Implications) als integraler Bestandteil der KI-Forschung.
      Dual-Use-Risiken (Waffenentwicklung, Massenüberwachung) erfordern
      proaktive Abwägung und Selbstbeschränkung.
    token_budget: 160
    activation_rounds: [1, 3, 4, 5]
    round_role_weights:
      PRO: 0.8
      SYNTHESIS: 0.85
      REBUTTAL: 0.6

