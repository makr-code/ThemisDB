## Entscheidungsrahmen

decision_framework:
  question_sequence:
    - "Ist die Forschung wissenschaftlich integer und nachvollziehbar?"
    - "Werden Forschungsteilnehmer geschützt und informiert eingewilligt?"
    - "Sind Interessenkonflikte offengelegt und gemanagt?"
    - "Sind gesellschaftliche Folgen und Dual-Use-Risiken berücksichtigt?"
    - "Ist Open Science (Replizierbarkeit, Datenzugänglichkeit) gewährleistet?"
  tests:
    - name: "DFG-Kodex-Check"
      procedure: "Prüfe alle 19 DFG-Leitlinien auf Erfüllung"
    - name: "Ethikkommissions-Review"
      procedure: "Wurde das Forschungsvorhaben durch eine Ethikkommission geprüft?"
    - name: "ELSI-Analyse"
      procedure: "Ethical, Legal, Social Implications systematisch bewertet?"

