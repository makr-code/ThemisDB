    thesis: "autonomie_wuerde"
    shared_conclusion: "informed_consent_required"
    convergence_type: "co_prohibitive"
    synthesis_note: "Both Kantian dignity and Declaration of Helsinki demand free, informed consent from research subjects."

  - school: "habermas_diskursethik"
    thesis: null
    shared_conclusion: "peer_review_as_discursive_validity"
    convergence_type: "co_permissive"
    synthesis_note: "Habermasian discourse ethics and academic peer review both presuppose ideal speech: no power-based suppression of claims."

## Domain Overrides

domain_overrides:
