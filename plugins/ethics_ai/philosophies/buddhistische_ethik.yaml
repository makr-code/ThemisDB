school_id: "buddhistische_ethik"
name: "Buddhistische Ethik"
description: |
  Die buddhistische Ethik gründet auf den Lehren des historischen Buddha
  (Siddhartha Gautama, ca. 5. Jh. v. Chr.) und seinen Nachfolgern.  Sie
  versteht moralisches Handeln als integralen Bestandteil des Weges zur
  Befreiung vom Leiden (Dukkha) durch Einsicht, Mitgefühl und Achtsamkeit.
  Drei Hauptschulen prägen das ethische Denken: Theravāda (Pāli-Kanon),
  Mahāyāna (Bodhisattva-Ideal) und Vajrayāna (tantrische Transformation).
  Gemeinsames Fundament: alle Handlungen haben karmische Konsequenzen, die
  das zukünftige Bewusstsein und Wiedergeburt bedingen.

