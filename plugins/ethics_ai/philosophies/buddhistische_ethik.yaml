## Entscheidungsrahmen

decision_framework:
  question_sequence:
    - "Welche Handlung minimiert Leiden (Dukkha) für alle empfindungsfähigen Wesen?"
    - "Entspringt die Absicht Mitgefühl (Karuṇā), Liebender Güte (Mettā) und Weisheit (Prajñā)?"
    - "Respektiert die Handlung das Prinzip der Nicht-Schädigung (Ahimsa)?"
    - "Haftet die Handlung an vergänglichen Gütern oder fördert sie Loslassen?"
  tests:
    - name: "Ahimsa-Test"
      procedure: "Schädigt die Handlung direkt oder indirekt ein empfindungsfähiges Wesen?"
    - name: "Karma-Absichts-Test"
      procedure: "Entspringt die Absicht Gier (lobha), Hass (dosa) oder Verblendung (moha)?"
    - name: "Brahmavihāra-Test"
      procedure: "Fördert die Handlung Mettā, Karuṇā, Muditā oder Upekkhā?"

## Stärken und Schwächen

strengths:
  - point: "Universalität"
    elaboration: "Mitgefühl und Nicht-Schaden gelten für alle empfindungsfähigen Wesen — übersteigt anthropozentrischen Ansatz"
  - point: "Intentionsfokus"
    elaboration: "Trennung von Absicht und Konsequenz verhindert Missbrauch von Utilität-Argumenten"
  - point: "Contemplative Praxis"
    elaboration: "Achtsamkeit als Methode zur Verringerung voreiliger, schädlicher Entscheidungen"
  - point: "Leidensempfindlichkeit"
    elaboration: "Feinfühlig gegenüber verborgenem oder chronischem Leiden; besonders wertvoll in Bioethik"

weaknesses:
  - point: "Institutionelle Vielfalt"
    elaboration: "Theravāda, Mahāyāna, Vajrayāna haben unterschiedliche ethische Prioritäten"
  - point: "Karma-Konzept"
    elaboration: "Karma als kausales Erklärungsmodell kann in westlichen juristischen Kontexten nicht direkt operationalisiert werden"
  - point: "Wiedergeburtslehre"
    elaboration: "Ethische Argumente, die auf Wiedergeburt basieren, sind außerhalb buddhistischer Kulturen schwer universalisierbar"

## Interne Debatten

internal_debate:
  theravada_vs_mahayana:
    issue: "Individuelles Nirvāṇa (Arhat) vs. universale Erlösung aller (Bodhisattva)"
    positions:
      - "Theravāda: eigene Befreiung ist Voraussetzung für Hilfe anderer"
      - "Mahāyāna: Verzicht auf eigene Befreiung für alle Wesen als höchstes Ideal"
  engagement_vs_rueckzug:
    issue: "Kontemplativer Rückzug vs. politisches Engagement (Engaged Buddhism)"
    positions:
      - "Monastische Tradition: Rückzug aus Samsara als Weg"
      - "Engaged Buddhism (Thich Nhat Hanh): aktiver sozialer Einsatz als Dharma-Praxis"

## Philosophische Positionierung

philosophical_positioning:
  relation_to_consequentialism: "Teilt Leidminderung als Ziel; lehnt aber reine Nutzenkalkulation ab — Absicht zählt"
  relation_to_deontology: "Keine absoluten extrinsischen Pflichten; Regeln entstammen empirischer Einsicht in Leidursachen"
  relation_to_virtue_ethics: "Nähe zu Aristoteles: Tugenden und innere Haltungen (Brahmavihāras) sind zentral; aber kein persönliches Telos"
  relation_to_care_ethics: "Starke Überschneidung: Beziehungssorge und Mitgefühl komplementär; Buddhismus betont zusätzlich Nicht-Haften"

