  - kant:                   "Kategorischer Imperativ und Karma stimmen in Universalisierbarkeit überein; Kant betont Vernunft, Buddhismus betont Mitgefühl und Absicht"
  - nietzsche:              "Nietzsche kritisiert Buddhismus als nihilistisch; Buddhismus versteht Nirvāṇa als Befreiung, nicht als Nihilismus"

