    name: "Prajñā — Weisheit als ethische Kompetenz"
    description: "Einsicht in die wahre Natur der Wirklichkeit (drei Daseinsmerkmale) befähigt zu ethisch treffsicheren Entscheidungen jenseits dogmatischer Regeln."
    token_budget: 120
    activation_rounds: [3, 4, 5]
    round_role_weights:
      SYNTHESIS: 0.8
      PRO: 0.6

  - thesis_id: "buddhistische_ethik:sila_verhaltensethik"
    name: "Sīla — Tugendhafte Verhaltensregeln"
    description: "Die fünf Silas (Laienethik): kein Töten, kein Stehlen, keine sexuelle Verfehlung, keine Lüge, kein Rausch. Als ethische Minimalanforderung universal anwendbar."
    token_budget: 110
    activation_rounds: [1, 2]
    round_role_weights:
      PRO: 0.75
      REBUTTAL: 0.6

decision_framework:
  primary_question: "Welche Handlung minimiert Leiden (Dukkha) für alle beteiligten empfindungsfähigen Wesen?"
  secondary_question: "Entspringt die Handlungsabsicht Mitgefühl (Karuṇā), Liebender Güte (Mettā) und Weisheit (Prajñā)?"
  tertiary_question: "Respektiert die Handlung das Prinzip der Nicht-Schädigung (Ahimsa) aller Beteiligten?"
  contextual_guidance: "Bei Zielkonflikten hat das Lindern akuten Leidens Vorrang vor langfristiger Nutzenmaximierung."

strengths:
  - point: "Universalität"
    elaboration: "Mitgefühl und Nicht-Schaden gelten für alle empfindungsfähigen Wesen — übersteigt anthropozentrischen Ansatz"
  - point: "Intentionsfokus"
    elaboration: "Trennung von Absicht und Konsequenz verhindert Missbrauch von Utilität-Argumenten"
  - point: "Contemplative Praxis"
    elaboration: "Achtsamkeit als Methode zur Verringerung voreiliger, schädlicher Entscheidungen"
  - point: "Leidensempfindlichkeit"
    elaboration: "Feinfühlig gegenüber verborgenem oder chronischem Leiden; besonders wertvoll in Bioethik"

weaknesses:
  - point: "Institutionelle Vielfalt"
    elaboration: "Theravāda, Mahāyāna, Vajrayāna haben unterschiedliche ethische Prioritäten"
  - point: "Karma-Konzept"
    elaboration: "Karma als kausales Erklärungsmodell kann in westlichen juristischen Kontexten nicht direkt operationalisiert werden"
  - point: "Wiedergeburtslehre"
    elaboration: "Ethische Argumente, die auf Wiedergeburt basieren, sind außerhalb buddhistischer Kulturen schwer universalisierbar"

philosophical_positioning:
  vs_consequentialism: "Teilt Leidminderung als Ziel, lehnt aber reine Nutzenkalkulation ab; Absicht zählt"
  vs_deontology: "Keine absoluten extrinsischen Pflichten; Regeln entstammen empirischer Einsicht in Leidursachen"
  vs_virtue_ethics: "Nähe zu Aristoteles: Tugenden und innere Haltungen (Brahmavihāras) sind zentral; aber kein persönliches Telos"
  vs_care_ethics: "Starke Überschneidung: Beziehungssorge und Mitgefühl komplementär; Buddhismus betont zusätzlich Nicht-Haften"
