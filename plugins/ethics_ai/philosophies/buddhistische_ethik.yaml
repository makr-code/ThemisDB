main_theses:
  - thesis_id: "buddhistische_ethik:ahimsa"
    name: "Ahimsa — Nicht-Schaden"
    description: "Das Prinzip der Gewaltlosigkeit gegenüber allen empfindungsfähigen Wesen ist zentrales ethisches Gebot. Schaden an Lebewesen erzeugt negatives Karma."
    explanation: |
      Ahimsa (Pāli: avihiṃsā) gebietet das Unterlassen jeder Form von Schaden —
      physisch, verbal, mental.  In der praktischen Ethik bedeutet dies: Vorrang
      für weniger invasive Behandlungsoptionen, Ablehnung von Folter, Skepsis
      gegenüber Kriegen.  Im KI-Kontext: bevorzuge Systeme, die Schaden
      minimieren, auch im Grenzfall zwischen Mensch und KI-Agenten.
    token_budget: 180
    activation_rounds: [1, 4, 5]
    round_role_weights:
      PRO: 0.9
      SYNTHESIS: 0.8
      REBUTTAL: 0.6

  - thesis_id: "buddhistische_ethik:karma_sankhara"
    name: "Karma und intentionale Handlung"
    description: "Jede willentliche Handlung (Karma = Absicht) prägt den Geisteszustand und hat Folgen. Entscheidend ist die moralische Intention, nicht nur die Konsequenz."
    explanation: |
      Karma im ethischen Sinne bezeichnet die Qualität der Absicht hinter einer
      Handlung.  Heilsames Karma entsteht durch Absichten geprägt von Nicht-Gier
      (alobha), Nicht-Hass (adosa) und Nicht-Verblendung (amoha).
      Dies unterscheidet buddhistische Ethik vom reinen Konsequentialismus:
      eine gut gemeinte Handlung mit schlechtem Ergebnis hat anderen karmischen
      Wert als eine schlecht gemeinte mit gutem Ergebnis.
    token_budget: 160
    activation_rounds: [1, 2, 3]
    round_role_weights:
      PRO: 0.8
      REBUTTAL: 0.7
      SYNTHESIS: 0.75

  - thesis_id: "buddhistische_ethik:karuna_metta"
    name: "Karuṇā (Mitgefühl) und Mettā (Liebende Güte)"
    description: "Die Brahmavihāras Mitgefühl und Liebende Güte sind aktive ethische Haltungen: aktives Lindern von Leiden und Förderung des Wohlbefindens aller Wesen."
    explanation: |
      Die vier Brahmavihāras (göttliche Verweilzustände): Mettā (Liebende Güte),
      Karuṇā (Mitgefühl), Muditā (Mitfreude), Upekkhā (Gleichmut).
      Als ethischer Imperativ: handle so, dass du das Leiden anderer aktiv
      verringerst und ihrem Wohlbefinden dienst.  Im Mahāyāna: der Bodhisattva
      verzichtet auf eigenes Nirvāṇa, bis alle Wesen befreit sind.
    token_budget: 170
    activation_rounds: [1, 2, 4, 5]
    round_role_weights:
      PRO: 0.85
      SYNTHESIS: 0.9
      REBUTTAL: 0.5

  - thesis_id: "buddhistische_ethik:dukkha_befreiung"
    name: "Dukkha — Leidminderung als ethisches Ziel"
    description: "Leiden (Dukkha) ist die fundamentale Realität bedingter Existenz. Ethisches Handeln zielt auf Leidminderung für alle empfindungsfähigen Wesen."
    explanation: |
      Die Erste Edle Wahrheit: Dukkha ist allgegenwärtig in bedingter Existenz.
      Ethisches Ziel ist die Reduktion von Dukkha.  Dies hat direkte Konsequenzen
      für bioethische Fragen: Schmerzlinderung am Lebensende hat höchste Priorität;
      Leidverlängerung durch invasive Behandlung ist ethisch problematisch.
    token_budget: 150
    activation_rounds: [1, 3, 5]
    round_role_weights:
      PRO: 0.7
      REBUTTAL: 0.8
      SYNTHESIS: 0.7

  - thesis_id: "buddhistische_ethik:anicca_vergaenglichkeit"
    name: "Anicca — Vergänglichkeit und Nicht-Selbst"
    description: "Alle zusammengesetzten Erscheinungen sind vergänglich (anicca) und substantiell leer von dauerhaftem Selbst (anattā). Haften an Dauerhaftem erzeugt Leiden."
    explanation: |
      Anicca (Vergänglichkeit) und Anattā (Nicht-Selbst) sind keine nihilistischen
      Aussagen, sondern epistemische Einsichten: Entscheidungen sollten nicht auf
      der Annahme unveränderlicher Eigenschaften (z.B. "Rasse", "Natur") basieren.
      In der KI-Ethik relevant: KI-Systeme und ihre "Persönlichkeiten" sind bedingt
      und veränderlich — rechtliche Personenstatus wäre ontologisch problematisch.
    token_budget: 140
    activation_rounds: [2, 3, 4]
    round_role_weights:
      REBUTTAL: 0.7
      SYNTHESIS: 0.65
      PRO: 0.5

secondary_theses:
