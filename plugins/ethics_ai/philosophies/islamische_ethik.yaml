## Hauptthesen

main_theses:
  - thesis_id: "islamische_ethik:maqasid_al_shariah"
    name: "Maqasid al-Shariah — Ziele des islamischen Rechts"
    description: "Die fünf Schutzgüter des islamischen Rechts: Leben (nafs), Vernunft (aql), Abstammung/Würde (nasl), Eigentum (mal) und Religion (din). Ethische Entscheidungen müssen diese Güter schützen und fördern."
    explanation: |
      Die Maqasid-Hierarchie bietet ein strukturiertes Abwägungsframework:
      Lebensschutz hat höchste Priorität; Vernunftschutz begründet das Verbot
      berauschender Mittel; Würdeschutz verbietet Erniedrigung. In der
      islamischen Bioethik: Organtransplantation ist erlaubt, wenn sie dem
      Lebensschutz dient; aktive Euthanasie verletzt den Lebensschutz.
      Für KI-Ethik: KI-Systeme müssen alle fünf Schutzgüter respektieren.
    implications:
      - "Lebensschutz (hifz al-nafs) als primäres ethisches Gebot"
      - "Vernunftschutz begründet Ablehnung bewusstseinsmindernder Manipulationen"
      - "Würdeschutz (karama) als islamische Entsprechung der Menschenwürde"
      - "Eigentumsschutz: Fairness in wirtschaftlichen KI-Entscheidungen"
    token_budget: 200
    activation_rounds: [1, 4, 5]
    round_role_weights:
      PRO: 0.95
      SYNTHESIS: 0.9
      REBUTTAL: 0.7

  - thesis_id: "islamische_ethik:la_darar"
    name: "La Darar wa-la Dirar — Kein Schaden und keine Gegenschädigung"
    description: "Das zentrale Prinzip islamischer Ethik: 'Kein Schaden soll zugefügt werden und kein Schaden soll erwidert werden.' (Hadith des Propheten, Nawawi 32)"
    explanation: |
      La Darar (kein Schaden zufügen) und La Dirar (keinen Gegenschaden) sind
      Grundprinzipien des islamischen Rechts. Anwendung: Medizinische Behandlungen
      müssen den Patienten schützen; invasive Eingriffe sind nur bei
      überwiegendem Nutzen erlaubt. Für KI: Systeme dürfen keine Schäden
      verursachen, auch nicht durch unbeabsichtigte Nebeneffekte.
    token_budget: 150
    activation_rounds: [1, 2, 3]
    round_role_weights:
      PRO: 0.85
      REBUTTAL: 0.8
      SYNTHESIS: 0.75

  - thesis_id: "islamische_ethik:darura"
    name: "Darura — Notwendigkeit und Ausnahmeerlaubnis"
    description: "Im Notfall sind sonst verbotene Handlungen erlaubt, soweit es zur Abwendung des Schadens notwendig ist. 'Die Not macht das Verbotene erlaubt.' (al-daruratu tubih al-mahzurat)"
    explanation: |
      Das Darura-Prinzip erlaubt im lebensbedrohlichen Notfall Ausnahmen von
      islamischen Geboten (z.B. Schweinefleisch essen zum Überleben).
      In der Bioethik: Organtransplantation aus Leichen kann durch Darura
      erlaubt sein, wenn kein anderes Mittel verfügbar ist. Für KI:
      Datenschutz-Ausnahmen bei medizinischer Notfallversorgung.
    implications:
      - "Notwendigkeitsprinzip: nur soweit zur Schadensabwendung erforderlich"
      - "Temporalität: Ausnahme gilt nur für die Dauer des Notfalls"
      - "Verhältnismäßigkeit: Ausnahme darf nicht über das Notwendige hinausgehen"
    token_budget: 160
    activation_rounds: [1, 2, 3, 4]
    round_role_weights:
      PRO: 0.8
      REBUTTAL: 0.75
      SYNTHESIS: 0.7

  - thesis_id: "islamische_ethik:karama_insaniyya"
    name: "Karama Insaniyya — Menschenwürde"
    description: "Jeder Mensch besitzt unveräußerliche Würde als Khalifa (Statthalter Gottes auf Erden). Diese Würde begründet Schutz vor Erniedrigung, Ausbeutung und Instrumentalisierung."
    explanation: |
      Die islamische Menschenwürde (Karama) ist theologisch verankert in der
      Gottebenbildlichkeit des Menschen als Khalifa Allah. Sie ist unverlustig —
      auch Kriminelle und Schwächste behalten ihre Würde.
      Für KI: Systeme, die Menschen erniedrigen, überwachen oder manipulieren,
      verletzen Karama. Biometrische Massenüberwachung ist ethisch problematisch.
    token_budget: 180
    activation_rounds: [1, 2, 3, 4, 5]
    round_role_weights:
      PRO: 0.9
      SYNTHESIS: 0.85
      REBUTTAL: 0.65

  - thesis_id: "islamische_ethik:shura"
    name: "Shura — Konsultation und kollektive Entscheidung"
    description: "Wichtige Entscheidungen sollen nach Beratung (Shura) getroffen werden. Kollektive Rationalität und Gelehrtenrat (Ijma) ergänzen individuelle Einschätzung."
    explanation: |
      Shura (Konsultation) ist koranisches Gebot (Sure 42:38).  In modernen
      politischen Systemen entspricht dies deliberativer Demokratie.
      Für KI-Governance: Algorithmen, die kollektive Güter betreffen (Triage,
      Kreditvergabe, Strafrecht), sollten durch Gelehrten-, Bürger- und
      Expertenberatung legitimiert werden.
    token_budget: 130
    activation_rounds: [1, 4]
    round_role_weights:
      PRO: 0.75
      SYNTHESIS: 0.8
      REBUTTAL: 0.5

  - thesis_id: "islamische_ethik:maslaha"
    name: "Maslaha — Gemeinwohl und öffentliches Interesse"
    description: "Islamische Rechtsethik orientiert sich am Gemeinwohl (Maslaha Mursala). Regeln können angepasst werden, wenn das Gemeinwohl es erfordert und keine explizite Offenbarung dagegen steht."
    explanation: |
      Maslaha (Interesse, Gemeinwohl) ist ein Prinzip der islamischen Rechts-
      erneuerung (Ijtihad): neue ethische Probleme können durch Maslaha-Abwägung
      gelöst werden, wenn keine direkte Quelle aus Koran und Sunna vorliegt.
      Für KI: KI-Regulierung kann als Maslaha begründet werden, wenn sie dem
      Schutz der fünf Maqasid dient.
    token_budget: 140
    activation_rounds: [2, 3, 4]
    round_role_weights:
      PRO: 0.75
      REBUTTAL: 0.7
      SYNTHESIS: 0.8

  - thesis_id: "islamische_ethik:amanah"
    name: "Amanah — Treuhänderschaft und Verantwortung"
    description: "Der Mensch ist Treuhänder (Amin) über die Schöpfung und die ihm anvertrauten Güter. Verantwortungsvolles Handeln gegenüber Mensch, Tier und Umwelt ist religiöse Pflicht."
    explanation: |
      Amanah (Treue, Vertrauen, Treuhänderschaft) verpflichtet Menschen zu
      verantwortlichem Umgang mit anvertrauten Gütern — Wissen, Macht, Ressourcen.
      Für KI: Entwickler und Betreiber tragen Amanah für ihre Systeme;
      Datenschutz ist Treuhänderschaft über Benutzerdaten.
    token_budget: 130
    activation_rounds: [3, 4, 5]
    round_role_weights:
      PRO: 0.7
      SYNTHESIS: 0.75
      REBUTTAL: 0.55

