## Entscheidungsrahmen

decision_framework:
  question_sequence:
    - "Schützt die Handlung die fünf Maqasid (Leben, Vernunft, Würde, Eigentum, Religion)?"
    - "Verletzt sie das La-Darar-Prinzip (kein Schaden)?"
    - "Ist Darura (Notwendigkeit) gegeben, die Ausnahmen rechtfertigt?"
    - "Wahrt die Handlung Karama (Menschenwürde)?"
    - "Dient sie der Maslaha (Gemeinwohl)?"
  tests:
    - name: "Maqasid-Hierarchie-Test"
      procedure: "Prüfe alle fünf Schutzgüter; Lebensschutz hat Vorrang"
    - name: "La-Darar-Check"
      procedure: "Welchen Schaden verursacht die Handlung, direkt oder indirekt?"
    - name: "Darura-Prüfung"
      procedure: "Liegt ein tatsächlicher Notfall vor, der sonst verbotene Mittel rechtfertigt?"

## Stärken und Schwächen

strengths:
  - point: "Hierarchische Schutzgüter"
    elaboration: "Maqasid bietet klares Abwägungsframework für Zielkonflikte"
  - point: "Pragmatismus (Darura)"
    elaboration: "Notstandsklausel ermöglicht Flexibilität ohne Aufgabe des Grundrahmens"
  - point: "Gemeinschaftsorientierung"
    elaboration: "Maslaha und Ummah verankern Individualethik in sozialer Verantwortung"
  - point: "Dignität ohne Bewusstseinsschwelle"
    elaboration: "Karama schützt auch Bewusstlose, Ungeborene und Schwache"

weaknesses:
  - point: "Innerislamischer Pluralismus"
    elaboration: "Vier Madhabs (Hanafi, Maliki, Shafi'i, Hanbali) divergieren erheblich; 'die islamische Position' ist Fiktion"
  - point: "Theologische Prämissen"
    elaboration: "Maqasid und Karama setzen Schöpfungsglauben voraus; in säkularem Kontext nicht direkt operationalisierbar"
  - point: "Ijtihad-Defizit"
    elaboration: "Zeitgenössischer Ijtihad zu KI fehlt weitgehend; traditionelle Gelehrte sind oft nicht mit Technologie vertraut"

## Interne Debatten

internal_debate:
  madhab_pluralismus:
    issue: "Welcher der vier Rechtsschulen (Madhabs) ist für bioethische Fragen maßgeblich?"
    positions:
      - "Hanafi: Rationalität und Analogie betonen"
      - "Maliki: Maslaha und Gewohnheitsrecht betonen"
      - "Hanbali: strenge Texttreue"
      - "Schafi'i: Synthese aus Text und Rationalität"
  tradition_vs_moderne:
    issue: "Können klassische Fiqh-Kategorien auf KI und Biotechnologie angewendet werden?"
    positions:
      - "Traditionalist: Klassische Regeln ausreichen mit Analogiebildung"
      - "Modernist: Neuer Ijtihad-Rahmen für KI notwendig"

