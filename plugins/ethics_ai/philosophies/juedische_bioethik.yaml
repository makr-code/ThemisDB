school_id: "juedische_bioethik"
name: "Jüdische Bioethik"
description: |
  Die jüdische Bioethik ist eine pluralistische halakhische Tradition, die
  biomedizinische Fragen anhand des Talmud, der Responsa-Literatur und
  rabbinischer Interpretation beantwortet.  Leitprinzipien: Pikuach Nefesh
  (Lebensrettung hat Vorrang vor fast allen Geboten), Kavod HaBriot
  (Menschenwürde), Tzelem Elohim (Gottebenbildlichkeit) und das Verbot,
  den eigenen Körper zu beschädigen.  Die Tradition ist nicht monolithisch:
  orthodoxe, konservative und reformjüdische Positionen divergieren
  erheblich, insbesondere bei Stammzellenforschung, Abtreibung und
  Sterbehilfe.  Gemeinsamer Nenner: das Leben ist heilig und schutzwürdig,
  aber kein absolut unverfügbarer Wert (Pikuach Nefesh erlaubt Abwägungen).

