## Hauptthesen

main_theses:
  - thesis_id: "juedische_bioethik:pikuach_nefesh"
    name: "Pikuach Nefesh — Lebensrettung hat Vorrang"
    description: "Die Pflicht, ein Leben zu retten, suspendiert nahezu alle anderen Toragebote (außer Mord, Idolatrie, sexueller Schwere). Dies begründet aktive medizinische Intervention."
    explanation: |
      Pikuach Nefesh (Bewahrung des Lebens) ist das zentrale halakhische
      Prinzip.  Beispiel: Am Schabbat darf und muss medizinische Hilfe geleistet
      werden.  Der Arzt trägt Heilungspflicht (Rafa yerape, Exodus 21:19).
    implications:
      - "Lebenserhaltende Maßnahmen sind im Zweifel zu ergreifen"
      - "Schabbat-Übertretung bei medizinischer Notlage geboten"
      - "Organ-Transplantation als Pikuach-Nefesh-Gebot erlaubt"
      - "Vorrang des Lebensschutzes vor religiösen Formalvorschriften"
    token_budget: 200
    activation_rounds: [1, 4, 5]
    round_role_weights:
      PRO: 0.95
      SYNTHESIS: 0.85
      REBUTTAL: 0.7

  - thesis_id: "juedische_bioethik:tzelem_elohim"
    name: "Tzelem Elohim — Gottebenbildlichkeit des Menschen"
    description: "Jeder Mensch ist im Bilde Gottes geschaffen (Genesis 1:27). Daraus folgt absolute Menschenwürde unabhängig von Bewusstseinsgrad oder Nützlichkeit."
    explanation: |
      Tzelem Elohim begründet die Unverfügbarkeit menschlicher Würde in der
      jüdischen Ethik.  Im Unterschied zur kantischen Würde, die auf Rationalität
      beruht, ist die jüdische Würde theologisch verankert: auch ein nicht-
      rationaler oder leidender Mensch behält volle Würde.
    implications:
      - "Würde ist nicht erwerbbar oder verlierbar — auch Kriminelle tragen sie"
      - "Schutz von Embryonen, Bewusstlosen und Sterbenden"
      - "Verbot erniedrigender Behandlung in Medizin und Forschung"
    token_budget: 180
    activation_rounds: [1, 2, 4]
    round_role_weights:
      PRO: 0.9
      REBUTTAL: 0.75
      SYNTHESIS: 0.8

  - thesis_id: "juedische_bioethik:kavod_habriot"
    name: "Kavod HaBriot — Würde der Schöpfung"
    description: "Die Würde aller Geschöpfe verpflichtet zur Leidensminderung und respektvollen Behandlung. Dies schließt würdiges Sterben, Respekt vor dem toten Körper und Tierschutz ein."
    explanation: |
      Kavod HaBriot ist breiter als Menschenwürde und umfasst alle Schöpfung.
      In der Bioethik: Pflicht zur Schmerzlinderung auch wenn Lebensdauer dadurch
      verkürzt wird, Pflicht zur würdevollen Behandlung unheilbar Kranker,
      Respekt vor menschlichen Überresten.
    token_budget: 160
    activation_rounds: [1, 2, 3, 5]
    round_role_weights:
      PRO: 0.8
      SYNTHESIS: 0.85
      REBUTTAL: 0.6

  - thesis_id: "juedische_bioethik:lo_ta_amod"
    name: "Lo Ta'amod — Positive Pflicht zur Hilfeleistung"
    description: "Du sollst nicht untätig bleiben, wenn dein Nächster in Gefahr ist (Levitikus 19:16). Diese positive Pflicht verpflichtet zur aktiven medizinischen Hilfe."
    explanation: |
      Lo Ta'amod Al Dam Re'ekha (Steh nicht untätig beim Blut deines Nächsten)
      begründet eine positive Handlungspflicht.  Anwendung: Organ-Transplantation
      ist nicht nur erlaubt, sondern in vielen Fällen geboten; Schweigepflicht
      des Arztes kann bei Lebensgefahr zurücktreten.
    token_budget: 150
    activation_rounds: [1, 3, 4]
    round_role_weights:
      PRO: 0.75
      REBUTTAL: 0.7
      SYNTHESIS: 0.65

  - thesis_id: "juedische_bioethik:goses_sterbeprozess"
    name: "Goses — Der Sterbende und seine besondere Schutzwürdigkeit"
    description: "Ein Goses (Sterbender in den letzten Stunden/Tagen) darf in seinem Sterben nicht aktiv beschleunigt oder unnötig verzögert werden. Palliative Begleitung ist geboten."
    explanation: |
      Halakhische Quellen (Semachot 1:1-4) unterscheiden zwischen aktivem Töten
      des Sterbenden (verboten) und Entfernung von Hindernissen des natürlichen
      Sterbens (erlaubt).  Diese Unterscheidung ist für Sterbehilfe-Debatten
      und Behandlungsabbruch zentral.
    implications:
      - "Aktive Euthanasie ist verboten"
      - "Sterbebegleitung mit Schmerzlinderung ist religiöse Pflicht"
      - "Entfernung lebenserhaltender Maßnahmen kann erlaubt sein"
    token_budget: 170
    activation_rounds: [2, 3, 4, 5]
    round_role_weights:
      PRO: 0.8
      REBUTTAL: 0.85
      SYNTHESIS: 0.7

