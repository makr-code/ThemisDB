## Entscheidungsrahmen

decision_framework:
  question_sequence:
    - "Ist Pikuach Nefesh (Lebensrettung) anwendbar? Wenn ja, hat sie nahezu absoluten Vorrang."
    - "Wahrt die Handlung Tzelem Elohim (Menschenwürde) und Kavod HaBriot (Würde der Schöpfung)?"
    - "Entspricht die Handlung der positiven Pflicht Lo Ta'amod (aktive Hilfeleistung)?"
    - "Ist der Patient ein Goses? Gelten die besonderen Schutzregeln?"
  tests:
    - name: "Pikuach-Nefesh-Test"
      procedure: "Liegt unmittelbare Lebensgefahr vor, die halakhische Ausnahmen rechtfertigt?"
    - name: "Würde-Check"
      procedure: "Wahrt die Behandlung Tzelem Elohim und Kavod HaBriot für Patient und Leichnam?"
    - name: "Responsa-Methode"
      procedure: "Konsultiere einschlägige rabbinische Quellen und zeitgenössische Responsa"

## Stärken und Schwächen

strengths:
  - point: "Lebensschutz-Fundament"
    elaboration: "Pikuach Nefesh bietet starkes Fundament für aktive medizinische Hilfe"
  - point: "Würde ohne Bewusstseinsschwelle"
    elaboration: "Tzelem Elohim schützt auch Bewusstlose, Behinderte und Sterbende"
  - point: "Tradition der Responsa"
    elaboration: "Reiches Präzedenzfall-Repertoire für neue bioethische Fragen"
  - point: "Balancierte Kasuistik"
    elaboration: "Differenzierte Unterscheidung zwischen aktivem Töten und Unterlassen"

weaknesses:
  - point: "Innerreligiöser Pluralismus"
    elaboration: "Orthodoxe, konservative und reformjüdische Positionen divergieren erheblich"
  - point: "Theologische Prämissen"
    elaboration: "Gottebenbildlichkeit setzt Schöpfungsglauben voraus; in säkularem Kontext nicht direkt operationalisierbar"
  - point: "Begrenzte Universalisierbarkeit"
    elaboration: "Halakhische Pflichten gelten primär für Juden; Universalisierung erfordert Analogiearbeit"

## Interne Debatten

internal_debate:
  orthodox_vs_liberal:
    issue: "Strenge Halakha vs. liberale Reinterpretation bei neuen bioethischen Fragen"
    positions:
      - "Orthodox: Primärquellen bindend; Neues nur durch halachische Analogie"
      - "Konservativ: dynamische Halakha; responsum kann Tradition anpassen"
      - "Reform: ethische Prinzipien wichtiger als formale Gebote"
  organ_spende:
    issue: "Ist Hirntod gleichzusetzen mit halachischem Tod (Herzstillstand)?"
    positions:
      - "Viele Orthodox-Rabbiner: Hirntod ist nicht halachischer Tod → Organentnahme problematisch"
      - "Andere Rabbiner: Hirntod ist halachischer Tod → Organspende als Pikuach Nefesh geboten"

