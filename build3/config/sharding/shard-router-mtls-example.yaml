# Example shard router configuration with mTLS enabled
# Version: 1.4.0
# Purpose: Production deployment with secure inter-shard communication

cluster:
  id: themis-shard-cluster-prod
  router_endpoint: 0.0.0.0:7000
  orchestrator_endpoint: 0.0.0.0:7001
  replication_factor: 3
  
  # Shards with mTLS endpoints
  shards:
    - id: shard-01
      range: [0, 1073741823]
      primaries:
        - host: shard-01-primary.dc1.example.com
          port: 50051
      replicas:
        - host: shard-01-replica-1.dc1.example.com
          port: 50051
        - host: shard-01-replica-2.dc2.example.com
          port: 50051
    
    - id: shard-02
      range: [1073741824, 2147483647]
      primaries:
        - host: shard-02-primary.dc1.example.com
          port: 50051
      replicas:
        - host: shard-02-replica-1.dc1.example.com
          port: 50051
        - host: shard-02-replica-2.dc2.example.com
          port: 50051
    
    - id: shard-03
      range: [2147483648, 3221225471]
      primaries:
        - host: shard-03-primary.dc2.example.com
          port: 50051
      replicas:
        - host: shard-03-replica-1.dc2.example.com
          port: 50051
        - host: shard-03-replica-2.dc1.example.com
          port: 50051
    
    - id: shard-04
      range: [3221225472, 4294967295]
      primaries:
        - host: shard-04-primary.dc2.example.com
          port: 50051
      replicas:
        - host: shard-04-replica-1.dc2.example.com
          port: 50051
        - host: shard-04-replica-2.dc1.example.com
          port: 50051

# mTLS Configuration for inter-shard communication
# This ensures all shard-to-shard RPC calls are encrypted and authenticated
mtls:
  enabled: true
  
  # Client configuration (for outgoing connections to other shards)
  client:
    cert_path: "/etc/themisdb/certs/shard-client.pem"
    key_path: "/etc/themisdb/certs/shard-client-key.pem"
    ca_cert_path: "/etc/themisdb/certs/root-ca.pem"
    verify_server: true
  
  # Server configuration (for incoming connections from other shards)
  server:
    cert_path: "/etc/themisdb/certs/shard-server.pem"
    key_path: "/etc/themisdb/certs/shard-server-key.pem"
    ca_cert_path: "/etc/themisdb/certs/root-ca.pem"
    require_client_cert: true
  
  # Certificate management
  certificate_warning_days: 30  # Warn when certificate expires within 30 days
  auto_reload_certs: true       # Automatically reload certificates when changed
  reload_interval_seconds: 3600 # Check for certificate changes every hour

# RPC Configuration
rpc:
  timeout_ms: 5000            # Request timeout (5 seconds)
  max_retries: 3              # Maximum retry attempts
  retry_delay_ms: 100         # Initial retry delay with exponential backoff
  
  # Connection pool settings
  max_connections_per_shard: 10
  connection_idle_timeout_ms: 60000  # Close idle connections after 1 minute
  
  # Keepalive settings
  keepalive_time_ms: 30000    # Send keepalive every 30 seconds
  keepalive_timeout_ms: 10000 # Keepalive timeout (10 seconds)

routing:
  strategy: hash-range
  hash_fn: murmur3
  rebalance_mode: incremental
  
  cross_shard_joins:
    enable: true
    max_join_depth: 2
    timeout_ms: 250

rebalance:
  trigger:
    load_skew_threshold_pct: 15
    disk_util_threshold_pct: 70
  
  execution:
    max_parallel_moves: 2
    throttle_ops_per_sec: 200000
    pause_writes_during_cutover: true
    max_downtime_ms: 500
  
  safety:
    min_replicas_healthy: 2
    abort_on_lag_ms: 5000
    metrics_guardrails:
      p99_latency_max_ms: 2.5
      throughput_drop_max_pct: 15

vector_index:
  recall_target: 0.995
  pruning_enabled: true
  shard_local_cache_mb: 512
  prefetch_candidates: 64
  cross_shard_candidate_cap: 256

observability:
  metrics_endpoint: 0.0.0.0:9100
  
  tracing:
    enabled: true
    provider: otlp
    endpoint: http://otel-collector:4317
  
  logging:
    level: info
    slow_query_ms: 200
  
  # mTLS-specific metrics
  mtls_metrics:
    enabled: true
    metrics:
      - themis_mtls_handshake_success_total
      - themis_mtls_handshake_failure_total
      - themis_mtls_certificate_expiry_seconds
      - themis_mtls_connection_encrypted_total

# Security settings
security:
  # Reject unencrypted connections in production
  reject_insecure_connections: true
  
  # Enforce minimum TLS version
  min_tls_version: "TLS1.3"
  
  # Cipher suites (TLS 1.3)
  cipher_suites:
    - "TLS_AES_256_GCM_SHA384"
    - "TLS_CHACHA20_POLY1305_SHA256"
  
  # Certificate pinning (optional - for high-security deployments)
  certificate_pinning:
    enabled: false
    # pinned_certificates:
    #   - "/etc/themisdb/certs/pinned/shard-001.pem"
    #   - "/etc/themisdb/certs/pinned/shard-002.pem"

# High Availability
high_availability:
  health_check_interval_ms: 5000
  failure_detection_threshold: 3
  automatic_failover: true
  replica_promotion_delay_ms: 1000
