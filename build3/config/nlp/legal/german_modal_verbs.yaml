version: "1.0"
language: "de"
domain: "Verwaltungsrecht"
description: "German administrative law modal verbs with deontic logic semantics"

modalities:
  mandatory:
    - pattern: "\\bmuss\\b"
      deontic: "O(φ)"
      strength: 1.0
      interpretation: "Bindende Rechtspflicht"
      category: "obligation"
      examples:
        - "Der Antragsteller muss die Unterlagen einreichen."
        - "Die Behörde muss binnen Monatsfrist entscheiden."
      
    - pattern: "\\bhat zu\\b"
      deontic: "O(φ)"
      strength: 1.0
      interpretation: "Formale bindende Verpflichtung"
      category: "obligation"
      
  default_rule:
    - pattern: "\\bsoll\\b"
      deontic: "O_default(φ)"
      strength: 0.8
      interpretation: "Regelfall, Abweichung rechtfertigungsbedürftig"
      category: "default_obligation"
      examples:
        - "Die Behörde soll binnen zwei Wochen entscheiden."
        - "Die Genehmigung soll mit Auflagen versehen werden."
      context_requirements:
        - "Begründungspflicht bei Abweichung"
        - "Verhältnismäßigkeitsprüfung"
      
  discretionary:
    - pattern: "\\bkann\\b"
      deontic: "P(φ)"
      strength: 0.3
      interpretation: "Ermessensentscheidung"
      category: "permission"
      examples:
        - "Die Behörde kann eine Fristverlängerung gewähren."
        - "Die Genehmigung kann mit Auflagen verbunden werden."
      context_requirements:
        - "Ermessensausübung erforderlich"
        - "Gleichbehandlungsgrundsatz"
        - "Verhältnismäßigkeitsprüfung"

combinations:
  - pattern: ["kann", "soll"]
    interpretation: "Ermessen mit Regel-Erwartung"
    strength: 0.6
    deontic: "P(φ) ∧ O_default(φ)"
    
  - pattern: ["darf", "nicht"]
    interpretation: "Verbot"
    strength: 1.0
    deontic: "F(φ)"
    category: "prohibition"
    
  - pattern: ["muss", "nicht"]
    interpretation: "Verbot (negierte Pflicht)"
    strength: 1.0
    deontic: "F(φ)"

# Context rules for AI inference
context_rules:
  - condition: "discretionary"
    required_checks:
      - "Verhältnismäßigkeitsprüfung"
      - "Gleichbehandlungsgrundsatz"
      - "Ermessensfehlervermeidung"
      
  - condition: "default_rule"
    required_checks:
      - "Begründung bei Abweichung dokumentieren"
      - "Atypischer Sachverhalt nachweisen"
