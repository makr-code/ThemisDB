# ThemisDB RAG – Production-Ready Default Configuration (v1.4.0+)
#
# FLARE (Feedback Loop Active Retrieval) with Token Perplexity Threshold (TPT)
# gating is enabled by default starting with v1.4.0.
#
# See docs/de/features/RAG_FLARE_TPT_PRODUCTION_GUIDE.md for details.
# For migration from v1.3, see docs/MIGRATION_v1.3_to_v1.4.md.

knowledge_gap_detector:
  # FLARE Active Retrieval (enabled by default since v1.4.0)
  enable_flare: true

  # Token Perplexity Threshold (TPT) – gate for re-retrieval trigger
  # Perplexity above this value signals uncertain generation and triggers FLARE.
  perplexity_threshold: 100.0

  # Sliding-window size for local perplexity analysis
  perplexity_window_size: 10

  # Maximum number of FLARE re-retrieval rounds per query
  max_retrieval_rounds: 3

  # Minimum confidence score below which re-retrieval is triggered
  flare_confidence_threshold: 0.5

  # Token probability tracking (required for TPT gating)
  enable_token_probability: true

  # Self-consistency validation across multiple generation samples
  self_consistency_samples: 5
  consistency_threshold: 0.6
