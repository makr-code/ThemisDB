# HuggingFace Ingestion Plugin Configuration
#
# This file configures the HuggingFace dataset ingestion plugin.
# The plugin enables ThemisDB to fetch datasets directly from HuggingFace Hub.

huggingface:
  # Enable or disable the plugin
  enabled: true
  
  # Default configuration applied to all datasets
  defaults:
    # Enable streaming for large datasets
    streaming: true
    
    # Number of rows to fetch per API request
    # Larger values = fewer API calls but more memory usage
    # Recommended: 500-2000
    chunk_size: 1000
    
    # Directory for caching downloaded datasets
    cache_dir: "./cache/huggingface"
    
    # Enable local caching to avoid redundant API calls
    use_cache: true
    
    # Rate limiting (requests per second)
    # HuggingFace recommends staying below 10 req/s
    max_requests_per_second: 10
    
    # Retry configuration for network errors
    max_retries: 3
    retry_delay_ms: 1000
    
    # Default schema mapping
    text_field: "text"
    label_field: "label"
  
  # Authentication
  # Uncomment and set your HuggingFace token for private datasets
  # auth_token: "hf_..."
  
  # Dataset presets for common use cases
  presets:
    # German legal corpus (12 GB)
    legal_german:
      dataset_name: "lexlms/ger_legal_data"
      split: "train"
      text_field: "text"
      label_field: "label"
      chunk_size: 1000
      streaming: true
      
    # US legal corpus
    legal_us:
      dataset_name: "pile-of-law/pile-of-law"
      split: "train"
      text_field: "text"
      chunk_size: 1000
      streaming: true
      
    # IMDB movie reviews (for testing)
    imdb_reviews:
      dataset_name: "imdb"
      split: "train"
      text_field: "text"
      label_field: "label"
      chunk_size: 500
      
    # SQuAD question answering
    squad:
      dataset_name: "squad"
      split: "train"
      text_field: "context"
      chunk_size: 500
      
    # Wikipedia (English)
    wikipedia:
      dataset_name: "wikipedia"
      split: "train"
      text_field: "text"
      chunk_size: 2000
      streaming: true
  
  # Performance tuning
  performance:
    # Number of worker threads
    # Recommended: 2-4 for optimal balance
    worker_threads: 2
    
    # Maximum queue size
    # Limits memory usage
    max_queue_size: 100
    
    # Verbose logging for debugging
    verbose_logging: false
  
  # Cache management
  cache:
    # Maximum cache size in GB
    # Old cache files will be deleted when limit is reached
    max_size_gb: 50
    
    # Cache expiration in days
    # Cache files older than this will be deleted
    expiration_days: 30
    
    # Enable cache compression
    compress: false
