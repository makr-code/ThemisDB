# ============================================================================
# Kubernetes ConfigMap - Ethics AI Framework Configuration
# ============================================================================
# Application configuration as environment variables
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: ethics-ai-config
  namespace: ethics-ai
  labels:
    app: ethics-ai
    component: configuration
data:
  # Application settings
  APP_NAME: "Ethics AI Framework"
  APP_VERSION: "1.0.0"
  APP_ENVIRONMENT: "production"
  
  # Server configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_WORKERS: "4"
  SERVER_TIMEOUT: "120"
  
  # ThemisDB connection
  THEMIS_HOST: "themisdb"
  THEMIS_PORT: "8529"
  THEMIS_PROTOCOL: "http"
  THEMIS_TIMEOUT: "30"
  THEMIS_MAX_RETRIES: "3"
  THEMIS_RETRY_DELAY: "1"
  
  # Database settings
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_RECYCLE: "3600"
  
  # Cache configuration
  CACHE_ENABLED: "true"
  CACHE_TTL: "3600"
  CACHE_MAX_SIZE: "1000"
  
  # Logging configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_OUTPUT: "stdout"
  LOG_MAX_SIZE: "100"
  LOG_BACKUP_COUNT: "5"
  
  # Metrics and monitoring
  METRICS_ENABLED: "true"
  METRICS_PORT: "8081"
  METRICS_PATH: "/metrics"
  
  # OpenTelemetry tracing
  OTEL_ENABLED: "false"
  OTEL_EXPORTER: "otlp"
  OTEL_ENDPOINT: "http://jaeger:4317"
  OTEL_SERVICE_NAME: "ethics-ai"
  
  # Feature flags
  FEATURE_RATE_LIMITING: "true"
  FEATURE_CACHING: "true"
  FEATURE_ASYNC_PROCESSING: "true"
  
  # Rate limiting
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_PERIOD: "60"
  
  # Philosophy debate settings
  MAX_DEBATE_PARTICIPANTS: "5"
  MAX_ARGUMENT_LENGTH: "1000"
  DEBATE_TIMEOUT: "300"
  
  # LLM settings
  LLM_BACKEND: "llama"
  LLM_MODEL: "llama-2-7b"
  LLM_TEMPERATURE: "0.7"
  LLM_MAX_TOKENS: "500"
  LLM_TOP_P: "0.9"
  
  # News research settings
  NEWS_SOURCES_ENABLED: "true"
  NEWS_FETCH_INTERVAL: "3600"
  NEWS_MAX_ARTICLES: "50"
  
  # Security settings
  SECURITY_CORS_ENABLED: "true"
  SECURITY_CORS_ORIGINS: "*"
  SECURITY_RATE_LIMIT_ENABLED: "true"
  SECURITY_REQUEST_ID_ENABLED: "true"
  
  # Health check settings
  HEALTH_CHECK_INTERVAL: "30"
  HEALTH_CHECK_TIMEOUT: "10"
  READINESS_CHECK_DEPENDENCIES: "true"

---
# ============================================================================
# ConfigMap - Philosophy Definitions
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ethics-ai-philosophies
  namespace: ethics-ai
  labels:
    app: ethics-ai
    component: configuration
data:
  philosophies.yaml: |
    philosophies:
      - id: kant
        name: "Immanuel Kant"
        school: "Deontological Ethics"
        key_principles:
          - "Categorical Imperative"
          - "Duty-based morality"
          - "Universal moral laws"
        
      - id: mill
        name: "John Stuart Mill"
        school: "Utilitarianism"
        key_principles:
          - "Greatest happiness principle"
          - "Consequentialism"
          - "Harm principle"
        
      - id: rawls
        name: "John Rawls"
        school: "Justice as Fairness"
        key_principles:
          - "Original position"
          - "Veil of ignorance"
          - "Difference principle"
        
      - id: aristotle
        name: "Aristotle"
        school: "Virtue Ethics"
        key_principles:
          - "Eudaimonia"
          - "Golden mean"
          - "Practical wisdom"
        
      - id: singer
        name: "Peter Singer"
        school: "Preference Utilitarianism"
        key_principles:
          - "Animal liberation"
          - "Effective altruism"
          - "Global justice"

---
# ============================================================================
# ConfigMap - NGINX Configuration (if using sidecar)
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ethics-ai-nginx-config
  namespace: ethics-ai
  labels:
    app: ethics-ai
    component: configuration
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        upstream backend {
            server localhost:8080;
        }
        
        server {
            listen 80;
            
            location / {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
            
            location /health {
                access_log off;
                return 200 "healthy\n";
            }
        }
    }

---
# ============================================================================
# Secret - Sensitive Configuration (Example)
# ============================================================================
# In production, use proper secret management (Sealed Secrets, External Secrets, etc.)
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ethics-ai-secrets
  namespace: ethics-ai
  labels:
    app: ethics-ai
    component: configuration
type: Opaque
stringData:
  # API keys (example - replace with actual values)
  NEWS_API_KEY: "your-news-api-key-here"
  OPENAI_API_KEY: "your-openai-key-here"
  
  # Database credentials (if needed)
  THEMIS_USERNAME: "ethics-ai"
  THEMIS_PASSWORD: "change-me-in-production"
  
  # Session secret
  SESSION_SECRET: "change-me-to-random-string"
  
  # JWT secret
  JWT_SECRET: "change-me-to-random-string"
