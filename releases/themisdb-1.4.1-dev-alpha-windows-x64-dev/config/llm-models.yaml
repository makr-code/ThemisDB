# ThemisDB LLM Model Configuration
# Compatible with vLLM, Ollama, and HuggingFace model formats
# Version: 1.3.2

# =============================================================================
# Model Registry
# Defines available models, their sources, and configuration
# =============================================================================

models:
  # ---------------------------------------------------------------------------
  # Mistral Models (Recommended for Production)
  # ---------------------------------------------------------------------------
  - name: mistral-7b-instruct
    version: v0.2
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    sources:
      huggingface: mistralai/Mistral-7B-Instruct-v0.2
      ollama: mistral:7b-instruct-v0.2-q4_K_M
      local: /models/mistral-7b-instruct-v0.2-q4.gguf
    parameters:
      context_length: 8192
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.95
      top_k: 40
    gpu:
      layers_offload: 32
      vram_required_mb: 4096
      cuda_compute_capability: "7.5"
    lazy_loading:
      enabled: true
      priority: high
      ttl_seconds: 1800
      pin_to_memory: true
    loras:
      - legal-qa-v1
      - medical-qa-v1
      - code-assistant-v1
    
  - name: mistral-7b-base
    version: v0.2
    type: base
    format: gguf
    size: 7B
    quantization: Q4_K_M
    sources:
      huggingface: mistralai/Mistral-7B-v0.2
      ollama: mistral:7b-v0.2-q4_K_M
      local: /models/mistral-7b-v0.2-q4.gguf
    parameters:
      context_length: 8192
      max_tokens: 4096
    gpu:
      layers_offload: 32
      vram_required_mb: 4096
    lazy_loading:
      enabled: true
      priority: medium
      ttl_seconds: 3600

  # ---------------------------------------------------------------------------
  # Llama 3 Models
  # ---------------------------------------------------------------------------
  - name: llama-3-8b-instruct
    version: "3.0"
    type: instruction
    format: gguf
    size: 8B
    quantization: Q4_K_M
    sources:
      huggingface: meta-llama/Meta-Llama-3-8B-Instruct
      ollama: llama3:8b-instruct-q4_K_M
      local: /models/llama-3-8b-instruct-q4.gguf
    parameters:
      context_length: 8192
      max_tokens: 4096
      temperature: 0.6
      top_p: 0.9
    gpu:
      layers_offload: 32
      vram_required_mb: 4500
    lazy_loading:
      enabled: true
      priority: high
      ttl_seconds: 1800
    loras:
      - general-qa-v1
      - summarization-v1

  - name: llama-3-70b-instruct
    version: "3.0"
    type: instruction
    format: gguf
    size: 70B
    quantization: Q4_K_M
    sources:
      huggingface: meta-llama/Meta-Llama-3-70B-Instruct
      vllm: meta-llama/Meta-Llama-3-70B-Instruct
      local: /models/llama-3-70b-instruct-q4.gguf
    parameters:
      context_length: 8192
      max_tokens: 4096
      temperature: 0.6
      top_p: 0.9
    gpu:
      layers_offload: 60
      vram_required_mb: 35000
      tensor_parallel: 2
    lazy_loading:
      enabled: false
      priority: critical
      pin_to_memory: true
    deployment:
      multi_gpu: true
      min_gpus: 2

  # ---------------------------------------------------------------------------
  # Code-Specialized Models
  # ---------------------------------------------------------------------------
  - name: codellama-7b-instruct
    version: v2
    type: code
    format: gguf
    size: 7B
    quantization: Q4_K_M
    sources:
      huggingface: codellama/CodeLlama-7b-Instruct-hf
      ollama: codellama:7b-instruct
      local: /models/codellama-7b-instruct-q4.gguf
    parameters:
      context_length: 16384
      max_tokens: 8192
      temperature: 0.2
      top_p: 0.95
    gpu:
      layers_offload: 32
      vram_required_mb: 4200
    lazy_loading:
      enabled: true
      priority: medium
      ttl_seconds: 3600
    specialization:
      languages:
        - python
        - javascript
        - cpp
        - rust
        - go

  - name: deepseek-coder-6.7b
    version: v1.5
    type: code
    format: gguf
    size: 6.7B
    quantization: Q4_K_M
    sources:
      huggingface: deepseek-ai/deepseek-coder-6.7b-instruct
      ollama: deepseek-coder:6.7b
      local: /models/deepseek-coder-6.7b-q4.gguf
    parameters:
      context_length: 16384
      max_tokens: 8192
      temperature: 0.2
    gpu:
      layers_offload: 32
      vram_required_mb: 3800
    lazy_loading:
      enabled: true
      priority: low
      ttl_seconds: 7200

  # ---------------------------------------------------------------------------
  # Embedding Models
  # ---------------------------------------------------------------------------
  - name: bge-large-en-v1.5
    version: v1.5
    type: embedding
    format: onnx
    size: 335M
    sources:
      huggingface: BAAI/bge-large-en-v1.5
      local: /models/bge-large-en-v1.5.onnx
    parameters:
      embedding_dim: 1024
      max_sequence_length: 512
      normalize_embeddings: true
    gpu:
      vram_required_mb: 400
    lazy_loading:
      enabled: true
      priority: high
      pin_to_memory: true

  - name: e5-mistral-7b-instruct
    version: v1
    type: embedding
    format: gguf
    size: 7B
    quantization: Q4_K_M
    sources:
      huggingface: intfloat/e5-mistral-7b-instruct
      local: /models/e5-mistral-7b-instruct-q4.gguf
    parameters:
      embedding_dim: 4096
      max_sequence_length: 8192
    gpu:
      layers_offload: 32
      vram_required_mb: 4096
    lazy_loading:
      enabled: true
      priority: medium
      ttl_seconds: 3600

  # ---------------------------------------------------------------------------
  # Multimodal Models
  # ---------------------------------------------------------------------------
  - name: llava-v1.6-mistral-7b
    version: v1.6
    type: multimodal
    format: gguf
    size: 7B
    quantization: Q4_K_M
    modalities:
      - text
      - image
    sources:
      huggingface: liuhaotian/llava-v1.6-mistral-7b
      ollama: llava:7b-v1.6-mistral
      local: /models/llava-v1.6-mistral-7b-q4.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
      temperature: 0.2
    gpu:
      layers_offload: 32
      vram_required_mb: 5500
    lazy_loading:
      enabled: true
      priority: low
      ttl_seconds: 7200

# =============================================================================
# LoRA Adapters Configuration
# =============================================================================

loras:
  # ---------------------------------------------------------------------------
  # Domain-Specific Adapters
  # ---------------------------------------------------------------------------
  - name: legal-qa-v1
    version: v1.0
    base_model: mistral-7b-instruct
    type: domain_specialist
    domain: legal
    format: safetensors
    sources:
      huggingface: themisdb/legal-qa-mistral-7b-lora
      local: /loras/legal-qa-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
      target_modules:
        - q_proj
        - v_proj
        - k_proj
        - o_proj
    size_mb: 45
    vram_required_mb: 50
    use_cases:
      - legal document analysis
      - contract review
      - compliance checking
    
  - name: medical-qa-v1
    version: v1.0
    base_model: mistral-7b-instruct
    type: domain_specialist
    domain: medical
    format: safetensors
    sources:
      huggingface: themisdb/medical-qa-mistral-7b-lora
      local: /loras/medical-qa-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    size_mb: 45
    vram_required_mb: 50
    use_cases:
      - medical literature review
      - clinical notes analysis
      - drug interaction checking

  - name: code-assistant-v1
    version: v1.0
    base_model: mistral-7b-instruct
    type: task_specialist
    domain: programming
    format: safetensors
    sources:
      huggingface: themisdb/code-assistant-mistral-7b-lora
      local: /loras/code-assistant-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    size_mb: 45
    vram_required_mb: 50
    use_cases:
      - code generation
      - code review
      - debugging assistance

  - name: general-qa-v1
    version: v1.0
    base_model: llama-3-8b-instruct
    type: task_specialist
    domain: general
    format: safetensors
    sources:
      huggingface: themisdb/general-qa-llama3-lora
      local: /loras/general-qa-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    size_mb: 50
    vram_required_mb: 55

  - name: summarization-v1
    version: v1.0
    base_model: llama-3-8b-instruct
    type: task_specialist
    domain: summarization
    format: safetensors
    sources:
      huggingface: themisdb/summarization-llama3-lora
      local: /loras/summarization-v1.safetensors
    parameters:
      rank: 8
      alpha: 16
    size_mb: 25
    vram_required_mb: 30
    use_cases:
      - document summarization
      - meeting notes
      - article extraction

  # ---------------------------------------------------------------------------
  # Multilingual Adapters
  # ---------------------------------------------------------------------------
  - name: german-legal-v1
    version: v1.0
    base_model: mistral-7b-instruct
    type: domain_specialist
    domain: legal
    language: de
    format: safetensors
    sources:
      huggingface: themisdb/german-legal-mistral-7b-lora
      local: /loras/german-legal-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    size_mb: 45
    vram_required_mb: 50

  - name: french-medical-v1
    version: v1.0
    base_model: mistral-7b-instruct
    type: domain_specialist
    domain: medical
    language: fr
    format: safetensors
    sources:
      huggingface: themisdb/french-medical-mistral-7b-lora
      local: /loras/french-medical-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    size_mb: 45
    vram_required_mb: 50

# =============================================================================
# Resource Pools Configuration
# =============================================================================

resource_pools:
  # ---------------------------------------------------------------------------
  # Default Pool (Single GPU)
  # ---------------------------------------------------------------------------
  default:
    max_models: 3
    max_loras: 16
    max_vram_mb: 20480
    max_ram_mb: 32768
    gpu_devices:
      - 0
    lazy_loading:
      enabled: true
      model_ttl_seconds: 1800
      lru_cache_size: 3
    multi_lora:
      enabled: true
      max_concurrent_loras: 8
      batch_size: 32

  # ---------------------------------------------------------------------------
  # High-Performance Pool (Multi-GPU)
  # ---------------------------------------------------------------------------
  high_performance:
    max_models: 5
    max_loras: 32
    max_vram_mb: 81920
    max_ram_mb: 131072
    gpu_devices:
      - 0
      - 1
      - 2
      - 3
    lazy_loading:
      enabled: false
      model_ttl_seconds: 7200
    multi_lora:
      enabled: true
      max_concurrent_loras: 16
      batch_size: 128
    tensor_parallel:
      enabled: true
      world_size: 4

  # ---------------------------------------------------------------------------
  # Development Pool (CPU/Small GPU)
  # ---------------------------------------------------------------------------
  development:
    max_models: 1
    max_loras: 4
    max_vram_mb: 4096
    max_ram_mb: 16384
    gpu_devices:
      - 0
    lazy_loading:
      enabled: true
      model_ttl_seconds: 600
      lru_cache_size: 1
    multi_lora:
      enabled: true
      max_concurrent_loras: 2
      batch_size: 8
    cpu_fallback: true

# =============================================================================
# Model Presets (Quick Configuration)
# =============================================================================

presets:
  # vLLM-compatible preset
  vllm:
    model: llama-3-70b-instruct
    gpu_memory_utilization: 0.9
    max_num_seqs: 256
    max_model_len: 8192
    tensor_parallel_size: 2
    dtype: auto
    enforce_eager: false
    
  # Ollama-compatible preset
  ollama:
    model: mistral-7b-instruct
    num_gpu: 1
    num_thread: 8
    num_ctx: 8192
    num_batch: 512
    num_keep: 4
    repeat_penalty: 1.1
    
  # ThemisDB optimized preset
  themis_optimized:
    model: mistral-7b-instruct
    lora: legal-qa-v1
    resource_pool: default
    async_inference:
      enabled: true
      num_workers: 4
      max_queue_size: 1000
      priority_scheduling: true
    caching:
      response_cache: true
      prefix_cache: true
      semantic_similarity_threshold: 0.90
    batching:
      enabled: true
      max_batch_size: 32
      timeout_ms: 100

# =============================================================================
# HuggingFace Integration
# =============================================================================

huggingface:
  # Authentication
  token: ${HUGGINGFACE_TOKEN}
  
  # Model download settings
  download:
    cache_dir: /models/huggingface
    use_auth_token: true
    revision: main
    force_download: false
    resume_download: true
    
  # Auto-conversion settings
  auto_convert:
    enabled: true
    target_format: gguf
    quantization: Q4_K_M
    output_dir: /models/converted
    
  # Model repositories
  repositories:
    - mistralai/Mistral-7B-Instruct-v0.2
    - meta-llama/Meta-Llama-3-8B-Instruct
    - codellama/CodeLlama-7b-Instruct-hf
    - BAAI/bge-large-en-v1.5
    - deepseek-ai/deepseek-coder-6.7b-instruct

# =============================================================================
# Ollama Integration
# =============================================================================

ollama:
  # Server settings
  server:
    host: localhost
    port: 11434
    timeout_seconds: 300
    
  # Model pull settings
  pull:
    insecure: false
    stream: true
    
  # Model list to sync
  models:
    - mistral:7b-instruct-v0.2-q4_K_M
    - llama3:8b-instruct-q4_K_M
    - codellama:7b-instruct
    - deepseek-coder:6.7b
    - llava:7b-v1.6-mistral

# =============================================================================
# vLLM Integration
# =============================================================================

vllm:
  # Server settings
  server:
    host: localhost
    port: 8000
    api_key: ${VLLM_API_KEY}
    
  # Engine settings
  engine:
    model: meta-llama/Meta-Llama-3-70B-Instruct
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.9
    max_num_seqs: 256
    max_model_len: 8192
    dtype: auto
    
  # Scheduler settings
  scheduler:
    max_num_batched_tokens: 8192
    max_num_seqs: 256
    scheduling_policy: fcfs

# =============================================================================
# Storage Configuration
# =============================================================================

storage:
  # Model storage
  models:
    root_dir: /models
    blob_store:
      enabled: true
      backend: rocksdb
      path: /data/model_blobs
    raft_replication:
      enabled: true
      replication_factor: 3
    memory_mapping:
      enabled: true
      lazy_load: true
      
  # LoRA storage
  loras:
    root_dir: /loras
    entity_store:
      enabled: true
      urn_prefix: "urn:themis:lora:"
    cross_shard_transfer:
      enabled: true
      compression: zstd
      
  # Cache storage
  cache:
    response_cache:
      backend: rocksdb
      path: /data/response_cache
      max_size_gb: 10
    prefix_cache:
      backend: hnsw
      path: /data/prefix_cache
      max_entries: 100000
    metadata_cache:
      backend: tbb
      max_entries: 10000

# =============================================================================
# Performance Tuning
# =============================================================================

performance:
  # Thread configuration
  threads:
    db_workers: 16
    inference_workers: 4
    io_workers: 8
    
  # Memory configuration
  memory:
    shared_memory: true
    memory_pool_size_mb: 4096
    page_size_kb: 4
    
  # Batch configuration
  batching:
    max_batch_size: 32
    batch_timeout_ms: 100
    dynamic_batching: true
    
  # Cache configuration
  caching:
    model_metadata_cache_size: 1000
    lora_metadata_cache_size: 1000
    response_cache_ttl_hours: 24
    prefix_cache_ttl_hours: 168

# =============================================================================
# Monitoring & Observability
# =============================================================================

monitoring:
  # Metrics
  metrics:
    enabled: true
    prometheus_port: 9090
    export_interval_seconds: 15
    
  # Logging
  logging:
    level: INFO
    format: json
    output: /var/log/themis/llm.log
    
  # Tracing
  tracing:
    enabled: true
    backend: opentelemetry
    endpoint: http://localhost:4317
    
  # Health checks
  health:
    enabled: true
    interval_seconds: 30
    timeout_seconds: 5
    endpoints:
      - /api/v1/llm/health
      - /api/v1/llm/stats

# =============================================================================
# Security Configuration
# =============================================================================

security:
  # Authentication
  authentication:
    jwt:
      enabled: true
      secret_key: ${JWT_SECRET_KEY}
      algorithm: HS256
      expiration_hours: 24
      
  # Authorization
  authorization:
    rbac:
      enabled: true
      admin_users:
        - admin@example.com
      model_access_control: true
      
  # Rate limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_size: 10
    
  # Input validation
  validation:
    max_prompt_length: 8192
    max_output_tokens: 4096
    sanitize_input: true
    block_malicious_patterns: true

# =============================================================================
# Deployment Profiles
# =============================================================================

profiles:
  # Production profile
  production:
    resource_pool: high_performance
    monitoring:
      enabled: true
      level: detailed
    security:
      authentication: required
      rate_limiting: strict
    storage:
      raft_replication: true
      backup_enabled: true
    
  # Staging profile
  staging:
    resource_pool: default
    monitoring:
      enabled: true
      level: normal
    security:
      authentication: required
      rate_limiting: normal
    storage:
      raft_replication: false
      
  # Development profile
  development:
    resource_pool: development
    monitoring:
      enabled: true
      level: verbose
    security:
      authentication: optional
      rate_limiting: disabled
    storage:
      raft_replication: false
