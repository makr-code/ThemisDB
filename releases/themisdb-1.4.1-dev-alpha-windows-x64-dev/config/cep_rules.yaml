# ThemisDB CEP Rules Configuration
# 
# This file contains example rules for the Complex Event Processing engine.
# Rules are processed in order of priority.

# Global settings
global:
  default_stream: "cdc_events"
  checkpoint_interval_ms: 10000
  enable_metrics: true

# Streams
streams:
  - stream_id: "cdc_events"
    stream_name: "CDC Events"
    buffer_size: 1048576
    partitions: 16
    partition_key_field: "document_id"
    retention_ms: 3600000
    
  - stream_id: "security_events"
    stream_name: "Security Events"
    buffer_size: 524288
    partitions: 8
    partition_key_field: "userId"
    retention_ms: 86400000
    
  - stream_id: "query_events"
    stream_name: "Query Events"
    buffer_size: 262144
    partitions: 4
    retention_ms: 3600000

# Rules
rules:
  # ===========================================================================
  # Security Rules
  # ===========================================================================
  
  - rule_id: "brute_force_detection"
    rule_name: "Brute Force Login Detection"
    description: "Detect multiple failed login attempts from same user"
    enabled: true
    min_priority: NORMAL
    streams: ["security_events"]
    filter: "type = 'AUTH_FAILURE'"
    window:
      type: TUMBLING
      size_ms: 300000  # 5 minutes
    aggregations:
      - name: attempts
        type: COUNT
    group_by: ["userId", "ip_address"]
    having: "attempts >= 5"
    actions:
      - type: ALERT
        target: "security"
        template: |
          Brute force attack detected:
          - User: ${userId}
          - IP: ${ip_address}
          - Attempts: ${attempts}
          - Time window: 5 minutes
      - type: WEBHOOK
        target: "https://security.internal/api/incidents"
        headers:
          Content-Type: "application/json"
          X-Alert-Source: "ThemisDB-CEP"
        template: |
          {
            "type": "brute_force",
            "userId": "${userId}",
            "ip": "${ip_address}",
            "attempts": ${attempts},
            "severity": "high"
          }
    tags:
      category: "security"
      severity: "high"
      
  - rule_id: "suspicious_location"
    rule_name: "Suspicious Location Login"
    description: "Detect login from unusual location"
    enabled: true
    streams: ["security_events"]
    pattern:
      pattern_id: "location_change"
      type: SEQUENCE
      event_types: ["AUTH_SUCCESS", "AUTH_SUCCESS"]
      within_ms: 3600000  # 1 hour
      condition: "e1.location != e2.location AND geo_distance(e1.location, e2.location) > 500"
    group_by: ["userId"]
    actions:
      - type: ALERT
        target: "security"
        template: "Impossible travel detected for user ${userId}: ${e1.location} -> ${e2.location}"
    tags:
      category: "security"
      severity: "medium"

  # ===========================================================================
  # Performance Rules
  # ===========================================================================
  
  - rule_id: "slow_queries"
    rule_name: "Slow Query Detection"
    description: "Detect queries exceeding latency threshold"
    enabled: true
    streams: ["query_events"]
    filter: "type = 'QUERY_COMPLETE' AND latency_ms > 1000"
    window:
      type: TUMBLING
      size_ms: 60000  # 1 minute
    aggregations:
      - name: slow_count
        type: COUNT
      - name: avg_latency
        type: AVG
        field: "latency_ms"
      - name: max_latency
        type: MAX
        field: "latency_ms"
    group_by: ["collection"]
    having: "slow_count >= 10"
    actions:
      - type: ALERT
        target: "performance"
        template: |
          High slow query rate detected:
          - Collection: ${collection}
          - Slow queries: ${slow_count}
          - Avg latency: ${avg_latency}ms
          - Max latency: ${max_latency}ms
      - type: DB_WRITE
        target: "performance_alerts"
    tags:
      category: "performance"
      severity: "warning"
      
  - rule_id: "query_error_rate"
    rule_name: "Query Error Rate Monitoring"
    description: "Monitor query error rates"
    enabled: true
    streams: ["query_events"]
    filter: "type IN ('QUERY_COMPLETE', 'QUERY_ERROR')"
    window:
      type: TUMBLING
      size_ms: 300000  # 5 minutes
    aggregations:
      - name: total_queries
        type: COUNT
      - name: error_count
        type: COUNT
        condition: "type = 'QUERY_ERROR'"
    group_by: ["collection"]
    having: "error_count * 100.0 / total_queries > 5"  # > 5% error rate
    actions:
      - type: ALERT
        target: "operations"
        template: "High error rate for collection ${collection}: ${error_count}/${total_queries} errors"
    tags:
      category: "operations"
      severity: "high"

  # ===========================================================================
  # Business Rules
  # ===========================================================================
  
  - rule_id: "high_value_transaction"
    rule_name: "High Value Transaction Alert"
    description: "Alert on high value transactions"
    enabled: true
    streams: ["cdc_events"]
    filter: "collection = 'transactions' AND type = 'DOCUMENT_INSERT' AND amount > 10000"
    actions:
      - type: ALERT
        target: "finance"
        template: "High value transaction: ${document_id}, Amount: ${amount}"
      - type: WEBHOOK
        target: "https://finance.internal/api/review"
        template: |
          {
            "transaction_id": "${document_id}",
            "amount": ${amount},
            "requires_review": true
          }
    tags:
      category: "business"
      severity: "info"
      
  - rule_id: "fraud_pattern"
    rule_name: "Fraud Pattern Detection"
    description: "Detect potential fraud patterns"
    enabled: true
    streams: ["cdc_events"]
    filter: "collection = 'transactions'"
    pattern:
      pattern_id: "rapid_transactions"
      type: REPETITION
      event_types: ["DOCUMENT_INSERT"]
      min_occurrences: 5
      max_occurrences: 100
      within_ms: 60000  # 5+ transactions in 1 minute
      condition: "type = 'DOCUMENT_INSERT'"
    window:
      type: TUMBLING
      size_ms: 60000
    aggregations:
      - name: tx_count
        type: COUNT
      - name: total_amount
        type: SUM
        field: "amount"
    group_by: ["userId"]
    having: "tx_count >= 5 AND total_amount > 5000"
    actions:
      - type: ALERT
        target: "fraud"
        template: |
          Potential fraud detected:
          - User: ${userId}
          - Transactions: ${tx_count} in 1 minute
          - Total amount: ${total_amount}
      - type: WEBHOOK
        target: "https://fraud.internal/api/flag"
        template: |
          {
            "userId": "${userId}",
            "pattern": "rapid_transactions",
            "tx_count": ${tx_count},
            "total_amount": ${total_amount}
          }
    tags:
      category: "fraud"
      severity: "critical"

  # ===========================================================================
  # System Health Rules
  # ===========================================================================
  
  - rule_id: "shard_health"
    rule_name: "Shard Health Monitoring"
    description: "Monitor shard join/leave events"
    enabled: true
    streams: ["cdc_events"]
    filter: "type IN ('SHARD_JOIN', 'SHARD_LEAVE')"
    window:
      type: TUMBLING
      size_ms: 300000
    aggregations:
      - name: join_count
        type: COUNT
        condition: "type = 'SHARD_JOIN'"
      - name: leave_count
        type: COUNT
        condition: "type = 'SHARD_LEAVE'"
    having: "leave_count > 0"
    actions:
      - type: ALERT
        target: "operations"
        template: |
          Shard topology change:
          - Joins: ${join_count}
          - Leaves: ${leave_count}
      - type: SLACK
        target: "${SLACK_WEBHOOK_URL}"
        template: ":warning: ThemisDB: ${leave_count} shard(s) left the cluster"
    tags:
      category: "infrastructure"
      severity: "warning"
      
  - rule_id: "rebalancing_monitor"
    rule_name: "Rebalancing Monitor"
    description: "Monitor rebalancing operations"
    enabled: true
    streams: ["cdc_events"]
    pattern:
      pattern_id: "long_rebalance"
      type: SEQUENCE
      event_types: ["REBALANCE_START"]
      within_ms: 1800000  # 30 minutes without completion
    actions:
      - type: ALERT
        target: "operations"
        template: "Rebalancing taking longer than expected (> 30 minutes)"
    tags:
      category: "infrastructure"
      severity: "warning"

  # ===========================================================================
  # Data Quality Rules
  # ===========================================================================
  
  - rule_id: "schema_violation"
    rule_name: "Schema Violation Detection"
    description: "Detect documents with missing required fields"
    enabled: true
    streams: ["cdc_events"]
    filter: "type = 'DOCUMENT_INSERT' AND collection = 'users'"
    # Prüfe auf fehlende Pflichtfelder
    condition: "email IS NULL OR name IS NULL"
    actions:
      - type: ALERT
        target: "data_quality"
        template: |
          Schema violation in collection 'users':
          - Document: ${document_id}
          - Missing fields detected
      - type: DB_WRITE
        target: "data_quality_issues"
    tags:
      category: "data_quality"
      severity: "warning"

  # ===========================================================================
  # Aggregation Rules
  # ===========================================================================
  
  - rule_id: "hourly_metrics"
    rule_name: "Hourly Metrics Aggregation"
    description: "Aggregate hourly metrics for all collections"
    enabled: true
    streams: ["cdc_events"]
    filter: "type IN ('DOCUMENT_INSERT', 'DOCUMENT_UPDATE', 'DOCUMENT_DELETE')"
    window:
      type: TUMBLING
      size_ms: 3600000  # 1 hour
    aggregations:
      - name: inserts
        type: COUNT
        condition: "type = 'DOCUMENT_INSERT'"
      - name: updates
        type: COUNT
        condition: "type = 'DOCUMENT_UPDATE'"
      - name: deletes
        type: COUNT
        condition: "type = 'DOCUMENT_DELETE'"
      - name: total_ops
        type: COUNT
    group_by: ["collection"]
    actions:
      - type: DB_WRITE
        target: "metrics_hourly"
        template: |
          {
            "timestamp": "${window_end}",
            "collection": "${collection}",
            "inserts": ${inserts},
            "updates": ${updates},
            "deletes": ${deletes},
            "total": ${total_ops}
          }
    tags:
      category: "metrics"
      severity: "info"
