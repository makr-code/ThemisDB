# FEM Edge Type Defaults Configuration
# Defines default FEM metadata values for each edge type

edge_types:
  # ========================================================================
  # STRUCTURAL - Strong coupling (Parent-Child, Containment)
  # ========================================================================
  
  PARENT_OF:
    weight: 0.95
    damping_coefficient: 0.05
    material_stiffness: 0.95
    bidirectional_factor: 0.8  # Children affect parents too
    temporal_decay_rate: 0.0
    criticality: "critical"
    change_sensitivity: 0.9
    propagation_delay_hours: 0.0
    description: "Strong hierarchical relationship - changes propagate strongly upward"
    
  CHILD_OF:
    weight: 0.90
    damping_coefficient: 0.10
    material_stiffness: 0.90
    bidirectional_factor: 0.3  # Some backward propagation
    temporal_decay_rate: 0.0
    criticality: "high"
    change_sensitivity: 0.85
    propagation_delay_hours: 0.0
    description: "Inverse of PARENT_OF - changes propagate strongly downward"
    
  CONTAINS:
    weight: 0.85
    damping_coefficient: 0.15
    material_stiffness: 0.85
    bidirectional_factor: 0.6
    temporal_decay_rate: 0.0
    criticality: "high"
    change_sensitivity: 0.8
    propagation_delay_hours: 0.0
    description: "Containment relationship - contents affect container"
    
  PART_OF:
    weight: 0.88
    damping_coefficient: 0.12
    material_stiffness: 0.88
    bidirectional_factor: 0.5
    temporal_decay_rate: 0.0
    criticality: "high"
    change_sensitivity: 0.82
    propagation_delay_hours: 0.0
    description: "Part-whole relationship"
  
  # ========================================================================
  # REFERENCE - Medium coupling (References, Links, Citations)
  # ========================================================================
  
  REFERENCES:
    weight: 0.60
    damping_coefficient: 0.30
    material_stiffness: 0.60
    bidirectional_factor: 0.1
    temporal_decay_rate: 0.02
    criticality: "medium"
    change_sensitivity: 0.6
    propagation_delay_hours: 0.0
    description: "Reference relationship - moderate impact propagation"
    
  LINKS_TO:
    weight: 0.40
    damping_coefficient: 0.50
    material_stiffness: 0.40
    bidirectional_factor: 0.05
    temporal_decay_rate: 0.05
    criticality: "low"
    change_sensitivity: 0.4
    propagation_delay_hours: 0.0
    description: "Weak link - low impact propagation"
    
  CITES:
    weight: 0.50
    damping_coefficient: 0.40
    material_stiffness: 0.50
    bidirectional_factor: 0.2
    temporal_decay_rate: 0.03
    criticality: "medium"
    change_sensitivity: 0.5
    propagation_delay_hours: 0.0
    description: "Citation relationship - moderate bidirectional impact"
    
  MENTIONS:
    weight: 0.30
    damping_coefficient: 0.60
    material_stiffness: 0.30
    bidirectional_factor: 0.1
    temporal_decay_rate: 0.08
    criticality: "low"
    change_sensitivity: 0.3
    propagation_delay_hours: 0.0
    description: "Weak mention - minimal impact"
  
  # ========================================================================
  # WORKFLOW - Process dependencies (Critical for business processes)
  # ========================================================================
  
  DEPENDS_ON:
    weight: 0.90
    damping_coefficient: 0.10
    material_stiffness: 0.90
    bidirectional_factor: 0.0  # Only forward propagation
    temporal_decay_rate: 0.0
    criticality: "critical"
    change_sensitivity: 0.95
    propagation_delay_hours: 0.0
    description: "Critical dependency - changes propagate strongly"
    
  TRIGGERS:
    weight: 0.80
    damping_coefficient: 0.20
    material_stiffness: 0.80
    bidirectional_factor: 0.0
    temporal_decay_rate: 0.0
    criticality: "high"
    change_sensitivity: 0.85
    propagation_delay_hours: 0.5
    description: "Trigger relationship - delayed but strong impact"
    
  FOLLOWS:
    weight: 0.70
    damping_coefficient: 0.25
    material_stiffness: 0.70
    bidirectional_factor: 0.1
    temporal_decay_rate: 0.01
    criticality: "medium"
    change_sensitivity: 0.7
    propagation_delay_hours: 1.0
    description: "Sequential relationship - moderate delayed impact"
    
  BLOCKS:
    weight: 0.95
    damping_coefficient: 0.05
    material_stiffness: 0.95
    bidirectional_factor: 0.0
    temporal_decay_rate: 0.0
    criticality: "critical"
    change_sensitivity: 1.0
    propagation_delay_hours: 0.0
    description: "Blocking dependency - maximum impact"
  
  # ========================================================================
  # SEMANTIC - Weak coupling (Similarity, Relationships)
  # ========================================================================
  
  SIMILAR_TO:
    weight: 0.30
    damping_coefficient: 0.60
    material_stiffness: 0.30
    bidirectional_factor: 0.5  # Symmetric relationship
    temporal_decay_rate: 0.10
    criticality: "low"
    change_sensitivity: 0.3
    propagation_delay_hours: 0.0
    description: "Similarity - weak symmetric impact"
    
  RELATED_TO:
    weight: 0.40
    damping_coefficient: 0.50
    material_stiffness: 0.40
    bidirectional_factor: 0.4
    temporal_decay_rate: 0.08
    criticality: "low"
    change_sensitivity: 0.4
    propagation_delay_hours: 0.0
    description: "General relationship - weak symmetric impact"
    
  IS_A:
    weight: 0.75
    damping_coefficient: 0.20
    material_stiffness: 0.75
    bidirectional_factor: 0.3
    temporal_decay_rate: 0.0
    criticality: "high"
    change_sensitivity: 0.75
    propagation_delay_hours: 0.0
    description: "Type-subtype relationship - strong impact"
    
  SYNONYM_OF:
    weight: 0.85
    damping_coefficient: 0.15
    material_stiffness: 0.85
    bidirectional_factor: 0.9  # Almost fully bidirectional
    temporal_decay_rate: 0.0
    criticality: "high"
    change_sensitivity: 0.85
    propagation_delay_hours: 0.0
    description: "Synonym - very strong bidirectional impact"
  
  # ========================================================================
  # TEMPORAL - Time-dependent relationships
  # ========================================================================
  
  SUCCEEDED_BY:
    weight: 0.75
    damping_coefficient: 0.20
    material_stiffness: 0.75
    bidirectional_factor: 0.0
    temporal_decay_rate: 0.10  # Impact decreases over time
    criticality: "medium"
    change_sensitivity: 0.7
    propagation_delay_hours: 24.0
    description: "Temporal succession - time-decaying impact"
    
  PRECEDED_BY:
    weight: 0.65
    damping_coefficient: 0.30
    material_stiffness: 0.65
    bidirectional_factor: 0.0
    temporal_decay_rate: 0.15
    criticality: "medium"
    change_sensitivity: 0.6
    propagation_delay_hours: 0.0
    description: "Temporal precedence - backward time impact"
    
  VALID_DURING:
    weight: 0.85
    damping_coefficient: 0.15
    material_stiffness: 0.85
    bidirectional_factor: 0.2
    temporal_decay_rate: 0.05
    criticality: "high"
    change_sensitivity: 0.8
    propagation_delay_hours: 0.0
    description: "Temporal validity - strong time-bound impact"
    
  OVERLAPS:
    weight: 0.50
    damping_coefficient: 0.40
    material_stiffness: 0.50
    bidirectional_factor: 0.5
    temporal_decay_rate: 0.12
    criticality: "medium"
    change_sensitivity: 0.5
    propagation_delay_hours: 0.0
    description: "Temporal overlap - symmetric time-bound impact"
  
  # ========================================================================
  # ACCESS - Permission and ownership relationships
  # ========================================================================
  
  CAN_READ:
    weight: 0.20
    damping_coefficient: 0.70
    material_stiffness: 0.20
    bidirectional_factor: 0.0
    temporal_decay_rate: 0.0
    criticality: "low"
    change_sensitivity: 0.2
    propagation_delay_hours: 0.0
    description: "Read permission - minimal impact"
    
  CAN_WRITE:
    weight: 0.60
    damping_coefficient: 0.30
    material_stiffness: 0.60
    bidirectional_factor: 0.0
    temporal_decay_rate: 0.0
    criticality: "medium"
    change_sensitivity: 0.6
    propagation_delay_hours: 0.0
    description: "Write permission - moderate impact"
    
  CAN_DELETE:
    weight: 0.90
    damping_coefficient: 0.10
    material_stiffness: 0.90
    bidirectional_factor: 0.0
    temporal_decay_rate: 0.0
    criticality: "critical"
    change_sensitivity: 0.95
    propagation_delay_hours: 0.0
    description: "Delete permission - high impact"
    
  OWNS:
    weight: 0.95
    damping_coefficient: 0.05
    material_stiffness: 0.95
    bidirectional_factor: 0.3
    temporal_decay_rate: 0.0
    criticality: "critical"
    change_sensitivity: 0.95
    propagation_delay_hours: 0.0
    description: "Ownership - maximum impact"
    
  MANAGES:
    weight: 0.85
    damping_coefficient: 0.15
    material_stiffness: 0.85
    bidirectional_factor: 0.2
    temporal_decay_rate: 0.0
    criticality: "high"
    change_sensitivity: 0.85
    propagation_delay_hours: 0.0
    description: "Management relationship - strong impact"

# ========================================================================
# Context-based modifiers
# These multiply the base values based on additional context
# ========================================================================

context_modifiers:
  # Business impact increases weight and criticality
  business_impact:
    critical: 1.3
    high: 1.15
    medium: 1.0
    low: 0.75
  
  # Update frequency affects damping
  # High frequency = less damping (more impact propagation)
  update_frequency:
    high: 0.75    # Reduce damping by 25%
    medium: 1.0
    low: 1.25     # Increase damping by 25%
    rare: 1.5
  
  # Dependency type affects weight
  dependency_type:
    functional: 1.25   # Functional dependencies are critical
    data: 1.15         # Data dependencies are important
    structural: 1.0    # Structural is baseline
    reference: 0.85    # References are weaker
    optional: 0.6      # Optional deps are weak
  
  # Change type affects sensitivity
  change_type:
    breaking: 1.5      # Breaking changes have high impact
    major: 1.25
    minor: 1.0
    patch: 0.8
    cosmetic: 0.5

# ========================================================================
# Node metadata defaults by document type
# ========================================================================

node_type_defaults:
  specification:
    inertia: 0.3           # Low inertia - changes are significant
    elasticity: 0.6
    stability: 0.7         # Specs change less frequently
    change_amplification: 1.3  # Changes amplify
    impact_radius: 8
    criticality: "critical"
    
  implementation:
    inertia: 0.6           # Higher inertia - more changes expected
    elasticity: 0.8
    stability: 0.4         # Code changes frequently
    change_amplification: 1.0
    impact_radius: 5
    criticality: "high"
    
  documentation:
    inertia: 0.7
    elasticity: 0.9
    stability: 0.5
    change_amplification: 0.7  # Docs changes have less impact
    impact_radius: 3
    criticality: "medium"
    
  configuration:
    inertia: 0.2           # Low inertia - config changes are critical
    elasticity: 0.5
    stability: 0.6
    change_amplification: 1.5  # Config changes amplify strongly
    impact_radius: 10
    criticality: "critical"
    
  test:
    inertia: 0.8
    elasticity: 0.9
    stability: 0.3         # Tests change often
    change_amplification: 0.5  # Test changes have less impact
    impact_radius: 2
    criticality: "low"
    
  data:
    inertia: 0.5
    elasticity: 0.7
    stability: 0.5
    change_amplification: 1.1
    impact_radius: 6
    criticality: "high"

# ========================================================================
# Validation rules
# ========================================================================

validation:
  weight:
    min: 0.0
    max: 1.0
    default: 0.5
    
  damping_coefficient:
    min: 0.0
    max: 1.0
    default: 0.3
    
  material_stiffness:
    min: 0.0
    max: 1.0
    default: 0.5
    
  bidirectional_factor:
    min: 0.0
    max: 1.0
    default: 0.0
    
  temporal_decay_rate:
    min: 0.0
    max: 1.0
    default: 0.0
    
  change_sensitivity:
    min: 0.0
    max: 1.0
    default: 0.5
    
  propagation_delay_hours:
    min: 0.0
    max: 168.0  # Max 1 week
    default: 0.0
  
  # Consistency checks
  consistency:
    # High weight should have low damping
    high_weight_low_damping:
      enabled: true
      weight_threshold: 0.8
      damping_max: 0.3
      
    # Critical edges should have high weight
    critical_high_weight:
      enabled: true
      weight_min: 0.7

# ========================================================================
# Metadata
# ========================================================================

metadata:
  version: "1.0.0"
  created: "2025-12-07"
  description: "FEM edge type defaults for ThemisDB GPU Impact Analysis"
  author: "ThemisDB Enterprise"
