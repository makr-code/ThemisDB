# =====================================================
# License Compatibility Matrix
# =====================================================
compatibility:
  # Can mix MIT with anything
  MIT:
    compatible_with: ["MIT", "Apache-2.0", "BSD-3-Clause", "CC-BY-4.0", "Llama-2-Community", "OpenRAIL-M"]
    
  # Apache can mix with most
  Apache-2.0:
    compatible_with: ["MIT", "Apache-2.0", "BSD-3-Clause", "CC-BY-4.0", "Llama-2-Community"]
    incompatible_with: []
    
  # Llama 2 has specific restrictions
  Llama-2-Community:
    compatible_with: ["MIT", "Apache-2.0", "BSD-3-Clause", "Llama-2-Community"]
    incompatible_with: ["GPL-3.0"]  # Copyleft incompatible
    
  # OpenRAIL-M can mix with most
  OpenRAIL-M:
    compatible_with: ["MIT", "Apache-2.0", "BSD-3-Clause", "CC-BY-4.0", "OpenRAIL-M", "OpenRAIL++"]
    incompatible_with: []

# =====================================================
# Compliance Tracking
# =====================================================
compliance:
  # Required attributions for loaded models
  required_attributions:
    display_in_ui: true
    include_in_api_response: false
    log_to_audit: true
    
  # License violation handling
  violations:
    policy: "strict"  # strict, warn, log
    on_violation:
      action: "block"  # block, warn, allow
      notify_admin: true
      log_event: true
      
  # Usage reporting
  reporting:
    enabled: false
    report_interval_days: 30
    include_statistics: true
    anonymize_data: true

# =====================================================
# Notes
# =====================================================
# This file should be reviewed and updated when:
# 1. New models are added to the system
# 2. Model licenses are updated by publishers
# 3. Legal requirements change
# 4. New license types are introduced
#
# Consult with legal counsel for specific compliance requirements
# in your jurisdiction and use case.
