  # Standard Open Source Licenses
  # =====================================================
  MIT:
    name: "MIT License"
    spdx_id: "MIT"
    commercial_use: true
    modification: true
    distribution: true
    private_use: true
    patent_grant: false
    trademark_grant: false
    liability: false
    warranty: false
    attribution_required: true
    url: "https://opensource.org/licenses/MIT"
    
  Apache-2.0:
    name: "Apache License 2.0"
    spdx_id: "Apache-2.0"
    commercial_use: true
    modification: true
    distribution: true
    private_use: true
    patent_grant: true
    trademark_grant: false
    liability: false
    warranty: false
    attribution_required: true
    url: "https://www.apache.org/licenses/LICENSE-2.0"
    
  BSD-3-Clause:
    name: "BSD 3-Clause License"
    spdx_id: "BSD-3-Clause"
    commercial_use: true
    modification: true
    distribution: true
    private_use: true
    patent_grant: false
    trademark_grant: false
    liability: false
    warranty: false
    attribution_required: true
    url: "https://opensource.org/licenses/BSD-3-Clause"
  
  # =====================================================
  # Creative Commons Licenses
  # =====================================================
  CC-BY-4.0:
    name: "Creative Commons Attribution 4.0"
    spdx_id: "CC-BY-4.0"
    commercial_use: true
    modification: true
    distribution: true
    private_use: true
    patent_grant: false
    trademark_grant: false
    liability: false
    warranty: false
    attribution_required: true
    share_alike_required: false
    url: "https://creativecommons.org/licenses/by/4.0/"
    
  CC-BY-SA-4.0:
    name: "Creative Commons Attribution-ShareAlike 4.0"
    spdx_id: "CC-BY-SA-4.0"
    commercial_use: true
    modification: true
    distribution: true
    private_use: true
    patent_grant: false
    trademark_grant: false
    liability: false
    warranty: false
    attribution_required: true
    share_alike_required: true
    url: "https://creativecommons.org/licenses/by-sa/4.0/"
  
  # =====================================================
  # AI/ML Specific Licenses
  # =====================================================
  Llama-2-Community:
    name: "Llama 2 Community License Agreement"
    spdx_id: "LicenseRef-Llama-2-Community"
    commercial_use: true
    modification: true
    distribution: true
    private_use: true
    patent_grant: true
    trademark_grant: false
    liability: false
    warranty: false
    attribution_required: true
    restrictions:
      - "Must include copyright notice and disclaimer"
      - "Cannot use Meta trademarks without permission"
      - "Monthly active users > 700M requires separate license"
      - "Cannot use output to improve other LLMs"
    url: "https://github.com/facebookresearch/llama/blob/main/LICENSE"
    
  OpenRAIL-M:
    name: "Responsible AI License - Model (OpenRAIL-M)"
    spdx_id: "LicenseRef-OpenRAIL-M"
    commercial_use: true
    modification: true
    distribution: true
    private_use: true
    patent_grant: true
    trademark_grant: false
    liability: false
    warranty: false
    attribution_required: true
    use_restrictions:
      - "No illegal activities"
      - "No harassment or abuse"
      - "No discrimination"
      - "No privacy violations"
      - "No misinformation"
    url: "https://huggingface.co/spaces/CompVis/stable-diffusion-license"
    
  OpenRAIL++:
    name: "Responsible AI License v1.0 (OpenRAIL++)"
    spdx_id: "LicenseRef-OpenRAIL++"
    commercial_use: true
    modification: true
    distribution: true
    private_use: true
    patent_grant: true
    trademark_grant: false
    liability: false
    warranty: false
    attribution_required: true
    use_restrictions:
      - "Same as OpenRAIL-M"
      - "Additional ethical use requirements"
    url: "https://www.licenses.ai/ai-licenses"

