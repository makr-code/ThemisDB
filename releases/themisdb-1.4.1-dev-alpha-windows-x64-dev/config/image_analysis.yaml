# ThemisDB Image Analysis Configuration

# Global settings
image_analysis:
  # Plugin directory to scan for DLLs/SOs
  plugin_directory: "./plugins"
  
  # Auto-load plugins on startup
  auto_load: true
  
  # Default plugin for operations when not explicitly specified
  default_plugin: "llamacpp_vision"
  
  # Parallel execution with LLM
  enable_parallel_execution: true
  
  # Global memory limit (MB) for all image analysis plugins
  memory_limit_mb: 16384  # 16GB default
  
  # Performance settings
  batch_size: 4
  num_threads: 4
  
  # Cache settings
  cache:
    enabled: true
    max_size_mb: 2048
    ttl_seconds: 3600

# Plugin-specific configurations
plugins:
  # llama.cpp Vision Plugin - PRIMARY backend for vision-language models
  - name: llamacpp_vision
    enabled: true
    priority: 110  # Highest priority = preferred
    
    config:
      # Model files
      llm_model_path: "./models/llava-v1.5-7b-q4_0.gguf"
      clip_model_path: "./models/mmproj-model-f16.gguf"
      
      # Backend
      backend: "AUTO"  # AUTO, CPU, CUDA, METAL, VULKAN
      
      # Quantization (GGML)
      quantization: "Q4_0"  # Q4_0, Q5_0, Q8_0, F16, F32
      
      # Context size
      context_size: 2048
      
      # Generation parameters
      temperature: 0.7
      top_p: 0.9
      max_tokens: 128
      
      # GPU layers (0 = CPU only)
      gpu_layers: 35  # Adjust based on VRAM

  # ONNX CLIP Plugin - Secondary backend for dedicated image embeddings
  - name: onnx_clip
    enabled: true
    priority: 100  # Lower priority than llama.cpp Vision
    
    config:
      # Model configuration
      model_path: "./models/clip-vit-base-patch32.onnx"
      # Alternative: "./models/clip-vit-large-patch14.onnx" for better quality
      
      # Backend selection
      backend: "AUTO"  # AUTO, CPU, CUDA, DIRECTML, TENSORRT, OPENVINO
      # AUTO will prefer GPU > CPU automatically
      
      # Model parameters
      embedding_dim: 512  # ViT-B/32: 512, ViT-L/14: 768
      input_size: 224     # 224x224 pixels
      
      # Normalization (ImageNet defaults)
      normalize:
        mean: [0.48145466, 0.4578275, 0.40821073]
        std: [0.26862954, 0.26130258, 0.27577711]
      
      # Performance tuning
      enable_profiling: false
      enable_memory_pattern: true
      enable_cpu_mem_arena: true
      
      # GPU settings (if CUDA/DirectML backend)
      gpu:
        device_id: 0
        enable_graph_optimization: true
        optimization_level: 99  # 0-99, higher = more optimization
        
      # Quantization (optional, for reduced memory)
      quantization:
        enabled: false
        precision: "FP16"  # FP16, INT8
  
  # llama.cpp Vision Plugin - For vision-language models (LLaVA)
  - name: llamacpp_vision
    enabled: true  # Enable as primary
    priority: 110
    
    config:
      # Model files
      llm_model_path: "./models/llava-v1.5-7b-q4_0.gguf"
      clip_model_path: "./models/mmproj-model-f16.gguf"
      
      # Backend
      backend: "AUTO"  # AUTO, CPU, CUDA, METAL, VULKAN
      
      # Quantization (GGML)
      quantization: "Q4_0"  # Q4_0, Q5_0, Q8_0, F16, F32
      
      # Context size
      context_size: 2048
      
      # Generation parameters
      temperature: 0.7
      top_p: 0.9
      max_tokens: 128
      
      # GPU layers (0 = CPU only)
      gpu_layers: 35  # Adjust based on VRAM
  
  # OpenCV DNN Plugin - CPU fallback
  - name: opencv_dnn
    enabled: true
    priority: 50  # Lower priority, used as fallback
    
    config:
      # Model files (Caffe/TensorFlow format)
      model_path: "./models/opencv_models"
      
      # Backend
      backend: "CPU"  # CPU, CUDA, OPENCL
      
      # Models to load
      models:
        - name: "mobilenet_ssd"
          type: "detection"
          prototxt: "MobileNetSSD_deploy.prototxt"
          caffemodel: "MobileNetSSD_deploy.caffemodel"
          
        - name: "resnet50"
          type: "classification"
          model: "resnet50.pb"
      
      # Detection threshold
      confidence_threshold: 0.5
  
  # Stable Diffusion ONNX Plugin - Image generation (optional)
  - name: stable_diffusion_onnx
    enabled: false  # Heavy, enable only if needed
    priority: 80
    
    config:
      # Model components
      text_encoder_path: "./models/stable-diffusion/text_encoder.onnx"
      unet_path: "./models/stable-diffusion/unet.onnx"
      vae_decoder_path: "./models/stable-diffusion/vae_decoder.onnx"
      
      # Scheduler
      scheduler: "pndm"  # pndm, lms, euler, euler_a, ddim
      
      # Backend
      backend: "CUDA"  # CPU too slow for SD
      
      # Default generation parameters
      default_params:
        num_inference_steps: 50
        guidance_scale: 7.5
        width: 512
        height: 512
      
      # GPU settings
      gpu:
        device_id: 0
        enable_flash_attention: true  # Requires supported GPU
  
  # TensorRT Plugin (optional, proprietary)
  - name: tensorrt_optimizer
    enabled: false  # Requires NVIDIA GPU and TensorRT installation
    priority: 110  # Highest priority if available
    
    requires_eula: true  # User must accept NVIDIA EULA
    
    config:
      # TensorRT engine cache
      engine_cache_dir: "./cache/tensorrt"
      
      # Optimization settings
      precision: "FP16"  # FP16, INT8, FP32
      max_batch_size: 8
      workspace_size_mb: 4096
      
      # Build settings (first-run only)
      build_engines_on_startup: false
      optimize_for_inference: true

# Monitoring and logging
monitoring:
  # Enable statistics collection
  enable_statistics: true
  
  # Prometheus metrics endpoint
  prometheus:
    enabled: true
    port: 9091
    path: "/metrics"
  
  # Logging
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_to_file: true
  log_file: "./logs/image_analysis.log"
  
  # Performance profiling
  profiling:
    enabled: false
    output_dir: "./profiling"

# Security settings
security:
  # Verify plugin signatures
  verify_signatures: true
  
  # Allowed plugin directories (whitelist)
  allowed_plugin_dirs:
    - "./plugins"
    - "/usr/local/lib/themis/plugins"
    - "C:/Program Files/ThemisDB/plugins"
  
  # Maximum inference time per request (seconds)
  max_inference_time: 60
  
  # Maximum image size (megapixels)
  max_image_size_mp: 25  # 25MP = 5000x5000
  
  # Sandbox plugins (experimental)
  enable_sandboxing: false

# Model management
models:
  # Auto-download missing models
  auto_download: false
  
  # Model repository
  repository_url: "https://huggingface.co/models"
  
  # Local model cache
  cache_dir: "./models"
  
  # Model verification
  verify_checksums: true
  
  # Available models (for download)
  available:
    - name: "clip-vit-base-patch32"
      url: "https://huggingface.co/openai/clip-vit-base-patch32"
      format: "onnx"
      size_mb: 350
      sha256: "..."
      
    - name: "llava-1.5-7b-q4_0"
      url: "https://huggingface.co/mys-lang/LLaVA-1.5-7b-GGUF"
      format: "gguf"
      size_mb: 4000
      sha256: "..."
