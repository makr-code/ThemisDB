# =============================================================================
# ThemisDB Scaling Optimizations - Quick Start Example
# =============================================================================
#
# This is a minimal, production-ready configuration for enabling the new
# scaling optimizations. Copy this to your config directory and adjust as needed.
#
# Target Workload: Balanced OLTP/OLAP with 1B-10B records
# Expected Impact: +50-100% overall throughput improvement
#
# =============================================================================

# Enable adaptive query cache (Phase 1)
query_cache:
  enabled: true
  
  # L1: Fast in-memory cache for hot queries
  l1_hot:
    max_entries: 10000
    ttl_seconds: 300  # 5 minutes
  
  # L2: Compressed cache for warm queries
  l2_warm:
    max_entries: 50000
    ttl_seconds: 1800  # 30 minutes
    compression_level: 3
  
  # L3: Persistent cache for cold queries
  l3_cold:
    db_path: "./data/query_cache"
    ttl_seconds: 86400  # 24 hours

# Enable cache-aware indexing (Phase 2)
adaptive_indexing:
  enabled: true
  target_cache_hit_rate: 0.70  # Aim for 70% cache hit rate

# Enable WAL optimization (Phase 3)
wal_optimization:
  enabled: true
  
  # Adaptive batch sizing based on system load
  adaptive_batching:
    enabled: true
    min_batch_size: 10
    max_batch_size: 1000
  
  # Intelligent compression selection
  compression:
    enabled: true
    default_type: "zstd"
    default_level: 3

# Enable basic monitoring
monitoring:
  enable_metrics: true
  metrics_interval: 60  # Report every 60 seconds

# =============================================================================
# To use this configuration:
# 1. Copy to your ThemisDB config directory
# 2. Start ThemisDB with: themis --config scaling_optimizations_quickstart.yaml
# 3. Monitor metrics to validate improvements
# 4. Adjust cache sizes based on available memory
# =============================================================================
