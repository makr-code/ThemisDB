name: Disabled-Stub-Policy CI Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'benchmarks/**'
      - 'tools/check_disabled_stubs.py'
      - 'docs/governance/DISABLED_STUB_POLICY.md'
      - '.github/workflows/05-quality_build_disabled-stub-policy-ci.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'benchmarks/**'
      - 'tools/check_disabled_stubs.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled-stub-policy:
    name: Disabled-Stub-Policy Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Disabled-Stub-Policy guard
        run: |
          python3 tools/check_disabled_stubs.py --repo-root .
        # Exit code 0 = all stubs compliant (or none found)
        # Exit code 1 = at least one disabled stub violates the policy
        # Exit code 2 = internal error
