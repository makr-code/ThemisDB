name: Repair DockerHub Tags

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'DockerHub repository (namespace/repo), e.g. themisdb/themisdb'
        required: true
        default: 'themisdb/themisdb'
        type: string
      dry_run:
        description: 'Only report legacy tags, do not delete'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      delete_legacy:
        description: 'Delete non-canonical tags (except latest)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  repair-dockerhub:
    name: Detect and clean legacy Docker tags
    runs-on: ubuntu-latest

    steps:
      - name: Repair DockerHub tags
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPOSITORY="${{ github.event.inputs.repository }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          DELETE_LEGACY="${{ github.event.inputs.delete_legacy }}"

          if [[ -z "${DOCKERHUB_USERNAME:-}" || -z "${DOCKERHUB_TOKEN:-}" ]]; then
            echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are required"
            exit 1
          fi

          NS="${REPOSITORY%%/*}"
          REPO="${REPOSITORY##*/}"

          AUTH_TOKEN="$(curl -fsSL -H 'Content-Type: application/json' \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r '.token')"

          if [[ -z "$AUTH_TOKEN" || "$AUTH_TOKEN" == "null" ]]; then
            echo "Failed to authenticate against DockerHub"
            exit 1
          fi

          CANONICAL_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?-[a-z0-9-]+-binary-(arm|x86|x64)(-debug)?$'

          echo "## DockerHub Tag Repair" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | $REPOSITORY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | $DRY_RUN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Delete legacy | $DELETE_LEGACY |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          page=1
          deleted=0
          legacy=0
          total=0

          while :; do
            resp="$(curl -fsSL -H "Authorization: JWT ${AUTH_TOKEN}" \
              "https://hub.docker.com/v2/repositories/${NS}/${REPO}/tags?page_size=100&page=${page}")"

            mapfile -t tags < <(echo "$resp" | jq -r '.results[].name')
            if [[ ${#tags[@]} -eq 0 ]]; then
              break
            fi

            for t in "${tags[@]}"; do
              total=$((total + 1))

              if [[ "$t" == "latest" ]]; then
                continue
              fi

              if [[ "$t" =~ $CANONICAL_RE ]]; then
                continue
              fi

              legacy=$((legacy + 1))
              echo "Legacy tag: $t"
              echo "- Legacy tag: $t" >> "$GITHUB_STEP_SUMMARY"

              if [[ "$DRY_RUN" == "true" || "$DELETE_LEGACY" != "true" ]]; then
                continue
              fi

              curl -fsSL -X DELETE -H "Authorization: JWT ${AUTH_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${NS}/${REPO}/tags/${t}/"
              deleted=$((deleted + 1))
              echo "Deleted tag: $t"
            done

            next="$(echo "$resp" | jq -r '.next')"
            if [[ -z "$next" || "$next" == "null" ]]; then
              break
            fi
            page=$((page + 1))
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Total tags scanned: $total" >> "$GITHUB_STEP_SUMMARY"
          echo "Legacy tags found: $legacy" >> "$GITHUB_STEP_SUMMARY"
          echo "Tags deleted: $deleted" >> "$GITHUB_STEP_SUMMARY"
