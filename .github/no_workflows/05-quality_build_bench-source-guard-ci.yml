name: Bench-Source CI Guard

# Implements PERFORMANCE_EXPECTATIONS.md §1.4, Maßnahme #8:
#   "Build-Check 'source exists but binary missing' als CI-Guard"
#
# Runs tools/perf_expectations_audit.py which executes two hard checks:
#
#   Check 8a – every bench_*.cpp in benchmarks/ is covered by a CMake target
#              (explicit add_executable() OR auto-registration block present).
#              Allowlisted sources (tools/bench_source_allowlist.toml) are
#              excluded from failure reporting.
#              STATUS_FAIL when orphaned_sources != [].
#
#   Check 8b – tools/check_bench_targets.py (standalone guard) exists.
#              STATUS_FAIL when the guard script is absent.
#
#   Check 8c – (bench-binary-guard job) builds all explicitly-wired benchmark
#              targets and verifies that each non-allowlisted source produced
#              an executable.  Uses tools/check_bench_targets.py --build-dir.
#              Fails if any explicitly-wired source has no corresponding binary
#              in the build output.  Auto-registered (EXCLUDE_FROM_ALL) sources
#              are informational only (not an error) in default mode.
#
# The job fails (exit-code 1) if either check returns STATUS_FAIL, blocking
# the PR merge.  This prevents new bench_*.cpp files from being silently
# stranded without a build target.
#
# Allowlist
#   tools/bench_source_allowlist.toml contains bench stems that are
#   intentionally absent from the standard build profile (GPU-only,
#   platform-specific, third-party dependencies).  See
#   docs/ci-cd/workflows/05-quality/bench-source-guard-ci.md for details.
#
# Triggers:
#   • pull_request  – on any change to benchmarks/ sources or CI guard tools
#   • push to main  – after merge, to keep the baseline green
#   • schedule      – nightly to catch configuration drift
#   • workflow_dispatch – manual run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'benchmarks/bench_*.cpp'
      - 'benchmarks/CMakeLists.txt'
      - 'tools/check_bench_targets.py'
      - 'tools/bench_source_allowlist.toml'
      - 'tools/perf_expectations_audit.py'
      - '.github/workflows/05-quality_build_bench-source-guard-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'benchmarks/bench_*.cpp'
      - 'benchmarks/CMakeLists.txt'
      - 'tools/check_bench_targets.py'
      - 'tools/bench_source_allowlist.toml'
      - 'tools/perf_expectations_audit.py'
  schedule:
    - cron: '0 1 * * *'   # Nightly at 01:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-source-guard:
    name: Bench-Source CI Guard
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Run the standalone guard first so the error message is immediately
      # visible even without the full audit context.
      # The allowlist (tools/bench_source_allowlist.toml) is loaded automatically
      # when present.  Each orphaned source is reported with its Grundkategorie.
      - name: Run standalone bench-target guard (check_bench_targets.py)
        id: guard
        run: |
          python3 tools/check_bench_targets.py \
            --no-color \
            --format text

      # Run the full audit which also verifies the guard script exists (8b).
      - name: Run perf-expectations audit (checks 8a + 8b)
        id: audit
        run: |
          python3 tools/perf_expectations_audit.py \
            --no-color \
            --format text

      - name: Export JSON audit results for step summary
        if: always()
        id: audit_json
        run: |
          python3 tools/perf_expectations_audit.py \
            --no-color \
            --format json \
            > /tmp/perf_audit_results.json 2>&1 || true
          echo "audit_json<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/perf_audit_results.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Export guard JSON results for step summary
        if: always()
        id: guard_json
        run: |
          python3 tools/check_bench_targets.py \
            --no-color \
            --format json \
            > /tmp/guard_results.json 2>&1 || true

      - name: Upload guard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-guard-results-${{ github.sha }}
          path: /tmp/guard_results.json
          retention-days: 14

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-audit-results-${{ github.sha }}
          path: /tmp/perf_audit_results.json
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔬 Bench-Source CI Guard – PERFORMANCE_EXPECTATIONS.md §1.4 Maßnahme #8" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Guard step** | ${{ steps.guard.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Audit step** | ${{ steps.audit.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Description | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8a | bench_*.cpp ohne CMake-Target (orphaned sources) | \`${{ steps.guard.outcome }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| 8b | Externer Guard (check_bench_targets.py) vorhanden | \`${{ steps.audit.outcome }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/guard_results.json ]; then
            echo "### Guard Results (bench_*.cpp vs CMake targets)" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
            import json, sys
            try:
                with open("/tmp/guard_results.json") as f:
                    d = json.load(f)
            except Exception as e:
                print(f"> ⚠️ Could not parse guard results: {e}")
                sys.exit(0)
            counts = d.get("counts", {})
            print("| Metric | Count |")
            print("|--------|-------|")
            print(f"| Orphaned (no CMake target, not allowlisted) | {counts.get('orphaned', 0)} |")
            print(f"| Auto-registration covered | {counts.get('auto_reg_covered', 0)} |")
            print(f"| Binary missing (--build-dir mode) | {counts.get('binary_missing', 0)} |")
            print(f"| Auto-reg skipped in binary check (EXCLUDE_FROM_ALL) | {counts.get('auto_reg_binary_skipped', 0)} |")
            print(f"| Allowlisted (permitted absences) | {counts.get('allowlisted', 0)} |")
            if d.get("orphaned_sources"):
                print()
                print("#### Orphaned Sources")
                print("| Source | Category |")
                print("|--------|----------|")
                for entry in d["orphaned_sources"]:
                    print(f"| `{entry['stem']}.cpp` | {entry['category']} |")
            if d.get("allowlisted_sources"):
                print()
                print("#### Allowlisted Sources (permitted absences)")
                print("| Source | Category | Reason |")
                print("|--------|----------|--------|")
                for entry in d["allowlisted_sources"]:
                    print(f"| `{entry['stem']}.cpp` | {entry['category']} | {entry.get('reason','')} |")
            PYEOF
          fi
          if [ -f /tmp/perf_audit_results.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Audit JSON" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/perf_audit_results.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: bench-binary-guard
  #
  # Builds the explicitly-wired benchmark targets (those with add_executable()
  # in benchmarks/CMakeLists.txt, not EXCLUDE_FROM_ALL auto-registered ones)
  # and then runs check_bench_targets.py --build-dir to verify every covered,
  # non-allowlisted source actually produced an executable.
  #
  # This implements Check 8c from PERFORMANCE_EXPECTATIONS.md §1.4:
  #   "Built binaries present for all explicitly-wired bench_*.cpp sources"
  #
  # Auto-registered (EXCLUDE_FROM_ALL) sources are not checked by default;
  # use --strict to enforce binary presence for every source (requires building
  # themis_benchmarks_all_eligible instead of the default target).
  # ---------------------------------------------------------------------------
  bench-binary-guard:
    name: Bench Binary Guard (Build + Binary Verification)
    runs-on: ubuntu-22.04
    needs: bench-source-guard
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            gcc-12 g++-12 \
            libssl-dev \
            libcurl4-openssl-dev \
            libboost-all-dev \
            librocksdb-dev \
            libfmt-dev \
            libyaml-cpp-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libzstd-dev \
            libgtest-dev \
            pkg-config

      - name: Install Google Benchmark
        run: |
          sudo apt-get install -y libbenchmark-dev 2>/dev/null || true
          if ! pkg-config --exists benchmark 2>/dev/null; then
            git clone --depth 1 --branch v1.8.3 \
              https://github.com/google/benchmark.git /tmp/benchmark
            cmake -S /tmp/benchmark -B /tmp/benchmark/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBENCHMARK_ENABLE_TESTING=OFF \
              -DCMAKE_CXX_COMPILER=g++-12
            cmake --build /tmp/benchmark/build --parallel $(nproc)
            sudo cmake --install /tmp/benchmark/build --prefix /usr/local
          fi

      - name: Configure benchmark build
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          cmake -B /tmp/bench-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DTHEMIS_ROOT_DIR="${{ github.workspace }}" \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -S cmake

      # Build the default target which includes all explicitly-wired benchmark
      # executables (those with an explicit add_executable() in CMakeLists.txt).
      # Auto-registered EXCLUDE_FROM_ALL targets are intentionally not built
      # here; they are skipped in the binary check unless --strict is used.
      - name: Build benchmark targets
        id: build
        run: |
          cmake --build /tmp/bench-build --config Release -j $(nproc)

      - name: Run benchmark binary guard
        id: binary_guard
        run: |
          python3 tools/check_bench_targets.py \
            --build-dir /tmp/bench-build \
            --no-color \
            --format text

      - name: Export binary guard JSON results
        if: always()
        id: binary_guard_json
        run: |
          python3 tools/check_bench_targets.py \
            --build-dir /tmp/bench-build \
            --no-color \
            --format json \
            > /tmp/binary_guard_results.json 2>&1 || true

      - name: Upload binary guard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-binary-guard-results-${{ github.sha }}
          path: /tmp/binary_guard_results.json
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔬 Bench Binary Guard – source-vs-binary mismatch (Check 8c)" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Build step** | ${{ steps.build.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Binary guard step** | ${{ steps.binary_guard.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Description | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8c | bench_*.cpp explicitly-wired sources have built binaries | \`${{ steps.binary_guard.outcome }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/binary_guard_results.json ]; then
            echo "### Binary Guard Results" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
            import json, sys
            try:
                with open("/tmp/binary_guard_results.json") as f:
                    d = json.load(f)
            except Exception as e:
                print(f"> ⚠️ Could not parse binary guard results: {e}")
                sys.exit(0)
            counts = d.get("counts", {})
            print("| Metric | Count |")
            print("|--------|-------|")
            print(f"| Explicitly-wired binaries missing | {counts.get('binary_missing', 0)} |")
            print(f"| Auto-reg skipped (EXCLUDE_FROM_ALL, not in default build) | {counts.get('auto_reg_binary_skipped', 0)} |")
            print(f"| Allowlisted (permitted absences) | {counts.get('allowlisted', 0)} |")
            if d.get("binary_missing_sources"):
                print()
                print("#### Missing Binaries (CI FAILURE)")
                print("| Source | Category |")
                print("|--------|----------|")
                for entry in d["binary_missing_sources"]:
                    print(f"| `{entry['stem']}.cpp` | {entry['category']} |")
            if d.get("auto_reg_binary_skipped_sources"):
                print()
                print("#### Auto-Registered Sources (not checked – EXCLUDE_FROM_ALL)")
                print("| Source | Category |")
                print("|--------|----------|")
                for entry in d["auto_reg_binary_skipped_sources"][:10]:
                    print(f"| `{entry['stem']}.cpp` | {entry['category']} |")
                total = counts.get('auto_reg_binary_skipped', 0)
                if total > 10:
                    print(f"| *(and {total - 10} more …)* |  |")
            PYEOF
          fi
