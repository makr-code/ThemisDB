name: PR Path Policy Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - enterprise
      - hyperscaler

concurrency:
  group: pr-path-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Enforce lane path policy
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const base = pr.base.ref;

            const blockedByBase = {
              main: [
                "docker/hyperscaler/",
                "docker/enterprise/",
                "helm/",
                "operator/",
                "deploy/",
                "packaging/enterprise/",
                "packaging/hyperscaler/"
              ],
              enterprise: [
                "docker/hyperscaler/",
                "helm/",
                "operator/",
                "deploy/hyperscaler/",
                "packaging/hyperscaler/"
              ],
              hyperscaler: []
            };

            const blocked = blockedByBase[base] || [];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            const changed = files.map(f => f.filename);
            const violations = changed.filter(file => blocked.some(prefix => file.startsWith(prefix)));

            core.info(`Target branch: ${base}`);
            core.info(`Changed files: ${changed.length}`);

            if (violations.length > 0) {
              const lines = violations.map(v => `- ${v}`).join("\n");
              core.setFailed(`Path policy violations for lane '${base}':\n${lines}`);
              return;
            }

            core.info("Path policy passed.");
