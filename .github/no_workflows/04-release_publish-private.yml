name: Publish Private Edition Images

on:
  push:
    tags:
      - enterprise-v*
      - hyperscaler-v*
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to publish
        required: true
        default: enterprise
        type: choice
        options:
          - enterprise
          - hyperscaler
      tag_name:
        description: Tag for image version
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: enterprise
            tag_prefix: enterprise-v
            cmake_edition: ENTERPRISE
            environment: enterprise-prod
          - edition: hyperscaler
            tag_prefix: hyperscaler-v
            cmake_edition: HYPERSCALER
            environment: hyperscaler-prod

    environment: ${{ matrix.environment }}

    steps:
      - name: Resolve tag
        if: |
          (github.event_name == 'push' && startsWith(github.ref_name, matrix.tag_prefix)) ||
          (github.event_name == 'workflow_dispatch' && inputs.edition == matrix.edition)
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        run: |
          version="${{ steps.tag.outputs.name }}"
          image="ghcr.io/${{ github.repository_owner }}/themisdb-${{ matrix.edition }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push private image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            THEMIS_EDITION=${{ matrix.cmake_edition }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
