name: "Shared · Changelog Backfill (Historical)"

# ---------------------------------------------------------------------------
# PURPOSE
# -------
# Reconstructs CHANGELOG.md history by reading all GitHub milestones and the
# pull requests merged under each one.
#
# Milestones ARE version numbers (e.g. milestone "v1.8.0" or "1.8.0" maps to
# the CHANGELOG section ## [1.8.0]).
#
# For each matching milestone the script:
#   1. Fetches all closed PRs associated with that milestone via the GitHub API.
#   2. Groups them by their label (feat → Added, fix → Fixed, security →
#      Security, docs → Documentation, perf → Performance, …).
#   3. Calls changelog_updater.py with --target-version to insert one entry
#      per section into the correct versioned block.
#   4. Creates the block automatically when it does not yet exist, using the
#      milestone's closed_at / due_on date as the release date.
#
# All insertions are idempotent: re-running the workflow on the same milestones
# is safe and produces no duplicate entries.
#
# USAGE
# -----
# 1. Go to Actions → "Shared · Changelog Backfill (Historical)" → Run workflow.
# 2. Fill in the inputs (all optional — defaults process everything):
#      milestone   – single version to backfill (e.g. "1.8.0"), or leave empty
#      since       – skip milestones released before this date (YYYY-MM-DD)
#      until       – skip milestones released after this date (YYYY-MM-DD)
#      state       – milestone state: open | closed | all (default: closed)
#      label-map   – JSON override for label→section mapping
#      dry-run     – preview changes without writing CHANGELOG.md
#      target-branch – branch to commit to (default: develop)
#
# PERMISSIONS REQUIRED
# --------------------
# The workflow needs:
#   contents: write   (to commit CHANGELOG.md back)
#   pull-requests: read (to read PR data via GitHub API)
#
# EXAMPLE: backfill a single milestone
# -------------------------------------
#   gh workflow run "00-shared_changelog-backfill.yml" \
#     --repo makr-code/ThemisDB \
#     --ref develop \
#     --field milestone=1.8.0 \
#     --field dry-run=true
#
# EXAMPLE: dry-run all milestones since v1.3.0
# ----------------------------------------------
#   gh workflow run "00-shared_changelog-backfill.yml" \
#     --repo makr-code/ThemisDB \
#     --ref develop \
#     --field since=2025-12-17 \
#     --field dry-run=true
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: >
          Process only this milestone / version number (e.g. "1.8.0" or "v1.8.0").
          Leave empty to process ALL milestones that match since/until/state.
        required: false
        default: ""
        type: string

      since:
        description: >
          Skip milestones whose release date (closed_at / due_on) is before
          this ISO date (YYYY-MM-DD).  Leave empty for no lower bound.
        required: false
        default: ""
        type: string

      until:
        description: >
          Skip milestones whose release date is after this ISO date (YYYY-MM-DD).
          Leave empty for no upper bound (= up to today).
        required: false
        default: ""
        type: string

      state:
        description: "Milestone state to query (closed = only released versions)"
        required: false
        default: "closed"
        type: choice
        options:
          - closed
          - open
          - all

      label-map:
        description: >
          JSON object that extends the default label→section mapping.
          Example: {"hotfix":"Fixed","infra-fix":"Infrastructure"}
          See tools/ci/changelog_backfill.py for the full default map.
        required: false
        default: "{}"
        type: string

      dry-run:
        description: "Preview changes without writing CHANGELOG.md or committing"
        required: false
        default: true
        type: boolean

      target-branch:
        description: "Branch to commit the updated CHANGELOG.md to"
        required: false
        default: "develop"
        type: string

concurrency:
  group: changelog-backfill-${{ github.ref }}
  cancel-in-progress: false   # Never cancel a running backfill mid-way

permissions:
  contents: write
  pull-requests: read

jobs:
  backfill:
    name: "Changelog Backfill"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Run backfill script ───────────────────────────────────────────────
      - name: Run changelog_backfill.py
        id: backfill
        env:
          MILESTONE:     ${{ inputs.milestone }}
          SINCE:         ${{ inputs.since }}
          UNTIL:         ${{ inputs.until }}
          STATE:         ${{ inputs.state }}
          LABEL_MAP:     ${{ inputs.label-map }}
          DRY_RUN:       ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          ARGS=(
            "--repo"      "${{ github.repository }}"
            "--state"     "$STATE"
            "--label-map" "$LABEL_MAP"
          )

          [[ -n "$MILESTONE" ]] && ARGS+=("--milestone" "$MILESTONE")
          [[ -n "$SINCE"     ]] && ARGS+=("--since"     "$SINCE")
          [[ -n "$UNTIL"     ]] && ARGS+=("--until"     "$UNTIL")
          [[ "$DRY_RUN" == "true" ]] && ARGS+=("--dry-run")

          python3 tools/ci/changelog_backfill.py "${ARGS[@]}" | tee /tmp/backfill-output.txt

          # Expose whether any changes were actually written.
          if grep -q "sections written, 0 PR" /tmp/backfill-output.txt 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif grep -q "dry-run" /tmp/backfill-output.txt 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Commit and push ──────────────────────────────────────────────────
      - name: Commit CHANGELOG.md
        if: >-
          inputs.dry-run == false &&
          github.ref == format('refs/heads/{0}', inputs.target-branch) &&
          steps.backfill.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No staged changes – nothing to commit."
            exit 0
          fi

          MILESTONE_PART="${{ inputs.milestone }}"
          if [[ -n "$MILESTONE_PART" ]]; then
            MSG="docs: changelog backfill for v${MILESTONE_PART} [skip ci]"
          else
            MSG="docs: changelog backfill (all milestones) [skip ci]"
          fi

          git commit -m "$MSG"

          if ! git pull --rebase origin "${{ inputs.target-branch }}"; then
            git rebase --abort
            echo "::error::Rebase on ${{ inputs.target-branch }} failed. Re-run or resolve manually."
            exit 1
          fi

          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Job summary ───────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## 📜 Changelog Backfill" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Repository** | \`${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Milestone filter** | \`${{ inputs.milestone || '(all)' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Since** | \`${{ inputs.since || '(none)' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Until** | \`${{ inputs.until || '(none)' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Milestone state** | \`${{ inputs.state }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | ${{ inputs.dry-run == true && 'yes ⚠️' || 'no — changes committed' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target branch** | \`${{ inputs.target-branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/backfill-output.txt ]; then
            echo "### Script output" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/backfill-output.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            echo "ℹ️ **Dry-run** — CHANGELOG.md was NOT modified.  Re-run with \`dry-run: false\` to apply." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.backfill.outputs.changed }}" == "true" ]]; then
            echo "✅ CHANGELOG.md updated and committed to \`${{ inputs.target-branch }}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⏭️ No new entries to write (all milestones already up-to-date or no PRs found)." >> "$GITHUB_STEP_SUMMARY"
          fi
