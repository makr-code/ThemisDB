name: Perf-Expectations Root-Cause Audit (§1.5)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'PERFORMANCE_EXPECTATIONS.md'
      - 'benchmarks/**'
      - 'tools/perf_expectations_rootcause_audit.py'
      - '.github/workflows/perf-expectations-rootcause-audit.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'PERFORMANCE_EXPECTATIONS.md'
      - 'benchmarks/**'
      - 'tools/perf_expectations_rootcause_audit.py'
  workflow_run:
    workflows: ["🚦 Post-Merge Smoke Test"]
    types: [completed]
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootcause-audit:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    name: §1.5 Root-Cause Gap Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run §1.5 root-cause audit
        id: audit
        run: |
          python3 tools/perf_expectations_rootcause_audit.py \
            --repo-root . \
            --perf-doc PERFORMANCE_EXPECTATIONS.md \
            --output-dir artifacts/perf_expectations_rootcause_audit \
            --format both \
            --no-color
        # Exit code 1 = FAIL (hard stale claims), 0 = PASS or WARN-only

      - name: Upload audit artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-expectations-rootcause-audit-${{ github.run_id }}
          path: artifacts/perf_expectations_rootcause_audit/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          REPORT="artifacts/perf_expectations_rootcause_audit/report.md"
          echo "## 📊 Performance-Expectations Root-Cause Audit (§1.5)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT" ]; then
            echo "### Audit Report" >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Report not generated._" >> "$GITHUB_STEP_SUMMARY"
          fi
