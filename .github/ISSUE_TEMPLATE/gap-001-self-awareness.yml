### Aufgabenbeschreibung:
Implementiere die SchemaManager-Klasse für ThemisDB zur automatischen Schema-Erkennung (Table-Discovery, Property-Type Detection, Index-Metadaten). Die Klasse scannt per RocksDB die existierenden Tabellen, erkennt deren Properties und sammelt Index-Metadaten. Ziel ist ein REST-/MCP-basiertes introspektives Datenbank-Schema.

### Akzeptanzkriterien
- [ ] SchemaManager kann Tabellen und Eigenschaften via RocksDB ermitteln
- [ ] Unit Tests (>90% Coverage)
- [ ] Integrationstest für echtes Schema anlegen und abfragen
- [ ] Dokumentation aktualisiert
- [ ] Code Review approved

