# Copilot Issue Dispatcher Configuration
# See .github/copilot-dispatcher.md for full documentation.

# Maximum number of issues delegated to the Copilot Coding Agent per dispatcher run.
# The dispatcher posts a delegation comment (mentioning @copilot) on each qualifying
# issue and sets the copilot/delegated label.  Copilot then opens the PR itself.
# Set to 0 to process all queued issues in every run (not recommended).
max_delegations_per_run: 2

# Base branch that Copilot should target when opening pull requests.
# This is communicated to Copilot via the delegation comment.
base_branch: develop

# GitHub logins of Copilot reviewer bots whose APPROVED reviews satisfy the
# readiness gate (copilot-readiness-gate.yml).  If the list is empty the
# review check is skipped and only CI checks are required.
copilot_reviewer_logins:
  - copilot-pull-request-reviewer[bot]

# Labels that trigger automatic queueing for the Copilot Coding Agent.
# When ANY of these labels is added to an open issue (and the issue is not
# already queued/delegated/blocked), the auto-queue-issues workflow
# automatically adds the `queue/copilot` label so the dispatcher picks it up.
# Set to an empty list `[]` to disable automatic queueing entirely
# (all queueing must then be done manually by adding `queue/copilot`).
auto_queue_labels:
  - enhancement
  - type:feature
  - type:bug

# Labels that BLOCK automatic queueing even when an auto_queue_label is present.
# Issues carrying any of these labels are skipped by the auto-queue workflow.
auto_queue_exclude_labels:
  - blocked
  - status:blocked
  - wontfix
  - duplicate
  - invalid
  - question
  - copilot/delegated
  - queue/copilot
