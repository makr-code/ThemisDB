version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: tuesday
      time: "05:00"
      timezone: Etc/UTC
    allow:
      - dependency-name: llama.cpp
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build(llama)"
