name: 'Artifact Publish'
description: 'Publish release artifacts with checksums'
author: 'ThemisDB Team'

inputs:
  artifacts-path:
    description: 'Path to artifacts to publish (supports glob patterns)'
    required: true
  release-tag:
    description: 'Release tag name'
    required: false
    default: ''
  artifact-name:
    description: 'Name for the uploaded artifact bundle'
    required: false
    default: 'release-artifacts'
  generate-checksums:
    description: 'Generate SHA256 checksums (true/false)'
    required: false
    default: 'true'
  retention-days:
    description: 'Artifact retention days'
    required: false
    default: '90'

outputs:
  artifact-name:
    description: 'Name of uploaded artifact'
    value: ${{ inputs.artifact-name }}
  checksum-file:
    description: 'Path to checksum file'
    value: ${{ steps.checksums.outputs.file }}

runs:
  using: composite
  steps:
    - name: Generate Checksums
      id: checksums
      if: inputs.generate-checksums == 'true'
      shell: bash
      run: |
        CHECKSUM_FILE="checksums-sha256.txt"
        
        # Find all artifacts and generate checksums
        if [ -d "${{ inputs.artifacts-path }}" ]; then
          find "${{ inputs.artifacts-path }}" -type f -exec sha256sum {} \; > "$CHECKSUM_FILE"
        elif [ -f "${{ inputs.artifacts-path }}" ]; then
          sha256sum "${{ inputs.artifacts-path }}" > "$CHECKSUM_FILE"
        else
          # Handle glob patterns
          for file in ${{ inputs.artifacts-path }}; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> "$CHECKSUM_FILE"
            fi
          done
        fi
        
        if [ -f "$CHECKSUM_FILE" ]; then
          echo "file=$CHECKSUM_FILE" >> $GITHUB_OUTPUT
          echo "## Artifact Checksums" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$CHECKSUM_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo "file=" >> $GITHUB_OUTPUT
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.artifacts-path }}
          ${{ steps.checksums.outputs.file }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn

    - name: Release Assets Summary
      shell: bash
      run: |
        echo "## Release Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifacts uploaded: ${{ inputs.artifact-name }}" >> $GITHUB_STEP_SUMMARY
        
        if [ -n "${{ inputs.release-tag }}" ]; then
          echo "🏷️ Release tag: ${{ inputs.release-tag }}" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Note:** To publish to GitHub Releases, attach these artifacts in the release workflow." >> $GITHUB_STEP_SUMMARY
