# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: 'Check Build Status'
description: |
  Reads the ci-build tracker issue (set by build-mainline.yml after each push to develop)
  and fails the calling job when the last recorded build indicates a compiler/linker blocker.

  The tracker issue is identified by the HTML marker
  <!-- ci-build:type:build-status --> in its body.  The action checks whether
  that issue carries both labels `ci/build-failed` and `ci/compiler-linker-failed`.

  When `enforce` is 'true' (default) the action calls core.setFailed on a failed
  or unknown build status.  Set `enforce: 'false'` to emit a warning instead and
  allow the workflow to continue (useful for workflow_dispatch where a human is
  explicitly triggering the run).

  When no tracker issue is found the action can optionally treat the absence as
  a warning instead of a hard failure (set `fail-if-missing: 'false'`).

  Used by: build-benchmarks.yml, release-mainline.yml.

inputs:
  repo-token:
    description: 'GitHub token with issues: read permission'
    required: true
  enforce:
    description: |
      When 'true' (default), fail the step if the build status is 'failed' due to compiler/linker markers.
      When 'false', emit a warning and continue so the caller can decide.
    required: false
    default: 'true'
  fail-if-missing:
    description: |
      When 'true' (default), treat a missing tracker issue as an error.
      Set to 'false' to emit a warning and continue when no tracker issue exists.
    required: false
    default: 'true'
  issue-number:
    description: |
      Optional tracker issue number to read directly (for example from a preceding
      bootstrap-build-tracker step). When provided and valid, the action fetches
      that issue before falling back to marker-based discovery.
    required: false
    default: ''

outputs:
  build-status:
    description: "'ok', 'failed', or 'unknown' (no tracker issue found)"
    value: ${{ steps.check.outputs.build-status }}
  issue-number:
    description: 'Number of the tracker issue, or empty when not found'
    value: ${{ steps.check.outputs.issue-number }}

runs:
  using: composite
  steps:
    - name: Check build-status tracker issue
      id: check
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        ENFORCE: ${{ inputs.enforce }}
        FAIL_IF_MISSING: ${{ inputs.fail-if-missing }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
      with:
        github-token: ${{ inputs.repo-token }}
        script: |
          const enforce      = process.env.ENFORCE      !== 'false';
          const failIfMissing = process.env.FAIL_IF_MISSING !== 'false';
          const providedIssueNumber = (process.env.ISSUE_NUMBER || '').trim();
          const marker = '<!-- ci-build:type:build-status -->';
          const { owner, repo } = context.repo;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const MAX_ATTEMPTS = 3;
          const BASE_RETRY_DELAY_MS = 2000;
          const findTracker = async () => {
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            return allIssues.find(i => (i.body || '').includes(marker));
          };

          let tracker = null;
          if (/^[0-9]+$/.test(providedIssueNumber)) {
            try {
              const response = await github.rest.issues.get({
                owner,
                repo,
                issue_number: Number(providedIssueNumber),
              });
              const candidate = response.data;
              if ((candidate.body || '').includes(marker)) {
                tracker = candidate;
                core.notice(`Using provided build-status tracker issue #${candidate.number}.`);
              } else {
                core.warning(
                  `Provided issue #${candidate.number} does not contain the build-status marker; falling back to marker discovery.`
                );
              }
            } catch (error) {
              core.warning(
                `Could not read provided tracker issue #${providedIssueNumber}; falling back to marker discovery (${error.message}).`
              );
            }
          } else if (providedIssueNumber.length > 0) {
            core.warning(`Ignoring non-numeric issue-number input: "${providedIssueNumber}".`);
          }

          let attempt = 1;
          while (!tracker && attempt <= MAX_ATTEMPTS) {
            tracker = await findTracker();
            if (!tracker && attempt < MAX_ATTEMPTS) {
              const delayMs = BASE_RETRY_DELAY_MS * (2 ** (attempt - 1));
              core.notice(
                `Build-status tracker issue not visible yet; attempt ${attempt} of ${MAX_ATTEMPTS} failed. ` +
                `Waiting ${delayMs}ms before the next attempt...`
              );
              await sleep(delayMs);
            } else if (!tracker) {
              core.notice(`Build-status tracker issue was not found after ${MAX_ATTEMPTS} attempt(s).`);
            }
            attempt += 1;
          }

          if (!tracker) {
            const msg = 'No ci-build tracker issue found (marker: <!-- ci-build:type:build-status -->).';
            if (failIfMissing && enforce) {
              core.setFailed(msg);
            } else {
              core.warning(msg);
            }
            core.setOutput('build-status', 'unknown');
            core.setOutput('issue-number', '');
            return;
          }

          core.setOutput('issue-number', String(tracker.number));
          const labelNames = tracker.labels.map(l => l.name);
          const issueUrl   = `https://github.com/${owner}/${repo}/issues/${tracker.number}`;

          const hasBuildFailed = labelNames.includes('ci/build-failed');
          const hasCompilerLinkerMarker = labelNames.includes('ci/compiler-linker-failed');
          if (hasBuildFailed && hasCompilerLinkerMarker) {
            core.setOutput('build-status', 'failed');
            const msg =
              `Last develop build is FAILED by compiler/linker marker (tracker issue #${tracker.number} carries labels \`ci/build-failed\` + \`ci/compiler-linker-failed\`). ` +
              `Fix the build on develop before running this workflow. Issue: ${issueUrl}`;
            if (enforce) {
              core.setFailed(msg);
            } else {
              core.warning(`⚠️  ${msg}`);
            }
          } else if (hasBuildFailed) {
            core.setOutput('build-status', 'ok');
            core.notice(
              `Tracker issue #${tracker.number} has \`ci/build-failed\` without \`ci/compiler-linker-failed\`; ` +
              'treating as non-build-blocking status for preflight.'
            );
          } else if (labelNames.includes('ci/build-ok')) {
            core.setOutput('build-status', 'ok');
            core.notice(`Build status: ✅ ok (tracker issue #${tracker.number})`);
          } else {
            // Labels present but neither ok nor failed — unknown, proceed with caution.
            core.setOutput('build-status', 'unknown');
            core.warning(
              `Tracker issue #${tracker.number} has neither \`ci/build-ok\` nor \`ci/build-failed\` label. ` +
              `Build status is unknown; proceeding with caution.`
            );
          }
