name: 'Setup C++ Environment'
description: 'Sets up C++ build environment with apt dependencies for ThemisDB'
author: 'ThemisDB Team'

inputs:
  use-system-libs:
    description: 'Use system libraries from apt (ON/OFF)'
    required: false
    default: 'OFF'
  vcpkg-manifest:
    description: 'Path to vcpkg.json manifest'
    required: false
    default: 'vcpkg.json'
  cache-key-suffix:
    description: 'Additional cache key suffix for custom caching'
    required: false
    default: ''

outputs:
  vcpkg-root:
    description: 'Path to vcpkg root directory'
    value: ${{ steps.setup.outputs.vcpkg-root }}
  cache-hit:
    description: 'Whether vcpkg cache was hit'
    value: ${{ steps.cache-vcpkg.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        if [ "${{ inputs.use-system-libs }}" == "ON" ]; then
          echo "Installing full system library set..."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            librocksdb-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libboost-dev \
            libboost-system-dev \
            libyaml-cpp-dev \
            libzstd-dev \
            libgtest-dev \
            libbenchmark-dev \
            cppcheck clang-tidy flex bison
        else
          echo "Installing minimal build tools..."
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev curl zip unzip tar git \
            flex bison
        fi

    - name: Setup vcpkg path
      id: setup
      shell: bash
      run: |
        if [ -n "$VCPKG_ROOT" ]; then
          echo "vcpkg-root=$VCPKG_ROOT" >> $GITHUB_OUTPUT
        else
          echo "vcpkg-root=${{ github.workspace }}/vcpkg" >> $GITHUB_OUTPUT
        fi

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.setup.outputs.vcpkg-root }}
          !${{ steps.setup.outputs.vcpkg-root }}/buildtrees
          !${{ steps.setup.outputs.vcpkg-root }}/downloads
        key: vcpkg-${{ runner.os }}-${{ hashFiles(inputs.vcpkg-manifest) }}-${{ inputs.cache-key-suffix }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ hashFiles(inputs.vcpkg-manifest) }}-
          vcpkg-${{ runner.os }}-
