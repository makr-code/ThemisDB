name: 'Notification'
description: 'Send workflow notifications to various channels'
author: 'ThemisDB Team'

inputs:
  status:
    description: 'Workflow status (success, failure, cancelled)'
    required: true
  message:
    description: 'Custom notification message'
    required: false
    default: ''
  channels:
    description: 'Notification channels (comma-separated: slack,discord,email,summary)'
    required: false
    default: 'summary'
  slack-webhook:
    description: 'Slack webhook URL (from secrets)'
    required: false
    default: ''
  discord-webhook:
    description: 'Discord webhook URL (from secrets)'
    required: false
    default: ''
  workflow-name:
    description: 'Workflow name for notification'
    required: false
    default: ''

outputs:
  sent:
    description: 'Whether notification was sent'
    value: ${{ steps.notify.outputs.sent }}

runs:
  using: composite
  steps:
    - name: Prepare notification content
      id: prepare
      shell: bash
      run: |
        STATUS="${{ inputs.status }}"
        
        # Status emoji
        case "$STATUS" in
          success) EMOJI="✅"; COLOR="good" ;;
          failure) EMOJI="❌"; COLOR="danger" ;;
          cancelled) EMOJI="⚠️"; COLOR="warning" ;;
          *) EMOJI="ℹ️"; COLOR="#808080" ;;
        esac
        
        echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
        echo "color=$COLOR" >> $GITHUB_OUTPUT
        
        # Default message
        if [ -n "${{ inputs.message }}" ]; then
          MESSAGE="${{ inputs.message }}"
        else
          MESSAGE="Workflow ${{ inputs.workflow-name || github.workflow }} $STATUS"
        fi
        
        echo "message=$MESSAGE" >> $GITHUB_OUTPUT

    - name: Send GitHub Summary
      if: contains(inputs.channels, 'summary')
      shell: bash
      run: |
        echo "## ${{ steps.prepare.outputs.emoji }} Workflow Notification" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ${{ inputs.status }}" >> $GITHUB_STEP_SUMMARY
        echo "**Message:** ${{ steps.prepare.outputs.message }}" >> $GITHUB_STEP_SUMMARY
        echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
        echo "**Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

    - name: Send Slack notification
      if: contains(inputs.channels, 'slack') && inputs.slack-webhook != ''
      shell: bash
      run: |
        PAYLOAD=$(cat <<EOF
        {
          "text": "${{ steps.prepare.outputs.message }}",
          "attachments": [{
            "color": "${{ steps.prepare.outputs.color }}",
            "fields": [
              {"title": "Workflow", "value": "${{ github.workflow }}", "short": true},
              {"title": "Status", "value": "${{ inputs.status }}", "short": true},
              {"title": "Repository", "value": "${{ github.repository }}", "short": true},
              {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
              {"title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>", "short": false}
            ]
          }]
        }
        EOF
        )
        
        curl -X POST -H 'Content-type: application/json' \
          --data "$PAYLOAD" \
          "${{ inputs.slack-webhook }}" || true

    - name: Send Discord notification
      if: contains(inputs.channels, 'discord') && inputs.discord-webhook != ''
      shell: bash
      run: |
        PAYLOAD=$(cat <<EOF
        {
          "content": "${{ steps.prepare.outputs.emoji }} ${{ steps.prepare.outputs.message }}",
          "embeds": [{
            "title": "Workflow: ${{ github.workflow }}",
            "color": ${{ steps.prepare.outputs.color == 'good' && '3066993' || (steps.prepare.outputs.color == 'danger' && '15158332' || '16776960') }},
            "fields": [
              {"name": "Status", "value": "${{ inputs.status }}", "inline": true},
              {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
              {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Run", "value": "[View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
            ]
          }]
        }
        EOF
        )
        
        curl -X POST -H 'Content-type: application/json' \
          --data "$PAYLOAD" \
          "${{ inputs.discord-webhook }}" || true

    - name: Mark as sent
      id: notify
      shell: bash
      run: |
        echo "sent=true" >> $GITHUB_OUTPUT
