name: 'Security Report'
description: 'Upload SARIF reports and create security issues'
author: 'ThemisDB Team'

inputs:
  sarif-path:
    description: 'Path to SARIF report file'
    required: true
  create-issues:
    description: 'Create GitHub issues for findings (true/false)'
    required: false
    default: 'false'
  severity-threshold:
    description: 'Minimum severity to report (low, medium, high, critical)'
    required: false
    default: 'medium'
  category:
    description: 'Security scan category (for CodeQL action)'
    required: false
    default: 'security'
  artifact-name:
    description: 'Name for uploaded SARIF artifact'
    required: false
    default: 'security-report'

outputs:
  findings-count:
    description: 'Number of security findings'
    value: ${{ steps.analyze.outputs.count }}

runs:
  using: composite
  steps:
    - name: Upload SARIF Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.sarif-path }}
        retention-days: 90
        if-no-files-found: warn

    - name: Upload to GitHub Security
      if: always() && github.event_name != 'workflow_dispatch'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-path }}
        category: ${{ inputs.category }}
      continue-on-error: true

    - name: Analyze SARIF Report
      id: analyze
      if: always()
      shell: bash
      run: |
        if [ ! -f "${{ inputs.sarif-path }}" ]; then
          echo "⚠️ SARIF file not found: ${{ inputs.sarif-path }}" >> $GITHUB_STEP_SUMMARY
          echo "count=0" >> $GITHUB_OUTPUT
          exit 0
        fi
        
        echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Count findings (basic JSON parsing)
        if command -v jq &> /dev/null; then
          COUNT=$(jq '[.runs[].results] | flatten | length' "${{ inputs.sarif-path }}" 2>/dev/null || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "📊 Total findings: $COUNT" >> $GITHUB_STEP_SUMMARY
        else
          echo "count=unknown" >> $GITHUB_OUTPUT
          echo "📊 SARIF report uploaded for review" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔒 Full report available in Security tab" >> $GITHUB_STEP_SUMMARY

    - name: Create Security Issues
      if: always() && inputs.create-issues == 'true'
      shell: bash
      run: |
        echo "::notice::Security issue creation is configured but requires GitHub token with appropriate permissions"
        # This would require additional logic to parse SARIF and create issues
        # Keeping as placeholder for future enhancement
