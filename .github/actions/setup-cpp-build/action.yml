name: 'Setup C++ Build Environment'
description: |
  Installs standard C++ build dependencies (cmake, ninja-build, libgtest-dev,
  libfmt-dev, pkg-config, git) plus the requested compiler and any optional
  extra packages, then builds Google Test from source when the pre-built
  library files are absent (required on Ubuntu runners where libgtest-dev
  ships source-only).

  sccache (mozilla-actions/sccache-action) is set up with the GitHub Actions
  cache backend for shared compiler-output caching across matrix rows and
  re-runs.  Callers that already invoke sccache-action before this action are
  unaffected — the action is idempotent on repeated calls in the same job.

inputs:
  cc:
    description: 'C compiler binary to install and use for the GTest build (e.g. gcc-12, clang-15)'
    required: true
  cxx:
    description: 'C++ compiler binary to install and use for the GTest build (e.g. g++-12, clang++-15)'
    required: true
  extra-packages:
    description: 'Space-separated list of additional apt packages to install (e.g. libssl-dev libboost-all-dev)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # sccache replaces ccache as the compiler-output cache.
    # SHA pinned to mozilla-actions/sccache-action v0.0.6 (2024-11-01).
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
      with:
        version: "v0.8.1"

    - name: Enable sccache GHA backend
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        # Ignore transient cache I/O errors (e.g. temporary GHA Cache storage
        # outages) so sccache falls back to direct compilation instead of
        # aborting with exit code 2.
        echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1" >> "$GITHUB_ENV"
        # When the GHA cache storage backend is fully unavailable (e.g. returns
        # an HTML error page on startup), sccache would otherwise fail the
        # server-start and cause every compilation to exit with code 2.
        # Setting this to false lets sccache fall back to direct compilation
        # transparently instead of aborting the build.
        echo "SCCACHE_ERROR_WHEN_DISCONNECTED=false" >> "$GITHUB_ENV"

    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        # Base packages required by every C++ CI job. Vulkan/GLSL tooling is
        # required for ThemisDB's GPU backend checks in Linux CI and local
        # validation runs that configure the Vulkan-capable build presets.
        BASE_PKGS="cmake ninja-build ${{ inputs.cc }} ${{ inputs.cxx }} libgtest-dev pkg-config git libfmt-dev libvulkan-dev glslc"
        # Append optional extra packages (guard against empty string)
        EXTRA="${{ inputs.extra-packages }}"
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends $BASE_PKGS ${EXTRA:+$EXTRA}

    - name: Build GTest from source (if needed)
      shell: bash
      run: |
        # Some Ubuntu releases ship libgtest-dev as source-only; pre-build
        # the library so that CMake find_package(GTest) works reliably.
        if [ ! -f /usr/lib/libgtest.a ] && \
           [ ! -f /usr/lib/x86_64-linux-gnu/libgtest.a ] && \
           [ ! -f /usr/lib/aarch64-linux-gnu/libgtest.a ]; then
          cd /usr/src/gtest
          sudo cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ inputs.cc }} \
            -DCMAKE_CXX_COMPILER=${{ inputs.cxx }} .
          sudo make -j$(nproc)
          sudo cp lib/*.a /usr/lib/ 2>/dev/null || \
          sudo cp *.a     /usr/lib/ 2>/dev/null || true
        fi
