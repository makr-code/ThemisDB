name: 'Configure Themis CMake'
description: |
  Runs CMake configure (Ninja generator) for the Themis project and
  optionally builds a single target.

  LLM and GPU feature flags are always enabled (all editions):
  - LLM=ON, GPU=ON with CPU-only fallback (CUDA, HIP, OpenCL and Vulkan
    remain OFF so no GPU hardware is required on CI runners).
  Hardware-specific backends (CUDA, HIP, OpenCL, Vulkan), TRACING and
  gRPC are always disabled in CI regardless of edition.

  Optional compiler flags for coverage instrumentation and AddressSanitizer
  + UndefinedBehaviorSanitizer are generated from dedicated boolean inputs
  rather than raw cmake flag strings, keeping the calling syntax clean.

inputs:
  cc:
    description: 'C compiler binary (e.g. gcc-12, clang-15)'
    required: true
  cxx:
    description: 'C++ compiler binary (e.g. g++-12, clang++-15)'
    required: true
  build-type:
    description: 'CMake build type (Debug, Release, RelWithDebInfo)'
    required: false
    default: 'Debug'
  build-tests:
    description: 'Value for THEMIS_BUILD_TESTS (ON or OFF)'
    required: false
    default: 'ON'
  edition:
    description: 'Value for THEMIS_EDITION (MINIMAL / COMMUNITY / ENTERPRISE / HYPERSCALER / MILITARY). Empty = not set.'
    required: false
    default: ''
  ci-mode:
    description: 'When true, passes -DTHEMIS_CI_MODE=ON so REQUIRED edition features are not force-enabled (safe for CI runners without heavyweight deps)'
    required: false
    default: 'false'
  enable-coverage:
    description: 'When true, adds --coverage -O0 to C and CXX compiler flags'
    required: false
    default: 'false'
  enable-sanitizers:
    description: 'When true, adds -fsanitize=address,undefined flags (ASan + UBSan) via clang'
    required: false
    default: 'false'
  extra-cmake-flags:
    description: 'Additional CMake -D flags appended verbatim (space-separated, no values with spaces)'
    required: false
    default: ''
  build-target:
    description: 'cmake --build target. Empty string skips the build step entirely.'
    required: false
    default: 'themis_tests'
  build-dir:
    description: 'Build directory (cmake -B argument)'
    required: false
    default: 'build'
  source-dir:
    description: 'CMake source directory (cmake -S argument)'
    required: false
    default: 'cmake'

runs:
  using: 'composite'
  steps:
    - name: Configure CMake
      shell: bash
      env:
        CC_BIN:            ${{ inputs.cc }}
        CXX_BIN:           ${{ inputs.cxx }}
        BUILD_TYPE:        ${{ inputs.build-type }}
        BUILD_TESTS:       ${{ inputs.build-tests }}
        EDITION:           ${{ inputs.edition }}
        CI_MODE:           ${{ inputs.ci-mode }}
        ENABLE_COVERAGE:   ${{ inputs.enable-coverage }}
        ENABLE_SANITIZERS: ${{ inputs.enable-sanitizers }}
        EXTRA_FLAGS:       ${{ inputs.extra-cmake-flags }}
        BUILD_DIR:         ${{ inputs.build-dir }}
        SOURCE_DIR:        ${{ inputs.source-dir }}
      run: |
        # Build the cmake argument list as an array so that flag values that
        # contain spaces (e.g. coverage or sanitizer compiler flags) are
        # passed as single arguments rather than split by word splitting.
        CMAKE_ARGS=(-B "$BUILD_DIR" -G Ninja)
        CMAKE_ARGS+=(-DCMAKE_BUILD_TYPE="$BUILD_TYPE")
        CMAKE_ARGS+=(-DCMAKE_C_COMPILER="$CC_BIN")
        CMAKE_ARGS+=(-DCMAKE_CXX_COMPILER="$CXX_BIN")

        # Use ccache as compiler launcher when available (set up by setup-cpp-build)
        if command -v ccache &>/dev/null; then
          CMAKE_ARGS+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache)
          CMAKE_ARGS+=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
        fi

        # THEMIS_BUILD_TESTS
        [ "$BUILD_TESTS" != "OFF" ] && CMAKE_ARGS+=("-DTHEMIS_BUILD_TESTS=$BUILD_TESTS")

        # THEMIS_EDITION (optional)
        [ -n "$EDITION" ] && CMAKE_ARGS+=("-DTHEMIS_EDITION=$EDITION")

        # CI mode: relax REQUIRED feature enforcement for edition builds
        [ "$CI_MODE" = "true" ] && CMAKE_ARGS+=("-DTHEMIS_CI_MODE=ON")

        # LLM and GPU are always compiled in.
        # Runtime falls back to CPU when no hardware backend is available.
        CMAKE_ARGS+=(-DTHEMIS_ENABLE_LLM=ON)
        CMAKE_ARGS+=(-DTHEMIS_ENABLE_GPU=ON)

        # Always disable hardware-specific GPU backends in CI
        # (no NVIDIA/AMD GPU or Vulkan drivers available on GitHub runners)
        CMAKE_ARGS+=(-DTHEMIS_ENABLE_CUDA=OFF)
        CMAKE_ARGS+=(-DTHEMIS_ENABLE_HIP=OFF)
        CMAKE_ARGS+=(-DTHEMIS_ENABLE_OPENCL=OFF)
        CMAKE_ARGS+=(-DTHEMIS_ENABLE_VULKAN=OFF)

        # Runtime services not available in CI
        CMAKE_ARGS+=(-DTHEMIS_ENABLE_TRACING=OFF)
        CMAKE_ARGS+=(-DTHEMIS_ENABLE_GRPC=OFF)

        # Coverage instrumentation
        if [ "$ENABLE_COVERAGE" = "true" ]; then
          CMAKE_ARGS+=("-DCMAKE_C_FLAGS=--coverage -O0")
          CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=--coverage -O0")
        fi

        # AddressSanitizer + UndefinedBehaviorSanitizer
        if [ "$ENABLE_SANITIZERS" = "true" ]; then
          CMAKE_ARGS+=("-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -g")
          CMAKE_ARGS+=("-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -g")
          CMAKE_ARGS+=("-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined")
        fi

        # Extra flags (must not contain values with internal spaces)
        # shellcheck disable=SC2086
        [ -n "$EXTRA_FLAGS" ] && read -ra _EXTRA <<< "$EXTRA_FLAGS" && CMAKE_ARGS+=("${_EXTRA[@]}")

        CMAKE_ARGS+=(-S "$SOURCE_DIR")

        cmake "${CMAKE_ARGS[@]}"

    - name: Build target
      if: ${{ inputs.build-target != '' }}
      shell: bash
      env:
        BUILD_DIR:    ${{ inputs.build-dir }}
        BUILD_TARGET: ${{ inputs.build-target }}
      run: cmake --build "$BUILD_DIR" --target "$BUILD_TARGET" -- -j$(nproc)
