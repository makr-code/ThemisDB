name: 'Report Test Results'
description: 'Upload test results and create PR comments'
author: 'ThemisDB Team'

inputs:
  test-results-path:
    description: 'Path to test results file (JUnit XML)'
    required: true
  coverage-path:
    description: 'Path to coverage report'
    required: false
    default: ''
  create-pr-comment:
    description: 'Create PR comment with test summary (true/false)'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name for uploaded test results artifact'
    required: false
    default: 'test-results'
  report-name:
    description: 'Name for test report'
    required: false
    default: 'Test Results'
  reporter:
    description: 'Test reporter format (java-junit, dart-json, dotnet-trx, etc.)'
    required: false
    default: 'java-junit'
  fail-on-error:
    description: 'Fail workflow if tests failed'
    required: false
    default: 'true'

outputs:
  test-passed:
    description: 'Whether all tests passed'
    value: ${{ steps.test-summary.outputs.passed }}

runs:
  using: composite
  steps:
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.test-results-path }}
        retention-days: 30
        if-no-files-found: warn

    - name: Upload Coverage Report
      if: always() && inputs.coverage-path != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-coverage
        path: ${{ inputs.coverage-path }}
        retention-days: 30
        if-no-files-found: warn

    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: ${{ inputs.report-name }}
        path: ${{ inputs.test-results-path }}
        reporter: ${{ inputs.reporter }}
        fail-on-error: ${{ inputs.fail-on-error }}
        max-annotations: 50

    - name: Create Test Summary
      id: test-summary
      if: always()
      shell: bash
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -f "${{ inputs.test-results-path }}" ]; then
          echo "📊 Test results uploaded: ${{ inputs.artifact-name }}" >> $GITHUB_STEP_SUMMARY
          echo "passed=true" >> $GITHUB_OUTPUT
        else
          echo "⚠️ Test results file not found" >> $GITHUB_STEP_SUMMARY
          echo "passed=false" >> $GITHUB_OUTPUT
        fi
        
        if [ -n "${{ inputs.coverage-path }}" ] && [ -f "${{ inputs.coverage-path }}" ]; then
          echo "📈 Coverage report uploaded" >> $GITHUB_STEP_SUMMARY
        fi
