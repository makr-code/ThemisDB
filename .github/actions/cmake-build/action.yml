name: 'CMake Build'
description: 'Configure, build, and test CMake projects'
author: 'ThemisDB Team'

inputs:
  preset:
    description: 'CMake preset name (from CMakePresets.json)'
    required: false
    default: ''
  build-type:
    description: 'Build type (Release, Debug, RelWithDebInfo)'
    required: false
    default: 'Release'
  run-tests:
    description: 'Run tests after build (true/false)'
    required: false
    default: 'true'
  install-prefix:
    description: 'Installation prefix path'
    required: false
    default: ''
  vcpkg-root:
    description: 'Path to vcpkg root'
    required: false
    default: ''
  source-dir:
    description: 'Source directory'
    required: false
    default: '.'
  build-dir:
    description: 'Build directory'
    required: false
    default: 'build'
  cmake-args:
    description: 'Additional CMake arguments'
    required: false
    default: ''
  parallel-level:
    description: 'Parallel build jobs'
    required: false
    default: '0'

outputs:
  build-dir:
    description: 'Path to build directory'
    value: ${{ steps.paths.outputs.build-dir }}
  install-dir:
    description: 'Path to install directory'
    value: ${{ steps.paths.outputs.install-dir }}

runs:
  using: composite
  steps:
    - name: Setup paths
      id: paths
      shell: bash
      run: |
        BUILD_DIR="${{ inputs.build-dir }}"
        if [ -n "${{ inputs.install-prefix }}" ]; then
          INSTALL_DIR="${{ inputs.install-prefix }}"
        else
          INSTALL_DIR="$BUILD_DIR/install"
        fi
        echo "build-dir=$BUILD_DIR" >> $GITHUB_OUTPUT
        echo "install-dir=$INSTALL_DIR" >> $GITHUB_OUTPUT
        
        # Set parallel level
        if [ "${{ inputs.parallel-level }}" = "0" ]; then
          PARALLEL=$(nproc 2>/dev/null || echo "4")
        else
          PARALLEL="${{ inputs.parallel-level }}"
        fi
        echo "CMAKE_BUILD_PARALLEL_LEVEL=$PARALLEL" >> $GITHUB_ENV
        echo "CTEST_PARALLEL_LEVEL=$PARALLEL" >> $GITHUB_ENV

    - name: Cache CMake build
      uses: actions/cache@v4
      with:
        path: |
          ${{ steps.paths.outputs.build-dir }}/CMakeCache.txt
          ${{ steps.paths.outputs.build-dir }}/CMakeFiles
          ${{ steps.paths.outputs.build-dir }}/*.cmake
        key: cmake-${{ runner.os }}-${{ inputs.build-type }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          cmake-${{ runner.os }}-${{ inputs.build-type }}-
          cmake-${{ runner.os }}-

    - name: Configure CMake
      shell: bash
      run: |
        VCPKG_DIR="${{ inputs.vcpkg-root }}"
        if [ -z "$VCPKG_DIR" ] && [ -n "$VCPKG_ROOT" ]; then
          VCPKG_DIR="$VCPKG_ROOT"
        fi
        if [ -z "$VCPKG_DIR" ]; then
          VCPKG_DIR="${{ github.workspace }}/vcpkg"
        fi
        
        CMAKE_ARGS="-S ${{ inputs.source-dir }} -B ${{ steps.paths.outputs.build-dir }}"
        CMAKE_ARGS="$CMAKE_ARGS -G Ninja"
        CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}"
        CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_TOOLCHAIN_FILE=$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake"
        CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"
        CMAKE_ARGS="$CMAKE_ARGS -DTHEMIS_BUILD_TESTS=ON"
        
        if [ -n "${{ inputs.install-prefix }}" ]; then
          CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_INSTALL_PREFIX=${{ inputs.install-prefix }}"
        fi
        
        if [ -n "${{ inputs.preset }}" ]; then
          CMAKE_ARGS="--preset=${{ inputs.preset }}"
        fi
        
        if [ -n "${{ inputs.cmake-args }}" ]; then
          CMAKE_ARGS="$CMAKE_ARGS ${{ inputs.cmake-args }}"
        fi
        
        echo "Configuring with: cmake $CMAKE_ARGS"
        cmake $CMAKE_ARGS

    - name: Build
      shell: bash
      run: |
        echo "Building with $CMAKE_BUILD_PARALLEL_LEVEL parallel jobs..."
        cmake --build ${{ steps.paths.outputs.build-dir }} --config ${{ inputs.build-type }}

    - name: Run Tests
      if: inputs.run-tests == 'true'
      shell: bash
      run: |
        cd ${{ steps.paths.outputs.build-dir }}
        echo "Running tests with $CTEST_PARALLEL_LEVEL parallel jobs..."
        ctest -C ${{ inputs.build-type }} \
          --output-on-failure \
          --output-junit test-results.xml \
          --timeout 300 \
          -j $CTEST_PARALLEL_LEVEL || true
      continue-on-error: true

    - name: Install
      if: inputs.install-prefix != ''
      shell: bash
      run: |
        cmake --install ${{ steps.paths.outputs.build-dir }} --config ${{ inputs.build-type }}
