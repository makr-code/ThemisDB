# ──────────────────────────────────────────────────────────────────────────────
# CHANGE TYPE LABELS
# ──────────────────────────────────────────────────────────────────────────────
"type:documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "README.md"
          - "ROADMAP.md"
          - "*.md"

"type:test":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - "test_*.cpp"

"type:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - "CMakeLists.txt"
          - "CMakePresets.json"
          - "cmake/**"

"type:refactor":
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/*.cpp"
          - "include/**/*.hpp"
      - head-sha: '.*refactor.*'

"type:build":
  - changed-files:
      - any-glob-to-any-file:
          - "CMakeLists.txt"
          - "CMakePresets.json"
          - "cmake/**"
          - "vcpkg.json"

