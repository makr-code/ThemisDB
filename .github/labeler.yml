# Labeler configuration for actions/labeler@v5
# Labels are applied automatically based on changed file paths in a PR.
# See DOCUMENTATION_GOVERNANCE.md for label taxonomy and governance.

# ──────────────────────────────────────────────────────────────────────────────
# ROADMAP WAVE LABELS (Wave A–D per ROADMAP.md §Execution Batches)
# ──────────────────────────────────────────────────────────────────────────────
"wave:A":
  - changed-files:
      - any-glob-to-any-file:
          - "src/access_model/**"
          - "src/search/**"
          - "src/sharding/**"
          - "src/replication/**"
          - "src/utils/**"
          - "src/updates/**"
          - "src/process/**"
          - "src/audit/**"
          - "include/access_model/**"
          - "include/search/**"
          - "include/sharding/**"
          - "include/replication/**"
          - "include/updates/**"
          - "include/process/**"
          - "include/audit/**"

"wave:B":
  - changed-files:
      - any-glob-to-any-file:
          - "src/llm/**"
          - "src/retrieval/**"
          - "src/tensor/**"
          - "src/gpu/**"
          - "include/llm/**"
          - "include/retrieval/**"

"wave:C":
  - changed-files:
      - any-glob-to-any-file:
          - "src/security/**"
          - "src/auth/**"
          - "src/governance/**"
          - "include/security/**"
          - "include/auth/**"

"wave:D":
  - changed-files:
      - any-glob-to-any-file:
          - "src/observability/**"
          - "src/maintenance/**"
          - "docs/operability/**"

