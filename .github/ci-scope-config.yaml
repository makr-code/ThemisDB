# CI Scope Classification Configuration
#
# Maps file path patterns to CI scopes.
# Used by .github/scripts/classify_ci_scope.py.
# Active workflows currently rely primarily on their own `paths:` filters; this
# file remains as a maintained scope reference and for any future classifier-
# based gating that is reintroduced under the quarantine rules.
#
# Pattern syntax follows Python's fnmatch (glob-style):
#   *  matches any sequence of characters within a path segment
#   ** matches any path segment(s) (handled via custom matching)
#   ?  matches any single character

scopes:

  # ── Code changes: any C++/CUDA/Python source ─────────────────────────────
  # True when at least one source/include/test/fuzz/benchmark file changes.
  has_code_changes:
    patterns:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'benchmarks/**'
      - 'cmake/**'
      - 'cmake/CMakeLists.txt'
      - 'scripts/**/*.py'
      - 'scripts/**/*.sh'
      - 'tools/**'

  # ── Security changes: auth / security modules ────────────────────────────
  has_security_changes:
    patterns:
      - 'src/security/**'
      - 'src/auth/**'
      - 'src/server/api_auth_config.cpp'
      - 'src/server/auth_middleware.cpp'
      - 'include/security/**'
      - 'include/auth/**'
      - 'include/server/api_auth_config.h'
      - 'include/server/auth_middleware.h'
      - 'tests/security/**'
      - 'tests/test_jwt_*.cpp'
      - 'tests/test_rbac_*.cpp'
      - 'tests/test_vault_*.cpp'
      - 'fuzz/harnesses/jwt_rbac_config_harness.cpp'
      - 'fuzz/corpus/jwt/**'
      - 'fuzz/corpus/rbac/**'

  # ── Acceleration changes: CPU/GPU backend abstraction layer ──────────────
  has_acceleration_changes:
    patterns:
      - 'src/acceleration/**'
      - 'include/acceleration/**'
      - 'benchmarks/bench_cuda_vs_cpu.cpp'
      - 'benchmarks/performance_regression_detector.py'
      - 'benchmarks/baseline_manager.py'
      - 'benchmarks/baselines/acceleration/**'
      - 'tests/test_acceleration_dispatch.cpp'
      - 'tests/test_cuda_ann_search.cpp'
      - 'tests/test_backend_registry_startup.cpp'

  # ── GPU changes: GPU module, geo GPU backend ──────────────────────────────
  has_gpu_changes:
    patterns:
      - 'src/gpu/**'
      - 'src/geo/gpu_backend_stub.cpp'
      - 'src/server/spatial_api_handler.cpp'
      - 'include/themis/gpu/**'
      - 'include/geo/spatial_backend.h'
      - 'tests/test_gpu_*.cpp'
      - 'tests/test_geo_gpu_backend.cpp'
      - 'benchmarks/bench_gpu_module.cpp'

  # ── LLM/CUDA changes: LLM inference, embeddings, CUDA kernels ────────────
  has_llm_changes:
    patterns:
      - 'src/llm/**'
      - 'src/rag/**'
      - 'src/voice/**'
      - 'src/prompt_engineering/**'
      - 'include/voice/**'
      - 'include/llm/**'
      - 'include/rag/**'
      - 'include/content/stt_processor.h'
      - 'include/content/tts_processor.h'
      - 'src/content/stt_processor.cpp'
      - 'src/content/tts_processor.cpp'
      - 'benchmarks/bench_voice_assistant.cpp'
      - 'benchmarks/baselines/voice/**'
      - 'tests/llm/**'

  # ── Documentation-only changes ───────────────────────────────────────────
  # True when ALL changed files are documentation (no code/config changed).
  # This scope is computed differently: it is set to true only when no other
  # code/config scope is triggered.
  has_doc_only_changes:
    patterns:
      - 'docs/**'
      - '*.md'
      - 'README*'
      - 'CHANGELOG*'
      - 'LICENSE*'
      - '.github/copilot-instructions.md'
      - '.github/copilot/**'
      - '.github/GOVERNANCE.md'
      - '.github/SECURITY.md'
      - '.github/LABELS.md'
      - '.github/RELEASE.md'
      - 'ROADMAP.md'
      - 'ROADMAP.md'
      - 'FUTURE_ENHANCEMENTS.MD'
      - 'future_enhancement.md'

  # ── Config/CMake changes ──────────────────────────────────────────────────
  has_config_changes:
    patterns:
      - 'cmake/**'
      - 'config/**'
      - '*.cmake'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
      - '.github/no_workflows/**'
      - '.github/ci-scope-config.yaml'
      - '.github/scripts/**'
      - '.github/labeler.yml'
      - '.github/WORKFLOW_GUIDELINES.md'
      - '.github/WORKFLOW_REGISTRY.md'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'

  # ── Chimera benchmark changes ─────────────────────────────────────────────
  has_chimera_changes:
    patterns:
      - 'src/chimera/**'
      - 'include/chimera/**'
      - 'adapters/chimera/**'
      - 'benchmarks/chimera/**'
      - 'benchmarks/baselines/chimera/**'
      - 'tests/chimera/**'
      - '.github/workflows/02-feature-modules_chimera_chimera-benchmark-ci.yml'

  # ── Grafana dashboard changes ─────────────────────────────────────────────
  has_grafana_changes:
    patterns:
      - 'grafana/**'
      - 'scripts/validate_grafana_dashboards.py'

# ── Workflow-to-scope mapping ─────────────────────────────────────────────────
# Documents which scope each workflow requires.
# Used as reference only; active workflows enforce boundaries mainly via
# `paths:` and dedicated guards rather than a global scope-classifier workflow.
workflow_scope_map:
  02-feature-modules_llm_voice-benchmark-ci: [has_llm_changes]
  06-infrastructure_gpu_gpu-benchmark-matrix-ci: [has_acceleration_changes, has_gpu_changes, has_llm_changes]
  07-quality_nightly-benchmark-sweep: []
  09-pr-gates_workflow-boundary-guard: [has_config_changes]
  copilot-ollama-router-ci:   [has_code_changes]
  copilot-regression-guard:   [has_code_changes, has_config_changes]
  performance-regression-check: [has_code_changes]
