# GitHub Labels Configuration for ThemisDB
# This file defines all labels for categorizing issues and pull requests

# ============================================================================
# PRIORITY LABELS - Indicate urgency and importance
# ============================================================================
- name: "priority:P0"
  color: "b60205"
  description: "Critical priority - blocks release or causes system failure"

- name: "priority:P1"
  color: "d93f0b"
  description: "High priority - important for next release"

- name: "priority:P2"
  color: "fbca04"
  description: "Medium priority - planned for future release"

- name: "priority:P3"
  color: "0e8a16"
  description: "Low priority - nice to have"

# ============================================================================
# TYPE LABELS - Categorize the nature of the issue
# ============================================================================
- name: "type:bug"
  color: "d73a4a"
  description: "Something isn't working correctly"

- name: "type:feature"
  color: "a2eeef"
  description: "New feature or functionality request"

- name: "type:enhancement"
  color: "84b6eb"
  description: "Improvement to existing functionality"

- name: "type:documentation"
  color: "0075ca"
  description: "Documentation improvements or additions"

- name: "type:security"
  color: "ee0701"
  description: "Security vulnerability or security-related improvement"

- name: "type:performance"
  color: "1d76db"
  description: "Performance optimization or performance issue"

- name: "type:refactoring"
  color: "5319e7"
  description: "Code refactoring without changing functionality"

- name: "type:test"
  color: "bfd4f2"
  description: "Test additions, improvements, or fixes"

- name: "type:question"
  color: "d876e3"
  description: "Question or support request"

- name: "type:discussion"
  color: "cc317c"
  description: "Discussion or RFC (Request for Comments)"

# ============================================================================
# AREA LABELS - Component or module affected
# ============================================================================
- name: "area:llm"
  color: "c5def5"
  description: "LLM/AI features (llama.cpp, inference, embeddings)"

- name: "area:storage"
  color: "c5def5"
  description: "Storage layer (RocksDB, persistence)"

- name: "area:aql"
  color: "c5def5"
  description: "AQL query language and parser"

- name: "area:api"
  color: "c5def5"
  description: "REST API, HTTP endpoints"

- name: "area:networking"
  color: "c5def5"
  description: "Network protocols, gRPC, PostgreSQL wire protocol"

- name: "area:sharding"
  color: "c5def5"
  description: "Sharding, RAID, distributed systems"

- name: "area:replication"
  color: "c5def5"
  description: "Replication, WAL, consistency"

- name: "area:security"
  color: "c5def5"
  description: "Authentication, authorization, encryption"

- name: "area:monitoring"
  color: "c5def5"
  description: "Monitoring, metrics, observability"

- name: "area:content-processing"
  color: "c5def5"
  description: "Content processing (PDF, Office, video, images)"

- name: "area:geo"
  color: "c5def5"
  description: "Geospatial features and GIS functionality"

- name: "area:voice"
  color: "c5def5"
  description: "Voice assistant, STT, TTS"

- name: "area:performance"
  color: "c5def5"
  description: "Performance subsystem, benchmarks"

- name: "area:build"
  color: "c5def5"
  description: "Build system, CMake, dependencies"

- name: "area:docker"
  color: "c5def5"
  description: "Docker, containers, deployment"

- name: "area:ci-cd"
  color: "c5def5"
  description: "CI/CD pipelines, GitHub Actions"

- name: "area:docs"
  color: "c5def5"
  description: "Documentation system, MkDocs"

- name: "area:sdks"
  color: "c5def5"
  description: "Client SDKs (Python, Java, .NET)"

- name: "area:observability"
  color: "c5def5"
  description: "Grafana, Prometheus, tracing"

# ============================================================================
# STATUS LABELS - Current state of the issue
# ============================================================================
- name: "status:blocked"
  color: "000000"
  description: "Blocked by another issue or external dependency"

- name: "status:in-progress"
  color: "0052cc"
  description: "Currently being worked on"

- name: "status:needs-review"
  color: "fbca04"
  description: "Needs review or feedback"

- name: "status:needs-info"
  color: "fef2c0"
  description: "Needs more information from reporter"

- name: "status:on-hold"
  color: "d4c5f9"
  description: "On hold, waiting for decision or resources"

- name: "status:ready"
  color: "c2e0c6"
  description: "Ready to be worked on"

# ============================================================================
# EFFORT LABELS - Estimated effort required
# ============================================================================
- name: "effort:small"
  color: "c5e1a5"
  description: "< 1 day of work"

- name: "effort:medium"
  color: "fff59d"
  description: "1-3 days of work"

- name: "effort:large"
  color: "ffcc80"
  description: "1-2 weeks of work"

- name: "effort:x-large"
  color: "ef9a9a"
  description: "> 2 weeks of work"

# ============================================================================
# EXPERIENCE LABELS - Suitable for contributors with different skill levels
# ============================================================================
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers to the project"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed, looking for contributors"

- name: "mentor available"
  color: "006b75"
  description: "A maintainer is available to mentor on this issue"

# ============================================================================
# SPECIAL LABELS - Special purpose labels
# ============================================================================
- name: "breaking-change"
  color: "ff0000"
  description: "Breaking change requiring version bump or migration"

- name: "regression"
  color: "e99695"
  description: "Bug that worked before but is now broken"

- name: "duplicate"
  color: "cfd3d7"
  description: "Duplicate of another issue"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "invalid"
  color: "e4e669"
  description: "Invalid issue or not reproducible"

- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (vcpkg, submodules)"

- name: "technical-debt"
  color: "d4c5f9"
  description: "Technical debt that should be addressed"

# ============================================================================
# EDITION LABELS - Related to specific editions
# ============================================================================
- name: "edition:minimal"
  color: "b4a7d6"
  description: "Minimal edition specific"

- name: "edition:standard"
  color: "b4a7d6"
  description: "Standard edition specific"

- name: "edition:enterprise"
  color: "b4a7d6"
  description: "Enterprise edition specific"

# ============================================================================
# PLATFORM LABELS - Platform-specific issues
# ============================================================================
- name: "platform:linux"
  color: "e9d758"
  description: "Linux specific issue"

- name: "platform:windows"
  color: "e9d758"
  description: "Windows specific issue"

- name: "platform:macos"
  color: "e9d758"
  description: "macOS specific issue"

# ============================================================================
# LANGUAGE LABELS - Related to language support
# ============================================================================
- name: "lang:german"
  color: "fad8c7"
  description: "German language support or documentation"

- name: "lang:english"
  color: "fad8c7"
  description: "English language support or documentation"

# ============================================================================
# MILESTONE LABELS - Related to releases (update as needed)
# ============================================================================
- name: "milestone:current"
  color: "ededed"
  description: "Planned for current release"

- name: "milestone:next"
  color: "ededed"
  description: "Planned for next release"

- name: "milestone:future"
  color: "ededed"
  description: "Planned for future release"
