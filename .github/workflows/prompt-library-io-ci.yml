name: Prompt Engineering – Library Import/Export CI

# Validates PromptLibraryIO, PromptLibraryBundle, ExportFormat,
# ImportResult, ExportResult, FNV-1a checksum, JSON/YAML import+export,
# and file round-trip (Phase 5, item 4 — v2.0.0).
# roadmap:prompt_engineering:v2.0.0:prompt-library-io
#
# Acceptance criteria covered:
#   AC-1  to AC-5   Default construction, checksum compute/verify
#   AC-6  to AC-8   exportToJson() non-empty, checksum embedded, keys present
#   AC-9  to AC-14  importFromJson() edge cases, round-trips, metadata
#   AC-15 to AC-19  exportToYaml() / importFromYaml()
#   AC-20 to AC-22  exportToFile() JSON, YAML, auto-detect
#   AC-23 to AC-26  importFromFile() JSON, YAML, missing, checksum-invalid
#   AC-27 to AC-30  round-trip file, PromptLibraryBundle::fromJson(toJson())

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/prompt_engineering/prompt_library_io.h'
      - 'src/prompt_engineering/prompt_library_io.cpp'
      - 'tests/test_prompt_library_io.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/prompt-library-io-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/prompt_library_io.h'
      - 'src/prompt_engineering/prompt_library_io.cpp'
      - 'tests/test_prompt_library_io.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/prompt-library-io-ci.yml'
  workflow_dispatch:

concurrency:
  group: prompt-library-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  prompt-library-io-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: PromptLibraryIO (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev
            libyaml-cpp-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_prompt_library_io_focused

      - name: Run PromptLibraryIOFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PromptLibraryIOFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee library_io_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_prompt_library_io_focused \
            --gtest_output="xml:library_io_gtest.xml" \
            2>&1 | tee library_io_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-io-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/library_io_ctest.txt
            build/library_io_gtest.xml
            build/library_io_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 📦 Prompt Engineering – Library Import/Export" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1:  Default construction | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2:  computeChecksum() 16-char hex (empty) | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3:  computeChecksum() 16-char hex (non-empty) | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4:  verifyChecksum() true on match | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5:  verifyChecksum() false on tamper | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6:  exportToJson() non-empty | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7:  exportToJson() embeds checksum | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8:  exported JSON required keys | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9:  importFromJson() nullopt on empty | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: importFromJson() nullopt on malformed | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-11: importFromJson() metadata round-trip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-12: importFromJson() zero templates | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-13: importFromJson() multiple templates | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-14: importFromJson() template.metadata preserved | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-15: exportToYaml() non-empty | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-16: exported YAML contains keys | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-17: importFromYaml() metadata round-trip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-18: importFromYaml() template content | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-19: importFromYaml() nullopt on empty | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-20: exportToFile() JSON success | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-21: exportToFile() YAML success | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-22: exportToFile() auto-detect YAML | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-23: importFromFile() JSON | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-24: importFromFile() YAML | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-25: importFromFile() missing file | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-26: importFromFile() checksum invalid | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-27: round-trip JSON template count | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-28: round-trip YAML template count | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-29: exportToJson() auto-computes checksum | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-30: PromptLibraryBundle JSON round-trip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
