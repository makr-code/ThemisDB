name: Vulkan Compute Shader Pipeline CI

# Triggered on every push / PR that touches the Vulkan compute shader pipeline
# hardening sources (MoltenVK probe, specialization constants, double-buffer
# staging) or its test file.  Targets v1.7.0.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/acceleration/graphics_backends.h'
      - 'src/acceleration/graphics_backends.cpp'
      - 'src/acceleration/vulkan/shaders/l2_distance.comp'
      - 'src/acceleration/vulkan/shaders/batch_search.comp'
      - 'tests/test_vulkan_compute_shader_hardening.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_gpu_vulkan-compute-shader-pipeline-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run VulkanComputeShaderHardening tests on CPU-only CI.
  # All hardware-dependent tests are guarded with GTEST_SKIP() so they run
  # safely without Vulkan hardware.
  #
  # Covers:
  #   AC-1  MoltenVK VK_KHR_buffer_device_address probe
  #         - hasBufferDeviceAddress() returns false before initialize()
  #         - probe result reflected in getHealthStatus().driverInfo
  #   AC-2  SPIR-V specialization constants for workgroup sizes
  #         - Default workgroup sizes match l2_distance.comp shader defaults
  #         - Non-default sizes accepted without crash
  #         - l2_distance.comp and batch_search.comp use local_size_{x,y}_id
  #   AC-3  Double-buffer staging buffers
  #         - Multiple consecutive dispatches produce consistent results
  #         - Staging ring does not corrupt data between calls
  # ---------------------------------------------------------------------------
  vulkan-compute-shader-pipeline-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Vulkan Compute Shader Pipeline (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libgtest-dev \
            libmimalloc-dev \
            librocksdb-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            liblz4-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libyaml-cpp-dev \
            pkg-config

      - name: Configure CMake (CPU-only, Vulkan disabled)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ROOT_DIR="${{ github.workspace }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_PERF_AUTO_ENABLE=OFF

      - name: Build themis_tests
        run: |
          cmake --build build --target themis_tests --parallel $(nproc)

      - name: Run VulkanComputeShaderHardening tests (Vulkan disabled)
        run: |
          cd build
          ctest --output-on-failure \
            --tests-regex "VulkanComputeShaderHardening" \
            --timeout 60

      - name: Verify shader files include specialization constant headers
        run: |
          echo "Checking l2_distance.comp for local_size_x_id..."
          grep -q "local_size_x_id" \
            src/acceleration/vulkan/shaders/l2_distance.comp && \
            echo "✅ l2_distance.comp uses local_size_x_id" || \
            (echo "❌ l2_distance.comp missing local_size_x_id" && exit 1)

          echo "Checking l2_distance.comp for local_size_y_id..."
          grep -q "local_size_y_id" \
            src/acceleration/vulkan/shaders/l2_distance.comp && \
            echo "✅ l2_distance.comp uses local_size_y_id" || \
            (echo "❌ l2_distance.comp missing local_size_y_id" && exit 1)

          echo "Checking batch_search.comp for local_size_x_id..."
          grep -q "local_size_x_id" \
            src/acceleration/vulkan/shaders/batch_search.comp && \
            echo "✅ batch_search.comp uses local_size_x_id" || \
            (echo "❌ batch_search.comp missing local_size_x_id" && exit 1)

      - name: Verify MoltenVK probe implementation in graphics_backends.cpp
        run: |
          echo "Checking VK_KHR_BUFFER_DEVICE_ADDRESS_EXTENSION_NAME probe..."
          grep -q "VK_KHR_BUFFER_DEVICE_ADDRESS_EXTENSION_NAME" \
            src/acceleration/graphics_backends.cpp && \
            echo "✅ VK_KHR_buffer_device_address probe present" || \
            (echo "❌ VK_KHR_buffer_device_address probe missing" && exit 1)

          echo "Checking hasBufferDeviceAddress member..."
          grep -q "hasBufferDeviceAddress" \
            src/acceleration/graphics_backends.cpp && \
            echo "✅ hasBufferDeviceAddress probe flag present" || \
            (echo "❌ hasBufferDeviceAddress flag missing" && exit 1)

      - name: Verify double-buffer staging implementation
        run: |
          echo "Checking StagingSlot ring buffer..."
          grep -q "StagingSlot" \
            src/acceleration/graphics_backends.cpp && \
            echo "✅ StagingSlot struct present" || \
            (echo "❌ StagingSlot struct missing" && exit 1)

          echo "Checking staging ring semaphore-based two-phase submission..."
          grep -q "xferDone" \
            src/acceleration/graphics_backends.cpp && \
            echo "✅ Two-phase DMA/compute submission present" || \
            (echo "❌ Two-phase DMA/compute submission missing" && exit 1)

      - name: Verify specialization constants in pipeline creation
        run: |
          echo "Checking VkSpecializationInfo in createComputePipelines..."
          grep -q "VkSpecializationInfo" \
            src/acceleration/graphics_backends.cpp && \
            echo "✅ VkSpecializationInfo present in pipeline creation" || \
            (echo "❌ VkSpecializationInfo missing from pipeline creation" && exit 1)

          echo "Checking workgroup size specialization constants..."
          grep -q "wgL2X\|wgL2Y\|wgBatchSearchX" \
            src/acceleration/graphics_backends.cpp && \
            echo "✅ Workgroup specialization constants present" || \
            (echo "❌ Workgroup specialization constants missing" && exit 1)

      - name: Write job summary
        if: always()
        run: |
          echo "## 🖥️ Vulkan Compute Shader Pipeline CI (${{ matrix.compiler }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Vulkan** | Disabled (CPU-only) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Acceptance Criteria" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-1  MoltenVK BDA probe: hasBufferDeviceAddress() implemented and deterministic" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-2  Specialization constants: l2_distance.comp + batch_search.comp use local_size_{x,y}_id" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-2  Pipeline creation passes VkSpecializationInfo with tunable workgroup sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-3  Double-buffer staging: StagingSlot ring + semaphore-chained two-phase submission" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate: all matrix legs must pass
  # ---------------------------------------------------------------------------
  vulkan-compute-shader-pipeline-gate:
    name: Vulkan Compute Shader Pipeline Gate
    needs: vulkan-compute-shader-pipeline-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check test results
        shell: bash
        run: |
          result="${{ needs.vulkan-compute-shader-pipeline-tests.result }}"
          if [[ "$result" == "success" ]]; then
            echo "✅ All Vulkan compute shader pipeline tests passed."
          elif [[ "$result" == "skipped" ]]; then
            echo "ℹ️  Tests skipped (no relevant changes detected)."
          else
            echo "❌ Vulkan compute shader pipeline tests failed."
            exit 1
          fi

      - name: Write gate summary
        if: always()
        run: |
          result="${{ needs.vulkan-compute-shader-pipeline-tests.result }}"
          echo "## 🖥️ Vulkan Compute Shader Pipeline Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test result** | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
