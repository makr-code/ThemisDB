name: CapabilityAutoGenerator Persist State CI

# Triggered whenever the CapabilityAutoGenerator sources, the test file,
# or this workflow itself change.
# Targets v1.8.0 (roadmap:217:utils:v1.8.0:capabilityautogenerator-persist-schedule-and-document-count-state).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/utils/capability_auto_generator.h'
      - 'src/utils/capability_auto_generator.cpp'
      - 'include/storage/rocksdb_wrapper.h'
      - 'src/storage/rocksdb_wrapper.cpp'
      - 'tests/test_capabilityautogenerator_persist_state.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_capabilityautogenerator-persist-state-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/utils/capability_auto_generator.h'
      - 'src/utils/capability_auto_generator.cpp'
      - 'include/storage/rocksdb_wrapper.h'
      - 'src/storage/rocksdb_wrapper.cpp'
      - 'tests/test_capabilityautogenerator_persist_state.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_capabilityautogenerator-persist-state-ci.yml'
  workflow_dispatch:

concurrency:
  group: capabilityautogenerator-persist-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CapGenPersistStateTests suite.
  # Tests cover acceptance criteria:
  #   AC-1  Constructor loads persisted last_run_timestamp / last_document_count
  #         from RocksDB key "utils_capgen_state:<shard_id>".
  #   AC-2  Schedule gate: processShard skips within interval.
  #   AC-3  shouldUpdate uses persisted document count for delta check.
  #   AC-4  saveCapability serialises DomainCapability to YAML (atomic write).
  #   AC-5  persistState writes updated state to RocksDB after successful save.
  # ---------------------------------------------------------------------------
  capabilityautogenerator-persist-state-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CapGenPersistState tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev libyaml-cpp-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_capabilityautogenerator_persist_state_focused

      - name: Run CapGenPersistState unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex CapGenPersistStateTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee capgen_persist_state_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capgen-persist-state-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/capgen_persist_state_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🗂️ CapabilityAutoGenerator Persist State – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "CapabilityAutoGenerator: schedule-gate persistence, document-count delta, YAML serialisation, atomic file write, RocksDB state key." >> "$GITHUB_STEP_SUMMARY"
