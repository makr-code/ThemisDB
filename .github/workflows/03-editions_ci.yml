name: Editions CI (modular matrix)

on:
  push:
    branches:
      - develop
      - main
      - enterprise
      - hyperscaler
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to build
        required: true
        default: all
        type: choice
        options:
          - all
          - MINIMAL
          - COMMUNITY
          - ENTERPRISE
          - MILITARY
          - HYPERSCALER
      build_type:
        description: CMake build type
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release

concurrency:
  group: editions-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edition-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    strategy:
      fail-fast: false
      matrix:
        edition: [MINIMAL, COMMUNITY, ENTERPRISE, MILITARY, HYPERSCALER]

    steps:
      - name: Checkout
        if: |
          (
            github.event_name == 'workflow_dispatch' &&
            (inputs.edition == 'all' || inputs.edition == matrix.edition)
          ) || (
            github.event_name != 'workflow_dispatch' && (
              (github.ref_name == 'develop' && contains(fromJson('["MINIMAL","COMMUNITY","ENTERPRISE","MILITARY","HYPERSCALER"]'), matrix.edition)) ||
              (github.ref_name == 'main' && contains(fromJson('["MINIMAL","COMMUNITY"]'), matrix.edition)) ||
              (github.ref_name == 'enterprise' && contains(fromJson('["ENTERPRISE","MILITARY"]'), matrix.edition)) ||
              (github.ref_name == 'hyperscaler' && contains(fromJson('["HYPERSCALER"]'), matrix.edition))
            )
          )
        uses: actions/checkout@v4

      - name: Initialize llama.cpp submodule
        if: ${{ matrix.edition == 'COMMUNITY' || matrix.edition == 'ENTERPRISE' || matrix.edition == 'HYPERSCALER' }}
        run: git submodule update --init --depth=1 llama.cpp

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: gcc-12
          cxx: g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev libsimdjson-dev libsnappy-dev

      - name: Configure and build edition
        uses: ./.github/actions/configure-themis
        with:
          cc: gcc-12
          cxx: g++-12
          build-type: ${{ inputs.build_type || 'Debug' }}
          edition: ${{ matrix.edition }}
          ci-mode: "true"
          build-target: ${{ matrix.edition != 'MINIMAL' && 'themis_tests' || '' }}

      - name: Edition smoke check
        if: ${{ matrix.edition != 'MINIMAL' }}
        run: ctest --test-dir build --output-on-failure -j 2 --tests-regex BuildConfiguration
