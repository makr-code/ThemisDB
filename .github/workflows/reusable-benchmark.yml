name: 'Reusable Benchmark'

on:
  workflow_call:
    inputs:
      benchmark-suite:
        description: 'Benchmark suite to run (performance, sharding, all)'
        required: false
        type: string
        default: 'performance'
      baseline-ref:
        description: 'Git ref for baseline comparison'
        required: false
        type: string
        default: 'main'
      upload-results:
        description: 'Upload benchmark results'
        required: false
        type: boolean
        default: true
      update-baseline:
        description: 'Update performance baseline'
        required: false
        type: boolean
        default: false
    outputs:
      benchmark-status:
        description: 'Benchmark status'
        value: ${{ jobs.benchmark.outputs.status }}

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Benchmark (${{ inputs.benchmark-suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      status: ${{ steps.benchmark-result.outputs.status }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup C++ environment
        uses: ./.github/actions/setup-cpp-env
        with:
          use-system-libs: 'OFF'

      - name: Setup vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Build with benchmarks
        uses: ./.github/actions/cmake-build
        with:
          build-type: Release
          run-tests: false
          cmake-args: '-DTHEMIS_BUILD_BENCHMARKS=ON'

      - name: Run benchmarks
        id: run-bench
        run: |
          cd build
          
          case "${{ inputs.benchmark-suite }}" in
            performance)
              echo "Running performance benchmarks..."
              ./benchmarks/themis_benchmark --benchmark_format=json --benchmark_out=benchmark-results.json || true
              ;;
            sharding)
              echo "Running sharding benchmarks..."
              ./benchmarks/sharding_benchmark --benchmark_format=json --benchmark_out=benchmark-results.json || true
              ;;
            all)
              echo "Running all benchmarks..."
              ./benchmarks/themis_benchmark --benchmark_format=json --benchmark_out=benchmark-perf.json || true
              ./benchmarks/sharding_benchmark --benchmark_format=json --benchmark_out=benchmark-shard.json || true
              ;;
          esac
        continue-on-error: true

      - name: Upload benchmark results
        if: inputs.upload-results && always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ inputs.benchmark-suite }}
          path: |
            build/benchmark*.json
            build/benchmark*.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Compare with baseline
        if: inputs.baseline-ref != ''
        run: |
          echo "## 📊 Benchmark Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Suite:** ${{ inputs.benchmark-suite }}" >> $GITHUB_STEP_SUMMARY
          echo "**Baseline:** ${{ inputs.baseline-ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmark results have been collected." >> $GITHUB_STEP_SUMMARY
          echo "For detailed comparison, review the artifacts." >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Update baseline
        if: inputs.update-baseline && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Baseline update would occur here in production"
          # Would copy benchmark results to a baseline storage location
        continue-on-error: true

      - name: Set benchmark result
        id: benchmark-result
        if: always()
        run: |
          if [ "${{ steps.run-bench.outcome }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
