name: Distributed Transaction Coordinator (2PC) CI

# Triggered on every push/PR that touches the 2PC coordinator sources or tests.
# Targets milestone v1.9.0.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/transaction/distributed_transaction_manager.h'
      - 'src/transaction/distributed_transaction_manager.cpp'
      - 'tests/test_transaction_distributed_2pc.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_transactions_transaction-distributed-2pc-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the TransactionDistributed2PC focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  Coordinator role: beginDistributed() returns a valid unique TXN-ID
  #   AC-2  Prepare phase collects votes from all participants
  #   AC-3  All-commit vote → PREPARED state
  #   AC-4  Any-abort vote  → transaction transitions to ABORTED state
  #   AC-5  commitDistributed() calls onCommit on every participant
  #   AC-6  abortDistributed() calls onAbort on every participant
  #   AC-7  Participant API: applyCommit/applyAbort return OK for known txn
  #   AC-8  Timeout handling: checkTimeouts() aborts expired transactions
  #   AC-9  Failure detection: isParticipantAlive() returns true (in-process default)
  #   AC-10 Coordinator crash recovery: recoverInDoubtTransactions() no-op without WAL
  #   AC-11 Participant crash: prepare exception treated as ABORT vote
  #   AC-12 Network partition: short prepare timeout aborts transaction
  #   AC-13 Partial commit: automatic ABORT broadcast on prepare failure
  #   AC-14 Latency: prepare+commit completes in <50 ms (local in-process)
  #   AC-15 Throughput: 50 concurrent transactions all succeed
  #   AC-16 Batched prepare/commit: 5-participant transaction calls all in parallel
  #   AC-17 voteOnPrepare: returns error for non-PREPARING transaction
  #   AC-18 Statistics: committed/aborted counters reflect outcomes
  #   AC-19 Empty participants: beginDistributed throws std::invalid_argument
  #   AC-20 Idempotent abort: repeated abortDistributed is safe
  # ---------------------------------------------------------------------------
  distributed-2pc-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Distributed 2PC (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run TransactionDistributed2PCFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R TransactionDistributed2PCFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee distributed_2pc_ctest.txt

      # ── Full test filter via focused binary ───────────────────────────────
      - name: Run all DistributedTxnManagerTest groups
        run: |
          set -o pipefail
          cd build
          ./tests/test_transaction_distributed_2pc_focused \
            --gtest_filter="DistributedTxnManagerTest*" \
            --gtest_output="xml:distributed_2pc_gtest.xml" \
            2>&1 | tee distributed_2pc_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-2pc-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/distributed_2pc_ctest.txt
            build/distributed_2pc_gtest.xml
            build/distributed_2pc_gtest_output.txt
          retention-days: 30
