name: OrphanDetector DistributedCoordinator Wiring CI

# Triggered on every push / PR that touches the OrphanDetector or
# DistributedCoordinator sources, their test files, or this workflow.
# Targets v1.8.0 (roadmap:202:sharding:v1.8.0:orphandetector-wire-to-distributedcoordinator-transaction-list).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/sharding/orphan_detector.h'
      - 'src/sharding/orphan_detector.cpp'
      - 'include/sharding/distributed_coordinator.h'
      - 'src/sharding/distributed_coordinator.cpp'
      - 'include/sharding/cross_shard_transaction.h'
      - 'src/sharding/cross_shard_transaction.cpp'
      - 'tests/test_orphan_detector_wired.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_orphan-detector-wired-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/sharding/orphan_detector.h'
      - 'src/sharding/orphan_detector.cpp'
      - 'include/sharding/distributed_coordinator.h'
      - 'src/sharding/distributed_coordinator.cpp'
      - 'include/sharding/cross_shard_transaction.h'
      - 'src/sharding/cross_shard_transaction.cpp'
      - 'tests/test_orphan_detector_wired.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_orphan-detector-wired-ci.yml'
  workflow_dispatch:

concurrency:
  group: orphan-detector-wired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the OrphanDetectorWiredFocusedTests suite.
  #
  # Acceptance criteria covered:
  #   AC-1  Inject DistributedCoordinator* into OrphanDetector constructor.
  #   AC-2  detectOrphans() calls coordinator->listInFlightTransactions() for
  #          the authoritative in-flight transaction list.
  #   AC-3  isOrphaned() calls coordinator->getTransaction(txn_id) to fetch
  #          transaction metadata.
  #   AC-4  Fallback to per-call CrossShardTransactionCoordinator when no
  #          DistributedCoordinator is wired.
  #   AC-5  setTransactionCoordinator(nullptr) detaches safely; re-attach works.
  # ---------------------------------------------------------------------------
  orphan-detector-wired-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: OrphanDetector Wired tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_orphan_detector_wired_focused

      - name: Run OrphanDetector Wired unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex OrphanDetectorWiredFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee orphan_detector_wired_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orphan-detector-wired-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/orphan_detector_wired_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 OrphanDetector → DistributedCoordinator Wiring – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "OrphanDetector: DistributedCoordinator injection, listInFlightTransactions delegation, getTransaction delegation, per-call fallback." >> "$GITHUB_STEP_SUMMARY"
