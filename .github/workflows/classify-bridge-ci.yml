name: Classify Bridge CI

# Triggered on every push / PR that touches the classify-bridge sources,
# docs_assistant_functions, or the integration test.  Targets v1.7.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/aql/classify_bridge.h'
      - 'include/aql/docs_assistant_functions.h'
      - 'src/aql/classify_bridge.cpp'
      - 'src/aql/docs_assistant_functions.cpp'
      - 'tests/test_classify_bridge_integration.cpp'
      - 'cmake/LLMIntegration.cmake'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/classify-bridge-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/aql/classify_bridge.h'
      - 'include/aql/docs_assistant_functions.h'
      - 'src/aql/classify_bridge.cpp'
      - 'src/aql/docs_assistant_functions.cpp'
      - 'tests/test_classify_bridge_integration.cpp'
      - 'cmake/LLMIntegration.cmake'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/classify-bridge-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ClassifyBridgeIntegrationTest focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  IClassifyFn interface and NullClassifyFn compile and behave as no-ops
  #   AC-2  setClassifier() wires a classifier into DocsAssistantFunctions
  #   AC-3  detectIntentWithNativeNLP returns "unknown" when no classifier injected
  #   AC-4  detectIntentWithNativeNLP delegates to an injected classifier
  #   AC-5  AQLFunctionClassifyBridge returns "configuration" with confidence > 0.7
  #         for "how do I create an index?"
  #   AC-6  NullClassifyFn returns an empty ClassifyResult
  #   AC-7  Classifier can be reset to nullptr
  # ---------------------------------------------------------------------------
  classify-bridge-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Classify Bridge (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev liblz4-dev libzstd-dev libsnappy-dev libprotobuf-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Run ClassifyBridgeIntegrationTest via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ClassifyBridgeIntegrationTest*" \
            --gtest_output="xml:classify_bridge_gtest.xml" \
            2>&1 | tee classify_bridge_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classify-bridge-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/classify_bridge_gtest.xml
            build/classify_bridge_gtest_output.txt
          retention-days: 30
