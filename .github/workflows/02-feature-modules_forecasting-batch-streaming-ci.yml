name: Analytics – Forecasting Batch/Streaming CI

# Validates ForecastModel::predictBatch(), update(), parallel auto-tune,
# and fit-result cache (Issue #4054, analytics v1.9.0).
#
# Acceptance criteria covered:
#   AC-1  predictBatch() returns correct shape (outer=batch.size, inner=steps)
#   AC-2  predictBatch() single-series matches single predict() output
#   AC-3  predictBatch() throws for steps < 1
#   AC-4  predictBatch() empty batch returns empty result
#   AC-5  predictBatch() works for all 5 ForecastMethod values
#   AC-6  update() is a no-op on unfitted model
#   AC-7  update() shifts SES level toward new observation
#   AC-8  update() shifts HW level/trend/seasonal components
#   AC-9  update() shifts ARIMA window
#   AC-10 Multiple update() calls leave model fitted and producing finite predictions
#   AC-11 Fit cache: second fit on same data produces identical results (cache hit)
#   AC-12 Fit cache: different data invalidates cache and produces different results
#   AC-13 Parallel auto-tune (EXP_SMOOTHING): model remains fitted with finite output
#   AC-14 Parallel auto-tune (HOLT_WINTERS): model remains fitted with finite output

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/forecasting.h'
      - 'src/analytics/forecasting.cpp'
      - 'tests/analytics/test_forecasting.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/02-feature-modules_forecasting-batch-streaming-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/forecasting.h'
      - 'src/analytics/forecasting.cpp'
      - 'tests/analytics/test_forecasting.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/02-feature-modules_forecasting-batch-streaming-ci.yml'
  workflow_dispatch:

concurrency:
  group: forecasting-batch-streaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  forecasting-batch-streaming-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Forecasting Batch/Streaming (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_forecasting_focused

      - name: Run ForecastingFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ForecastingFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee forecasting_ctest.txt

      - name: Run ForecastingBatchStreamingTests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_forecasting_focused \
            --gtest_filter="ForecastingBatchStreamingTests*" \
            --gtest_output="xml:forecasting_batch_streaming_gtest.xml" \
            2>&1 | tee forecasting_batch_streaming_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecasting-batch-streaming-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/forecasting_ctest.txt
            build/forecasting_batch_streaming_gtest.xml
            build/forecasting_batch_streaming_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 📈 Analytics – Forecasting Batch/Streaming CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1:  predictBatch() returns correct shape | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2:  predictBatch() matches single predict() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3:  predictBatch() throws for steps < 1 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4:  predictBatch() empty batch → empty result | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5:  predictBatch() all 5 ForecastMethod values | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6:  update() no-op on unfitted model | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7:  update() shifts SES level | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8:  update() shifts HW level/trend/seasonal | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9:  update() shifts ARIMA window | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: Multiple update() calls — model stays fitted | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-11: Fit cache — repeated fit on same data consistent | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-12: Fit cache — different data invalidates cache | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-13: Parallel auto-tune EXP_SMOOTHING — finite output | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-14: Parallel auto-tune HOLT_WINTERS — finite output | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
