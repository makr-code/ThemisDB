name: RAG Pipeline CI

# CI job that validates the RAG (Retrieval-Augmented Generation) module.
# Covers the full evaluation pipeline: hybrid retrieval, streaming context filling,
# cross-encoder re-ranking, multi-judge evaluation, prompt injection detection,
# hallucination tracking, agentic RAG, and distributed evaluation.
#
# No GPU hardware is required — all tests exercise CPU-only paths.
#
# See: src/rag/ROADMAP.md — Production Readiness Checklist

on:
  workflow_run:
    workflows: ["🚦 Post-Merge Smoke Test"]
    types: [completed]
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/rag/**'
      - 'include/rag/**'
      - 'tests/test_rag_*.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_rag_rag-pipeline-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Core RAG pipeline test suite: evaluation, retrieval, and security tests.
  #
  # Acceptance criteria verified:
  #   AC-1  RAGJudge factory methods (Fast/Balanced/Thorough) construct correctly
  #   AC-2  RAGJudge evaluation scores are normalised to [0.0, 1.0]
  #   AC-3  HybridRetriever RRF fusion is runtime-configurable (no index rebuild)
  #   AC-4  HybridRetriever deduplicates results from BM25 and vector sources
  #   AC-5  StreamingRetriever fills context window incrementally
  #   AC-6  StreamingRetriever does not block the generator thread
  #   AC-7  CrossEncoderReranker degrades to heuristic when ONNX model absent
  #   AC-8  PromptInjectionDetector blocks instruction-override, system-prompt
  #         leak, delimiter escape, role injection, markup injection, bidi
  #   AC-9  DistributedRAGEvaluator aggregates results (MEAN/WEIGHTED_MEAN/
  #         MAJORITY_VOTING/BEST_OF_N)
  #   AC-10 Full pipeline (split → retrieve → evaluate) runs end-to-end
  #   AC-11 EvaluationCache provides cache miss then hit on repeated queries
  #   AC-12 BatchEvaluator produces consistent results in parallel
  # ---------------------------------------------------------------------------
  rag-pipeline-tests:
    needs: ci-scope-classifier
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule') ||
      needs.ci-scope-classifier.outputs.has_llm_changes == 'true'
    name: RAG Pipeline (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build (LLM enabled, CPU-only)
        uses: ./.github/actions/configure-themis
        with:
          cc:      ${{ matrix.cc }}
          cxx:     ${{ matrix.cxx }}
          edition: COMMUNITY
          ci-mode: 'true'

      # ── Integration test: full retrieve → split → evaluate pipeline ────────
      - name: Run RAGPipelineIntegrationTest
        run: |
          set -o pipefail
          cd build
          ctest -R "RAGPipelineIntegrationTest" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rag_pipeline_ctest.txt

      # ── Core evaluation: RAGJudge multi-dimensional scoring ────────────────
      - name: Run RAGJudgeTest
        run: |
          set -o pipefail
          cd build
          ctest -R "RAGJudgeTest" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rag_judge_ctest.txt

      # ── Retrieval: HybridRetriever RRF fusion ──────────────────────────────
      - name: Run HybridRetrieverTest
        run: |
          set -o pipefail
          cd build
          ctest -R "HybridRetriever" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rag_hybrid_retriever_ctest.txt

      # ── Streaming: incremental context window filling ──────────────────────
      - name: Run StreamingRetrieverTest and ContextWindowFillerTest
        run: |
          set -o pipefail
          cd build
          ctest -R "StreamingRetrieverTest|ContextWindowFillerTest" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rag_streaming_retriever_ctest.txt

      # ── Security: prompt injection detection and sanitization ──────────────
      - name: Run PromptInjectionDetector and InjectionScanResult tests
        run: |
          set -o pipefail
          cd build
          ctest -R "PromptInjectionDetector|InjectionScanResult|PromptInjectionSanitizer" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rag_prompt_injection_ctest.txt

      # ── Distributed evaluation: multi-judge aggregation ───────────────────
      - name: Run DistributedRAGEvaluator tests
        run: |
          set -o pipefail
          cd build
          ctest -R "DistributedRAGEvaluator" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rag_distributed_evaluator_ctest.txt

      # ── REPLUG: LLM-scored retrieval and ensemble fusion ──────────────────
      #
      # Acceptance criteria verified:
      #   AC-13 ReplugRetriever::fuse() interpolates retrieval and LLM scores
      #         using configured lambda weight
      #   AC-14 HeuristicLLMScorer returns scores in [0.0, 1.0]
      #   AC-15 ReplugRetriever::updateRetrieverWeights() adjusts weights via
      #         KL divergence minimisation (REPLUG-LSR gradient signal)
      #   AC-16 ReplugRetrieverFactory produces Default/WithCustomScorer instances
      - name: Run ReplugRetrieverFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R "ReplugRetrieverFocusedTests" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rag_replug_retriever_ctest.txt

      # ── RLAIF: Constitutional AI / RLAIF training pipeline ────────────────
      #
      # Acceptance criteria verified:
      #   AC-17 HeuristicAIJudge::critique() returns a critique string with
      #         violation_detected flag set appropriately
      #   AC-18 HeuristicAIJudge::revise() produces a non-empty revised response
      #   AC-19 RLAIFTrainer::runTrainingStep() generates preference pairs for
      #         all configured constitutional strategies
      #   AC-20 RLAIFTrainer::processBatch() returns one preference pair per
      #         input candidate
      #   AC-21 RLAIFTrainerFactory produces Default/WithCustomJudge instances
      - name: Run RLAIFTrainerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R "RLAIFTrainerFocusedTests" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rag_rlaif_trainer_ctest.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-pipeline-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/rag_pipeline_ctest.txt
            build/rag_judge_ctest.txt
            build/rag_hybrid_retriever_ctest.txt
            build/rag_streaming_retriever_ctest.txt
            build/rag_prompt_injection_ctest.txt
            build/rag_distributed_evaluator_ctest.txt
            build/rag_replug_retriever_ctest.txt
            build/rag_rlaif_trainer_ctest.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 RAG Pipeline CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Edition** | COMMUNITY (LLM=ON, GPU=ON, CUDA=OFF) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test Suites" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAGPipelineIntegrationTest | Full pipeline: split → retrieve → evaluate |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RAGJudgeTest | Multi-dimensional scoring, ensembles, pairwise comparison |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HybridRetrieverTest | BM25+vector RRF fusion, runtime-configurable weights |" >> "$GITHUB_STEP_SUMMARY"
          echo "| StreamingRetrieverTest | Incremental context window filling |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ContextWindowFillerTest | Token budget enforcement |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PromptInjectionDetector | Instruction-override, system-prompt leak, bidi |" >> "$GITHUB_STEP_SUMMARY"
          echo "| DistributedRAGEvaluator | MEAN/WEIGHTED_MEAN/MAJORITY_VOTING/BEST_OF_N |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ReplugRetrieverFocusedTests | LLM-scored fusion, HeuristicLLMScorer, REPLUG-LSR (LM-Supervised Retrieval) weight update |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RLAIFTrainerFocusedTests | Constitutional AI critique/revise, preference pairs, batch |" >> "$GITHUB_STEP_SUMMARY"
