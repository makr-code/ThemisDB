name: RocksDBWrapper Size Calculation CI

# Triggered whenever the RocksDBWrapper sources, the DiskSpaceMonitor,
# the test file, or this workflow itself change.
# Targets v1.8.0 (roadmap:205:storage:v1.8.0:rocksdbwrapper-implement-proper-size-calculation).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/storage/rocksdb_wrapper.h'
      - 'src/storage/rocksdb_wrapper.cpp'
      - 'include/storage/disk_space_monitor.h'
      - 'src/storage/disk_space_monitor.cpp'
      - 'tests/test_rocksdb_size_calculation.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_rocksdb-size-calculation-ci.yml'
  workflow_dispatch:

concurrency:
  group: rocksdb-size-calculation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the RocksDBSizeCalculationFocusedTests suite.
  # Tests cover all four acceptance criteria:
  #   AC-1  getApproximateSize() returns non-zero after flush.
  #   AC-2  getStats() JSON contains total_sst_files_size_bytes.
  #   AC-3  DiskSpaceMonitor::setRocksDBSize() persists in SpaceInfo.
  #   AC-4  getApproximateSize() returns 0 when DB is not open.
  # ---------------------------------------------------------------------------
  rocksdb-size-calculation-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: RocksDB Size Calculation tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_rocksdb_size_calculation_focused

      - name: Run RocksDB Size Calculation unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex RocksDBSizeCalculationFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee rocksdb_size_calculation_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocksdb-size-calculation-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/rocksdb_size_calculation_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📦 RocksDBWrapper Size Calculation – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "RocksDBWrapper: getApproximateSize via total-sst-files-size property, getStats total_sst_files_size_bytes field, DiskSpaceMonitor::setRocksDBSize wiring, /v1/admin/storage/stats endpoint." >> "$GITHUB_STEP_SUMMARY"
