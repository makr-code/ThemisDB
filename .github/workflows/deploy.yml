name: 'Deploy'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      component:
        description: 'Component to deploy'
        required: true
        type: choice
        options:
          - all
          - container
          - helm
          - docs
      version:
        description: 'Version/tag to deploy'
        required: false
        type: string
        default: 'latest'

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.component }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  deployments: write

env:
  ENVIRONMENT: ${{ inputs.environment }}
  VERSION: ${{ inputs.version }}

jobs:
  # Pre-deployment validation
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment parameters
        run: |
          echo "## 🚀 Deployment Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Component:** ${{ inputs.component }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Validate environment
          case "${{ inputs.environment }}" in
            development|staging|production)
              echo "✅ Valid environment" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "❌ Invalid environment" >> $GITHUB_STEP_SUMMARY
              exit 1
              ;;
          esac

  # Deploy container
  deploy-container:
    name: Deploy Container
    needs: validate
    if: inputs.component == 'all' || inputs.component == 'container'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push container
        uses: ./.github/workflows/reusable-container-build.yml
        with:
          dockerfile: 'Dockerfile'
          platforms: 'linux/amd64,linux/arm64'
          push: true
          tags: ${{ inputs.version }}-${{ inputs.environment }}
        secrets: inherit

      - name: Container deployment summary
        run: |
          echo "## 🐳 Container Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ inputs.version }}-${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY

  # Deploy Helm chart
  deploy-helm:
    name: Deploy Helm Chart
    needs: [validate, deploy-container]
    if: inputs.component == 'all' || inputs.component == 'helm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Deploy with Helm
        run: |
          echo "Helm deployment for ${{ inputs.environment }}"
          
          # This would contain actual Helm deployment logic
          if [ -d "helm/themisdb" ]; then
            helm lint helm/themisdb
            echo "✅ Helm chart validated" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Helm chart not found" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  # Deploy documentation
  deploy-docs:
    name: Deploy Documentation
    needs: validate
    if: inputs.component == 'all' || inputs.component == 'docs'
    uses: ./.github/workflows/reusable-docs-build.yml
    with:
      deploy-target: 'gh-pages'

  # Post-deployment verification
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-container, deploy-helm, deploy-docs]
    if: always()
    timeout-minutes: 15
    steps:
      - name: Health check
        run: |
          echo "## ✅ Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Post-deployment health checks would run here" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:**" >> $GITHUB_STEP_SUMMARY
          echo "- Container: ${{ needs.deploy-container.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Helm: ${{ needs.deploy-helm.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docs: ${{ needs.deploy-docs.result }}" >> $GITHUB_STEP_SUMMARY

  # Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [verify]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send notification
        uses: ./.github/actions/notification
        with:
          status: ${{ needs.verify.result }}
          message: 'Deployment to ${{ inputs.environment }} completed'
          channels: 'summary'
