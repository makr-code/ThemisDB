name: Workflow Boundary Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - community
      - develop
    paths:
      - '.github/workflows/**'
      - '.github/no_workflows/**'
      - '.github/WORKFLOW_GUIDELINES.md'
      - '.github/WORKFLOW_REGISTRY.md'
      - 'tools/ci/check_workflow_boundaries.py'
      - 'tools/tests/test_check_workflow_boundaries.py'
  workflow_dispatch:

concurrency:
  group: workflow-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-boundary-guard:
    name: Enforce workflow boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Collect changed files
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-status --find-renames "origin/${{ github.base_ref }}...HEAD" > workflow_changes.txt

      - name: Collect changed files for manual runs
        if: github.event_name != 'pull_request'
        run: |
          git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' '.github/no_workflows/*.yml' '.github/no_workflows/*.yaml' \
            | sed 's#^#M\t#' > workflow_changes.txt
          printf 'M\t.github/WORKFLOW_GUIDELINES.md\nM\t.github/WORKFLOW_REGISTRY.md\n' >> workflow_changes.txt

      - name: Run workflow boundary unit tests
        run: python -m pytest tools/tests/test_check_workflow_boundaries.py -q

      - name: Enforce workflow boundary policy
        run: |
          python tools/ci/check_workflow_boundaries.py \
            --repo-root . \
            --diff-file workflow_changes.txt