name: Windows OLAP CI (MSVC 2022 + vcpkg)

# Validates that OLAPEngine compiles and the OLAP unit tests pass on Windows
# after the whole-class _WIN32 stub was replaced with targeted SIMD guards
# (roadmap:238:analytics:v2.0.0:12-windows-platform-stubs-olapcpp-and-process-miningcpp).
#
# Acceptance criteria verified by this workflow:
#   AC-1  olap.cpp contains NO whole-class #if defined(_WIN32) stub (checked by
#         stub-guard-check step before building)
#   AC-2  All OLAPEngine methods work on Windows — MSVC build succeeds and OLAP
#         unit tests pass (test_olap_lru_cache_focused, test_olap_focused)
#   AC-3  process_mining.cpp Windows stub is gated on
#         THEMIS_PROCESS_MINING_WINDOWS_STUB (not unconditionally, so the full
#         implementation is used by default on Windows too)
#   AC-4  Arrow-absent exportToParquet / exportCollectionToParquet emit
#         spdlog::warn (not silent false) — covered by test_olap_focused

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/olap.h'
      - 'src/analytics/olap.cpp'
      - 'src/analytics/process_mining.cpp'
      - 'tests/analytics/test_olap_lru_cache.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_analytics_windows-olap-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 · Static stub-guard check (runs on Linux — fast gate before MSVC build)
  # Fails the workflow immediately if a whole-class _WIN32 guard is detected in
  # olap.cpp, preventing silent regressions where someone re-adds the stub.
  # ---------------------------------------------------------------------------
  stub-guard-check:
    name: Stub-guard audit (olap.cpp must have no whole-class _WIN32 block)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check olap.cpp for whole-class _WIN32 stub
        shell: bash
        run: |
          # The check looks for the pattern "#if defined(_WIN32)" followed within
          # 10 lines by a class OLAPEngine no-op body (the whole-class stub
          # signature).  A match means the stub was re-introduced and this CI
          # should fail.
          if grep -q '#if defined(_WIN32)' src/analytics/olap.cpp; then
            echo "::error file=src/analytics/olap.cpp::Found '#if defined(_WIN32)' in olap.cpp."
            echo "  The whole-class Windows stub must not be re-introduced."
            echo "  Use targeted #ifdef _WIN32 guards only around POSIX/SIMD primitives."
            exit 1
          fi
          echo "✅ No whole-class _WIN32 stub found in olap.cpp"

      - name: Verify Stubs counter in olap.cpp header is ≤ 2
        shell: bash
        run: |
          # The file header carries a 'Stubs: N' metric.  After removing the
          # whole-class Windows stub the only remaining stubs are the two
          # Arrow-absent (ARROW_ENABLED not set) export stubs.  A value > 2
          # indicates a regression.
          STUBS=$(grep -m1 'Stubs:' src/analytics/olap.cpp | grep -oP 'Stubs:\s*\K[0-9]+' || echo "0")
          echo "olap.cpp Stubs counter: ${STUBS}"
          if [ "${STUBS}" -gt 2 ]; then
            echo "::error file=src/analytics/olap.cpp::Stubs counter is ${STUBS} (> 2)."
            echo "  Expected ≤ 2 (only Arrow-absent export stubs are acceptable)."
            echo "  Investigate newly added stubs and either implement them or"
            echo "  document them with a targeted #ifdef guard."
            exit 1
          fi
          echo "✅ Stubs counter ${STUBS} is within the accepted limit (≤ 2)"

      - name: Verify process_mining.cpp Windows stub is conditional
        shell: bash
        run: |
          # The ProcessMining Windows stub must be gated on both _WIN32 AND
          # THEMIS_PROCESS_MINING_WINDOWS_STUB (an opt-in flag), NOT on _WIN32
          # alone.  This ensures the full implementation is compiled by default
          # on Windows; the stub is only active when the operator explicitly
          # sets the flag.
          if grep -q '^#if defined(_WIN32) && !defined(THEMIS_PROCESS_MINING_WINDOWS_STUB)' \
              src/analytics/process_mining.cpp 2>/dev/null; then
            echo "::error file=src/analytics/process_mining.cpp::ProcessMining Windows stub"
            echo "  is no longer conditional on THEMIS_PROCESS_MINING_WINDOWS_STUB."
            exit 1
          fi
          echo "✅ ProcessMining Windows stub remains correctly gated on THEMIS_PROCESS_MINING_WINDOWS_STUB"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔍 Stub-Guard Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          STUBS=$(grep -m1 'Stubs:' src/analytics/olap.cpp | grep -oP 'Stubs:\s*\K[0-9]+' || echo "N/A")
          WIN32=$(grep -c '#if defined(_WIN32)' src/analytics/olap.cpp || echo "0")
          echo "| olap.cpp whole-class \_WIN32 stub | \`${WIN32}\` occurrences (expect 0) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| olap.cpp Stubs counter | \`${STUBS}\` (limit ≤ 2) |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 2 · Windows MSVC build + OLAP unit tests
  # ---------------------------------------------------------------------------
  windows-olap-tests:
    name: Windows OLAP tests (MSVC 2022 + vcpkg)
    needs: stub-guard-check
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable Developer Command Prompt (MSVC 2022 x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-windows-olap-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-olap-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-Not (Test-Path "vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git vcpkg
          }
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg install --clean-after-build

      - name: Configure CMake (no Arrow, OLAP tests enabled)
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${env:GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DTHEMIS_BUILD_TESTS=ON `
            -DTHEMIS_BUILD_BENCHMARKS=OFF `
            -DTHEMIS_STRICT_BUILD=OFF `
            -DTHEMIS_HAS_ARROW=OFF

      - name: Build OLAP test targets
        shell: pwsh
        run: |
          cmake --build build --config Release `
            --target test_olap_lru_cache_focused `
            -j $env:NUMBER_OF_PROCESSORS

      - name: Run OLAP unit tests via CTest
        shell: pwsh
        run: |
          cd build
          ctest -C Release `
            -R "OLAPLRUCacheFocusedTests" `
            --output-on-failure `
            --timeout 120

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-olap-test-results
          path: |
            build/**/*.xml
            build/**/*ctest*.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🪟 Windows OLAP CI (MSVC 2022 + vcpkg)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | MSVC 2022 (cl.exe) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Arch** | x64 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Arrow** | disabled (\`THEMIS_HAS_ARROW=OFF\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
