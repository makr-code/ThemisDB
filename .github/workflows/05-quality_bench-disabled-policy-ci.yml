name: Bench Disabled-Stub Policy CI

# Implements the Disabled Benchmark Policy defined in
# benchmarks/docs/DISABLED_BENCHMARK_POLICY.md.
#
# Every BENCHMARK(BM_*_Disabled) registration in benchmarks/**/*.cpp must
# carry BOTH an issue reference (#NNN) and a sunset deadline (Deadline: vX.Y.Z)
# in a comment within 300 characters of the macro.
#
# tools/check_disabled_bench_policy.py exits 0 when all stubs are compliant,
# 1 on any violation.  A non-zero exit blocks the PR merge.
#
# Triggers:
#   • pull_request  – any change to benchmark C++ sources or the policy tools
#   • push to main/develop – baseline check after merge
#   • schedule      – nightly drift detection
#   • workflow_dispatch – manual run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'benchmarks/**/*.cpp'
      - 'tools/check_disabled_bench_policy.py'
      - 'tools/perf_expectations_audit.py'
      - 'benchmarks/docs/DISABLED_BENCHMARK_POLICY.md'
      - '.github/workflows/05-quality_bench-disabled-policy-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'benchmarks/**/*.cpp'
      - 'tools/check_disabled_bench_policy.py'
      - 'tools/perf_expectations_audit.py'
      - 'benchmarks/docs/DISABLED_BENCHMARK_POLICY.md'
  schedule:
    - cron: '0 2 * * *'   # Nightly at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled-bench-policy:
    name: Disabled Benchmark Policy Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run disabled-benchmark policy lint
        id: policy_check
        shell: bash
        run: |
          python3 tools/check_disabled_bench_policy.py --verbose
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run perf_expectations_audit (Maßnahme #9)
        id: audit
        if: always()
        shell: bash
        run: |
          python3 tools/perf_expectations_audit.py --quiet 2>&1 | grep -E "#9|Disabled" || true

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔬 Disabled Benchmark Policy – benchmarks/docs/DISABLED_BENCHMARK_POLICY.md" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Result" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Disabled-stub policy lint | \`${{ steps.policy_check.outcome }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| perf_expectations_audit Maßnahme #9 | \`${{ steps.audit.outcome }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See [DISABLED_BENCHMARK_POLICY.md](benchmarks/docs/DISABLED_BENCHMARK_POLICY.md) for policy details." \
            >> "$GITHUB_STEP_SUMMARY"
