name: LLMProcessAnalyzer LRU Cache CI

# Validates the O(1) LRU cache eviction implementation in LLMProcessAnalyzer
# (v1.8.0, roadmap:134:analytics:v1.8.0:7-llmprocessanalyzer-on-cache-eviction-under-lock).
# Covers:
#   AC-1  O(1) LRU eviction replaces O(N) linear scan in putInCache()
#   AC-2  SHA256-based getCacheKey() produces fixed-size 64-hex-char keys
#   AC-3  max_cache_entries in LLMConfig (default 1000, operator-configurable)
#   AC-4  LRU ordering: least-recently-used entry evicted first on capacity overflow
#   AC-5  Existing cache tests still pass (hits, misses, clearCache, stats)
#
# No GPU hardware or external LLM API required — uses the built-in simulated stub.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/llm_process_analyzer.h'
      - 'src/analytics/llm_process_analyzer.cpp'
      - 'tests/analytics/test_llm_process_analyzer.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_llm-process-analyzer-lru-cache-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/llm_process_analyzer.h'
      - 'src/analytics/llm_process_analyzer.cpp'
      - 'tests/analytics/test_llm_process_analyzer.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_llm-process-analyzer-lru-cache-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the LLMProcessAnalyzerFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-1  putInCache() / getFromCache() O(1) amortised LRU eviction
  #   AC-2  getCacheKey() produces a SHA256-based fixed-length key (no full dump())
  #   AC-3  max_cache_entries in LLMConfig is read and respected
  #   AC-4  LRU eviction order: LRU entry evicted when capacity is exceeded
  #   AC-5  Cache hits, misses, clearCache(), getCacheStats() work correctly
  # ---------------------------------------------------------------------------
  llm-lru-cache-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: LLMProcessAnalyzer LRU cache tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_llm_process_analyzer_focused

      - name: Run LLMProcessAnalyzerFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R LLMProcessAnalyzerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee llm_lru_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_llm_process_analyzer_focused \
            --gtest_output="xml:llm_lru_gtest.xml" \
            2>&1 | tee llm_lru_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-lru-cache-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/llm_lru_ctest.txt
            build/llm_lru_gtest.xml
            build/llm_lru_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🚀 LLMProcessAnalyzer LRU Cache CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates O(1) LRU eviction (replaces O(N) linear scan), SHA256-based getCacheKey()," >> "$GITHUB_STEP_SUMMARY"
          echo "max_cache_entries configurability in LLMConfig, and correct LRU ordering semantics." >> "$GITHUB_STEP_SUMMARY"
