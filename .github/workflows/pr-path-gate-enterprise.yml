name: PR Path Gate · enterprise

# Enforces the Enterprise release-lane policy on pull requests targeting enterprise.
#
# POLICY
# ------
#   enterprise is the Enterprise/Military release lane.
#   Hyperscaler-exclusive artefacts should not land here unless they are
#   explicitly needed for Enterprise builds as well.
#
#   Blocked paths (Hyperscaler-only artefacts):
#     • docker/hyperscaler/**          – Hyperscaler-only Docker images
#     • packaging/hyperscaler/**       – Hyperscaler-only packaging
#     • helm/**                        – Helm charts are Hyperscaler-only
#     • operator/**                    – Kubernetes Operator is Hyperscaler-only
#     • deploy/hyperscaler/**          – Hyperscaler-only deploy descriptors
#
#   Allowed paths include:
#     • docker/enterprise/**           – Enterprise Docker images
#     • docker/community/**            – Community Docker images (subset)
#     • packaging/enterprise/**        – Enterprise packaging
#     • deploy/enterprise/**           – Enterprise deploy descriptors
#     • docs/**                        – All documentation
#     • src/**, include/**, cmake/**   – Source code (public)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - enterprise

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-path-gate-enterprise-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  path-gate:
    name: Enterprise-lane path policy
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}" HEAD > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Enforce Enterprise-lane path policy
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          # Blocked path prefixes – Hyperscaler-exclusive artefacts must not land in the
          # Enterprise release lane without an explicit justification.
          BLOCKED_PATTERNS=(
            "docker/hyperscaler/"
            "packaging/hyperscaler/"
            "helm/"
            "operator/"
            "deploy/hyperscaler/"
          )

          VIOLATIONS=()
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            for pattern in "${BLOCKED_PATTERNS[@]}"; do
              if [[ "$file" == ${pattern}* ]]; then
                VIOLATIONS+=("$file  (blocked: ${pattern}*)")
                break
              fi
            done
          done < /tmp/changed_files.txt

          if [[ ${#VIOLATIONS[@]} -gt 0 ]]; then
            echo "::error::PR to 'enterprise' contains Hyperscaler-exclusive artefacts not permitted in the Enterprise release lane."
            echo ""
            echo "Blocked files:"
            for v in "${VIOLATIONS[@]}"; do
              echo "  ❌  $v"
              echo "::error::Blocked path: $v"
            done
            echo ""
            echo "How to fix:"
            echo "  • Remove the Hyperscaler-only artefacts from this PR."
            echo "  • Target the 'hyperscaler' branch for Hyperscaler-only changes."
            {
              echo "GATE_PASSED=false"
              echo "VIOLATION_COUNT=${#VIOLATIONS[@]}"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅  All changed files comply with the Enterprise-lane path policy."
          echo "GATE_PASSED=true" >> "$GITHUB_OUTPUT"
          echo "VIOLATION_COUNT=0" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔒 PR Path Gate — Enterprise release lane" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.gate.outputs.GATE_PASSED }}" == "true" ]]; then
            echo "✅ **PASSED** — No Hyperscaler-exclusive artefacts detected." >> "$GITHUB_STEP_SUMMARY"
          else
            VIOLATIONS="${{ steps.gate.outputs.VIOLATION_COUNT }}"
            echo "❌ **FAILED** — ${VIOLATIONS} blocked file(s) found." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Blocked path prefixes (Hyperscaler-only)" >> "$GITHUB_STEP_SUMMARY"
            echo "| Path prefix | Reason |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`docker/hyperscaler/**\` | Hyperscaler Docker images |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`packaging/hyperscaler/**\` | Hyperscaler packaging |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`helm/**\` | Helm charts (Hyperscaler only) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`operator/**\` | Kubernetes Operator (Hyperscaler only) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`deploy/hyperscaler/**\` | Hyperscaler deploy descriptors |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target branch:** \`enterprise\` (Enterprise/Military release lane)" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR:** #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> See [RELEASE_STRATEGY.md](../../RELEASE_STRATEGY.md) for the full branch model and PR rules." >> "$GITHUB_STEP_SUMMARY"
