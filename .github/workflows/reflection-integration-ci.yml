name: Prompt Engineering – Reflection Integration CI

# Validates ILLMProviderReflectionAdapter, reflection metrics, and the
# PromptEngineeringIntegration facade wiring (Phase 4).
# roadmap:prompt_engineering:v1.6.0:reflection-integration
#
# Acceptance criteria covered:
#   AC-1  to AC-10   ILLMProviderReflectionAdapter — adapter wraps ILLMProvider
#   AC-11 to AC-19   PromptEngineeringMetrics reflection counters
#   AC-20 to AC-21   IntegrationConfig reflection fields
#   AC-22            Adapter works as ReflectionTuner provider
#   AC-23 to AC-28   Heuristic scoring, SelfAwareContext injection, strategy variants

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/prompt_engineering/llm_reflection_adapter.h'
      - 'src/prompt_engineering/llm_reflection_adapter.cpp'
      - 'include/prompt_engineering/prompt_engineering_metrics.h'
      - 'src/prompt_engineering/prompt_engineering_metrics.cpp'
      - 'include/prompt_engineering/prompt_engineering_integration.h'
      - 'src/prompt_engineering/prompt_engineering_integration.cpp'
      - 'include/prompt_engineering/reflection_tuner.h'
      - 'src/prompt_engineering/reflection_tuner.cpp'
      - 'tests/test_reflection_integration.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/reflection-integration-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/llm_reflection_adapter.h'
      - 'src/prompt_engineering/llm_reflection_adapter.cpp'
      - 'include/prompt_engineering/prompt_engineering_metrics.h'
      - 'src/prompt_engineering/prompt_engineering_metrics.cpp'
      - 'include/prompt_engineering/prompt_engineering_integration.h'
      - 'src/prompt_engineering/prompt_engineering_integration.cpp'
      - 'include/prompt_engineering/reflection_tuner.h'
      - 'src/prompt_engineering/reflection_tuner.cpp'
      - 'tests/test_reflection_integration.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/reflection-integration-ci.yml'
  workflow_dispatch:

concurrency:
  group: reflection-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run ReflectionIntegrationFocusedTests.
  # Covers AC-1 through AC-28 (adapter, metrics, facade wiring).
  # ---------------------------------------------------------------------------
  reflection-integration-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ReflectionIntegration (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_reflection_integration_focused

      - name: Run ReflectionIntegrationFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ReflectionIntegrationFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee reflection_integration_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_reflection_integration_focused \
            --gtest_output="xml:reflection_integration_gtest.xml" \
            2>&1 | tee reflection_integration_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-integration-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/reflection_integration_ctest.txt
            build/reflection_integration_gtest.xml
            build/reflection_integration_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔗 Prompt Engineering – Reflection Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1:  ILLMProviderReflectionAdapter — constructs with provider | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2:  generate() — forwards to complete() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3:  critique() — builds critique prompt + calls complete() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4:  revise() — builds revision prompt + calls complete() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5:  score() — heuristic fallback | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6:  score() — delegates to IReflectionScorer when set | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7:  name() — contains wrapped provider name | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8:  strategy change propagates to prompt builder | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9:  null provider does not crash | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: scorer set/clear/has cycle | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-11: recordReflectionCycleStart increments counter | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-12: recordReflectionCycleComplete accumulates iterations | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-13: recordReflectionCycleComplete tracks improved flag | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-14: recordReflectionGuardFired increments counter | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-15: recordReflectionQualityDelta accumulates sum | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-16: exportMetrics() contains all new reflection entries | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-17: snapshotToJson() contains reflection counters | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-18: restoreFromJson() restores reflection counters | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-19: reset() zeroes all reflection counters | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-20: IntegrationConfig reflection_enabled defaults false | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-21: IntegrationConfig toJson/fromJson round-trip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-22: Adapter works as ReflectionTuner provider | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-23: critique injects self-aware header for high-confidence | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-24: negative quality delta accumulated correctly | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-25: heuristic empty response scores 0 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-26: heuristic hallucination marker reduces score | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-27: heuristic structured response scores higher | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-28: REFLEXION strategy yields different critique prompt | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
