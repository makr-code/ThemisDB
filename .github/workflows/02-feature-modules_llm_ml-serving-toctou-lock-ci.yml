name: ML Serving TOCTOU + Lock Fix CI

# Validates the fix for "MLServingEngine::infer() — TOCTOU Session Load +
# Full-Inference Lock" (v1.8.0, Issue #5a / #5b).
# Covers:
#   AC-5a  Double-lock TOCTOU replaced by single shared_ptr capture + release
#   AC-5b  ONNX Run() executes outside sessions_mutex (no global serialisation)
#   AC-5c  sessions map uses shared_ptr<Ort::Session> for safe handle retention
#   AC-5d  Per-model loading mutex serialises same-model loads; other models unblocked
#   AC-5e  ConcurrentInferDifferentModelsNoDeadlock – two threads, two models, no throw
#   AC-5f  ConcurrentInferSameModelNoDeadlock – two threads, same model, no deadlock
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/ml_serving.h'
      - 'src/analytics/ml_serving.cpp'
      - 'tests/analytics/test_ml_serving.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_ml-serving-toctou-lock-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/ml_serving.h'
      - 'src/analytics/ml_serving.cpp'
      - 'tests/analytics/test_ml_serving.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_ml-serving-toctou-lock-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the MlServingFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-5a  getOrLoadSession() acquires shared_lock, captures shared_ptr, releases
  #          before Run() — no TOCTOU window between check and use
  #   AC-5b  sessions_mutex upgraded to shared_mutex; readers never serialised
  #   AC-5c  sessions map stores shared_ptr<Ort::Session> so handle survives eviction
  #   AC-5d  Per-model std::mutex in model_load_mutexes isolates concurrent loads
  #   AC-5e  ConcurrentInferDifferentModelsNoDeadlock passes without throw
  #   AC-5f  ConcurrentInferSameModelNoDeadlock passes without deadlock
  # ---------------------------------------------------------------------------
  ml-serving-toctou-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ML Serving TOCTOU tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_ml_serving_focused

      - name: Run MlServingFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R MlServingFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee ml_serving_toctou_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          timeout 60 ./tests/test_ml_serving_focused \
            --gtest_output="xml:ml_serving_toctou_gtest.xml" \
            2>&1 | tee ml_serving_toctou_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-serving-toctou-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/ml_serving_toctou_ctest.txt
            build/ml_serving_toctou_gtest.xml
            build/ml_serving_toctou_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 ML Serving TOCTOU + Lock Fix – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ML Serving: shared_ptr session map, per-model load mutex, ONNX Run() outside sessions_mutex, concurrent inference no-deadlock." >> "$GITHUB_STEP_SUMMARY"
