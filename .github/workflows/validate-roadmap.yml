name: Validate Roadmap Structure

on:
  pull_request:
    paths:
      - 'roadmap.md'
      - 'ROADMAP.md'
      - '**/roadmap.md'
      - '**/ROADMAP.md'
      - '.github/scripts/validate_roadmap.py'
      - '.github/workflows/validate-roadmap.yml'
  schedule:
    # Weekly check every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-roadmap:
    name: Validate Roadmap Structure
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate all roadmap files
        id: validate
        run: |
          python .github/scripts/validate_roadmap.py --check-all-modules
        continue-on-error: true

      - name: Generate HTML report on failure
        if: steps.validate.outcome == 'failure'
        run: |
          echo "❌ Roadmap validation failed — generating report..."
          python .github/scripts/validate_roadmap.py \
            --check-all-modules \
            --generate-report > /tmp/roadmap_report.html
          cat /tmp/roadmap_report.html

      - name: Upload report artifact
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-validation-report
          path: /tmp/roadmap_report.html
          retention-days: 14

      - name: Fail workflow if validation errors found
        if: steps.validate.outcome == 'failure'
        run: |
          echo "❌ Roadmap validation failed. See uploaded artifact for the HTML report."
          exit 1
