name: Security — Scanning

# Consolidated security scanning workflow.
# Replaces: kubesec.yml, security-dast-ci.yml

on:
  push:
    branches:
      - develop
      - community
    paths:
      - 'deploy/kubernetes/**'
      - 'src/server/**'
      - 'src/auth/**'
      - 'src/governance/**'
      - '.github/workflows/security-scanning.yml'
      - 'scripts/zap-context.xml'
  pull_request:
    branches:
      - develop
      - community
    paths:
      - 'deploy/kubernetes/**'
      - 'src/server/**'
      - 'src/auth/**'
      - 'src/governance/**'
      - '.github/workflows/security-scanning.yml'
  schedule:
    # Weekly Sunday 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: {}

concurrency:
  group: security-scanning-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
# Kubesec — Kubernetes manifest security scan
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  kubesec:
    name: Kubesec — Kubernetes Manifest Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run kubesec scanner
        uses: controlplaneio/kubesec-action@43d0ddff5ffee89a6bb9f29b64cd865411137b14
        with:
          input: deploy/kubernetes/operator/deployment.yaml
          format: sarif
          output: kubesec-results.sarif
          exit-code: "0"

      - name: Upload Kubesec scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kubesec-results.sarif

  # ──────────────────────────────────────────────────────────────────────────
  # OWASP ZAP — Dynamic Application Security Testing (DAST)
  # Phase 4.1: ZAP baseline scan against ThemisDB REST API in Docker.
  # HIGH/CRITICAL findings fail the job; MEDIUM findings are non-blocking.
  # ──────────────────────────────────────────────────────────────────────────
  dast-scan:
    name: OWASP ZAP Baseline DAST
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start ThemisDB (production mode, self-signed TLS)
        run: |
          docker compose -f docker-compose.yml up -d themis
          # Wait for the REST API to become healthy (max 60s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/api/health | grep -q "ok"; then
              echo "ThemisDB is ready"
              break
            fi
            echo "Waiting for ThemisDB... ($i/30)"; sleep 2
          done

      - name: Create ZAP context file
        run: |
          mkdir -p scripts
          if [ ! -f scripts/zap-context.xml ]; then
            cat > scripts/zap-context.xml << 'ZAPXML'
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <configuration>
            <context>
              <name>ThemisDB API</name>
              <desc>ThemisDB REST API security scan context</desc>
              <inscope>true</inscope>
              <incregexes>http://localhost:18080/.*</incregexes>
              <tech>
                <include>Db.CouchDB</include>
              </tech>
              <authentication>
                <type>2</type>
                <loginurl>http://localhost:18080/api/auth/login</loginurl>
                <loginbody>{"username":"test-admin","password":"test-password"}</loginbody>
              </authentication>
            </context>
          </configuration>
          ZAPXML
          fi

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:18080'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: >
            -config scanner.attackStrength=MEDIUM
            -config api.disablekey=true
            -z "-config replacer.full_list(0).description=auth-header
                -config replacer.full_list(0).enabled=true
                -config replacer.full_list(0).matchtype=REQ_HEADER
                -config replacer.full_list(0).matchstr=Authorization
                -config replacer.full_list(0).replacement=Bearer\\ test-token"
          fail_action: true
          allow_issue_writing: true

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report-${{ github.run_id }}
          path: |
            report_html.html
            report_json.json
          retention-days: 90

      - name: Stop ThemisDB container
        if: always()
        run: docker compose -f docker-compose.yml down --volumes
