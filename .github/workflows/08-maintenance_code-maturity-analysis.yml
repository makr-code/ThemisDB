name: Code Maturity Analysis & Auto-Versioning

# Runs on source changes, a daily schedule, and can be triggered manually.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'benchmarks/**'
      - 'projects/**'
      - 'plugins/**'
      - '.github/scripts/analyze_code_maturity.py'
      - '.github/workflows/08-maintenance_code-maturity-analysis.yml'
  schedule:
    - cron: '0 3 * * *'   # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write  # Für automatischen Commit

jobs:
  analyze-and-version:
    name: Code Maturity Analysis & Auto-Versioning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Vollständige Git-Historie für Autor-Tracking

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gitpython pyyaml

      - name: Skip if triggered by bot commit
        id: bot_check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          if [[ "$COMMIT_MSG" == "🤖 Auto-update:"* ]] || [[ "$COMMIT_AUTHOR" == "ThemisDB Version Bot" ]]; then
            echo "Bot commit detected – skipping analysis to prevent infinite loop."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run code maturity analysis
        if: steps.bot_check.outputs.skip != 'true'
        env:
          MATURITY_MAX_HISTORY: '5'
          EXCLUDE_BOT_COMMITS: 'true'
        run: |
          python .github/scripts/analyze_code_maturity.py --root .

      - name: Configure Git bot user
        if: steps.bot_check.outputs.skip != 'true'
        run: |
          git config user.name 'ThemisDB Version Bot'
          git config user.email 'bot@themisdb.local'

      - name: Commit updated files and push safely
        if: steps.bot_check.outputs.skip != 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Auto-update: Code maturity analysis & versioning [skip ci]"
            # Fetch latest changes and rebase before pushing
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 📈 Code Maturity Analysis & Auto-Versioning" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`.github/scripts/analyze_code_maturity.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Skipped (bot commit)** | ${{ steps.bot_check.outputs.skip }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Runs on relevant source changes, daily at 03:00 UTC, or manually. Analyses code maturity and auto-updates version files." >> "$GITHUB_STEP_SUMMARY"
