name: Statistics Collector CI

# Triggered on every push/PR that touches the StatisticsCollector sources,
# test files, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/metadata/statistics_collector.cpp'
      - 'include/metadata/statistics_collector.h'
      - 'tests/test_statistics_collector.cpp'
      - 'tests/test_statistics_auto_refresh.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_observability_statistics-collector-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/metadata/statistics_collector.cpp'
      - 'include/metadata/statistics_collector.h'
      - 'tests/test_statistics_collector.cpp'
      - 'tests/test_statistics_auto_refresh.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_observability_statistics-collector-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the StatisticsCollector focused test suite.
  # Tests cover:
  #   1. Equi-height histogram construction (uniform + skewed distributions)
  #   2. Cardinality estimation (distinct count, NULL ratio, selectivity)
  #   3. Index statistics import, retrieval, and persistence across instances
  #   4. Range selectivity via histogram interpolation
  #   5. JSON serialisation (TableStats, ColumnStats, IndexStats, HistogramBucket)
  #   6. RocksDB persistence (stats survive collector restart)
  #   7. Cache hit / miss semantics
  #   8. clearStats / clearIndexStats with empty-name rejection
  #   9. IMetricsHook callbacks: onCollect/onError/onCacheHit/onCacheMiss
  # ---------------------------------------------------------------------------
  statistics-collector-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Statistics collector tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsnappy-dev liblz4-dev

      - name: Configure (statistics collector test targets)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build StatisticsCollector focused test binary
        run: cmake --build build --target test_statistics_collector_focused -- -j$(nproc)

      - name: Build StatisticsCollector auto-refresh focused test binary
        run: cmake --build build --target test_statistics_auto_refresh_focused -- -j$(nproc)

      - name: Run StatisticsCollector unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex StatisticsCollectorFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee statistics_collector_test_output.txt

      - name: Run StatisticsCollector auto-refresh unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex StatisticsAutoRefreshFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee statistics_auto_refresh_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistics-collector-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/statistics_collector_test_output.txt
            build/statistics_auto_refresh_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📊 Statistics Collector – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "StatisticsCollector: equi-height histograms, cardinality estimation, index stats, auto-refresh thread, metrics hook, RocksDB persistence." >> "$GITHUB_STEP_SUMMARY"
