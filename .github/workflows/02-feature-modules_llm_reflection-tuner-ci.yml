name: Prompt Engineering – Reflection Tuning CI

# Validates ReflectionTuner, DynamicReflectionPromptBuilder,
# ReflectionHallucinationGuard and SelfAwareContext
# (Phase 3: dynamic, self-aware reflection tuning for LLM prompting).
# roadmap:prompt_engineering:v1.5.0:reflection-tuning
#
# Scientific grounding:
#   - Madaan et al. (NeurIPS 2023) "Self-Refine: Iterative Refinement with Self-Feedback"
#   - Shinn et al. (NeurIPS 2023) "Reflexion: Language Agents with Verbal RL"
#   - Bai et al. (Anthropic 2022) "Constitutional AI: Harmlessness from AI Feedback"
#   - Li et al. (2023) "Reflection-Tuning: Recycling Data for Better Instruction Tuning"
#   - Golem.de (2026-03) "Reflection Tuning bei KI: Selbstkritik bis hin zur Halluzination"
#
# Acceptance criteria covered:
#   AC-1   ReflectionConfig — defaults are sane and all fields accessible
#   AC-2   SelfAwareContext::fromResponse — uncertainty / confidence detection
#   AC-3   SelfAwareContext::toJson — serialises all fields correctly
#   AC-4   DynamicReflectionPromptBuilder — all four strategy critique prompts
#   AC-5   DynamicReflectionPromptBuilder — revision prompts include critique text
#   AC-6   DynamicReflectionPromptBuilder — constitutional critique lists principles
#   AC-7   DynamicReflectionPromptBuilder — Socratic prompt cycles through questions
#   AC-8   DynamicReflectionPromptBuilder — self-aware context header injection
#   AC-9   ReflectionHallucinationGuard — detectHallucinationSignals on known markers
#   AC-10  ReflectionHallucinationGuard — isDiverging trajectory detection
#   AC-11  ReflectionHallucinationGuard — shouldHalt combines both checks
#   AC-12  ReflectionTuner — fallback mode (no provider) completes without crash
#   AC-13  ReflectionTuner — quality_trajectory has initial + per-step entries
#   AC-14  ReflectionTuner — halted_by_hallucination_guard set when guard fires
#   AC-15  ReflectionTuner — converged set when score >= convergence_threshold
#   AC-16  ReflectionTuner — converged set on plateau (delta < min_delta)
#   AC-17  ReflectionTuner — max_iterations respected
#   AC-18  ReflectionTuner — mock provider: critique / revise / score all called
#   AC-19  ReflectionTuner — setConfig replaces strategy and guard thresholds
#   AC-20  ReflectionResult::toJson — serialises all required fields

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/prompt_engineering/reflection_tuner.h'
      - 'src/prompt_engineering/reflection_tuner.cpp'
      - 'tests/test_reflection_tuner.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_reflection-tuner-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/reflection_tuner.h'
      - 'src/prompt_engineering/reflection_tuner.cpp'
      - 'tests/test_reflection_tuner.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_reflection-tuner-ci.yml'
  workflow_dispatch:

concurrency:
  group: reflection-tuner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run ReflectionTunerFocusedTests.
  # Covers AC-1 through AC-20 (correctness and guard tests).
  # ---------------------------------------------------------------------------
  reflection-tuner-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ReflectionTuner (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_reflection_tuner_focused

      - name: Run ReflectionTunerFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ReflectionTunerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee reflection_tuner_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_reflection_tuner_focused \
            --gtest_output="xml:reflection_tuner_gtest.xml" \
            2>&1 | tee reflection_tuner_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-tuner-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/reflection_tuner_ctest.txt
            build/reflection_tuner_gtest.xml
            build/reflection_tuner_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🪞 Prompt Engineering – Reflection Tuning" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1:  ReflectionConfig — defaults sane and accessible | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2:  SelfAwareContext::fromResponse — uncertainty/confidence | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3:  SelfAwareContext::toJson — all fields serialised | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4:  DynamicReflectionPromptBuilder — all four strategy critiques | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5:  DynamicReflectionPromptBuilder — revision includes critique text | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6:  DynamicReflectionPromptBuilder — constitutional lists principles | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7:  DynamicReflectionPromptBuilder — Socratic cycles questions | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8:  DynamicReflectionPromptBuilder — self-aware context header | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9:  ReflectionHallucinationGuard — detectHallucinationSignals | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: ReflectionHallucinationGuard — isDiverging trajectory | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-11: ReflectionHallucinationGuard — shouldHalt combined | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-12: ReflectionTuner — fallback mode no crash | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-13: ReflectionTuner — quality_trajectory correctness | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-14: ReflectionTuner — halted_by_hallucination_guard set | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-15: ReflectionTuner — converged on quality threshold | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-16: ReflectionTuner — converged on plateau | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-17: ReflectionTuner — max_iterations respected | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-18: ReflectionTuner — mock provider critique/revise/score | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-19: ReflectionTuner — setConfig updates strategy + guard | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-20: ReflectionResult::toJson — all required fields | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
