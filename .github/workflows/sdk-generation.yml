name: OpenAPI SDK Generation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'openapi/openapi.yaml'
      - 'scripts/generate-sdks.sh'
  pull_request:
    paths:
      - 'openapi/openapi.yaml'
      - 'scripts/generate-sdks.sh'
  workflow_dispatch:

# Default: read-only; the commit job overrides to contents:write
permissions:
  contents: read

jobs:
  validate-spec:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate OpenAPI specification
        uses: docker://openapitools/openapi-generator-cli:v7.10.0
        with:
          args: validate -i /github/workspace/openapi/openapi.yaml

  generate-python-sdk:
    name: Generate Python SDK
    runs-on: ubuntu-latest
    needs: validate-spec
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate Python SDK
        uses: docker://openapitools/openapi-generator-cli:v7.10.0
        with:
          args: >-
            generate
            -i /github/workspace/openapi/openapi.yaml
            -g python
            -o /github/workspace/openapi/generated/python
            --package-name themisdb_client
            --additional-properties=packageName=themisdb_client,projectName=themisdb-client,packageVersion=0.1.0,library=urllib3
            --git-repo-id=ThemisDB
            --git-user-id=makr-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Smoke-test Python SDK import
        run: |
          pip install -e openapi/generated/python/ --quiet
          python -c "import themisdb_client; print('Python SDK: import OK')"

      - name: Upload Python SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-python
          path: openapi/generated/python/
          retention-days: 30

  generate-javascript-sdk:
    name: Generate JavaScript/TypeScript SDK
    runs-on: ubuntu-latest
    needs: validate-spec
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate JavaScript/TypeScript SDK
        uses: docker://openapitools/openapi-generator-cli:v7.10.0
        with:
          args: >-
            generate
            -i /github/workspace/openapi/openapi.yaml
            -g typescript-fetch
            -o /github/workspace/openapi/generated/javascript
            --additional-properties=npmName=@themisdb/openapi-client,npmVersion=0.1.0,supportsES6=true,withInterfaces=true
            --git-repo-id=ThemisDB
            --git-user-id=makr-code

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build JavaScript SDK
        working-directory: openapi/generated/javascript
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Upload JavaScript SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-javascript
          path: openapi/generated/javascript/
          retention-days: 30

  generate-go-sdk:
    name: Generate Go SDK
    runs-on: ubuntu-latest
    needs: validate-spec
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate Go SDK
        uses: docker://openapitools/openapi-generator-cli:v7.10.0
        with:
          args: >-
            generate
            -i /github/workspace/openapi/openapi.yaml
            -g go
            -o /github/workspace/openapi/generated/go
            --additional-properties=packageName=themisdbclient,moduleName=github.com/makr-code/ThemisDB/openapi/generated/go,packageVersion=0.1.0,withGoMod=true
            --git-repo-id=ThemisDB
            --git-user-id=makr-code

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go SDK
        working-directory: openapi/generated/go
        run: |
          go mod tidy
          go build ./...

      - name: Upload Go SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-go
          path: openapi/generated/go/
          retention-days: 30

  commit-generated-sdks:
    name: Commit Generated SDKs
    runs-on: ubuntu-latest
    needs:
      - generate-python-sdk
      - generate-javascript-sdk
      - generate-go-sdk
    # Only commit on push to main/develop (not on PRs)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all generated SDKs
        uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          merge-multiple: false
          path: /tmp/sdk-artifacts/

      - name: Place SDKs in repository
        run: |
          mkdir -p openapi/generated/python openapi/generated/javascript openapi/generated/go
          cp -r /tmp/sdk-artifacts/sdk-python/. openapi/generated/python/
          cp -r /tmp/sdk-artifacts/sdk-javascript/. openapi/generated/javascript/
          cp -r /tmp/sdk-artifacts/sdk-go/. openapi/generated/go/

      - name: Commit and push generated SDKs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(sdk): regenerate OpenAPI client SDKs [skip ci]"
          file_pattern: "openapi/generated/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

