name: IncrementalView Micro-Batch Lock CI

# Validates the fix for "IncrementalView::applyChanges() — Exclusive Lock for Entire Batch"
# (v1.8.0, Issue analytics-6).
# Covers:
#   AC-IVM-1  applyChanges() processes changes in micro-batches of ≤ 256 rows with yield
#   AC-IVM-2  passesBaseFilters() pre-computed outside the write lock
#   AC-IVM-3  Reader P99 ≤ 10 ms during 10 000-row batch apply (opt-in perf test)
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/incremental_view.h'
      - 'src/analytics/incremental_view.cpp'
      - 'tests/analytics/test_incremental_view.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/incremental-view-micro-batch-lock-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/incremental_view.h'
      - 'src/analytics/incremental_view.cpp'
      - 'tests/analytics/test_incremental_view.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/incremental-view-micro-batch-lock-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the IncrementalViewFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-IVM-1  applyChanges() holds unique_lock for ≤ 256 rows per acquisition;
  #             yields between batches so concurrent query() callers can proceed
  #   AC-IVM-2  passesBaseFilters() evaluated lock-free (reads only immutable def_)
  #   AC-IVM-3  Perf test gated by THEMIS_RUN_PERF_TESTS=1 — skipped in CI baseline
  # ---------------------------------------------------------------------------
  ivm-micro-batch-lock-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: IVM micro-batch lock tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_incremental_view_focused

      - name: Run IncrementalViewFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R IncrementalViewFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee ivm_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_incremental_view_focused \
            --gtest_output="xml:ivm_gtest.xml" \
            2>&1 | tee ivm_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ivm-micro-batch-lock-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/ivm_ctest.txt
            build/ivm_gtest.xml
            build/ivm_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 IncrementalView Micro-Batch Lock – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "IVM: micro-batch lock release (≤256 rows/batch), passesBaseFilters() outside write lock, reader P99 ≤ 10 ms perf test." >> "$GITHUB_STEP_SUMMARY"
