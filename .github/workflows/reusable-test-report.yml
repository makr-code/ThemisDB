name: Reusable Test Report Publisher

# Reusable workflow for publishing test reports across all CI workflows
# Supports JUnit XML, coverage reports, and flaky test detection
# Uses dorny/test-reporter for visualization in PRs

on:
  workflow_call:
    inputs:
      test-results-path:
        description: 'Path to JUnit XML test results files (glob pattern)'
        required: true
        type: string
      report-name:
        description: 'Name for the test report (will appear in PR)'
        required: true
        type: string
      coverage-path:
        description: 'Path to coverage report files (optional)'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Working directory for test execution'
        required: false
        type: string
        default: '.'
      fail-on-error:
        description: 'Whether to fail the workflow if tests fail'
        required: false
        type: boolean
        default: true
      create-issue-on-failure:
        description: 'Create GitHub issue on test failure'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: true
      
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ${{ inputs.report-name }}
          path: ${{ inputs.test-results-path }}
          reporter: java-junit
          fail-on-error: ${{ inputs.fail-on-error }}
          working-directory: ${{ inputs.working-directory }}
          max-annotations: 50
      
      - name: Publish Coverage Report (if available)
        if: inputs.coverage-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ inputs.report-name }}
          path: ${{ inputs.coverage-path }}
          retention-days: 30
      
      - name: Create Issue on Test Failure
        if: failure() && inputs.create-issue-on-failure && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read test results to get failure details
            let failureDetails = 'Test failures detected in workflow run.';
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Test Failure: ${{ inputs.report-name }} on ${context.ref}`,
              body: `## Test Failure Report
              
              **Workflow:** ${{ inputs.report-name }}
              **Branch:** ${context.ref}
              **Commit:** ${context.sha}
              **Run URL:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
              
              ### Failure Details
              
              ${failureDetails}
              
              ### Action Required
              
              Please investigate the test failures and fix the issues.
              
              ---
              *This issue was automatically created by the CI system.*`,
              labels: ['test-failure', 'ci', 'automated']
            });
            
            core.info(`Created issue #${issue.data.number}`);
      
      - name: Comment on PR with Test Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let summary = `## 📊 Test Report: ${{ inputs.report-name }}\n\n`;
            summary += `**Workflow Run:** [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n`;
            summary += `View detailed test results in the Checks tab above.\n`;
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
