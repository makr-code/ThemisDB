name: Geo Module CI

# Triggered on every push / PR that touches any geo module source,
# header, test, or this workflow itself.
# Covers all focused geo test targets (v2.2.0).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/geo/**'
      - 'src/geo/**'
      - 'tests/geo/**'
      - 'include/utils/geo/**'
      - 'src/utils/geo/**'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_geo-module-ci.yml'
  workflow_dispatch:

concurrency:
  group: geo-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the complete geo module focused test suite.
  #
  # Covered test targets (CPU-only; CUDA/HIP tests require hardware runners):
  #   GeoRtreeFocusedTests           — R-tree insert, NN, range query, bulk load
  #   GeoClusteringFocusedTests      — DBSCAN and k-means clustering
  #   GeoRasterFocusedTests          — elevation sampling, bbox, Gaussian KDE
  #   TemporalSpatialQueryFocusedTests — location-at-time-T queries
  #   GeoTileServerFocusedTests      — tile request handling, MVT encoding
  #   GeoSpatialJoinFocusedTests     — point-pair distance threshold join
  #   GeoDeviceDetectorFocusedTests  — GPU discovery, compute-capability check
  #   GeoEwkbFocusedTests            — WKB/EWKB encode/decode round-trips
  #   GeoPrecisionModeFocusedTests   — precision mode enum + factory
  #   GeoStBufferFocusedTests        — ST_BUFFER CPU and Boost backends
  #   GeoStUnionDifferenceFocusedTests — ST_UNION and ST_DIFFERENCE
  #   RtreeCpuIntegrationFocusedTests — R-tree CPU backend end-to-end
  #   SpatialIndexFocusedTests       — S2/H3 cell index consistency
  #   AqlStFunctionsFocusedTests     — AQL ST_DISTANCE / ST_CONTAINS / ST_BUFFER
  #   AqlStQueryengineFocusedTests   — full AQL query with spatial predicates
  #   Geo3dFunctionsFocusedTests     — 3D containment, distance, intersection
  #   GeoWgs84SphericalFocusedTests  — WGS-84 geodesic distance (Vincenty)
  #   GpuBackendProductionFocusedTests — GPU backend dispatch + CPU fallback
  #   GpuKernelDispatcherFocusedTests — kernel dispatch table + CPU path
  # ---------------------------------------------------------------------------
  geo-module-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Geo Module tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev
            libspdlog-dev nlohmann-json3-dev libgeos-dev libproj-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Core spatial index and backend tests ──────────────────────────────
      - name: Run GeoRtreeFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoRtreeFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_rtree_results.txt

      - name: Run GeoEwkbFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoEwkbFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_ewkb_results.txt

      - name: Run GeoPrecisionModeFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoPrecisionModeFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_precision_results.txt

      # ── Geometry operations ───────────────────────────────────────────────
      - name: Run GeoStBufferFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoStBufferFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_st_buffer_results.txt

      - name: Run GeoStUnionDifferenceFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoStUnionDifferenceFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_st_union_diff_results.txt

      - name: Run Geo3dFunctionsFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R Geo3dFunctionsFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_3d_results.txt

      - name: Run GeoWgs84SphericalFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoWgs84SphericalFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_wgs84_results.txt

      # ── Spatial join and index integration ───────────────────────────────
      - name: Run GeoSpatialJoinFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoSpatialJoinFocusedTests \
                --output-on-failure --timeout 120 \
                2>&1 | tee geo_spatial_join_results.txt

      - name: Run RtreeCpuIntegrationFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R RtreeCpuIntegrationFocusedTests \
                --output-on-failure --timeout 120 \
                2>&1 | tee geo_rtree_cpu_integration_results.txt

      - name: Run SpatialIndexFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R SpatialIndexFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_spatial_index_results.txt

      # ── Clustering ────────────────────────────────────────────────────────
      - name: Run GeoClusteringFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoClusteringFocusedTests \
                --output-on-failure --timeout 120 \
                2>&1 | tee geo_clustering_results.txt

      # ── Raster, tile server, temporal-spatial ────────────────────────────
      - name: Run GeoRasterFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoRasterFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_raster_results.txt

      - name: Run GeoTileServerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoTileServerFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_tile_server_results.txt

      - name: Run TemporalSpatialQueryFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R TemporalSpatialQueryFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_temporal_spatial_results.txt

      # ── Device detection ─────────────────────────────────────────────────
      - name: Run GeoDeviceDetectorFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoDeviceDetectorFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_device_detector_results.txt

      # ── GPU backend (CPU-fallback mode, no hardware required) ────────────
      - name: Run GpuBackendProductionFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GpuBackendProductionFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_gpu_backend_production_results.txt

      - name: Run GpuKernelDispatcherFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GpuKernelDispatcherFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_gpu_kernel_dispatcher_results.txt

      # ── AQL geo function integration ─────────────────────────────────────
      - name: Run AqlStFunctionsFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R AqlStFunctionsFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_aql_st_functions_results.txt

      - name: Run AqlStQueryengineFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R AqlStQueryengineFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee geo_aql_st_queryengine_results.txt

      # ── Upload all results ────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-module-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/geo_rtree_results.txt
            build/geo_ewkb_results.txt
            build/geo_precision_results.txt
            build/geo_st_buffer_results.txt
            build/geo_st_union_diff_results.txt
            build/geo_3d_results.txt
            build/geo_wgs84_results.txt
            build/geo_spatial_join_results.txt
            build/geo_rtree_cpu_integration_results.txt
            build/geo_spatial_index_results.txt
            build/geo_clustering_results.txt
            build/geo_raster_results.txt
            build/geo_tile_server_results.txt
            build/geo_temporal_spatial_results.txt
            build/geo_device_detector_results.txt
            build/geo_gpu_backend_production_results.txt
            build/geo_gpu_kernel_dispatcher_results.txt
            build/geo_aql_st_functions_results.txt
            build/geo_aql_st_queryengine_results.txt
          retention-days: 30
