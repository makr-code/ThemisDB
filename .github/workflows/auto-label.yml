name: Auto Label

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  auto-label:
    runs-on: ubuntu-latest
    # pull_request_target is intentionally used so that GITHUB_TOKEN has
    # pull-requests:write access even for fork PRs.
    # This is safe because the workflow does NOT check out or execute any
    # code from the PR branch — actions/labeler only reads the changed-file
    # list via the GitHub API and writes labels to the PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label based on changed files
        uses: actions/labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
