name: Perf-Coverage Top-10 Measures Audit (§1.4)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'PERFORMANCE_EXPECTATIONS.md'
      - 'benchmarks/**'
      - 'tools/perf_coverage_top10_audit.py'
      - '.github/workflows/perf-coverage-top10-audit.yml'
  push:
    branches:
      - develop
      - main
    paths:
      - 'PERFORMANCE_EXPECTATIONS.md'
      - 'benchmarks/**'
      - 'tools/perf_coverage_top10_audit.py'
  schedule:
    - cron: '0 4 * * *'  # Nightly at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  top10-audit:
    name: §1.4 Top-10 Coverage Measures Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run §1.4 Top-10 coverage audit
        id: audit
        run: |
          python3 tools/perf_coverage_top10_audit.py \
            --repo-root . \
            --perf-doc PERFORMANCE_EXPECTATIONS.md \
            --output-dir artifacts/perf_coverage_top10_audit \
            --format both \
            --no-color
        # Exit code 0 = PASS or WARN-only; exit code 1 = at least one FAIL

      - name: Upload audit artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-coverage-top10-audit-${{ github.run_id }}
          path: artifacts/perf_coverage_top10_audit/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          REPORT="artifacts/perf_coverage_top10_audit/report.md"
          echo "## 📋 Performance Coverage Top-10 Measures Audit (§1.4)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT" ]; then
            echo "### Audit Report" >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Report not generated._" >> "$GITHUB_STEP_SUMMARY"
          fi
