name: CI — PR Gates (Wave C) — Private/Public Plugin Boundary Enforcement

# Enforces private/public plugin boundary compliance.
# Blocks private plugin source leakage to community builds.
# Validates plugin manifest visibility and edition allowlist fields.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'plugins/**'
      - 'src/plugins/**'
      - '.gitmodules'
      - '.github/workflows/09-pr-gates_private-plugin-boundary-enforcement.yml'
  push:
    branches: [develop]
    paths:
      - 'plugins/**'
      - 'src/plugins/**'
      - '.gitmodules'
  workflow_dispatch:

concurrency:
  group: private-plugin-boundary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:

  private-plugin-boundary-check:
    name: Private Plugin Boundary Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for private plugin leakage to community builds
        run: |
          set -euo pipefail
          
          BASE_REF="${{ github.base_ref || 'develop' }}"
          git fetch origin "${BASE_REF}" --depth=1
          
          # Detect changes to private plugin paths
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" || echo "")
          
          PRIVATE_PLUGIN_CHANGED=false
          PRIVATE_PLUGIN_FILES=""
          
          while IFS= read -r file; do
            if [[ "$file" =~ ^plugins/private/ ]]; then
              PRIVATE_PLUGIN_CHANGED=true
              PRIVATE_PLUGIN_FILES="$PRIVATE_PLUGIN_FILES
  - $file"
            fi
          done <<< "$CHANGED_FILES"
          
          # If private plugins touched, enforce edge cases.
          if [ "$PRIVATE_PLUGIN_CHANGED" = "true" ]; then
            echo "::notice::Private plugin files detected in PR:$PRIVATE_PLUGIN_FILES"
            
            # Only community and minimal builds should fail on private plugin inclusion.
            TARGET_BRANCH="${{ github.base_ref || 'develop' }}"
            
            if [[ "$TARGET_BRANCH" == "community" ]] || [[ "$TARGET_BRANCH" == "minimal" ]]; then
              echo "::error::Private plugin changes not allowed on community/minimal branches"
              exit 1
            fi
          fi
          
          echo "✓ Private plugin boundary check passed"

      - name: Validate plugin manifest visibility fields
        run: |
          set -euo pipefail
          
          # Check for plugin manifest files (plugin.toml, plugin.json, etc.)
          MANIFEST_FILES=$(find plugins -name "plugin.toml" -o -name "plugin.json" -o -name "plugin.yaml" 2>/dev/null || echo "")
          
          INVALID_MANIFESTS=0
          
          while IFS= read -r manifest_file; do
            [ -z "$manifest_file" ] && continue
            
            # Check if file contains visibility field.
            if ! grep -q "visibility" "$manifest_file"; then
              echo "::warning::Missing 'visibility' field in $manifest_file"
              ((INVALID_MANIFESTS++)) || true
            fi
            
            # Check if private plugins have visibility set to 'private'.
            if [[ "$manifest_file" =~ ^plugins/private/ ]]; then
              if grep -q 'visibility.*=.*"public"' "$manifest_file"; then
                echo "::error::Private plugin $manifest_file has public visibility!"
                ((INVALID_MANIFESTS++)) || true
              fi
            fi
          done <<< "$MANIFEST_FILES"
          
          if [ $INVALID_MANIFESTS -gt 0 ]; then
            echo "::error::$INVALID_MANIFESTS manifest file(s) failed validation"
            exit 1
          fi
          
          echo "✓ Plugin manifest visibility validation passed"

      - name: Validate submodule commit pins (no branch refs for private)
        run: |
          set -euo pipefail
          
          if [ ! -f .gitmodules ]; then
            echo "✓ No .gitmodules file (skipping submodule validation)"
            exit 0
          fi
          
          INVALID_REFS=0
          
          # Parse .gitmodules and check for private submodules using branch refs.
          while IFS= read -r line; do
            if [[ "$line" =~ ^\[submodule ]]; then
              # Extract submodule name.
              SUBMOD_NAME=$(echo "$line" | sed 's/\[submodule "\([^"]*\)"\]/\1/')
              
              # Check if this is a private submodule.
              if [[ "$SUBMOD_NAME" =~ private ]]; then
                # Private submodules MUST use commit SHAs, not branch references.
                if grep -A 5 "^\[submodule \"$SUBMOD_NAME\"\]" .gitmodules | grep -q "branch = "; then
                  echo "::error::Private submodule $SUBMOD_NAME uses branch ref instead of commit SHA"
                  ((INVALID_REFS++)) || true
                fi
              fi
            fi
          done < .gitmodules
          
          if [ $INVALID_REFS -gt 0 ]; then
            echo "::error::$INVALID_REFS submodule(s) failed commit-pin validation"
            exit 1
          fi
          
          echo "✓ Submodule commit-pin validation passed"

      - name: Post boundary check result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const conclusion = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const msg = conclusion === 'success'
              ? '✅ Private/public plugin boundary check PASSED'
              : '❌ Private/public plugin boundary check FAILED';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Wave C Policy Gate: Private Plugin Boundary
            
${msg}
            
- ✅ Private plugin leakage detection
- ✅ Plugin manifest visibility validation
- ✅ Submodule commit-pin enforcement (no branch refs for private)
            
See \`.github/workflows/09-pr-gates_private-plugin-boundary-enforcement.yml\` for details.`
            });
