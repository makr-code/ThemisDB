name: Config File Watcher CI

# Triggered on every push/PR that touches the ConfigFileWatcher sources,
# hot-reload test files, or this workflow itself.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/config/config_file_watcher.h'
      - 'src/config/config_file_watcher.cpp'
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'tests/test_config_file_watcher.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_config_config-file-watcher-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ConfigFileWatcher focused test suite.
  # Tests cover:
  #   1. ConfigFileWatcher lifecycle (start/stop, idempotency, destructor join)
  #   2. inotify (Linux) / kqueue (macOS) event detection for .yaml/.json files
  #   3. Non-config file changes are ignored
  #   4. 200 ms debounce collapses bursts of FS events into ≤ a small number
  #      of callbacks
  #   5. ConfigPathResolver::startHotReload() / stopHotReload() public API
  #   6. File change triggers LRU cache flush via ConfigPathResolver
  # ---------------------------------------------------------------------------
  config-file-watcher-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Config file watcher tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsnappy-dev liblz4-dev

      - name: Configure (config file watcher test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build ConfigFileWatcher focused test binary
        run: cmake --build build --target test_config_file_watcher_focused -- -j$(nproc)

      - name: Run ConfigFileWatcher focused unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex ConfigFileWatcherFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee config_file_watcher_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-file-watcher-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/config_file_watcher_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔥 Config File Watcher – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ConfigFileWatcher: inotify (Linux) / kqueue (macOS) / ReadDirectoryChangesW (Windows) file-system watch, 200ms debounce, startHotReload()/stopHotReload() API." >> "$GITHUB_STEP_SUMMARY"
