name: LLM CPU Fallback CI

# CI job that validates the LLM kernel fusion CPU fallback path.
# Runs on every PR/push that touches LLM source or tests, ensuring
# that kernel_fusion CPU paths do not regress.
#
# No GPU hardware is required — all tests exercise the CPU fallback branch.
#
# See: docs/llm_roadmap.md — Q3 CI checklist

on:
  pull_request:
    paths:
      - 'src/llm/kernel_fusion.cpp'
      - 'src/llm/kernel_fusion.cu'
      - 'include/llm/kernel_fusion.h'
      - 'include/llm/kernel_fusion_cuda.h'
      - 'tests/llm/test_kernel_fusion_cpu_fallback.cpp'
      - '.github/workflows/llm-cpu-fallback-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/llm/kernel_fusion.cpp'
      - 'src/llm/kernel_fusion.cu'
      - 'include/llm/kernel_fusion.h'
      - 'include/llm/kernel_fusion_cuda.h'
      - 'tests/llm/test_kernel_fusion_cpu_fallback.cpp'
      - '.github/workflows/llm-cpu-fallback-ci.yml'
  workflow_dispatch:

jobs:
  llm-cpu-fallback:
    name: LLM Kernel Fusion (CPU Fallback)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgtest-dev \
            pkg-config

      - name: Configure CMake (CPU only, LLM enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_ENABLE_LLM=ON \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_TEST_FILTER=test_kernel_fusion_cpu_fallback

      - name: Build kernel fusion CPU fallback test
        run: cmake --build build --target themisdb_tests -j$(nproc)

      - name: Run kernel fusion CPU fallback tests
        run: |
          cd build
          ctest --output-on-failure -R "KernelFusionCPUFallback"
