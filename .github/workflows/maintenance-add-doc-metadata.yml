name: "[Manual] Add Documentation Metadata"

# ---------------------------------------------------------------------------
# ROOT-LEVEL TRIGGER
# ------------------
# This file exists at the root of .github/workflows/ so that it appears in
# the GitHub Web UI and GitHub App under the Actions tab.
#
# GitHub only shows workflow_dispatch triggers for workflows directly in
# .github/workflows/. The real implementation lives in:
#   .github/workflows/08-maintenance_add-doc-metadata.yml
#
# ALTERNATIVE: GitHub CLI
#   gh workflow run "08-maintenance/add-doc-metadata.yml" \
#     --repo makr-code/ThemisDB --ref main --field dry_run=false
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ref:
        description: "Branch, tag, or SHA to run on (default: main)"
        required: false
        default: "main"
        type: string

permissions:
  actions: write

jobs:
  trigger:
    name: "Trigger › 08-maintenance/add-doc-metadata.yml"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "08-maintenance/add-doc-metadata.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ inputs.ref }}" \
            --field "dry_run=${{ inputs.dry_run }}"

          echo "✅ Dispatched 08-maintenance/add-doc-metadata.yml"
          echo "   dry_run : ${{ inputs.dry_run }}"
          echo "   ref     : ${{ inputs.ref }}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 📝 [Manual] Add Documentation Metadata" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | \`${{ inputs.dry_run }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target workflow** | \`08-maintenance/add-doc-metadata.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
