name: ConfigEncryptedStore Lock Upgrade CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/config/config_encrypted_store.h'
      - 'src/config/config_encrypted_store.cpp'
      - 'tests/test_config_encrypted_store.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/config-encrypted-store-lock-upgrade-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/config/config_encrypted_store.h'
      - 'src/config/config_encrypted_store.cpp'
      - 'tests/test_config_encrypted_store.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/config-encrypted-store-lock-upgrade-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  config-encrypted-store-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ConfigEncryptedStore tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsnappy-dev liblz4-dev

      - name: Configure (ConfigEncryptedStore test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build ConfigEncryptedStore focused test binary
        run: cmake --build build --target test_config_encrypted_store_focused -- -j$(nproc)

      - name: Run ConfigEncryptedStore focused unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex ConfigEncryptedStoreFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee config_encrypted_store_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-encrypted-store-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/config_encrypted_store_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 ConfigEncryptedStore Lock Upgrade – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ConfigEncryptedStore: std::shared_mutex read-path lock upgrade. Read methods (get/tryGet/contains/keys/size/currentKeyVersion/serialize) use std::shared_lock; write methods (set/remove/clear/rotateKey/deserialize) use std::unique_lock." >> "$GITHUB_STEP_SUMMARY"
