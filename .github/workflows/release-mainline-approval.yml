name: "Release: GitHub Release Approval Gate"

# Publishes the final GitHub Release when a maintainer approves
# via issue comment on the GitHub Release tracking issue.
#
# Approval keywords: /publish-release, /approve-release, @publish-release
#
# Flow:
#   1. release-build-matrix.yml completes build + test + sign all artifacts
#   2. Staging release is created (draft=true, not visible to users)
#   3. Automatic tracking issue is created with release metrics and artifact checksums
#   4. Maintainer reviews release quality, changelog, and signing certificates
#   5. Posts approval comment: "/publish-release"
#   6. This workflow (release-mainline-approval.yml) reacts and publishes release
#   7. Sets draft=false, making release publicly visible
#   8. Closes the tracking issue
#
# Rationale:
#   - Human-controlled: maintainer decides when/if to publish to users
#   - Quality gate: allows last-minute verification before public release
#   - Tracking: every release has a persistent audit trail
#   - Reversible: can defer or cancel release if issues arise
#   - Safe default: release-mainline.yml creates draft release, not visible to users
#   - Prevents accidental public releases: requires explicit maintainer approval
#
# Security:
#   - Only maintainers (admin/maintain role) can approve
#   - Validates release tag before publishing
#   - Preserves all artifact signatures and checksums
#   - Records approver identity for audit trail

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: write

concurrency:
  group: release-publish-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [release_publish_from_issue]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Maintainer-approved GitHub release publication"
          job-results: ${{ toJSON(needs) }}

  release_publish_from_issue:
    name: "Publish: GitHub Release on Approval Comment"
    if: |
      contains(github.event.issue.labels.*.name, 'release-review') &&
      (
        contains(github.event.comment.body, '/publish-release') ||
        contains(github.event.comment.body, '/approve-release') ||
        contains(github.event.comment.body, '@publish-release') ||
        contains(github.event.comment.body, '/hold-release') ||
        contains(github.event.comment.body, '/pause-release') ||
        contains(github.event.comment.body, '/reject-release') ||
        contains(github.event.comment.body, '/cancel-release') ||
        contains(github.event.comment.body, '/rollback-release')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Verify commenter is a maintainer
        id: check_maintainer
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const comment = context.payload.comment;
            const body = (comment.body || '').trim();
            const user = comment.user.login;
            const holdCommand = /\/hold-release\b|\/pause-release\b/i.test(body);
            const rejectCommand = /\/reject-release\b|\/cancel-release\b/i.test(body);
            const rollbackCommand = /\/rollback-release\b/i.test(body);
            
            try {
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: user,
              });
              
              if (!['admin', 'maintain'].includes(permission.permission)) {
                const bodyText = (context.payload.comment.body || '').trim();
                if (/\/hold-release\b|\/pause-release\b|\/reject-release\b|\/cancel-release\b|\/rollback-release\b/i.test(bodyText)) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.issue.number,
                    body: `⛔ **Release Command Ignored**\n\n**Requested By:** @${user}\n**Status:** Only repo admins and maintainers may issue hold/reject/rollback commands. This command was not processed because the commenter does not have the required permissions.`
                  });
                }
                core.setFailed(`User ${user} does not have maintainer permissions`);
                return;
              }
               
              if (holdCommand || rejectCommand || rollbackCommand) {
                core.info(`Human-in-the-loop command detected by ${user}: hold/reject/rollback path`);
                core.setOutput('is_maintainer', 'true');
                core.setOutput('status', holdCommand ? 'hold' : rejectCommand ? 'reject' : 'rollback');
                return;
              }
              
              core.info(`✓ User ${user} has ${permission.permission} permission`);
              core.setOutput('is_maintainer', 'true');
              core.setOutput('status', 'approve');
            } catch (error) {
              core.setFailed(`Failed to check permissions: ${error.message}`);
            }

      - name: Handle hold/reject/rollback requests
        if: steps.check_maintainer.outputs.is_maintainer == 'true' && steps.check_maintainer.outputs.status != 'approve'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const issue = context.payload.issue;
            const user = context.payload.comment.user.login;
            const status = '${{ steps.check_maintainer.outputs.status }}';
            const body = {
              hold: `⏸️ **Release Hold Requested**\n\n**Requested By:** @${user}\n**Status:** The release is paused pending human review.\n**Next Step:** Investigate the blocker, fix the issue, then re-run approval with a fresh /publish-release or /approve-release comment.`,
              reject: `⛔ **Release Rejected**\n\n**Rejected By:** @${user}\n**Status:** The release is not approved for publication.\n**Next Step:** Correct the blocker, keep the issue open, and re-request approval after remediation.`,
              rollback: `↩️ **Rollback Requested**\n\n**Requested By:** @${user}\n**Status:** A rollback or hold is required before the release can proceed.\n**Next Step:** Use the release rollback workflow and document the reason in the issue before retrying publication.`
            }[status];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
            core.notice(`Human review status recorded: ${status}`);

      - name: React to approval comment
        if: steps.check_maintainer.outputs.is_maintainer == 'true' && steps.check_maintainer.outputs.status == 'approve'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1',
            });

      - name: Extract version from issue body
        id: extract_version
        if: steps.check_maintainer.outputs.is_maintainer == 'true' && steps.check_maintainer.outputs.status == 'approve'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const issueBody = context.payload.issue.body;
            // Match "## Release Version: X.Y.Z"
            const versionMatch = issueBody.match(/##\s+Release Version:\s+v?(\d+\.\d+\.\d+)/);
            if (versionMatch) {
              const version = versionMatch[1];
              core.setOutput('version', version);
              core.info(`✓ Extracted version: ${version}`);
            } else {
              core.setFailed('Could not extract version from issue body');
            }

      - name: Checkout repository
        if: steps.check_maintainer.outputs.is_maintainer == 'true' && steps.check_maintainer.outputs.status == 'approve' && steps.extract_version.outputs.version != ''
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch release draft
        id: fetch_release
        if: steps.check_maintainer.outputs.is_maintainer == 'true' && steps.check_maintainer.outputs.status == 'approve' && steps.extract_version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          
          # Get release by tag
          RELEASE_JSON=$(gh release view "$TAG" --repo "${{ github.repository }}" --json id,isDraft,tagName,name,body --jq '@json')
          
          if [ -z "$RELEASE_JSON" ]; then
            echo "::error::Release $TAG not found"
            exit 1
          fi
           
          echo "release_json=$RELEASE_JSON" >> "$GITHUB_OUTPUT"
          echo "✓ Retrieved release: $TAG"

      - name: Create tracking issues for downstream registries
        id: create_tracking
        if: steps.check_maintainer.outputs.is_maintainer == 'true' && steps.check_maintainer.outputs.status == 'approve' && steps.extract_version.outputs.version != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const version = '${{ steps.extract_version.outputs.version }}';
            const releaseUrl = `https://github.com/${{ github.repository }}/releases/tag/v${version}`;
            
            const registries = [
              {
                name: 'WinGet',
                keyword: 'publish-winget',
                label: 'winget-release',
                distro_label: 'winget',
                environment: 'winget-production',
                workflow: 'release-winget-approval.yml',
                downstreamWorkflow: 'release-winget.yml',
                approvers: 'repo admins and maintainers',
                preconditions: (releaseVersion) => `The GitHub Release for v${releaseVersion} is published, the WinGet manifest and checksums match the signed release artifacts, and no critical packaging issues remain.`,
                validation: (releaseVersion) => `Review the manifest metadata, package SHA, installer arguments, and changelog for v${releaseVersion}. Confirm the release is ready for Windows installation and community submission.`,
                success: (releaseVersion) => `The WinGet approval workflow runs successfully, the PR is created or merged in microsoft/winget-pkgs, and \`winget install ThemisDB.ThemisDB\` resolves v${releaseVersion} on a clean Windows machine.`,
                failure: 'Cancel the workflow, keep the issue open, and escalate to the release manager for a rollback or delayed publication. Do not publish a package that fails validation or has unresolved security issues.',
                verification: (releaseVersion) => `Confirm the merged manifest is available from the WinGet source and the package for v${releaseVersion} installs without errors from a fresh Windows environment.`
              },
              {
                name: 'Docker',
                keyword: 'publish-docker',
                label: 'docker-release',
                distro_label: 'docker',
                environment: 'docker-production',
                workflow: 'release-docker-approval.yml',
                downstreamWorkflow: 'release-docker-image.yml',
                approvers: 'repo admins and maintainers',
                preconditions: (releaseVersion) => `The GitHub Release for v${releaseVersion} is published, the Docker build artifacts and checksums are verified, and there are no blocking security or regression findings.`,
                validation: (releaseVersion) => `Verify the image tags, registry target, checksum, and release notes for v${releaseVersion}. Confirm the runtime image is the intended production target and not the debug image.`,
                success: (releaseVersion) => `The Docker publication workflow completes successfully, the GHCR image is published, and \`docker pull ghcr.io/makr-code/themisdb:${releaseVersion}\` works on a clean host.`,
                failure: 'Abort the workflow run, leave the issue open, and revert or delay publication until the image and release metadata are validated again.',
                verification: (releaseVersion) => `Pull the published tag for v${releaseVersion} and confirm the runtime image starts correctly with the expected version and health checks.`
              },
              {
                name: 'Linux Distro',
                keyword: 'publish-linux',
                label: 'linux-distro-review',
                distro_label: 'linux-distro',
                environment: 'linux-distro-production',
                workflow: 'release-linux-distro-approval.yml',
                downstreamWorkflow: 'release-linux-distribution.yml',
                approvers: 'repo admins and maintainers',
                preconditions: (releaseVersion) => `The GitHub Release for v${releaseVersion} is public, the DEB/RPM payload and package metadata are validated, and distro repository package signing is ready.`,
                validation: (releaseVersion) => `Review the package metadata, install commands, architecture targets, and dependency constraints for v${releaseVersion}. Verify the package will install cleanly on supported Linux distributions.`,
                success: (releaseVersion) => `The Linux distro publication workflow completes, the package for v${releaseVersion} is available in the target distro channel, and installation succeeds on a supported clean Linux runner.`,
                failure: 'Stop the workflow run, keep the tracking issue open, and coordinate with the release manager to fix package metadata or dependency issues before retrying.',
                verification: (releaseVersion) => `Install the published package for v${releaseVersion} on a clean OS image and confirm the expected version and service startup state.`
              },
              {
                name: 'Windows Distro',
                keyword: 'publish-windows',
                label: 'windows-distro-review',
                distro_label: 'windows-distro',
                environment: 'windows-distro-production',
                workflow: 'release-windows-distro-approval.yml',
                downstreamWorkflow: 'release-windows-distribution.yml',
                approvers: 'repo admins and maintainers',
                preconditions: (releaseVersion) => `The GitHub Release for v${releaseVersion} is published, the Windows package manifests and checksums are validated, and no packaging blockers remain for Scoop/Chocolatey distribution.`,
                validation: (releaseVersion) => `Verify the installer metadata, architecture mapping, checksum values, and installation command behavior for v${releaseVersion} on supported Windows versions before approving publication.`,
                success: (releaseVersion) => `The Windows distro workflow completes, the package for v${releaseVersion} is available through the target Windows distribution channel, and a clean Windows install succeeds with the expected version.`,
                failure: 'Cancel the workflow and leave the issue open; do not publish until the manifest, installer, or packaging metadata is corrected and revalidated.',
                verification: (releaseVersion) => `Install the published package for v${releaseVersion} from a clean Windows machine and verify the executable and version output match the release tag.`
              },
            ];
            
            const createdIssues = [];
            
            for (const registry of registries) {
              const title = `📦 ${registry.name} Release: v${version}`;
              const preconditions = registry.preconditions(version);
              const validation = registry.validation(version);
              const success = registry.success(version);
              const verification = registry.verification(version);
              const body = `## Release Version: v${version}\n\n**Registry:** ${registry.name}\n**GitHub Release:** [v${version}](${releaseUrl})\n**Status:** Awaiting approval for publication\n\n### Deployment Instructions\n- **GitHub Environment:** \`${registry.environment}\`\n- **Required approvers:** ${registry.approvers}\n- **Approval workflow:** \`${registry.workflow}\`\n- **Exact approval command:** \`/${registry.keyword}\`\n- **Workflow that runs after approval:** \`${registry.downstreamWorkflow}\`\n- **Required preconditions:** ${preconditions}\n\n### Manual approval steps\n1. Open the repository Actions page and find the run for \`${registry.workflow}\`.\n2. Approve the GitHub Environment \`${registry.environment}\` in the pending approval prompt. This approval is required before deployment can proceed.\n3. Post the exact comment \`/${registry.keyword}\` on this issue to trigger the downstream publication gate.\n4. Confirm the next workflow execution is \`${registry.downstreamWorkflow}\` and monitor it until completion.\n\n### Validation Steps\n- [ ] Download and verify the release artifacts for v${version}\n- [ ] Verify checksums and signatures\n- [ ] Review changelog and metadata\n- [ ] Confirm the target registry/channel is correct\n- [ ] ${validation}\n\n### Success Criteria\n- [ ] The GitHub Environment \`${registry.environment}\` is approved\n- [ ] The approval command \`/${registry.keyword}\` is used by an admin or maintainer\n- [ ] \`${registry.downstreamWorkflow}\` completes successfully\n- [ ] ${success}\n\n### Failure / Rollback Notes\n- [ ] If validation fails, do not approve the environment or publish the package\n- [ ] Cancel the workflow run and leave the issue open if there is a packaging, security, or dependency blocker\n- [ ] ${registry.failure}\n\n### Post-deployment Verification\n- [ ] Confirm the target channel/registry reflects the new version\n- [ ] ${verification}\n\n### Review Checklist\n- [ ] Download and verify release artifacts\n- [ ] Verify checksums and signatures\n- [ ] Confirm metadata is accurate\n- [ ] Review changelog\n- [ ] Test package/image if applicable`;
               
              try {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: [registry.label, registry.distro_label, 'release-review'],
                });
                createdIssues.push({
                  name: registry.name,
                  number: created.data.number,
                  keyword: registry.keyword
                });
                core.info(`✓ Created tracking issue #${created.data.number} for ${registry.name}`);
              } catch (error) {
                core.warning(`⚠ Could not create ${registry.name} tracking issue: ${error.message}`);
              }
            }
            
            core.setOutput('tracking_issues', JSON.stringify(createdIssues));

      - name: Publish release (set draft=false)
        id: publish_release
        if: steps.check_maintainer.outputs.is_maintainer == 'true' && steps.check_maintainer.outputs.status == 'approve' && steps.extract_version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          
          # Update release to set draft=false
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --draft=false
          
          echo "✓ Release $TAG published"
          echo "::notice::GitHub Release ${TAG} is now publicly visible"

      - name: Comment approval status and tracking issues
        if: steps.check_maintainer.outputs.is_maintainer == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const issue = context.payload.issue;
            const version = '${{ steps.extract_version.outputs.version }}';
            const user = context.payload.comment.user.login;
            const trackingJson = '${{ steps.create_tracking.outputs.tracking_issues }}' || '[]';
            
            let trackingIssues = [];
            try {
              trackingIssues = JSON.parse(trackingJson);
            } catch (e) {
              core.warning('Could not parse tracking issues: ' + e.message);
            }
            
            let nextStepsList = 'Each registry requires explicit approval:\n';
            for (const t of trackingIssues) {
              nextStepsList += `   - ${t.name}: Comment \`/${t.keyword}\` on #${t.number}\n`;
            }
            
            const comment = `✅ **GitHub Release Published**\n\n**Approved By:** @${user}\n**Version:** ${version}\n**Status:** Release is now publicly visible on GitHub\n\n**Access Release:**\n- Release URL: https://github.com/${{ github.repository }}/releases/tag/v${version}\n- Download artifacts from the release page\n- All signatures and checksums are included\n\n**Next Steps:**\n1. Tracking issues created for downstream registries:\n${nextStepsList}\n2. No automatic downstream triggering; each registry requires independent maintainer approval via its tracking issue\n3. Monitor artifact downloads and user reports\n\n**Tracking:** Release audit trail is complete.`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: comment,
            });

      - name: Update issue on failure
        if: failure() && steps.check_maintainer.outputs.is_maintainer == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const issue = context.payload.issue;
            const failureReason = `${{ job.status }}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `❌ **GitHub Release Publication Failed**\n\nJob Status: ${failureReason}\n\nThe draft release remains unpublished. Please check the workflow logs and try again.`,
            });
