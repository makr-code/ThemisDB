name: Acceleration Benchmark CI

# Runs the CPU/CUDA acceleration benchmark harness (bench_cuda_vs_cpu) and
# checks the results against stored baselines using the regression detector.
#
# • CPU benchmarks always run – no GPU hardware required.
# • CUDA benchmarks are compiled in when THEMIS_ENABLE_CUDA=ON but skip
#   gracefully at runtime if no CUDA device is detected.
# • On push to main the baseline is updated and committed back to the repo so
#   future PRs have a fresh reference point.
# • On pull_request the workflow compares against the stored baseline and
#   fails if major (≥ 10 %) or critical (≥ 20 %) regressions are found.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/acceleration/**'
      - 'include/acceleration/**'
      - 'benchmarks/bench_cuda_vs_cpu.cpp'
      - 'benchmarks/performance_regression_detector.py'
      - 'benchmarks/baseline_manager.py'
      - 'benchmarks/baselines/acceleration/**'
      - '.github/workflows/acceleration-benchmark-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/acceleration/**'
      - 'include/acceleration/**'
      - 'benchmarks/bench_cuda_vs_cpu.cpp'
      - 'benchmarks/performance_regression_detector.py'
      - 'benchmarks/baseline_manager.py'
      - 'benchmarks/baselines/acceleration/**'
      - '.github/workflows/acceleration-benchmark-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run CPU acceleration benchmarks, then compare against baseline
  # ---------------------------------------------------------------------------
  acceleration-benchmarks:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_acceleration_changes == 'true'
    name: Acceleration Benchmarks (CPU, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libssl-dev \
            libcurl4-openssl-dev \
            libboost-all-dev \
            librocksdb-dev \
            libfmt-dev \
            pkg-config \
            git \
            python3 python3-pip

      - name: Install Google Benchmark
        run: |
          sudo apt-get install -y libbenchmark-dev 2>/dev/null || true
          # Build from source if apt package is not available / too old
          if ! pkg-config --exists benchmark 2>/dev/null; then
            git clone --depth 1 --branch v1.8.3 \
              https://github.com/google/benchmark.git /tmp/benchmark
            cmake -S /tmp/benchmark -B /tmp/benchmark/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBENCHMARK_ENABLE_TESTING=OFF \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
            cmake --build /tmp/benchmark/build --parallel $(nproc)
            sudo cmake --install /tmp/benchmark/build --prefix /usr/local
          fi

      - name: Configure (acceleration benchmarks, CPU-only)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build_bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ROOT_DIR="${{ github.workspace }}" \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -S cmake

      - name: Build bench_cuda_vs_cpu
        run: cmake --build build_bench --target bench_cuda_vs_cpu -- -j$(nproc)

      - name: Run regression detector unit tests
        run: |
          mkdir -p benchmark_results
          pip install pytest --quiet
          python3 -m pytest benchmarks/tests/test_performance_regression_detector.py \
            -v --tb=short 2>&1 | tee benchmark_results/unit_test_results.log

      - name: Run acceleration benchmarks (JSON output)
        run: |
          mkdir -p benchmark_results
          ./build_bench/bench_cuda_vs_cpu \
            --benchmark_format=json \
            --benchmark_out=benchmark_results/acceleration_results.json \
            --benchmark_filter="BM_CPU_.*" \
            2>&1 | tee benchmark_results/acceleration_run.log

      - name: Detect performance regressions
        shell: bash
        run: |
          python3 benchmarks/performance_regression_detector.py \
            --baseline benchmarks/baselines/acceleration/baseline.json \
            --current  benchmark_results/acceleration_results.json \
            --output   benchmark_results/regression_report.txt \
            --fail-on  major \
            --threshold-minor    5.0 \
            --threshold-major   10.0 \
            --threshold-critical 20.0 \
            2>&1 | tee benchmark_results/regression_detector.log
          # Propagate exit code from the Python script (not from tee)
          exit "${PIPESTATUS[0]}"

      - name: Upload benchmark results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceleration-benchmark-results-${{ matrix.os }}
          path: |
            benchmark_results/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚡ Acceleration Benchmark CI – Benchmarks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Steps" >> "$GITHUB_STEP_SUMMARY"
          echo "- Regression detector unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- CPU acceleration benchmarks (JSON output)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Performance regression detection (minor ≥5%, major ≥10%, critical ≥20%)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark_results/regression_report.txt ]; then
            echo "### Regression Report" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            cat benchmark_results/regression_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Commit updated baseline back to main after a successful benchmark run.
  # Runs only on main branch push to keep the reference point current.
  # Uses a separate job so that the benchmark job can remain read-only.
  # ---------------------------------------------------------------------------
  update-baseline:
    name: Update Acceleration Baseline
    needs: acceleration-benchmarks
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.acceleration-benchmarks.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit and push the updated baseline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download benchmark results artifact
        uses: actions/download-artifact@v4
        with:
          name: acceleration-benchmark-results-ubuntu-22.04
          path: benchmark_results

      - name: Rebuild baseline from latest results
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone

          with open("benchmark_results/acceleration_results.json") as f:
              raw = json.load(f)

          benchmarks = {}
          for bench in raw.get("benchmarks", []):
              name = bench.get("name", "unknown")
              benchmarks[name] = {
                  "real_time": bench.get("real_time"),
                  "cpu_time": bench.get("cpu_time"),
                  "iterations": bench.get("iterations"),
                  "items_per_second": bench.get("items_per_second"),
                  "bytes_per_second": bench.get("bytes_per_second"),
              }

          baseline = {
              "version": open("VERSION").read().strip(),
              "branch": "main",
              "commit": os.environ["GITHUB_SHA"],
              "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "benchmarks": benchmarks,
          }

          os.makedirs("benchmarks/baselines/acceleration", exist_ok=True)
          out = "benchmarks/baselines/acceleration/baseline.json"
          with open(out, "w") as f:
              json.dump(baseline, f, indent=2)
          print(f"✅ Baseline rebuilt: {out} ({len(benchmarks)} benchmarks)")
          PYEOF

      - name: Commit and push updated baseline
        shell: bash
        run: |
          git config user.name  'ThemisDB CI Bot'
          git config user.email 'bot@themisdb.local'
          git add benchmarks/baselines/acceleration/baseline.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(acceleration): auto-update CPU benchmark baseline [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "✅ Acceleration baseline committed to main."
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚡ Acceleration Benchmark CI – Update Baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline file: \`benchmarks/baselines/acceleration/baseline.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Committed updated CPU benchmark baseline back to \`main\` (if changed)." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Summary / gate job – all matrix legs must pass
  # ---------------------------------------------------------------------------
  benchmark-gate:
    name: Acceleration Benchmark Gate
    needs: acceleration-benchmarks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check benchmark status
        shell: bash
        run: |
          result="${{ needs.acceleration-benchmarks.result }}"
          if [[ "$result" == "success" ]]; then
            echo "✅ All acceleration benchmarks passed – no blocking regressions."
          elif [[ "$result" == "skipped" ]]; then
            echo "ℹ️  Benchmarks skipped (no relevant changes detected)."
          else
            echo "❌ Acceleration benchmarks failed or detected blocking regressions."
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          result="${{ needs.acceleration-benchmarks.result }}"
          echo "## ⚡ Acceleration Benchmark CI – Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Benchmark result** | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
