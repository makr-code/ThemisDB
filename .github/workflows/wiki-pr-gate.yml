name: "Maintenance: Wiki PR Gate"

# Auto-generated wiki review flow: human-in-the-loop via issue comments.
# The workflow builds/wiki-validates and then upserts a single persistent
# tracking issue with a run-level comment so stakeholders can review the
# wiki state before any manual publish action. No PR branches are created.
#
# Review model:
#   - build + validate in automation
#   - upsert a single tracking issue (one issue, many run comments)
#   - each run appends a comment with current metrics and a link to the run
#   - any publish/merge action remains fully user-controlled

on:
  workflow_run:
    workflows:
      - "Maintenance: Docs"
      - "Maintenance: AI Working Cleanup - LLM Wiki"
    types:
      - completed

  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Target branch used for blob links and source metadata'
        required: false
        default: 'develop'
        type: string
      dry_run:
        description: 'Stop after build validation without creating/updating a PR branch'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      fail_on_blocked_private:
        description: 'Fail build if private-content guardrail blocks wiki sources (workflow_dispatch only)'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: wiki-pr-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  # Tracking issue title - coordinated between publish-wiki.yml and wiki-pr-gate.yml
  # If this needs to change, update in both workflows to maintain consistency.
  # For true single-source-of-truth without duplication, consider using GitHub repository
  # variables (vars.TRACKER_ISSUE_TITLE), but this requires admin setup.
  TRACKER_ISSUE_TITLE: "Wiki publish review: human sign-off tracker"

jobs:
  wiki_pr_gate:
    name: Build, validate and open a human review PR
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41efee25c33b52b59b6626b
        with:
          python-version: '3.12'

      - name: Build wiki staging
        id: build
        continue-on-error: true
        env:
          _RAW_SOURCE_BRANCH: ${{ github.event.inputs.source_branch }}
          _RAW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          _RAW_REF_NAME: ${{ github.ref_name }}
          _RAW_EVENT_NAME: ${{ github.event_name }}
          _RAW_FAIL_ON_BLOCKED_PRIVATE: ${{ github.event.inputs.fail_on_blocked_private }}
        run: |
          SOURCE_BRANCH="${_RAW_SOURCE_BRANCH:-${_RAW_HEAD_BRANCH:-$_RAW_REF_NAME}}"
          if [ -z "$SOURCE_BRANCH" ]; then
            SOURCE_BRANCH="develop"
          fi

          # Automation policy: workflow_run/schedule warn on blocked-private instead of failing.
          FAIL_ON_BLOCKED_PRIVATE="false"
          if [ "$_RAW_EVENT_NAME" = "workflow_dispatch" ]; then
            FAIL_ON_BLOCKED_PRIVATE="${_RAW_FAIL_ON_BLOCKED_PRIVATE}"
          fi

          build_args=(
            --repo-root .
            --output /tmp/wiki-staging
            --enable-breadcrumbs
            --sort-by currency
            --source-branch "$SOURCE_BRANCH"
            --manifest /tmp/wiki-manifest.json
          )
          if [ "${FAIL_ON_BLOCKED_PRIVATE}" = "true" ]; then
            build_args+=(--fail-on-blocked-private)
          fi
          python scripts/build_wiki.py "${build_args[@]}"

          python scripts/validate_wiki_links.py \
            --wiki-dir /tmp/wiki-staging \
            --report /tmp/wiki-link-report.txt \
            --fail-on-broken

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import json

          manifest_path = Path('/tmp/wiki-manifest.json')
          stats = {"pages_written": 0, "blocked_private": 0, "source_class_totals": {"primary": 0, "secondary": 0, "metadata": 0}}
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              stats = manifest.get('stats', stats)

          classes = stats.get('source_class_totals', {})
          print(f"pages_written={stats.get('pages_written', 0)}")
          print(f"blocked_private={stats.get('blocked_private', 0)}")
          print(f"primary_sources={classes.get('primary', 0)}")
          print(f"secondary_sources={classes.get('secondary', 0)}")
          print(f"metadata_sources={classes.get('metadata', 0)}")
          PY

      - name: Ensure failure tracker issue
        if: steps.build.outcome == 'failure'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: "Wiki automation failed: ${{ github.workflow }} #${{ github.run_number }}"
          issue-marker: '<!-- wiki-automation-failure -->'
          issue-body: |
            ## Wiki automation failed

            The automatic wiki generation/validation step failed and did not open a review PR.

            - Workflow: ${{ github.workflow }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Trigger: ${{ github.event_name }}
            - Commit: ${{ github.sha }}

            ### Details
            - Build step outcome: failed
            - Validation step outcome: failed before PR creation

            Please inspect the workflow logs and fix the generation or validation issue.

            <!-- wiki-automation-failure -->
          labels-to-add: 'automation,documentation,wiki-failed'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Upsert wiki review tracking issue
        id: tracking_issue
        if: steps.build.outcome == 'success'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: ${{ env.TRACKER_ISSUE_TITLE }}
          issue-marker: '<!-- wiki-review-tracker -->'
          issue-body: |
            ## Wiki publish review tracker

            This issue is the single human-in-the-loop sign-off tracker for automated
            wiki publish runs. Each run appends a comment below with the current metrics.

            **No action is needed on this issue unless you want to trigger or block a publish.**
            Close this issue once the wiki state is accepted; it will be re-opened by the
            next automation run that requires review.

            - Automation behavior: **one issue, one comment per run**
            - No PR branches are created; publish action is fully user-controlled.

            <!-- wiki-review-tracker -->
          labels-to-add: 'wiki-review,documentation'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Comment run metrics on tracking issue
        if: steps.build.outcome == 'success' && steps.tracking_issue.outputs.issue-number != ''
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-number: ${{ steps.tracking_issue.outputs.issue-number }}
          issue-marker: '<!-- wiki-run-${{ github.run_id }} -->'
          target-type: 'issue'
          issue-body: |
            ## Wiki publish run — review required

            A new wiki build has completed and is ready for human review.

            | Metric | Value |
            |--------|-------|
            | Pages written | ${{ steps.build.outputs.pages_written || '0' }} |
            | Private blocks | ${{ steps.build.outputs.blocked_private || '0' }} |
            | Primary sources | ${{ steps.build.outputs.primary_sources || '0' }} |
            | Secondary sources | ${{ steps.build.outputs.secondary_sources || '0' }} |
            | Metadata sources | ${{ steps.build.outputs.metadata_sources || '0' }} |
            | Source branch | `${{ github.event.inputs.source_branch || github.event.workflow_run.head_branch || github.ref_name }}` |
            | Trigger | `${{ github.event_name }}` |
            | Workflow run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            | Commit | `${{ github.sha }}` |

            **Next step:** Review the linked workflow run and confirm the wiki state matches
            the intended branch. When satisfied, trigger the publish action manually.

            <!-- wiki-run-${{ github.run_id }} -->
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Write run summary
        if: steps.build.outcome == 'success'
        run: |
          {
            echo "## Wiki Review Issue Updated"
            echo "- Issue: **${{ steps.tracking_issue.outputs.issue-number || 'n/a' }}**"
            echo "- Pages written: **${{ steps.build.outputs.pages_written || '0' }}**"
            echo "- Private blocks: **${{ steps.build.outputs.blocked_private || '0' }}**"
            echo "- Source classes: primary=${{ steps.build.outputs.primary_sources || '0' }}, secondary=${{ steps.build.outputs.secondary_sources || '0' }}, metadata=${{ steps.build.outputs.metadata_sources || '0' }}"
            echo "- Human sign-off required: **yes** (see tracking issue)"
            echo "- Automation behavior: **one issue, one comment per run — no PR branches**"
          } >> "$GITHUB_STEP_SUMMARY"
