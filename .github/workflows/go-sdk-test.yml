name: Go SDK [Dry-Run]

# Go SDK build and test workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Package is built but NOT published to pkg.go.dev

on:
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

defaults:
  run:
    working-directory: clients/go

jobs:
  build-and-test:
    name: Test Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.21', '1.22', '1.23']
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow builds and tests the Go SDK."
          echo "No packages are published to pkg.go.dev."
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: clients/go/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            echo "ACT detected - running build test only"
            go build -v ./...
            exit 0
          fi
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run benchmarks (no execution)
        if: env.ACT != 'true'
        continue-on-error: true
        run: go test -bench=. -benchmem -run=^$ ./...

      - name: Lint with golangci-lint (if available)
        if: env.ACT != 'true'
        continue-on-error: true
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest || true
          if command -v golangci-lint &> /dev/null; then
            golangci-lint run --timeout=5m || true
          fi

      - name: Generate test report
        if: always()
        run: |
          echo "## Go SDK Test Results (Go ${{ matrix.go-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.out ]; then
            echo "### Coverage Report:" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            go tool cover -func=coverage.out | tail -1 >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: go-sdk-coverage-${{ matrix.go-version }}
          path: clients/go/coverage.out
          retention-days: 7

  package:
    name: Package Module (Dry-Run)
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: clients/go/go.sum

      - name: Verify module
        run: |
          go mod verify
          go mod tidy
          
          # Check if go.mod changed
          if ! git diff --exit-code go.mod go.sum; then
            echo "⚠️ go.mod or go.sum has uncommitted changes"
            echo "Run 'go mod tidy' locally and commit the changes"
            exit 1
          fi

      - name: Display package info (Dry-Run)
        run: |
          echo "## Go SDK Build Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Module NOT published to pkg.go.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Module path:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "github.com/${{ github.repository }}/clients/go" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Import statement:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`go" >> $GITHUB_STEP_SUMMARY
          echo 'import "github.com/${{ github.repository }}/clients/go"' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Tag releases with semantic versioning (e.g., clients/go/v1.0.0)" >> $GITHUB_STEP_SUMMARY
          echo "2. Module will be automatically indexed by pkg.go.dev" >> $GITHUB_STEP_SUMMARY
          echo "3. No explicit publishing step needed for public repositories" >> $GITHUB_STEP_SUMMARY

      # TODO: For production releases, tag with clients/go/vX.Y.Z
      # The module will be automatically indexed by pkg.go.dev
