name: Compliance — License Policy Gate

on:
  pull_request:
    branches:
      - develop
      - minimal
      - community
      - enterprise
      - hyperscaler
      - military
    paths:
      - 'vcpkg.json'
      - '.license-policy.json'
      - 'CMakeLists.txt'
      - 'scripts/check_vcpkg_licenses.py'
      - 'tests/test_vcpkg_license_audit.py'
      - '.github/workflows/license-compliance.yml'
      - '.github/WORKFLOW_GUIDELINES.md'
      - '.github/WORKFLOW_REGISTRY.md'
      - '.gitmodules'
      - 'plugins/private/**'
      - 'cmake/PrivatePlugins.cmake'
      - 'cmake/features/PrivatePluginFeatures.cmake'
      - 'CONTRIBUTING.md'
      - 'docs/de/compliance/license-compliance.md'
      - 'docs/en/compliance/license-compliance.md'
  push:
    branches:
      - develop
      - minimal
      - community
      - enterprise
      - hyperscaler
      - military
    paths:
      - 'vcpkg.json'
      - '.license-policy.json'
      - 'CMakeLists.txt'
      - 'scripts/check_vcpkg_licenses.py'
      - 'tests/test_vcpkg_license_audit.py'
      - '.github/workflows/license-compliance.yml'
      - '.github/WORKFLOW_GUIDELINES.md'
      - '.github/WORKFLOW_REGISTRY.md'
      - '.gitmodules'
      - 'plugins/private/**'
      - 'cmake/PrivatePlugins.cmake'
      - 'cmake/features/PrivatePluginFeatures.cmake'
      - 'CONTRIBUTING.md'
      - 'docs/de/compliance/license-compliance.md'
      - 'docs/en/compliance/license-compliance.md'
  release:
    types:
      - published
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

concurrency:
  group: license-compliance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-compliance:
    name: License Policy Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read vcpkg baseline
        id: baseline
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path("vcpkg.json").read_text(encoding="utf-8"))
          print(f"sha={manifest['builtin-baseline']}")
          PY

      - name: Checkout vcpkg ports at pinned baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.sha }}
          path: vcpkg-upstream
          fetch-depth: 1

      - name: Run vcpkg license audit
        run: |
          python scripts/check_vcpkg_licenses.py \
            --manifest vcpkg.json \
            --policy .license-policy.json \
            --ports-dir vcpkg-upstream/ports \
            --output-dir artifacts/license-compliance

      - name: Publish workflow summary
        run: cat artifacts/license-compliance/license-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload license artifacts
        uses: actions/upload-artifact@v4
        with:
          name: license-compliance-${{ github.run_id }}
          path: |
            artifacts/license-compliance/license-summary.md
            artifacts/license-compliance/vcpkg-license-sbom.json
          retention-days: 90

  release-assets:
    name: Publish License Release Assets
    if: github.event_name == 'release'
    needs: license-compliance
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download license artifacts
        uses: actions/download-artifact@v4
        with:
          name: license-compliance-${{ github.run_id }}
          path: artifacts/license-compliance

      - name: Attach license artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/license-compliance/license-summary.md
            artifacts/license-compliance/vcpkg-license-sbom.json
