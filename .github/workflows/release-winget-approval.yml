name: "Release: WinGet Approval Gate"

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: winget-publish-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  winget_publish_from_issue:
    name: "Publish: WinGet on Approval Comment"
    if: |
      contains(github.event.issue.labels.*.name, 'winget-release') &&
      (
        contains(github.event.comment.body, '/publish-winget') ||
        contains(github.event.comment.body, '/approve-winget') ||
        contains(github.event.comment.body, '@publish-winget') ||
        contains(github.event.comment.body, '/hold-winget') ||
        contains(github.event.comment.body, '/pause-winget') ||
        contains(github.event.comment.body, '/reject-winget') ||
        contains(github.event.comment.body, '/cancel-winget') ||
        contains(github.event.comment.body, '/rollback-winget')
      )
    uses: ./.github/workflows/reusable-release-approval-comment-gate.yml
    with:
      issue_label: winget-release
      match_regex: "/publish-winget\\b|/approve-winget\\b|@publish-winget\\b|/hold-winget\\b|/pause-winget\\b|/reject-winget\\b|/cancel-winget\\b|/rollback-winget\\b"
      hold_regex: "/hold-winget\\b|/pause-winget\\b"
      reject_regex: "/reject-winget\\b|/cancel-winget\\b"
      rollback_regex: "/rollback-winget\\b"
      subject: "WinGet Submission"
      environment_name: winget-production
      environment_url: https://github.com/${{ github.repository }}/actions/workflows/release-winget-approval.yml
      target_workflow_id: release-winget.yml
      target_ref: develop
      dispatch_inputs_json: '{"fork_owner":"${{ vars.WINGET_FORK_OWNER }}"}'
      approved_label: winget-approved
      approval_note: |
        Monitor `release-winget.yml` for submission status and winget-pkgs PR creation.
