name: Geo Point Clustering (DBSCAN / k-means) CI

# Triggered on every push / PR that touches the clustering sources,
# its test file, or this workflow itself.
# Targets v1.8.0 (roadmap:geo:phase4:clustering:Issue-1747).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/geo/geo_clustering.h'
      - 'src/geo/geo_clustering.cpp'
      - 'tests/geo/test_geo_clustering.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/geo-point-clustering-dbscan-kmeans-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/geo/geo_clustering.h'
      - 'src/geo/geo_clustering.cpp'
      - 'tests/geo/test_geo_clustering.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/geo-point-clustering-dbscan-kmeans-ci.yml'
  workflow_dispatch:

concurrency:
  group: geo-point-clustering-dbscan-kmeans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated GeoClusteringFocusedTests suite.
  # Tests cover all acceptance criteria:
  #   AC-1  DBSCAN: empty input, zero-epsilon, single-point edge cases
  #   AC-2  DBSCAN: two well-separated clusters correctly identified
  #   AC-3  DBSCAN: isolated point labeled as noise
  #   AC-4  DBSCAN: non-Point geometry treated as noise
  #   AC-5  k-means: degenerate inputs (k==0, k>n) throw invalid_argument
  #   AC-6  k-means: two well-separated groups split correctly with k=2
  #   AC-7  k-means: k-means++ seeding path (seed != 0) produces valid result
  #   AC-8  k-means: deterministic result on repeated calls with same seed
  # ---------------------------------------------------------------------------
  geo-clustering-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Geo Clustering tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev
            libspdlog-dev nlohmann-json3-dev libgeos-dev libproj-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target (AC-1 through AC-8) ────────────────────────────
      - name: Run GeoClusteringFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoClusteringFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee geo_clustering_results.txt

      # ── DBSCAN + k-means tests via unified binary ──────────────────────────
      - name: Run clustering tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="DbscanCluster*:KMeansCluster*" \
            --gtest_output="xml:geo_clustering_gtest.xml" \
            2>&1 | tee geo_clustering_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-clustering-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/geo_clustering_results.txt
            build/geo_clustering_gtest.xml
            build/geo_clustering_gtest_output.txt
          retention-days: 30
