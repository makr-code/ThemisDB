name: "Maintenance: Issues [GS3 + Security Alerts]"

# Rechenaufwand-Score: R=3 (K=3, L=3, N=3) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Consolidated maintenance dispatcher for issue-creating triage workflows.
# Merges: maintenance-gs3-gaps.yml + maintenance-security-alerts.yml
#
# Both jobs share the same workflow file because they:
#   - use identical infrastructure (ubuntu-latest, github-script, issues: write)
#   - have staggered schedules (no overlap)
#   - produce governance issues as their primary output
#   - do not require separate concurrency groups or permission boundaries
#
# Replaces:
#   - .github/workflows/maintenance-gs3-gaps.yml
#   - .github/workflows/maintenance-security-alerts.yml

env:
  TARGET_BRANCH: ${{ github.event.repository.default_branch }}

on:
  schedule:
    - cron: '30 3 * * *'   # Daily 03:30 UTC — GS3 gap triage
    - cron: '30 5 * * *'   # Daily 05:30 UTC — Security alert SLA triage
    - cron: '30 2 * * 3'   # Weekly Wednesday 02:30 UTC — Doxygen header update
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        type: choice
        options:
          - gs3-gap-triage
          - security-alert-triage
          - doxygen-header-update
          - both
        default: both
      # ── GS3 inputs ────────────────────────────────────────────────────────
      target_branch:
        description: '[GS3] Target branch to scan'
        required: false
        type: choice
        options:
          - develop
          - community
        default: develop
      scan_paths:
        description: '[GS3] Whitespace-separated paths to scan'
        required: false
        default: 'src include tests'
        type: string
      scan_mode:
        description: '[GS3] GS3 scan mode'
        required: false
        type: choice
        options:
          - fast
          - thorough
        default: fast
      min_severity:
        description: '[GS3] Minimum severity considered actionable'
        required: false
        type: choice
        options:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
        default: HIGH
      min_bucket_count:
        description: '[GS3] Minimum actionable buckets required to open/update issue'
        required: false
        default: '1'
        type: string
      force_reopen:
        description: '[GS3] Re-open matching closed issue when findings exist'
        required: false
        default: false
        type: boolean
      close_when_clean:
        description: '[GS3] Keep matching issue open and post recovery update when no actionable findings remain'
        required: false
        default: false
        type: boolean
      # ── Security alert inputs ─────────────────────────────────────────────
      sla_days:
        description: '[Security] SLA threshold in days for open high/critical code scanning alerts'
        required: false
        default: '14'
        type: string

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: ci-maintenance-issues-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: GS3 Gap Triage
  # Content lifted verbatim from maintenance-gs3-gaps.yml.
  # ────────────────────────────────────────────────────────────────────────────
  gs3-gap-triage:
    name: 🧭 GS3 Gap Triage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      issues: write
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'gs3-gap-triage' || inputs.job == 'both'))
    env:
      TARGET_BRANCH: ${{ github.event_name == 'schedule' && 'develop' || inputs.target_branch }}
      SCAN_PATHS: ${{ inputs.scan_paths || 'src include tests' }}
      SCAN_MODE: ${{ inputs.scan_mode || 'fast' }}
      MIN_SEVERITY: ${{ inputs.min_severity || 'HIGH' }}
      MIN_BUCKET_COUNT: ${{ inputs.min_bucket_count || '1' }}
      FORCE_REOPEN: ${{ inputs.force_reopen }}
      CLOSE_WHEN_CLEAN: ${{ inputs.close_when_clean }}

    steps:
      - name: Print context
        run: |
          echo "============================================================"
          echo " Maintenance — GS3 Gap Triage"
          echo "============================================================"
          echo "  Trigger           : ${{ github.event_name }}"
          echo "  Target branch     : ${TARGET_BRANCH}"
          echo "  Scan paths        : ${SCAN_PATHS}"
          echo "  Scan mode         : ${SCAN_MODE}"
          echo "  Min severity      : ${MIN_SEVERITY}"
          echo "  Min bucket count  : ${MIN_BUCKET_COUNT}"
          echo "  Force reopen      : ${FORCE_REOPEN}"
          echo "  Close when clean  : ${CLOSE_WHEN_CLEAN}"
          echo "  Actor             : ${{ github.actor }}"
          echo "  Run ID            : ${{ github.run_id }}"
          echo "  Timestamp         : $(date -u)"
          echo "============================================================"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml

      - name: Prepare output directories
        run: mkdir -p ai_working/gs3

      - name: Run GS3 scan
        id: scan
        run: |
          python3 - <<'PY'
          import os
          import shlex
          import subprocess
          import sys
          from pathlib import Path

          paths = shlex.split(os.environ.get("SCAN_PATHS", "src include tests"))
          if not paths:
            print("::error::SCAN_PATHS resolved to empty path list")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("scan_failed=true\nscan_exit_code=2\n")
            raise SystemExit(2)

          output_json = Path("ai_working/gs3/gap_scan.json")
          output_md = Path("ai_working/gs3/gap_scan.md")

          cmd = [
            "python3", "-m", "tools.gs3", "scan",
            *paths,
            "--scan-mode", os.environ.get("SCAN_MODE", "fast"),
            "--output", str(output_json),
            "--md-report", str(output_md),
          ]

          print("Running:", " ".join(cmd))
          completed = subprocess.run(cmd)
          exit_code = int(completed.returncode)

          # gs3 returns 0 if findings exist, 1 if no findings; both are valid scan outcomes.
          scan_failed = exit_code not in (0, 1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"scan_exit_code={exit_code}\n")
            fh.write(f"scan_failed={'true' if scan_failed else 'false'}\n")

          if scan_failed:
            print(f"::error::GS3 scan failed with exit code {exit_code}")
            raise SystemExit(exit_code)

          print(f"GS3 scan finished with exit code {exit_code}")
          PY

      - name: Consolidate findings
        id: consolidate
        if: steps.scan.outputs.scan_failed != 'true'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          severity_rank = {
            "CRITICAL": 4,
            "HIGH": 3,
            "MEDIUM": 2,
            "LOW": 1,
            "INFO": 0,
          }

          min_sev = (os.environ.get("MIN_SEVERITY", "HIGH") or "HIGH").upper()
          min_rank = severity_rank.get(min_sev, severity_rank["HIGH"])
          min_bucket_count_raw = os.environ.get("MIN_BUCKET_COUNT", "1")
          try:
            min_bucket_count = max(0, int(min_bucket_count_raw))
          except ValueError:
            min_bucket_count = 1

          src = Path("ai_working/gs3/gap_scan.json")
          if not src.exists():
            print("::notice::Scan output file absent (no findings or scanner produced no JSON). Treating as zero findings.")
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("actionable_buckets=0\nactionable_findings=0\nmin_bucket_count=1\nshould_open_issue=false\ncritical_count=0\n")
            import sys
            sys.exit(0)

          data = json.loads(src.read_text(encoding="utf-8"))
          gaps = data.get("gaps", [])
          if not isinstance(gaps, list):
            gaps = []

          actionable = []
          for g in gaps:
            sev = str(g.get("severity", "LOW")).upper()
            if severity_rank.get(sev, 0) < min_rank:
              continue
            if str(g.get("impact_level", "")).upper() == "THIRD_PARTY":
              continue
            file_path = str(g.get("file", "unknown"))
            scanner = str(g.get("scanner") or f"step{g.get('step', 'na')}")
            gap_type = str(g.get("type", "unknown"))
            bucket_key = f"{scanner}|{file_path}|{gap_type}|{sev}"
            actionable.append({
              "bucket_key": bucket_key,
              "scanner": scanner,
              "file": file_path,
              "type": gap_type,
              "severity": sev,
              "subsystem": str(g.get("subsystem", "unknown")),
              "line": int(g.get("line") or 0),
              "description": str(g.get("description", "")).strip(),
            })

          buckets = {}
          for item in actionable:
            key = item["bucket_key"]
            b = buckets.setdefault(key, {
              "key": key,
              "scanner": item["scanner"],
              "file": item["file"],
              "type": item["type"],
              "severity": item["severity"],
              "subsystem": item["subsystem"],
              "count": 0,
              "line": item["line"] if item["line"] > 0 else 0,
              "description": item["description"],
            })
            b["count"] += 1
            if item["line"] > 0 and (b["line"] == 0 or item["line"] < b["line"]):
              b["line"] = item["line"]
            if not b["description"] and item["description"]:
              b["description"] = item["description"]

          bucket_list = list(buckets.values())
          bucket_list.sort(
            key=lambda x: (
              -severity_rank.get(x["severity"], 0),
              -x["count"],
              x["file"],
              x["type"],
              x["scanner"],
            )
          )

          signature_list = []
          for b in bucket_list:
            signature = hashlib.sha1(b["key"].encode("utf-8")).hexdigest()
            signature_list.append(signature)

          by_severity = {}
          for b in bucket_list:
            by_severity[b["severity"]] = by_severity.get(b["severity"], 0) + b["count"]

          summary = {
            "scan_context": {
              "target_branch": os.environ.get("TARGET_BRANCH", "develop"),
              "scan_paths": os.environ.get("SCAN_PATHS", "src include tests"),
              "scan_mode": os.environ.get("SCAN_MODE", "fast"),
              "min_severity": min_sev,
              "min_bucket_count": min_bucket_count,
            },
            "counts": {
              "total_raw_findings": len(gaps),
              "actionable_findings": len(actionable),
              "actionable_buckets": len(bucket_list),
            },
            "by_severity": by_severity,
            "buckets": bucket_list,
            "signatures": signature_list,
          }

          out = Path("ai_working/gs3/consolidated_summary.json")
          out.write_text(json.dumps(summary, indent=2), encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"actionable_buckets={len(bucket_list)}\n")
            fh.write(f"actionable_findings={len(actionable)}\n")
            fh.write(f"min_bucket_count={min_bucket_count}\n")
            fh.write(f"should_open_issue={'true' if len(bucket_list) >= min_bucket_count else 'false'}\n")
            fh.write(f"critical_count={by_severity.get('CRITICAL', 0)}\n")
          PY

      - name: Upload GS3 artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gs3-gap-scan-${{ github.run_id }}
          path: |
            ai_working/gs3/gap_scan.json
            ai_working/gs3/gap_scan.md
            ai_working/gs3/consolidated_summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build GS3 issue body
        id: gs3-body
        if: steps.scan.outputs.scan_failed != 'true'
        shell: bash
        env:
          SHOULD_OPEN_ISSUE: ${{ steps.consolidate.outputs.should_open_issue }}
          ACTIONABLE_BUCKETS: ${{ steps.consolidate.outputs.actionable_buckets }}
          ACTIONABLE_FINDINGS: ${{ steps.consolidate.outputs.actionable_findings }}
          CRITICAL_COUNT: ${{ steps.consolidate.outputs.critical_count }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path('ai_working/gs3/consolidated_summary.json')
          if not summary_path.exists():
              raise SystemExit(0)

          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          buckets = summary.get('buckets') or []
          signatures = summary.get('signatures') or []
          by_severity = summary.get('by_severity') or {}
          scan_context = summary.get('scan_context') or {}

          target_branch = os.environ.get('TARGET_BRANCH') or scan_context.get('target_branch') or 'develop'
          scan_paths = os.environ.get('SCAN_PATHS') or scan_context.get('scan_paths') or 'src include tests'
          scan_mode = os.environ.get('SCAN_MODE') or scan_context.get('scan_mode') or 'fast'
          min_severity = os.environ.get('MIN_SEVERITY') or scan_context.get('min_severity') or 'HIGH'
          min_bucket_count = int(os.environ.get('MIN_BUCKET_COUNT') or str(scan_context.get('min_bucket_count') or '1'))
          should_open = str(os.environ.get('SHOULD_OPEN_ISSUE') or 'false').lower() == 'true'
          actionable_findings = os.environ.get('ACTIONABLE_FINDINGS') or '0'
          actionable_buckets = os.environ.get('ACTIONABLE_BUCKETS') or '0'
          critical_count = os.environ.get('CRITICAL_COUNT') or '0'

          markers = [
              '<!-- gs3-gap:type:consolidated -->',
              f'<!-- gs3-gap:scope:{os.environ.get("GITHUB_REPOSITORY", "") or "repo"} -->',
              f'<!-- gs3-gap:branch:{target_branch} -->',
              f'<!-- gs3-gap:paths:{scan_paths} -->',
              f'<!-- gs3-gap:min-severity:{min_severity} -->',
              f'<!-- gs3-gap:min-bucket-count:{min_bucket_count} -->',
          ]
          lines = []
          lines.extend(markers)
          lines.extend([
              '## GS3 Consolidated Gap Scan',
              '',
              f'- **Branch:** `{target_branch}`',
              f'- **Paths:** `{scan_paths}`',
              f'- **Mode:** `{scan_mode}`',
              f'- **Threshold:** `{min_severity}+`',
              '',
              f'- **Actionable findings:** {actionable_findings}',
              f'- **Actionable buckets:** {actionable_buckets} (minimum for issue action: {min_bucket_count})',
              f'- **By severity:** CRITICAL={by_severity.get("CRITICAL", 0)}, HIGH={by_severity.get("HIGH", 0)}, MEDIUM={by_severity.get("MEDIUM", 0)}, LOW={by_severity.get("LOW", 0)}',
              '',
              f'- **Run:** https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              '',
              '### Top actionable buckets',
              '',
              '| Severity | Scanner | Type | Location | Count | Subsystem |',
              '|---|---|---|---|---:|---|',
          ])

          if buckets:
              for bucket in buckets[:50]:
                  loc = f"{bucket.get('file', 'unknown')}:{bucket.get('line') if bucket.get('line') and bucket.get('line') > 0 else 'n/a'}"
                  lines.append(f"| {bucket.get('severity', 'LOW')} | `{bucket.get('scanner', 'unknown')}` | `{bucket.get('type', 'unknown')}` | `{loc}` | {bucket.get('count', 0)} | `{bucket.get('subsystem', 'unknown')}` |")
          else:
              lines.append('| _none_ | _none_ | _none_ | _none_ | 0 | _none_ |')

          lines.extend(['', '_Auto-generated by maintenance-issues.yml at ' + __import__('datetime').datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ') + '_'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('body<<EOF\n')
              fh.write('\n'.join(lines))
              fh.write('\nEOF\n')
          PY

      - name: Upsert consolidated GS3 issue
        if: steps.scan.outputs.scan_failed != 'true' && steps.consolidate.outputs.should_open_issue == 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[GS3] Gap Scan — ${{ env.TARGET_BRANCH }} (${{ env.MIN_SEVERITY }}+)'
          issue-marker: '<!-- gs3-gap:branch:${{ env.TARGET_BRANCH }} -->'
          issue-body: ${{ steps.gs3-body.outputs.body }}
          labels-to-add: 'quality,scanner/gs3,status/needs-approval'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Normalize GS3 labels when open
        if: steps.scan.outputs.scan_failed != 'true' && steps.consolidate.outputs.should_open_issue == 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-marker: '<!-- gs3-gap:branch:${{ env.TARGET_BRANCH }} -->'
          labels-to-add: 'quality,scanner/gs3,status/needs-approval'
          status-group: 'quality,scanner/gs3,scanner/runtime,security,security/critical,status/needs-approval'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Post GS3 recovery update when clean
        if: steps.scan.outputs.scan_failed != 'true' && steps.consolidate.outputs.should_open_issue != 'true' && steps.consolidate.outputs.actionable_buckets != ''
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-marker: '<!-- gs3-gap:branch:${{ env.TARGET_BRANCH }} -->'
          allow-missing: true
          issue-body: |
            ✅ No actionable GS3 bucket remains above threshold.

            _Auto-updated by maintenance-issues.yml at ${{ github.run_id }}_
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Normalize GS3 labels on recovery
        if: steps.scan.outputs.scan_failed != 'true' && steps.consolidate.outputs.should_open_issue != 'true' && steps.consolidate.outputs.actionable_buckets != ''
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-marker: '<!-- gs3-gap:branch:${{ env.TARGET_BRANCH }} -->'
          allow-missing: true
          labels-to-add: 'quality,scanner/gs3'
          status-group: 'quality,scanner/gs3,scanner/runtime,security,security/critical,status/needs-approval'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Upsert scanner failure issue
        if: steps.scan.outputs.scan_failed == 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[GS3] Scanner execution failure — ${{ env.TARGET_BRANCH }}'
          issue-marker: '<!-- gs3-gap:branch:${{ env.TARGET_BRANCH }} -->'
          issue-body: |
            <!-- gs3-gap:type:scanner-failure -->
            <!-- gs3-gap:scope:${{ github.repository }} -->
            <!-- gs3-gap:branch:${{ env.TARGET_BRANCH }} -->
            ## GS3 scanner execution failed

            - **Exit code:** ${{ steps.scan.outputs.scan_exit_code || 'unknown' }}
            - **Branch:** `${{ env.TARGET_BRANCH }}`
            - **Paths:** `${{ env.SCAN_PATHS }}`
            - **Mode:** `${{ env.SCAN_MODE }}`
            - **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            _Please inspect workflow logs and fix scanner/runtime failures._
            _Auto-generated by maintenance-issues.yml at ${{ github.run_id }}_
          labels-to-add: 'quality,scanner/gs3'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Post scanner recovery update
        if: steps.scan.outputs.scan_failed != 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-marker: '<!-- gs3-gap:branch:${{ env.TARGET_BRANCH }} -->'
          allow-missing: true
          issue-body: |
            ✅ GS3 scanner execution recovered.

            _Auto-updated by maintenance-issues.yml at ${{ github.run_id }}_
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 🧭 GS3 Gap Triage"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Branch: \`${TARGET_BRANCH}\`"
            echo "- Scan paths: \`${SCAN_PATHS}\`"
            echo "- Scan mode: \`${SCAN_MODE}\`"
            echo "- Scan failed: \`${{ steps.scan.outputs.scan_failed || 'unknown' }}\`"
            echo "- Scan exit code: \`${{ steps.scan.outputs.scan_exit_code || 'n/a' }}\`"
            echo "- Actionable findings: \`${{ steps.consolidate.outputs.actionable_findings || 'n/a' }}\`"
            echo "- Actionable buckets: \`${{ steps.consolidate.outputs.actionable_buckets || 'n/a' }}\`"
            echo "- Issue threshold reached: \`${{ steps.consolidate.outputs.should_open_issue || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Security Alert SLA Triage
  # Content lifted verbatim from maintenance-security-alerts.yml.
  # ────────────────────────────────────────────────────────────────────────────
  security-alert-triage:
    name: 🛡️ Security Alert SLA Triage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
      issues: write
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'security-alert-triage' || inputs.job == 'both'))

    steps:
      - name: Print triage context
        run: |
          echo "============================================================"
          echo " Maintenance — Security Alert Triage"
          echo "============================================================"
          echo "  Trigger       : ${{ github.event_name }}"
          echo "  SLA days      : ${{ inputs.sla_days || 14 }}"
          echo "  Actor         : ${{ github.actor }}"
          echo "  Run ID        : ${{ github.run_id }}"
          echo "  Repo          : ${{ github.repository }}"
          echo "  Timestamp     : $(date -u)"
          echo "============================================================"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Query code scanning alerts for SLA breaches
        id: query
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const slaDaysRaw = '${{ inputs.sla_days || 14 }}';
            const slaDays = Number.parseInt(slaDaysRaw, 10);
            if (!Number.isFinite(slaDays) || slaDays <= 0) {
              throw new Error(`Invalid sla_days input: ${slaDaysRaw}`);
            }
            const now = Date.now();
            const msPerDay = 24 * 60 * 60 * 1000;
            let alerts = [];
            try {
              alerts = await github.paginate(github.rest.codeScanning.listAlertsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
            } catch (err) {
              if (err.status === 404) {
                core.notice('Code scanning not enabled on this repository; skipping SLA triage.');
                core.setOutput('has_breach', 'false');
                core.setOutput('breach_count', '0');
                return;
              }
              throw err;
            }
            const prioritized = alerts
              .map(a => {
                const sev = (a.rule?.security_severity_level || '').toLowerCase();
                const createdAt = Date.parse(a.created_at);
                const ageDays = Number.isFinite(createdAt)
                  ? Math.floor((now - createdAt) / msPerDay)
                  : 0;
                return { a, sev, ageDays };
              })
              .filter(x => (x.sev === 'high' || x.sev === 'critical') && x.ageDays >= slaDays)
              .sort((x, y) => y.ageDays - x.ageDays);
            const hasBreach = prioritized.length > 0;
            core.setOutput('has_breach', String(hasBreach));
            core.setOutput('breach_count', String(prioritized.length));
            if (hasBreach) {
              core.notice(`Found ${prioritized.length} high/critical alert(s) breaching ${slaDays}-day SLA.`);
            } else {
              core.notice(`No high/critical alerts are beyond ${slaDays}-day SLA.`);
            }

      - name: Open/update SLA issue for high/critical alerts
        id: triage
        if: steps.query.outputs.has_breach == 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Security] Code Scanning alerts breaching ${{ inputs.sla_days || 14 }}d SLA'
          issue-marker: '<!-- security-triage:ref:${{ github.ref }} -->'
          issue-body: |
            <!-- security-triage:type:code-scanning-sla -->
            <!-- security-triage:scope:${{ github.repository }} -->
            <!-- security-triage:ref:${{ github.ref }} -->
            ## Security SLA Alert — Code Scanning

            Found **${{ steps.query.outputs.breach_count }}** open high/critical code scanning alert(s) older than **${{ inputs.sla_days || 14 }} day(s)** and requiring triage.

            **Owner:** @makr-code
            **SLA:** high/critical alert triage within ${{ inputs.sla_days || 14 }} days, mitigation plan within 72h after triage.

            _Source of truth: GitHub Security › Code scanning alerts._
            _Auto-generated by maintenance-issues.yml at ${{ github.run_id }}_
          labels-to-add: 'security,status/needs-approval'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Normalize security label group
        if: steps.query.outputs.has_breach == 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-marker: '<!-- security-triage:ref:${{ github.ref }} -->'
          labels-to-add: 'security,status/needs-approval'
          status-group: 'security,security/critical,status/needs-approval'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Post security recovery update
        if: always() && steps.query.outputs.has_breach != 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-marker: '<!-- security-triage:ref:${{ github.ref }} -->'
          allow-missing: true
          issue-body: |
            ✅ No open high/critical Code Scanning alerts are beyond SLA anymore.

            _Auto-updated by maintenance-issues.yml at ${{ github.run_id }}_
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Normalize security labels on recovery
        if: always() && steps.query.outputs.has_breach != 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-marker: '<!-- security-triage:ref:${{ github.ref }} -->'
          allow-missing: true
          labels-to-add: 'security'
          status-group: 'security,security/critical,status/needs-approval'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Doxygen Header Update (GS3-driven)
  # Uses GS3 findings (missing_doxygen_*) as input to autofix_engine.py,
  # which calls doxygen_fixer_adapter → doxygen_autofix.py --apply.
  # Opens a PR against develop if changes are produced; never pushes directly.
  # Runs weekly on Wednesday 02:30 UTC or on workflow_dispatch.
  # ────────────────────────────────────────────────────────────────────────────
  doxygen-header-update:
    name: "📝 Doxygen Header Update (GS3-driven)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.job == 'doxygen-header-update')
    env:
      TARGET_BRANCH: ${{ github.event_name == 'schedule' && 'develop' || inputs.target_branch || 'develop' }}

    steps:
      - name: Print context
        run: |
          echo "============================================================"
          echo " Maintenance — Doxygen Header Update (GS3-driven)"
          echo "============================================================"
          echo "  Trigger       : ${{ github.event_name }}"
          echo "  Target branch : ${TARGET_BRANCH}"
          echo "  Actor         : ${{ github.actor }}"
          echo "  Run ID        : ${{ github.run_id }}"
          echo "  Timestamp     : $(date -u)"
          echo "============================================================"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python3 -m pip install --quiet --upgrade pip pyyaml

      - name: Prepare output directories
        run: mkdir -p ai_working/gs3 ai_working/doxygen

      - name: Run GS3 doxygen scan
        id: gs3_scan
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          output_json = Path("ai_working/gs3/gap_scan_doxygen.json")
          output_md   = Path("ai_working/gs3/gap_scan_doxygen.md")

          # Run GS3 targeting src and include; doxygen findings are in
          # gs3_step04_quality_cpp_doxygen and will be filtered by type in the next step.
          cmd = [
            "python3", "-m", "tools.gs3", "scan",
            "src", "include",
            "--scan-mode", "thorough",
            "--output", str(output_json),
            "--md-report", str(output_md),
          ]
          print("Running:", " ".join(cmd))
          cp = subprocess.run(cmd)
          exit_code = cp.returncode

          # gs3 returns 0 if findings exist, 1 if no findings; both are valid
          scan_ok = exit_code in (0, 1)
          has_findings = exit_code == 0 and output_json.exists()

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"scan_ok={'true' if scan_ok else 'false'}\n")
            fh.write(f"has_findings={'true' if has_findings else 'false'}\n")
            fh.write(f"exit_code={exit_code}\n")

          if not scan_ok:
            print(f"::error::GS3 doxygen scan failed with exit code {exit_code}")
            sys.exit(exit_code)

          print(f"GS3 doxygen scan finished (exit={exit_code}, findings={'yes' if has_findings else 'no'})")
          PY

      - name: Convert GS3 JSON for autofix_engine input
        id: convert
        if: steps.gs3_scan.outputs.has_findings == 'true'
        run: |
          python3 - <<'PY'
          # autofix_engine.py expects a flat JSON array of findings.
          # GS3 emits {"gaps": [...]}. Extract and filter to doxygen types only.
          import json
          import os
          from pathlib import Path

          src = Path("ai_working/gs3/gap_scan_doxygen.json")
          dst = Path("ai_working/doxygen/autofix_findings.json")

          data = json.loads(src.read_text(encoding="utf-8"))
          gaps = data.get("gaps", [])

          DOXYGEN_TYPES = {
            "missing_doxygen_comment",
            "missing_doxygen_brief",
            "missing_doxygen_param",
            "missing_doxygen_return",
          }
          filtered = [
            {
              "file":     g.get("file", ""),
              "line":     int(g.get("line") or 1),
              "type":     g.get("type", "missing_doxygen_comment"),
              "severity": g.get("severity", "MEDIUM"),
              "message":  g.get("description", ""),
            }
            for g in gaps
            if g.get("type") in DOXYGEN_TYPES
          ]

          dst.write_text(json.dumps(filtered, indent=2, ensure_ascii=False), encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
            fh.write(f"finding_count={len(filtered)}\n")

          print(f"Prepared {len(filtered)} doxygen findings for autofix_engine")
          PY

      - name: Apply doxygen fixes via autofix_engine
        id: autofix
        if: steps.gs3_scan.outputs.has_findings == 'true' && steps.convert.outputs.finding_count != '0'
        env:
          DOXYGEN_USE_OLLAMA: 'false'
        run: |
          python3 tools/fixers/autofix_engine.py \
            --root . \
            --findings ai_working/doxygen/autofix_findings.json \
            --types missing_doxygen_comment,missing_doxygen_brief,missing_doxygen_param,missing_doxygen_return \
            --apply \
            --report ai_working/doxygen/autofix_report.json

      - name: Check for file changes
        id: diff
        if: steps.gs3_scan.outputs.has_findings == 'true'
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No file changes produced by doxygen autofix."
          else
            changed_count=$(git diff --name-only | wc -l | tr -d ' ')
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_count=${changed_count}" >> "$GITHUB_OUTPUT"
            echo "::notice::${changed_count} file(s) modified by doxygen autofix."
            git diff --stat
          fi

      - name: Upload doxygen artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doxygen-autofix-${{ github.run_id }}
          path: |
            ai_working/gs3/gap_scan_doxygen.json
            ai_working/gs3/gap_scan_doxygen.md
            ai_working/doxygen/autofix_findings.json
            ai_working/doxygen/autofix_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Configure git for PR commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR branch and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_COUNT: ${{ steps.diff.outputs.changed_count }}
        run: |
          BRANCH="doxygen/auto-update-${{ github.run_id }}"
          git checkout -b "${BRANCH}"
          git add -u
          git commit -m "chore: auto-update doxygen headers [GS3 maintenance run ${{ github.run_id }}]

          Updated ${CHANGED_COUNT} file(s) with missing Doxygen headers.
          Scanner: gs3_step04_quality_cpp_doxygen
          Fixer: tools/fixers/autofix_engine.py -> doxygen_fixer_adapter -> doxygen_autofix.py
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "${BRANCH}"

          gh pr create \
            --base "${{ env.TARGET_BRANCH }}" \
            --head "${BRANCH}" \
            --title "chore: auto-update doxygen headers [GS3 maintenance]" \
            --body "## Automated Doxygen Header Update

          This PR was auto-generated by the GS3 maintenance workflow.

          **Trigger:** Scheduled GS3 gap scan identified missing Doxygen headers in \`src/\` and \`include/\`.
          **Scope:** Missing \`@brief\`, \`@param\`, \`@return\` tags in public C++ API declarations.
          **Files changed:** ${CHANGED_COUNT}

          ### What was applied
          - Scanner: \`gs3_step04_quality_cpp_doxygen\`
          - Fixer: \`tools/fixers/autofix_engine.py\` -> \`doxygen_fixer_adapter\` -> \`tools/doxygen_autofix.py --apply\`
          - Mode: additions only (no rewriting of existing Doxygen blocks)
          - Ollama: disabled in CI (no remote endpoint available from GitHub Actions)

          ### Review checklist
          - [ ] Verify \`@brief\` descriptions are accurate
          - [ ] Verify \`@param\` names match the actual parameter names
          - [ ] Spot-check 2-3 files for correctness

          _Auto-generated by \`maintenance-issues.yml\` job \`doxygen-header-update\` run \`${{ github.run_id }}\`_" \
            --label "quality,automated" \
            --no-maintainer-edit

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 📝 Doxygen Header Update (GS3-driven)"
            echo ""
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Branch: \`${TARGET_BRANCH}\`"
            echo "- GS3 scan ok: \`${{ steps.gs3_scan.outputs.scan_ok || 'n/a' }}\`"
            echo "- GS3 findings: \`${{ steps.gs3_scan.outputs.has_findings || 'n/a' }}\`"
            echo "- Doxygen findings to fix: \`${{ steps.convert.outputs.finding_count || '0' }}\`"
            echo "- Files changed: \`${{ steps.diff.outputs.changed_count || '0' }}\`"
            echo "- PR opened: \`${{ steps.diff.outputs.changed == 'true' && 'yes' || 'no' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
