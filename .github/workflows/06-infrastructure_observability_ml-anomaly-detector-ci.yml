name: ML Anomaly Detector CI

on:
  workflow_run:
    workflows: ["🚦 Post-Merge Smoke Test"]
    types: [completed]
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/observability/ml_anomaly_detector.cpp'
      - 'include/observability/ml_anomaly_detector.h'
      - 'tests/test_ml_anomaly_detector.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_observability_ml-anomaly-detector-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the MLAnomalyDetector focused test suite.
  # Tests cover:
  #   1. Isolation Forest outlier detection after training
  #   2. Prophet-style (Holt-Winters) seasonal pattern recognition
  #   3. Change-point detection across a batch of observations
  #   4. DBSCAN noise point flagging
  #   5. Anomaly explanation pathway (explainAnomaly: feature_importance, confidence)
  # ---------------------------------------------------------------------------
  ml-anomaly-detector-unit-tests:
    needs: ci-scope-classifier
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule') ||
      needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ML Anomaly Detector tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            librocksdb-dev \
            nlohmann-json3-dev

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_STRICT_BUILD=OFF

      - name: Build MLAnomalyDetector focused test binary
        run: cmake --build build --target test_ml_anomaly_detector_focused -- -j$(nproc)

      - name: Run MLAnomalyDetector unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex MLAnomalyDetectorFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee ml_anomaly_detector_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-anomaly-detector-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/ml_anomaly_detector_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🤖 ML Anomaly Detector – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| OS | ${{ matrix.os }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compiler | ${{ matrix.compiler }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test suite | MLAnomalyDetectorFocusedTests |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "PASSED" build/ml_anomaly_detector_test_output.txt 2>/dev/null; then
            echo "✅ All tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Some tests failed — see artifact for details" >> "$GITHUB_STEP_SUMMARY"
          fi
