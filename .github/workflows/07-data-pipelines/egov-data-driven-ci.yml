name: E-Gov Datengetriebene Tests CI

# Validates the data-driven E-Government test suite (v1.9.0):
#   EGovDataDrivenFocusedTests — Baugenehmigung + BImSchV
#
# Tests are fully self-contained (no external services required):
#   - Fixtures in tests/fixtures/egov/
#   - antraege/*.md  — Markdown + JSON Front-Matter
#   - prozesse/*.json, expected/*.json, behoerden.json — plain JSON
#
# Test groups covered:
#   FixturesWerdenKorrektGeladen
#   MarkdownAntragFrontMatterValide
#   ProzessDefinitionValide
#   AlleFachbehoerdenHabenDMSStores
#   KontrollergebnisseAusFixture
#   PflichtunterlagenVollstaendig
#   OZGDienstAusAntragsFixture
#   XOEVRoundtripAusAntragsFixture
#   EIDAAuthentifizierungAusFixture

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tests/test_egov_data_driven.cpp'
      - 'tests/fixtures/egov/**'
      - 'include/auth/eid_authenticator.h'
      - 'include/document/xdomea_connector.h'
      - 'include/importers/ozg_service_registry.h'
      - 'include/importers/xoev_importer.h'
      - 'include/analytics/llm_process_analyzer.h'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines/egov-data-driven-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/test_egov_data_driven.cpp'
      - 'tests/fixtures/egov/**'
      - 'include/auth/eid_authenticator.h'
      - 'include/document/xdomea_connector.h'
      - 'include/importers/ozg_service_registry.h'
      - 'include/importers/xoev_importer.h'
      - 'include/analytics/llm_process_analyzer.h'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines/egov-data-driven-ci.yml'
  workflow_dispatch:

concurrency:
  group: egov-data-driven-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  egov-data-driven:
    name: E-Gov Datengetriebene Tests – ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: ci-scope-classifier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libgtest-dev libgmock-dev \
            nlohmann-json3-dev

      - name: Configure focused tests
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S tests -B build_egov_dd \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTHEMIS_ROOT_DIR=${{ github.workspace }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build focused test binary
        run: |
          cmake --build build_egov_dd \
            --target test_egov_data_driven_focused \
            -- -j$(nproc)

      - name: Run via ctest
        working-directory: build_egov_dd
        run: |
          ctest --output-on-failure \
            -R "EGovDataDrivenFocusedTests" \
            2>&1 | tee egov_dd_ctest.txt

      - name: Run tests directly
        working-directory: build_egov_dd
        run: |
          ./test_egov_data_driven_focused \
            --gtest_output=xml:egov_dd_gtest.xml \
            2>&1 | tee egov_dd_gtest_output.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egov-data-driven-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          retention-days: 14
          path: |
            build_egov_dd/egov_dd_ctest.txt
            build_egov_dd/egov_dd_gtest.xml
            build_egov_dd/egov_dd_gtest_output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## E-Gov Datengetriebene Tests CI — ${{ matrix.os }} / ${{ matrix.compiler }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suite: EGovDataDrivenFocusedTests" >> $GITHUB_STEP_SUMMARY
          echo "| Verfahren | Fixture | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Baugenehmigung § 63 BauO NRW | antraege/baugenehmigung.md | 8 Tests × 1 Parametrisierung |" >> $GITHUB_STEP_SUMMARY
          echo "| 9. BImSchV Genehmigungsverfahren | antraege/bimschg.md | 8 Tests × 1 Parametrisierung |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fixtures:** Markdown + JSON-Front-Matter (antraege/), reines JSON (prozesse/, expected/, behoerden.json)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 16 parametrisierte Tests (2 Verfahren × 8 Testgruppen)**" >> $GITHUB_STEP_SUMMARY
