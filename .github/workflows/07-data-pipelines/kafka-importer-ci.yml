name: Kafka Importer CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/importers/kafka_importer.cpp'
      - 'include/importers/kafka_importer.h'
      - 'tests/test_kafka_importer.cpp'
      - 'plugins/importers/kafka/plugin.json'
      - '.github/workflows/07-data-pipelines/kafka-importer-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/importers/kafka_importer.cpp'
      - 'include/importers/kafka_importer.h'
      - 'tests/test_kafka_importer.cpp'
      - 'plugins/importers/kafka/plugin.json'
      - '.github/workflows/07-data-pipelines/kafka-importer-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build & run the self-contained Kafka importer unit tests.
  # No live Kafka broker is required – tests use mock injection via
  # setMessageFetchForTesting() / the inline mock in test_kafka_importer.cpp.
  # ---------------------------------------------------------------------------
  kafka-importer-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Kafka importer unit tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            nlohmann-json3-dev librocksdb-dev libssl-dev
            libsimdjson-dev libtbb-dev libboost-system-dev
            libyaml-cpp-dev libcurl4-openssl-dev

      - name: Configure (Kafka importer focused tests)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_PERF_AUTO_ENABLE=OFF

      - name: Build Kafka importer focused test binary
        run: cmake --build build --target test_kafka_importer_focused -- -j$(nproc)

      - name: Run Kafka importer unit tests (37 test cases, no live broker)
        run: |
          cd build
          ./tests/test_kafka_importer_focused \
            --gtest_filter="KafkaImporter*" \
            --gtest_output="xml:kafka_importer_test_results.xml" \
            2>&1 | tee kafka_importer_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-importer-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/kafka_importer_test_results.xml
            build/kafka_importer_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## ☕ Kafka Importer Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "37 test cases using mock injection (no live Kafka broker required)." >> "$GITHUB_STEP_SUMMARY"
          echo "Covers: URL parsing, JSON/Avro/plaintext formats, streaming callback," >> "$GITHUB_STEP_SUMMARY"
          echo "dry-run, permission check, oversized messages, metrics/tracing callbacks." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Validate the Kafka plugin descriptor
  # ---------------------------------------------------------------------------
  kafka-plugin-json-lint:
    needs: ci-scope-classifier
    if: >
      needs.ci-scope-classifier.outputs.has_code_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true'
    name: Validate Kafka plugin.json
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate plugin.json syntax
        run: |
          python3 -c "
          import json, sys
          path = 'plugins/importers/kafka/plugin.json'
          with open(path) as f:
              data = json.load(f)
          # Required fields
          for field in ['name', 'version', 'type', 'description', 'capabilities']:
              if field not in data:
                  print(f'MISSING required field: {field}', file=sys.stderr)
                  sys.exit(1)
          if data.get('type') != 'importer':
              print('ERROR: type must be \"importer\"', file=sys.stderr)
              sys.exit(1)
          caps = data.get('capabilities', {})
          if not caps.get('streaming', False):
              print('ERROR: Kafka importer must advertise streaming=true', file=sys.stderr)
              sys.exit(1)
          print(f'OK: {path} ({data[\"name\"]} v{data[\"version\"]})')
          "

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔌 Kafka Plugin Descriptor" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validates \`plugins/importers/kafka/plugin.json\` JSON syntax" >> "$GITHUB_STEP_SUMMARY"
          echo "- Checks required fields: name, version, type, description, capabilities" >> "$GITHUB_STEP_SUMMARY"
          echo "- Asserts \`type == \"importer\"\` and \`capabilities.streaming == true\`" >> "$GITHUB_STEP_SUMMARY"
