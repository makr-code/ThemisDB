name: Behörden-Genehmigungsverfahren E2E CI

# Validates the Behörden-Genehmigungsverfahren E2E test scenario (v1.9.0):
#   Baugenehmigungsverfahren § 63 BauO NRW with 4 authorities, 6 phases
#
# Acceptance criteria covered:
#   AC-BGV-01  OZG-Dienst für Baugenehmigung ist nach Registrierung abrufbar
#   AC-BGV-02  Antragsteller-eID-Authentifizierung liefert verifizierten Namen
#   AC-BGV-03  Antragsunterlagen (XÖV-XBau) werden korrekt importiert
#   AC-BGV-04  Formale Prüfung erkennt alle Pflichtunterlagen als vorhanden
#   AC-BGV-05  Bauamt erzeugt drei XDOMEA-Vorgänge (je eine Stellungnahme-Anfrage)
#   AC-BGV-06  Denkmalschutzbehörde empfängt und verarbeitet ihren Vorgang
#   AC-BGV-07  Umweltamt empfängt und verarbeitet seinen Vorgang
#   AC-BGV-08  Feuerwehr empfängt und verarbeitet ihren Vorgang
#   AC-BGV-09  Alle drei Fachbehörden liefern Stellungnahme-Dokumente zurück
#   AC-BGV-10  Bauamt aggregiert Stellungnahmen und erzeugt LLM-Entscheidung
#   AC-BGV-11  Finaler Bescheid (XDOMEA DOKUMENT) wird im DMS des Bauamts gespeichert
#   AC-BGV-12  Bescheid enthält korrekte Aktenzeichen-Referenz
#   AC-BGV-13  Gesamtprozess endet mit Status GENEHMIGT oder ABGELEHNT
#   AC-BGV-14  XDOMEA-Export des Bescheids ist wohlgeformt (non-empty XML)
#   AC-BGV-15  Antragsteller erhält XDOMEA-Bescheid in seiner Akte
#   AC-BGV-16  Alle Behörden-XDOMEA-Stores haben die erwarteten Dokumentzahlen
#   AC-BGV-17  LLM-Konformitätsprüfung des Gesamtverfahrens liefert score >= 0.5
#   AC-BGV-18  Prozessschritte sind in korrekter Reihenfolge protokolliert
#   AC-BGV-19  Thread-sichere Verarbeitung paralleler Stellungnahmen
#   AC-BGV-20  XÖV-XBau-Export der Antragsunterlagen ist wohlgeformt

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tests/test_behoerden_genehmigungsverfahren_e2e.cpp'
      - 'include/auth/eid_authenticator.h'
      - 'include/document/xdomea_connector.h'
      - 'include/importers/ozg_service_registry.h'
      - 'include/importers/xoev_importer.h'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines/behoerden-genehmigungsverfahren-e2e-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/test_behoerden_genehmigungsverfahren_e2e.cpp'
      - 'include/auth/eid_authenticator.h'
      - 'include/document/xdomea_connector.h'
      - 'include/importers/ozg_service_registry.h'
      - 'include/importers/xoev_importer.h'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines/behoerden-genehmigungsverfahren-e2e-ci.yml'
  workflow_dispatch:

concurrency:
  group: behoerden-genehmigungsverfahren-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  behoerden-genehmigungsverfahren-e2e:
    name: Behörden-Genehmigungsverfahren E2E – ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: ci-scope-classifier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libgtest-dev libgmock-dev

      - name: Configure focused tests
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S tests -B build_bgv \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTHEMIS_ROOT_DIR=${{ github.workspace }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build focused test binary
        run: |
          cmake --build build_bgv \
            --target test_behoerden_genehmigungsverfahren_e2e_focused \
            -- -j$(nproc)

      - name: Run via ctest
        working-directory: build_bgv
        run: |
          ctest --output-on-failure \
            -R "BehoerdenGenehmigungsverfahrenE2EFocusedTests" \
            2>&1 | tee bgv_ctest.txt

      - name: Run tests directly
        working-directory: build_bgv
        run: |
          ./test_behoerden_genehmigungsverfahren_e2e_focused \
            --gtest_output=xml:bgv_gtest.xml \
            2>&1 | tee bgv_gtest_output.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behoerden-genehmigung-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          retention-days: 14
          path: |
            build_bgv/bgv_ctest.txt
            build_bgv/bgv_gtest.xml
            build_bgv/bgv_gtest_output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## Behörden-Genehmigungsverfahren E2E CI — ${{ matrix.os }} / ${{ matrix.compiler }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suite: BehoerdenGenehmigungsverfahrenE2EFocusedTests" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Tests | Scope |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| BehoerdenGenehmigungsverfahren | 20 (AC-BGV-01..20) | Baugenehmigung § 63 BauO NRW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Behörden:** Bauamt Köln, Denkmalschutz NRW, Umweltamt, Feuerwehr" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 20 acceptance-criteria tests**" >> $GITHUB_STEP_SUMMARY
