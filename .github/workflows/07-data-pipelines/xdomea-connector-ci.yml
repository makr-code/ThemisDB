name: XDOMEA Connector CI

# Validates XDOMEA Document Management Connector (v1.2.0):
#   - XDOMEADocument, XDOMEAImportResult, XDOMEAExportResult
#   - IXDOMEAConnector, InMemoryXDOMEAConnector
#   - XDOMEA 2.1 / 3.0 (KoSIT) message types 0201, 0202, 0203, 0401, 0501, 0601
#
# Acceptance criteria covered:
#   AC-XDM-01  Empty connector has count() == 0
#   AC-XDM-02  storeDocument() adds a document; count() == 1
#   AC-XDM-03  storeDocument() throws on empty ID
#   AC-XDM-04  storeDocument() throws on duplicate ID
#   AC-XDM-05  getDocument() returns nullopt for unknown ID
#   AC-XDM-06  getDocument() returns the correct document after storage
#   AC-XDM-07  removeDocument() removes a known document
#   AC-XDM-08  removeDocument() is a no-op for unknown IDs
#   AC-XDM-09  listByType() returns only documents of the requested type
#   AC-XDM-10  listByType() returns empty vector when no match
#   AC-XDM-11  listByRetention() returns only matching documents
#   AC-XDM-12  listByRetention() returns empty for no match
#   AC-XDM-13  listChildren() returns documents with matching parent_id
#   AC-XDM-14  listChildren() returns empty for unknown parent
#   AC-XDM-15  importFromXML() returns failure on empty XML
#   AC-XDM-16  importFromXML() parses a single <dokument> element
#   AC-XDM-17  importFromXML() extracts id, betreff, aktenzeichen fields
#   AC-XDM-18  importFromXML() parses <akte> elements as AKTE type
#   AC-XDM-19  importFromXML() persists documents to store
#   AC-XDM-20  importFromXML() reports error on unclosed element
#   AC-XDM-21  exportToXML() returns success with empty document list
#   AC-XDM-22  exportToXML() serialises DOKUMENT objects correctly
#   AC-XDM-23  exportToXML() serialises AKTE objects correctly
#   AC-XDM-24  exportToXML() XML-escapes special characters
#   AC-XDM-25  exportToXML() includes XDOMEA version attribute
#   AC-XDM-26  exportToXML() includes message-type code in root element
#   AC-XDM-27  XDOMEADocument::parent_id is preserved on getDocument()
#   AC-XDM-28  XDOMEADocument::keywords are preserved
#   AC-XDM-29  Concurrent storeDocument() calls are thread-safe
#   AC-XDM-30  Polymorphic usage via IXDOMEAConnector*

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/document/xdomea_connector.h'
      - 'tests/test_xdomea_connector.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines/xdomea-connector-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/document/xdomea_connector.h'
      - 'tests/test_xdomea_connector.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines/xdomea-connector-ci.yml'
  workflow_dispatch:

concurrency:
  group: xdomea-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  xdomea-connector:
    name: XDOMEA Connector – ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: ci-scope-classifier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libgtest-dev libgmock-dev

      - name: Configure focused tests
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S tests -B build_xdomea \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTHEMIS_ROOT_DIR=${{ github.workspace }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build focused test binary
        run: |
          cmake --build build_xdomea --target test_xdomea_connector_focused -- -j$(nproc)

      - name: Run via ctest
        working-directory: build_xdomea
        run: |
          ctest --output-on-failure \
            -R "XDOMEAConnectorFocusedTests" \
            2>&1 | tee xdomea_ctest.txt

      - name: Run tests directly
        working-directory: build_xdomea
        run: |
          ./test_xdomea_connector_focused \
            --gtest_output=xml:xdomea_gtest.xml \
            2>&1 | tee xdomea_gtest_output.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdomea-connector-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          retention-days: 14
          path: |
            build_xdomea/xdomea_ctest.txt
            build_xdomea/xdomea_gtest.xml
            build_xdomea/xdomea_gtest_output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## XDOMEA Connector CI — ${{ matrix.os }} / ${{ matrix.compiler }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suite: XDOMEAConnectorFocusedTests" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| XDOMEAConnector | 30 (AC-XDM-01..30) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 30 acceptance-criteria tests**" >> $GITHUB_STEP_SUMMARY
