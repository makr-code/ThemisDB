name: 9. BImSchV Genehmigungsverfahren E2E CI

# Validates the 9. BImSchV Genehmigungsverfahren E2E test scenario (v1.9.0):
#   Förmliches Genehmigungsverfahren § 10 BImSchG i. V. m. 9. BImSchV
#   Großbiogasanlage > 10 MW FWL, UVP-pflichtig, 8 Behörden, 9 Phasen
#
# Acceptance criteria covered:
#   AC-BIM-01  OZG-Dienst für BImSchG-Genehmigung ist nach Registrierung abrufbar
#   AC-BIM-02  Betreiber-eID-Authentifizierung liefert verifizierten Namen (HIGH)
#   AC-BIM-03  Betreiber-eID enthält korrekte AGS (Düsseldorf 05111000)
#   AC-BIM-04  XÖV-OTHER-Antrag wird korrekt importiert (importFromXML)
#   AC-BIM-05  XÖV-Export des Antrags ist wohlgeformt und vollständig
#   AC-BIM-06  RP erzeugt XDOMEA-Verfahrensakte (AKTE) mit korrektem Aktenzeichen
#   AC-BIM-07  LLM-Vollständigkeitsprüfung gibt score >= 0.5 zurück
#   AC-BIM-08  Verfahrensart wird auf FOERMLICH gesetzt
#   AC-BIM-09  UVP-Vorprüfungsdokument wird im DMS des RP gespeichert
#   AC-BIM-10  LANUV erhält UVP-Screening-Anfrage als XDOMEA-Vorgang
#   AC-BIM-11  LANUV liefert UVP-Screening-Stellungnahme (UVP_PFLICHTIG)
#   AC-BIM-12  RP erzeugt Antragskonferenz-Protokoll (XDOMEA-DOKUMENT)
#   AC-BIM-13  Alle 7 Fachbehörden erhalten Antragskonferenz-Einladung (VORGANG)
#   AC-BIM-14  Auslegungsbekanntmachung wird im RP-DMS gespeichert
#   AC-BIM-15  3 Einwendungen werden als XDOMEA-Dokumente erfasst
#   AC-BIM-16  Alle 7 Fachbehörden liefern Stellungnahmen (parallel, thread-sicher)
#   AC-BIM-17  Gesundheitsamt-Stellungnahme enthält Lärmprüfungs-Metadaten
#   AC-BIM-18  Gewerbeaufsicht-Stellungnahme enthält Auflagen-Metadaten
#   AC-BIM-19  Erörterungstermin-Protokoll wird im RP-DMS gespeichert
#   AC-BIM-20  Erörterungstermin-Protokoll referenziert alle Einwendungen
#   AC-BIM-21  LLM-Entscheidungsanalyse liefert score >= 0.5
#   AC-BIM-22  LLM-Entscheidungsempfehlung enthält Summary (nicht leer)
#   AC-BIM-23  Genehmigungsbescheid wird als XDOMEA-DOKUMENT im RP-DMS erzeugt
#   AC-BIM-24  Genehmigungsbescheid enthält korrektes Aktenzeichen
#   AC-BIM-25  Genehmigungsbescheid enthält alle 7 Nebenbestimmungen (Auflagen)
#   AC-BIM-26  XDOMEA-Export des Genehmigungsbescheids ist wohlgeformt
#   AC-BIM-27  Zustellung des Bescheids an Betreiber via XDOMEA
#   AC-BIM-28  RP-DMS enthält nach Abschluss >= 12 Dokumente
#   AC-BIM-29  Prozessschritte sind in korrekter 9-Phasen-Reihenfolge protokolliert
#   AC-BIM-30  Gesamtverfahren endet mit Status GENEHMIGT

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tests/test_bimschv_genehmigungsverfahren_e2e.cpp'
      - 'include/auth/eid_authenticator.h'
      - 'include/document/xdomea_connector.h'
      - 'include/importers/ozg_service_registry.h'
      - 'include/importers/xoev_importer.h'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines/bimschv-genehmigungsverfahren-e2e-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tests/test_bimschv_genehmigungsverfahren_e2e.cpp'
      - 'include/auth/eid_authenticator.h'
      - 'include/document/xdomea_connector.h'
      - 'include/importers/ozg_service_registry.h'
      - 'include/importers/xoev_importer.h'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines/bimschv-genehmigungsverfahren-e2e-ci.yml'
  workflow_dispatch:

concurrency:
  group: bimschv-genehmigungsverfahren-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  bimschv-genehmigungsverfahren-e2e:
    name: 9. BImSchV Genehmigungsverfahren E2E – ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: ci-scope-classifier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libgtest-dev libgmock-dev

      - name: Configure focused tests
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S tests -B build_bimschv \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTHEMIS_ROOT_DIR=${{ github.workspace }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build focused test binary
        run: |
          cmake --build build_bimschv \
            --target test_bimschv_genehmigungsverfahren_e2e_focused \
            -- -j$(nproc)

      - name: Run via ctest
        working-directory: build_bimschv
        run: |
          ctest --output-on-failure \
            -R "BImSchVGenehmigungsverfahrenE2EFocusedTests" \
            2>&1 | tee bimschv_ctest.txt

      - name: Run tests directly
        working-directory: build_bimschv
        run: |
          ./test_bimschv_genehmigungsverfahren_e2e_focused \
            --gtest_output=xml:bimschv_gtest.xml \
            2>&1 | tee bimschv_gtest_output.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bimschv-genehmigung-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          retention-days: 14
          path: |
            build_bimschv/bimschv_ctest.txt
            build_bimschv/bimschv_gtest.xml
            build_bimschv/bimschv_gtest_output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## 9. BImSchV Genehmigungsverfahren E2E CI — ${{ matrix.os }} / ${{ matrix.compiler }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suite: BImSchVGenehmigungsverfahrenE2EFocusedTests" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Tests | Scope |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| BImSchVGenehmigungsverfahren | 30 (AC-BIM-01..30) | § 10 BImSchG förmlich |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Behörden (8):** RP Düsseldorf, LANUV NRW, Staatliches Umweltamt, Gesundheitsamt, Bauaufsicht, Gewerbeaufsicht, Untere Wasserbehörde, Untere Naturschutzbehörde" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Phasen (9):** Antragstellung → Vollständigkeitsprüfung → UVP-Vorprüfung → Antragskonferenz → Auslegung → Fachbehörden-Prüfung → Erörterungstermin → Entscheidung → Genehmigungsbescheid" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 30 acceptance-criteria tests**" >> $GITHUB_STEP_SUMMARY
