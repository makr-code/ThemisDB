name: CMake on multiple platforms

on:
  workflow_dispatch:
    inputs:
      sanitizer:
        description: "Run additional sanitizer job (asan | ubsan | none)"
        required: false
        default: "none"
        type: choice
        options: ["none", "asan", "ubsan", "both"]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-unresolved-failures:
    name: Detect unresolved CI failures
    runs-on: ubuntu-latest
    outputs:
      requires_approval: ${{ steps.detect.outputs.requires_approval }}
      blocking_issue_count: ${{ steps.detect.outputs.blocking_issue_count }}
      blocking_issue_numbers: ${{ steps.detect.outputs.blocking_issue_numbers }}
    steps:
      - name: Detect approval-blocking CI issues
        id: detect
        uses: actions/github-script@v8
        with:
          script: |
            const workflowName = context.workflow;
            const refName = context.ref.replace('refs/heads/', '');
            const markerWorkflow = `<!-- ci-workflow:${workflowName} -->`;
            const markerRef = `<!-- ci-ref:${refName} -->`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci/failure,status/needs-approval',
              per_page: 100,
            });

            const blocking = issues.filter(issue => {
              const body = issue.body || '';
              return body.includes(markerWorkflow) && body.includes(markerRef);
            });

            core.setOutput('requires_approval', 'false');
            core.setOutput('blocking_issue_count', String(blocking.length));
            core.setOutput('blocking_issue_numbers', blocking.map(issue => `#${issue.number}`).join(', '));

            const summary = [
              '## CI approval gate preflight',
              '',
              `- workflow: ${workflowName}`,
              `- ref: ${refName}`,
              `- requires_approval: ${blocking.length > 0 ? 'true' : 'false'}`,
              `- blocking_issues: ${blocking.length > 0 ? blocking.map(issue => `#${issue.number}`).join(', ') : 'none'}`,
            ].join('\n');

            core.summary.addRaw(summary).write();

  approval-gate:
    name: Await maintainer approval
    needs: detect-unresolved-failures
    if: needs.detect-unresolved-failures.outputs.requires_approval == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ci-approved
    steps:
      - name: Record approval context
        run: |
          echo "Blocking CI issue count: ${{ needs.detect-unresolved-failures.outputs.blocking_issue_count }}"
          echo "Blocking CI issues: ${{ needs.detect-unresolved-failures.outputs.blocking_issue_numbers }}"
          echo "Approval granted via environment ci-approved."

  build:
    needs:
      - detect-unresolved-failures
      - approval-gate
    if: needs.detect-unresolved-failures.outputs.requires_approval != 'true' || needs.approval-gate.result == 'success'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - uses: actions/checkout@v5

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            librocksdb-dev \
            libgtest-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libtbb-dev \
            libyaml-cpp-dev \
            libmimalloc-dev \
            libcurl4-openssl-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc \
            libpugixml-dev

      - name: Install Windows build prerequisites
        if: runner.os == 'Windows'
        run: |
          choco install -y ninja cmake

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path "$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake")) {
            Write-Host "Using pre-installed vcpkg at $env:VCPKG_INSTALLATION_ROOT"
            echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Host "Pre-installed vcpkg not found; cloning from source..."
            $vcpkgDir = "${{ github.workspace }}\vcpkg"
            if (-not (Test-Path $vcpkgDir)) {
              git clone --depth=1 https://github.com/microsoft/vcpkg.git $vcpkgDir
            }
            & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
            echo "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B "${{ steps.strings.outputs.build-output-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          "-DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed"
          -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

  sanitizer-asan:
    name: "ASan (Linux, GCC, community preset)"
    needs:
      - detect-unresolved-failures
      - approval-gate
    if: >
      (needs.detect-unresolved-failures.outputs.requires_approval != 'true' || needs.approval-gate.result == 'success') &&
      (github.event.inputs.sanitizer == 'asan' || github.event.inputs.sanitizer == 'both')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasan8 \
            librocksdb-dev \
            libgtest-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libtbb-dev \
            libyaml-cpp-dev \
            libmimalloc-dev \
            libcurl4-openssl-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc \
            libpugixml-dev

      - name: Configure (ASan)
        run: cmake --preset community-asan -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc

      - name: Build (ASan)
        run: cmake --build --preset community-asan --parallel $(nproc)

      - name: Test (ASan)
        env:
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=1"
        run: ctest --preset community-asan --output-on-failure --timeout 120

  sanitizer-ubsan:
    name: "UBSan (Linux, GCC, community preset)"
    needs:
      - detect-unresolved-failures
      - approval-gate
    if: >
      (needs.detect-unresolved-failures.outputs.requires_approval != 'true' || needs.approval-gate.result == 'success') &&
      (github.event.inputs.sanitizer == 'ubsan' || github.event.inputs.sanitizer == 'both')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            librocksdb-dev \
            libgtest-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libtbb-dev \
            libyaml-cpp-dev \
            libmimalloc-dev \
            libcurl4-openssl-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc \
            libpugixml-dev

      - name: Configure (UBSan)
        run: cmake --preset community-ubsan -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc

      - name: Build (UBSan)
        run: cmake --build --preset community-ubsan --parallel $(nproc)

      - name: Test (UBSan)
        env:
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: ctest --preset community-ubsan --output-on-failure --timeout 120

  report-failure:
    name: Create or update CI failure issues
    needs:
      - build
      - sanitizer-asan
      - sanitizer-ubsan
    if: >
      always() &&
      (needs.build.result == 'failure' || needs.sanitizer-asan.result == 'failure' || needs.sanitizer-ubsan.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Create or update failure issues
        uses: actions/github-script@v8
        with:
          script: |
            const workflowName = context.workflow;
            const refName = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString();

            const labelCatalog = {
              'ci/failure': { color: 'B60205', description: 'Automated CI failure tracker issue.' },
              'ci/build': { color: 'D93F0B', description: 'CI build step failed.' },
              'ci/test': { color: 'FBCA04', description: 'CI test step failed.' },
              'ci/sanitizer': { color: '5319E7', description: 'Sanitizer CI job failed.' },
              'os/linux': { color: '0E8A16', description: 'Failure observed on Linux runners.' },
              'os/windows': { color: '1D76DB', description: 'Failure observed on Windows runners.' },
              'compiler/gcc': { color: '0052CC', description: 'Failure observed with GCC.' },
              'compiler/clang': { color: '006B75', description: 'Failure observed with Clang.' },
              'compiler/msvc': { color: '5319E7', description: 'Failure observed with MSVC.' },
              'status/needs-approval': { color: 'BFD4F2', description: 'Subsequent manual runs require maintainer approval.' },
              'status/fixed': { color: '0E8A16', description: 'Tracked CI failure has been fixed by a successful rerun.' },
            };

            async function ensureLabel(name) {
              const config = labelCatalog[name];
              if (!config) {
                return;
              }

              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: config.color,
                    description: config.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

            async function ensureLabels(labels) {
              for (const label of labels) {
                await ensureLabel(label);
              }
            }

            function parseJob(job) {
              const labels = new Set(['ci/failure', 'status/needs-approval']);
              const lowerName = job.name.toLowerCase();
              let primaryClass = 'ci/build';
              let platform = 'unknown';
              let compiler = 'unknown';

              if (lowerName.includes('asan') || lowerName.includes('ubsan')) {
                primaryClass = 'ci/sanitizer';
                labels.add('ci/sanitizer');
                platform = 'linux';
                compiler = 'gcc';
              }

              const failedSteps = (job.steps || []).filter(step => step.conclusion === 'failure').map(step => step.name);
              const lowerFailedSteps = failedSteps.map(step => step.toLowerCase());

              if (lowerName.includes('windows') || lowerName.includes('msvc')) {
                platform = 'windows';
              } else if (lowerName.includes('ubuntu') || lowerName.includes('linux')) {
                platform = 'linux';
              }

              if (lowerName.includes('clang')) {
                compiler = 'clang';
              } else if (lowerName.includes('gcc')) {
                compiler = 'gcc';
              } else if (lowerName.includes('cl)') || lowerName.endsWith(' cl') || lowerName.includes(', cl')) {
                compiler = 'msvc';
              } else if (lowerName.includes('msvc') || lowerName.includes('visual studio')) {
                compiler = 'msvc';
              }

              if (primaryClass !== 'ci/sanitizer') {
                if (lowerFailedSteps.some(step => step.includes('test'))) {
                  primaryClass = 'ci/test';
                  labels.add('ci/test');
                } else {
                  primaryClass = 'ci/build';
                  labels.add('ci/build');
                }
              } else if (lowerFailedSteps.some(step => step.includes('test'))) {
                labels.add('ci/test');
              } else if (lowerFailedSteps.some(step => step.includes('build'))) {
                labels.add('ci/build');
              }

              if (platform === 'linux') {
                labels.add('os/linux');
              } else if (platform === 'windows') {
                labels.add('os/windows');
              }

              if (compiler === 'gcc') {
                labels.add('compiler/gcc');
              } else if (compiler === 'clang') {
                labels.add('compiler/clang');
              } else if (compiler === 'msvc') {
                labels.add('compiler/msvc');
              }

              const signature = [workflowName, refName, primaryClass, platform, compiler].join('|');
              const title = `[CI FAILURE] ${workflowName} | ${refName} | ${primaryClass} | ${platform} | ${compiler}`;

              return {
                failedSteps,
                labels: Array.from(labels),
                platform,
                compiler,
                primaryClass,
                signature,
                title,
              };
            }

            function isRelevantCiJob(jobName) {
              const lowerName = jobName.toLowerCase();
              return lowerName.startsWith('build (') || lowerName.includes('asan (') || lowerName.includes('ubsan (');
            }

            function issueBody(job, metadata) {
              const failedSteps = metadata.failedSteps.length > 0 ? metadata.failedSteps.join(', ') : 'unknown';
              const labelsLine = metadata.labels.join(', ');
              return [
                `<!-- ci-failure-signature:${metadata.signature} -->`,
                `<!-- ci-workflow:${workflowName} -->`,
                `<!-- ci-ref:${refName} -->`,
                '# CI failure tracker',
                '',
                'This issue is maintained automatically by `.github/workflows/cmake-multi-platform.yml`.',
                '',
                '| Field | Value |',
                '| --- | --- |',
                `| Workflow | ${workflowName} |`,
                `| Run number | ${context.runNumber} |`,
                `| Run URL | ${runUrl} |`,
                `| Branch / ref | ${refName} |`,
                `| Commit SHA | ${context.sha} |`,
                `| Failing job | ${job.name} |`,
                `| Failing step(s) | ${failedSteps} |`,
                `| Job conclusion | ${job.conclusion || 'unknown'} |`,
                `| Job URL | ${job.html_url || runUrl} |`,
                `| Timestamp (UTC) | ${timestamp} |`,
                `| Signature | ${metadata.signature} |`,
                '',
                `Applied labels: ${labelsLine}`,
                '',
                '## Quick triage checklist',
                '',
                '- [ ] Inspect the linked workflow run and failing step output.',
                '- [ ] Reproduce the failure locally or in a targeted rerun.',
                '- [ ] Decide whether the failure is build, test, or sanitizer specific.',
                '- [ ] Keep `status/needs-approval` until a maintainer approves the next compile run.',
                '- [ ] Close the issue only after a successful validation run clears the state automatically.',
              ].join('\n');
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const failedJobs = jobs.filter(job => job.conclusion === 'failure' && isRelevantCiJob(job.name));
            if (failedJobs.length === 0) {
              core.notice('No failed jobs found for this run; nothing to report.');
              return;
            }

            const openFailureIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci/failure',
              per_page: 100,
            });

            const processed = [];
            for (const job of failedJobs) {
              const metadata = parseJob(job);
              await ensureLabels(metadata.labels);

              const marker = `<!-- ci-failure-signature:${metadata.signature} -->`;
              const existing = openFailureIssues.find(issue => (issue.body || '').includes(marker));
              const body = issueBody(job, metadata);
              const commentBody = [
                `Recurring failure detected for signature \\`${metadata.signature}\\`.`,
                '',
                `- run: #${context.runNumber}`,
                `- run_url: ${runUrl}`,
                `- job: ${job.name}`,
                `- failing_steps: ${metadata.failedSteps.length > 0 ? metadata.failedSteps.join(', ') : 'unknown'}`,
                `- observed_at_utc: ${timestamp}`,
              ].join('\n');

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title: metadata.title,
                  body,
                  state: 'open',
                });
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  labels: metadata.labels,
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: commentBody,
                });
                processed.push(`updated #${existing.number} (${metadata.signature})`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: metadata.title,
                  body,
                  labels: metadata.labels,
                });
                processed.push(`created #${created.data.number} (${metadata.signature})`);
              }
            }

            const summary = ['## CI failure issue sync', '', ...processed.map(line => `- ${line}`)].join('\n');
            core.summary.addRaw(summary).write();

  clear-failure-state:
    name: Clear resolved CI failure issues
    needs:
      - build
      - sanitizer-asan
      - sanitizer-ubsan
    if: >
      always() &&
      needs.build.result == 'success' &&
      (needs.sanitizer-asan.result == 'success' || needs.sanitizer-asan.result == 'skipped') &&
      (needs.sanitizer-ubsan.result == 'success' || needs.sanitizer-ubsan.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Close approval-blocking issues for successful signatures
        uses: actions/github-script@v8
        with:
          script: |
            const workflowName = context.workflow;
            const refName = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString();

            const labelCatalog = {
              'status/fixed': { color: '0E8A16', description: 'Tracked CI failure has been fixed by a successful rerun.' },
            };

            async function ensureLabel(name) {
              const config = labelCatalog[name];
              if (!config) {
                return;
              }
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color: config.color,
                    description: config.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

            function jobPlatform(jobName) {
              const lowerName = jobName.toLowerCase();
              if (lowerName.includes('windows') || lowerName.includes('msvc')) {
                return 'windows';
              }
              return 'linux';
            }

            function jobCompiler(jobName) {
              const lowerName = jobName.toLowerCase();
              if (lowerName.includes('clang')) {
                return 'clang';
              }
              if (lowerName.includes('cl)') || lowerName.endsWith(' cl') || lowerName.includes(', cl') || lowerName.includes('msvc')) {
                return 'msvc';
              }
              return 'gcc';
            }

            function isRelevantCiJob(jobName) {
              const lowerName = jobName.toLowerCase();
              return lowerName.startsWith('build (') || lowerName.includes('asan (') || lowerName.includes('ubsan (');
            }

            function signaturesForSuccessfulJob(job) {
              const platform = jobPlatform(job.name);
              const compiler = jobCompiler(job.name);
              const lowerName = job.name.toLowerCase();
              if (lowerName.includes('asan') || lowerName.includes('ubsan')) {
                return [[workflowName, refName, 'ci/sanitizer', platform, compiler].join('|')];
              }
              return [
                [workflowName, refName, 'ci/build', platform, compiler].join('|'),
                [workflowName, refName, 'ci/test', platform, compiler].join('|'),
              ];
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });

            const successfulJobs = jobs.filter(job => job.conclusion === 'success' && isRelevantCiJob(job.name));
            const successfulSignatures = new Set(successfulJobs.flatMap(signaturesForSuccessfulJob));

            if (successfulSignatures.size === 0) {
              core.notice('No successful CI signatures detected for issue cleanup.');
              return;
            }

            await ensureLabel('status/fixed');

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci/failure,status/needs-approval',
              per_page: 100,
            });

            const markerWorkflow = `<!-- ci-workflow:${workflowName} -->`;
            const markerRef = `<!-- ci-ref:${refName} -->`;
            const resolved = [];

            for (const issue of openIssues) {
              const body = issue.body || '';
              if (!body.includes(markerWorkflow) || !body.includes(markerRef)) {
                continue;
              }

              const signatureLine = body.split('\n').find(line => line.startsWith('<!-- ci-failure-signature:'));
              if (!signatureLine) {
                continue;
              }

              const signature = signatureLine
                .replace('<!-- ci-failure-signature:', '')
                .replace(' -->', '')
                .trim();

              if (!successfulSignatures.has(signature)) {
                continue;
              }

              const existingLabels = (issue.labels || []).map(label => typeof label === 'string' ? label : label.name).filter(Boolean);
              const nextLabels = Array.from(new Set(existingLabels.filter(label => label !== 'status/needs-approval').concat('status/fixed')));

              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: nextLabels,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  'Successful validation cleared the approval block for this CI signature.',
                  '',
                  `- run: #${context.runNumber}`,
                  `- run_url: ${runUrl}`,
                  `- resolved_at_utc: ${timestamp}`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
              resolved.push(`#${issue.number} (${signature})`);
            }

            const summary = ['## CI failure cleanup', '', resolved.length > 0 ? resolved.map(line => `- closed ${line}`).join('\n') : '- no matching open CI failure issues to close'].join('\n');
            core.summary.addRaw(summary).write();
