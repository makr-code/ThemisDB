# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/*
      - cmake/*/**
      - include/*
      - include/*/**
      - src/*
      - src/*/**
      - tests/*
      - tests/*/**
      - .github/workflows/cmake-multi-platform.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

  cross-toolchain-triplet-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-linux
            system_name: Linux
            system_processor: x86_64
            toolchain_file: cmake/platforms/Toolchains/amd64-linux-gnu.cmake
            vcpkg_target_triplet: x64-linux
            cmake_sysroot: ""
          - name: arm64-linux
            system_name: Linux
            system_processor: aarch64
            toolchain_file: cmake/platforms/Toolchains/arm64-linux-gnu.cmake
            vcpkg_target_triplet: arm64-linux
            cmake_sysroot: /tmp/themisdb-sysroots/arm64
          - name: armv7-linux
            system_name: Linux
            system_processor: armv7l
            toolchain_file: cmake/platforms/Toolchains/armv7-linux-gnueabihf.cmake
            vcpkg_target_triplet: arm-linux
            cmake_sysroot: /tmp/themisdb-sysroots/armv7
          - name: x64-windows
            system_name: Windows
            system_processor: x86_64
            toolchain_file: cmake/platforms/Toolchains/windows-msvc.cmake
            vcpkg_target_triplet: x64-windows
            cmake_sysroot: ""
          - name: x64-mingw-static
            system_name: Windows
            system_processor: x86_64
            toolchain_file: cmake/platforms/Toolchains/x86_64-w64-mingw32.cmake
            vcpkg_target_triplet: x64-mingw-static
            cmake_sysroot: ""
    name: Validate ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic sysroot
        shell: bash
        run: |
          if [ -n "${{ matrix.cmake_sysroot }}" ]; then
            mkdir -p "${{ matrix.cmake_sysroot }}"
          fi
      - name: Validate toolchain/triplet consistency
        shell: bash
        run: |
          cmake \
            -DCMAKE_CROSSCOMPILING=TRUE \
            -DCMAKE_SYSTEM_NAME="${{ matrix.system_name }}" \
            -DCMAKE_SYSTEM_PROCESSOR="${{ matrix.system_processor }}" \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/${{ matrix.toolchain_file }}" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg_target_triplet }}" \
            -DCMAKE_SYSROOT="${{ matrix.cmake_sysroot }}" \
            -P "${{ github.workspace }}/cmake/validation/CrossCompileValidation.cmake"
