# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/*
      - cmake/*/**
      - include/*
      - include/*/**
      - src/*
      - src/*/**
      - tests/*
      - tests/*/**
      - .github/workflows/cmake-multi-platform.yml
  workflow_dispatch:
    inputs:
      sanitizer:
        description: "Run additional sanitizer job (asan | ubsan | none)"
        required: false
        default: "none"
        type: choice
        options: ["none", "asan", "ubsan", "both"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          librocksdb-dev \
          libgtest-dev \
          libssl-dev \
          zlib1g-dev \
          libzstd-dev \
          libfmt-dev \
          libspdlog-dev \
          nlohmann-json3-dev \
          libtbb-dev \
          libyaml-cpp-dev \
          libmimalloc-dev \
          libcurl4-openssl-dev \
          libboost-system-dev \
          libboost-filesystem-dev \
          libgrpc++-dev \
          libprotobuf-dev \
          protobuf-compiler-grpc

    - name: Install Windows build prerequisites
      if: runner.os == 'Windows'
      run: |
        choco install -y ninja cmake

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Test-Path "vcpkg")) {
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
        }
        echo "VCPKG_ROOT=$(Get-Location)/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-windows
        -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

  # ---------------------------------------------------------------------------
  # Sanitizer jobs — SEC-CC-4 companion (AddressSanitizer + UBSan)
  #
  # Triggered automatically on every push/PR to develop (using the
  # community-asan / community-ubsan presets which need no vcpkg but do require
  # the Linux system packages installed below).
  # Can also be triggered manually via workflow_dispatch with sanitizer=asan/ubsan/both.
  #
  # These jobs complement the Release hardening flags (stack-protector, PIE,
  # FORTIFY_SOURCE, RELRO) by catching memory-safety and undefined-behavior
  # bugs at development time before they reach production.
  # See: docs/de/security/COMPILER_SECURITY_HARDENING.md
  # ---------------------------------------------------------------------------
  sanitizer-asan:
    name: "ASan (Linux, GCC, community preset)"
    runs-on: ubuntu-latest
    # Run on push/PR to develop, or when workflow_dispatch requests asan/both
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.sanitizer == 'asan' ||
      inputs.sanitizer == 'both'

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libasan8 \
          librocksdb-dev \
          libgtest-dev \
          libssl-dev \
          zlib1g-dev \
          libzstd-dev \
          libfmt-dev \
          libspdlog-dev \
          nlohmann-json3-dev \
          libtbb-dev \
          libyaml-cpp-dev \
          libmimalloc-dev \
          libcurl4-openssl-dev \
          libboost-system-dev \
          libboost-filesystem-dev \
          libgrpc++-dev \
          libprotobuf-dev \
          protobuf-compiler-grpc

    - name: Configure (ASan)
      run: cmake --preset community-asan -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc

    - name: Build (ASan)
      run: cmake --build --preset community-asan --parallel $(nproc)

    - name: Test (ASan)
      env:
        ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=1"
      run: ctest --preset community-asan --output-on-failure --timeout 120

  sanitizer-ubsan:
    name: "UBSan (Linux, GCC, community preset)"
    runs-on: ubuntu-latest
    # Run on push/PR to develop, or when workflow_dispatch requests ubsan/both
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.sanitizer == 'ubsan' ||
      inputs.sanitizer == 'both'

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          librocksdb-dev \
          libgtest-dev \
          libssl-dev \
          zlib1g-dev \
          libzstd-dev \
          libfmt-dev \
          libspdlog-dev \
          nlohmann-json3-dev \
          libtbb-dev \
          libyaml-cpp-dev \
          libmimalloc-dev \
          libcurl4-openssl-dev \
          libboost-system-dev \
          libboost-filesystem-dev \
          libgrpc++-dev \
          libprotobuf-dev \
          protobuf-compiler-grpc

    - name: Configure (UBSan)
      run: cmake --preset community-ubsan -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc

    - name: Build (UBSan)
      run: cmake --build --preset community-ubsan --parallel $(nproc)

    - name: Test (UBSan)
      env:
        UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
      run: ctest --preset community-ubsan --output-on-failure --timeout 120
