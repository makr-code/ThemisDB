name: Ingestion LLM Adapter CI

# CI for the LegalLlmAdapter ingestion component (Phase 2, v1.8.0).
# Validates LegalLlmAdapter config, Phase 1 regex fallback, JSON response
# parsing (parseLlmResponse / buildPrompt), Phase 2 health-check
# (model-file existence guard under THEMIS_ENABLE_LLM), and the
# integration-test path that is skipped via GTEST_SKIP when no GGUF model
# is available.
#
# Uses the focused test binary (test_ingestion_llm_adapter_focused) which
# compiles only the ingestion sources and requires no RocksDB / themis_core.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/ingestion/llm_adapter.h'
      - 'src/ingestion/llm_adapter.cpp'
      - 'include/ingestion/deontic_extractor.h'
      - 'src/ingestion/deontic_extractor.cpp'
      - 'tests/test_ingestion_llm_adapter.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/ingestion-llm-adapter-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/ingestion/llm_adapter.h'
      - 'src/ingestion/llm_adapter.cpp'
      - 'include/ingestion/deontic_extractor.h'
      - 'src/ingestion/deontic_extractor.cpp'
      - 'tests/test_ingestion_llm_adapter.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/ingestion-llm-adapter-ci.yml'
  workflow_dispatch:

concurrency:
  group: ingestion-llm-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run IngestionLlmAdapterFocusedTests.
  # Tests cover all acceptance criteria for LegalLlmAdapter (Phase 2):
  #   AC-1  LlmAdapterConfig getter/setter, hasModel(), hasAdapter().
  #   AC-2  Phase 1: isLlmAvailable() returns false when no model configured.
  #   AC-3  Phase 1: buildExtractorFn() returns empty fn → DeonticExtractor
  #         falls back to built-in regex.
  #   AC-4  Phase 1: buildExtractor() returns a working regex extractor that
  #         classifies obligation / permission / prohibition sentences.
  #   AC-5  Move constructor and move-assignment preserve config state.
  #   AC-6  JSON parsing: valid obligation / permission / prohibition responses
  #         are parsed correctly via parseLlmResponse().
  #   AC-7  JSON parsing: preamble noise before the '{' is stripped correctly.
  #   AC-8  JSON parsing: malformed / empty JSON produces a warning and an
  #         empty DeonticExtraction result (no exception).
  #   AC-9  JSON parsing: unknown deontic category produces a warning.
  #   AC-10 Phase 2 (THEMIS_ENABLE_LLM): buildExtractorFn() throws
  #         std::runtime_error when model_path is set but file is missing.
  #   AC-11 Phase 2 (THEMIS_ENABLE_LLM): isLlmAvailable() returns true for
  #         an accessible file and false for a missing one.
  #   AC-INT Integration tests skipped gracefully via GTEST_SKIP when no
  #         GGUF model is available (THEMIS_TEST_MODEL_PATH not set).
  # ---------------------------------------------------------------------------
  ingestion-llm-adapter-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: IngestionLlmAdapter (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libzstd-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_ingestion_llm_adapter_focused

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run IngestionLlmAdapterFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R IngestionLlmAdapterFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee ingestion_llm_adapter_results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-llm-adapter-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/ingestion_llm_adapter_results.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🤖 Ingestion LLM Adapter – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "LegalLlmAdapter: config API, Phase 1 regex fallback, JSON response parsing," >> "$GITHUB_STEP_SUMMARY"
          echo "Phase 2 model-file health-check (THEMIS_ENABLE_LLM guard)," >> "$GITHUB_STEP_SUMMARY"
          echo "integration tests skipped gracefully when no GGUF model is available." >> "$GITHUB_STEP_SUMMARY"
