name: "Benchmark: Expectations Diagnostic (not a performance gate)"

# Rechenaufwand-Score: R=4 (K=4, L=4, N=3) | last-calibrated: 2026-09-23
# Trigger policy: weekly schedule + manual dispatch only; no PR trigger.
#
# Orchestrates the core benchmark pipeline:
#   1. build-and-run  — calls reusable-benchmark-runner.yml
#   2. report         — downloads results, compares against
#                       src/<module>/PERFORMANCE_EXPECTATIONS.md,
#                       and upserts the findings into a GitHub Issue.
#
# Issue marker: <!-- ci-benchmark:type:perf-results -->
# Issue title:  [Perf] Benchmark Results Tracker
#
# This hosted-runner diagnostic does not establish hardware/build equivalence
# to a reviewed baseline and must not be used as a performance release gate.
# Incomplete or failed diagnostics are reported as failed jobs, not passes.

on:
  schedule:
    - cron: '0 2 * * 1'    # Mondays 02:00 UTC — weekly performance signal
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: 'Google Benchmark filter regex (empty = all)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Build/compare/upload artifacts; suppress tracker issue/comment writes'
        required: false
        default: true
        type: boolean
      force_create_issue:
        description: 'Force issue upsert even when all targets pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-benchmark-gate-${{ github.ref }}
  cancel-in-progress: false   # Queue, never cancel an in-progress run

# ─────────────────────────────────────────────────────────────────────────────
jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [benchmark-quality-build, build-and-run, report]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Benchmark expectations diagnostic; not a performance gate"
          job-results: ${{ toJSON(needs) }}

  benchmark-quality-build:
    name: "Build: Benchmark Quality Line"
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      build_mode: benchmarks
      preset: benchmark-quality
      configure_flags: >-
        -DTHEMIS_BUILD_BENCHMARKS=ON
        -DTHEMIS_BUILD_TESTS=OFF
      build_targets: themis_benchmarks_all_eligible
      validation_mode: none
      benchmark_filter: ${{ inputs.benchmark_filter || '' }}
      runs_on: ubuntu-latest
      shell: bash
      fetch_depth: '0'
      working_directory: .
      summary_title: "Build: Benchmark Quality Line"

  # ─── Job 1: Build the benchmark quality line and execute benchmarks ────────
  build-and-run:
    name: "Validate: Benchmark Execution"
    needs: [benchmark-quality-build]
    uses: ./.github/workflows/reusable-benchmark-runner.yml
    with:
      configure_flags: >-
        -DTHEMIS_BUILD_BENCHMARKS=ON
        -DTHEMIS_BUILD_TESTS=OFF
      benchmark_filter: ${{ inputs.benchmark_filter || '' }}
      benchmark_format: 'json'
      timeout_minutes: 90
      runs_on: 'ubuntu-latest'
      artifact_retention_days: '14'

  # ─── Job 2: Compare results against PERFORMANCE_EXPECTATIONS.md ────────────
  report:
    name: "Validate: Benchmark Report"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-and-run]
    # Missing, failed, or skipped execution must not make the diagnostic green.
    if: ${{ always() }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout (sparse — scripts + src expectations only)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          sparse-checkout: |
            benchmarks/compare_expectations.py
            src
            .github/actions
            scripts/ci/log_issue_triage.py
          sparse-checkout-cone-mode: false

      - name: Download benchmark artifact
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: ${{ needs.build-and-run.outputs.artifact_name }}
          path: benchmark-artifacts/
        continue-on-error: true   # Missing artifact handled below

      - name: Verify artifact presence
        id: artifact_check
        run: |
          if [[ -d "benchmark-artifacts/results" ]]; then
            COUNT=$(find benchmark-artifacts/results -name "*.json" | wc -l)
            echo "result_count=${COUNT}" >> "$GITHUB_OUTPUT"
            if [[ "${COUNT}" -eq 0 ]]; then
              echo "::error::Benchmark artifact present but contains 0 JSON result files; treating run as FAIL."
              exit 1
            fi
            echo "::notice::Found ${COUNT} benchmark result file(s)."
          else
            echo "result_count=0" >> "$GITHUB_OUTPUT"
            echo "::error::No benchmark results artifact found; cannot produce a meaningful report."
            mkdir -p benchmark-artifacts/results
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecad90f24c8efe5fccefdfab
        with:
          python-version: '3.11'

      - name: Compare results against PERFORMANCE_EXPECTATIONS.md
        id: compare
        run: |
          set +e
          python3 benchmarks/compare_expectations.py \
            --src-dir src \
            --results-dir benchmark-artifacts/results \
            --output benchmark-artifacts/comparison_report.md \
            --strict-completeness \
            --run-id "${{ github.run_id }}" \
            --sha "${{ github.sha }}" \
            --repo "${{ github.repository }}"
          COMPARE_EXIT=$?
          echo "compare_exit=${COMPARE_EXIT}" >> "$GITHUB_OUTPUT"
          if [[ ${COMPARE_EXIT} -eq 0 ]]; then
            echo "compare_status=PASS" >> "$GITHUB_OUTPUT"
          elif [[ ${COMPARE_EXIT} -eq 2 ]]; then
            echo "compare_status=INCOMPLETE" >> "$GITHUB_OUTPUT"
          else
            echo "compare_status=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize benchmark triage output
        id: benchmark_triage
        if: always()
        shell: bash
        run: |
          set +e
          python3 scripts/ci/log_issue_triage.py \
            --benchmark-report benchmark-artifacts/comparison_report.md \
            --output-markdown benchmark-artifacts/benchmark-triage.md \
            --output-json benchmark-artifacts/benchmark-triage.json \
            --issue-kind benchmark \
            --title "[Perf] Benchmark Triage" \
            --write-github-output "$GITHUB_OUTPUT"
          TRIAGE_EXIT=$?
          set -e
          echo "triage_exit=${TRIAGE_EXIT}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize tracker write mode
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Tracker mutation mode"
            if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${DRY_RUN}" == "true" ]]; then
              echo "Manual dry run: tracker issue upsert and report comment are suppressed; comparison, report generation, and artifact uploads still run."
            elif [[ "${EVENT_NAME}" == "schedule" ]]; then
              echo "Scheduled run: live tracker issue upsert and report comment behavior remains enabled."
            else
              echo "Live tracker writes follow the existing comparison and issue conditions."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upsert benchmark results tracker issue
        id: tracker
        # Skip upsert when all targets pass and force_create_issue is not set
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) &&
          (
          (steps.compare.outputs.compare_status == 'FAIL' ||
          inputs.force_create_issue == true) &&
          steps.benchmark_triage.outputs.has_actionable_issues == 'true'
          )
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Perf] Benchmark Results Tracker'
          issue-marker: '<!-- ci-benchmark:type:perf-results -->'
          issue-body-file: benchmark-artifacts/benchmark-triage.md
          labels-to-add: 'performance,benchmark,ci/benchmark-results'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Post full comparison report as issue comment
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.tracker.outputs.issue-number }}
        run: |
          if [[ -z "${ISSUE_NUMBER}" ]]; then
            echo "::warning::No issue number resolved; skipping comment."
            exit 0
          fi

          REPORT_FILE="benchmark-artifacts/comparison_report.md"
          if [[ ! -f "${REPORT_FILE}" ]]; then
            echo "::warning::No comparison report generated; skipping comment."
            exit 0
          fi

          # Prepend a run header to the report before posting
          case "${{ steps.compare.outputs.compare_status }}" in
            PASS) STATUS_TEXT="✅ Diagnostic comparison completed — not a performance gate" ;;
            INCOMPLETE) STATUS_TEXT="⚠️ INCOMPLETE — some targets could not be evaluated" ;;
            *) STATUS_TEXT="❌ FAIL — comparison failed or targets exceeded thresholds" ;;
          esac
          HEADER="### Run \`${{ github.run_id }}\` — ${STATUS_TEXT}"$'\n\n'
          HEADER+="SHA: \`${{ github.sha }}\` | Trigger: \`${{ github.event_name }}\`"$'\n\n'
          HEADER+="---"$'\n\n'

          COMMENT_FILE="$(mktemp)"
          printf '%s\n' "${HEADER}" > "${COMMENT_FILE}"
          cat "${REPORT_FILE}" >> "${COMMENT_FILE}"

          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body-file "${COMMENT_FILE}"

          rm -f "${COMMENT_FILE}"

      - name: Upload comparison report artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: benchmark-comparison-report-${{ github.run_id }}
          path: benchmark-artifacts/comparison_report.md
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce diagnostic completeness
        if: ${{ always() }}
        env:
          EXECUTION_RESULT: ${{ needs.build-and-run.result }}
          COMPARE_STATUS: ${{ steps.compare.outputs.compare_status }}
        run: |
          if [[ "${EXECUTION_RESULT}" != "success" || "${COMPARE_STATUS}" != "PASS" ]]; then
            echo "::error::Expectations diagnostic failed or is incomplete (execution=${EXECUTION_RESULT}, comparison=${COMPARE_STATUS:-missing})."
            exit 1
          fi
          echo "::notice::Diagnostic comparison completed; this is not a performance gate."
