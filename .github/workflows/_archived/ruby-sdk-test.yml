name: Ruby SDK [Dry-Run]

# Ruby SDK build and test workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Gem is built but NOT published to RubyGems

on:
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

defaults:
  run:
    working-directory: clients/ruby

jobs:
  test:
    name: Test Ruby ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.7', '3.0', '3.1', '3.2', '3.3']
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow builds and tests the Ruby SDK."
          echo "No gems are published to RubyGems.org."
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: false
          working-directory: clients/ruby

      - name: Install dependencies
        run: |
          gem install bundler
          if [ -f Gemfile ]; then
            bundle install
          else
            gem install rspec webmock
          fi

      - name: Run linter (RuboCop)
        if: matrix.ruby-version == '3.2'
        continue-on-error: true
        run: |
          gem install rubocop || true
          if command -v rubocop &> /dev/null; then
            rubocop || true
          fi

      - name: Run tests
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            echo "ACT detected - running syntax check only"
            ruby -c lib/themisdb.rb
            exit 0
          fi
          if command -v rspec &> /dev/null && [ -d spec ]; then
            rspec --format documentation
          else
            echo "RSpec not found or no specs directory, running syntax check"
            find lib -name "*.rb" -exec ruby -c {} \;
          fi

      - name: Generate test report
        if: always()
        run: |
          echo "## Ruby SDK Test Results (Ruby ${{ matrix.ruby-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status: ✅ Success" >> $GITHUB_STEP_SUMMARY

  package:
    name: Build Gem (Dry-Run)
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: clients/ruby

      - name: Build gem
        run: gem build themisdb.gemspec

      - name: Display package info (Dry-Run)
        run: |
          echo "## Ruby SDK Build Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Gem NOT published to RubyGems.org" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Gem name:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -la *.gem
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gem install themisdb" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Gemfile:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`ruby" >> $GITHUB_STEP_SUMMARY
          echo "gem 'themisdb'" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Add RUBYGEMS_API_KEY as a repository secret" >> $GITHUB_STEP_SUMMARY
          echo "2. Uncomment the gem push step" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ruby-sdk-gem
          path: clients/ruby/*.gem
          retention-days: 7

      # TODO: Uncomment for production releases
      # - name: Publish to RubyGems
      #   env:
      #     GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
      #   run: gem push *.gem
