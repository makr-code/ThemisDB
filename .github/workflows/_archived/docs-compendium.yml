name: Compendium Build & Deploy

on:
  # Only run on releases and manual trigger
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Compendium Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements-docs.txt
      
      - name: Build Compendium MkDocs site
        working-directory: scripts/compendium
        env:
          ENABLE_PDF_EXPORT: "1"
        run: |
          mkdocs build --clean -f mkdocs-compendium.yml --site-dir ../../build/compendium-site
      
      - name: Verify Compendium PDF
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            echo "ACT detected: creating placeholder PDF to allow step to continue"
            mkdir -p build
            echo "Placeholder PDF for act" > build/ThemisDB-Kompendium-v1.3.4.pdf
          fi
          if [ ! -f "build/ThemisDB-Kompendium-v1.3.4.pdf" ] || [ ! -s "build/ThemisDB-Kompendium-v1.3.4.pdf" ]; then
            echo "Error: Compendium PDF generation failed - file not created or empty"
            exit 1
          fi
          echo "Compendium PDF generated successfully"
          ls -lh build/ThemisDB-Kompendium-v1.3.4.pdf
      
      - name: Copy PDF to docs directory
        run: |
          mkdir -p docs/compendium
          cp build/ThemisDB-Kompendium-v1.3.4.pdf docs/compendium/
      
      - name: Upload compendium site artifact
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compendium-site
          path: build/compendium-site/
      
      - name: Upload compendium PDF artifact
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: compendium-pdf
          path: docs/compendium/ThemisDB-Kompendium-v1.3.4.pdf
      
      - name: Verify PDF
        run: |
          ls -lh build/ThemisDB-Kompendium-v1.3.4.pdf
          ls -lh docs/compendium/ThemisDB-Kompendium-v1.3.4.pdf
  
  deploy:
    name: Deploy Compendium to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    environment:
      name: github-pages-compendium
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download compendium artifact
        uses: actions/download-artifact@v4
        with:
          name: compendium-site
          path: site
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
