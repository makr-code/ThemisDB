name: Documentation Validation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'compendium/**'
      - 'mkdocs.yml'
      - 'compendium/mkdocs-compendium.yml'
      - 'scripts/docs-lint.py'
      - 'scripts/link-check.py'
      - 'scripts/toc-check.py'
      - '.github/workflows/documentation-validation.yml'
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'docs/**'
      - 'compendium/**'
      - 'mkdocs.yml'
      - 'compendium/mkdocs-compendium.yml'
      - 'scripts/docs-lint.py'
      - 'scripts/link-check.py'
      - 'scripts/toc-check.py'
      - '.github/workflows/documentation-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-lint:
    name: Documentation Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run documentation linter
        id: lint
        run: |
          python3 scripts/docs-lint.py --format json --output lint-report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Display lint results
        if: always()
        run: |
          if [ -f lint-report.json ]; then
            echo "## Documentation Lint Report" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('lint-report.json') as f:
              data = json.load(f)
              print(f"**Files checked:** {data['stats']['files_checked']}")
              print(f"**Errors:** {data['stats']['errors']}")
              print(f"**Warnings:** {data['stats']['warnings']}")
              if data['errors']:
                  print('\n### Errors:')
                  for error in data['errors'][:10]:
                      print(f"- {error['file']}:{error['line']} - {error['message']}")
              if data['warnings']:
                  print('\n### Warnings:')
                  for warning in data['warnings'][:10]:
                      print(f"- {warning['file']}:{warning['line']} - {warning['message']}")
          PYEOF
          fi
      
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
      
      - name: Check lint status
        if: steps.lint.outputs.exit_code != '0'
        run: |
          echo "Documentation linting failed. Please fix the errors above."
          exit 1

  link-check:
    name: Link Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install PyYAML for TOC validation
        run: |
          pip install pyyaml
      
      - name: Run internal link checker
        id: links
        run: |
          python3 scripts/link-check.py --format json --output link-report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Display link check results
        if: always()
        run: |
          if [ -f link-report.json ]; then
            echo "## Link Validation Report" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('link-report.json') as f:
              data = json.load(f)
              print(f"**Files checked:** {data['stats']['files_checked']}")
              print(f"**Internal links:** {data['stats']['internal_links']}")
              print(f"**External links:** {data['stats']['external_links']}")
              print(f"**Broken internal links:** {data['stats']['broken_internal']}")
              print(f"**Broken external links:** {data['stats']['broken_external']}")
              if data['errors']:
                  print('\n### Errors:')
                  for error in data['errors'][:10]:
                      print(f"- {error['file']}:{error['line']} - {error['message']}")
                      if error.get('link'):
                          print(f"  Link: {error['link']}")
          PYEOF
          fi
      
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report.json
      
      - name: Check link status
        if: steps.links.outputs.exit_code != '0'
        run: |
          echo "Link validation failed. Please fix the broken links above."
          exit 1

  external-link-check:
    name: External Link Check
    runs-on: ubuntu-latest
    # Only run on main/develop branches to avoid rate limiting
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check external links in docs
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: 'docs/.markdown-link-check.json'
          folder-path: 'docs'
          max-depth: -1
          check-modified-files-only: 'no'
        continue-on-error: true
      
      - name: Check external links in compendium
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: 'docs/.markdown-link-check.json'
          folder-path: 'compendium'
          max-depth: -1
          check-modified-files-only: 'no'
        continue-on-error: true

  toc-validation:
    name: TOC Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Run TOC validation
        id: toc
        run: |
          python3 scripts/toc-check.py --format json --output toc-report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Display TOC validation results
        if: always()
        run: |
          if [ -f toc-report.json ]; then
            echo "## TOC Validation Report" >> $GITHUB_STEP_SUMMARY
            python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('toc-report.json') as f:
              data = json.load(f)
              print(f"**Navigation entries:** {data['stats']['nav_entries']}")
              print(f"**Files in navigation:** {data['stats']['files_in_nav']}")
              print(f"**Files on disk:** {data['stats']['files_on_disk']}")
              print(f"**Missing files:** {data['stats']['missing_files']}")
              print(f"**Orphaned important files:** {data['stats']['orphaned_files']}")
              if data['errors']:
                  print('\n### Errors:')
                  for error in data['errors'][:10]:
                      print(f"- [{error['file']}] {error['message']}")
              if data['warnings']:
                  print('\n### Warnings:')
                  for warning in data['warnings'][:10]:
                      print(f"- [{warning['file']}] {warning['message']}")
          PYEOF
          fi
      
      - name: Upload TOC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toc-report
          path: toc-report.json
      
      - name: Check TOC status
        if: steps.toc.outputs.exit_code != '0'
        run: |
          echo "TOC validation failed. Please fix the errors above."
          exit 1

  validation-summary:
    name: Validation Summary
    needs: [docs-lint, link-check, toc-validation]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports
      
      - name: Generate summary
        run: |
          echo "# Documentation Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.docs-lint.result }}" == "success" ]; then
            echo "✅ Documentation Linting: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Documentation Linting: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.link-check.result }}" == "success" ]; then
            echo "✅ Link Validation: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Link Validation: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.toc-validation.result }}" == "success" ]; then
            echo "✅ TOC Validation: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ TOC Validation: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See individual job outputs and artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
      
      - name: Check overall status
        if: needs.docs-lint.result != 'success' || needs.link-check.result != 'success' || needs.toc-validation.result != 'success'
        run: |
          echo "One or more validation checks failed."
          exit 1
