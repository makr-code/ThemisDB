# Static Application Security Testing (SAST) Workflow
# Runs security scans on every PR and push to main
# Compliant with: BSI C5 (DEV-01), NIST CSF, ISO 27001, OWASP

name: Security Scanning (SAST)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Weekly security scan (Sundays at 2 AM)
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Secret Scanning with Gitleaks
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Upload Gitleaks Report
        if: always()
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 30

  # C++ Static Analysis with cppcheck
  cpp-analysis:
    name: C++ Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --suppress=missingIncludeSystem \
                   --suppress=unmatchedSuppression \
                   --inline-suppr \
                   --error-exitcode=0 \
                   --xml --xml-version=2 \
                   --output-file=cppcheck-report.xml \
                   src/ include/ 2>&1 | tee cppcheck-output.txt

      - name: Generate Summary
        run: |
          echo "### C++ Static Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -100 cppcheck-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload cppcheck Report
        uses: actions/upload-artifact@v4
        if: env.ACT != 'true'
        with:
          name: cppcheck-report
          path: |
            cppcheck-report.xml
            cppcheck-output.txt
          retention-days: 30

  # CodeQL Analysis for C++
  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: env.ACT != 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: +security-extended,security-and-quality

      - name: Build (for CodeQL)
        run: |
          # Simple build for CodeQL analysis
          echo "CodeQL will analyze the source without full build"
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"

  # Dependency Vulnerability Scanning
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan filesystem for vulnerabilities
        run: |
          trivy fs --scanners vuln,secret,misconfig \
                   --format table \
                   --output trivy-report.txt \
                   --severity HIGH,CRITICAL \
                   . || true
          
          echo "### Dependency Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat trivy-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Scan for JSON report
        run: |
          trivy fs --scanners vuln \
                   --format json \
                   --output trivy-report.json \
                   --severity HIGH,CRITICAL \
                   . || true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: env.ACT != 'true'
        with:
          name: trivy-report
          path: |
            trivy-report.txt
            trivy-report.json
          retention-days: 30

  # License Compliance Check - Enhanced with policy enforcement
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for license policy
        run: |
          echo "### License Compliance Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f ".license-policy.json" ]; then
            echo "✅ License policy file found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Allowed Licenses" >> $GITHUB_STEP_SUMMARY
            if command -v jq &> /dev/null; then
              jq -r '.policy.allowed[]' .license-policy.json | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ License policy file not found (.license-policy.json)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check vcpkg.json licenses
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### vcpkg Dependencies" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "vcpkg.json" ]; then
            if command -v jq &> /dev/null; then
              echo "**Direct dependencies:**" >> $GITHUB_STEP_SUMMARY
              jq -r '.dependencies[] | if type == "string" then "- \(.)" else "- \(.name)" end' vcpkg.json >> $GITHUB_STEP_SUMMARY
            else
              echo '```json' >> $GITHUB_STEP_SUMMARY
              cat vcpkg.json | head -50 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### License Files Found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find . -name "LICENSE*" -o -name "COPYING*" | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ For detailed license compliance scanning, see the [License Compliance workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/license-compliance.yml)" >> $GITHUB_STEP_SUMMARY

  # Security Summary Report
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scanning, cpp-analysis, dependency-scan, license-check]
    if: always()
    steps:
      - name: Generate Security Summary
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secret-scanning.result == 'success' && '✅ Passed' || '⚠️ Check Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| C++ Analysis | ${{ needs.cpp-analysis.result == 'success' && '✅ Passed' || '⚠️ Check Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result == 'success' && '✅ Passed' || '⚠️ Check Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Check | ${{ needs.license-check.result == 'success' && '✅ Passed' || '⚠️ Check Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 See individual job logs for detailed reports." >> $GITHUB_STEP_SUMMARY