name: Sanitizer Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 5 * * 1'  # Weekly on Monday
  workflow_dispatch:

jobs:
  address-sanitizer:
    name: AddressSanitizer (ASan)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-15 \
            libssl-dev \
            librocksdb-dev \
            libgrpc++-dev \
            protobuf-compiler

      - name: Configure with ASan
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHEMIS_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address"

      - name: Build
        run: |
          cmake --build build --verbose 2>&1 | tee build-asan.log

      - name: Run Tests with ASan
        working-directory: build
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0:log_path=asan.log
        run: |
          ctest --output-on-failure --verbose 2>&1 | tee ../test-asan.log
        continue-on-error: true

      - name: Check ASan Reports
        run: |
          echo "=== AddressSanitizer Reports ==="
          find build -name "asan.log*" -exec cat {} \; || echo "No ASan errors found"
        continue-on-error: true

      - name: Upload ASan Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: asan-logs
          path: |
            build-asan.log
            test-asan.log
            build/asan.log*
          retention-days: 30

  undefined-behavior-sanitizer:
    name: UndefinedBehaviorSanitizer (UBSan)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-15 \
            libssl-dev \
            librocksdb-dev

      - name: Configure with UBSan
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHEMIS_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build
        run: |
          cmake --build build --verbose 2>&1 | tee build-ubsan.log

      - name: Run Tests with UBSan
        working-directory: build
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:log_path=ubsan.log
        run: |
          ctest --output-on-failure --verbose 2>&1 | tee ../test-ubsan.log
        continue-on-error: true

      - name: Check UBSan Reports
        run: |
          echo "=== UndefinedBehaviorSanitizer Reports ==="
          find build -name "ubsan.log*" -exec cat {} \; || echo "No UBSan errors found"
        continue-on-error: true

      - name: Upload UBSan Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ubsan-logs
          path: |
            build-ubsan.log
            test-ubsan.log
            build/ubsan.log*
          retention-days: 30

  thread-sanitizer:
    name: ThreadSanitizer (TSan)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-15 \
            libssl-dev

      - name: Configure with TSan
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHEMIS_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: |
          cmake --build build --verbose 2>&1 | tee build-tsan.log

      - name: Run Tests with TSan
        working-directory: build
        env:
          TSAN_OPTIONS: second_deadlock_stack=1:halt_on_error=0:log_path=tsan.log
        run: |
          # Use suppressions if available
          if [ -f ../tsan_suppressions.txt ]; then
            export TSAN_OPTIONS="${TSAN_OPTIONS}:suppressions=../tsan_suppressions.txt"
          fi
          ctest --output-on-failure --verbose 2>&1 | tee ../test-tsan.log
        continue-on-error: true

      - name: Check TSan Reports
        run: |
          echo "=== ThreadSanitizer Reports ==="
          find build -name "tsan.log*" -exec cat {} \; || echo "No TSan errors found"
        continue-on-error: true

      - name: Upload TSan Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: tsan-logs
          path: |
            build-tsan.log
            test-tsan.log
            build/tsan.log*
          retention-days: 30

  memory-sanitizer:
    name: MemorySanitizer (MSan)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-15 \
            libc++-15-dev \
            libc++abi-15-dev

      - name: Configure with MSan
        env:
          CC: clang-15
          CXX: clang++-15
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHEMIS_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=memory -fno-omit-frame-pointer -fsanitize-memory-track-origins -g -stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory -stdlib=libc++" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=memory -stdlib=libc++"
        continue-on-error: true

      - name: Build
        run: |
          cmake --build build --verbose 2>&1 | tee build-msan.log
        continue-on-error: true

      - name: Run Tests with MSan
        if: success()
        working-directory: build
        env:
          MSAN_OPTIONS: halt_on_error=0:log_path=msan.log
        run: |
          ctest --output-on-failure --verbose 2>&1 | tee ../test-msan.log
        continue-on-error: true

      - name: Upload MSan Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: msan-logs
          path: |
            build-msan.log
            test-msan.log
            build/msan.log*
          retention-days: 30

  sanitizer-summary:
    name: Sanitizer Summary
    needs: [address-sanitizer, undefined-behavior-sanitizer, thread-sanitizer, memory-sanitizer]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Sanitizer Logs
        uses: actions/download-artifact@v3
        with:
          path: sanitizer-logs

      - name: Generate Sanitizer Report
        run: |
          cat > sanitizer-report.md << 'EOF'
          # Sanitizer Coverage Report
          
          ## Summary
          
          This report summarizes the results from various sanitizer runs:
          
          - **AddressSanitizer (ASan)**: Memory errors (buffer overflows, use-after-free, leaks)
          - **UndefinedBehaviorSanitizer (UBSan)**: Undefined behavior (integer overflow, null deref, alignment)
          - **ThreadSanitizer (TSan)**: Data races and deadlocks
          - **MemorySanitizer (MSan)**: Uninitialized memory reads
          
          ## Results
          
          EOF
          
          # Check for errors in each sanitizer
          for san in asan ubsan tsan msan; do
            echo "### ${san^^}" >> sanitizer-report.md
            if ls sanitizer-logs/${san}-logs/${san}.log* 2>/dev/null; then
              echo "⚠️ Issues found - see logs" >> sanitizer-report.md
              echo "\`\`\`" >> sanitizer-report.md
              cat sanitizer-logs/${san}-logs/${san}.log* 2>/dev/null | head -100 >> sanitizer-report.md || true
              echo "\`\`\`" >> sanitizer-report.md
            else
              echo "✅ No issues detected" >> sanitizer-report.md
            fi
            echo "" >> sanitizer-report.md
          done
          
          echo "## Recommendations" >> sanitizer-report.md
          echo "" >> sanitizer-report.md
          echo "1. Fix all ASan errors (memory safety critical)" >> sanitizer-report.md
          echo "2. Fix all UBSan errors (undefined behavior)" >> sanitizer-report.md
          echo "3. Review and fix TSan warnings (potential race conditions)" >> sanitizer-report.md
          echo "4. Investigate MSan warnings (uninitialized memory)" >> sanitizer-report.md

      - name: Upload Sanitizer Report
        uses: actions/upload-artifact@v3
        with:
          name: sanitizer-summary
          path: sanitizer-report.md
          retention-days: 90

      - name: Comment PR with Sanitizer Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('sanitizer-report.md')) {
              const report = fs.readFileSync('sanitizer-report.md', 'utf8');
              const body = `## Sanitizer Coverage Report\n\n${report}`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
        continue-on-error: true

  valgrind-check:
    name: Valgrind Memory Check
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            valgrind \
            libssl-dev

      - name: Configure
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHEMIS_BUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build

      - name: Run Tests with Valgrind
        working-directory: build
        run: |
          ctest -T memcheck --output-on-failure || true
        continue-on-error: true

      - name: Check Valgrind Results
        run: |
          find build -name "MemoryChecker.*.log" -exec cat {} \; || echo "No Valgrind logs found"
        continue-on-error: true

      - name: Upload Valgrind Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: valgrind-logs
          path: build/Testing/Temporary/MemoryChecker.*.log
          retention-days: 30
