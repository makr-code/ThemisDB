name: Update Performance Baselines

# Updates performance baselines for main, develop branches and releases
# Baselines are used for regression detection in PRs

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to create baseline for'
        required: true
        default: 'main'

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  USE_SYSTEM_LIBS: ON

jobs:
  update-baseline:
    name: Update Performance Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Determine context
        id: context
        run: |
          # Determine if this is a release, main, or develop
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
            BRANCH="main"
            IS_RELEASE="true"
            echo "📦 Release build: $VERSION"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            VERSION=$(cat VERSION | tr -d '[:space:]' || echo "unknown")
            BRANCH="main"
            IS_RELEASE="false"
            echo "🔵 Main branch build"
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            VERSION=$(cat VERSION | tr -d '[:space:]' || echo "unknown")
            BRANCH="develop"
            IS_RELEASE="false"
            echo "🟢 Develop branch build"
          else
            # Workflow dispatch
            VERSION=$(cat VERSION | tr -d '[:space:]' || echo "unknown")
            BRANCH="${{ github.event.inputs.branch }}"
            IS_RELEASE="false"
            echo "🔧 Manual workflow dispatch"
          fi
          
          COMMIT="${{ github.sha }}"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          
          echo "Version: $VERSION"
          echo "Branch: $BRANCH"
          echo "Is Release: $IS_RELEASE"
          echo "Commit: $COMMIT"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libcurl4-openssl-dev librocksdb-dev \
            libtbb-dev libspdlog-dev nlohmann-json3-dev \
            libboost-dev libboost-system-dev libyaml-cpp-dev \
            libzstd-dev libgtest-dev libbenchmark-dev
      
      - name: Install vcpkg dependencies
        run: |
          VCPKG_DIR="${VCPKG_ROOT:-vcpkg}"
          if [ ! -f "$VCPKG_DIR/bootstrap-vcpkg.sh" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          fi
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          "$VCPKG_DIR/vcpkg" install --clean-after-build
      
      - name: Build ThemisDB (Release)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARKS=ON \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT:-vcpkg}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release --parallel $(nproc)
      
      - name: Run Full Benchmark Suite
        run: |
          cd build
          mkdir -p benchmark_results
          
          # Run comprehensive benchmark suite for baseline
          echo "Running comprehensive benchmark suite..."
          
          # Core benchmarks
          for bench in bench_crud bench_query bench_vector_search \
                      bench_core_performance bench_compression bench_transaction_throughput \
                      bench_mvcc bench_index_rebuild; do
            if [ -f "$bench" ]; then
              echo "Running $bench..."
              ./$bench --benchmark_format=json \
                --benchmark_out=benchmark_results/${bench}.json \
                --benchmark_repetitions=3 || echo "⚠️ $bench failed"
            fi
          done
          
          cd ..
          
          echo "✅ Benchmark suite completed"
          ls -lh build/benchmark_results/
      
      - name: Create Baseline
        id: baseline
        run: |
          python3 benchmarks/baseline_manager.py save \
            --results build/benchmark_results \
            --branch "${{ steps.context.outputs.branch }}" \
            --version "${{ steps.context.outputs.version }}" \
            --commit "${{ steps.context.outputs.commit }}" \
            ${{ steps.context.outputs.is_release == 'true' && '--release' || '' }}
          
          echo "✅ Baseline created successfully"
      
      - name: Commit and push baseline
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add baseline files
          git add benchmarks/baselines/
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to baseline files"
            exit 0
          fi
          
          # Commit with meaningful message
          if [ "${{ steps.context.outputs.is_release }}" = "true" ]; then
            MSG="chore: Update performance baseline for release ${{ steps.context.outputs.version }}"
          else
            MSG="chore: Update performance baseline for ${{ steps.context.outputs.branch }} branch"
          fi
          
          git commit -m "$MSG"
          git push
          
          echo "✅ Baseline committed and pushed"
      
      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-${{ steps.context.outputs.version }}
          path: |
            benchmarks/baselines/**/*.json
            build/benchmark_results/*.json
          retention-days: 90
      
      - name: Create summary
        run: |
          echo "## Performance Baseline Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.context.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.context.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.context.outputs.commit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Is Release**: ${{ steps.context.outputs.is_release }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Baseline has been updated and committed to the repository." >> $GITHUB_STEP_SUMMARY
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Create an issue if baseline update fails
            const title = '❌ Performance Baseline Update Failed';
            const body = `
            ## Baseline Update Failure
            
            The performance baseline update failed for:
            - **Branch**: ${{ steps.context.outputs.branch }}
            - **Version**: ${{ steps.context.outputs.version }}
            - **Commit**: ${{ steps.context.outputs.commit }}
            - **Run**: ${context.payload.repository.html_url}/actions/runs/${context.runId}
            
            Please investigate and manually update the baseline if necessary.
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['performance', 'automation', 'baseline']
            });
