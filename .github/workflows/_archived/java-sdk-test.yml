name: Java SDK [Dry-Run]

# Java SDK build and test workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Package is built but NOT deployed to Maven Central

on:
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read
  pull-requests: write
  checks: write

defaults:
  run:
    working-directory: clients/java

jobs:
  build-and-test:
    name: Build & Test Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow builds and tests the Java SDK."
          echo "No packages are deployed to Maven Central."
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found under act - skipping build"
            exit 0
          fi
          mvn package -DskipTests=false -B -V

      - name: Run tests
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found under act - skipping tests"
            exit 0
          fi
          mvn test -B
        continue-on-error: true
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: clients/java/target/surefire-reports/*.xml
          retention-days: 30
      
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always() && env.ACT != 'true'
        with:
          name: 'Java SDK Tests (Java ${{ matrix.java-version }})'
          path: clients/java/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: clients/java

      - name: Generate test report
        if: always()
        run: |
          if [ -d "target/surefire-reports" ]; then
            echo "## Java SDK Test Results (Java ${{ matrix.java-version }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            for f in target/surefire-reports/*.txt; do
              if [ -f "$f" ]; then
                echo "```" >> $GITHUB_STEP_SUMMARY
                cat "$f" >> $GITHUB_STEP_SUMMARY
                echo "```" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

  package:
    name: Package JAR (Dry-Run)
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build package
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "Maven not found under act - skipping package build"
            exit 0
          fi
          mvn package -DskipTests -B

      - name: Display package info (Dry-Run)
        run: |
          echo "## Java SDK Build Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Package NOT deployed to Maven Central" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          ls -la target/*.jar 2>/dev/null || echo "No JAR files found"
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maven coordinates:" >> $GITHUB_STEP_SUMMARY
          echo "```xml" >> $GITHUB_STEP_SUMMARY
          echo "<dependency>" >> $GITHUB_STEP_SUMMARY
          echo "  <groupId>com.themisdb</groupId>" >> $GITHUB_STEP_SUMMARY
          echo "  <artifactId>themisdb-client</artifactId>" >> $GITHUB_STEP_SUMMARY
          echo "  <version>0.1.0-beta.1</version>" >> $GITHUB_STEP_SUMMARY
          echo "</dependency>" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure Maven Central credentials in settings.xml" >> $GITHUB_STEP_SUMMARY
          echo "2. Add GPG signing configuration" >> $GITHUB_STEP_SUMMARY
          echo "3. Add mvn deploy step" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: java-sdk-jar
          path: clients/java/target/*.jar
          retention-days: 7

