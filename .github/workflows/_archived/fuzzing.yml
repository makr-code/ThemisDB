name: AFL++ Fuzzing

permissions:
  contents: read

on:
  schedule:
    # Weekly on Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Fuzzing target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - aql_parser
          - json_parser
          - crypto_operations
          - network_protocol
          - storage_engine
          - auth_handler
      duration:
        description: 'Fuzzing duration in minutes'
        required: true
        default: '60'
        type: string
      sanitizer:
        description: 'Sanitizer to use'
        required: true
        default: 'address'
        type: choice
        options:
          - address
          - undefined
          - memory
          - thread

env:
  AFL_VERSION: "4.09c"
  LLVM_VERSION: "17"

jobs:
  build-fuzz-targets:
    name: Build Fuzzing Targets
    runs-on: ubuntu-latest
    if: env.ACT != 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            llvm-${{ env.LLVM_VERSION }} \
            clang-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            libssl-dev \
            libboost-all-dev \
            pkg-config

      - name: Install AFL++
        run: |
          git clone https://github.com/AFLplusplus/AFLplusplus.git
          cd AFLplusplus
          git checkout v${{ env.AFL_VERSION }}
          make distrib
          sudo make install
          cd ..

      - name: Build with AFL++ instrumentation
        run: |
          mkdir -p build-fuzz
          cd build-fuzz
          CC=afl-clang-lto CXX=afl-clang-lto++ cmake .. \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_FUZZING=ON \
            -DENABLE_SANITIZERS=ON \
            -DSANITIZER=${{ github.event.inputs.sanitizer || 'address' }}
          ninja fuzz_targets

      - name: Upload fuzz targets
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-targets
          path: build-fuzz/fuzz/bin/
          retention-days: 7

  fuzz-aql-parser:
    name: Fuzz AQL Parser
    needs: build-fuzz-targets
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'aql_parser' || github.event_name == 'schedule' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fuzz targets
        uses: actions/download-artifact@v4
        with:
          name: fuzz-targets
          path: fuzz-targets/

      - name: Install AFL++
        run: |
          git clone https://github.com/AFLplusplus/AFLplusplus.git
          cd AFLplusplus
          git checkout v${{ env.AFL_VERSION }}
          make distrib
          sudo make install

      - name: Setup corpus
        run: |
          mkdir -p fuzz/corpus/aql
          echo 'SELECT * FROM collection' > fuzz/corpus/aql/seed1.txt
          echo 'FOR doc IN collection RETURN doc' > fuzz/corpus/aql/seed2.txt
          echo 'INSERT { "key": "value" } INTO collection' > fuzz/corpus/aql/seed3.txt

      - name: Run AFL++ fuzzing
        run: |
          chmod +x fuzz-targets/aql_parser_harness
          mkdir -p fuzz/output/aql_parser
          timeout ${{ github.event.inputs.duration || 60 }}m \
            afl-fuzz -i fuzz/corpus/aql \
                     -o fuzz/output/aql_parser \
                     -x fuzz/dictionaries/aql.dict \
                     -m 512 \
                     -t 1000 \
                     -- fuzz-targets/aql_parser_harness @@ \
            || true

      - name: Upload crash files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashes-aql-parser
          path: fuzz/output/aql_parser/crashes/
          retention-days: 30

      - name: Upload fuzzing stats
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-aql-parser
          path: |
            fuzz/output/aql_parser/fuzzer_stats
            fuzz/output/aql_parser/plot_data
          retention-days: 7

  fuzz-json-parser:
    name: Fuzz JSON Parser
    needs: build-fuzz-targets
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'json_parser' || github.event_name == 'schedule' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fuzz targets
        uses: actions/download-artifact@v4
        with:
          name: fuzz-targets
          path: fuzz-targets/

      - name: Install AFL++
        run: |
          git clone https://github.com/AFLplusplus/AFLplusplus.git
          cd AFLplusplus
          git checkout v${{ env.AFL_VERSION }}
          make distrib
          sudo make install

      - name: Setup corpus
        run: |
          mkdir -p fuzz/corpus/json
          echo '{}' > fuzz/corpus/json/seed1.json
          echo '{"key": "value"}' > fuzz/corpus/json/seed2.json
          echo '{"nested": {"array": [1, 2, 3]}}' > fuzz/corpus/json/seed3.json

      - name: Run AFL++ fuzzing
        run: |
          chmod +x fuzz-targets/json_parser_harness
          mkdir -p fuzz/output/json_parser
          timeout ${{ github.event.inputs.duration || 60 }}m \
            afl-fuzz -i fuzz/corpus/json \
                     -o fuzz/output/json_parser \
                     -x fuzz/dictionaries/json.dict \
                     -m 256 \
                     -t 500 \
                     -- fuzz-targets/json_parser_harness @@ \
            || true

      - name: Upload crash files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashes-json-parser
          path: fuzz/output/json_parser/crashes/
          retention-days: 30

  fuzz-crypto:
    name: Fuzz Crypto Operations
    needs: build-fuzz-targets
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'crypto_operations' || github.event_name == 'schedule' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fuzz targets
        uses: actions/download-artifact@v4
        with:
          name: fuzz-targets
          path: fuzz-targets/

      - name: Install AFL++
        run: |
          git clone https://github.com/AFLplusplus/AFLplusplus.git
          cd AFLplusplus
          git checkout v${{ env.AFL_VERSION }}
          make distrib
          sudo make install

      - name: Setup corpus
        run: |
          mkdir -p fuzz/corpus/crypto
          echo -n 'encrypt:AES-256-GCM:key123:iv456:plaintext' > fuzz/corpus/crypto/seed1.bin
          echo -n 'sign:RSA-SHA256:key:message' > fuzz/corpus/crypto/seed2.bin

      - name: Run AFL++ fuzzing
        run: |
          chmod +x fuzz-targets/crypto_harness
          mkdir -p fuzz/output/crypto
          timeout ${{ github.event.inputs.duration || 60 }}m \
            afl-fuzz -i fuzz/corpus/crypto \
                     -o fuzz/output/crypto \
                     -x fuzz/dictionaries/crypto.dict \
                     -m 1024 \
                     -t 2000 \
                     -- fuzz-targets/crypto_harness @@ \
            || true

      - name: Upload crash files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashes-crypto
          path: fuzz/output/crypto/crashes/
          retention-days: 30

  analyze-crashes:
    name: Analyze Crashes
    needs: [fuzz-aql-parser, fuzz-json-parser, fuzz-crypto]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all crash artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crashes-*
          path: all-crashes/
          merge-multiple: true

      - name: Install CASR for crash analysis
        run: |
          cargo install casr || true

      - name: Analyze crashes
        run: |
          mkdir -p fuzz/reports
          
          # Count crashes
          crash_count=$(find all-crashes -type f 2>/dev/null | wc -l)
          echo "Total crashes found: $crash_count"
          
          # Generate report
          cat > fuzz/reports/crash-summary.md << EOF
          # AFL++ Fuzzing Crash Report
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Total Crashes:** $crash_count
          
          ## Crashes by Target
          
          | Target | Crash Count |
          |--------|-------------|
          | AQL Parser | $(find all-crashes/crashes-aql-parser -type f 2>/dev/null | wc -l) |
          | JSON Parser | $(find all-crashes/crashes-json-parser -type f 2>/dev/null | wc -l) |
          | Crypto | $(find all-crashes/crashes-crypto -type f 2>/dev/null | wc -l) |
          
          ## Next Steps
          
          1. Review crash files in artifacts
          2. Reproduce crashes locally
          3. Triage severity with CASR
          4. Create issues for exploitable bugs
          EOF

      - name: Upload crash report
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-report
          path: fuzz/reports/
          retention-days: 30

      - name: Create issue if crashes found
        if: ${{ hashFiles('all-crashes/**/id*') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crashCount = fs.readdirSync('all-crashes').length;
            
            if (crashCount > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Security] AFL++ Fuzzing found ${crashCount} potential issues`,
                body: `## AFL++ Fuzzing Report\n\n**Run ID:** ${context.runId}\n**Crashes Found:** ${crashCount}\n\nPlease review the crash artifacts and triage accordingly.\n\n/cc @security-team`,
                labels: ['security', 'fuzzing', 'needs-triage']
              });
            }

  coverage-report:
    name: Generate Coverage Report
    needs: [fuzz-aql-parser, fuzz-json-parser, fuzz-crypto]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate coverage report
        run: |
          mkdir -p fuzz/coverage
          echo "Coverage report generation would require instrumented binaries with profdata"
          echo "This is a placeholder for the actual coverage generation"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-coverage
          path: fuzz/coverage/
          retention-days: 7