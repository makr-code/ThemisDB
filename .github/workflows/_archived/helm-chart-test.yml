name: Helm Chart [Dry-Run]

# Helm chart linting and template validation workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Chart is validated but NOT pushed to any OCI registry

on:
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Template Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow lints and validates the Helm chart."
          echo "No packages are pushed to OCI registries."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm chart
        run: helm lint helm/themisdb

      - name: Template Helm chart
        run: |
          helm template themisdb helm/themisdb > /tmp/rendered-templates.yaml
          echo "Rendered templates successfully"

      - name: Validate template syntax
        run: |
          # Install kubectl for validation
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Validate YAML syntax (dry-run)
          kubectl apply --dry-run=client -f /tmp/rendered-templates.yaml || echo "Note: Some resources may require a cluster for full validation"

      - name: Template with custom values
        run: |
          helm template themisdb helm/themisdb \
            --set replicaCount=3 \
            --set image.tag=v1.0.0 \
            --set persistence.enabled=true \
            > /tmp/custom-templates.yaml
          echo "Custom template rendered successfully"

      - name: Display chart info (Dry-Run)
        run: |
          echo "## Helm Chart Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Chart NOT pushed to OCI registry" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Chart.yaml:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          cat helm/themisdb/Chart.yaml >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Default values.yaml:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          head -50 helm/themisdb/values.yaml >> $GITHUB_STEP_SUMMARY
          echo "..." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation command:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`shell" >> $GITHUB_STEP_SUMMARY
          echo "helm install themisdb oci://ghcr.io/makr-code/themisdb/charts/themisdb --version 0.1.0" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Configure OCI registry credentials" >> $GITHUB_STEP_SUMMARY
          echo "2. Add `helm push` step to workflow" >> $GITHUB_STEP_SUMMARY

      - name: Upload rendered templates
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: helm-rendered-templates
          path: /tmp/rendered-templates.yaml
          retention-days: 7

