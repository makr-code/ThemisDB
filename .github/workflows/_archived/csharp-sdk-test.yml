name: C# SDK [Dry-Run]

# C# (.NET) SDK build and test workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Package is built but NOT pushed to NuGet

on:
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

defaults:
  run:
    working-directory: clients/csharp

jobs:
  build-and-test:
    name: Build & Test (.NET 8.0)
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow builds and tests the C# SDK."
          echo "No packages are pushed to NuGet."
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          if [ -f "ThemisDB.Client/ThemisDB.Client.csproj" ]; then
            dotnet restore ThemisDB.Client/ThemisDB.Client.csproj
          else
            echo "No C# project found - skipping restore"
          fi

      - name: Build
        run: |
          if [ -f "ThemisDB.Client/ThemisDB.Client.csproj" ]; then
            dotnet build ThemisDB.Client/ThemisDB.Client.csproj --configuration Release --no-restore
          else
            echo "No C# project found - skipping build"
          fi

      - name: Run tests
        run: |
          if [ -f "ThemisDB.Client/ThemisDB.Client.csproj" ]; then
            if [ -d "ThemisDB.Client.Tests" ]; then
              dotnet test ThemisDB.Client.Tests/ThemisDB.Client.Tests.csproj --configuration Release --verbosity normal
            else
              echo "No test project found, skipping tests"
            fi
          else
            echo "No C# project found - skipping tests"
          fi

  package:
    name: Create NuGet Package (Dry-Run)
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          if [ -f "ThemisDB.Client/ThemisDB.Client.csproj" ]; then
            dotnet restore ThemisDB.Client/ThemisDB.Client.csproj
          else
            echo "No C# project found - skipping restore"
          fi

      - name: Build
        run: |
          if [ -f "ThemisDB.Client/ThemisDB.Client.csproj" ]; then
            dotnet build ThemisDB.Client/ThemisDB.Client.csproj --configuration Release --no-restore
          else
            echo "No C# project found - skipping build"
          fi

      - name: Create NuGet package
        run: |
          if [ -f "ThemisDB.Client/ThemisDB.Client.csproj" ]; then
            dotnet pack ThemisDB.Client/ThemisDB.Client.csproj --configuration Release --no-build --output ./nupkg
          else
            echo "No C# project found - skipping pack"
          fi

      - name: Display package info (Dry-Run)
        run: |
          echo "## C# SDK Build Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Package NOT pushed to NuGet" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built packages:" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          ls -la nupkg/*.nupkg 2>/dev/null || echo "No .nupkg files found"
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package installation:" >> $GITHUB_STEP_SUMMARY
          echo "```shell" >> $GITHUB_STEP_SUMMARY
          echo "dotnet add package ThemisDB.Client --version 0.1.0-beta.1" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Add NUGET_API_KEY as a repository secret" >> $GITHUB_STEP_SUMMARY
          echo "2. Uncomment the dotnet nuget push step" >> $GITHUB_STEP_SUMMARY

      - name: Upload NuGet package
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: csharp-sdk-nuget
          path: clients/csharp/nupkg/*.nupkg
          retention-days: 7

      # TODO: Uncomment for production releases
      # - name: Push to NuGet
      #   run: dotnet nuget push nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json