name: Retroactive Release Build

# This workflow allows building binaries for any historical version tag
# Useful for regenerating releases or building for new platforms

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g., v1.3.4, or leave empty for all tags)'
        required: false
        type: string
      platform:
        description: 'Target platform'
        required: true
        type: choice
        options:
          - linux
          - windows
          - macos
          - all
        default: 'linux'
      upload_to_release:
        description: 'Upload artifacts to existing GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # Required to upload release assets

jobs:
  # Build for Linux
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'all' }}
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
          submodules: recursive
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libcurl4-openssl-dev \
            librocksdb-dev libtbb-dev libspdlog-dev \
            nlohmann-json3-dev libboost-dev \
            libboost-system-dev libyaml-cpp-dev \
            libzstd-dev rpm
      
      - name: Setup vcpkg (if needed)
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          
          # Enable binary caching for faster builds (93% speedup)
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES" >> $GITHUB_ENV
          fi
      
      - name: Run Retroactive Builder
        run: |
          chmod +x ./scripts/retroactive-release-builder.sh
          
          if [ -n "${{ inputs.tag }}" ]; then
            ./scripts/retroactive-release-builder.sh \
              --tag "${{ inputs.tag }}" \
              --platform linux \
              --clean
          else
            ./scripts/retroactive-release-builder.sh \
              --all-tags \
              --platform linux \
              --clean
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ inputs.tag || 'all' }}
          path: release-retroactive/*/
          retention-days: 90
      
      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release && inputs.tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          files: release-retroactive/${{ inputs.tag }}/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  # Build for Windows
  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'all' }}
    timeout-minutes: 150
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
          submodules: recursive
      
      - name: Setup vcpkg (if needed)
        run: |
          if (-not (Test-Path "vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
        shell: powershell
      
      - name: Run Retroactive Builder
        run: |
          if ("${{ inputs.tag }}" -ne "") {
            .\scripts\retroactive-release-builder.ps1 `
              -Tag "${{ inputs.tag }}" `
              -Platform windows `
              -Clean
          } else {
            .\scripts\retroactive-release-builder.ps1 `
              -AllTags `
              -Platform windows `
              -Clean
          }
        shell: powershell
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages-${{ inputs.tag || 'all' }}
          path: release-retroactive\*\*
          retention-days: 90
      
      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release && inputs.tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          files: release-retroactive\${{ inputs.tag }}\*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  # Build for macOS
  build-macos:
    name: Build macOS Packages
    runs-on: macos-latest
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'all' }}
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for tags
          submodules: recursive
      
      - name: Install system dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config openssl
      
      - name: Setup vcpkg (if needed)
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          
          # Enable binary caching for faster builds (93% speedup)
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES" >> $GITHUB_ENV
          fi
      
      - name: Run Retroactive Builder
        run: |
          chmod +x ./scripts/retroactive-release-builder.sh
          
          if [ -n "${{ inputs.tag }}" ]; then
            ./scripts/retroactive-release-builder.sh \
              --tag "${{ inputs.tag }}" \
              --platform macos \
              --clean
          else
            ./scripts/retroactive-release-builder.sh \
              --all-tags \
              --platform macos \
              --clean
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages-${{ inputs.tag || 'all' }}
          path: release-retroactive/*/
          retention-days: 90
      
      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release && inputs.tag != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          files: release-retroactive/${{ inputs.tag }}/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  # Summary
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: always()
    
    steps:
      - name: Generate Summary
        run: |
          echo "## 🎉 Retroactive Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ inputs.tag }}" ]; then
            echo "**Tag:** ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Mode:** Build all tags" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "**Platform:** ${{ inputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ inputs.platform }}" = "linux" ] || [ "${{ inputs.platform }}" = "all" ]; then
            echo "| Linux | ${{ needs.build-linux.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ inputs.platform }}" = "windows" ] || [ "${{ inputs.platform }}" = "all" ]; then
            echo "| Windows | ${{ needs.build-windows.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ inputs.platform }}" = "macos" ] || [ "${{ inputs.platform }}" = "all" ]; then
            echo "| macOS | ${{ needs.build-macos.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts are available in the workflow run artifacts." >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ inputs.upload_to_release }}" = "true" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Artifacts uploaded to release ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
          fi
