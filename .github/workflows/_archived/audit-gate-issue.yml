# Audit Gate Issue Creator
# Automatically creates a pre-populated audit tracking issue for releases
# Based on the AUDIT_GATE_TEMPLATE.md
#
# This workflow:
# - Triggers on release preparation (tags starting with 'v')
# - Creates a GitHub issue from the audit template
# - Pre-fills version information
# - Labels for tracking
# - Assigns to audit team

name: Create Audit Gate Issue

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
      - 'v*.*.*-beta.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.4.1)'
        required: true
        type: string
      branch:
        description: 'Release branch'
        required: false
        default: 'main'
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-audit-issue:
    name: Create Audit Tracking Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Extract version information
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            BRANCH="${{ github.event.inputs.branch }}"
          else
            VERSION="${{ github.ref_name }}"
            BRANCH="${{ github.ref }}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          
      - name: Read audit template
        id: template
        run: |
          # Read the template file
          if [ -f "docs/audit-framework/AUDIT_GATE_TEMPLATE.md" ]; then
            TEMPLATE=$(cat docs/audit-framework/AUDIT_GATE_TEMPLATE.md)
          else
            echo "⚠️ Audit template not found, using basic template"
            TEMPLATE=$(cat << 'EOF'
          # ThemisDB Audit Gate - [VERSION]
          
          **Release Version:** [VERSION]
          **Audit Date:** [DATE]
          **Status:** 🔄 In Progress
          
          ## Quick Links
          - [Audit Charter](../docs/audit-framework/audit_charter_planning.md)
          - [Audit Runbook](../docs/audit-framework/AUDIT_RUNBOOK.md)
          - [Compliance Mapping](../docs/audit-framework/COMPLIANCE_MAPPING.md)
          
          ## Audit Checklist
          
          ### 1️⃣ Governance & Planning
          - [ ] Audit charter reviewed
          - [ ] Scope defined
          - [ ] Team assigned
          - [ ] Previous findings reviewed
          
          ### 2️⃣ Risk Assessment
          - [ ] Threat modeling completed
          - [ ] Vulnerability scan executed
          - [ ] Risk ratings assigned
          
          ### 3️⃣ Security Controls
          - [ ] Authentication verified
          - [ ] Authorization tested
          - [ ] Encryption validated
          - [ ] Input validation checked
          
          ### 4️⃣ Compliance Verification
          - [ ] ISO 27001 compliance verified
          - [ ] NIST CSF assessed
          - [ ] OWASP ASVS Level 2 verified
          - [ ] BSI C5 compliance checked
          - [ ] SOC 2 criteria met
          - [ ] SLSA Level 3 achieved
          
          ### 5️⃣ Code Quality & SAST
          - [ ] Static analysis clean
          - [ ] Code review completed
          - [ ] Security SAST passed
          - [ ] No hardcoded secrets
          
          ### 6️⃣ Testing & QA
          - [ ] Unit test coverage >80%
          - [ ] Integration tests passed
          - [ ] Security tests executed
          - [ ] Performance benchmarks met
          
          ### 7️⃣ Documentation
          - [ ] Architecture docs updated
          - [ ] API docs complete
          - [ ] Security docs current
          - [ ] Changelog updated
          
          ### 8️⃣ Findings Management
          - [ ] All P0 findings resolved
          - [ ] P1 findings addressed or accepted
          - [ ] Remediation plans documented
          
          ### 9️⃣ Sign-Off & Approval
          - [ ] Lead Auditor sign-off
          - [ ] Security Team sign-off
          - [ ] Compliance Officer sign-off
          - [ ] Release Manager approval
          
          ## Findings Register
          
          | ID | Priority | Description | Status | Owner | Target Date |
          |----|----------|-------------|--------|-------|-------------|
          | | | | | | |
          
          ## Evidence Collection
          
          - [ ] SAST reports collected
          - [ ] Test results documented
          - [ ] Compliance checklists completed
          - [ ] Code review records saved
          
          ## Audit Decision
          
          **Status:** 🔄 Pending
          
          - [ ] ✅ APPROVED - Ready for release
          - [ ] ⚠️ CONDITIONAL - Approved with conditions
          - [ ] ❌ BLOCKED - Critical issues must be resolved
          
          ### Comments
          
          [Add audit comments and decisions here]
          
          ---
          
          **Workflow Run:** [WORKFLOW_URL]
          **Automated Checks:** See [audit-check workflow results](../../actions/workflows/audit-check.yml)
          EOF
          )
          fi
          
          # Replace placeholders
          TEMPLATE="${TEMPLATE//\[VERSION\]/${{ steps.version.outputs.version }}}"
          TEMPLATE="${TEMPLATE//\[RELEASE_VERSION\]/${{ steps.version.outputs.version }}}"
          TEMPLATE="${TEMPLATE//\[AUDIT_DATE\]/${{ steps.version.outputs.date }}}"
          TEMPLATE="${TEMPLATE//\[DATE\]/${{ steps.version.outputs.date }}}"
          TEMPLATE="${TEMPLATE//\[START_DATE\]/${{ steps.version.outputs.date }}}"
          TEMPLATE="${TEMPLATE//\[GIT_BRANCH\]/${{ steps.version.outputs.branch }}}"
          TEMPLATE="${TEMPLATE//\[GIT_COMMIT_SHA\]/${{ steps.version.outputs.commit }}}"
          TEMPLATE="${TEMPLATE//\[WORKFLOW_URL\]/${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}}"
          
          # Save to file (GitHub doesn't support multiline in outputs directly)
          echo "$TEMPLATE" > issue_body.md
          
      - name: Create audit tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueBody = fs.readFileSync('issue_body.md', 'utf8');
            
            // Check if issue already exists for this version
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'audit-gate',
              per_page: 100
            });
            
            const version = '${{ steps.version.outputs.version }}';
            const existingIssue = existingIssues.data.find(issue => 
              issue.title.includes(version)
            );
            
            if (existingIssue) {
              console.log(`Issue already exists for ${version}: #${existingIssue.number}`);
              console.log(`URL: ${existingIssue.html_url}`);
              
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Audit workflow re-triggered**\n\nWorkflow Run: ${context.payload.repository.html_url}/actions/runs/${context.runId}\nCommit: ${context.sha}\nDate: ${{ steps.version.outputs.date }}`
              });
              
              // Reopen if closed
              if (existingIssue.state === 'closed') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existingIssue.number,
                  state: 'open'
                });
                console.log('Reopened existing issue');
              }
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔍 Audit Gate: ${version}`,
                body: issueBody,
                labels: [
                  'audit-gate',
                  'security',
                  'compliance',
                  'release'
                ],
                assignees: [] // Add default assignees here if needed
              });
              
              console.log(`Created audit issue #${issue.data.number}`);
              console.log(`URL: ${issue.data.html_url}`);
              
              // Add to project board if configured
              // Uncomment and configure if you have a project board
              // const project = await github.rest.projects.listForRepo({
              //   owner: context.repo.owner,
              //   repo: context.repo.repo
              // });
              // ... add card to project
            }
            
      - name: Summary
        run: |
          echo "# ✅ Audit Gate Issue Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${{ steps.version.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "An audit tracking issue has been created or updated." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the audit checklist in the issue" >> $GITHUB_STEP_SUMMARY
          echo "2. Execute audit procedures per runbook" >> $GITHUB_STEP_SUMMARY
          echo "3. Document findings and evidence" >> $GITHUB_STEP_SUMMARY
          echo "4. Obtain required sign-offs" >> $GITHUB_STEP_SUMMARY
          echo "5. Update issue with final audit decision" >> $GITHUB_STEP_SUMMARY
