name: CI [System Libraries Only]

# Lightweight workflow testing build with system libraries only
# No vcpkg - useful for verifying core functionality without third-party deps
# Designed for local testing with 'act'

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  build-system-libs-only:
    name: Build with System Libraries Only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (comprehensive)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config flex bison \
            libssl-dev libcurl4-openssl-dev \
            librocksdb-dev \
            libboost-dev libboost-system-dev libboost-container-dev libboost-thread-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libtbb-dev \
            libzstd-dev \
            libgtest-dev \
            cppcheck

      - name: Configure CMake (system libraries only, no vcpkg)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            || true
        continue-on-error: true

      - name: Show CMake configuration result
        run: |
          if [ -f build/CMakeCache.txt ]; then
            echo "✅ CMake configured successfully"
            echo "Configured packages:"
            grep -E '^[A-Z_]+_FOUND:' build/CMakeCache.txt | head -20
          else
            echo "⚠️  CMake configuration had issues (expected if packages missing)"
          fi

      - name: Build core components
        run: |
          if [ -f build/CMakeCache.txt ]; then
            cmake --build build --config ${{ env.BUILD_TYPE }} -j $(nproc) 2>&1 | head -100
          fi
        continue-on-error: true

      - name: Build Summary
        if: always()
        run: |
          echo "## System Libraries Only Build" >> $GITHUB_STEP_SUMMARY
          echo "📦 Testing with system libraries (no vcpkg)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Build Type: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- Platform: Ubuntu 24.04" >> $GITHUB_STEP_SUMMARY
          echo "- vcpkg: Disabled" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installed System Libraries" >> $GITHUB_STEP_SUMMARY
          dpkg -l | grep -E 'rocksdb|boost|openssl|spdlog|tbb' | awk '{print "- " $2 " (" $3 ")"}' || echo "- (check apt output)"
