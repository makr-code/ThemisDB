name: Rust SDK [Dry-Run]

# Rust SDK build and test workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Crate is built but NOT published to crates.io

on:
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read
  pull-requests: write
  checks: write

defaults:
  run:
    working-directory: clients/rust

jobs:
  build-and-test:
    name: Test Rust ${{ matrix.rust-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-version: ['stable', 'beta', '1.70.0']
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow builds and tests the Rust SDK."
          echo "No crates are published to crates.io."
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust ${{ matrix.rust-version }}
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy
          cache-workspaces: clients/rust -> target

      - name: Check formatting
        if: matrix.rust-version == 'stable'
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: matrix.rust-version == 'stable'
        continue-on-error: true
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose --all-features
      
      - name: Install cargo2junit for test reporting
        if: env.ACT != 'true'
        run: cargo install cargo2junit || true
        continue-on-error: true
        working-directory: .

      - name: Run tests
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            echo "ACT detected - running build test only"
            cargo build --verbose
            exit 0
          fi
          if command -v cargo2junit &> /dev/null; then
            cargo test --verbose --all-features -- -Z unstable-options --format json --report-time | cargo2junit > test-results.xml || cargo test --verbose --all-features
          else
            cargo test --verbose --all-features
          fi
        continue-on-error: true
      
      - name: Upload Test Results
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rust-${{ matrix.rust-version }}
          path: clients/rust/test-results.xml
          retention-days: 30
      
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always() && env.ACT != 'true'
        with:
          name: 'Rust SDK Tests (Rust ${{ matrix.rust-version }})'
          path: clients/rust/test-results.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: clients/rust

      - name: Run doc tests
        if: env.ACT != 'true'
        continue-on-error: true
        run: cargo test --doc

      - name: Build documentation
        if: env.ACT != 'true'
        continue-on-error: true
        run: cargo doc --no-deps --all-features

      - name: Generate test report
        if: always()
        run: |
          echo "## Rust SDK Test Results (Rust ${{ matrix.rust-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status: ✅ Success" >> $GITHUB_STEP_SUMMARY

  package:
    name: Package Crate (Dry-Run)
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: clients/rust -> target

      - name: Verify crate
        run: cargo package --allow-dirty

      - name: Display package info (Dry-Run)
        run: |
          echo "## Rust SDK Build Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Crate NOT published to crates.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Crate name:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep '^name = ' Cargo.toml | head -1 >> $GITHUB_STEP_SUMMARY
          grep '^version = ' Cargo.toml | head -1 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cargo.toml dependency:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`toml" >> $GITHUB_STEP_SUMMARY
          echo "[dependencies]" >> $GITHUB_STEP_SUMMARY
          echo "themisdb = \"0.1.0\"" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Add CARGO_REGISTRY_TOKEN as a repository secret" >> $GITHUB_STEP_SUMMARY
          echo "2. Uncomment the cargo publish step" >> $GITHUB_STEP_SUMMARY

      - name: Upload package artifact
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rust-sdk-crate
          path: clients/rust/target/package/*.crate
          retention-days: 7

      # TODO: Uncomment for production releases
      # - name: Publish to crates.io
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #   run: cargo publish
