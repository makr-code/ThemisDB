name: Sync Documentation to GitHub Wiki

# This workflow syncs documentation to GitHub Wiki only when explicitly triggered:
# - On version tags (v*.*.*)
# - Manual workflow dispatch from GitHub UI
# No automatic/scheduled syncs - on-demand only!

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync to GitHub Wiki
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Wiki repository
        if: env.ACT != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update metadata files
        run: |
          # Get current date
          CURRENT_DATE=$(date '+%B %d, %Y')
          COMMIT_SHORT="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_SHORT:0:7}"
          
          # Update Footer with current date and commit
          cat > docs/_Footer.md << EOF
          ---
          
          **ThemisDB v1.3.4** | [GitHub](https://github.com/makr-code/ThemisDB) | [Documentation](https://makr-code.github.io/ThemisDB/) | [Discussions](https://github.com/makr-code/ThemisDB/discussions) | [License](https://github.com/makr-code/ThemisDB/blob/main/LICENSE)
          
          Last synced: ${CURRENT_DATE} | Commit: ${COMMIT_SHORT}
          EOF
          
          echo "✓ Updated _Footer.md with current date: ${CURRENT_DATE}"
          
          # Convert docs links to wiki links in sidebar
          if [ -f "docs/_Sidebar.md" ]; then
            # Create a wiki-compatible version
            cp docs/_Sidebar.md docs/_Sidebar_wiki.md
            # Convert .md links to wiki format: [text](file.md) -> [text](file)
            sed -i 's/(\([^)]*\)\.md)/(\1)/g' docs/_Sidebar_wiki.md
            # Convert directory/file paths to wiki format
            sed -i 's/](storage\//](storage-/g' docs/_Sidebar_wiki.md
            sed -i 's/](content\//](content-/g' docs/_Sidebar_wiki.md
            sed -i 's/](search\//](search-/g' docs/_Sidebar_wiki.md
            sed -i 's/](aql\//](aql-/g' docs/_Sidebar_wiki.md
            echo "✓ Converted _Sidebar.md links to wiki format"
          fi
          
          # Update Home.md with wiki-compatible links
          if [ -f "docs/Home.md" ]; then
            cp docs/Home.md docs/Home_wiki.md
            # Convert doc links to wiki format
            sed -i 's/(\([^)]*\)\.md)/(\1)/g' docs/Home_wiki.md
            echo "✓ Converted Home.md links to wiki format"
          fi

      - name: Prepare Wiki content
        run: |
          # Create wiki directory if running under act
          mkdir -p wiki
          
          echo "## Syncing documentation to Wiki"
          
          # Copy main documentation files
          if [ -f "docs/Home_wiki.md" ]; then
            cp docs/Home_wiki.md wiki/Home.md
            echo "✓ Copied Home.md (wiki-converted)"
          elif [ -f "docs/README.md" ]; then
            cp docs/README.md wiki/Home.md
            echo "✓ Copied Home.md from README.md"
          elif [ -f "docs/Home.md" ]; then
            cp docs/Home.md wiki/Home.md
            echo "✓ Copied Home.md"
          fi
          
          # Copy sidebar and footer if they exist
          if [ -f "docs/_Sidebar_wiki.md" ]; then
            cp docs/_Sidebar_wiki.md wiki/_Sidebar.md
            echo "✓ Copied _Sidebar.md (wiki-converted)"
          elif [ -f "docs/_Sidebar.md" ]; then
            cp docs/_Sidebar.md wiki/_Sidebar.md
            echo "✓ Copied _Sidebar.md"
          fi
          
          if [ -f "docs/_Footer.md" ]; then
            cp docs/_Footer.md wiki/_Footer.md
            echo "✓ Copied _Footer.md (updated)"
          fi
          
          # Copy language-specific documentation
          for lang in en de es fr ja; do
            if [ -d "docs/$lang" ]; then
              mkdir -p "wiki/$lang"
              cp -r "docs/$lang"/* "wiki/$lang/" 2>/dev/null || true
              echo "✓ Copied $lang documentation"
            fi
          done
          
          # Copy feature documentation
          if [ -d "docs/features" ]; then
            mkdir -p wiki/features
            cp -r docs/features/* wiki/features/ 2>/dev/null || true
            echo "✓ Copied features documentation"
          fi
          
          # Copy glossary
          if [ -f "docs/glossary.md" ]; then
            cp docs/glossary.md wiki/Glossary.md
            echo "✓ Copied Glossary"
          fi
          
          # Copy quick reference
          if [ -f "docs/QUICK_REFERENCE.md" ]; then
            cp docs/QUICK_REFERENCE.md wiki/Quick-Reference.md
            echo "✓ Copied Quick Reference"
          fi
          
          # Create index page
          cat > wiki/Documentation-Index.md << 'EOF'
          # ThemisDB Documentation Index
          
          Welcome to the ThemisDB documentation wiki.
          
          ## 📚 Main Documentation
          - [Home](Home)
          - [Quick Reference](Quick-Reference)
          - [Glossary](Glossary)
          
          ## 🌍 Language-Specific Documentation
          - [English Documentation](en/README)
          - [Deutsche Dokumentation](de/README)
          - [Documentación en Español](es/README)
          - [Documentation Française](fr/README)
          - [日本語ドキュメント](ja/README)
          
          ## ⚡ Features
          - [Feature Overview](features/README)
          
          ## 🔗 External Resources
          - [GitHub Repository](https://github.com/makr-code/ThemisDB)
          - [API Documentation](https://makr-code.github.io/ThemisDB/)
          EOF
          
          echo "✓ Created Documentation Index"
          
          # Summary
          echo ""
          echo "## Wiki Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "📁 Synced documentation files to GitHub Wiki" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Synced directories:" >> $GITHUB_STEP_SUMMARY
          echo "- docs/en/" >> $GITHUB_STEP_SUMMARY
          echo "- docs/de/" >> $GITHUB_STEP_SUMMARY
          echo "- docs/features/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Entry points:" >> $GITHUB_STEP_SUMMARY
          echo "- [Home](Home.md)" >> $GITHUB_STEP_SUMMARY
          echo "- [Documentation Index](Documentation-Index.md)" >> $GITHUB_STEP_SUMMARY

      - name: Commit and push to Wiki
        if: env.ACT != 'true'
        working-directory: wiki
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Sync documentation from main repository
          
          Automated sync triggered by: ${{ github.event_name }}
          Commit: ${{ github.sha }}
          "
          
          git push origin master || git push origin main
          
          echo "✅ Wiki updated successfully"

      - name: Summary (local act run)
        if: env.ACT == 'true'
        run: |
          echo "## ACT Mode - Wiki Sync Simulation"
          echo "✓ Documentation prepared in wiki/ directory"
          echo "✓ In production, this would push to ${{ github.repository }}.wiki"
          ls -la wiki/ | head -20
