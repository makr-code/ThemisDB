name: Cache Warmup Parallel Bulk Load CI

# Triggered on every push / PR that touches the warmup sources,
# the adaptive query cache header, or this workflow itself.
# Targets v1.8.0 – Issue #244.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/cache/warmup.cpp'
      - 'include/cache/adaptive_query_cache.h'
      - 'src/server/cache_admin_api_handler.cpp'
      - 'tests/test_cache_warmup.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cache-warmup-parallel-bulk-load-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/cache/warmup.cpp'
      - 'include/cache/adaptive_query_cache.h'
      - 'src/server/cache_admin_api_handler.cpp'
      - 'tests/test_cache_warmup.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cache-warmup-parallel-bulk-load-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CacheWarmup focused test suite.
  # Tests cover all acceptance criteria for Issue #244:
  #   AC-1  N-chunk NDJSON partitioning + N std::async workers (parallel correctness)
  #   AC-2  Config::max_parallel_workers defaults to hardware_concurrency (≥ 1)
  #   AC-3  WarmupResult::warmup_duration_ms and warmup_entries_per_second reported
  #   AC-4  Single-worker path produces identical results to parallel path
  #   AC-5  Existing warmup correctness (round-trip, malformed JSON, TTL, quota, tenant)
  # ---------------------------------------------------------------------------
  cache-warmup-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Cache warmup parallel tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04/gcc-12
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12

          - name: ubuntu-24.04/gcc-14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev
            libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev
            libsimdjson-dev libsnappy-dev liblz4-dev

      - name: Configure (cache warmup test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_BUILD_TESTS=ON

      - name: Build cache warmup test binary
        run: |
          cmake --build build \
            --target test_cache_warmup \
            -- -j$(nproc)

      - name: Run CacheWarmupTests
        run: |
          cd build
          ctest --test-dir . -R CacheWarmupTests \
                --output-on-failure --timeout 60
