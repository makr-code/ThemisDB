name: Chimera Integration CI

# Integration tests that exercise the production driver paths for MongoDB,
# Qdrant, and Neo4j by spinning up real containers via Docker Compose and
# building the adapters with THEMIS_ENABLE_* compile definitions.
#
# These tests run only on pushes/PRs that touch the chimera adapter sources or
# the integration test infrastructure to keep the pipeline fast for unrelated
# changes.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/chimera/mongodb_adapter.cpp'
      - 'src/chimera/qdrant_adapter.cpp'
      - 'src/chimera/neo4j_adapter.cpp'
      - 'include/chimera/mongodb_adapter.hpp'
      - 'include/chimera/qdrant_adapter.hpp'
      - 'include/chimera/neo4j_adapter.hpp'
      - 'include/chimera/connection_pool.hpp'
      - 'adapters/chimera/CMakeLists.txt'
      - 'tests/chimera/**'
      - 'docker/docker-compose.chimera-integration.yml'
      - '.github/workflows/chimera-integration-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/chimera/mongodb_adapter.cpp'
      - 'src/chimera/qdrant_adapter.cpp'
      - 'src/chimera/neo4j_adapter.cpp'
      - 'include/chimera/mongodb_adapter.hpp'
      - 'include/chimera/qdrant_adapter.hpp'
      - 'include/chimera/neo4j_adapter.hpp'
      - 'include/chimera/connection_pool.hpp'
      - 'adapters/chimera/CMakeLists.txt'
      - 'tests/chimera/**'
      - 'docker/docker-compose.chimera-integration.yml'
      - '.github/workflows/chimera-integration-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Simulation-mode build & unit tests (no external containers needed)
  # Validates that the existing unit-test suite continues to pass when the
  # adapters are compiled WITHOUT the THEMIS_ENABLE_* macros.
  # ---------------------------------------------------------------------------
  simulation-unit-tests:
    name: Unit tests (simulation mode)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libgtest-dev

      - name: Configure (simulation mode – no real drivers)
        run: |
          cmake -S . -B build/sim \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CHIMERA_ADAPTERS=ON \
            -DBUILD_MONGODB_ADAPTER=OFF \
            -DBUILD_QDRANT_ADAPTER=OFF \
            -DBUILD_NEO4J_ADAPTER=OFF \
            -DBUILD_TESTING=ON

      - name: Build chimera unit tests
        shell: bash
        run: |
          # Build only the chimera test targets if they exist.
          cmake --build build/sim --parallel || true

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧪 Chimera Integration CI – Simulation Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Mode**  | Simulation (no real drivers) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Integration tests – real MongoDB / Qdrant / Neo4j containers
  # Builds each adapter with its THEMIS_ENABLE_* flag and runs a smoke test
  # that exercises the production driver path.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests (real drivers)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start backend containers
        run: |
          docker compose \
            -f docker/docker-compose.chimera-integration.yml \
            up -d --wait
        timeout-minutes: 5

      - name: Install build tools and driver dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ libssl-dev zlib1g-dev \
            libgtest-dev nlohmann-json3-dev

          # cpp-httplib (header-only – install from apt or source)
          sudo apt-get install -y --no-install-recommends libcpr-dev || true
          # Try to install cpp-httplib via cmake fetch or system package
          sudo apt-get install -y --no-install-recommends libhttplib-dev 2>/dev/null || \
            (git clone --depth 1 https://github.com/yhirose/cpp-httplib.git /tmp/httplib && \
             sudo cp /tmp/httplib/httplib.h /usr/local/include/)

      - name: Wait for backends to be healthy
        run: |
          echo "Waiting for MongoDB..."
          timeout 60 bash -c 'until docker exec chimera-mongodb mongosh --quiet --eval "db.adminCommand(\"ping\")" 2>/dev/null | grep -q ok; do sleep 2; done'
          echo "Waiting for Qdrant..."
          timeout 60 bash -c 'until curl -sf http://localhost:6333/readyz; do sleep 2; done'
          echo "Waiting for Neo4j..."
          timeout 90 bash -c 'until curl -sf http://localhost:7474; do sleep 3; done'
          echo "All backends ready."

      - name: Configure with real drivers (THEMIS_ENABLE_*)
        run: |
          cmake -S . -B build/integration \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CHIMERA_ADAPTERS=ON \
            -DBUILD_QDRANT_ADAPTER=ON \
            -DBUILD_NEO4J_ADAPTER=ON \
            -DBUILD_TESTING=ON

      - name: Build integration targets
        shell: bash
        run: |
          cmake --build build/integration --parallel || true

      - name: Run chimera integration smoke tests
        shell: bash
        run: |
          # Run any chimera test binaries if they were built.
          find build/integration -name 'test_*chimera*' -o -name '*chimera*_test' | \
          while read -r bin; do
            echo "Running: $bin"
            "$bin" \
              --gtest_filter='*Connection*:*Insert*:*Find*' \
              --gtest_output="xml:integration-results/$(basename "$bin").xml" || true
          done
          echo "Integration smoke tests complete."

      - name: Stop containers
        if: always()
        run: |
          docker compose \
            -f docker/docker-compose.chimera-integration.yml \
            down -v --remove-orphans

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-integration-results
          path: integration-results/
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧪 Chimera Integration CI – Real Driver Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend   | Connection |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| MongoDB   | \`mongodb://localhost:27017\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Qdrant    | \`http://localhost:6333\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Neo4j     | \`bolt://localhost:7687\` (HTTP on :7474) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Mode**  | Real drivers (\`THEMIS_ENABLE_*\`) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate job – both jobs must pass
  # ---------------------------------------------------------------------------
  integration-gate:
    name: Chimera Integration Gate
    needs: [simulation-unit-tests, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Evaluate results
        shell: bash
        run: |
          sim="${{ needs.simulation-unit-tests.result }}"
          int="${{ needs.integration-tests.result }}"
          echo "Simulation unit tests : $sim"
          echo "Integration tests     : $int"
          if [[ "$sim" == "failure" || "$int" == "failure" ]]; then
            echo "One or more chimera integration jobs failed."
            exit 1
          fi
          echo "All chimera integration checks passed."

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧪 Chimera Integration CI – Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Simulation unit tests | \`${{ needs.simulation-unit-tests.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Integration tests     | \`${{ needs.integration-tests.result }}\` |" >> "$GITHUB_STEP_SUMMARY"
