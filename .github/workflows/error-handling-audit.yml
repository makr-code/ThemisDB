name: Error-Handling Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'include/**'
      - 'apps/**'
      - 'tools/**'
      - 'scripts/**'
      - 'clients/**'
      - 'plugins/**'
      - 'tools/error_handling_audit.py'
      - 'tools/error_handling_audit.ignore'
      - 'tests/test_error_handling_audit.py'
      - '.github/workflows/error-handling-audit.yml'

jobs:
  audit:
    name: Error-Handling Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests for the audit tool
        run: |
          pip install pytest --quiet
          python -m pytest tests/test_error_handling_audit.py -v

      - name: Run error-handling audit
        # The --max-violations budget is set to the violation count at the time this
        # workflow was introduced (2026-02). The intent is to ratchet this number down
        # over time as the migration documented in docs/error_handling/ progresses.
        # A PR that introduces NEW violations will push the count above the budget and
        # fail this job.  To tighten enforcement: lower N here and fix the violations.
        run: |
          python tools/error_handling_audit.py \
            --ignore-file tools/error_handling_audit.ignore \
            --format text \
            --no-color \
            --max-violations 819 \
            src include apps tools scripts clients plugins
