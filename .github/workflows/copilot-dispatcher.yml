name: Copilot Issue Dispatcher

on:
  # Baseline heartbeat – run every 30 minutes as a fallback.
  schedule:
    - cron: '*/30 * * * *'

  # Manual trigger from the Actions UI.
  workflow_dispatch:

  # Re-evaluate capacity whenever a PR's label set changes, it is closed, or
  # its head is updated.
  pull_request:
    types: [labeled, unlabeled, closed, synchronize]

  # Re-evaluate when a CI check suite completes (a PR may have just gone green
  # or a Copilot PR may have just been closed by CI failure).
  check_suite:
    types: [completed]

  # Alternative / additional trigger for repos that surface results via
  # workflow_run rather than check_suite.
  workflow_run:
    workflows: ['*']
    types: [completed]

# Only one dispatcher run at a time to prevent race conditions.
concurrency:
  group: copilot-dispatcher
  cancel-in-progress: false

permissions:
  contents: write      # create branches
  pull-requests: write # create PRs, add labels
  issues: write        # add labels to issues

jobs:
  dispatch:
    name: Dispatch Copilot issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (needed to read config)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Run dispatcher
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');     // available via @actions/github-script

            // ── Load configuration ──────────────────────────────────────────
            let config = { wip_limit: 5, base_branch: 'develop', copilot_reviewer_logins: [] };
            try {
              const raw = fs.readFileSync('.github/copilot-dispatcher.yml', 'utf8');
              config = { ...config, ...yaml.load(raw) };
            } catch (e) {
              core.warning(`Could not read .github/copilot-dispatcher.yml: ${e.message}. Using defaults.`);
            }

            const WIP_LIMIT    = config.wip_limit    ?? 5;
            const BASE_BRANCH  = config.base_branch  ?? 'develop';
            const OWNER        = context.repo.owner;
            const REPO         = context.repo.repo;

            core.info(`Config: wip_limit=${WIP_LIMIT}, base_branch=${BASE_BRANCH}`);

            // ── Count active Copilot PRs ────────────────────────────────────
            // Active = open pr/copilot PRs that do NOT have copilot/status-ready.
            const activePRs = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              {
                q: `repo:${OWNER}/${REPO} is:pr is:open label:pr/copilot -label:copilot/status-ready`,
                per_page: 100,
              }
            );
            const activeCount = activePRs.length;
            core.info(`Active Copilot PRs: ${activeCount} / ${WIP_LIMIT}`);

            const needed = WIP_LIMIT - activeCount;
            if (needed <= 0) {
              core.info('WIP limit reached – nothing to dispatch.');
              return;
            }

            // ── Build a set of issue numbers already linked to an open PR ───
            // This prevents creating a duplicate PR for an issue that already
            // has one (idempotency guard).
            const allCopilotPRs = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              {
                q: `repo:${OWNER}/${REPO} is:pr is:open label:pr/copilot`,
                per_page: 100,
              }
            );
            const claimedIssueNumbers = new Set();
            for (const pr of allCopilotPRs) {
              const body = pr.body ?? '';
              const matches = body.matchAll(/Closes\s+#(\d+)/gi);
              for (const m of matches) {
                claimedIssueNumbers.add(parseInt(m[1], 10));
              }
            }

            // ── Fetch queued issues ─────────────────────────────────────────
            const queuedIssues = await github.paginate(
              github.rest.search.issuesAndPullRequests,
              {
                q: `repo:${OWNER}/${REPO} is:issue is:open label:queue/copilot -label:in-progress/copilot -label:blocked`,
                sort: 'created',
                order: 'asc',
                per_page: 100,
              }
            );
            core.info(`Queued issues available: ${queuedIssues.length}`);

            // ── Dispatch up to 'needed' issues ──────────────────────────────
            let dispatched = 0;
            for (const issue of queuedIssues) {
              if (dispatched >= needed) break;

              const issueNumber = issue.number;

              // Skip if we already have an open PR for this issue.
              if (claimedIssueNumbers.has(issueNumber)) {
                core.info(`Issue #${issueNumber} already has an open Copilot PR – skipping.`);
                continue;
              }

              core.info(`Claiming issue #${issueNumber}: "${issue.title}"`);

              // ── Atomically claim the issue ────────────────────────────────
              try {
                await github.rest.issues.addLabels({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: issueNumber,
                  labels: ['in-progress/copilot'],
                });
              } catch (e) {
                core.warning(`Failed to label issue #${issueNumber}: ${e.message}. Skipping.`);
                continue;
              }

              // ── Create a branch for this issue ────────────────────────────
              const safeName = issue.title
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 50);
              const branchName = `copilot/issue-${issueNumber}-${safeName}`;

              // Resolve the SHA of the base branch.
              let baseSha;
              try {
                const { data: ref } = await github.rest.git.getRef({
                  owner: OWNER,
                  repo: REPO,
                  ref: `heads/${BASE_BRANCH}`,
                });
                baseSha = ref.object.sha;
              } catch (e) {
                core.warning(`Could not resolve base branch '${BASE_BRANCH}': ${e.message}. Skipping issue #${issueNumber}.`);
                // Roll back the label claim so the issue stays in the queue.
                await github.rest.issues.removeLabel({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: issueNumber,
                  name: 'in-progress/copilot',
                }).catch(() => {});
                continue;
              }

              try {
                await github.rest.git.createRef({
                  owner: OWNER,
                  repo: REPO,
                  ref: `refs/heads/${branchName}`,
                  sha: baseSha,
                });
                core.info(`Created branch '${branchName}'.`);
              } catch (e) {
                if (e.status === 422) {
                  core.info(`Branch '${branchName}' already exists – reusing.`);
                } else {
                  core.warning(`Failed to create branch for issue #${issueNumber}: ${e.message}. Skipping.`);
                  await github.rest.issues.removeLabel({
                    owner: OWNER,
                    repo: REPO,
                    issue_number: issueNumber,
                    name: 'in-progress/copilot',
                  }).catch(() => {});
                  continue;
                }
              }

              // ── Create the PR ─────────────────────────────────────────────
              const prTitle = `[COPILOT] ${issue.title}`;
              const prBody  = [
                '> **Copilot Dispatcher** — This PR was created automatically.',
                `> It addresses issue **#${issueNumber}**.`,
                '',
                `Closes #${issueNumber}`,
                '',
                '---',
                '',
                `**Issue:** [#${issueNumber} – ${issue.title}](${issue.html_url})`,
                '',
                '_Human review and merge are required before this PR is integrated._',
              ].join('\n');

              let pr;
              try {
                const { data: newPR } = await github.rest.pulls.create({
                  owner: OWNER,
                  repo: REPO,
                  title: prTitle,
                  head: branchName,
                  base: BASE_BRANCH,
                  body: prBody,
                  draft: false,
                });
                pr = newPR;
                core.info(`Created PR #${pr.number} for issue #${issueNumber}.`);
              } catch (e) {
                core.warning(`Failed to create PR for issue #${issueNumber}: ${e.message}.`);
                // Roll back label claim.
                await github.rest.issues.removeLabel({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: issueNumber,
                  name: 'in-progress/copilot',
                }).catch(() => {});
                continue;
              }

              // ── Label the PR ──────────────────────────────────────────────
              try {
                await github.rest.issues.addLabels({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: pr.number,
                  labels: ['pr/copilot', 'copilot/status-working'],
                });
              } catch (e) {
                core.warning(`Could not add labels to PR #${pr.number}: ${e.message}`);
              }

              dispatched++;
              core.info(`Dispatched ${dispatched}/${needed}: PR #${pr.number} → issue #${issueNumber}.`);
            }

            core.info(`Dispatcher finished. Dispatched ${dispatched} new Copilot PR(s).`);
