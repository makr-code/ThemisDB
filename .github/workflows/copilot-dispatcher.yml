name: Copilot Issue Dispatcher

on:
  # Baseline heartbeat – run every 30 minutes as a fallback.
  schedule:
    - cron: '*/30 * * * *'

  # Manual trigger from the Actions UI.
  workflow_dispatch:

  # Re-evaluate capacity whenever a PR's label set changes, it is closed, or
  # its head is updated.
  pull_request:
    types: [labeled, unlabeled, closed, synchronize]

  # Re-evaluate when a CI check suite completes (a PR may have just gone green
  # or a Copilot PR may have just been closed by CI failure).
  check_suite:
    types: [completed]

# Only one dispatcher run at a time to prevent race conditions.
concurrency:
  group: copilot-dispatcher
  cancel-in-progress: false

permissions:
  contents: write      # create branches
  pull-requests: write # create PRs, add labels
  issues: write        # add labels to issues

jobs:
  dispatch:
    name: Dispatch Copilot issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (needed to read config)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install js-yaml
        run: npm install js-yaml

      - name: Run dispatcher
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const yaml = require(`${process.env.GITHUB_WORKSPACE}/node_modules/js-yaml`);

            // ── Load configuration ──────────────────────────────────────────
            let config = { wip_limit: 5, base_branch: 'develop', draft: true, copilot_reviewer_logins: [] };
            try {
              const raw = fs.readFileSync('.github/copilot-dispatcher.yml', 'utf8');
              config = { ...config, ...yaml.load(raw) };
            } catch (e) {
              core.warning(`Could not read .github/copilot-dispatcher.yml: ${e.message}. Using defaults.`);
            }

            const WIP_LIMIT    = config.wip_limit    ?? 5;
            const BASE_BRANCH  = config.base_branch  ?? 'develop';
            const DRAFT        = config.draft        ?? true;
            const OWNER        = context.repo.owner;
            const REPO         = context.repo.repo;

            core.info(`Config: wip_limit=${WIP_LIMIT}, base_branch=${BASE_BRANCH}, draft=${DRAFT}`);

            // ── Helper: abort the entire dispatch run on unrecoverable errors ──
            // Marks the workflow step as failed (stops the job) and emits a
            // budget hint so operators know a re-run costs Actions minutes.
            function abortDispatch(msg) {
              core.setFailed(
                `⛔ Dispatcher aborted – ${msg}\n` +
                `💡 Budget hint: every failed run consumes GitHub Actions minutes. ` +
                `Fix the underlying issue (permissions, rate-limits, configuration) ` +
                `before re-running the dispatcher.`
              );
              throw new Error(msg);
            }

            // ── Helper: best-effort rollback of in-progress label ─────────────
            async function rollbackClaim(issueNumber) {
              await github.rest.issues.removeLabel({
                owner: OWNER,
                repo: REPO,
                issue_number: issueNumber,
                name: 'in-progress/copilot',
              }).catch(err => core.warning(`Rollback of in-progress/copilot on #${issueNumber} failed: ${err.message}`));
            }

            // ── Count active Copilot PRs ────────────────────────────────────
            // Active = open pr/copilot PRs that do NOT have copilot/status-ready.
            let activePRs;
            try {
              activePRs = await github.paginate(
                github.rest.search.issuesAndPullRequests,
                {
                  q: `repo:${OWNER}/${REPO} is:pr is:open label:pr/copilot -label:copilot/status-ready`,
                  per_page: 100,
                }
              );
            } catch (e) {
              abortDispatch(`Failed to query active Copilot PRs: ${e.message}`);
            }
            const activeCount = activePRs.length;
            core.info(`Active Copilot PRs: ${activeCount} / ${WIP_LIMIT}`);

            const needed = WIP_LIMIT - activeCount;
            if (needed <= 0) {
              core.info('WIP limit reached – nothing to dispatch.');
              return;
            }

            // ── Build a set of issue numbers already linked to an open PR ───
            // This prevents creating a duplicate PR for an issue that already
            // has one (idempotency guard).
            let allCopilotPRs;
            try {
              allCopilotPRs = await github.paginate(
                github.rest.search.issuesAndPullRequests,
                {
                  q: `repo:${OWNER}/${REPO} is:pr is:open label:pr/copilot`,
                  per_page: 100,
                }
              );
            } catch (e) {
              abortDispatch(`Failed to query open Copilot PRs for idempotency check: ${e.message}`);
            }
            const claimedIssueNumbers = new Set();
            for (const pr of allCopilotPRs) {
              const body = pr.body ?? '';
              const matches = body.matchAll(/Closes\s+#(\d+)/gi);
              for (const m of matches) {
                claimedIssueNumbers.add(parseInt(m[1], 10));
              }
            }

            // ── Fetch queued issues ─────────────────────────────────────────
            let queuedIssues;
            try {
              queuedIssues = await github.paginate(
                github.rest.search.issuesAndPullRequests,
                {
                  q: `repo:${OWNER}/${REPO} is:issue is:open label:queue/copilot -label:in-progress/copilot -label:blocked -label:status:blocked`,
                  sort: 'created',
                  order: 'asc',
                  per_page: 100,
                }
              );
            } catch (e) {
              abortDispatch(`Failed to fetch queued issues: ${e.message}`);
            }
            core.info(`Queued issues available: ${queuedIssues.length}`);

            // ── Dispatch up to 'needed' issues ──────────────────────────────
            let dispatched = 0;
            for (const issue of queuedIssues) {
              if (dispatched >= needed) break;

              const issueNumber  = issue.number;
              const issueAuthor  = issue.user?.login ?? null;

              // Skip if we already have an open PR for this issue.
              if (claimedIssueNumbers.has(issueNumber)) {
                core.info(`Issue #${issueNumber} already has an open Copilot PR – skipping.`);
                continue;
              }

              core.info(`Claiming issue #${issueNumber}: "${issue.title}"`);

              // ── Atomically claim the issue ────────────────────────────────
              try {
                await github.rest.issues.addLabels({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: issueNumber,
                  labels: ['in-progress/copilot'],
                });
              } catch (e) {
                abortDispatch(`Failed to apply in-progress/copilot label to issue #${issueNumber}: ${e.message}`);
              }

              // ── Create a branch for this issue ────────────────────────────
              const safeName = issue.title
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 50);
              const branchName = `copilot/issue-${issueNumber}-${safeName}`;

              // Resolve the SHA of the base branch.
              let baseSha;
              try {
                const { data: ref } = await github.rest.git.getRef({
                  owner: OWNER,
                  repo: REPO,
                  ref: `heads/${BASE_BRANCH}`,
                });
                baseSha = ref.object.sha;
              } catch (e) {
                await rollbackClaim(issueNumber);
                abortDispatch(`Could not resolve base branch '${BASE_BRANCH}': ${e.message}`);
              }

              try {
                await github.rest.git.createRef({
                  owner: OWNER,
                  repo: REPO,
                  ref: `refs/heads/${branchName}`,
                  sha: baseSha,
                });
                core.info(`Created branch '${branchName}'.`);
              } catch (e) {
                if (e.status === 422) {
                  core.info(`Branch '${branchName}' already exists – reusing.`);
                } else {
                  await rollbackClaim(issueNumber);
                  abortDispatch(`Failed to create branch '${branchName}' for issue #${issueNumber}: ${e.message}`);
                }
              }

              // ── Diff guard: if branch has no changes vs base, push a dummy
              //    commit so the branch is non-empty and a PR can be opened. ──
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: OWNER,
                  repo: REPO,
                  base: BASE_BRANCH,
                  head: branchName,
                });
                const hasDiff = comparison.ahead_by > 0 || (comparison.files && comparison.files.length > 0);
                if (!hasDiff) {
                  // Branch is identical to base – create a lightweight placeholder
                  // commit so that GitHub allows PR creation ("No commits between
                  // <base> and <head>" would otherwise be rejected by the API).
                  core.info(`No diff on '${branchName}' – creating dummy commit for issue #${issueNumber}.`);
                  try {
                    const dummyContent = Buffer.from(
                      `# Copilot Issue Tracker\n\n` +
                      `This file was created automatically by the Copilot Issue Dispatcher.\n\n` +
                      `**Issue:** #${issueNumber} – ${issue.title}\n` +
                      `**URL:** ${issue.html_url}\n` +
                      `**Branch:** ${branchName}\n` +
                      `**Base:** ${BASE_BRANCH}\n` +
                      `**Created:** ${new Date().toISOString()}\n\n` +
                      `Copilot will push real changes here to resolve the issue.\n`
                    ).toString('base64');
                    await github.rest.repos.createOrUpdateFileContents({
                      owner: OWNER,
                      repo: REPO,
                      path: '.copilot_issue.txt',
                      message: `chore: init Copilot workspace for issue #${issueNumber}`,
                      content: dummyContent,
                      branch: branchName,
                    });
                    core.info(`Dummy commit created on '${branchName}'.`);
                  } catch (e) {
                    await rollbackClaim(issueNumber);
                    abortDispatch(`Failed to create dummy commit on '${branchName}' for issue #${issueNumber}: ${e.message}`);
                  }
                }
              } catch (e) {
                if (e.message && e.message.startsWith('Dispatcher aborted')) throw e;
                await rollbackClaim(issueNumber);
                abortDispatch(`Could not compare '${branchName}' with '${BASE_BRANCH}' for issue #${issueNumber}: ${e.message}`);
              }

              // ── Create the PR ─────────────────────────────────────────────
              const prTitle = `[COPILOT] ${issue.title}`;
              const prBody  = [
                '> **Copilot Dispatcher** — This PR was created automatically.',
                `> It addresses issue **#${issueNumber}**.`,
                '',
                `Closes #${issueNumber}`,
                '',
                '---',
                '',
                `**Issue:** [#${issueNumber} – ${issue.title}](${issue.html_url})`,
                `**Author:** ${issueAuthor ? `@${issueAuthor}` : '_unknown_'}`,
                '',
                '_Human review and merge are required before this PR is integrated._',
              ].join('\n');

              let pr;
              try {
                const { data: newPR } = await github.rest.pulls.create({
                  owner: OWNER,
                  repo: REPO,
                  title: prTitle,
                  head: branchName,
                  base: BASE_BRANCH,
                  body: prBody,
                  draft: DRAFT,
                });
                pr = newPR;
                core.info(`Created ${DRAFT ? 'draft ' : ''}PR #${pr.number} for issue #${issueNumber}.`);
              } catch (e) {
                await rollbackClaim(issueNumber);
                abortDispatch(`Failed to create PR for issue #${issueNumber}: ${e.message}`);
              }

              // ── Label the PR ──────────────────────────────────────────────
              try {
                await github.rest.issues.addLabels({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: pr.number,
                  labels: ['pr/copilot', 'copilot/status-working'],
                });
              } catch (e) {
                core.warning(`Could not add labels to PR #${pr.number}: ${e.message}`);
              }

              // ── Assign PR to copilot and issue author ─────────────────────
              const assignees = ['copilot'];
              if (issueAuthor) assignees.push(issueAuthor);
              try {
                await github.rest.issues.addAssignees({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: pr.number,
                  assignees,
                });
                core.info(`Assigned PR #${pr.number} to: ${assignees.join(', ')}.`);
              } catch (e) {
                core.warning(`Could not assign PR #${pr.number} to ${assignees.join(', ')}: ${e.message}`);
              }

              // ── Request review from issue author ──────────────────────────
              if (issueAuthor) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner: OWNER,
                    repo: REPO,
                    pull_number: pr.number,
                    reviewers: [issueAuthor],
                  });
                  core.info(`Requested review from '@${issueAuthor}' on PR #${pr.number}.`);
                } catch (e) {
                  core.warning(`Could not request review from '@${issueAuthor}' on PR #${pr.number}: ${e.message}`);
                }
              }

              dispatched++;
              core.info(`Dispatched ${dispatched}/${needed}: PR #${pr.number} → issue #${issueNumber}.`);
            }

            core.info(`Dispatcher finished. Dispatched ${dispatched} new Copilot PR(s).`);
