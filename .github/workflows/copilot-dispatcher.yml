name: Copilot Issue Dispatcher

on:
  # Baseline heartbeat – run every 30 minutes as a fallback.
  schedule:
    - cron: '*/30 * * * *'

  # Manual trigger from the Actions UI.
  workflow_dispatch:
    inputs:
      max_delegations:
        description: 'Maximum issues to delegate in this run (0 = use config default)'
        required: false
        default: '0'

# Only one dispatcher run at a time to prevent race conditions.
concurrency:
  group: copilot-dispatcher
  cancel-in-progress: false

permissions:
  issues: write        # post comments, add/remove labels

jobs:
  dispatch:
    name: Delegate issues to Copilot Coding Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (needed to read config)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install js-yaml
        run: npm install js-yaml

      - name: Run dispatcher
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const yaml = require(`${process.env.GITHUB_WORKSPACE}/node_modules/js-yaml`);

            // ── Load configuration ──────────────────────────────────────────
            let config = { max_delegations_per_run: 2, base_branch: 'develop' };
            try {
              const raw = fs.readFileSync('.github/copilot-dispatcher.yml', 'utf8');
              config = { ...config, ...yaml.load(raw) };
            } catch (e) {
              core.warning(`Could not read .github/copilot-dispatcher.yml: ${e.message}. Using defaults.`);
            }

            // Manual override via workflow_dispatch input overrides config.
            const inputMax = parseInt(context.payload?.inputs?.max_delegations ?? '0', 10);
            const MAX_DELEGATIONS = (inputMax > 0 ? inputMax : null) ?? config.max_delegations_per_run ?? 5;
            const BASE_BRANCH     = config.base_branch ?? 'develop';
            const OWNER           = context.repo.owner;
            const REPO            = context.repo.repo;
            const DELEGATION_MARKER = '<!-- copilot-delegated -->';
            const DELEGATED_LABEL   = 'copilot/delegated';
            const QUEUE_LABEL       = 'queue/copilot';

            core.info(`Config: max_delegations_per_run=${MAX_DELEGATIONS}, base_branch=${BASE_BRANCH}`);

            // ── Helper: abort the entire dispatch run on unrecoverable errors ──
            function abortDispatch(msg) {
              core.setFailed(
                `⛔ Dispatcher aborted – ${msg}\n` +
                `💡 Budget hint: every failed run consumes GitHub Actions minutes. ` +
                `Fix the underlying issue (permissions, rate-limits, configuration) ` +
                `before re-running the dispatcher.`
              );
              throw new Error(msg);
            }

            // ── Fetch queued issues ─────────────────────────────────────────
            // Issues that have queue/copilot but NOT copilot/delegated or blocked.
            let queuedIssues;
            try {
              queuedIssues = await github.paginate(
                github.rest.search.issuesAndPullRequests,
                {
                  q: `repo:${OWNER}/${REPO} is:issue is:open label:${QUEUE_LABEL} -label:${DELEGATED_LABEL} -label:blocked -label:status:blocked`,
                  sort: 'created',
                  order: 'asc',
                  per_page: 100,
                }
              );
            } catch (e) {
              abortDispatch(`Failed to fetch queued issues: ${e.message}`);
            }
            core.info(`Queued issues available: ${queuedIssues.length}`);

            // ── Sort by priority (critical → high → medium → low → none) ───
            // Recognises both "priority:<level>" and "P<N>" label conventions.
            const PRIORITY_RANK = {
              'priority:critical': 0, 'p0': 0,
              'priority:high':     1, 'p1': 1,
              'priority:medium':   2, 'p2': 2,
              'priority:low':      3, 'p3': 3,
            };
            function issuePriorityRank(issue) {
              for (const label of (issue.labels ?? [])) {
                const name = (label.name ?? '').toLowerCase();
                if (name in PRIORITY_RANK) return PRIORITY_RANK[name];
              }
              return 4; // no priority label → process last
            }
            queuedIssues.sort((a, b) => {
              const rankDiff = issuePriorityRank(a) - issuePriorityRank(b);
              if (rankDiff !== 0) return rankDiff;
              // Same priority: preserve creation-date order (oldest first).
              return new Date(a.created_at) - new Date(b.created_at);
            });
            core.info(`Issue order after priority sort: ${queuedIssues.map(i => `#${i.number}(rank=${issuePriorityRank(i)})`).join(', ')}`);

            // ── Delegate up to MAX_DELEGATIONS issues ───────────────────────
            let delegated = 0;
            for (const issue of queuedIssues) {
              if (delegated >= MAX_DELEGATIONS) {
                core.info(`Delegation limit of ${MAX_DELEGATIONS} reached – stopping.`);
                break;
              }

              const issueNumber = issue.number;

              // ── Idempotency: check existing comments for delegation marker ─
              let alreadyDelegated = false;
              try {
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  { owner: OWNER, repo: REPO, issue_number: issueNumber, per_page: 100 }
                );
                alreadyDelegated = comments.some(c => (c.body ?? '').includes(DELEGATION_MARKER));
              } catch (e) {
                core.warning(`Could not check comments on #${issueNumber}: ${e.message}. Skipping to be safe.`);
                continue;
              }

              if (alreadyDelegated) {
                core.info(`Issue #${issueNumber} already has a delegation comment – skipping.`);
                // Ensure the label is consistent even if a previous run failed mid-way.
                await github.rest.issues.addLabels({
                  owner: OWNER, repo: REPO, issue_number: issueNumber, labels: [DELEGATED_LABEL],
                }).catch(e => core.warning(`Could not sync ${DELEGATED_LABEL} label on #${issueNumber}: ${e.message}`));
                continue;
              }

              core.info(`Delegating issue #${issueNumber}: "${issue.title}"`);

              // ── Extract acceptance criteria from issue body ────────────────
              const issueBody = issue.body ?? '';
              const criteriaMatches = [...issueBody.matchAll(/^[-*]\s+\[[ x]\]\s+(.+)$/gmi)];
              const acceptanceCriteria = criteriaMatches.length > 0
                ? criteriaMatches.map(m => `- [ ] ${m[1].trim()}`).join('\n')
                : `- [ ] Resolve issue #${issueNumber}: ${issue.title}`;

              // First non-empty, non-heading line of the issue body as description.
              const bodyLines = issueBody.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
              const bodyExcerpt = bodyLines.length > 0 ? bodyLines[0].slice(0, 300) : '';

              // ── Build delegation comment ──────────────────────────────────
              const delegationComment = [
                DELEGATION_MARKER,
                '@copilot Please implement the changes required to resolve this issue and open a pull request.',
                '',
                `## Issue: [#${issueNumber} – ${issue.title}](${issue.html_url})`,
                '',
                ...(bodyExcerpt ? [`> ${bodyExcerpt}`, ''] : []),
                '## Requirements / Acceptance Criteria',
                '',
                acceptanceCriteria,
                '',
                '## Task Notes',
                '',
                `- Target the \`${BASE_BRANCH}\` branch for your pull request.`,
                '- Follow the repository\'s contribution guidelines and code standards.',
                '- Ensure all existing tests pass and add new tests where appropriate.',
                `- Reference this issue in the PR body with \`Closes #${issueNumber}\`.`,
                '',
                '---',
                '',
                '*This delegation was posted automatically by the Copilot Issue Dispatcher.*',
              ].join('\n');

              // ── Post the delegation comment ───────────────────────────────
              try {
                await github.rest.issues.createComment({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: issueNumber,
                  body: delegationComment,
                });
                core.info(`Posted delegation comment on issue #${issueNumber}.`);
              } catch (e) {
                core.warning(`Failed to post delegation comment on #${issueNumber}: ${e.message}. Skipping.`);
                continue;
              }

              // ── Apply copilot/delegated label ─────────────────────────────
              try {
                await github.rest.issues.addLabels({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: issueNumber,
                  labels: [DELEGATED_LABEL],
                });
                core.info(`Applied label '${DELEGATED_LABEL}' to issue #${issueNumber}.`);
              } catch (e) {
                core.warning(`Could not apply '${DELEGATED_LABEL}' label to #${issueNumber}: ${e.message}`);
              }

              // ── Remove queue/copilot label ────────────────────────────────
              try {
                await github.rest.issues.removeLabel({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: issueNumber,
                  name: QUEUE_LABEL,
                });
                core.info(`Removed label '${QUEUE_LABEL}' from issue #${issueNumber}.`);
              } catch (e) {
                // 404 means label was already absent – not an error.
                if (e.status !== 404) {
                  core.warning(`Could not remove '${QUEUE_LABEL}' label from #${issueNumber}: ${e.message}`);
                }
              }

              delegated++;
              core.info(`Delegated ${delegated}/${MAX_DELEGATIONS}: issue #${issueNumber}.`);
            }

            core.info(`Dispatcher finished. Delegated ${delegated} issue(s) to the Copilot Coding Agent.`);
