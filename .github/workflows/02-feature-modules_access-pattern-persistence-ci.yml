name: IndexRecommender Access-Pattern Persistence CI

# Triggered whenever IndexRecommender sources, the test file,
# or this workflow itself change.
# Targets v1.9.0 (roadmap:metadata:Q3-2026:index-recommender:access-pattern-persistence).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/metadata/index_recommender.h'
      - 'src/metadata/index_recommender.cpp'
      - 'include/storage/rocksdb_wrapper.h'
      - 'src/storage/rocksdb_wrapper.cpp'
      - 'tests/test_index_recommender.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_access-pattern-persistence-ci.yml'
  workflow_dispatch:

concurrency:
  group: access-pattern-persistence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the IndexRecommenderFocusedTests suite.
  # Tests cover acceptance criteria:
  #   AC-1  persistStats() writes meta_idx_stats::<table> JSON keys to RocksDB.
  #   AC-2  total_queries persisted under meta_idx_stats::__total_queries__.
  #   AC-3  Constructor loads persisted stats from RocksDB on construction (round-trip).
  #   AC-4  reset() removes persisted keys from RocksDB.
  #   AC-5  Destructor performs a final flush to RocksDB on graceful shutdown.
  #   AC-6  New in-memory accesses merge correctly with persisted data.
  #   AC-7  Background persist thread flushes stats within the configured interval.
  # ---------------------------------------------------------------------------
  access-pattern-persistence-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: IndexRecommender persistence tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_index_recommender_focused

      - name: Run IndexRecommender unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex IndexRecommenderFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee index_recommender_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-recommender-persistence-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/index_recommender_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📊 IndexRecommender Access-Pattern Persistence – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "IndexRecommender: RocksDB persistence under meta_idx_stats:: prefix, round-trip load, merge, reset/delete, destructor flush, background thread." >> "$GITHUB_STEP_SUMMARY"
