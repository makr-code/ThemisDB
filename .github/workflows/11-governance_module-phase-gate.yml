name: '11: Governance - Module Phase Gate'

on:
  # Run when ROADMAP.md phase status changes
  pull_request:
    paths:
      - 'src/*/ROADMAP.md'
      - '.github/workflows/11-governance_module-phase-gate.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-phase-closure:
    name: Validate Module Phase Closure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Identify Changed Modules
        id: modules
        run: |
          python3 << 'EOF'
          import os
          import re
          from pathlib import Path
          
          # Get changed files from GitHub API
          pr_number = os.environ.get('GITHUB_REF', '').split('/')[-2]
          if not pr_number or not pr_number.isdigit():
              print("::warning::Could not determine PR number")
              exit(0)
          
          # Parse changed ROADMAP.md files
          changed_modules = []
          for roadmap_file in Path("src").rglob("ROADMAP.md"):
              module = roadmap_file.parent.name
              changed_modules.append(module)
          
          print(f"Found {len(changed_modules)} modules to verify")
          for module in changed_modules[:5]:
              print(f"  - {module}")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"modules={','.join(changed_modules)}\n")
          EOF
        env:
          GITHUB_OUTPUT: ${{ github.output }}
      
      - name: Run Phase Verifier
        id: verify
        run: |
          python3 .github/scripts/module_phase_verifier.py --all-modules --generate-report
      
      - name: Parse Verification Results
        id: results
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          
          # Load verification report
          report_files = sorted(Path('.').glob('ai_working/module_phase_report_*.json'))
          if not report_files:
              print("::warning::No phase report found")
              exit(0)
          
          with open(report_files[-1]) as f:
              report = json.load(f)
          
          # Aggregate results
          pass_count = 0
          fail_count = 0
          gate_failures = []
          
          for module, result in report.get('modules', {}).items():
              status = result.get('status', 'UNKNOWN')
              
              if status == 'PASS':
                  pass_count += 1
              else:
                  fail_count += 1
                  gate_failures.append({
                      'module': module,
                      'reason': result.get('failure_reason', 'Unknown'),
                      'details': result.get('details', {})
                  })
          
          print(f"✅ PASS: {pass_count}")
          print(f"❌ FAIL: {fail_count}")
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"pass_count={pass_count}\n")
              f.write(f"fail_count={fail_count}\n")
              if gate_failures:
                  f.write(f"has_failures=true\n")
                  import json
                  f.write(f"failures_json={json.dumps(gate_failures)}\n")
              else:
                  f.write(f"has_failures=false\n")
          EOF
        env:
          GITHUB_OUTPUT: ${{ github.output }}
      
      - name: Post Gate Validation Comment
        uses: actions/github-script@v7
        with:
          script: |
            const passCount = '${{ steps.results.outputs.pass_count }}' || '0';
            const failCount = '${{ steps.results.outputs.fail_count }}' || '0';
            const hasFailures = '${{ steps.results.outputs.has_failures }}' === 'true';
            
            let comment = `## Phase Gate Validation Results\n\n`;
            comment += `| Status | Count |\n`;
            comment += `|--------|-------|\n`;
            comment += `| ✅ Pass | ${passCount} |\n`;
            comment += `| ❌ Fail | ${failCount} |\n`;
            
            if (hasFailures) {
              comment += `\n### Gate Failures\n`;
              try {
                const failures = JSON.parse('${{ steps.results.outputs.failures_json }}');
                failures.slice(0, 10).forEach(failure => {
                  comment += `- **${failure.module}**: ${failure.reason}\n`;
                });
              } catch (e) {
                comment += `- Unable to parse failure details\n`;
              }
              
              comment += `\n### Remediation Required\n`;
              comment += `Phase closure gates have failed. Please verify:\n`;
              comment += `1. Phase acceptance criteria are met (check ROADMAP.md)\n`;
              comment += `2. Test coverage ratio ≥ 80% (${failCount} modules failing)\n`;
              comment += `3. No new CRITICAL findings introduced\n`;
              comment += `4. Domain owner sign-off obtained\n`;
              comment += `\nReview: \`docs/governance/PHASE_CLOSURE_POLICY.md\`\n`;
            } else {
              comment += `\n✅ **All phase gates PASS**\n`;
            }
            
            comment += `\n---\n`;
            comment += `Automated by: \`.github/workflows/11-governance_module-phase-gate.yml\`\n`;
            
            // Post comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if Gates Failed
        if: steps.results.outputs.has_failures == 'true'
        run: |
          echo "::error::Phase gate validation failed. Review PR comment for details."
          exit 1

  check-phase-dependencies:
    name: Validate Phase Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify Dependency Graph Consistency
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          
          # Load phase dependency graph
          dep_file = Path("docs/governance/PHASE_DEPENDENCY_GRAPH.md")
          if not dep_file.exists():
              print("::warning::PHASE_DEPENDENCY_GRAPH.md not found")
              exit(0)
          
          # Parse dependency matrix
          with open(dep_file) as f:
              content = f.read()
          
          # Simple validation: check for cyclic dependencies
          # This is a placeholder; real implementation would parse the DAG
          
          if 'CYCLIC' in content or 'cycle' in content.lower():
              print("::error::Cyclic dependency detected in phase dependency graph")
              exit(1)
          
          print("✅ Dependency graph validated")
          EOF

