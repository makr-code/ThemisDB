name: "Build: Wave B Transaction"

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/build-wave-b-transaction.yml
      - tools/ci/run_transaction_tests.py
      - tools/ci/summarize_ctest_evidence.py
      - tools/ci/generate_transaction_baseline_manifest.py
      - tools/tests/test_transaction_evidence.py
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/ModularBuild.cmake
      - tests/CMakeLists.txt
      - tests/cmake/RegisterModuleTests.cmake
      - tests/cmake/TestPolicy.cmake
      - tests/cmake/RunRegisteredTest.cmake
      - include/transaction/**
      - include/sharding/distributed_transaction.h
      - include/server/http_server.h
      - include/server/monitoring_api_handler.h
      - include/sharding/two_phase_commit_participant.h
      - src/transaction/**
      - src/sharding/distributed_transaction.cpp
      - src/sharding/two_phase_commit_participant.cpp
      - src/server/http_server.cpp
      - src/server/monitoring_api_handler.cpp
      - tests/transaction/**
      - tests/test_distributed_txn_api_handler.cpp
      - tests/test_two_phase_commit.cpp
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: "Evidence scope (all/phase4 add baseline; every phase runs required tests)"
        required: false
        default: "all"
        type: choice
        options: [all, phase1, phase2, phase3, wave-a, phase4]
      parallel_jobs:
        description: "Number of parallel compilation jobs"
        required: false
        type: number
        default: 4

permissions:
  contents: read
  checks: write
  pull-requests: write

defaults:
  run:
    shell: bash

concurrency:
  group: build-wave-b-transaction-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_TYPE: Release
  THEMIS_EDITION: COMMUNITY
  THEMIS_BUILD_TESTS: ON
  THEMIS_BUILD_BENCHMARKS: OFF
  THEMIS_CTEST_DISABLE_ON_DEMAND_BUILD: '1'
  CMAKE_GENERATOR: Ninja
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
  SCCACHE_CACHE_SIZE: 2G
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache-ubuntu-${{ github.ref_name || github.ref }}
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache-ubuntu-${{ github.ref_name || github.ref }},readwrite
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg-downloads-ubuntu-${{ github.ref_name || github.ref }}

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [configure, compile-tests, smoke-tests, full-transaction-test-suite, chaos-recovery-evidence, phase4-benchmark-baseline, collect-artifacts, publish-results, check-results]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Wave B transaction build, tests, and recovery evidence"
          job-results: ${{ toJSON(needs) }}

  configure:
    name: "Build: CMake Configuration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build-dir: ${{ steps.configure.outputs.build-dir }}
      config-status: ${{ steps.configure.outputs.status }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 0

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libboost-filesystem-dev libboost-system-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev libcurl4-openssl-dev libgtest-dev libpugixml-dev libyaml-cpp-dev

      - name: "Cache sccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}
          restore-keys: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake (community-release)"
        id: configure
        run: |
          BUILD_DIR="build-wave-b3-transaction-ci"
          echo "build-dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          
          cmake --preset community-release \
            -B "$BUILD_DIR" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM="$(command -v sccache)" \
            2>&1 | tee cmake-config.log
          
          if [ -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            cat cmake-config.log
            exit 1
          fi

      - name: "Upload CMake configuration log"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cmake-configuration-log
          path: cmake-config.log
          retention-days: 90

  compile-tests:
    name: "Build: Compile Transaction Tests"
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libboost-filesystem-dev libboost-system-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev libcurl4-openssl-dev libgtest-dev libpugixml-dev libyaml-cpp-dev

      - name: "Cache sccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}
          restore-keys: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM="$(command -v sccache)"

      - name: "Compile registered transaction tests"
        id: compile
        run: |
          set -euo pipefail
          python3 tools/ci/run_transaction_tests.py \
            --build-dir "${{ needs.configure.outputs.build-dir }}" \
            --suite full --build-only \
            --output-dir "${{ needs.configure.outputs.build-dir }}/compile-evidence" \
            --parallel "${{ github.event.inputs.parallel_jobs || 4 }}" \
            --commit-sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            2>&1 | tee compile-transaction.log
          echo "compile_status=success" >> "$GITHUB_OUTPUT"

      - name: "Upload compilation log"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: compile-transaction-log
          path: |
            compile-transaction.log
            ${{ needs.configure.outputs.build-dir }}/compile-evidence/
          retention-days: 90

  smoke-tests:
    name: "Validate: Transaction Closure Smoke Suite"
    needs: [configure, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libboost-filesystem-dev libboost-system-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev libcurl4-openssl-dev libgtest-dev libpugixml-dev libyaml-cpp-dev

      - name: "Cache sccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}
          restore-keys: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM="$(command -v sccache)"

      - name: "Build and run registered smoke suite"
        id: smoke
        run: |
          set -euo pipefail
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          python3 tools/ci/run_transaction_tests.py \
            --build-dir "$BUILD_DIR" --suite smoke \
            --output-dir "$BUILD_DIR/smoke-evidence" \
            --parallel "${{ github.event.inputs.parallel_jobs || 4 }}" \
            --commit-sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            2>&1 | tee "$BUILD_DIR/smoke-test-results.txt"
          echo "smoke_status=success" >> "$GITHUB_OUTPUT"

      - name: "Upload smoke test results"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-test-results
          path: |
            ${{ needs.configure.outputs.build-dir }}/smoke-test-results.txt
            ${{ needs.configure.outputs.build-dir }}/smoke-evidence/
          retention-days: 90

      - name: "Publish smoke test summary"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-summary
          path: ${{ needs.configure.outputs.build-dir }}/smoke-test-results.txt
          retention-days: 90

  full-transaction-test-suite:
    name: "Validate: Registered Transaction Test Suite"
    needs: [configure, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libboost-filesystem-dev libboost-system-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev libcurl4-openssl-dev libgtest-dev libpugixml-dev libyaml-cpp-dev

      - name: "Cache sccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}
          restore-keys: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM="$(command -v sccache)"

      - name: "Run all transaction tests"
        id: full-tests
        run: |
          set -euo pipefail
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          python3 tools/ci/run_transaction_tests.py \
            --build-dir "$BUILD_DIR" --suite full \
            --output-dir "$BUILD_DIR/full-evidence" \
            --parallel "${{ github.event.inputs.parallel_jobs || 4 }}" \
            --commit-sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            2>&1 | tee "$BUILD_DIR/full-test-results.txt"
          echo "full_tests_status=success" >> "$GITHUB_OUTPUT"

      - name: "Generate test report"
        if: always()
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          {
            echo "## Transaction Test Results"
            echo ""
            echo "**Status:** ${{ steps.full-tests.outputs.full_tests_status }}"
            echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            if [ -f "$BUILD_DIR/full-evidence/summary.md" ]; then
              cat "$BUILD_DIR/full-evidence/summary.md"
            else
              echo "FAIL: no validated test summary; inspect build and test logs."
            fi
          } > test-report.md

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: transaction-test-results
          path: |
            ${{ needs.configure.outputs.build-dir }}/full-test-results.txt
            ${{ needs.configure.outputs.build-dir }}/full-evidence/
            test-report.md
          retention-days: 90

      - name: "Post test summary to PR"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  chaos-recovery-evidence:
    name: "Validate: Chaos and Recovery Evidence"
    needs: [configure, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev libcurl4-openssl-dev libgtest-dev libpugixml-dev libyaml-cpp-dev

      - name: "Cache sccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}
          restore-keys: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM=sccache

      - name: "Run chaos/recovery release-critical transaction suites"
        run: |
          set -euo pipefail
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          mkdir -p "$BUILD_DIR/transaction-chaos-evidence"
          {
            echo "# Transaction Chaos / Recovery Evidence"
            echo
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Hardware profile"
            echo '```'
            lscpu
            echo '```'
          } > "$BUILD_DIR/transaction-chaos-evidence/TRANSACTION_CHAOS_HARDWARE.md"

          python3 tools/ci/run_transaction_tests.py \
            --build-dir "$BUILD_DIR" --suite chaos \
            --output-dir "$BUILD_DIR/transaction-chaos-evidence" \
            --parallel "${{ github.event.inputs.parallel_jobs || 4 }}" \
            --commit-sha "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            2>&1 | tee "$BUILD_DIR/transaction-chaos-evidence/chaos-recovery-results.txt"

      - name: "Upload chaos/recovery evidence"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: transaction-chaos-recovery-evidence
          path: |
            ${{ needs.configure.outputs.build-dir }}/transaction-chaos-evidence/
          retention-days: 90

  phase4-benchmark-baseline:
    name: "Benchmark: Phase 4 Baseline"
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'phase4'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: "Setup benchmark build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libbenchmark-dev libfmt-dev libspdlog-dev nlohmann-json3-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpugixml-dev \
            libcpp-httplib-dev

      - name: "Cache sccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}
          restore-keys: sccache-transaction-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake with benchmarks"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM=sccache

      - name: "Build Phase 4 benchmark"
        run: cmake --build "${{ needs.configure.outputs.build-dir }}" --target bench_transaction_phase4 --parallel ${{ github.event.inputs.parallel_jobs || 4 }}

      - name: "Run Phase 4 benchmark baseline"
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          mkdir -p "$BUILD_DIR/transaction-phase4-benchmark"
          lscpu > "$BUILD_DIR/transaction-phase4-benchmark/lscpu.txt"
          free -h > "$BUILD_DIR/transaction-phase4-benchmark/memory.txt"
          "$BUILD_DIR/benchmarks/transaction/bench_transaction_phase4" \
            --benchmark_min_time=0.2s \
            --benchmark_repetitions=5 \
            --benchmark_out="$BUILD_DIR/transaction-phase4-benchmark/phase4_baseline.json" \
            --benchmark_out_format=json

      - name: "Render Phase 4 benchmark summary"
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          python3 - "$BUILD_DIR/transaction-phase4-benchmark/phase4_baseline.json" "$BUILD_DIR/transaction-phase4-benchmark/PHASE4_BASELINE_SUMMARY.md" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          data = json.loads(source.read_text(encoding="utf-8"))
          rows = []
          for bench in data.get("benchmarks", []):
              name = bench.get("name", "")
              if name.endswith(("_mean", "_median", "_stddev", "_cv")):
                  continue
              rows.append(
                  (
                      name,
                      bench.get("txns_per_sec", 0.0),
                      bench.get("p95_ms", 0.0),
                      bench.get("p99_ms", 0.0),
                      bench.get("gate_pass", 0.0),
                  )
              )
              if bench.get("error_occurred"):
                  raise SystemExit(f"Phase 4 benchmark error: {name}")

          lines = [
              "# Transaction Phase 4 Baseline Summary",
              "",
              "| Benchmark | txns/sec | p95 ms | p99 ms | Status |",
              "| --- | ---: | ---: | ---: | --- |",
          ]
          for name, txns_per_sec, p95_ms, p99_ms, gate_pass in rows:
              status = "PASS" if gate_pass >= 1.0 else "FAIL"
              lines.append(
                  f"| `{name}` | {txns_per_sec:.2f} | {p95_ms:.3f} | {p99_ms:.3f} | {status} |"
              )
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          if not rows or any(row[4] != 1.0 for row in rows):
              raise SystemExit("Phase 4 baseline is empty or contains failed benchmark gates")
          PY

      - name: "Upload Phase 4 benchmark artifacts"
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: transaction-phase4-benchmark
          path: |
            ${{ needs.configure.outputs.build-dir }}/transaction-phase4-benchmark/phase4_baseline.json
            ${{ needs.configure.outputs.build-dir }}/transaction-phase4-benchmark/PHASE4_BASELINE_SUMMARY.md
            ${{ needs.configure.outputs.build-dir }}/transaction-phase4-benchmark/lscpu.txt
            ${{ needs.configure.outputs.build-dir }}/transaction-phase4-benchmark/memory.txt
          retention-days: 90

  collect-artifacts:
    name: "Automation: Collect Build Artifacts"
    needs: [configure, compile-tests, smoke-tests, full-transaction-test-suite, chaos-recovery-evidence, phase4-benchmark-baseline]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85

      - name: "Create artifact archive"
        env:
          UPSTREAM_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          results = json.loads(os.environ["UPSTREAM_RESULTS"])
          artifacts = {
              "configure": "cmake-configuration-log",
              "compile-tests": "compile-transaction-log",
              "smoke-tests": "smoke-test-results",
              "full-transaction-test-suite": "transaction-test-results",
              "chaos-recovery-evidence": "transaction-chaos-recovery-evidence",
              "phase4-benchmark-baseline": "transaction-phase4-benchmark",
          }
          for job, artifact in artifacts.items():
              if results[job]["result"] == "success":
                  if not any(path.is_file() for path in Path(artifact).rglob("*")):
                      raise SystemExit(f"Successful job {job} has no evidence artifact: {artifact}")
                  if job in {"smoke-tests", "full-transaction-test-suite", "chaos-recovery-evidence"}:
                      for filename in ("results.xml", "inventory.json", "summary.md"):
                          if not any(Path(artifact).rglob(filename)):
                              raise SystemExit(f"Missing required {filename} in {artifact}")
          PY
          mkdir -p transaction-ci-results
          for artifact in cmake-configuration-log compile-transaction-log \
            smoke-test-results transaction-test-results test-summary \
            transaction-chaos-recovery-evidence transaction-phase4-benchmark; do
            if [ -d "$artifact" ]; then
              cp -r "$artifact" transaction-ci-results/
            fi
          done
          zip -r transaction-ci-results.zip transaction-ci-results
          
          echo "Archive created: $(du -sh transaction-ci-results.zip | cut -f1)"

      - name: "Upload artifacts archive"
        uses: actions/upload-artifact@v5
        with:
          name: transaction-ci-results
          path: transaction-ci-results.zip
          retention-days: 90

  publish-results:
    name: "Build: CI Results"
    needs: [configure, compile-tests, smoke-tests, full-transaction-test-suite, chaos-recovery-evidence, phase4-benchmark-baseline, collect-artifacts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - name: "Download all artifacts"
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85

      - name: "Generate runner baseline evidence (representative sign-off pending)"
        id: representative-baseline
        if: ${{ needs.phase4-benchmark-baseline.result == 'success' }}
        run: |
          python3 tools/ci/generate_transaction_baseline_manifest.py \
            --benchmark-json "transaction-phase4-benchmark/phase4_baseline.json" \
            --chaos-log "transaction-chaos-recovery-evidence/chaos-recovery-results.txt" \
            --lscpu "transaction-phase4-benchmark/lscpu.txt" \
            --memory "transaction-phase4-benchmark/memory.txt" \
            --chaos-hardware "transaction-chaos-recovery-evidence/TRANSACTION_CHAOS_HARDWARE.md" \
            --workflow "build-wave-b-transaction.yml" \
            --run-id "${{ github.run_id }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit-sha "${{ github.sha }}" \
            --hardware-scope hosted-runner \
            --output-json "benchmarks/wave8/TRANSACTION_BASELINES_LATEST.json" \
            --output-md "benchmarks/wave8/TRANSACTION_BASELINES_LATEST.md"

      - name: "Generate Wave-B transaction closure package"
        run: |
          mkdir -p wave-closure
          CODE_VALIDATED=false
          TESTS_VALIDATED=false
          CI_VALIDATED=false
          BENCHMARKS_VALIDATED=false

          if [ "${{ needs.configure.result }}" = "success" ] && [ "${{ needs.compile-tests.result }}" = "success" ]; then
            CODE_VALIDATED=true
          fi
          if [ "${{ needs.smoke-tests.result }}" = "success" ] && [ "${{ needs.full-transaction-test-suite.result }}" = "success" ]; then
            TESTS_VALIDATED=true
          fi
          if [ "${{ needs.configure.result }}" = "success" ] && [ "${{ needs.compile-tests.result }}" = "success" ] && [ "${{ needs.smoke-tests.result }}" = "success" ] && [ "${{ needs.chaos-recovery-evidence.result }}" = "success" ]; then
            CI_VALIDATED=true
          fi
          if [ "${{ needs.phase4-benchmark-baseline.result }}" = "success" ]; then
            BENCHMARKS_VALIDATED=true
          fi

          OVERALL_STATUS="open"
          if [ "$CODE_VALIDATED" = "true" ] && [ "$TESTS_VALIDATED" = "true" ] && [ "$CI_VALIDATED" = "true" ] && [ "$BENCHMARKS_VALIDATED" = "true" ] && [ "${{ needs.collect-artifacts.result }}" = "success" ]; then
            OVERALL_STATUS="evidence-captured"
          fi

          python3 tools/ci/generate_wave_closure_manifest.py \
            --wave "Wave B" \
            --module "transaction" \
            --workflow "build-wave-b-transaction.yml" \
            --run-id "${{ github.run_id }}" \
            --overall-status "$OVERALL_STATUS" \
            --gate "B1_chaos_recovery=${{ needs.chaos-recovery-evidence.result }}" \
            --gate "B2_fail_closed=${{ needs.smoke-tests.result }}" \
            --gate "B3_release_critical=${{ needs.full-transaction-test-suite.result }}" \
            --gate "B4_phase4_baseline=${{ needs.phase4-benchmark-baseline.result }}" \
            --evidence "artifacts_archive=transaction-ci-results.zip" \
            --evidence "chaos_recovery=transaction-chaos-recovery-evidence" \
            --evidence "phase4_baseline=transaction-phase4-benchmark" \
            --evidence "representative_baseline=benchmarks/wave8/TRANSACTION_BASELINES_LATEST.json" \
            --evidence "representative_baseline_artifact=transaction-baseline-evidence" \
            --evidence "ci_report=CI-Report" \
            --source-validation "code=${CODE_VALIDATED}" \
            --source-validation "tests=${TESTS_VALIDATED}" \
            --source-validation "ci=${CI_VALIDATED}" \
            --source-validation "benchmarks=${BENCHMARKS_VALIDATED}" \
            --notes "Source-validated evidence package generated from dedicated Wave transaction CI run." \
            --output-json "wave-closure/transaction_wave_b_closure_manifest.json" \
            --output-md "wave-closure/transaction_wave_b_closure_manifest.md"

      - name: "Generate CI report"
        run: |
          PHASE4_STATUS="pending"
          if [ "${{ needs.phase4-benchmark-baseline.result }}" = "success" ]; then
            PHASE4_STATUS="captured"
          elif [ "${{ needs.phase4-benchmark-baseline.result }}" = "failure" ]; then
            PHASE4_STATUS="failed"
          elif [ "${{ needs.phase4-benchmark-baseline.result }}" = "skipped" ]; then
            PHASE4_STATUS="skipped"
          fi

          {
            echo "# Wave B Transaction CI Execution Report"
            echo ""
            echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Build:** ${{ github.run_id }}"
            echo "**Status:** ${{ job.status }}"
            echo ""
            echo "## Results Summary"
            echo "- CMake Configuration: ${{ needs.configure.outputs.config-status }}"
            echo "- Test Compilation: ${{ needs.compile-tests.result }}"
            echo "- Smoke Tests: ${{ needs.smoke-tests.result }}"
            echo "- Full Suite: ${{ needs.full-transaction-test-suite.result }}"
            echo "- Chaos / Recovery evidence: ${{ needs.chaos-recovery-evidence.result }}"
            echo "- Phase 4 benchmark baseline: ${PHASE4_STATUS}"
            echo ""
            echo "## Artifacts"
            echo "- transaction-ci-results.zip"
            if [ -f benchmarks/wave8/TRANSACTION_BASELINES_LATEST.md ]; then
              echo "- transaction-baseline-evidence"
              echo ""
              cat benchmarks/wave8/TRANSACTION_BASELINES_LATEST.md
            fi
            if [ -f transaction-phase4-benchmark/PHASE4_BASELINE_SUMMARY.md ]; then
              echo ""
              cat transaction-phase4-benchmark/PHASE4_BASELINE_SUMMARY.md
            fi
          } > CI_REPORT.md

      - name: "Upload final report"
        uses: actions/upload-artifact@v5
        with:
          name: CI-Report
          path: CI_REPORT.md
          retention-days: 90

      - name: "Upload representative-hardware baseline evidence"
        if: ${{ needs.phase4-benchmark-baseline.result == 'success' && steps.representative-baseline.outcome == 'success' }}
        uses: actions/upload-artifact@v5
        with:
          name: transaction-baseline-evidence
          path: |
            benchmarks/wave8/TRANSACTION_BASELINES_LATEST.json
            benchmarks/wave8/TRANSACTION_BASELINES_LATEST.md
          retention-days: 90

      - name: "Upload Wave-B closure package"
        uses: actions/upload-artifact@v5
        with:
          name: transaction-wave-b-closure-package
          path: wave-closure/
          retention-days: 90

  check-results:
    name: "Gate: Verify Test Results"
    needs: [configure, compile-tests, smoke-tests, full-transaction-test-suite, chaos-recovery-evidence, phase4-benchmark-baseline, collect-artifacts, publish-results]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Verify all required transaction jobs"
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          REQUIRE_BASELINE: ${{ github.event_name == 'schedule' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'phase4' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["JOB_RESULTS"])
          required = set(results) - {"phase4-benchmark-baseline"}
          if os.environ["REQUIRE_BASELINE"] == "true":
              required.add("phase4-benchmark-baseline")
          failures = [name for name in sorted(required) if results[name]["result"] != "success"]
          if failures:
              sys.exit("Required transaction jobs did not succeed: " + ", ".join(failures))
          print("Required transaction evidence jobs succeeded; this is not a release sign-off.")
          PY
