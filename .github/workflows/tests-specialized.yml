name: 'Specialized Tests'

on:
  schedule:
    # Run specialized tests twice weekly: Tuesday and Friday at 4 AM UTC
    - cron: '0 4 * * 2,5'
  workflow_dispatch:
    inputs:
      test-type:
        description: 'Test type to run'
        required: false
        type: choice
        options:
          - all
          - fuzzing
          - sanitizers
          - cross-compile
        default: 'all'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  security-events: write

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  # Fuzzing tests
  fuzzing:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    if: inputs.test-type == 'all' || inputs.test-type == 'fuzzing' || inputs.test-type == ''
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup environment
        uses: ./.github/actions/setup-cpp-env

      - name: Install fuzzing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libfuzzer-14-dev

      - name: Build with fuzzing
        run: |
          mkdir -p build-fuzz
          cd build-fuzz
          
          CXX=clang++ CC=clang cmake .. \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTHEMIS_ENABLE_FUZZING=ON \
            -DTHEMIS_BUILD_TESTS=OFF
          
          make -j$(nproc) || true
        continue-on-error: true

      - name: Run fuzzing
        run: |
          cd build-fuzz
          echo "## 🐛 Fuzzing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run fuzzing if fuzz targets exist
          if ls fuzz_* 2>/dev/null; then
            for target in fuzz_*; do
              timeout 300 ./$target -max_total_time=300 || true
            done
            echo "✅ Fuzzing completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No fuzz targets found" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  # Sanitizer builds
  sanitizers:
    name: Sanitizer Tests
    runs-on: ubuntu-latest
    if: inputs.test-type == 'all' || inputs.test-type == 'sanitizers' || inputs.test-type == ''
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan, ubsan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup environment
        uses: ./.github/actions/setup-cpp-env

      - name: Setup vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Build with ${{ matrix.sanitizer }}
        run: |
          mkdir -p build-${{ matrix.sanitizer }}
          cd build-${{ matrix.sanitizer }}
          
          VCPKG_DIR="${VCPKG_ROOT:-vcpkg}"
          
          case "${{ matrix.sanitizer }}" in
            asan)
              SANITIZER_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
              ;;
            tsan)
              SANITIZER_FLAGS="-fsanitize=thread"
              ;;
            ubsan)
              SANITIZER_FLAGS="-fsanitize=undefined"
              ;;
          esac
          
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_CXX_FLAGS="$SANITIZER_FLAGS" \
            -DCMAKE_C_FLAGS="$SANITIZER_FLAGS" \
            -DTHEMIS_BUILD_TESTS=ON
          
          cmake --build . -j$(nproc)
        continue-on-error: true

      - name: Run tests with ${{ matrix.sanitizer }}
        run: |
          cd build-${{ matrix.sanitizer }}
          
          # Set sanitizer options
          case "${{ matrix.sanitizer }}" in
            asan)
              export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
              ;;
            tsan)
              export TSAN_OPTIONS=abort_on_error=1
              ;;
            ubsan)
              export UBSAN_OPTIONS=print_stacktrace=1:abort_on_error=1
              ;;
          esac
          
          ctest -C RelWithDebInfo --output-on-failure -j$(nproc) || true
        continue-on-error: true

      - name: Report sanitizer results
        if: always()
        run: |
          echo "## 🔬 ${{ matrix.sanitizer }} Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sanitizer test completed" >> $GITHUB_STEP_SUMMARY

  # Cross-compilation tests
  cross-compile-tests:
    name: Cross-Compile Tests
    if: inputs.test-type == 'all' || inputs.test-type == 'cross-compile' || inputs.test-type == ''
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf]
    uses: ./.github/workflows/reusable-cross-compile.yml
    with:
      target-arch: ${{ matrix.arch }}
      build-type: Release
      run-tests: false
      upload-artifacts: false

  # Summary
  summary:
    name: Specialized Tests Summary
    runs-on: ubuntu-latest
    needs: [fuzzing, sanitizers, cross-compile-tests]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 🔬 Specialized Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Fuzzing | ${{ needs.fuzzing.result == 'success' && '✅' || (needs.fuzzing.result == 'skipped' && '⏭️' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sanitizers | ${{ needs.sanitizers.result == 'success' && '✅' || (needs.sanitizers.result == 'skipped' && '⏭️' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-Compile | ${{ needs.cross-compile-tests.result == 'success' && '✅' || (needs.cross-compile-tests.result == 'skipped' && '⏭️' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
