name: Docker Build & Release

# Build and push Docker images for multiple architectures
# Uses Dockerfile.simple with pre-built binaries for fast builds
# Falls back to full Dockerfile build if no pre-built binaries available

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.1). Uses VERSION file if not specified.'
        required: false
        default: ''
      push:
        description: 'Push to registry'
        required: true
        type: boolean
        default: false
      use_prebuilt:
        description: 'Use pre-built binary (faster)'
        required: false
        type: boolean
        default: true

# Concurrency: Prevent multiple simultaneous Docker builds
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false  # Let Docker builds complete

env:
  REGISTRY: docker.io
  IMAGE_NAME: themisdb/server
  BUILD_TYPE: Release

permissions:
  contents: read
  packages: write

jobs:
  # Set version from VERSION file if not provided
  set-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

  # Build binary only if not using pre-built
  build-binary:
    name: Build Binary for Docker
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Full vcpkg build ~30-40min, project build ~10-15min + buffer
    needs: set-version
    if: github.event.inputs.use_prebuilt != 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg-cache
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-docker-build-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-docker-build-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libcurl4-openssl-dev \
            pkg-config autoconf automake libtool

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '971828fe0920d00c077c7b5d34798bc45b261ec4'  # master (latest)

      - name: Configure and Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_STATIC_BUILD=ON
          cmake --build build --target themis_server -j $(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: themis_server_docker
          path: build/themis_server
          retention-days: 1

  build-docker-simple:
    name: Build Docker (Pre-built Binary)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Fast Docker build
    needs: [set-version, build-binary]
    if: always() && (needs.build-binary.result == 'success' || github.event.inputs.use_prebuilt == 'true')
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'development' }}
      url: https://hub.docker.com/r/themisdb/server
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use pre-built binary from release/
        if: github.event.inputs.use_prebuilt == 'true'
        run: |
          mkdir -p build
          if [ -f release/themis_server_linux ]; then
            cp release/themis_server_linux build/themis_server
            chmod +x build/themis_server
          elif [ -f release/themis_server_linux_x64 ]; then
            cp release/themis_server_linux_x64 build/themis_server
            chmod +x build/themis_server
          else
            echo "ERROR: No pre-built binary found in either location:"
            echo "  - release/themis_server_linux"
            echo "  - release/themis_server_linux_x64"
            exit 1
          fi

      - name: Download built binary
        if: github.event.inputs.use_prebuilt != 'true'
        uses: actions/download-artifact@v4
        with:
          name: themis_server_docker
          path: build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.set-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.set-version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (simple/fast)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.simple
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Summary
        run: |
          echo "## Docker Build Summary (Fast Mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Strategy" >> $GITHUB_STEP_SUMMARY
          echo "- **Method**: Pre-built binary with Dockerfile.simple" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: ~30 seconds (vs ~30 minutes full build)" >> $GITHUB_STEP_SUMMARY
          echo "- **Binary Source**: ${{ github.event.inputs.use_prebuilt == 'true' && 'release/' || 'Fresh build' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.set-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- **Base**: Ubuntu 24.04" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ~160 MB (minimal runtime)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.push }}" = "true" ]; then
            echo "✅ **Images pushed to Docker Hub**" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Images built locally (not pushed)**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME }}:${{ needs.set-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 8765:8765 -v themisdb-data:/data ${{ env.IMAGE_NAME }}:${{ needs.set-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build-docker-multiarch:
    name: Build Docker (Multi-Arch Full Build)
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Multi-arch builds take longer
    needs: set-version
    if: github.event.inputs.use_prebuilt != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    environment:
      name: production
      url: https://hub.docker.com/r/themisdb/server
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.set-version.outputs.version }}-multiarch
            type=raw,value=multiarch

      - name: Build and push (full multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_TYPE=Release
            VERSION=${{ needs.set-version.outputs.version }}

      - name: Build Summary
        run: |
          echo "## Docker Build Summary (Multi-Arch)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Strategy" >> $GITHUB_STEP_SUMMARY
          echo "- **Method**: Full build with vcpkg (Dockerfile)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: ~30 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.set-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base**: Ubuntu 22.04" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY


