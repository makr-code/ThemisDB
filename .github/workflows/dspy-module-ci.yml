name: Prompt Engineering – DSPy Module CI

# Validates DspyModule (Phase 6: DSPy-compatible prompt declaration layer).
# roadmap:prompt_engineering:v2.0.0:dspy-module
#
# Acceptance criteria covered:
#   AC-1  DspyField — constructor sets all members correctly
#   AC-2  DspySignature — addInput / addOutput / getName / getDescription
#   AC-3  buildPrompt — required fields rendered, description header present
#   AC-4  buildPrompt — output field labels appended with # description
#   AC-5  buildPrompt — throws DspyMissingFieldError on missing required input
#   AC-6  buildPrompt — optional fields use default_value when absent
#   AC-7  parseResponse — extracts output field values from well-formed response
#   AC-8  parseResponse — missing required output sets warning, uses default
#   AC-9  parseResponse — handles multiple output fields independently
#   AC-10 EchoDspyLLMProvider — returns one echo line per output label

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/prompt_engineering/dspy_module.h'
      - 'src/prompt_engineering/dspy_module.cpp'
      - 'tests/test_dspy_module.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/dspy-module-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/dspy_module.h'
      - 'src/prompt_engineering/dspy_module.cpp'
      - 'tests/test_dspy_module.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/dspy-module-ci.yml'
  workflow_dispatch:

concurrency:
  group: prompt-engineering-dspy-module-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  dspy-module-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: DspyModule (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_dspy_module_focused

      - name: Run DspyModuleFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R DspyModuleFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee dspy_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_dspy_module_focused \
            --gtest_output="xml:dspy_gtest.xml" \
            2>&1 | tee dspy_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspy-module-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/dspy_ctest.txt
            build/dspy_gtest.xml
            build/dspy_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧩 Prompt Engineering – DSPy Module" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1: DspyField constructor — all members set | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2: DspySignature — addInput/addOutput/getName | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3: buildPrompt — required fields + description header | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4: buildPrompt — output labels with # description | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5: buildPrompt — throws DspyMissingFieldError | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6: buildPrompt — optional field uses default_value | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7: parseResponse — extracts field values | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8: parseResponse — missing output uses default | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9: parseResponse — multiple fields independent | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: EchoDspyLLMProvider — echo per output label | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-11 to AC-30: DspyModule/Predict/CoT/Error tests | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
