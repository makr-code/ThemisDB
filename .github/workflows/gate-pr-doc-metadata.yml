name: "Gate: PR Doc Metadata"

# Rechenaufwand-Score: R=1 (K=1, L=1, N=1) | last-calibrated: 2026-09-09
# Trigger policy: lightweight markdown metadata gate for branch-protection-ready doc changes.
# Enforces minimum metadata on changed in-scope Markdown documentation files.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'docs/**/*.md'
      - 'audit/**/*.md'
      - 'security/**/*.md'
      - 'ai_context/**/*.md'
      - '.github/**/*.md'
      - 'tests/**/*.md'
      - 'src/**/FEATURES.md'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'SETUP.md'
      - 'CONTRIBUTING.md'
      - 'SUPPORT.md'
      - 'INDEX.md'
      - 'LOG.md'
      - 'AI_WIKI_INTEGRATION_PLAYBOOK.md'
      - 'DOCUMENTATION_GOVERNANCE.md'
      - '.github/doc-metadata-gate.json'
      - 'scripts/validate_doc_metadata.py'
      - 'scripts/validate_module_features.py'
      - 'tests/test_doc_metadata_gate.py'
      - '.github/workflows/gate-pr-doc-metadata.yml'
  push:
    branches:
      - develop
      - community
    paths:
      - 'docs/**/*.md'
      - 'audit/**/*.md'
      - 'security/**/*.md'
      - 'ai_context/**/*.md'
      - '.github/**/*.md'
      - 'tests/**/*.md'
      - 'src/**/FEATURES.md'
      - 'README.md'
      - 'QUICKSTART.md'
      - 'SETUP.md'
      - 'CONTRIBUTING.md'
      - 'SUPPORT.md'
      - 'INDEX.md'
      - 'LOG.md'
      - 'AI_WIKI_INTEGRATION_PLAYBOOK.md'
      - 'DOCUMENTATION_GOVERNANCE.md'
      - '.github/doc-metadata-gate.json'
      - 'scripts/validate_doc_metadata.py'
      - 'scripts/validate_module_features.py'
      - 'tests/test_doc_metadata_gate.py'
      - '.github/workflows/gate-pr-doc-metadata.yml'
  workflow_dispatch:

concurrency:
  group: doc-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  doc-metadata-gate:
    name: "Gate: Docs Metadata"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'

      - name: Collect changed files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            if git merge-base "origin/${BASE_REF}" HEAD >/dev/null 2>&1; then
              git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" > /tmp/doc-metadata-files.txt
            else
              echo "::warning::No merge base found for origin/${BASE_REF}...HEAD; falling back to two-dot diff."
              git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}..HEAD" > /tmp/doc-metadata-files.txt
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMR "${{ github.event.before }}" "${{ github.sha }}" > /tmp/doc-metadata-files.txt
          else
            git ls-files '*.md' > /tmp/doc-metadata-files.txt
          fi

      - name: Run markdown metadata gate
        if: always()
        run: |
          python3 scripts/validate_doc_metadata.py \
            --repo-root . \
            --config .github/doc-metadata-gate.json \
            --files-from /tmp/doc-metadata-files.txt \
            --report-json /tmp/doc-metadata-report.json

      - name: Run module feature gate
        id: module_feature_gate
        if: always()
        run: |
          python3 scripts/validate_module_features.py \
            --repo-root . \
            --config .github/doc-metadata-gate.json \
            --files-from /tmp/doc-metadata-files.txt \
            --report-json /tmp/module-feature-report.json

      - name: Generate per-file docs issues
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/doc-file-issues
          python3 scripts/prepare_doc_file_issues.py \
            --metadata-report /tmp/doc-metadata-report.json \
            --feature-report /tmp/module-feature-report.json \
            --output-dir /tmp/doc-file-issues

      - name: Create per-file documentation issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/doc-file-issues/issues_manifest.json ]; then
            echo "No file-level doc issues to create."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          issue_dir = Path('/tmp/doc-file-issues')
          manifest = json.loads((issue_dir / 'issues_manifest.json').read_text(encoding='utf-8'))

          def ensure_label(name: str) -> None:
              probe = subprocess.run(
                  ['gh', 'label', 'view', name, '--repo', repo],
                  check=False,
                  capture_output=True,
                  text=True,
                  env=os.environ.copy(),
              )
              if probe.returncode == 0:
                  return
              subprocess.run(
                  ['gh', 'label', 'create', name, '--color', 'D4C5F9', '--repo', repo],
                  check=True,
                  env=os.environ.copy(),
              )

          try:
              for label in ['type:documentation', 'status/needs-triage', 'priority:medium', 'quality/doc-metadata-failed']:
                  ensure_label(label)

              issues = json.loads(subprocess.run(
                  ['gh', 'issue', 'list', '--state', 'open', '--limit', '200', '--json', 'number,title,body', '--repo', repo],
                  check=True,
                  capture_output=True,
                  text=True,
                  env=os.environ.copy(),
              ).stdout)
          except subprocess.CalledProcessError as exc:
              detail = (exc.stderr or exc.stdout or str(exc)).strip()
              print(f"::warning::Skipping per-file documentation issue sync due to GitHub API/permission error: {detail}")
              raise SystemExit(0)

          for item in manifest.get('issues', []):
              marker = item['marker']
              title = item['title']
              body = (issue_dir / item['output']).read_text(encoding='utf-8')
              match = next((issue for issue in issues if marker in (issue.get('body') or '')), None)
              try:
                  if match:
                      subprocess.run(
                          ['gh', 'issue', 'edit', str(match['number']), '--title', title, '--body-file', str(issue_dir / item['output']), '--repo', repo],
                          check=True,
                          env=os.environ.copy(),
                      )
                      subprocess.run(
                          ['gh', 'issue', 'edit', str(match['number']), '--add-label', 'type:documentation', '--add-label', 'status/needs-triage', '--add-label', 'priority:medium', '--repo', repo],
                          check=True,
                          env=os.environ.copy(),
                      )
                      continue

                  subprocess.run(
                      ['gh', 'issue', 'create', '--title', title, '--body-file', str(issue_dir / item['output']), '--repo', repo,
                       '--label', 'type:documentation', '--label', 'status/needs-triage', '--label', 'priority:medium'] +
                      (['--label', 'quality/doc-metadata-failed'] if item['kind'] == 'metadata' else []),
                      check=True,
                      env=os.environ.copy(),
                  )
              except subprocess.CalledProcessError as exc:
                  detail = (exc.stderr or exc.stdout or str(exc)).strip()
                  print(f"::warning::Skipping per-file documentation issue item '{title}' due to GitHub API/permission error: {detail}")
          PY

      - name: Write job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report_path = Path("/tmp/doc-metadata-report.json")
          print("## Markdown Metadata Gate")
          print()
          if not report_path.exists():
              print("- Result: no report produced")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          print(f"- Verdict: **{report['verdict']}**")
          print(f"- Files seen: `{report['files_seen']}`")
          print(f"- Files checked: `{report['files_checked']}`")
          print(f"- Files skipped: `{report['files_skipped']}`")
          print(f"- Files with errors: `{report['files_with_errors']}`")
          if report["results"]:
              print()
              print("| File | Errors |")
              print("|---|---|")
              for result in report["results"][:20]:
                  joined = "<br>".join(result["errors"])
                  print(f"| `{result['file']}` | {joined} |")
          PY

      - name: Export gate outputs
        id: gate_result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("/tmp/doc-metadata-report.json")
          report = {
              "verdict": "FAIL",
              "files_seen": 0,
              "files_checked": 0,
              "files_skipped": 0,
              "files_with_errors": 0,
              "results": [],
          }
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding="utf-8"))

          summary_lines = [
              "<!-- doc-metadata-gate -->",
              "## Doc Metadata Gate",
              "",
              f"- Verdict: **{report['verdict']}**",
              f"- Files seen: `{report['files_seen']}`",
              f"- Files checked: `{report['files_checked']}`",
              f"- Files skipped: `{report['files_skipped']}`",
              f"- Files with errors: `{report['files_with_errors']}`",
              f"- Workflow: `{os.environ.get('GITHUB_WORKFLOW', '')}`",
              f"- Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              f"- Commit: `{os.environ.get('GITHUB_SHA', '')}`",
          ]

          if report["results"]:
              summary_lines.extend(["", "### Errors"])
              for result in report["results"][:20]:
                  summary_lines.append(f"- `{result['file']}`")
                  for error in result["errors"]:
                      summary_lines.append(f"  - {error}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"verdict={report['verdict']}\n")
              fh.write("summary<<EOF\n")
              fh.write("\n".join(summary_lines))
              fh.write("\nEOF\n")
          PY

      - name: Apply metadata failed state labels
        if: always() && github.event_name == 'pull_request' && steps.gate_result.outputs.verdict == 'FAIL'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-number: ${{ github.event.pull_request.number }}
          labels-to-add: 'quality/doc-metadata-failed,status/needs-approval'
          status-group: 'quality/doc-metadata-failed,status/needs-attention,status/needs-approval,status/resolved'

      - name: Clear metadata result labels on pass
        if: always() && github.event_name == 'pull_request' && steps.gate_result.outputs.verdict == 'PASS'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-number: ${{ github.event.pull_request.number }}
          labels-to-add: 'status/resolved'
          status-group: 'quality/doc-metadata-failed,status/needs-attention,status/needs-approval,status/resolved'

      - name: Comment gate result on PR
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-number: ${{ github.event.pull_request.number }}
          target-type: pr
          issue-marker: '<!-- doc-metadata-gate -->'
          issue-body: ${{ steps.gate_result.outputs.summary }}
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Open tracker issue on metadata FAIL
        continue-on-error: true
        if: always() && github.event_name == 'pull_request' && steps.gate_result.outputs.verdict == 'FAIL'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Docs] Metadata gate failure — PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})'
          issue-marker: '<!-- doc-metadata-gate:pr:${{ github.event.pull_request.number }} -->'
          issue-body: |
            <!-- doc-metadata-gate:pr:${{ github.event.pull_request.number }} -->
            ## Doc Metadata Gate — FAIL

            PR: #${{ github.event.pull_request.number }} (`${{ github.head_ref }}`)

            ${{ steps.gate_result.outputs.summary }}

            ---
            - Workflow: `${{ github.workflow }}`
            - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Commit: `${{ github.sha }}`
          labels-to-add: 'quality/doc-metadata-failed,status/needs-attention'
          status-group: 'quality/doc-metadata-failed,status/needs-attention,status/resolved'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Update tracker issue on metadata PASS
        continue-on-error: true
        if: always() && github.event_name == 'pull_request' && steps.gate_result.outputs.verdict == 'PASS'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Docs] Metadata gate failure — PR #${{ github.event.pull_request.number }} (${{ github.head_ref }})'
          issue-marker: '<!-- doc-metadata-gate:pr:${{ github.event.pull_request.number }} -->'
          issue-body: |
            <!-- doc-metadata-gate:pr:${{ github.event.pull_request.number }} -->
            ## Doc Metadata Gate — ✅ PASS (recovered)

            PR #${{ github.event.pull_request.number }} (`${{ github.head_ref }}`) now passes all metadata checks.

            - Workflow: `${{ github.workflow }}`
            - Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Commit: `${{ github.sha }}`
          labels-to-add: 'status/resolved'
          allow-missing: 'true'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Clear stale metadata failure labels on PASS
        continue-on-error: true
        if: always() && github.event_name == 'pull_request' && steps.gate_result.outputs.verdict == 'PASS'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-marker: '<!-- doc-metadata-gate:pr:${{ github.event.pull_request.number }} -->'
          labels-to-add: 'status/resolved'
          status-group: 'quality/doc-metadata-failed,status/needs-attention,status/needs-approval,status/resolved'
          allow-missing: 'true'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Upload metadata gate artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: doc-metadata-gate-${{ github.run_number }}
          path: |
            /tmp/doc-metadata-files.txt
            /tmp/doc-metadata-report.json
          retention-days: 14
          if-no-files-found: warn
