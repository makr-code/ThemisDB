name: ManifestDatabase File Deletion CI

# Triggered on every push/PR that touches the ManifestDatabase sources,
# its test file, or this workflow itself.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/updates/manifest_database.cpp'
      - 'include/updates/manifest_database.h'
      - 'tests/test_manifest_database_file_deletion.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_manifest-database-file-deletion-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated ManifestDatabase file deletion focused test suite.
  # Tests cover:
  #   1. Insert manifest with 3 associated files, remove entry, verify all 3 deleted
  #   2. Manifest record itself is removed from the database
  #   3. Download cache entries are cleaned up from RocksDB
  #   4. File registry entries are cleaned up from RocksDB
  #   5. deleteManifest() on a non-existent version returns false
  #   6. Tombstone key is written and removed correctly around the deletion window
  # ---------------------------------------------------------------------------
  manifest-database-file-deletion-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ManifestDatabase file deletion tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev libzstd-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build focused test binary
        run: cmake --build build --target test_manifest_database_file_deletion_focused -- -j$(nproc)

      - name: Run ManifestDatabase file deletion unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex ManifestDatabaseFileDeletionFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee manifest_database_file_deletion_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-database-file-deletion-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/manifest_database_file_deletion_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🗑️ ManifestDatabase File Deletion – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ManifestDatabase::deleteManifest(): filesystem file cleanup, tombstone race guard, file_registry and download_cache removal from RocksDB." >> "$GITHUB_STEP_SUMMARY"
