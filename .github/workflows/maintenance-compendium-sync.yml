name: "Maintenance: Compendium Sync"

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-09-22
# Human-in-the-loop automation for recurring compendium refresh.
#
# Operating model:
#   DETECT → CLASSIFY → CREATE ISSUE (or UPDATE) → HUMAN REVIEW → APPLY
#
# This workflow NEVER auto-merges or silently rewrites compendium chapters.
# All write-back and publication steps require explicit human approval.
#
# Reuses patterns from maintenance-docs.yml (upsert_issue via
# .github/actions/status-flags-and-issues) to keep the issue/PR control surface
# consistent with the rest of the maintenance toolchain.

on:
  schedule:
    # Weekly Monday 06:30 UTC — compendium drift scan
    # (offset from existing 04:00/05:00 maintenance schedules to avoid runner contention)
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      priority:
        description: 'Minimum chapter priority to scan (high|medium|low)'
        type: choice
        default: medium
        required: false
        options:
          - high
          - medium
          - low
      target_version:
        description: 'Optional target version override; blank uses CHAPTER_ROADMAP_MAPPING.yml'
        type: string
        default: ''
      verbose:
        description: 'Verbose output (print per-chapter detail)'
        type: boolean
        default: false
        required: false
      dry_run:
        description: 'Dry run: detect and report drift but skip issue creation'
        type: boolean
        default: true
        required: false

concurrency:
  group: maintenance-compendium-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [drift-scan, open-tracker-issue, no-drift-close-issue]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Compendium drift detection and tracker maintenance"
          job-results: ${{ toJSON(needs) }}

  drift-scan:
    name: "Maintenance: Compendium Drift Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      priority: ${{ steps.params.outputs.priority }}
      target_version: ${{ steps.scan.outputs.target_version }}
      stale_count: ${{ steps.scan.outputs.stale_count }}
      missing_count: ${{ steps.scan.outputs.missing_count }}
      proposals_count: ${{ steps.scan.outputs.proposals_count }}
      total_issues: ${{ steps.scan.outputs.total_issues }}
      report_md: ${{ steps.scan.outputs.report_md }}
      report_json: ${{ steps.scan.outputs.report_json }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Resolve scan parameters
        id: params
        env:
          PRIORITY_INPUT: ${{ inputs.priority || 'medium' }}
          TARGET_VERSION_OVERRIDE: ${{ inputs.target_version }}
          VERBOSE_INPUT: ${{ inputs.verbose }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import yaml

          priority = os.environ["PRIORITY_INPUT"]
          if priority not in {"high", "medium", "low"}:
              raise SystemExit("priority must be high, medium, or low")

          with open("docs/compendium/CHAPTER_ROADMAP_MAPPING.yml", encoding="utf-8") as mapping_file:
              mapping = yaml.safe_load(mapping_file)
          configured_version = mapping.get("target_version") if isinstance(mapping, dict) else None
          target_version = os.environ.get("TARGET_VERSION_OVERRIDE", "").strip() or configured_version
          if not isinstance(target_version, str) or not re.fullmatch(
              r"[vV]?\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?"
              r"(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?",
              target_version,
          ):
              raise SystemExit("target_version must be a semantic version from the mapping or a valid override")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"priority={priority}\n")
              output.write(f"target_version={target_version}\n")
              output.write(f"verbose_flag={'--verbose' if os.environ.get('VERBOSE_INPUT') == 'true' else ''}\n")
          PY

      - name: Run compendium drift scan
        id: scan
        env:
          SCAN_PRIORITY: ${{ steps.params.outputs.priority }}
          TARGET_VERSION: ${{ steps.params.outputs.target_version }}
          VERBOSE_FLAG: ${{ steps.params.outputs.verbose_flag }}
        run: |
          scan_args=(
            --priority "$SCAN_PRIORITY"
            --target-version "$TARGET_VERSION"
            --out-json /tmp/compendium-drift.json
            --out-md /tmp/compendium-drift-summary.md
            --github-output
          )
          if [ "$VERBOSE_FLAG" = "--verbose" ]; then
            scan_args+=(--verbose)
          fi
          set +e
          python3 scripts/compendium-drift-scan.py "${scan_args[@]}"
          scan_status=$?
          set -e

          if [ ! -s /tmp/compendium-drift.json ] || [ ! -s /tmp/compendium-drift-summary.md ]; then
            echo "::error::Drift scan did not produce both report files."
            exit 1
          fi
          if ! grep -Eq '^total_issues=[0-9]+$' "$GITHUB_OUTPUT"; then
            echo "::error::Drift scan did not emit a valid total_issues output."
            exit 1
          fi
          total_issues="$(sed -n 's/^total_issues=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if { [ "$scan_status" -eq 0 ] && [ "$total_issues" -ne 0 ]; } ||
             { [ "$scan_status" -eq 1 ] && [ "$total_issues" -eq 0 ]; } ||
             [ "$scan_status" -gt 1 ]; then
            echo "::error::Drift scan exited with status $scan_status inconsistent with total_issues=$total_issues."
            exit 1
          fi

      - name: Write scan execution summary
        if: always()
        env:
          PRIORITY: ${{ steps.params.outputs.priority }}
          TARGET_VERSION: ${{ steps.params.outputs.target_version }}
          TOTAL_ISSUES: ${{ steps.scan.outputs.total_issues }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          {
            echo "## Compendium Drift Scan"
            echo "- Target version: \`${TARGET_VERSION:-unresolved}\`"
            echo "- Priority: \`${PRIORITY:-unresolved}\`"
            echo "- Findings: \`${TOTAL_ISSUES:-unavailable}\`"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "- Manual dry-run: tracker issue writes were suppressed; scan and report artifacts still run."
              if [ -n "${TOTAL_ISSUES}" ] && [ "${TOTAL_ISSUES}" != "0" ]; then
                echo "- Preview: the version-scoped compendium tracker issue would be upserted."
              elif [ "${TOTAL_ISSUES}" = "0" ]; then
                echo "- Preview: the matching version-scoped tracker issue would be marked resolved."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload drift report artifacts
        uses: actions/upload-artifact@v5
        with:
          name: compendium-drift-report
          path: |
            /tmp/compendium-drift.json
            /tmp/compendium-drift-summary.md
          retention-days: 14

      - name: Print Markdown summary to workflow log
        run: |
          if [ -f /tmp/compendium-drift-summary.md ]; then
            cat /tmp/compendium-drift-summary.md
          fi

  open-tracker-issue:
    name: "Maintenance: Open / Update Tracker Issue"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: drift-scan
    if: >
      needs.drift-scan.outputs.total_issues != '0' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download drift report
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: compendium-drift-report
          path: /tmp/drift-report

      - name: Read report summary
        id: report
        run: |
          STALE="${{ needs.drift-scan.outputs.stale_count }}"
          MISSING="${{ needs.drift-scan.outputs.missing_count }}"
          PROPOSALS="${{ needs.drift-scan.outputs.proposals_count }}"
          TOTAL="${{ needs.drift-scan.outputs.total_issues }}"
          {
            echo "stale=${STALE}"
            echo "missing=${MISSING}"
            echo "proposals=${PROPOSALS}"
            echo "total=${TOTAL}"
          } >> "$GITHUB_OUTPUT"

          # Embed the Markdown summary as issue body (truncated to 60 KB)
          # Use heredoc delimiter to safely handle multi-line and special characters
          MD_BODY=""
          if [ -f /tmp/drift-report/compendium-drift-summary.md ]; then
            MD_BODY=$(head -c 60000 /tmp/drift-report/compendium-drift-summary.md)
          fi
          {
            echo "md_body<<COMPENDIUM_DRIFT_EOF"
            echo "${MD_BODY}"
            echo "COMPENDIUM_DRIFT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update compendium drift tracker issue
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: 'Update compendium chapters to ${{ needs.drift-scan.outputs.target_version }}'
          issue-marker: '<!-- compendium-drift:${{ needs.drift-scan.outputs.target_version }} -->'
          issue-body: |
            <!-- compendium-drift:${{ needs.drift-scan.outputs.target_version }} -->

            ### Context

            The scheduled compendium sync scan (`maintenance-compendium-sync`) detected that
            one or more `docs/compendium/docs/*.md` chapters are stale relative to the
            `${{ needs.drift-scan.outputs.target_version }}` ROADMAP.md and FUTURE_ENHANCEMENTS.md sources.

            Scan results — priority filter `${{ needs.drift-scan.outputs.priority }}`:

            - **Stale chapters:** ${{ steps.report.outputs.stale }}
            - **Missing chapters:** ${{ steps.report.outputs.missing }}
            - **New chapter proposals:** ${{ steps.report.outputs.proposals }}
            - **Total items:** ${{ steps.report.outputs.total }}

            Full artifact report: [compendium-drift-report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Goal

            Update all stale and missing compendium chapters so that each chapter
            accurately reflects the ${{ needs.drift-scan.outputs.target_version }} feature set, architecture, and status
            as defined in `ROADMAP.md` and `FUTURE_ENHANCEMENTS.md`.

            ### Acceptance Criteria

            - [ ] All chapters flagged **stale** in the scan artifact are updated to ${{ needs.drift-scan.outputs.target_version }}.
            - [ ] All chapters flagged **missing** are created or the gap is documented with rationale.
            - [ ] Each chapter update PR references this issue with `Closes #<N>` or `Part of #<N>`.
            - [ ] Each chapter update PR passes `gate-pr-doc-metadata` and `gate-pr-doxygen-governance`.
            - [ ] New chapter proposals (if any) are reviewed and either actioned or deferred with rationale.
            - [ ] `CHAPTER_ROADMAP_MAPPING.yml` is updated to reflect any new chapters added.
            - [ ] No chapter content is overwritten without human review and PR approval.

            ### Relationships

            - Relates to [ROADMAP.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/ROADMAP.md) — ${{ needs.drift-scan.outputs.target_version }} section
            - Relates to [FUTURE_ENHANCEMENTS.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/FUTURE_ENHANCEMENTS.md)

            ### References

            - Drift scan artifact: [compendium-drift-report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Mapping: [`docs/compendium/CHAPTER_ROADMAP_MAPPING.yml`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/compendium/CHAPTER_ROADMAP_MAPPING.yml)
            - Process: [`docs/compendium/COMPENDIUM_SYNC_PROCESS.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/compendium/COMPENDIUM_SYNC_PROCESS.md)
            - Scan run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Branch: `${{ github.ref_name }}`

            ---

            ### Full Scan Summary

            ${{ steps.report.outputs.md_body }}

            ---

            > **⚠ Human-in-the-loop gate:** Do not auto-merge or silently overwrite chapter content.
            > All write-back steps require explicit PR review and human approval.
            > See `docs/compendium/COMPENDIUM_SYNC_PROCESS.md` for the full operating model.
          # Governance-compliant label schema (GOVERNANCE.md mandatory four-category set).
          # queue/copilot enables the Copilot Dispatcher to delegate chapter-update work.
          labels-to-add: 'area:docs,priority:medium,type:documentation,status:open,queue/copilot'
          status-group: 'area:docs,priority:medium,type:documentation,status:open,status:in_progress,status:blocked,queue/copilot,copilot/delegated'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

  no-drift-close-issue:
    name: "Maintenance: Close Tracker Issue (no drift)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: drift-scan
    if: >
      needs.drift-scan.outputs.total_issues == '0' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve or close tracker issue
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: 'Update compendium chapters to ${{ needs.drift-scan.outputs.target_version }}'
          issue-marker: '<!-- compendium-drift:${{ needs.drift-scan.outputs.target_version }} -->'
          issue-body: |
            <!-- compendium-drift:${{ needs.drift-scan.outputs.target_version }} -->

            ### Context

            The scheduled compendium sync scan (`maintenance-compendium-sync`) found
            **no stale or missing chapters** at priority `${{ inputs.priority || 'medium' }}` or above.

            ### Goal

            No action required at this time. The compendium is aligned with ${{ needs.drift-scan.outputs.target_version }} sources.

            ### Acceptance Criteria

            - [x] All chapters at priority `${{ needs.drift-scan.outputs.priority }}` and above are current for ${{ needs.drift-scan.outputs.target_version }}.

            ### References

            - Scan run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Branch: `${{ github.ref_name }}`
          labels-to-add: 'area:docs,priority:low,type:documentation,status:open'
          status-group: 'area:docs,priority:low,priority:medium,type:documentation,status:open,status:in_progress,status:blocked,queue/copilot,copilot/delegated'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}
