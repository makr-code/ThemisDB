name: "Maintenance: Compendium Sync"

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-09-22
# Human-in-the-loop automation for recurring compendium refresh.
#
# Operating model:
#   DETECT → CLASSIFY → CREATE ISSUE (or UPDATE) → HUMAN REVIEW → APPLY
#
# This workflow NEVER auto-merges or silently rewrites compendium chapters.
# All write-back and publication steps require explicit human approval.
#
# Reuses patterns from maintenance-docs.yml (upsert_issue via
# .github/actions/status-flags-and-issues) to keep the issue/PR control surface
# consistent with the rest of the maintenance toolchain.

on:
  schedule:
    # Weekly Monday 06:30 UTC — compendium drift scan
    # (offset from existing 04:00/05:00 maintenance schedules to avoid runner contention)
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      priority:
        description: 'Minimum chapter priority to scan (high|medium|low)'
        type: choice
        default: medium
        options:
          - high
          - medium
          - low
      target_version:
        description: 'Target version to check against chapter headers'
        type: string
        default: '2.4.0-alpha'
      verbose:
        description: 'Verbose output (print per-chapter detail)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: detect and report drift but skip issue creation'
        type: boolean
        default: false

concurrency:
  group: maintenance-compendium-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift-scan:
    name: Compendium Drift Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stale_count: ${{ steps.scan.outputs.stale_count }}
      missing_count: ${{ steps.scan.outputs.missing_count }}
      proposals_count: ${{ steps.scan.outputs.proposals_count }}
      total_issues: ${{ steps.scan.outputs.total_issues }}
      report_md: ${{ steps.scan.outputs.report_md }}
      report_json: ${{ steps.scan.outputs.report_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41efee25c33b52b59b6626b
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Resolve scan parameters
        id: params
        run: |
          PRIORITY="${{ inputs.priority || 'medium' }}"
          TARGET_VERSION="${{ inputs.target_version || '2.4.0-alpha' }}"
          VERBOSE_FLAG=""
          if [ "${{ inputs.verbose }}" = "true" ]; then
            VERBOSE_FLAG="--verbose"
          fi
          {
            echo "priority=${PRIORITY}"
            echo "target_version=${TARGET_VERSION}"
            echo "verbose_flag=${VERBOSE_FLAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Run compendium drift scan
        id: scan
        run: |
          python3 scripts/compendium-drift-scan.py \
            --priority "${{ steps.params.outputs.priority }}" \
            --target-version "${{ steps.params.outputs.target_version }}" \
            --out-json /tmp/compendium-drift.json \
            --out-md /tmp/compendium-drift-summary.md \
            --github-output \
            ${{ steps.params.outputs.verbose_flag }} || true
          # Note: script exits 1 on findings; we capture via outputs, not exit code.

      - name: Upload drift report artifacts
        uses: actions/upload-artifact@6f51b1e991eae641e69d16477226994b16345ebf
        with:
          name: compendium-drift-report
          path: |
            /tmp/compendium-drift.json
            /tmp/compendium-drift-summary.md
          retention-days: 14

      - name: Print Markdown summary to workflow log
        run: |
          if [ -f /tmp/compendium-drift-summary.md ]; then
            cat /tmp/compendium-drift-summary.md
          fi

  open-tracker-issue:
    name: Open / Update Tracker Issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: drift-scan
    if: >
      needs.drift-scan.outputs.total_issues != '0' &&
      inputs.dry_run != true
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Download drift report
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16.1.3
        with:
          name: compendium-drift-report
          path: /tmp/drift-report

      - name: Read report summary
        id: report
        run: |
          STALE="${{ needs.drift-scan.outputs.stale_count }}"
          MISSING="${{ needs.drift-scan.outputs.missing_count }}"
          PROPOSALS="${{ needs.drift-scan.outputs.proposals_count }}"
          TOTAL="${{ needs.drift-scan.outputs.total_issues }}"
          {
            echo "stale=${STALE}"
            echo "missing=${MISSING}"
            echo "proposals=${PROPOSALS}"
            echo "total=${TOTAL}"
          } >> "$GITHUB_OUTPUT"

          # Embed the Markdown summary as issue body (truncated to 60 KB)
          # Use heredoc delimiter to safely handle multi-line and special characters
          MD_BODY=""
          if [ -f /tmp/drift-report/compendium-drift-summary.md ]; then
            MD_BODY=$(head -c 60000 /tmp/drift-report/compendium-drift-summary.md)
          fi
          {
            echo "md_body<<COMPENDIUM_DRIFT_EOF"
            echo "${MD_BODY}"
            echo "COMPENDIUM_DRIFT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update compendium drift tracker issue
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: 'Update compendium chapters to v2.4.0-alpha'
          issue-marker: '<!-- compendium-drift:v2.4.0-alpha -->'
          issue-body: |
            <!-- compendium-drift:v2.4.0-alpha -->

            ### Context

            The scheduled compendium sync scan (`maintenance-compendium-sync`) detected that
            one or more `docs/compendium/docs/*.md` chapters are stale relative to the
            `v2.4.0-alpha` ROADMAP.md and FUTURE_ENHANCEMENTS.md sources.

            Scan results — priority filter `${{ inputs.priority || 'medium' }}`:

            - **Stale chapters:** ${{ steps.report.outputs.stale }}
            - **Missing chapters:** ${{ steps.report.outputs.missing }}
            - **New chapter proposals:** ${{ steps.report.outputs.proposals }}
            - **Total items:** ${{ steps.report.outputs.total }}

            Full artifact report: [compendium-drift-report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Goal

            Update all stale and missing compendium chapters so that each chapter
            accurately reflects the v2.4.0-alpha feature set, architecture, and status
            as defined in `ROADMAP.md` and `FUTURE_ENHANCEMENTS.md`.

            ### Acceptance Criteria

            - [ ] All chapters flagged **stale** in the scan artifact are updated to v2.4.0-alpha.
            - [ ] All chapters flagged **missing** are created or the gap is documented with rationale.
            - [ ] Each chapter update PR references this issue with `Closes #<N>` or `Part of #<N>`.
            - [ ] Each chapter update PR passes `gate-pr-doc-metadata` and `gate-pr-doxygen-governance`.
            - [ ] New chapter proposals (if any) are reviewed and either actioned or deferred with rationale.
            - [ ] `CHAPTER_ROADMAP_MAPPING.yml` is updated to reflect any new chapters added.
            - [ ] No chapter content is overwritten without human review and PR approval.

            ### Relationships

            - Relates to [ROADMAP.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/ROADMAP.md) — v2.4.0-alpha section
            - Relates to [FUTURE_ENHANCEMENTS.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/FUTURE_ENHANCEMENTS.md)

            ### References

            - Drift scan artifact: [compendium-drift-report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Mapping: [`docs/compendium/CHAPTER_ROADMAP_MAPPING.yml`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/compendium/CHAPTER_ROADMAP_MAPPING.yml)
            - Process: [`docs/compendium/COMPENDIUM_SYNC_PROCESS.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/compendium/COMPENDIUM_SYNC_PROCESS.md)
            - Scan run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Branch: `${{ github.ref_name }}`

            ---

            ### Full Scan Summary

            ${{ steps.report.outputs.md_body }}

            ---

            > **⚠ Human-in-the-loop gate:** Do not auto-merge or silently overwrite chapter content.
            > All write-back steps require explicit PR review and human approval.
            > See `docs/compendium/COMPENDIUM_SYNC_PROCESS.md` for the full operating model.
          # Governance-compliant label schema (GOVERNANCE.md mandatory four-category set).
          # queue/copilot enables the Copilot Dispatcher to delegate chapter-update work.
          labels-to-add: 'area:docs,priority:medium,type:documentation,status:open,queue/copilot'
          status-group: 'area:docs,priority:medium,type:documentation,status:open,status:in_progress,status:blocked,queue/copilot,copilot/delegated'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

  no-drift-close-issue:
    name: Close Tracker Issue (no drift)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: drift-scan
    if: >
      needs.drift-scan.outputs.total_issues == '0' &&
      inputs.dry_run != true
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Resolve or close tracker issue
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: 'Update compendium chapters to v2.4.0-alpha'
          issue-marker: '<!-- compendium-drift:v2.4.0-alpha -->'
          issue-body: |
            <!-- compendium-drift:v2.4.0-alpha -->

            ### Context

            The scheduled compendium sync scan (`maintenance-compendium-sync`) found
            **no stale or missing chapters** at priority `${{ inputs.priority || 'medium' }}` or above.

            ### Goal

            No action required at this time. The compendium is aligned with v2.4.0-alpha sources.

            ### Acceptance Criteria

            - [x] All chapters at priority `${{ inputs.priority || 'medium' }}` and above are current.

            ### References

            - Scan run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Branch: `${{ github.ref_name }}`
          labels-to-add: 'area:docs,priority:low,type:documentation,status:open'
          status-group: 'area:docs,priority:low,priority:medium,type:documentation,status:open,status:in_progress,status:blocked,queue/copilot,copilot/delegated'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}
