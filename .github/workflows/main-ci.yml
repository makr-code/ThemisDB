# Main Branch CI Workflow
# Triggers on push to main (releases and hotfixes)
# Runs verification suite and publishes release artifacts

name: Main Branch CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  BUILD_TYPE: Release
  USE_SYSTEM_LIBS: ON

jobs:
  # Verify the merge
  verify-merge:
    name: Verify Merge
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.check.outputs.is_release }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge source
        id: check
        run: |
          # Check if this is a release or hotfix merge
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          if [[ "$COMMIT_MSG" =~ (release|hotfix|Release|Hotfix) ]] || [[ "${{ github.ref }}" =~ refs/tags/v ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "✅ Release or hotfix merge detected"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "⚠️  Regular commit to main (not a release)"
          fi

      - name: Get version
        id: version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Version: $VERSION"
          else
            echo "version=unknown" >> $GITHUB_OUTPUT
            echo "::warning::VERSION file not found"
          fi

      - name: Validate main branch state
        run: |
          echo "### Main Branch Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${GITHUB_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Is Release**: ${{ steps.check.outputs.is_release }}" >> $GITHUB_STEP_SUMMARY

  # Verification build and test
  verification-build:
    name: Verification Build & Test
    runs-on: ubuntu-latest
    needs: verify-merge
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            librocksdb-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libboost-dev \
            libboost-system-dev \
            libyaml-cpp-dev \
            libzstd-dev \
            libgtest-dev \
            libbenchmark-dev

      - name: Setup vcpkg
        run: |
          VCPKG_DIR="${VCPKG_ROOT:-vcpkg}"
          
          if [ -f "$VCPKG_DIR/bootstrap-vcpkg.sh" ]; then
            echo "Using existing vcpkg at $VCPKG_DIR"
          else
            echo "Cloning vcpkg to $VCPKG_DIR"
            rm -rf "$VCPKG_DIR"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          fi
          
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          
          # Enable binary caching for faster builds (93% speedup)
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES" >> $GITHUB_ENV
          "$VCPKG_DIR/vcpkg" install --clean-after-build

      - name: Configure CMake
        run: |
          BUILD_DIR="${BUILD_DIR:-build}"
          VCPKG_DIR="${VCPKG_ROOT:-${GITHUB_WORKSPACE}/vcpkg}"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_ENABLE_TRACING=OFF

      - name: Build
        run: |
          BUILD_DIR="${BUILD_DIR:-build}"
          cmake --build "$BUILD_DIR" --config ${{ env.BUILD_TYPE }} -j $(nproc)

      - name: Run Verification Tests
        run: |
          BUILD_DIR="${BUILD_DIR:-build}"
          cd "$BUILD_DIR"
          ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --timeout 600 -j $(nproc)

      - name: Create production artifacts
        run: |
          BUILD_DIR="${BUILD_DIR:-build}"
          VERSION="${{ needs.verify-merge.outputs.version }}"
          
          mkdir -p production-artifacts
          
          # Copy binaries
          if [ -f "$BUILD_DIR/themis" ]; then
            cp "$BUILD_DIR/themis" production-artifacts/
          fi
          
          # Copy essential files
          cp VERSION CHANGELOG.md LICENSE README.md production-artifacts/ 2>/dev/null || true
          
          # Create release tarball
          tar -czf "themis-${VERSION}-production-linux-x64.tar.gz" -C production-artifacts .
          
          echo "✅ Production artifacts created"
          ls -lh themis-*.tar.gz

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-artifacts-${{ needs.verify-merge.outputs.version }}
          path: |
            themis-*-production-*.tar.gz
            production-artifacts/*
          retention-days: 90

  # Create GitHub release for tags
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-merge, verification-build]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-artifacts-${{ needs.verify-merge.outputs.version }}
          path: artifacts/

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION="${{ needs.verify-merge.outputs.version }}"
          RELEASE_NOTES_FILE="RELEASE_NOTES_v${VERSION}.md"
          
          if [ -f "$RELEASE_NOTES_FILE" ]; then
            echo "notes_file=$RELEASE_NOTES_FILE" >> $GITHUB_OUTPUT
            echo "✅ Found release notes: $RELEASE_NOTES_FILE"
          else
            echo "notes_file=" >> $GITHUB_OUTPUT
            echo "::warning::Release notes not found: $RELEASE_NOTES_FILE"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.verify-merge.outputs.version }}"
          TAG_NAME="${{ github.ref_name }}"
          
          # Prepare release notes
          if [ -f "${{ steps.release_notes.outputs.notes_file }}" ]; then
            RELEASE_BODY=$(cat "${{ steps.release_notes.outputs.notes_file }}")
          else
            RELEASE_BODY="Release version ${VERSION}. See CHANGELOG.md for details."
          fi
          
          # Create release
          gh release create "$TAG_NAME" \
            --title "ThemisDB ${VERSION}" \
            --notes "$RELEASE_BODY" \
            artifacts/themis-*-production-*.tar.gz \
            || echo "::warning::Release may already exist"

  # Publish Docker image (if applicable)
  publish-docker:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [verify-merge, verification-build]
    if: needs.verify-merge.outputs.is_release == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # Deploy documentation (if applicable)
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [verify-merge, verification-build]
    if: needs.verify-merge.outputs.is_release == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          if [ -f requirements-docs.txt ]; then
            pip install -r requirements-docs.txt
          else
            echo "⚠️  No requirements-docs.txt found"
          fi
        continue-on-error: true

      - name: Build documentation
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build
            echo "✅ Documentation built"
          else
            echo "⚠️  No mkdocs.yml found"
          fi
        continue-on-error: true

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
        continue-on-error: true

  # Final summary
  production-summary:
    name: Production Deployment Summary
    runs-on: ubuntu-latest
    needs: [verify-merge, verification-build, publish-docker, deploy-docs]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 Main Branch CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.verify-merge.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${GITHUB_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Task | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Verification | ${{ needs.verify-merge.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.verification-build.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Image | ${{ needs.publish-docker.result == 'success' && '✅' || needs.publish-docker.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.deploy-docs.result == 'success' && '✅' || needs.deploy-docs.result == 'skipped' && '⏭️' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.verify-merge.result }}" != "success" ] || [ "${{ needs.verification-build.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Production deployment failed**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Production deployment completed successfully**" >> $GITHUB_STEP_SUMMARY
