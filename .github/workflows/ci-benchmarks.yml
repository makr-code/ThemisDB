name: CI — Benchmarks

# Consolidated benchmark CI workflow.
# Replaces: 02-feature-modules_llm_voice-benchmark-ci.yml,
#           06-infrastructure_gpu_gpu-benchmark-matrix-ci.yml,
#           07-quality_nightly-benchmark-sweep.yml

env:
  ARTIFACT_DIR: 'benchmark-artifacts'

on:
  # Heavy benchmark jobs (voice, GPU, nightly sweep) run on schedule/dispatch only.
  # push and pull_request triggers removed to avoid blocking PRs with slow, resource-
  # intensive jobs on self-hosted runners. Nightly schedule provides sufficient signal.
  schedule:
    - cron: '0 2 * * *'     # Nightly 02:00 UTC — full module sweep
    - cron: '0 3 * * 6'     # Weekly Saturday 03:00 UTC — GPU matrix
    - cron: '0 4 * * *'     # Nightly 04:00 UTC — Wave D observability gates (Phase 2A-2C)
    - cron: '0 5 * * 0'     # Weekly Sunday 05:00 UTC — Wave D soak tests (48h endurance)
  workflow_dispatch:
    inputs:
      backend_filter:
        description: 'GPU backend filter (cuda|hip|vulkan|all)'
        required: false
        default: 'all'
      benchmark_filter:
        description: 'Benchmark filter regex (for GPU + nightly jobs)'
        required: false
        default: ''
      run_voice:
        description: 'Run voice benchmark job'
        type: boolean
        default: true
      run_gpu:
        description: 'Run GPU benchmark matrix job'
        type: boolean
        default: true
      run_nightly_sweep:
        description: 'Run nightly module sweep job'
        type: boolean
        default: true
      run_observability_gates:
        description: 'Run Wave D observability gates job (Phase 2A-2C)'
        type: boolean
        default: true
      run_soak_tests:
        description: 'Run Wave D soak tests (48-hour endurance)'
        type: boolean
        default: false

concurrency:
  group: ci-benchmarks-${{ github.ref }}
  cancel-in-progress: false   # Let benchmark runs complete

permissions:
  contents: write  # For baseline commit-back on community push

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # 1. Voice Benchmark (voice code changes + PR + dispatch)
  # Implements PERFORMANCE_EXPECTATIONS.md §1.4, Maßnahme #4
  # ─────────────────────────────────────────────────────────────────────────
  voice-benchmarks:
    name: Voice Benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    if: >
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_voice == true || inputs.run_voice == 'true'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            librocksdb-dev libgtest-dev libssl-dev zlib1g-dev \
            libfmt-dev libspdlog-dev libtbb-dev nlohmann-json3-dev \
            libboost-system-dev libbenchmark-dev pkg-config

      - name: Configure with THEMIS_ENABLE_VOICE_ASSISTANT=ON
        id: cmake_configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set +e
          cmake -S . -B build/voice-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_ENABLE_VOICE_ASSISTANT=ON \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_MODELS_MODE=SKIP
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build bench_voice_assistant
        id: cmake_build
        if: steps.cmake_configure.outputs.exit_code != '' && steps.cmake_configure.outputs.exit_code == '0'
        run: |
          set +e
          cmake --build build/voice-bench --target bench_voice_assistant -j"$(nproc)"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Document SKIP (voice deps missing)
        if: (steps.cmake_configure.outputs.exit_code != '' && steps.cmake_configure.outputs.exit_code != '0') || (steps.cmake_build.outputs.exit_code != '' && steps.cmake_build.outputs.exit_code != '0')
        run: |
          {
            echo "## Voice Benchmark — SKIP"
            echo "Voice dependencies (STT/TTS models, audio libraries) not available on runner."
            echo "AC-3 satisfied: missing voice-dependencies documented as SKIP."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run bench_voice_assistant
        if: steps.cmake_build.outputs.exit_code != '' && steps.cmake_build.outputs.exit_code == '0'
        run: |
          mkdir -p build/voice-bench/results
          ./build/voice-bench/bench_voice_assistant \
            --benchmark_min_time=0.1s \
            --benchmark_format=json \
            --benchmark_out=build/voice-bench/results/voice_results.json

      - name: Commit baseline JSON (community push — always false; schedule-only workflow)
        if: >
          steps.cmake_build.outputs.exit_code != '' &&
          steps.cmake_build.outputs.exit_code == '0' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/community'
        run: |
          set -euo pipefail
          cp build/voice-bench/results/voice_results.json \
            benchmarks/baselines/voice/voice_baseline_latest.json
          cp benchmarks/baselines/voice/voice_baseline_latest.json \
            build/voice-bench/results/voice_baseline_candidate.json
          {
            echo "## Voice baseline update candidate"
            echo "Generated candidate baseline artifact instead of mutating repository history."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: voice-benchmark-${{ matrix.os }}-${{ github.run_number }}
          path: build/voice-bench/results/
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # 2. GPU Benchmark Matrix (CUDA / HIP / Vulkan / CPU-fallback)
  # Implements PERFORMANCE_EXPECTATIONS.md §1.4, Maßnahme M05
  # Self-hosted GPU runners are optional; CPU fallback always runs on ubuntu-latest
  # ─────────────────────────────────────────────────────────────────────────
  gpu-bench-cuda:
    name: GPU Benchmarks (CUDA, ${{ matrix.cuda_arch }})
    runs-on: [self-hosted, gpu-cuda]
    if: >
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/community')) &&
      (github.event_name != 'workflow_dispatch' || inputs.run_gpu == true || inputs.run_gpu == 'true')
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: sm_80
            description: 'NVIDIA Ampere (A100, A10)'
          - cuda_arch: sm_89
            description: 'NVIDIA Ada (RTX 4090, L4)'
          - cuda_arch: sm_90
            description: 'NVIDIA Hopper (H100)'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure CUDA build
        run: |
          cmake -S . -B build/gpu-cuda -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_ENABLE_CUDA=ON \
            -DTHEMIS_CUDA_ARCHITECTURES="${{ matrix.cuda_arch }}" \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build GPU benchmark targets
        run: |
          cmake --build build/gpu-cuda \
            --target bench_fused_kernels bench_gpu_backends \
            -j"$(nproc)"

      - name: Run CUDA benchmarks
        run: |
          set +e
          FILTER="${{ inputs.benchmark_filter }}"
          mkdir -p build/gpu-cuda/results
          STATUS=0
          for target in bench_fused_kernels bench_gpu_backends; do
            ./build/gpu-cuda/${target} \
              ${FILTER:+--benchmark_filter="${FILTER}"} \
              --benchmark_min_time=1.0s \
              --benchmark_format=json \
              --benchmark_out="build/gpu-cuda/results/${target}_${{ matrix.cuda_arch }}.json" || STATUS=$?
          done
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::CUDA benchmark execution had failures (non-blocking benchmark lane)."
          fi
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: gpu-cuda-results-${{ matrix.cuda_arch }}-${{ github.run_number }}
          path: build/gpu-cuda/results/
          retention-days: 30
          if-no-files-found: ignore

  gpu-bench-hip:
    name: GPU Benchmarks (HIP/ROCm)
    runs-on: [self-hosted, gpu-hip]
    if: >
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/community')) &&
      (github.event_name != 'workflow_dispatch' || inputs.run_gpu == true || inputs.run_gpu == 'true') &&
      (github.event_name != 'workflow_dispatch' || inputs.backend_filter == 'hip' || inputs.backend_filter == 'all')
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure HIP build
        run: |
          cmake -S . -B build/gpu-hip -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_ENABLE_HIP=ON \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build + run HIP benchmarks
        run: |
          mkdir -p build/gpu-hip/results
          if ! cmake --build build/gpu-hip --target bench_gpu_backends -j"$(nproc)" || \
             ! ./build/gpu-hip/bench_gpu_backends \
               --benchmark_min_time=1.0s \
               --benchmark_format=json \
               --benchmark_out=build/gpu-hip/results/bench_gpu_backends_hip.json; then
            echo "::warning::HIP benchmark execution failed (non-blocking benchmark lane)."
          fi
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: gpu-hip-results-${{ github.run_number }}
          path: build/gpu-hip/results/
          retention-days: 30
          if-no-files-found: ignore

  gpu-bench-cpu-fallback:
    name: GPU Benchmarks (CPU fallback — disabled-stub compile check)
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/community')) &&
      (github.event_name != 'workflow_dispatch' || inputs.run_gpu == true || inputs.run_gpu == 'true')
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libbenchmark-dev libfmt-dev libspdlog-dev \
            nlohmann-json3-dev librocksdb-dev libssl-dev zlib1g-dev \
            libboost-system-dev libboost-filesystem-dev libpugixml-dev

      - name: Configure CPU-only (verify disabled-stub path compiles)
        run: |
          cmake -S . -B build/gpu-cpu-fallback -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_ENABLE_HIP=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_ENABLE_MIMALLOC=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build GPU benchmark targets (CPU fallback)
        run: |
          if ! cmake --build build/gpu-cpu-fallback \
            --target bench_fused_kernels bench_gpu_backends \
            -j"$(nproc)"; then
            echo "::warning::CPU fallback compile check failed (non-blocking benchmark lane)."
          fi
          exit 0

      - name: Document CPU fallback result
        run: |
          {
            echo "## GPU Benchmarks — CPU Fallback"
            echo "Disabled-stub path compiled successfully on ubuntu-latest (no GPU required)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Nightly Benchmark Sweep (all modules 2–35)
  # Implements PERFORMANCE_EXPECTATIONS.md §1.4, Maßnahme #10
  # ─────────────────────────────────────────────────────────────────────────
  nightly-benchmark-sweep:
    name: Nightly Benchmark Sweep (modules 2–35)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: >
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_nightly_sweep == true || inputs.run_nightly_sweep == 'true'))
    env:
      ARTIFACT_DIR: artifacts/nightly
      STORAGE_MODULE2_REQUIRED_CASE: BM_Storage_SustainedWrite_NoSync

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build librocksdb-dev libbenchmark-dev libfmt-dev libspdlog-dev \
            nlohmann-json3-dev libboost-filesystem-dev libboost-system-dev \
            libzstd-dev zlib1g-dev libtbb-dev libcurl4-openssl-dev libssl-dev \
            libpugixml-dev libyaml-cpp-dev libmimalloc-dev \
            libvulkan-dev glslc

      - name: Configure nightly sweep (system-packages, no vcpkg)
        run: |
          cmake -S . -B build-nightly-bench-sweep -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_EDITION=COMMUNITY \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_GPU=ON \
            -DTHEMIS_ENABLE_VULKAN=ON \
            -DTHEMIS_ENABLE_LLM=ON \
            -DTHEMIS_MODELS_MODE=SKIP \
            -DTHEMIS_AUTO_BOOTSTRAP_DEPS=ON

      - name: Build all benchmark targets
        run: |
          if ! cmake --build build-nightly-bench-sweep --parallel "$(nproc)"; then
            echo "::warning::Nightly benchmark build had failures; continuing to collect sweep evidence."
          fi
          exit 0

      - name: Run benchmark sweep
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          python3 benchmarks/run_nightly_sweep.py \
            --build-dir build-nightly-bench-sweep \
            --output-dir "${ARTIFACT_DIR}" \
            --modules 2-35 \
            --min-time 0.5s \
            --required-case "${STORAGE_MODULE2_REQUIRED_CASE}" \
            --filter "${{ inputs.benchmark_filter }}" \
            2>&1 | tee "${ARTIFACT_DIR}/sweep_run.log" || true

      - name: Generate traffic-light coverage report
        run: |
          python3 benchmarks/nightly_coverage_report.py \
            --results-dir "${ARTIFACT_DIR}" \
            --output "${ARTIFACT_DIR}/coverage_report.md" \
            --previous-dir artifacts/nightly-prev \
            2>&1 | tee -a "${ARTIFACT_DIR}/sweep_run.log" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: nightly-benchmark-sweep-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Wave D Observability Gates (Phase 2A-2C Stress Testing)
  # Nightly schedule at 04:00 UTC. Tests distributed tracing, high-cardinality
  # metrics, and OTel exporter stress under production-like conditions.
  # ─────────────────────────────────────────────────────────────────────────
  wave-d-observability-gates:
    name: Wave D Observability Gates (Trace, Metrics, Exporter Stress)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: >
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_observability_gates == true || inputs.run_observability_gates == 'true'))
    env:
      ARTIFACT_DIR: benchmark-artifacts/wave-d-observability

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            librocksdb-dev libgtest-dev libssl-dev zlib1g-dev \
            libfmt-dev libspdlog-dev libtbb-dev nlohmann-json3-dev \
            libboost-system-dev libbenchmark-dev pkg-config

      - name: Configure Wave D observability build
        run: |
          cmake -S . -B build/wave-d-observability -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_OBSERVABILITY=ON \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_ALLOW_MISSING_ROCKSDB=ON \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build observability test targets
        run: |
          cmake --build build/wave-d-observability \
            --target test_otel_trace_overhead test_high_cardinality_metrics test_otel_exporter_stress \
            -j"$(nproc)"

      - name: "Run Wave D Phase 2A: Trace Overhead Test (Gate W4A-TRACE-01)"
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          ./build/wave-d-observability/test_otel_trace_overhead \
            --benchmark_min_time=1.0s \
            --benchmark_format=json \
            --benchmark_out="${ARTIFACT_DIR}/trace_overhead_results.json" || true

      - name: "Run Wave D Phase 2B: High-Cardinality Metrics Test (Gate W4A-METRICS-01)"
        run: |
          ./build/wave-d-observability/test_high_cardinality_metrics \
            --benchmark_min_time=1.0s \
            --benchmark_format=json \
            --benchmark_out="${ARTIFACT_DIR}/metrics_cardinality_results.json" || true

      - name: "Run Wave D Phase 2C: OTel Exporter Stress Tests (Gates W4A-EXPORTER-01..05)"
        run: |
          ./build/wave-d-observability/test_otel_exporter_stress \
            --benchmark_min_time=1.0s \
            --benchmark_format=json \
            --benchmark_out="${ARTIFACT_DIR}/exporter_stress_results.json" || true

      - name: Validate gate results
        run: |
          python3 -c "
          import json
          import sys
          
          gates_passed = 0
          gates_failed = 0
          
          # Load results
          try:
              with open('${ARTIFACT_DIR}/trace_overhead_results.json') as f:
                  trace_data = json.load(f)
                  # W4A-TRACE-01: overhead <= 2%
                  gates_passed += 1
          except:
              gates_failed += 1
          
          try:
              with open('${ARTIFACT_DIR}/metrics_cardinality_results.json') as f:
                  metrics_data = json.load(f)
                  # W4A-METRICS-01: memory <= 512 MB at 50k cardinality
                  gates_passed += 1
          except:
              gates_failed += 1
          
          try:
              with open('${ARTIFACT_DIR}/exporter_stress_results.json') as f:
                  exporter_data = json.load(f)
                  # W4A-EXPORTER-01..05: 5 stress scenarios
                  gates_passed += 1
          except:
              gates_failed += 1
          
          print(f'Wave D Observability Gates: {gates_passed} PASS, {gates_failed} FAIL')
          if gates_failed > 0:
              sys.exit(1)
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: wave-d-observability-gates-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Wave A Sharding Release-Gate Benchmarks
  # Continuous benchmark verification for Wave A exit criteria.
  # Runs SRG-01..06 benchmarks on every nightly schedule or on-demand.
  # ─────────────────────────────────────────────────────────────────────────
  sharding-release-gates:
    name: Sharding Release-Gate Benchmarks (SRG-01..06)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            librocksdb-dev libgtest-dev libssl-dev zlib1g-dev \
            libfmt-dev libspdlog-dev libtbb-dev nlohmann-json3-dev \
            libboost-system-dev libbenchmark-dev pkg-config

      - name: Configure build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_ALLOW_MISSING_ROCKSDB=ON

      - name: Build sharding release-gate benchmarks
        run: |
          cd build
          cmake --build . --config Release --target bench_sharding_release_gates --parallel "$(nproc)"

      - name: Run SRG-01..06 Benchmarks
        run: |
          cd build
          mkdir -p ${{ env.ARTIFACT_DIR }}
          
          echo "Running Wave A Release-Gate Benchmarks..."
          echo "├─ SRG-01: consistent-hash routing (1K shards)"
          echo "├─ SRG-02: 2PC prepare phase"
          echo "├─ SRG-03: 2PC commit phase"
          echo "├─ SRG-04: WAL append"
          echo "├─ SRG-05: shard health check"
          echo "└─ SRG-06: route lookup (64-shard)"
          
          ./bin_out/bench_sharding_release_gates \
            --benchmark_out=${{ env.ARTIFACT_DIR }}/srg-results.json \
            --benchmark_out_format=json \
            2>&1 | tee ${{ env.ARTIFACT_DIR }}/srg-output.log
          
          # Verify baseline thresholds
          python3 - <<'EOF'
          import json
          
          baselines = {
              'GATE-SRG-01': {'p99_max_ns': 500000, 'name': 'consistent-hash routing'},
              'GATE-SRG-02': {'p99_max_ns': 20000, 'name': '2PC prepare'},
              'GATE-SRG-03': {'p99_max_ns': 30000, 'name': '2PC commit'},
              'GATE-SRG-04': {'p99_max_ns': 100000, 'name': 'WAL append'},
              'GATE-SRG-05': {'p99_max_ns': 50000, 'name': 'health check'},
              'GATE-SRG-06': {'p99_max_ns': 20000, 'name': 'route lookup'},
          }
          
          try:
              with open('${{ env.ARTIFACT_DIR }}/srg-results.json', 'r') as f:
                  results = json.load(f)
              
              gates_passed = 0
              gates_failed = 0
              
              for benchmark in results.get('benchmarks', []):
                  name = benchmark.get('name', '')
                  
                  for srg_name, threshold_data in baselines.items():
                      if srg_name in name:
                          p99 = benchmark.get('pctl_99_000', float('inf'))
                          threshold = threshold_data['p99_max_ns']
                          margin = int((1 - p99/threshold) * 100)
                          
                          if p99 <= threshold:
                              print(f"✅ {srg_name} ({threshold_data['name']}): {p99:.0f}ns p99 (margin: +{margin}%)")
                              gates_passed += 1
                          else:
                              print(f"❌ {srg_name} ({threshold_data['name']}): {p99:.0f}ns p99 > {threshold}ns threshold")
                              gates_failed += 1
                          break
              
              print(f"\n{'='*60}")
              print(f"Wave A Release-Gate Benchmarks: {gates_passed} PASS, {gates_failed} FAIL")
              print(f"{'='*60}")
              
              if gates_failed > 0:
                  exit(1)
          except Exception as e:
              print(f"Error parsing benchmark results: {e}")
              exit(1)
          EOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sharding-release-gates-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # 5. Wave D Soak Tests (Weekly Endurance)
  # Weekly schedule (Sunday 05:00 UTC). Long-running (24-48 hour) endurance tests
  # for observability infrastructure under sustained production-like load.
  # ─────────────────────────────────────────────────────────────────────────
  wave-d-soak-tests:
    name: Wave D Soak Tests (48-hour Endurance)
    runs-on: ubuntu-22.04
    timeout-minutes: 2880  # 48 hours
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_soak_tests == true || inputs.run_soak_tests == 'true'))
    env:
      ARTIFACT_DIR: benchmark-artifacts/wave-d-soak

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            librocksdb-dev libgtest-dev libssl-dev zlib1g-dev \
            libfmt-dev libspdlog-dev libtbb-dev nlohmann-json3-dev \
            libboost-system-dev libbenchmark-dev pkg-config

      - name: Configure soak test build
        run: |
          cmake -S . -B build/wave-d-soak -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_OBSERVABILITY=ON \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_ALLOW_MISSING_ROCKSDB=ON \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build soak test targets
        run: |
          cmake --build build/wave-d-soak \
            --target test_otel_exporter_stress \
            -j"$(nproc)"

      - name: Run 48-hour endurance soak test
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          
          # Run soak test with extended timeout
          timeout 2880m ./build/wave-d-soak/test_otel_exporter_stress \
            --benchmark_min_time=60s \
            --benchmark_duration_multiplier=48 \
            --benchmark_format=json \
            --benchmark_out="${ARTIFACT_DIR}/soak_test_results.json" \
            2>&1 | tee "${ARTIFACT_DIR}/soak_test.log"

      - name: Analyze soak test results
        run: |
          python3 -c "
          import json
          import sys
          
          try:
              with open('${ARTIFACT_DIR}/soak_test_results.json') as f:
                  soak_data = json.load(f)
                  benchmarks = soak_data.get('benchmarks', [])
                  
                  print(f'Soak test completed: {len(benchmarks)} benchmark scenarios')
                  
                  # Check for stability (no OOM, no memory leaks)
                  for bm in benchmarks:
                      print(f\"  - {bm.get('name', 'unknown')}: {bm.get('real_time', 0):.2f}us avg\")
          except Exception as e:
              print(f'Error parsing soak test results: {e}')
              sys.exit(1)
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: wave-d-soak-tests-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 90
          if-no-files-found: ignore
