name: Doxygen Warning Gate & Mermaid Mapping

on:
  schedule:
    # Weekly on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doxygen-mermaid-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Run Doxygen warning gate + XML export
        run: |
          WARN_LOG="$(awk -F= '/^WARN_LOGFILE[[:space:]]*=[[:space:]]*/{print $2}' Doxyfile | xargs)"
          if [ -z "${WARN_LOG}" ]; then
            echo "WARN_LOGFILE is not configured in Doxyfile"
            exit 1
          fi
          mkdir -p "$(dirname "${WARN_LOG}")"
          doxygen Doxyfile
          if [ -f "${WARN_LOG}" ]; then
            echo "Doxygen warnings logged: $(wc -l < "${WARN_LOG}")"
            if grep -Ein "^[^:]+:[0-9]+:[[:space:]]*error:" "${WARN_LOG}"; then
              echo "Doxygen reported parse/documentation errors:"
              exit 1
            fi
          else
            echo "Expected warning log file was not created: ${WARN_LOG}"
            exit 1
          fi

      - name: Generate Mermaid class/function mapping
        run: |
          python3 scripts/generate_doxygen_mermaid_map.py

      - name: Upload Doxygen Mermaid artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-mermaid-mapping
          path: |
            build/doxygen/doxygen-warnings.log
            build/doxygen/themisdb_doxygen_mermaid_overview.md
            build/doxygen/themisdb_class_map.mmd
            build/doxygen/themisdb_function_map.mmd
          retention-days: 14
