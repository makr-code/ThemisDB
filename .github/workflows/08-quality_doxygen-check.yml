name: Doxygen Documentation Check

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Doxyfile'
      - 'include/**/*.h'
      - 'include/**/*.hpp'
      - 'include/**/*.hh'
      - 'include/**/*.hxx'
      - 'include/**/*.ipp'
      - 'include/**/*.tpp'
      - 'src/**/*.h'
      - 'src/**/*.hpp'
      - 'src/**/*.hh'
      - 'src/**/*.hxx'
      - 'src/**/*.ipp'
      - 'src/**/*.tpp'
      - '.github/workflows/08-quality_doxygen-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doxygen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Run Doxygen warning gate
        run: |
          doxygen Doxyfile 2>&1 | tee doxygen.log
          if [ -f doxygen-warnings.log ]; then
            echo "Doxygen warnings logged: $(wc -l < doxygen-warnings.log)"
            if grep -Eiq ": error:" doxygen-warnings.log; then
              echo "Doxygen reported parse/documentation errors:"
              grep -Ein ": error:" doxygen-warnings.log
              exit 1
            fi
          fi
