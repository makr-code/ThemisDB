name: LoRA Adapter Hot-Loading CI

# Validates LoRA adapter hot-loading at inference time
# (v1.8.0, roadmap:182:llm:v1.8.0:lora-adapter-hot-loading-at-inference-time).
# Covers:
#   AC-1  AdapterRegistry::hotLoad() registers adapter under shared_mutex write lock
#   AC-2  Read operations on AdapterRegistry use shared_lock (concurrent reads safe)
#   AC-3  AdapterLoadBalancer::beginHotLoad/endHotLoad/resolveAdapter fallback routing
#   AC-4  POST /api/v1/llm/lora/adapters/{id}/load returns 202 Accepted + job_id
#   AC-5  GET /api/v1/llm/lora/adapters/{id}/load-status returns job progress
#   AC-6  InferenceEngineEnhanced::loadLoRAAdapter hot-loads without engine restart
#   AC-7  Zero inference requests dropped during hot-load (all served via fallback)
#
# No GPU hardware or external LLM API required — uses the built-in simulated stub.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/llm/adapter_registry.h'
      - 'src/llm/adapter_registry.cpp'
      - 'include/llm/adapter_load_balancer.h'
      - 'src/llm/adapter_load_balancer.cpp'
      - 'include/server/lora_api_handler.h'
      - 'src/server/lora_api_handler.cpp'
      - 'include/llm/inference_engine_enhanced.h'
      - 'src/llm/inference_engine_enhanced.cpp'
      - 'tests/llm/test_lora_hot_loading.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_lora-adapter-hot-loading-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/llm/adapter_registry.h'
      - 'src/llm/adapter_registry.cpp'
      - 'include/llm/adapter_load_balancer.h'
      - 'src/llm/adapter_load_balancer.cpp'
      - 'include/server/lora_api_handler.h'
      - 'src/server/lora_api_handler.cpp'
      - 'include/llm/inference_engine_enhanced.h'
      - 'src/llm/inference_engine_enhanced.cpp'
      - 'tests/llm/test_lora_hot_loading.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_lora-adapter-hot-loading-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the LlmLoraHotLoadingFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-1  hotLoad() registers adapter metadata; concurrent readers unblocked
  #   AC-2  AdapterLoadBalancer routes to fallback while hot-load is in progress
  #   AC-3  loadLoRAAdapter() / unloadLoRAAdapter() work without engine restart
  #   AC-4  Per-request lora_adapter_id is forwarded to the inference plugin
  #   AC-5  Zero requests dropped: HotLoad_DuringActiveInference_ThreadSafe
  # ---------------------------------------------------------------------------
  lora-hot-loading-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: LoRA hot-loading tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev
            libboost-all-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_llm_lora_hot_loading

      - name: Run LlmLoraHotLoadingFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R LlmLoraHotLoadingFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee lora_hot_loading_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_llm_lora_hot_loading \
            --gtest_output="xml:lora_hot_loading_gtest.xml" \
            2>&1 | tee lora_hot_loading_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lora-hot-loading-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/lora_hot_loading_ctest.txt
            build/lora_hot_loading_gtest.xml
            build/lora_hot_loading_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔥 LoRA Adapter Hot-Loading CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates LoRA adapter hot-loading (AC-1..7): shared_mutex R/W locking," >> "$GITHUB_STEP_SUMMARY"
          echo "AdapterLoadBalancer fallback routing, 202 Accepted admin API, per-request" >> "$GITHUB_STEP_SUMMARY"
          echo "adapter_id forwarding, and zero dropped requests during concurrent hot-load." >> "$GITHUB_STEP_SUMMARY"
