name: Load Balancing with Raft Coordination CI

# Triggered on every push / PR that touches the Raft load balancer sources or tests.
# Targets v1.8.0 (roadmap:78:network:v1.8.0:load-balancing-with-raft-coordination).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/network/raft_load_balancer.h'
      - 'src/network/raft_load_balancer.cpp'
      - 'tests/test_raft_load_balancer.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/load-balancing-raft-coordination-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/network/raft_load_balancer.h'
      - 'src/network/raft_load_balancer.cpp'
      - 'tests/test_raft_load_balancer.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/load-balancing-raft-coordination-ci.yml'
  workflow_dispatch:

concurrency:
  group: load-balancing-raft-coordination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run RaftLoadBalancerFocusedTests.
  #
  # Acceptance criteria validated:
  #   AC1  – Raft consensus: single-node leader election, term increment
  #   AC2  – Automatic failover after unhealthy_threshold failures
  #   AC3  – Health-based routing excludes unhealthy backends
  #   AC4  – Dynamic weight adjustment and rebalance events
  #   AC5  – Cross-datacenter routing with local-DC preference
  #   AC6  – Round Robin strategy
  #   AC7  – Least Connections strategy
  #   AC8  – Weighted Round Robin strategy
  #   AC9  – Health-Based strategy
  #   AC10 – Consistent Hashing strategy
  #   AC11 – Health monitoring by the Raft leader
  #   AC12 – Automatic removal of failed backends
  #   AC13 – Automatic re-addition when backend recovers
  #   AC14 – Leader election (Raft loop elects leader autonomously)
  # ---------------------------------------------------------------------------
  raft-load-balancer-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Raft Load Balancer tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build focused test target
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_raft_load_balancer_focused

      - name: Run RaftLoadBalancerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R RaftLoadBalancerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee raft_load_balancer_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raft-load-balancer-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/raft_load_balancer_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚖️ Raft Load Balancer – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "RaftLoadBalancer: Raft leader election, health-based failover, automatic recovery, dynamic weight rebalancing, round-robin/least-connections/weighted/health-based/consistent-hash routing, cross-datacenter affinity." >> "$GITHUB_STEP_SUMMARY"
