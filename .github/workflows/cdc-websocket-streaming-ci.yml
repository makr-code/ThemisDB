name: CDC WebSocket Streaming CI

# Triggered on every push / PR that touches the WebSocket CDC transport
# sources or its test file. Targets v1.7.0
# (roadmap:55:cdc:v1.7.0:websocket-change-streaming-transport).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/cdc/cdc_ws_handler.h'
      - 'include/cdc/ws_transport.h'
      - 'src/cdc/cdc_ws_handler.cpp'
      - 'src/cdc/ws_transport.cpp'
      - 'src/server/websocket_session.cpp'
      - 'include/server/websocket_session.h'
      - 'tests/test_cdc_ws_handler.cpp'
      - 'tests/test_websocket_cdc.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cdc-websocket-streaming-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/cdc/cdc_ws_handler.h'
      - 'include/cdc/ws_transport.h'
      - 'src/cdc/cdc_ws_handler.cpp'
      - 'src/cdc/ws_transport.cpp'
      - 'src/server/websocket_session.cpp'
      - 'include/server/websocket_session.h'
      - 'tests/test_cdc_ws_handler.cpp'
      - 'tests/test_websocket_cdc.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cdc-websocket-streaming-ci.yml'
  workflow_dispatch:

concurrency:
  group: cdc-websocket-streaming-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CdcWsHandler focused test suite.
  # Tests cover all acceptance criteria for v1.7.0:
  #   AC-1  subscribe frame → subscribed ack (named subscription protocol)
  #   AC-2  unsubscribe frame → unsubscribed ack
  #   AC-3  ack frame advances last-acked sequence (at-least-once delivery)
  #   AC-4  collection field maps to key_prefix; explicit key_prefix overrides
  #   AC-5  event_types array parsed (PUT, DELETE, TRANSACTION_COMMIT, …)
  #   AC-6  from_sequence resume supported in subscribe frame
  #   AC-7  cdc_ws_overflow_total increments when pending-ack queue is full
  #   AC-8  Back-pressure: delivery paused when pending >= max_pending_ack
  #   AC-9  Multiple named subscriptions coexist on one handler instance
  #   AC-10 Duplicate subscribe id overwrites existing subscription
  # ---------------------------------------------------------------------------
  cdc-websocket-streaming-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CDC WebSocket Streaming (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run CdcWsHandlerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CdcWsHandlerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee cdc_ws_handler_results.txt

      - name: Run WebSocketCdcFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R WebSocketCdcFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee websocket_cdc_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run CdcWsHandlerTest suite via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="CdcWsHandlerTest*:CdcWsOverflowTest*:WsTransportTest*:WebSocketCDCTest*" \
            --gtest_output="xml:cdc_ws_handler_gtest.xml" \
            2>&1 | tee cdc_ws_handler_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-websocket-streaming-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cdc_ws_handler_results.txt
            build/websocket_cdc_results.txt
            build/cdc_ws_handler_gtest.xml
            build/cdc_ws_handler_gtest_output.txt
          retention-days: 30
