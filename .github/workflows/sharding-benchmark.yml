name: CHIMERA Suite - Sharding Benchmarks (Weekly)

# Part of CHIMERA Suite: Comprehensive Hybrid Inferencing & Multi-model Evaluation Resource Assessment
# "Benchmark the Unbenchmarkable"

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC
  workflow_dispatch:

jobs:
  sharding-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build (Release)
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci --config Release --parallel 8

      - name: Run CHIMERA Suite - Sharding Benchmarks
        run: |
          # CHIMERA Suite sharding evaluation
          # Expected scripts (see SHARDING_BENCHMARK_PLAN_v1.4.md)
          python tools/shard_loader.py --config config/sharding/shard-router-example.yaml --dataset oltp_100m.json
          python tools/shard_bench.py --mix A,B,C,D,E --output CHIMERA_shard_results.json
          python tools/fault_injector.py --scenario rebalance --config config/sharding/shard-router-example.yaml
          python tools/aggregate_shard_results.py --input CHIMERA_shard_results.json --output CHIMERA_sharding_summary.json

      - name: Cost Comparison (vs Hyperscalers)
        run: |
          python tools/compare_hyperscaler.py \
            --results CHIMERA_sharding_summary.json \
            --template benchmarks/SHARDING_COST_COMPARISON_TEMPLATE.csv \
            --output CHIMERA_cost_comparison.csv

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chimera-sharding-benchmarks
          path: |
            CHIMERA_sharding_summary.json
            CHIMERA_cost_comparison.csv
            CHIMERA_shard_results.json

      - name: Slack notify (optional)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ Sharding benchmark failure",
              "blocks": [
                {"type": "section", "text": {"type": "mrkdwn", "text": "*Sharding benchmarks failed*\nRepo: ${{ github.repository }}\nRun: ${{ github.run_id }}"}}
              ]
            }
          webhook-url: ${{ secrets.SLACK_WEBHOOK_BENCHMARKS }}
