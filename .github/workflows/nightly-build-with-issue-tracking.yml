name: Nightly Build with Issue Tracking

on:
  schedule:
    - cron: '0 2 * * *'  # Täglich um 2 Uhr UTC
  workflow_dispatch:
    inputs:
      create_issues:
        description: 'Automatisch Issues erstellen'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  build-matrix:
    name: Build (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-latest]
        compiler: [gcc-11, gcc-12, gcc-13, clang-15, clang-16, msvc]
        build_type: [Release, Debug]
        exclude:
          # MSVC nur auf Windows
          - os: ubuntu-22.04
            compiler: msvc
          - os: ubuntu-24.04
            compiler: msvc
          - os: macos-latest
            compiler: msvc
          # GCC nicht auf Windows/macOS
          - os: windows-latest
            compiler: gcc-11
          - os: windows-latest
            compiler: gcc-12
          - os: windows-latest
            compiler: gcc-13
          - os: macos-latest
            compiler: gcc-11
          - os: macos-latest
            compiler: gcc-12
          - os: macos-latest
            compiler: gcc-13
          # Clang nicht standardmäßig auf Windows
          - os: windows-latest
            compiler: clang-15
          - os: windows-latest
            compiler: clang-16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev pkg-config python3

      - name: Setup macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja openssl pkg-config

      - name: Setup Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja -y

      - name: Setup GCC
        if: startsWith(matrix.compiler, 'gcc-')
        run: |
          VERSION="${{ matrix.compiler }}"
          VERSION="${VERSION#gcc-}"
          sudo apt-get install -y gcc-${VERSION} g++-${VERSION}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${VERSION} 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${VERSION} 100
          echo "CC=gcc-${VERSION}" >> $GITHUB_ENV
          echo "CXX=g++-${VERSION}" >> $GITHUB_ENV

      - name: Setup Clang
        if: startsWith(matrix.compiler, 'clang-')
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            VERSION="${{ matrix.compiler }}"
            VERSION="${VERSION#clang-}"
            sudo apt-get install -y clang-${VERSION}
            echo "CC=clang-${VERSION}" >> $GITHUB_ENV
            echo "CXX=clang++-${VERSION}" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Setup MSVC
        if: matrix.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        id: configure
        continue-on-error: true
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTHEMIS_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror" \
            2>&1 | tee configure.log
        shell: bash

      - name: Build
        id: build
        continue-on-error: true
        run: |
          cmake --build build --config ${{ matrix.build_type }} 2>&1 | tee build.log
        shell: bash

      - name: Parse build errors
        if: always()
        run: |
          python3 << 'EOF'
          import re
          import json
          import sys
          from pathlib import Path
          from collections import defaultdict
          
          def parse_errors(log_file, compiler_type):
              errors = []
              warnings = []
              
              if not Path(log_file).exists():
                  return errors, warnings
              
              try:
                  with open(log_file, 'r', errors='ignore') as f:
                      content = f.read()
              except:
                  return errors, warnings
              
              if compiler_type == 'msvc':
                  pattern = re.compile(
                      r'(?P<file>[\w:/\\.\-]+)\((?P<line>\d+)\): '
                      r'(?P<severity>error|warning) (?P<code>[A-Z]\d+): (?P<message>.*?)(?:\n|$)'
                  )
              else:
                  pattern = re.compile(
                      r'(?P<file>[\w./\-]+):(?P<line>\d+):(?P<col>\d+): '
                      r'(?P<severity>error|warning): (?P<message>.*?)(?:\n|$)'
                  )
              
              for match in pattern.finditer(content):
                  entry = {
                      'file': match.group('file'),
                      'line': int(match.group('line')),
                      'column': int(match.group('col')) if 'col' in match.groupdict() else 0,
                      'severity': match.group('severity'),
                      'message': match.group('message').strip()
                  }
                  
                  if entry['severity'] == 'error':
                      errors.append(entry)
                  else:
                      warnings.append(entry)
              
              return errors, warnings
          
          def categorize_errors(errors):
              categories = defaultdict(list)
              for error in errors:
                  msg = error['message'].lower()
                  if 'undefined reference' in msg or 'unresolved external' in msg:
                      categories['linking'].append(error)
                  elif 'syntax error' in msg or 'expected' in msg:
                      categories['syntax'].append(error)
                  elif 'no such file' in msg or 'cannot find' in msg:
                      categories['missing_file'].append(error)
                  elif 'ambiguous' in msg or 'overload' in msg:
                      categories['ambiguity'].append(error)
                  elif 'deprecated' in msg:
                      categories['deprecated'].append(error)
                  else:
                      categories['other'].append(error)
              return dict(categories)
          
          # Determine compiler type
          compiler = '${{ matrix.compiler }}'
          compiler_type = 'msvc' if compiler == 'msvc' else 'gcc'
          
          # Parse errors
          errors, warnings = parse_errors('build.log', compiler_type)
          categories = categorize_errors(errors)
          
          # Generate summary
          summary = {
              'total_errors': len(errors),
              'total_warnings': len(warnings),
              'categories': {k: len(v) for k, v in categories.items()},
              'top_errors': errors[:10],
              'affected_files': list(set(e['file'] for e in errors)),
              'os': '${{ matrix.os }}',
              'compiler': '${{ matrix.compiler }}',
              'build_type': '${{ matrix.build_type }}'
          }
          
          # Write JSON
          with open('error_summary.json', 'w') as f:
              json.dump(summary, f, indent=2)
          
          # Write Markdown
          with open('error_summary.md', 'w') as f:
              f.write(f"## Build Fehler Zusammenfassung\n\n")
              f.write(f"**Konfiguration:** {summary['os']} / {summary['compiler']} / {summary['build_type']}\n\n")
              f.write(f"- **Fehler:** {summary['total_errors']}\n")
              f.write(f"- **Warnungen:** {summary['total_warnings']}\n")
              f.write(f"- **Betroffene Dateien:** {len(summary['affected_files'])}\n\n")
              
              if summary['categories']:
                  f.write("### Fehler nach Kategorie\n\n")
                  for cat, count in summary['categories'].items():
                      f.write(f"- **{cat}:** {count}\n")
                  f.write("\n")
              
              if summary['top_errors']:
                  f.write("### Top Fehler\n\n")
                  for idx, error in enumerate(summary['top_errors'], 1):
                      f.write(f"{idx}. `{error['file']}:{error['line']}` - {error['message'][:100]}\n")
          
          print(f"Parsed {len(errors)} errors and {len(warnings)} warnings")
          EOF
        shell: bash

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            configure.log
            build.log
            error_summary.json
            error_summary.md
          retention-days: 30
          if-no-files-found: warn

      - name: Run tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          cd build
          ctest --output-on-failure -C ${{ matrix.build_type }}
        shell: bash

  create-error-issues:
    name: Create Error Issues
    needs: build-matrix
    runs-on: ubuntu-latest
    if: always() && (github.event.inputs.create_issues != 'false' || github.event_name == 'schedule')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aggregate errors
        id: aggregate
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          from collections import defaultdict
          
          errors_by_file = defaultdict(list)
          
          # Durchsuche alle Artifacts
          for artifact_dir in Path('artifacts').glob('build-logs-*'):
              summary_file = artifact_dir / 'error_summary.json'
              if not summary_file.exists():
                  continue
              
              with open(summary_file) as f:
                  data = json.load(f)
              
              if data['total_errors'] == 0:
                  continue
              
              config = f"{data['os']}-{data['compiler']}-{data['build_type']}"
              
              for error in data.get('top_errors', []):
                  errors_by_file[error['file']].append({
                      'config': config,
                      'line': error['line'],
                      'message': error['message']
                  })
          
          # Schreibe aggregierte Daten
          with open('aggregated_errors.json', 'w') as f:
              json.dump(dict(errors_by_file), f, indent=2)
          
          print(f"Found errors in {len(errors_by_file)} files")
          EOF

      - name: Create or update issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Lade aggregierte Fehler
            const errorsData = JSON.parse(fs.readFileSync('aggregated_errors.json', 'utf8'));
            
            // GitHub Repository Info
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const sha = context.sha;
            
            // Für jede fehlerhafte Datei
            for (const [file, errors] of Object.entries(errorsData)) {
              console.log(`Processing file: ${file}`);
              
              // Suche nach existierendem Issue
              const existingIssues = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: 'build-error',
                per_page: 100
              });
              
              const existingIssue = existingIssues.data.find(issue => 
                issue.title.includes(file)
              );
              
              // Erstelle Issue-Body
              let body = `## 🚨 Nightly Build Fehler\n\n`;
              body += `**Betroffene Datei:** \`${file}\`\n`;
              body += `**Build Run:** [#${runId}](https://github.com/${owner}/${repo}/actions/runs/${runId})\n`;
              body += `**Datum:** ${new Date().toISOString().split('T')[0]}\n`;
              body += `**Commit:** \`${sha.substring(0, 7)}\`\n\n`;
              body += `### Fehler Details\n\n`;
              
              // Gruppiere Fehler nach Konfiguration
              const configGroups = {};
              for (const error of errors) {
                if (!configGroups[error.config]) {
                  configGroups[error.config] = [];
                }
                configGroups[error.config].push(error);
              }
              
              for (const [config, configErrors] of Object.entries(configGroups)) {
                body += `#### ${config}\n\`\`\`\n`;
                for (const error of configErrors.slice(0, 3)) {
                  body += `${file}:${error.line}: error: ${error.message}\n`;
                }
                body += `\`\`\`\n\n`;
              }
              
              body += `### Reproduktion\n\n`;
              body += `\`\`\`bash\n`;
              body += `git checkout ${sha}\n`;
              body += `cmake -B build -DCMAKE_BUILD_TYPE=Release -DTHEMIS_BUILD_TESTS=ON\n`;
              body += `cmake --build build\n`;
              body += `\`\`\`\n\n`;
              
              body += `### Nächste Schritte\n\n`;
              body += `- [ ] Fehlerursache analysieren\n`;
              body += `- [ ] Fix implementieren\n`;
              body += `- [ ] Tests hinzufügen/aktualisieren\n`;
              body += `- [ ] PR erstellen\n`;
              body += `- [ ] Nach Fix: Nightly Build überwachen\n\n`;
              
              body += `---\n`;
              body += `*Dieses Issue wurde automatisch vom Nightly Build System erstellt.*\n`;
              
              if (existingIssue) {
                // Füge Kommentar hinzu
                console.log(`Adding comment to existing issue #${existingIssue.number}`);
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existingIssue.number,
                  body: `## 🔄 Fehler tritt weiterhin auf\n\n` +
                        `**Build Run:** [#${runId}](https://github.com/${owner}/${repo}/actions/runs/${runId})\n` +
                        `**Datum:** ${new Date().toISOString().split('T')[0]}\n\n` +
                        `Der Fehler wurde in folgenden Konfigurationen festgestellt:\n` +
                        Object.keys(configGroups).map(c => `- ${c}`).join('\n')
                });
              } else {
                // Erstelle neues Issue
                console.log(`Creating new issue for ${file}`);
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: `[Nightly Build] Fehler in ${file}`,
                  body,
                  labels: ['build-error', 'nightly-build', 'automated', 'bug']
                });
              }
            }

  summary:
    name: Build Summary
    needs: [build-matrix, create-error-issues]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate summary
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          
          # Sammle alle Ergebnisse
          results = []
          
          for artifact_dir in Path('artifacts').glob('build-logs-*'):
              summary_file = artifact_dir / 'error_summary.json'
              if not summary_file.exists():
                  continue
              
              with open(summary_file) as f:
                  data = json.load(f)
                  results.append(data)
          
          # Erstelle Summary
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write("# Nightly Build Summary\n\n")
              f.write(f"**Total Builds:** {len(results)}\n\n")
              
              # Tabelle
              f.write("| Konfiguration | Status | Fehler | Warnungen |\n")
              f.write("|---------------|--------|--------|----------|\n")
              
              for result in sorted(results, key=lambda x: (x['os'], x['compiler'], x['build_type'])):
                  config = f"{result['os']} / {result['compiler']} / {result['build_type']}"
                  status = "✅" if result['total_errors'] == 0 else "❌"
                  f.write(f"| {config} | {status} | {result['total_errors']} | {result['total_warnings']} |\n")
              
              # Statistiken
              total_errors = sum(r['total_errors'] for r in results)
              total_warnings = sum(r['total_warnings'] for r in results)
              failed_builds = sum(1 for r in results if r['total_errors'] > 0)
              
              f.write(f"\n## Gesamt-Statistiken\n\n")
              f.write(f"- **Fehlgeschlagene Builds:** {failed_builds}/{len(results)}\n")
              f.write(f"- **Gesamte Fehler:** {total_errors}\n")
              f.write(f"- **Gesamte Warnungen:** {total_warnings}\n")
          
          print(f"Summary generated for {len(results)} builds")
          EOF
