name: Remote Registry Client – Async Retry CI

# Triggered on every push / PR that touches the RemoteRegistryClient sources,
# its test file, or this workflow.  Validates the async retry back-off API
# (listPluginsAsync / fetchPluginAsync / downloadPluginAsync).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/themis/base/remote_registry_client.h'
      - 'src/base/remote_registry_client.cpp'
      - 'tests/test_remote_registry_client.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_resilience_remote-registry-client-async-retry-ci.yml'

concurrency:
  group: remote-registry-client-async-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  remote-registry-client-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: RemoteRegistryClient Async Retry (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run RemoteRegistryClientFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R RemoteRegistryClientFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee remote_registry_client_results.txt

      # ── Broader validation via unified binary ──────────────────────────────
      - name: Run RemoteRegistryClient tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="RegistryConfig.*:RegistryPluginEntry.*:PluginDownloadResult.*:RequestStats.*:RemoteRegistryClient.*" \
            --gtest_output="xml:remote_registry_client_gtest.xml" \
            2>&1 | tee remote_registry_client_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-registry-client-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/remote_registry_client_results.txt
            build/remote_registry_client_gtest.xml
            build/remote_registry_client_gtest_output.txt
          retention-days: 30
