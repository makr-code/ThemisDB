name: "[Manual] Bootstrap Release Branches"

# ---------------------------------------------------------------------------
# ROOT-LEVEL TRIGGER
# ------------------
# This file exists at the root of .github/workflows/ so that it appears in
# the GitHub Web UI and GitHub App under the Actions tab.
#
# GitHub only shows workflow_dispatch triggers for workflows directly in
# .github/workflows/. The real implementation lives in:
#   .github/workflows/04-release/bootstrap-release-branches.yml
#
# This wrapper captures the inputs and dispatches the actual workflow via
# the GitHub CLI.
#
# ALTERNATIVE: GitHub CLI
#   gh workflow run "04-release/bootstrap-release-branches.yml" \
#     --repo makr-code/ThemisDB --ref main \
#     --field source_branch=develop --field dry_run=false
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch to create release lanes from (default: develop)"
        required: false
        default: "develop"
        type: string
      dry_run:
        description: "Dry-run: check which branches would be created without creating them"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ref:
        description: "Branch, tag, or SHA to run on (default: main)"
        required: false
        default: "main"
        type: string

permissions:
  actions: write

jobs:
  trigger:
    name: "Trigger › 04-release/bootstrap-release-branches.yml"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "04-release/bootstrap-release-branches.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ inputs.ref }}" \
            --field "source_branch=${{ inputs.source_branch }}" \
            --field "dry_run=${{ inputs.dry_run }}"

          echo "✅ Dispatched 04-release/bootstrap-release-branches.yml"
          echo "   source_branch : ${{ inputs.source_branch }}"
          echo "   dry_run       : ${{ inputs.dry_run }}"
          echo "   ref           : ${{ inputs.ref }}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🌿 [Manual] Bootstrap Release Branches" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Source branch** | \`${{ inputs.source_branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | \`${{ inputs.dry_run }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target workflow** | \`04-release/bootstrap-release-branches.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
