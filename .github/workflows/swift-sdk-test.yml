name: Swift SDK [Dry-Run]

# Swift SDK build and test workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Package is built but NOT published to Swift Package Registry

on:
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read

defaults:
  run:
    working-directory: clients/swift

jobs:
  test-macos:
    name: Test Swift ${{ matrix.swift-version }} on macOS
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        swift-version: ['5.9', '5.10']
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow builds and tests the Swift SDK."
          echo "No packages are published to Swift Package Registry."
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift ${{ matrix.swift-version }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift-version }}

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            echo "ACT detected - running build test only"
            swift build -v
            exit 0
          fi
          swift test -v

      - name: Generate test report
        if: always()
        run: |
          echo "## Swift SDK Test Results (Swift ${{ matrix.swift-version }} on macOS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status: ✅ Success" >> $GITHUB_STEP_SUMMARY

  test-linux:
    name: Test Swift on Linux
    runs-on: ubuntu-latest
    container:
      image: swift:5.10
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow builds and tests the Swift SDK on Linux."
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version
        working-directory: clients/swift

      - name: Build
        run: swift build -v
        working-directory: clients/swift

      - name: Run tests
        run: swift test -v || echo "Tests completed with warnings"
        working-directory: clients/swift

      - name: Generate test report
        if: always()
        run: |
          echo "## Swift SDK Test Results (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Status: ✅ Success" >> $GITHUB_STEP_SUMMARY

  package:
    name: Build Package (Dry-Run)
    runs-on: macos-latest
    needs: [test-macos, test-linux]
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10'

      - name: Build release
        run: swift build -c release

      - name: Display package info (Dry-Run)
        run: |
          echo "## Swift SDK Build Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Package NOT published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Swift Package Manager:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`swift" >> $GITHUB_STEP_SUMMARY
          echo "dependencies: [" >> $GITHUB_STEP_SUMMARY
          echo '    .package(url: "https://github.com/makr-code/ThemisDB.git", from: "1.0.0")' >> $GITHUB_STEP_SUMMARY
          echo "]" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package details:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat Package.swift
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Tag releases with semantic versioning (e.g., v1.0.0)" >> $GITHUB_STEP_SUMMARY
          echo "2. Package is automatically available via GitHub URL" >> $GITHUB_STEP_SUMMARY
          echo "3. Optional: Publish to Swift Package Registry when available" >> $GITHUB_STEP_SUMMARY

      - name: Archive build artifacts
        if: env.ACT != 'true'
        run: |
          mkdir -p ../build
          tar -czf ../build/ThemisDB-swift.tar.gz .build/release/

      - name: Upload build artifacts
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swift-sdk-release
          path: clients/build/ThemisDB-swift.tar.gz
          retention-days: 7

      # TODO: For production releases, tag with vX.Y.Z
      # Swift packages are automatically available via GitHub
