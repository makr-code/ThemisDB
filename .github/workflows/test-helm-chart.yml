name: "Gate: Helm Chart"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - "helm/themisdb/**"
      - ".github/workflows/test-helm-chart.yml"
      - ".github/WORKFLOW_REGISTRY.md"
  workflow_dispatch:

concurrency:
  group: helm-chart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-chart:
    name: "Gate: Helm Chart Lint, Render, and Kind Smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install YAML test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: Install kind and kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          install_only: true

      - name: Lint development and production chart profiles
        run: |
          helm lint helm/themisdb
          helm lint helm/themisdb --values helm/themisdb/values-production.yaml

      - name: Test rendered profile resources and NetworkPolicy rules
        run: python -m unittest discover -s helm/themisdb/tests -v

      - name: Smoke-test both profiles in Kind
        run: helm/themisdb/tests/smoke-kind.sh

      - name: Write run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Helm Chart Validation"
            echo ""
            echo "- **Scope:** Development and production profiles, rendered resources, and Kind smoke tests."
            echo "- **Result:** ${JOB_STATUS}"
            if [ "${JOB_STATUS}" = "success" ]; then
              echo "- **Next step:** No action required."
            else
              echo "- **Next step:** Review the failed step and rerun after remediation."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
