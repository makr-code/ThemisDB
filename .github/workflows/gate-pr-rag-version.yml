name: "Gate: PR RAG Embedding Version Governance"

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-09-24
# Trigger policy: Enforces Phase 3 Embedding & Index Version Governance compliance.
# Validates reindex decision logic, canary deployment autonomy, rollback atomicity,
# and index manifest persistence correctness.
# Blocks merge on broken reindex triggers, non-atomic rollback, or manifest schema violations.
# Reference: src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'src/ingestion/**'
      - 'src/index/**'
      - 'src/llm/**'
      - 'src/rag/**'
      - 'include/rag/**'
      - 'include/ingestion/**'
      - 'tests/ingestion/**'
      - 'tests/llm/**'
      - 'tests/rag/**'
      - '.github/workflows/gate-pr-rag-version.yml'

concurrency:
  group: rag-version-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version_governance_validation:
    name: "Gate: Embedding Version Governance"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Validate Embedding Version Governance Spec
        run: |
          echo "✓ Checking EMBEDDING_VERSION_GOVERNANCE.md..."
          if [ ! -f "src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md" ]; then
            echo "❌ FAIL: src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md not found"
            exit 1
          fi
          
          # Verify all required sections exist
          REQUIRED_SECTIONS=("Version Schema" "Reindex Decision Logic" "Index Manifest Schema" "Canary Deployment Pattern" "Dual-Read Implementation" "Rollback")
          for section in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -q "## .*$section\|### .*$section" src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md; then
              echo "❌ FAIL: Required section '$section' not found"
              exit 1
            fi
          done
          
          echo "✓ All required sections present"
      
      - name: Validate Index Manifest Schema
        run: |
          echo "✓ Checking INDEX_MANIFEST_V1_SCHEMA.json..."
          if [ ! -f "src/index/INDEX_MANIFEST_V1_SCHEMA.json" ]; then
            echo "❌ FAIL: src/index/INDEX_MANIFEST_V1_SCHEMA.json not found"
            exit 1
          fi
          
          # Validate JSON Schema structure
          python3 - <<'PYEOF'
          import json
          import sys

          try:
            with open('src/index/INDEX_MANIFEST_V1_SCHEMA.json') as f:
                schema = json.load(f)

            # Verify $schema and definitions
            if '$schema' not in schema:
                print("FAIL: $schema not defined in JSON Schema")
                sys.exit(1)

            if 'definitions' not in schema:
                print("FAIL: definitions not found in JSON Schema")
                sys.exit(1)

            # Check for required definitions
            required_defs = ['IndexVersion', 'EmbeddingMetadata', 'ChunkingMetadata', 'IndexSchema']
            for defn in required_defs:
                if defn not in schema['definitions']:
                    print(f"FAIL: Required definition '{defn}' not found")
                    sys.exit(1)

            print("INDEX_MANIFEST_V1_SCHEMA.json valid")
          except Exception as e:
            print(f"FAIL: Schema validation error: {e}")
            sys.exit(1)
          PYEOF
      
      - name: Validate Reindex Decision Logic
        run: |
          echo "✓ Checking reindex decision logic..."
          
          # Verify trigger conditions documented
          if ! grep -q "Trigger Conditions" src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md; then
            echo "❌ FAIL: Reindex trigger conditions not documented"
            exit 1
          fi
          
          # Count triggers (should be 4: model change, dim change, chunking change, schema major version)
          TRIGGER_COUNT=$(python3 - <<'PY'
          from pathlib import Path
          text = Path("src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md").read_text(encoding="utf-8")
          print(sum(token in text for token in (
              "embedding_model_id ≠",
              "embedding_dim ≠",
              "chunking_profile_id ≠",
              "major_version",
          )))
          PY
          )
          if [ "$TRIGGER_COUNT" -lt 3 ]; then
            echo "❌ FAIL: Not all reindex triggers documented (found $TRIGGER_COUNT, expected ≥3)"
            exit 1
          fi
          
          echo "✓ Reindex decision logic valid"
      
      - name: Validate Canary Deployment Pattern
        run: |
          echo "✓ Checking canary deployment pattern..."
          
          # Verify 5-phase pattern (5%, 10%, 25%, 50%, 100%)
          if ! grep -q "5%\|10%\|25%\|50%\|100%" src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md; then
            echo "❌ FAIL: Canary phase percentages not documented"
            exit 1
          fi
          
          # Verify metrics-driven progression documented
          if ! grep -q "metrics-driven\|Recall\|nDCG" src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md; then
            echo "❌ FAIL: Metrics-driven canary progression not documented"
            exit 1
          fi
          
          echo "✓ Canary deployment pattern valid"
      
      - name: Validate Rollback Strategy
        run: |
          echo "✓ Checking rollback strategy..."
          
          # Verify atomic rollback documented
          if ! grep -q "Atomic\|atomic" src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md; then
            echo "❌ FAIL: Atomic rollback not documented"
            exit 1
          fi
          
          # Verify archival retention (30 days)
          if ! grep -q "30.*day\|archiv" src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md; then
            echo "❌ FAIL: Archival retention not documented"
            exit 1
          fi
          
          echo "✓ Rollback strategy valid"
      
      - name: Generate Gate Report
        if: always()
        run: |
          cat > /tmp/rag_version_gate_report.md << EOF
          ## RAG Embedding Version Governance Gate Report
          
          **Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **PR:** ${{ github.event.pull_request.number }}
          **Commit:** ${{ github.event.pull_request.head.sha }}
          **Validation job result:** ${{ job.status }}
          
          Validation outcomes are recorded by the individual workflow steps and in the run summary.
          
          ### References
          - Spec: src/ingestion/EMBEDDING_VERSION_GOVERNANCE.md
          - Schema: src/index/INDEX_MANIFEST_V1_SCHEMA.json
          EOF
          
          cat /tmp/rag_version_gate_report.md
      
      - name: Apply Gate Label
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['rag-version-required', 'quality/versioning']
            });
      
      - name: Comment Gate Status
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/rag_version_gate_report.md', 'utf8');
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
  
  reindex_decision_tests:
    name: "Gate: Reindex Decision Logic"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: contains(github.event.pull_request.labels.*.name, 'rag-tests') || contains(github.event.pull_request.labels.*.name, 'release_critical')
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      
      - name: Install Build Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build g++-13 libfmt-dev libspdlog-dev nlohmann-json3-dev libboost-filesystem-dev libboost-system-dev libcpp-httplib-dev libyaml-cpp-dev
          cargo install sccache || (curl -L https://github.com/mozilla/sccache/releases/download/v0.7.7/sccache-v0.7.7-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp && sudo mv /tmp/sccache-v0.7.7-x86_64-unknown-linux-musl/sccache /usr/local/bin/)
      
      - name: Configure
        run: |
          cmake -B /tmp/version-build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHEMIS_ALLOW_MISSING_ROCKSDB=ON \
            -DTHEMIS_DIAGNOSTIC_MODE=ON \
            -DTHEMIS_BUILD_TESTS=ON
      
      - name: Build Reindex and Canary Tests
        run: |
          if ! target_list="$(cmake --build /tmp/version-build --target help 2>&1)"; then
            echo "::error title=UNIMPLEMENTED/BLOCKED::Unable to inspect configured CMake targets; embedding-version test lane cannot be verified."
            printf '%s\n' "$target_list"
            exit 1
          fi
          for target in module_ingestion_test_reindex_decision_engine_focused module_rag_test_model_promoter_focused; do
            if ! grep -Eq "(^|[[:space:]])${target}([[:space:]:]|$)" <<< "$target_list"; then
              echo "::error title=UNIMPLEMENTED/BLOCKED::The required embedding-version test target '${target}' is not registered. Verify the reindex-engine and model-canary tests are included by CMake."
              exit 1
            fi
          done
          cmake --build /tmp/version-build --target \
            module_ingestion_test_reindex_decision_engine_focused \
            module_rag_test_model_promoter_focused --parallel 4

      - name: Verify Reindex Decision Test Registration
        run: |
          reindex_test="test_reindex_decision_engine_ingestion_FocusedTests"
          registered_tests="$(ctest --test-dir /tmp/version-build -N -R "^${reindex_test}$" 2>&1)" || {
            echo "::error title=UNIMPLEMENTED/BLOCKED::Unable to inspect registered ReindexDecisionEngine CTest cases."
            printf '%s\n' "$registered_tests"
            exit 1
          }
          if ! grep -Eq '^Total Tests: [1-9][0-9]*$' <<< "$registered_tests"; then
            echo "::error title=UNIMPLEMENTED/BLOCKED::The real ReindexDecisionEngine test is not registered with CTest."
            printf '%s\n' "$registered_tests"
            exit 1
          fi

      - name: Verify Embedding Canary Test Registration
        run: |
          test_filter="embedding_canary"
          registered_tests="$(ctest --test-dir /tmp/version-build -N -L "$test_filter" 2>&1)" || {
            echo "::error title=UNIMPLEMENTED/BLOCKED::Unable to inspect registered embedding-canary CTest cases."
            printf '%s\n' "$registered_tests"
            exit 1
          }
          if ! grep -Eq '^Total Tests: [1-9][0-9]*$' <<< "$registered_tests"; then
            echo "::error title=UNIMPLEMENTED/BLOCKED::No CTest case is registered with the embedding_canary label. Register implemented version-lifecycle/canary coverage before this requested lane can pass."
            printf '%s\n' "$registered_tests"
            exit 1
          fi

      - name: Run Canary Deployment Tests
        run: |
          cd /tmp/version-build
          ctest -L "embedding_canary" -V --output-on-failure --no-tests=error

      - name: Run Reindex Decision Tests
        run: |
          cd /tmp/version-build
          ctest -R '^test_reindex_decision_engine_ingestion_FocusedTests$' \
            -V --output-on-failure --no-tests=error

  gate_status:
    name: "Validate: Gate Status Summary"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    needs: [version_governance_validation, reindex_decision_tests]
    if: always()
    
    steps:
      - name: Check Gate Status
        run: |
          validation_result="${{ needs.version_governance_validation.result }}"
          tests_result="${{ needs.reindex_decision_tests.result }}"
          if [ "${validation_result}" != "success" ]; then
            echo "❌ RAG Embedding Version Governance validation failed: ${validation_result}"
            exit 1
          fi
          if [ "${tests_result}" != "success" ] && [ "${tests_result}" != "skipped" ]; then
            echo "❌ RAG reindex decision tests failed: ${tests_result}"
            exit 1
          fi
          echo "✅ RAG Embedding Version Governance Gate: PASS (tests: ${tests_result})"

  apply-release-critical-label:
    name: "Gate: Apply release_critical Label"
    needs: [version_governance_validation, reindex_decision_tests, gate_status]
    if: needs.version_governance_validation.result == 'success' && needs.reindex_decision_tests.result == 'success' && needs.gate_status.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Apply release_critical label after tests pass
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['release_critical']
            });

  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs:
      - version_governance_validation
      - reindex_decision_tests
      - gate_status
      - apply-release-critical-label
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Report release_critical label decision
        if: always() && needs.reindex_decision_tests.result != 'success'
        env:
          TEST_RESULT: ${{ needs.reindex_decision_tests.result }}
        run: |
          echo "**release_critical was withheld** because the reindex/canary test lane did not succeed (result: ${TEST_RESULT})." >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "RAG embedding version governance and optional reindex tests"
          job-results: ${{ toJSON(needs) }}
