name: 'Reusable: Status Flags and Issues'

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
on:
  workflow_call:
    inputs:
      operation:
        description: Operation type
        required: true
        type: string
      issue-number:
        description: Target issue number
        required: false
        default: ''
        type: string
      issue-title:
        description: Issue title
        required: false
        default: ''
        type: string
      issue-body:
        description: Issue body or comment body
        required: false
        default: ''
        type: string
      issue-marker:
        description: Unique marker to resolve tracker issue
        required: false
        default: ''
        type: string
      target-type:
        description: Target kind for comment_issue (issue|pr|auto)
        required: false
        default: 'auto'
        type: string
      labels-to-add:
        description: Comma-separated labels to add
        required: false
        default: ''
        type: string
      labels-to-remove:
        description: Comma-separated labels to remove
        required: false
        default: ''
        type: string
      status-group:
        description: Comma-separated status group labels for atomic replacement
        required: false
        default: ''
        type: string
      source-workflow:
        description: Source workflow name
        required: false
        default: ''
        type: string
      source-run-id:
        description: Source workflow run id
        required: false
        default: ''
        type: string
      source-sha:
        description: Source sha
        required: false
        default: ''
        type: string
      close-reason:
        description: Close reason for close_issue
        required: false
        default: completed
        type: string
      allow-missing:
        description: If true, skip operation when issue cannot be resolved
        required: false
        default: 'false'
        type: string
    secrets:
      repo-token:
        required: true
    outputs:
      issue-number:
        description: Resolved issue number
        value: ${{ jobs.status.outputs.issue-number }}
      action-result:
        description: Operation result
        value: ${{ jobs.status.outputs.action-result }}
      applied-labels:
        description: Applied labels
        value: ${{ jobs.status.outputs.applied-labels }}
      removed-labels:
        description: Removed labels
        value: ${{ jobs.status.outputs.removed-labels }}

permissions:
  contents: read
  issues: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue-number: ${{ steps.status.outputs.issue-number }}
      action-result: ${{ steps.status.outputs.action-result }}
      applied-labels: ${{ steps.status.outputs.applied-labels }}
      removed-labels: ${{ steps.status.outputs.removed-labels }}
    steps:
      - name: Execute status operation
        id: status
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.repo-token }}
          operation: ${{ inputs.operation }}
          issue-number: ${{ inputs.issue-number }}
          issue-title: ${{ inputs.issue-title }}
          issue-body: ${{ inputs.issue-body }}
          issue-marker: ${{ inputs.issue-marker }}
          target-type: ${{ inputs.target-type }}
          labels-to-add: ${{ inputs.labels-to-add }}
          labels-to-remove: ${{ inputs.labels-to-remove }}
          status-group: ${{ inputs.status-group }}
          source-workflow: ${{ inputs.source-workflow }}
          source-run-id: ${{ inputs.source-run-id }}
          source-sha: ${{ inputs.source-sha }}
          close-reason: ${{ inputs.close-reason }}
          allow-missing: ${{ inputs.allow-missing }}
