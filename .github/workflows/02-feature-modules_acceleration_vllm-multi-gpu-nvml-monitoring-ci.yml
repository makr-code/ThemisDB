name: VLLMResourceManager Multi-GPU NVML Monitoring CI

# Triggered on every push/PR that touches VLLMResourceManager sources or tests.
# Targets v1.8.0 (Issue #131).
#
# Validates all acceptance criteria without physical GPU hardware:
#   AC-1  Config.gpu_device_index defaults to 0; can be set to any index.
#   AC-2  Config.gpu_device_indices allows explicit multi-device override.
#   AC-3  initializeNVML() gracefully falls back to CPU-only when NVML absent.
#   AC-4  canUseGPU() returns false when the configured device is at 90%
#         utilisation (mock provider) even when GPU 0 is idle.
#   AC-5  canUseGPU() returns true when configured device is below 80%.
#   AC-6  canUseGPU() returns false when any monitored device in a multi-device
#         set is busy (max-utilisation semantics).
#   AC-7  shutdownNVML() clears all device handles before nvmlShutdown().
#   AC-8  queryGPUUtilization() propagates mock provider value through getStats().
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/acceleration/vllm_resource_manager.h'
      - 'src/acceleration/vllm_resource_manager.cpp'
      - 'tests/test_vllm_resource_stats.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_acceleration_vllm-multi-gpu-nvml-monitoring-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the VLLMResourceManager stats/multi-GPU focused tests.
  # No GPU hardware required — all new tests use the mock utilization provider.
  # ---------------------------------------------------------------------------
  vllm-multi-gpu-nvml-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: VLLMResourceManager Multi-GPU NVML (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── VLLMResourceManager stats + multi-GPU mock-provider tests ──────────
      - name: Run VLLMResourceStatsFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R VLLMResourceStatsFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee vllm_resource_stats_ctest.txt

      - name: Run VLLMResourceStatsTest suite via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_vllm_resource_stats_focused \
            --gtest_filter="VLLMResourceStatsTest*" \
            --gtest_output="xml:vllm_resource_stats_gtest.xml" \
            2>&1 | tee vllm_resource_stats_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vllm-multi-gpu-nvml-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/vllm_resource_stats_ctest.txt
            build/vllm_resource_stats_gtest.xml
            build/vllm_resource_stats_gtest_output.txt
          retention-days: 30
