name: Transaction Write Batching CI

# Validates TransactionBatcher write batching and coalescing implementation
# (v1.8.0, roadmap:213:transaction:v1.8.0:write-batching-and-coalescing).
# Covers:
#   AC-1  Default BatchConfig has window=5ms, max=1000, min=10, adaptive=true
#   AC-2  setBatchConfig() clamps window to [1ms, 100ms]
#   AC-3  setBatchConfig() clamps max_batch_size >= 1
#   AC-4  setBatchConfig() clamps min_batch_size <= max_batch_size
#   AC-5  submitAsync() with null commit_fn returns error immediately
#   AC-7  Single item flushed within window
#   AC-8  Batch of items all resolve with correct Status values
#   AC-9  flush() drains queue immediately
#   AC-10 max_batch_size triggers immediate flush before window expires
#   AC-11 Failed commit_fn propagates error Status
#   AC-12 Exception in commit_fn is caught and returned as error
#   AC-13 Stats: batches_flushed increments
#   AC-14 Stats: committed and failed counts are correct
#   AC-15 Stats: avg_batch_size is a running average
#   AC-16 Stats: avg_latency_ms is non-negative
#   AC-17 Per-table policy overrides window
#   AC-18 Per-table policy overrides max_batch_size
#   AC-19 getTablePolicy() returns zero policy for unknown table
#   AC-20 Concurrent submitters: all futures resolve without deadlock
#   AC-21 FIFO ordering within a batch
#   AC-22 Adaptive: adaptive_adjustments field is reachable
#   AC-23 getBatchConfig() returns clamped config
#   AC-24 Destructor flushes remaining items
#   AC-25 setTablePolicy with zero fields inherits global config
#   AC-26 High-throughput: 1000 submitters all get resolved futures (opt-in)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/transaction/transaction_batcher.h'
      - 'src/transaction/transaction_batcher.cpp'
      - 'tests/test_transaction_batcher.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_transactions_transaction-write-batching-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  transaction-write-batching-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Transaction write batching tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_transaction_batcher_focused

      - name: Run TransactionBatcherFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R TransactionBatcherFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee batcher_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_transaction_batcher_focused \
            --gtest_output="xml:batcher_gtest.xml" \
            2>&1 | tee batcher_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-write-batching-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/batcher_ctest.txt
            build/batcher_gtest.xml
            build/batcher_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🚀 Transaction Write Batching CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates TransactionBatcher write batching and coalescing: BatchConfig, window clamping," >> "$GITHUB_STEP_SUMMARY"
          echo "submitAsync, flush, per-table policies, adaptive sizing, fair FIFO scheduling, and stats." >> "$GITHUB_STEP_SUMMARY"
