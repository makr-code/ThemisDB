name: "Release: Linux Distro Approval Gate"

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read
  actions: write

concurrency:
  group: release-linux-distro-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  linux_distro_publish_from_issue:
    name: "Publish: Linux Distro Packages on Approval Comment"
    if: |
      contains(github.event.issue.labels.*.name, 'linux-distro-review') &&
      (
        contains(github.event.comment.body, '/publish-linux') ||
        contains(github.event.comment.body, '/approve-linux') ||
        contains(github.event.comment.body, '@publish-linux') ||
        contains(github.event.comment.body, '/hold-linux') ||
        contains(github.event.comment.body, '/pause-linux') ||
        contains(github.event.comment.body, '/reject-linux') ||
        contains(github.event.comment.body, '/cancel-linux') ||
        contains(github.event.comment.body, '/rollback-linux')
      )
    uses: ./.github/workflows/reusable-release-approval-comment-gate.yml
    with:
      issue_label: linux-distro-review
      match_regex: "/publish-linux\\b|/approve-linux\\b|@publish-linux\\b|/hold-linux\\b|/pause-linux\\b|/reject-linux\\b|/cancel-linux\\b|/rollback-linux\\b"
      hold_regex: "/hold-linux\\b|/pause-linux\\b"
      reject_regex: "/reject-linux\\b|/cancel-linux\\b"
      rollback_regex: "/rollback-linux\\b"
      subject: "Linux Distro Publication"
      environment_name: linux-distro-production
      environment_url: https://github.com/${{ github.repository }}/actions/workflows/release-linux-distro-approval.yml
      target_workflow_id: release-linux-distribution.yml
      target_ref: develop
      dispatch_inputs_json: '{"publish_bundle":"true","channel":"stable"}'
      approved_label: distro-approved
      approval_note: |
        Monitor `release-linux-distribution.yml` for package publication to distro endpoints.

  summary:
    name: "Validate: Wrapper Summary"
    runs-on: ubuntu-latest
    needs: [linux_distro_publish_from_issue]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## Validate: Release Linux Distro Approval Wrapper"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| linux_distro_publish_from_issue | ${{ needs.linux_distro_publish_from_issue.result }} |"
            echo "| Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
