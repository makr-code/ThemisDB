---
name: "Security: Fuzzing"

# Parser PR smoke tests are deterministic, corpus-driven, and bounded to 5
# minutes per affected parser. Scheduled/manual runs exercise all parser
# harnesses.
on:
  pull_request:
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'src/aql/**'
      - 'include/aql/**'
      - 'tests/aql/**'
      - 'src/query/aql_parser*'
      - 'include/query/aql_parser*'
      - 'tests/query/aql_parser*'
      - 'src/server/http*'
      - 'include/server/http*'
      - 'tests/server/http*'
      - 'src/api/http*'
      - 'include/api/http*'
      - 'tests/network/http*'
      - 'tests/network/test_http*'
      - 'tests/integration/test_http*'
      - 'src/network/wire_protocol*'
      - 'src/network/websocket_binary_frame_parser*'
      - 'include/network/wire_protocol*'
      - 'include/themis/network/wire_protocol*'
      - 'src/themis/wire_protocol*'
      - 'tests/network/test_wire_protocol*'
      - 'tests/themis/test_themis_wire_protocol*'
      - 'src/importers/**'
      - 'include/importers/**'
      - 'tests/importers/**'
      - 'fuzz/harnesses/aql_parser_harness.cpp'
      - 'fuzz/harnesses/http_parser_harness.cpp'
      - 'fuzz/harnesses/wire_protocol_parser_harness.cpp'
      - 'fuzz/harnesses/postgres_importer_harness.cpp'
      - 'fuzz/corpus/aql/**'
      - 'fuzz/corpus/http/**'
      - 'fuzz/corpus/wire_protocol/**'
      - 'fuzz/corpus/importer/**'
      - 'tools/ci/fuzz_smoke.py'
      - 'fuzz/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'CMakeLists.txt'
      - '.github/workflows/security-fuzzing.yml'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Parser target to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - aql_parser
          - gguf_loader
          - grammar
          - http_parser
          - jwt_rbac_config
          - ldap_dn
          - pii_redaction
          - postgres_importer
          - security_input_validator
          - security_policy_engine
          - wire_protocol_parser

permissions:
  contents: read

concurrency:
  group: security-fuzzing-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [parser-smoke, afl-fuzz]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Deterministic parser fuzz-smoke"
          job-results: ${{ toJSON(needs) }}
      - name: Record fuzzing evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ github.event.inputs.target || '' }}
          TESTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          RUN_STARTED_AT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq .run_started_at)"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            changed_output="$(git diff --name-only "${base_sha}...$GITHUB_SHA")"
            changed_files=()
            mapfile -t changed_files <<< "$changed_output"
            TARGETS="$(python3 tools/ci/fuzz_smoke.py --mode targets \
              --target changed --changed-files "${changed_files[@]}")"
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            TARGETS="AFL++ selected file-mode targets: "
            TARGETS+="aql_parser, postgres_importer, wire_protocol_parser; "
            TARGETS+="skipped (not PASS): gguf_loader, grammar, http_parser, "
            TARGETS+="jwt_rbac_config, ldap_dn, pii_redaction, "
            TARGETS+="security_input_validator, security_policy_engine"
          elif [[ "$INPUT_TARGET" == "all" ]]; then
            TARGETS="all deterministic parser smoke; AFL++ supported: "
            TARGETS+="aql_parser, postgres_importer, wire_protocol_parser; "
            TARGETS+="skipped (not PASS): gguf_loader, grammar, http_parser, "
            TARGETS+="jwt_rbac_config, ldap_dn, pii_redaction, "
            TARGETS+="security_input_validator, security_policy_engine"
          elif [[ "$INPUT_TARGET" == "aql_parser" ||
            "$INPUT_TARGET" == "wire_protocol_parser" ||
            "$INPUT_TARGET" == "postgres_importer" ]]; then
            TARGETS="$INPUT_TARGET (deterministic smoke and AFL++)"
          elif [[ "$INPUT_TARGET" == "http_parser" ]]; then
            TARGETS="$INPUT_TARGET (deterministic smoke; "
            TARGETS+="AFL++ skipped, not PASS)"
          else
            TARGETS="$INPUT_TARGET (AFL++ skipped, not PASS)"
          fi
          export RUN_URL RUN_STARTED_AT TARGETS
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          jobs = json.loads(os.environ["JOB_RESULTS"])
          event = os.environ["EVENT_NAME"]
          expected = ["afl-fuzz"]
          if event == "pull_request":
              expected = ["parser-smoke"]
          elif event == "workflow_dispatch" and os.environ["INPUT_TARGET"] in {
              "all", "aql_parser", "http_parser",
              "wire_protocol_parser", "postgres_importer",
          }:
              expected.append("parser-smoke")
          passed = all(
              jobs.get(name, {}).get("result") == "success"
              for name in expected
          )
          afl_coverage_complete = (
              event == "pull_request"
              or (
                  event == "workflow_dispatch"
                  and os.environ["INPUT_TARGET"] in {
                      "aql_parser", "postgres_importer", "wire_protocol_parser",
                  }
              )
          )
          if not passed:
              status = (
                  "FAIL/CANCELLED (not PASS; inspect job logs and infra status)"
              )
          elif afl_coverage_complete:
              status = "PASS"
          else:
              status = (
                  "PARTIAL (not PASS; unsupported AFL++ targets were skipped)"
              )
          started = datetime.fromisoformat(
              os.environ["RUN_STARTED_AT"].replace("Z", "+00:00")
          )
          elapsed = int(
              (datetime.now(timezone.utc) - started).total_seconds()
          )
          results = ", ".join(
              f"{name}={item.get('result', 'missing')}"
              for name, item in jobs.items()
          )
          report = (
              "## Parser fuzz evidence\n"
              f"- Run URL: {os.environ['RUN_URL']}\n"
              f"- Tested commit SHA: `{os.environ['TESTED_SHA']}`\n"
              f"- Target: {os.environ['TARGETS']}\n"
              f"- Workflow elapsed duration: {elapsed}s\n"
              f"- Outcome: **{status}** ({results})\n"
          )
          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8"
          ) as summary:
              summary.write(report)
          with open(
              "fuzz-evidence.md", "w", encoding="utf-8"
          ) as evidence:
              evidence.write(report)
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: fuzz-evidence-${{ github.run_number }}
          path: fuzz-evidence.md
          if-no-files-found: error
          retention-days: 30

  parser-smoke:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'all' ||
      inputs.target == 'aql_parser' ||
      inputs.target == 'http_parser' ||
      inputs.target == 'wire_protocol_parser' ||
      inputs.target == 'postgres_importer'))
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: ubuntu-latest
      shell: bash
      fetch_depth: '0'
      working_directory: .
      setup_command: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build clang libboost-dev nlohmann-json3-dev \
          libfmt-dev libspdlog-dev
      build_directory: build-fuzz
      configure_command: |
        set -euo pipefail
        SAN_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
        cmake -S . -B build-fuzz -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug -DENABLE_FUZZING=ON \
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS="$SAN_FLAGS"
      build_command: |
        set -euo pipefail
        target_input="${{ github.event.inputs.target || '' }}"
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          target_input="changed"
        elif [[ -z "$target_input" ]]; then
          target_input="all"
        fi
        changed_files=()
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          base_sha="${{ github.event.pull_request.base.sha }}"
          changed_output="$(git diff --name-only "${base_sha}...$GITHUB_SHA")"
          mapfile -t changed_files <<< "$changed_output"
        fi
        target_output="$(python3 tools/ci/fuzz_smoke.py --mode targets \
          --target "$target_input" --changed-files "${changed_files[@]}")"
        targets=()
        if [[ -n "$target_output" ]]; then
          mapfile -t targets <<< "$target_output"
        fi
        if ((${#targets[@]} == 0)); then
          echo "::error::Fuzz path filter matched with no parser target."
          exit 1
        fi
        harnesses=()
        for target in "${targets[@]}"; do
          harnesses+=("${target}_harness")
        done
        cmake --build build-fuzz --target "${harnesses[@]}" --parallel 4
      validation_command: |
        set -euo pipefail
        target_input="${{ github.event.inputs.target || '' }}"
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          target_input="changed"
        elif [[ -z "$target_input" ]]; then
          target_input="all"
        fi
        changed_files=()
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          base_sha="${{ github.event.pull_request.base.sha }}"
          changed_output="$(git diff --name-only "${base_sha}...$GITHUB_SHA")"
          mapfile -t changed_files <<< "$changed_output"
        fi
        python3 tools/ci/fuzz_smoke.py --mode run \
          --target "$target_input" --changed-files "${changed_files[@]}"
      artifact_name: fuzz-smoke-logs-${{ github.run_number }}
      artifact_paths: |
        build-fuzz/Testing
        build-fuzz/fuzz-smoke-results.log
        fuzz/corpus
      artifact_retention_days: '30'
      summary_title: "Validate: Deterministic Parser Fuzz-Smoke"
      timeout_minutes: '45'

  afl-fuzz:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: ubuntu-latest
      shell: bash
      fetch_depth: '0'
      working_directory: .
      setup_command: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          afl++ cmake ninja-build clang libboost-dev nlohmann-json3-dev \
          libfmt-dev libspdlog-dev
      build_directory: build-afl
      configure_command: |
        set -euo pipefail
        cmake -S . -B build-afl -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug -DENABLE_FUZZING=ON \
          -DCMAKE_C_COMPILER=afl-clang-lto \
          -DCMAKE_CXX_COMPILER=afl-clang-lto++
      build_command: |
        set -euo pipefail
        target_input="${{ github.event.inputs.target || 'all' }}"
        case "$target_input" in
          all)
            targets=(
              aql_parser_harness postgres_importer_harness
              wire_protocol_parser_harness
            )
            ;;
          aql_parser|postgres_importer|wire_protocol_parser)
            targets=("${target_input}_harness")
            ;;
          *)
            printf '::notice::AFL++ target %s is not in the ' \
              "$target_input"
            printf 'selected file-mode subset; '
            printf 'it will be reported as skipped.\n'
            exit 0
            ;;
        esac
        cmake --build build-afl --target "${targets[@]}" --parallel 4
      validation_command: |
        set -euo pipefail
        target_input="${{ github.event.inputs.target || 'all' }}"
        case "$target_input" in
          all)
            harnesses=(aql_parser postgres_importer wire_protocol_parser)
            ;;
          aql_parser|postgres_importer|wire_protocol_parser)
            harnesses=("$target_input")
            ;;
          *)
            printf '::notice::AFL++ target %s is not in the ' \
              "$target_input"
            printf 'selected file-mode subset; skipped (not PASS).\n'
            exit 0
            ;;
        esac
        declare -A corpora=(
          [aql_parser]=aql
          [postgres_importer]=importer
          [wire_protocol_parser]=wire_protocol
        )
        for harness in "${harnesses[@]}"; do
          binary="build-afl/fuzz/bin/${harness}_harness"
          corpus="fuzz/corpus/${corpora[$harness]}"
          output="/tmp/fuzz-afl-out/${harness}"
          [[ -x "$binary" ]] || {
            echo "::error::Selected AFL harness missing: $binary"
            exit 1
          }
          [[ -d "$corpus" ]] || {
            echo "::error::Selected AFL corpus missing: $corpus"
            exit 1
          }
          find "$corpus" -maxdepth 1 -type f -print -quit | grep -q . || {
            echo "::error::Selected AFL corpus is empty: $corpus"
            exit 1
          }
          mkdir -p "$output"
          set +e
          timeout --signal=INT --kill-after=10s 60s \
            afl-fuzz -i "$corpus" -o "$output" -- "$binary" @@
          result=$?
          set -e
          if [[ "$result" -ne 0 && "$result" -ne 124 ]]; then
            echo "::error::AFL failed for $harness (exit $result)"
            exit "$result"
          fi
          for failure_dir in "$output/default/crashes" \
            "$output/default/hangs"; do
            [[ -d "$failure_dir" ]] || continue
            finding="$(find "$failure_dir" -type f \
              ! -name README.txt -print -quit)"
            if [[ -n "$finding" ]]; then
              echo "::error::AFL finding for $harness: $finding"
              exit 1
            fi
          done
        done
      artifact_name: afl-fuzz-findings-${{ github.run_number }}
      artifact_paths: |
        /tmp/fuzz-afl-out/*/default/crashes/
        /tmp/fuzz-afl-out/*/default/hangs/
      artifact_retention_days: '30'
      summary_title: "Validate: Scheduled AFL++ Fuzzing"
      timeout_minutes: '45'
