name: Parallel Query Execution (Intra-Query) CI

# Triggered on every push / PR that touches the parallel executor sources
# or its test file.  Targets v1.7.0 (roadmap:92).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/query/parallel_executor.h'
      - 'src/query/parallel_executor.cpp'
      - 'tests/test_parallel_executor.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/parallel-query-execution-intra-query-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/query/parallel_executor.h'
      - 'src/query/parallel_executor.cpp'
      - 'tests/test_parallel_executor.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/parallel-query-execution-intra-query-ci.yml'

concurrency:
  group: parallel-query-execution-intra-query-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  parallel-executor-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Parallel Query Executor (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run ParallelExecutorTests
        run: |
          set -o pipefail
          cd build
          ctest -R ParallelExecutorTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee parallel_executor_results.txt

      # ── Broader validation via unified binary ─────────────────────────────
      - name: Run ParallelExecutor tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ParallelConfigTest*:ParallelScanTest*:ParallelHashJoinTest*:ParallelAggregateTest*" \
            --gtest_output="xml:parallel_executor_gtest.xml" \
            2>&1 | tee parallel_executor_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-executor-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/parallel_executor_results.txt
            build/parallel_executor_gtest.xml
            build/parallel_executor_gtest_output.txt
          retention-days: 30
