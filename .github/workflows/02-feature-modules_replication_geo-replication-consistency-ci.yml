name: Geo-Replication Consistency Levels CI

# Triggered on every push / PR that touches GeoReplicationManager
# sources or its test file.  Targets v1.7.0.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/replication/replication_manager.h'
      - 'src/replication/replication_manager.cpp'
      - 'tests/test_geo_replication_consistency.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_replication_geo-replication-consistency-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the GeoReplicationManager focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  Per-request consistency level
  #   AC-2  Consistency levels: STRONG, BOUNDED_STALENESS, SESSION, EVENTUAL
  #   AC-3  Automatic routing based on consistency requirements
  #   AC-4  Session tokens for read-your-writes guarantee
  #   AC-5  STRONG: Linearizable, up-to-date reads
  #   AC-6  BOUNDED_STALENESS: Stale by at most N seconds/versions
  #   AC-7  SESSION: Read-your-writes within session
  #   AC-8  EVENTUAL: No guarantee, best performance
  # ---------------------------------------------------------------------------
  geo-replication-consistency-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Geo-Replication Consistency (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev liblz4-dev libzstd-dev libsnappy-dev libprotobuf-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run GeoReplicationConsistencyFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoReplicationConsistencyFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee geo_replication_consistency_results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-replication-consistency-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/geo_replication_consistency_results.txt
          retention-days: 30
