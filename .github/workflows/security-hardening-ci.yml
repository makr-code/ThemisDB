name: Security Hardening CI

# Triggered whenever security-relevant sources or this workflow itself change.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/auth/**'
      - 'src/security/**'
      - 'src/server/api_auth_config.cpp'
      - 'src/server/auth_middleware.cpp'
      - 'include/auth/**'
      - 'include/security/**'
      - 'include/server/api_auth_config.h'
      - 'include/server/auth_middleware.h'
      - 'tests/security/**'
      - 'tests/test_jwt_validator.cpp'
      - 'tests/test_jwt_validation_hardening.cpp'
      - 'tests/test_rbac_comprehensive.cpp'
      - 'tests/test_vault_key_provider.cpp'
      - 'tests/test_vault_signing_provider_errors.cpp'
      - 'fuzz/harnesses/jwt_rbac_config_harness.cpp'
      - 'fuzz/corpus/jwt/**'
      - 'fuzz/corpus/rbac/**'
      - '.github/workflows/security-hardening-ci.yml'
  pull_request:
    paths:
      - 'src/auth/**'
      - 'src/security/**'
      - 'src/server/api_auth_config.cpp'
      - 'src/server/auth_middleware.cpp'
      - 'include/auth/**'
      - 'include/security/**'
      - 'include/server/api_auth_config.h'
      - 'include/server/auth_middleware.h'
      - 'tests/security/**'
      - 'tests/test_jwt_validator.cpp'
      - 'tests/test_jwt_validation_hardening.cpp'
      - 'tests/test_rbac_comprehensive.cpp'
      - 'tests/test_vault_key_provider.cpp'
      - 'tests/test_vault_signing_provider_errors.cpp'
      - 'fuzz/harnesses/jwt_rbac_config_harness.cpp'
      - 'fuzz/corpus/jwt/**'
      - 'fuzz/corpus/rbac/**'
      - '.github/workflows/security-hardening-ci.yml'
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# Common install step shared across jobs
# ─────────────────────────────────────────────────────────────────────────────
env:
  APT_DEPS: >-
    cmake ninja-build
    libgtest-dev libssl-dev libcurl4-openssl-dev
    libboost-all-dev libnlohmann-json3-dev
    pkg-config git

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Negative security tests across MINIMAL / COMMUNITY / ENTERPRISE editions
  # ───────────────────────────────────────────────────────────────────────────
  security-negative-tests:
    name: Security negative tests (${{ matrix.edition }} / ${{ matrix.compiler }})
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # COMMUNITY edition – GCC 12 (default edition)
          # NOTE: MINIMAL edition forces THEMIS_BUILD_TESTS=OFF, so security
          #       tests are not applicable; use the 'edition-build-check' job
          #       below to verify MINIMAL compiles correctly.
          - edition: COMMUNITY
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          # COMMUNITY edition – Clang 15
          - edition: COMMUNITY
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          # ENTERPRISE edition – GCC 12
          - edition: ENTERPRISE
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ env.APT_DEPS }} \
            ${{ matrix.cc }} ${{ matrix.cxx }}

      - name: Build GTest from source (if needed)
        run: |
          if [ ! -f /usr/lib/libgtest.a ] && \
             [ ! -f /usr/lib/x86_64-linux-gnu/libgtest.a ]; then
            cd /usr/src/gtest
            sudo cmake -DCMAKE_BUILD_TYPE=Release .
            sudo make -j$(nproc)
            sudo cp lib/*.a /usr/lib/ 2>/dev/null || true
          fi

      - name: Configure (${{ matrix.edition }} edition)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_EDITION=${{ matrix.edition }} \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -S cmake

      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      # ── Negative integration tests (required for merge) ──────────────────
      - name: Run JWT negative tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="JWTNegativeTest*:JWTValidationTest*:JWTValidatorTest*:KidRevocationTest*" \
            --gtest_output="xml:jwt_negative_results.xml" \
            2>&1 | tee jwt_negative_output.txt

      - name: Run RBAC negative tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="RBACNegativeTest*:RBACTest*:PermissionTest*:RBACBuiltinRolesTest*:RBACInheritanceTest*:RBACThreadSafetyTest*:RBACSerializationTest*" \
            --gtest_output="xml:rbac_negative_results.xml" \
            2>&1 | tee rbac_negative_output.txt

      - name: Run Vault negative tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="VaultNegativeTest*:VaultSigningProviderErrorTest*" \
            --gtest_output="xml:vault_negative_results.xml" \
            2>&1 | tee vault_negative_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-negative-results-${{ matrix.edition }}-${{ matrix.compiler }}
          path: |
            build/*_negative_results.xml
            build/*_negative_output.txt
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 2. AddressSanitizer + UndefinedBehaviorSanitizer
  # ───────────────────────────────────────────────────────────────────────────
  sanitizer-tests:
    name: Sanitizer tests (ASan + UBSan)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      CC:  clang-15
      CXX: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ env.APT_DEPS }} \
            gcc-12 g++-12 clang-15 clang++-15

      - name: Build GTest from source (if needed)
        run: |
          if [ ! -f /usr/lib/libgtest.a ] && \
             [ ! -f /usr/lib/x86_64-linux-gnu/libgtest.a ]; then
            cd /usr/src/gtest
            sudo cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=gcc-12 \
              -DCMAKE_CXX_COMPILER=g++-12 .
            sudo make -j$(nproc)
            sudo cp lib/*.a /usr/lib/ 2>/dev/null || true
          fi

      - name: Configure with ASan + UBSan
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_CXX_COMPILER=clang++-15 \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -S cmake

      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      - name: Run security tests under sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          SECURITY_FILTER="\
            JWTNegativeTest*:\
            JWTValidationTest*:\
            JWTValidatorTest*:\
            KidRevocationTest*:\
            RBACNegativeTest*:\
            RBACTest*:\
            PermissionTest*:\
            RBACBuiltinRolesTest*:\
            VaultNegativeTest*:\
            VaultSigningProviderErrorTest*"
          cd build
          ./tests/themis_tests \
            --gtest_filter="${SECURITY_FILTER}" \
            --gtest_output="xml:sanitizer_results.xml" \
            2>&1 | tee sanitizer_output.txt

      - name: Upload sanitizer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-results
          path: |
            build/sanitizer_results.xml
            build/sanitizer_output.txt
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Edition build check: verify all three editions compile without errors
  #    MINIMAL is included here because it disables THEMIS_BUILD_TESTS, so the
  #    security-negative-tests job cannot run against it; a compile-only check
  #    is sufficient to verify the MINIMAL edition doesn't regress on security
  #    source changes.
  # ───────────────────────────────────────────────────────────────────────────
  edition-build-check:
    name: Edition compile check (${{ matrix.edition }})
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        edition: [MINIMAL, COMMUNITY, ENTERPRISE]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build gcc-12 g++-12 \
            libssl-dev libcurl4-openssl-dev \
            libboost-all-dev libnlohmann-json3-dev \
            pkg-config git

      - name: Configure (${{ matrix.edition }} edition)
        env:
          CC:  gcc-12
          CXX: g++-12
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DTHEMIS_EDITION=${{ matrix.edition }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -S cmake

      - name: Build themis_core (security sources included)
        run: cmake --build build --target themis_core -- -j$(nproc)

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Static analysis with clang-tidy
  # ───────────────────────────────────────────────────────────────────────────
  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ env.APT_DEPS }} \
            clang-15 clang++-15 clang-tidy-15

      - name: Build GTest from source (if needed)
        run: |
          if [ ! -f /usr/lib/libgtest.a ] && \
             [ ! -f /usr/lib/x86_64-linux-gnu/libgtest.a ]; then
            cd /usr/src/gtest
            sudo cmake -DCMAKE_BUILD_TYPE=Release .
            sudo make -j$(nproc)
            sudo cp lib/*.a /usr/lib/ 2>/dev/null || true
          fi

      - name: Configure (generate compile_commands.json)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_CXX_COMPILER=clang++-15 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -S cmake

      - name: Run clang-tidy on security sources
        run: |
          set -o pipefail
          # Security-critical source files to analyse
          SECURITY_SOURCES=(
            src/auth/jwt_validator.cpp
            src/auth/jwks_security.cpp
            src/auth/jwt_key_rotation_manager.cpp
            src/security/rbac.cpp
            src/security/vault_key_provider.cpp
            src/security/vault_signing_provider.cpp
            src/server/auth_middleware.cpp
            src/server/api_auth_config.cpp
          )

          TIDY_FLAGS="-p build --config-file=.clang-tidy"

          for src in "${SECURITY_SOURCES[@]}"; do
            if [ -f "$src" ]; then
              echo "==> Analysing $src"
              clang-tidy-15 $TIDY_FLAGS "$src" 2>&1 | tee -a clang_tidy_output.txt
            else
              echo "SKIP (not found): $src"
            fi
          done

          # Hard-fail on clang-tidy errors; emit advisory warnings for warnings.
          if grep -q ": error:" clang_tidy_output.txt 2>/dev/null; then
            echo "::error::clang-tidy reported errors in security sources – see artifact clang-tidy-report"
            exit 1
          fi
          if grep -q ": warning:" clang_tidy_output.txt 2>/dev/null; then
            echo "::warning::clang-tidy reported warnings in security sources – review artifact clang-tidy-report"
          fi

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang_tidy_output.txt
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Fuzz smoke-test (libFuzzer, short time limit suitable for CI)
  # ───────────────────────────────────────────────────────────────────────────
  fuzz-smoke-test:
    name: Fuzz smoke test (JWT + RBAC config)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-15 clang++-15 \
            libssl-dev libcurl4-openssl-dev \
            libnlohmann-json3-dev \
            pkg-config git

      - name: Build JWT/RBAC fuzz harness with libFuzzer
        run: |
          clang++-15 -std=c++20 \
            -fsanitize=address,undefined,fuzzer \
            -fno-omit-frame-pointer \
            -O1 -g \
            -I include \
            -o fuzz_jwt_rbac \
            fuzz/harnesses/jwt_rbac_config_harness.cpp
          echo "Fuzz harness built successfully"

      - name: Run JWT fuzz corpus smoke-test (30 s)
        run: |
          # -max_total_time limits each run to 30 seconds – enough to catch
          # obvious crashes without holding the CI runner for long.
          ./fuzz_jwt_rbac \
            -max_total_time=30 \
            -max_len=4096 \
            -print_final_stats=1 \
            fuzz/corpus/jwt/ \
            2>&1 | tee fuzz_jwt_output.txt || {
              echo "::error::libFuzzer found a crash in JWT parsing – see artifact fuzz-smoke-results for crash-* files"
              exit 1
            }

      - name: Run RBAC fuzz corpus smoke-test (30 s)
        run: |
          ./fuzz_jwt_rbac \
            -max_total_time=30 \
            -max_len=4096 \
            -print_final_stats=1 \
            fuzz/corpus/rbac/ \
            fuzz/corpus/policy_engine/ \
            2>&1 | tee fuzz_rbac_output.txt || {
              echo "::error::libFuzzer found a crash in RBAC config parsing – see artifact fuzz-smoke-results for crash-* files"
              exit 1
            }

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-results
          path: |
            fuzz_jwt_output.txt
            fuzz_rbac_output.txt
            # Any crash/timeout/OOM artifacts generated by libFuzzer
            crash-*
            timeout-*
            oom-*
          retention-days: 30
