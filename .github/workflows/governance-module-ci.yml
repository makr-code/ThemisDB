name: Governance Module CI

# Validates the governance module: policy engine, GDPR/HIPAA/CCPA/CPRA/PCI-DSS/SOC 2
# compliance rules, automated data masking, data lineage, OPA integration, policy
# hot-reload, cross-tenant policy inheritance, policy versioning, and AI/ML model
# governance (v1.7.0+, Issues: #1760–#1782, #1778).
#
# Acceptance criteria covered:
#   AC-1  PolicyEngine::evaluate() returns PERMIT/DENY based on classification and roles
#   AC-2  CCPA/CPRA data subject rights enforced at query time (opt-out, right-to-delete)
#   AC-3  DataMasker applies REDACT/TOKENIZE/TRUNCATE/HASH strategies per FieldMaskingPolicy
#   AC-4  DataLineageTracker records and queries lineage events including MODEL_TRAINING
#   AC-5  PciDssRuleSet enforces cardholder data isolation and encryption requirements
#   AC-6  CrossTenantPolicyInheritance: hierarchy, cycle detection, most-restrictive-wins
#   AC-7  PolicyVersionHistory tracks changes; PolicyManagerVersioned supports rollback
#   AC-8  SOC 2 Trust Services Controls (CC6.1, CC7.2, CC8.1, A1.1, C1.1, PI1.2)
#   AC-9  PolicyTemplateManager provides built-in GDPR/HIPAA/SOC 2/least-privilege templates
#   AC-10 PolicyReview workflow: draft → review → approve/reject
#   AC-11 ModelGovernancePolicy blocks training exports of geheim/streng-geheim data

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/governance/**'
      - 'src/governance/**'
      - 'tests/test_ccpa_rules.cpp'
      - 'tests/test_compliance_reporting.cpp'
      - 'tests/test_compliance_security_governance.cpp'
      - 'tests/test_cross_tenant_policy_inheritance.cpp'
      - 'tests/test_data_lineage.cpp'
      - 'tests/test_data_masker.cpp'
      - 'tests/test_governance_compliance_time_window.cpp'
      - 'tests/test_governance_opa_adapter.cpp'
      - 'tests/test_governance_policy_hot_reload.cpp'
      - 'tests/test_governance_policy_simulation.cpp'
      - 'tests/test_governance_review_scheduler.cpp'
      - 'tests/test_http_changefeed_governance.cpp'
      - 'tests/test_http_governance.cpp'
      - 'tests/test_model_governance.cpp'
      - 'tests/test_pci_dss_rules.cpp'
      - 'tests/test_policy_review.cpp'
      - 'tests/test_policy_template.cpp'
      - 'tests/test_policy_versioning.cpp'
      - 'tests/test_soc2_controls.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/governance-module-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/governance/**'
      - 'src/governance/**'
      - 'tests/test_ccpa_rules.cpp'
      - 'tests/test_compliance_reporting.cpp'
      - 'tests/test_compliance_security_governance.cpp'
      - 'tests/test_cross_tenant_policy_inheritance.cpp'
      - 'tests/test_data_lineage.cpp'
      - 'tests/test_data_masker.cpp'
      - 'tests/test_governance_compliance_time_window.cpp'
      - 'tests/test_governance_opa_adapter.cpp'
      - 'tests/test_governance_policy_hot_reload.cpp'
      - 'tests/test_governance_policy_simulation.cpp'
      - 'tests/test_governance_review_scheduler.cpp'
      - 'tests/test_http_changefeed_governance.cpp'
      - 'tests/test_http_governance.cpp'
      - 'tests/test_model_governance.cpp'
      - 'tests/test_pci_dss_rules.cpp'
      - 'tests/test_policy_review.cpp'
      - 'tests/test_policy_template.cpp'
      - 'tests/test_policy_versioning.cpp'
      - 'tests/test_soc2_controls.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/governance-module-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Core governance unit tests: CCPA rules, data masking, data lineage, PCI-DSS,
  # cross-tenant inheritance, SOC 2 controls, policy templates, policy review,
  # compliance reporting, model governance, and multi-regulation integration.
  # ---------------------------------------------------------------------------
  governance-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Governance unit tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev
            libyaml-cpp-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── CCPA/CPRA data subject rights ─────────────────────────────────────
      - name: Run CcpaRulesFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CcpaRulesFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_ccpa_ctest.txt

      # ── Cross-tenant policy inheritance ───────────────────────────────────
      - name: Run CrossTenantPolicyInheritanceFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CrossTenantPolicyInheritanceFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_cross_tenant_ctest.txt

      # ── Data lineage tracking ──────────────────────────────────────────────
      - name: Run DataLineageFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R DataLineageFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_data_lineage_ctest.txt

      # ── Automated data masking ─────────────────────────────────────────────
      - name: Run DataMaskerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R DataMaskerFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_data_masker_ctest.txt

      # ── PCI-DSS compliance rules ───────────────────────────────────────────
      - name: Run PciDssRulesFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R PciDssRulesFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_pci_dss_ctest.txt

      # ── Policy review workflow ─────────────────────────────────────────────
      - name: Run PolicyReviewFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R PolicyReviewFocusedTests \
                --output-on-failure \
                --timeout 90 \
                2>&1 | tee governance_policy_review_ctest.txt

      # ── Policy template library ────────────────────────────────────────────
      - name: Run PolicyTemplateFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R PolicyTemplateFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_policy_template_ctest.txt

      # ── SOC 2 Trust Services Controls ─────────────────────────────────────
      - name: Run Soc2ControlsFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R Soc2ControlsFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_soc2_ctest.txt

      # ── Compliance reporting ───────────────────────────────────────────────
      - name: Run ComplianceReportingFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ComplianceReportingFocusedTests \
                --output-on-failure \
                --timeout 90 \
                2>&1 | tee governance_compliance_reporting_ctest.txt

      # ── AI/ML model governance ─────────────────────────────────────────────
      - name: Run ModelGovernanceFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ModelGovernanceFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_model_ctest.txt

      # ── Multi-regulation integration ───────────────────────────────────────
      - name: Run ComplianceSecurityGovernanceFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ComplianceSecurityGovernanceFocusedTests \
                --output-on-failure \
                --timeout 90 \
                2>&1 | tee governance_integration_ctest.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-unit-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/governance_ccpa_ctest.txt
            build/governance_cross_tenant_ctest.txt
            build/governance_data_lineage_ctest.txt
            build/governance_data_masker_ctest.txt
            build/governance_pci_dss_ctest.txt
            build/governance_policy_review_ctest.txt
            build/governance_policy_template_ctest.txt
            build/governance_soc2_ctest.txt
            build/governance_compliance_reporting_ctest.txt
            build/governance_model_ctest.txt
            build/governance_integration_ctest.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🏛️ Governance Module CI — Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Test suites: CcpaRules · CrossTenantPolicyInheritance · DataLineage ·" >> "$GITHUB_STEP_SUMMARY"
          echo "DataMasker · PciDssRules · PolicyReview · PolicyTemplate · Soc2Controls ·" >> "$GITHUB_STEP_SUMMARY"
          echo "ComplianceReporting · ModelGovernance · ComplianceSecurityGovernance" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Policy engine / hot-reload / OPA / simulation / time-window tests.
  # These were registered in earlier phases and run here as a consolidated suite.
  # ---------------------------------------------------------------------------
  governance-policy-engine-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Governance policy engine tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev
            libyaml-cpp-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Run GovernancePolicyHotReloadTests
        run: |
          set -o pipefail
          cd build
          ctest -R GovernancePolicyHotReloadTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee governance_hot_reload_ctest.txt

      - name: Run GovernanceOpaAdapterFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GovernanceOpaAdapterFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_opa_ctest.txt

      - name: Run GovernancePolicySimulationFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GovernancePolicySimulationFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_simulation_ctest.txt

      - name: Run GovernanceComplianceTimeWindowFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GovernanceComplianceTimeWindowFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_time_window_ctest.txt

      - name: Run GovernanceReviewSchedulerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GovernanceReviewSchedulerFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee governance_review_scheduler_ctest.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-policy-engine-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/governance_hot_reload_ctest.txt
            build/governance_opa_ctest.txt
            build/governance_simulation_ctest.txt
            build/governance_time_window_ctest.txt
            build/governance_review_scheduler_ctest.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🏛️ Governance Module CI — Policy Engine Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Test suites: GovernancePolicyHotReload · GovernanceOpaAdapter ·" >> "$GITHUB_STEP_SUMMARY"
          echo "GovernancePolicySimulation · GovernanceComplianceTimeWindow · GovernanceReviewScheduler" >> "$GITHUB_STEP_SUMMARY"
