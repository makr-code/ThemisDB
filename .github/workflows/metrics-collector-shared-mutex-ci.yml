name: MetricsCollector Shared Mutex CI

# Triggered on every push / PR that touches the MetricsCollector sources,
# its test file, or this workflow.
# Targets v1.8.0 (roadmap:191:observability:v1.8.0:metricscollector-upgrade-shared-mutex-for-metric-read-path).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/observability/metrics_collector.h'
      - 'src/observability/metrics_collector.cpp'
      - 'tests/test_metrics_collector.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/metrics-collector-shared-mutex-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/observability/metrics_collector.h'
      - 'src/observability/metrics_collector.cpp'
      - 'tests/test_metrics_collector.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/metrics-collector-shared-mutex-ci.yml'
  workflow_dispatch:

concurrency:
  group: metrics-collector-shared-mutex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the MetricsCollectorFocusedTests suite.
  # Tests cover all acceptance criteria for the shared_mutex upgrade:
  #   AC-1  mutex_ is std::shared_mutex (compile-time guarantee via header)
  #   AC-2  getPrometheusMetrics / getCardinalityLimit use shared_lock (read path)
  #   AC-3  record*, setGauge, observeHistogram, reset use unique_lock (write path)
  #   AC-4  16 Prometheus scrape threads + 8 write threads: no data race (TSAN)
  # ---------------------------------------------------------------------------
  metrics-collector-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: MetricsCollector tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_metrics_collector_focused

      - name: Run MetricsCollector unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex MetricsCollectorFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee metrics_collector_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-collector-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/metrics_collector_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📊 MetricsCollector shared_mutex – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "MetricsCollector: shared_mutex upgrade, read-path shared_lock, write-path unique_lock, TSAN stress test (16 scrapers + 8 writers)." >> "$GITHUB_STEP_SUMMARY"
