name: Cross-Module Performance Regression CI

# Detects cross-module performance regressions by running the CHIMERA
# benchmark suite and aggregating per-module regression summaries into a
# unified cross-module report.
#
# This workflow complements the per-module benchmark CIs
# (acceleration-benchmark-ci.yml, chimera-benchmark-ci.yml) and is designed
# to catch regressions in SHARED infrastructure that affect multiple modules
# simultaneously.
#
# • Runs on every push to main/develop and on pull requests when any
#   shared source file or benchmark infrastructure is modified.
# • On push to main the per-module baseline is updated and committed back
#   so future PRs have a fresh reference point.
# • On pull_request the workflow compares against the stored baselines
#   and fails if major (≥ 10 %) or critical (≥ 20 %) regressions exist
#   in ANY module.
# • Also runs on a weekly schedule to catch silent drift.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'include/**'
      - 'benchmarks/chimera/**'
      - 'benchmarks/baselines/chimera/**'
      - 'benchmarks/baselines/cross_module/**'
      - 'benchmarks/cross_module_regression_detector.py'
      - 'benchmarks/chimera/chimera_regression_detector.py'
      - '.github/workflows/05-quality_build_cross-module-performance-regression-ci.yml'
  schedule:
    - cron: '0 3 * * 1'   # Weekly on Monday at 03:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Run all Python-based benchmark suites, detect per-module regressions, then
  # aggregate into a cross-module report.
  # ---------------------------------------------------------------------------
  cross-module-benchmarks:
    needs: ci-scope-classifier
    name: Cross-Module Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r benchmarks/chimera/requirements.txt
          pip install pytest

      - name: Run cross-module regression detector unit tests
        run: |
          mkdir -p benchmark_results
          python3 -m pytest \
            benchmarks/tests/test_cross_module_regression_detector.py \
              external/chimera/tests/benchmarks/test_chimera_regression_detector.py \
            -v --tb=short 2>&1 | tee benchmark_results/unit_test_results.log

      # -----------------------------------------------------------------------
      # Module: chimera
      # -----------------------------------------------------------------------
      - name: Run CHIMERA benchmark harness
        run: |
          mkdir -p benchmark_results/chimera
          python3 benchmarks/chimera/run_ci_benchmarks.py \
            --output benchmark_results/chimera/results.json \
            --warmup 100 \
            --iterations 1000 \
            2>&1 | tee benchmark_results/chimera/run.log

      - name: Detect chimera regressions
        shell: bash
        run: |
          python3 benchmarks/chimera/chimera_regression_detector.py \
            --baseline benchmarks/baselines/chimera/baseline.json \
            --current  benchmark_results/chimera/results.json \
            --output   benchmark_results/chimera/regression_report.txt \
            --fail-on  none \
            --threshold-minor    5.0 \
            --threshold-major   10.0 \
            --threshold-critical 20.0 \
            2>&1 | tee benchmark_results/chimera/regression_detector.log
          # Collect exit code but don't propagate yet – the cross-module gate decides.
          echo "CHIMERA_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # Aggregate: cross-module regression report
      # -----------------------------------------------------------------------
      - name: Aggregate cross-module regression results
        shell: bash
        run: |
          MODULES_ARGS="--module chimera:benchmark_results/chimera/regression_report.json"

          python3 benchmarks/cross_module_regression_detector.py \
            ${MODULES_ARGS} \
            --output  benchmark_results/cross_module_regression_report.txt \
            --fail-on major \
            2>&1 | tee benchmark_results/cross_module_regression_detector.log
          exit "${PIPESTATUS[0]}"

      - name: Upload benchmark results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-module-benchmark-results-${{ matrix.os }}
          path: |
            benchmark_results/
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔀 Cross-Module Performance Regression CI – Benchmarks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Steps" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cross-module + chimera regression detector unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- CHIMERA benchmark harness (4 synthetic workloads)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cross-module regression aggregation (minor ≥5%, major ≥10%, critical ≥20%)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark_results/cross_module_regression_report.txt ]; then
            echo "### Cross-Module Regression Report" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            cat benchmark_results/cross_module_regression_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Update cross-module baseline on successful push to main.
  # ---------------------------------------------------------------------------
  update-baseline:
    name: Update Cross-Module Baseline
    needs: cross-module-benchmarks
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.cross-module-benchmarks.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to commit and push the updated baseline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download benchmark results artifact
        uses: actions/download-artifact@v4
        with:
          name: cross-module-benchmark-results-ubuntu-22.04
          path: benchmark_results

      - name: Rebuild chimera baseline from latest results
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone

          with open("benchmark_results/chimera/results.json") as f:
              raw = json.load(f)

          baseline = {
              "version":   open("VERSION").read().strip(),
              "branch":    "main",
              "commit":    os.environ["GITHUB_SHA"],
              "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "workloads": raw.get("workloads", {}),
          }

          os.makedirs("benchmarks/baselines/chimera", exist_ok=True)
          out = "benchmarks/baselines/chimera/baseline.json"
          with open(out, "w") as f:
              json.dump(baseline, f, indent=2)
          n = len(baseline["workloads"])
          print(f"Chimera baseline rebuilt: {out} ({n} workload(s))")
          PYEOF

      - name: Rebuild cross-module baseline snapshot
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone

          # Collect latest per-module JSON summaries into a cross-module baseline.
          modules = {}

          chimera_summary_path = "benchmark_results/chimera/regression_report.json"
          if os.path.exists(chimera_summary_path):
              with open(chimera_summary_path) as f:
                  modules["chimera"] = json.load(f)

          baseline = {
              "version":   open("VERSION").read().strip(),
              "branch":    "main",
              "commit":    os.environ["GITHUB_SHA"],
              "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "description": "Cross-module performance regression baseline.",
              "modules":   modules,
          }

          os.makedirs("benchmarks/baselines/cross_module", exist_ok=True)
          out = "benchmarks/baselines/cross_module/baseline.json"
          with open(out, "w") as f:
              json.dump(baseline, f, indent=2)
          print(f"Cross-module baseline rebuilt: {out} ({len(modules)} module(s))")
          PYEOF

      - name: Commit and push updated baselines
        shell: bash
        run: |
          git config user.name  'ThemisDB CI Bot'
          git config user.email 'bot@themisdb.local'
          git add \
            benchmarks/baselines/chimera/baseline.json \
            benchmarks/baselines/cross_module/baseline.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(cross-module): auto-update performance baselines [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Cross-module baselines committed to main."
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔀 Cross-Module Performance Regression CI – Update Baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline files updated:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`benchmarks/baselines/chimera/baseline.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`benchmarks/baselines/cross_module/baseline.json\`" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate job – all matrix legs must pass
  # ---------------------------------------------------------------------------
  benchmark-gate:
    name: Cross-Module Benchmark Gate
    needs: cross-module-benchmarks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check benchmark status
        shell: bash
        run: |
          result="${{ needs.cross-module-benchmarks.result }}"
          if [[ "$result" == "success" ]]; then
            echo "All cross-module benchmarks passed – no blocking regressions."
          elif [[ "$result" == "skipped" ]]; then
            echo "Benchmarks skipped (no relevant changes detected)."
          else
            echo "Cross-module benchmarks failed or detected blocking regressions."
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          result="${{ needs.cross-module-benchmarks.result }}"
          echo "## 🔀 Cross-Module Performance Regression CI – Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Benchmark result** | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
