name: "Security: Microsoft C++ Code Analysis"

on:
  push:
    branches: [ "develop" ]
  schedule:
    - cron: '24 20 * * 5'

concurrency:
  group: msvc-analysis-${{ github.ref }}
  cancel-in-progress: false

env:
  # Path to the CMake build directory.
  build: '${{ github.workspace }}/build'

permissions:
  contents: read

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [analyze]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Microsoft C++ code analysis"
          job-results: ${{ toJSON(needs) }}

  analyze:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore vcpkg cache
        id: restore_vcpkg_cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-downloads
            ${{ github.workspace }}/.vcpkg-binary-cache
            ${{ github.workspace }}/vcpkg_installed
          key: msvc-vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            msvc-vcpkg-${{ runner.os }}-

      - name: Print vcpkg cache status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "vcpkg cache hit: ${{ steps.restore_vcpkg_cache.outputs.cache-hit || 'unknown' }}"
          if (Test-Path "$env:GITHUB_WORKSPACE/vcpkg_installed") {
            Write-Host "vcpkg_installed restored: yes"
            Get-ChildItem "$env:GITHUB_WORKSPACE/vcpkg_installed" -Directory -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host "vcpkg_installed restored: no"
          }

      - name: Prepare vcpkg dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-WithRetry {
            param(
              [scriptblock]$Command,
              [int]$MaxAttempts = 3,
              [int]$DelaySeconds = 5
            )
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                & $Command
                return
              } catch {
                if ($attempt -eq $MaxAttempts) {
                  throw
                }
                Start-Sleep -Seconds ($DelaySeconds * $attempt)
              }
            }
          }

          git submodule sync -- vcpkg
          git submodule update --init --depth 1 vcpkg

          if (-not (Test-Path "vcpkg/scripts/buildsystems/vcpkg.cmake")) {
            throw "vcpkg submodule/toolchain missing before bootstrap."
          }

          "$env:GITHUB_WORKSPACE/vcpkg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DOWNLOADS=$env:GITHUB_WORKSPACE/.vcpkg-downloads" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE/.vcpkg-binary-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.vcpkg-downloads" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.vcpkg-binary-cache" | Out-Null

          Invoke-WithRetry -Command { & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics }
          Invoke-WithRetry -Command { & "$env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe" install zlib fmt spdlog curl cpp-httplib boost-filesystem boost-system boost-asio boost-beast boost-uuid pugixml yaml-cpp nlohmann-json lz4 snappy 'rocksdb[snappy,zlib,zstd]' --classic --triplet x64-windows --disable-metrics }

      - name: Ensure sccache is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-WithRetry {
            param(
              [scriptblock]$Command,
              [int]$MaxAttempts = 3,
              [int]$DelaySeconds = 5
            )
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                & $Command
                return
              } catch {
                if ($attempt -eq $MaxAttempts) {
                  throw
                }
                Start-Sleep -Seconds ($DelaySeconds * $attempt)
              }
            }
          }

          foreach ($tool in @('cmake')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is required for ThemisDB CMake configure but is not available on PATH."
            }
          }

          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
            choco install -y sccache --no-progress
          }

          $vcpkgLibDir = Join-Path $env:GITHUB_WORKSPACE 'vcpkg/installed/x64-windows/lib'
          $vcpkgIncludeDir = Join-Path $env:GITHUB_WORKSPACE 'vcpkg/installed/x64-windows/include'
          $hasBoostFilesystem = @(Get-ChildItem -Path $vcpkgLibDir -Filter 'boost_filesystem*.lib' -ErrorAction SilentlyContinue).Count -gt 0
          $hasBoostSystem = @(Get-ChildItem -Path $vcpkgLibDir -Filter 'boost_system*.lib' -ErrorAction SilentlyContinue).Count -gt 0
          $hasCurl = @(Get-ChildItem -Path $vcpkgLibDir -Filter 'curl*.lib' -ErrorAction SilentlyContinue).Count -gt 0
          $hasCppHttpLib = @(Get-ChildItem -Path $vcpkgLibDir -Filter 'httplib*.lib' -ErrorAction SilentlyContinue).Count -gt 0
          if (-not (Test-Path (Join-Path $vcpkgLibDir 'zlib.lib')) -or -not (Test-Path (Join-Path $vcpkgLibDir 'fmt.lib')) -or -not (Test-Path (Join-Path $vcpkgLibDir 'spdlog.lib')) -or -not (Test-Path (Join-Path $vcpkgIncludeDir 'boost/beast.hpp')) -or -not (Test-Path (Join-Path $vcpkgIncludeDir 'boost/asio.hpp')) -or -not (Test-Path (Join-Path $vcpkgIncludeDir 'boost/uuid/uuid.hpp')) -or -not (Test-Path (Join-Path $vcpkgIncludeDir 'pugixml.hpp')) -or -not (Test-Path (Join-Path $vcpkgIncludeDir 'nlohmann/json_fwd.hpp')) -or -not $hasBoostFilesystem -or -not $hasBoostSystem -or -not $hasCurl -or -not $hasCppHttpLib) {
            Invoke-WithRetry -Command { & "$env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe" install zlib fmt spdlog curl cpp-httplib boost-filesystem boost-system boost-asio boost-beast boost-uuid pugixml yaml-cpp nlohmann-json lz4 snappy 'rocksdb[snappy,zlib,zstd]' --classic --triplet x64-windows --disable-metrics }
          }

          sccache --version
          cmake --version

      - name: Configure CMake
        env:
          CMAKE_PREFIX_PATH: 'C:/msys64/usr;C:/Strawberry/perl/site/lib;C:/Strawberry/perl/vendor/lib;C:/Strawberry/perl/lib'
        run: cmake -B ${{ env.build }} -DTHEMIS_DIAGNOSTIC_MODE=ON -DTHEMIS_ALLOW_MISSING_ROCKSDB=ON

      - name: Generate docs importer source if target exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $importerProject = Join-Path '${{ env.build }}' 'import_docs_rocksdb.vcxproj'
          if (Test-Path $importerProject) {
            cmake --build ${{ env.build }} --target import_docs_rocksdb --config Debug
            if ($LASTEXITCODE -ne 0) {
              throw "Documentation importer generation failed (exit code $LASTEXITCODE)."
            }
          } else {
            Write-Host "import_docs_rocksdb target not present; skipping pre-generation."
          }

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        # Provide a unique ID to access the sarif output path
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}

      # Upload SARIF file as an Artifact to download and view
      # - name: Upload SARIF as an Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sarif-file
      #     path: ${{ steps.run-analysis.outputs.sarif }}
