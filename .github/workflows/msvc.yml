name: Microsoft C++ Code Analysis

on:
  push:
    branches: [ "develop" ]
  schedule:
    - cron: '24 20 * * 5'

concurrency:
  group: msvc-analysis-${{ github.ref }}
  cancel-in-progress: true

env:
  # Path to the CMake build directory.
  build: '${{ github.workspace }}/build'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Ensure build dependencies are available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($tool in @('cmake')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              throw "$tool is required for ThemisDB CMake configure but is not available on PATH."
            }
          }

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw "Chocolatey is required to install the missing Windows zlib dependency before configure."
          }

          if (-not (Get-ChildItem 'C:\Program Files\Git\usr\bin\zlib1.dll' -ErrorAction SilentlyContinue) -and -not (Get-ChildItem 'C:\vcpkg\installed\x64-windows\lib\zlib.lib' -ErrorAction SilentlyContinue)) {
            choco install -y zlib --no-progress
          }

          if (-not (Get-Command sccache -ErrorAction SilentlyContinue)) {
            choco install -y sccache --no-progress
          }

          sccache --version
          cmake --version

      - name: Configure CMake
        env:
          CMAKE_PREFIX_PATH: 'C:/msys64/usr;C:/Strawberry/perl/site/lib;C:/Strawberry/perl/vendor/lib;C:/Strawberry/perl/lib'
        run: cmake -B ${{ env.build }}

      # Build is not required unless generated source files are used
      # - name: Build CMake
      #   run: cmake --build ${{ env.build }}

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        # Provide a unique ID to access the sarif output path
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}

      # Upload SARIF file as an Artifact to download and view
      # - name: Upload SARIF as an Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sarif-file
      #     path: ${{ steps.run-analysis.outputs.sarif }}
