name: "Durability & Crash Recovery Tests"

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "src/storage/**"
      - "tests/test_crash_recovery_*.cpp"
      - "tests/test_wal_manifest_*.cpp"
      - "tests/test_domain_durability.cpp"
      - "CMakeLists.txt"
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Windows: Phase 1 Durability Tests (Full suite)
  windows-durability:
    name: "Windows Durability Tests"
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - build_type: Release
            test_filter: "TransactionDBDurabilityTest"
            description: "Phase 1: Basic Durability (10 tests)"
          - build_type: Release
            test_filter: "WALManifestCorruptionTest"
            description: "Phase 2: WAL/Manifest Corruption (8 tests)"
          - build_type: Release
            test_filter: "DomainDurabilityTest"
            description: "Phase 3: Domain-Specific (Vector/Graph/Geo/Timeseries)"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup vcpkg"
        uses: actions/setup-vcpkg@v1
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          appendedCacheKey: ${{ hashFiles('**/vcpkg.json') }}
          additionalCachedDirectories: ${{ github.workspace }}/vcpkg_installed

      - name: "CMake Configure (Release)"
        run: |
          cmake -S . -B build-ci `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTHEMIS_BUILD_TESTS=ON `
            -DTHEMIS_ENABLE_LLM=OFF

      - name: "Build Tests"
        run: |
          cmake --build build-ci --config ${{ matrix.build_type }} --parallel 4

      - name: "Run Durability Tests: ${{ matrix.description }}"
        run: |
          cd build-ci
          ctest -C ${{ matrix.build_type }} `
            -R "${{ matrix.test_filter }}" `
            --output-on-failure `
            --verbose `
            --timeout 600

      - name: "Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: "durability-test-results-${{ matrix.test_filter }}"
          path: |
            build-ci/Testing/
            build-ci/ctest*.log

  # Linux: Phase 1-3 Durability Tests (container-based)
  linux-durability:
    name: "Linux Durability Tests"
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/devcontainers/cpp:ubuntu-22.04
    strategy:
      matrix:
        test_phase:
          - name: "Phase 1: Basic Durability"
            filter: "TransactionDBDurabilityTest"
          - name: "Phase 2: WAL/Manifest"
            filter: "WALManifestCorruptionTest"
          - name: "Phase 3: Domain-Specific"
            filter: "DomainDurabilityTest"

    steps:
      - uses: actions/checkout@v4

      - name: "Install Dependencies"
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            libssl-dev \
            zlib1g-dev

      - name: "CMake Configure"
        run: |
          cmake -S . -B build-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_LLM=OFF

      - name: "Build Tests"
        run: cmake --build build-ci --parallel 4

      - name: "Run: ${{ matrix.test_phase.name }}"
        run: |
          cd build-ci
          ctest -R "${{ matrix.test_phase.filter }}" \
            --output-on-failure \
            --verbose \
            --timeout 600

  # Integration Test: Full CTest Suite (with durability tests)
  integration-tests:
    name: "Integration Tests (Full Suite)"
    runs-on: windows-latest
    needs: [windows-durability]
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: "Setup vcpkg"
        uses: actions/setup-vcpkg@v1

      - name: "CMake Configure"
        run: |
          cmake -S . -B build-ci `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTHEMIS_BUILD_TESTS=ON

      - name: "Build"
        run: cmake --build build-ci --config Release --parallel 4

      - name: "Run All Durability Tests"
        run: |
          cd build-ci
          ctest -C Release `
            -R "TransactionDBDurabilityTest|WALManifestCorruptionTest|DomainDurabilityTest" `
            --output-on-failure `
            --parallel 2 `
            --timeout 600

      - name: "Test Results Summary"
        run: |
          echo "=== Durability Test Summary ===" | Write-Output
          $testResults = Get-ChildItem -Path build-ci/Testing -Filter "*.log" -Recurse
          foreach ($file in $testResults) {
              Write-Output "Test: $($file.Name)"
          }

  # Quality Gates: Ensure 100% durability test pass rate
  quality-gates:
    name: "Quality Gates"
    runs-on: ubuntu-latest
    needs: [windows-durability, linux-durability]
    if: always()

    steps:
      - name: "Check Windows Test Results"
        if: ${{ needs.windows-durability.result == 'failure' }}
        run: |
          echo "❌ Windows durability tests failed!"
          exit 1

      - name: "Check Linux Test Results"
        if: ${{ needs.linux-durability.result == 'failure' }}
        run: |
          echo "❌ Linux durability tests failed!"
          exit 1

      - name: "✅ All Durability Tests Passed"
        if: success()
        run: |
          echo "✅ Phase 1-3 durability tests passed on all platforms"
          echo "✅ WAL/Manifest corruption recovery verified"
          echo "✅ Domain-specific durability validated"
          echo ""
          echo "Ready for Phase 4: CI-Gates & Feature-Flags integration"

  # Conditional LLM Tests (gated)
  llm-durability-optional:
    name: "LLM Durability Tests (Optional)"
    runs-on: windows-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        include:
          - config: "-DTHEMIS_ENABLE_LLM=ON"
            description: "LLM Enabled"

    steps:
      - uses: actions/checkout@v4

      - name: "Setup vcpkg"
        uses: actions/setup-vcpkg@v1

      - name: "CMake Configure (with LLM)"
        run: |
          cmake -S . -B build-llm `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTHEMIS_BUILD_TESTS=ON `
            ${{ matrix.config }}

      - name: "Build (LLM Enabled)"
        run: cmake --build build-llm --config Release --parallel 4

      - name: "Run LLM Durability Tests"
        run: |
          cd build-llm
          ctest -C Release `
            -R "DomainDurabilityTest.LLM" `
            --output-on-failure

  # Docker Build Integration (offline-first vcpkg)
  docker-build:
    name: "Docker Build with Durability Tests"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v2

      - name: "Build Docker Image"
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: themisdb:ci-test
          build-args: |
            VCPKG_ENABLE_ONLINE=ON
            THEMIS_BUILD_TESTS=ON

      - name: "Run Tests in Container"
        run: |
          docker run --rm themisdb:ci-test \
            ctest -C Release \
            -R "TransactionDBDurabilityTest" \
            --output-on-failure
