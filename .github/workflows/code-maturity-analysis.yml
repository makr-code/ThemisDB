name: Code Maturity Analysis & Auto-Versioning

# Runs on a weekly schedule and can be triggered manually.
# Automatic push triggers are intentionally disabled to avoid running
# this heavy analysis on every source-file change.
on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write  # Für automatischen Commit

jobs:
  analyze-and-version:
    name: Code Maturity Analysis & Auto-Versioning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Vollständige Git-Historie für Autor-Tracking

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install gitpython pyyaml

      - name: Run code maturity analysis
        env:
          MATURITY_MAX_HISTORY: '5'
        run: |
          python .github/scripts/analyze_code_maturity.py --root .

      - name: Configure Git bot user
        run: |
          git config user.name 'ThemisDB Version Bot'
          git config user.email 'bot@themisdb.local'

      - name: Commit updated files and push safely
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Auto-update: Code maturity analysis & versioning [skip ci]"
            # Fetch latest changes and rebase before pushing
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
