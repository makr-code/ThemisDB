name: Quality — Static Analysis

# Consolidated static-analysis and quality-gate workflow.
# Replaces: 08-quality_clang-tidy-analysis.yml,
#           08-quality_doxygen-coverage-gate.yml,
#           08-quality_doxygen-mermaid-mapping.yml,
#           performance-regression-check.yml

on:
  pull_request:
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
  schedule:
    # Doxygen warning gate + mermaid mapping: weekly Sunday 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      fail_on_warnings:
        description: 'clang-tidy: fail on any warning/error findings'
        type: boolean
        default: false
      fail_on_format_violations:
        description: 'clang-format: fail on style violations'
        type: boolean
        default: false

concurrency:
  group: quality-static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  DOCS_COVERAGE_THRESHOLD: "90"

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # 1. clang-tidy static analysis
  clang-tidy:
    name: clang-tidy (community-release, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run on workflow_dispatch only (expensive); schedule/PR skip unless explicitly triggered
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang clang-tidy \
            librocksdb-dev libssl-dev zlib1g-dev libzstd-dev \
            libgtest-dev pkg-config python3

      - name: Detect clang-tidy version
        id: ct_version
        run: |
          VERSION=$(clang-tidy --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "unknown")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure project (generate compile_commands.json)
        run: |
          cmake --preset community-release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_LOCAL_CLANG_TIDY=OFF

      - name: Run clang-tidy
        id: tidy
        run: |
          set -o pipefail; set +e
          find src/ include/ -type f \( -name '*.cpp' -o -name '*.cc' \) | sort \
            | xargs -P "$(nproc)" -I{} clang-tidy -p build-community-release --quiet {} 2>&1 \
            | tee clang-tidy-output.txt
          EXIT_CODE=${PIPESTATUS[2]}
          if grep -qE '^\S.*:[0-9]+:[0-9]+: (warning|error):' clang-tidy-output.txt || [ "${EXIT_CODE}" -ne 0 ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Convert output to SARIF
        run: |
          python3 .github/scripts/clang_tidy_to_sarif.py \
            clang-tidy-output.txt clang-tidy.sarif \
            --repo-root "$(pwd)" \
            --tool-version "${{ steps.ct_version.outputs.version }}"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3
        with:
          sarif_file: clang-tidy.sarif
          category: clang-tidy

      - name: Upload raw output as artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: clang-tidy-results
          path: |
            clang-tidy-output.txt
            clang-tidy.sarif
          retention-days: 14

      - name: Enforce hard gate (optional)
        if: inputs.fail_on_warnings && steps.tidy.outputs.has_findings == 'true'
        run: |
          echo "::error::clang-tidy found warnings/errors (fail_on_warnings=true)"
          exit 1

  # 2. clang-format style check
  clang-format:
    name: clang-format style check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Run clang-format check
        id: fmt
        run: |
          set -o pipefail; set +e
          find src/ include/ -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.h' -o -name '*.hpp' \) | sort \
            | xargs clang-format --dry-run --Werror 2>&1 | tee clang-format-report.txt
          EXIT_CODE=${PIPESTATUS[2]}
          if [ -s clang-format-report.txt ] || [ "${EXIT_CODE}" -ne 0 ]; then
            echo "has_violations=true" >> "$GITHUB_OUTPUT"
            echo "::warning::clang-format style violations found"
          else
            echo "has_violations=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload format report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: clang-format-results
          path: clang-format-report.txt
          retention-days: 7

      - name: Enforce hard gate (optional)
        if: inputs.fail_on_format_violations && steps.fmt.outputs.has_violations == 'true'
        run: |
          echo "::error::clang-format style violations found (fail_on_format_violations=true)"
          exit 1

  # 3. Doxygen Coverage Gate (PR gate)
  doxygen-coverage:
    name: Doxygen Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Doxygen + Python tooling
        run: |
          # coverxygen 1.8.2 crashes on enum-qualified-name extraction with Python 3.12
          python3 -m pip install --upgrade pip "coverxygen==1.8.1"
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Prepare Doxygen config for XML export
        run: |
          cp Doxyfile Doxyfile.coverage
          sed -i 's/^GENERATE_XML\s*=.*/GENERATE_XML = YES/' Doxyfile.coverage
          sed -i 's|^XML_OUTPUT\s*=.*|XML_OUTPUT = build/doxygen/xml|' Doxyfile.coverage

      - name: Build Doxygen XML
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile.coverage

      - name: Compute coverage summary
        run: |
          python3 -m coverxygen --xml-dir build/doxygen/xml --src-dir src \
            --format summary --output build/doxygen_coverage_summary.txt
          cat build/doxygen_coverage_summary.txt

      - name: Enforce minimum documentation coverage
        run: |
          CFG_THRESHOLD="$(awk -F ':' '/docs_coverage_threshold/ {gsub(/ /, "", $2); print $2; exit}' .github/ci-scope-config.yaml || true)"
          THRESHOLD="${CFG_THRESHOLD:-${DOCS_COVERAGE_THRESHOLD}}"
          python3 scripts/verify_docs.py --summary-file build/doxygen_coverage_summary.txt --threshold "${THRESHOLD}"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: doxygen-coverage
          path: |
            build/doxygen_coverage_summary.txt
            build/doxygen/xml
          retention-days: 14

  # 4. Doxygen Warning Gate & Mermaid Mapping (schedule/dispatch)
  doxygen-mermaid-mapping:
    name: Doxygen Warning Gate & Mermaid Mapping
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Run Doxygen warning gate + XML export
        run: |
          WARN_LOG="$(awk -F= '/^WARN_LOGFILE[[:space:]]*=[[:space:]]*/{print $2}' Doxyfile | xargs)"
          [ -z "${WARN_LOG}" ] && echo "WARN_LOGFILE not configured in Doxyfile" && exit 1
          mkdir -p "$(dirname "${WARN_LOG}")"
          doxygen Doxyfile
          [ -f "${WARN_LOG}" ] || { echo "Expected warning log not created: ${WARN_LOG}"; exit 1; }
          echo "Doxygen warnings: $(wc -l < "${WARN_LOG}")"
          if grep -Ein "^[^:]+:[0-9]+:[[:space:]]*error:" "${WARN_LOG}"; then
            echo "Doxygen reported parse/documentation errors"; exit 1
          fi

      - name: Generate Mermaid class/function mapping
        run: python3 scripts/generate_doxygen_mermaid_map.py

      - name: Upload Doxygen Mermaid artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: doxygen-mermaid-mapping
          path: |
            build/doxygen/doxygen-warnings.log
            build/doxygen/themisdb_doxygen_mermaid_overview.md
            build/doxygen/themisdb_class_map.mmd
            build/doxygen/themisdb_function_map.mmd
          retention-days: 14

  # 5. Performance Regression Check (PR gate)
  performance-regression:
    name: Storage sustained write regression gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build librocksdb-dev libbenchmark-dev libfmt-dev libspdlog-dev \
            nlohmann-json3-dev libboost-filesystem-dev libboost-system-dev \
            libzstd-dev libtbb-dev libcurl4-openssl-dev libyaml-cpp-dev

      - name: Configure benchmark build
        run: |
          cmake -S . -B build/perf-regression -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_CHIMERA=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DTHEMIS_ENABLE_HTTP_SERVER=OFF \
            -DTHEMIS_ENABLE_CLOUD_STORAGE=OFF \
            -DTHEMIS_ENABLE_BLOB_WEBDAV=OFF \
            -DTHEMIS_ENABLE_MIMALLOC=OFF \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build storage benchmark target
        run: cmake --build build/perf-regression --target bench_storage_performance -j"$(nproc)"

      - name: Run BM_Storage_SustainedWrite_NoSync
        run: |
          mkdir -p build/perf-regression/benchmark_results
          ./build/perf-regression/bench_storage_performance \
            --benchmark_filter='^BM_Storage_SustainedWrite_NoSync($|/)' \
            --benchmark_min_time=2.0s \
            --benchmark_format=json \
            --benchmark_out=build/perf-regression/benchmark_results/storage_sustained_write_nosync.json

      - name: Enforce Storage sustained write SLO (>= 100k ops/s)
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("build/perf-regression/benchmark_results/storage_sustained_write_nosync.json").read_text())
          threshold, measured = 100000.0, None
          for bench in data.get("benchmarks", []):
              if bench.get("name") == "BM_Storage_SustainedWrite_NoSync":
                  measured = bench.get("items_per_second")
                  break
          if measured is None:
              raise SystemExit("BM_Storage_SustainedWrite_NoSync result missing")
          if measured < threshold:
              raise SystemExit(f"SLO regression: {measured:.2f} < {threshold:.0f} ops/s")
          print(f"SLO met: {measured:.2f} ops/s")
          PY

      - name: Run performance regression detector (major threshold 10%)
        run: |
          python3 benchmarks/performance_regression_detector.py \
            --baseline benchmarks/baselines/storage/sustained_write_nosync_baseline.json \
            --current build/perf-regression/benchmark_results/storage_sustained_write_nosync.json \
            --output build/perf-regression/benchmark_results/storage_regression_report.txt \
            --fail-on major \
            --threshold-minor 5.0 \
            --threshold-major 10.0 \
            --threshold-critical 20.0

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: storage-sustained-write-regression-${{ github.run_number }}
          path: build/perf-regression/benchmark_results/
          retention-days: 14
