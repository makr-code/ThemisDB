name: RedisCacheCoordinator Async Pub/Sub CI

# Triggered on every push / PR that touches the RedisCacheCoordinator sources
# or related cache health / admin API files.  Targets v1.7.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/cache/distributed_cache_coordinator.h'
      - 'src/cache/distributed_cache_coordinator.cpp'
      - 'include/cache/redis_cache_coordinator.h'
      - 'src/cache/redis_cache_coordinator.cpp'
      - 'src/cache/adaptive_query_cache.cpp'
      - 'tests/test_distributed_cache_coordinator.cpp'
      - 'tests/test_cache_admin_api_handler.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/redis-cache-coordinator-async-loop-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/cache/distributed_cache_coordinator.h'
      - 'src/cache/distributed_cache_coordinator.cpp'
      - 'include/cache/redis_cache_coordinator.h'
      - 'src/cache/redis_cache_coordinator.cpp'
      - 'src/cache/adaptive_query_cache.cpp'
      - 'tests/test_distributed_cache_coordinator.cpp'
      - 'tests/test_cache_admin_api_handler.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/redis-cache-coordinator-async-loop-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the RedisCacheCoordinator async pub/sub focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  Exponential back-off reconnection (1s, 2s, 4s, max 30s)
  #   AC-2  cache.redis.reconnect metric emitted on each reconnect attempt
  #   AC-3  isConnected() observable via GET /v1/admin/cache/health
  #   AC-4  Windows stub replaced with THEMIS_POSIX_SOCKETS compile-time flag
  #   AC-5  Noisy WARN log on every construction downgraded to DEBUG
  # ---------------------------------------------------------------------------
  redis-cache-coordinator-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: RedisCacheCoordinator Async Pub/Sub (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev
            libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev
            libsimdjson-dev libsnappy-dev liblz4-dev

      - name: Configure (RedisCacheCoordinator test targets)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_BUILD_TESTS=ON

      - name: Build coordinator test binary
        run: |
          cmake --build build \
            --target test_distributed_cache_coordinator \
            -- -j$(nproc)

      - name: Run RedisCacheCoordinator tests
        run: |
          cd build
          ctest --test-dir . -R DistributedCacheCoordinatorTests \
                --output-on-failure --timeout 60

      - name: Build cache admin API handler test binary
        run: |
          cmake --build build \
            --target test_cache_admin_api_handler \
            -- -j$(nproc)

      - name: Run cache admin health endpoint tests
        run: |
          cd build
          ctest --test-dir . -R CacheAdminApiHandlerTests \
                --output-on-failure --timeout 60
