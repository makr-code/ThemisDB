name: "Build: Copilot Ollama Router"

# Rechenaufwand-Score: R=3 (K=3, L=3, N=3) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
on:
  push:
    paths:
      - 'tools/copilot-ollama-router/src/**/*.ts'
      - 'tools/copilot-ollama-router/src/**/*.js'
      - 'tools/copilot-ollama-router/package.json'
      - 'tools/copilot-ollama-router/package-lock.json'
      - 'tools/copilot-ollama-router/tsconfig.json'
      - 'tools/copilot-ollama-router/.mocharc.json'
      - 'tools/copilot-ollama-router/eslint.config.js'
      - '.github/workflows/build-ollama-router.yml'
  pull_request:
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'tools/copilot-ollama-router/src/**/*.ts'
      - 'tools/copilot-ollama-router/src/**/*.js'
      - 'tools/copilot-ollama-router/package.json'
      - 'tools/copilot-ollama-router/package-lock.json'
      - 'tools/copilot-ollama-router/tsconfig.json'
      - 'tools/copilot-ollama-router/.mocharc.json'
      - 'tools/copilot-ollama-router/eslint.config.js'
      - '.github/workflows/build-ollama-router.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tools/copilot-ollama-router

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Copilot Ollama Router CI"
          job-results: ${{ toJSON(needs) }}

  ci:
    name: "Build: Compile · Lint · Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6  # Node.js 24 compatible
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tools/copilot-ollama-router/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx mocha
