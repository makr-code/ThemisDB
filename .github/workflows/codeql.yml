name: "Security: CodeQL Advanced (Deprecated)"

# This workflow is intentionally kept as a no-op compatibility stub.
# The canonical CodeQL policy for this repository is defined in
# .github/workflows/security-codeql.yml. Keeping this generic template disabled
# prevents duplicate analyses and avoids GitHub best-practice drift.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deprecated-codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [deprecated-notice]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Deprecated CodeQL workflow notice"
          job-results: ${{ toJSON(needs) }}

  deprecated-notice:
    name: "Security: CodeQL - Deprecated Stub"
    runs-on: ubuntu-latest
    steps:
      - name: Explain deprecation
        shell: bash
        run: |
          echo "This repository uses the repository-scoped security-codeql.yml workflow as the active CodeQL policy."
          echo "This file is intentionally disabled to avoid duplicate CodeQL runs and PR drift."
          echo "No automatic scanning is triggered here."
