name: LLM OpenAI-Compat Adapter CI

# CI job that validates the OpenAI-compatible /v1/chat/completions adapter.
# Runs on every PR/push that touches the adapter source, header, server
# handler, or tests, ensuring that the JSON translation layer does not regress.
#
# No GPU hardware required — all tests are pure-logic tests that exercise
# OpenAICompatAdapter::parseRequest / buildResponse / buildStreamChunk without
# a running inference engine.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/llm/openai_compat_adapter.cpp'
      - 'include/llm/openai_compat_adapter.h'
      - 'src/server/llm_api_handler.cpp'
      - 'tests/llm/test_openai_compat_adapter.cpp'
      - '.github/workflows/llm-openai-compat-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/llm/openai_compat_adapter.cpp'
      - 'include/llm/openai_compat_adapter.h'
      - 'src/server/llm_api_handler.cpp'
      - 'tests/llm/test_openai_compat_adapter.cpp'
      - '.github/workflows/llm-openai-compat-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  llm-openai-compat:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_llm_changes == 'true'
    name: LLM OpenAI-Compat Adapter Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgtest-dev \
            pkg-config

      - name: Configure CMake (CPU only, LLM enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_ENABLE_LLM=ON \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_BUILD_TESTS=ON

      - name: Build OpenAI-compat adapter test
        run: cmake --build build --target themisdb_tests -j$(nproc)

      - name: Run OpenAI-compat adapter tests
        run: |
          cd build
          ctest --output-on-failure -R "OpenAICompat"

      - name: Write job summary
        if: always()
        run: |
          echo "## 🤖 LLM OpenAI-Compat Adapter CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Build type** | Release (CPU only, CUDA=OFF) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test filter** | \`OpenAICompatAdapter\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates \`src/llm/openai_compat_adapter.cpp\` JSON translation layer (no GPU hardware required)." >> "$GITHUB_STEP_SUMMARY"
