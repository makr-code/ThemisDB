name: "Reusable: Docker Image Platform Build"

on:
  workflow_call:
    inputs:
      edition:
        description: Public edition to build (COMMUNITY or MINIMAL)
        required: false
        default: COMMUNITY
        type: string
      platform:
        description: "Target platform to build (linux/amd64 or linux/arm64)"
        required: true
        type: string
      version:
        description: "Canonical product version from release workflow"
        required: true
        type: string
      tag_list:
        description: "Comma-separated final image tags used for manifest creation"
        required: false
        default: ""
        type: string
      registry:
        description: "Selected target registry for final publish"
        required: false
        default: "ghcr.io"
        type: string
      push_to_registry:
        description: "Push the platform image digest to the registry"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Build and validate without logging into or publishing to any registry"
        required: false
        default: false
        type: boolean
      include_tinyllama:
        description: "Whether an LLM model should be included in the Docker image"
        required: false
        default: true
        type: boolean
      llm_model:
        description: "LLM preset to bundle (tinyllama, qwen2.5-coder-7b-instruct, llama-3.2-3b-instruct, custom)"
        required: false
        default: "tinyllama"
        type: string
      llm_model_url:
        description: "Optional direct Hugging Face or model URL for an alternate GGUF"
        required: false
        default: ""
        type: string
      llm_model_file:
        description: "Optional output model filename used for cache reuse and artifact naming"
        required: false
        default: ""
        type: string
      tinyllama_force_download:
        description: "Whether the selected model should be redownloaded during build"
        required: false
        default: false
        type: boolean
      source_run_id:
        description: "The originating GitHub Actions run ID"
        required: false
        default: ""
        type: string
      source_sha:
        description: "The originating commit SHA"
        required: false
        default: ""
        type: string
      override_docker_source_preflight:
        description: "Skip Docker source regression checks only after manually reviewing the selected source; build, security and runtime gates still apply"
        required: false
        default: false
        type: boolean
    outputs:
      digest:
        description: "The pushed digest for this platform"
        value: ${{ jobs.build.outputs.digest }}
      platform_tag:
        description: "The canonical per-platform tag used for the temporary image"
        value: ${{ jobs.build.outputs.platform_tag }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: docker-platform-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [prepare-llm-model-cache, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Reusable Docker platform build"
          job-results: ${{ toJSON(needs) }}

  prepare-llm-model-cache:
    if: ${{ inputs.include_tinyllama == true || inputs.include_tinyllama == 'true' }}
    uses: ./.github/workflows/reusable-llm-model-cache.yml
    with:
      include_tinyllama: ${{ inputs.include_tinyllama }}
      llm_model: ${{ inputs.llm_model || 'tinyllama' }}
      llm_model_url: ${{ inputs.llm_model_url || '' }}
      llm_model_file: ${{ inputs.llm_model_file || '' }}
      tinyllama_force_download: ${{ inputs.tinyllama_force_download }}
      cache_key_suffix: ${{ github.ref_name || github.sha }}

  build:
    environment: ${{ inputs.push_to_registry && !inputs.dry_run && 'docker-production' || 'docker-validation' }}
    needs: [prepare-llm-model-cache]
    if: >-
      always() && (
        needs.prepare-llm-model-cache.result == 'success' ||
        needs.prepare-llm-model-cache.result == 'skipped'
      )
    name: "Build: Docker ${{ inputs.platform }}"
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    outputs:
      digest: ${{ steps.build-candidate.outputs.digest }}
      platform_tag: ${{ steps.platform-tag.outputs.value }}
    steps:
      - name: Guard platform build budget
        shell: bash
        run: |
          set -euo pipefail
          echo "Platform build budget: 180 minutes"
          echo "Target platform: ${{ inputs.platform }}"
          echo "This job is intentionally capped below the GitHub-hosted 6h hard-stop so failures surface quickly and deterministically."

      - name: Enforce bundled LLM requirement for packaging
        shell: bash
        run: |
          set -euo pipefail
          INCLUDE_TINYLLAMA='${{ inputs.include_tinyllama }}'
          if [[ "${INCLUDE_TINYLLAMA}" != "true" && "${INCLUDE_TINYLLAMA}" != "True" && "${INCLUDE_TINYLLAMA}" != "1" ]]; then
            echo "::error::Packaging and deployment require a bundled LLM model (TinyLlama or another model). Set include_tinyllama=true."
            exit 1
          fi
          echo "Bundled model enabled: ${INCLUDE_TINYLLAMA}"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Enforce public edition boundary
        shell: bash
        env:
          EDITION: ${{ inputs.edition }}
        run: |
          set -euo pipefail
          case "$EDITION" in
            COMMUNITY|MINIMAL) ;;
            *) echo "::error::Private editions cannot use the public Docker delivery workflow."; exit 1 ;;
          esac

      - name: Validate Dockerfile model-case syntax
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*;[^;]' docker/Dockerfile.unified >/tmp/invalid-case-terminators.txt; then
            printf '%s\n' "::error::Invalid shell case terminator found in docker/Dockerfile.unified (found a single ';' where ';;' is required)."
            cat /tmp/invalid-case-terminators.txt
            exit 1
          fi
          awk '
            /^RUN --mount=type=cache,id=llm-model-cache-\$\{TARGETARCH\},target=\/opt\/themis-models \\/ { in_block=1 }
            in_block { print }
            in_block && /^# =+/ { exit }
          ' docker/Dockerfile.unified \
            | sed '/^# =\+/,$d' \
            | sed 's/[[:space:]]*\\$//' \
            > /tmp/llm-model-provisioning.sh
          if ! /bin/sh -n /tmp/llm-model-provisioning.sh; then
            printf '%s\n' "::error::Shell syntax check failed for Dockerfile model provisioning block."
            sed -n '1,120p' /tmp/llm-model-provisioning.sh
            exit 1
          fi

      - name: Validate Docker vcpkg bootstrap architecture
        if: ${{ inputs.platform == 'linux/arm64' && (inputs.push_to_registry || inputs.dry_run) }}
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          THEMIS_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$WORKFLOW_SHA"
          VALIDATOR="$(mktemp "${RUNNER_TEMP}/docker-vcpkg-bootstrap-XXXXXX.py")"
          trap 'rm -f "$VALIDATOR"' EXIT
          git show "${WORKFLOW_SHA}:tests/test_docker_runtime_package_regressions.py" > "$VALIDATOR"
          python3 "$VALIDATOR" DockerRuntimePackageRegressionTests.test_vcpkg_bootstrap_supports_native_arm64 -v

      - name: Validate Docker dependency providers and runtime packages
        if: ${{ !inputs.override_docker_source_preflight }}
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          THEMIS_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # The selected source may predate the workflow's regression validator.
          git fetch --no-tags origin "$WORKFLOW_SHA"
          VALIDATOR="$(mktemp "${RUNNER_TEMP}/docker-runtime-packages-XXXXXX.py")"
          git show "${WORKFLOW_SHA}:tests/test_docker_runtime_package_regressions.py" > "$VALIDATOR"
          python3 "$VALIDATOR" -v

      - name: Report Docker source preflight override
        if: ${{ inputs.override_docker_source_preflight }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          echo "::warning::Docker source regression checks were explicitly skipped for ${RELEASE_VERSION} (${SOURCE_SHA}) on ${PLATFORM}. This source may fail to build or produce a broken image on this platform; the selected source commit was not changed. Docker syntax, vcpkg bootstrap architecture, edition boundary, build, Trivy and final runtime smoke gates still apply."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - name: Log in to Docker Hub
        if: |
          (inputs.push_to_registry == true || inputs.push_to_registry == 'true') && !inputs.dry_run && (
            github.event_name == 'release' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_registry == 'true' && github.event.inputs.registry == 'docker.io') ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_registry == 'true' && github.event.inputs.registry == 'both') ||
            (github.event_name == 'workflow_call' && (inputs.push_to_registry == true || inputs.push_to_registry == 'true') && (inputs.registry == 'docker.io' || inputs.registry == 'both'))
          )
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (OIDC)
        if: inputs.push_to_registry && !inputs.dry_run
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p internal llama.cpp models
          touch internal/.gitkeep models/.gitkeep
          git submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF
          git submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF
          mkdir -p vcpkg/downloads

          test -f vcpkg/scripts/buildsystems/vcpkg.cmake
          test -f whisper.cpp/CMakeLists.txt
          test -f stable-diffusion.cpp/CMakeLists.txt
          test -e ffmpeg
          test -e external/GIUF

          if [ ! -f llama.cpp/CMakeLists.txt ]; then
            LLAMA_CPP_GIT_TAG="$(perl -ne 'print "$1\n" if /set\s*\(\s*LLAMA_CPP_GIT_TAG\s+\"([^\"]+)\"/' cmake/Dependencies.cmake | head -n 1)"
            if [ -z "${LLAMA_CPP_GIT_TAG}" ]; then
              echo "::error::Unable to determine LLAMA_CPP_GIT_TAG from cmake/Dependencies.cmake"
              exit 1
            fi

            echo "Fetching llama.cpp at pinned revision ${LLAMA_CPP_GIT_TAG}"
            rm -rf llama.cpp
            if [[ "${LLAMA_CPP_GIT_TAG}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              git clone --filter=blob:none --no-checkout https://github.com/ggerganov/llama.cpp.git llama.cpp
              git -C llama.cpp checkout "${LLAMA_CPP_GIT_TAG}"
              ACTUAL_LLAMA_CPP_COMMIT="$(git -C llama.cpp rev-parse HEAD)"
              if [[ ! "${ACTUAL_LLAMA_CPP_COMMIT}" == "${LLAMA_CPP_GIT_TAG}"* ]]; then
                echo "::error::llama.cpp checkout mismatch: expected prefix ${LLAMA_CPP_GIT_TAG}, got ${ACTUAL_LLAMA_CPP_COMMIT}"
                exit 1
              fi
            else
              git clone --depth 1 --branch "${LLAMA_CPP_GIT_TAG}" https://github.com/ggerganov/llama.cpp.git llama.cpp
              ACTUAL_LLAMA_CPP_TAG="$(git -C llama.cpp describe --tags --exact-match HEAD 2>/dev/null || true)"
              if [ "${ACTUAL_LLAMA_CPP_TAG}" != "${LLAMA_CPP_GIT_TAG}" ]; then
                echo "::error::llama.cpp checkout mismatch: expected tag ${LLAMA_CPP_GIT_TAG}, got ${ACTUAL_LLAMA_CPP_TAG:-<none>}"
                exit 1
              fi
            fi
          fi

          mkdir -p llama.cpp/models
          touch llama.cpp/models/.gitkeep
          test -f llama.cpp/CMakeLists.txt

      - name: Detect host CA bundle
        id: host-ca
        shell: bash
        run: |
          set -euo pipefail
          CA_BUNDLE_PATH="$(python3 -c 'import ssl; print(ssl.get_default_verify_paths().cafile or "")' 2>/dev/null || true)"
          if [ -z "${CA_BUNDLE_PATH}" ] || [ ! -f "${CA_BUNDLE_PATH}" ]; then
            echo "::error::Unable to locate host CA bundle via python3 ssl defaults"
            exit 1
          fi
          echo "path=${CA_BUNDLE_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Compute platform tag
        id: platform-tag
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM_TAG="$(echo '${{ inputs.platform }}' | tr '/:' '-' | tr '[:upper:]' '[:lower:]')"
          echo "value=${PLATFORM_TAG}" >> "${GITHUB_OUTPUT}"
          echo "Platform tag: ${PLATFORM_TAG}"

      - name: Compute cache scopes
        id: cache-scope
        shell: bash
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | tr '/: ' '-' | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-'
          }
          PLATFORM_SCOPE="$(sanitize "${{ inputs.platform }}")"
          MODEL_SCOPE="$(sanitize "${{ inputs.llm_model || 'tinyllama' }}")"
          REF_SCOPE="$(sanitize "${{ github.ref_name || 'detached' }}")"
          echo "shared=themisdb-docker-unified-${PLATFORM_SCOPE}-${MODEL_SCOPE}" >> "${GITHUB_OUTPUT}"
          echo "lane=themisdb-docker-unified-${PLATFORM_SCOPE}-${MODEL_SCOPE}-${REF_SCOPE}" >> "${GITHUB_OUTPUT}"

      - name: Reuse prepared model cache in build context
        if: ${{ inputs.include_tinyllama == true || inputs.include_tinyllama == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          MODEL_DIR="${{ github.workspace }}/.cache/themis-llm-models"
          mkdir -p "${MODEL_DIR}"
          if [[ -n "${{ inputs.llm_model_file || '' }}" ]]; then
            MODEL_FILE="${{ inputs.llm_model_file }}"
          else
            MODEL_FILE="${{ inputs.llm_model || 'tinyllama' }}.gguf"
          fi
          if [[ -f "${MODEL_DIR}/${MODEL_FILE}" ]]; then
            mkdir -p ./models
            cp -f "${MODEL_DIR}/${MODEL_FILE}" "./models/${MODEL_FILE}"
            echo "Injected cached model into Docker context: ./models/${MODEL_FILE}"
          else
            echo "No reusable model cache found for ${MODEL_FILE}; Docker build will fetch it itself."
          fi

      - name: Build platform image once for local scan and optional registry push
        id: build-candidate
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # v6.9.0
        with:
          context: .
          file: ./docker/Dockerfile.unified
          target: runtime
          pull: false
          secret-files: |
            extra_ca_bundle=${{ steps.host-ca.outputs.path }}
          load: ${{ ! ((inputs.push_to_registry == true || inputs.push_to_registry == 'true') && !inputs.dry_run) }}
          push: ${{ (inputs.push_to_registry == true || inputs.push_to_registry == 'true') && !inputs.dry_run }}
          platforms: ${{ inputs.platform }}
          provenance: ${{ (inputs.push_to_registry == true || inputs.push_to_registry == 'true') && !inputs.dry_run }}
          sbom: ${{ (inputs.push_to_registry == true || inputs.push_to_registry == 'true') && !inputs.dry_run }}
          tags: ghcr.io/${{ github.repository_owner }}/themisdb:${{ github.run_number }}-${{ steps.platform-tag.outputs.value }}
          build-args: |
            THEMIS_EDITION=${{ inputs.edition }}
            VERSION=${{ inputs.version }}
            VCPKG_MANIFEST_HASH=${{ hashFiles('docker/vcpkg-*.json', 'vcpkg-configuration.json', 'ports/**') }}
            INCLUDE_TINYLLAMA=${{ inputs.include_tinyllama && 'ON' || 'OFF' }}
            LLM_MODEL=${{ inputs.llm_model || 'tinyllama' }}
            LLM_MODEL_URL=${{ inputs.llm_model_url || '' }}
            LLM_MODEL_FILE=${{ inputs.llm_model_file || '' }}
            TINYLLAMA_FORCE_DOWNLOAD=${{ inputs.tinyllama_force_download && '1' || '0' }}
          cache-from: |
            type=gha,scope=${{ steps.cache-scope.outputs.shared }}
            type=gha,scope=${{ steps.cache-scope.outputs.lane }}
          cache-to: |
            type=gha,mode=max,scope=${{ steps.cache-scope.outputs.shared }}
            type=gha,mode=max,scope=${{ steps.cache-scope.outputs.lane }}

      - name: Pull pushed image locally for release-gate scan
        if: inputs.push_to_registry && !inputs.dry_run
        shell: bash
        env:
          REGISTRY_TAG: ghcr.io/${{ github.repository_owner }}/themisdb:${{ github.run_number }}-${{ steps.platform-tag.outputs.value }}
        run: |
          set -euo pipefail
          docker pull "${REGISTRY_TAG}"
          docker image inspect "${REGISTRY_TAG}" >/dev/null 2>&1 || {
            echo "::error::Image ${REGISTRY_TAG} not found locally after push; cannot run Trivy release gate scan."
            exit 1
          }

      - name: Trivy vulnerability scan
        if: inputs.push_to_registry || inputs.dry_run
        shell: bash
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/themisdb:${{ github.run_number }}-${{ steps.platform-tag.outputs.value }}
        run: |
          set -euo pipefail
          echo "Scanning image ${IMAGE_REF} for HIGH/CRITICAL OS and library vulns"
          IMAGE_TAR="${RUNNER_TEMP}/release-gate-image-${{ steps.platform-tag.outputs.value }}.tar"
          docker image inspect "${IMAGE_REF}" >/dev/null 2>&1 || {
            echo "::error::Image ${IMAGE_REF} not found locally; cannot run Trivy release gate scan."
            exit 1
          }
          docker save "${IMAGE_REF}" -o "${IMAGE_TAR}"
          if [ ! -s "${IMAGE_TAR}" ]; then
            echo "::error::Failed to export ${IMAGE_REF} to ${IMAGE_TAR}; cannot run Trivy release gate scan."
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          docker run --rm \
            -v "${IMAGE_TAR}:/tmp/image.tar:ro" \
            -v "${RUNNER_TEMP}/trivy-cache:/tmp/trivy-cache" \
            aquasec/trivy:0.64.0 \
            image \
            --input /tmp/image.tar \
            --cache-dir /tmp/trivy-cache \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format table \
            --exit-code 1

      - name: Validate final image runtime without build-host libraries
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/themisdb:${{ github.run_number }}-${{ steps.platform-tag.outputs.value }}
          IMAGE_DIGEST: ${{ steps.build-candidate.outputs.digest }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$WORKFLOW_SHA"
          VALIDATOR="${RUNNER_TEMP}/runtime_smoke_gate.py"
          git show "${WORKFLOW_SHA}:scripts/release/runtime_smoke_gate.py" > "$VALIDATOR"
          git show "${WORKFLOW_SHA}:scripts/release/validate_runtime_payload.py" > "${RUNNER_TEMP}/validate_runtime_payload.py"
          if [[ -n "$IMAGE_DIGEST" ]]; then
            IMAGE_REF="${IMAGE_REF}@${IMAGE_DIGEST}"
          fi
          python3 "$VALIDATOR" --image "$IMAGE_REF" \
            --output "${RUNNER_TEMP}/runtime-smoke-${{ steps.platform-tag.outputs.value }}.json"

      - name: Upload runtime dependency and startup evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: docker-runtime-smoke-${{ steps.platform-tag.outputs.value }}-${{ github.run_number }}
          path: ${{ runner.temp }}/runtime-smoke-${{ steps.platform-tag.outputs.value }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write digest artifact
        if: (inputs.push_to_registry == true || inputs.push_to_registry == 'true') && !inputs.dry_run
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build-candidate.outputs.digest }}"
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/themisdb:${{ github.run_number }}-${{ steps.platform-tag.outputs.value }}@${DIGEST}"
          echo "${IMAGE_REF}" > "docker-digest-${{ steps.platform-tag.outputs.value }}.txt"
          echo "Platform digest ref: ${IMAGE_REF}"

      - name: Upload platform digest
        if: (inputs.push_to_registry == true || inputs.push_to_registry == 'true') && !inputs.dry_run
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: docker-digest-${{ steps.platform-tag.outputs.value }}
          path: docker-digest-${{ steps.platform-tag.outputs.value }}.txt
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Print build result
        if: always()
        shell: bash
        run: |
          echo "──────────────────────────────────────────────"
          echo "  Docker platform build complete"
          echo "  Version   : ${{ inputs.version }}"
          echo "  Platform  : ${{ inputs.platform }}"
          echo "  Digest    : ${{ steps.build-candidate.outputs.digest || 'not pushed' }}"
          echo "──────────────────────────────────────────────"
