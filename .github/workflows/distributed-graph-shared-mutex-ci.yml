name: DistributedGraphManager Shared Mutex CI

# Triggered on every push / PR that touches the DistributedGraphManager sources,
# its test file, or this workflow.
# Targets v1.8.0 (roadmap:graph:v1.8.0:distributed-graph-manager-read-path-lock-upgrade).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/graph/distributed_graph.h'
      - 'src/graph/distributed_graph.cpp'
      - 'tests/test_graph_distributed.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/distributed-graph-shared-mutex-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/graph/distributed_graph.h'
      - 'src/graph/distributed_graph.cpp'
      - 'tests/test_graph_distributed.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/distributed-graph-shared-mutex-ci.yml'
  workflow_dispatch:

concurrency:
  group: distributed-graph-shared-mutex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the DistributedGraphSharedMutexFocusedTests suite.
  # Tests cover all acceptance criteria for the shared_mutex upgrade:
  #   AC-1  shards_mutex_ is std::shared_mutex (compile-time guarantee via header)
  #   AC-2  shardIds, shardCount, healthyShards, resolveShardForVertex use shared_lock
  #   AC-3  addShard, removeShard use unique_lock (exclusive write path)
  #   AC-4  8 concurrent reader threads + 1 writer thread: no data race (TSAN)
  # ---------------------------------------------------------------------------
  distributed-graph-shared-mutex-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: DistributedGraphManager shared_mutex (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_graph_distributed_shared_mutex_focused

      - name: Run DistributedGraphManager shared_mutex tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex DistributedGraphSharedMutexFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee distributed_graph_shared_mutex_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-graph-shared-mutex-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/distributed_graph_shared_mutex_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔗 DistributedGraphManager shared_mutex – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "DistributedGraphManager: shared_mutex upgrade, read-path shared_lock (shardIds/shardCount/healthyShards/resolveShardForVertex), write-path unique_lock (addShard/removeShard), TSAN stress test (8 readers + 1 writer)." >> "$GITHUB_STEP_SUMMARY"
