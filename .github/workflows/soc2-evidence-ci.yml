name: Compliance — SOC 2 Type II Automated Evidence Export

# Phase 6.2: Weekly SOC 2 Type II evidence collection.
# Triggers the SecurityEvidenceCollector via the admin REST endpoint,
# validates the bundle signature, and stores the evidence as a GitHub
# Actions artifact.

on:
  schedule:
    # Weekly on Friday 23:00 UTC (end of business week)
    - cron: '0 23 * * 5'
  workflow_dispatch:
    inputs:
      evidence_window_days:
        description: 'Evidence window in days (default: 7)'
        required: false
        default: '7'

permissions:
  contents: read
  security-events: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Evidence export and validation
  # ──────────────────────────────────────────────────────────────────────────
  evidence-export:
    name: SOC 2 Evidence Export
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    env:
      EVIDENCE_WINDOW_DAYS: ${{ github.event.inputs.evidence_window_days || '7' }}
      THEMIS_ADMIN_ENDPOINT: 'https://localhost:8443'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Start ThemisDB in evidence-export mode ────────────────────────────
      - name: Start ThemisDB container
        run: |
          docker compose -f docker-compose.yml up -d themisdb
          for i in $(seq 1 30); do
            if curl -sk "${THEMIS_ADMIN_ENDPOINT}/v1/health" | grep -q "ok"; then
              echo "ThemisDB ready"
              break
            fi
            sleep 2
          done

      # ── Run evidence export script ─────────────────────────────────────────
      - name: Export SOC 2 evidence bundle
        run: |
          chmod +x scripts/soc2-evidence-export.sh
          bash scripts/soc2-evidence-export.sh \
            --endpoint "${THEMIS_ADMIN_ENDPOINT}" \
            --window-days "${EVIDENCE_WINDOW_DAYS}" \
            --output evidence-bundle-$(date +%Y%m%d).json \
            --admin-token "${SOC2_EXPORT_TOKEN}"
        env:
          SOC2_EXPORT_TOKEN: ${{ secrets.SOC2_EXPORT_TOKEN }}

      # ── Validate bundle signature ─────────────────────────────────────────
      - name: Validate evidence bundle signature
        run: |
          BUNDLE_FILE="evidence-bundle-$(date +%Y%m%d).json"
          if [ -f "${BUNDLE_FILE}" ]; then
            # Verify bundle integrity using the ManifestSigner public key
            # (The private key is held by the compliance HSM)
            python3 scripts/verify-evidence-bundle.py "${BUNDLE_FILE}"
          else
            echo "No bundle file generated — evidence export may have failed"
            exit 1
          fi

      # ── Upload evidence bundle ────────────────────────────────────────────
      - name: Upload evidence bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soc2-evidence-${{ github.run_id }}-${{ github.run_number }}
          path: evidence-bundle-*.json
          retention-days: 365  # SOC 2 evidence retained for audit purposes

      - name: Stop ThemisDB container
        if: always()
        run: docker compose -f docker-compose.yml down --volumes
