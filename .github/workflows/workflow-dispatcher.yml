name: "🚀 Workflow Dispatcher (Universal)"

# ---------------------------------------------------------------------------
# PURPOSE
# -------
# GitHub Actions only surfaces `workflow_dispatch` triggers in the Web UI and
# the GitHub App for workflows located **directly** in `.github/workflows/`.
# Workflows in subdirectories (e.g. 02-feature-modules/…) are invisible to
# the manual-trigger UI even when they declare `on: workflow_dispatch`.
#
# This root-level dispatcher solves the problem: it accepts the relative path
# to any subdirectory workflow and triggers it via the GitHub REST API, making
# all 216 workflows reachable from the Actions tab without moving files.
#
# USAGE
# -----
# 1. Go to Actions → "🚀 Workflow Dispatcher (Universal)" → Run workflow.
# 2. Fill in the fields:
#    - workflow   – path relative to .github/workflows/
#                   e.g. "03-editions/edition-community-ci.yml"
#    - ref        – branch, tag, or SHA to run the workflow on (default: main)
#    - inputs_json – optional JSON object with workflow inputs
#                   e.g. '{"version":"1.9.0"}' or '{"dry_run":"true"}'
# 3. Click "Run workflow".
#
# ALTERNATIVE: GitHub CLI
# -----------------------
#   gh workflow run "03-editions/edition-community-ci.yml" \
#     --repo makr-code/ThemisDB \
#     --ref main
#
#   gh workflow run "04-release/create-release-archive.yml" \
#     --repo makr-code/ThemisDB \
#     --ref main \
#     --field version=1.9.0
#
# NOTE
# ----
# For workflows with named inputs, dedicated root-level trigger files also
# exist for a better input UI:
#
#   Release:
#     - release-create-archive.yml        → 04-release/create-release-archive.yml
#     - release-bootstrap-branches.yml    → 04-release/bootstrap-release-branches.yml
#     - release-dockerhub-publish.yml     → 04-release/dockerhub-publish-on-release.yml
#     - release-publish-enterprise.yml    → 04-release/publish-enterprise.yml
#     - release-publish-hyperscaler.yml   → 04-release/publish-hyperscaler.yml
#
#   Maintenance:
#     - maintenance-sync-roadmap.yml           → 08-maintenance/sync-roadmap-issues.yml
#     - maintenance-sync-milestones.yml        → 08-maintenance/sync-milestones.yml
#     - maintenance-label-governance.yml       → 08-maintenance/github_workflows_label-governance.yml
#     - maintenance-add-doc-metadata.yml       → 08-maintenance/add-doc-metadata.yml
#     - maintenance-code-maturity-analysis.yml → 08-maintenance/code-maturity-analysis.yml
#
#   Core:
#     - core-ci-scope-classifier.yml      → 01-core/ci-scope-classifier.yml
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: >
          Workflow path relative to .github/workflows/
          (e.g. "03-editions/edition-community-ci.yml")
        required: true
        type: string
      ref:
        description: "Branch, tag, or SHA to run the workflow on"
        required: false
        default: "main"
        type: string
      inputs_json:
        description: >
          Workflow inputs as a JSON object (optional).
          Example: {"version":"1.9.0"} or {"dry_run":"true","mode":"preview"}
          Leave as {} if the target workflow has no inputs.
        required: false
        default: "{}"
        type: string

permissions:
  actions: write

jobs:
  dispatch:
    name: "Dispatch › ${{ inputs.workflow }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          WORKFLOW="${{ inputs.workflow }}"
          INPUTS='${{ inputs.inputs_json }}'

          # Workflow path must end with .yml or .yaml
          if [[ ! "$WORKFLOW" =~ \.(yml|yaml)$ ]]; then
            echo "::error::workflow input must end with .yml or .yaml (got: '$WORKFLOW')"
            exit 1
          fi

          # inputs_json must be valid JSON
          if ! echo "$INPUTS" | jq empty 2>/dev/null; then
            echo "::error::inputs_json is not valid JSON: $INPUTS"
            exit 1
          fi

          echo "✅ Inputs validated"
          echo "   workflow : $WORKFLOW"
          echo "   ref      : ${{ inputs.ref }}"
          echo "   inputs   : $INPUTS"

      - name: Dispatch workflow via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_PATH=".github/workflows/${{ inputs.workflow }}"
          REF="${{ inputs.ref }}"
          INPUTS='${{ inputs.inputs_json }}'

          # Build the JSON request body
          # If inputs_json is empty or {}, omit the inputs key (cleaner API call)
          if [ "$INPUTS" = "{}" ] || [ -z "$INPUTS" ]; then
            BODY=$(jq -n --arg ref "$REF" '{ref: $ref}')
          else
            BODY=$(jq -n --arg ref "$REF" --argjson inputs "$INPUTS" \
              '{ref: $ref, inputs: $inputs}')
          fi

          # URL-encode the workflow file path for the API endpoint
          ENCODED=$(python3 -c \
            "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" \
            "$WORKFLOW_PATH")

          echo "📡 POST /repos/${{ github.repository }}/actions/workflows/${ENCODED}/dispatches"
          echo "   Body: $BODY"

          HTTP_STATUS=$(curl -s -o /tmp/api_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${ENCODED}/dispatches" \
            -d "$BODY")

          if [ "$HTTP_STATUS" -eq 204 ]; then
            echo "✅ Workflow dispatched successfully (HTTP 204)."
          else
            echo "::error::GitHub API returned HTTP $HTTP_STATUS"
            cat /tmp/api_response.json
            exit 1
          fi

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🚀 Workflow Dispatcher" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Workflow** | \`.github/workflows/${{ inputs.workflow }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Inputs** | \`${{ inputs.inputs_json }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The dispatched workflow will appear as a new run under" >> "$GITHUB_STEP_SUMMARY"
          echo "\`.github/workflows/${{ inputs.workflow }}\` in the Actions tab." >> "$GITHUB_STEP_SUMMARY"
