name: "🚀 Workflow Dispatcher (Universal)"

# ---------------------------------------------------------------------------
# PURPOSE
# -------
# A convenience dispatcher that triggers any workflow by filename via the
# GitHub REST API. All 220 workflow files now live directly in
# `.github/workflows/` using a `{category}_{subcategory}_{name}.yml` naming
# convention for logical grouping (e.g. `02-feature-modules_llm_cot-tracer-ci.yml`).
#
# USAGE
# -----
# 1. Go to Actions → "🚀 Workflow Dispatcher (Universal)" → Run workflow.
# 2. Fill in the fields:
#    - workflow   – filename in .github/workflows/ (no subdirectory prefix)
#                   e.g. "03-editions_edition-community-ci.yml"
#    - ref        – branch, tag, or SHA to run the workflow on (default: main)
#    - inputs_json – optional JSON object with workflow inputs
#                   e.g. '{"version":"1.9.0"}' or '{"dry_run":"true"}'
# 3. Click "Run workflow".
#
# ALTERNATIVE: GitHub CLI
# -----------------------
#   gh workflow run "03-editions_edition-community-ci.yml" \
#     --repo makr-code/ThemisDB \
#     --ref main
#
#   gh workflow run "04-release_create-release-archive.yml" \
#     --repo makr-code/ThemisDB \
#     --ref main \
#     --field version=1.9.0
#
# NOTE
# ----
# The dedicated root-level trigger files that previously served as input-UI
# wrappers for release, maintenance and core workflows have been removed.
# Use the Universal Dispatcher or `gh workflow run` directly:
#
#   gh workflow run "04-release_create-release-archive.yml" \
#     --repo makr-code/ThemisDB --ref main --field version=1.9.0
#
#   gh workflow run "08-maintenance_code-maturity-analysis.yml" \
#     --repo makr-code/ThemisDB --ref main
#
# All 220 workflow files are discoverable in the Actions tab via
# workflow_dispatch triggers or through the Universal Dispatcher above.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: >
          Workflow filename in .github/workflows/
          (e.g. "03-editions_edition-community-ci.yml")
        required: true
        type: string
      ref:
        description: "Branch, tag, or SHA to run the workflow on"
        required: false
        default: "main"
        type: string
      inputs_json:
        description: >
          Workflow inputs as a JSON object (optional).
          Example: {"version":"1.9.0"} or {"dry_run":"true","mode":"preview"}
          Leave as {} if the target workflow has no inputs.
        required: false
        default: "{}"
        type: string

permissions:
  actions: write

jobs:
  dispatch:
    name: "Dispatch › ${{ inputs.workflow }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          WORKFLOW="${{ inputs.workflow }}"
          INPUTS='${{ inputs.inputs_json }}'

          # Workflow path must end with .yml or .yaml
          if [[ ! "$WORKFLOW" =~ \.(yml|yaml)$ ]]; then
            echo "::error::workflow input must end with .yml or .yaml (got: '$WORKFLOW')"
            exit 1
          fi

          # inputs_json must be valid JSON
          if ! echo "$INPUTS" | jq empty 2>/dev/null; then
            echo "::error::inputs_json is not valid JSON: $INPUTS"
            exit 1
          fi

          echo "✅ Inputs validated"
          echo "   workflow : $WORKFLOW"
          echo "   ref      : ${{ inputs.ref }}"
          echo "   inputs   : $INPUTS"

      - name: Dispatch workflow via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_PATH=".github/workflows/${{ inputs.workflow }}"
          REF="${{ inputs.ref }}"
          INPUTS='${{ inputs.inputs_json }}'

          # Build the JSON request body
          # If inputs_json is empty or {}, omit the inputs key (cleaner API call)
          if [ "$INPUTS" = "{}" ] || [ -z "$INPUTS" ]; then
            BODY=$(jq -n --arg ref "$REF" '{ref: $ref}')
          else
            BODY=$(jq -n --arg ref "$REF" --argjson inputs "$INPUTS" \
              '{ref: $ref, inputs: $inputs}')
          fi

          # URL-encode the workflow file path for the API endpoint
          ENCODED=$(python3 -c \
            "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" \
            "$WORKFLOW_PATH")

          echo "📡 POST /repos/${{ github.repository }}/actions/workflows/${ENCODED}/dispatches"
          echo "   Body: $BODY"

          HTTP_STATUS=$(curl -s -o /tmp/api_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${ENCODED}/dispatches" \
            -d "$BODY")

          if [ "$HTTP_STATUS" -eq 204 ]; then
            echo "✅ Workflow dispatched successfully (HTTP 204)."
          else
            echo "::error::GitHub API returned HTTP $HTTP_STATUS"
            cat /tmp/api_response.json
            exit 1
          fi

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🚀 Workflow Dispatcher" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Workflow** | \`.github/workflows/${{ inputs.workflow }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Inputs** | \`${{ inputs.inputs_json }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The dispatched workflow will appear as a new run under" >> "$GITHUB_STEP_SUMMARY"
          echo "\`.github/workflows/${{ inputs.workflow }}\` in the Actions tab." >> "$GITHUB_STEP_SUMMARY"
