name: "[Manual] Sync Roadmap Issues"

# ---------------------------------------------------------------------------
# ROOT-LEVEL TRIGGER
# ------------------
# This file exists at the root of .github/workflows/ so that it appears in
# the GitHub Web UI and GitHub App under the Actions tab.
#
# GitHub only shows workflow_dispatch triggers for workflows directly in
# .github/workflows/. The real implementation lives in:
#   .github/workflows/08-maintenance/sync-roadmap-issues.yml
#
# This wrapper captures the inputs and dispatches the actual workflow via
# the GitHub CLI.
#
# ALTERNATIVE: GitHub CLI
#   gh workflow run "08-maintenance/sync-roadmap-issues.yml" \
#     --repo makr-code/ThemisDB --ref main \
#     --field mode=preview --field priority=all
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - apply
          - backfill
      priority:
        description: 'Optional priority filter (select "all" for no filter)'
        required: false
        default: "all"
        type: choice
        options:
          - all
          - critical
          - high
          - medium
          - low
      module:
        description: "Optional module filter"
        required: false
        default: ""
        type: string
      limit:
        description: "Optional max item count"
        required: false
        default: ""
        type: string
      backfill:
        description: "Backfill issue refs into src/ROADMAP.md after apply"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ref:
        description: "Branch, tag, or SHA to run on (default: main)"
        required: false
        default: "main"
        type: string

permissions:
  actions: write

jobs:
  trigger:
    name: "Trigger › 08-maintenance/sync-roadmap-issues.yml"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(
            --repo "${{ github.repository }}"
            --ref "${{ inputs.ref }}"
            --field "mode=${{ inputs.mode }}"
            --field "priority=${{ inputs.priority }}"
            --field "backfill=${{ inputs.backfill }}"
          )

          # Only pass optional fields when non-empty
          if [ -n "${{ inputs.module }}" ]; then
            ARGS+=(--field "module=${{ inputs.module }}")
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS+=(--field "limit=${{ inputs.limit }}")
          fi

          gh workflow run "08-maintenance/sync-roadmap-issues.yml" "${ARGS[@]}"

          echo "✅ Dispatched 08-maintenance/sync-roadmap-issues.yml"
          echo "   mode     : ${{ inputs.mode }}"
          echo "   priority : ${{ inputs.priority }}"
          echo "   ref      : ${{ inputs.ref }}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🗺️ [Manual] Sync Roadmap Issues" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Mode** | \`${{ inputs.mode }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Priority** | \`${{ inputs.priority }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Module** | \`${{ inputs.module }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Limit** | \`${{ inputs.limit }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Backfill** | \`${{ inputs.backfill }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target workflow** | \`08-maintenance/sync-roadmap-issues.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
