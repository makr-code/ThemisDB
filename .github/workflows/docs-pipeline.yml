name: Documentation Pipeline

# Consolidated docs CI path:
#   1. validate  – lint + links + TOC check
#   2. build-site – mkdocs static site
#   3. build-pdf  – on-demand or on release tags (ENABLE_PDF_EXPORT)
#   4. deploy-pages – GitHub Pages (main branch / manual)
#
# See docs/how-to-build-docs.md for the local equivalent workflow.

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'docs/**'
      - 'compendium/**'
      - 'mkdocs.yml'
      - 'mkdocs-nopdf.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs-lint.py'
      - 'scripts/link-check.py'
      - 'scripts/toc-check.py'
      - 'scripts/validate-docs.sh'
      - 'scripts/build-docs.sh'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'compendium/**'
      - 'mkdocs.yml'
      - 'mkdocs-nopdf.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs-lint.py'
      - 'scripts/link-check.py'
      - 'scripts/toc-check.py'
      - 'scripts/validate-docs.sh'
      - 'scripts/build-docs.sh'

  workflow_dispatch:
    inputs:
      enable_pdf:
        description: 'Enable PDF export (ENABLE_PDF_EXPORT)'
        type: boolean
        default: false
      deploy_pages:
        description: 'Deploy site to GitHub Pages'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Stage 1 – Validate (lint + links + TOC)
# Runs on every PR and push so problems are caught early.
# ---------------------------------------------------------------------------
jobs:
  validate:
    name: Validate (lint + links + TOC)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install validation dependencies
        run: pip install pyyaml requests

      - name: Lint documentation
        id: lint
        run: python3 scripts/docs-lint.py

      - name: Check internal links
        id: link-check
        run: python3 scripts/link-check.py --internal-only

      - name: Validate TOC
        id: toc
        run: python3 scripts/toc-check.py

      - name: Write job summary
        if: always()
        run: |
          echo "## 📋 Docs Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ steps.lint.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Internal links | ${{ steps.link-check.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TOC | ${{ steps.toc.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\` | **Event:** \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"

# ---------------------------------------------------------------------------
# Stage 2 – Build site (mkdocs, no PDF)
# Only runs after validation passes so broken docs never produce an artifact.
# ---------------------------------------------------------------------------
  build-site:
    name: Build MkDocs Site
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MkDocs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site (without PDF)
        run: mkdocs build --config-file mkdocs-nopdf.yml --clean --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🏗️ MkDocs Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Config** | \`mkdocs-nopdf.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Artifact** | \`docs-site\` (14 days) |" >> "$GITHUB_STEP_SUMMARY"

# ---------------------------------------------------------------------------
# Stage 3 – Build PDF (on-demand)
# Triggered by:
#   - workflow_dispatch with enable_pdf: true
#   - push of a release tag (v*)
# PDF output goes to artifacts/docs/ — NOT to docs/ root.
# ---------------------------------------------------------------------------
  build-pdf:
    name: Build PDF (on-demand)
    runs-on: ubuntu-latest
    needs: validate
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.enable_pdf == true) ||
      startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MkDocs + PDF plugin
        run: pip install -r requirements-docs.txt

      - name: Create PDF output directory
        run: mkdir -p artifacts/docs

      - name: Build site with PDF export
        env:
          ENABLE_PDF_EXPORT: '1'
        run: mkdocs build --clean

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: artifacts/docs/ThemisDB-Documentation-v1.3.5.pdf
          retention-days: 30
          if-no-files-found: warn

      - name: Write job summary
        if: always()
        run: |
          echo "## 📄 PDF Export" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Config** | \`mkdocs.yml\` (ENABLE_PDF_EXPORT=1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Output** | \`artifacts/docs/ThemisDB-Documentation-v1.3.5.pdf\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Artifact** | \`docs-pdf\` (30 days) |" >> "$GITHUB_STEP_SUMMARY"

# ---------------------------------------------------------------------------
# Stage 4 – Deploy to GitHub Pages (optional)
# Triggered by:
#   - push to main branch
#   - workflow_dispatch with deploy_pages: true
# Requires GitHub Pages to be enabled and deployment environment configured.
# ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-site
    if: >
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages == true)

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write job summary
        if: always()
        run: |
          echo "## 🚀 GitHub Pages Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | ${{ steps.deployment.outputs.page_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
