name: Performance Expectations Audit (§1.4 Top-10)

# Validates the implementation evidence for the Top-10 measures listed in
# PERFORMANCE_EXPECTATIONS.md §1.4.  The job fails with a clear error message
# when any measure that is marked ERLEDIGT (done) in that document lacks the
# expected artefacts / targets / registrations.
#
# JSON + Markdown reports are uploaded as workflow artefacts for every run.

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      strict:
        description: "Exit non-zero on ANY failed check (not just ERLEDIGT)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: perf-expectations-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf-expectations-audit:
    name: Performance Expectations Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Performance Expectations Audit
        id: audit
        run: |
          STRICT_FLAG=""
          if [ "${{ github.event.inputs.strict }}" = "true" ]; then
            STRICT_FLAG="--strict"
          fi
          python3 tools/perf_expectations_audit.py \
            --repo-root . \
            --output-dir artifacts/perf_expectations_audit \
            $STRICT_FLAG
        # The script exits with code 1 when an ERLEDIGT measure fails its
        # evidence check (or when --strict is set and any check fails).
        # GitHub Actions treats exit code != 0 as a step failure.

      - name: Upload audit report artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-expectations-audit-report-${{ github.run_number }}
          path: artifacts/perf_expectations_audit/
          retention-days: 30
          if-no-files-found: warn

      - name: Print summary (on failure)
        if: failure()
        run: |
          echo "::error::Performance Expectations Audit FAILED."
          echo "::error::One or more ERLEDIGT measures did not pass their evidence checks."
          echo "::error::See the uploaded artefact 'perf-expectations-audit-report' for details."
          echo ""
          echo "=== Audit Report Summary ==="
          if [ -f artifacts/perf_expectations_audit/report.json ]; then
            python3 - <<'EOF'
          import json, pathlib, sys
          report = json.loads(pathlib.Path("artifacts/perf_expectations_audit/report.json").read_text())
          s = report["summary"]
          print(f"  Total: {s['total']}  Pass: {s['pass']}  Warn: {s['warn']}  Fail: {s['fail']}")
          failed_ids = s.get("erledigt_failed", [])
          if failed_ids:
              print(f"  ERLEDIGT measures that FAILED: {failed_ids}")
              for m in report["measures"]:
                  if m["id"] in failed_ids:
                      print(f"    #{m['id']} – {m['title']}")
                      for c in m.get("checks", []):
                          if c["result"] == "fail":
                              print(f"       ✗ [{c['id']}] {c['description']}")
          EOF
          fi
