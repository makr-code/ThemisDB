name: Performance Regression Check

# Automated performance regression detection for PRs
# Compares benchmark results against baseline and blocks PRs with significant regressions

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'include/**'
      - 'benchmarks/**/*.cpp'
      - 'CMakeLists.txt'
  workflow_dispatch:
    inputs:
      fail_threshold:
        description: 'Fail threshold (minor/major/critical)'
        required: false
        default: 'major'

# Prevent concurrent runs for same PR
concurrency:
  group: perf-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  BUILD_TYPE: Release
  USE_SYSTEM_LIBS: ON

jobs:
  detect-regressions:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev libcurl4-openssl-dev librocksdb-dev \
            libtbb-dev libspdlog-dev nlohmann-json3-dev \
            libboost-dev libboost-system-dev libyaml-cpp-dev \
            libzstd-dev libgtest-dev libbenchmark-dev
      
      - name: Install vcpkg dependencies
        run: |
          VCPKG_DIR="${VCPKG_ROOT:-vcpkg}"
          if [ ! -f "$VCPKG_DIR/bootstrap-vcpkg.sh" ]; then
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          fi
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          "$VCPKG_DIR/vcpkg" install --clean-after-build
      
      - name: Build ThemisDB (Release)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCHMARKS=ON \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT:-vcpkg}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build --config Release --parallel $(nproc)
      
      - name: Run Core Benchmarks
        run: |
          cd build
          mkdir -p benchmark_results
          
          # Run key benchmarks (subset for PR checks to save time)
          for bench in bench_crud bench_query bench_vector_search bench_core_performance; do
            if [ -f "$bench" ]; then
              echo "Running $bench..."
              ./$bench --benchmark_format=json --benchmark_out=benchmark_results/${bench}.json || true
            fi
          done
          
          cd ..
      
      - name: Determine Baseline
        id: baseline
        run: |
          # Determine which baseline to use based on target branch
          TARGET_BRANCH="${{ github.base_ref }}"
          echo "Target branch: $TARGET_BRANCH"
          
          if [ "$TARGET_BRANCH" = "main" ]; then
            BASELINE_PATH="benchmarks/baselines/main/latest.json"
          elif [ "$TARGET_BRANCH" = "develop" ]; then
            BASELINE_PATH="benchmarks/baselines/develop/latest.json"
          else
            BASELINE_PATH="benchmarks/baselines/main/latest.json"
          fi
          
          if [ ! -f "$BASELINE_PATH" ]; then
            echo "⚠️  Warning: No baseline found at $BASELINE_PATH"
            echo "Creating a temporary baseline from current results..."
            echo "has_baseline=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Using baseline: $BASELINE_PATH"
            echo "has_baseline=true" >> $GITHUB_OUTPUT
            echo "baseline_path=$BASELINE_PATH" >> $GITHUB_OUTPUT
          fi
      
      - name: Aggregate Current Results
        id: aggregate
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          
          results_dir = Path("build/benchmark_results")
          all_benchmarks = {}
          
          for json_file in results_dir.glob("*.json"):
              try:
                  with open(json_file) as f:
                      data = json.load(f)
                  
                  if 'benchmarks' in data:
                      for bench in data['benchmarks']:
                          name = bench.get('name', 'unknown')
                          all_benchmarks[name] = {
                              'real_time': bench.get('real_time'),
                              'cpu_time': bench.get('cpu_time'),
                              'iterations': bench.get('iterations'),
                              'items_per_second': bench.get('items_per_second'),
                              'bytes_per_second': bench.get('bytes_per_second'),
                          }
              except Exception as e:
                  print(f"Error processing {json_file}: {e}")
          
          # Create aggregated result
          result = {
              'version': os.environ.get('GITHUB_SHA', 'unknown')[:8],
              'branch': os.environ.get('GITHUB_HEAD_REF', 'unknown'),
              'commit': os.environ.get('GITHUB_SHA', 'unknown'),
              'timestamp': None,
              'benchmarks': all_benchmarks
          }
          
          output_path = Path("current_results.json")
          with open(output_path, 'w') as f:
              json.dump(result, f, indent=2)
          
          print(f"✅ Aggregated {len(all_benchmarks)} benchmarks to {output_path}")
          EOF
      
      - name: Detect Regressions
        if: steps.baseline.outputs.has_baseline == 'true'
        id: detect
        continue-on-error: true
        run: |
          FAIL_THRESHOLD="${{ github.event.inputs.fail_threshold || 'major' }}"
          
          python3 benchmarks/performance_regression_detector.py \
            --baseline "${{ steps.baseline.outputs.baseline_path }}" \
            --current current_results.json \
            --output regression_report.txt \
            --fail-on "$FAIL_THRESHOLD" \
            --threshold-minor 5.0 \
            --threshold-major 10.0 \
            --threshold-critical 20.0
      
      - name: Upload Regression Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression-report
          path: |
            regression_report.txt
            regression_report.json
            current_results.json
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.baseline.outputs.has_baseline == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the report
            let reportContent = '';
            try {
              reportContent = fs.readFileSync('regression_report.txt', 'utf8');
            } catch (e) {
              console.log('Could not read report file');
              return;
            }
            
            // Read JSON summary
            let summary = null;
            try {
              const jsonContent = fs.readFileSync('regression_report.json', 'utf8');
              const data = JSON.parse(jsonContent);
              summary = data.summary;
            } catch (e) {
              console.log('Could not read JSON summary');
            }
            
            // Create comment body
            let body = '## 📊 Performance Regression Detection Report\n\n';
            
            if (summary) {
              body += '### Summary\n';
              body += `- ❌ Critical Regressions: **${summary.critical}**\n`;
              body += `- ⚠️ Major Regressions: **${summary.major}**\n`;
              body += `- ℹ️ Minor Regressions: **${summary.minor}**\n`;
              body += `- ✅ Improvements: **${summary.improvements}**\n\n`;
              
              if (summary.critical > 0 || summary.major > 0) {
                body += '### ⚠️ Action Required\n';
                body += 'This PR introduces significant performance regressions. ';
                body += 'Please review the detailed report and address the issues.\n\n';
              } else if (summary.minor > 0) {
                body += '### ℹ️ Minor Regressions Detected\n';
                body += 'Some minor regressions were found. Consider reviewing if possible.\n\n';
              } else {
                body += '### ✅ No Significant Regressions\n';
                body += 'Performance looks good!\n\n';
              }
            }
            
            body += '### 📄 Full Report\n';
            body += '<details>\n<summary>Click to expand</summary>\n\n';
            body += '```\n' + reportContent.substring(0, 50000) + '\n```\n';
            body += '</details>\n\n';
            body += `[View detailed artifacts](${context.payload.repository.html_url}/actions/runs/${context.runId})`;
            
            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
      
      - name: Set Status Check
        if: steps.baseline.outputs.has_baseline == 'true'
        run: |
          if [ "${{ steps.detect.outcome }}" = "success" ]; then
            echo "✅ Performance check passed"
            exit 0
          else
            echo "❌ Performance regressions detected - blocking PR"
            exit 1
          fi
      
      - name: Create Status Summary
        if: always()
        run: |
          echo "## Performance Regression Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.baseline.outputs.has_baseline }}" = "false" ]; then
            echo "⚠️ No baseline available - skipping regression check" >> $GITHUB_STEP_SUMMARY
            echo "This is expected for the first run or new branches." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.detect.outcome }}" = "success" ]; then
            echo "✅ **PASSED** - No significant regressions detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED** - Performance regressions detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the regression report and address the issues." >> $GITHUB_STEP_SUMMARY
          fi
