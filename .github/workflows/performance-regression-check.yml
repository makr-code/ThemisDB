name: Performance Regression Check

on:
  pull_request:
    branches:
      - community
      - develop
    paths:
      - 'src/**'
      - 'include/**'
      - 'benchmarks/**'
      - '.github/workflows/performance-regression-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-sustained-write-regression:
    name: Storage sustained write regression gate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            librocksdb-dev \
            libbenchmark-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libboost-filesystem-dev \
            libboost-system-dev \
            libzstd-dev \
            libtbb-dev \
            libcurl4-openssl-dev

      - name: Configure benchmark build
        run: |
          cmake -S . -B build/perf-regression -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_CHIMERA=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DTHEMIS_ENABLE_HTTP_SERVER=OFF \
            -DTHEMIS_ENABLE_CLOUD_STORAGE=OFF \
            -DTHEMIS_ENABLE_BLOB_WEBDAV=OFF \
            -DTHEMIS_ENABLE_MIMALLOC=OFF \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build storage benchmark target
        run: cmake --build build/perf-regression --target bench_storage_performance -j"$(nproc)"

      - name: Run BM_Storage_SustainedWrite_NoSync
        run: |
          mkdir -p build/perf-regression/benchmark_results
          ./build/perf-regression/bench_storage_performance \
            --benchmark_filter='^BM_Storage_SustainedWrite_NoSync($|/)' \
            --benchmark_min_time=2.0s \
            --benchmark_format=json \
            --benchmark_out=build/perf-regression/benchmark_results/storage_sustained_write_nosync.json

      - name: Enforce Storage sustained write SLO (>= 100k ops/s)
        run: |
          python3 - << 'PY'
          import json
          from pathlib import Path

          result_path = Path("build/perf-regression/benchmark_results/storage_sustained_write_nosync.json")
          data = json.loads(result_path.read_text(encoding="utf-8"))
          threshold = 100000.0
          measured = None

          for bench in data.get("benchmarks", []):
              name = bench.get("name", "")
              if name == "BM_Storage_SustainedWrite_NoSync":
                  measured = bench.get("items_per_second")
                  break

          if measured is None:
              raise SystemExit("❌ BM_Storage_SustainedWrite_NoSync result missing in benchmark output")
          if measured < threshold:
              raise SystemExit(f"❌ Storage sustained write SLO regression: {measured:.2f} ops/s < {threshold:.0f} ops/s")
          print(f"✅ Storage sustained write SLO met: {measured:.2f} ops/s")
          PY

      - name: Run performance regression detector (major threshold 10%)
        run: |
          python3 benchmarks/performance_regression_detector.py \
            --baseline benchmarks/baselines/storage/sustained_write_nosync_baseline.json \
            --current build/perf-regression/benchmark_results/storage_sustained_write_nosync.json \
            --output build/perf-regression/benchmark_results/storage_regression_report.txt \
            --fail-on major \
            --threshold-minor 5.0 \
            --threshold-major 10.0 \
            --threshold-critical 20.0

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-sustained-write-regression-${{ github.run_number }}
          path: build/perf-regression/benchmark_results/
          retention-days: 14
