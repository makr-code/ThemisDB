name: NVMe Manager CI

# Triggered on every push/PR that touches NVMeManager sources, RocksDBWrapper
# NVMe integration, tests, or this workflow itself.  Targets v1.6.0.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/storage/nvme_manager.h'
      - 'src/storage/nvme_manager.cpp'
      - 'include/storage/rocksdb_wrapper.h'
      - 'src/storage/rocksdb_wrapper.cpp'
      - 'tests/test_nvme_manager.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_nvme-manager-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the NVMe Manager focused test suite.
  # Tests cover all acceptance criteria from the v1.6.0 roadmap:
  #   AC-1  Default NVMeConfig has safe (all-disabled) values.
  #   AC-2  initialize() / shutdown() are idempotent and non-crashing.
  #   AC-3  detectCapabilities() does not crash on any host; hw_queue_count >= 1.
  #   AC-4  Direct I/O flags are gated on capabilities; both false by default.
  #   AC-5  recommendedBackgroundThreads() is in range [2, 16].
  #   AC-6  io_uring is inactive by default; pollCompletions returns 0.
  #   AC-7  submitRead / submitWrite fall back to pread/pwrite when io_uring
  #         is unavailable; real-file read-back succeeds on POSIX hosts.
  #   AC-8  ZNS zone management is a safe no-op when enable_zns=false.
  #   AC-9  RocksDBWrapper::Config exposes enable_nvme_optimizations and
  #         related nvme_* fields; opening with NVMe enabled does not crash.
  #   AC-10 put/get round-trip succeeds with enable_nvme_optimizations=true.
  # ---------------------------------------------------------------------------
  nvme-manager-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: NVMe Manager tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_nvme_manager_focused

      - name: Run NVMeFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R NVMeFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee nvme_manager_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvme-manager-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/nvme_manager_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚡ NVMe Manager – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "NVMeManager: io_uring async I/O (Linux ≥ 5.1), multi-queue NVMe, ZNS zone" >> "$GITHUB_STEP_SUMMARY"
          echo "management, Direct I/O flag recommendation, RocksDBWrapper integration." >> "$GITHUB_STEP_SUMMARY"
          echo "Graceful fallback to pread/pwrite when io_uring is unavailable." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate job — all matrix legs must pass
  # ---------------------------------------------------------------------------
  nvme-manager-gate:
    name: NVMe Manager Gate
    needs: nvme-manager-unit-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check test status
        shell: bash
        run: |
          result="${{ needs.nvme-manager-unit-tests.result }}"
          if [[ "$result" == "success" ]]; then
            echo "✅ All NVMe manager tests passed."
          elif [[ "$result" == "skipped" ]]; then
            echo "ℹ️  NVMe manager tests skipped (no relevant changes detected)."
          else
            echo "❌ NVMe manager tests failed."
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          result="${{ needs.nvme-manager-unit-tests.result }}"
          echo "## ⚡ NVMe Manager – Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test result** | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
