name: Wire Protocol V2 CI

# Triggered on every push / PR that touches the Wire Protocol V2 sources
# (header, implementation, tests) or this workflow.  Targets v1.8.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/themis/network/wire_protocol_v2.hpp'
      - 'src/network/wire_protocol_v2.cpp'
      - 'tests/test_wire_protocol_v2.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/wire-protocol-v2-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/themis/network/wire_protocol_v2.hpp'
      - 'src/network/wire_protocol_v2.cpp'
      - 'tests/test_wire_protocol_v2.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/wire-protocol-v2-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the WireProtocolV2FocusedTests suite.
  #
  # Tests cover all acceptance criteria:
  #   AC-1  V2 protocol constants (magic, version, header size, window, payload)
  #   AC-2  V2FrameHeader validity, frame type extraction, flag inspection
  #   AC-3  V2Stream state machine (IDLE → OPEN → HALF_CLOSED → CLOSED, RESERVED)
  #   AC-4  V2ConnectionConfig defaults and custom value assignment
  #   AC-5  V2Server lifecycle (construct/destruct, is_running, handler registration)
  #   AC-6  V2Server server-push API (push_to_client returns false on unknown conn)
  #   AC-7  Aggregate frame/stream statistics start at zero
  #   AC-8  LZ4 (COMPRESSED) and Zstd (ZSTD_COMPRESSED) flags are independent
  #   AC-9  Independent stream IDs and state transitions per-stream
  # ---------------------------------------------------------------------------
  wire-protocol-v2-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Wire Protocol V2 (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            ${{ matrix.cxx }} ${{ matrix.cc }} \
            libgtest-dev \
            libssl-dev \
            librocksdb-dev \
            libboost-all-dev \
            libfmt-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libzstd-dev \
            liblz4-dev \
            pkg-config

      - name: Configure CMake (COMMUNITY edition)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_EDITION=COMMUNITY \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=OFF

      - name: Build test_wire_protocol_v2_focused
        run: |
          cmake --build build \
            --target test_wire_protocol_v2_focused \
            --parallel 4

      - name: Run WireProtocolV2FocusedTests (CTest)
        run: |
          set -o pipefail
          cd build
          ctest -R WireProtocolV2FocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee wire_protocol_v2_ctest_results.txt

      - name: Run all V2 tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_wire_protocol_v2_focused \
            --gtest_filter="WireV2Constants*:V2FrameHeader*:V2Stream*:V2ConnectionConfig*:V2FrameType*:V2FrameFlags*:V2SettingId*:V2Server*" \
            --gtest_output="xml:wire_protocol_v2_gtest.xml" \
            2>&1 | tee wire_protocol_v2_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wire-protocol-v2-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/wire_protocol_v2_ctest_results.txt
            build/wire_protocol_v2_gtest.xml
            build/wire_protocol_v2_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔌 Wire Protocol V2 CI (${{ matrix.compiler }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Edition** | COMMUNITY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Acceptance Criteria" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-1  V2 protocol constants (magic, version, header size, window, payload)" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-2  V2FrameHeader: is_valid(), get_type(), has_flag()" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-3  V2Stream state machine: IDLE → OPEN → HALF_CLOSED → CLOSED" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-4  V2ConnectionConfig: multiplexing, server push, flow control defaults" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-5  V2Server lifecycle: construct, handler registration, is_running()" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-6  Server push: push_to_client API available and correct" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-7  Aggregate statistics: frames/streams/connections start at zero" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-8  Compression: LZ4 and Zstd flags are independent bit positions" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-9  Multiplexing: independent stream IDs with separate state machines" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Documentation / API gate – verifies all required files are in place and
  # key protocol features are declared in the public header.
  # ---------------------------------------------------------------------------
  wire-protocol-v2-docs-gate:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Wire Protocol V2 — Documentation gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify protocol header is present
        run: |
          test -f include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ include/themis/network/wire_protocol_v2.hpp present" || \
            (echo "❌ include/themis/network/wire_protocol_v2.hpp missing" && exit 1)

      - name: Verify implementation source is present
        run: |
          test -f src/network/wire_protocol_v2.cpp && \
            echo "✅ src/network/wire_protocol_v2.cpp present" || \
            (echo "❌ src/network/wire_protocol_v2.cpp missing" && exit 1)

      - name: Verify test file is present
        run: |
          test -f tests/test_wire_protocol_v2.cpp && \
            echo "✅ tests/test_wire_protocol_v2.cpp present" || \
            (echo "❌ tests/test_wire_protocol_v2.cpp missing" && exit 1)

      - name: Verify multiplexing — V2Stream and stream_id field declared
        run: |
          grep -q "struct V2Stream" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ V2Stream struct found (multiplexing support)" || \
            (echo "❌ V2Stream struct missing from header" && exit 1)
          grep -q "stream_id" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ stream_id field found in header" || \
            (echo "❌ stream_id field missing from header" && exit 1)

      - name: Verify server push — push_promise and push_to_client declared
        run: |
          grep -q "push_promise" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ push_promise() method found (server push support)" || \
            (echo "❌ push_promise() missing from header" && exit 1)
          grep -q "push_to_client" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ push_to_client() found in V2Server API" || \
            (echo "❌ push_to_client() missing from header" && exit 1)

      - name: Verify flow control — WINDOW_UPDATE frame type and update_connection_window declared
        run: |
          grep -q "WINDOW_UPDATE" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ WINDOW_UPDATE frame type found (flow control support)" || \
            (echo "❌ WINDOW_UPDATE frame type missing from header" && exit 1)
          grep -q "update_connection_window" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ update_connection_window() found (flow control API)" || \
            (echo "❌ update_connection_window() missing from header" && exit 1)

      - name: Verify max_concurrent_streams config field declared
        run: |
          grep -q "max_concurrent_streams" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ max_concurrent_streams field found in V2ConnectionConfig" || \
            (echo "❌ max_concurrent_streams missing from V2ConnectionConfig" && exit 1)

      - name: Verify V2Server lifecycle API declared
        run: |
          grep -q "void start" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ V2Server::start() declared" || \
            (echo "❌ V2Server::start() missing from header" && exit 1)
          grep -q "void stop" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ V2Server::stop() declared" || \
            (echo "❌ V2Server::stop() missing from header" && exit 1)
          grep -q "is_running" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ V2Server::is_running() declared" || \
            (echo "❌ V2Server::is_running() missing from header" && exit 1)

      - name: Verify LZ4 and Zstd compression flags declared
        run: |
          grep -q "COMPRESSED" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ COMPRESSED (LZ4) flag found" || \
            (echo "❌ COMPRESSED flag missing from header" && exit 1)
          grep -q "ZSTD_COMPRESSED" include/themis/network/wire_protocol_v2.hpp && \
            echo "✅ ZSTD_COMPRESSED flag found" || \
            (echo "❌ ZSTD_COMPRESSED flag missing from header" && exit 1)

      - name: Write job summary
        if: always()
        run: |
          echo "## 📚 Wire Protocol V2 — Documentation Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Protocol header present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Implementation source present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test file present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Multiplexing: V2Stream + stream_id | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Server push: push_promise + push_to_client | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow control: WINDOW_UPDATE + update_connection_window | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| max_concurrent_streams config | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| V2Server lifecycle: start/stop/is_running | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compression: COMPRESSED + ZSTD_COMPRESSED flags | ✅ |" >> "$GITHUB_STEP_SUMMARY"
