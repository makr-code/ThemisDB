name: Edition · COMMUNITY · CI

on:
  push:
    # Community builds run on main (Community release lane) and develop
    # (integration branch). They do NOT run on enterprise/hyperscaler branches.
    branches:
      - main
      - develop
    paths:
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - '.github/workflows/edition-community-ci.yml'
      - '.github/workflows/edition-build-ci.yml'
      - '.github/actions/configure-themis/**'
      - '.github/actions/setup-cpp-build/**'
  # pull_request trigger intentionally removed:
  # Full ThemisDB builds are too heavy for PR feedback loops.
  # PRs run pr-quick-checks.yml (lint + static analysis + audit) instead.
  # See: .github/workflows/pr-quick-checks.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/03-editions/edition-build-ci.yml
    with:
      edition: COMMUNITY
      build-type: Debug
