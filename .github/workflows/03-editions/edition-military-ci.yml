name: Edition · MILITARY · CI

on:
  push:
    # Military builds run on the enterprise release lane (Military is a build
    # profile variant of Enterprise, not a separate branch) and develop.
    branches:
      - enterprise
      - develop
    paths:
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - '.github/workflows/03-editions/edition-military-ci.yml'
      - '.github/workflows/03-editions/edition-build-ci.yml'
      - '.github/actions/configure-themis/**'
      - '.github/actions/setup-cpp-build/**'
  # pull_request trigger intentionally removed:
  # Full ThemisDB builds are too heavy for PR feedback loops.
  # PRs run pr-quick-checks.yml (lint + static analysis + audit) instead.
  # See: .github/workflows/09-pr-gates/pr-quick-checks.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/03-editions/edition-build-ci.yml
    with:
      edition: MILITARY
      build-type: Debug
