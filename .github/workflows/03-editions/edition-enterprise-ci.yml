name: Edition · ENTERPRISE · CI

on:
  push:
    # Enterprise builds run on the enterprise release lane and develop.
    # They do NOT run on main (Community lane) or hyperscaler lane.
    branches:
      - enterprise
      - develop
    paths:
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - '.github/workflows/03-editions/edition-enterprise-ci.yml'
      - '.github/workflows/03-editions/edition-build-ci.yml'
      - '.github/actions/configure-themis/**'
      - '.github/actions/setup-cpp-build/**'
  # pull_request trigger intentionally removed:
  # Full ThemisDB builds are too heavy for PR feedback loops.
  # PRs run pr-quick-checks.yml (lint + static analysis + audit) instead.
  # See: .github/workflows/09-pr-gates/pr-quick-checks.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/03-editions/edition-build-ci.yml
    with:
      edition: ENTERPRISE
      build-type: Debug
