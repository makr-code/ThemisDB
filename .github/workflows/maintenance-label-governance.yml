name: "[Manual] Label Governance – Setup & Audit"

# ---------------------------------------------------------------------------
# ROOT-LEVEL TRIGGER
# ------------------
# This file exists at the root of .github/workflows/ so that it appears in
# the GitHub Web UI and GitHub App under the Actions tab.
#
# GitHub only shows workflow_dispatch triggers for workflows directly in
# .github/workflows/. The real implementation lives in:
#   .github/workflows/08-maintenance/github_workflows_label-governance.yml
#
# This wrapper captures the inputs and dispatches the actual workflow via
# the GitHub CLI.
#
# ALTERNATIVE: GitHub CLI
#   gh workflow run "08-maintenance/github_workflows_label-governance.yml" \
#     --repo makr-code/ThemisDB --ref develop \
#     --field action=audit
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        default: "audit"
        type: choice
        options:
          - "audit"    # Just run audit report
          - "create"   # Create all missing labels
          - "migrate"  # Migrate existing labels
          - "all"      # Create + Migrate everything
      ref:
        description: "Branch, tag, or SHA to run on (default: develop)"
        required: false
        default: "develop"
        type: string

permissions:
  actions: write

jobs:
  trigger:
    name: "Trigger › 08-maintenance/github_workflows_label-governance.yml"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "08-maintenance/github_workflows_label-governance.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ inputs.ref }}" \
            --field "action=${{ inputs.action }}"

          echo "✅ Dispatched 08-maintenance/github_workflows_label-governance.yml"
          echo "   action : ${{ inputs.action }}"
          echo "   ref    : ${{ inputs.ref }}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🏷️ [Manual] Label Governance – Setup & Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Action** | \`${{ inputs.action }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target workflow** | \`08-maintenance/github_workflows_label-governance.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
