name: MQTT Client Service CI

# Triggered on every push / PR that touches the MQTT client service header,
# source, or test file.  Covers v1.9.0 deliverables:
#   - MqttClientConfig / MqttClientStats
#   - IMqttMessageHandler
#   - MqttCDCTransport (ICDCTransport bridge to MQTT broker)
#   - MqttClientService (bidirectional MQTT client with service registration)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/server/mqtt_client_service.h'
      - 'src/server/mqtt_client_service.cpp'
      - 'tests/test_mqtt_client_service.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/06-infrastructure_networking_mqtt-client-service-ci.yml'
  workflow_dispatch:

concurrency:
  group: mqtt-client-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the MqttClientService focused test suite.
  # Tests cover all acceptance criteria:
  #
  # AC-CFG  MqttClientConfig defaults (broker_host/port, client_id, clean_session,
  #         keepalive, default_qos, tls_enabled, cdc_topic_prefix, cdc_qos)
  #         and custom value round-trips.
  #
  # AC-STA  MqttClientStats initial state (all counters = 0, is_connected = false),
  #         atomic increment thread-safety (1000 concurrent threads),
  #         reset() zeroes all fields.
  #
  # AC-HDL  IMqttMessageHandler is abstract; default onConnected/onDisconnected
  #         are no-ops; RecordingHandler captures topic/payload/qos.
  #
  # AC-SVC  MqttClientService constructs with defaults and custom config;
  #         initially disconnected; stop() before start() is a no-op;
  #         start()/stop() are idempotent.
  #
  # AC-ID   clientId() is non-empty for auto-generated IDs; starts with
  #         "themisdb-" prefix; uses config value when set.
  #
  # AC-PUB  publish() returns false and increments publish_errors when
  #         the service is not connected (no real broker required).
  #
  # AC-SUB  subscribe() / unsubscribe() return true and are accepted without
  #         a live connection.  Multiple subscriptions are tracked.
  #
  # AC-REG  registerWithServiceRegistry() makes the service retrievable via
  #         RPCServiceRegistry::getService("mqtt_client"); pointer equality.
  #         unregisterFromServiceRegistry() removes the entry (nullptr).
  #         Custom service names are supported.
  #
  # AC-RST  resetStats() zeroes publish_errors and all other counters.
  #
  # AC-CDC  topicForEvent() maps all 4 ChangeEventTypes correctly:
  #           PUT, DELETE, TRANSACTION_COMMIT, TRANSACTION_ROLLBACK.
  #         Missing "collection" metadata → "default" fallback.
  #         Custom prefix and QoS are applied.
  #
  # AC-CDC2 cdcTransport().publish() returns false + increments errors when
  #         the service is not connected.
  #
  # AC-CDC3 cdcTransport().start() / stop() delegate to the owning service.
  #
  # AC-MCK  setMessageHandler() is accepted and replaceable; null reset is safe.
  #
  # MqttRetryConfig defaults (from mqtt_session.h):
  #   maxRetries=3, initialRetryDelayMs=1000, maxRetryDelayMs=60000,
  #   exponentialBackoff=true.
  # ---------------------------------------------------------------------------
  mqtt-client-service-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: MQTT Client Service (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          extra-cmake-flags: -DTHEMIS_ENABLE_MQTT=ON

      - name: Run MqttClientServiceFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R MqttClientServiceFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee mqtt_client_service_results.txt

      - name: Run suites via unified test binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_mqtt_client_service_focused \
            --gtest_output="xml:mqtt_client_service_gtest.xml" \
            2>&1 | tee mqtt_client_service_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-client-service-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/mqtt_client_service_results.txt
            build/mqtt_client_service_gtest.xml
            build/mqtt_client_service_gtest_output.txt
          retention-days: 30
