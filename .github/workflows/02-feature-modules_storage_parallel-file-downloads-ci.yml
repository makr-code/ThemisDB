name: Parallel File Downloads CI

# Triggered on every push / PR that touches the parallel downloader sources
# or its test file. Targets v1.6.0.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/updates/parallel_downloader.h'
      - 'src/updates/parallel_downloader.cpp'
      - 'tests/test_parallel_file_downloads.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_parallel-file-downloads-ci.yml'

concurrency:
  group: parallel-file-downloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  parallel-downloads-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Parallel Downloads (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run ParallelFileDownloadsFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ParallelFileDownloadsFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee parallel_downloads_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run ParallelDownloader tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ParallelDownloaderConcurrencyTest*:ParallelDownloaderBandwidthTest*:ParallelDownloaderPriorityTest*:ParallelDownloaderResumeTest*:ParallelDownloaderHashTest*:ParallelDownloaderErrorTest*:ParallelDownloaderProgressTest*" \
            --gtest_output="xml:parallel_downloads_gtest.xml" \
            2>&1 | tee parallel_downloads_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-downloads-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/parallel_downloads_results.txt
            build/parallel_downloads_gtest.xml
            build/parallel_downloads_gtest_output.txt
          retention-days: 30
