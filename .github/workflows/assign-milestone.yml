name: Assign Issues to Milestone

# Manually triggered via the GitHub Actions UI or GitHub CLI.
# Run once to assign all open issues that have no milestone.
on:
  workflow_dispatch:
    inputs:
      milestone:
        description: >
          Milestone number (e.g. "3"), exact milestone title (e.g. "Q2 2026"),
          or release version tag (e.g. "v1.5.0") that is mapped to a milestone
          title in .github/scripts/milestone_mapping.yml.
          If the resolved milestone does not exist it will be created automatically.
        required: true
        type: string
      dry_run:
        description: 'Dry-run only (show what would change, no writes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  issues: write   # needed to update issue milestones
  contents: read  # needed for actions/checkout

jobs:
  assign:
    name: Assign milestone to unassigned issues
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Assign milestone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MILESTONE_INPUT: ${{ github.event.inputs.milestone }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python .github/scripts/assign_milestone.py

      - name: Write job summary
        if: always()
        run: |
          echo "## 🎯 Assign Issues to Milestone" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Milestone** | ${{ github.event.inputs.milestone }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Repository** | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
