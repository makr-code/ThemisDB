name: CMake Source Coverage Audit

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "cmake/**"
      - "**/CMakeLists.txt"
      - "**/*.cmake"
      - "scripts/cmake_source_coverage_audit.ps1"
      - ".github/cmake-source-coverage-baseline.txt"
      - ".github/workflows/cmake-source-coverage-audit.yml"
  push:
    branches: [ "develop", "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "benchmarks/**"
      - "cmake/**"
      - "**/CMakeLists.txt"
      - "**/*.cmake"
      - "scripts/cmake_source_coverage_audit.ps1"
      - ".github/cmake-source-coverage-baseline.txt"
      - ".github/workflows/cmake-source-coverage-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run coverage audit
        shell: pwsh
        run: |
          ./scripts/cmake_source_coverage_audit.ps1 `
            -RepoRoot . `
            -BaselinePath .github/cmake-source-coverage-baseline.txt `
            -ReportPath artifacts/cmake-source-coverage-audit.txt `
            -CheckCMakeModules `
            -FailOnNewA

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-source-coverage-audit
          path: artifacts/cmake-source-coverage-audit.txt
