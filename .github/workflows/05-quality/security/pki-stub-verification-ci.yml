name: PKI Stub Verification CI

# Triggered on every push / PR that touches the PKI client sources or tests.
# Targets v1.8.0 (roadmap:218:utils:v1.8.0:pkiclient-replace-fallback-stub-verification).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/utils/pki_client.h'
      - 'include/utils/openssl_deleter.h'
      - 'src/utils/pki_client.cpp'
      - 'tests/test_pki_client.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/05-quality/security/pki-stub-verification-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/utils/pki_client.h'
      - 'include/utils/openssl_deleter.h'
      - 'src/utils/pki_client.cpp'
      - 'tests/test_pki_client.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/05-quality/security/pki-stub-verification-ci.yml'
  workflow_dispatch:

concurrency:
  group: pki-stub-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the PKIClientTest suite.
  # Tests cover all acceptance criteria (AC-1 to AC-5):
  #   AC-1  Line 456 stub guarded by THEMIS_TEST_MODE (base64 signature)
  #   AC-2  Line 575 stub guarded by THEMIS_TEST_MODE (base64 hash compare)
  #   AC-3  PKCS#10 CSR generation via X509_REQ_* API (generateCSR, signHash/ca_url)
  #   AC-4  Real X.509 chain verification via X509_verify_cert() (verifyHash/trust_store_path)
  #   AC-5  Fail-closed in production when no key/cert/endpoint is configured
  # ---------------------------------------------------------------------------
  pki-stub-verification-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: PKI Stub Verification (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev librocksdb-dev libfmt-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Run PKIClientTest suite
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="PKIClientTest*" \
            --gtest_output="xml:pki_stub_verification_results.xml" \
            2>&1 | tee pki_stub_verification_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pki-stub-verification-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/pki_stub_verification_output.txt
            build/pki_stub_verification_results.xml
          retention-days: 14
