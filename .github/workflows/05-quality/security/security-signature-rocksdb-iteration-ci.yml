name: Security Signature RocksDB Iteration CI

# Triggered whenever the SecuritySignatureManager or RocksDBWrapper iteration
# sources, the test file, or this workflow itself change.
# Targets v1.8.0 (roadmap:206:storage:v1.8.0:securitysignaturemanager-implement-rocksdb-iteration).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/storage/rocksdb_wrapper.h'
      - 'src/storage/rocksdb_wrapper.cpp'
      - 'include/storage/security_signature_manager.h'
      - 'src/storage/security_signature_manager.cpp'
      - 'include/storage/security_signature.h'
      - 'tests/test_security_signature_rocksdb_iteration.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/security-signature-rocksdb-iteration-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/storage/rocksdb_wrapper.h'
      - 'src/storage/rocksdb_wrapper.cpp'
      - 'include/storage/security_signature_manager.h'
      - 'src/storage/security_signature_manager.cpp'
      - 'include/storage/security_signature.h'
      - 'tests/test_security_signature_rocksdb_iteration.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/security-signature-rocksdb-iteration-ci.yml'
  workflow_dispatch:

concurrency:
  group: security-signature-rocksdb-iteration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the SecuritySignatureRocksDBIterationFocusedTests suite.
  # Tests cover both acceptance criteria (AC-1 and AC-2):
  #   AC-1  RocksDBWrapper::iterateRange(start_key, end_key, callback) uses a
  #          rocksdb::Iterator and honours start/end bounds.  Also covers the
  #          fixed listAllSignatures() RocksDB path.
  #   AC-2  SecuritySignatureManager::verifyAll() scans all document keys via
  #          iterateRange and correctly reports verified / failed signatures.
  # ---------------------------------------------------------------------------
  security-signature-rocksdb-iteration-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: SecuritySignature RocksDB Iteration tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_security_signature_rocksdb_iteration_focused

      - name: Run SecuritySignature RocksDB Iteration unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex SecuritySignatureRocksDBIterationFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee security_signature_rocksdb_iteration_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-signature-rocksdb-iteration-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/security_signature_rocksdb_iteration_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔐 SecuritySignatureManager RocksDB Iteration – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SecuritySignatureManager: iterateRange key-range scanning, listAllSignatures RocksDB path, verifyAll per-signature integrity checks." >> "$GITHUB_STEP_SUMMARY"
