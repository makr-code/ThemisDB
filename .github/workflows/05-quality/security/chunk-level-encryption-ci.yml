name: Chunk-Level Encryption at Rest CI

# Triggered on every push / PR that touches chunk-level encryption sources or
# tests.  Targets v1.7.0 milestone.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/timeseries/encrypted_chunk_store.h'
      - 'include/timeseries/ts_encrypted_key_rotation.h'
      - 'include/timeseries/tsstore.h'
      - 'src/timeseries/encrypted_chunk_store.cpp'
      - 'src/timeseries/ts_encrypted_key_rotation.cpp'
      - 'src/timeseries/tsstore.cpp'
      - 'tests/test_chunk_level_encryption.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/05-quality/security/chunk-level-encryption-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/timeseries/encrypted_chunk_store.h'
      - 'include/timeseries/ts_encrypted_key_rotation.h'
      - 'include/timeseries/tsstore.h'
      - 'src/timeseries/encrypted_chunk_store.cpp'
      - 'src/timeseries/ts_encrypted_key_rotation.cpp'
      - 'src/timeseries/tsstore.cpp'
      - 'tests/test_chunk_level_encryption.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/05-quality/security/chunk-level-encryption-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the chunk-level encryption focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  EncryptedChunkStore encrypt/decrypt round-trip
  #   AC-2  Encrypted chunks are opaque in RocksDB
  #   AC-3  TSStore query transparently decrypts chunks
  #   AC-4  TSStore aggregate transparently decrypts via the query path
  #   AC-5  Compress-then-encrypt: gorilla bytes encrypted before storage
  #   AC-6  isAuditEnabled() / audit log written on key access
  #   AC-7  TsEncryptedKeyRotation re-encrypts stale chunks non-blocking
  #   AC-8  Decrypt fails on wrong key (GCM tag mismatch)
  #   AC-9  Decrypt fails on truncated blob
  #   AC-10 Plain (unencrypted) chunks remain readable without EncryptedChunkStore
  # ---------------------------------------------------------------------------
  chunk-level-encryption-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Chunk-Level Encryption (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev librocksdb-dev libfmt-dev libspdlog-dev nlohmann-json3-dev liblz4-dev libzstd-dev libsnappy-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run chunk-level encryption tests
        run: |
          set -o pipefail
          cd build
          ctest -R "test_chunk_level_encryption" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee chunk_encryption_results.txt

      - name: Run via GTest binary directly
        run: |
          set -o pipefail
          cd build
          ./test_chunk_level_encryption \
            --gtest_output="xml:chunk_encryption_gtest.xml" \
            2>&1 | tee chunk_encryption_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunk-level-encryption-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/chunk_encryption_results.txt
            build/chunk_encryption_gtest.xml
            build/chunk_encryption_gtest_output.txt
          retention-days: 30
