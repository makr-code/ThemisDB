name: LoRA Certificate Store CI

# Triggered on every push / PR that touches the certificate store sources,
# the LoRA security validator, or this workflow itself.
# Targets v1.8.0 (roadmap:75:llm:v1.8.0:lorasecurityvalidator-certificate-store-integration).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/llm/lora_certificate_store.h'
      - 'src/llm/lora_certificate_store.cpp'
      - 'include/llm/lora_security_validator.h'
      - 'src/llm/lora_security_validator.cpp'
      - 'include/llm/security/signature_verifier.h'
      - 'src/llm/security/signature_verifier.cpp'
      - 'tests/test_lora_security.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/lora-certificate-store-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/llm/lora_certificate_store.h'
      - 'src/llm/lora_certificate_store.cpp'
      - 'include/llm/lora_security_validator.h'
      - 'src/llm/lora_security_validator.cpp'
      - 'include/llm/security/signature_verifier.h'
      - 'src/llm/security/signature_verifier.cpp'
      - 'tests/test_lora_security.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/lora-certificate-store-ci.yml'
  workflow_dispatch:

concurrency:
  group: lora-certificate-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  lora-certificate-store-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: LoRA Certificate Store (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run LoRACertificateStoreFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R LoRACertificateStoreFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee lora_certificate_store_results.txt

      # ── Broader LoRA security validation via unified binary ────────────────
      - name: Run LoRA security tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="LoRASecurityTest*:LoRACertificateStoreTest*:LoRACertStoreIntegrationTest*:PromptInjectionTest*:EmbeddingAnomalyTest*" \
            --gtest_output="xml:lora_certificate_store_gtest.xml" \
            2>&1 | tee lora_certificate_store_gtest_output.txt
