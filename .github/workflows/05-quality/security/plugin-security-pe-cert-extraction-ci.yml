name: Plugin Security PE Certificate Extraction CI

# Validates EnhancedPluginSecurityVerifier::extractEmbeddedCertificate()
# PE certificate-table iteration and ELF sidecar extraction
# (v1.8.0, Issue #3960).
# Covers:
#   AC-1  PE single PKCS#7 certificate extracted correctly
#   AC-2  PE multiple PKCS#7 certificates returns the first one (with warning)
#   AC-3  PE skips non-PKCS#7 record and finds next PKCS#7 record
#   AC-4  PE with no security directory returns nullopt
#   AC-5  PE with invalid magic returns nullopt
#   AC-6  PE32+ (0x20B optional header) extraction works correctly
#   AC-7  ELF sidecar .sig file extracted correctly
#   AC-8  ELF with no sidecar returns nullopt
#   AC-9  ELF .note.gnu.signature section extracted correctly
#   AC-10 ELF32 sidecar .sig file extracted correctly
#   AC-11 Unknown format returns nullopt
#   AC-12 Non-existent file returns nullopt

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/acceleration/plugin_security.h'
      - 'src/acceleration/plugin_security.cpp'
      - 'tests/test_plugin_security_pe_cert_extraction.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/05-quality/security/plugin-security-pe-cert-extraction-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/acceleration/plugin_security.h'
      - 'src/acceleration/plugin_security.cpp'
      - 'tests/test_plugin_security_pe_cert_extraction.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/05-quality/security/plugin-security-pe-cert-extraction-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  plugin-security-pe-cert-extraction-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Plugin Security PE Cert Extraction (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libcurl4-openssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Run PluginSecurityPECertExtractionTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginSecurityPECertExtractionTests \
                --output-on-failure \
                --timeout 30 \
                2>&1 | tee pe_cert_extraction_ctest.txt

      - name: Run Plugin Security PE Certificate Extraction focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_security_pe_cert_extraction_focused \
            --gtest_filter="*" \
            --gtest_output="xml:pe_cert_extraction_gtest.xml" \
            2>&1 | tee pe_cert_extraction_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pe-cert-extraction-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/pe_cert_extraction_ctest.txt
            build/pe_cert_extraction_gtest.xml
            build/pe_cert_extraction_gtest_output.txt
          retention-days: 30
