name: Build Reproducibility CI

# Triggered on every push/PR that touches build reproducibility sources,
# its test file, or this workflow itself.  Targets v1.7.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/themis/build_info.h'
      - 'src/themis/build_info.cpp'
      - 'tests/test_build_info.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/05-quality/build/build-reproducibility-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/themis/build_info.h'
      - 'src/themis/build_info.cpp'
      - 'tests/test_build_info.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/05-quality/build/build-reproducibility-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the focused Build Reproducibility test suite.
  #
  # Covers:
  #   AC-1  getBuildConfiguration()  – edition, compiler, modules, flags present
  #   AC-2  formatBuildInfo()        – output contains edition and compiler name
  #   AC-3  getVersionSummary()      – non-empty, contains "ThemisDB" and "Edition"
  #   AC-4  isModuleCompiledIn()     – known modules found; unknown modules absent
  #   AC-5  getReproducibilityInfo() – git_commit, build_host, toolchain populated
  #   AC-6  exportBuildManifest()    – creates a non-empty JSON file
  #   AC-7  verifyBuildManifest()    – fresh manifest verifies; tampered one fails
  # ---------------------------------------------------------------------------
  build-reproducibility-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Build Reproducibility (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            compiler: GCC-12
          - os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            compiler: GCC-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            ${{ matrix.cxx }} ${{ matrix.cc }} \
            libgtest-dev \
            libssl-dev \
            librocksdb-dev \
            libfmt-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libyaml-cpp-dev \
            pkg-config

      - name: Configure CMake (COMMUNITY edition)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_EDITION=COMMUNITY \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=OFF

      - name: Build themis_tests
        run: |
          cmake --build build \
            --target themis_tests \
            --parallel 4

      - name: Run BuildInfoTests (CTest)
        run: |
          set -o pipefail
          cd build
          ctest --output-on-failure \
            --tests-regex "^BuildInfoTests$" \
            --timeout 120 \
            2>&1 | tee build_info_ctest_results.txt

      - name: Run all reproducibility tests via gtest binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildConfiguration.*:BuildInfo.*:ModuleQuery.*:ReproducibilityInfo.*:BuildManifest.*" \
            --gtest_output="xml:build_reproducibility_results.xml" \
            2>&1 | tee build_reproducibility_output.txt

      - name: Verify build manifest round-trip
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildManifest.ExportedManifestVerifies:BuildManifest.TamperedManifestFailsVerification" \
            --gtest_output="xml:build_manifest_verify_results.xml" \
            2>&1 | tee build_manifest_verify_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reproducibility-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/build_info_ctest_results.txt
            build/build_reproducibility_results.xml
            build/build_reproducibility_output.txt
            build/build_manifest_verify_results.xml
            build/build_manifest_verify_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 Build Reproducibility CI (${{ matrix.compiler }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Edition** | COMMUNITY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Acceptance Criteria" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-1  getBuildConfiguration(): edition, compiler, modules, flags populated" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-2  formatBuildInfo(): contains edition and compiler info" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-3  getVersionSummary(): non-empty, contains ThemisDB and Edition" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-4  isModuleCompiledIn(): Storage Engine found; unknown module absent" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-5  getReproducibilityInfo(): git_commit, build_host, toolchain present" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-6  exportBuildManifest(): creates valid JSON with git_commit + toolchain" >> "$GITHUB_STEP_SUMMARY"
          echo "- AC-7  verifyBuildManifest(): round-trip passes; tampered manifest fails" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Documentation gate – verifies all required files are in place
  # ---------------------------------------------------------------------------
  build-reproducibility-docs-gate:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Documentation gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify implementation header is present
        run: |
          test -f include/themis/build_info.h && \
            echo "✅ include/themis/build_info.h present" || \
            (echo "❌ include/themis/build_info.h missing" && exit 1)

      - name: Verify implementation source is present
        run: |
          test -f src/themis/build_info.cpp && \
            echo "✅ src/themis/build_info.cpp present" || \
            (echo "❌ src/themis/build_info.cpp missing" && exit 1)

      - name: Verify test file is present
        run: |
          test -f tests/test_build_info.cpp && \
            echo "✅ tests/test_build_info.cpp present" || \
            (echo "❌ tests/test_build_info.cpp missing" && exit 1)

      - name: Verify ReproducibilityInfo struct is declared
        run: |
          grep -q "struct ReproducibilityInfo" include/themis/build_info.h && \
            echo "✅ ReproducibilityInfo struct found in header" || \
            (echo "❌ ReproducibilityInfo struct missing from header" && exit 1)

      - name: Verify getReproducibilityInfo API is declared
        run: |
          grep -q "getReproducibilityInfo" include/themis/build_info.h && \
            echo "✅ getReproducibilityInfo() declared in header" || \
            (echo "❌ getReproducibilityInfo() missing from header" && exit 1)

      - name: Verify exportBuildManifest API is declared
        run: |
          grep -q "exportBuildManifest" include/themis/build_info.h && \
            echo "✅ exportBuildManifest() declared in header" || \
            (echo "❌ exportBuildManifest() missing from header" && exit 1)

      - name: Verify verifyBuildManifest API is declared
        run: |
          grep -q "verifyBuildManifest" include/themis/build_info.h && \
            echo "✅ verifyBuildManifest() declared in header" || \
            (echo "❌ verifyBuildManifest() missing from header" && exit 1)

      - name: Verify CMake captures git metadata
        run: |
          grep -q "THEMIS_GIT_COMMIT" cmake/CMakeLists.txt && \
            echo "✅ THEMIS_GIT_COMMIT injected by CMake" || \
            (echo "❌ THEMIS_GIT_COMMIT missing from CMake" && exit 1)
          grep -q "THEMIS_BUILD_HOST" cmake/CMakeLists.txt && \
            echo "✅ THEMIS_BUILD_HOST injected by CMake" || \
            (echo "❌ THEMIS_BUILD_HOST missing from CMake" && exit 1)

      - name: Write job summary
        if: always()
        run: |
          echo "## 📚 Build Reproducibility — Documentation Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Header present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test file present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ReproducibilityInfo struct | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| getReproducibilityInfo() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| exportBuildManifest() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| verifyBuildManifest() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CMake git metadata capture | ✅ |" >> "$GITHUB_STEP_SUMMARY"
