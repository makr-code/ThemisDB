name: Adaptive Compaction CI

# Triggered on every push / PR that touches the adaptive compaction sources,
# the CompactionManager (extended with setConfig/getConfig), its test file,
# or this workflow itself.
# Targets v1.7.0 (roadmap:209:storage:v1.7.0:adaptive-compaction).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/storage/adaptive_compaction.h'
      - 'src/storage/adaptive_compaction.cpp'
      - 'include/storage/compaction_manager.h'
      - 'src/storage/compaction_manager.cpp'
      - 'tests/test_adaptive_compaction.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_adaptive-compaction-ci.yml'
  workflow_dispatch:

concurrency:
  group: adaptive-compaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the AdaptiveCompactionFocusedTests suite.
  # Tests cover all four acceptance criteria (AC-1 to AC-4):
  #   AC-1  Monitor read/write patterns (recordRead/recordWrite, EMA rates,
  #          background sampling start/stop)
  #   AC-2  Predict compaction impact (estimated CPU overhead, duration,
  #          urgency flag, low-impact flag)
  #   AC-3  Schedule compactions during low-load periods (isLowLoadPeriod,
  #          shouldTriggerCompaction, counter increment)
  #   AC-4  Adjust compaction triggers dynamically (getAdaptedConfig,
  #          applyAdaptedConfig, CompactionManager::setConfig/getConfig)
  # ---------------------------------------------------------------------------
  adaptive-compaction-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Adaptive Compaction tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_adaptive_compaction_focused

      - name: Run Adaptive Compaction unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex AdaptiveCompactionFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee adaptive_compaction_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-compaction-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/adaptive_compaction_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🗜️ Adaptive Compaction Scheduler – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "AdaptiveCompactionScheduler: EMA-based I/O pattern monitoring, compaction impact prediction, low-load scheduling, dynamic trigger adjustment." >> "$GITHUB_STEP_SUMMARY"
