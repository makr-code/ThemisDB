name: DiffEngine Cache Stampede CI

# Validates the fix for "DiffEngine::computeDiff() — Cache Stampede / O(N) Changefeed Scan"
# (v1.8.0, Issue analytics-9).
# Covers:
#   AC-1  in-flight set prevents concurrent callers from re-computing the same range
#   AC-2  to_sequence passed to listEvents() — only range events are materialised
#   AC-3  copy-evict-then-lock: eviction identified under brief lock, erased separately
#   AC-4  Changefeed::listEvents() respects to_sequence upper bound
#   AC-5  All original DiffEngine scenarios continue to pass

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/diff_engine.h'
      - 'src/analytics/diff_engine.cpp'
      - 'include/cdc/changefeed.h'
      - 'src/cdc/changefeed.cpp'
      - 'tests/test_diff_engine.cpp'
      - 'tests/test_cdc_changefeed_core.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_diff-engine-cache-stampede-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/diff_engine.h'
      - 'src/analytics/diff_engine.cpp'
      - 'include/cdc/changefeed.h'
      - 'src/cdc/changefeed.cpp'
      - 'tests/test_diff_engine.cpp'
      - 'tests/test_cdc_changefeed_core.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_diff-engine-cache-stampede-ci.yml'
  workflow_dispatch:

concurrency:
  group: diff-engine-cache-stampede-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the DiffEngine and ChangefeedCore focused test suites.
  # Acceptance criteria covered:
  #   AC-1  StampedePreventionConcurrentSameRange: 8 concurrent callers for the
  #         same range all return identical total_changes (no double-compute).
  #   AC-2  BoundedFetchReturnsOnlyRangeEvents: key:4 / key:5 beyond to_sequence
  #         must NOT appear in the result.
  #   AC-3  copy-evict-then-lock: two-phase eviction keeps cache_mutex_ held
  #         only for key-copy + O(1) erase, not during any expensive work.
  #   AC-4  ChangefeedCore: ListEvents_ToSequenceUpperBound confirms events
  #         beyond to_sequence are excluded.
  #   AC-5  StampedeInFlightCleanedUpOnSuccess: sequential calls after first
  #         success yield cache-hit, no deadlock.
  # ---------------------------------------------------------------------------
  diff-engine-stampede-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: DiffEngine stampede tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── DiffEngine focused tests ───────────────────────────────────────────
      - name: Run DiffEngineFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R DiffEngineFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee diff_engine_ctest.txt

      - name: Run DiffEngine tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_diff_engine_focused \
            --gtest_output="xml:diff_engine_gtest.xml" \
            2>&1 | tee diff_engine_gtest_output.txt

      # ── ChangefeedCore focused tests ───────────────────────────────────────
      - name: Run ChangefeedCoreFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ChangefeedCoreFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee changefeed_core_ctest.txt

      - name: Run ChangefeedCore tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_cdc_changefeed_core_focused \
            --gtest_output="xml:changefeed_core_gtest.xml" \
            2>&1 | tee changefeed_core_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-engine-stampede-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/diff_engine_ctest.txt
            build/diff_engine_gtest.xml
            build/diff_engine_gtest_output.txt
            build/changefeed_core_ctest.txt
            build/changefeed_core_gtest.xml
            build/changefeed_core_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🛡️ DiffEngine Cache Stampede – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "DiffEngine: stampede prevention (inflight set + cv), bounded listEvents (to_sequence), copy-evict-then-lock eviction." >> "$GITHUB_STEP_SUMMARY"
          echo "ChangefeedCore: to_sequence upper-bound, subscriptions, JSON roundtrip, watermarks, concurrent safety." >> "$GITHUB_STEP_SUMMARY"
