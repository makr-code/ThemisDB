name: 'Documentation'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Build MkDocs documentation
  build-mkdocs:
    name: Build MkDocs Site
    uses: ./.github/workflows/reusable-docs-build.yml
    with:
      docs-path: 'docs'
      mkdocs-config: 'mkdocs.yml'
      deploy-target: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'gh-pages' || 'artifact' }}

  # Build compendium docs
  build-compendium:
    name: Build Compendium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: ./.github/actions/setup-language
        with:
          language: python
          version: '3.11'

      - name: Build compendium
        run: |
          # Check if compendium build script exists
          if [ -f "compendium/build.py" ]; then
            pip install -r compendium/requirements.txt || true
            python compendium/build.py
          else
            echo "Compendium build not configured"
          fi
        continue-on-error: true

      - name: Upload compendium
        uses: actions/upload-artifact@v4
        with:
          name: compendium-docs
          path: compendium/output/
          retention-days: 30
          if-no-files-found: warn

  # Validate documentation links
  validate-links:
    name: Validate Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install markdown-link-check
        run: |
          npm install -g markdown-link-check

      - name: Check markdown links
        run: |
          find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" | \
            xargs markdown-link-check --config .markdown-link-check.json || true
        continue-on-error: true

  # Sync to wiki
  sync-wiki:
    name: Sync to Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync to wiki
        run: |
          echo "## 📚 Wiki Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Wiki synchronization would occur here in production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files to sync:" >> $GITHUB_STEP_SUMMARY
          find docs -name "*.md" | head -10 | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

  # Documentation summary
  summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    needs: [build-mkdocs, build-compendium, validate-links, sync-wiki]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 📚 Documentation Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| MkDocs Site | ${{ needs.build-mkdocs.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compendium | ${{ needs.build-compendium.result == 'success' && '✅' || (needs.build-compendium.result == 'skipped' && '⏭️' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Link Validation | ${{ needs.validate-links.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wiki Sync | ${{ needs.sync-wiki.result == 'success' && '✅' || (needs.sync-wiki.result == 'skipped' && '⏭️' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
