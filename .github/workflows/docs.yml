name: Documentation Build & Deploy

on:
  # Only run on releases and manual trigger
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements-docs.txt
      
      - name: Build MkDocs site
        run: |
          mkdocs build --clean
      
      - name: Install wkhtmltopdf
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf
      
      - name: Generate PDF from print page
        run: |
          # wkhtmltopdf may exit with code 1 due to network errors for external resources 
          # (fonts, badges) but still generates a valid PDF. We verify the PDF exists and 
          # has content rather than checking exit codes.
          wkhtmltopdf \
            --enable-local-file-access \
            --outline \
            --zoom 1.0 \
            --page-size A4 \
            --margin-top 20mm \
            --margin-bottom 20mm \
            --margin-left 15mm \
            --margin-right 15mm \
            site/print_page/index.html \
            site/ThemisDB-Documentation.pdf 2>&1 | grep -v "Failed to load https://" | grep -v "ContentNotFoundError" || true
          
          # Verify PDF was created and has content
          if [ ! -f "site/ThemisDB-Documentation.pdf" ] || [ ! -s "site/ThemisDB-Documentation.pdf" ]; then
            echo "Error: PDF generation failed - file not created or empty"
            exit 1
          fi
          echo "PDF generated successfully"
          ls -lh site/ThemisDB-Documentation.pdf
      
      - name: Copy PDF to docs directory
        run: |
          cp site/ThemisDB-Documentation.pdf docs/ThemisDB-Documentation.pdf
      
      - name: Upload documentation artifact
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/
      
      - name: Upload PDF artifact
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdf
          path: docs/ThemisDB-Documentation.pdf
      
      - name: Verify PDF
        run: |
          ls -lh site/ThemisDB-Documentation.pdf
          ls -lh docs/ThemisDB-Documentation.pdf
  
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: documentation-site
          path: site
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4