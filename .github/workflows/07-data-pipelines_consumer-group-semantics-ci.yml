name: CDC Consumer Group Semantics CI

# Triggered on every push / PR that touches the consumer group sources,
# the WebSocket handler (which integrates group-protocol support), or
# their test files.  Targets v1.8.0
# (roadmap:56:cdc:v1.8.0:consumer-group-semantics-and-offset-tracking).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/cdc/consumer_group.h'
      - 'src/cdc/consumer_group.cpp'
      - 'include/cdc/cdc_ws_handler.h'
      - 'src/cdc/cdc_ws_handler.cpp'
      - 'include/server/http_server.h'
      - 'src/server/http_server.cpp'
      - 'src/server/websocket_session.cpp'
      - 'tests/test_cdc_consumer_group.cpp'
      - 'tests/test_cdc_ws_handler.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_consumer-group-semantics-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/cdc/consumer_group.h'
      - 'src/cdc/consumer_group.cpp'
      - 'include/cdc/cdc_ws_handler.h'
      - 'src/cdc/cdc_ws_handler.cpp'
      - 'include/server/http_server.h'
      - 'src/server/http_server.cpp'
      - 'src/server/websocket_session.cpp'
      - 'tests/test_cdc_consumer_group.cpp'
      - 'tests/test_cdc_ws_handler.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_consumer-group-semantics-ci.yml'
  workflow_dispatch:

concurrency:
  group: consumer-group-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ConsumerGroup and CdcWsHandler focused test suites.
  # Tests cover all acceptance criteria for v1.8.0:
  #   AC-1  ConsumerGroupManager: createGroup / deleteGroup / groupExists
  #   AC-2  Durable offset commit (RocksDB write) and getCommittedOffset
  #   AC-3  partitionForKey / partitionForConsumer (FNV-1a 32-bit hash mod N)
  #   AC-4  fetchEvents returns only events for the consumer's partition
  #   AC-5  fetchEventsAtLeastOnce: in-flight tracking, redelivery on timeout
  #   AC-6  acknowledgeEvents advances durable committed offset
  #   AC-7  WS subscribe with group_id/consumer_id: subscription key derived
  #   AC-8  WS subscribe resumes from committed_sequence+1 on reconnect
  #   AC-9  WS ack by group_id advances durable committed offset
  #   AC-10 WS pollEvents filters events to consumer's partition
  # ---------------------------------------------------------------------------
  consumer-group-semantics-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Consumer Group Semantics (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── ConsumerGroup focused tests ────────────────────────────────────────
      - name: Run ConsumerGroupFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ConsumerGroupFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee consumer_group_results.txt

      # ── CdcWsHandler focused tests (includes group-protocol tests) ─────────
      - name: Run CdcWsHandlerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CdcWsHandlerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee cdc_ws_handler_results.txt

      # ── Broader validation via unified binary ──────────────────────────────
      - name: Run ConsumerGroup and CdcWsHandler suites via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ConsumerGroupTest*:ConsumerGroupConfigTest*:ConsumerGroupInfoTest*:CdcWsHandlerGroupTest*:CdcWsGroupIntegrationTest*:CdcWsHandlerTest*:CdcWsOverflowTest*" \
            --gtest_output="xml:consumer_group_gtest.xml" \
            2>&1 | tee consumer_group_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-group-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/consumer_group_results.txt
            build/cdc_ws_handler_results.txt
            build/consumer_group_gtest.xml
            build/consumer_group_gtest_output.txt
          retention-days: 30
