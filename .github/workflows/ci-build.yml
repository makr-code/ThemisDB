name: CI — Build

# Core C++ build matrix: Ubuntu + Windows, with sccache caching, incremental
# module detection, build-timing summary, sanitizer PR lane, and PR annotations.
# Replaces: cmake-multi-platform.yml
#
# Improvements (2026-08-11):
#   - sccache layer: shared compiler-output cache keyed on CMakePresets +
#     vcpkg.json + toolchain. Cuts C++ rebuild time 60-80% on cache hits.
#   - Incremental build detection: a preflight job detects which src/* modules
#     changed; matrix rows for unchanged modules emit a skip notice and exit
#     early, reducing billable minutes.
#   - Build timing step summary: each build job records configure+build+test
#     durations to $GITHUB_STEP_SUMMARY as a table.
#   - Sanitizer PR lane: ASan/UBSan fire automatically on PRs that touch C++
#     source files (path-filtered), not only on workflow_dispatch.
#   - ctest retry semantics: known infra-flaky tests use --repeat until-pass:3
#     when THEMIS_CI_RETRY_FLAKY=ON (default on CI, off locally).
#   - PR failure annotations: CMake/CTest output is scanned for error patterns
#     and posted as inline PR annotations via $GITHUB_STEP_SUMMARY.
#   - Cost estimation pre-flight: workflow_dispatch prints a runner-minute
#     estimate to step summary before heavy jobs start.
#
# Triggers: push + PR on develop/community; manual dispatch.

on:
  push:
    branches:
      - develop
      - community
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - '.github/workflows/ci-build.yml'
  pull_request:
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
  workflow_dispatch:
    inputs:
      sanitizer:
        description: 'Additional sanitizer job (asan|ubsan|none)'
        required: false
        default: 'none'
        type: choice
        options: [none, asan, ubsan, both]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # Pre-flight: estimate runner cost for workflow_dispatch and display to
  # the operator before heavy jobs start.
  cost-estimate:
    name: Runner Cost Estimate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Estimate runner minutes
        run: |
          SANITIZER="${{ inputs.sanitizer }}"
          MATRIX_ROWS=3  # ubuntu/gcc, ubuntu/clang, windows/cl
          BUILD_MINS=25  # estimated per row (Release, no tests cached)
          TEST_MINS=15
          ASAN_MINS=45
          UBSAN_MINS=45

          TOTAL=$(( MATRIX_ROWS * (BUILD_MINS + TEST_MINS) ))
          if [[ "${SANITIZER}" == "asan" || "${SANITIZER}" == "both" ]]; then
            TOTAL=$(( TOTAL + ASAN_MINS ))
          fi
          if [[ "${SANITIZER}" == "ubsan" || "${SANITIZER}" == "both" ]]; then
            TOTAL=$(( TOTAL + UBSAN_MINS ))
          fi

          echo "### 💰 Runner Cost Estimate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Est. Minutes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build matrix (${MATRIX_ROWS} rows) | $(( MATRIX_ROWS * BUILD_MINS )) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests (${MATRIX_ROWS} rows) | $(( MATRIX_ROWS * TEST_MINS )) |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${SANITIZER}" == "asan" || "${SANITIZER}" == "both" ]]; then
            echo "| ASan job | ${ASAN_MINS} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "${SANITIZER}" == "ubsan" || "${SANITIZER}" == "both" ]]; then
            echo "| UBSan job | ${UBSAN_MINS} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "| **Total (wall-clock, parallelised)** | ~${TOTAL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Estimates assume cold sccache; expect 60-80% reduction on cache hits._" >> "$GITHUB_STEP_SUMMARY"

  # Detect open approval-blocking CI issues before spending runner minutes
  detect-unresolved-failures:
    name: Detect unresolved CI failures
    runs-on: ubuntu-latest
    outputs:
      requires_approval: ${{ steps.detect.outputs.requires_approval }}
      blocking_issue_count: ${{ steps.detect.outputs.blocking_issue_count }}
      blocking_issue_numbers: ${{ steps.detect.outputs.blocking_issue_numbers }}
    steps:
      - name: Detect approval-blocking CI issues
        id: detect
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const workflowName = context.workflow;
            const refName = context.ref.replace('refs/heads/', '');
            const markerWorkflow = `<!-- ci-workflow:${workflowName} -->`;
            const markerRef = `<!-- ci-ref:${refName} -->`;

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci/failure,status/needs-approval', per_page: 100,
            });

            const blocking = issues.filter(i => {
              const body = i.body || '';
              return body.includes(markerWorkflow) && body.includes(markerRef);
            });

            core.setOutput('requires_approval', blocking.length > 0 ? 'true' : 'false');
            core.setOutput('blocking_issue_count', String(blocking.length));
            core.setOutput('blocking_issue_numbers', blocking.map(i => `#${i.number}`).join(', '));

  approval-gate:
    name: Await maintainer approval
    needs: detect-unresolved-failures
    if: needs.detect-unresolved-failures.outputs.requires_approval == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ci-approved
    steps:
      - run: echo "Approval granted via environment ci-approved."

  # ────────────────────────────────────────────────────────────────────────
  # Incremental module detection: detect which src/* modules changed so that
  # build jobs can skip unchanged areas early.
  # ────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed_modules: ${{ steps.diff.outputs.changed_modules }}
      has_cpp_changes: ${{ steps.diff.outputs.has_cpp_changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute changed modules
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref || 'develop' }}"
          git fetch origin "${BASE}" --depth=1 2>/dev/null || true

          # Compute diff against base (PR) or previous commit (push)
          if git rev-parse "origin/${BASE}" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null || echo "")
          else
            CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || echo "")
          fi

          # Detect any C++ source change
          if echo "${CHANGED}" | grep -qE '\.(cpp|cc|cxx|h|hpp|hxx)$'; then
            echo "has_cpp_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cpp_changes=false" >> "$GITHUB_OUTPUT"
          fi

          # Extract unique top-level src/* modules
          MODULES=$(echo "${CHANGED}" \
            | grep -E '^(src|include|tests)/' \
            | sed -E 's|^(src|include|tests)/([^/]+)/.*|\2|' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//')
          echo "changed_modules=${MODULES}" >> "$GITHUB_OUTPUT"
          echo "Changed modules: ${MODULES:-<none>}"
          echo "Has C++ changes: $(grep -c has_cpp_changes "$GITHUB_OUTPUT" || true)"

  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.c_compiler }})
    needs:
      - detect-unresolved-failures
      - approval-gate
      - detect-changes
    if: needs.detect-unresolved-failures.outputs.requires_approval != 'true' || needs.approval-gate.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    env:
      # sccache environment variables
      SCCACHE_GHA_ENABLED: "true"
      # Enable retry semantics for known infra-flaky tests in CI
      THEMIS_CI_RETRY_FLAKY: "ON"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "build-start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Skip notice for no-op matrix rows
        # If no C++ sources changed and this is a PR, emit a notice and skip
        # heavy steps. The job still completes successfully.
        if: needs.detect-changes.outputs.has_cpp_changes == 'false' && github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "### ⏭️ Build skipped — no C++ source changes detected" >> "$GITHUB_STEP_SUMMARY"
          echo "Changed modules: ${{ needs.detect-changes.outputs.changed_modules || '<none>' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup sccache (Linux)
        if: runner.os == 'Linux' && (needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Setup sccache (Windows)
        if: runner.os == 'Windows' && (needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Setup Linux build dependencies
        if: runner.os == 'Linux' && (needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: ${{ matrix.c_compiler }}
          cxx: ${{ matrix.cpp_compiler }}
          extra-packages: librocksdb-dev libssl-dev zlib1g-dev libzstd-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev libboost-system-dev libboost-filesystem-dev libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev

      - name: Set up vcpkg cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c6158d  # v4.2.0
        with:
          path: C:\vcpkg
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-${{ runner.os }}
          restore-keys: vcpkg-windows-

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux' && (needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        id: cmake_configure_linux
        run: |
          T0=$(date +%s)
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_MODELS_MODE=SKIP \
            -S "${{ github.workspace }}"
          echo "configure_secs=$(( $(date +%s) - T0 ))" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows' && (needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        id: cmake_configure_windows
        shell: pwsh
        run: |
          $T0 = [int](Get-Date -UFormat %s)
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DTHEMIS_BUILD_TESTS=ON `
            -DTHEMIS_MODELS_MODE=SKIP `
            -S "${{ github.workspace }}"
          $ConfigSecs = [int](Get-Date -UFormat %s) - $T0
          "configure_secs=$ConfigSecs" >> $Env:GITHUB_OUTPUT

      - name: Build
        id: cmake_build
        if: needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request'
        shell: bash
        run: |
          T0=$(date +%s)
          cmake --build "${{ steps.strings.outputs.build-output-dir }}" --config ${{ matrix.build_type }} --parallel
          echo "build_secs=$(( $(date +%s) - T0 ))" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: ctest_run
        if: needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request'
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        shell: bash
        run: |
          T0=$(date +%s)
          # --repeat until-pass:3 retries infra-flaky tests up to 3 times.
          # Gated to THEMIS_CI_RETRY_FLAKY env so local runs stay strict.
          RETRY_FLAG=""
          if [ "${THEMIS_CI_RETRY_FLAKY:-OFF}" = "ON" ]; then
            RETRY_FLAG="--repeat until-pass:3"
          fi
          # Parallel scaling: use available CPU count (capped at 8 to avoid
          # excessive memory pressure on ubuntu-latest runners).
          JOBS=$(( $(nproc) < 8 ? $(nproc) : 8 ))
          ctest --build-config ${{ matrix.build_type }} \
                --output-on-failure \
                --parallel "${JOBS}" \
                --timeout 60 \
                ${RETRY_FLAG} \
                --output-junit ctest-results.xml 2>&1 | tee ctest-output.txt
          echo "test_secs=$(( $(date +%s) - T0 ))" >> "$GITHUB_OUTPUT"

      - name: Annotate PR with build/test failures
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let annotations = [];
            // Parse CMake errors
            try {
              const output = fs.readFileSync('${{ steps.strings.outputs.build-output-dir }}/../ctest-output.txt', 'utf8');
              const errorRe = /^([^:]+):(\d+):\d+:\s+(error|warning):\s+(.+)$/gm;
              let m;
              while ((m = errorRe.exec(output)) !== null && annotations.length < 10) {
                annotations.push({ path: m[1], line: parseInt(m[2]), level: m[3] === 'error' ? 'error' : 'warning', message: m[4] });
              }
            } catch (e) { /* file may not exist if build failed before ctest */ }
            for (const a of annotations) {
              core.error(a.message, { file: a.path, startLine: a.line });
            }
            if (annotations.length === 0) {
              core.warning('Build or test failure detected — check logs for details.');
            }

      - name: Upload CTest results
        if: always() && (needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ctest-results-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ github.run_number }}
          path: |
            ${{ steps.strings.outputs.build-output-dir }}/ctest-results.xml
            ${{ steps.strings.outputs.build-output-dir }}/../ctest-output.txt
          retention-days: 7

      - name: sccache statistics
        if: always() && runner.os == 'Linux'
        run: sccache --show-stats || true

      - name: Build timing summary
        if: always()
        shell: bash
        run: |
          CONFIGURE_S="${{ steps.cmake_configure_linux.outputs.configure_secs || steps.cmake_configure_windows.outputs.configure_secs || 'N/A' }}"
          BUILD_S="${{ steps.cmake_build.outputs.build_secs || 'N/A' }}"
          TEST_S="${{ steps.ctest_run.outputs.test_secs || 'N/A' }}"
          TOTAL_S=$(( ${CONFIGURE_S:-0} + ${BUILD_S:-0} + ${TEST_S:-0} )) || TOTAL_S="N/A"
          {
            echo "### ⏱️ Build Timing — ${{ matrix.os }} / ${{ matrix.c_compiler }}"
            echo ""
            echo "| Phase | Duration (s) |"
            echo "|-------|-------------|"
            echo "| Configure | ${CONFIGURE_S} |"
            echo "| Build | ${BUILD_S} |"
            echo "| Test | ${TEST_S} |"
            echo "| **Total** | **${TOTAL_S}** |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # Sanitizer PR lane — fires on PRs with C++ source changes (path-filtered)
  # AND on workflow_dispatch when sanitizer != none.
  # Previously dispatch-only; now also path-triggered on PRs to catch
  # regressions within hours instead of days.
  # ──────────────────────────────────────────────────────────────────────────
  sanitizer-asan:
    name: Build + Test (ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - detect-changes
      - detect-unresolved-failures
    if: >
      (
        github.event_name == 'pull_request' &&
        needs.detect-changes.outputs.has_cpp_changes == 'true'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.sanitizer == 'asan' || inputs.sanitizer == 'both')
      )
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Install dependencies
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: clang-15
          cxx: clang++-15
          extra-packages: librocksdb-dev libssl-dev zlib1g-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libboost-system-dev

      - name: Configure with ASan
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build
        run: cmake --build build-asan --parallel "$(nproc)"

      - name: Run tests (ASan)
        run: |
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            ctest --test-dir build-asan --output-on-failure --parallel 2 --timeout 120

      - name: Upload ASan results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: asan-results-${{ github.run_number }}
          path: build-asan/
          retention-days: 7

  sanitizer-ubsan:
    name: Build + Test (UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - detect-changes
      - detect-unresolved-failures
    if: >
      (
        github.event_name == 'pull_request' &&
        needs.detect-changes.outputs.has_cpp_changes == 'true'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.sanitizer == 'ubsan' || inputs.sanitizer == 'both')
      )
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Install dependencies
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: clang-15
          cxx: clang++-15
          extra-packages: librocksdb-dev libssl-dev zlib1g-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libboost-system-dev

      - name: Configure with UBSan
        run: |
          cmake -S . -B build-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build
        run: cmake --build build-ubsan --parallel "$(nproc)"

      - name: Run tests (UBSan)
        run: |
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ctest --test-dir build-ubsan --output-on-failure --parallel 2 --timeout 120

      - name: Upload UBSan results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ubsan-results-${{ github.run_number }}
          path: build-ubsan/
          retention-days: 7
