name: CI — Build

# Core C++ build matrix: Ubuntu + Windows, with sccache caching, incremental
# module detection, build-timing summary, sanitizer PR lane, PR annotations,
# and detailed debug/diagnostic output on every step.
# Replaces: cmake-multi-platform.yml
#
# Improvements (2026-08-11):
#   - sccache: shared compiler-output cache (60-80% faster on cache hits).
#   - Incremental detection: changed-module preflight skips unchanged rows.
#   - Build timing table in $GITHUB_STEP_SUMMARY per matrix row.
#   - Sanitizer PR lane: ASan/UBSan fire on C++ PRs, not only dispatch.
#   - ctest retry: --repeat until-pass:3 for infra-flaky tests.
#   - PR failure annotations: CMake/CTest errors posted as inline comments.
#   - Cost estimation: dispatch pre-flight prints runner-minute estimate.
#   - Debug output: every step prints machine info, env vars, timing, and
#     a human-readable status line so failures are immediately diagnosable.

on:
  push:
    branches:
      - develop
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - '.github/workflows/ci-build.yml'
  pull_request:
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
  workflow_dispatch:
    inputs:
      sanitizer:
        description: 'Additional sanitizer job (asan|ubsan|none|both)'
        required: false
        default: 'none'
        type: choice
        options: [none, asan, ubsan, both]
      debug_mode:
        description: 'Enable extra verbose debug output'
        required: false
        default: 'false'
        type: boolean

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: write
  checks: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Cost estimation (workflow_dispatch only) ────────────────────────────
  cost-estimate:
    name: 💰 Runner Cost Estimate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Print trigger context
        run: |
          echo "============================================================"
          echo " CI — Build  |  Cost Estimate Pre-flight"
          echo "============================================================"
          echo "  Triggered by : workflow_dispatch"
          echo "  Actor        : ${{ github.actor }}"
          echo "  Ref          : ${{ github.ref }}"
          echo "  Sanitizer    : ${{ inputs.sanitizer }}"
          echo "  Debug mode   : ${{ inputs.debug_mode }}"
          echo "  Run ID       : ${{ github.run_id }}"
          echo "  Run number   : ${{ github.run_number }}"
          echo "============================================================"

      - name: Estimate runner minutes
        run: |
          SANITIZER="${{ inputs.sanitizer }}"
          MATRIX_ROWS=3
          BUILD_MINS=25
          TEST_MINS=15
          ASAN_MINS=45
          UBSAN_MINS=45

          TOTAL=$(( MATRIX_ROWS * (BUILD_MINS + TEST_MINS) ))
          [[ "${SANITIZER}" == "asan"  || "${SANITIZER}" == "both" ]] && TOTAL=$(( TOTAL + ASAN_MINS ))
          [[ "${SANITIZER}" == "ubsan" || "${SANITIZER}" == "both" ]] && TOTAL=$(( TOTAL + UBSAN_MINS ))

          echo ""
          echo "──────────────────────────────────────────────"
          echo "  Runner cost estimate (minutes)"
          echo "──────────────────────────────────────────────"
          printf "  %-30s %s\n" "Build matrix (${MATRIX_ROWS} rows)" "$(( MATRIX_ROWS * BUILD_MINS )) min"
          printf "  %-30s %s\n" "Tests (${MATRIX_ROWS} rows)"        "$(( MATRIX_ROWS * TEST_MINS )) min"
          [[ "${SANITIZER}" == "asan"  || "${SANITIZER}" == "both" ]] && printf "  %-30s %s\n" "ASan job"  "${ASAN_MINS} min"
          [[ "${SANITIZER}" == "ubsan" || "${SANITIZER}" == "both" ]] && printf "  %-30s %s\n" "UBSan job" "${UBSAN_MINS} min"
          echo "  ──────────────────────────────────────────"
          printf "  %-30s %s\n" "Estimated total" "~${TOTAL} min"
          echo "  (60-80% reduction on sccache hit)"
          echo "──────────────────────────────────────────────"

          {
            echo "### 💰 Runner Cost Estimate"
            echo ""
            echo "| Component | Est. Minutes |"
            echo "|-----------|-------------|"
            echo "| Build matrix (${MATRIX_ROWS} rows) | $(( MATRIX_ROWS * BUILD_MINS )) |"
            echo "| Tests (${MATRIX_ROWS} rows) | $(( MATRIX_ROWS * TEST_MINS )) |"
            [[ "${SANITIZER}" == "asan"  || "${SANITIZER}" == "both" ]] && echo "| ASan job | ${ASAN_MINS} |"
            [[ "${SANITIZER}" == "ubsan" || "${SANITIZER}" == "both" ]] && echo "| UBSan job | ${UBSAN_MINS} |"
            echo "| **Total (parallelised, cold cache)** | **~${TOTAL} min** |"
            echo ""
            echo "_sccache hit: expect 60–80% reduction. Triggered by \`${{ github.actor }}\` at $(date -u)._"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Incremental module detection ───────────────────────────────────────
  detect-changes:
    name: 🔎 Detect Changed Modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed_modules: ${{ steps.diff.outputs.changed_modules }}
      has_cpp_changes: ${{ steps.diff.outputs.has_cpp_changes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Compute changed modules
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================================"
          echo " CI — Build  |  Changed Module Detection"
          echo "============================================================"
          echo "  Event    : ${{ github.event_name }}"
          echo "  Base ref : ${{ github.base_ref || 'develop' }}"
          echo "  HEAD SHA : $(git rev-parse HEAD)"
          echo "============================================================"

          BASE="${{ github.base_ref || 'develop' }}"
          git fetch origin "${BASE}" --depth=1 2>/dev/null || true

          if git rev-parse "origin/${BASE}" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only "origin/${BASE}...HEAD" 2>/dev/null || echo "")
            echo "  Diff base: origin/${BASE}"
          else
            CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || echo "")
            echo "  Diff base: HEAD~1 (base branch not available)"
          fi

          CHANGED_COUNT=$(echo "${CHANGED}" | grep -c . || true)
          echo ""
          echo "  Total changed files : ${CHANGED_COUNT}"
          echo ""

          if echo "${CHANGED}" | grep -qE '\.(cpp|cc|cxx|h|hpp|hxx)$'; then
            echo "has_cpp_changes=true" >> "$GITHUB_OUTPUT"
            CPP_COUNT=$(echo "${CHANGED}" | grep -cE '\.(cpp|cc|cxx|h|hpp|hxx)$' || true)
            echo "  C++ source changes  : ✅ YES (${CPP_COUNT} file(s))"
          else
            echo "has_cpp_changes=false" >> "$GITHUB_OUTPUT"
            echo "  C++ source changes  : ⏭️  NONE — build matrix rows will be skipped on PRs"
          fi

          MODULES=$(printf '%s\n' "${CHANGED}" \
            | awk -F/ '/^(src|include|tests)\// && NF >= 2 { print $2 }' \
            | sort -u \
            | paste -sd, -)
          echo "changed_modules=${MODULES}" >> "$GITHUB_OUTPUT"

          echo ""
          echo "  Changed modules : ${MODULES:-<none>}"
          echo ""
          echo "  Changed files (first 20):"
          echo "${CHANGED}" | head -20 | sed 's/^/    /'
          [ "${CHANGED_COUNT}" -gt 20 ] && echo "    ... and $(( CHANGED_COUNT - 20 )) more"
          echo "============================================================"

  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build (${{ matrix.os }}, ${{ matrix.c_compiler }})
    needs:
      - detect-changes
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    env:
      SCCACHE_GHA_ENABLED: "true"
      THEMIS_CI_RETRY_FLAKY: "ON"

    steps:
      - name: Print matrix context
        shell: bash
        run: |
          echo "============================================================"
          echo " CI — Build  |  Matrix Job Start"
          echo "============================================================"
          echo "  OS           : ${{ matrix.os }}"
          echo "  Compiler     : ${{ matrix.c_compiler }}"
          echo "  Build type   : ${{ matrix.build_type }}"
          echo "  Event        : ${{ github.event_name }}"
          echo "  Ref          : ${{ github.ref }}"
          echo "  SHA          : ${{ github.sha }}"
          echo "  Run ID       : ${{ github.run_id }}  (#${{ github.run_number }})"
          echo "  Actor        : ${{ github.actor }}"
          echo "  Changed mods : ${{ needs.detect-changes.outputs.changed_modules || '<none>' }}"
          echo "  Has C++ chg  : ${{ needs.detect-changes.outputs.has_cpp_changes }}"
          echo "  sccache      : ENABLED (GHA backend)"
          echo "  Retry flaky  : ON (--repeat until-pass:3)"
          echo "============================================================"
          uname -a || true
          nproc || true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
          echo "build-start=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "  Build output dir: ${{ github.workspace }}/build"

      - name: Skip notice for no-op matrix rows
        if: (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'false') && github.event_name == 'pull_request'
        shell: bash
        run: |
          echo ""
          echo "  ⏭️  SKIP: No C++ source changes detected in this PR."
          echo "  Changed modules: ${{ needs.detect-changes.outputs.changed_modules || '<none>' }}"
          echo "  This matrix row exits early to save runner minutes."
          echo ""
          {
            echo "### ⏭️ Build Skipped — ${{ matrix.os }} / ${{ matrix.c_compiler }}"
            echo ""
            echo "No C++ source changes detected. Build and test steps skipped."
            echo ""
            echo "Changed modules: \`${{ needs.detect-changes.outputs.changed_modules || 'none' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup sccache (Linux)
        if: runner.os == 'Linux' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Setup sccache (Windows)
        if: runner.os == 'Windows' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Print sccache status
        if: needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "  sccache version:"
          sccache --version 2>/dev/null || echo "  (sccache not in PATH yet — provided by action)"
          echo "  sccache GHA_ENABLED=${SCCACHE_GHA_ENABLED}"

      - name: Setup Linux build dependencies
        if: runner.os == 'Linux' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: ${{ matrix.c_compiler }}
          cxx: ${{ matrix.cpp_compiler }}
          extra-packages: librocksdb-dev libssl-dev zlib1g-dev libzstd-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev libboost-system-dev libboost-filesystem-dev libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev

      - name: Print compiler info (Linux)
        if: runner.os == 'Linux' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        run: |
          echo "──────────────────────────────────────────────"
          echo "  Compiler info"
          echo "──────────────────────────────────────────────"
          ${{ matrix.cpp_compiler }} --version || true
          ${{ matrix.c_compiler }} --version || true
          cmake --version || true
          ninja --version || true
          echo "──────────────────────────────────────────────"

      - name: Set up vcpkg cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf  # v4.2.2
        with:
          path: ${{ github.workspace }}\vcpkg
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.gitmodules') }}-${{ runner.os }}
          restore-keys: vcpkg-windows-

      - name: Preflight vcpkg submodule (Windows)
        if: runner.os == 'Windows' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host " vcpkg submodule preflight"
          Write-Host "============================================================"
          git submodule sync -- vcpkg
          git submodule update --init --recursive vcpkg
          $toolchain = Join-Path "${{ github.workspace }}" "vcpkg\scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path $toolchain)) {
            throw "Missing vcpkg toolchain: $toolchain"
          }
          Write-Host "  vcpkg toolchain found: $toolchain"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host " vcpkg bootstrap"
          Write-Host "============================================================"
          $vcpkgRoot = Join-Path "${{ github.workspace }}" "vcpkg"
          $bootstrap = Join-Path $vcpkgRoot "bootstrap-vcpkg.bat"
          if (-not (Test-Path $bootstrap)) {
            throw "Missing vcpkg bootstrap script: $bootstrap"
          }
          & $bootstrap -disableMetrics
          & (Join-Path $vcpkgRoot "vcpkg.exe") version

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        id: cmake_configure_linux
        run: |
          echo "──────────────────────────────────────────────"
          echo "  CMake configure (Linux)"
          echo "──────────────────────────────────────────────"
          echo "  Build dir    : ${{ steps.strings.outputs.build-output-dir }}"
          echo "  C compiler   : ${{ matrix.c_compiler }}"
          echo "  CXX compiler : ${{ matrix.cpp_compiler }}"
          echo "  Build type   : ${{ matrix.build_type }}"
          echo "  sccache      : launcher enabled"
          echo "──────────────────────────────────────────────"
          T0=$(date +%s)
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
            -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_MODELS_MODE=SKIP \
            -S "${{ github.workspace }}"
          CONFIGURE_SECS=$(( $(date +%s) - T0 ))
          echo "configure_secs=${CONFIGURE_SECS}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "  ✅ CMake configure completed in ${CONFIGURE_SECS}s"

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        id: cmake_configure_windows
        shell: pwsh
        run: |
          Write-Host "============================================================"
          Write-Host " CMake configure (Windows)"
          Write-Host "============================================================"
          Write-Host "  Build dir  : ${{ steps.strings.outputs.build-output-dir }}"
          Write-Host "  Compiler   : ${{ matrix.c_compiler }} (MSVC)"
          Write-Host "  Build type : ${{ matrix.build_type }}"
          Write-Host "  vcpkg      : ${{ github.workspace }}\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"
          Write-Host "  sccache    : launcher enabled"
          Write-Host "============================================================"
          $T0 = [int](Get-Date -UFormat %s)
          cmake -B "${{ steps.strings.outputs.build-output-dir }}" `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DTHEMIS_BUILD_TESTS=ON `
            -DTHEMIS_MODELS_MODE=SKIP `
            -S "${{ github.workspace }}"
          $ConfigSecs = [int](Get-Date -UFormat %s) - $T0
          "configure_secs=$ConfigSecs" >> $Env:GITHUB_OUTPUT
          Write-Host ""
          Write-Host "  ✅ CMake configure completed in ${ConfigSecs}s"

      - name: Build
        id: cmake_build
        if: needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "──────────────────────────────────────────────"
          echo "  cmake --build"
          echo "──────────────────────────────────────────────"
          JOBS=$(( $(nproc 2>/dev/null || echo 4) ))
          echo "  Parallel jobs: ${JOBS}"
          echo "──────────────────────────────────────────────"
          T0=$(date +%s)
          cmake --build "${{ steps.strings.outputs.build-output-dir }}" \
            --config ${{ matrix.build_type }} --parallel
          BUILD_SECS=$(( $(date +%s) - T0 ))
          echo "build_secs=${BUILD_SECS}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "  ✅ Build completed in ${BUILD_SECS}s"

      - name: Run tests
        id: ctest_run
        if: needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request'
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        shell: bash
        run: |
          echo "──────────────────────────────────────────────"
          echo "  ctest"
          echo "──────────────────────────────────────────────"
          JOBS=$(( $(nproc 2>/dev/null || echo 4) < 8 ? $(nproc 2>/dev/null || echo 4) : 8 ))
          echo "  Parallel jobs : ${JOBS}"
          echo "  Timeout/test  : 60s"
          echo "  Retry flag    : ${THEMIS_CI_RETRY_FLAKY:-OFF}"
          echo "──────────────────────────────────────────────"
          RETRY_ARGS=()
          if [ "${THEMIS_CI_RETRY_FLAKY:-OFF}" = "ON" ]; then
            RETRY_ARGS=(--repeat until-pass:3)
          fi
          T0=$(date +%s)
          set +e
          ctest --build-config "${{ matrix.build_type }}" \
                --output-on-failure \
                --parallel "${JOBS}" \
                --timeout 60 \
                "${RETRY_ARGS[@]}" \
                --output-junit ctest-results.xml 2>&1 | tee ctest-output.txt
          CTEST_EXIT=$?
          TEST_SECS=$(( $(date +%s) - T0 ))
          echo "test_secs=${TEST_SECS}" >> "$GITHUB_OUTPUT"
          echo "ctest_exit=${CTEST_EXIT}" >> "$GITHUB_OUTPUT"
          echo ""
          if [ "${CTEST_EXIT}" -eq 0 ]; then
            echo "  ✅ All tests passed in ${TEST_SECS}s"
          else
            echo "  ❌ Test failures detected (exit ${CTEST_EXIT}) after ${TEST_SECS}s"
            echo "     Review ctest-output.txt above for details."
          fi
          # Count pass/fail from JUnit XML if available
          if [ -f ctest-results.xml ]; then
            PASS=$(grep -c 'testcase' ctest-results.xml 2>/dev/null || echo '?')
            FAIL=$(grep -c '<failure' ctest-results.xml 2>/dev/null || echo '0')
            echo "  Test cases: ${PASS} total, ${FAIL} failures"
          fi
          exit ${CTEST_EXIT}

      - name: Verify Wave A Release-Critical Gate
        if: success() && contains(matrix.preset, 'linux-release')
        run: |
          cd build
          echo "Running Wave A Release-Critical Tests (108 tests)..."
          echo "├─ Phase 6 Hardening (TXC-01..32, FLR-01..20): 52 tests"
          echo "├─ Fault Injection (FI-01..40): 40 tests"
          echo "└─ Contract Hardening (SCR-01..16): 16 tests"
          
          T0=$(date +%s)
          ctest --label-include release_critical \
                --output-on-failure \
                --timeout 120 \
                -R "sharding" \
                --output-junit wave-a-gate-results.xml 2>&1 | tee wave-a-gate.log
          WAVE_A_EXIT=$?
          TEST_SECS=$(( $(date +%s) - T0 ))
          
          if [ "${WAVE_A_EXIT}" -eq 0 ]; then
            echo ""
            echo "✅ Wave A Release-Critical Gate PASSED (${TEST_SECS}s)"
            PASS=$(grep -c 'testcase' wave-a-gate-results.xml 2>/dev/null || echo '?')
            FAIL=$(grep -c '<failure' wave-a-gate-results.xml 2>/dev/null || echo '0')
            echo "   Expected: 108+ tests, Got: ${PASS} total, ${FAIL} failures"
          else
            echo ""
            echo "❌ Wave A Release-Critical Gate FAILED (exit ${WAVE_A_EXIT}) after ${TEST_SECS}s"
            echo "   Review wave-a-gate.log above for details"
          fi
          exit ${WAVE_A_EXIT}

      - name: Upload Wave A Gate Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-a-gate-results-${{ matrix.preset }}
          path: |
            build/wave-a-gate-results.xml
            build/wave-a-gate.log
          retention-days: 30

      - name: Annotate PR with build/test failures
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let annotations = [];
            let rawOutput = '';
            try {
              rawOutput = fs.readFileSync('${{ steps.strings.outputs.build-output-dir }}/ctest-output.txt', 'utf8');
            } catch (e) {
              core.warning('ctest-output.txt not found — build may have failed before tests ran.');
            }

            // Parse CMake/compiler error lines: file:line:col: error: message
            const errorRe = /^([^:\s][^:]*):(\d+):\d+:\s+(error|warning):\s+(.+)$/gm;
            let m;
            while ((m = errorRe.exec(rawOutput)) !== null && annotations.length < 15) {
              annotations.push({
                path: m[1].replace(process.env.GITHUB_WORKSPACE + '/', ''),
                line: parseInt(m[2]),
                level: m[3],
                message: `[${m[3].toUpperCase()}] ${m[4]}`
              });
            }

            console.log(`Parsed ${annotations.length} annotation(s) from build/test output.`);
            for (const a of annotations) {
              if (a.level === 'error') {
                core.error(a.message, { file: a.path, startLine: a.line });
              } else {
                core.warning(a.message, { file: a.path, startLine: a.line });
              }
            }
            if (annotations.length === 0) {
              core.error(
                `Build or test failure on ${{ matrix.os }}/${{ matrix.c_compiler }} — ` +
                `check the job log for details (ctest-output.txt artifact).`
              );
            }

      - name: Upload CTest results
        if: always() && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ctest-results-${{ matrix.os }}-${{ matrix.c_compiler }}-${{ github.run_number }}
          path: |
            ${{ steps.strings.outputs.build-output-dir }}/ctest-results.xml
            ${{ steps.strings.outputs.build-output-dir }}/ctest-output.txt
          retention-days: 7  # short tier per ci-scope-config.yaml

      - name: Print sccache statistics
        if: always() && runner.os == 'Linux' && (needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true' || github.event_name != 'pull_request')
        run: |
          echo "──────────────────────────────────────────────"
          echo "  sccache statistics"
          echo "──────────────────────────────────────────────"
          sccache --show-stats || echo "  (sccache stats unavailable)"
          echo "──────────────────────────────────────────────"

      - name: Build timing summary
        if: always()
        shell: bash
        run: |
          CONFIGURE_S="${{ steps.cmake_configure_linux.outputs.configure_secs || steps.cmake_configure_windows.outputs.configure_secs || 'N/A' }}"
          BUILD_S="${{ steps.cmake_build.outputs.build_secs || 'N/A' }}"
          TEST_S="${{ steps.ctest_run.outputs.test_secs || 'N/A' }}"
          CTEST_EXIT="${{ steps.ctest_run.outputs.ctest_exit || 'N/A' }}"
          STATUS="✅ passed"
          [ "${CTEST_EXIT}" != "0" ] && [ "${CTEST_EXIT}" != "N/A" ] && STATUS="❌ failed (exit ${CTEST_EXIT})"

          echo ""
          echo "──────────────────────────────────────────────"
          echo "  Build timing — ${{ matrix.os }} / ${{ matrix.c_compiler }}"
          echo "──────────────────────────────────────────────"
          printf "  %-15s %s\n" "Configure" "${CONFIGURE_S}s"
          printf "  %-15s %s\n" "Build"     "${BUILD_S}s"
          printf "  %-15s %s\n" "Test"      "${TEST_S}s"
          printf "  %-15s %s\n" "Tests"     "${STATUS}"
          echo "──────────────────────────────────────────────"

          {
            echo "### ⏱️ Build Timing — ${{ matrix.os }} / ${{ matrix.c_compiler }}"
            echo ""
            echo "| Phase | Duration |"
            echo "|-------|----------|"
            echo "| ⚙️ Configure | ${CONFIGURE_S}s |"
            echo "| 🔨 Build | ${BUILD_S}s |"
            echo "| 🧪 Test | ${TEST_S}s |"
            echo "| 📊 Test result | ${STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # Sanitizer PR lane
  # ──────────────────────────────────────────────────────────────────────────
  sanitizer-asan:
    name: 🔬 Build + Test (ASan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - detect-changes
    if: >
      (
        github.event_name == 'pull_request' &&
        needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.sanitizer == 'asan' || inputs.sanitizer == 'both')
      )
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Print ASan job context
        run: |
          echo "============================================================"
          echo " CI — Build  |  ASan (Address Sanitizer) Job"
          echo "============================================================"
          echo "  Trigger  : ${{ github.event_name }}"
          echo "  SHA      : ${{ github.sha }}"
          echo "  Reason   : ${{ github.event_name == 'pull_request' && 'C++ changes detected in PR' || 'workflow_dispatch' }}"
          echo "  sccache  : ENABLED"
          echo "  ASan opts: detect_leaks=1:abort_on_error=1"
          echo "============================================================"
          uname -a

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Install dependencies
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: clang-15
          cxx: clang++-15
          extra-packages: librocksdb-dev libssl-dev zlib1g-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libboost-system-dev

      - name: Print compiler version
        run: |
          clang++-15 --version
          echo "  sccache version: $(sccache --version 2>/dev/null || echo 'N/A')"

      - name: Configure with ASan
        run: |
          echo "  Configuring with -fsanitize=address -fno-omit-frame-pointer ..."
          T0=$(date +%s)
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_MODELS_MODE=SKIP
          echo "  ✅ Configure completed in $(( $(date +%s) - T0 ))s"

      - name: Build
        run: |
          T0=$(date +%s)
          cmake --build build-asan --parallel "$(nproc)"
          echo "  ✅ ASan build completed in $(( $(date +%s) - T0 ))s"

      - name: Run tests (ASan)
        run: |
          echo "──────────────────────────────────────────────"
          echo "  Running tests with ASan enabled"
          echo "  ASAN_OPTIONS=detect_leaks=1:abort_on_error=1"
          echo "──────────────────────────────────────────────"
          T0=$(date +%s)
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            ctest --test-dir build-asan --output-on-failure --parallel 2 --timeout 120 2>&1 | tee asan-output.txt
          SECS=$(( $(date +%s) - T0 ))
          echo "  ✅ ASan tests completed in ${SECS}s"
          {
            echo "### 🔬 ASan Results"
            echo ""
            echo "Tests completed in **${SECS}s**. Check \`asan-results\` artifact for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Upload ASan results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: asan-results-${{ github.run_number }}
          path: |
            asan-output.txt
          retention-days: 7

  sanitizer-ubsan:
    name: 🔬 Build + Test (UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - detect-changes
    if: >
      (
        github.event_name == 'pull_request' &&
        needs.detect-changes.outputs.has_cpp_changes != '' && needs.detect-changes.outputs.has_cpp_changes == 'true'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        (inputs.sanitizer == 'ubsan' || inputs.sanitizer == 'both')
      )
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Print UBSan job context
        run: |
          echo "============================================================"
          echo " CI — Build  |  UBSan (Undefined Behaviour Sanitizer) Job"
          echo "============================================================"
          echo "  Trigger   : ${{ github.event_name }}"
          echo "  SHA       : ${{ github.sha }}"
          echo "  Reason    : ${{ github.event_name == 'pull_request' && 'C++ changes detected in PR' || 'workflow_dispatch' }}"
          echo "  sccache   : ENABLED"
          echo "  UBSan opts: halt_on_error=1:print_stacktrace=1"
          echo "============================================================"
          uname -a

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Install dependencies
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: clang-15
          cxx: clang++-15
          extra-packages: librocksdb-dev libssl-dev zlib1g-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libboost-system-dev

      - name: Print compiler version
        run: |
          clang++-15 --version
          echo "  sccache version: $(sccache --version 2>/dev/null || echo 'N/A')"

      - name: Configure with UBSan
        run: |
          echo "  Configuring with -fsanitize=undefined -fno-omit-frame-pointer ..."
          T0=$(date +%s)
          cmake -S . -B build-ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_MODELS_MODE=SKIP
          echo "  ✅ Configure completed in $(( $(date +%s) - T0 ))s"

      - name: Build
        run: |
          T0=$(date +%s)
          cmake --build build-ubsan --parallel "$(nproc)"
          echo "  ✅ UBSan build completed in $(( $(date +%s) - T0 ))s"

      - name: Run tests (UBSan)
        run: |
          echo "──────────────────────────────────────────────"
          echo "  Running tests with UBSan enabled"
          echo "  UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1"
          echo "──────────────────────────────────────────────"
          T0=$(date +%s)
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ctest --test-dir build-ubsan --output-on-failure --parallel 2 --timeout 120 2>&1 | tee ubsan-output.txt
          SECS=$(( $(date +%s) - T0 ))
          echo "  ✅ UBSan tests completed in ${SECS}s"
          {
            echo "### 🔬 UBSan Results"
            echo ""
            echo "Tests completed in **${SECS}s**. Check \`ubsan-results\` artifact for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print sccache statistics
        if: always()
        run: sccache --show-stats || true

      - name: Upload UBSan results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ubsan-results-${{ github.run_number }}
          path: |
            ubsan-output.txt
          retention-days: 7
