name: CI — Build

# ──────────────────────────────────────────────────────────────────────────────
# Trigger policy: push to develop only (no pull_request trigger).
# Heavy C++ builds (up to 120 min) run post-merge, not on every PR push.
# PR-level feedback is provided by lightweight ci-pr-gates.yml and 09-pr-gates_*.yml.
# See .github/WORKFLOW_GUIDELINES.md §Label Policy for build-status labels.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'plugins/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/actions/**'
      - '.github/workflows/ci-build.yml'
  workflow_dispatch:
    inputs:
      sanitizer:
        description: 'Additional sanitizer job (asan|ubsan|none|both)'
        required: false
        default: 'none'
        type: choice
        options: [none, asan, ubsan, both]
      debug_mode:
        description: 'Enable extra verbose debug output'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  checks: read

jobs:
  build:
    uses: ./.github/workflows/cmake-build-pipeline.yml
    with:
      runs_on: ubuntu-latest
      shell: bash
      fetch_depth: '0'
      submodules: false
      working_directory: .
      setup_command: >-
        set -euo pipefail; echo "CI — Build wrapper delegating to reusable CMake build pipeline"; git submodule deinit -f --all || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_ethic_ai || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_importer || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_storage || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_llm_wiki || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_plugin_signer || true; sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config librocksdb-dev libgtest-dev libssl-dev zlib1g-dev libzstd-dev libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev libvulkan-dev glslc libboost-system-dev libboost-filesystem-dev libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev dpkg-dev rpm; git submodule sync --recursive || true; git submodule update --init --recursive --depth 1 || true; test -f vcpkg/scripts/buildsystems/vcpkg.cmake || { echo "::error::vcpkg submodule/toolchain missing before bootstrap"; exit 1; }; export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"; export PATH="${VCPKG_ROOT}:${PATH}"; ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      configure_command: >-
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"; export PATH="${VCPKG_ROOT}:${PATH}"; cmake -S . -B build -DTHEMIS_BUILD_TESTS=ON -DTHEMIS_BUILD_BENCHMARKS=OFF
      build_command: >-
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"; export PATH="${VCPKG_ROOT}:${PATH}"; cmake --build build --parallel 16
      validation_command: >-
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"; export PATH="${VCPKG_ROOT}:${PATH}"; ctest --test-dir build --output-on-failure -j 1 --timeout 60
      artifact_name: ctest-results-${{ github.run_number }}
      artifact_paths: |
        build/Testing
        build/ctest-results.xml
        build/ctest-output.txt
      artifact_retention_days: '7'
      summary_title: CI — Build

  # ──────────────────────────────────────────────────────────────────────────
  # Build-status label management
  # Sets ci/build-ok or ci/build-failed on the develop branch after each run.
  # These labels are used by branch protection rules and downstream workflows.
  # ──────────────────────────────────────────────────────────────────────────
  update-build-labels:
    name: Update build-status labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: always() && github.event_name == 'push'
    permissions:
      issues: write
    steps:
      - name: Apply build-status labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const buildResult = process.env.BUILD_RESULT;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Helper: ensure label exists
            const ensureLabel = async (name, color, description) => {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (err) {
                if (err.status !== 404) throw err;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            };

            await ensureLabel('ci/build-ok',     '0E8A16', 'Build after merge succeeded');
            await ensureLabel('ci/build-failed',  'B60205', 'Build after merge failed; blocks next merge');
            await ensureLabel('ci/test-ok',       '0E8A16', 'Tests green after merge');
            await ensureLabel('ci/test-failed',   'B60205', 'Tests after merge failed; blocks next merge');
            await ensureLabel('status/build-pending', '0075CA', 'Post-merge build triggered and in progress');

            // Find the most recent open issue marked as a develop-build-status tracker
            const marker = '<!-- ci-build:type:build-status -->';
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const trackerIssue = allIssues.find(i => (i.body || '').includes(marker));

            const succeeded = buildResult === 'success';
            const statusLabel    = succeeded ? 'ci/build-ok'     : 'ci/build-failed';
            const clearLabel     = succeeded ? 'ci/build-failed'  : 'ci/build-ok';
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);

            if (trackerIssue) {
              // Remove the opposite label from the tracker issue if present
              const currentLabels = trackerIssue.labels.map(l => l.name);
              const newLabels = currentLabels
                .filter(l => l !== clearLabel && l !== 'status/build-pending')
                .concat(statusLabel)
                .filter((v, i, a) => a.indexOf(v) === i);
              await github.rest.issues.update({
                owner, repo,
                issue_number: trackerIssue.number,
                labels: newLabels,
              });
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: trackerIssue.number,
                body: `${succeeded ? '✅' : '❌'} Build ${succeeded ? 'succeeded' : 'failed'} for \`${sha}\` — [run ${context.runId}](${runUrl})`,
              });
              core.notice(`Updated build-status tracker issue #${trackerIssue.number}: ${statusLabel}`);
            } else {
              // Create a tracker issue for the develop branch build status
              const body = [
                marker,
                `## CI Build Status — \`develop\``,
                '',
                `Current status: **${succeeded ? '✅ passing' : '❌ failing'}**`,
                '',
                `Last run: [${context.runId}](${runUrl}) at \`${sha}\``,
                '',
                '_This issue tracks post-merge build health on develop._',
                '_Labels: `ci/build-ok` = passing, `ci/build-failed` = failing, `status/build-pending` = in progress._',
              ].join('\n');
              const { data: issue } = await github.rest.issues.create({
                owner, repo,
                title: '[CI] Build status tracker — develop',
                body,
                labels: [statusLabel],
              });
              core.notice(`Created build-status tracker issue #${issue.number}`);
            }
