name: Maintenance — Label Sync

# ──────────────────────────────────────────────────────────────────────────────
# Reads .github/labels.yml (canonical label definitions) and ensures all labels
# exist in the repository with the correct color and description.
# Runs on schedule (weekly) and workflow_dispatch.
# Does NOT delete labels that are not in the canonical list to avoid breaking
# existing references in open issues/PRs.
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 5 * * 1'  # Monday 05:00 UTC (offset from ci-health at 06:00)
  push:
    branches: [develop]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/maintenance-labels.yml'
  workflow_dispatch:

concurrency:
  group: maintenance-labels
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    name: Sync labels from .github/labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Sync labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            const raw = fs.readFileSync('.github/labels.yml', 'utf8');
            const labels = yaml.load(raw);

            if (!Array.isArray(labels)) {
              core.setFailed('.github/labels.yml must be a YAML list of label objects');
              return;
            }

            let created = 0, updated = 0, skipped = 0, errors = 0;

            for (const label of labels) {
              const { name, color, description } = label;
              if (!name || !color) {
                core.warning(`Skipping label entry without name or color: ${JSON.stringify(label)}`);
                continue;
              }
              try {
                let existing;
                try {
                  const { data } = await github.rest.issues.getLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                  });
                  existing = data;
                } catch (err) {
                  if (err.status !== 404) throw err;
                  existing = null;
                }

                if (!existing) {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    color,
                    description: description || '',
                  });
                  core.info(`Created: ${name}`);
                  created++;
                } else {
                  const needsUpdate =
                    existing.color !== color ||
                    (existing.description || '') !== (description || '');
                  if (needsUpdate) {
                    await github.rest.issues.updateLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      name,
                      color,
                      description: description || '',
                    });
                    core.info(`Updated: ${name}`);
                    updated++;
                  } else {
                    skipped++;
                  }
                }
              } catch (err) {
                core.error(`Failed to sync label '${name}': ${err.message}`);
                errors++;
              }
            }

            const summary = `Label sync complete: ${created} created, ${updated} updated, ${skipped} unchanged, ${errors} errors`;
            core.notice(summary);
            await core.summary
              .addHeading('Label Sync Results')
              .addTable([
                [{ data: 'Action', header: true }, { data: 'Count', header: true }],
                ['Created', String(created)],
                ['Updated', String(updated)],
                ['Unchanged', String(skipped)],
                ['Errors', String(errors)],
              ])
              .write();

            if (errors > 0) {
              core.setFailed(`${errors} label(s) failed to sync`);
            }
