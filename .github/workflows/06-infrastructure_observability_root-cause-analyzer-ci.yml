name: Root Cause Analyzer CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/observability/root_cause_analyzer.cpp'
      - 'include/observability/root_cause_analyzer.h'
      - 'tests/test_root_cause_analyzer.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_observability_root-cause-analyzer-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the RootCauseAnalyzer focused test suite.
  # Tests cover:
  #   1. TimeSeries helpers: change_percent, mean
  #   2. SystemSnapshot: toJSON key coverage
  #   3. CausalGraph: rootNodes, toJSON
  #   4. RootCauseReport: toJSON, toReport
  #   5. RootCauseAnalyzer::analyzeIssue: storage amplification, cache thrashing,
  #      unknown degradation fallback, metric_impacts, contributing_factors,
  #      extra metrics, confidence bounds
  #   6. RootCauseAnalyzer::findCorrelations: positive/negative/uncorrelated/
  #      unknown metric, max_correlations limit
  #   7. RootCauseAnalyzer::buildCausalGraph: causal edge detected, no edge for
  #      uncorrelated series, root nodes, empty input
  #   8. Time series registry: add/remove/replace
  #   9. Config: getConfig/setConfig round-trip
  # ---------------------------------------------------------------------------
  root-cause-analyzer-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Root Cause Analyzer tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsnappy-dev liblz4-dev

      - name: Configure (root cause analyzer test targets)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: ''

      - name: Build RootCauseAnalyzer focused test binary
        run: cmake --build build --target test_root_cause_analyzer_focused -- -j$(nproc)

      - name: Run RootCauseAnalyzer unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex RootCauseAnalyzerFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee root_cause_analyzer_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-analyzer-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/root_cause_analyzer_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 Root Cause Analyzer – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "RootCauseAnalyzer: analyzeIssue (storage/cache/unknown), findCorrelations, buildCausalGraph, TimeSeries, SystemSnapshot, CausalGraph, RootCauseReport." >> "$GITHUB_STEP_SUMMARY"
