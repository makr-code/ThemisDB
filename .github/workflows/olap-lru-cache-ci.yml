name: OLAP LRU Cache CI

# Validates Arrow zero-copy IPC export and OLAPEngine LRU result-cache implementation
# (v1.8.0, roadmap:139:analytics:v1.8.0:17-arrow-zero-copy-integration-and-result-cache-with-lru-eviction).
# Covers:
#   AC-1  ArrowIPCExporter::exportWithCallback() serialises directly to Arrow BufferOutputStream
#         (no intermediate std::string copy); chunked via raw buffer pointer
#   AC-2  OLAPEngine::Config exposes result_cache_max_entries (default 1000) and
#         result_cache_ttl_ms (default 60 000 ms)
#   AC-3  O(1) LRU eviction: doubly-linked list + unordered_map; LRU tail evicted on overflow
#   AC-4  Cache key normalisation: sorted dimensions + canonical filter order →
#         semantically equivalent queries share one cache entry
#   AC-5  TTL invalidation: expired entries evicted on next access
#   AC-6  Background cleanup thread evicts expired entries proactively
#   AC-7  Cache disabled cleanly when result_cache_max_entries == 0
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/olap.h'
      - 'src/analytics/olap.cpp'
      - 'src/analytics/analytics_export.cpp'
      - 'tests/analytics/test_olap_lru_cache.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/olap-lru-cache-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/olap.h'
      - 'src/analytics/olap.cpp'
      - 'src/analytics/analytics_export.cpp'
      - 'tests/analytics/test_olap_lru_cache.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/olap-lru-cache-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  olap-lru-cache-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: OLAP LRU cache tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_olap_lru_cache_focused

      - name: Run OLAPLRUCacheFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R OLAPLRUCacheFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee olap_lru_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_olap_lru_cache_focused \
            --gtest_output="xml:olap_lru_gtest.xml" \
            2>&1 | tee olap_lru_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olap-lru-cache-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/olap_lru_ctest.txt
            build/olap_lru_gtest.xml
            build/olap_lru_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🚀 OLAP LRU Cache CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates Arrow zero-copy IPC export (no intermediate std::string), O(1) LRU eviction," >> "$GITHUB_STEP_SUMMARY"
          echo "TTL invalidation, cache-key normalisation, and background cleanup thread for OLAPEngine." >> "$GITHUB_STEP_SUMMARY"
