name: Core CI

on:
  pull_request:
    branches:
      - develop
      - main
      - enterprise
      - hyperscaler
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (community debug)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize llama.cpp submodule
        run: git submodule update --init --depth=1 llama.cpp

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: gcc-12
          cxx: g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev libsimdjson-dev libsnappy-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc: gcc-12
          cxx: g++-12
          build-type: Debug
          edition: COMMUNITY
          ci-mode: "true"
          build-target: themis_tests

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure -j 2
