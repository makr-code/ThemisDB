name: AsyncIngestionWorker YAML Config CI

# Triggered on every push / PR that touches the async ingestion worker
# sources, the YAML config file, or this workflow itself.
# Targets v1.8.0 (Issue #3998: AsyncIngestionWorker YAML Config Loading and User Context).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/content/async_ingestion_worker.h'
      - 'src/content/async_ingestion_worker.cpp'
      - 'config/content/async_worker.yaml'
      - 'tests/test_async_ingestion_yaml_config.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_async-ingestion-worker-yaml-config-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/content/async_ingestion_worker.h'
      - 'src/content/async_ingestion_worker.cpp'
      - 'config/content/async_worker.yaml'
      - 'tests/test_async_ingestion_yaml_config.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_async-ingestion-worker-yaml-config-ci.yml'
  workflow_dispatch:

concurrency:
  group: async-ingestion-worker-yaml-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run AsyncIngestionYamlConfigFocusedTests.
  # Tests cover all acceptance criteria for Issue #3998:
  #   AC-1  loadSourcesFromConfig() parses worker_threads, queue_depth,
  #         batch_size, retry_attempts from YAML via ConfigPathResolver +
  #         ConfigSchemaValidator.
  #   AC-2  loadSourcesFromConfig() submits one job per entry in "sources".
  #   AC-3  loadSourcesFromConfig() tolerates a missing "sources" key.
  #   AC-4  user_context per source entry is propagated into the IngestionJob.
  #   AC-5  submitSourceJob() accepts and propagates user_context.
  #   AC-6  loadSourcesFromConfig() throws for a non-existent file.
  #   AC-7  AsyncIngestionConfig exposes batch_size (default 64) and
  #         retry_attempts (default 3).
  # ---------------------------------------------------------------------------
  async-ingestion-yaml-config-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: AsyncIngestionWorker YAML Config (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_async_ingestion_yaml_config_focused

      - name: Run AsyncIngestionYamlConfigFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R AsyncIngestionYamlConfigFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee async_ingestion_yaml_config_results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: async-ingestion-yaml-config-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/async_ingestion_yaml_config_results.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔧 AsyncIngestionWorker YAML Config – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "loadSourcesFromConfig(): YAML parsing (worker_threads, queue_depth, batch_size, retry_attempts)," >> "$GITHUB_STEP_SUMMARY"
          echo "source job submission, user_context propagation, missing-file error." >> "$GITHUB_STEP_SUMMARY"
          echo "submitSourceJob(): user_context parameter added and propagated." >> "$GITHUB_STEP_SUMMARY"
          echo "AsyncIngestionConfig: batch_size=64, retry_attempts=3 defaults." >> "$GITHUB_STEP_SUMMARY"
