name: Validate Config Mapping

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'config/**'
      - 'scripts/validate_config_mapping.py'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'config/**'
      - 'scripts/validate_config_mapping.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions: {}
    uses: ./.github/workflows/ci-scope-classifier.yml

  validate-mapping:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_config_changes == 'true'
    name: Validate Config Path Mapping Table
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate mapping table
        run: |
          python3 scripts/validate_config_mapping.py
      
      - name: Check for schema file
        run: |
          if [ ! -f "config/schema/path_mapping.schema.json" ]; then
            echo "❌ Schema file not found"
            exit 1
          fi
          echo "✅ Schema file exists"
