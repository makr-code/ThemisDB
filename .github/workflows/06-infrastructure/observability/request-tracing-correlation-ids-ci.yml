name: Request Tracing and Correlation IDs CI

# CI job that validates the X-Correlation-ID propagation stack:
#   • TracingMiddleware (UUID v4 generation, thread-local context, logger injection)
#   • OtlpExporter (async queue, OTLP JSON serialization, batch flush)
#   • OtelApiTracingTest (span names, attributes, W3C propagation, all major API paths)
#
# No live OTLP collector required — all tests are pure-logic unit tests that
# exercise TracingMiddleware::processRequest / clearContext / finishSpan and
# OtlpExporter::enqueue / buildOtlpJson without network I/O.
#
# Targets: v1.7.0 — Issue #140

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/api/tracing_middleware.h'
      - 'src/api/tracing_middleware.cpp'
      - 'include/api/otlp_exporter.h'
      - 'src/api/otlp_exporter.cpp'
      - 'include/api/correlation_id.h'
      - 'config/networking/otlp.yaml'
      - 'tests/test_tracing_middleware.cpp'
      - 'tests/test_otlp_exporter.cpp'
      - 'tests/test_otel_api_tracing.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/request-tracing-correlation-ids-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/api/tracing_middleware.h'
      - 'src/api/tracing_middleware.cpp'
      - 'include/api/otlp_exporter.h'
      - 'src/api/otlp_exporter.cpp'
      - 'include/api/correlation_id.h'
      - 'config/networking/otlp.yaml'
      - 'tests/test_tracing_middleware.cpp'
      - 'tests/test_otlp_exporter.cpp'
      - 'tests/test_otel_api_tracing.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/request-tracing-correlation-ids-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the request-tracing focused test suites.
  # Tests cover all acceptance criteria:
  #   AC-1  UUID v4 generated when X-Correlation-ID header is absent
  #   AC-2  Incoming X-Correlation-ID reused as-is
  #   AC-3  Correlation ID propagated to thread-local and logger context
  #   AC-4  clearContext() resets thread-local and logger pattern
  #   AC-5  Thread isolation — different threads carry independent IDs
  #   AC-6  OtlpExporter enqueues spans, serialises to OTLP JSON format
  #   AC-7  finishSpan() builds SpanData with correct trace_id and http.status_code
  #   AC-8  All major API-path spans have correct names and attributes
  # ---------------------------------------------------------------------------
  request-tracing-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true' || needs.ci-scope-classifier.outputs.has_config_changes == 'true'
    name: Request Tracing (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libcurl4-openssl-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── TracingMiddleware focused tests ────────────────────────────────────
      - name: Run TracingMiddlewareTests
        run: |
          set -o pipefail
          cd build
          ctest -R TracingMiddlewareTests \
                --output-on-failure \
                --no-tests=error \
                --timeout 60 \
                2>&1 | tee tracing_middleware_results.txt

      # ── OTLP Exporter focused tests ────────────────────────────────────────
      - name: Run OtlpExporterTests
        run: |
          set -o pipefail
          cd build
          ctest -R OtlpExporterTests \
                --output-on-failure \
                --no-tests=error \
                --timeout 60 \
                2>&1 | tee otlp_exporter_results.txt

      # ── OpenTelemetry API-path tracing tests ───────────────────────────────
      - name: Run OtelApiTracingTests
        run: |
          set -o pipefail
          cd build
          ctest -R OtelApiTracingTests \
                --output-on-failure \
                --no-tests=error \
                --timeout 60 \
                2>&1 | tee otel_api_tracing_results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: request-tracing-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/tracing_middleware_results.txt
            build/otlp_exporter_results.txt
            build/otel_api_tracing_results.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 Request Tracing and Correlation IDs CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates \`TracingMiddleware\` (UUID v4 generation, thread-local X-Correlation-ID propagation, logger injection), \`OtlpExporter\` (async queue, OTLP JSON), and all major API-path span names/attributes (v1.7.0 — Issue #140)." >> "$GITHUB_STEP_SUMMARY"
