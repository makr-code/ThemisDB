name: Bandwidth Management and QoS CI

# Validates BandwidthManagement and QoS features (v1.8.0, Issue #190).
# Covers: LeakyBucket shaping, priority queue scheduling, fair-queuing
# starvation guard, CongestionController AIMD, Linux tc integration.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/network/qos_manager.h'
      - 'src/network/qos_manager.cpp'
      - 'tests/test_bandwidth_management_qos.cpp'
      - 'tests/test_qos_manager.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/bandwidth-management-qos-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/network/qos_manager.h'
      - 'src/network/qos_manager.cpp'
      - 'tests/test_bandwidth_management_qos.cpp'
      - 'tests/test_qos_manager.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/bandwidth-management-qos-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the BandwidthManagementQoS focused test suite.
  # Acceptance criteria covered:
  #   AC-BW-1  Per-connection bandwidth limits via set_bandwidth_limit()
  #   AC-BW-2  Traffic shaping with token bucket (set_token_bucket)
  #   AC-BW-3  Traffic shaping with leaky bucket (setLeakyBucket)
  #   AC-BW-4  Priority queuing CRITICAL/HIGH/MEDIUM/LOW
  #   AC-BW-5  Fair queuing – starvation guard prevents LOW starvation
  #   AC-BW-6  Congestion control – AIMD increase and loss halving
  #   AC-BW-7  Config mbps convenience fields (max_bandwidth_mbps,
  #             per_connection_limit_mbps, enable_priority_queuing)
  #   AC-BW-8  Linux tc configureTc() returns false on non-Linux / when disabled
  # ---------------------------------------------------------------------------
  bandwidth-management-qos-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Bandwidth QoS (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run BandwidthManagementQoSFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R BandwidthManagementQoSFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee bw_qos_ctest.txt

      # ── Full test filter via unified binary ────────────────────────────────
      - name: Run BandwidthQoSTest via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_bandwidth_management_qos_focused \
            --gtest_filter="*" \
            --gtest_output="xml:bw_qos_gtest.xml" \
            2>&1 | tee bw_qos_gtest_output.txt

      # ── Also run the existing QoSManager tests for regression ─────────────
      - name: Run QoSManagerFocusedTests (regression)
        run: |
          set -o pipefail
          cd build
          ctest -R QoSManagerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee qos_manager_ctest.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandwidth-qos-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/bw_qos_ctest.txt
            build/bw_qos_gtest.xml
            build/bw_qos_gtest_output.txt
            build/qos_manager_ctest.txt
          retention-days: 30
