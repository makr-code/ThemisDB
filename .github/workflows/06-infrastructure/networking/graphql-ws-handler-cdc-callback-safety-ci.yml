name: GraphQL WebSocket Handler — CDC Callback Safety CI

# Validates the implementation of CDC callback lifetime safety and step-2
# schema-level variable type validation in GraphQLWsHandler (v1.8.0).
# (roadmap:52:api:v1.8.0:graphql-websocket-handler-cdc-callback-lifetime-safety)
#
# Acceptance criteria covered:
#   AC-1  alive_ flag (shared_ptr<atomic<bool>>) added to GraphQLWsHandler header
#   AC-2  Constructor initialises alive_ to true
#   AC-3  reset() sets alive_ to false (release) before clearing subscriptions
#   AC-4  CDC callback lambda captures alive by value and loads it (acquire) before
#         dereferencing self; returns early when false (use-after-free prevention)
#   AC-5  validateVariables(): required non-null variable missing → error
#   AC-6  validateVariables(): non-null variable set to JSON null → error
#   AC-7  validateVariables(): Int variable given a string value → error
#   AC-8  validateVariables(): String variable given an integer value → error
#   AC-9  validateVariables(): nullable variable set to null → OK
#   AC-10 validateVariables(): optional variable omitted → OK
#   AC-11 validateVariables(): variables field is array (not object) → error
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/api/graphql_ws_handler.h'
      - 'src/api/graphql_ws_handler.cpp'
      - 'tests/test_graphql_ws_handler.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure/networking/graphql-ws-handler-cdc-callback-safety-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/api/graphql_ws_handler.h'
      - 'src/api/graphql_ws_handler.cpp'
      - 'tests/test_graphql_ws_handler.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure/networking/graphql-ws-handler-cdc-callback-safety-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the GraphQLWsHandlerTests suite with THEMIS_ENABLE_WEBSOCKET.
  # Tests cover all acceptance criteria for the CDC callback lifetime safety
  # feature (v1.8.0 roadmap item):
  #   AC-1..4   alive_ flag: header, constructor, reset(), lambda guard
  #   AC-5..11  validateVariables(): scalar/list/null/missing type checks
  # ---------------------------------------------------------------------------
  graphql-ws-handler-cdc-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: GraphQL WS CDC safety (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:               ${{ matrix.cc }}
          cxx:              ${{ matrix.cxx }}
          build-target:     test_graphql_ws_handler
          extra-cmake-flags: -DTHEMIS_ENABLE_WEBSOCKET=ON

      - name: Run GraphQLWsHandlerTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R GraphQLWsHandlerTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee graphql_ws_handler_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_graphql_ws_handler \
            --gtest_output="xml:graphql_ws_handler_gtest.xml" \
            2>&1 | tee graphql_ws_handler_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphql-ws-handler-cdc-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/graphql_ws_handler_ctest.txt
            build/graphql_ws_handler_gtest.xml
            build/graphql_ws_handler_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔌 GraphQL WebSocket Handler — CDC Callback Safety – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "GraphQLWsHandler: alive_ lifetime flag (shared_ptr<atomic<bool>>), reset() sets false before subscription teardown, CDC lambda checks alive before dereferencing self, validateVariables() scalar/null/list type validation." >> "$GITHUB_STEP_SUMMARY"
