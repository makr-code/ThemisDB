name: Wire Protocol Optimizations CI

# Triggered on every push / PR that touches the wire-protocol optimization
# sources (zero-copy, batch/Nagle, Zstd dictionary compression) or their
# test file.  Targets v1.7.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/network/wire_protocol_zero_copy.h'
      - 'include/network/wire_protocol_batch.h'
      - 'include/network/connection_compression.h'
      - 'src/network/wire_protocol_zero_copy.cpp'
      - 'src/network/wire_protocol_batch.cpp'
      - 'src/network/connection_compression.cpp'
      - 'tests/test_wire_protocol_optimizations.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/wire-protocol-optimizations-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/network/wire_protocol_zero_copy.h'
      - 'include/network/wire_protocol_batch.h'
      - 'include/network/connection_compression.h'
      - 'src/network/wire_protocol_zero_copy.cpp'
      - 'src/network/wire_protocol_batch.cpp'
      - 'src/network/connection_compression.cpp'
      - 'tests/test_wire_protocol_optimizations.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/wire-protocol-optimizations-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the WireProtocolOptimizationsFocusedTests suite.
  # Tests cover all four optimization tracks:
  #   AC-1  ZeroCopyFrameBuilder – header serialisation + writev scatter-gather
  #   AC-2  MemoryMappedPayload  – mmap/munmap lifecycle + stats
  #   AC-3  WireProtocolBatcher  – iov accumulation, auto-flush, byte limit
  #   AC-4  NagleController      – TCP_NODELAY / TCP_CORK / TCP_NOPUSH toggle
  #   AC-5  ZstdDictionaryCompressor – train, compress/decompress, fallback
  # ---------------------------------------------------------------------------
  wire-protocol-optimizations-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Wire Protocol Optimizations (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libzstd-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run WireProtocolOptimizationsFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R WireProtocolOptimizationsFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee wire_protocol_optimizations_results.txt

      # ── Broader AC validation via focused binary ───────────────────────────
      - name: Run all WireProtocol optimization tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_wire_protocol_optimizations_focused \
            --gtest_filter="ZeroCopyFrameBuilder*:MemoryMappedPayload*:WireProtocolBatcher*:NagleController*:ZstdDictionaryCompressor*" \
            --gtest_output="xml:wire_protocol_optimizations_gtest.xml" \
            2>&1 | tee wire_protocol_optimizations_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wire-protocol-optimizations-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/wire_protocol_optimizations_results.txt
            build/wire_protocol_optimizations_gtest.xml
            build/wire_protocol_optimizations_gtest_output.txt
          retention-days: 30
