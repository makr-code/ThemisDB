name: Sharding Focused Tests CI

# Triggered on every push / PR that touches sharding sources or the 7
# newly-registered focused test files.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/sharding/**'
      - 'src/sharding/**'
      - 'tests/test_sharding_chaos.cpp'
      - 'tests/test_sharding_e2e.cpp'
      - 'tests/test_sharding_gossip.cpp'
      - 'tests/test_sharding_integration.cpp'
      - 'tests/test_sharding_interfaces.cpp'
      - 'tests/test_sharding_operational_metrics.cpp'
      - 'tests/test_sharding_uncovered.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure/distributed/sharding-focused-tests-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/sharding/**'
      - 'src/sharding/**'
      - 'tests/test_sharding_chaos.cpp'
      - 'tests/test_sharding_e2e.cpp'
      - 'tests/test_sharding_gossip.cpp'
      - 'tests/test_sharding_integration.cpp'
      - 'tests/test_sharding_interfaces.cpp'
      - 'tests/test_sharding_operational_metrics.cpp'
      - 'tests/test_sharding_uncovered.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure/distributed/sharding-focused-tests-ci.yml'
  workflow_dispatch:

concurrency:
  group: sharding-focused-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run all 7 newly-registered sharding focused test targets:
  #
  #   ShardingChaosFocusedTests         – network partitions, split-brain, failure injection
  #   ShardingE2EFocusedTests           – end-to-end CRUD, scatter-gather, cross-shard joins
  #   ShardingGossipFocusedTests        – GossipConfig defaults and enabled flag
  #   ShardingIntegrationFocusedTests   – URN resolver, consistent hash, shard router
  #   ShardingInterfacesFocusedTests    – IShardRouter, IAdaptiveRebalancer, …
  #   ShardingOperationalMetricsFocusedTests – per-shard metrics, cluster health
  #   ShardingUncoveredFocusedTests     – OrphanDetector, ShardLoadDetector
  # ---------------------------------------------------------------------------
  sharding-focused-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Sharding Focused Tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build sharding focused test targets
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: >-
            test_sharding_chaos_focused
            test_sharding_e2e_focused
            test_sharding_gossip_focused
            test_sharding_integration_focused
            test_sharding_interfaces_focused
            test_sharding_operational_metrics_focused
            test_sharding_uncovered_focused

      - name: Run Sharding Chaos tests
        run: |
          cd build
          ctest --tests-regex ShardingChaosFocusedTests \
                --output-on-failure --timeout 120 \
                2>&1 | tee sharding_chaos_output.txt

      - name: Run Sharding E2E tests
        run: |
          cd build
          ctest --tests-regex ShardingE2EFocusedTests \
                --output-on-failure --timeout 120 \
                2>&1 | tee sharding_e2e_output.txt

      - name: Run Sharding Gossip tests
        run: |
          cd build
          ctest --tests-regex ShardingGossipFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee sharding_gossip_output.txt

      - name: Run Sharding Integration tests
        run: |
          cd build
          ctest --tests-regex ShardingIntegrationFocusedTests \
                --output-on-failure --timeout 120 \
                2>&1 | tee sharding_integration_output.txt

      - name: Run Sharding Interfaces tests
        run: |
          cd build
          ctest --tests-regex ShardingInterfacesFocusedTests \
                --output-on-failure --timeout 90 \
                2>&1 | tee sharding_interfaces_output.txt

      - name: Run Sharding Operational Metrics tests
        run: |
          cd build
          ctest --tests-regex ShardingOperationalMetricsFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee sharding_operational_metrics_output.txt

      - name: Run Sharding Uncovered tests
        run: |
          cd build
          ctest --tests-regex ShardingUncoveredFocusedTests \
                --output-on-failure --timeout 60 \
                2>&1 | tee sharding_uncovered_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharding-focused-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/sharding_chaos_output.txt
            build/sharding_e2e_output.txt
            build/sharding_gossip_output.txt
            build/sharding_integration_output.txt
            build/sharding_interfaces_output.txt
            build/sharding_operational_metrics_output.txt
            build/sharding_uncovered_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔀 Sharding Focused Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Targets: ShardingChaosFocusedTests, ShardingE2EFocusedTests, ShardingGossipFocusedTests," >> "$GITHUB_STEP_SUMMARY"
          echo "ShardingIntegrationFocusedTests, ShardingInterfacesFocusedTests," >> "$GITHUB_STEP_SUMMARY"
          echo "ShardingOperationalMetricsFocusedTests, ShardingUncoveredFocusedTests." >> "$GITHUB_STEP_SUMMARY"
