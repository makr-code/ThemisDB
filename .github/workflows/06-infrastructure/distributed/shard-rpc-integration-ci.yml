name: Shard RPC Integration CI

# Triggered on every push / PR that touches the Shard RPC integration sources
# or test files.  Covers AC3-AC6 from Issue #202 (v1.8.0 + backfill v0.9.0).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/sharding/shard_rpc_client.h'
      - 'src/sharding/shard_rpc_client.cpp'
      - 'include/sharding/mtls_connection_pool.h'
      - 'src/sharding/mtls_connection_pool.cpp'
      - 'include/sharding/operational_metrics.h'
      - 'src/sharding/operational_metrics.cpp'
      - 'include/sharding/prometheus_metrics.h'
      - 'src/sharding/prometheus_metrics.cpp'
      - 'include/sharding/gossip_config_manager.h'
      - 'tests/test_shard_rpc_integration.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure/distributed/shard-rpc-integration-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/sharding/shard_rpc_client.h'
      - 'src/sharding/shard_rpc_client.cpp'
      - 'include/sharding/mtls_connection_pool.h'
      - 'src/sharding/mtls_connection_pool.cpp'
      - 'include/sharding/operational_metrics.h'
      - 'src/sharding/operational_metrics.cpp'
      - 'include/sharding/prometheus_metrics.h'
      - 'src/sharding/prometheus_metrics.cpp'
      - 'include/sharding/gossip_config_manager.h'
      - 'tests/test_shard_rpc_integration.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure/distributed/shard-rpc-integration-ci.yml'
  workflow_dispatch:

concurrency:
  group: shard-rpc-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run ShardRpcIntegrationFocusedTests.
  #
  # Acceptance criteria verified:
  #   AC3  ShardRpcRetryPolicy struct: defaults + custom values.
  #   AC4  MTLSConnectionPoolManager wired into ShardRPCClient::Config;
  #        rpc_max_pool_connections in GossipConfigManagerConfig; propagation.
  #   AC5  OperationalMetrics::recordRpcCall / PrometheusMetrics::recordRpcCall
  #        called per attempt with shard_id, method, outcome labels.
  #   AC6  MTLSConnectionPoolManager::onCertificateRotated() graceful drain.
  #   CB   circuit_breaker_recovery_ms default = 5 s.
  # ---------------------------------------------------------------------------
  shard-rpc-integration-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Shard RPC Integration tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_shard_rpc_integration_focused

      - name: Run Shard RPC Integration unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex ShardRpcIntegrationFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee shard_rpc_integration_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-rpc-integration-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/shard_rpc_integration_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔌 Shard RPC Integration – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ShardRpcRetryPolicy, MTLSConnectionPoolManager wiring, per-RPC metrics (operational + prometheus), certificate-rotation drain." >> "$GITHUB_STEP_SUMMARY"
