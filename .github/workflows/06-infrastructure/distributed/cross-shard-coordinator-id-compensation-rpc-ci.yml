name: CrossShard Coordinator ID + Compensation RPC CI

# Triggered on every push/PR that touches the cross-shard coordinator or
# ShardRPCClient sources/tests.  Covers Issue #106 acceptance criteria:
#   AC-1  coordinator_id field added to CrossShardTransactionConfig
#   AC-2  All "coordinator-1" literals replaced with config_.coordinator_id
#   AC-3  ShardRPCClient::compensate() dispatches a dedicated compensate RPC
#   AC-4  Compensation retry queue bounded (max_retries=3, exponential backoff)
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/sharding/cross_shard_transaction.h'
      - 'src/sharding/cross_shard_transaction.cpp'
      - 'include/sharding/shard_rpc_client.h'
      - 'src/sharding/shard_rpc_client.cpp'
      - 'tests/test_cross_shard_coordinator.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cross-shard-coordinator-id-compensation-rpc-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/sharding/cross_shard_transaction.h'
      - 'src/sharding/cross_shard_transaction.cpp'
      - 'include/sharding/shard_rpc_client.h'
      - 'src/sharding/shard_rpc_client.cpp'
      - 'tests/test_cross_shard_coordinator.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cross-shard-coordinator-id-compensation-rpc-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  cross-shard-coordinator-id-compensation-rpc-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CrossShard Coordinator ID + Compensation RPC (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_percolator_coordinator_focused

      - name: Run coordinator ID and compensation RPC tests
        run: |
          set -o pipefail
          cd build
          ctest -R PercolatorCoordinatorFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee cross_shard_coordinator_id_ctest.txt

      - name: Run targeted gtest filter for new tests
        run: |
          set -o pipefail
          cd build
          ./tests/test_percolator_coordinator_focused \
            --gtest_filter="CoordinatorIdConfigTest*:CoordinatorIdTest*:ShardRpcCompensateTest*" \
            --gtest_output="xml:cross_shard_coordinator_id_gtest.xml" \
            2>&1 | tee cross_shard_coordinator_id_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-shard-coordinator-id-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cross_shard_coordinator_id_ctest.txt
            build/cross_shard_coordinator_id_gtest.xml
            build/cross_shard_coordinator_id_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔗 CrossShard Coordinator ID + Compensation RPC" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates: coordinator_id config field, coordinator-1 replacement, ShardRPCClient::compensate(), bounded retry queue." >> "$GITHUB_STEP_SUMMARY"
