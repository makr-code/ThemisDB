name: OpenCL ErasureCoder Parity CI

# Triggered on every push / PR that touches the OpenCL erasure coder sources,
# its tests, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/sharding/gpu_erasure_coder_opencl.cpp'
      - 'include/sharding/gpu_erasure_coder.h'
      - 'include/sharding/redundancy_strategy.h'
      - 'tests/test_opencl_erasure_coder_parity.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/opencl-erasure-coder-parity-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/sharding/gpu_erasure_coder_opencl.cpp'
      - 'include/sharding/gpu_erasure_coder.h'
      - 'include/sharding/redundancy_strategy.h'
      - 'tests/test_opencl_erasure_coder_parity.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/opencl-erasure-coder-parity-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the OpenCLErasureCoderParityTests suite.
  #
  # Tests cover (Issue #105 / v1.8.0):
  #   - encode() with GF(2^8) Vandermonde parity matrix via OpenCL NDRange kernel
  #   - decode() with Gaussian elimination (syndrome computation)
  #   - batchEncode(): multiple stripes in a single kernel dispatch
  #   - CPU/GPU parity for encode+decode round-trip with 1, 2, and 3 erasures
  #
  # pocl-opencl-icd provides a CPU-based OpenCL 1.2 device so GPU paths are
  # exercised without requiring physical GPU hardware.
  # ---------------------------------------------------------------------------
  opencl-erasure-coder-parity-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: OpenCL ErasureCoder parity tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev
            libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev
            ocl-icd-opencl-dev pocl-opencl-icd

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:               ${{ matrix.cc }}
          cxx:              ${{ matrix.cxx }}
          build-target:     test_opencl_erasure_coder_parity_focused
          # Override the action's default OPENCL=OFF so our focused test can
          # exercise the OpenCL paths via the pocl CPU device installed above.
          extra-cmake-flags: -DTHEMIS_ENABLE_OPENCL=ON

      - name: Run OpenCL ErasureCoder parity tests
        env:
          POCL_DEVICES: cpu
        run: |
          set -o pipefail
          cd build
          ctest -R OpenCLErasureCoderParityTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee opencl_erasure_coder_parity_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencl-erasure-coder-parity-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/opencl_erasure_coder_parity_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔷 OpenCL Erasure Coder Parity – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "OpenCLErasureCoder: GF(2^8) encode/decode, 1/2/3-erasure round-trip, CPU/GPU parity, batchEncode." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate job — all matrix legs must pass
  # ---------------------------------------------------------------------------
  opencl-erasure-coder-parity-gate:
    name: OpenCL ErasureCoder Parity Gate
    needs: opencl-erasure-coder-parity-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check test status
        shell: bash
        run: |
          result="${{ needs.opencl-erasure-coder-parity-tests.result }}"
          if [[ "$result" == "success" ]]; then
            echo "✅ All OpenCL erasure coder parity tests passed."
          elif [[ "$result" == "skipped" ]]; then
            echo "ℹ️  OpenCL erasure coder parity tests skipped (no relevant changes)."
          else
            echo "❌ OpenCL erasure coder parity tests failed."
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          result="${{ needs.opencl-erasure-coder-parity-tests.result }}"
          echo "## 🔷 OpenCL Erasure Coder Parity – Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test result** | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
