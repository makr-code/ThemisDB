name: PR Quick Checks

# Lightweight CI for pull requests and feature-branch pushes.
#
# PURPOSE
# -------
# Full ThemisDB edition builds (edition-*-ci.yml) are heavy (CMake + C++
# compile + test suite) and unsuitable as a fast feedback signal for every
# PR update.  This workflow runs three fast, build-free jobs instead:
#
#   lint            – cppcheck static analysis on C++ sources and headers in src/ and include/
#   cmake-validate  – CMake configure-only validation (cmake -S . -B <tmpdir>)
#   audit           – dependency / security audit (Python scripts, secret
#                     entropy scan via scripts/secret_scan.py)
#
# TRIGGER STRATEGY
# ----------------
#   pull_request (all branches, opened/synchronize/reopen)
#     → always runs lint + cmake-validate + audit
#
#   push to feature branches (anything except main/develop)
#     → runs the same three lightweight jobs
#     → Full edition builds are NOT triggered on feature branches;
#        they run only on push to main/develop.
#
# FULL BUILD
# ----------
#   Full ThemisDB edition builds still run via the edition-*-ci.yml workflows
#   on push/merge to main and develop, or via workflow_dispatch (manual trigger
#   on any edition-*-ci.yml workflow).
#
# WHY NO BUILD HERE?
# ------------------
#   A complete Debug build of a single edition takes ~40–60 min on
#   ubuntu-22.04 runners.  For 5 editions × every PR push that would
#   consume 200–300 runner-minutes per commit – not worth it for fast
#   feedback.  Static analysis + audit finish in under 5 minutes.

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches-ignore:
      - main
      - develop

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 · lint
# Runs cppcheck (static analysis) over all C++ sources and headers.
# No compilation required – cppcheck parses the source tree directly.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: lint (cppcheck static analysis)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y cppcheck

      - name: Run cppcheck on src/ and include/
        run: |
          set -o pipefail
          cppcheck \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            -I include \
            src/ include/ \
            2>&1 | tee /tmp/cppcheck_output.txt
          echo "## cppcheck static analysis" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cppcheck_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cppcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          retention-days: 7
          path: /tmp/cppcheck_output.txt

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 · cmake-validate
# Runs a configure-only CMake pass (no build) to catch syntax errors and
# broken variable references in CMakeLists.txt before they reach develop.
# Uses cmake -S . -B <tmpdir> which exercises the real CMake parser and
# will fail (non-zero exit) on malformed files.
# ─────────────────────────────────────────────────────────────────────────────
  cmake-validate:
    name: cmake-validate (configure check)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:  gcc-12
          cxx: g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Run CMake configure (MINIMAL edition, no build)
        run: |
          set -euo pipefail
          BUILD_DIR="$(mktemp -d -t cmake-validate-XXXXXX)"
          trap 'rm -rf "$BUILD_DIR"' EXIT

          echo "Running configure-only CMake validation in $BUILD_DIR"
          cmake -S . -B "$BUILD_DIR" \
            --warn-uninitialized \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DTHEMIS_EDITION=MINIMAL \
            -DTHEMIS_CI_MODE=ON

          echo "✅ CMakeLists.txt syntax check passed (CMake configuration succeeded)."
          echo "## cmake-validate" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ CMake configuration completed successfully; CMakeLists.txt files parsed without critical syntax errors." >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 · audit
# Security & dependency audit:
#   • ThemisDB entropy-based secret scanner (scripts/secret_scan.py)
#   • pip-audit for Python dependency vulnerabilities (enforcing)
#   • error-handling compliance check (tools/error_handling_audit.py, enforcing)
# Note: Gitleaks + detect-secrets run separately in secret-scanning-ci.yml.
# ─────────────────────────────────────────────────────────────────────────────
  audit:
    name: audit (security & dependency scan)
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audit tools
        run: pip install pip-audit pytest --quiet

      - name: Run ThemisDB entropy secret scanner
        if: hashFiles('scripts/secret_scan.py') != ''
        run: |
          set -o pipefail
          python3 scripts/secret_scan.py --all \
            --allowlist .secret-scan-allowlist.txt \
            2>&1 | tee /tmp/secret_scan_output.txt
          echo "## Entropy secret scan" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/secret_scan_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: false

      - name: Audit Python dependencies (pip-audit)
        run: |
          set -o pipefail
          REQ_FILES_FOUND=false
          while IFS= read -r -d '' req; do
            REQ_FILES_FOUND=true
            echo "Auditing $req …"
            pip-audit -r "$req" --desc 2>&1
          done < <(find . -name "requirements*.txt" \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            -not -path "./vcpkg*" \
            -not -path "./llama.cpp/*" \
            -print0 2>/dev/null || true)
          if [ "$REQ_FILES_FOUND" = false ]; then
            echo "No requirements*.txt found – skipping pip-audit."
          fi
          echo "## pip-audit" >> "$GITHUB_STEP_SUMMARY"
          echo "pip-audit completed (see logs above)." >> "$GITHUB_STEP_SUMMARY"

      - name: Run error-handling audit
        if: hashFiles('tools/error_handling_audit.py') != ''
        run: |
          set -o pipefail
          python3 tools/error_handling_audit.py \
            src include \
            --quiet \
            --no-color \
            2>&1 | tee /tmp/error_audit_output.txt
          echo "## Error-handling audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -40 /tmp/error_audit_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-audit-reports
          retention-days: 7
          path: |
            /tmp/secret_scan_output.txt
            /tmp/error_audit_output.txt
