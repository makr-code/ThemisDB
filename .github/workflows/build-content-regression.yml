name: "Build: Content Regression [Wave D]"

# Rechenaufwand-Score: R=5 (K=5, L=5, N=5) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# ──────────────────────────────────────────────────────────────────────────────
# Trigger policy:
#   push to develop   → content regression check (ctest --label-include "content")
#   schedule Sunday   → Wave-D soak run          (ctest --label-include "soak")
#   workflow_dispatch → manual trigger for either job
#
# Implements the two recommended next steps from the Wave-D gate model:
#   1. Regression-Check:  ctest --label-include "content"
#   2. Wave-D Soak-Lauf:  ctest --label-include "soak" --timeout 600
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - develop
    paths:
      - 'src/content/**'
      - 'include/content/**'
      - 'tests/content/**'
      - 'tests/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - '.github/workflows/build-content-regression.yml'
  schedule:
    # Weekly Sunday 05:30 UTC — Wave D soak tests (content module)
    - cron: '30 5 * * 0'
  workflow_dispatch:
    inputs:
      run_soak:
        description: 'Run Wave-D soak tests (ctest --label-include soak)'
        type: boolean
        default: false
      soak_duration_multiplier:
        description: 'THEMIS_SOAK_DURATION_MULTIPLIER (0.1–10.0; CI default: 0.2)'
        required: false
        default: '0.2'

permissions:
  contents: read
  actions: read

# ──────────────────────────────────────────────────────────────────────────────
# Shared build setup variables (keep aligned with build-mainline.yml)
# ──────────────────────────────────────────────────────────────────────────────
env:
  APT_PACKAGES: >-
    build-essential cmake ninja-build pkg-config sccache
    librocksdb-dev libgtest-dev libssl-dev zlib1g-dev libzstd-dev
    libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev
    libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev
    libboost-system-dev libboost-filesystem-dev
    libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc
    libpugixml-dev
  BUILD_DIR: build/content-regression

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1 — Content Regression Check
  # Runs on every develop push that touches content sources or tests.
  # Executes: ctest --label-include "content" --output-on-failure -j4 --timeout 120
  # ────────────────────────────────────────────────────────────────────────────
  content-regression:
    name: Content Regression (ctest --label-include "content")
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_soak == false || inputs.run_soak == 'false'))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          fetch-depth: 0
          submodules: false

      - name: Prepare repository (strip private submodules)
        run: |
          for sm in \
            plugins/private/themisdb_ethic_ai \
            plugins/private/themisdb_importer \
            plugins/private/themisdb_storage \
            plugins/private/themisdb_llm_wiki \
            plugins/private/themisdb_plugin_signer; do
            git config --file .git/config --remove-section "submodule.${sm}" 2>/dev/null || true
          done
          if [ ! -f vcpkg/scripts/buildsystems/vcpkg.cmake ]; then
            rm -rf vcpkg
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${{ env.APT_PACKAGES }}

      - name: Bootstrap vcpkg
        run: |
          test -f vcpkg/scripts/buildsystems/vcpkg.cmake || {
            echo "::error::vcpkg toolchain missing after submodule init"; exit 1
          }
          export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure (content tests only)
        run: |
          export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
          cmake -S . -B "${{ env.BUILD_DIR }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build
        run: |
          export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
          cmake --build "${{ env.BUILD_DIR }}" --parallel "$(nproc)"

      - name: Run content regression tests
        run: |
          ctest --test-dir "${{ env.BUILD_DIR }}" \
            --label-include "content" \
            --output-on-failure \
            -j4 \
            --timeout 120 \
            2>&1 | tee content-regression-results.txt

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.6.2
        if: always()
        with:
          name: content-regression-results-${{ github.run_number }}
          path: |
            content-regression-results.txt
            ${{ env.BUILD_DIR }}/Testing/
          retention-days: 14
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2 — Wave-D Soak Run
  # Runs on weekly schedule (Sunday 05:30 UTC) or manual dispatch with run_soak=true.
  # Executes: ctest --label-include "soak" --timeout 600
  # The soak test sources are in tests/content/test_content_soak.cpp and carry
  # the labels "content;wave_d;soak;not_release_critical".
  # ────────────────────────────────────────────────────────────────────────────
  wave-d-soak:
    name: Wave-D Soak (ctest --label-include "soak" --timeout 600)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '30 5 * * 0') ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_soak == true || inputs.run_soak == 'true'))
    env:
      BUILD_DIR_SOAK: build/wave-d-soak
      ARTIFACT_DIR: wave-d-soak-artifacts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          fetch-depth: 0
          submodules: false

      - name: Prepare repository (strip private submodules)
        run: |
          for sm in \
            plugins/private/themisdb_ethic_ai \
            plugins/private/themisdb_importer \
            plugins/private/themisdb_storage \
            plugins/private/themisdb_llm_wiki \
            plugins/private/themisdb_plugin_signer; do
            git config --file .git/config --remove-section "submodule.${sm}" 2>/dev/null || true
          done
          if [ ! -f vcpkg/scripts/buildsystems/vcpkg.cmake ]; then
            rm -rf vcpkg
            git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends ${{ env.APT_PACKAGES }}

      - name: Bootstrap vcpkg
        run: |
          test -f vcpkg/scripts/buildsystems/vcpkg.cmake || {
            echo "::error::vcpkg toolchain missing after submodule init"; exit 1
          }
          export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure (soak tests — Release for endurance realism)
        run: |
          export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
          cmake -S . -B "${{ env.BUILD_DIR_SOAK }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_MODELS_MODE=SKIP

      - name: Build
        run: |
          export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
          cmake --build "${{ env.BUILD_DIR_SOAK }}" --parallel "$(nproc)"

      - name: Run Wave-D soak tests
        env:
          THEMIS_SOAK_DURATION_MULTIPLIER: ${{ inputs.soak_duration_multiplier || '0.2' }}
        run: |
          mkdir -p "${ARTIFACT_DIR}"
          ctest --test-dir "${{ env.BUILD_DIR_SOAK }}" \
            --label-include "soak" \
            --output-on-failure \
            -j1 \
            --timeout 600 \
            2>&1 | tee "${ARTIFACT_DIR}/wave-d-soak-results.txt"

      - name: Summarise soak results
        if: always()
        run: |
          echo "## Wave-D Soak Results" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          tail -40 "${ARTIFACT_DIR}/wave-d-soak-results.txt" >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload soak artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v4.6.2
        if: always()
        with:
          name: wave-d-soak-results-${{ github.run_number }}
          path: |
            ${{ env.ARTIFACT_DIR }}/
            ${{ env.BUILD_DIR_SOAK }}/Testing/
          retention-days: 90
          if-no-files-found: ignore
