name: Prompt Engineering – Tree-of-Thoughts Reasoner CI

# Validates TreeOfThoughtsBuilder (Phase 6: ToT multi-path reasoning).
# roadmap:prompt_engineering:v2.0.0:tree-of-thoughts
#
# Acceptance criteria covered:
#   AC-1  ToTConfig defaults — max_depth=3, branching_factor=3, strategy=BFS
#   AC-2  BFS search — all nodes at each level explored before going deeper
#   AC-3  DFS search — depth-first path followed to max_depth
#   AC-4  BEAM search — retains only top beam_width nodes per level
#   AC-5  Pruning — nodes with score <= prune_threshold discarded
#   AC-6  ToTResult — best_path non-empty, nodes_explored > 0
#   AC-7  Custom IToTThoughtGenerator — used in place of default generator
#   AC-8  Custom IToTEvaluator — verdict + score propagated correctly
#   AC-9  solve() — answer string returned, not empty
#   AC-10 verbose flag — intermediate thoughts logged when true

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/prompt_engineering/tree_of_thoughts.h'
      - 'src/prompt_engineering/tree_of_thoughts.cpp'
      - 'tests/test_tree_of_thoughts.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/tree-of-thoughts-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/tree_of_thoughts.h'
      - 'src/prompt_engineering/tree_of_thoughts.cpp'
      - 'tests/test_tree_of_thoughts.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/tree-of-thoughts-ci.yml'
  workflow_dispatch:

concurrency:
  group: prompt-engineering-tree-of-thoughts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  tree-of-thoughts-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: TreeOfThoughts (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_tree_of_thoughts_focused

      - name: Run TreeOfThoughtsFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R TreeOfThoughtsFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee tot_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_tree_of_thoughts_focused \
            --gtest_output="xml:tot_gtest.xml" \
            2>&1 | tee tot_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-of-thoughts-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/tot_ctest.txt
            build/tot_gtest.xml
            build/tot_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🌳 Prompt Engineering – Tree-of-Thoughts Reasoner" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1: ToTConfig defaults | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2: BFS search — level-by-level exploration | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3: DFS search — depth-first traversal | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4: BEAM search — top-k retention | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5: Pruning — low-score nodes discarded | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6: ToTResult — best_path + nodes_explored | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7: Custom IToTThoughtGenerator used | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8: Custom IToTEvaluator propagated | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9: solve() returns non-empty answer | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: verbose flag logs intermediate thoughts | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
