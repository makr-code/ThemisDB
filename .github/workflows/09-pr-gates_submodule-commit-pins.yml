name: Submodule Commit-Pin Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
    paths:
      - '.gitmodules'
      - '.github/workflows/09-pr-gates_submodule-commit-pins.yml'
  workflow_dispatch: {}

concurrency:
  group: submodule-commit-pins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-commit-pins:
    name: Verify Wave-1 submodule commit pins
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Wave-1 private plugin submodules have commit pins
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          # Wave-1 private plugin submodule paths that must carry a commit pin
          WAVE1_PATHS = {
              "plugins/themisdb_ethic_ai",
              "plugins/themisdb_llm_wiki",
              "plugins/themisdb_storage",
              "plugins/themisdb_importer",
              "plugins/themisdb_plugin_signer",
              "plugins/themisdb_geo",
              "plugins/themisdb_timeseries",
          }

          text = Path(".gitmodules").read_text(encoding="utf-8")

          # Parse submodule blocks
          # Each block: [submodule "name"] / path = ... / url = ... / (commit = ...)
          blocks = re.split(r'(?=\[submodule\s)', text)

          missing_pin = []
          for block in blocks:
              path_match = re.search(r'path\s*=\s*(.+)', block)
              if not path_match:
                  continue
              path = path_match.group(1).strip()
              if path not in WAVE1_PATHS:
                  continue
              if not re.search(r'commit\s*=\s*[0-9a-f]{40}', block):
                  missing_pin.append(path)

          if missing_pin:
              print("ERROR: The following Wave-1 private plugin submodules are missing a 40-character commit pin in .gitmodules:")
              for p in sorted(missing_pin):
                  print(f"  - {p}")
              print()
              print("To fix: run `git submodule update --init <path>` for each submodule,")
              print("then record the resolved commit hash in .gitmodules under the matching")
              print("[submodule] block as:  commit = <40-hex-sha>")
              print("See docs/plugins/PLUGIN_MANIFEST_GOVERNANCE.md §Wave-1 Submodule Commit Pins.")
              sys.exit(1)

          print(f"OK: All {len(WAVE1_PATHS)} Wave-1 submodule paths either carry a commit pin or are not yet registered.")
          PY
