name: "Release: WinGet Consumer"

# Downstream distribution workflow. This workflow consumes the final GitHub Release assets
# generated by the canonical CPack + release pipeline and submits package metadata to WinGet.
# It is not the source of truth for release packaging and does not create an alternative
# release artifact set.
#
# Rechenaufwand-Score: R=3 (K=2, L=3, N=2) | last-calibrated: 2026-09-04
# Trigger policy: repo framework score calibration for workflow cost controls.
# Automated WinGet community package submission (after stable release).
#
# Trigger:
#   - Runs after successful GitHub Release creation (release event)
#   - Triggers only on stable releases (not pre-release)
#   - Can be manually triggered with explicit version
#
# Pipeline stages:
#   detect-release → download-artifacts → generate-checksums
#   → generate-manifests → validate-manifests → create-fork-pr
#   → notify
#
# Output:
#   - WinGet manifest files (YAML)
#   - Pull request to https://github.com/microsoft/winget-pkgs
#   - Checksums and SBOM artifacts

on:
  workflow_call:
    secrets:
      winget_pr_token:
        description: "Personal access token or GitHub App token with access to the winget-pkgs fork owner account"
        required: false
    inputs:
      version:
        description: "Version to submit to WinGet (e.g., 2.4.0)"
        required: true
        type: string
      fork_owner:
        description: "GitHub username or org that owns the winget-pkgs fork"
        required: false
        type: string
      release-url:
        description: "GitHub Release URL (for context)"
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit to WinGet (e.g., 2.4.0)"
        required: true
        type: string
      fork_owner:
        description: "GitHub username or org that owns the winget-pkgs fork"
        required: false
        type: string
      release-url:
        description: "GitHub Release URL (for context)"
        required: false
        type: string

permissions:
  contents: read
  packages: read
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: release-winget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [mark-release-pending, detect-release, download-artifacts, generate-checksums, generate-manifests, validate-manifests, create-fork-pr, finalize-release-status, notify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "WinGet release manifest validation and submission"
          job-results: ${{ toJSON(needs) }}

  mark-release-pending:
    name: "Release: Mark WinGet Status"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set WinGet release tracker pending label
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Release] Status tracker — winget'
          issue-marker: '<!-- release-winget:type:release-status -->'
          issue-body: |
            <!-- release-winget:type:release-status -->
            ## Release Status — `winget`

            Current status: **⏳ pending**

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.sha }}`

            _This issue tracks WinGet submission health for the release lane._
            _Labels: `status/release-pending` = release running; final state is applied after workflow completion._
          labels-to-add: 'status/release-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

  detect-release:
    name: "Release: Detect Type"
    needs: mark-release-pending
    if: always() && (needs.mark-release-pending.result != 'failure' || needs.mark-release-pending.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release-type: ${{ steps.detect.outputs.release-type }}
      is-stable: ${{ steps.detect.outputs.is-stable }}
      should-submit: ${{ steps.detect.outputs.should-submit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate canonical version contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/version-release-type-manager.sh
          .github/scripts/version-release-type-manager.sh validate

      - name: Detect release details
        id: detect
        env:
          VERSION_INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::WinGet requires a stable community version."; exit 1
          fi
          release="$(gh release view "v${VERSION}" --repo "${{ github.repository }}" --json isDraft,isPrerelease)"
          if [[ "$(jq -r '.isDraft or .isPrerelease' <<< "$release")" != "false" ]]; then
            echo "::error::WinGet requires an already published stable release."; exit 1
          fi
          {
            echo "version=$VERSION"
            echo "release-type=stable"
            echo "is-stable=true"
            echo "should-submit=true"
          } >> "$GITHUB_OUTPUT"

  download-artifacts:
    name: "Release: Download Artifacts"
    needs: detect-release
    runs-on: ubuntu-latest
    if: needs.detect-release.outputs.should-submit == 'true'
    steps:
      - name: Download release assets
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.detect-release.outputs.version }}"
          mkdir -p release-artifacts
          gh release download "$TAG" --repo "${{ github.repository }}" --dir release-artifacts --clobber
          if [[ -z "$(find release-artifacts -type f -print -quit)" ]]; then
            echo "::error::No release assets downloaded for tag $TAG"
            exit 1
          fi

      - name: Transfer release assets to downstream jobs
        uses: actions/upload-artifact@v5
        with:
          name: winget-release-assets
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find release-artifacts -type f | head -20

  generate-checksums:
    name: "Validate: Checksums for Windows Binaries"
    needs: [detect-release, download-artifacts]
    runs-on: ubuntu-latest
    if: needs.detect-release.outputs.should-submit == 'true'
    outputs:
      checksums-json: ${{ steps.checksums.outputs.checksums-json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: winget-release-assets
          path: release-artifacts/

      - name: Generate checksums
        id: checksums
        shell: pwsh
        run: |
          .github/scripts/generate-winget-checksums.ps1 `
            -ArtifactDir "release-artifacts" `
            -OutputDir "${{ runner.temp }}/checksums" `
            -IncludeSBOM

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: winget-checksums
          path: ${{ runner.temp }}/checksums/checksums.json
          retention-days: 90
          if-no-files-found: error

  generate-manifests:
    name: "Build: Generate WinGet Manifests"
    needs: [detect-release, generate-checksums]
    runs-on: ubuntu-latest
    if: needs.detect-release.outputs.should-submit == 'true'
    outputs:
      manifest-dir: ${{ steps.generate.outputs.manifest-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download checksums
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: winget-checksums

      - name: Download release assets for ZIP layout validation
        uses: actions/download-artifact@v5
        with:
          name: winget-release-assets
          path: release-artifacts/

      - name: Generate WinGet manifests
        id: generate
        shell: pwsh
        run: |
          $Version = "${{ needs.detect-release.outputs.version }}"
          $ManifestDir = "packaging/winget/manifests/t/ThemisDB/ThemisDB/$Version"
          $Checksums = Get-Content checksums.json | ConvertFrom-Json
          $Zip64 = @($Checksums.artifacts | Where-Object { $_.filename -match '(?i)windows.*(x64|amd64).*\.zip$' })
          if ($Zip64.Count -ne 1) {
            throw "Expected exactly one Windows AMD64 ZIP artifact, found $($Zip64.Count)."
          }
          $Artifact = $Zip64[0]
          python3 scripts/release/validate_runtime_payload.py (Join-Path "release-artifacts" $Artifact.filename)
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP must contain compiled docs.db and TinyLlama.' }
          & ./scripts/release/new-winget-manifest.ps1 `
            -Version $Version `
            -InstallerUrl "https://github.com/${{ github.repository }}/releases/download/v${Version}/$($Artifact.filename)" `
            -InstallerSha256 $Artifact.sha256 `
            -InstallerArchivePath (Join-Path "release-artifacts" $Artifact.filename) `
            -IncludeGermanLocale
          echo "manifest-dir=$ManifestDir" >> $env:GITHUB_OUTPUT

      - name: Upload WinGet manifests
        uses: actions/upload-artifact@v5
        with:
          name: winget-manifests-${{ needs.detect-release.outputs.version }}
          path: ${{ steps.generate.outputs.manifest-dir }}
          retention-days: 90
          if-no-files-found: error

  validate-manifests:
    name: "Validate: WinGet Manifests"
    needs: [detect-release, generate-manifests]
    runs-on: windows-latest
    if: needs.generate-manifests.outputs.manifest-dir != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download generated manifests
        uses: actions/download-artifact@v5
        with:
          name: winget-manifests-${{ needs.detect-release.outputs.version }}
          path: ${{ needs.generate-manifests.outputs.manifest-dir }}

      - name: Validate manifests with winget
        shell: pwsh
        run: |
          $ManifestDir = "${{ needs.generate-manifests.outputs.manifest-dir }}"
          
          Write-Host "Validating manifest directory: $ManifestDir"
          
          # winget validate requires the manifest root path
          winget validate --manifest "$ManifestDir"
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Manifest validation failed"
            exit $LASTEXITCODE
          }
          
          Write-Host "✓ Manifests are valid"

  create-fork-pr:
    name: "Publish: Create PR to WinGet Community Repository"
    needs: [detect-release, validate-manifests, generate-manifests]
    runs-on: windows-latest
    environment: winget-production
    if: needs.generate-manifests.outputs.manifest-dir != '' && needs.detect-release.outputs.should-submit == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download generated WinGet manifests
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: winget-manifests-${{ needs.detect-release.outputs.version }}
          path: ${{ needs.generate-manifests.outputs.manifest-dir }}

      - name: Restore manifest layout
        shell: pwsh
        run: |
          $expectedDir = Join-Path $env:GITHUB_WORKSPACE 'packaging\winget\manifests\t\ThemisDB\ThemisDB\${{ needs.detect-release.outputs.version }}'
          foreach ($file in @('ThemisDB.ThemisDB.yaml', 'ThemisDB.ThemisDB.installer.yaml', 'ThemisDB.ThemisDB.locale.en-US.yaml')) {
            if (-not (Test-Path (Join-Path $expectedDir $file))) {
              throw "WinGet manifest artifact is missing $file."
            }
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Submit WinGet PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.winget_pr_token }}
          WINGET_FORK_OWNER: ${{ inputs.fork_owner || vars.WINGET_FORK_OWNER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'winget_pr_token with write access to the configured WinGet fork is required.'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINGET_FORK_OWNER)) {
            throw 'Missing WINGET_FORK_OWNER. Configure the repository variable or pass workflow input fork_owner.'
          }

          pwsh -File .\scripts\release\submit-winget-pkgs.ps1 `
            -Version "${{ needs.detect-release.outputs.version }}" `
            -ForkOwner "$env:WINGET_FORK_OWNER" `
            -GitHubToken "$env:GH_TOKEN"
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission script failed.' }

      - name: Summarize PR submission
        shell: pwsh
        run: |
          Write-Host "WinGet submission script completed for version ${{ needs.detect-release.outputs.version }}."
          Write-Host "Review the draft PR in microsoft/winget-pkgs and remove draft status after approval."

  finalize-release-status:
    name: "Release: Finalize WinGet Status"
    needs: [mark-release-pending, detect-release, generate-manifests, validate-manifests, create-fork-pr, notify]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve final WinGet outcome
        id: status
        shell: bash
        env:
          SHOULD_SUBMIT: ${{ needs.detect-release.outputs.should-submit }}
          MANIFEST_RESULT: ${{ needs.generate-manifests.result }}
          VALIDATE_RESULT: ${{ needs.validate-manifests.result }}
          PR_RESULT: ${{ needs.create-fork-pr.result }}
          NOTIFY_RESULT: ${{ needs.notify.result }}
        run: |
          set -euo pipefail
          if [ "${SHOULD_SUBMIT}" = "false" ]; then
            {
              echo "status_label=ci/build-ok"
              echo "status_text=skipped"
              echo "status_icon=ℹ️"
              echo "status_reason=release type did not require WinGet submission"
              echo "status_markers="
            } >> "${GITHUB_OUTPUT}"
          elif [ "${MANIFEST_RESULT}" = "success" ] && [ "${VALIDATE_RESULT}" = "success" ] && [ "${PR_RESULT}" = "success" ]; then
            {
              echo "status_label=ci/build-ok"
              echo "status_text=passing"
              echo "status_icon=✅"
              echo "status_reason=WinGet manifest generation and submission succeeded"
              echo "status_markers="
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "status_label=ci/build-failed"
              echo "status_text=failing"
              echo "status_icon=❌"
              echo "status_reason=WinGet submission or validation failed"
              echo "status_markers=ci/build-failed"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Upsert WinGet tracker issue
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Release] Status tracker — winget'
          issue-marker: '<!-- release-winget:type:release-status -->'
          issue-body: |
            <!-- release-winget:type:release-status -->
            ## Release Status — `winget`

            Current status: **${{ steps.status.outputs.status_icon }} ${{ steps.status.outputs.status_text }}**
            Reason: `${{ steps.status.outputs.status_reason }}`
            Marker: `${{ steps.status.outputs.status_markers || 'none' }}`

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.sha }}`

            _This issue tracks WinGet submission health for the release lane._
            _Labels: `status/release-pending` = release in progress; `ci/build-failed` = release gate failed._

      - name: Replace WinGet status labels atomically
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-title: '[Release] Status tracker — winget'
          issue-marker: '<!-- release-winget:type:release-status -->'
          labels-to-add: ${{ steps.status.outputs.status_label }}
          status-group: 'ci/build-ok,ci/build-failed,status/release-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Comment WinGet release status
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-title: '[Release] Status tracker — winget'
          issue-marker: '<!-- release-winget:type:release-status -->'
          issue-body: '${{ steps.status.outputs.status_icon }} WinGet release `${{ github.sha }}` — [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

  notify:
    name: "Automation: Notify WinGet Submission"
    needs: [detect-release, generate-manifests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report WinGet submission status
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "WinGet Release Submission Status"
          echo "═══════════════════════════════════════════════════"
          echo "Version: ${{ needs.detect-release.outputs.version }}"
          echo "Should Submit: ${{ needs.detect-release.outputs.should-submit }}"
          echo "Manifests Generated: ${{ needs.generate-manifests.outputs.manifest-dir }}"
          echo ""
          echo "Next steps:"
          echo "  1. Download winget-manifests artifact"
          echo "  2. Fork: https://github.com/microsoft/winget-pkgs"
          echo "  3. Copy manifests to your fork at:"
          echo "     manifests/t/ThemisDB/ThemisDB/${{ needs.detect-release.outputs.version }}/"
          echo "  4. Submit PR with title:"
          echo "     'New package: ThemisDB.ThemisDB version ${{ needs.detect-release.outputs.version }}'"
          echo "═══════════════════════════════════════════════════"
