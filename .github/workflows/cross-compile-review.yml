name: Cross-Compile Code Review

on:
  pull_request:
    paths:
      - '**.cpp'
      - '**.cc'
      - '**.cxx'
      - '**.h'
      - '**.hpp'
      - '**/CMakeLists.txt'
      - '**.py'
  push:
    branches: [main, develop]

jobs:
  cross-compile-review:
    name: Validate Cross-Compile Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **.cpp
            **.cc
            **.cxx
            **.h
            **.hpp
            **/CMakeLists.txt
            **.py

      - name: Run Cross-Compile Review
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          python3 scripts/cross-compile-reviewer.py \
            --files ${{ steps.changed-files.outputs.all_changed_files }} \
            --output text

      - name: Generate JSON Report
        if: always()
        run: |
          python3 scripts/cross-compile-reviewer.py \
            --files ${{ steps.changed-files.outputs.all_changed_files }} \
            --output json \
            --json-file cross-compile-report.json || true

      - name: Upload Review Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cross-compile-report
          path: cross-compile-report.json
          retention-days: 30

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const report = JSON.parse(fs.readFileSync('cross-compile-report.json', 'utf8'));
              
              let comment = '## 🔍 Cross-Compile Code Review\n\n';
              
              if (report.approved) {
                comment += '✅ **All checks passed!** This code is cross-compile compatible.\n\n';
              } else {
                comment += '❌ **Review Failed** - Cross-compile issues found:\n\n';
              }
              
              comment += `### Summary\n`;
              comment += `- Critical Violations: ${report.critical_violations}\n`;
              comment += `- High Priority Violations: ${report.high_violations}\n`;
              comment += `- Total Issues: ${report.total_violations}\n\n`;
              
              if (report.violations && report.violations.length > 0) {
                comment += '### Issues\n\n';
                report.violations.forEach(v => {
                  comment += `**[${v.rule}]** Line ${v.line}: ${v.message}\n`;
                  comment += `\`\`\`\n${v.snippet}\n\`\`\`\n`;
                  if (v.suggestion) {
                    comment += `💡 ${v.suggestion}\n`;
                  }
                  comment += '\n';
                });
              }
              
              if (report.warnings && report.warnings.length > 0) {
                comment += '### Warnings\n\n';
                report.warnings.forEach(w => {
                  comment += `⚠️ **[${w.rule}]** Line ${w.line}: ${w.message}\n`;
                });
              }
              
              comment += '\n---\n';
              comment += '📖 See [CROSS_COMPILE_REQUIREMENTS.md](CROSS_COMPILE_REQUIREMENTS.md) for details\n';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (e) {
              console.log('Could not parse report:', e);
            }

      - name: Fail if critical violations
        if: failure()
        run: |
          if [ -f cross-compile-report.json ]; then
            CRITICAL=$(python3 -c "import json; print(json.load(open('cross-compile-report.json'))['critical_violations'])" 2>/dev/null || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ Critical violations found: $CRITICAL"
              exit 1
            fi
          fi
