name: Scraper Plugin CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'plugins/scraper/**'
      - 'tests/test_scraper_plugin.cpp'
      - '.github/workflows/02-feature-modules_scraper-plugin-ci.yml'
  workflow_dispatch:

concurrency:
  group: scraper-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  scraper-plugin-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Scraper Plugin tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libyaml-cpp-dev
            libpugixml-dev
            libcurl4-openssl-dev
            librocksdb-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_scraper_plugin_focused

      - name: Run Scraper Plugin unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex ScraperPluginFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee scraper_plugin_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-plugin-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/scraper_plugin_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🕷️ Scraper Plugin – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Groups: A-UrlPolicy(6), B-Config(5), C-GovCatalog(5), D-SearchEngine(5), E-ApiClient(4), F-LLMEvaluator(4), G-MetadataWriter(4), H-Plugin(7), I-Provenance(6), J-KnowledgeSources(5), K-Pipeline(5), L-Immutability(4) = 60 tests" >> "$GITHUB_STEP_SUMMARY"
