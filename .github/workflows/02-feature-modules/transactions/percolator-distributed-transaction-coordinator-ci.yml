name: Percolator Distributed Transaction Coordinator CI

# Triggered on every push/PR that touches the Percolator coordinator sources,
# the TrueTime clock, OrphanDetector, or their tests.  Targets v1.7.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/sharding/cross_shard_transaction.h'
      - 'src/sharding/cross_shard_transaction.cpp'
      - 'include/sharding/truetime.h'
      - 'src/sharding/truetime.cpp'
      - 'include/sharding/orphan_detector.h'
      - 'src/sharding/orphan_detector.cpp'
      - 'include/sharding/distributed_transaction.h'
      - 'src/sharding/distributed_transaction.cpp'
      - 'tests/test_cross_shard_coordinator.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/transactions/percolator-distributed-transaction-coordinator-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/sharding/cross_shard_transaction.h'
      - 'src/sharding/cross_shard_transaction.cpp'
      - 'include/sharding/truetime.h'
      - 'src/sharding/truetime.cpp'
      - 'include/sharding/orphan_detector.h'
      - 'src/sharding/orphan_detector.cpp'
      - 'include/sharding/distributed_transaction.h'
      - 'src/sharding/distributed_transaction.cpp'
      - 'tests/test_cross_shard_coordinator.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/transactions/percolator-distributed-transaction-coordinator-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the PercolatorCoordinator focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  PercolatorCoordinator class exists and constructs cleanly
  #   AC-2  TrueTime::now_with_uncertainty() returns a valid [earliest, latest] interval
  #   AC-3  TrueTime::now_with_uncertainty() is consistent with now()
  #   AC-4  Single-shard Percolator commit succeeds
  #   AC-5  Multi-shard Percolator commit succeeds
  #   AC-6  Abort of Percolator transaction yields ABORTED state
  #   AC-7  cleanStaleLocks(empty list) returns 0
  #   AC-8  cleanStaleLocks(unknown txn) gracefully skips and returns 0
  #   AC-9  OrphanDetector::cleanPercolatorLocks returns 0 on empty coordinator
  #   AC-10 OrphanDetector::detectOrphans returns no orphans on fresh coordinator
  #   AC-11 OrphanDetector::isOrphaned returns false for unknown transactions
  #   AC-12 Concurrent Percolator transactions all commit successfully
  #   AC-13 DistributedTransactionCoordinator selects Percolator for SNAPSHOT_ISOLATION
  #   AC-14 DistributedTransactionCoordinator uses 2PC for SERIALIZABLE
  # ---------------------------------------------------------------------------
  percolator-coordinator-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Percolator Coordinator (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run PercolatorCoordinatorFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PercolatorCoordinatorFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee percolator_coordinator_ctest.txt

      # ── Granular test filter via focused binary ────────────────────────────
      - name: Run individual Percolator test groups via focused binary
        run: |
          set -o pipefail
          cd build
          # TrueTimePercolatorTest* and PercolatorCoordinatorTest* are the new Percolator
          # test groups.  CalvinProtocolTest* and CrossShardCoordinatorTest* are pre-existing
          # tests that reside in the same test file; they are included to catch regressions.
          ./tests/test_percolator_coordinator_focused \
            --gtest_filter="TrueTimePercolatorTest*:PercolatorCoordinatorTest*:CalvinProtocolTest*:CrossShardCoordinatorTest*" \
            --gtest_output="xml:percolator_coordinator_gtest.xml" \
            2>&1 | tee percolator_coordinator_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: percolator-coordinator-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/percolator_coordinator_ctest.txt
            build/percolator_coordinator_gtest.xml
            build/percolator_coordinator_gtest_output.txt
          retention-days: 30
