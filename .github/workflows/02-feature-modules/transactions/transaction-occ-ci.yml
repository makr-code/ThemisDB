name: Transaction OCC CI

# Triggered on every push / PR that touches the OCC implementation in the
# TransactionManager sources or the dedicated test file.
# Targets v1.8.0
# (roadmap:233:transaction:v1.8.0:optimistic-concurrency-control-occ).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/transaction/transaction_manager.h'
      - 'src/transaction/transaction_manager.cpp'
      - 'tests/test_transaction_occ.cpp'
      - 'benchmarks/bench_transaction_throughput.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/transaction-occ-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/transaction/transaction_manager.h'
      - 'src/transaction/transaction_manager.cpp'
      - 'tests/test_transaction_occ.cpp'
      - 'benchmarks/bench_transaction_throughput.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/transaction-occ-ci.yml'
  workflow_dispatch:

concurrency:
  group: transaction-occ-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the OCC test suite (TransactionOccTests).
  # Tests cover all acceptance criteria for v1.8.0:
  #   AC-1  getEntityVersion returns 0 for non-existent entities
  #   AC-2  getEntityVersion returns nullopt when transaction is inactive
  #   AC-3  optimisticPut creates new entity with expected_version=0
  #   AC-4  optimisticPut fails with "OCC entity already exists" if entity exists and expected_version=0
  #   AC-5  optimisticPut updates entity when version matches; increments to expected_version+1
  #   AC-6  optimisticPut fails with "OCC version conflict" on stale version (includes expected=N actual=M)
  #   AC-7  optimisticErase deletes entity when version matches; resets version to 0
  #   AC-8  optimisticErase fails with "OCC entity not found" for non-existent entity
  #   AC-9  optimisticErase fails with "OCC version conflict" on version mismatch
  #   AC-10 Read-modify-write OCC retry pattern succeeds
  #   AC-11 OCC works with all isolation levels (READ_COMMITTED, REPEATABLE_READ, SERIALIZABLE)
  # ---------------------------------------------------------------------------
  transaction-occ-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Transaction OCC tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build (OCC test target)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_transaction_occ

      - name: Run Transaction OCC unit tests
        run: |
          set -o pipefail
          cd build
          ctest --test-dir . \
            --tests-regex TransactionOccTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee transaction_occ_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-occ-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/transaction_occ_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 Transaction OCC – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "OCC: per-entity version numbers, getEntityVersion, optimisticPut, optimisticErase, version-conflict detection, retry pattern, isolation-level compatibility." >> "$GITHUB_STEP_SUMMARY"
