name: Adaptive Deadlock Prevention CI

# Triggered on every push/PR that touches DeadlockPredictor or its tests.
# Targets v1.9.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/transaction/deadlock_predictor.h'
      - 'src/transaction/deadlock_predictor.cpp'
      - 'include/transaction/transaction_manager.h'
      - 'src/transaction/transaction_manager.cpp'
      - 'tests/test_adaptive_deadlock_prevention.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/adaptive-deadlock-prevention-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/transaction/deadlock_predictor.h'
      - 'src/transaction/deadlock_predictor.cpp'
      - 'include/transaction/transaction_manager.h'
      - 'src/transaction/transaction_manager.cpp'
      - 'tests/test_adaptive_deadlock_prevention.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/adaptive-deadlock-prevention-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the AdaptiveDeadlockPrevention focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  DeadlockPredictor initialises with zero counts
  #   AC-2  recordTransaction increases transaction count
  #   AC-3  recordDeadlock increases deadlock count and weights conflict pairs
  #   AC-4  predictDeadlockProbability returns 0 below min_samples threshold
  #   AC-5  predictDeadlockProbability > 0 after sufficient samples + deadlock
  #   AC-6  probability for deadlocked pair is higher than non-deadlocked pair
  #   AC-7  probability is always clamped to [0.0, 1.0]
  #   AC-8  recommendLockOrder returns all input keys in deterministic order
  #   AC-9  recommendTimeout clamps to [min, max] configured range
  #   AC-10 recommendTimeout grows with observed long hold times
  #   AC-11 reset() clears all internal state
  #   AC-12 TransactionManager delegates to attached predictor
  #   AC-13 No predictor attached → predictDeadlockProbability returns 0.0
  #   AC-14 No predictor attached → recommendLockOrder is lexicographic
  #   AC-15 No predictor attached → recommendTimeout uses deadlock_timeout_ms_
  # ---------------------------------------------------------------------------
  adaptive-deadlock-prevention-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Adaptive Deadlock Prevention (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run AdaptiveDeadlockPreventionFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R AdaptiveDeadlockPreventionFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee adaptive_deadlock_prevention_ctest.txt

      # ── Full test filter via unified binary ────────────────────────────────
      - name: Run DeadlockPredictorTest and AdaptiveDeadlockIntegrationTest
        run: |
          set -o pipefail
          cd build
          ./tests/test_adaptive_deadlock_prevention_focused \
            --gtest_filter="DeadlockPredictorTest*:AdaptiveDeadlockIntegrationTest*" \
            --gtest_output="xml:adaptive_deadlock_prevention_gtest.xml" \
            2>&1 | tee adaptive_deadlock_prevention_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-deadlock-prevention-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/adaptive_deadlock_prevention_ctest.txt
            build/adaptive_deadlock_prevention_gtest.xml
            build/adaptive_deadlock_prevention_gtest_output.txt
          retention-days: 30
