name: CLI Migration Scanner CI

# Triggered on every push/PR that touches the migration scanner sources,
# the implementation header, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'tools/config_migration_scanner.cpp'
      - 'src/config/config_migration_scanner_impl.h'
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'src/config/path_mapping_metadata.h'
      - 'src/config/config_audit_log.cpp'
      - 'src/config/config_audit_log.h'
      - 'tests/test_config_migration_scanner.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/cli-migration-scanner-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/config_migration_scanner.cpp'
      - 'src/config/config_migration_scanner_impl.h'
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'src/config/path_mapping_metadata.h'
      - 'src/config/config_audit_log.cpp'
      - 'src/config/config_audit_log.h'
      - 'tests/test_config_migration_scanner.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/cli-migration-scanner-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ConfigMigrationScanner focused test suite.
  # Tests cover:
  #   1. shouldScanFile() honours the .yaml/.json/.toml/.ini/.env whitelist
  #   2. scanFile() detects legacy path strings and populates ScanMatch fields
  #   3. fixFile() rewrites file contents in-place and creates .bak backups
  #   4. fixFile() dry-run prints the would-be change without modifying files
  #   5. formatTimePoint() formats optional<time_point> as YYYY-MM-DD
  #   6. printText() / printJson() / printCsv() output formatters
  #   7. Non-scannable files (.cpp, .md) are skipped
  # ---------------------------------------------------------------------------
  cli-migration-scanner-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CLI Migration Scanner tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsnappy-dev liblz4-dev

      - name: Configure (migration scanner test targets)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build ConfigMigrationScanner focused test binary
        run: cmake --build build --target test_config_migration_scanner_focused -- -j$(nproc)

      - name: Run ConfigMigrationScanner unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex ConfigMigrationScannerFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee cli_migration_scanner_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-migration-scanner-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cli_migration_scanner_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 CLI Migration Scanner – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ConfigMigrationScanner: file scanning, dry-run mode, fix mode with .bak backups, output formatters (text/json/csv), exit code 1 on overdue paths." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build the config_migration_scanner CLI binary itself (smoke-test that the
  # tool compiles and --help exits cleanly).
  # ---------------------------------------------------------------------------
  cli-migration-scanner-binary:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CLI binary build (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsnappy-dev liblz4-dev

      - name: Configure
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build config_migration_scanner binary
        run: cmake --build build --target config_migration_scanner -- -j$(nproc)

      - name: Smoke-test --help
        run: |
          BINARY=$(find build -name config_migration_scanner -type f | head -1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: config_migration_scanner binary not found under build/"
            exit 1
          fi
          echo "Found binary: $BINARY"
          # --help is expected to print usage and exit 0
          "$BINARY" --help

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔧 CLI Migration Scanner – Binary Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
