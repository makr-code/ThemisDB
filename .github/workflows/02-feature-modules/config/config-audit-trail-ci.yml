name: Config Audit Trail CI

# Triggered on every push/PR that touches the ConfigAuditLog sources,
# audit-trail test files, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/config/config_audit_log.h'
      - 'src/config/config_audit_log.cpp'
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'tests/test_config_path_resolver.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/config-audit-trail-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/config/config_audit_log.h'
      - 'src/config/config_audit_log.cpp'
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'tests/test_config_path_resolver.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/config-audit-trail-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ConfigPathResolver focused test suite.
  # Config audit trail tests cover:
  #   1. ConfigAuditLog standalone bounded ring-buffer (mutex + std::deque)
  #   2. AuditEntry struct: requested_path, resolved_path, timestamp,
  #      is_legacy, is_cache_hit
  #   3. Audit logging disabled by default; opt-in via setAuditLogEnabled(true)
  #   4. Maximum entries bounded to 10,000 by default (oldest-first eviction)
  #   5. setAuditLogMaxEntries(n) configures the limit at runtime; shrinking
  #      evicts the oldest entries immediately
  #   6. is_legacy detection uses explicit was_legacy_fallback boolean (no
  #      post-hoc path comparison)
  #   7. Cache-hit entries: is_legacy = isLegacyPath(normalized) && (*cached == normalized)
  #   8. spdlog::trace structured message emitted per recorded entry
  #   9. Public API: setAuditLogEnabled, auditLog, clearAuditLog,
  #      setAuditLogMaxEntries
  # ---------------------------------------------------------------------------
  config-audit-trail-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Config audit trail tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsnappy-dev liblz4-dev

      - name: Configure (config path resolver test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build ConfigPathResolver focused test binary
        run: cmake --build build --target test_config_path_resolver_focused -- -j$(nproc)

      - name: Run Config Audit Trail unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex ConfigPathResolverFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee config_audit_trail_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-audit-trail-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/config_audit_trail_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📋 Config Audit Trail – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ConfigAuditLog: bounded ring-buffer (mutex + std::deque), AuditEntry struct, setAuditLogEnabled()/auditLog()/clearAuditLog()/setAuditLogMaxEntries() public API, spdlog::trace integration." >> "$GITHUB_STEP_SUMMARY"
