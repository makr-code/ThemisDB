name: Config Deprecation Aggregation CI

# Triggered on every push/PR that touches the ConfigPathResolver sources,
# deprecation aggregation-related test files, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'src/config/config_audit_log.cpp'
      - 'src/config/config_audit_log.h'
      - 'src/config/config_metrics_exporter.cpp'
      - 'src/config/config_metrics_exporter.h'
      - 'src/config/path_mapping_metadata.h'
      - 'tests/test_config_path_resolver.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/config-deprecation-aggregation-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/config/config_path_resolver.cpp'
      - 'src/config/config_path_resolver.h'
      - 'src/config/config_audit_log.cpp'
      - 'src/config/config_audit_log.h'
      - 'src/config/config_metrics_exporter.cpp'
      - 'src/config/config_metrics_exporter.h'
      - 'src/config/path_mapping_metadata.h'
      - 'tests/test_config_path_resolver.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/config-deprecation-aggregation-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ConfigPathResolver focused test suite.
  # Deprecation aggregation tests cover:
  #   1. DeprecationAggregator singleton tracks per-path legacy usage counts
  #   2. usage_counts_ map updated on every legacy_fallback increment
  #   3. Background reporter thread start/stop lifecycle (setAggregationEnabled)
  #   4. deprecationReport() returns entries sorted by descending usage count
  #   5. DeprecationEntry fields: legacy_path, new_path, category, usage_count,
  #      removal_date, migration_guide_url
  #   6. Per-call log warnings suppressed when aggregation is enabled
  #   7. aggregator_.reset() clears all usage counts on resetMetrics()
  # ---------------------------------------------------------------------------
  config-deprecation-aggregation-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Config deprecation aggregation tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsnappy-dev liblz4-dev

      - name: Configure (config path resolver test targets)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build ConfigPathResolver focused test binary
        run: cmake --build build --target test_config_path_resolver_focused -- -j$(nproc)

      - name: Run ConfigPathResolver deprecation aggregation unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex ConfigPathResolverFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee config_deprecation_aggregation_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-deprecation-aggregation-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/config_deprecation_aggregation_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🗂️ Config Deprecation Aggregation – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "DeprecationAggregator: per-path usage tracking, background reporter thread (300s interval), deprecationReport() API, setAggregationEnabled() flag, per-call warning suppression." >> "$GITHUB_STEP_SUMMARY"
