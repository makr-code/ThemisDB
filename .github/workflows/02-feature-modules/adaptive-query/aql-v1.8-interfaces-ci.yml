name: AQL v1.8.0 Interfaces CI

# Validates the AQL module v1.8.0 deliverables:
#   - include/aql/multimodal_infer_request.h (ModalityType, MultiModalInput, MultiModalInferRequest)
#   - include/aql/iasync_llm_backend.h (IAsyncLLMBackend, ThreadPoolAsyncLLMBackend)
#
# No LLM model is required — tests use stub ILLMPlugin implementations.
# No GPU hardware is required.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/aql/multimodal_infer_request.h'
      - 'include/aql/iasync_llm_backend.h'
      - 'tests/test_aql_multimodal.cpp'
      - 'tests/test_aql_async_backend.cpp'
      - '.github/workflows/02-feature-modules/adaptive-query/aql-v1.8-interfaces-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/aql/multimodal_infer_request.h'
      - 'include/aql/iasync_llm_backend.h'
      - 'tests/test_aql_multimodal.cpp'
      - 'tests/test_aql_async_backend.cpp'
      - '.github/workflows/02-feature-modules/adaptive-query/aql-v1.8-interfaces-ci.yml'
  workflow_dispatch:

concurrency:
  group: aql-v1.8-interfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  aql-v1-8-interfaces:
    needs: ci-scope-classifier
    name: AQL v1.8.0 Interfaces (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure (LLM=OFF, no GPU required)
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          edition: ''
          ci-mode: 'true'
          extra-cmake-flags: >-
            -DTHEMIS_ENABLE_LLM=OFF
            -DTHEMIS_ENABLE_GPU=OFF

      # ── MultiModal Types ─────────────────────────────────────────────────────
      - name: Run AQLMultimodalTests
        run: |
          set -o pipefail
          cd build
          ctest -R "AQLMultimodalTests|MultiModalInputTest|MultiModalInferRequestTest|ModalityTypeTest" \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee aql_multimodal_results.txt

      # ── Async Backend ────────────────────────────────────────────────────────
      - name: Run AQLAsyncBackendTests
        run: |
          set -o pipefail
          cd build
          ctest -R "IAsyncLLMBackendTest|ThreadPoolAsyncLLMBackendTest" \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee aql_async_backend_results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aql-v1.8-test-results-${{ matrix.compiler }}
          path: build/aql_*.txt
          retention-days: 7
