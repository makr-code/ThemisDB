name: Temporal-Spatial Queries CI

# Triggered on every push / PR that touches the temporal-spatial query sources,
# the temporal versioning system, its test file, or this workflow itself.
# Targets v1.7.0 (roadmap:171:geo:v1.7.0:temporal-spatial-queries-location-at-time-t).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/geo/temporal_spatial_query.h'
      - 'src/geo/temporal_spatial_query.cpp'
      - 'include/temporal/system_versioned_table.h'
      - 'src/temporal/system_versioned_table.cpp'
      - 'include/temporal/temporal_types.h'
      - 'include/geo/spatial_join.h'
      - 'src/geo/spatial_join.cpp'
      - 'tests/geo/test_temporal_spatial_query.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/adaptive-query/temporal-spatial-queries-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/geo/temporal_spatial_query.h'
      - 'src/geo/temporal_spatial_query.cpp'
      - 'include/temporal/system_versioned_table.h'
      - 'src/temporal/system_versioned_table.cpp'
      - 'include/temporal/temporal_types.h'
      - 'include/geo/spatial_join.h'
      - 'src/geo/spatial_join.cpp'
      - 'tests/geo/test_temporal_spatial_query.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/adaptive-query/temporal-spatial-queries-ci.yml'
  workflow_dispatch:

concurrency:
  group: temporal-spatial-queries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated TemporalSpatialQuery focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  extractGeometry — parses GeoJSON string and embedded object fields
  #   AC-2  locationAtTime — returns geometry at the correct historical version
  #   AC-3  allLocationsAtTime — returns (key, geometry) pairs for all alive entities
  #   AC-4  entitiesInBBoxAtTime — filters by axis-aligned bounding box
  #   AC-5  entitiesWithinDistanceAtTime — Haversine distance filter
  #   AC-6  entitiesWithinDistanceAtTimeSorted — sorted ascending by distance
  # ---------------------------------------------------------------------------
  temporal-spatial-queries-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Temporal-Spatial Queries tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev
            libspdlog-dev nlohmann-json3-dev libgeos-dev libproj-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target (AC-1 through AC-6) ────────────────────────────
      - name: Run TemporalSpatialQueryFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R TemporalSpatialQueryFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee temporal_spatial_query_results.txt

      # ── All TemporalSpatialQuery tests via unified binary ──────────────────
      - name: Run temporal-spatial query tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="TemporalSpatialQuery*:LocationAtTimeTest*:AllLocationsAtTime*:EntitiesIn*:EntitiesWithin*" \
            --gtest_output="xml:temporal_spatial_query_gtest.xml" \
            2>&1 | tee temporal_spatial_query_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-spatial-query-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/temporal_spatial_query_results.txt
            build/temporal_spatial_query_gtest.xml
            build/temporal_spatial_query_gtest_output.txt
          retention-days: 30
