name: Geo Spatial JOIN CI

# Triggered on every push / PR that touches the spatial join sources,
# the AQL translator/runner, its test file, or this workflow itself.
# Targets v1.6.0 (roadmap:170:geo:v1.6.0:spatial-join-support).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/geo/spatial_join.h'
      - 'src/geo/spatial_join.cpp'
      - 'include/query/aql_translator.h'
      - 'src/query/aql_translator.cpp'
      - 'src/query/aql_runner.cpp'
      - 'tests/geo/test_geo_spatial_join.cpp'
      - 'benchmarks/bench_spatial_join.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/adaptive-query/geo-spatial-join-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/geo/spatial_join.h'
      - 'src/geo/spatial_join.cpp'
      - 'include/query/aql_translator.h'
      - 'src/query/aql_translator.cpp'
      - 'src/query/aql_runner.cpp'
      - 'tests/geo/test_geo_spatial_join.cpp'
      - 'benchmarks/bench_spatial_join.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/adaptive-query/geo-spatial-join-ci.yml'
  workflow_dispatch:

concurrency:
  group: geo-spatial-join-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated GeoSpatialJoin focused test suite.
  # Tests cover all six acceptance criteria (AC-1 to AC-6):
  #   AC-1  Nested-loop join with R-tree index on inner collection
  #   AC-2  AQL syntax: FOR a IN colA FOR b IN colB FILTER GEO_DISTANCE(a.f, b.f) <= N
  #   AC-3  Lazy iterator (advance/current/done) — no full materialisation
  #   AC-4  Configurable max_pairs limit (default 1 M) with warning log
  #   AC-5  Performance: 100k×100k points, 1 km threshold, first 1 000 results ≤ 500 ms
  #   AC-6  Memory bounded by R-tree index size + O(candidates) working set
  # ---------------------------------------------------------------------------
  geo-spatial-join-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Geo Spatial JOIN tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev
            libspdlog-dev nlohmann-json3-dev libgeos-dev libproj-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target (AC-1 through AC-4, AC-6) ─────────────────────
      - name: Run GeoSpatialJoinFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R GeoSpatialJoinFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee geo_spatial_join_results.txt

      # ── Haversine + spatialJoin batch tests via unified binary ─────────────
      - name: Run spatial join tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="HaversineDistanceM*:SpatialJoin*:SpatialJoinIterator*" \
            --gtest_output="xml:geo_spatial_join_gtest.xml" \
            2>&1 | tee geo_spatial_join_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-spatial-join-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/geo_spatial_join_results.txt
            build/geo_spatial_join_gtest.xml
            build/geo_spatial_join_gtest_output.txt
          retention-days: 30
