name: Query JIT Compilation CI

# Triggered on every push/PR that touches the QueryCompiler sources,
# its test file, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/query/query_compiler.h'
      - 'src/query/query_compiler.cpp'
      - 'tests/test_query_jit_compilation.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/adaptive-query/query-jit-compilation-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/query/query_compiler.h'
      - 'src/query/query_compiler.cpp'
      - 'tests/test_query_jit_compilation.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/adaptive-query/query-jit-compilation-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated QueryJITCompilation focused test suite.
  # Tests cover all ten acceptance criteria (AC-1 to AC-10):
  #   AC-1  Hot-path detection (cold → compiled at hot_threshold)
  #   AC-2  Result identity: compiled path identical to interpreter
  #   AC-3  Fallback to interpreter on error
  #   AC-4  Cache key determinism and uniqueness
  #   AC-5  Single-entry invalidation
  #   AC-6  invalidateAll() resets all entries
  #   AC-7  Statistics counters accuracy
  #   AC-8  Default Config values
  #   AC-9  JIT disabled: always cold path
  #   AC-10 Re-registration reuses existing entry
  # ---------------------------------------------------------------------------
  query-jit-compilation-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Query JIT Compilation tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            compiler: GCC-13
          - os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            compiler: GCC-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            nlohmann-json3-dev
            libssl-dev
            librocksdb-dev
            libspdlog-dev
            libfmt-dev
            libyaml-cpp-dev
            libtbb-dev
            libboost-all-dev
            libsimdjson-dev
            libsnappy-dev
            liblz4-dev

      - name: Configure (query JIT compilation test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_MIMALLOC=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_BUILD_TESTS=ON

      - name: Build focused test binary
        run: cmake --build build --target test_query_jit_compilation_focused -- -j$(nproc)

      - name: Run focused tests
        run: |
          cd build
          ctest --test-dir . -R QueryJITCompilationFocusedTests \
                --output-on-failure --timeout 60
