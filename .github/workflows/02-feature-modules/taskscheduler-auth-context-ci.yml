name: TaskScheduler Auth Context CI

# Triggered on every push / PR that touches the scheduler auth-context sources or tests.
# Targets v1.8.0 (Issue #98).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/scheduler/task_scheduler.h'
      - 'src/scheduler/task_scheduler.cpp'
      - 'tests/test_task_scheduler_auth_context.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/taskscheduler-auth-context-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/scheduler/task_scheduler.h'
      - 'src/scheduler/task_scheduler.cpp'
      - 'tests/test_task_scheduler_auth_context.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/taskscheduler-auth-context-ci.yml'

concurrency:
  group: taskscheduler-auth-context-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  taskscheduler-auth-context-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: TaskScheduler Auth Context (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run TaskSchedulerAuthContextFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R TaskSchedulerAuthContextFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee taskscheduler_auth_context_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run TaskSchedulerAuthContext tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="TaskSchedulerAuthContextTest*" \
            --gtest_output="xml:taskscheduler_auth_context_gtest.xml" \
            2>&1 | tee taskscheduler_auth_context_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskscheduler-auth-context-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/taskscheduler_auth_context_results.txt
            build/taskscheduler_auth_context_gtest.xml
            build/taskscheduler_auth_context_gtest_output.txt
          retention-days: 30
