name: Metadata Interfaces CI

# Triggered on every push / PR that touches the metadata interface headers or
# their associated test files.  Covers v1.6.0 deliverables:
#   - IMetadataSecurityProvider / NoOpMetadataSecurityProvider /
#     InMemoryRbacMetadataSecurityProvider
#   - IMetadataChangeListener / RecordingMetadataChangeListener /
#     MetadataChangeEvent
#   - IMetadataExportPolicy / AlwaysExportPolicy / NeverExportPolicy /
#     FilteredExportPolicy
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/metadata/imetadata_security_provider.h'
      - 'include/metadata/imetadata_change_listener.h'
      - 'include/metadata/imetadata_export_policy.h'
      - 'tests/test_metadata_security_provider.cpp'
      - 'tests/test_metadata_change_listener.cpp'
      - 'tests/test_metadata_export_policy.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/metadata-interfaces-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/metadata/imetadata_security_provider.h'
      - 'include/metadata/imetadata_change_listener.h'
      - 'include/metadata/imetadata_export_policy.h'
      - 'tests/test_metadata_security_provider.cpp'
      - 'tests/test_metadata_change_listener.cpp'
      - 'tests/test_metadata_export_policy.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/metadata-interfaces-ci.yml'
  workflow_dispatch:

concurrency:
  group: metadata-interfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the metadata interface focused test suites.
  # Tests cover all acceptance criteria:
  #
  # IMetadataSecurityProvider / NoOpMetadataSecurityProvider /
  #   InMemoryRbacMetadataSecurityProvider
  #   AC-SEC-1  NoOp::hasPermission always returns true
  #   AC-SEC-2  NoOp::assertPermission never throws
  #   AC-SEC-3  RBAC: unknown principal is denied for every operation
  #   AC-SEC-4  RBAC: grant() permits the exact (principal, op, resource) triple
  #   AC-SEC-5  RBAC: wildcard resource "*" permits op on any resource
  #   AC-SEC-6  RBAC: ADMIN operation implies all other ops on all resources
  #   AC-SEC-7  RBAC: revoke() removes a previously granted permission
  #   AC-SEC-8  RBAC: revokeAll() removes all permissions for a principal
  #   AC-SEC-9  RBAC: assertPermission() throws MetadataAccessDeniedException
  #   AC-SEC-10 RBAC: grant/hasPermission are thread-safe under concurrent access
  #   AC-SEC-11 Polymorphic usage via IMetadataSecurityProvider*
  #
  # IMetadataChangeListener / RecordingMetadataChangeListener
  #   AC-CL-1  Initially eventCount() is 0
  #   AC-CL-2  onMetadataChanged() records events in FIFO order
  #   AC-CL-3  lastEvent() returns nullopt when no events recorded
  #   AC-CL-4  lastEvent() returns the most recent event after dispatch
  #   AC-CL-5  clear() resets eventCount to 0
  #   AC-CL-6  Callback is invoked synchronously after each event
  #   AC-CL-7  setCallback() replaces the previous callback
  #   AC-CL-8  Concurrent onMetadataChanged() calls are thread-safe
  #   AC-CL-9  Polymorphic usage via IMetadataChangeListener*
  #   AC-CL-10 MetadataChangeEvent::toJSON() emits correct fields
  #
  # IMetadataExportPolicy / AlwaysExportPolicy / NeverExportPolicy /
  #   FilteredExportPolicy
  #   AC-EP-1  AlwaysExportPolicy::shouldExport returns true for every trigger
  #   AC-EP-2  AlwaysExportPolicy::exportDelay returns 0 ms
  #   AC-EP-3  NeverExportPolicy::shouldExport returns false for every trigger
  #   AC-EP-4  FilteredExportPolicy: non-excluded table is allowed
  #   AC-EP-5  FilteredExportPolicy: excluded table is blocked
  #   AC-EP-6  removeExclusion restores shouldExport to true
  #   AC-EP-7  FilteredExportPolicy::exportDelay returns configured delay
  #   AC-EP-8  addExclusion/shouldExport are thread-safe under concurrent access
  #   AC-EP-9  Polymorphic usage via IMetadataExportPolicy*
  #   AC-EP-10 AlwaysExportPolicy accepts all MetadataExportTrigger variants
  #   AC-EP-11 NeverExportPolicy blocks all MetadataExportTrigger variants
  # ---------------------------------------------------------------------------
  metadata-interfaces:
    name: Metadata Interfaces – ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: ci-scope-classifier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libgtest-dev libgmock-dev \
            nlohmann-json3-dev \
            libfmt-dev libspdlog-dev \
            libssl-dev

      - name: Configure focused tests
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S tests -B build_metadata_interfaces \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTHEMIS_ROOT_DIR=${{ github.workspace }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build focused test binaries
        run: |
          cmake --build build_metadata_interfaces --target \
            test_metadata_security_provider_focused \
            test_metadata_change_listener_focused \
            test_metadata_export_policy_focused \
            -- -j$(nproc)

      - name: Run via ctest
        working-directory: build_metadata_interfaces
        run: |
          ctest --output-on-failure \
            --label-regex "metadata" \
            -R "MetadataSecurityProviderFocusedTests|MetadataChangeListenerFocusedTests|MetadataExportPolicyFocusedTests" \
            2>&1 | tee metadata_interfaces_ctest.txt

      - name: Run MetadataSecurityProvider tests directly
        working-directory: build_metadata_interfaces
        run: |
          ./test_metadata_security_provider_focused \
            --gtest_output=xml:security_provider_gtest.xml \
            2>&1 | tee security_provider_gtest_output.txt

      - name: Run MetadataChangeListener tests directly
        working-directory: build_metadata_interfaces
        run: |
          ./test_metadata_change_listener_focused \
            --gtest_output=xml:change_listener_gtest.xml \
            2>&1 | tee change_listener_gtest_output.txt

      - name: Run MetadataExportPolicy tests directly
        working-directory: build_metadata_interfaces
        run: |
          ./test_metadata_export_policy_focused \
            --gtest_output=xml:export_policy_gtest.xml \
            2>&1 | tee export_policy_gtest_output.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-interfaces-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          retention-days: 14
          path: |
            build_metadata_interfaces/metadata_interfaces_ctest.txt
            build_metadata_interfaces/security_provider_gtest.xml
            build_metadata_interfaces/security_provider_gtest_output.txt
            build_metadata_interfaces/change_listener_gtest.xml
            build_metadata_interfaces/change_listener_gtest_output.txt
            build_metadata_interfaces/export_policy_gtest.xml
            build_metadata_interfaces/export_policy_gtest_output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## Metadata Interfaces CI — ${{ matrix.os }} / ${{ matrix.compiler }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| MetadataSecurityProvider | 17 (AC-SEC-1..11) |" >> $GITHUB_STEP_SUMMARY
          echo "| MetadataChangeListener   | 14 (AC-CL-1..10)  |" >> $GITHUB_STEP_SUMMARY
          echo "| MetadataExportPolicy     | 18 (AC-EP-1..11)  |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 49 acceptance-criteria tests**" >> $GITHUB_STEP_SUMMARY
