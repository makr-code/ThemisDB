name: Chimera Error Recovery & Retry CI

# CI for the CHIMERA adapter layer's Error Recovery and Retry Logic (Issue #17,
# target v1.1.0).  Validates RetryPolicy, CircuitBreaker, and ConnectionWithRetry
# across GCC 12 and GCC 14.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/chimera/retry_policy.hpp'
      - 'include/chimera/database_adapter.hpp'
      - 'tests/chimera/test_retry_policy.cpp'
      - 'adapters/chimera/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/chimera-error-recovery-retry-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/chimera/retry_policy.hpp'
      - 'include/chimera/database_adapter.hpp'
      - 'tests/chimera/test_retry_policy.cpp'
      - 'adapters/chimera/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/chimera-error-recovery-retry-ci.yml'
  workflow_dispatch:

concurrency:
  group: chimera-error-recovery-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  chimera-retry-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Chimera Retry Policy (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run ChimeraRetryPolicyTests
        run: |
          set -o pipefail
          cd build
          ctest -R ChimeraRetryPolicyTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee chimera_retry_results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-retry-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/chimera_retry_results.txt
          retention-days: 30
