name: Chimera Retry Policy CI

# Validates the CHIMERA Error Recovery and Retry Logic (v1.8.0).
# Covers all three components delivered in retry_policy.hpp:
#   - RetryPolicy   – configurable max_retries, initial_delay,
#                     backoff_multiplier, max_delay, is_transient predicate
#   - CircuitBreaker – CLOSED → OPEN → HALF_OPEN → CLOSED state machine,
#                      failure threshold, open timeout, thread-safety
#   - ConnectionWithRetry – decorator that applies RetryPolicy + CircuitBreaker
#                           transparently; execute_with_retry, health_check

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/chimera/retry_policy.hpp'
      - 'include/chimera/database_adapter.hpp'
      - 'tests/chimera/test_retry_policy.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/chimera/chimera-retry-policy-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/chimera/retry_policy.hpp'
      - 'include/chimera/database_adapter.hpp'
      - 'tests/chimera/test_retry_policy.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/chimera/chimera-retry-policy-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ChimeraRetryPolicyTests suite.
  # Acceptance criteria covered:
  #
  # AC-RP-1  RetryPolicy defaults: max_retries=3, initial_delay=100 ms,
  #           backoff_multiplier=2.0, max_delay=10 000 ms.
  # AC-RP-2  Default is_transient: CONNECTION_ERROR and TIMEOUT are transient;
  #           all other ErrorCodes are permanent (no retry).
  # AC-RP-3  Custom is_transient predicate is honoured by ConnectionWithRetry.
  # AC-RP-4  Exponential backoff: delay doubles each attempt, capped at max_delay.
  #
  # AC-CB-1  CircuitBreaker starts in CLOSED state; allow_request() → true.
  # AC-CB-2  After failure_threshold consecutive failures the state → OPEN.
  # AC-CB-3  In OPEN state allow_request() → false (calls are rejected).
  # AC-CB-4  After open_timeout elapses the state → HALF_OPEN (probe allowed).
  # AC-CB-5  Successful probe (HALF_OPEN) → state returns to CLOSED.
  # AC-CB-6  Failed probe (HALF_OPEN) → state returns to OPEN.
  # AC-CB-7  record_success() in CLOSED resets consecutive_failures to 0.
  # AC-CB-8  reset() unconditionally returns the breaker to CLOSED.
  # AC-CB-9  All public methods are thread-safe under concurrent access.
  #
  # AC-CWR-1 execute_with_retry returns immediately when circuit is OPEN.
  # AC-CWR-2 Permanent error (is_transient=false) is returned without retry.
  # AC-CWR-3 Transient error triggers retry with exponential backoff.
  # AC-CWR-4 After max_retries transient errors the last error is returned.
  # AC-CWR-5 health_check() returns true when adapter is_connected().
  # AC-CWR-6 health_check() attempts connect() when adapter is disconnected;
  #           returns true on success, false on failure.
  # ---------------------------------------------------------------------------
  chimera-retry-policy-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Chimera Retry Policy (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: ''

      - name: Build chimera retry policy test binary
        run: cmake --build build --target test_chimera_retry_policy -- -j$(nproc)

      - name: Run ChimeraRetryPolicyTests
        run: |
          set -o pipefail
          cd build
          ctest --test-dir . \
            --tests-regex ChimeraRetryPolicyTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee chimera_retry_policy_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-retry-policy-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/chimera_retry_policy_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Chimera Retry Policy – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "RetryPolicy/CircuitBreaker/ConnectionWithRetry: exponential backoff, transient error classification, CLOSED/OPEN/HALF_OPEN circuit states, health_check reconnection." >> "$GITHUB_STEP_SUMMARY"
