name: Content Deduplication via Perceptual Hashing CI

# Validates Content Deduplication via Perceptual Hashing (v1.8.0).
# roadmap:168:content:v1.8.0:content-deduplication-via-perceptual-hashing
#
# Acceptance criteria covered:
#   AC-1  ImageProcessor::computePHash() — DCT-based 64-bit hash, pure C++ (no OpenCV)
#   AC-2  TextProcessor::computeMinHash() — 128-function MinHash, band-LSH via BoundedLRUCache
#   AC-3  DeduplicationChecker::isDuplicateImage() / isDuplicateText() integration
#   AC-4  ContentPolicy::enable_deduplication default false (opt-in per collection)
#   AC-5  content_dedup_checks_total / content_dedup_hits_total Prometheus counters
#   AC-6  pHash computation for a 4 MP image in < 5 ms (opt-in perf test)
#   AC-7  MinHash + LSH lookup with warm 100 K-entry index in < 1 ms (opt-in perf test)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/content/deduplication_checker.h'
      - 'src/content/deduplication_checker.cpp'
      - 'include/content/image_processor.h'
      - 'src/content/image_processor.cpp'
      - 'include/content/content_processor.h'
      - 'src/content/text_processor.cpp'
      - 'include/content/content_metrics.h'
      - 'src/content/content_metrics.cpp'
      - 'include/content/content_policy.h'
      - 'src/content/content_policy.cpp'
      - 'include/content/content_manager.h'
      - 'src/content/content_manager.cpp'
      - 'tests/test_content_deduplication.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/storage/content-dedup-perceptual-hashing-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/content/deduplication_checker.h'
      - 'src/content/deduplication_checker.cpp'
      - 'include/content/image_processor.h'
      - 'src/content/image_processor.cpp'
      - 'include/content/content_processor.h'
      - 'src/content/text_processor.cpp'
      - 'include/content/content_metrics.h'
      - 'src/content/content_metrics.cpp'
      - 'include/content/content_policy.h'
      - 'src/content/content_policy.cpp'
      - 'include/content/content_manager.h'
      - 'src/content/content_manager.cpp'
      - 'tests/test_content_deduplication.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/storage/content-dedup-perceptual-hashing-ci.yml'
  workflow_dispatch:

concurrency:
  group: content-dedup-perceptual-hashing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run ContentDeduplicationFocusedTests.
  # Covers AC-1 through AC-5 (correctness tests) and AC-6/AC-7 (perf, opt-in).
  # ---------------------------------------------------------------------------
  content-dedup-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Content Deduplication (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_content_deduplication_focused

      - name: Run ContentDeduplicationFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ContentDeduplicationFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee content_dedup_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_content_deduplication_focused \
            --gtest_output="xml:content_dedup_gtest.xml" \
            2>&1 | tee content_dedup_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-dedup-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/content_dedup_ctest.txt
            build/content_dedup_gtest.xml
            build/content_dedup_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 Content Deduplication via Perceptual Hashing – Unit Tests (v1.8.0)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1: ImageProcessor::computePHash() — DCT-based 64-bit hash, no OpenCV | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2: TextProcessor::computeMinHash() — 128-function MinHash + band-LSH | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3: DeduplicationChecker integration (pHash Hamming, MinHash Jaccard) | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4: ContentPolicy::enable_deduplication default false + config gate | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5: content_dedup_checks_total / content_dedup_hits_total counters | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6: pHash perf < 5 ms (local only: THEMIS_RUN_PERF_TESTS=1) | ⏭ local-only |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7: MinHash+LSH lookup < 1 ms (local only: THEMIS_RUN_PERF_TESTS=1) | ⏭ local-only |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8: Dedup overhead < 10 % of ingestion latency (local only: THEMIS_RUN_PERF_TESTS=1) | ⏭ local-only |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
