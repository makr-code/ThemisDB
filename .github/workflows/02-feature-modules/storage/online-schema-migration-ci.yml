name: Online Schema Migration CI

# Triggered on every push/PR that touches the SchemaMigrator sources,
# its test file, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/storage/online_schema_migration.cpp'
      - 'include/storage/online_schema_migration.h'
      - 'tests/test_online_schema_migration.cpp'
      - 'cmake/StorageEnhancements.cmake'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/storage/online-schema-migration-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/storage/online_schema_migration.cpp'
      - 'include/storage/online_schema_migration.h'
      - 'tests/test_online_schema_migration.cpp'
      - 'cmake/StorageEnhancements.cmake'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/storage/online-schema-migration-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated OnlineSchemaMigration focused test suite.
  # Tests cover:
  #   1. Add/drop columns (with type and nullability)
  #   2. Rename columns (valid and error paths)
  #   3. Change column types
  #   4. Add/drop indexes (regular and unique)
  #   5. Partition tables (range partitioning)
  #   6. Multi-op / multi-table batch migrations
  #   7. Phase transitions (IDLE → PENDING → IN_PROGRESS → APPLYING → COMPLETED/FAILED)
  #   8. abort_on_first_error flag
  #   9. Reset and reuse semantics
  #  10. Version monotonic increment
  # ---------------------------------------------------------------------------
  online-schema-migration-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Online schema migration tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev libzstd-dev

      - name: Configure (online schema migration test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build focused test binary
        run: cmake --build build --target test_online_schema_migration_focused -- -j$(nproc)

      - name: Run Online Schema Migration unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex OnlineSchemaMigrationFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee online_schema_migration_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: online-schema-migration-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/online_schema_migration_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Online Schema Migration – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SchemaMigrator: zero-downtime DDL (add/drop columns, rename, type change, add/drop indexes, partition tables). Phase transitions: IDLE→PENDING→IN_PROGRESS→APPLYING→COMPLETED/FAILED." >> "$GITHUB_STEP_SUMMARY"
