name: Binary Delta Patches CI

# Triggered on every push/PR that touches the DeltaUpdateEngine sources,
# its test file, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/updates/delta_update_engine.cpp'
      - 'include/updates/delta_update_engine.h'
      - 'tests/test_binary_delta_patches.cpp'
      - 'tests/test_updates_production.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/binary-delta-patches-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/updates/delta_update_engine.cpp'
      - 'include/updates/delta_update_engine.h'
      - 'tests/test_binary_delta_patches.cpp'
      - 'tests/test_updates_production.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/binary-delta-patches-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated BinaryDeltaPatches focused test suite.
  # Tests cover:
  #   1. Binary diff generation (ZSTD_DICT / VCDIFF, with BSDIFF/XDELTA3 fallback)
  #   2. Patch verification with checksums (SHA-256 base_hash / target_hash)
  #   3. Fallback to full download if patch fails
  #   4. Automatic patch generation API for CI/CD pipelines
  #   5. Compression-friendly delta encoding (size reduction assertions)
  # ---------------------------------------------------------------------------
  binary-delta-patches-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Binary delta patches tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev libzstd-dev

      - name: Configure (delta patches test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build focused test binary
        run: cmake --build build --target test_binary_delta_patches_focused -- -j$(nproc)

      - name: Run Binary Delta Patches unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex BinaryDeltaPatchesFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee binary_delta_patches_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-delta-patches-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/binary_delta_patches_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Binary Delta Patches – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "DeltaUpdateEngine: ZSTD_DICT/VCDIFF patch generation, SHA-256 hash verification, fallback on failure, path traversal prevention." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Demonstrate automatic patch generation capability (CI/CD pipeline use-case)
  #
  # This job simulates the release pipeline scenario: given old and new release
  # binaries, it calls DeltaUpdateEngine::generatePatch() via the focused test
  # suite's CiCdPatchGeneration_* tests to validate the API.
  # ---------------------------------------------------------------------------
  binary-delta-patches-cicd-generation:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Delta patch generation (CI/CD pipeline validation)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             gcc-13
          cxx:            g++-13
          extra-packages: nlohmann-json3-dev libssl-dev libzstd-dev

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build focused test binary
        run: cmake --build build --target test_binary_delta_patches_focused -- -j$(nproc)

      - name: Validate CI/CD patch generation API
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex BinaryDeltaPatchesFocusedTests \
            -R "CiCdPatchGeneration" \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee cicd_patch_gen_output.txt

      - name: Upload CI/CD patch generation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-delta-cicd-generation-results
          path: build/cicd_patch_gen_output.txt
          retention-days: 14
