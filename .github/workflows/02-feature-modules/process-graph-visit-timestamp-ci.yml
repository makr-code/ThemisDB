name: Process Graph Visit Timestamp CI

# Triggered on every push / PR that touches ProcessGraphManager visit-timestamp
# sources or their test file.
# Implements roadmap:255:network:v1.8.0:wireprotocolserver-processgraph-visit-timestamp-todo
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/index/process_graph.h'
      - 'src/index/process_graph.cpp'
      - 'src/network/wire_protocol_server.cpp'
      - 'tests/test_process_graph.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/process-graph-visit-timestamp-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/index/process_graph.h'
      - 'src/index/process_graph.cpp'
      - 'src/network/wire_protocol_server.cpp'
      - 'tests/test_process_graph.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/process-graph-visit-timestamp-ci.yml'
  workflow_dispatch:

concurrency:
  group: process-graph-visit-timestamp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run ProcessGraphVisitTimestampFocusedTests.
  # Tests cover all three acceptance criteria:
  #   AC-1  ProcessGraphVisitLog (map<node_id, time_point>) populated on start
  #   AC-2  getVisitTimestamp returns correct time_point after traversal
  #   AC-3  Timestamps are ordered correctly across multi-hop traversals
  # ---------------------------------------------------------------------------
  process-graph-visit-timestamp-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ProcessGraph visit-timestamp (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            librocksdb-dev \
            libssl-dev \
            libzstd-dev \
            nlohmann-json3-dev \
            libfmt-dev \
            libspdlog-dev \
            libgtest-dev \
            ninja-build \
            ${{ matrix.compiler }}

      - name: Configure and build focused tests
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_process_graph_visit_timestamp_focused
          extra-cmake-flags: >-
            -DTHEMIS_BUILD_TESTS=ON
            -DTHEMIS_ENABLE_LLM=OFF
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Run ProcessGraphVisitTimestampFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ProcessGraphVisitTimestampFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee process_graph_visit_timestamp_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-graph-visit-timestamp-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/process_graph_visit_timestamp_test_output.txt
