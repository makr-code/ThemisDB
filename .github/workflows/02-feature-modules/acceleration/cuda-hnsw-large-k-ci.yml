name: CUDA HNSW Large-k CI

# Triggered on every push/PR that touches the HNSW kernel, graph traversal,
# CUDA backend, or the large-k tests.  Targets Issue #132, v1.8.0.
#
# Validates all acceptance criteria:
#   AC-1  k=257 returns exactly 257 results (no silent truncation)
#   AC-2  k=512 returns exactly 512 results
#   AC-3  k=1024 returns exactly 1024 results (new single-pass kMaxK boundary)
#   AC-4  k=1025 uses multi-pass strategy and returns 1025 results
#   AC-5  k > 1024 surfaces BackendHealthStatus::makeDegraded() in release builds
#   AC-6  Results are sorted ascending by score for k=512
#   AC-7  Multiple queries with k=257 each return k results
#
# No GPU hardware is required — all tests exercise the CPU fallback path of
# CudaHnswTraversalEngine.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/acceleration/cuda/cuda_hnsw_kernels.cu'
      - 'src/index/cuda_hnsw_graph_traversal.cpp'
      - 'include/index/cuda_hnsw_graph_traversal.h'
      - 'src/acceleration/cuda_backend.cpp'
      - 'include/acceleration/cuda_backend.h'
      - 'tests/test_cuda_hnsw_large_k.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/acceleration/cuda-hnsw-large-k-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/acceleration/cuda/cuda_hnsw_kernels.cu'
      - 'src/index/cuda_hnsw_graph_traversal.cpp'
      - 'include/index/cuda_hnsw_graph_traversal.h'
      - 'src/acceleration/cuda_backend.cpp'
      - 'include/acceleration/cuda_backend.h'
      - 'tests/test_cuda_hnsw_large_k.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/acceleration/cuda-hnsw-large-k-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CUDA HNSW large-k focused tests.
  # No GPU hardware required — CudaHnswTraversalEngine falls back to CPU.
  # ---------------------------------------------------------------------------
  cuda-hnsw-large-k-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CUDA HNSW Large-k (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Run CudaHnswLargeKFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R CudaHnswLargeKFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee hnsw_large_k_ctest.txt

      - name: Run CUDA HNSW large-k tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_cuda_hnsw_large_k_focused \
            --gtest_filter="CudaHnswLargeK*" \
            --gtest_output="xml:hnsw_large_k_gtest.xml" \
            2>&1 | tee hnsw_large_k_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hnsw-large-k-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/hnsw_large_k_ctest.txt
            build/hnsw_large_k_gtest.xml
            build/hnsw_large_k_gtest_output.txt
          retention-days: 7
