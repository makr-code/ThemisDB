name: Hardware-Accelerated Query Execution CI

# Triggered on every push/PR that touches the HardwareAccelerator sources,
# its test file, or this workflow itself.
# Targets v1.8.0 (roadmap:85:performance:v1.8.0:hardware-accelerated-query-execution).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/performance/hardware_accelerator.h'
      - 'src/performance/hardware_accelerator.cpp'
      - 'tests/test_performance_hardware_accelerator.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/acceleration/hardware-accelerated-query-execution-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/performance/hardware_accelerator.h'
      - 'src/performance/hardware_accelerator.cpp'
      - 'tests/test_performance_hardware_accelerator.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/acceleration/hardware-accelerated-query-execution-ci.yml'
  workflow_dispatch:

concurrency:
  group: hardware-accelerated-query-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the HardwareAcceleratorFocusedTests suite.
  # Tests cover all fourteen acceptance criteria (AC-1 to AC-14):
  #   AC-1  HashJoin dispatch      (GPU-sim and CPU paths identical results)
  #   AC-2  SortMergeJoin dispatch (results match hash-join)
  #   AC-3  Aggregate operators    (SUM / COUNT / MIN / MAX / AVG)
  #   AC-4  Filter operator        (all comparison operators)
  #   AC-5  Sort operator          (ascending ordering, row preservation)
  #   AC-6  PatternMatch           (prefix, suffix, contains, exact)
  #   AC-7  VectorOp               (dot product correctness)
  #   AC-8  can_accelerate         (true for supported ops, false for Unknown)
  #   AC-9  estimate_speedup       (≥1.0, scales with row count and device)
  #   AC-10 Statistics             (counters incremented; resetStats clears)
  #   AC-11 Config thresholds      (hw_path / cpu_fallback by row-count config)
  #   AC-12 Error handling         (Unknown op_type → ok=false)
  #   AC-13 Empty inputs           (no crash for empty row sets)
  #   AC-14 Thread safety          (concurrent execute() calls are safe)
  # ---------------------------------------------------------------------------
  hardware-accelerator-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Hardware Accelerator tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build (hardware accelerator test target)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_performance_hardware_accelerator

      - name: Run Hardware Accelerator unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex HardwareAcceleratorFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee hardware_accelerator_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-accelerator-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/hardware_accelerator_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚡ Hardware-Accelerated Query Execution – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HardwareAccelerator: GPU join dispatch, SIMD aggregate/filter/sort, pattern match, vector ops, statistics, thread safety." >> "$GITHUB_STEP_SUMMARY"
