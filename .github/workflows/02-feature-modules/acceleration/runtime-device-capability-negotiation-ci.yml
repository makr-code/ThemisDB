name: Runtime Device Capability Negotiation CI

# Triggered on every push/PR that touches DeviceManager, BackendRegistry
# runtime startup, or their tests.  Targets v1.7.0 (Issue #37).
#
# Validates all acceptance criteria:
#   AC-1  DeviceManager::probeDevices() returns a non-empty list (≥ CPU fallback)
#   AC-2  Cache is served within TTL; refresh() forces a fresh probe
#   AC-3  getBestDevice() selects healthy device with highest free VRAM
#   AC-4  hasGPU() / bestBackendType() are consistent with getBestDevice()
#   AC-5  logDeviceInfo() emits structured output without crashing
#   AC-6  BackendRegistry::deviceInfo() non-empty snapshot after initializeRuntime()
#   AC-7  initializeRuntime() performs capability-driven backend selection
#   AC-8  Selected backends are non-null CPU on headless CI
#   AC-9  Impossible requirements yield nullptr for the relevant category
#   AC-10 Second initializeRuntime() call refreshes the cached selection
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/acceleration/device_manager.h'
      - 'src/acceleration/device_manager.cpp'
      - 'include/acceleration/compute_backend.h'
      - 'src/acceleration/backend_registry.cpp'
      - 'tests/test_device_manager.cpp'
      - 'tests/test_backend_registry_startup.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/acceleration/runtime-device-capability-negotiation-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/acceleration/device_manager.h'
      - 'src/acceleration/device_manager.cpp'
      - 'include/acceleration/compute_backend.h'
      - 'src/acceleration/backend_registry.cpp'
      - 'tests/test_device_manager.cpp'
      - 'tests/test_backend_registry_startup.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/acceleration/runtime-device-capability-negotiation-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the DeviceManager and BackendRegistry startup focused tests.
  # No GPU hardware is required — all tests exercise CPU fallback paths.
  # ---------------------------------------------------------------------------
  runtime-device-capability-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Runtime Device Capability (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── DeviceManager focused tests ────────────────────────────────────────
      - name: Run DeviceManagerFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R DeviceManagerFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee device_manager_ctest.txt

      - name: Run DeviceManagerTest suite via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_device_manager_focused \
            --gtest_filter="DeviceManagerTest*" \
            --gtest_output="xml:device_manager_gtest.xml" \
            2>&1 | tee device_manager_gtest_output.txt

      # ── BackendRegistry startup tests ──────────────────────────────────────
      - name: Run BackendRegistryStartupFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R BackendRegistryStartupFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee backend_registry_startup_ctest.txt

      - name: Run BackendRegistryStartup suite via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_backend_registry_startup_focused \
            --gtest_filter="BackendRegistryStartup*" \
            --gtest_output="xml:backend_registry_startup_gtest.xml" \
            2>&1 | tee backend_registry_startup_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-device-capability-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/device_manager_ctest.txt
            build/device_manager_gtest.xml
            build/device_manager_gtest_output.txt
            build/backend_registry_startup_ctest.txt
            build/backend_registry_startup_gtest.xml
            build/backend_registry_startup_gtest_output.txt
          retention-days: 30
