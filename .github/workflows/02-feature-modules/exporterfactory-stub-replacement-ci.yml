name: ExporterFactory Stub Replacement CI

# Validates ExporterFactory Stub Replacement (v1.8.0, Issue #3868).
# Covers ArrowIPCExporter, ParquetExporter, FeatherExporter, JSONCSVExporter,
# and createExporter() dispatch with and without THEMIS_HAS_ARROW.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/analytics_export.h'
      - 'src/analytics/analytics_export.cpp'
      - 'src/analytics/arrow_export.cpp'
      - 'tests/analytics/test_arrow_export.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/exporterfactory-stub-replacement-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/analytics_export.h'
      - 'src/analytics/analytics_export.cpp'
      - 'src/analytics/arrow_export.cpp'
      - 'tests/analytics/test_arrow_export.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/exporterfactory-stub-replacement-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ArrowExportFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-1  ArrowIPCExporter, ParquetExporter, FeatherExporter classes exist
  #   AC-2  StubAnalyticsExporter removed; JSONCSVExporter handles JSON/CSV
  #   AC-3  createExporter(FMT_ARROW_IPC/PARQUET/FEATHER) returns concrete type
  #         when THEMIS_HAS_ARROW is defined
  #   AC-4  createExporter(FMT_ARROW_*) throws std::runtime_error without Arrow
  #   AC-5  createExporter(FMT_ARROW_PARQUET) returns ParquetExporter (non-stub)
  #   AC-6  File header suppresses "6 Stubs" annotation (Stubs: 0)
  # ---------------------------------------------------------------------------
  arrow-export-factory-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ExporterFactory tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Non-Arrow path: Arrow formats must throw std::runtime_error
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            arrow_enabled: false
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
            arrow_enabled: false
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            arrow_enabled: false
          # Arrow-enabled path: concrete exporters must be returned
          - os: ubuntu-24.04
            compiler: gcc-14-arrow
            cc: gcc-14
            cxx: g++-14
            arrow_enabled: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Apache Arrow and Parquet libraries (Arrow path only)
        if: matrix.arrow_enabled
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libarrow-dev libparquet-dev

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_arrow_export_focused

      - name: Run ArrowExportFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ArrowExportFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee arrow_export_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_arrow_export_focused \
            --gtest_output="xml:arrow_export_gtest.xml" \
            2>&1 | tee arrow_export_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrow-export-factory-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/arrow_export_ctest.txt
            build/arrow_export_gtest.xml
            build/arrow_export_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📦 ExporterFactory Stub Replacement – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Arrow enabled** | \`${{ matrix.arrow_enabled }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ExporterFactory: ArrowIPCExporter, ParquetExporter, FeatherExporter, JSONCSVExporter; createExporter() dispatch; throws without Arrow." >> "$GITHUB_STEP_SUMMARY"
