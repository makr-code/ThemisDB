name: LLM Deployment Plugin RocksDB CI

# CI job that validates the LLMDeploymentPlugin RocksDB model storage integration.
# Verifies that model metadata is persisted to RocksDB after deployment, that the
# authenticated user context is propagated from the JWT into audit log entries,
# and that local source existence checks work correctly.
#
# No GPU hardware is required — all tests run on CPU only.
#
# See: src/llm/FUTURE_ENHANCEMENTS.md — LLMDeploymentPlugin: RocksDB Model Storage

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/llm/llm_deployment_plugin.cpp'
      - 'src/llm/llm_model_storage.cpp'
      - 'include/llm/llm_deployment_plugin.h'
      - 'include/llm/llm_model_storage.h'
      - 'tests/llm/test_llm_deployment_plugin.cpp'
      - '.github/workflows/02-feature-modules/llm/llm-deployment-rocksdb-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/llm/llm_deployment_plugin.cpp'
      - 'src/llm/llm_model_storage.cpp'
      - 'include/llm/llm_deployment_plugin.h'
      - 'include/llm/llm_model_storage.h'
      - 'tests/llm/test_llm_deployment_plugin.cpp'
      - '.github/workflows/02-feature-modules/llm/llm-deployment-rocksdb-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  llm-deployment-rocksdb:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_llm_changes == 'true'
    name: LLM Deployment Plugin (RocksDB Storage)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libgtest-dev \
            pkg-config

      - name: Install RocksDB
        run: sudo apt-get update && sudo apt-get install -y librocksdb-dev

      - name: Configure CMake (CPU only, LLM enabled)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_ENABLE_LLM=ON \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_TEST_FILTER=test_llm_deployment_plugin

      - name: Build LLM deployment plugin tests
        run: cmake --build build --target themisdb_tests -j$(nproc)

      - name: Run LLM deployment plugin tests
        run: |
          cd build
          ctest --output-on-failure -R "LlmDeploymentPlugin"

      - name: Write job summary
        if: always()
        run: |
          echo "## 🤖 LLM Deployment Plugin RocksDB CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Build type** | Release (CPU only, CUDA=OFF) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test filter** | \`LlmDeploymentPlugin*\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates RocksDB persistence, JWT user context propagation, and local source existence checks." >> "$GITHUB_STEP_SUMMARY"
