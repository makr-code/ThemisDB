name: Voice Module CI

# Validates the Voice Module production implementation (v1.1.0).
# Covers all production-readiness phases:
#   AC-1   AudioPreprocessingPipeline — noise reduction, VAD, format conversion
#   AC-2   WakeWordDetector — energy-based VAD gating, acoustic feature scoring
#   AC-3   VoiceIntentDetector — intent classification from transcribed text
#   AC-4   VoiceSessionManager — session lifecycle, conversation history
#   AC-5   VoiceSecurityManager — PII redaction, audio encryption
#   AC-6   VoiceErrorHandler — error classification, retry policies
#   AC-7   VoiceTTSCustomizer — prosody control, SSML parsing, MOS estimation
#   AC-8   VoiceMeetingSupport — meeting protocol generation, action-item extraction
#   AC-9   VoiceAudioStorage — session audio storage and retrieval
#   AC-10  VoiceAccessibility — closed captions, accessibility metadata
#   AC-11  VoiceModelCache — model caching with LRU eviction
#   AC-12  VoiceBatchProcessor — batch audio processing pipeline
#   AC-13  VoiceBiometricAuthenticator — speaker enrollment, verification, identification, liveness
#   AC-14  EmotionAnalyzer — emotion/sentiment detection from voice tone
#   AC-15  VoiceStreamingSession — WebSocket real-time audio streaming (frame limit, session limit)
#   AC-16  VoiceTelephony — SIP/WebRTC bridge, IVR engine, TelephonyBridge coordinator

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/voice/**'
      - 'src/voice/**'
      - 'include/server/voice_api_handler.h'
      - 'src/server/voice_api_handler.cpp'
      - 'tests/test_voice_production.cpp'
      - 'tests/test_voice_coverage.cpp'
      - 'tests/test_voice_browser_streaming.cpp'
      - 'tests/test_voice_telephony.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/llm/voice-module-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/voice/**'
      - 'src/voice/**'
      - 'include/server/voice_api_handler.h'
      - 'src/server/voice_api_handler.cpp'
      - 'tests/test_voice_production.cpp'
      - 'tests/test_voice_coverage.cpp'
      - 'tests/test_voice_browser_streaming.cpp'
      - 'tests/test_voice_telephony.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/llm/voice-module-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Voice Production focused tests — AC-1 through AC-14.
  # Covers AudioPreprocessing, WakeWordDetector, VoiceIntentDetector,
  # VoiceSessionManager, VoiceSecurityManager, VoiceErrorHandler,
  # VoiceTTSCustomizer, VoiceMeetingSupport, VoiceAudioStorage,
  # VoiceAccessibility, VoiceModelCache, VoiceBatchProcessor,
  # VoiceBiometricAuthenticator, and EmotionAnalyzer.
  # ---------------------------------------------------------------------------
  voice-production-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Voice production tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_voice_production_focused

      - name: Run VoiceProductionFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R VoiceProductionFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee voice_production_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_voice_production_focused \
            --gtest_output="xml:voice_production_gtest.xml" \
            2>&1 | tee voice_production_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-production-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/voice_production_ctest.txt
            build/voice_production_gtest.xml
            build/voice_production_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🎤 Voice Module – Production Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates Voice production readiness (AC-1..14): AudioPreprocessing, WakeWordDetector," >> "$GITHUB_STEP_SUMMARY"
          echo "VoiceIntentDetector, VoiceSessionManager, VoiceSecurityManager, VoiceErrorHandler," >> "$GITHUB_STEP_SUMMARY"
          echo "VoiceTTSCustomizer, VoiceMeetingSupport, VoiceAudioStorage, VoiceAccessibility," >> "$GITHUB_STEP_SUMMARY"
          echo "VoiceModelCache, VoiceBatchProcessor, VoiceBiometricAuthenticator, EmotionAnalyzer." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Voice Coverage focused tests — supplemental coverage for session, audio
  # storage, meeting support, error handling, security, TTS, intent detection,
  # and accessibility components.
  # ---------------------------------------------------------------------------
