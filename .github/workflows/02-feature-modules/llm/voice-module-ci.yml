      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-coverage-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/voice_coverage_ctest.txt
            build/voice_coverage_gtest.xml
            build/voice_coverage_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🎤 Voice Module – Coverage Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
