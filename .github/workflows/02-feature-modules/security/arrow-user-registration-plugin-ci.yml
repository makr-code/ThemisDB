name: Arrow User Registration Plugin CI

# Validates ArrowUserRegistrationPlugin Arrow integration (v1.8.0, Issue #99).
# Covers bulkSyncFromArrow, authenticateFromArrow, and all four TODO stubs.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/security/arrow_user_registration_plugin.h'
      - 'src/security/arrow_user_registration_plugin.cpp'
      - 'tests/security/test_arrow_user_registration_plugin.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/arrow-user-registration-plugin-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/security/arrow_user_registration_plugin.h'
      - 'src/security/arrow_user_registration_plugin.cpp'
      - 'tests/security/test_arrow_user_registration_plugin.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/arrow-user-registration-plugin-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ArrowUserRegistrationPlugin focused test suite.
  # Acceptance criteria covered:
  #   AC-1  registerUser stores user in Arrow-backed in-memory store
  #   AC-2  authenticateUser delegates to authenticateFromArrow
  #   AC-3  syncUsers returns all bulk-synced users
  #   AC-4  updateUser returns stored user data, errors on unknown user
  #   AC-5  bulkSyncFromArrow upserts 1000 users from RecordBatch
  #   AC-6  authenticateFromArrow verifies credentials against stored hash
  #   AC-7  Missing required columns return descriptive errors
  #   AC-8  Roles column (comma-separated) parsed correctly
  # ---------------------------------------------------------------------------
  arrow-user-registration-plugin-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Arrow User Registration Plugin (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Non-Arrow path: THEMIS_ENABLE_ARROW not set; tests skip gracefully
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            arrow_enabled: false
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            arrow_enabled: false
          # Arrow-enabled path: tests the Apache Arrow code path
          - os: ubuntu-24.04
            compiler: gcc-14-arrow
            cc: gcc-14
            cxx: g++-14
            arrow_enabled: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Apache Arrow libraries (Arrow path only)
        if: matrix.arrow_enabled
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libarrow-dev

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_arrow_user_registration_plugin_focused

      - name: Run ArrowUserRegistrationPluginFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ArrowUserRegistrationPluginFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee arrow_user_reg_plugin_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_arrow_user_registration_plugin_focused \
            --gtest_output="xml:arrow_user_reg_plugin_gtest.xml" \
            2>&1 | tee arrow_user_reg_plugin_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrow-user-reg-plugin-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/arrow_user_reg_plugin_ctest.txt
            build/arrow_user_reg_plugin_gtest.xml
            build/arrow_user_reg_plugin_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔑 Arrow User Registration Plugin Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Arrow enabled** | \`${{ matrix.arrow_enabled }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ArrowUserRegistrationPlugin: bulkSyncFromArrow, authenticateFromArrow, 1000-user batch sync, Arrow-backed in-memory store." >> "$GITHUB_STEP_SUMMARY"
