name: User Storage Encrypted CI

# Validates user_storage_encrypted plugin:
#   - Stdin key delivery (executeCommandWithStdin / deliverKeyViaStdin / explicit_bzero)
#   - Argon2id KDF (Argon2idKeyDerivationService, m=65536/t=3/p=4)
#   - IRotationStore / FileRotationStore persistence for KeyRotationScheduler
#   - Stale mount reconciliation (reconcileStaleMounts, v0.2.0)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/user_storage_encrypted/**'
      - 'include/user_storage_encrypted/**'
      - 'plugins/user_storage_encrypted/**'
      - '.github/workflows/02-feature-modules/security/user-storage-encrypted-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/user_storage_encrypted/**'
      - 'src/user_storage_encrypted/**'
      - 'plugins/user_storage_encrypted/**'
      - '.github/workflows/02-feature-modules/security/user-storage-encrypted-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  user-storage-encrypted-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: User Storage Encrypted tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          extra-packages: >-
            nlohmann-json3-dev
            libgtest-dev
            libargon2-dev
            libargon2-1

      - name: Configure (User Storage Encrypted test targets)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_PLUGIN_USER_STORAGE_ENCRYPTED=ON \
            -DBUILD_TESTING=ON \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build test binaries
        run: |
          cmake --build build --target test_user_storage_features -- -j$(nproc)

      - name: Run User Storage Encrypted unit tests
        run: |
          cd build
          ctest --tests-regex "UserStorageFeatures" \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee user_storage_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-storage-encrypted-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/user_storage_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔐 User Storage Encrypted – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Features tested: stdin key delivery (no /tmp file), Argon2id KDF (determinism + perf), key rotation persistence (IRotationStore), stale mount reconciliation." >> "$GITHUB_STEP_SUMMARY"
