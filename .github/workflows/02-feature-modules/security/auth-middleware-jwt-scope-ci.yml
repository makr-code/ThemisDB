name: Auth Middleware JWT Scope Enforcement CI

# Triggered on every push / PR that touches the AuthMiddleware sources
# (header, implementation, tests) or this workflow.  Targets v1.8.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/auth/jwt_validator.h'
      - 'src/auth/jwt_validator.cpp'
      - 'include/server/auth_middleware.h'
      - 'src/server/auth_middleware.cpp'
      - 'tests/test_auth_middleware.cpp'
      - 'config/security/rbac_roles.yaml'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/security/auth-middleware-jwt-scope-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/auth/jwt_validator.h'
      - 'src/auth/jwt_validator.cpp'
      - 'include/server/auth_middleware.h'
      - 'src/server/auth_middleware.cpp'
      - 'tests/test_auth_middleware.cpp'
      - 'config/security/rbac_roles.yaml'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/security/auth-middleware-jwt-scope-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the AuthMiddlewareFocusedTests suite.
  #
  # Tests cover all acceptance criteria for v1.8.0 JWT scope enforcement:
  #   AC-1  JWTClaims.scopes field exists and defaults to empty
  #   AC-2  "scope" claim (space-separated string) is parsed into claims.scopes
  #   AC-3  "scp" claim (JSON array) is parsed into claims.scopes
  #   AC-4  JWT without the required scope is denied (cache:read pass, cache:write fail)
  #   AC-5  JWT with no scope claim and no role mapping is denied when scope required
  #   AC-6  Empty required_scope always passes (no enforcement when blank)
  #   AC-7  Role-to-scope mapping grants scope when JWT carries a matching role
  #   AC-8  Role-to-scope mapping denies when role does not include required scope
  #   AC-9  Direct scope claim takes precedence over role-to-scope fallback
  #   AC-10 setRoleScopeMapping() overrides any file-loaded mapping
  #   AC-11 Static bearer tokens still work alongside JWT scope enforcement
  #   AC-12 API key authentication scopes still enforced independently
  # ---------------------------------------------------------------------------
  auth-middleware-scope-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Auth Middleware Scope (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            ${{ matrix.cxx }} ${{ matrix.cc }} \
            libgtest-dev \
            libssl-dev \
            librocksdb-dev \
            libboost-all-dev \
            libfmt-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libzstd-dev \
            liblz4-dev \
            libyaml-cpp-dev \
            libkrb5-dev \
            pkg-config

      - name: Configure CMake (COMMUNITY edition)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_EDITION=COMMUNITY \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_MIMALLOC=OFF \
            -DTHEMIS_ENABLE_LLM=OFF

      - name: Build test_auth_middleware
        run: |
          cmake --build build \
            --target test_auth_middleware \
            --parallel 4

      - name: Run AuthMiddlewareFocusedTests (CTest)
        run: |
          set -o pipefail
          cd build
          ctest -R AuthMiddlewareFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee auth_middleware_ctest_results.txt

      - name: Run all Auth Middleware tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_auth_middleware \
            --gtest_output="xml:auth_middleware_test_results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-middleware-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/auth_middleware_ctest_results.txt
            build/auth_middleware_test_results.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Documentation / interface gate: verify API surface in headers
  # ---------------------------------------------------------------------------
  auth-middleware-docs-gate:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Auth Middleware — Documentation Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify JWTClaims scopes field exists
        run: |
          grep -q "scopes" include/auth/jwt_validator.h || \
            (echo "ERROR: JWTClaims.scopes field missing from jwt_validator.h" && exit 1)

      - name: Verify setRoleScopeMapping public API exists
        run: |
          grep -q "setRoleScopeMapping" include/server/auth_middleware.h || \
            (echo "ERROR: setRoleScopeMapping() missing from auth_middleware.h" && exit 1)

      - name: Verify rbac_roles.yaml exists
        run: |
          test -f config/security/rbac_roles.yaml || \
            (echo "ERROR: config/security/rbac_roles.yaml not found" && exit 1)

      - name: Verify scope/scp claim parsing in jwt_validator.cpp
        run: |
          grep -q '"scope"' src/auth/jwt_validator.cpp && \
          grep -q '"scp"' src/auth/jwt_validator.cpp || \
            (echo "ERROR: scope/scp claim parsing missing from jwt_validator.cpp" && exit 1)

      - name: Verify scope enforcement in authorizeViaJWT
        run: |
          grep -q "JWT missing required scope" src/server/auth_middleware.cpp || \
            (echo "ERROR: JWT scope enforcement missing from auth_middleware.cpp" && exit 1)

      - name: Verify scope enforcement in authorizeViaKerberos
        run: |
          grep -q "Kerberos principal missing required scope" src/server/auth_middleware.cpp || \
            (echo "ERROR: Kerberos scope enforcement missing from auth_middleware.cpp" && exit 1)
