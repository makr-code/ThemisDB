name: Plugin Manager & Lifecycle CI

# Validates the core plugin subsystem: PluginManager, PluginRegistry,
# PluginLifecycle, PluginHotPlug, PluginHealthMonitor, PluginMetrics, and
# PluginDependencyResolver (v1.3.0+, Issue #3526).
#
# Covers:
#   PM-1   PluginManager – singleton identity, scanPluginDirectory, autoLoad
#   PM-2   PluginManager – hot-plug enable/disable, negotiateCapabilities
#   PL-1   PluginLifecycle – load/initialize/unload RAII guards
#   PL-2   PluginLifecycle – hot-reload with rollback on bad plugin version
#   PL-3   PluginLifecycle – dependency-ordered loading
#   PR-1   PluginRegistry – registerFactory/create/listPlugins/hasPlugin
#   PR-2   PluginRegistry – unregisterFactory, clearRegistry
#   PR-3   PluginRegistry – concurrent reads under shared_mutex (no data race)
#   HM-1   PluginHealthMonitor – liveness probe, failure threshold, auto-restart
#   HM-2   PluginHealthMonitor – attachMetrics IMetrics integration
#   HP-1   PluginHotPlug – directory watch, TOCTOU-safe reload, event callback
#   HP-2   PluginHotReloadEnhanced – atomic swap, reload listener phases
#   MT-1   PluginMetrics – per-plugin counters, latency recording, getAllStats
#   MT-2   PluginMetricsIntegration – IMetrics sink export, Prometheus labels
#   DR-1   PluginDependencyResolver – topological sort, cycle detection, version compatibility
#   CN-1   PluginCapabilityNegotiation – version-range matching, negotiateCapabilities API

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/plugins/plugin_manager.h'
      - 'include/plugins/plugin_interface.h'
      - 'include/plugins/plugin_registry.h'
      - 'include/plugins/plugin_health_monitor.h'
      - 'include/plugins/plugin_hot_plug_monitor.h'
      - 'include/plugins/plugin_metrics.h'
      - 'include/plugins/plugin_dependency_resolver.h'
      - 'include/plugins/plugin_api.h'
      - 'src/plugins/plugin_manager.cpp'
      - 'src/plugins/plugin_registry.cpp'
      - 'src/plugins/plugin_health_monitor.cpp'
      - 'src/plugins/plugin_hot_plug_monitor.cpp'
      - 'src/plugins/plugin_metrics.cpp'
      - 'src/plugins/plugin_system_edition.cpp'
      - 'tests/test_plugin_manager.cpp'
      - 'tests/test_plugin_lifecycle.cpp'
      - 'tests/test_generic_plugin_registry.cpp'
      - 'tests/test_plugin_health_monitor.cpp'
      - 'tests/test_plugin_hot_plug.cpp'
      - 'tests/test_plugin_hot_reload_enhanced.cpp'
      - 'tests/test_plugin_metrics.cpp'
      - 'tests/test_plugin_metrics_integration.cpp'
      - 'tests/test_plugin_dependency_resolver.cpp'
      - 'tests/test_plugin_dependency_graph.cpp'
      - 'tests/test_plugin_capability_negotiation.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/plugin-manager-lifecycle-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/plugins/plugin_manager.h'
      - 'include/plugins/plugin_interface.h'
      - 'include/plugins/plugin_registry.h'
      - 'include/plugins/plugin_health_monitor.h'
      - 'include/plugins/plugin_hot_plug_monitor.h'
      - 'include/plugins/plugin_metrics.h'
      - 'include/plugins/plugin_dependency_resolver.h'
      - 'include/plugins/plugin_api.h'
      - 'src/plugins/plugin_manager.cpp'
      - 'src/plugins/plugin_registry.cpp'
      - 'src/plugins/plugin_health_monitor.cpp'
      - 'src/plugins/plugin_hot_plug_monitor.cpp'
      - 'src/plugins/plugin_metrics.cpp'
      - 'src/plugins/plugin_system_edition.cpp'
      - 'tests/test_plugin_manager.cpp'
      - 'tests/test_plugin_lifecycle.cpp'
      - 'tests/test_generic_plugin_registry.cpp'
      - 'tests/test_plugin_health_monitor.cpp'
      - 'tests/test_plugin_hot_plug.cpp'
      - 'tests/test_plugin_hot_reload_enhanced.cpp'
      - 'tests/test_plugin_metrics.cpp'
      - 'tests/test_plugin_metrics_integration.cpp'
      - 'tests/test_plugin_dependency_resolver.cpp'
      - 'tests/test_plugin_dependency_graph.cpp'
      - 'tests/test_plugin_capability_negotiation.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/plugin-manager-lifecycle-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the core plugin lifecycle test suites.
  # ---------------------------------------------------------------------------
  plugin-lifecycle-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Plugin Lifecycle Tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── PluginManager focused tests ────────────────────────────────────────
      - name: Run PluginManagerFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginManagerFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_manager_ctest.txt

      - name: Run PluginManager tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_manager_focused \
            --gtest_output="xml:plugin_manager_gtest.xml" \
            2>&1 | tee plugin_manager_gtest_output.txt

      # ── PluginLifecycle focused tests ──────────────────────────────────────
      - name: Run PluginLifecycleFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginLifecycleFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_lifecycle_ctest.txt

      - name: Run PluginLifecycle tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_lifecycle_focused \
            --gtest_output="xml:plugin_lifecycle_gtest.xml" \
            2>&1 | tee plugin_lifecycle_gtest_output.txt

      # ── GenericPluginRegistry focused tests ───────────────────────────────
      - name: Run GenericPluginRegistryFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R GenericPluginRegistryFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_registry_ctest.txt

      - name: Run GenericPluginRegistry tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_generic_plugin_registry_focused \
            --gtest_output="xml:plugin_registry_gtest.xml" \
            2>&1 | tee plugin_registry_gtest_output.txt

      # ── PluginHealthMonitor focused tests ─────────────────────────────────
      - name: Run PluginHealthMonitorFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginHealthMonitorFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_health_monitor_ctest.txt

      - name: Run PluginHealthMonitor tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_health_monitor_focused \
            --gtest_output="xml:plugin_health_monitor_gtest.xml" \
            2>&1 | tee plugin_health_monitor_gtest_output.txt

      # ── PluginHotPlug focused tests ────────────────────────────────────────
      - name: Run PluginHotPlugFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginHotPlugFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_hot_plug_ctest.txt

      - name: Run PluginHotPlug tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_hot_plug_focused \
            --gtest_output="xml:plugin_hot_plug_gtest.xml" \
            2>&1 | tee plugin_hot_plug_gtest_output.txt

      # ── PluginHotReloadEnhanced focused tests ─────────────────────────────
      - name: Run PluginHotReloadEnhancedFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginHotReloadEnhancedFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_hot_reload_enhanced_ctest.txt

      - name: Run PluginHotReloadEnhanced tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_hot_reload_enhanced_focused \
            --gtest_output="xml:plugin_hot_reload_enhanced_gtest.xml" \
            2>&1 | tee plugin_hot_reload_enhanced_gtest_output.txt

      # ── PluginMetrics focused tests ────────────────────────────────────────
      - name: Run PluginMetricsFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginMetricsFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_metrics_ctest.txt

      - name: Run PluginMetrics tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_metrics_focused \
            --gtest_output="xml:plugin_metrics_gtest.xml" \
            2>&1 | tee plugin_metrics_gtest_output.txt

      # ── PluginMetricsIntegration focused tests ────────────────────────────
      - name: Run PluginMetricsIntegrationFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginMetricsIntegrationFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_metrics_integration_ctest.txt

      - name: Run PluginMetricsIntegration tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_metrics_integration_focused \
            --gtest_output="xml:plugin_metrics_integration_gtest.xml" \
            2>&1 | tee plugin_metrics_integration_gtest_output.txt

      # ── PluginDependencyResolver focused tests ────────────────────────────
      - name: Run PluginDependencyResolverFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginDependencyResolverFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_dependency_resolver_ctest.txt

      - name: Run PluginDependencyResolver tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_dependency_resolver_focused \
            --gtest_output="xml:plugin_dependency_resolver_gtest.xml" \
            2>&1 | tee plugin_dependency_resolver_gtest_output.txt

      # ── PluginDependencyGraph focused tests ───────────────────────────────
      - name: Run PluginDependencyGraphFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginDependencyGraphFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_dependency_graph_ctest.txt

      - name: Run PluginDependencyGraph tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_dependency_graph_focused \
            --gtest_output="xml:plugin_dependency_graph_gtest.xml" \
            2>&1 | tee plugin_dependency_graph_gtest_output.txt

      # ── PluginCapabilityNegotiation tests ─────────────────────────────────
      - name: Run PluginCapabilityNegotiationTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginCapabilityNegotiationTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee plugin_capability_negotiation_ctest.txt

      - name: Run PluginCapabilityNegotiation tests via standalone binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_capability_negotiation \
            --gtest_output="xml:plugin_capability_negotiation_gtest.xml" \
            2>&1 | tee plugin_capability_negotiation_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-lifecycle-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/plugin_manager_ctest.txt
            build/plugin_manager_gtest.xml
            build/plugin_manager_gtest_output.txt
            build/plugin_lifecycle_ctest.txt
            build/plugin_lifecycle_gtest.xml
            build/plugin_lifecycle_gtest_output.txt
            build/plugin_registry_ctest.txt
            build/plugin_registry_gtest.xml
            build/plugin_registry_gtest_output.txt
            build/plugin_health_monitor_ctest.txt
            build/plugin_health_monitor_gtest.xml
            build/plugin_health_monitor_gtest_output.txt
            build/plugin_hot_plug_ctest.txt
            build/plugin_hot_plug_gtest.xml
            build/plugin_hot_plug_gtest_output.txt
            build/plugin_hot_reload_enhanced_ctest.txt
            build/plugin_hot_reload_enhanced_gtest.xml
            build/plugin_hot_reload_enhanced_gtest_output.txt
            build/plugin_metrics_ctest.txt
            build/plugin_metrics_gtest.xml
            build/plugin_metrics_gtest_output.txt
            build/plugin_metrics_integration_ctest.txt
            build/plugin_metrics_integration_gtest.xml
            build/plugin_metrics_integration_gtest_output.txt
            build/plugin_dependency_resolver_ctest.txt
            build/plugin_dependency_resolver_gtest.xml
            build/plugin_dependency_resolver_gtest_output.txt
            build/plugin_dependency_graph_ctest.txt
            build/plugin_dependency_graph_gtest.xml
            build/plugin_dependency_graph_gtest_output.txt
            build/plugin_capability_negotiation_ctest.txt
            build/plugin_capability_negotiation_gtest.xml
            build/plugin_capability_negotiation_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔌 Plugin Manager & Lifecycle – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Plugin Manager: singleton, scanPluginDirectory, autoLoad, hot-plug enable/disable, negotiateCapabilities." >> "$GITHUB_STEP_SUMMARY"
          echo "Plugin Lifecycle: load/initialize/unload RAII, hot-reload with rollback, dependency-ordered loading." >> "$GITHUB_STEP_SUMMARY"
          echo "Generic Plugin Registry: registerFactory, create, listPlugins, unregisterFactory, shared_mutex concurrent reads." >> "$GITHUB_STEP_SUMMARY"
          echo "Health Monitor: liveness probe, failure threshold, auto-restart, attachMetrics." >> "$GITHUB_STEP_SUMMARY"
          echo "Hot Plug: directory watch, TOCTOU-safe reload, reload listener phases." >> "$GITHUB_STEP_SUMMARY"
          echo "Metrics: atomic counters, P99 latency histogram, IMetrics sink, Prometheus labels." >> "$GITHUB_STEP_SUMMARY"
          echo "Dependency Resolver: topological sort, cycle detection, version compatibility." >> "$GITHUB_STEP_SUMMARY"
          echo "Capability Negotiation: version-range matching, negotiateCapabilities API." >> "$GITHUB_STEP_SUMMARY"
