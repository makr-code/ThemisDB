name: Bidirectional Replication CI

# Triggered on every push / PR that touches BidirectionalReplicationManager
# sources or its test file.  Targets v1.7.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/replication/replication_manager.h'
      - 'src/replication/replication_manager.cpp'
      - 'tests/test_replication_ha.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/replication/bidirectional-replication-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/replication/replication_manager.h'
      - 'src/replication/replication_manager.cpp'
      - 'tests/test_replication_ha.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/replication/bidirectional-replication-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the BidirectionalReplicationManager focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  Symmetric replication (both nodes are primary)
  #   AC-2  Conflict detection using timestamps and sequence numbers
  #   AC-3  Configurable conflict resolution per table/collection
  #   AC-4  Origin tracking to prevent replication loops
  #   AC-5  DDL replication with conflict detection
  #   AC-6  Active-active high-availability semantics
  #   AC-7  Manual conflict resolution API
  #   AC-8  SyncStatus reflects running, sequence numbers, and lag
  # ---------------------------------------------------------------------------
  bidirectional-replication-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Bidirectional Replication (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev liblz4-dev libzstd-dev libsnappy-dev libprotobuf-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run ReplicationHAFocusedTests (BidirectionalReplicationTest*)
        run: |
          set -o pipefail
          cd build
          ctest -R ReplicationHAFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee bidirectional_replication_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run BidirectionalReplicationTest via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_replication_ha_focused \
            --gtest_filter="BidirectionalReplicationTest*" \
            --gtest_output="xml:bidirectional_replication_gtest.xml" \
            2>&1 | tee bidirectional_replication_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidirectional-replication-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/bidirectional_replication_results.txt
            build/bidirectional_replication_gtest.xml
            build/bidirectional_replication_gtest_output.txt
          retention-days: 30
