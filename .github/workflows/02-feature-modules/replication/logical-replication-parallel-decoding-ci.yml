name: Logical Replication – Parallel Decoding CI

# Triggered on every push / PR that touches LogicalReplicationManager
# sources or its test file.  Targets v1.7.0 logical replication with
# parallel-decoding support (parallel_decoding config flag).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/replication/logical_replication.h'
      - 'src/replication/logical_replication.cpp'
      - 'tests/test_logical_replication.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/replication/logical-replication-parallel-decoding-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/replication/logical_replication.h'
      - 'src/replication/logical_replication.cpp'
      - 'tests/test_logical_replication.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules/replication/logical-replication-parallel-decoding-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the LogicalReplicationManager focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  Schema-aware replication (DDL changes replicated to slots)
  #   AC-2  Selective collection replication with include/exclude filters
  #   AC-3  Cross-version replication metadata (source_version → target_version)
  #   AC-4  Data transformation during replication (per-change transform hook)
  #   AC-5  Conflict-free initial sync for new replicas (snapshot + dedup)
  #   AC-6  Parallel decoding dispatches to all slots concurrently
  #   AC-7  Parallel decoding stats (changes_enqueued) count correctly
  #   AC-8  Single-slot manager falls back to sequential path automatically
  #   AC-9  parallel_decoding=false always uses sequential path
  # ---------------------------------------------------------------------------
  logical-replication-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Logical Replication (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev liblz4-dev libzstd-dev libsnappy-dev libprotobuf-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run LogicalReplicationTests
        run: |
          set -o pipefail
          cd build
          ctest -R LogicalReplicationTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee logical_replication_results.txt

      # ── Broader validation via binary directly ─────────────────────────────
      - name: Run all LogicalReplicationManagerTest cases
        run: |
          set -o pipefail
          cd build
          ./tests/test_logical_replication \
            --gtest_filter="LogicalReplicationManagerTest*" \
            --gtest_output="xml:logical_replication_gtest.xml" \
            2>&1 | tee logical_replication_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logical-replication-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/logical_replication_results.txt
            build/logical_replication_gtest.xml
            build/logical_replication_gtest_output.txt
          retention-days: 30
