name: Compressed Replication CI

# Triggered on every push / PR that touches the CompressedReplicationStream
# sources or its test file. Targets v1.6.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/replication/replication_manager.h'
      - 'src/replication/replication_manager.cpp'
      - 'tests/test_replication_ha.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/compressed-replication-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/replication/replication_manager.h'
      - 'src/replication/replication_manager.cpp'
      - 'tests/test_replication_ha.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/compressed-replication-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CompressedReplicationStream focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  Multiple compression algorithms (LZ4, Zstd, Snappy)
  #   AC-2  Adaptive compression (AUTO mode skips tiny batches, uses ZSTD for large)
  #   AC-3  Configurable compression level (1-9)
  #   AC-4  Compression statistics and monitoring (CompressionStats)
  #   AC-5  ZSTD round-trip correctness
  #   AC-6  ReplicationStream integration (config-driven algorithm selection)
  # ---------------------------------------------------------------------------
  compressed-replication-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Compressed Replication (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev liblz4-dev libzstd-dev libsnappy-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run ReplicationHAFocusedTests (CompressedStream* + ReplicationStreamCompression*)
        run: |
          set -o pipefail
          cd build
          ctest -R ReplicationHAFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee compressed_replication_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run CompressedStreamTest and ReplicationStreamCompressionTest via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="CompressedStreamTest*:ReplicationStreamCompressionTest*" \
            --gtest_output="xml:compressed_replication_gtest.xml" \
            2>&1 | tee compressed_replication_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compressed-replication-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/compressed_replication_results.txt
            build/compressed_replication_gtest.xml
            build/compressed_replication_gtest_output.txt
          retention-days: 30
