name: Dependency Resolution Engine CI

# Triggered on every push / PR that touches the dependency resolver sources
# or its test file. Targets v1.6.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/updates/dependency_resolver.h'
      - 'src/updates/dependency_resolver.cpp'
      - 'tests/test_dependency_resolution_engine.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/dependency-resolution-engine-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/updates/dependency_resolver.h'
      - 'src/updates/dependency_resolver.cpp'
      - 'tests/test_dependency_resolution_engine.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/dependency-resolution-engine-ci.yml'

concurrency:
  group: dependency-resolution-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  dependency-resolution-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Dependency Resolution Engine (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run DependencyResolutionEngineFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R DependencyResolutionEngineFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee dependency_resolution_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run DependencyResolutionEngine tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="DependencyResolutionEngineTest*" \
            --gtest_output="xml:dependency_resolution_gtest.xml" \
            2>&1 | tee dependency_resolution_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-resolution-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/dependency_resolution_results.txt
            build/dependency_resolution_gtest.xml
            build/dependency_resolution_gtest_output.txt
          retention-days: 30
