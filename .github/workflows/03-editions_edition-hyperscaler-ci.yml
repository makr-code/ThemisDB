name: Edition · HYPERSCALER · CI

on:
  push:
    # Hyperscaler builds run on the hyperscaler release lane and develop.
    # They do NOT run on main (Community lane) or enterprise lane.
    branches:
      - hyperscaler
      - develop
    paths:
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - '.github/workflows/03-editions_edition-hyperscaler-ci.yml'
      - '.github/workflows/03-editions_edition-build-ci.yml'
      - '.github/actions/configure-themis/**'
      - '.github/actions/setup-cpp-build/**'
  # pull_request trigger intentionally removed:
  # Full ThemisDB builds are too heavy for PR feedback loops.
  # PRs run pr-quick-checks.yml (lint + static analysis + audit) instead.
  # See: .github/workflows/09-pr-gates_pr-quick-checks.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/03-editions_edition-build-ci.yml
    with:
      edition: HYPERSCALER
      build-type: Debug
