name: Content Abuse Detection CI

# Triggered on every push / PR that touches the abuse-detection sources,
# content_security, or this workflow itself.
# Targets v1.8.0 (roadmap:61:content:v1.8.0:abuse-detection-stub-replacement).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/content/abuse_detector.h'
      - 'src/content/abuse_detector.cpp'
      - 'include/content/content_security.h'
      - 'src/content/content_security.cpp'
      - 'config/security/abuse_patterns.yaml'
      - 'tests/test_content_security.cpp'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/content-abuse-detection-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/content/abuse_detector.h'
      - 'src/content/abuse_detector.cpp'
      - 'include/content/content_security.h'
      - 'src/content/content_security.cpp'
      - 'config/security/abuse_patterns.yaml'
      - 'tests/test_content_security.cpp'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/content-abuse-detection-ci.yml'
  workflow_dispatch:

concurrency:
  group: content-abuse-detection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ContentSecurityFocusedTests suite (abuse detection ACs).
  # Tests cover all acceptance criteria:
  #   AC-1  IAbuseDetector interface with detect() → AbuseDetectionResult
  #   AC-2  PhotoDNAAbuseDetector: blocklist match → BLOCK/FLAG; non-image → ALLOW
  #   AC-3  TextAbuseDetector: YAML pattern loading; BLOCK / FLAG actions
  #   AC-4  ContentSecurity::checkAbuse wired to both detectors
  #   AC-5  BLOCK outcome (block_on_abuse=true) produces a ContentError
  #   AC-6  FLAG outcome does not produce a ContentError
  #   AC-7  Audit logger called on detection (null-safe guard verified)
  # ---------------------------------------------------------------------------
  content-abuse-detection-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Content Abuse Detection (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev
            libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_content_security_focused

      - name: Run ContentSecurityFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ContentSecurityFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee content_abuse_detection_results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-abuse-detection-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/content_abuse_detection_results.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🛡️ Content Abuse Detection – Unit Tests (v1.8.0)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1: IAbuseDetector interface | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2: PhotoDNAAbuseDetector (BLOCK/FLAG/image-only) | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3: TextAbuseDetector (YAML patterns, BLOCK/FLAG) | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4: ContentSecurity wired to both detectors | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5: BLOCK produces ContentError | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6: FLAG does not produce ContentError | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7: Audit logger null-safe on detection | ✅ |" >> "$GITHUB_STEP_SUMMARY"
