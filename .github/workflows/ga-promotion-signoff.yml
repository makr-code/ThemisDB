name: "Governance: GA Promotion Sign-Off"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'docs/governance/ga_signoff_requests/**'
      - 'docs/governance/templates/GA_PROMOTION_SIGN_OFF_REQUEST.example.yaml'
      - 'docs/governance/GA_PROMOTION_SIGN_OFF.md'
      - '.github/ga-signoff-authorized-maintainers.json'
      - 'scripts/ga_signoff.py'
      - 'tests/test_ga_signoff.py'
      - '.github/workflows/ga-promotion-signoff.yml'
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      payload_path:
        description: 'Repo-relative path to the GA sign-off request payload (JSON or YAML).'
        type: string
        required: true
      ref:
        description: 'Branch or ref to validate/sign (defaults to current ref).'
        type: string
        required: false
      signed_at:
        description: 'Optional ISO 8601 signer timestamp override for manual runs.'
        type: string
        required: false
      dry_run:
        description: 'Validate and generate the sign-off locally; do not publish the final artifact.'
        type: boolean
        required: false
        default: true

concurrency:
  group: ga-promotion-signoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  request-validation:
    name: "Governance: GA Sign-Off Request Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'

      - name: Install YAML support
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Collect changed GA sign-off request payloads
        id: collect-payloads
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
            | grep -E '^docs/governance/ga_signoff_requests/.*\.(json|ya?ml)$' > /tmp/ga-signoff-files.txt || true
          if [ ! -s /tmp/ga-signoff-files.txt ]; then
            echo "No GA sign-off payload changes detected."
          fi

      - name: Validate request payloads and emit preview manifests
        id: validate-requests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ga-signoff-preview /tmp/ga-signoff-preview-results
          if [ ! -s /tmp/ga-signoff-files.txt ]; then
            exit 0
          fi
          while IFS= read -r payload; do
            [ -z "${payload}" ] && continue
            stem="$(basename "${payload}")"
            python3 scripts/ga_signoff.py \
              --payload "${payload}" \
              --authorized-maintainers .github/ga-signoff-authorized-maintainers.json \
              --output-dir "/tmp/ga-signoff-preview/${stem}" \
              --result-json "/tmp/ga-signoff-preview-results/${stem}.json" \
              --allow-unresolved-placeholders \
              --github-repository "${{ github.repository }}" \
              --github-ref "refs/pull/${{ github.event.pull_request.number }}/head" \
              --github-sha "${{ github.event.pull_request.head.sha }}" \
              --github-event-name "${{ github.event_name }}" \
              --github-run-id "${{ github.run_id }}"
          done < /tmp/ga-signoff-files.txt

      - name: Summarize preview validation
        if: always()
        shell: bash
        env:
          COLLECTION_OUTCOME: ${{ steps.collect-payloads.outcome || 'not run' }}
          VALIDATION_OUTCOME: ${{ steps.validate-requests.outcome || 'not run' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          results_dir = Path('/tmp/ga-signoff-preview-results')
          print('## GA Sign-Off Request Validation')
          print()
          print(f"- Payload collection: `{os.environ.get('COLLECTION_OUTCOME', 'not run')}`")
          print(f"- Payload validation: `{os.environ.get('VALIDATION_OUTCOME', 'not run')}`")
          print(f"- Workflow run: https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}")
          print()
          if not results_dir.exists():
              print('- Result: no changed GA sign-off request payloads detected')
              raise SystemExit(0)
          results = sorted(results_dir.glob('*.json'))
          if not results:
              print('- Result: no preview artifacts generated')
              raise SystemExit(0)
          print('| Payload | Preview manifest SHA-256 |')
          print('|---|---|')
          for path in results:
              payload = json.loads(path.read_text(encoding='utf-8'))
              print(f"| `{payload['payload_path']}` | `{payload['manifest_sha256']}` |")
          PY

      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ga-signoff-preview-${{ github.run_number }}
          path: |
            /tmp/ga-signoff-preview
            /tmp/ga-signoff-preview-results
          retention-days: 30
          if-no-files-found: ignore

  finalize-signoff:
    name: "Governance: GA Sign-Off Finalize"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.pull_request.base.sha }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'

      - name: Install YAML support
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Resolve payload list
        id: resolve-payloads
        shell: bash
        env:
          DISPATCH_PAYLOAD_PATH: ${{ inputs.payload_path }}
          DISPATCH_TARGET_REF: ${{ inputs.ref || github.ref }}
          DISPATCH_REF_OVERRIDE: ${{ inputs.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_REVIEW_COMMIT_SHA: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ga-signoff-final /tmp/ga-signoff-final-results
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          files_path = Path('/tmp/ga-signoff-files.txt')
          output_path = Path(os.environ['GITHUB_OUTPUT'])
          repo_root = Path.cwd().resolve()
          payload_pattern = re.compile(
              r'docs/governance/ga_signoff_requests/(?:[^/]+/)*[^/]+\.(?:json|yaml|yml)'
          )

          def git(*args, capture_output=False):
              return subprocess.run(
                  ['git', *args],
                  check=True,
                  capture_output=capture_output,
              )

          def stage_payload(commit, payload):
              path = PurePosixPath(payload)
              if (
                  path.is_absolute()
                  or path.as_posix() != payload
                  or '\\' in payload
                  or not payload_pattern.fullmatch(payload)
                  or any(part in ('', '.', '..') for part in path.parts)
              ):
                  raise ValueError(f'Invalid GA sign-off payload path: {payload!r}')

              tree = git('ls-tree', '-z', commit, '--', payload, capture_output=True).stdout
              records = [record for record in tree.split(b'\0') if record]
              if len(records) != 1:
                  raise ValueError(f'Payload is not a single tracked file at {commit}: {payload}')
              metadata, listed_path = records[0].split(b'\t', 1)
              mode, object_type, object_id = metadata.split()
              if listed_path.decode('utf-8') != payload or object_type != b'blob' or mode not in (b'100644', b'100755'):
                  raise ValueError(f'Payload must be a regular tracked file: {payload}')
              content = git('cat-file', 'blob', object_id.decode('ascii'), capture_output=True).stdout

              destination = repo_root.joinpath(*path.parts)
              parent = repo_root
              for part in path.parts[:-1]:
                  parent = parent / part
                  if parent.is_symlink():
                      raise ValueError(f'Payload directory must not be a symlink: {parent}')
                  parent.mkdir(exist_ok=True)
              if destination.is_symlink():
                  destination.unlink()
              destination.write_bytes(content)

          def write_outputs(has_payloads, target_ref, target_sha, ref_source):
              files_path.write_text(''.join(f'{path}\n' for path in payloads), encoding='utf-8')
              with output_path.open('a', encoding='utf-8') as output:
                  output.write(f'has_payloads={str(has_payloads).lower()}\n')
                  output.write(f'target_ref={target_ref}\n')
                  output.write(f'target_sha={target_sha}\n')
                  output.write(f'target_ref_source={ref_source}\n')

          payloads = []
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              payload = os.environ.get('DISPATCH_PAYLOAD_PATH', '')
              target_ref = os.environ.get('DISPATCH_TARGET_REF', '')
              ref_check = ['git', 'check-ref-format']
              if target_ref.startswith('refs/'):
                  fetch_ref = target_ref
                  ref_check.append(target_ref)
              else:
                  fetch_ref = f'refs/heads/{target_ref}'
                  ref_check.extend(['--branch', target_ref])
              if not payload:
                  raise SystemExit('workflow_dispatch requires a payload path.')
              if not target_ref or subprocess.run(ref_check).returncode != 0:
                  raise SystemExit(f'Invalid target branch/ref: {target_ref!r}')
              git('fetch', '--no-tags', 'origin', fetch_ref)
              target_sha = git(
                  'rev-parse', '--verify', '--end-of-options', 'FETCH_HEAD^{commit}',
                  capture_output=True,
              ).stdout.decode('ascii').strip()
              stage_payload(target_sha, payload)
              payloads.append(payload)
              ref_source = (
                  'workflow_dispatch input'
                  if os.environ.get('DISPATCH_REF_OVERRIDE')
                  else 'workflow ref default'
              )
              write_outputs(True, fetch_ref, target_sha, ref_source)
          else:
              base_sha = os.environ.get('PR_BASE_SHA', '')
              head_sha = os.environ.get('PR_HEAD_SHA', '')
              review_sha = os.environ.get('PR_REVIEW_COMMIT_SHA', '')
              if not re.fullmatch(r'[0-9a-fA-F]{40}', base_sha) or not re.fullmatch(r'[0-9a-fA-F]{40}', head_sha):
                  raise SystemExit('The review event did not provide valid base/head commit SHAs.')
              if review_sha != head_sha:
                  raise SystemExit(
                      'The approval is not for the current PR head; approve the latest commit before sign-off.'
                  )
              git('fetch', '--no-tags', 'origin', head_sha)
              changed = git(
                  'diff', '--name-only', '--diff-filter=ACMR', '-z',
                  f'{base_sha}...{head_sha}', capture_output=True,
              ).stdout
              for raw_path in changed.split(b'\0'):
                  if not raw_path:
                      continue
                  try:
                      payload = raw_path.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  if payload_pattern.fullmatch(payload):
                      stage_payload(head_sha, payload)
                      payloads.append(payload)
              target_ref = os.environ.get('PR_HEAD_REF', '')
              if not payloads:
                  print('No changed GA sign-off request payloads were found in this PR — skipping finalization.')
              write_outputs(bool(payloads), target_ref, head_sha, 'approved PR head')
          PY

      - name: Validate signer and generate final manifests
        id: validate-signoff
        if: steps.resolve-payloads.outputs.has_payloads == 'true'
        shell: bash
        env:
          EVENT_SIGNED_AT: ${{ github.event_name == 'pull_request_review' && github.event.review.submitted_at || inputs.signed_at }}
          GA_SIGNOFF_ACTOR: ${{ github.event_name == 'pull_request_review' && github.event.review.user.login || github.actor }}
          GA_SIGNOFF_REF: ${{ steps.resolve-payloads.outputs.target_ref }}
          GA_SIGNOFF_SHA: ${{ steps.resolve-payloads.outputs.target_sha }}
        run: |
          set -euo pipefail
          while IFS= read -r payload; do
            [ -z "${payload}" ] && continue
            stem="$(basename "${payload}")"
            cmd=(
              python3 scripts/ga_signoff.py
              --payload "${payload}"
              --authorized-maintainers .github/ga-signoff-authorized-maintainers.json
              --output-dir "/tmp/ga-signoff-final/${stem}"
              --result-json "/tmp/ga-signoff-final-results/${stem}.json"
              --github-actor "${GA_SIGNOFF_ACTOR}"
              --github-repository "${{ github.repository }}"
              --github-ref "${GA_SIGNOFF_REF}"
              --github-sha "${GA_SIGNOFF_SHA}"
              --github-event-name "${{ github.event_name }}"
              --github-run-id "${{ github.run_id }}"
            )
            if [ -n "${EVENT_SIGNED_AT}" ]; then
              cmd+=(--signed-at "${EVENT_SIGNED_AT}")
            fi
            "${cmd[@]}"
          done < /tmp/ga-signoff-files.txt

      - name: Build PR comment body
        if: success() && github.event_name == 'pull_request_review' && steps.resolve-payloads.outputs.has_payloads == 'true'
        env:
          GITHUB_ACTOR: ${{ github.event.review.user.login }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          results_dir = Path('/tmp/ga-signoff-final-results')
          lines = [
              '<!-- ga-promotion-signoff -->',
              '## GA Promotion Sign-Off',
              '',
              f"- Signer: `@{os.environ.get('GITHUB_ACTOR', '')}`",
              f"- Workflow run: https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}",
              '',
              '| Payload | Manifest SHA-256 | Signed at |',
              '|---|---|---|',
          ]
          if results_dir.exists():
              for path in sorted(results_dir.glob('*.json')):
                  payload = json.loads(path.read_text(encoding='utf-8'))
                  lines.append(
                      f"| `{payload['payload_path']}` | `{payload['manifest_sha256']}` | `{payload['signed_at']}` |"
                  )
          else:
              lines.append('| n/a | n/a | n/a |')
          Path('/tmp/ga-signoff-pr-comment.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Comment final hash on PR
        if: success() && github.event_name == 'pull_request_review' && steps.resolve-payloads.outputs.has_payloads == 'true'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-number: ${{ github.event.pull_request.number }}
          target-type: pr
          issue-marker: '<!-- ga-promotion-signoff -->'
          issue-body-file: /tmp/ga-signoff-pr-comment.md

      - name: Summarize final sign-off
        if: always()
        shell: bash
        env:
          RESOLVE_OUTCOME: ${{ steps.resolve-payloads.outcome || 'not run' }}
          VALIDATION_OUTCOME: ${{ steps.validate-signoff.outcome || 'not run' }}
          HAS_PAYLOADS: ${{ steps.resolve-payloads.outputs.has_payloads || 'unknown' }}
          TARGET_REF: ${{ steps.resolve-payloads.outputs.target_ref || 'unresolved' }}
          TARGET_REF_SOURCE: ${{ steps.resolve-payloads.outputs.target_ref_source || 'unresolved' }}
          TARGET_SHA: ${{ steps.resolve-payloads.outputs.target_sha || 'unresolved' }}
          MANUAL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          SIGNED_AT_SOURCE: ${{ github.event_name == 'pull_request_review' && 'approved review timestamp' || (inputs.signed_at != '' && 'workflow_dispatch override' || 'current UTC default') }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          results_dir = Path('/tmp/ga-signoff-final-results')
          print('## GA Promotion Sign-Off')
          print()
          print(f"- Event: `{os.environ.get('GITHUB_EVENT_NAME', '')}`")
          print(f"- Payload source ref: `{os.environ.get('TARGET_REF', 'unresolved')}`")
          print(f"- Payload ref source: `{os.environ.get('TARGET_REF_SOURCE', 'unresolved')}`")
          print(f"- Payload source SHA: `{os.environ.get('TARGET_SHA', 'unresolved')}`")
          print(f"- Payload resolution: `{os.environ.get('RESOLVE_OUTCOME', 'not run')}` (payloads: `{os.environ.get('HAS_PAYLOADS', 'unknown')}`)")
          print(f"- Final validation: `{os.environ.get('VALIDATION_OUTCOME', 'not run')}`")
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch':
              print(f"- Manual dry-run: `{os.environ.get('MANUAL_DRY_RUN', 'false')}`")
          else:
              print('- Manual dry-run: not applicable (approved PR review event)')
          print(f"- Signer timestamp source: `{os.environ.get('SIGNED_AT_SOURCE', 'unresolved')}`")
          if os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and os.environ.get('MANUAL_DRY_RUN') == 'true':
              print('- Final artifact: not uploaded (manual dry-run)')
          else:
              print('- Final artifact: uploaded after successful validation when a payload is present')
          print(f"- Workflow run: https://github.com/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}")
          if os.environ.get('VALIDATION_OUTCOME') == 'failure':
              print('- Failure details: inspect the `Validate signer and generate final manifests` step.')
          elif os.environ.get('RESOLVE_OUTCOME') == 'failure':
              print('- Failure details: inspect the `Resolve payload list` step.')
          print()
          if not results_dir.exists():
              print('- Result: no final manifest artifacts generated')
              raise SystemExit(0)
          results = sorted(results_dir.glob('*.json'))
          if not results:
              print('- Result: no final manifest artifacts generated')
              raise SystemExit(0)
          print('| Payload | Manifest SHA-256 | Signed at |')
          print('|---|---|---|')
          for path in results:
              payload = json.loads(path.read_text(encoding='utf-8'))
              print(f"| `{payload['payload_path']}` | `{payload['manifest_sha256']}` | `{payload['signed_at']}` |")
          PY

      - name: Upload final sign-off artifacts
        if: steps.validate-signoff.outcome == 'success' &&
            steps.resolve-payloads.outputs.has_payloads == 'true' &&
            (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        uses: actions/upload-artifact@v5
        with:
          name: ga-signoff-${{ github.run_number }}
          path: |
            /tmp/ga-signoff-final
            /tmp/ga-signoff-final-results
          retention-days: 90
          if-no-files-found: warn
