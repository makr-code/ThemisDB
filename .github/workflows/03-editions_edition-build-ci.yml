name: Edition Build CI (reusable)

# Reusable workflow: builds and validates a single ThemisDB edition on Linux.
# Called by the per-edition wrapper workflows (edition-*-ci.yml).
#
# Can also be triggered manually via the root-level edition-build.yml wrapper
# or directly via GitHub CLI:
#   gh workflow run "03-editions/edition-build-ci.yml" \
#     --repo makr-code/ThemisDB --ref main \
#     --field edition=COMMUNITY --field build-type=Debug

on:
  workflow_call:
    inputs:
      edition:
        description: 'ThemisDB edition to build (MINIMAL | COMMUNITY | ENTERPRISE | HYPERSCALER | MILITARY)'
        required: true
        type: string
      build-type:
        description: 'CMake build type (Debug | Release)'
        required: false
        default: 'Debug'
        type: string

  workflow_dispatch:
    inputs:
      edition:
        description: 'ThemisDB edition to build'
        required: true
        default: 'COMMUNITY'
        type: choice
        options:
          - 'COMMUNITY'
          - 'ENTERPRISE'
          - 'HYPERSCALER'
          - 'MILITARY'
          - 'MINIMAL'
      build-type:
        description: 'CMake build type'
        required: false
        default: 'Debug'
        type: choice
        options:
          - 'Debug'
          - 'Release'

jobs:
  edition-build:
    name: ${{ inputs.edition }} · Linux · ${{ inputs.build-type }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize llama.cpp submodule (required for LLM-enabled editions)
        if: ${{ inputs.edition == 'COMMUNITY' || inputs.edition == 'ENTERPRISE' || inputs.edition == 'HYPERSCALER' }}
        run: git submodule update --init --depth=1 llama.cpp

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:  gcc-12
          cxx: g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev libsimdjson-dev

      - name: Configure and build (${{ inputs.edition }} edition)
        uses: ./.github/actions/configure-themis
        with:
          cc:           gcc-12
          cxx:          g++-12
          build-type:   ${{ inputs.build-type }}
          edition:      ${{ inputs.edition }}
          ci-mode:      'true'
          # MINIMAL edition sets THEMIS_BUILD_TESTS=OFF in CMake, so themis_tests
          # is not a valid build target. Skip it to avoid 'unknown target' errors.
          build-target: ${{ inputs.edition != 'MINIMAL' && 'themis_tests' || '' }}

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats || true

      # ── Core smoke tests ─────────────────────────────────────────────────
      - name: Run build-info tests
        if: ${{ inputs.edition != 'MINIMAL' }}
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildConfiguration*:BuildInfo*:ModuleQuery*:ReproducibilityInfo*:BuildManifest*" \
            --gtest_output="xml:build_info_results.xml" \
            2>&1 | tee build_info_output.txt

      - name: Run module loader tests
        if: ${{ inputs.edition != 'MINIMAL' }}
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ModuleLoader*:ModuleRegistry*:ModuleError*:ModuleVerif*" \
            --gtest_output="xml:module_loader_results.xml" \
            2>&1 | tee module_loader_output.txt

      - name: Run wire protocol V2 tests
        if: ${{ inputs.edition != 'MINIMAL' }}
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="WireV2*:V2Frame*:V2Stream*:V2Connection*:V2Server*" \
            --gtest_output="xml:wire_v2_results.xml" \
            2>&1 | tee wire_v2_output.txt

      - name: Run concerns context tests
        if: ${{ inputs.edition != 'MINIMAL' }}
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ConcernsContext*:FeatureFlags*" \
            --gtest_output="xml:concerns_results.xml" \
            2>&1 | tee concerns_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ inputs.edition }}-${{ inputs.build-type }}-test-results
          retention-days: 14
          path: |
            build/*_results.xml
            build/*_output.txt

      - name: Write job summary
        if: always()
        run: |
          # Edition → LLM/GPU status must stay in sync with the case statement
          # in .github/actions/configure-themis/action.yml (Edition-aware LLM/GPU config).
          case "${{ inputs.edition }}" in
            COMMUNITY|ENTERPRISE|HYPERSCALER)
              LLM_STATUS="ON (CPU fallback)"
              GPU_STATUS="ON (CPU fallback)"
              ;;
            *)
              LLM_STATUS="OFF"
              GPU_STATUS="OFF"
              ;;
          esac
          echo "## ThemisDB ${{ inputs.edition }} Edition Build — ${{ inputs.build-type }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Edition | \`${{ inputs.edition }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build type | \`${{ inputs.build-type }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner OS | ubuntu-22.04 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compiler | gcc-12 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| LLM | ${LLM_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GPU | ${GPU_STATUS} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
