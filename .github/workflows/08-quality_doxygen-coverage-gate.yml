name: Doxygen Coverage Gate

on:
  pull_request:
    branches: [ "develop" ]
    paths:
      - "docs/**"
      - "Doxyfile*"
      - "scripts/verify_docs.py"
      - ".github/workflows/08-quality_doxygen-coverage-gate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCS_COVERAGE_THRESHOLD: "90"

jobs:
  doxygen-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen + Python tooling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install coverxygen
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Prepare Doxygen config for XML export
        run: |
          cp Doxyfile Doxyfile.coverage
          sed -i 's/^GENERATE_XML\s*=.*/GENERATE_XML = YES/' Doxyfile.coverage
          sed -i 's|^XML_OUTPUT\s*=.*|XML_OUTPUT = build/doxygen/xml|' Doxyfile.coverage

      - name: Build Doxygen XML
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile.coverage

      - name: Compute coverage summary
        run: |
          python3 -m coverxygen --xml-dir build/doxygen/xml --src-dir src --format summary > build/doxygen_coverage_summary.txt
          cat build/doxygen_coverage_summary.txt

      - name: Enforce minimum documentation coverage
        run: |
          CFG_THRESHOLD="$(awk -F ':' '/docs_coverage_threshold/ {gsub(/ /, "", $2); print $2; exit}' .github/ci-scope-config.yaml || true)"
          if [ -n "${CFG_THRESHOLD}" ]; then
            THRESHOLD="${CFG_THRESHOLD}"
          else
            THRESHOLD="${DOCS_COVERAGE_THRESHOLD:-90}"
          fi
          echo "Using docs coverage threshold: ${THRESHOLD}%"
          python3 scripts/verify_docs.py --summary-file build/doxygen_coverage_summary.txt --threshold "${THRESHOLD}"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-coverage
          path: |
            build/doxygen_coverage_summary.txt
            build/doxygen/xml
          retention-days: 14
