name: "Gate: PR Core [Plugin Boundary]"

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Enforces private/public plugin boundary compliance.
# Blocks private plugin source leakage to community builds.
# Validates plugin manifest visibility and edition allowlist fields.

on:
  workflow_call: {}
  push:
    branches: [develop]
    paths:
      - 'plugins/**/plugin.toml'
      - 'plugins/**/plugin.json'
      - 'plugins/**/CMakeLists.txt'
      - 'plugins/**/*.cmake'
      - 'plugins/**/*.in'
      - 'plugins/**/*.txt'
      - 'plugins/**/*.c'
      - 'plugins/**/*.cc'
      - 'plugins/**/*.cpp'
      - 'plugins/**/*.cxx'
      - 'plugins/**/*.h'
      - 'plugins/**/*.hh'
      - 'plugins/**/*.hpp'
      - 'plugins/**/*.hxx'
      - 'src/plugins/**/*.c'
      - 'src/plugins/**/*.cc'
      - 'src/plugins/**/*.cpp'
      - 'src/plugins/**/*.cxx'
      - 'src/plugins/**/*.h'
      - 'src/plugins/**/*.hh'
      - 'src/plugins/**/*.hpp'
      - 'src/plugins/**/*.hxx'
      - '.gitmodules'
      - 'cmake/PrivatePlugins.cmake'
      - 'cmake/features/PrivatePluginFeatures.cmake'
  workflow_dispatch:

concurrency:
  group: private-plugin-boundary-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  private-plugin-boundary-check:
    name: "Gate: Private Plugin Boundary Enforcement"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for private plugin leakage to community builds
        id: check-leakage
        run: |
          set -euo pipefail
          
          BASE_REF="${{ github.base_ref || 'develop' }}"
          git fetch origin "${BASE_REF}" --depth=1
          
          CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" || echo "")
          
          PRIVATE_PLUGIN_CHANGED=false
          PRIVATE_PLUGIN_FILES=""
          
          while IFS= read -r file; do
            if [[ "$file" =~ ^plugins/private/ ]]; then
              PRIVATE_PLUGIN_CHANGED=true
              PRIVATE_PLUGIN_FILES="${PRIVATE_PLUGIN_FILES}
            - $file"
            fi
          done <<< "$CHANGED_FILES"
          
          if [ "$PRIVATE_PLUGIN_CHANGED" = "true" ]; then
            echo "::notice::Private plugin files detected in PR:$PRIVATE_PLUGIN_FILES"
            
            TARGET_BRANCH="${{ github.base_ref || 'develop' }}"
            
            if [[ "$TARGET_BRANCH" == "community" ]] || [[ "$TARGET_BRANCH" == "minimal" ]]; then
              ERR="Private plugin changes are not allowed on community/minimal branches"
              echo "::error::$ERR"
              echo "error_summary=$ERR" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          
          echo "✓ Private plugin boundary check passed"

      - name: Validate plugin manifest visibility fields
        id: check-visibility
        run: |
          set -euo pipefail
          
          MANIFEST_FILES=$(find plugins -name "plugin.toml" -o -name "plugin.json" -o -name "plugin.yaml" 2>/dev/null || echo "")
          
          INVALID_MANIFESTS=0
          
          while IFS= read -r manifest_file; do
            [ -z "$manifest_file" ] && continue
            
            if ! grep -q "visibility" "$manifest_file"; then
              echo "::warning::Missing 'visibility' field in $manifest_file"
              ((INVALID_MANIFESTS++)) || true
            fi
            
            if [[ "$manifest_file" =~ ^plugins/private/ ]]; then
              if grep -q 'visibility.*=.*"public"' "$manifest_file"; then
                echo "::error::Private plugin $manifest_file has public visibility!"
                ((INVALID_MANIFESTS++)) || true
              fi
            fi
          done <<< "$MANIFEST_FILES"
          
          if [ $INVALID_MANIFESTS -gt 0 ]; then
            ERR="$INVALID_MANIFESTS manifest file(s) failed visibility validation"
            echo "::error::$ERR"
            echo "error_summary=$ERR" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          echo "✓ Plugin manifest visibility validation passed"

      - name: Validate submodule commit pins (no branch refs for private)
        id: check-submodules
        run: |
          set -euo pipefail
          
          if [ ! -f .gitmodules ]; then
            echo "✓ No .gitmodules file (skipping submodule validation)"
            exit 0
          fi
          
          INVALID_REFS=0
          
          while IFS= read -r key; do
            SUBMOD_NAME="${key#submodule.}"
            SUBMOD_NAME="${SUBMOD_NAME%.path}"
            if [[ "$SUBMOD_NAME" =~ private ]] && git config -f .gitmodules --get "submodule.${SUBMOD_NAME}.branch" >/dev/null; then
              echo "::error::Private submodule $SUBMOD_NAME uses branch ref instead of commit SHA"
              ((INVALID_REFS++)) || true
            fi
          done < <(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$' || true)
          
          if [ $INVALID_REFS -gt 0 ]; then
            ERR="$INVALID_REFS submodule(s) use branch refs instead of commit SHAs"
            echo "::error::$ERR"
            echo "error_summary=$ERR" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          echo "✓ Submodule commit-pin validation passed"

      - name: Collect error summary for comment
        id: collect-errors
        if: failure()
        run: |
          SUMMARY=""
          for step_out in \
            "${{ steps.check-leakage.outputs.error_summary }}" \
            "${{ steps.check-visibility.outputs.error_summary }}" \
            "${{ steps.check-submodules.outputs.error_summary }}"; do
            [ -n "$step_out" ] && SUMMARY="${SUMMARY}${step_out}\n"
          done
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

      - name: Post boundary check result
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/post-failure-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          gate-name: Private Plugin Boundary Enforcement
          workflow-file: gate-pr-plugin-boundary.yml
          job-status: ${{ job.status }}
          checklist: |
            - ${{ steps.check-leakage.outcome == 'success' && '✅' || '❌' }} Private plugin leakage detection
            - ${{ steps.check-visibility.outcome == 'success' && '✅' || '❌' }} Plugin manifest visibility validation
            - ${{ steps.check-submodules.outcome == 'success' && '✅' || '❌' }} Submodule commit-pin enforcement (no branch refs for private)
          error-summary: ${{ steps.collect-errors.outputs.summary }}

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Validate: Private Plugin Boundary Enforcement"
            echo ""
            echo "| Check | Outcome |"
            echo "|-------|---------|"
            echo "| Leakage detection | ${{ steps.check-leakage.outcome }} |"
            echo "| Manifest visibility | ${{ steps.check-visibility.outcome }} |"
            echo "| Submodule commit pins | ${{ steps.check-submodules.outcome }} |"
            echo "| Job result | ${{ job.status }} |"
            echo "| Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  human-loop-escalation:
    name: "Validate: Human-in-the-loop Escalation"
    needs: [private-plugin-boundary-check]
    if: always() && needs.private-plugin-boundary-check.result != 'success' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-status-flags-and-issues.yml
    permissions:
      contents: read
      issues: write
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
    with:
      operation: upsert_issue
      issue-title: "Decision Required: Private plugin boundary gate failed"
      issue-marker: "<!-- workflow-human-loop:plugin-boundary -->"
      labels-to-add: "status/needs-approval,ci/failure"
      issue-body: |
        <!-- workflow-human-loop:plugin-boundary -->
        # Human Decision Required: Private Plugin Boundary Gate

        The plugin boundary gate failed and needs maintainer decision.

        - **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        - **Workflow:** `${{ github.workflow }}`
        - **Ref:** `${{ github.ref }}`
        - **Result:** `${{ needs.private-plugin-boundary-check.result }}`

        ## Required Decision
        1. Fix now in current PR
        2. Approve temporary waiver with rationale and follow-up issue
        3. Remove/adjust affected plugin boundary changes
      source-workflow: ${{ github.workflow }}
      source-run-id: ${{ github.run_id }}
      source-sha: ${{ github.sha }}

  human-loop-resolution:
    name: "Validate: Human-in-the-loop Resolution Labels"
    needs: [private-plugin-boundary-check]
    if: always() && needs.private-plugin-boundary-check.result == 'success' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-status-flags-and-issues.yml
    permissions:
      contents: read
      issues: write
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
    with:
      operation: replace_status_group
      issue-marker: "<!-- workflow-human-loop:plugin-boundary -->"
      status-group: "status/needs-approval,status/needs-attention,status/needs-triage,status/resolved"
      labels-to-add: "status/resolved"
      labels-to-remove: "ci/failure"
      allow-missing: ${{ 'true' }}
      source-workflow: ${{ github.workflow }}
      source-run-id: ${{ github.run_id }}
      source-sha: ${{ github.sha }}
