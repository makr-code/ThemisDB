name: Zero-Copy Blob Transfers CI

# Triggered on every push/PR that touches ZeroCopyBlobTransfer sources,
# its tests, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/storage/zero_copy_blob_transfer.h'
      - 'src/storage/zero_copy_blob_transfer.cpp'
      - 'tests/test_zero_copy_blob_transfers.cpp'
      - 'cmake/BlobStorage.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/zero-copy-blob-transfers-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/storage/zero_copy_blob_transfer.h'
      - 'src/storage/zero_copy_blob_transfer.cpp'
      - 'tests/test_zero_copy_blob_transfers.cpp'
      - 'cmake/BlobStorage.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/zero-copy-blob-transfers-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ZeroCopyBlobTransferFocusedTests suite.
  # Tests cover:
  #   1. sendfile(): full file transfer — bytes match original data
  #   2. sendfile() with explicit offset + length: partial transfer
  #   3. sendfile() returns error for missing source file
  #   4. sendfile() returns error for invalid offset
  #   5. MmapBlobView: valid mapping with correct data for existing file
  #   6. MmapBlobView: forEach() iterates all bytes correctly
  #   7. MmapBlobView: forEach() early-stop via false return
  #   8. MmapBlobView: invalid for non-existent file
  #   9. MmapBlobView: move semantics leave source invalid
  #  10. shouldUseZeroCopy() threshold behaviour (below/at/above)
  #  11. s3_multipart_part_size_bytes clamped to S3 minimum
  #  12. ZeroCopyTransferStats.bytes_transferred matches file size
  #  13. openMmap() returns valid view via ZeroCopyBlobTransfer
  #  14. Large-blob mmap round-trip (5 MB blob, above 4 MB threshold)
  # ---------------------------------------------------------------------------
  zero-copy-blob-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Zero-Copy Blob tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Run Zero-Copy Blob Transfer unit tests
        run: |
          set -o pipefail
          cd build
          ctest --test-dir . \
            --tests-regex ZeroCopyBlobTransferFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee zero_copy_blob_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-copy-blob-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/zero_copy_blob_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚡ Zero-Copy Blob Transfers – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ZeroCopyBlobTransfer (Issue #231, v1.7.0): sendfile() kernel-level transfer, MmapBlobView zero-copy reads, S3 multipart streaming upload. Expected: 40-60% faster blob transfers." >> "$GITHUB_STEP_SUMMARY"
