name: Scanner Delta Report

# Governance note:
# - This workflow is a narrow PR gate and must not be widened to broad repo paths.
# - It validates scanner delta tooling and aggregate compatibility only.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - community
    paths:
      - '.github/workflows/09-pr-gates_scanner-delta-report.yml'
      - 'tools/scanners/**'
      - 'tools/gap_scanner*.py'
      - 'ai_working/gap_scan_v3_aggregate.json'
      - '.github/pull_request_template.md'
  workflow_dispatch:
    inputs:
      run_scan_if_missing:
        description: "Run scanner when current aggregate is missing"
        type: boolean
        default: false

concurrency:
  group: scanner-delta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scanner-delta-report:
    name: Build scanner delta report
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare report directories
        run: |
          mkdir -p ai_working
          mkdir -p ai_working/delta

      - name: Resolve baseline aggregate from base branch
        id: baseline
        run: |
          BASE_FILE="ai_working/gap_scan_v3_aggregate.baseline.json"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            if git show "origin/${{ github.base_ref }}:ai_working/gap_scan_v3_aggregate.json" > "${BASE_FILE}" 2>/dev/null; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "path=${BASE_FILE}" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "path=" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ -f "ai_working/gap_scan_v3_aggregate.json" ]; then
              cp ai_working/gap_scan_v3_aggregate.json "${BASE_FILE}"
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "path=${BASE_FILE}" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
              echo "path=" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Resolve current aggregate from HEAD
        id: current
        run: |
          if [ -f "ai_working/gap_scan_v3_aggregate.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=ai_working/gap_scan_v3_aggregate.json" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Optionally run scanner if current aggregate is missing
        id: runscan
        if: steps.current.outputs.found != 'true' && (github.event_name == 'workflow_dispatch' && inputs.run_scan_if_missing)
        run: |
          python tools/scanners/orchestrator.py . ai_working
          if [ -f "ai_working/gap_scan_v3_aggregate.json" ]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build delta report
        id: delta
        run: |
          BASE="${{ steps.baseline.outputs.path }}"
          CUR="${{ steps.current.outputs.path }}"

          if [ -z "${CUR}" ] && [ -f "ai_working/gap_scan_v3_aggregate.json" ]; then
            CUR="ai_working/gap_scan_v3_aggregate.json"
          fi

          if [ -n "${BASE}" ] && [ -n "${CUR}" ]; then
            python tools/scanners/delta_report.py \
              --baseline "${BASE}" \
              --current "${CUR}" \
              --out-json ai_working/delta/gap_scan_v3_delta.json \
              --out-md ai_working/delta/gap_scan_v3_delta.md
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            {
              echo "# Gap Scanner Delta Report"
              echo
              echo "Delta report was skipped because baseline or current aggregate is missing."
              echo
              echo "- baseline_found: ${{ steps.baseline.outputs.found }}"
              echo "- current_found: ${{ steps.current.outputs.found }}"
              echo "- scan_generated: ${{ steps.runscan.outputs.generated || 'false' }}"
            } > ai_working/delta/gap_scan_v3_delta.md
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload scanner delta artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-delta-${{ github.run_number }}
          path: |
            ai_working/delta/gap_scan_v3_delta.md
            ai_working/delta/gap_scan_v3_delta.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish delta report comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- scanner-delta-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body = `${marker}\n## Scanner Delta Report\n\n`;

            const mdPath = 'ai_working/delta/gap_scan_v3_delta.md';
            const jsonPath = 'ai_working/delta/gap_scan_v3_delta.json';

            if (fs.existsSync(jsonPath)) {
              const report = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
              const total = report.total || {};
              const sev = (report.severity && report.severity.delta) || {};
              const criticalDelta = Number(sev.severity_critical ?? 0);
              const highDelta = Number(sev.severity_high ?? 0);
              const needsAttention = criticalDelta > 0 || highDelta > 0;

              if (needsAttention) {
                body += '### Gate Status\n\n';
                body += '- scanner_status: ATTENTION\n';
                body += '- reason: critical/high delta above threshold (> 0)\n\n';
              } else {
                body += '### Gate Status\n\n';
                body += '- scanner_status: OK\n';
                body += '- reason: no positive critical/high delta\n\n';
              }

              body += '| Metric | Value |\\n';
              body += '|---|---:|\\n';
              body += `| Total Delta | ${total.delta ?? 'n/a'} |\\n`;
              body += `| Critical Delta | ${criticalDelta} |\\n`;
              body += `| High Delta | ${highDelta} |\\n`;
              body += `| Medium Delta | ${sev.severity_medium ?? 'n/a'} |\\n`;
              body += '\\n';
            } else {
              body += 'Delta JSON not available.\\n\\n';
            }

            if (fs.existsSync(mdPath)) {
              const md = fs.readFileSync(mdPath, 'utf8');
              const excerpt = md.split('\n').slice(0, 30).join('\n');
              body += '<details><summary>Report excerpt</summary>\\n\\n';
              body += '\\n```markdown\\n' + excerpt + '\\n```\\n';
              body += '\\n</details>\\n\\n';
            }

            body += `Artifacts and full logs: ${runUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Scanner Delta Report"
            echo
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| baseline_found | ${{ steps.baseline.outputs.found }} |"
            echo "| current_found | ${{ steps.current.outputs.found }} |"
            echo "| scan_generated | ${{ steps.runscan.outputs.generated || 'false' }} |"
            echo "| delta_status | ${{ steps.delta.outputs.status }} |"
            echo
            if [ -f ai_working/delta/gap_scan_v3_delta.md ]; then
              echo "### Report excerpt"
              echo
              head -40 ai_working/delta/gap_scan_v3_delta.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
