name: Validate Grafana Dashboards

# Static validation of all Grafana dashboard JSON files under grafana/.
# Checks:
#  - JSON syntax
#  - Required dashboard fields (title, panels)
#  - Unique panel IDs
#  - Panel structure (type, title, gridPos with h/w/x/y)
#  - Grid overlap detection
#  - Non-empty PromQL targets on query panels
#  - LLM dashboard: required panels present, all metrics use 'llm_' prefix
#
# Live Grafana smoke-test (importing dashboards into a real Grafana 10.x
# instance and verifying panel rendering) is a MANUAL step performed by
# the observability team before each release.
# See: docs/operations/llm/METRICS_SCRAPE_TROUBLESHOOTING.md
#
# See: docs/llm_roadmap.md — Observability checklist

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'grafana/**/*.json'
      - 'scripts/validate_grafana_dashboards.py'
      - '.github/workflows/05-quality_validation_validate-grafana-dashboards.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'grafana/**/*.json'
      - 'scripts/validate_grafana_dashboards.py'
      - '.github/workflows/05-quality_validation_validate-grafana-dashboards.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  validate-dashboards:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_grafana_changes == 'true'
    name: Validate Grafana Dashboard JSON
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Grafana dashboard validation
        run: |
          python3 scripts/validate_grafana_dashboards.py grafana/

      - name: Report validation result
        if: success()
        run: |
          echo "✅ All Grafana dashboard JSON files passed static validation."
          echo ""
          echo "NOTE: Live Grafana smoke-testing (Grafana 10.x import + panel render check)"
          echo "      is a manual step performed by the observability team before each release."
          echo "      See docs/operations/llm/METRICS_SCRAPE_TROUBLESHOOTING.md for instructions."

      - name: Write job summary
        if: always()
        run: |
          echo "## 📊 Validate Grafana Dashboards" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Directory** | \`grafana/\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Validator** | \`scripts/validate_grafana_dashboards.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks performed" >> "$GITHUB_STEP_SUMMARY"
          echo "- JSON syntax, required fields (title, panels), unique panel IDs" >> "$GITHUB_STEP_SUMMARY"
          echo "- Panel structure, grid overlap, non-empty PromQL targets" >> "$GITHUB_STEP_SUMMARY"
          echo "- LLM dashboard: required panels present, all metrics use \`llm_\` prefix" >> "$GITHUB_STEP_SUMMARY"
