name: "Gate: PR RAG Phase 10 (Cost Optimizer)"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'include/rag/gradient_descent_optimizer.h'
      - 'include/rag/cost_model_builder.h'
      - 'include/rag/recommendation_engine.h'
      - 'src/rag/gradient_descent_optimizer.cpp'
      - 'src/rag/cost_model_builder.cpp'
      - 'src/rag/recommendation_engine.cpp'
      - 'tests/rag/test_gradient_descent_optimizer.cpp'
      - 'tests/rag/test_cost_model_builder.cpp'
      - 'tests/rag/test_recommendation_engine.cpp'
      - '.github/workflows/gate-pr-rag-phase10.yml'
      - '.github/workflows/reusable-rag-phase-gate.yml'

concurrency:
  group: rag-phase10-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: read
  contents: read
  issues: write
  checks: write

jobs:
  phase10_validation:
    uses: ./.github/workflows/reusable-rag-phase-gate.yml
    with:
      phase_id: "10"
      phase_title: "Phase 10 Cost Optimizer"
      headers_json: '["include/rag/gradient_descent_optimizer.h","include/rag/cost_model_builder.h","include/rag/recommendation_engine.h"]'
      impls_json: '["src/rag/gradient_descent_optimizer.cpp","src/rag/cost_model_builder.cpp","src/rag/recommendation_engine.cpp"]'
      tests_json: '["tests/rag/test_gradient_descent_optimizer.cpp","tests/rag/test_cost_model_builder.cpp","tests/rag/test_recommendation_engine.cpp"]'
      grep_checks_json: '[{"file":"src/rag/gradient_descent_optimizer.cpp","pattern":"Optimize|SetObjective|EstimateGradient|RegisterParameter","error":"Gradient descent optimization not implemented"},{"file":"src/rag/gradient_descent_optimizer.cpp","pattern":"learning_rate|convergence_epsilon|gradient","error":"Learning rate decay or gradient estimation not implemented"},{"file":"src/rag/cost_model_builder.cpp","pattern":"BuildModel|Predict|Evaluate|CrossValidationSplit","error":"Cost model fitting not implemented"},{"file":"src/rag/cost_model_builder.cpp","pattern":"DataPoint|coefficients|RMSE","error":"Model metrics not implemented"},{"file":"src/rag/recommendation_engine.cpp","pattern":"GenerateRecommendations|SimulateRecommendation|GetRationale","error":"Recommendation generation not implemented"},{"file":"src/rag/recommendation_engine.cpp","pattern":"roi_score|confidence|effort","error":"ROI scoring not implemented"}]'
      labels_csv: "rag-phase10-validated,quality/cost-optimization"
