name: S3-Compatible Object Storage Source Connector CI

# Triggered on every push / PR that touches the S3Connector sources,
# its test file, or this workflow itself.  Targets v1.7.0 (Issue #178).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/ingestion/s3_connector.h'
      - 'src/ingestion/s3_connector.cpp'
      - 'src/ingestion/ingestion_manager.cpp'
      - 'include/ingestion/ingestion_manager.h'
      - 'tests/test_s3_connector.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_s3-compatible-object-storage-connector-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/ingestion/s3_connector.h'
      - 'src/ingestion/s3_connector.cpp'
      - 'src/ingestion/ingestion_manager.cpp'
      - 'include/ingestion/ingestion_manager.h'
      - 'tests/test_s3_connector.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_s3-compatible-object-storage-connector-ci.yml'
  workflow_dispatch:

concurrency:
  group: s3-compatible-object-storage-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the S3Connector focused test suite.
  # Tests cover all acceptance criteria from Issue #178:
  #   AC-1  s3_connector.cpp implements ISourceConnector; AWS SDK path
  #         (THEMIS_ENABLE_S3) or graceful CONNECTOR_NOT_SUPPORTED fallback
  #   AC-2  Incremental mode: checkpoint cursor stored as last processed key;
  #         ListObjectsV2 StartAfter used on restart
  #   AC-3  Flat-file format delegation: .jsonl, .csv, .parquet, .json, .txt
  #         delegated to FileSystemIngester via temporary file
  #   AC-4  max_keys_per_list (default 1000) and max_concurrent_downloads
  #         (default 4) configure per-page listing and parallel downloads
  #   AC-5  Path-traversal guard: keys containing ".." are rejected
  #   AC-6  IngestionManager routes provider==s3 to S3Connector
  # ---------------------------------------------------------------------------
  s3-connector-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: S3-Compatible Connector (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run S3ConnectorFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R S3ConnectorFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee s3_connector_focused_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run S3ConnectorTest suite via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="S3ConnectorTest*" \
            --gtest_output="xml:s3_connector_gtest.xml" \
            2>&1 | tee s3_connector_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-connector-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/s3_connector_focused_results.txt
            build/s3_connector_gtest.xml
            build/s3_connector_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## ☁️ S3-Compatible Object Storage Source Connector CI – v1.7.0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Acceptance Criteria Coverage (Issue #178)" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC | Description | Test(s) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----|-------------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1 | \`s3_connector.cpp\` implements \`ISourceConnector\`; AWS SDK / fallback | \`InitializeValidConfig\`, \`WithoutSdkAndNoMockReturnsConnectorNotSupported\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2 | Incremental mode: \`StartAfter\` from checkpoint cursor | \`CheckpointCursorUsedAsStartAfterOnResume\`, \`CheckpointWrittenAfterSuccessfulRun\`, \`CheckpointNotWrittenWhenDocumentsFailed\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3 | Flat-file delegation: .jsonl, .csv, .parquet → \`FileSystemIngester\` | \`IngestJsonlObjectViaDelegation\`, \`IngestCsvObjectViaDelegation\`, \`ParquetObjectDelegatedToFileSystemIngester\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4 | \`max_keys_per_list\` (default 1000) and \`max_concurrent_downloads\` (default 4) | \`MaxKeysPerListDefaultIs1000\`, \`MaxConcurrentDownloadsDefaultIs4\`, \`ConcurrentDownloadsProcessMultipleObjects\`, \`LargeBatchProcessedConcurrently\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5 | Path-traversal guard rejects keys with '..' | \`PathTraversalKeyRejected\`, \`AllUnsafeKeysBecomeFailures\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6 | \`IngestionManager\` routes \`provider==s3\` to \`S3Connector\` | Covered by integration route in \`ingestion_manager.cpp\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**32 focused unit tests** – no AWS credentials required (mock injection path)." >> "$GITHUB_STEP_SUMMARY"
