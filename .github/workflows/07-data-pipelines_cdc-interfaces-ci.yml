name: CDC Interfaces CI

# Triggered on every push / PR that touches the CDC interface headers or
# the associated test files.  Covers v1.8.0 deliverables:
#   - ICDCPauseControl / InMemoryPauseControl
#   - ICDCBackpressureSignal / InMemoryBackpressureSignal
#   - ICDCFanIn / InMemoryFanIn / IFanInMergePolicy / FanInEvent
#   - ICDCEventSchema / InMemoryCDCEventSchema / ISchemaEvolutionCallback
#   - IDeliveryGuaranteeConfig / InMemoryDeliveryGuaranteeConfig / InMemoryIdempotentListener
# And v2.0.0 deliverables:
#   - ICDCReplayController / InMemoryReplayController / IReplaySession
#   - ICDCFilterPipeline / InMemoryFilterPipeline / IEventFilter
#   - ICDCBatchCommitCoordinator / InMemoryBatchCommitCoordinator
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/cdc/icdc_pause_control.h'
      - 'include/cdc/icdc_backpressure_signal.h'
      - 'include/cdc/icdc_fan_in.h'
      - 'include/cdc/icdc_event_schema.h'
      - 'include/cdc/idelivery_guarantee_config.h'
      - 'include/cdc/icdc_replay_controller.h'
      - 'include/cdc/icdc_filter_pipeline.h'
      - 'include/cdc/icdc_batch_commit_coordinator.h'
      - 'tests/test_cdc_pause_control.cpp'
      - 'tests/test_cdc_backpressure_signal.cpp'
      - 'tests/test_cdc_fan_in.cpp'
      - 'tests/test_cdc_event_schema.cpp'
      - 'tests/test_cdc_delivery_guarantee_config.cpp'
      - 'tests/test_cdc_replay_controller.cpp'
      - 'tests/test_cdc_filter_pipeline.cpp'
      - 'tests/test_cdc_batch_commit_coordinator.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_cdc-interfaces-ci.yml'
  workflow_dispatch:

concurrency:
  group: cdc-interfaces-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CDC interface focused test suites.
  # Tests cover all acceptance criteria:
  #
  # ICDCPauseControl / InMemoryPauseControl
  #   AC-P1  pause() transitions isPaused() to true
  #   AC-P2  resume() transitions isPaused() to false
  #   AC-P3  Duplicate pause() / resume() calls are no-ops
  #   AC-P4  PauseReason is recorded and retrievable via pauseReason()
  #   AC-P5  bufferEvent() returns false when stream is not paused
  #   AC-P6  bufferEvent() returns false when max_buffer_bytes is exceeded
  #   AC-P7  drainBuffer() returns all buffered events in FIFO order
  #   AC-P8  resume() after drain clears bufferedEventCount to 0
  #   AC-P9  waitForResume() returns false on timeout; true when resumed
  #   AC-P10 Concurrent pause/resume calls are thread-safe
  #
  # ICDCBackpressureSignal / InMemoryBackpressureSignal
  #   AC-B1  Initial level is None
  #   AC-B2  signalBackpressure() updates currentLevel()
  #   AC-B3  clearBackpressure() resets to None
  #   AC-B4  Level-change callback fired on level transition
  #   AC-B5  Callback NOT fired when level is unchanged
  #   AC-B6  setCallback() replaces previous callback
  #   AC-B7  Concurrent signalBackpressure() calls are thread-safe
  #
  # ICDCFanIn / InMemoryFanIn
  #   AC-F1  addSource returns false for duplicate ID
  #   AC-F2  removeSource returns false for unknown ID
  #   AC-F3  listEvents merges events from all registered sources
  #   AC-F4  TimestampMergePolicy produces non-decreasing timestamp order
  #   AC-F5  from_sequence cursor filters events correctly
  #   AC-F6  limit parameter caps the returned event count
  #   AC-F7  collection subset filter restricts to specified collections
  #   AC-F8  FanInEvent::toJson() includes "collection" field
  #   AC-F9  Custom IFanInMergePolicy is applied via setMergePolicy()
  #
  # ICDCEventSchema / InMemoryCDCEventSchema
  #   AC-S1  registerSchema returns false for duplicate (collection, version)
  #   AC-S2  getSchema(-1) returns the latest registered schema
  #   AC-S3  currentVersion returns -1 before any schema is registered
  #   AC-S4  triggerEvolution calls onCompatible when conflicts is empty
  #   AC-S5  triggerEvolution calls onIncompatible with first conflict
  #   AC-S6  triggerEvolution returns false with no registered callback
  #   AC-S7  Concurrent registerSchema / getSchema are thread-safe
  #
  # IDeliveryGuaranteeConfig / InMemoryDeliveryGuaranteeConfig
  #   AC-D1  Default mode is AtLeastOnce; default ack timeout 30s; dedup 5min
  #   AC-D2  setMode / setAckTimeout / setDeduplicationWindow round-trip
  #   AC-D3  Concurrent mode updates are thread-safe
  #
  # InMemoryIdempotentListener
  #   AC-I1  isDuplicate returns false for unprocessed sequences
  #   AC-I2  markProcessed makes sequence a duplicate
  #   AC-I3  markProcessed is idempotent
  #   AC-I4  FIFO eviction when max_window_size is reached
  #   AC-I5  Concurrent markProcessed / isDuplicate are thread-safe
  #
  # ICDCReplayController / InMemoryReplayController (v2.0.0)
  #   AC-R1  beginReplay() returns a non-null IReplaySession
  #   AC-R2  Empty changefeed → session is immediately done
  #   AC-R3  nextBatch() respects batch_size
  #   AC-R4  from_sequence cursor filters older events
  #   AC-R5  to_sequence cap stops at the upper bound
  #   AC-R6  from_timestamp_ms / to_timestamp_ms filter events by wall-clock
  #   AC-R7  key_prefix filter restricts to matching keys
  #   AC-R8  event_types filter restricts to matching operation types
  #   AC-R9  max_events_per_session limits total event count
  #   AC-R10 cancel() causes done() == true and nextBatch() returns {}
  #   AC-R11 deliveredCount() increments correctly across batches
  #   AC-R12 totalSessionsCreated() increments per beginReplay() call
  #   AC-R13 replayFromTimestamp() convenience overload works
  #   AC-R14 replayFromSequence() convenience overload works
  #   AC-R15 Draining all events transitions state to Done
  #
  # ICDCFilterPipeline / InMemoryFilterPipeline (v2.0.0)
  #   AC-FP1  Empty pipeline passes all events
  #   AC-FP2  addFilter() returns false for duplicate name
  #   AC-FP3  removeFilter() returns false for unknown name
  #   AC-FP4  hasFilter() correctly reports presence
  #   AC-FP5  size() and empty() reflect pipeline state
  #   AC-FP6  PredicateFilter passes / drops correctly
  #   AC-FP7  KeyPrefixFilter passes matching prefix; drops others
  #   AC-FP8  EventTypeFilter passes matching types; drops others
  #   AC-FP9  Multiple stages: first Drop short-circuits remaining stages
  #   AC-FP10 applyBatch() returns only passing events (order preserved)
  #   AC-FP11 filterNames() returns stage names in insertion order
  #   AC-FP12 totalPassed / totalDropped / resetCounters
  #   AC-FP13 Removing a stage affects subsequent apply() calls
  #   AC-FP14 Thread-safety: concurrent addFilter / apply
  #   AC-FP15 ICDCFilterPipeline polymorphic usage
  #
  # ICDCBatchCommitCoordinator / InMemoryBatchCommitCoordinator (v2.0.0)
  #   AC-BC1  beginBatch() returns a non-zero BatchId
  #   AC-BC2  beginBatch() while a batch is open returns 0
  #   AC-BC3  addEvent() returns NoBatchOpen when no batch is open
  #   AC-BC4  addEvent() returns Added for events within limit
  #   AC-BC5  addEvent() returns BatchFull when max_batch_size is reached
  #   AC-BC6  commitBatch() commits all staged events
  #   AC-BC7  committedEvents() returns events in commit order
  #   AC-BC8  isCommitted() reflects committed batch IDs
  #   AC-BC9  commitBatch() returns NoBatchOpen when no batch is open
  #   AC-BC10 rollbackBatch() clears staged events; status → RolledBack
  #   AC-BC11 rollbackBatch() returns NoBatchOpen when no batch is open
  #   AC-BC12 After commit, beginBatch() succeeds again (idle → open)
  #   AC-BC13 After rollback, beginBatch() succeeds again
  #   AC-BC14 info() reflects current state accurately
  #   AC-BC15 Commit history FIFO eviction when limit is reached
  #   AC-BC16 Thread-safety: concurrent addEvent calls
  # ---------------------------------------------------------------------------
  cdc-interfaces-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CDC Interfaces (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Pause Control ────────────────────────────────────────────────────────
      - name: Run CDCPauseControlFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCPauseControlFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee cdc_pause_control_results.txt

      # ── Backpressure Signal ──────────────────────────────────────────────────
      - name: Run CDCBackpressureSignalFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCBackpressureSignalFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee cdc_backpressure_signal_results.txt

      # ── Fan-In ───────────────────────────────────────────────────────────────
      - name: Run CDCFanInFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCFanInFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee cdc_fan_in_results.txt

      # ── Event Schema ─────────────────────────────────────────────────────────
      - name: Run CDCEventSchemaFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCEventSchemaFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee cdc_event_schema_results.txt

      # ── Delivery Guarantee Config ────────────────────────────────────────────
      - name: Run CDCDeliveryGuaranteeConfigFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCDeliveryGuaranteeConfigFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee cdc_delivery_guarantee_config_results.txt

      # ── Replay Controller (v2.0.0) ───────────────────────────────────────────
      - name: Run CDCReplayControllerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCReplayControllerFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee cdc_replay_controller_results.txt

      # ── Filter Pipeline (v2.0.0) ─────────────────────────────────────────────
      - name: Run CDCFilterPipelineFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCFilterPipelineFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee cdc_filter_pipeline_results.txt

      # ── Batch Commit Coordinator (v2.0.0) ────────────────────────────────────
      - name: Run CDCBatchCommitCoordinatorFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCBatchCommitCoordinatorFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee cdc_batch_commit_coordinator_results.txt

      # ── Broader validation via unified binary ────────────────────────────────
      - name: Run CDC interface suites via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="InMemoryPauseControl*:InMemoryBackpressureSignal*:FanIn*:InMemoryCDCEventSchema*:DeliveryGuaranteeConfig*:InMemoryIdempotentListener*:InMemoryReplayController*:InMemoryFilterPipeline*:InMemoryBatchCommitCoordinator*" \
            --gtest_output="xml:cdc_interfaces_gtest.xml" \
            2>&1 | tee cdc_interfaces_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-interfaces-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cdc_pause_control_results.txt
            build/cdc_backpressure_signal_results.txt
            build/cdc_fan_in_results.txt
            build/cdc_event_schema_results.txt
            build/cdc_delivery_guarantee_config_results.txt
            build/cdc_replay_controller_results.txt
            build/cdc_filter_pipeline_results.txt
            build/cdc_batch_commit_coordinator_results.txt
            build/cdc_interfaces_gtest.xml
            build/cdc_interfaces_gtest_output.txt
          retention-days: 30
