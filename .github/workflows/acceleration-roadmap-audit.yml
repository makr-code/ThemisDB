name: Acceleration ROADMAP Audit

# Validates that src/acceleration/ROADMAP.md checkbox statuses are consistent
# with GitHub issue states and the presence of implementation files.
#
# Triggers:
#   • push to develop/main that touches ROADMAP.md or src/acceleration/**
#   • any pull_request that touches those paths
#   • manual dispatch
#
# The audit script exits with:
#   0  No discrepancies found.
#   1  Discrepancies found (build fails; inspect the uploaded artifact).
#   2  Fatal error (missing file, API failure).
#
# A GitHub token with public_repo scope is required for authenticated API
# calls.  The job uses GITHUB_TOKEN (automatically available in Actions).

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/acceleration/ROADMAP.md'
      - 'src/acceleration/**'
      - 'scripts/acceleration_roadmap_audit.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/acceleration/ROADMAP.md'
      - 'src/acceleration/**'
      - 'scripts/acceleration_roadmap_audit.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap-audit:
    name: Acceleration ROADMAP Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ROADMAP audit
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/acceleration_roadmap_audit.py \
            --output-dir docs/audits
        continue-on-error: true  # capture exit code, fail after artifact upload

      - name: Store audit exit code
        run: echo "AUDIT_EXIT_CODE=${{ steps.audit.outcome == 'failure' && '1' || '0' }}" >> "$GITHUB_ENV"

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: acceleration-roadmap-audit-${{ github.run_number }}
          path: |
            docs/audits/acceleration-roadmap-audit.json
            docs/audits/acceleration-roadmap-audit.md
          retention-days: 30

      - name: Summarize audit results
        if: always()
        run: |
          if [ -f docs/audits/acceleration-roadmap-audit.md ]; then
            echo "## Acceleration ROADMAP Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            python3 - << 'PYEOF'
          import json, os
          path = "docs/audits/acceleration-roadmap-audit.json"
          if not os.path.exists(path):
              print("No JSON report found.")
          else:
              with open(path) as f:
                  data = json.load(f)
              m = data["meta"]
              disc = m["items_with_discrepancies"]
              total = m["total_issues_audited"]
              closed = m["closed_issues"]
              print(f"| Metric | Value |")
              print(f"|---|---|")
              print(f"| Issues audited | {total} |")
              print(f"| Closed on GitHub | {closed} |")
              print(f"| Items with discrepancies | **{disc}** |")
              if disc > 0:
                  print(f"\n### ⚠️ Discrepancies ({disc})\n")
                  for r in data["items"]:
                      if r["has_discrepancy"]:
                          for ia in r["issue_audits"]:
                              for d in ia["discrepancies"]:
                                  print(f"- **#{ia['number']}**: {d}")
          PYEOF
          fi >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Fail if discrepancies found
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::ROADMAP audit found discrepancies. Check the uploaded artifact for details."
          echo "Hint: run 'python3 scripts/acceleration_roadmap_audit.py' locally to reproduce."
          exit 1
