name: Repair GitHub Release Assets

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to repair (e.g. v1.9.0)'
        required: true
        type: string
      dry_run:
        description: 'Only report and stage mapping, do not upload/delete'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      delete_legacy_after_repair:
        description: 'Delete legacy assets after successful canonical upload'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  repair-assets:
    name: Repair release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ github.event.inputs.tag_name }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          DELETE_LEGACY="${{ github.event.inputs.delete_legacy_after_repair }}"

          mkdir -p tmp/release-repair
          VERSION="${TAG#v}"

          CANONICAL_RE='^themisdb-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?-[a-z0-9-]+-(sourcecode|binary)-(arm|x86|x64)(\..+)?$'

          map_asset_name() {
            local old_name="$1"

            case "$old_name" in
              "themisdb-${VERSION}-source.zip")
                echo "themisdb-${VERSION}-community-sourcecode-x64.zip"; return 0 ;;
              "themisdb-${VERSION}-source.zip.sha256")
                echo "themisdb-${VERSION}-community-sourcecode-x64.zip.sha256"; return 0 ;;
              "themisdb-${VERSION}-Linux-x86_64.tar.gz")
                echo "themisdb-${VERSION}-community-binary-x64.tar.gz"; return 0 ;;
              "themisdb-${VERSION}-Linux-x86_64.deb")
                echo "themisdb-${VERSION}-community-binary-x64.deb"; return 0 ;;
              "themisdb-${VERSION}-Linux-x86_64.rpm")
                echo "themisdb-${VERSION}-community-binary-x64.rpm"; return 0 ;;
              "ThemisDB-${VERSION}-Windows-x64.zip")
                echo "themisdb-${VERSION}-community-binary-x64.zip"; return 0 ;;
              "ThemisDB-${VERSION}-Windows-x64.msi")
                echo "themisdb-${VERSION}-community-binary-x64.msi"; return 0 ;;
              *)
                echo ""; return 0 ;;
            esac
          }

          echo "Fetching release assets for $TAG"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets > tmp/release-repair/release.json

          mapfile -t ASSETS < <(jq -r '.assets[].name' tmp/release-repair/release.json)

          echo "## GitHub Release Asset Repair" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | $TAG |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | $DRY_RUN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Delete legacy after repair | $DELETE_LEGACY |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          repaired=0
          legacy=0

          for old_name in "${ASSETS[@]}"; do
            if [[ "$old_name" =~ $CANONICAL_RE ]]; then
              continue
            fi

            legacy=$((legacy + 1))
            new_name="$(map_asset_name "$old_name")"

            if [[ -z "$new_name" ]]; then
              echo "Unmapped legacy asset: $old_name"
              echo "- Unmapped legacy asset: $old_name" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if printf '%s\n' "${ASSETS[@]}" | grep -Fxq "$new_name"; then
              echo "Canonical asset already exists: $new_name"
              if [[ "$DELETE_LEGACY" == "true" && "$DRY_RUN" != "true" ]]; then
                gh release delete-asset "$TAG" "$old_name" --repo "${{ github.repository }}" --yes
                echo "Deleted legacy duplicate: $old_name"
              fi
              continue
            fi

            echo "Repair mapping: $old_name -> $new_name"
            echo "- Repair mapping: $old_name -> $new_name" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$DRY_RUN" == "true" ]]; then
              continue
            fi

            gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$old_name" --dir tmp/release-repair
            mv "tmp/release-repair/$old_name" "tmp/release-repair/$new_name"
            gh release upload "$TAG" "tmp/release-repair/$new_name" --repo "${{ github.repository }}" --clobber

            if [[ "$DELETE_LEGACY" == "true" ]]; then
              gh release delete-asset "$TAG" "$old_name" --repo "${{ github.repository }}" --yes
            fi

            repaired=$((repaired + 1))
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Legacy assets detected: $legacy" >> "$GITHUB_STEP_SUMMARY"
          echo "Assets repaired: $repaired" >> "$GITHUB_STEP_SUMMARY"
