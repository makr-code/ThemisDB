name: Themis Core Framework CI

# Triggered on every push / PR that touches the core framework sources
# or any of its test files.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/themis/build_info.cpp'
      - 'src/themis/license_info.cpp'
      - 'src/utils/runtime_license_gate.cpp'
      - 'src/base/module_loader.cpp'
      - 'src/base/module_sandbox.cpp'
      - 'src/network/wire_protocol_v2.cpp'
      - 'src/network/wire_protocol_performance.cpp'
      - 'src/network/wire_protocol_zero_copy.cpp'
      - 'src/network/wire_protocol_batch.cpp'
      - 'src/network/connection_compression.cpp'
      - 'include/themis/build_info.h'
      - 'include/themis/license_info.h'
      - 'include/themis/edition_manager.h'
      - 'include/themis/edition.h'
      - 'include/themis/module_hash_verifier.h'
      - 'include/themis/module_signature_verifier.h'
      - 'include/themis/export.h'
      - 'include/themis/runtime_license_gate.h'
      - 'include/themis/base/module_loader.h'
      - 'include/themis/base/module_sandbox.h'
      - 'include/themis/network/wire_protocol_v2.hpp'
      - 'include/network/wire_protocol_performance.h'
      - 'include/network/wire_protocol_zero_copy.h'
      - 'include/network/wire_protocol_batch.h'
      - 'include/network/connection_compression.h'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'cmake/MiscellaneousFeatures.cmake'
      - 'tests/test_build_info.cpp'
      - 'tests/test_license_client.cpp'
      - 'tests/test_license_validation.cpp'
      - 'tests/test_runtime_license_gate.cpp'
      - 'tests/test_module_sandbox.cpp'
      - 'tests/test_wire_protocol_v2.cpp'
      - 'tests/test_wire_protocol_performance.cpp'
      - 'tests/test_wire_protocol_optimizations.cpp'
      - 'tests/test_fuzz_core.cpp'
      - 'tests/performance/test_wire_perf_benchmark.cpp'
      - 'tests/test_concerns_context.cpp'
      - 'tests/test_context_propagation.cpp'
      - 'tests/test_plugin_health_monitor.cpp'
      - 'src/plugins/plugin_health_monitor.cpp'
      - 'include/plugins/plugin_health_monitor.h'
      - 'include/plugins/self_healing_plugin.h'
      - 'include/core/concerns/concerns_context.h'
      - 'include/core/concerns/noop_implementations.h'
      - 'include/core/concerns/i_feature_flags.h'
      - 'include/core/concerns/i_circuit_breaker.h'
      - 'include/core/concerns/lifecycle.h'
      - 'src/core/concerns/concerns_context.cpp'
      - 'scripts/license-server/**'
      - 'wordpress-plugins/themisdb-order-request/includes/class-license-api.php'
      - 'wordpress-plugins/themisdb-order-request/includes/class-license-portal.php'
      - 'wordpress-plugins/themisdb-order-request/includes/class-license-renewal.php'
      - 'tests/security/test_security_negative_integration.cpp'
      - 'src/auth/jwt_validator.cpp'
      - 'src/security/rbac.cpp'
      - 'src/security/vault_key_provider.cpp'
      - 'include/auth/jwt_validator.h'
      - 'include/security/rbac.h'
      - 'include/security/vault_key_provider.h'
      - '.github/workflows/01-core/themis-core-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/themis/build_info.cpp'
      - 'src/themis/license_info.cpp'
      - 'src/utils/runtime_license_gate.cpp'
      - 'src/base/module_loader.cpp'
      - 'src/base/module_sandbox.cpp'
      - 'src/network/wire_protocol_v2.cpp'
      - 'src/network/wire_protocol_performance.cpp'
      - 'src/network/wire_protocol_zero_copy.cpp'
      - 'src/network/wire_protocol_batch.cpp'
      - 'src/network/connection_compression.cpp'
      - 'include/themis/build_info.h'
      - 'include/themis/license_info.h'
      - 'include/themis/edition_manager.h'
      - 'include/themis/edition.h'
      - 'include/themis/module_hash_verifier.h'
      - 'include/themis/module_signature_verifier.h'
      - 'include/themis/export.h'
      - 'include/themis/runtime_license_gate.h'
      - 'include/themis/base/module_loader.h'
      - 'include/themis/base/module_sandbox.h'
      - 'include/themis/network/wire_protocol_v2.hpp'
      - 'include/network/wire_protocol_performance.h'
      - 'include/network/wire_protocol_zero_copy.h'
      - 'include/network/wire_protocol_batch.h'
      - 'include/network/connection_compression.h'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'cmake/MiscellaneousFeatures.cmake'
      - 'tests/test_build_info.cpp'
      - 'tests/test_license_client.cpp'
      - 'tests/test_license_validation.cpp'
      - 'tests/test_runtime_license_gate.cpp'
      - 'tests/test_module_sandbox.cpp'
      - 'tests/test_wire_protocol_v2.cpp'
      - 'tests/test_wire_protocol_performance.cpp'
      - 'tests/test_wire_protocol_optimizations.cpp'
      - 'tests/test_fuzz_core.cpp'
      - 'tests/performance/test_wire_perf_benchmark.cpp'
      - 'tests/test_concerns_context.cpp'
      - 'tests/test_context_propagation.cpp'
      - 'tests/test_plugin_health_monitor.cpp'
      - 'src/plugins/plugin_health_monitor.cpp'
      - 'include/plugins/plugin_health_monitor.h'
      - 'include/plugins/self_healing_plugin.h'
      - 'include/core/concerns/concerns_context.h'
      - 'include/core/concerns/noop_implementations.h'
      - 'include/core/concerns/i_feature_flags.h'
      - 'include/core/concerns/i_circuit_breaker.h'
      - 'include/core/concerns/lifecycle.h'
      - 'src/core/concerns/concerns_context.cpp'
      - 'scripts/license-server/**'
      - 'wordpress-plugins/themisdb-order-request/includes/class-license-api.php'
      - 'wordpress-plugins/themisdb-order-request/includes/class-license-portal.php'
      - 'wordpress-plugins/themisdb-order-request/includes/class-license-renewal.php'
      - 'tests/security/test_security_negative_integration.cpp'
      - 'src/auth/jwt_validator.cpp'
      - 'src/security/rbac.cpp'
      - 'src/security/vault_key_provider.cpp'
      - 'include/auth/jwt_validator.h'
      - 'include/security/rbac.h'
      - 'include/security/vault_key_provider.h'
      - '.github/workflows/01-core/themis-core-ci.yml'
  workflow_dispatch:   # Allow manual trigger from the Actions UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ───────────────────────────────────────────────────────────────────────────
  # 1.  Build & run all core-framework unit tests
  # ───────────────────────────────────────────────────────────────────────────
  core-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Core tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git commit metadata is captured

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          # librocksdb-dev: fix CMake "RocksDB not found"; libfmt-dev: fix find_package(fmt); libtbb-dev: optional threading
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Unit tests ──────────────────────────────────────────────────────
      - name: Run build-info tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildConfiguration*:BuildInfo*:ModuleQuery*:ReproducibilityInfo*:BuildManifest*" \
            --gtest_output="xml:build_info_results.xml" \
            2>&1 | tee build_info_output.txt

      - name: Run wire protocol V2 tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="WireV2*:V2Frame*:V2Stream*:V2Connection*:V2Server*" \
            --gtest_output="xml:wire_v2_results.xml" \
            2>&1 | tee wire_v2_output.txt

      - name: Run wire protocol performance tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="WireProtocolMetrics*:PayloadBufferPool*:CompressionAdvisor*" \
            --gtest_output="xml:wire_perf_results.xml" \
            2>&1 | tee wire_perf_output.txt

      - name: Run module sandbox / ABI checker tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="AbiChecker*:ModuleSandbox*" \
            --gtest_output="xml:module_sandbox_results.xml" \
            2>&1 | tee module_sandbox_output.txt

      - name: Run module loader tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ModuleLoader*:ModuleRegistry*:ModuleError*:ModuleVerif*" \
            --gtest_output="xml:module_loader_results.xml" \
            2>&1 | tee module_loader_output.txt

      - name: Run license client tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="LicenseActivation*:LicenseClientConfig*:LicenseClient*:RuntimeLicenseGate*:RuntimeLicenseGateInit*" \
            --gtest_output="xml:license_results.xml" \
            2>&1 | tee license_output.txt

      - name: Run fuzz-style core tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="FuzzWireV2*:FuzzLicenseData*:FuzzBuildInfo*:FuzzAbiChecker*:FuzzBufferPool*:FuzzCompressionAdvisor*" \
            --gtest_output="xml:fuzz_core_results.xml" \
            2>&1 | tee fuzz_core_output.txt

      # ── Security negative tests (required for merge) ─────────────────────
      # These tests verify that JWT, RBAC, and Vault components correctly
      # reject invalid inputs, misconfigurations, and attack attempts.
      # They are self-contained and require no external services.
      - name: Run JWT negative tests (required)
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="JWTNegativeTest*:JWTValidationTest*:JWTValidatorTest*:KidRevocationTest*" \
            --gtest_output="xml:jwt_negative_results.xml" \
            2>&1 | tee jwt_negative_output.txt

      - name: Run RBAC negative tests (required)
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="RBACNegativeTest*:RBACTest*:PermissionTest*:RBACBuiltinRolesTest*:RBACInheritanceTest*:RBACSerializationTest*" \
            --gtest_output="xml:rbac_negative_results.xml" \
            2>&1 | tee rbac_negative_output.txt

      - name: Run Vault negative tests (required)
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="VaultNegativeTest*:VaultSigningProviderErrorTest*" \
            --gtest_output="xml:vault_negative_results.xml" \
            2>&1 | tee vault_negative_output.txt

      - name: Run wire performance benchmarks
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="WirePerfBenchmark*" \
            --gtest_output="xml:wire_bench_results.xml" \
            2>&1 | tee wire_bench_output.txt

      - name: Run concerns context and feature flags tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ConcernsContextTest*:InMemoryFeatureFlagsTest*:NoOpFeatureFlagsTest*:NoOpCircuitBreakerTest*:MetricLabelsTest*:IContextTest*:IAsyncLoggerTest*:IAsyncCacheTest*:ContextPropagationTest*:ContextScopeTest*" \
            --gtest_output="xml:concerns_results.xml" \
            2>&1 | tee concerns_output.txt

      - name: Run plugin health monitor tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="PluginHealthMonitorTest*:PluginHealthMonitorSingleton*" \
            --gtest_output="xml:plugin_health_monitor_results.xml" \
            2>&1 | tee plugin_health_monitor_output.txt

      # ── CCPA/CPRA data subject rights tests ──────────────────────────────
      - name: Run CCPA/CPRA data subject rights tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="RightToKnow*:RightToDelete*:OptOutOfSale*:DataPortability*:CcpaRuleSetTest*:PolicyEngineWithCcpa*:CcpaReportTest*:PolicyValidatorCcpaHipaa*:DataSubjectRequest*:CcpaRuleEvalResult*" \
            --gtest_output="xml:ccpa_results.xml" \
            2>&1 | tee ccpa_output.txt

      # ── Export build manifest ────────────────────────────────────────────
      - name: Export build manifest
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildManifest.ExportCreatesFile" \
            2>&1 | tee manifest_export.txt || true
          # Capture git metadata directly as fallback
          GIT_COMMIT=$(git rev-parse HEAD)
          GIT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"git_commit\":\"${GIT_COMMIT}\",\"git_branch\":\"${GIT_BRANCH}\",\"build_date\":\"${BUILD_DATE}\",\"os\":\"${{ matrix.os }}\",\"compiler\":\"${{ matrix.compiler }}\"}" \
            > build_manifest.json
          echo "Build manifest:"
          cat build_manifest.json

      # ── Collect artifacts ────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/*_results.xml
            build/*_output.txt
            build/build_manifest.json
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧪 Themis Core CI – Core Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tests executed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build info, wire protocol V2 & performance, module sandbox/loader" >> "$GITHUB_STEP_SUMMARY"
          echo "- License client, fuzz-style core, JWT/RBAC/Vault negative tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- Wire performance benchmarks, concerns context & feature flags" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 2.  Coverage report (GCC only, Debug + gcov)
  # ───────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage report (ubuntu-22.04 / gcc-12)
    runs-on: ubuntu-22.04
    needs: core-tests
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             gcc-12
          cxx:            g++-12
          # librocksdb-dev: fix CMake "RocksDB not found"; libfmt-dev: fix find_package(fmt); libtbb-dev: optional threading
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev lcov

      - name: Configure and build (coverage)
        uses: ./.github/actions/configure-themis
        with:
          cc:              gcc-12
          cxx:             g++-12
          enable-coverage: 'true'

      - name: Run all core-framework tests for coverage
        run: |
          # Core framework tests
          CORE_FILTER="BuildConfiguration*:BuildInfo*:ModuleQuery*:ReproducibilityInfo*"
          CORE_FILTER="${CORE_FILTER}:BuildManifest*:WireV2*:V2Frame*:V2Stream*:V2Connection*"
          CORE_FILTER="${CORE_FILTER}:V2Server*:WireProtocolMetrics*:PayloadBufferPool*"
          CORE_FILTER="${CORE_FILTER}:CompressionAdvisor*:AbiChecker*:ModuleSandbox*"
          CORE_FILTER="${CORE_FILTER}:ModuleLoader*:LicenseClient*"
          CORE_FILTER="${CORE_FILTER}:FuzzWireV2*:FuzzLicenseData*:FuzzBuildInfo*"
          CORE_FILTER="${CORE_FILTER}:FuzzAbiChecker*:FuzzBufferPool*:FuzzCompressionAdvisor*"
          CORE_FILTER="${CORE_FILTER}:WirePerfBenchmark*"
          CORE_FILTER="${CORE_FILTER}:ConcernsContextTest*:InMemoryFeatureFlagsTest*"
          CORE_FILTER="${CORE_FILTER}:NoOpFeatureFlagsTest*:NoOpCircuitBreakerTest*"
          CORE_FILTER="${CORE_FILTER}:MetricLabelsTest*:IContextTest*:IAsyncLoggerTest*"
          CORE_FILTER="${CORE_FILTER}:IAsyncCacheTest*:ContextPropagationTest*:ContextScopeTest*"
          CORE_FILTER="${CORE_FILTER}:PluginHealthMonitorTest*:PluginHealthMonitorSingleton*"
          # CCPA/CPRA data subject rights tests
          CCPA_FILTER="RightToKnow*:RightToDelete*:OptOutOfSale*:DataPortability*"
          CCPA_FILTER="${CCPA_FILTER}:CcpaRuleSetTest*:PolicyEngineWithCcpa*:CcpaReportTest*"
          CCPA_FILTER="${CCPA_FILTER}:PolicyValidatorCcpaHipaa*:DataSubjectRequest*:CcpaRuleEvalResult*"
          # Security negative tests
          SEC_FILTER="JWTNegativeTest*:JWTValidationTest*:JWTValidatorTest*:KidRevocationTest*"
          SEC_FILTER="${SEC_FILTER}:RBACNegativeTest*:RBACTest*:PermissionTest*"
          SEC_FILTER="${SEC_FILTER}:RBACBuiltinRolesTest*:RBACInheritanceTest*:RBACSerializationTest*"
          SEC_FILTER="${SEC_FILTER}:VaultNegativeTest*:VaultSigningProviderErrorTest*"
          # Auth module unit tests
          AUTH_FILTER="MFAAuthenticatorTest*:AuthMetricsTest*:AuthErrorTest*"
          AUTH_FILTER="${AUTH_FILTER}:JWKSSecurityConfigTest*:JWKSSecureFetcherTest*:CertificateUtilsTest*"
          AUTH_FILTER="${AUTH_FILTER}:KerberosSecurityValidatorTest*:ChannelBindingGeneratorTest*"
          AUTH_FILTER="${AUTH_FILTER}:TOTPReplayCacheTest*:SecureMFAValidatorTest*"
          AUTH_FILTER="${AUTH_FILTER}:TOTPSecretEncryptionTest*:KeyRotationTest*"
          cd build
          ./tests/themis_tests \
            --gtest_filter="${CORE_FILTER}:${SEC_FILTER}:${AUTH_FILTER}:${CCPA_FILTER}" \
            2>&1 | tee coverage_test_output.txt || true

      - name: Capture lcov data
        run: |
          lcov --capture \
            --directory build \
            --output-file coverage.info \
            --gcov-tool gcov-12 \
            --ignore-errors gcov,source 2>/dev/null || true
          lcov --remove coverage.info \
            '/usr/*' '*/vcpkg*' '*/tests/*' '*/external/*' \
            --output-file coverage_filtered.info 2>/dev/null || true

      - name: Generate HTML report
        run: |
          genhtml coverage_filtered.info \
            --output-directory coverage_html \
            --title "Themis Core Framework Coverage" \
            --quiet 2>/dev/null || true
          echo "Coverage summary:"
          lcov --summary coverage_filtered.info 2>/dev/null || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage_html/
            coverage_filtered.info
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 📊 Themis Core CI – Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`ubuntu-22.04\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`gcc-12\` (gcov-12) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage report uploaded as artifact \`coverage-report\` (HTML + lcov info)." >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 3.  Docs lint – validate the developer guide
  # ───────────────────────────────────────────────────────────────────────────
  docs-lint:
    needs: ci-scope-classifier
    if: >
      needs.ci-scope-classifier.outputs.has_code_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true'
    name: Docs lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify developer guide exists
        run: |
          if [ ! -f docs/architecture/THEMIS_CORE_GUIDE.md ]; then
            echo "MISSING: docs/architecture/THEMIS_CORE_GUIDE.md" >&2
            exit 1
          fi
          echo "OK: docs/architecture/THEMIS_CORE_GUIDE.md ($(wc -l < docs/architecture/THEMIS_CORE_GUIDE.md) lines)"
          # Verify runtime license guides
          for guide in \
            docs/en/guides/LICENSE_RUNTIME_GUIDE.md \
            docs/de/guides/LICENSE_RUNTIME_LEITFADEN.md; do
            if [ -f "$guide" ]; then
              echo "OK: $guide ($(wc -l < "$guide") lines)"
            else
              echo "MISSING: $guide" >&2
              exit 1
            fi
          done

      - name: Verify all referenced headers exist
        run: |
          declare -a headers=(
            "include/themis/build_info.h"
            "include/themis/license_info.h"
            "include/themis/runtime_license_gate.h"
            "include/themis/base/module_loader.h"
            "include/themis/base/module_sandbox.h"
            "include/themis/network/wire_protocol_v2.hpp"
            "include/network/wire_protocol_performance.h"
            "include/network/wire_protocol_zero_copy.h"
            "include/network/wire_protocol_batch.h"
            "include/network/connection_compression.h"
          )
          all_ok=true
          for h in "${headers[@]}"; do
            if [ -f "$h" ]; then
              echo "OK: $h"
            else
              echo "MISSING: $h" >&2
              all_ok=false
            fi
          done
          $all_ok || exit 1

      - name: Check for TODO/FIXME in new source files
        run: |
          count=$(grep -rn "TODO\|FIXME\|HACK\|XXX" \
            src/themis/build_info.cpp \
            src/themis/license_info.cpp \
            src/base/module_sandbox.cpp \
            src/network/wire_protocol_v2.cpp \
            src/network/wire_protocol_performance.cpp \
            src/network/wire_protocol_zero_copy.cpp \
            src/network/wire_protocol_batch.cpp \
            src/network/connection_compression.cpp \
            2>/dev/null | wc -l)
          echo "Open TODOs/FIXMEs in core sources: ${count}"
          # Warn but don't fail – these are expected during active development
          if [ "$count" -gt 20 ]; then
            echo "::warning::${count} open TODO/FIXME items in core sources"
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 📝 Themis Core CI – Docs Lint" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks performed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Developer guide presence (THEMIS_CORE_GUIDE.md, LICENSE_RUNTIME guides)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Referenced header file existence" >> "$GITHUB_STEP_SUMMARY"
          echo "- TODO/FIXME scan in core sources" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 4.  License server Python tests
  # ───────────────────────────────────────────────────────────────────────────
  license-server-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: License server tests (Python / FastAPI)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: scripts/license-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/license-server/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run license server tests
        env:
          THEMIS_LS_API_KEY: ci-test-api-key-not-secret
          THEMIS_LS_ADMIN_SECRET: ci-test-admin-secret-not-secret
        run: python -m pytest test_license_server.py -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-server-test-results
          path: scripts/license-server/.pytest_cache/
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔑 Themis Core CI – License Server Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Python** | 3.11 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Framework** | FastAPI / pytest |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Test file: \`scripts/license-server/test_license_server.py\`" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 5.  Windows MSVC compile-check (verifies DLL export macros)
  # ───────────────────────────────────────────────────────────────────────────
  windows-compile-check:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Windows compile-check (MSVC / x64)
    runs-on: windows-2022
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Developer Command Prompt (MSVC)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/packages
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-windows-x64-

      - name: Bootstrap vcpkg
        run: |
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
        shell: cmd

      - name: Configure (CMake – modular build, COMMUNITY, Debug)
        run: |
          cmake -S cmake -B build-windows-check `
            -G Ninja `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DCMAKE_BUILD_TYPE=Debug `
            -DTHEMIS_BUILD_MODULAR=ON `
            -DTHEMIS_EDITION=COMMUNITY `
            -DTHEMIS_ENABLE_GPU=OFF `
            -DTHEMIS_ENABLE_LLM=OFF `
            -DTHEMIS_ENABLE_CUDA=OFF `
            -DTHEMIS_ENABLE_TRACING=OFF `
            -DTHEMIS_ENABLE_GRPC=OFF `
            -DTHEMIS_BUILD_TESTS=OFF `
            -DTHEMIS_CI_MODE=ON `
            "-DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
        shell: pwsh

      - name: Build themis_base (DLL export check)
        run: cmake --build build-windows-check --target themis_base --config Debug -- -j2
        shell: pwsh

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          $summary = @"
          ## 🪟 Themis Core CI – Windows Compile Check

          | Parameter | Value |
          |-----------|-------|
          | **OS** | ``windows-2022`` |
          | **Compiler** | ``MSVC (cl.exe)`` |
          | **Build type** | ``Debug`` |
          | **Modular build** | ``ON`` |
          | **Edition** | ``COMMUNITY`` |
          | **Event** | ``${{ github.event_name }}`` |
          | **Branch** | ``${{ github.ref_name }}`` |
          | **Commit** | ``${{ github.sha }}`` |

          Verifies that ``THEMIS_BASE_API`` export macros compile correctly with MSVC.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
