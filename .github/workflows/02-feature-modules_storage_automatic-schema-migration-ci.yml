name: Automatic Schema Migration CI

# Triggered on every push/PR that touches the SchemaMigration sources,
# its test file, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/updates/schema_migration.cpp'
      - 'include/updates/schema_migration.h'
      - 'tests/test_automatic_schema_migration.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_automatic-schema-migration-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/updates/schema_migration.cpp'
      - 'include/updates/schema_migration.h'
      - 'tests/test_automatic_schema_migration.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_automatic-schema-migration-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated AutomaticSchemaMigration focused test suite.
  # Tests cover:
  #   1. Schema versioning and tracking (version(), operationCount())
  #   2. addColumn: metadata written, backfill tracking
  #   3. renameColumn: metadata renamed, dual-write marker written
  #   4. addIndex: metadata written, online/blocking flag, multi-column
  #   5. dropColumn: drop marker written, grace period recorded
  #   6. Custom migration callback: invoked, can read/write storage, false → fail
  #   7. Automatic rollback: storage restored on failure
  #   8. Manual rollback: explicit rollback() unwinds partial apply
  #   9. Error paths: empty table name, empty column/index name, no columns
  #  10. Phase progression: IDLE → CLEANUP on success, ROLLED_BACK on failure
  #  11. Fluent builder: chained calls return same object
  #  12. Multiple operations applied in order
  # ---------------------------------------------------------------------------
  automatic-schema-migration-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Automatic schema migration tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev

      - name: Configure (schema migration test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build focused test binary
        run: cmake --build build --target test_automatic_schema_migration_focused -- -j$(nproc)

      - name: Run Automatic Schema Migration unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex AutomaticSchemaMigrationFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee automatic_schema_migration_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-schema-migration-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/automatic_schema_migration_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🗂️ Automatic Schema Migration – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SchemaMigration: online DDL (addColumn/renameColumn/addIndex/dropColumn), backfill, dual-write markers, automatic and manual rollback, custom migration callbacks." >> "$GITHUB_STEP_SUMMARY"
