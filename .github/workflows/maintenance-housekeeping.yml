name: "Maintenance: Housekeeping"

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-09-14
# Trigger policy: Consolidated weekly housekeeping (Monday UTC).
# Replaces: maintenance-labels.yml, maintenance-milestones.yml,
#           maintenance-issue-recommendations.yml
#
# Jobs:
#   sync-labels        — sync .github/labels.yml to repository labels
#   sync-milestones    — sync .github/milestones.yml + auto-assign milestones
#   recommend-closures — comment on issues that likely deserve human closure review
#
# Event routing:
#   schedule       → all 3 jobs run
#   push develop   → sync-labels (labels.yml changed) or sync-milestones (milestones.yml changed)
#   issues / pull_request_target → assign-milestone only
#   workflow_dispatch → manual gate per job via boolean inputs

on:
  schedule:
    - cron: '0 5 * * 1'   # Monday 05:00 UTC — label sync
    - cron: '15 5 * * 1'  # Monday 05:15 UTC — milestone sync
    - cron: '0 7 * * 1'   # Monday 07:00 UTC — issue closure recommendations
  push:
    branches: [develop]
    paths:
      - '.github/labels.yml'
      - '.github/milestones.yml'
      - '.github/workflows/maintenance-housekeeping.yml'
  workflow_dispatch:
    inputs:
      run_labels:
        description: 'Run label sync job'
        required: false
        default: true
        type: boolean
      run_milestones:
        description: 'Run milestone sync job'
        required: false
        default: true
        type: boolean
      run_recommendations:
        description: 'Run issue closure recommendations job'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry run (labels + milestones: no writes)'
        required: false
        default: false
        type: boolean
      label_filter:
        description: 'Restrict label sync to labels with this name prefix (empty = all)'
        required: false
        default: ''
        type: string
      lookback_days:
        description: 'Days to look back for issue closure recommendations (default: 21)'
        required: false
        default: '21'
        type: string
      target_issue:
        description: 'Optional issue number for focused recommendation run'
        required: false
        default: ''
        type: string
  pull_request_target:
    types: [labeled, unlabeled]
  issues:
    types: [opened, reopened, labeled, unlabeled]

concurrency:
  group: maintenance-housekeeping-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

# ─────────────────────────────────────────────────────────────────────────────
# Job 1: Label sync
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  sync-labels:
    name: Sync labels from .github/labels.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, '.github/labels.yml')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_labels == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install js-yaml
        run: npm install js-yaml@4

      - name: Sync labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            const raw = fs.readFileSync('.github/labels.yml', 'utf8');
            const labels = yaml.load(raw);
            const dryRun = String('${{ inputs.dry_run || false }}').toLowerCase() === 'true';
            const filterPrefix = String('${{ inputs.label_filter || "" }}').toLowerCase();

            if (!Array.isArray(labels)) {
              core.setFailed('.github/labels.yml must be a YAML list of label objects');
              return;
            }

            let created = 0, updated = 0, skipped = 0, errors = 0;

            for (const label of labels) {
              const { name, color, description } = label;
              if (!name || !color) {
                core.warning(`Skipping label without name/color: ${JSON.stringify(label)}`);
                continue;
              }
              if (filterPrefix && !name.toLowerCase().startsWith(filterPrefix)) {
                skipped++;
                continue;
              }
              try {
                let existing;
                try {
                  const { data } = await github.rest.issues.getLabel({
                    owner: context.repo.owner, repo: context.repo.repo, name,
                  });
                  existing = data;
                } catch (err) {
                  if (err.status !== 404) throw err;
                  existing = null;
                }

                if (!existing) {
                  if (!dryRun) {
                    await github.rest.issues.createLabel({
                      owner: context.repo.owner, repo: context.repo.repo,
                      name, color, description: description || '',
                    });
                  }
                  core.info(`${dryRun ? '[dry-run] would create' : 'Created'}: ${name}`);
                  created++;
                } else {
                  const needsUpdate = existing.color !== color ||
                    (existing.description || '') !== (description || '');
                  if (needsUpdate) {
                    if (!dryRun) {
                      await github.rest.issues.updateLabel({
                        owner: context.repo.owner, repo: context.repo.repo,
                        name, color, description: description || '',
                      });
                    }
                    core.info(`${dryRun ? '[dry-run] would update' : 'Updated'}: ${name}`);
                    updated++;
                  } else {
                    skipped++;
                  }
                }
              } catch (err) {
                core.error(`Failed to sync label '${name}': ${err.message}`);
                errors++;
              }
            }

            const summary = `Label sync: ${created} created, ${updated} updated, ${skipped} unchanged, ${errors} errors`;
            core.notice(summary);
            await core.summary
              .addHeading('Label Sync Results')
              .addTable([
                [{ data: 'Action', header: true }, { data: 'Count', header: true }],
                ['Created', String(created)], ['Updated', String(updated)],
                ['Unchanged', String(skipped)], ['Errors', String(errors)],
              ]).write();
            if (errors > 0) core.setFailed(`${errors} label(s) failed to sync`);

# ─────────────────────────────────────────────────────────────────────────────
# Job 2: Milestone sync + assignment
# ─────────────────────────────────────────────────────────────────────────────
  sync-milestones:
    name: Sync milestones from .github/milestones.yml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'push' && contains(github.event.head_commit.modified, '.github/milestones.yml')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_milestones == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install js-yaml
        run: npm install js-yaml@4

      - name: Reconcile milestones
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            const raw = fs.readFileSync('.github/milestones.yml', 'utf8');
            const cfg = yaml.load(raw);
            const milestones = Array.isArray(cfg?.milestones) ? cfg.milestones : [];
            const dryRun = String('${{ inputs.dry_run || false }}').toLowerCase() === 'true';

            if (milestones.length === 0) {
              core.setFailed('No milestones defined in .github/milestones.yml');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const fetchAll = async (state) => {
              const out = [];
              let page = 1;
              while (true) {
                const { data } = await github.rest.issues.listMilestones({ owner, repo, state, per_page: 100, page });
                out.push(...data);
                if (data.length < 100) break;
                page++;
              }
              return out;
            };

            const existing = [...await fetchAll('open'), ...await fetchAll('closed')];
            const byTitle = new Map(existing.map((m) => [m.title, m]));
            let created = 0, updated = 0, unchanged = 0, errors = 0;

            for (const def of milestones) {
              const title = String(def?.title || '').trim();
              if (!title) { core.warning('Skipping milestone without title'); continue; }

              const desiredState = String(def?.state || 'open').toLowerCase() === 'closed' ? 'closed' : 'open';
              const desiredDesc = String(def?.description || '');
              const desiredDue = def?.due_on ? new Date(def.due_on).toISOString() : null;
              const found = byTitle.get(title);

              try {
                if (!found) {
                  if (!dryRun) {
                    await github.rest.issues.createMilestone({ owner, repo, title, state: desiredState, description: desiredDesc, due_on: desiredDue });
                  }
                  core.info(`${dryRun ? '[dry-run] would create' : 'Created'} milestone: ${title}`);
                  created++;
                  continue;
                }

                const currentDue = found.due_on ? new Date(found.due_on).toISOString() : null;
                const needsUpdate = found.state !== desiredState ||
                  (found.description || '') !== desiredDesc || currentDue !== desiredDue;

                if (!needsUpdate) { unchanged++; continue; }
                if (!dryRun) {
                  await github.rest.issues.updateMilestone({ owner, repo, milestone_number: found.number,
                    state: desiredState, title, description: desiredDesc, due_on: desiredDue });
                }
                core.info(`${dryRun ? '[dry-run] would update' : 'Updated'} milestone: ${title}`);
                updated++;
              } catch (err) { errors++; core.error(`Failed milestone ${title}: ${err.message}`); }
            }

            const summary = `Milestone sync: ${created} created, ${updated} updated, ${unchanged} unchanged, ${errors} errors`;
            if (errors > 0) core.setFailed(summary); else core.notice(summary);
            await core.summary.addHeading('Milestone Sync Results')
              .addTable([[{ data: 'Action', header: true }, { data: 'Count', header: true }],
                ['Created', String(created)], ['Updated', String(updated)],
                ['Unchanged', String(unchanged)], ['Errors', String(errors)]]).write();

  assign-milestone:
    name: Assign milestone by labels / Target Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install js-yaml
        run: npm install js-yaml@4

      - name: Resolve and assign milestone
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');

            const raw = fs.readFileSync('.github/milestones.yml', 'utf8');
            const cfg = yaml.load(raw) || {};
            const settings = cfg.settings || {};
            const rules = Array.isArray(cfg.assignment_rules) ? cfg.assignment_rules : [];
            const dryRun = String('${{ inputs.dry_run || false }}').toLowerCase() === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issue = context.payload.issue || context.payload.pull_request;
            if (!issue) { core.info('No issue/PR payload. Skipping.'); return; }
            if (context.eventName === 'pull_request_target' && issue.draft) {
              core.info('Draft PR: skipping milestone assignment.'); return;
            }

            const labels = (issue.labels || [])
              .map((l) => String(l?.name || l || '').trim().toLowerCase()).filter(Boolean);

            const fetchMilestones = async () => {
              const all = [];
              for (const state of ['open', 'closed']) {
                let page = 1;
                while (true) {
                  const { data } = await github.rest.issues.listMilestones({ owner, repo, state, per_page: 100, page });
                  all.push(...data);
                  if (data.length < 100) break;
                  page++;
                }
              }
              return all;
            };

            const allMilestones = await fetchMilestones();
            const byTitle = new Map(allMilestones.map((m) => [m.title, m]));
            let selected = '';

            if (Boolean(settings.allow_target_version_override) && context.eventName === 'pull_request_target') {
              const body = String(issue.body || '');
              const m = body.match(/^\*\*Target Version:\*\*\s*(?:\(([^)]+)\)|([^\n]+))\s*$/m);
              const tv = (m?.[1] || m?.[2] || '').trim();
              if (tv) { selected = tv; core.info(`Milestone from Target Version: ${selected}`); }
            }

            if (!selected) {
              for (const rule of rules) {
                const any = Array.isArray(rule.labels_any) ? rule.labels_any.map((v) => String(v).toLowerCase()) : [];
                if (any.some((tag) => labels.includes(tag))) {
                  selected = String(rule.milestone || '').trim();
                  core.info(`Milestone by rule '${rule.name || 'unnamed'}': ${selected}`);
                  break;
                }
              }
            }

            if (!selected) {
              selected = String(settings.default_milestone || '').trim();
              if (selected) core.info(`Default milestone: ${selected}`);
            }

            if (!selected) { core.info('No milestone resolved. Skipping.'); return; }

            let milestone = byTitle.get(selected);
            if (!milestone && Boolean(settings.auto_create_missing_milestones)) {
              if (dryRun) {
                core.info(`[dry-run] would create missing milestone '${selected}'`);
                milestone = { number: -1, title: selected };
              } else {
                const created = await github.rest.issues.createMilestone({
                  owner, repo, title: selected, state: 'open',
                  description: 'Auto-created by maintenance-housekeeping assign-milestone job.',
                });
                milestone = created.data;
                core.notice(`Auto-created milestone '${selected}'`);
              }
            }

            if (!milestone) { core.warning(`Milestone '${selected}' not found. Skipping.`); return; }
            if (dryRun) { core.info(`[dry-run] would assign #${issue.number} → '${selected}'`); return; }

            await github.rest.issues.update({
              owner, repo, issue_number: issue.number, milestone: milestone.number,
            });
            core.notice(`Assigned #${issue.number} to milestone '${selected}'`);

# ─────────────────────────────────────────────────────────────────────────────
# Job 3: Issue closure recommendations
# ─────────────────────────────────────────────────────────────────────────────
  recommend-closures:
    name: Recommend Issue Closures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_recommendations == true)
    steps:
      - name: Recommend issue closures
        uses: actions/github-script@v7
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '21' }}
          TARGET_ISSUE: ${{ inputs.target_issue || '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const markerPrefix = '<!-- maintenance-issue-recommendation';

            const rawLookback = Number.parseInt(String(process.env.LOOKBACK_DAYS || '21'), 10);
            const lookbackDays = Number.isFinite(rawLookback) && rawLookback > 0 ? Math.min(rawLookback, 90) : 21;
            const cutoff = new Date(Date.now() - lookbackDays * 24 * 60 * 60 * 1000);

            const rawTargetIssue = String(process.env.TARGET_ISSUE || '').trim();
            const targeted = rawTargetIssue.length > 0;
            const targetIssueNumber = targeted ? Number.parseInt(rawTargetIssue, 10) : null;

            const targetQuery = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    id number title url state updatedAt
                    labels(first: 20) { nodes { name } }
                    timelineItems(last: 50, itemTypes: [CROSS_REFERENCED_EVENT]) {
                      nodes {
                        ... on CrossReferencedEvent {
                          createdAt
                          source {
                            __typename
                            ... on PullRequest {
                              number title url merged mergedAt
                              repository { nameWithOwner }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

            const scanQuery = `
              query($owner: String!, $repo: String!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  issues(first: 50, after: $cursor, states: [OPEN], orderBy: { field: UPDATED_AT, direction: DESC }) {
                    nodes {
                      id number title url updatedAt
                      labels(first: 20) { nodes { name } }
                      timelineItems(last: 50, itemTypes: [CROSS_REFERENCED_EVENT]) {
                        nodes {
                          ... on CrossReferencedEvent {
                            createdAt
                            source {
                              __typename
                              ... on PullRequest {
                                number title url merged mergedAt
                                repository { nameWithOwner }
                              }
                            }
                          }
                        }
                      }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }`;

            const commentBodyFor = (issue, mergedPRs) => {
              const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
              const lines = [
                `<!-- maintenance-issue-recommendation:issue:${issue.number} -->`,
                '## Recommend-only issue triage', '',
                `Issue: #${issue.number} - ${issue.title}`,
                `Run: ${runUrl}`, `Lookback window: ${lookbackDays} day(s)`, '',
                'Merged PR evidence:',
              ];
              if (mergedPRs.length === 0) {
                lines.push('- No merged PR cross references found in the current lookback window.');
              } else {
                for (const pr of mergedPRs.slice(0, 5)) {
                  lines.push(`- #${pr.number} ${pr.title} (${pr.url})`);
                }
              }
              lines.push('', 'Recommendation:',
                '- Human maintainer should verify whether the merged PRs fully resolved this issue.',
                '- If resolved, a maintainer can close it manually after review.',
                '', '_This workflow never closes issues or removes labels._');
              return lines.join('\n');
            };

            const extractMergedPRs = (issue) => {
              const prs = [];
              for (const event of issue.timelineItems?.nodes || []) {
                const pr = event?.source;
                if (pr?.__typename !== 'PullRequest' || pr.repository?.nameWithOwner !== `${owner}/${repo}` ||
                    pr.merged !== true || !pr.mergedAt || new Date(pr.mergedAt) < cutoff) continue;
                prs.push({ number: pr.number, title: pr.title, url: pr.url, mergedAt: pr.mergedAt });
              }
              const unique = new Map();
              for (const pr of prs) unique.set(pr.number, pr);
              return [...unique.values()].sort((a, b) => new Date(b.mergedAt) - new Date(a.mergedAt));
            };

            const findExistingComment = async (issueNumber) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: issueNumber, per_page: 100,
              });
              return comments.find((c) => String(c.body || '').includes(markerPrefix));
            };

            const issueNumbers = [];
            if (targeted) {
              if (!Number.isFinite(targetIssueNumber) || targetIssueNumber <= 0) {
                core.setFailed(`Invalid target_issue: ${rawTargetIssue}`); return;
              }
              issueNumbers.push(targetIssueNumber);
            } else {
              let cursor = null;
              do {
                const result = await github.graphql(scanQuery, { owner, repo, cursor });
                const conn = result.repository.issues;
                for (const issue of conn.nodes || []) {
                  if (new Date(issue.updatedAt) >= cutoff) issueNumbers.push(issue.number);
                }
                cursor = conn.pageInfo.hasNextPage ? conn.pageInfo.endCursor : null;
              } while (cursor);
            }

            const seen = new Set();
            const candidates = issueNumbers.filter((n) => seen.has(n) ? false : (seen.add(n), true));

            let commented = 0, skipped = 0;
            for (const issueNum of candidates) {
              const result = await github.graphql(targetQuery, { owner, repo, number: issueNum });
              const issue = result.repository.issue;
              if (!issue || issue.state !== 'OPEN') continue;
              const mergedPRs = extractMergedPRs(issue);
              if (mergedPRs.length === 0) { skipped++; continue; }

              const body = commentBodyFor(issue, mergedPRs);
              const existing = await findExistingComment(issue.number);
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              }
              commented++;
            }

            await core.summary.addHeading('Recommend-only issue triage')
              .addRaw(`Lookback: ${lookbackDays} days | Candidates: ${candidates.length} | Comments: ${commented} | Skipped: ${skipped}\n`)
              .write();
