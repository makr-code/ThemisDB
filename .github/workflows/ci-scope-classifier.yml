name: CI Scope Classifier

# Reusable workflow that analyses changed files and exposes boolean outputs
# that downstream jobs use to decide whether to run.
#
# Usage in a calling workflow:
#
#   jobs:
#     ci-scope-classifier:
#       uses: ./.github/workflows/ci-scope-classifier.yml
#
#     my-job:
#       needs: ci-scope-classifier
#       if: needs.ci-scope-classifier.outputs.has_gpu_changes == 'true'
#       ...
#
# Outputs:
#   has_code_changes      – true when C++/CUDA/Python sources changed
#   has_security_changes  – true when src/security or src/auth changed
#   has_gpu_changes       – true when GPU module / geo-GPU files changed
#   has_llm_changes       – true when LLM / RAG / CUDA kernel files changed
#   has_doc_only_changes  – true when ONLY documentation changed (no code)
#   has_config_changes    – true when CMake / config / workflow files changed
#   has_grafana_changes   – true when Grafana dashboard JSON files changed
#
# See also:
#   .github/ci-scope-config.yaml  – path-pattern → scope mappings
#   .github/scripts/classify_ci_scope.py – classification logic

on:
  workflow_call:
    outputs:
      has_code_changes:
        description: "True if C++/CUDA/Python source files changed"
        value: ${{ jobs.classify.outputs.has_code_changes }}
      has_security_changes:
        description: "True if src/security or src/auth files changed"
        value: ${{ jobs.classify.outputs.has_security_changes }}
      has_gpu_changes:
        description: "True if GPU module or geo-GPU backend files changed"
        value: ${{ jobs.classify.outputs.has_gpu_changes }}
      has_llm_changes:
        description: "True if LLM/RAG/CUDA kernel files changed"
        value: ${{ jobs.classify.outputs.has_llm_changes }}
      has_doc_only_changes:
        description: "True if only documentation files changed (no code)"
        value: ${{ jobs.classify.outputs.has_doc_only_changes }}
      has_config_changes:
        description: "True if CMake/config/workflow files changed"
        value: ${{ jobs.classify.outputs.has_config_changes }}
      has_grafana_changes:
        description: "True if Grafana dashboard JSON files changed"
        value: ${{ jobs.classify.outputs.has_grafana_changes }}
  # Allow standalone manual runs for testing / debugging the classifier itself.
  workflow_dispatch:

jobs:
  classify:
    name: Classify CI Scope
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      has_code_changes:     ${{ steps.classify.outputs.has_code_changes }}
      has_security_changes: ${{ steps.classify.outputs.has_security_changes }}
      has_gpu_changes:      ${{ steps.classify.outputs.has_gpu_changes }}
      has_llm_changes:      ${{ steps.classify.outputs.has_llm_changes }}
      has_doc_only_changes: ${{ steps.classify.outputs.has_doc_only_changes }}
      has_config_changes:   ${{ steps.classify.outputs.has_config_changes }}
      has_grafana_changes:  ${{ steps.classify.outputs.has_grafana_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: changed-files
        run: |
          CHANGED_FILES_PATH="/tmp/changed_files.txt"

          if [ "${{ github.event_name }}" = "pull_request" ] || \
             [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # PR context: compare base ref with the PR head
            git diff --name-only \
              "origin/${{ github.base_ref }}" \
              HEAD \
              > "$CHANGED_FILES_PATH" 2>/dev/null || true

          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            # Handle the initial push (before SHA is all zeros)
            ZERO_SHA="0000000000000000000000000000000000000000"
            if [ "$BEFORE" = "$ZERO_SHA" ]; then
              git diff --name-only HEAD~1 HEAD \
                > "$CHANGED_FILES_PATH" 2>/dev/null || \
              git ls-files > "$CHANGED_FILES_PATH"
            else
              git diff --name-only "$BEFORE" "$AFTER" \
                > "$CHANGED_FILES_PATH" 2>/dev/null || \
              git diff --name-only HEAD~1 HEAD \
                > "$CHANGED_FILES_PATH"
            fi

          else
            # Manual trigger (workflow_dispatch) or unknown event:
            # treat as full-scope run by listing all tracked files.
            git ls-files > "$CHANGED_FILES_PATH"
          fi

          echo "changed_files_path=$CHANGED_FILES_PATH" >> "$GITHUB_OUTPUT"
          echo "Detected $(wc -l < "$CHANGED_FILES_PATH") changed file(s)."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run CI scope classifier
        id: classify
        run: |
          OUTPUTS_FILE="/tmp/ci_scope_outputs.env"

          python3 .github/scripts/classify_ci_scope.py \
            --config        .github/ci-scope-config.yaml \
            --changed-files "${{ steps.changed-files.outputs.changed_files_path }}" \
            --output-file   "$OUTPUTS_FILE"

          # Forward all key=value pairs to GITHUB_OUTPUT
          while IFS='=' read -r key value; do
            [ -n "$key" ] && echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done < "$OUTPUTS_FILE"
