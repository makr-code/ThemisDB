name: Chimera Benchmark CI

# Runs the CHIMERA suite benchmark harness (run_ci_benchmarks.py) and
# checks the results against stored baselines using the chimera regression
# detector (chimera_regression_detector.py).
#
# • Benchmarks run on every push and pull-request that touches chimera
#   sources, adapter code, benchmark harness files, or this workflow.
# • On push to main the baseline is updated and committed back to the repo
#   so future PRs have a fresh reference point.
# • On pull_request the workflow compares against the stored baseline and
#   fails if major (≥ 10 %) or critical (≥ 20 %) regressions are found.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/chimera/themisdb_adapter.cpp'
      - 'include/chimera/themisdb_adapter.hpp'
      - 'adapters/chimera/themisdb_adapter.hpp'
      - 'external/chimera/**'
      - 'benchmarks/baselines/chimera/**'
      - 'tests/chimera/**'
      - '.github/workflows/02-feature-modules_chimera_chimera-benchmark-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Run the CHIMERA benchmark harness then compare against the stored baseline.
  # ---------------------------------------------------------------------------
  chimera-benchmarks:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_chimera_changes == 'true'
    name: Chimera Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r external/chimera/requirements.txt
          pip install pytest

      - name: Run chimera regression detector unit tests
        run: |
          mkdir -p benchmark_results
          python3 -m pytest external/chimera/tests/benchmarks/test_chimera_regression_detector.py \
            -v --tb=short 2>&1 | tee benchmark_results/unit_test_results.log

      - name: Run CHIMERA benchmark harness
        run: |
          mkdir -p benchmark_results
          python3 external/chimera/run_ci_benchmarks.py \
            --output benchmark_results/chimera_results.json \
            --warmup 100 \
            --iterations 1000 \
            2>&1 | tee benchmark_results/chimera_run.log

      - name: Detect performance regressions
        shell: bash
        run: |
          python3 external/chimera/chimera_regression_detector.py \
            --baseline benchmarks/baselines/chimera/baseline.json \
            --current  benchmark_results/chimera_results.json \
            --output   benchmark_results/chimera_regression_report.txt \
            --fail-on  major \
            --threshold-minor    5.0 \
            --threshold-major   10.0 \
            --threshold-critical 20.0 \
            2>&1 | tee benchmark_results/regression_detector.log
          exit "${PIPESTATUS[0]}"

      - name: Upload benchmark results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-benchmark-results-${{ matrix.os }}
          path: |
            benchmark_results/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧪 Chimera Benchmark CI – Benchmarks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Steps" >> "$GITHUB_STEP_SUMMARY"
          echo "- Regression detector unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- CHIMERA benchmark harness (4 synthetic workloads)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Performance regression detection (minor ≥5%, major ≥10%, critical ≥20%)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark_results/chimera_regression_report.txt ]; then
            echo "### Regression Report" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            cat benchmark_results/chimera_regression_report.txt >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Commit updated baseline back to main after a successful benchmark run.
  # Runs only on main branch push to keep the reference point current.
  # ---------------------------------------------------------------------------
  update-baseline:
    name: Update Chimera Baseline
    needs: chimera-benchmarks
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.chimera-benchmarks.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Required to commit and push the updated baseline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download benchmark results artifact
        uses: actions/download-artifact@v4
        with:
          name: chimera-benchmark-results-ubuntu-22.04
          path: benchmark_results

      - name: Rebuild baseline from latest results
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone

          with open("benchmark_results/chimera_results.json") as f:
              raw = json.load(f)

          baseline = {
              "version":   open("VERSION").read().strip(),
              "branch":    "main",
              "commit":    os.environ["GITHUB_SHA"],
              "timestamp": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "workloads": raw.get("workloads", {}),
          }

          os.makedirs("benchmarks/baselines/chimera", exist_ok=True)
          out = "benchmarks/baselines/chimera/baseline.json"
          with open(out, "w") as f:
              json.dump(baseline, f, indent=2)
          n = len(baseline["workloads"])
          print(f"Baseline rebuilt: {out} ({n} workload(s))")
          PYEOF

      - name: Commit and push updated baseline
        shell: bash
        run: |
          git config user.name  'ThemisDB CI Bot'
          git config user.email 'bot@themisdb.local'
          git add benchmarks/baselines/chimera/baseline.json
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "chore(chimera): auto-update benchmark baseline [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Chimera baseline committed to main."
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧪 Chimera Benchmark CI – Update Baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline file: \`benchmarks/baselines/chimera/baseline.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Committed updated chimera benchmark baseline back to \`main\` (if changed)." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate job – all matrix legs must pass
  # ---------------------------------------------------------------------------
  benchmark-gate:
    name: Chimera Benchmark Gate
    needs: chimera-benchmarks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check benchmark status
        shell: bash
        run: |
          result="${{ needs.chimera-benchmarks.result }}"
          if [[ "$result" == "success" ]]; then
            echo "All chimera benchmarks passed – no blocking regressions."
          elif [[ "$result" == "skipped" ]]; then
            echo "Benchmarks skipped (no relevant changes detected)."
          else
            echo "Chimera benchmarks failed or detected blocking regressions."
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          result="${{ needs.chimera-benchmarks.result }}"
          echo "## 🧪 Chimera Benchmark CI – Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Benchmark result** | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
