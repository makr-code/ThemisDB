name: TSStore Out-of-Order Write CI

# Validates out-of-order write support with configurable late-arrival window
# (v1.8.0, Issue #1976).  Triggered on every push/PR that touches the relevant
# source files.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/timeseries/tsstore.h'
      - 'src/timeseries/tsstore.cpp'
      - 'include/timeseries/timeseries_metrics.h'
      - 'src/timeseries/timeseries_metrics.cpp'
      - 'tests/test_tsstore_out_of_order.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_tsstore-out-of-order-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the TSStoreOutOfOrder focused test suite.
  # Acceptance criteria covered:
  #   AC-OOO-1  Default window (0) accepts all timestamps regardless of order
  #   AC-OOO-2  In-order writes are always accepted when window is enabled
  #   AC-OOO-3  Out-of-order point within the window is accepted; counter incremented
  #   AC-OOO-4  Out-of-order point outside the window is rejected with
  #             ERR_TIMESERIES_LATE_ARRIVAL; counter incremented
  #   AC-OOO-5  Point exactly at window boundary is accepted
  #   AC-OOO-6  Point one millisecond outside the window is rejected
  #   AC-OOO-7  First write is always accepted (no prior watermark)
  #   AC-OOO-8  Watermarks are tracked independently per (metric, entity) pair
  #   AC-OOO-9  putDataPoints() batch respects the late-arrival window
  #   AC-OOO-10 Gorilla-compressed batch respects the late-arrival window
  #   AC-OOO-11 getOutOfOrderStats() counters accumulate correctly
  #   AC-OOO-12 Watermark advances when a newer timestamp is written
  #   AC-OOO-13 Accepted out-of-order points are queryable in time order
  # ---------------------------------------------------------------------------
  out-of-order-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: TSStore Out-of-Order (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run TSStoreOutOfOrderFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R TSStoreOutOfOrderFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee tsstore_ooo_ctest.txt

      # ── Full test filter via focused binary ───────────────────────────────
      - name: Run TSStoreOOOFixture tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_tsstore_out_of_order_focused \
            --gtest_filter="TSStoreOOOFixture*" \
            --gtest_output="xml:tsstore_ooo_gtest.xml" \
            2>&1 | tee tsstore_ooo_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsstore-out-of-order-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/tsstore_ooo_ctest.txt
            build/tsstore_ooo_gtest.xml
            build/tsstore_ooo_gtest_output.txt
          retention-days: 30
