name: Adaptive Join Strategies CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/query/adaptive_join.cpp'
      - 'include/query/adaptive_join.h'
      - 'tests/test_adaptive_join_strategies.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_adaptive-join-strategies-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/query/adaptive_join.cpp'
      - 'include/query/adaptive_join.h'
      - 'tests/test_adaptive_join_strategies.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_adaptive-join-strategies-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the AdaptiveJoinStrategies focused test suite.
  # Tests cover all five acceptance criteria (AC-1 to AC-5):
  #   AC-1  Hash Join: default for large equi-joins
  #   AC-2  Merge Join: both inputs sorted on join key
  #   AC-3  Nested Loop: left side < 1 000 rows
  #   AC-4  Index Nested Loop: right has index, left < 10 000 rows
  #   AC-5  Grace Hash: memory budget exceeded
  #
  # Additional coverage:
  #   - Broadcast / Shuffle join in distributed mode
  #   - estimateJoinCost cost model (hash, merge, nested loop, index NL, grace hash)
  #   - joinAlgorithmName helper
  #   - Filter predicate forwarded by all algorithms
  #   - Empty table edge cases
  #   - No-match equi-join returns empty result
  #   - AdaptiveJoinConfig thresholds respected
  # ---------------------------------------------------------------------------
  adaptive-join-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Adaptive Join tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libspdlog-dev libfmt-dev

      - name: Configure (adaptive join test targets)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: ''

      - name: Build AdaptiveJoin focused test binary
        run: cmake --build build --target test_adaptive_join_strategies_focused -- -j$(nproc)

      - name: Run AdaptiveJoin unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex AdaptiveJoinStrategiesFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee adaptive_join_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-join-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/adaptive_join_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔗 Adaptive Join Strategies – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "AdaptiveJoinExecutor: selectAlgorithm (HASH/MERGE/NESTED_LOOP/INDEX_NL/GRACE_HASH/BROADCAST/SHUFFLE), executeJoin, estimateJoinCost, filter forwarding, empty-table edge cases." >> "$GITHUB_STEP_SUMMARY"
