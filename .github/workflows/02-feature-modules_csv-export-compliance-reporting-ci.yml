name: CSV Export for Compliance Reports CI

# Validates CSV export for compliance reports (v1.8.0, Issue #4004).
# Covers:
#   AC-1  ComplianceReporter::exportReport(json, CSV) dispatches to
#         generateCSVFromJson() instead of logging an error.
#   AC-2  IComplianceReport::toCSV() pure-virtual interface satisfied by all
#         report structs (CcpaReport, AccessControlMatrix, ChangeHistoryReport,
#         PolicySummaryReport, ComplianceStatusReport, RiskAssessmentReport).
#   AC-3  CcpaReport::toCSV() column headers and field values.
#   AC-4  AccessControlMatrix::toCSV() column headers and delimiter escaping.
#   AC-5  ChangeHistoryReport::toCSV() column headers and delimiter escaping.

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/governance/compliance_reporting.h'
      - 'src/governance/compliance_reporting.cpp'
      - 'tests/test_compliance_reporting.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_csv-export-compliance-reporting-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/governance/compliance_reporting.h'
      - 'src/governance/compliance_reporting.cpp'
      - 'tests/test_compliance_reporting.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_csv-export-compliance-reporting-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  csv-export-compliance-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CSV Export Compliance (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run ComplianceReportingFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ComplianceReportingFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee csv_compliance_ctest.txt

      # ── CSV-export-specific filter ─────────────────────────────────────────
      - name: Run CsvExport tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_compliance_reporting_focused \
            --gtest_filter="ComplianceReportingTest.CsvExport_*" \
            --gtest_output="xml:csv_compliance_gtest.xml" \
            2>&1 | tee csv_compliance_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csv-compliance-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/csv_compliance_ctest.txt
            build/csv_compliance_gtest.xml
            build/csv_compliance_gtest_output.txt
          retention-days: 30
