name: "Maintenance: Build Error Issues"

# Rechenaufwand-Score: R=3 (K=3, L=3, N=3) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Aggregates build/docker errors from failed CI runs and creates consolidated GitHub issues.
# Triggered after build-mainline.yml or release-docker-image.yml workflows complete.

on:
  workflow_run:
    workflows: ["Build: Mainline", "Docker Image CI/CD"]
    types: [completed]
  schedule:
    - cron: '0 9 * * MON-FRI'  # Monday-Friday at 9:00 UTC
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: 'Minutes to look back for failed runs (default: 1440 = 24h)'
        required: false
        default: '1440'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-maintenance-build-issues-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-build-errors:
    name: 📋 Aggregate & Create Build Error Issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # v7.0.1

      - name: Post build failure comment on triggering PR
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.name == 'Docker Image CI/CD'
        uses: actions/github-script@v7  # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run) {
              core.info('No workflow_run payload — skipping PR comment.');
              return;
            }

            // Resolve PRs: prefer embedded pull_requests array, fall back to search by head SHA.
            let prNumbers = (run.pull_requests || []).map(pr => pr.number);
            if (prNumbers.length === 0 && run.head_sha) {
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 10,
              });
              const matched = prs.filter(pr => pr.head.sha === run.head_sha);
              prNumbers = matched.map(pr => pr.number);
            }

            if (prNumbers.length === 0) {
              core.info('No open PRs associated with triggering run — skipping PR comment.');
              return;
            }

            const workflowName = run.name || 'CI Build';
            const runUrl = run.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            const marker = '<!-- maintenance-build-issues-comment -->';

            const body = [
              marker,
              `## ❌ Build Failure Detected: ${workflowName}`,
              '',
              `**Workflow run:** [${run.run_number ? '#' + run.run_number : run.id}](${runUrl})`,
              `**Branch:** \`${run.head_branch || 'unknown'}\``,
              `**Commit:** \`${(run.head_sha || '').substring(0, 8)}\``,
              `**Triggered by:** ${run.triggering_actor ? '@' + run.triggering_actor.login : 'unknown'}`,
              '',
              '### What to do',
              '1. Open the [workflow run](' + runUrl + ') and expand the failed job.',
              '2. Download the `*-errors.json` artifact (if present) for structured error details.',
              '3. A tracking issue will be created automatically if this error is chronic (≥ 3 occurrences).',
              '',
              '> This comment is updated automatically on each failed run. Resolve the build failure to clear it.',
            ].join('\n');

            for (const prNumber of prNumbers) {
              const { data: comments } = await github.rest.issues.listComments({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  comment_id: existing.id,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                });
                core.info(`Updated PR #${prNumber} build failure comment.`);
              } else {
                await github.rest.issues.createComment({
                  issue_number: prNumber,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body,
                });
                core.info(`Created PR #${prNumber} build failure comment.`);
              }
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4  # v4
        with:
          node-version: '24'

      - name: Fetch failed workflow runs and error artifacts
        id: fetch
        uses: actions/github-script@v7  # v9.0.0
        env:
          LOOKBACK_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_minutes || '1440' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Determine look-back window
            let lookbackMs = 24 * 60 * 60 * 1000; // 24 hours default
            if (context.eventName === 'workflow_dispatch' && process.env.LOOKBACK_MINUTES) {
              lookbackMs = parseInt(process.env.LOOKBACK_MINUTES) * 60 * 1000;
            }
            
            const since = new Date(Date.now() - lookbackMs).toISOString();
            
            console.log('──────────────────────────────────────────────');
            console.log('Build Error Aggregation');
            console.log('──────────────────────────────────────────────');
            console.log(`Look-back: ${lookbackMs / 1000 / 60 / 60} hours`);
            console.log(`Since: ${since}`);
            
            // Fetch failed workflow runs
            const workflows = [
              'Build: Mainline',
              'Build: LLM Inferencing [TinyLlama + doku.db RAG + AdaLoRA]',
              'Docker Image CI/CD'
            ];
            const artifactDir = '/tmp/error-artifacts';
            if (!fs.existsSync(artifactDir)) {
              fs.mkdirSync(artifactDir, { recursive: true });
            }
            
            let downloadedCount = 0;
            let downloadedLogCount = 0;
            const changedSrcFiles = new Set();
            
            const repoWorkflows = await github.paginate(github.rest.actions.listRepoWorkflows, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            for (const workflowName of workflows) {
              const wf = repoWorkflows.find(w => w.name === workflowName);
              if (!wf) {
                console.log(`  ⏭️  Workflow not found: ${workflowName}`);
                continue;
              }
              
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf.id,
                status: 'completed',
                conclusion: 'failure',
                created: `>=${since}`,
                per_page: 15,
              });
              
              console.log(`  ${workflowName}: ${runs.workflow_runs.length} failed run(s)`);
              
              // Download error artifacts from each run
              for (const run of runs.workflow_runs) {
                try {
                  const { data: commit } = await github.rest.repos.getCommit({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: run.head_sha,
                    per_page: 100
                  });
                  for (const changed of (commit.files || [])) {
                    if (changed.filename && changed.filename.startsWith('src/')) {
                      changedSrcFiles.add(changed.filename);
                    }
                  }
                } catch (e) {
                  core.warning(`Failed to resolve changed files for run #${run.id}: ${e.message}`);
                }

                const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                
                const errorArtifacts = artifacts.artifacts.filter(a => 
                  a.name.includes('error') ||
                  a.name.includes('diagnostic') ||
                  a.name.startsWith('ctest-results')
                );
                
                for (const artifact of errorArtifacts) {
                  try {
                    console.log(`    📥 Downloading ${artifact.name} from run #${run.id}`);
                    
                    // Download the artifact zip using the authenticated GitHub API
                    const response = await github.request('GET /repos/{owner}/{repo}/actions/artifacts/{artifact_id}/zip', {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      artifact_id: artifact.id,
                      request: { redirect: 'follow' },
                    });
                    
                    // response.data is an ArrayBuffer when redirect is followed
                    const zipPath = path.join(artifactDir, `${artifact.name}-${run.id}.zip`);
                    fs.writeFileSync(zipPath, Buffer.from(response.data));
                    
                    // Extract zip to a named subdirectory
                    const extractDir = path.join(artifactDir, `${artifact.name}-${run.id}`);
                    fs.mkdirSync(extractDir, { recursive: true });
                    
                    const { execSync } = require('child_process');
                    execSync(`unzip -o "${zipPath}" -d "${extractDir}"`, { stdio: 'pipe' });
                    
                    // Write metadata alongside extracted files
                    fs.writeFileSync(
                      path.join(extractDir, `_metadata.json`),
                      JSON.stringify({
                        name: artifact.name,
                        run_id: run.id,
                        run_number: run.run_number,
                        workflow: workflowName,
                        created_at: run.created_at,
                      }, null, 2)
                    );
                    
                    downloadedCount++;
                  } catch (e) {
                    core.warning(`Failed to download artifact: ${artifact.name} — ${e.message}`);
                  }
                }

                try {
                  console.log(`    📥 Downloading run logs for run #${run.id}`);
                  const logsResponse = await github.request('GET /repos/{owner}/{repo}/actions/runs/{run_id}/logs', {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                    request: { redirect: 'follow' },
                  });

                  const logsZipPath = path.join(artifactDir, `run-logs-${run.id}.zip`);
                  fs.writeFileSync(logsZipPath, Buffer.from(logsResponse.data));

                  const logsExtractDir = path.join(artifactDir, `run-logs-${run.id}`);
                  fs.mkdirSync(logsExtractDir, { recursive: true });
                  const { execSync } = require('child_process');
                  execSync(`unzip -o "${logsZipPath}" -d "${logsExtractDir}"`, { stdio: 'pipe' });

                  fs.writeFileSync(
                    path.join(logsExtractDir, `_metadata.json`),
                    JSON.stringify({
                      name: `run-logs-${run.id}`,
                      run_id: run.id,
                      run_number: run.run_number,
                      workflow: workflowName,
                      created_at: run.created_at,
                    }, null, 2)
                  );

                  downloadedLogCount++;
                } catch (e) {
                  core.warning(`Failed to download run logs for #${run.id}: ${e.message}`);
                }
              }
            }
            
            console.log(`  Downloaded: ${downloadedCount} artifact(s)`);
            console.log(`  Downloaded: ${downloadedLogCount} run log bundle(s)`);
            console.log(`  Changed src files in failed runs: ${changedSrcFiles.size}`);

            const changedSrcFileList = Array.from(changedSrcFiles).sort();
            fs.writeFileSync(
              path.join(artifactDir, 'changed-src-files.json'),
              JSON.stringify(changedSrcFileList, null, 2)
            );
            
            core.setOutput('artifact_count', downloadedCount);
            core.setOutput('log_count', downloadedLogCount);
            core.setOutput('changed_src_file_count', changedSrcFileList.length);
            core.setOutput('has_artifacts', (downloadedCount > 0 || downloadedLogCount > 0) ? 'true' : 'false');
            core.setOutput('artifact_dir', artifactDir);

      - name: Aggregate errors from artifacts
        id: aggregate
        shell: bash
        env:
          ERROR_ARTIFACTS_DIR: /tmp/error-artifacts
          OUTPUT_FILE: /tmp/aggregated-errors.md
          GROUPED_OUTPUT_FILE: /tmp/aggregated-errors-by-module-file.json
          MAX_GROUPS_IN_REPORT: '30'
          MAX_ITEMS_PER_GROUP_IN_REPORT: '4'
          MAX_MARKDOWN_CHARS: '45000'
        run: |
          node "${{ github.workspace }}/.github/scripts/aggregate-build-errors.js"
          
          # Output the markdown for use in next steps
          if [ -f /tmp/aggregated-errors.md ]; then
            {
              echo 'report_markdown<<EOF'
              cat /tmp/aggregated-errors.md
              echo EOF
            } >> "$GITHUB_OUTPUT"
          fi

          if [ -f /tmp/aggregated-errors-by-module-file.json ]; then
            echo "grouped_json_file=/tmp/aggregated-errors-by-module-file.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure single chronic build failure issue
        if: steps.aggregate.outputs.chronic_errors > 0
        id: chronic-issue
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '🔴 Chronic Build Failures — Error Report'
          issue-marker: '<!-- ci-build:type:chronic-error-report -->'
          issue-body: |
            <!-- ci-build:type:chronic-error-report -->
            ## Build Error Aggregation Report
            
            **Aggregation Period**: Last 24 hours  
            **Latest Aggregation Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ### Debugging Tips
            1. **Navigate to Actions tab** → Find the failed workflow run
            2. **Download artifacts**: Look for `*-errors.json` files
            3. **Review error details**: Each error includes file, line, and message
            4. **Search codebase**: Find similar issues via grep or IDE symbol search
            5. **Check CI logs**: Full build logs available in workflow run details
            
            ---
            
            **Labels**: `ci/failure,ci/build-error`  
            **Severity**: High (blocking builds)  
            **Priority**: Address chronic errors immediately  
            _Neue Build-Fehler werden als Kommentare an dieses Issue angehängt._
          labels-to-add: 'ci/failure,ci/build-error,maintenance'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Append latest chronic build errors as issue comment
        if: steps.aggregate.outputs.chronic_errors > 0
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-number: ${{ steps.chronic-issue.outputs.issue-number }}
          issue-body: |
            ## 📎 Neuer Build-Fehlerreport

            **Generated**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ${{ steps.aggregate.outputs.report_markdown }}
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Send Slack notification for chronic errors
        if: steps.aggregate.outputs.chronic_errors > 0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: ./.github/actions/notify-chronic-errors
        with:
          error-report-file: /tmp/aggregated-errors.md
          webhook-url: ${{ env.SLACK_WEBHOOK_URL }}
          chronic-threshold: '3'
          include-remediation-hints: 'true'
        continue-on-error: true

      - name: Send Discord notification for chronic errors
        if: steps.aggregate.outputs.chronic_errors > 0
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        uses: ./.github/actions/notify-chronic-errors
        with:
          error-report-file: /tmp/aggregated-errors.md
          webhook-url: ${{ env.DISCORD_WEBHOOK_URL }}
          chronic-threshold: '3'
          include-remediation-hints: 'true'
        continue-on-error: true

      - name: Print error aggregation summary
        if: always()
        run: |
          echo "──────────────────────────────────────────────"
          echo "  Build Error Aggregation Complete"
          echo "──────────────────────────────────────────────"
          echo "Total unique errors: ${{ steps.aggregate.outputs.total_errors }}"
          echo "Chronic errors (≥3x): ${{ steps.aggregate.outputs.chronic_errors }}"
          echo "Module/file groups: ${{ steps.aggregate.outputs.module_file_groups }}"
          if [ -f /tmp/aggregated-errors.md ]; then
            echo ""
            echo "Aggregated Report:"
            head -50 /tmp/aggregated-errors.md
            echo "... (see full report in GitHub issue)"
          fi
          echo "──────────────────────────────────────────────"

      - name: Collect error metrics for Prometheus/Grafana
        if: always()
        shell: bash
        env:
          ERROR_ARTIFACTS_DIR: /tmp/error-artifacts
          METRICS_DIR: /tmp/error-metrics
          OUTPUT_FORMAT: json,prometheus,markdown
        run: |
          mkdir -p /tmp/error-metrics
          node ${{ github.workspace }}/.github/scripts/collect-build-metrics.js

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-metrics
          path: /tmp/error-metrics/
          retention-days: 30

      - name: Publish Error Dashboard
        if: always() && steps.fetch.outputs.has_artifacts == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: ./.github/actions/publish-error-dashboard
        with:
          metrics-artifact: error-metrics
          create-issue: 'false'
          dashboard-title: '📊 Build Error Dashboard — Run #${{ github.run_number }}'
          send-slack: ${{ env.SLACK_WEBHOOK_URL != '' }}
          slack-webhook: ${{ env.SLACK_WEBHOOK_URL }}
        continue-on-error: true
