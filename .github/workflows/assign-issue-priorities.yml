name: Assign Issue Priorities

# Manually triggered via the GitHub Actions UI or GitHub CLI.
# Reads every open issue that has no priority:* label and assigns one based on
# signals in the title, body, and existing labels (roadmap phase markers,
# severity field, P0/P1 prefixes, issue type, etc.).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (show what would change, no writes)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      create_labels:
        description: 'Create missing priority:* labels before processing'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      verbose:
        description: 'Verbose output (one line per issue)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  issues: write   # add labels to issues
  contents: read

jobs:
  assign-priorities:
    name: Assign priority labels to unprioritised issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build flags
        id: flags
        run: |
          FLAGS=""
          [ "${{ github.event.inputs.dry_run }}"      = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "${{ github.event.inputs.create_labels }}" = "true" ] && FLAGS="$FLAGS --create-labels"
          [ "${{ github.event.inputs.verbose }}"       = "true" ] && FLAGS="$FLAGS --verbose"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run priority assignment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/assign-issue-priorities.py ${{ steps.flags.outputs.flags }}

      - name: Write job summary
        if: always()
        run: |
          echo "## 🏷️ Issue Priority Assignment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Create labels | ${{ github.event.inputs.create_labels }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verbose | ${{ github.event.inputs.verbose }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Timestamp | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
