name: "Gate: Workflow Guidelines Compliance"

# Automated validation of workflow compliance with WORKFLOW_GUIDELINES.md
# Runs on: 
#   - Every PR that modifies .github/workflows/*.yml
#   - Scheduled nightly to detect drift in existing workflows
#   - Manual dispatch for ad-hoc verification

on:
  pull_request:
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - '.github/workflows/*.yml'
      - '.github/WORKFLOW_GUIDELINES.md'
      - '.github/WORKFLOW_REGISTRY.md'
      - '.github/actions/write-run-summary/action.yml'
      - '.github/workflows/gate-workflow-guidelines.yml'
  schedule:
    - cron: '0 2 * * *'  # Daily 02:00 UTC
  workflow_dispatch:
    inputs:
      scope:
        description: 'Validation scope (all|changed|registry-sync)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - changed
          - registry-sync

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gate-workflow-guidelines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflow-guidelines:
    name: "Validate: Workflow Guidelines Compliance Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate workflow syntax with actionlint
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:latest -color

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
        with:
          python-version: '3.11'

      - name: Run workflow guidelines validation
        id: validate
        shell: python
        env:
          SCOPE: ${{ inputs.scope || (github.event_name == 'pull_request' && 'changed') || 'all' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          import os
          import re
          import glob
          import sys
          import json
          import subprocess

          scope = os.environ.get('SCOPE', 'all')
          pr_number = os.environ.get('PR_NUMBER', '')

          # Get list of workflows to validate
          if scope == 'changed' and pr_number:
              # Use PR base/head SHAs from event payload to compute diff range
              event_path = os.environ.get('GITHUB_EVENT_PATH', '')
              base_sha = ''
              head_sha = ''
              if event_path and os.path.exists(event_path):
                  with open(event_path, 'r') as ef:
                      event = json.load(ef)
                  base_sha = event.get('pull_request', {}).get('base', {}).get('sha', '')
                  head_sha = event.get('pull_request', {}).get('head', {}).get('sha', '')

              if base_sha and head_sha:
                  result = subprocess.run(
                      ['git', 'diff', '--name-only', f'{base_sha}...{head_sha}'],
                      capture_output=True,
                      text=True,
                      cwd='.'
                  )
              else:
                  # Fallback: validate all workflows when diff range is unavailable
                  result = subprocess.run(
                      ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD'],
                      capture_output=True,
                      text=True,
                      cwd='.'
                  )
              changed_files = [f for f in result.stdout.split('\n') if f.startswith('.github/workflows/')]
              workflows = [f for f in changed_files if f.endswith('.yml')]
              if not workflows:
                  # No workflow files changed or diff unavailable – fall back to all
                  workflows = glob.glob('.github/workflows/*.yml')
          else:
              # All workflows
              workflows = glob.glob('.github/workflows/*.yml')

          violations = []
          warnings = []

          print(f"Validating {len(workflows)} workflows (scope={scope})")

          for wf in sorted(workflows):
              with open(wf, 'r') as f:
                  content = f.read()
              wf_name = os.path.basename(wf)

              # Check 1: Naming convention (Build:, Gate:, Release:, Maintenance:, Security:, Compliance:, Edition:, Automation:, Wiki:, Reusable:)
              # Accept quoted (name: "..." / name: '...') and unquoted (name: ...) values
              name_match = re.search(r'^name:\s*["\']?([^"\'#\n]+?)["\']?\s*(?:#.*)?$', content, re.MULTILINE)
              if name_match:
                  name = name_match.group(1).strip()
                  valid_prefixes = ('Build:', 'Gate:', 'Release:', 'Maintenance:', 'Security:', 'Compliance:', 'Edition:', 'Automation:', 'Wiki:', 'Reusable:', 'Publish:', 'Benchmark:', 'Governance:')
                  if not name.startswith(valid_prefixes):
                      violations.append(f"{wf_name}: Invalid workflow name prefix. Name must start with one of {valid_prefixes}")
              else:
                  violations.append(f"{wf_name}: Missing or unparseable 'name:' field")

              # Check 2: Concurrency must be defined
              if 'concurrency:' not in content:
                  warnings.append(f"{wf_name}: Missing concurrency block (recommended for all workflows)")

              # Workflow-level concurrency controls whole runs; only warn when
              # release, scheduled, or reusable work can cancel without a PR trigger.
              trigger_match = re.search(
                  r'^on:\s*(?:#.*)?\n((?:^[ \t]+.*\n|^[ \t]*\n)*)',
                  content,
                  re.MULTILINE,
              )
              trigger_block = trigger_match.group(1) if trigger_match else ''
              events = set(re.findall(r'^  ([a-z_]+):', trigger_block, re.MULTILINE))
              inline_trigger = re.search(r'^on:\s*\[([^\]]+)\]', content, re.MULTILINE)
              if inline_trigger:
                  events.update(re.findall(r'[a-z_]+', inline_trigger.group(1)))
              concurrency_match = re.search(
                  r'^concurrency:\s*(?:#.*)?\n((?:^[ \t]+.*\n|^[ \t]*\n)*)',
                  content,
                  re.MULTILINE,
              )
              concurrency_block = concurrency_match.group(1) if concurrency_match else ''
              cancels_runs = re.search(
                  r'^  cancel-in-progress:\s*true(?:\s+#.*)?$',
                  concurrency_block,
                  re.MULTILINE,
              )
              has_pr_trigger = bool({'pull_request', 'pull_request_target'} & events)
              protected_events = {'release', 'schedule', 'workflow_call'} & events
              dispatch_only = (
                  'workflow_dispatch' in events
                  and not ({'pull_request', 'pull_request_target', 'push'} & events)
              )
              if cancels_runs and not has_pr_trigger and (protected_events or dispatch_only):
                  warnings.append(
                      f"{wf_name}: cancel-in-progress: true can interrupt "
                      "release, scheduled, reusable, or dispatch-only work"
                  )

              # Check 5: Tier 1 third-party actions require immutable commit SHAs.
              tier1_actions = (
                  'github/codeql-action',
                  'aquasecurity/fortify-action',
                  'fortify/github-action',
                  'github/security-consolidation',
                  'softprops/action-gh-release',
              )
              unpinned_tier1 = []
              for action_spec in re.findall(
                  r'^\s*uses:\s*([^\s#]+)',
                  content,
                  re.MULTILINE,
              ):
                  if '@' not in action_spec:
                      continue
                  action, ref = action_spec.rsplit('@', 1)
                  if any(
                      action == tier1 or action.startswith(tier1 + '/')
                      for tier1 in tier1_actions
                  ) and not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                      unpinned_tier1.append(action_spec)
              if unpinned_tier1:
                  warnings.append(
                      f"{wf_name}: Tier 1 actions require full SHA pins: "
                      + ', '.join(unpinned_tier1)
                  )

              # Check 6: Trigger policy - push tags must have branches guard
              if 'push:' in content and 'tags:' in content:
                  # Extract push section
                  push_match = re.search(r'push:\s*\n((?:  [^\n]+\n)*)', content, re.MULTILINE)
                  if push_match:
                      push_section = push_match.group(1)
                      if 'tags:' in push_section and 'branches:' not in push_section:
                          violations.append(f"{wf_name}: push.tags trigger without branches guard (security risk: any branch can trigger release)")

              # Check 7: gh pr create must not pass boolean values to --draft
              # Valid CLI usage for gh pr create is either '--draft' or omit the flag.
              invalid_pr_create_draft_bool = False
              lines = content.splitlines()
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if re.search(r'\bgh\s+pr\s+create\b', line, re.IGNORECASE):
                      command = line.strip()
                      while command.rstrip().endswith('\\') and i + 1 < len(lines):
                          i += 1
                          command += ' ' + lines[i].strip()
                      if re.search(r'--draft(?:\s+|=)(?:true|false)(?=$|\s|[;|&])', command, re.IGNORECASE):
                          invalid_pr_create_draft_bool = True
                          break
                  i += 1
              if invalid_pr_create_draft_bool:
                  violations.append(f"{wf_name}: invalid 'gh pr create --draft <bool>' usage (use '--draft' flag only, or omit it)")

          # Check 8: Registry sync
          with open('.github/WORKFLOW_REGISTRY.md', 'r') as f:
              registry = f.read()
          documented = set(re.findall(r'\`([a-z0-9_-]+\.yml)\`', registry))
          actual = set(os.path.basename(wf) for wf in glob.glob('.github/workflows/*.yml'))
          missing = actual - documented
          if missing:
              violations.append(f"Registry Sync: {len(missing)} workflows not documented: {', '.join(sorted(missing))}")
          stale = documented - actual
          if stale:
              violations.append(f"Registry Sync: {len(stale)} stale workflow references: {', '.join(sorted(stale))}")

          # Check 9: Workflow run summaries
          for wf in glob.glob('.github/workflows/*.yml'):
              with open(wf, 'r') as f:
                  content = f.read()
              if 'GITHUB_STEP_SUMMARY' not in content and './.github/actions/write-run-summary' not in content:
                  violations.append(f"{os.path.basename(wf)}: workflow must write a GITHUB_STEP_SUMMARY")

          # Output results
          print(f"\n{'=' * 60}")
          print("VALIDATION RESULTS")
          print("=" * 60)
          
          if violations:
              print(f"\n❌ VIOLATIONS ({len(violations)}):")
              for v in violations:
                  print(f"   - {v}")
          
          if warnings:
              print(f"\n⚠️  WARNINGS ({len(warnings)}):")
              for w in warnings[:5]:  # Limit output
                  print(f"   - {w}")
              if len(warnings) > 5:
                  print(f"   ... and {len(warnings) - 5} more warnings")
          
          if not violations:
              print("\n✅ All workflows compliant with WORKFLOW_GUIDELINES.md")
          
          # Set output
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"violations={len(violations)}\n")
              f.write(f"warnings={len(warnings)}\n")

          sys.exit(1 if violations else 0)

      - name: Comment on PR
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const violations = ${{ steps.validate.outputs.violations || '0' }};
            const warnings = ${{ steps.validate.outputs.warnings || '0' }};
            
            let status = '✅ PASS';
            if (violations > 0) {
              status = '❌ FAIL';
            } else if (warnings > 0) {
              status = '⚠️  WARNINGS';
            }
            
            const body = `## Workflow Guidelines Compliance ${status}
            
            - **Violations**: ${violations}
            - **Warnings**: ${warnings}
            
            See the job logs for details.
            
            **Reference**: [WORKFLOW_GUIDELINES.md](.github/WORKFLOW_GUIDELINES.md)`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail on violations
        if: failure()
        run: |
          echo "❌ Workflow guidelines validation failed"
          echo "See step 'Run workflow guidelines validation' for details"
          exit 1
