name: src/include ↔ docs/de Alignment Check

# One-step content alignment between the source modules in src/ + include/
# and the German primary documentation in docs/de/.
#
# For every top-level module directory found under src/ or include/ the
# script checks whether:
#   - A docs/de/<module>/ directory exists
#   - The directory contains at least one human-authored .md file
#     (i.e. something beyond the auto-generated PRIMARY_SOURCES.md)
#
# Outputs:
#   - Text report to the GitHub Actions step summary
#   - JSON report uploaded as a workflow artifact
#   - GITHUB_OUTPUT variables: total_modules, documented_modules,
#     undocumented_modules, coverage_pct
#
# Triggers:
#   - Push to develop/community that touches src/, include/, or docs/de/
#   - Any pull_request touching those paths
#   - Weekly schedule (Mondays 05:00 UTC)
#   - Manual dispatch

on:
  push:
    branches: [develop, community]
    paths:
      - 'src/*/**'
      - 'include/*/**'
      - 'docs/de/**'
      - 'scripts/src-include-docs-align.py'
      - '.github/workflows/08-maintenance_src-include-docs-align.yml'
  pull_request:
    branches: [develop, community]
    paths:
      - 'src/*/**'
      - 'include/*/**'
      - 'docs/de/**'
      - 'scripts/src-include-docs-align.py'
      - '.github/workflows/08-maintenance_src-include-docs-align.yml'
  schedule:
    - cron: '0 5 * * 1'   # Weekly on Monday at 05:00 UTC
  workflow_dispatch:
    inputs:
      fail_on_gaps:
        description: 'Fail the workflow when undocumented modules are found'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  align:
    name: src/include ↔ docs/de Alignment
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Run alignment script (text report → step summary) ──────────────
      #
      # When --fail-on-gaps is requested the script exits 1 on gaps, which
      # propagates as a genuine step failure (no continue-on-error here).
      # Subsequent steps use `if: always()` so the JSON report and artifact
      # upload still run even when this step fails.
      - name: Run src/include ↔ docs/de alignment check
        id: align
        run: |
          FAIL_FLAG=""
          if [ "${{ inputs.fail_on_gaps }}" = "true" ]; then
            FAIL_FLAG="--fail-on-gaps"
          fi

          python3 scripts/src-include-docs-align.py \
            --format text \
            --output /tmp/align-report.txt \
            $FAIL_FLAG

      # ── 4. JSON report ────────────────────────────────────────────────────
      - name: Generate JSON alignment report
        if: always()
        run: |
          python3 scripts/src-include-docs-align.py \
            --format json \
            --output /tmp/align-report.json \
            --quiet
        continue-on-error: true

      # ── 5. Upload artifact ────────────────────────────────────────────────
      - name: Upload alignment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: src-include-docs-align-${{ github.run_number }}
          path: |
            /tmp/align-report.txt
            /tmp/align-report.json
          retention-days: 30
          if-no-files-found: ignore

      # ── 6. Step summary ───────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## src/include ↔ docs/de Alignment Check"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| **Script** | \`scripts/src-include-docs-align.py\` |"
            echo "| **Docs dir** | \`docs/de/\` |"
            echo "| **Event** | \`${{ github.event_name }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            if [ -f /tmp/align-report.json ]; then
              TOTAL=$(python3 -c "import json,sys; d=json.load(open('/tmp/align-report.json')); print(d['summary']['total_modules'])" 2>/dev/null || echo "n/a")
              DOCUMENTED=$(python3 -c "import json,sys; d=json.load(open('/tmp/align-report.json')); print(d['summary']['documented'])" 2>/dev/null || echo "n/a")
              UNDOC=$(python3 -c "import json,sys; d=json.load(open('/tmp/align-report.json')); print(d['summary']['undocumented'])" 2>/dev/null || echo "n/a")
              PCT=$(python3 -c "import json,sys; d=json.load(open('/tmp/align-report.json')); print(d['summary']['coverage_pct'])" 2>/dev/null || echo "n/a")
              echo "| **Total modules** | ${TOTAL} |"
              echo "| **Documented** | ${DOCUMENTED} |"
              echo "| **Undocumented** | ${UNDOC} |"
              echo "| **Coverage** | ${PCT}% |"
            fi
            echo ""

            if [ -f /tmp/align-report.txt ]; then
              echo "**Text Report:**"
              echo '```'
              cat /tmp/align-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
