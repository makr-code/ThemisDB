name: "Benchmark: Wave 4 Smoke (not a performance gate)"

on:
  pull_request:
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'benchmarks/wave4/**'
      - 'benchmarks/tests/test_wave4_smoke_completeness.py'
      - 'CMakeLists.txt'
      - 'benchmarks/wave4/release_gate_manifest.json'
      - '.github/workflows/benchmark-gate.yml'
      - '.github/workflows/reusable-cmake-build.yml'
      - 'tools/ci/validate_benchmark_smoke.py'
  push:
    branches:
      - develop
      - community
      - 'release/**'
    paths:
      - 'benchmarks/**'
      - 'CMakeLists.txt'
      - 'benchmarks/wave4/release_gate_manifest.json'
      - '.github/workflows/benchmark-gate.yml'
      - '.github/workflows/reusable-cmake-build.yml'
      - 'tools/ci/validate_benchmark_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [build-wave4-release-gates, run-wave4-release-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Wave 4 smoke only; not a performance or release gate"
          job-results: ${{ toJSON(needs) }}

  build-wave4-release-gates:
    name: "Build and run: Wave 4 smoke"
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: ubuntu-24.04
      # Cold vcpkg dependency builds exceeded the previous budget during gRPC configuration.
      timeout_minutes: '180'
      fetch_depth: '1'
      setup_command: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          ninja-build \
          autoconf \
          autoconf-archive \
          automake \
          libkrb5-dev \
          libtool
        git submodule sync -- vcpkg
        git submodule update --init --depth 1 vcpkg
        test -f vcpkg/scripts/buildsystems/vcpkg.cmake || {
          echo "::error::vcpkg toolchain missing after submodule initialization"
          exit 1
        }
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      preset: linux-release
      build_targets: bench_w4a_release_gates
      configure_command: cmake --preset linux-release -B build-linux-release -DTHEMIS_BUILD_BENCHMARKS=ON
      build_command: cmake --build build-linux-release --target bench_w4a_release_gates --parallel 2
      validation_command: |
        set -euo pipefail
        mkdir -p benchmark-artifacts
        BENCHMARK_SEED=42 ./build-linux-release/bin/bench_w4a_release_gates \
          --benchmark_filter='W4A' \
          --benchmark_out=benchmark-artifacts/w4a_release_gates.json \
          --benchmark_out_format=json \
          --benchmark_repetitions=5
      artifact_name: wave4-gate-results-${{ github.run_number }}
      artifact_paths: benchmark-artifacts/w4a_release_gates.json
      artifact_retention_days: '7'
      summary_title: "Build and run: Wave 4 smoke (not performance evidence)"

  run-wave4-release-gates:
    name: "Validate: Wave 4 smoke artifact"
    needs: [build-wave4-release-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download benchmark results
        uses: actions/download-artifact@v5
        with:
          name: wave4-gate-results-${{ github.run_number }}
          path: benchmark-artifacts

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'

      - name: Verify the W4A smoke contract matches source and invocation
        run: python3 benchmarks/tests/test_wave4_smoke_completeness.py

      - name: Validate complete W4A smoke execution
        run: |
          python3 benchmarks/wave4/validate_smoke.py \
            --input benchmark-artifacts/w4a_release_gates.json \
            --contract benchmarks/wave4/smoke_contract.json

      - name: Validate smoke results and report diagnostics
        run: |
          set -euo pipefail
          echo "::notice::Smoke only: no performance or release gate is active."
          python3 tools/ci/validate_benchmark_smoke.py benchmark-artifacts/w4a_release_gates.json \
            --wave4-manifest benchmarks/wave4/release_gate_manifest.json
          python3 benchmarks/wave4/report_variance.py \
            --input benchmark-artifacts/w4a_release_gates.json \
            --no-gates \
            --output benchmark-artifacts/w4a_gate_report.json

      - name: Upload benchmark evidence artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wave4-benchmark-evidence
          path: benchmark-artifacts/
          if-no-files-found: error
          retention-days: 30
