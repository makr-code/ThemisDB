name: "Release: Docker Approval Gate"

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read
  packages: write
  actions: write

concurrency:
  group: docker-publish-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  docker_publish_from_issue:
    name: "Publish: Docker Images on Approval Comment"
    if: |
      contains(github.event.issue.labels.*.name, 'docker-release') &&
      (
        contains(github.event.comment.body, '/publish-docker') ||
        contains(github.event.comment.body, '/approve-docker') ||
        contains(github.event.comment.body, '@publish-docker') ||
        contains(github.event.comment.body, '/hold-docker') ||
        contains(github.event.comment.body, '/pause-docker') ||
        contains(github.event.comment.body, '/reject-docker') ||
        contains(github.event.comment.body, '/cancel-docker') ||
        contains(github.event.comment.body, '/rollback-docker')
      )
    uses: ./.github/workflows/reusable-release-approval-comment-gate.yml
    with:
      issue_label: docker-release
      match_regex: "/publish-docker\\b|/approve-docker\\b|@publish-docker\\b|/hold-docker\\b|/pause-docker\\b|/reject-docker\\b|/cancel-docker\\b|/rollback-docker\\b"
      hold_regex: "/hold-docker\\b|/pause-docker\\b"
      reject_regex: "/reject-docker\\b|/cancel-docker\\b"
      rollback_regex: "/rollback-docker\\b"
      subject: "Docker Publication"
      environment_name: docker-production
      environment_url: https://github.com/${{ github.repository }}/actions/workflows/release-docker-approval.yml
      target_workflow_id: release-docker-image.yml
      target_ref: develop
      dispatch_inputs_json: '{"push_to_registry":"true","registry":"ghcr.io","include_tinyllama":"true","llm_model":"tinyllama"}'
      version_input_name: tag_name
      approved_label: docker-approved
      approval_note: |
        Monitor `release-docker-image.yml` for registry publication.

  summary:
    name: "Validate: Wrapper Summary"
    runs-on: ubuntu-latest
    needs: [docker_publish_from_issue]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## Validate: Release Docker Approval Wrapper"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| docker_publish_from_issue | ${{ needs.docker_publish_from_issue.result }} |"
            echo "| Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
