name: Create Docs-Audit Issues

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (print issues without creating them)'
        required: false
        default: 'true'
        type: boolean

permissions:
  issues: write
  contents: read

jobs:
  create-docs-audit-issues:
    name: Create Docs-Audit Issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create docs-audit issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          python .github/scripts/create-docs-audit-issues.py
