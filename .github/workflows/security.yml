name: Security Scans

on:
  pull_request:
    branches:
      - develop
      - community
    paths:
      - 'src/server/**'
      - 'src/auth/**'
      - 'src/governance/**'
      - 'include/server/**'
      - 'include/auth/**'
      - 'include/governance/**'
      - 'deploy/kubernetes/**'
      - 'vcpkg.json'
      - '.gitleaks.toml'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy scan (human-readable summary)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Run Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks and generate SARIF
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Publish scanned files summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif_path = Path("gitleaks.sarif")
          files = 0
          results = 0
          if sarif_path.exists():
              data = json.loads(sarif_path.read_text(encoding="utf-8"))
              runs = data.get("runs", [])
              if runs:
                  invocations = runs[0].get("invocations", [])
                  if invocations:
                      files = invocations[0].get("properties", {}).get("filesScanned", 0) or 0
                  results = len(runs[0].get("results", []))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("### Gitleaks Scan Summary\n")
                  f.write(f"- Files scanned: **{files}**\n")
                  f.write(f"- Findings: **{results}**\n")
          else:
              print(f"Files scanned: {files}")
              print(f"Findings: {results}")
          PY
