name: 'Security Scanning'

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  schedule:
    # Weekly security scan on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      scanner:
        description: 'Scanner to run'
        required: false
        type: choice
        options:
          - all
          - codeql
          - trivy
          - gitleaks
          - cppcheck
        default: 'all'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read
  issues: write

jobs:
  security-scan:
    name: Security Analysis
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      scanner-type: ${{ inputs.scanner || 'all' }}
      upload-sarif: true
      create-issues: ${{ github.event_name == 'schedule' }}
      severity-threshold: 'medium'
    secrets: inherit

  # Additional license compliance check
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check license policy
        run: |
          echo "## 📄 License Compliance Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f ".license-policy.json" ]; then
            echo "✅ License policy file found" >> $GITHUB_STEP_SUMMARY
            
            if command -v jq &> /dev/null && [ -f "vcpkg.json" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Allowed Licenses" >> $GITHUB_STEP_SUMMARY
              jq -r '.policy.allowed[]' .license-policy.json | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
              
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Dependencies" >> $GITHUB_STEP_SUMMARY
              jq -r '.dependencies[] | if type == "string" then "- \(.)" else "- \(.name)" end' vcpkg.json >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ License policy file not found" >> $GITHUB_STEP_SUMMARY
          fi

  # Dependency audit
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan dependencies
        run: |
          trivy fs --scanners vuln \
            --format table \
            --severity HIGH,CRITICAL \
            . > dependency-audit.txt || true
          
          echo "## 🔍 Dependency Audit Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -100 dependency-audit.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.txt
          retention-days: 30

  # Security summary
  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-scan, license-compliance, dependency-audit]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License Compliance | ${{ needs.license-compliance.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
