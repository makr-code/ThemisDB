name: Erasure Coding for Blob Storage CI

# Triggered on every push / PR that touches ErasureCodingBackend sources,
# its tests, the BlobRedundancyManager, or this workflow itself.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/storage/erasure_coding_backend.cpp'
      - 'include/storage/erasure_coding_backend.h'
      - 'src/storage/blob_redundancy_manager.cpp'
      - 'include/storage/blob_redundancy_manager.h'
      - 'src/sharding/redundancy_strategy.cpp'
      - 'include/sharding/redundancy_strategy.h'
      - 'tests/test_erasure_coding_backend.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_erasure-coding-blob-storage-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ErasureCodingFocusedTests suite.
  #
  # Tests cover:
  #   - RS(10,4): 10 data + 4 parity blocks (40% storage overhead)
  #   - RS(6,3):  6 data + 3 parity blocks  (50% overhead)
  #   - RS(4,2):  4 data + 2 parity blocks  (50% overhead, faster)
  #   - Encode / decode round-trips (small, medium, large blobs)
  #   - Single and multi-shard failure recovery up to parity_shards tolerance
  #   - Unrecoverable scenarios (> parity_shards failures)
  #   - High-level put / get / remove via internal shard store
  #   - Storage overhead metrics (50-70% savings vs mirroring)
  #   - BlobRedundancyManager integration in PARITY mode
  # ---------------------------------------------------------------------------
  erasure-coding-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Erasure Coding tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_erasure_coding_backend_focused

      - name: Run ErasureCodingFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ErasureCodingFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee erasure_coding_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erasure-coding-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/erasure_coding_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🗜️ Erasure Coding for Blob Storage – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ErasureCodingBackend: RS(10,4) / RS(6,3) / RS(4,2) encode/decode, " >> "$GITHUB_STEP_SUMMARY"
          echo "multi-shard fault tolerance, storage overhead verification, " >> "$GITHUB_STEP_SUMMARY"
          echo "BlobRedundancyManager PARITY mode integration." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate job — all matrix legs must pass
  # ---------------------------------------------------------------------------
  erasure-coding-gate:
    name: Erasure Coding Gate
    needs: erasure-coding-tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check test status
        shell: bash
        run: |
          result="${{ needs.erasure-coding-tests.result }}"
          if [[ "$result" == "success" ]]; then
            echo "✅ All erasure coding tests passed."
          elif [[ "$result" == "skipped" ]]; then
            echo "ℹ️  Erasure coding tests skipped (no relevant changes detected)."
          else
            echo "❌ Erasure coding tests failed."
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          result="${{ needs.erasure-coding-tests.result }}"
          echo "## 🗜️ Erasure Coding for Blob Storage – Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test result** | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
