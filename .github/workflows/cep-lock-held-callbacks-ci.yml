name: CEP Lock-Held-Across-Callbacks CI

# Validates the fix for "Lock Held Across User Callbacks in CEPEngine::timerLoop()"
# (v1.8.0, Issue #41).
# Covers:
#   AC-1  timerLoop() snapshots callbacks under lock, dispatches outside
#   AC-2  WindowCallbackBatch value type for cheap move-based snapshots
#   AC-3  closeWindow() callers release lock before invoking user callbacks
#   AC-4  metricsLoop() uses condition_variable::wait_for (not sleep_for)
#   AC-5  CEPEngine::shutdown() returns within 100 ms regardless of metrics_interval
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/cep_engine.h'
      - 'src/analytics/cep_engine.cpp'
      - 'tests/analytics/test_cep_engine.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cep-lock-held-callbacks-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/cep_engine.h'
      - 'src/analytics/cep_engine.cpp'
      - 'tests/analytics/test_cep_engine.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cep-lock-held-callbacks-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CepEngineFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-1  timerLoop() snapshots callbacks under the lock then dispatches outside
  #   AC-2  WindowCallbackBatch carries (events, start, end) via move semantics
  #   AC-3  handleTumblingWindow/SlidingWindow/SessionWindow/CountWindow release
  #         windows_mutex_ before invoking user callbacks
  #   AC-4  metricsLoop() wakes immediately via condition_variable::wait_for
  #   AC-5  CEPEngine::shutdown() returns within 100 ms with 60 s metrics_interval
  # ---------------------------------------------------------------------------
  cep-lock-held-callbacks-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CEP lock-fix tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_cep_engine_focused

      - name: Run CepEngineFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R CepEngineFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee cep_lock_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_cep_engine_focused \
            --gtest_output="xml:cep_lock_gtest.xml" \
            2>&1 | tee cep_lock_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cep-lock-held-callbacks-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cep_lock_ctest.txt
            build/cep_lock_gtest.xml
            build/cep_lock_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 CEP Lock-Held-Across-Callbacks – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "CEP: timerLoop() snapshot-and-dispatch, WindowCallbackBatch, metricsLoop() cv::wait_for, shutdown() ≤ 100 ms." >> "$GITHUB_STEP_SUMMARY"
