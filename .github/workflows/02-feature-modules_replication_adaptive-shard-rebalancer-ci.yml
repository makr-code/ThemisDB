name: Adaptive Shard Rebalancer CI

# Triggered on every push / PR that touches the adaptive shard rebalancer
# sources or its test file.  Targets v1.7.0 (Issue #203).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/sharding/auto_rebalancer.h'
      - 'src/sharding/auto_rebalancer.cpp'
      - 'include/sharding/shard_load_detector.h'
      - 'src/sharding/shard_load_detector.cpp'
      - 'include/sharding/data_migrator.h'
      - 'src/sharding/data_migrator.cpp'
      - 'include/utils/audit_logger.h'
      - 'src/utils/audit_logger.cpp'
      - 'tests/test_adaptive_shard_rebalancer.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_replication_adaptive-shard-rebalancer-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/sharding/auto_rebalancer.h'
      - 'src/sharding/auto_rebalancer.cpp'
      - 'include/sharding/shard_load_detector.h'
      - 'src/sharding/shard_load_detector.cpp'
      - 'include/sharding/data_migrator.h'
      - 'src/sharding/data_migrator.cpp'
      - 'include/utils/audit_logger.h'
      - 'src/utils/audit_logger.cpp'
      - 'tests/test_adaptive_shard_rebalancer.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_replication_adaptive-shard-rebalancer-ci.yml'

concurrency:
  group: adaptive-shard-rebalancer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  adaptive-shard-rebalancer-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Adaptive Shard Rebalancer (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run AdaptiveShardRebalancerFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R AdaptiveShardRebalancerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee adaptive_shard_rebalancer_results.txt

      # ── Broader validation via unified binary ──────────────────────────────
      - name: Run adaptive shard rebalancer tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="AdaptiveShardRebalancer*:HotShardSplitPolicy*:ShardLoadForecast*:LiveMigration*" \
            --gtest_output="xml:adaptive_shard_rebalancer_gtest.xml" \
            2>&1 | tee adaptive_shard_rebalancer_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-shard-rebalancer-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/adaptive_shard_rebalancer_results.txt
            build/adaptive_shard_rebalancer_gtest.xml
            build/adaptive_shard_rebalancer_gtest_output.txt
          retention-days: 30
