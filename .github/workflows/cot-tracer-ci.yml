name: Prompt Engineering – CoT Step Tracer CI

# Validates IChainOfThoughtTracer, RecordingCoTTracer, CoTTraceCollector,
# and the ChainOfThoughtBuilder tracer-wiring (Phase 5, item 1 — v1.7.0).
# roadmap:prompt_engineering:v1.7.0:cot-step-tracer
#
# Acceptance criteria covered:
#   AC-1  to AC-12  IChainOfThoughtTracer + RecordingCoTTracer
#   AC-13 to AC-20  ChainOfThoughtBuilder tracer wiring + noexcept safety
#   AC-21 to AC-27  CoTTraceCollector fan-out and span accumulation
#   AC-28 to AC-30  Edge cases (multiple builders, static methods, reset)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/prompt_engineering/cot_tracer.h'
      - 'src/prompt_engineering/cot_tracer.cpp'
      - 'include/prompt_engineering/chain_of_thought.h'
      - 'src/prompt_engineering/chain_of_thought.cpp'
      - 'tests/test_cot_tracer.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/cot-tracer-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/cot_tracer.h'
      - 'src/prompt_engineering/cot_tracer.cpp'
      - 'include/prompt_engineering/chain_of_thought.h'
      - 'src/prompt_engineering/chain_of_thought.cpp'
      - 'tests/test_cot_tracer.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/cot-tracer-ci.yml'
  workflow_dispatch:

concurrency:
  group: cot-tracer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  cot-tracer-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CoTTracer (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_cot_tracer_focused

      - name: Run CoTTracerFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R CoTTracerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee cot_tracer_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_cot_tracer_focused \
            --gtest_output="xml:cot_tracer_gtest.xml" \
            2>&1 | tee cot_tracer_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cot-tracer-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cot_tracer_ctest.txt
            build/cot_tracer_gtest.xml
            build/cot_tracer_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔗 Prompt Engineering – CoT Step Tracer" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1:  IChainOfThoughtTracer — RecordingCoTTracer instantiable | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2:  RecordingCoTTracer starts empty | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3:  Accumulates one span per step | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4:  Spans in step order | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5:  step_index matches iteration | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6:  label matches auto-numbered label | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7:  content matches step content | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8:  duration is non-negative | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9:  token_count is chars/4 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: CoTSpanRecord::toJson() has all keys | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-11: reset() removes all spans | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-12: toJson() returns JSON array | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-13: attachTracer() sets hasTracer() true | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-14: detachTracer() sets hasTracer() false | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-15: build() without tracer (backward compat) | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-16: build() with tracer = same prompt | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-17: empty builder fires no callbacks | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-18: onStepBegin fires before onStepEnd | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-19: throwing onStepBegin does not abort build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-20: throwing onStepEnd does not abort build | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-21: addTracer() increases tracerCount() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-22: CoTTraceCollector fans out to children | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-23: removeTracer() decreases tracerCount() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-24: collector accumulates independently of children | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-25: totalStepsTraced() counts all onStepEnd calls | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-26: reset() clears spans and totalStepsTraced | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-27: toJson() returns correct-length array | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-28: multiple builders sharing tracer are additive | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-29: static factory methods do not fire callbacks | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-30: hasSpans() false after reset() | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
