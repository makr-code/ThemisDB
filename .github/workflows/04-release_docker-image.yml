name: Docker Image CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build Docker image for (e.g. v1.9.0)'
        required: false
        type: string

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Create placeholder for optional proprietary directory
      run: mkdir -p internal
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag "my-image-name:$(date +%s)"
