name: Intelligent Prefetching CI

# Triggered on every push/PR that touches the IntelligentPrefetcher sources,
# its test file, or this workflow itself.
# Targets v1.8.0 (roadmap:192:performance:v1.8.0:intelligent-prefetching-system).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/performance/intelligent_prefetcher.h'
      - 'src/performance/intelligent_prefetcher.cpp'
      - 'tests/test_intelligent_prefetcher.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_intelligent-prefetching-ci.yml'
  workflow_dispatch:

concurrency:
  group: intelligent-prefetching-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the IntelligentPrefetchingFocusedTests suite.
  # Tests cover all six acceptance criteria (AC-1 to AC-6):
  #   AC-1  Pattern Learning    – ML model learns sequential and strided patterns
  #   AC-2  Prefetch Distance   – adaptive prefetch distance responds to latency
  #   AC-3  Confidence Scoring  – only high-confidence predictions are issued
  #   AC-4  Multi-Level         – prefetch routes to L1/L2/L3/DRAM by confidence
  #   AC-5  Feedback Loop       – useful vs wasted prefetch accounting
  #   AC-6  Stats               – accuracy and coverage computed correctly
  # ---------------------------------------------------------------------------
  intelligent-prefetching-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Intelligent Prefetching tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build (intelligent prefetching test target)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_intelligent_prefetcher_focused

      - name: Run Intelligent Prefetching unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex IntelligentPrefetchingFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee intelligent_prefetching_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-prefetching-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/intelligent_prefetching_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧠 Intelligent Prefetching System – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "IntelligentPrefetcher: pattern learning, adaptive distance, confidence scoring, multi-level prefetch, feedback loop." >> "$GITHUB_STEP_SUMMARY"
