name: GPU Module CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/gpu/**'
      - 'src/geo/gpu_backend_stub.cpp'
      - 'src/server/spatial_api_handler.cpp'
      - 'include/themis/gpu/**'
      - 'include/geo/spatial_backend.h'
      - 'tests/test_gpu_*.cpp'
      - 'tests/test_geo_gpu_backend.cpp'
      - 'benchmarks/bench_gpu_module.cpp'
      - 'src/index/cuda_hnsw_graph_traversal.cpp'
      - 'include/index/cuda_hnsw_graph_traversal.h'
      - 'tests/test_cuda_hnsw_graph_traversal.cpp'
      - '.github/workflows/06-infrastructure_gpu_gpu-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/gpu/**'
      - 'src/geo/gpu_backend_stub.cpp'
      - 'src/server/spatial_api_handler.cpp'
      - 'include/themis/gpu/**'
      - 'include/geo/spatial_backend.h'
      - 'tests/test_gpu_*.cpp'
      - 'tests/test_geo_gpu_backend.cpp'
      - 'benchmarks/bench_gpu_module.cpp'
      - 'src/index/cuda_hnsw_graph_traversal.cpp'
      - 'include/index/cuda_hnsw_graph_traversal.h'
      - 'tests/test_cuda_hnsw_graph_traversal.cpp'
      - '.github/workflows/06-infrastructure_gpu_gpu-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and test GPU module with CPU-only fallback (no hardware required)
  # ---------------------------------------------------------------------------
  gpu-module-cpu-fallback:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_gpu_changes == 'true'
    name: GPU Module (CPU Fallback, ${{ matrix.edition }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        edition: [COMMUNITY, ENTERPRISE]
        include:
          - edition: COMMUNITY
            vram_gb: 24
            max_nodes: 5
          - edition: ENTERPRISE
            vram_gb: 256
            max_nodes: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mimalloc
        run: sudo apt-get update && sudo apt-get install -y libmimalloc-dev

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ clang \
            libgtest-dev libbenchmark-dev \
            pkg-config \
            librocksdb-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            liblz4-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev

      - name: Configure CMake (${{ matrix.edition }})
        run: |
          cmake -S . -B build-${{ matrix.edition }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_EDITION=${{ matrix.edition }} \
            -DTHEMIS_ENABLE_GPU=ON \
            -DTHEMIS_GPU_MAX_VRAM_GB=${{ matrix.vram_gb }} \
            -DTHEMIS_SHARDING_MAX_NODES=${{ matrix.max_nodes }} \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=OFF

      - name: Build GPU module sources
        run: |
          # GPU sources are compiled into themis_core / themis_tests.
          # Build the full project; GPU sources from EditionFeatures.cmake
          # are compiled in automatically when THEMIS_ENABLE_GPU=ON.
          cmake --build build-${{ matrix.edition }} --parallel 4

      - name: Run GPU unit tests
        run: |
          cd build-${{ matrix.edition }}
          # Only run ctest if GPU test executables exist in the build tree.
          GPU_TESTS=$(find . -type f -executable \( -name "test_gpu_*" -o -name "test_geo_gpu_*" \) 2>/dev/null | wc -l)
          if [ "$GPU_TESTS" -gt 0 ]; then
            ctest --output-on-failure \
              --tests-regex "^(test_gpu_|GpuGeoBackend)" \
              --timeout 120 \
              -j4
          else
            echo "ℹ️  No GPU test executables found — GPU targets must be registered in CMakeLists.txt"
            echo "    See docs/gpu_roadmap.md: Delivery & Governance — CI gates"
          fi

      - name: Verify CPU-fallback compilation
        run: |
          # Ensure the module compiles even when GPU hardware is absent.
          grep -r "enable_cpu_fallback" src/gpu/ include/themis/gpu/ | wc -l | \
            xargs -I{} test {} -gt 0 && \
            echo "✅ CPU fallback code paths are present (gpu module)" || \
            (echo "❌ CPU fallback code paths missing in gpu module" && exit 1)
          # Geo backend: verify it falls back to CPU predicate when no GPU device.
          grep -q "cpu_fallback\|CPU fallback\|recordFallbackToCPU" src/geo/gpu_backend_stub.cpp && \
            echo "✅ CPU fallback code paths are present (geo backend)" || \
            (echo "❌ CPU fallback code paths missing in geo backend" && exit 1)
          # Verify observability stats function is present.
          grep -q "getGpuSpatialBackendStatsJson" src/geo/gpu_backend_stub.cpp \
            include/geo/spatial_backend.h && \
            echo "✅ GPU geo backend stats function present" || \
            (echo "❌ getGpuSpatialBackendStatsJson missing" && exit 1)

      - name: Check GPU headers are self-contained
        run: |
          for header in include/themis/gpu/*.h; do
            echo "Checking: $header"
            g++ -std=c++17 \
              -DTHEMIS_EDITION_STRING=\"${{ matrix.edition }}\" \
              -DTHEMIS_GPU_MAX_VRAM_GB=${{ matrix.vram_gb }} \
              -DTHEMIS_SHARDING_MAX_NODES=${{ matrix.max_nodes }} \
              -I include \
              -fsyntax-only "$header" 2>&1 || \
            echo "Warning: $header may have external dependencies (expected)"
          done
          echo "✅ Header self-containment check complete"

      - name: Write job summary
        if: always()
        run: |
          echo "## 🖥️ GPU CI – Module CPU Fallback (${{ matrix.edition }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Edition** | \`${{ matrix.edition }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **VRAM** | ${{ matrix.vram_gb }} GB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Max nodes** | ${{ matrix.max_nodes }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks performed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build GPU module sources (CPU fallback, no GPU hardware)" >> "$GITHUB_STEP_SUMMARY"
          echo "- GPU unit tests (if test executables found)" >> "$GITHUB_STEP_SUMMARY"
          echo "- CPU fallback code path verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- Header self-containment check" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Static analysis: clang-tidy on GPU sources
  # ---------------------------------------------------------------------------
  gpu-static-analysis:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_gpu_changes == 'true'
    name: GPU Static Analysis (clang-tidy)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-tidy

      - name: Run clang-tidy on GPU sources
        run: |
          TIDY_ERRORS=0
          for src in src/gpu/*.cpp src/geo/gpu_backend_stub.cpp; do
            [ -f "$src" ] || continue
            echo "Analysing: $src"
            clang-tidy "$src" \
              --checks="-*,readability-*,bugprone-*,performance-*" \
              -- \
              -std=c++17 \
              -DTHEMIS_EDITION_STRING=\"COMMUNITY\" \
              -DTHEMIS_GPU_MAX_VRAM_GB=24 \
              -DTHEMIS_SHARDING_MAX_NODES=5 \
              -I include 2>&1 | \
              grep -v "^$" | \
              grep -v "note:" || true
          done
          echo "✅ clang-tidy pass complete (warnings may require follow-up)"

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 GPU CI – Static Analysis (clang-tidy)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Checks** | readability-*, bugprone-*, performance-* |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Sources** | \`src/gpu/*.cpp\`, \`src/geo/gpu_backend_stub.cpp\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Device-loss simulation: fault-injection smoke test
  # ---------------------------------------------------------------------------
  gpu-device-loss-simulation:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_gpu_changes == 'true'
    name: GPU Device Loss Simulation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ cmake

      - name: Verify device-loss / safe-fail code paths exist
        run: |
          # Confirm circuit breaker and fallback logic is present.
          grep -l "CIRCUIT_OPEN\|DEVICE_UNAVAILABLE\|forceFailed\|executeWithFallback" \
            src/gpu/*.cpp include/themis/gpu/*.h | \
            xargs -I{} echo "✅ Device-loss path found in: {}"

          FOUND=$(grep -rl "CIRCUIT_OPEN\|DEVICE_UNAVAILABLE\|forceFailed\|executeWithFallback" \
            src/gpu/ include/themis/gpu/ | wc -l)
          echo "Total files with device-loss paths: $FOUND"
          test "$FOUND" -gt 0 || (echo "❌ No device-loss code paths found" && exit 1)

      - name: Confirm chaos/fault test files exist
        run: |
          CHAOS_TESTS=$(find tests/ \( -name "test_gpu_*.cpp" -o -name "test_geo_gpu_backend.cpp" \) | \
            xargs grep -l "forceFailed\|CIRCUIT_OPEN\|chaos\|device_loss\|EdgeCase\|degenerate" 2>/dev/null | wc -l)
          echo "GPU/geo test files with chaos/fault scenarios: $CHAOS_TESTS"
          test "$CHAOS_TESTS" -gt 0 || \
            echo "⚠️  No dedicated chaos test files yet — see docs/gpu_roadmap.md"
          echo "✅ Device-loss simulation check complete"

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚠️ GPU CI – Device Loss Simulation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- Circuit breaker / device-loss code paths (CIRCUIT_OPEN, DEVICE_UNAVAILABLE, forceFailed)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Chaos/fault test file presence" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Documentation gate: roadmap and runbooks present
  # ---------------------------------------------------------------------------
  gpu-docs-gate:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_gpu_changes == 'true'
    name: GPU Documentation Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GPU documentation exists
        run: |
          for doc in docs/gpu_roadmap.md docs/gpu_runbooks.md; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing: $doc"
              exit 1
            fi
            echo "✅ Found: $doc ($(wc -l < $doc) lines)"
          done

      - name: Verify GPU headers are documented
        run: |
          UNDOCUMENTED=0
          for header in include/themis/gpu/*.h; do
            if ! grep -q "@brief" "$header"; then
              echo "⚠️  Missing @brief in: $header"
              UNDOCUMENTED=$((UNDOCUMENTED + 1))
            fi
          done
          echo "Headers without @brief: $UNDOCUMENTED"
          # Warn but don't block — documentation debt is tracked in the roadmap.
          echo "✅ Documentation gate complete"

      - name: Write job summary
        if: always()
        run: |
          echo "## 📚 GPU CI – Documentation Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`docs/gpu_roadmap.md\` and \`docs/gpu_runbooks.md\` present" >> "$GITHUB_STEP_SUMMARY"
          echo "- GPU header \`@brief\` documentation coverage" >> "$GITHUB_STEP_SUMMARY"
