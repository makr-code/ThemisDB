name: 'Nightly Tests'

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write
  security-events: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

jobs:
  # Full matrix builds
  cpp-matrix:
    name: C++ Build Matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-type: [Release, Debug]
    uses: ./.github/workflows/reusable-cpp-build.yml
    with:
      os: ${{ matrix.os }}
      build-type: ${{ matrix.build-type }}
      run-tests: true
      upload-artifacts: false

  # Cross-compilation matrix
  cross-compile-matrix:
    name: Cross-Compile Matrix
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf]
    uses: ./.github/workflows/reusable-cross-compile.yml
    with:
      target-arch: ${{ matrix.arch }}
      build-type: Release

  # Full SDK test suite
  sdk-matrix:
    name: SDK Test Matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            version: '3.10'
          - language: python
            version: '3.11'
          - language: python
            version: '3.12'
          - language: javascript
            version: '18'
          - language: javascript
            version: '20'
          - language: java
            version: '11'
          - language: java
            version: '17'
          - language: go
            version: '1.21'
          - language: ruby
            version: '3.2'
          - language: rust
            version: 'stable'
    uses: ./.github/workflows/reusable-sdk-test.yml
    with:
      language: ${{ matrix.language }}
      version: ${{ matrix.version }}

  # Performance benchmarks
  benchmarks:
    name: Performance Benchmarks
    uses: ./.github/workflows/reusable-benchmark.yml
    with:
      benchmark-suite: 'all'
      baseline-ref: 'main'
      upload-results: true
      update-baseline: ${{ github.ref == 'refs/heads/main' }}

  # Extended security scan
  security-extended:
    name: Extended Security Scan
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      scanner-type: 'all'
      upload-sarif: true
      create-issues: true
    secrets: inherit

  # Documentation build
  docs:
    name: Documentation Build
    uses: ./.github/workflows/reusable-docs-build.yml
    with:
      deploy-target: 'artifact'

  # Nightly summary
  summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [cpp-matrix, cross-compile-matrix, sdk-matrix, benchmarks, security-extended, docs]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          echo "# 🌙 Nightly Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| C++ Matrix | ${{ needs.cpp-matrix.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-Compile | ${{ needs.cross-compile-matrix.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SDK Tests | ${{ needs.sdk-matrix.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmarks | ${{ needs.benchmarks.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security-extended.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Send notification
        uses: ./.github/actions/notification
        with:
          status: ${{ needs.cpp-matrix.result == 'success' && needs.sdk-matrix.result == 'success' && 'success' || 'failure' }}
          message: 'Nightly test suite completed'
          channels: 'summary'
