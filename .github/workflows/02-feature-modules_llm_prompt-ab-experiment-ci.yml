name: Prompt Engineering – A/B Experiment Framework CI

# Validates PromptABExperimentFramework, PromptExperiment, ExperimentVariant,
# ExperimentContext, ExperimentStatus, ExperimentOutcome, ExperimentSummary,
# MurmurHash3-32 variant assignment, Welch t-test significance detection,
# and WinnerCallback auto-promotion (Phase 5, item 3 — v1.9.0).
# roadmap:prompt_engineering:v1.9.0:prompt-ab-experiment
#
# Acceptance criteria covered:
#   AC-1  to AC-7   Construction, create() behaviour, list/get
#   AC-8  to AC-14  stop(), assignVariant() (unknown/0/100/deterministic/stopped)
#   AC-15 to AC-20  recordOutcome() edge cases, getOutcomes(), toJson()
#   AC-21 to AC-24  checkSignificance() (winner_treatment/control/identical/auto)
#   AC-25 to AC-28  promoteWinner() version IDs, empty, COMPLETED status
#   AC-29 to AC-30  getSummary() fields, PromptExperiment JSON round-trip

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/prompt_ab_experiment.h'
      - 'src/prompt_engineering/prompt_ab_experiment.cpp'
      - 'tests/test_prompt_ab_experiment.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_prompt-ab-experiment-ci.yml'
  workflow_dispatch:

concurrency:
  group: prompt-ab-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  prompt-ab-experiment-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: PromptABExperimentFramework (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_prompt_ab_experiment_focused

      - name: Run PromptABExperimentFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PromptABExperimentFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee ab_experiment_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_prompt_ab_experiment_focused \
            --gtest_output="xml:ab_experiment_gtest.xml" \
            2>&1 | tee ab_experiment_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-experiment-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/ab_experiment_ctest.txt
            build/ab_experiment_gtest.xml
            build/ab_experiment_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔬 Prompt Engineering – A/B Experiment Framework" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1:  Default construction | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2:  create() assigns ID | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3:  create() preserves caller ID | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4:  create() clamps split_pct | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5:  getExperiment() returns stored experiment | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6:  getExperiment() nullopt for unknown | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7:  listExperiments() returns all | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8:  stop() sets INCONCLUSIVE | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9:  stop() false for unknown | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: assignVariant() CONTROL for unknown | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-11: assignVariant() CONTROL for split_pct=0 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-12: assignVariant() TREATMENT for split_pct=100 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-13: assignVariant() deterministic | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-14: assignVariant() CONTROL for stopped experiment | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-15: recordOutcome() false for unknown | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-16: recordOutcome() false for stopped | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-17: recordOutcome() increments counts | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-18: getOutcomes() returns all | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-19: ExperimentOutcome::toJson() all keys | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-20: checkSignificance() false if < min_samples | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-21: checkSignificance() WINNER_TREATMENT | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-22: checkSignificance() WINNER_CONTROL | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-23: checkSignificance() no winner on identical | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-24: auto-promotion via WinnerCallback | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-25: promoteWinner() treatment version ID | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-26: promoteWinner() control version ID | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-27: promoteWinner() empty when no winner | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-28: promoteWinner() sets COMPLETED | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-29: getSummary() all expected fields | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-30: PromptExperiment JSON round-trip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
