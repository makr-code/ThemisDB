name: Release-Critical Test Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
    paths:
      - 'tests/integration/**'
      - 'tests/CMakeLists.txt'
      - 'tests/integration/CMakeLists.txt'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/09-pr-gates_release-critical-tests.yml'
  workflow_dispatch:

concurrency:
  group: release-critical-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-critical-tests:
    name: Release-critical suite (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            librocksdb-dev \
            libgtest-dev \
            libssl-dev \
            zlib1g-dev \
            libfmt-dev \
            libtbb-dev \
            nlohmann-json3-dev \
            libspdlog-dev \
            libyaml-cpp-dev \
            libmimalloc-dev \
            libcurl4-openssl-dev \
            libboost-system-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc

      - name: Configure (community-release)
        run: cmake --preset community-release

      - name: Build release-critical test targets
        run: |
          cmake --build --preset community-release --parallel 4 --target \
            query_execution_pipeline_test \
            ingestion_pipeline_test \
            rag_ai_pipeline_test \
            transaction_replication_pipeline_test \
            security_pipeline_test \
            application_profile_pipeline_test

      - name: Validate release-critical label selection
        run: |
          ctest --preset community-release -N -L release_critical | tee release-critical-selection.log
          if ! grep -E "Total Tests: [1-9][0-9]*" release-critical-selection.log >/dev/null; then
            echo "No release_critical tests were selected." >&2
            exit 1
          fi

      - name: Run release-critical suite with flake check
        run: |
          ctest --preset community-release \
            --output-on-failure \
            --timeout 300 \
            -L release_critical \
            -j 2 \
            --repeat until-fail:5 | tee release-critical-ctest.log

      - name: Upload release-critical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-critical-tests-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            release-critical-selection.log
            release-critical-ctest.log
