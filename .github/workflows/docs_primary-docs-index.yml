name: Primary-Docs Index Generator

# Generates docs/_generated/primary_index.json by scanning src/, include/,
# and examples/ for primary documentation files (README, ARCHITECTURE, etc.).
#
# Runs on:
#   - Every push to main/develop/release branches
#   - Every pull-request (for verification)
#   - Manually via workflow_dispatch
#
# The generated file is uploaded as a CI artifact and, on the default branch,
# committed back to the repository so it is always up to date.

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'src/**'
      - 'include/**'
      - 'examples/**'
      - 'tools/primary_docs_indexer.py'
      - 'tools/ci/print_primary_index_summary.py'
      - 'tools/tests/test_primary_docs_indexer.py'
      - '.github/workflows/docs_primary-docs-index.yml'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'include/**'
      - 'examples/**'
      - 'tools/primary_docs_indexer.py'
      - 'tools/ci/print_primary_index_summary.py'
      - 'tools/tests/test_primary_docs_indexer.py'
      - '.github/workflows/docs_primary-docs-index.yml'

  workflow_dispatch:
    inputs:
      include_root:
        description: 'Also scan the repository root (non-recursive)'
        type: boolean
        default: false
      output_format:
        description: 'Output format'
        type: choice
        options:
          - json
          - yaml
        default: json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-index:
    name: Generate Primary-Docs Index
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed for the commit-back step on main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git log timestamps are accurate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run unit tests
        run: python3 -m pytest tools/tests/test_primary_docs_indexer.py -v

      - name: Build extra flags
        id: flags
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.include_root }}" = "true" ]; then
            FLAGS="${FLAGS} --include-root"
          fi
          FORMAT="${{ github.event.inputs.output_format }}"
          if [ -n "${FORMAT}" ]; then
            FLAGS="${FLAGS} --format ${FORMAT}"
          fi
          echo "extra=${FLAGS}" >> "$GITHUB_OUTPUT"

      - name: Run primary_docs_indexer
        run: |
          python3 tools/primary_docs_indexer.py \
            --repo-root . \
            --scan-dirs src,include,examples \
            ${{ steps.flags.outputs.extra }}

      - name: Show index summary
        run: |
          echo "### Primary-Docs Index Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci/print_primary_index_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload index as artifact
        uses: actions/upload-artifact@v4
        with:
          name: primary-docs-index
          path: docs/_generated/
          retention-days: 30

      - name: Commit updated index (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/_generated/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update primary_index.json [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
