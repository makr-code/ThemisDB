name: Build Binary Release · Windows

# Builds a production Windows binary release of ThemisDB (x64) and attaches
# the resulting packages (ZIP + optional MSI via CPack/WIX) to the
# corresponding GitHub Release.
#
# TRIGGERS
# --------
#   • Push of a tag matching v* (e.g. v1.9.0) from the main branch.
#   • Manual workflow_dispatch for a specific version/tag.
#
# OUTPUTS
# -------
#   Packages uploaded as GitHub Release assets:
#     ThemisDB-<VERSION>-Windows-x64.zip    (ZIP archive)
#     ThemisDB-<VERSION>-Windows-x64.msi    (MSI installer, optional)
#     SHA256SUMS-windows.txt                 (checksums)
#
# REQUIRED PERMISSIONS
# --------------------
#   contents: write  – to upload release assets
#
# ALTERNATIVE (GitHub CLI)
#   gh workflow run "04-release_build-binary-windows.yml" \
#     --repo makr-code/ThemisDB --ref main \
#     --field tag_name=v1.9.0 --field dry_run=false

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v1.9.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry-run: build and package but do NOT upload to release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  BUILD_TYPE: Release

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 · Build & Package (Windows x64)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-windows:
    name: Build & Package – Windows x64
    runs-on: windows-latest
    timeout-minutes: 120

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag:     ${{ steps.resolve.outputs.tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}

    steps:
      - name: Resolve tag and version
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          else
            TAG="${{ github.ref_name }}"
            DRY_RUN="false"
          fi
          # Strip leading 'v' to get bare semver: v1.9.0 → 1.9.0
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION dry_run=$DRY_RUN"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Enable Developer Command Prompt (MSVC)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-Not (Test-Path "vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git vcpkg
          }
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg install --clean-after-build

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE="${env:GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_C_COMPILER=cl.exe `
            -DCMAKE_CXX_COMPILER=cl.exe `
            -DTHEMIS_BUILD_TESTS=OFF `
            -DTHEMIS_BUILD_BENCHMARKS=OFF `
            -DTHEMIS_DOCS_DB_MODE=AUTO `
            -DTHEMIS_MODELS_MODE=PACKAGE `
            -DTHEMIS_STRICT_BUILD=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $env:NUMBER_OF_PROCESSORS

      - name: Package with CPack (ZIP + optional MSI)
        shell: pwsh
        working-directory: build
        run: |
          cpack -C ${{ env.BUILD_TYPE }} -G ZIP
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "CPack ZIP packaging failed – check build output"
          }

          $hasWixV3 = [bool](Get-Command candle.exe -ErrorAction SilentlyContinue)
          $hasWixV4 = [bool](Get-Command wix.exe -ErrorAction SilentlyContinue)

          if ($hasWixV3 -or $hasWixV4) {
            cpack -C ${{ env.BUILD_TYPE }} -G WIX
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "CPack WIX/MSI packaging failed – continuing with ZIP-only artifact set"
            }
          } else {
            Write-Warning "WIX toolchain not found on runner – skipping optional MSI packaging"
          }

      - name: Collect packages and generate checksums
        id: collect
        shell: bash
        run: |
          mkdir -p dist
          find build -maxdepth 2 \( -name "*.zip" -o -name "*.msi" \) -exec cp {} dist/ \;
          echo "Packages:"
          ls -lh dist/
          cd dist
          sha256sum * > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: themisdb-windows-packages-${{ steps.resolve.outputs.version }}
          path: dist/
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          echo "## 🪟 Build Binary Release · Windows" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ steps.resolve.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | \`${{ steps.resolve.outputs.dry_run }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Packages" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            ls -lh dist/ >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 · Publish (upload packages to GitHub Release)
# ─────────────────────────────────────────────────────────────────────────────
  publish-windows:
    name: Publish – Attach Windows Packages to GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    timeout-minutes: 15
    if: needs.build-windows.outputs.dry_run == 'false'

    permissions:
      contents: write

    steps:
      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: themisdb-windows-packages-${{ needs.build-windows.outputs.version }}
          path: dist/

      - name: Upload packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-windows.outputs.tag }}"
          echo "Uploading packages to release $TAG"
          ls -lh dist/
          gh release upload "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --clobber

          echo "✅ Windows packages uploaded to release $TAG"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          VERSION="${{ needs.build-windows.outputs.version }}"
          TAG="${{ needs.build-windows.outputs.tag }}"
          echo "## 🪟 Publish Windows Packages → GitHub Release \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          if [ -d dist ]; then
            for f in dist/*; do
              SIZE=$(du -h "$f" | cut -f1)
              echo "| \`$(basename $f)\` | ${SIZE} |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
