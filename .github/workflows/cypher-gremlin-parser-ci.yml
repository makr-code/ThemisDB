name: Cypher/Gremlin Parser CI

# Triggered on every push/PR that touches the Cypher or Gremlin parser sources,
# test files, or this workflow itself.
# Targets v1.6.0 (roadmap:query:v1.6.0:cypher-gremlin-parser).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/query/cypher_parser.h'
      - 'src/query/cypher_parser.cpp'
      - 'include/query/gremlin_parser.h'
      - 'src/query/gremlin_parser.cpp'
      - 'include/query/aql_runner.h'
      - 'src/query/aql_runner.cpp'
      - 'tests/test_cypher_parser.cpp'
      - 'tests/test_gremlin_parser.cpp'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cypher-gremlin-parser-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/query/cypher_parser.h'
      - 'src/query/cypher_parser.cpp'
      - 'include/query/gremlin_parser.h'
      - 'src/query/gremlin_parser.cpp'
      - 'include/query/aql_runner.h'
      - 'src/query/aql_runner.cpp'
      - 'tests/test_cypher_parser.cpp'
      - 'tests/test_gremlin_parser.cpp'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cypher-gremlin-parser-ci.yml'
  workflow_dispatch:

concurrency:
  group: cypher-gremlin-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CypherParserFocusedTests suite (30 tests).
  # Tests cover:
  #   - MATCH node patterns (label, variable, inline props, anonymous)
  #   - Multiple labels, RETURN *, RETURN DISTINCT
  #   - Relationship patterns: OUT, IN, BOTH, variable, multi-type, anonymous
  #   - WHERE expressions: =, <>, <, <=, >, >=, AND, OR, NOT, IS NULL,
  #     IS NOT NULL, IN, STARTS WITH, ENDS WITH, CONTAINS, NOT IN
  #   - ORDER BY ASC/DESC, SKIP, LIMIT
  #   - AQL transpilation: FOR/FILTER/SORT/LIMIT/RETURN, OUTBOUND/INBOUND/ANY,
  #     STARTS_WITH(), CONTAINS(), IS NULL/IS NOT NULL
  #   - Error cases: missing MATCH, missing RETURN, empty query, parse error
  #     does not throw
  # ---------------------------------------------------------------------------
  cypher-parser-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Cypher parser tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build (cypher parser test target)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_cypher_parser

      - name: Run Cypher parser unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex CypherParserFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee cypher_parser_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypher-parser-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cypher_parser_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 Cypher Parser – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test Suite** | CypherParserFocusedTests (30 tests) |" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Build and run the GremlinParserFocusedTests suite (30 tests).
  # Tests cover:
  #   - g.V(), g.V(id), g.E() traversal starts
  #   - hasLabel(), has(key,val), has(key,pred), hasNot()
  #   - P.eq/neq/lt/lte/gt/gte, P.within, P.without, bare predicates
  #   - out(), in(), both() traversals (with/without edge label)
  #   - values(), valueMap(), as(), select(), dedup(), count()
  #   - limit(), range(), order()+by(), id(), label()
  #   - AQL transpilation: FOR/FILTER, OUTBOUND/INBOUND/ANY, LIMIT,
  #     SORT, DISTINCT, LENGTH() wrapping for count()
  #   - Error cases: not starting with g., missing V()/E(), unknown step,
  #     empty query, parse error does not throw, empty AST is error
  # ---------------------------------------------------------------------------
  gremlin-parser-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Gremlin parser tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build (gremlin parser test target)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_gremlin_parser

      - name: Run Gremlin parser unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex GremlinParserFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee gremlin_parser_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gremlin-parser-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/gremlin_parser_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Gremlin Parser – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test Suite** | GremlinParserFocusedTests (30 tests) |" >> "$GITHUB_STEP_SUMMARY"
