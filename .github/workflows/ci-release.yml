name: CI — Release

# Multi-edition release build: build matrix, package, publish.
# Replaces: release-build.yml
#
# Pipeline stages (end-to-end):
#   preflight → build-matrix (configure+build+test+cpack) → package
#   → validate-release-manifest → publish-community / publish-private
#   → changelog
#
# Edition tag patterns (RELEASE_STRATEGY.md §3):
#   vX.Y.Z                — community release
#   enterprise-vX.Y.Z     — enterprise release
#   hyperscaler-vX.Y.Z    — hyperscaler release
#   military-vX.Y.Z       — military release
#   minimal-vX.Y.Z        — minimal release
#
# Community guardrail: publish-community job must never require private
# credentials, private submodules, or private artefacts (RELEASE_STRATEGY.md §2.4).
#
# Packaging outputs per platform (via CPack):
#   Linux community-release : fallback build lane / raw binaries
#   Linux linux-release     : TGZ + DEB + RPM + ZIP
#   Windows windows-release : ZIP + WIX/MSI (WiX v3 required on runner)

on:
  push:
    tags:
      - 'v*'
      - 'enterprise-v*'
      - 'hyperscaler-v*'
      - 'military-v*'
      - 'minimal-v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      build_matrix:
        description: 'Build matrix presets'
        required: false
        default: 'all'
        type: choice
        options: [all, community-only, linux-release-only, windows-release-only]
      edition:
        description: 'Edition to publish (for dispatch)'
        required: false
        default: 'community'
        type: choice
        options: [minimal, community, enterprise, hyperscaler, military]
      tag_name:
        description: 'Tag for image version (for dispatch)'
        required: false
        type: string
  workflow_call: {}

permissions:
  contents: read
  packages: write
  actions: read
  pull-requests: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  preflight-release-policy:
    name: Preflight Release Policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag/edition policy
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          EDITION_INPUT="${{ inputs.edition || '' }}"
          TAG_INPUT="${{ inputs.tag_name || '' }}"
          TARGET="${TAG_INPUT:-$REF_NAME}"
          CANONICAL_BRANCHES='^(develop|community|enterprise|hyperscaler|military|minimal)$'

          if [ "${EVENT}" = "workflow_dispatch" ]; then
            if ! echo "${REF_NAME}" | grep -Eq "${CANONICAL_BRANCHES}"; then
              echo "::error::workflow_dispatch must run on canonical branch lanes only."
              exit 1
            fi
          fi

          if [ -n "${TARGET}" ]; then
            if ! echo "${TARGET}" | grep -Eq '^(v[0-9]+\.[0-9]+\.[0-9]+|enterprise-v[0-9]+\.[0-9]+\.[0-9]+|hyperscaler-v[0-9]+\.[0-9]+\.[0-9]+|military-v[0-9]+\.[0-9]+\.[0-9]+|minimal-v[0-9]+\.[0-9]+\.[0-9]+)$'; then
              echo "::error::Invalid release tag format: ${TARGET}"
              exit 1
            fi
          fi

          if [ "${EDITION_INPUT}" = "community" ]; then
            echo "Community lane selected: private credentials/submodules must remain disabled."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Matrix: community-release, linux-release, windows-release
  # ─────────────────────────────────────────────────────────────────────────────
  build-matrix:
    name: "Build (${{ matrix.preset }} on ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    needs: preflight-release-policy

    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: community-release
            os: ubuntu-latest
            binaryDir: build-community-release
            cpack_generators: ""
            description: Community build with system packages

          - preset: linux-release
            os: ubuntu-latest
            binaryDir: build-gcc-linux-release
            cpack_generators: TGZ;DEB;RPM;ZIP
            description: Production Linux build with native packages

          - preset: windows-release
            os: windows-latest
            binaryDir: build-msvc-windows-release
            cpack_generators: ZIP;WIX
            description: Production Windows build with vcpkg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check build_matrix filter
        id: filter
        run: |
          MATRIX_INPUT="${{ inputs.build_matrix }}"
          PRESET="${{ matrix.preset }}"
          SKIP="false"
          if [ -n "${MATRIX_INPUT}" ] && [ "${MATRIX_INPUT}" != "all" ]; then
            case "${MATRIX_INPUT}" in
              community-only)
                [ "${PRESET}" != "community-release" ] && SKIP="true" ;;
              linux-release-only)
                [ "${PRESET}" != "linux-release" ] && SKIP="true" ;;
              windows-release-only)
                [ "${PRESET}" != "windows-release" ] && SKIP="true" ;;
            esac
          fi
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Install Linux system dependencies (community-release)
        if: matrix.preset == 'community-release' && steps.filter.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            librocksdb-dev libgtest-dev libssl-dev zlib1g-dev libzstd-dev \
            libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \
            libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev \
            libboost-system-dev libboost-filesystem-dev \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev \
            dpkg-dev rpm

      - name: Install Linux packaging tools (linux-release)
        if: matrix.preset == 'linux-release' && steps.filter.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends dpkg-dev rpm

      - name: Preflight vcpkg submodule (linux/windows release presets)
        if: >
          steps.filter.outputs.skip != 'true' &&
          (matrix.preset == 'linux-release' || matrix.preset == 'windows-release')
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- vcpkg
          git submodule update --init --recursive vcpkg
          test -f vcpkg/scripts/buildsystems/vcpkg.cmake || {
            echo "::error::Missing vcpkg toolchain at vcpkg/scripts/buildsystems/vcpkg.cmake"
            exit 1
          }

      - name: Set up vcpkg (Linux/Windows vcpkg presets)
        if: >
          steps.filter.outputs.skip != 'true' &&
          (matrix.preset == 'linux-release' || matrix.preset == 'windows-release')
        shell: bash
        run: |
          test -f vcpkg/scripts/buildsystems/vcpkg.cmake || {
            echo "::error::vcpkg submodule/toolchain missing before bootstrap"
            exit 1
          }
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics 2>/dev/null || ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cmake --preset ${{ matrix.preset }} 2>&1 | tee "configure-${{ matrix.preset }}.log"
        shell: bash

      - name: Build
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cmake --build --preset ${{ matrix.preset }} --parallel 2>&1 | tee "build-${{ matrix.preset }}.log"
        shell: bash

      - name: Test
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          ctest --preset ${{ matrix.preset }} --output-on-failure -j 1 --timeout 60 2>&1 | tee "test-${{ matrix.preset }}.log"
        shell: bash

      # ── CPack packaging ───────────────────────────────────────────────────
      - name: Install (cmake --install)
        if: steps.filter.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cmake --install "${{ matrix.binaryDir }}" \
            --prefix "${{ matrix.binaryDir }}/install" 2>&1 | tee "install-${{ matrix.preset }}.log"
        shell: bash

      - name: Package (cpack)
        if: steps.filter.outputs.skip != 'true'
        id: cpack
        shell: bash
        run: |
          set -euo pipefail
          BINARY_DIR="${{ matrix.binaryDir }}"
          GENERATORS="${{ matrix.cpack_generators }}"

          # On Windows runners WiX v3 (candle/light) is available via the
          # "windows-2022" image; skip WIX silently if not found.
          if [[ "$RUNNER_OS" == "Windows" ]] || [[ "$(uname -s)" == MINGW* ]]; then
            if ! command -v candle &>/dev/null 2>&1; then
              GENERATORS="${GENERATORS//;WIX/}"
              GENERATORS="${GENERATORS//WIX;/}"
              GENERATORS="${GENERATORS//WIX/}"
              echo "::notice::WiX (candle) not found — MSI generator skipped."
            fi
          fi

          mkdir -p packages
          cd "${BINARY_DIR}"
          for GEN in ${GENERATORS//;/ }; do
            echo "--- Running CPack generator: ${GEN} ---"
            cpack -G "${GEN}" -B "${GITHUB_WORKSPACE}/packages" 2>&1 | tee "${GITHUB_WORKSPACE}/cpack-${GEN}-${{ matrix.preset }}.log" || \
              echo "::warning::CPack generator ${GEN} failed — continuing."
          done
          echo "Packages produced:"
          ls -lh "${GITHUB_WORKSPACE}/packages/" || true

      - name: Upload CPack packages
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-${{ matrix.preset }}-${{ github.run_number }}
          path: packages/
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-${{ matrix.preset }}-${{ github.run_number }}
          path: |
            ${{ matrix.binaryDir }}/themisdb*
            ${{ matrix.binaryDir }}/*.exe
            ${{ matrix.binaryDir }}/*.so
            ${{ matrix.binaryDir }}/*.dll
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload triage logs
        if: always() && steps.filter.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: triage-${{ matrix.preset }}-${{ github.run_number }}
          path: |
            configure-${{ matrix.preset }}.log
            build-${{ matrix.preset }}.log
            test-${{ matrix.preset }}.log
            install-${{ matrix.preset }}.log
            cpack-*-${{ matrix.preset }}.log
          retention-days: 30
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Package: consolidate CPack artifacts from all presets into a single release
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    needs: build-matrix
    if: >
      github.event_name == 'push' ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all CPack packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: packages-*-${{ github.run_number }}
          merge-multiple: true
          path: release/

      - name: Download Linux community binaries (fallback)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: build-community-release-${{ github.run_number }}
          merge-multiple: true
          path: dist/

      - name: Determine edition and version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if   echo "${TAG}" | grep -qE '^enterprise-v'; then
            EDITION=enterprise; VERSION="${TAG#enterprise-}"
          elif echo "${TAG}" | grep -qE '^hyperscaler-v'; then
            EDITION=hyperscaler; VERSION="${TAG#hyperscaler-}"
          elif echo "${TAG}" | grep -qE '^military-v'; then
            EDITION=military; VERSION="${TAG#military-}"
          elif echo "${TAG}" | grep -qE '^minimal-v'; then
            EDITION=minimal; VERSION="${TAG#minimal-}"
          else
            EDITION=community; VERSION="${TAG}"
          fi
          {
            echo "edition=${EDITION}"
            echo "version=${VERSION}"
            echo "archive_name=themisdb-${EDITION}-${VERSION}-linux-x64"
          } >> "$GITHUB_OUTPUT"

      - name: Create fallback archive if no CPack TGZ present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ARCHIVE="release/${{ steps.version.outputs.archive_name }}.tar.gz"
          if ls release/*.tar.gz &>/dev/null || ls release/*.tgz &>/dev/null; then
            echo "CPack TGZ already present — skipping fallback archive."
          elif [ "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "Creating fallback archive from raw build artifacts."
            tar -czf "${ARCHIVE}" -C dist/ . --exclude='*.a'
          else
            echo "::warning::No CPack packages and no raw artifacts found — release archive will be empty."
          fi

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release
          # Collect all distributable files
          DIST_FILES=()
          for ext in tar.gz tgz zip deb rpm msi; do
            while IFS= read -r -d '' f; do
              DIST_FILES+=("$(basename "${f}")")
            done < <(find . -maxdepth 1 -name "*.${ext}" -print0 2>/dev/null)
          done

          if [ ${#DIST_FILES[@]} -eq 0 ]; then
            echo "::warning::No distributable files in release/ — manifest will be empty."
          fi

          sha256sum "${DIST_FILES[@]}" > SHA256SUMS.txt 2>/dev/null || touch SHA256SUMS.txt
          {
            echo "artifacts:"
            for f in "${DIST_FILES[@]}"; do
              echo "  - ${f}"
            done
          } > RELEASE_MANIFEST.txt

          echo "--- Release manifest ---"
          cat RELEASE_MANIFEST.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-packages-${{ github.run_number }}
          path: release/
          retention-days: 90
          if-no-files-found: warn

  validate-release-manifest:
    name: Validate Release Manifest
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: release/

      - name: Validate artifacts, checksums, and metadata
        run: |
          set -euo pipefail
          test -f release/SHA256SUMS.txt || { echo "::error::SHA256SUMS.txt missing"; exit 1; }
          test -f release/RELEASE_MANIFEST.txt || { echo "::error::RELEASE_MANIFEST.txt missing"; exit 1; }
          # Require at least one archive (TGZ, ZIP, or source tarball)
          ARCHIVE_COUNT=$(find release -maxdepth 1 \( -name "*.tar.gz" -o -name "*.tgz" -o -name "*.zip" \) | wc -l)
          if [ "${ARCHIVE_COUNT}" -eq 0 ]; then
            echo "::error::No archive (.tar.gz/.tgz/.zip) found in release packages."
            exit 1
          fi
          echo "Archive count: ${ARCHIVE_COUNT}"
          ls -lh release/
          (cd release && sha256sum --check SHA256SUMS.txt)

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish Community — no private credentials or private submodules
  # Community guardrail: RELEASE_STRATEGY.md §2.4
  # ─────────────────────────────────────────────────────────────────────────────
  publish-community:
    name: Publish Community Release
    runs-on: ubuntu-latest
    needs: validate-release-manifest
    # Only publish community on vX.Y.Z tags or explicit community dispatch
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
       !startsWith(github.ref_name, 'enterprise-') &&
       !startsWith(github.ref_name, 'hyperscaler-') &&
       !startsWith(github.ref_name, 'military-')) ||
      (github.event_name == 'workflow_dispatch' && inputs.edition == 'community')
    environment:
      name: community-release

    permissions:
      contents: write   # required: create/update GitHub Releases and upload assets
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: release/

      - name: Publish to GitHub Releases (community)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : ('${{ inputs.tag_name }}' || '');
            if (!tag) {
              console.log('No tag — skipping GitHub Release upload.');
              return;
            }

            // Resolve or create the GitHub Release for this tag
            let releaseId = context.payload.release?.id;
            if (!releaseId) {
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });
                releaseId = existing.data.id;
                console.log(`Found existing release ${releaseId} for tag ${tag}`);
              } catch (e) {
                if (e.status === 404) {
                  const created = await github.rest.repos.createRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag_name: tag,
                    name: `ThemisDB ${tag}`,
                    draft: false,
                    prerelease: tag.includes('-rc') || tag.includes('-beta') || tag.includes('-alpha'),
                    generate_release_notes: true,
                  });
                  releaseId = created.data.id;
                  console.log(`Created new release ${releaseId} for tag ${tag}`);
                } else {
                  throw e;
                }
              }
            }

            const releaseDir = 'release';
            const files = fs.readdirSync(releaseDir).filter(f =>
              ['.tar.gz', '.tgz', '.zip', '.deb', '.rpm', '.msi', '.txt'].some(ext => f.endsWith(ext))
            );
            if (files.length === 0) {
              console.log('No release files found — nothing uploaded.');
              return;
            }
            for (const file of files) {
              const filePath = path.join(releaseDir, file);
              const data = fs.readFileSync(filePath);
              console.log(`Uploading ${file} (${data.length} bytes)...`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: file,
                data,
              }).catch(e => console.warn(`Upload failed for ${file}: ${e.message}`));
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish Private (enterprise / hyperscaler / military / minimal)
  # Requires PRIVATE_REGISTRY_TOKEN for private container/package registries
  # ─────────────────────────────────────────────────────────────────────────────
  publish-private:
    name: Publish ${{ github.event_name == 'workflow_dispatch' && inputs.edition || 'private' }} Release
    runs-on: ubuntu-latest
    needs: validate-release-manifest
    if: >
      (github.event_name == 'push' && (
        startsWith(github.ref_name, 'enterprise-v') ||
        startsWith(github.ref_name, 'hyperscaler-v') ||
        startsWith(github.ref_name, 'military-v') ||
        startsWith(github.ref_name, 'minimal-v')
      )) ||
      (github.event_name == 'workflow_dispatch' &&
       contains(fromJSON('["enterprise","hyperscaler","military","minimal"]'), inputs.edition))
    environment:
      name: ${{ startsWith(github.ref_name, 'enterprise-v') && 'enterprise-release' || startsWith(github.ref_name, 'hyperscaler-v') && 'hyperscaler-release' || startsWith(github.ref_name, 'military-v') && 'military-release' || startsWith(github.ref_name, 'minimal-v') && 'minimal-release' || inputs.edition == 'enterprise' && 'enterprise-release' || inputs.edition == 'hyperscaler' && 'hyperscaler-release' || inputs.edition == 'military' && 'military-release' || inputs.edition == 'minimal' && 'minimal-release' || 'private-release' }}

    permissions:
      contents: write   # required: create/update GitHub Releases and upload assets
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: release/

      - name: Determine edition
        id: edition
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if echo "${TAG}" | grep -q '^enterprise-'; then ED=enterprise
          elif echo "${TAG}" | grep -q '^hyperscaler-'; then ED=hyperscaler
          elif echo "${TAG}" | grep -q '^military-'; then ED=military
          elif echo "${TAG}" | grep -q '^minimal-'; then ED=minimal
          else ED="${{ inputs.edition }}"
          fi
          echo "edition=${ED}" >> "$GITHUB_OUTPUT"

      - name: Publish to private registry
        env:
          PRIVATE_REGISTRY_TOKEN: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}
        run: |
          echo "Publishing ${{ steps.edition.outputs.edition }} release artifacts..."
          # Actual registry push implemented via scripts/publish_private_release.sh
          if [ -f scripts/publish_private_release.sh ]; then
            bash scripts/publish_private_release.sh \
              --edition "${{ steps.edition.outputs.edition }}" \
              --release-dir release/ \
              --token "${PRIVATE_REGISTRY_TOKEN}"
          else
            echo "::warning::scripts/publish_private_release.sh not found — skipping private publish step."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Changelog — update CHANGELOG.md after community release
  # ─────────────────────────────────────────────────────────────────────────────
  changelog:
    name: Update Changelog
    needs: publish-community
    if: >
      always() &&
      needs.publish-community.result == 'success'
    uses: ./.github/workflows/release-changelog.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      mode: update
      entry-title: "${{ github.ref_name }}"
      entry-body: "- Released ${{ github.ref_name }} — see GitHub Release for full artifact list."
      section: "Changed"
      target-version: "${{ github.ref_name }}"
      release-date: ""
      key: "release-${{ github.ref_name }}"
      target-branch: "develop"
      dry-run: false
    secrets: inherit
