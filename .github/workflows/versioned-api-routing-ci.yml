name: Versioned API Routing CI

# Validates the Versioned API Routing and /v2/ Prefix feature (v1.8.0).
# Triggered on every push/PR that touches the relevant source files.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/server/route_version_router.h'
      - 'include/server/entity_api_handler.h'
      - 'src/server/entity_api_handler.cpp'
      - 'include/server/query_api_handler.h'
      - 'src/server/query_api_handler.cpp'
      - 'include/server/async_job_api_handler.h'
      - 'src/server/async_job_api_handler.cpp'
      - 'src/server/http_server.cpp'
      - 'tests/test_versioned_api_routing.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/versioned-api-routing-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/server/route_version_router.h'
      - 'include/server/entity_api_handler.h'
      - 'src/server/entity_api_handler.cpp'
      - 'include/server/query_api_handler.h'
      - 'src/server/query_api_handler.cpp'
      - 'include/server/async_job_api_handler.h'
      - 'src/server/async_job_api_handler.cpp'
      - 'src/server/http_server.cpp'
      - 'tests/test_versioned_api_routing.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/versioned-api-routing-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the VersionedApiRoutingFocused test suite.
  # Acceptance criteria covered:
  #   AC-VAR-1   RouteVersionRouter: unversioned paths redirect to /v1/
  #   AC-VAR-2   RouteVersionRouter: already-versioned paths not redirected
  #   AC-VAR-3   RouteVersionRouter: exempt paths never redirect
  #   AC-VAR-4   RouteVersionRouter: normalize() strips /v1/ and /v2/ prefixes
  #   AC-VAR-5   POST /v2/documents accepts application/x-ndjson; max 10,000 docs
  #   AC-VAR-6   POST /v2/documents rejects wrong Content-Type with 415
  #   AC-VAR-7   POST /v2/documents returns inserted count
  #   AC-VAR-8   POST /v2/documents auto-generates keys when _key absent
  #   AC-VAR-9   POST /v2/documents reports per-line errors for malformed JSON
  #   AC-VAR-10  AsyncJobRegistry default TTL = 1 hour (3600 s)
  #   AC-VAR-11  AsyncJobApiHandler: POST /v2/jobs returns 202 with job_id
  #   AC-VAR-12  AsyncJobApiHandler: GET /v2/jobs/{id} returns job status
  #   AC-VAR-13  AsyncJobApiHandler: DELETE /v2/jobs/{id} cancels a job
  #   AC-VAR-14  GET /v2/query/stream returns 400 when 'q' param missing
  #   AC-VAR-15  GET /v2/query/stream returns text/event-stream Content-Type
  #   AC-VAR-16  Bulk insert of 10,000 x 256-byte docs in < 500 ms
  #   AC-VAR-17  SSE first-byte latency < 5 ms after query planning completes
  #   AC-VAR-18  AsyncJobApiHandler persists completed job in AdaptiveQueryCache (TTL=1h)
  # ---------------------------------------------------------------------------
  versioned-api-routing-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Versioned API Routing (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run VersionedApiRoutingFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R VersionedApiRoutingFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee versioned_api_routing_ctest.txt

      # ── Full test filter via unified binary ────────────────────────────────
      - name: Run RouteVersionRouterAC and BulkNdjson tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_versioned_api_routing_focused \
            --gtest_filter="RouteVersionRouterAC*:BulkNdjsonTest*:AsyncJobRegistry*:AsyncJobApiHandlerAC*:QueryStreamSseAcTest*" \
            --gtest_output="xml:versioned_api_routing_gtest.xml" \
            2>&1 | tee versioned_api_routing_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versioned-api-routing-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/versioned_api_routing_ctest.txt
            build/versioned_api_routing_gtest.xml
            build/versioned_api_routing_gtest_output.txt
          retention-days: 30
