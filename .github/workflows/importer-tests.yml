name: Importer Module Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/importers/**'
      - 'include/importers/**'
      - 'include/server/import_api_handler.h'
      - 'src/server/import_api_handler.cpp'
      - 'tests/test_postgres_importer*.cpp'
      - 'tests/test_importer_async_api.cpp'
      - 'tests/test_importer_conflict_resolver.cpp'
      - 'tests/test_mysql_importer.cpp'
      - 'tests/test_mongo_importer.cpp'
      - 'tests/test_sqlite_importer.cpp'
      - 'tests/test_flatfile_importer.cpp'
      - 'tests/test_importer_plugin_api.cpp'
      - 'tests/test_kafka_importer.cpp'
      - 'tests/fixtures/importers/**'
      - 'tools/import_cli.cpp'
      - 'docs/importers_roadmap.md'
      - 'docs/importers_runbook.md'
      - '.github/workflows/importer-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/importers/**'
      - 'include/importers/**'
      - 'include/server/import_api_handler.h'
      - 'src/server/import_api_handler.cpp'
      - 'tests/test_postgres_importer*.cpp'
      - 'tests/test_importer_async_api.cpp'
      - 'tests/test_importer_conflict_resolver.cpp'
      - 'tests/test_mysql_importer.cpp'
      - 'tests/test_mongo_importer.cpp'
      - 'tests/test_sqlite_importer.cpp'
      - 'tests/test_flatfile_importer.cpp'
      - 'tests/test_importer_plugin_api.cpp'
      - 'tests/test_kafka_importer.cpp'
      - 'tests/fixtures/importers/**'
      - 'tools/import_cli.cpp'
      - 'docs/importers_roadmap.md'
      - 'docs/importers_runbook.md'
      - '.github/workflows/importer-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build & run the self-contained importer test suites (no external DB needed)
  # ---------------------------------------------------------------------------
  importer-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Importer unit tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            nlohmann-json3-dev librocksdb-dev libssl-dev
            libsimdjson-dev libtbb-dev libboost-system-dev
            libyaml-cpp-dev libcurl4-openssl-dev

      - name: Configure (importer tests only)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_PERF_AUTO_ENABLE=OFF

      # Build only the unified test binary (all test_*.cpp files are compiled in)
      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      - name: Run importer unit tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="*Importer*:*Import*:*SplitTopLevelCommas*:*FindMatchingParen*:*SpanCallback*:*Pg16Fixture*:*RealDdlSplit*:*FuzzStyle*:*ImportHandle*:*ImportJobRegistry*:*AsyncImport*:*ImportMetrics*:*ImportApiHandler*:*ImportStats*:*SpanOperation*:*Mongo*:*MongoBson*:*CsvRowParser*:*FormatDetection*:*FilenameStem*:*Utf8Validation*:*CsvImport*:*TsvImport*:*JsonlImport*:*CsvFixture*:*TsvFixture*:*JsonlFixture*:*ConflictResolver*:*MergeEntities*" \
            --gtest_output="xml:importer_test_results.xml" \
            2>&1 | tee importer_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: importer-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/importer_test_results.xml
            build/importer_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📥 Importer Tests – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Importer modules: PostgreSQL (Pg12–Pg16), MySQL, MongoDB, async API, import metrics." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Integration tests against a live PostgreSQL instance
  # ---------------------------------------------------------------------------
  postgres-live-integration:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: PostgreSQL live integration tests
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER:     themis
          POSTGRES_PASSWORD: themistestpw
          POSTGRES_DB:       themis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             gcc-12
          cxx:            g++-12
          extra-packages: nlohmann-json3-dev postgresql-client-15 librocksdb-dev

      - name: Create test schema and seed data in PostgreSQL
        env:
          PGPASSWORD: themistestpw
        run: |
          psql -h localhost -U themis -d themis_test <<'EOSQL'
          CREATE TABLE users (
              id integer NOT NULL,
              username character varying(64) NOT NULL,
              email text,
              age smallint,
              score double precision,
              balance numeric(10,2),
              is_active boolean DEFAULT true,
              created_at timestamp without time zone,
              profile jsonb,
              ip_address inet,
              CONSTRAINT users_pkey PRIMARY KEY (id)
          );
          CREATE TABLE products (
              id bigint NOT NULL,
              name text NOT NULL,
              description text,
              price double precision,
              in_stock boolean,
              tags text[],
              metadata jsonb,
              CONSTRAINT products_pkey PRIMARY KEY (id)
          );
          CREATE TABLE orders (
              id integer NOT NULL,
              user_id integer,
              product_id bigint,
              quantity integer,
              total_price numeric(10,2),
              order_date timestamp without time zone,
              CONSTRAINT orders_pkey PRIMARY KEY (id)
          );
          INSERT INTO users VALUES
              (1,'alice','alice@example.com',30,99.5,1234.56,true,
               '2024-01-15 10:00:00','{"bio":"admin"}','192.168.1.1'),
              (2,'bob','bob@example.com',25,75.0,99.00,true,
               '2024-02-01 08:30:00','{"bio":"user"}','10.0.0.5'),
              (3,'charlie',NULL,40,NULL,0.00,false,
               '2023-12-01 00:00:00',NULL,NULL);
          INSERT INTO products VALUES
              (100,'Widget A','A small widget',9.99,true,
               '{electronics,small}','{"sku":"WA-001"}'),
              (101,'Gadget B','A medium gadget',49.99,true,
               '{electronics,medium}','{"sku":"GB-002"}'),
              (102,'Thing C',NULL,NULL,false,'{}',NULL);
          INSERT INTO orders VALUES
              (1001,1,100,2,19.98,'2024-03-01 14:00:00'),
              (1002,2,101,1,49.99,'2024-03-02 09:15:00'),
              (1003,1,102,5,0.00,'2024-03-03 16:30:00');
          EOSQL

      - name: Dump live database with pg_dump
        env:
          PGPASSWORD: themistestpw
        run: |
          pg_dump -h localhost -U themis -d themis_test \
            -F p --no-acl --no-owner \
            -f /tmp/live_pg_dump.sql
          echo "Dump generated: $(wc -l < /tmp/live_pg_dump.sql) lines"
          head -6 /tmp/live_pg_dump.sql

      - name: Configure (importer tests only)
        env:
          CC:  gcc-12
          CXX: g++-12
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_PERF_AUTO_ENABLE=OFF

      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      - name: Run live PostgreSQL integration tests
        env:
          THEMISDB_PG_LIVE_DUMP: /tmp/live_pg_dump.sql
          THEMISDB_PG_CONNSTR:   "host=localhost user=themis dbname=themis_test"
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="PostgresLiveIntegration*" \
            --gtest_output="xml:live_pg_test_results.xml" \
            2>&1 | tee live_pg_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pg-test-results
          path: |
            build/live_pg_test_results.xml
            build/live_pg_test_output.txt
            /tmp/live_pg_dump.sql
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📥 Importer Tests – Live PostgreSQL Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **PostgreSQL version** | \`15\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`ubuntu-22.04\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Test schema seeded in PostgreSQL 15, dumped with pg_dump, and imported through the ThemisDB importer pipeline." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Integration tests against a live MongoDB 6.0 instance
  # ---------------------------------------------------------------------------
  mongodb-live-integration:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: MongoDB live integration tests
    runs-on: ubuntu-22.04

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             gcc-12
          cxx:            g++-12
          extra-packages: >-
            nlohmann-json3-dev librocksdb-dev
            mongodb-mongosh

      - name: Seed MongoDB with test data
        run: |
          # Wait for MongoDB to be ready
          for i in $(seq 1 30); do
            mongosh --host localhost:27017 --eval "db.runCommand({ ping: 1 })" \
              >/dev/null 2>&1 && break
            sleep 2
          done

          # Seed test collections using mongoexport-compatible NDJSON
          mongosh --host localhost:27017 --eval "
            db = db.getSiblingDB('themis_test');

            // users collection with BSON extended types
            db.users.insertMany([
              {
                _id: ObjectId('507f1f77bcf86cd799439011'),
                name: 'Alice',
                email: 'alice@example.com',
                balance: NumberDecimal('1234.56'),
                created_at: ISODate('2024-01-15T10:00:00Z'),
                age: NumberInt(30),
                score: 99.5,
                is_active: true,
                avatar: BinData(0, 'SGVsbG8gV29ybGQ=')
              },
              {
                _id: ObjectId('507f1f77bcf86cd799439012'),
                name: 'Bob',
                email: 'bob@example.com',
                balance: NumberDecimal('99.00'),
                created_at: ISODate('2024-02-01T08:30:00Z'),
                age: NumberInt(25),
                score: 75.0,
                is_active: true,
                avatar: null
              },
              {
                _id: ObjectId('507f1f77bcf86cd799439013'),
                name: 'Charlie',
                email: null,
                balance: NumberDecimal('0.00'),
                created_at: ISODate('2023-12-01T00:00:00Z'),
                age: NumberInt(40),
                score: null,
                is_active: false,
                avatar: null
              }
            ]);
            print('Seeded users: ' + db.users.countDocuments());

            // products collection
            db.products.insertMany([
              { _id: ObjectId('507f1f77bcf86cd799439021'), title: 'Widget A', price: NumberDecimal('9.99') },
              { _id: ObjectId('507f1f77bcf86cd799439022'), title: 'Gadget B', price: NumberDecimal('49.99') }
            ]);
            print('Seeded products: ' + db.products.countDocuments());
          "

      - name: Export collections using mongoexport (NDJSON)
        run: |
          mongoexport \
            --host localhost:27017 \
            --db themis_test \
            --collection users \
            --type json \
            --out /tmp/live_users.json
          mongoexport \
            --host localhost:27017 \
            --db themis_test \
            --collection products \
            --type json \
            --out /tmp/live_products.json

          echo "Users exported: $(wc -l < /tmp/live_users.json) documents"
          echo "Products exported: $(wc -l < /tmp/live_products.json) documents"

          # Verify BSON extended types are present in export
          grep -q '\$oid'     /tmp/live_users.json \
            && echo "OK: \$oid present" || echo "WARN: \$oid not found"
          grep -q '\$date'    /tmp/live_users.json \
            && echo "OK: \$date present" || echo "WARN: \$date not found"
          grep -q '\$numberDecimal' /tmp/live_users.json \
            && echo "OK: \$numberDecimal present" || echo "WARN: \$numberDecimal not found"

      - name: Configure (importer tests only)
        env:
          CC:  gcc-12
          CXX: g++-12
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_PERF_AUTO_ENABLE=OFF

      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      - name: Run MongoDB importer tests against live export
        env:
          THEMISDB_MONGO_LIVE_EXPORT_USERS:    /tmp/live_users.json
          THEMISDB_MONGO_LIVE_EXPORT_PRODUCTS: /tmp/live_products.json
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="Mongo*:MongoBson*" \
            --gtest_output="xml:live_mongo_test_results.xml" \
            2>&1 | tee live_mongo_test_output.txt

      - name: Verify BSON type conversions in export
        run: |
          # Verify that ObjectId -> string, ISODate -> ISO 8601, Decimal128 -> string
          python3 - <<'PYEOF'
          import json, sys

          with open('/tmp/live_users.json') as f:
              docs = [json.loads(line) for line in f if line.strip()]

          assert len(docs) == 3, f"Expected 3 users, got {len(docs)}"

          for doc in docs:
              # ObjectId must be a BSON $oid wrapper
              assert '$oid' in doc.get('_id', {}), f"_id must have $oid: {doc['_id']}"
              # ISODate must be a BSON $date wrapper
              assert '$date' in doc.get('created_at', {}), f"created_at must have $date: {doc.get('created_at')}"
              # Decimal128 must be a BSON $numberDecimal wrapper
              assert '$numberDecimal' in doc.get('balance', {}), \
                  f"balance must have $numberDecimal: {doc.get('balance')}"

          print(f"OK: BSON type checks passed for {len(docs)} documents")
          print(f"  _id (ObjectId):          {docs[0]['_id']}")
          print(f"  created_at (ISODate):    {docs[0]['created_at']}")
          print(f"  balance (Decimal128):    {docs[0]['balance']}")
          PYEOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mongo-test-results
          path: |
            build/live_mongo_test_results.xml
            build/live_mongo_test_output.txt
            /tmp/live_users.json
            /tmp/live_products.json
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📥 Importer Tests – Live MongoDB Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **MongoDB version** | \`6.0\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`ubuntu-22.04\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Collections seeded in MongoDB 6.0, exported with mongoexport (NDJSON), BSON type wrappers verified." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Integration tests against a live MySQL 8.0 instance
  # ---------------------------------------------------------------------------
  mysql-live-integration:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: MySQL live integration tests
    runs-on: ubuntu-22.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: themistestpw
          MYSQL_DATABASE:      themis_test
          MYSQL_USER:          themis
          MYSQL_PASSWORD:      themistestpw
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -pthemistestpw"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             gcc-12
          cxx:            g++-12
          extra-packages: nlohmann-json3-dev mysql-client librocksdb-dev

      - name: Create test schema and seed data in MySQL
        env:
          MYSQL_PWD: themistestpw
        run: |
          mysql -h 127.0.0.1 -u root themis_test <<'EOSQL'
          CREATE TABLE users (
              id         INT NOT NULL AUTO_INCREMENT,
              username   VARCHAR(64) NOT NULL,
              email      TEXT,
              age        SMALLINT,
              score      DOUBLE,
              balance    DECIMAL(10,2),
              is_active  TINYINT(1) DEFAULT 1,
              created_at DATETIME,
              profile    JSON,
              PRIMARY KEY (id)
          );
          CREATE TABLE products (
              id          BIGINT NOT NULL AUTO_INCREMENT,
              name        TEXT NOT NULL,
              description TEXT,
              price       DOUBLE,
              in_stock    TINYINT(1),
              metadata    JSON,
              PRIMARY KEY (id)
          );
          INSERT INTO users (username, email, age, score, balance, is_active, created_at, profile) VALUES
              ('alice', 'alice@example.com', 30, 99.5, 1234.56, 1,
               '2024-01-15 10:00:00', '{"bio":"admin"}'),
              ('bob',   'bob@example.com',   25, 75.0, 99.00,   1,
               '2024-02-01 08:30:00', '{"bio":"user"}'),
              ('charlie', NULL,              40, NULL, 0.00,    0,
               '2023-12-01 00:00:00', NULL);
          INSERT INTO products (name, description, price, in_stock, metadata) VALUES
              ('Widget A', 'A small widget',  9.99, 1, '{"sku":"WA-001"}'),
              ('Gadget B', 'A medium gadget', 49.99, 1, '{"sku":"GB-002"}'),
              ('Thing C',  NULL,              NULL, 0, NULL);
          EOSQL

      - name: Dump live database with mysqldump
        env:
          MYSQL_PWD: themistestpw
        run: |
          mysqldump -h 127.0.0.1 -u root \
            --no-tablespaces \
            themis_test \
            > /tmp/live_mysql_dump.sql
          echo "Dump generated: $(wc -l < /tmp/live_mysql_dump.sql) lines"
          head -6 /tmp/live_mysql_dump.sql

      - name: Configure (importer tests only)
        env:
          CC:  gcc-12
          CXX: g++-12
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_PERF_AUTO_ENABLE=OFF

      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      - name: Run MySQL importer tests
        env:
          THEMISDB_MYSQL_LIVE_DUMP: /tmp/live_mysql_dump.sql
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="MySQL*:MySQLType*:MySQLCreate*:MySQLInsert*:MySQLJdbc*:MySQLPrometheus*:MySQLPermission*:MySQLStreaming*" \
            --gtest_output="xml:live_mysql_test_results.xml" \
            2>&1 | tee live_mysql_test_output.txt

      - name: Verify dump structure
        run: |
          python3 - <<'PYEOF'
          with open('/tmp/live_mysql_dump.sql') as f:
              content = f.read()

          assert 'MySQL dump' in content or 'mysqldump' in content.lower(), \
              "Dump must have MySQL header"
          assert 'CREATE TABLE' in content.upper(), \
              "Dump must have CREATE TABLE statements"
          assert 'INSERT INTO' in content.upper(), \
              "Dump must have INSERT INTO statements"
          assert '`users`' in content or 'users' in content, \
              "Dump must reference users table"

          row_count = content.count("'alice'") + content.count("'bob'") + \
                      content.count("'charlie'")
          assert row_count >= 3, f"Expected at least 3 user rows, found {row_count}"
          print(f"OK: MySQL dump structure verified, {row_count} user rows found")
          PYEOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mysql-test-results
          path: |
            build/live_mysql_test_results.xml
            build/live_mysql_test_output.txt
            /tmp/live_mysql_dump.sql
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📥 Importer Tests – Live MySQL Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **MySQL version** | \`8.0\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`ubuntu-22.04\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Test schema seeded in MySQL 8.0, dumped with mysqldump, imported through the ThemisDB importer pipeline." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Validate documentation
  # ---------------------------------------------------------------------------
  docs-lint:
    needs: ci-scope-classifier
    if: >
      needs.ci-scope-classifier.outputs.has_code_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true'
    name: Lint importer docs
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint importers_roadmap.md
        run: markdownlint docs/importers_roadmap.md --config .markdownlint.json

      - name: Lint importers_runbook.md
        run: markdownlint docs/importers_runbook.md --config .markdownlint.json

      - name: Verify fixtures exist
        run: |
          for f in \
            tests/fixtures/importers/sample_pg12.sql \
            tests/fixtures/importers/sample_pg14.sql \
            tests/fixtures/importers/sample_pg15.sql \
            tests/fixtures/importers/sample_pg16.sql \
            tests/fixtures/importers/sample_mongo.json; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f" >&2
              exit 1
            fi
            echo "OK: $f ($(wc -l < $f) lines)"
          done

      - name: Write job summary
        if: always()
        run: |
          echo "## 📝 Importer Tests – Docs Lint" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks performed" >> "$GITHUB_STEP_SUMMARY"
          echo "- markdownlint on \`docs/importers_roadmap.md\` and \`docs/importers_runbook.md\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fixture file existence (pg12, pg14, pg15, pg16, mongo)" >> "$GITHUB_STEP_SUMMARY"
