name: HttpServer ShardingManager CI

# Triggered on every push / PR that touches the ShardingManager injection
# sources or its test file.  Targets v1.8.0 (Issue #201).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/sharding/sharding_manager.h'
      - 'src/sharding/sharding_manager_edition.cpp'
      - 'include/server/http_server.h'
      - 'src/server/http_server.cpp'
      - 'src/main_server.cpp'
      - 'tests/test_http_sharding_admin.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/httpserver-shardingmanager-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/sharding/sharding_manager.h'
      - 'src/sharding/sharding_manager_edition.cpp'
      - 'include/server/http_server.h'
      - 'src/server/http_server.cpp'
      - 'src/main_server.cpp'
      - 'tests/test_http_sharding_admin.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/httpserver-shardingmanager-ci.yml'

concurrency:
  group: httpserver-shardingmanager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  httpserver-shardingmanager-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: HttpServer ShardingManager (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run HttpShardingAdminTest
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="HttpShardingAdminTest*" \
            --gtest_output="xml:http_sharding_admin_gtest.xml" \
            2>&1 | tee http_sharding_admin_results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: httpserver-shardingmanager-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/http_sharding_admin_results.txt
            build/http_sharding_admin_gtest.xml
          retention-days: 30
