name: SIMD Vectorization — AVX-512 and ARM NEON CI

# Triggered on every push / PR that touches the SIMD analytics sources,
# their test files, or this workflow itself.
# Targets v1.8.0 (roadmap:46:analytics:v1.8.0:14-simd-vectorization-avx-512-and-arm-neon).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/analytics/olap.cpp'
      - 'src/analytics/columnar_execution.cpp'
      - 'src/analytics/forecasting.cpp'
      - 'include/analytics/columnar_execution.h'
      - 'tests/analytics/test_columnar_execution.cpp'
      - 'tests/analytics/test_forecasting.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_acceleration_simd-vectorization-avx512-arm-neon-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/analytics/olap.cpp'
      - 'src/analytics/columnar_execution.cpp'
      - 'src/analytics/forecasting.cpp'
      - 'include/analytics/columnar_execution.h'
      - 'tests/analytics/test_columnar_execution.cpp'
      - 'tests/analytics/test_forecasting.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_acceleration_simd-vectorization-avx512-arm-neon-ci.yml'
  workflow_dispatch:

concurrency:
  group: simd-vectorization-avx512-arm-neon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the focused SIMD test suites.
  # Tests cover all acceptance criteria:
  #   AC-1  AVX-512 path in olap.cpp vectorizedSum/Avg/Min/Max (8 doubles/cycle)
  #   AC-2  ARM NEON float64x2_t path in columnar_execution.cpp AggregateOperator
  #   AC-3  Runtime CPUID guard via __builtin_cpu_supports("avx512f")
  #   AC-4  AVX-512 autocovariance kernels in forecasting.cpp Yule–Walker
  #   AC-5  Parity: SIMD SUM/MIN/MAX results within 1 ULP of scalar baseline
  #   AC-6  Parity: ARIMA Yule–Walker with AVX-512 reproduces scalar results
  #   AC-7  SIMD tail handling: non-multiple-of-8 length processed correctly
  #   AC-8  Nullable columns fall back to per-row path (no null skipped)
  # ---------------------------------------------------------------------------
  simd-analytics-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: SIMD analytics tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 builds: AVX2 intrinsics are compiled with Release + THEMIS_ENABLE_AVX2=ON.
          # AVX-512 path is compiled when -mavx512f is added via extra-cmake-flags;
          # the runtime kHasAVX512 guard ensures safe execution on non-AVX-512 runners.
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
          # ARM64 builds: NEON float64x2_t path is compiled and exercised on
          # GitHub-hosted ARM64 runners (Neoverse N1 / Graviton3).
          # THEMIS_ENABLE_AVX2 is irrelevant on AArch64; NEON is always present.
          - os: ubuntu-22.04-arm
            compiler: gcc-12-arm
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04-arm
            compiler: gcc-14-arm
            cc: gcc
            cxx: g++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev
            libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-type: Release

      # ── Focused columnar execution tests (AC-1..AC-8) ──────────────────────
      - name: Run ColumnarExecutionFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ColumnarExecutionFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee simd_columnar_results.txt

      # ── Focused forecasting tests (AC-4, AC-6) ─────────────────────────────
      - name: Run ForecastingFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ForecastingFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee simd_forecasting_results.txt

      # ── SIMD parity assertions via unified binary ──────────────────────────
      - name: Run SIMD parity tests (SIMDParityTest suite)
        run: |
          set -o pipefail
          cd build
          timeout 300 ./tests/themis_tests \
            --gtest_filter="SIMDParityTest*" \
            --gtest_output="xml:simd_parity_gtest.xml" \
            2>&1 | tee simd_parity_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simd-analytics-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/simd_columnar_results.txt
            build/simd_forecasting_results.txt
            build/simd_parity_gtest.xml
            build/simd_parity_gtest_output.txt
          retention-days: 30
