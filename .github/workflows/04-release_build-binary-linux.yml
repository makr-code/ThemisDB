name: Build Binary Release · Linux

# Builds a production Linux binary release of ThemisDB (x86_64) and attaches
# the resulting packages (TGZ + DEB + RPM) to the corresponding GitHub Release.
#
# TRIGGERS
# --------
#   • Push of a tag matching v* (e.g. v1.9.0) from the main branch.
#   • Manual workflow_dispatch for a specific version/tag.
#
# OUTPUTS
# -------
#   Packages uploaded as GitHub Release assets:
#     themisdb-<VERSION>-Linux-x86_64.tar.gz      (TGZ)
#     themisdb-<VERSION>-Linux-x86_64.deb         (Debian package)
#     themisdb-<VERSION>-Linux-x86_64.rpm         (RPM package)
#     SHA256SUMS-linux.txt                         (checksums)
#
# REQUIRED PERMISSIONS
# --------------------
#   contents: write  – to upload release assets
#
# ALTERNATIVE (GitHub CLI)
#   gh workflow run "04-release_build-binary-linux.yml" \
#     --repo makr-code/ThemisDB --ref main \
#     --field tag_name=v1.9.0 --field dry_run=false

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v1.9.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry-run: build and package but do NOT upload to release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  BUILD_TYPE: Release

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 · Build & Package (Linux x86_64)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-linux:
    name: Build & Package – Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag:     ${{ steps.resolve.outputs.tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}

    steps:
      - name: Resolve tag and version
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          else
            TAG="${{ github.ref_name }}"
            DRY_RUN="false"
          fi
          # Strip leading 'v' to get bare semver: v1.9.0 → 1.9.0
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION dry_run=$DRY_RUN"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            librocksdb-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libboost-dev \
            libboost-system-dev \
            libyaml-cpp-dev \
            libzstd-dev \
            rpm

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-

      - name: Setup vcpkg
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
          fi
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg/vcpkg install --clean-after-build

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_DOCS_DB_MODE=AUTO \
            -DTHEMIS_MODELS_MODE=PACKAGE \
            -DTHEMIS_STRICT_BUILD=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(nproc)

      - name: Package with CPack (TGZ + DEB + RPM)
        working-directory: build
        run: |
          cpack -C ${{ env.BUILD_TYPE }} -G TGZ || true
          cpack -C ${{ env.BUILD_TYPE }} -G DEB || true
          cpack -C ${{ env.BUILD_TYPE }} -G RPM || true

      - name: Collect packages and generate checksums
        id: collect
        shell: bash
        run: |
          mkdir -p dist
          find build -maxdepth 2 \
            \( -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} dist/ \;
          echo "Packages:"
          ls -lh dist/
          cd dist
          sha256sum * > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: themisdb-linux-packages-${{ steps.resolve.outputs.version }}
          path: dist/
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          VERSION="${{ steps.resolve.outputs.version }}"
          echo "## 🐧 Build Binary Release · Linux" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ steps.resolve.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | \`${{ steps.resolve.outputs.dry_run }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Packages" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            ls -lh dist/ >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 · Publish (upload packages to GitHub Release)
# ─────────────────────────────────────────────────────────────────────────────
  publish-linux:
    name: Publish – Attach Linux Packages to GitHub Release
    runs-on: ubuntu-latest
    needs: build-linux
    timeout-minutes: 15
    if: needs.build-linux.outputs.dry_run == 'false'

    permissions:
      contents: write

    steps:
      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: themisdb-linux-packages-${{ needs.build-linux.outputs.version }}
          path: dist/

      - name: Upload packages to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-linux.outputs.tag }}"
          echo "Uploading packages to release $TAG"
          ls -lh dist/
          gh release upload "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --clobber

          echo "✅ Linux packages uploaded to release $TAG"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          VERSION="${{ needs.build-linux.outputs.version }}"
          TAG="${{ needs.build-linux.outputs.tag }}"
          echo "## 🐧 Publish Linux Packages → GitHub Release \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| File | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          if [ -d dist ]; then
            for f in dist/*; do
              SIZE=$(du -h "$f" | cut -f1)
              echo "| \`$(basename $f)\` | ${SIZE} |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release:** https://github.com/${{ github.repository }}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
