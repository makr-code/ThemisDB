name: Maintenance — CI Health Dashboard

# Weekly scheduled workflow that aggregates pass/fail rates per workflow
# from the GitHub Actions API and produces a Markdown summary artifact +
# GitHub Job Summary. Surfaces chronic CI bottlenecks without requiring
# external tooling (Datadog, Grafana, etc.).
#
# Pattern inspired by Microsoft azure-sdk-for-cpp CI observability approach.
#
# Triggers: weekly Sunday 06:00 UTC; workflow_dispatch.
# Registry: active — observability, non-blocking.

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly Sunday 06:00 UTC
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of days to look back for workflow run data'
        required: false
        default: '7'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: maintenance-ci-health
  cancel-in-progress: true

jobs:
  ci-health-dashboard:
    name: CI Health Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Collect workflow run statistics
        id: stats
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const lookbackDays = parseInt('${{ inputs.lookback_days || 7 }}', 10);
            const since = new Date(Date.now() - lookbackDays * 86400 * 1000).toISOString();

            // Fetch all workflows
            const { data: wfList } = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            const rows = [];
            let totalRuns = 0, totalFailures = 0;

            for (const wf of wfList.workflows) {
              // Skip inactive workflows
              if (wf.state !== 'active') continue;

              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf.id,
                created: `>=${since}`,
                per_page: 100,
              });

              const completed = runs.workflow_runs.filter(r => r.status === 'completed');
              const failures  = completed.filter(r => r.conclusion === 'failure');
              const successes = completed.filter(r => r.conclusion === 'success');
              const cancelled = completed.filter(r => r.conclusion === 'cancelled');
              const total = completed.length;

              if (total === 0) continue;

              const failRate = total > 0 ? ((failures.length / total) * 100).toFixed(1) : '0.0';
              const healthIcon = failures.length === 0 ? '✅' : failures.length / total > 0.3 ? '🔴' : '🟡';

              rows.push({
                name: wf.name,
                total,
                success: successes.length,
                failure: failures.length,
                cancelled: cancelled.length,
                failRate,
                healthIcon,
              });

              totalRuns += total;
              totalFailures += failures.length;
            }

            // Sort by failure rate descending
            rows.sort((a, b) => parseFloat(b.failRate) - parseFloat(a.failRate));

            // Write step summary
            const fs = require('fs');
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            const overallHealth = totalRuns > 0 ? (((totalRuns - totalFailures) / totalRuns) * 100).toFixed(1) : '100.0';

            let md = [
              `## 📊 CI Health Dashboard — Last ${lookbackDays} Days`,
              '',
              `**Overall health:** ${overallHealth}% pass rate across ${totalRuns} completed runs`,
              '',
              '| Workflow | Runs | ✅ Pass | ❌ Fail | ⏭️ Skip | Fail Rate |',
              '|----------|------|--------|--------|---------|-----------|',
            ];
            for (const r of rows) {
              md.push(`| ${r.healthIcon} ${r.name} | ${r.total} | ${r.success} | ${r.failure} | ${r.cancelled} | ${r.failRate}% |`);
            }
            md.push('');
            md.push(`_Generated ${new Date().toISOString()} — [CI Health Dashboard workflow](.github/workflows/maintenance-ci-health.yml)_`);
            fs.appendFileSync(summaryPath, md.join('\n') + '\n');

            // Write artifact content
            fs.writeFileSync('/tmp/ci-health-report.md', md.join('\n') + '\n');

            // Identify chronic failures (>30% fail rate over lookback window)
            const chronic = rows.filter(r => parseFloat(r.failRate) > 30 && r.failure >= 3);
            core.setOutput('chronic_count', String(chronic.length));
            core.setOutput('chronic_workflows', chronic.map(r => r.name).join(', '));

            console.log(`Processed ${rows.length} active workflows, ${totalRuns} total runs`);

      - name: Upload CI health report
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ci-health-report-${{ github.run_id }}
          path: /tmp/ci-health-report.md
          retention-days: 90

      - name: Open issue for chronic failures
        if: steps.stats.outputs.chronic_count != '0' && steps.stats.outputs.chronic_count != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const chronic = '${{ steps.stats.outputs.chronic_workflows }}';
            const title = '[CI] Chronic workflow failures detected';
            const body = [
              '## CI Health Alert — Chronic Failures',
              '',
              `The following workflows had >30% failure rate over the last 7 days:`,
              '',
              `\`${chronic}\``,
              '',
              'Please investigate root cause and apply fixes.',
              '',
              '_Auto-generated by maintenance-ci-health.yml._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci/chronic-failure',
              per_page: 5,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
                labels: ['ci/chronic-failure', 'status/needs-attention'],
              });
            }
