name: "Build: WinGet E2E Validation"

# Validation helper for the canonical WinGet submission flow.
# It validates the manifest generation and submission path using the finalized GitHub Release
# artifacts, but it is explicitly not the canonical release artifact producer.
#
# Rechenaufwand-Score: R=3 (K=3, L=3, N=3) | last-calibrated: 2026-09-14
# Trigger policy: Dispatch-only; triggered by release-mainline.yml ci-widget job
#                 after successful release build + manifest validation.
#
# End-to-End WinGet Release Path:
#   download-release-assets
#   → generate-checksums (SHA256 of Windows ZIPs/MSIs)
#   → generate-manifests (4 YAML files per PR #422182 structure)
#   → validate-manifests (winget validate on windows-latest)
#   → submit-winget-pr   (gh pr create to makr-code/winget-pkgs fork → microsoft/winget-pkgs)
#   → notify
#
# Manifest structure (based on PR #422182):
#   manifests/t/ThemisDB/ThemisDB/<version>/
#     ThemisDB.ThemisDB.yaml              (version manifest, ManifestVersion 1.6.0)
#     ThemisDB.ThemisDB.installer.yaml    (NestedInstallerType: portable, VCRedist dep)
#     ThemisDB.ThemisDB.locale.en-US.yaml (defaultLocale)
#     ThemisDB.ThemisDB.locale.de-DE.yaml (additional locale)
#
# Required secrets:
#   WINGET_FORK_PAT  — PAT with repo scope on makr-code/winget-pkgs fork
#                      (only used in submit-winget-pr; dry_run skips this job)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (generate manifests but do not submit PR)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tag_name:
        description: "Release tag (e.g. v2.4.0 or v2.4.0-alpha)"
        required: true
        type: string
      source_workflow:
        description: "Origin workflow name (informational)"
        required: false
        default: "Release: Packaging"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: build-widget-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_ID: ThemisDB.ThemisDB
  MANIFEST_BASE: manifests/t/ThemisDB/ThemisDB
  WINGET_PKGS_FORK: makr-code/winget-pkgs

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Download Windows release assets from GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  download-release-assets:
    name: Download Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact-dir: ${{ steps.download.outputs.artifact-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag_name }}"
          # Normalize: ensure v-prefix for gh release download
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
          fi
          # Strip prefix for manifest version field
          VERSION="${TAG#v}"
          VERSION="${VERSION#enterprise-v}"
          VERSION="${VERSION#hyperscaler-v}"
          VERSION="${VERSION#military-v}"
          VERSION="${VERSION#minimal-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Widget path: tag=$TAG  version=$VERSION"

      - name: Download Windows release assets
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release-artifacts
          echo "Downloading assets for tag: $TAG"
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir release-artifacts \
            --pattern "*windows*" \
            --clobber || {
              echo "::warning::No windows-pattern assets found; downloading all assets"
              gh release download "$TAG" \
                --repo "${{ github.repository }}" \
                --dir release-artifacts \
                --clobber
          }
          echo "Downloaded:"
          ls -lh release-artifacts/
          if [[ -z "$(find release-artifacts -type f \( -name '*.zip' -o -name '*.msi' \) -print -quit)" ]]; then
            echo "::error::No .zip or .msi Windows artifacts found for $TAG"
            exit 1
          fi
          echo "artifact-dir=release-artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload assets for downstream jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: widget-release-assets-${{ github.run_number }}
          path: release-artifacts/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Generate SHA256 checksums
  # ─────────────────────────────────────────────────────────────────────────────
  generate-checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: download-release-assets
    outputs:
      checksums-json: ${{ steps.checksums.outputs.checksums-json }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download release assets
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: widget-release-assets-${{ github.run_number }}
          path: release-artifacts/

      - name: Generate checksums
        id: checksums
        shell: pwsh
        run: |
          .github/scripts/generate-winget-checksums.ps1 `
            -ArtifactDir "release-artifacts" `
            -OutputDir "${{ runner.temp }}/checksums"

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: widget-checksums-${{ github.run_number }}
          path: ${{ runner.temp }}/checksums/checksums.json
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Generate WinGet manifests (4 files, ManifestVersion 1.6.0)
  #    Structure mirrors PR #422182: NestedInstallerType portable + de-DE locale
  # ─────────────────────────────────────────────────────────────────────────────
  generate-manifests:
    name: Generate WinGet Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [download-release-assets, generate-checksums]
    outputs:
      manifest-dir: ${{ steps.generate.outputs.manifest-dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download checksums
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: widget-checksums-${{ github.run_number }}
          path: ${{ runner.temp }}/checksums/

      - name: Generate manifests
        id: generate
        shell: pwsh
        env:
          VERSION: ${{ needs.download-release-assets.outputs.version }}
          TAG: ${{ needs.download-release-assets.outputs.tag }}
        run: |
          $Version = $env:VERSION
          $Tag     = $env:TAG

          $ManifestDir = "packaging/winget/manifests/t/ThemisDB/ThemisDB/$Version"
          New-Item -ItemType Directory -Path $ManifestDir -Force | Out-Null

          # Read checksums
          $ChecksumsFile = Join-Path "${{ runner.temp }}/checksums" "checksums.json"
          $Checksums = Get-Content $ChecksumsFile | ConvertFrom-Json

          # Locate x64 ZIP (primary; required)
          $Zip64 = $Checksums.artifacts | Where-Object {
            $_.filename -match "windows.*x64|x64.*windows|COMMUNITY.*windows.*x64" -and
            $_.filename -match "\.zip$"
          } | Select-Object -First 1
          if (-not $Zip64) {
            # Fallback: any windows zip
            $Zip64 = $Checksums.artifacts | Where-Object { $_.filename -match "windows" -and $_.filename -match "\.zip$" } | Select-Object -First 1
          }
          if (-not $Zip64) {
            Write-Error "No x64 Windows ZIP artifact found in checksums.json"
            exit 1
          }
          $Zip86 = $Checksums.artifacts | Where-Object {
            $_.filename -match "windows.*x86|x86.*windows" -and $_.filename -match "\.zip$"
          } | Select-Object -First 1

          $DownloadBase = "https://github.com/${{ github.repository }}/releases/download/$Tag"
          $Url64 = "$DownloadBase/$($Zip64.filename)"
          $Sha64 = $Zip64.sha256.ToUpper()

          # ── version manifest ─────────────────────────────────────────────────
          @"
          PackageIdentifier: ThemisDB.ThemisDB
          PackageVersion: $Version
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.6.0
          "@ -replace '^\s{10}', '' | Set-Content "$ManifestDir/ThemisDB.ThemisDB.yaml" -Encoding UTF8

          # ── installer manifest ───────────────────────────────────────────────
          $installerBlock = @"
          PackageIdentifier: ThemisDB.ThemisDB
          PackageVersion: $Version
          Installers:
          - Architecture: x64
            InstallerType: zip
            InstallerUrl: $Url64
            InstallerSha256: $Sha64
            NestedInstallerType: portable
            NestedInstallerFiles:
            - RelativeFilePath: "ThemisDB-COMMUNITY-$Version-windows-x64\bin\themis_server.exe"
              PortableCommandAlias: themis_server
            Dependencies:
              PackageDependencies:
              - PackageIdentifier: Microsoft.VCRedist.2015+.x64
          "@

          if ($Zip86) {
            $Url86 = "$DownloadBase/$($Zip86.filename)"
            $Sha86 = $Zip86.sha256.ToUpper()
            $installerBlock += @"

          - Architecture: x86
            InstallerType: zip
            InstallerUrl: $Url86
            InstallerSha256: $Sha86
            NestedInstallerType: portable
            NestedInstallerFiles:
            - RelativeFilePath: "ThemisDB-COMMUNITY-$Version-windows-x86\bin\themis_server.exe"
              PortableCommandAlias: themis_server
            Dependencies:
              PackageDependencies:
              - PackageIdentifier: Microsoft.VCRedist.2015+.x86
          "@
          }
          $installerBlock += @"

          ManifestType: installer
          ManifestVersion: 1.6.0
          "@
          $installerBlock -replace '^\s{10}', '' | Set-Content "$ManifestDir/ThemisDB.ThemisDB.installer.yaml" -Encoding UTF8

          # ── en-US locale manifest ────────────────────────────────────────────
          @"
          PackageIdentifier: ThemisDB.ThemisDB
          PackageVersion: $Version
          PackageLocale: en-US
          Publisher: 'ThemisDB Team'
          PublisherUrl: 'https://github.com/makr-code/ThemisDB'
          PublisherSupportUrl: 'https://github.com/makr-code/ThemisDB/issues'
          Author: 'ThemisDB Team'
          PackageName: 'ThemisDB'
          PackageUrl: 'https://github.com/makr-code/ThemisDB'
          License: 'MIT'
          LicenseUrl: 'https://github.com/makr-code/ThemisDB/blob/$Tag/LICENSE'
          Copyright: 'Copyright (c) 2026 ThemisDB Team'
          ShortDescription: 'Multi-model database system with ACID transactions'
          Description: |-
            ThemisDB is a high-performance multi-model database system that supports:

            - Relational data with secondary indexes and hybrid query execution
            - Graph traversals across transactional storage
            - Vector search for semantic workloads
            - Time-series analytics and document storage
            - ACID transactions with MVCC and snapshot isolation
            - Operational observability with metrics and tracing
          Moniker: 'themisdb'
          Tags:
          - database
          - multi-model
          - graph
          - vector
          - timeseries
          - nosql
          - acid
          - mvcc
          - aql
          ReleaseNotes: ''
          ReleaseNotesUrl: 'https://github.com/makr-code/ThemisDB/releases/tag/$Tag'
          ManifestType: defaultLocale
          ManifestVersion: 1.6.0
          "@ -replace '^\s{10}', '' | Set-Content "$ManifestDir/ThemisDB.ThemisDB.locale.en-US.yaml" -Encoding UTF8

          # ── de-DE locale manifest ────────────────────────────────────────────
          @"
          PackageIdentifier: ThemisDB.ThemisDB
          PackageVersion: $Version
          PackageLocale: de-DE
          Publisher: 'ThemisDB Team'
          PublisherUrl: 'https://github.com/makr-code/ThemisDB'
          PublisherSupportUrl: 'https://github.com/makr-code/ThemisDB/issues'
          Author: 'ThemisDB Team'
          PackageName: 'ThemisDB'
          PackageUrl: 'https://github.com/makr-code/ThemisDB'
          License: 'MIT'
          LicenseUrl: 'https://github.com/makr-code/ThemisDB/blob/$Tag/LICENSE'
          Copyright: 'Copyright (c) 2026 ThemisDB Team'
          ShortDescription: 'Multi-Modell-Datenbanksystem mit ACID-Transaktionen'
          Description: |-
            ThemisDB ist ein hochperformantes Multi-Modell-Datenbanksystem mit:

            - Relationalen Daten und hybrider Abfrageausfuehrung
            - Graph-Traversalen auf transaktionalem Speicher
            - Vektorsuche fuer semantische Workloads
            - Zeitreihenanalyse und Dokumentenspeicherung
            - ACID-Transaktionen mit MVCC und Snapshot Isolation
            - Betriebsmetriken und Tracing fuer Observability
          ReleaseNotes: ''
          ReleaseNotesUrl: 'https://github.com/makr-code/ThemisDB/releases/tag/$Tag'
          ManifestType: locale
          ManifestVersion: 1.6.0
          "@ -replace '^\s{10}', '' | Set-Content "$ManifestDir/ThemisDB.ThemisDB.locale.de-DE.yaml" -Encoding UTF8

          Write-Host "✓ Generated manifests in $ManifestDir"
          Write-Host "  Files:"
          Get-ChildItem $ManifestDir | ForEach-Object { Write-Host "    $($_.Name)" }
          "manifest-dir=$ManifestDir" >> $env:GITHUB_OUTPUT

      - name: Upload manifests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: widget-manifests-${{ needs.download-release-assets.outputs.version }}-${{ github.run_number }}
          path: packaging/winget/manifests/t/ThemisDB/ThemisDB/${{ needs.download-release-assets.outputs.version }}/
          retention-days: 90
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Validate manifests with winget (windows-latest runner required)
  # ─────────────────────────────────────────────────────────────────────────────
  validate-manifests:
    name: Validate WinGet Manifests
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [download-release-assets, generate-manifests]
    outputs:
      validated: ${{ steps.validate.outputs.validated }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download manifests
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: widget-manifests-${{ needs.download-release-assets.outputs.version }}-${{ github.run_number }}
          path: manifests/

      - name: Validate with winget
        id: validate
        shell: pwsh
        run: |
          $ManifestDir = "manifests"
          Write-Host "Running: winget validate --manifest $ManifestDir"
          winget validate --manifest $ManifestDir
          if ($LASTEXITCODE -ne 0) {
            Write-Error "winget validate failed (exit $LASTEXITCODE)"
            exit $LASTEXITCODE
          }
          Write-Host "✓ All manifests pass winget validate"
          "validated=true" >> $env:GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Submit WinGet PR (real submission via gh CLI to fork)
  #    Mirrors the structure of PR #422182 (makr-code/winget-pkgs → microsoft/winget-pkgs)
  #    Skipped when dry_run=true
  # ─────────────────────────────────────────────────────────────────────────────
  submit-winget-pr:
    name: Submit to WinGet (fork PR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [download-release-assets, generate-manifests, validate-manifests]
    if: |
      needs.validate-manifests.outputs.validated == 'true' &&
      inputs.dry_run == 'false'
    permissions:
      contents: read
    steps:
      - name: Checkout fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.WINGET_PKGS_FORK }}
          token: ${{ secrets.WINGET_FORK_PAT }}
          fetch-depth: 1

      - name: Download manifests
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: widget-manifests-${{ needs.download-release-assets.outputs.version }}-${{ github.run_number }}
          path: /tmp/widget-manifests/

      - name: Create manifest branch and commit
        shell: bash
        env:
          VERSION: ${{ needs.download-release-assets.outputs.version }}
          GH_TOKEN: ${{ secrets.WINGET_FORK_PAT }}
        run: |
          set -euo pipefail
          BRANCH="add-ThemisDB-${VERSION}"
          TARGET_DIR="manifests/t/ThemisDB/ThemisDB/${VERSION}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch upstream master for a clean base
          git remote add upstream https://github.com/microsoft/winget-pkgs.git
          git fetch upstream master --depth=1
          git checkout -b "$BRANCH" upstream/master

          # Place generated manifests
          mkdir -p "$TARGET_DIR"
          cp /tmp/widget-manifests/*.yaml "$TARGET_DIR/"

          git add "$TARGET_DIR"
          git commit -m "Add ThemisDB.ThemisDB version ${VERSION}"
          git push origin "$BRANCH" --force-with-lease

          # Open PR to microsoft/winget-pkgs (mirrors PR #422182 structure)
          gh pr create \
            --repo microsoft/winget-pkgs \
            --head "makr-code:${BRANCH}" \
            --base master \
            --title "New package: ThemisDB version ${VERSION}" \
            --body "## ThemisDB ${VERSION}

          **Package Identifier:** \`ThemisDB.ThemisDB\`
          **Version:** \`${VERSION}\`

          ### Changes
          - Add manifests for ThemisDB ${VERSION}
          - Includes en-US and de-DE locales
          - Portable ZIP installer with \`bin\\themis_server.exe\`

          ### Verification
          - Manifests validated locally with \`winget validate\`
          - SHA256 checksum sourced from official GitHub Release assets
          - Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.download-release-assets.outputs.tag }}

          ### Package Information
          ThemisDB is a high-performance multi-model database system with ACID transactions, graph traversals, vector search, time-series analytics, and a hybrid query language (AQL).

          ### Checklist
          - [x] \`winget validate --manifest\` passed without errors
          - [x] SHA256 hash matches the published release artifact
          - [x] Installer URL is publicly accessible
          - [x] Locale files (en-US, de-DE) are present"

          echo "::notice::WinGet PR submitted for version ${VERSION}"

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Summary
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: Widget Pipeline Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [download-release-assets, generate-manifests, validate-manifests, submit-winget-pr]
    if: always()
    steps:
      - name: Report
        shell: bash
        run: |
          echo "══════════════════════════════════════════════════════════"
          echo " Build: Widget Path — WinGet Release Summary"
          echo "══════════════════════════════════════════════════════════"
          echo "  Tag:          ${{ needs.download-release-assets.outputs.tag }}"
          echo "  Version:      ${{ needs.download-release-assets.outputs.version }}"
          echo "  Dry run:      ${{ inputs.dry_run }}"
          echo "  Manifests:    ${{ needs.generate-manifests.outputs.manifest-dir }}"
          echo "  Validated:    ${{ needs.validate-manifests.outputs.validated }}"
          echo "  Source:       ${{ inputs.source_workflow }}"
          echo ""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "  ℹ Dry-run: manifests generated and validated, PR NOT submitted."
            echo "  ↳ Download artifact: widget-manifests-${{ needs.download-release-assets.outputs.version }}-${{ github.run_number }}"
            echo "  ↳ To submit: re-run with dry_run=false (requires WINGET_FORK_PAT secret)"
          else
            echo "  ✓ PR submitted to microsoft/winget-pkgs"
            echo "  ↳ https://github.com/microsoft/winget-pkgs/pulls?q=${{ needs.download-release-assets.outputs.version }}"
          fi
          echo "══════════════════════════════════════════════════════════"
