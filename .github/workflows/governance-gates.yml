name: Governance — Gates

# Consolidated governance workflow.
# Replaces: 10-governance_maturity-verification.yml,
#           11-governance_module-phase-gate.yml,
#           12-governance_gate-audit-summary.yml,
#           12-governance_merge-gate-enforcer.yml,
#           12-governance_rc-validation.yml,
#           12-governance_waiver-expiration-check.yml

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, reopened]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
    paths:
      - 'src/**'
      - 'include/**'
      - 'src/*/ROADMAP.md'
      - 'docs/governance/**'
      - '.github/workflows/governance-gates.yml'
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 3 * * *'     # Daily 03:00 UTC — maturity verification + waiver expiration
    - cron: '0 9 * * *'     # Daily 09:00 UTC — waiver expiration check
    - cron: '0 8 * * MON'   # Weekly Monday 08:00 UTC — gate audit summary
    - cron: '0 8 1 1,4,7,10 *'  # Quarterly — branch protection drift detection
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:
    inputs:
      rc_tag:
        description: 'Release Candidate tag for RC validation (e.g., v8.1.0-rc.1)'
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  security-events: read

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # 1. Maturity Verification (push/PR/schedule)
  maturity-verification:
    name: Maturity Evidence & Gate Verification
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install pyyaml jsonschema gitpython

      - name: Load Maturity Evidence Manifest
        id: manifest
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path

          manifest_file = Path("docs/governance/MATURITY_EVIDENCE_MANIFEST.json")
          if not manifest_file.exists():
              print("::warning::MATURITY_EVIDENCE_MANIFEST.json not found — skipping.")
              exit(0)
          manifest = json.loads(manifest_file.read_text())
          print(f"Loaded {len(manifest.get('evidence_items', []))} evidence items.")
          EOF

      - name: Verify maturity gates
        run: |
          python3 .github/scripts/verify_maturity_gates.py \
            --manifest docs/governance/MATURITY_EVIDENCE_MANIFEST.json \
            --output /tmp/maturity_report.json || true

      - name: Upload maturity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maturity-report-${{ github.run_number }}
          path: /tmp/maturity_report.json
          retention-days: 30
          if-no-files-found: ignore

  # 2. Module Phase Gate (PR — ROADMAP.md changes)
  module-phase-gate:
    name: Module Phase Closure Validation
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Identify changed modules
        id: modules
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED_ROADMAPS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep 'src/.*/ROADMAP\.md' || true)
          echo "changed_roadmaps<<EOF" >> "$GITHUB_OUTPUT"
          echo "${CHANGED_ROADMAPS}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate phase closures
        if: steps.modules.outputs.changed_roadmaps != ''
        run: |
          echo "${{ steps.modules.outputs.changed_roadmaps }}" | while read -r roadmap; do
            [ -z "${roadmap}" ] && continue
            module=$(dirname "${roadmap}" | xargs basename)
            echo "Validating phase closure for module: ${module}"
            python3 .github/scripts/validate_module_phase_gate.py \
              --roadmap "${roadmap}" \
              --module "${module}" || true
          done

  # 3. Merge Gate Enforcer (PR open/sync/review/comment)
  merge-gate-enforcer:
    name: Merge Gate Enforcer
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' &&
       (github.event.action == 'opened' || github.event.action == 'synchronize')) ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'issue_comment'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tier 0 gate validation
        id: validate
        run: |
          python3 .github/scripts/merge_gate_validator.py \
            --tier 0 \
            --output /tmp/gate_result.json || true

          if [ -f /tmp/gate_result.json ]; then
            STATUS=$(python3 -c "import json; d=json.loads(open('/tmp/gate_result.json').read()); print(d.get('status','unknown'))")
            echo "tier0_status=${STATUS}" >> "$GITHUB_OUTPUT"
          else
            echo "tier0_status=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Post gate result to PR
        if: github.event_name == 'pull_request' && steps.validate.outputs.tier0_status != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Merge Gate Enforcer: validation completed.';
            try {
              const result = JSON.parse(fs.readFileSync('/tmp/gate_result.json', 'utf8'));
              body = `## Merge Gate Result\n- Status: ${result.status}\n- Message: ${result.message || 'n/a'}`;
            } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || context.issue.number,
              body,
            });

  # 4. RC Validation (RC tags + manual dispatch)
  rc-validation:
    name: Release Candidate Validation
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc.')) ||
      (github.event_name == 'workflow_dispatch' && inputs.rc_tag != '')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.rc_tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract RC tag
        id: tag
        run: |
          TAG="${{ inputs.rc_tag || github.ref_name }}"
          echo "rc_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "RC Tag: ${TAG}"

      - name: Verify Wave-7–9 technical gates
        run: |
          python3 << 'EOF'
          import json, sys
          from pathlib import Path

          manifest_file = Path("docs/governance/MATURITY_EVIDENCE_MANIFEST.json")
          if not manifest_file.exists():
              print("::warning::MATURITY_EVIDENCE_MANIFEST.json not found — skipping gate check.")
              sys.exit(0)
          manifest = json.loads(manifest_file.read_text())
          required_waves = {"wave7", "wave8", "wave9"}
          passed = {item["wave"] for item in manifest.get("evidence_items", []) if item.get("status") == "pass"}
          missing = required_waves - passed
          if missing:
              print(f"::error::Missing gate evidence for waves: {', '.join(sorted(missing))}")
              sys.exit(1)
          print("All required Wave-7–9 gates passed.")
          EOF

      - name: Produce RC validation summary
        if: always()
        run: |
          {
            echo "## RC Validation — ${{ steps.tag.outputs.rc_tag }}"
            echo "| Gate | Status |"
            echo "|------|--------|"
            echo "| Wave-7–9 Evidence | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # 5. Gate Audit Summary (weekly)
  gate-audit-summary:
    name: Weekly Gate Audit Summary
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analyse gate metrics
        run: |
          python3 << 'EOF'
          import json, sys
          from pathlib import Path
          from datetime import datetime, timedelta
          from collections import defaultdict

          audit_log = Path("ai_working/MERGE_GATE_AUDIT_LOG.jsonl")
          waiver_log = Path("ai_working/ENFORCEMENT_WAIVERS.md")

          metrics = {
              "period_start": (datetime.utcnow() - timedelta(days=7)).isoformat(),
              "period_end": datetime.utcnow().isoformat(),
              "total_validations": 0,
              "total_passes": 0,
              "total_failures": 0,
              "total_waivers": 0,
              "gate_failure_counts": {},
              "most_common_failures": [],
          }

          if audit_log.exists():
              for line in audit_log.read_text().splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      entry = json.loads(line)
                      metrics["total_validations"] += 1
                      if entry.get("status") == "pass":
                          metrics["total_passes"] += 1
                      else:
                          metrics["total_failures"] += 1
                          gate = entry.get("gate", "unknown")
                          metrics["gate_failure_counts"][gate] = metrics["gate_failure_counts"].get(gate, 0) + 1
                  except json.JSONDecodeError:
                      continue

          print(json.dumps(metrics, indent=2))
          Path("/tmp/gate_audit_summary.json").write_text(json.dumps(metrics, indent=2))
          EOF

      - name: Upload audit summary
        uses: actions/upload-artifact@v4
        with:
          name: gate-audit-summary-${{ github.run_number }}
          path: /tmp/gate_audit_summary.json
          retention-days: 90

  # 6. Waiver Expiration Check (daily)
  waiver-expiration-check:
    name: Waiver Expiration Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check expiring waivers
        id: check
        run: |
          python3 .github/scripts/waiver_validator.py \
            --check-expiration \
            --output /tmp/expiring_waivers.json || true

          if [ -f /tmp/expiring_waivers.json ]; then
            COUNT=$(python3 -c "import json; print(json.load(open('/tmp/expiring_waivers.json')).get('total', 0))" 2>/dev/null || echo "0")
            echo "expiring_count=${COUNT}" >> "$GITHUB_OUTPUT"
          else
            echo "expiring_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create expiration issues
        if: steps.check.outputs.expiring_count > 0
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const count = Number(${{ steps.check.outputs.expiring_count }});
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Governance] ${count} waiver(s) expiring soon`,
              body: `**Waiver Expiration Reminder**\n\n${count} governance waiver(s) are expiring within 7 days. Please review \`ai_working/ENFORCEMENT_WAIVERS.md\` and renew or resolve each waiver.\n\n_Auto-generated by governance-gates.yml._`,
              labels: ['governance', 'status/needs-attention'],
            });

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Wave Gate Automation
  # Parses src/*/ROADMAP.md checkbox statuses and validates that no [~]
  # (in-progress) items block the current Wave exit criteria defined in the
  # root ROADMAP.md §Wave gate model.
  # Runs on: PR, push to develop, schedule, workflow_dispatch.
  # ──────────────────────────────────────────────────────────────────────────
  wave-gate-automation:
    name: Wave Gate Automation (ROADMAP checkbox parser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'

      - name: Parse ROADMAP checkboxes and evaluate wave gates
        id: wave_gate
        run: |
          python3 - << 'PY'
          import re
          import sys
          import json
          from pathlib import Path

          # ── Load current wave from root ROADMAP.md ──────────────────────
          root_roadmap = Path("ROADMAP.md").read_text(encoding="utf-8")

          # Detect current wave (first Wave X marked as "→ CURRENT" or "Current")
          current_wave_match = re.search(
              r'###\s+(Wave\s+\w+)[^\n]*(?:CURRENT|current)', root_roadmap
          )
          current_wave = current_wave_match.group(1) if current_wave_match else "Wave A"

          # Extract exit criteria for the current wave
          wave_section = re.search(
              r'###\s+' + re.escape(current_wave) + r'.*?(?=###\s+Wave|\Z)',
              root_roadmap, re.DOTALL
          )
          wave_text = wave_section.group(0) if wave_section else ""

          # ── Scan src/*/ROADMAP.md for blocking in-progress items ────────
          blocking = []
          skipped = []
          for roadmap_file in sorted(Path("src").glob("*/ROADMAP.md")):
              module = roadmap_file.parent.name
              text = roadmap_file.read_text(encoding="utf-8")
              # [~] = in-progress items that may block wave exit
              in_progress = re.findall(r'- \[~\] (.+)', text)
              if in_progress:
                  blocking.append({"module": module, "items": in_progress})

          # ── Emit summary ────────────────────────────────────────────────
          summary_lines = [
              f"## Wave Gate Automation — {current_wave}",
              "",
          ]
          if blocking:
              summary_lines += [
                  f"⚠️ **{sum(len(b['items']) for b in blocking)} in-progress [~] item(s)** detected across modules.",
                  "",
                  "| Module | In-Progress Items |",
                  "|--------|------------------|",
              ]
              for b in blocking:
                  for item in b["items"]:
                      summary_lines.append(f"| `{b['module']}` | {item[:80]} |")
              summary_lines += [
                  "",
                  "_Review and resolve [~] items before promoting to the next Wave._",
              ]
              exit_status = "warning"
          else:
              summary_lines += [
                  f"✅ No blocking [~] in-progress items found across src/ modules.",
                  "",
                  "_Wave gate check passed._",
              ]
              exit_status = "pass"

          # Write to step summary
          with open(Path(f"{__import__('os').environ['GITHUB_STEP_SUMMARY']}"), "a") as f:
              f.write("\n".join(summary_lines) + "\n")

          # Write outputs
          with open(Path(f"{__import__('os').environ['GITHUB_OUTPUT']}"), "a") as f:
              f.write(f"wave={current_wave}\n")
              f.write(f"status={exit_status}\n")
              f.write(f"blocking_count={sum(len(b['items']) for b in blocking)}\n")

          print(f"Wave: {current_wave}, Status: {exit_status}, Blocking: {sum(len(b['items']) for b in blocking)}")
          PY

      - name: Annotate PR with wave gate status
        if: github.event_name == 'pull_request' && steps.wave_gate.outputs.blocking_count != '0'
        run: |
          echo "::warning::Wave gate — ${{ steps.wave_gate.outputs.blocking_count }} in-progress [~] items detected in module ROADMAPs. Review before wave promotion."

  # ──────────────────────────────────────────────────────────────────────────
  # 8. Branch Protection Drift Detection
  # Validates that all canonical branches have required checks, required
  # reviews, and force-push disabled. Raises a governance/drift issue if
  # any branch deviates from the policy.
  # Runs: quarterly schedule (first Monday of Jan/Apr/Jul/Oct) + dispatch.
  # ──────────────────────────────────────────────────────────────────────────
  branch-protection-drift:
    name: Branch Protection Drift Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Quarterly: cron '0 8 1 1,4,7,10 *' (first of month at 08:00 UTC for
    # Jan/Apr/Jul/Oct). Also fires on workflow_dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate branch protection for canonical branches
        id: drift
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            // Canonical branches per BRANCHING_STRATEGY.md
            const CANONICAL = ['develop', 'minimal', 'community', 'enterprise', 'hyperscaler', 'military'];
            const REQUIRED_CHECKS = ['release-critical-tests'];  // extend as needed
            const drifted = [];

            for (const branch of CANONICAL) {
              let protection;
              try {
                const { data } = await github.rest.repos.getBranchProtection({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  branch,
                });
                protection = data;
              } catch (err) {
                if (err.status === 404) {
                  drifted.push({ branch, issue: 'No branch protection configured' });
                  continue;
                }
                core.warning(`Could not read branch protection for ${branch}: ${err.message}`);
                continue;
              }

              // Check: force-push disabled
              if (protection.allow_force_pushes && protection.allow_force_pushes.enabled) {
                drifted.push({ branch, issue: 'force-push is ENABLED (must be disabled)' });
              }

              // Check: at least one required status check
              const checks = protection.required_status_checks?.contexts || [];
              const missingChecks = REQUIRED_CHECKS.filter(c => !checks.includes(c));
              if (missingChecks.length > 0) {
                drifted.push({ branch, issue: `Missing required status checks: ${missingChecks.join(', ')}` });
              }

              // Check: required reviews
              if (!protection.required_pull_request_reviews) {
                drifted.push({ branch, issue: 'No required PR reviews configured' });
              }
            }

            core.setOutput('drift_count', String(drifted.length));
            core.setOutput('drifted_branches', JSON.stringify(drifted));

            // Step summary
            const summaryPath = process.env.GITHUB_STEP_SUMMARY;
            const fs = require('fs');
            if (drifted.length > 0) {
              let lines = ['## ⚠️ Branch Protection Drift Detected', '', '| Branch | Issue |', '|--------|-------|'];
              for (const d of drifted) lines.push(`| \`${d.branch}\` | ${d.issue} |`);
              fs.appendFileSync(summaryPath, lines.join('\n') + '\n');
            } else {
              fs.appendFileSync(summaryPath, '## ✅ Branch Protection — All canonical branches compliant\n');
            }

      - name: Open or update drift issue
        if: steps.drift.outputs.drift_count != '0'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const drifted = JSON.parse(process.env.DRIFTED_BRANCHES || '[]');
            const title = '[Governance] Branch protection drift detected';
            let rows = drifted.map(d => `| \`${d.branch}\` | ${d.issue} |`).join('\n');
            const body = [
              '## Branch Protection Drift Report',
              '',
              'The following canonical branches have drifted from the required protection policy:',
              '',
              '| Branch | Issue |',
              '|--------|-------|',
              rows,
              '',
              'See `BRANCHING_STRATEGY.md` for the required configuration.',
              '',
              '_Auto-generated by governance-gates.yml._',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'governance/drift',
              per_page: 5,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['governance/drift', 'status/needs-attention'],
              });
            }
        env:
          DRIFTED_BRANCHES: ${{ steps.drift.outputs.drifted_branches }}
