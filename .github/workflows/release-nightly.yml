name: "Release: Nightly"

# Rechenaufwand-Score: R=6 (K=6, L=6, N=6) | last-calibrated: 2026-09-04
# Trigger policy: repo framework score calibration for workflow cost controls.
# Automatic nightly builds and releases: every night + manual dispatch.
#
# Pipeline stages:
#   check-changes → set-release-type → build-matrix → generate-metadata
#   → publish-release → track-downstream; publish-docker → publish-docker-manifest → notify
#
# Produces:
#   GitHub Release: v<version>-nightly.<date>.<run>
#   Docker tags:
#     - themisdb:nightly
#     - themisdb:nightly-<date>
#     - themisdb:<version>-nightly-<date>
#   Release artifacts:
#     - build-metadata.json
#     - Packages from successful platform lanes
#   Release notes include the nightly changelog.
#
# Nightly versioning: uses VERSION file base + "nightly" suffix
# Example: VERSION=2.4.0 → v2.4.0-nightly.20260904.1234

on:
  workflow_run:
    workflows: ["Build: Mainline"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      force:
        description: "Force build even if no commits since last nightly"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Build and validate without creating releases, publishing Docker tags, or updating the nightly issue; scheduled runs still publish."
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-release-nightly-develop
  cancel-in-progress: false

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [mark-release-pending, check-changes, set-release-type, build-matrix, generate-metadata, publish-release, track-downstream, publish-docker, publish-docker-manifest, finalize-release-status, notify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'Nightly build and runtime validation (dry-run; publication suppressed)' || 'Nightly build, release, and Docker publication' }}
          job-results: ${{ toJSON(needs) }}

  mark-release-pending:
    name: "Release: Mark Nightly Status"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: check-changes
    if: |
      needs.check-changes.result == 'success' &&
      (needs.check-changes.outputs.has-changes == 'true' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true')) &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule') ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run != true))
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set nightly release tracker pending label
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Release] Status tracker — nightly'
          issue-marker: '<!-- release-nightly:type:release-status -->'
          issue-body: |
            <!-- release-nightly:type:release-status -->
            ## Release Status — `nightly`

            Current status: **⏳ pending**

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.event.workflow_run.head_sha || github.sha }}`

            _This issue tracks nightly release publication health for the develop branch._
            _Labels: `status/release-pending` = nightly release running; final state is applied after workflow completion._
          labels-to-add: 'status/release-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.event.workflow_run.head_sha || github.sha }}

  check-changes:
    name: "Validate: Changes Since Last Nightly"
    runs-on: ubuntu-24.04
    outputs:
      has-changes: ${{ steps.check.outputs.has-changes }}
      last-nightly-tag: ${{ steps.check.outputs.last-nightly-tag }}
      commit-count: ${{ steps.check.outputs.commit-count }}
    if: github.event_name != 'workflow_run' || ((github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && github.event.workflow_run.event == 'schedule')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check for commits since last nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Only published releases are baselines: failed runs can leave a tag or draft.
          published_tags="$(gh api --paginate --jq \
            '.[] | select(.draft == false and .prerelease == true and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}(\\.[0-9]+)?$"))) | .tag_name' \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          git rev-parse --verify HEAD >/dev/null
          matches=()
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}(\.[0-9]+)?$ ]] || continue
            matches+=(--match "$tag")
          done <<< "$published_tags"
          LAST_NIGHTLY=""
          if ((${#matches[@]})); then
            LAST_NIGHTLY="$(git describe --tags --abbrev=0 "${matches[@]}" HEAD 2>/dev/null || true)"
          fi
          
          if [[ -z "$LAST_NIGHTLY" ]]; then
            echo "::notice::No prior nightly tags found — forcing build"
            COMMIT_COUNT=$(git rev-list --count HEAD)
            {
              echo "has-changes=true"
              echo "last-nightly-tag="
              echo "commit-count=$COMMIT_COUNT"
            } >> "$GITHUB_OUTPUT"
          else
            COMMIT_COUNT=$(git rev-list --count "$LAST_NIGHTLY..HEAD")
            if [[ $COMMIT_COUNT -gt 0 ]]; then
              echo "::notice::Found $COMMIT_COUNT commits since $LAST_NIGHTLY"
              {
                echo "has-changes=true"
                echo "last-nightly-tag=$LAST_NIGHTLY"
                echo "commit-count=$COMMIT_COUNT"
              } >> "$GITHUB_OUTPUT"
            else
              echo "::notice::No commits since $LAST_NIGHTLY"
              {
                echo "has-changes=false"
                echo "last-nightly-tag=$LAST_NIGHTLY"
                echo "commit-count=0"
              } >> "$GITHUB_OUTPUT"
            fi
          fi

  set-release-type:
    name: "Release: Set Type to Nightly"
    runs-on: ubuntu-latest
    needs: check-changes
    if: |
      needs.check-changes.outputs.has-changes == 'true' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate canonical version contract
        run: |
          set -euo pipefail
          chmod +x .github/scripts/version-release-type-manager.sh
          .github/scripts/version-release-type-manager.sh validate

      - name: Update RELEASE_TYPE to nightly
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Nightly builds require a numeric VERSION"; exit 1;
          }
          echo "nightly" > RELEASE_TYPE
          chmod +x .github/scripts/version-release-type-manager.sh
          .github/scripts/version-release-type-manager.sh validate
          echo "::notice::Using nightly release type override for this build lane"

  build-matrix:
    name: "Build: Nightly (Matrix)"
    needs: set-release-type
    uses: ./.github/workflows/release-build-matrix.yml
    with:
      build_matrix: community-only
      source_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      release_type_override: nightly

  generate-metadata:
    name: "Release: Generate Build Metadata"
    needs: build-matrix
    if: ${{ always() && !cancelled() && (needs.build-matrix.result == 'success' || (needs.build-matrix.result == 'failure' && needs.build-matrix.outputs.runtime_gate_result == 'success')) }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.build-version }}
      release-type: ${{ steps.metadata.outputs.release-type }}
      nightly-tag: ${{ steps.version.outputs.nightly-tag }}
      docker-labels: ${{ steps.metadata.outputs.docker-labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Override RELEASE_TYPE for nightly metadata
        run: |
          echo "nightly" > RELEASE_TYPE

      - name: Generate build metadata
        id: metadata
        uses: ./.github/actions/generate-build-metadata
        with:
          output-path: build-metadata.json

      - name: Generate nightly version tag
        id: version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION | tr -d '[:space:]')
          DATE=$(date +%Y%m%d)
          RUN_NUM=${{ github.run_number }}
          
          # Format: v2.4.0-nightly.20260904.1234
          NIGHTLY_TAG="v${VERSION}-nightly.${DATE}.${RUN_NUM}"
          
          echo "nightly-tag=$NIGHTLY_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Nightly tag: $NIGHTLY_TAG"

      - name: Upload build metadata as artifact
        uses: actions/upload-artifact@v5
        with:
          name: build-metadata
          path: build-metadata.json
          retention-days: 90

  publish-release:
    name: "Publish: GitHub Release"
    needs: [check-changes, generate-metadata, build-matrix]
    if: ${{ always() && !cancelled() && needs.check-changes.result == 'success' && needs.generate-metadata.result == 'success' && (needs.build-matrix.result == 'success' || (needs.build-matrix.result == 'failure' && needs.build-matrix.outputs.runtime_gate_result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download build metadata
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          name: build-metadata

      - name: Require at least one successful platform package artifact
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v9.0.0
        env:
          RUN_NUMBER: ${{ github.run_number }}
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              },
            );
            const suffix = `-release-${process.env.RUN_NUMBER}`;
            const found = artifacts.some(
              (artifact) => artifact.name.startsWith('packages-') &&
                artifact.name.endsWith(suffix) && !artifact.expired,
            );
            if (!found) {
              core.setFailed('No successful OS lane produced a distributable package.');
            }

      - name: Download build artifacts
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85
        with:
          pattern: packages-*-release-${{ github.run_number }}
          merge-multiple: true
          path: release-artifacts

      - name: Generate nightly release notes
        id: release-notes
        env:
          LAST_NIGHTLY: ${{ needs.check-changes.outputs.last-nightly-tag }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          sha = git("rev-parse", "HEAD")
          previous = os.environ["LAST_NIGHTLY"]
          changelog = git("log", "--oneline", "-20", f"{previous}..HEAD" if previous else "HEAD")
          metadata = pathlib.Path("build-metadata.json").read_text()
          notes = (
              f"# ThemisDB Nightly Release — {datetime.datetime.now(datetime.timezone.utc):%Y-%m-%d}\n\n"
              f"**Build Number:** `{os.environ['GITHUB_RUN_NUMBER']}`  \n"
              f"**Commit:** [`{git('rev-parse', '--short', 'HEAD')}`]"
              f"({os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/commit/{sha})  \n"
              f"**Branch:** `{os.environ['SOURCE_BRANCH']}`\n\n"
              "## ⚠️ Pre-release Notice\n\n"
              "This is a **nightly build**. It may contain unfinished features and breaking changes.\n\n"
              "## Recent Changes\n\n"
              f"````\n{changelog}\n````\n\n"
              "## Build Metadata\n\n"
              f"```json\n{metadata.rstrip()}\n```\n"
          )
          pathlib.Path("release-notes.md").write_text(notes)
          PY

      - name: Create GitHub Release
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v9.0.0
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          NIGHTLY_TAG: ${{ needs.generate-metadata.outputs.nightly-tag }}
          BUILD_VERSION: ${{ needs.generate-metadata.outputs.version }}
          EXPECTED_LAST_NIGHTLY_TAG: ${{ needs.check-changes.outputs.last-nightly-tag }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {execFileSync} = require('child_process');
            const {SOURCE_SHA: sha, NIGHTLY_TAG: tag, BUILD_VERSION: version} = process.env;
            const metadata = JSON.parse(fs.readFileSync('build-metadata.json', 'utf8'));
            const head = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
            if (!/^[0-9a-f]{40}$/.test(sha) || head !== sha ||
                metadata.git.commit !== sha || metadata.version.release_type !== 'nightly' ||
                metadata.version.version !== version || !/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version) ||
                !tag.startsWith(`v${version}-nightly.`) ||
                !/^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$/.test(tag)) {
              throw new Error('Nightly source, metadata, or tag identity mismatch');
            }
            const files = ['build-metadata.json'];
            function collect(dir) {
              for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) collect(file);
                else if (entry.isFile()) files.push(file);
                else throw new Error(`Unsupported release asset: ${file}`);
              }
            }
            collect('release-artifacts');
            if (new Set(files.map(file => path.basename(file))).size !== files.length) {
              throw new Error('Duplicate release asset names');
            }
            const repo = context.repo;
            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({...repo, tag});
              release = existing.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const getTagObject = async () => {
              try {
                const ref = await github.rest.git.getRef({...repo, ref: `tags/${tag}`});
                return ref.data.object;
              } catch (error) {
                if (error.status !== 404) throw error;
                return null;
              }
            };
            const isExpectedCommit = object =>
              object && object.type === 'commit' && object.sha === sha;
            let tagObject = await getTagObject();
            if (release && !tagObject) {
              throw new Error('Existing nightly release has no tag ref');
            }
            if (tagObject && !isExpectedCommit(tagObject)) {
              throw new Error('Existing nightly tag does not point to the source commit');
            }
            if (!tagObject) {
              try {
                await github.rest.git.createRef({...repo, ref: `refs/tags/${tag}`, sha});
              } catch (error) {
                if (error.status !== 422) throw error;
                tagObject = await getTagObject();
                if (!tagObject) throw error;
                if (!isExpectedCommit(tagObject)) {
                  throw new Error('Existing nightly tag does not point to the source commit');
                }
              }
              tagObject = await getTagObject();
              if (!isExpectedCommit(tagObject)) {
                throw new Error('Created nightly tag does not point to the source commit');
              }
            }

            const expectedNames = new Set(files.map(file => path.basename(file)));
            if (release) {
              if (release.tag_name !== tag || !release.draft || !release.prerelease) {
                throw new Error('Existing nightly release is not the matching draft prerelease');
              }
              const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                ...repo, release_id: release.id, per_page: 100,
              });
              if (existingAssets.some(asset => !expectedNames.has(asset.name))) {
                throw new Error('Existing nightly draft contains unexpected assets');
              }
            } else {
              const created = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: sha, name: tag,
                body: fs.readFileSync('release-notes.md', 'utf8'), prerelease: true, draft: true,
              });
              release = created.data;
            }
            for (const file of files) {
              execFileSync('gh', ['release', 'upload', tag, path.resolve(file),
                '--repo', `${repo.owner}/${repo.repo}`, '--clobber'], {stdio: 'inherit'});
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100,
            });
            if (assets.length !== expectedNames.size ||
                new Set(assets.map(asset => asset.name)).size !== expectedNames.size ||
                files.some(file => !assets.some(asset =>
                  asset.name === path.basename(file) && asset.state === 'uploaded' &&
                  asset.size === fs.statSync(file).size))) {
              throw new Error('Draft release asset verification failed');
            }
            const verified = await getTagObject();
            const draftResponse = await github.rest.repos.getRelease({...repo, release_id: release.id});
            const draft = draftResponse.data;
            if (!isExpectedCommit(verified) || !draft.draft || !draft.prerelease ||
                draft.tag_name !== tag) {
              throw new Error('Draft release or tag identity changed before publication');
            }
            const nightlyTagPattern =
              /^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}(?:\.[0-9]+)?$/;
            const publishedNightlies = await github.paginate(github.rest.repos.listReleases, {
              ...repo, per_page: 100,
            });
            const candidates = publishedNightlies.filter(release =>
              !release.draft && release.prerelease && nightlyTagPattern.test(release.tag_name));
            candidates.sort((left, right) => {
              const leftPublishedAt = Date.parse(left.published_at);
              const rightPublishedAt = Date.parse(right.published_at);
              if (!Number.isFinite(leftPublishedAt) || !Number.isFinite(rightPublishedAt)) {
                throw new Error('Published nightly release has an invalid publication timestamp');
              }
              return rightPublishedAt - leftPublishedAt;
            });
            const currentBaseline = candidates[0]?.tag_name || '';
            if (currentBaseline !== process.env.EXPECTED_LAST_NIGHTLY_TAG) {
              throw new Error('Published nightly baseline changed during this run');
            }
            await github.rest.repos.updateRelease({...repo, release_id: release.id, draft: false});

      - name: Preview GitHub Release publication
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          NIGHTLY_TAG: ${{ needs.generate-metadata.outputs.nightly-tag }}
        run: |
          set -euo pipefail
          {
            echo "### Dry-run: GitHub Release"
            echo "- Would create prerelease tag: \`${NIGHTLY_TAG}\`"
            echo "- Would attach \`build-metadata.json\` and the downloaded release artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Dry run: GitHub Release ${NIGHTLY_TAG} was not created."

  track-downstream:
    name: "Release: Track Downstream Approvals"
    needs: [publish-release, generate-metadata]
    if: |
      needs.publish-release.result == 'success' &&
      needs.generate-metadata.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: nightly-downstream-${{ needs.generate-metadata.outputs.nightly-tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile downstream tracking issues
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v9.0.0
        env:
          NIGHTLY_TAG: ${{ needs.generate-metadata.outputs.nightly-tag }}
        with:
          script: |
            const track = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/track-nightly-downstream.js`);
            await track({github, context, core, tag: process.env.NIGHTLY_TAG});

  publish-docker:
    name: "Validate: Nightly Docker Runtime (${{ matrix.arch }})"
    needs: generate-metadata
    if: ${{ always() && !cancelled() && needs.generate-metadata.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Multi-arch Docker builds on cold cache (especially arm64 dependency builds)
    # can exceed 4h; 420m matches release-docker-image.yml to avoid premature timeout.
    timeout-minutes: 420
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Prepare Docker build context
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- llama.cpp whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF
          git submodule update --init --depth 1 llama.cpp whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF
          test -f whisper.cpp/CMakeLists.txt
          test -f stable-diffusion.cpp/CMakeLists.txt
          test -e ffmpeg
          test -e external/GIUF

      - name: Validate Docker dependency providers and runtime packages
        run: python3 tests/test_docker_runtime_package_regressions.py -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (OIDC)
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        run: |
          set -euo pipefail
          GH_REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          TAGS="ghcr.io/${GH_REPO_LC}:runtime-candidate-${{ github.run_id }}-${{ matrix.arch }}"
          
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "::notice::Docker tags: $TAGS"

      - name: Validate Dockerfile model-case syntax
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*;[^;]' docker/Dockerfile.unified >/tmp/invalid-case-terminators.txt; then
            printf '%s\n' "::error::Invalid shell case terminator found in docker/Dockerfile.unified (found a single ';' where ';;' is required)."
            cat /tmp/invalid-case-terminators.txt
            exit 1
          fi
          awk '
            /^RUN --mount=type=cache,id=llm-model-cache-\$\{TARGETARCH\},target=\/opt\/themis-models \\/ { in_block=1 }
            in_block { print }
            in_block && /^# =+/ { exit }
          ' docker/Dockerfile.unified \
            | sed '/^# =\+/,$d' \
            | sed 's/[[:space:]]*\\$//' \
            > /tmp/llm-model-provisioning.sh
          if ! /bin/sh -n /tmp/llm-model-provisioning.sh; then
            printf '%s\n' "::error::Shell syntax check failed for Dockerfile model provisioning block."
            sed -n '1,120p' /tmp/llm-model-provisioning.sh
            exit 1
          fi

      - name: Set nightly Docker build channel
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Nightly Docker builds require a numeric VERSION"; exit 1;
          }
          printf '%s\n' nightly > RELEASE_TYPE
          test "$(cat RELEASE_TYPE)" = nightly

      - name: Build staged Docker runtime candidate
        id: build-candidate
        # Keep step timeout below the job timeout so failures surface at step level first.
        timeout-minutes: 400
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./docker/Dockerfile.unified
          target: runtime
          pull: true
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
          load: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ needs.generate-metadata.outputs.docker-labels }}
          cache-from: type=gha,scope=themisdb-docker-unified-linux-${{ matrix.arch }}-tinyllama
          cache-to: type=gha,mode=max,scope=themisdb-docker-unified-linux-${{ matrix.arch }}-tinyllama
          no-cache-filters: runtime

      - name: Validate default container startup before publication
        id: runtime-validation
        env:
          IMAGE_REF: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build-candidate.outputs.digest }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run: testing locally loaded Docker image ${IMAGE_REF} without registry publication."
          else
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Missing or invalid Docker candidate digest"; exit 1;
            }
            IMAGE_REF="${IMAGE_REF}@${IMAGE_DIGEST}"
            docker pull "$IMAGE_REF"
          fi
          python3 scripts/release/runtime_smoke_gate.py --image "$IMAGE_REF" \
            --output "${RUNNER_TEMP}/nightly-runtime-smoke.json"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Validate bundled monitoring
        shell: bash
        env:
          IMAGE_REF: ${{ steps.runtime-validation.outputs.image_ref }}
        run: |
          set -euo pipefail
          bash scripts/release/smoke-docker-monitoring.sh "$IMAGE_REF"

      - name: Record validated platform digest
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        shell: bash
        env:
          IMAGE_REF: ${{ steps.runtime-validation.outputs.image_ref }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ @sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Missing validated nightly image digest"; exit 1;
          }
          printf '%s\n' "$IMAGE_REF" > "${RUNNER_TEMP}/nightly-docker-digest-${{ matrix.arch }}.txt"

      - name: Upload nightly runtime dependency and startup evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-docker-runtime-${{ matrix.arch }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/nightly-runtime-smoke.json
            ${{ runner.temp }}/nightly-docker-digest-${{ matrix.arch }}.txt
          if-no-files-found: warn
          retention-days: 30

  publish-docker-manifest:
    name: "Publish: Validated Nightly Docker Manifests"
    if: >-
      always() && !cancelled() &&
      needs.generate-metadata.result == 'success' &&
      needs.publish-docker.result == 'success' &&
      needs.publish-release.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    needs: [generate-metadata, publish-docker, publish-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download validated platform digest evidence
        uses: actions/download-artifact@v5
        with:
          pattern: nightly-docker-runtime-*-${{ github.run_number }}
          path: nightly-docker-evidence
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Promote only runtime-validated platform images
        env:
          VERSION: ${{ needs.generate-metadata.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          DATE=$(date +%Y%m%d)
          GH_REPO_LC=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          refs=()
          for arch in amd64 arm64; do
            digest_file="nightly-docker-evidence/nightly-docker-runtime-${arch}-${{ github.run_number }}/nightly-docker-digest-${arch}.txt"
            [[ -s "$digest_file" ]] || { echo "::error::Missing validated digest for ${arch}"; exit 1; }
            ref=$(tr -d '\r\n' < "$digest_file")
            [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::Invalid validated digest"; exit 1; }
            refs+=("$ref")
          done
          docker buildx imagetools create \
            --tag themisdb/themisdb:nightly \
            --tag "themisdb/themisdb:nightly-${DATE}" \
            --tag "themisdb/themisdb:${VERSION}-nightly-${DATE}" \
            --tag "ghcr.io/${GH_REPO_LC}:nightly" \
            --tag "ghcr.io/${GH_REPO_LC}:nightly-${DATE}" \
            "${refs[@]}"

  finalize-release-status:
    name: "Release: Finalize Nightly Status"
    needs: [mark-release-pending, check-changes, build-matrix, generate-metadata, publish-release, track-downstream, publish-docker, publish-docker-manifest]
    if: |
      always() && !cancelled() &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) &&
      (needs.check-changes.result == 'failure' ||
       (needs.check-changes.result == 'success' &&
        (needs.check-changes.outputs.has-changes == 'true' ||
         (github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve final nightly outcome
        id: status
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.check-changes.result }}
          BUILD_RESULT: ${{ needs.build-matrix.result }}
          METADATA_RESULT: ${{ needs.generate-metadata.result }}
          RELEASE_RESULT: ${{ needs.publish-release.result }}
          TRACKING_RESULT: ${{ needs.track-downstream.result }}
          DOCKER_RESULT: ${{ needs.publish-docker-manifest.result }}
        run: |
          set -euo pipefail
          if [ "${CHANGE_RESULT}" = "success" ] || [ "${CHANGE_RESULT}" = "skipped" ]; then
            if [ "${BUILD_RESULT}" = "success" ] && [ "${METADATA_RESULT}" = "success" ] && [ "${RELEASE_RESULT}" = "success" ] && [ "${TRACKING_RESULT}" = "success" ] && [ "${DOCKER_RESULT}" = "success" ]; then
              {
                echo "status_label=ci/build-ok"
                echo "status_text=passing"
                echo "status_icon=✅"
                echo "status_reason=nightly release packaging and publication succeeded"
                echo "status_markers="
              } >> "${GITHUB_OUTPUT}"
            else
              {
                echo "status_label=ci/build-failed"
                echo "status_text=failing"
                echo "status_icon=❌"
                echo "status_reason=nightly release packaging or publication failed"
                echo "status_markers=ci/build-failed"
              } >> "${GITHUB_OUTPUT}"
            fi
          elif [ "${CHANGE_RESULT}" = "failure" ]; then
            {
              echo "status_label=ci/build-failed"
              echo "status_text=failing"
              echo "status_icon=❌"
              echo "status_reason=no nightly release was produced because the change gate failed"
              echo "status_markers=ci/build-failed"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "status_label=ci/build-failed"
              echo "status_text=failing"
              echo "status_icon=❌"
              echo "status_reason=no nightly release was produced because the change gate was not met"
              echo "status_markers=ci/build-failed"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Upsert nightly tracker issue
        id: nightly_tracker
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Release] Status tracker — nightly'
          issue-marker: '<!-- release-nightly:type:release-status -->'
          issue-body: |
            <!-- release-nightly:type:release-status -->
            ## Release Status — `nightly`

            Current status: **${{ steps.status.outputs.status_icon }} ${{ steps.status.outputs.status_text }}**
            Reason: `${{ steps.status.outputs.status_reason }}`
            Marker: `${{ steps.status.outputs.status_markers || 'none' }}`

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.event.workflow_run.head_sha || github.sha }}`

            _This issue tracks nightly release publication health for the develop branch._
            _Labels: `status/release-pending` = nightly release running; `ci/build-failed` = nightly release gate failed._

      - name: Replace nightly status labels atomically
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-number: ${{ steps.nightly_tracker.outputs.issue-number }}
          issue-title: '[Release] Status tracker — nightly'
          issue-marker: '<!-- release-nightly:type:release-status -->'
          labels-to-add: ${{ steps.status.outputs.status_label }}
          status-group: 'ci/build-ok,ci/build-failed,status/release-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Comment nightly release status
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-number: ${{ steps.nightly_tracker.outputs.issue-number }}
          issue-title: '[Release] Status tracker — nightly'
          issue-marker: '<!-- release-nightly:type:release-status -->'
          issue-body: '${{ steps.status.outputs.status_icon }} Nightly release `${{ github.event.workflow_run.head_sha || github.sha }}` — [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.event.workflow_run.head_sha || github.sha }}

  notify:
    name: "Automation: Notify Build Completion"
    needs: [generate-metadata, publish-release, track-downstream, publish-docker-manifest]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report nightly build status
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          NIGHTLY_TAG: ${{ needs.generate-metadata.outputs.nightly-tag }}
          VERSION: ${{ needs.generate-metadata.outputs.version }}
          RELEASE_RESULT: ${{ needs.publish-release.result }}
          TRACKING_RESULT: ${{ needs.track-downstream.result }}
          DOCKER_RESULT: ${{ needs.publish-docker-manifest.result }}
        run: |
          set -euo pipefail
          echo "✓ Nightly Release Complete"
          echo "  Tag: ${NIGHTLY_TAG}"
          echo "  Version: ${VERSION}"
          echo "  Release Type: ${{ needs.generate-metadata.outputs.release-type }}"
          echo "  Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "### Nightly Run Details"
            echo "- Version: \`${VERSION:-unresolved}\`"
            echo "- Tag: \`${NIGHTLY_TAG:-unresolved}\`"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "- Mode: manual dry run; build and runtime validation ran, publication and issue updates were suppressed."
              echo "- GitHub Release job: \`${RELEASE_RESULT}\` (release creation step skipped)"
              echo "- Docker manifest job: \`${DOCKER_RESULT}\` (promotion skipped)"
              echo "- Scheduled runs are unaffected and continue to publish."
            else
              echo "- Mode: publishing"
              echo "- GitHub Release job: \`${RELEASE_RESULT}\`"
              echo "- Downstream tracking job: \`${TRACKING_RESULT}\`"
              echo "- Docker manifest job: \`${DOCKER_RESULT}\`"
            fi
            echo "- Run: [${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
