name: "Wave B Transaction CI Execution"

on:
  push:
    branches:
      - develop
    paths:
      - "src/transaction/**"
      - "tests/transaction/**"
      - "include/transaction/**"
      - "benchmarks/transaction/**"
      - ".github/workflows/13-wave-b-transaction-ci-execution.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "src/transaction/**"
      - "tests/transaction/**"
      - "include/transaction/**"
      - "benchmarks/transaction/**"
  workflow_dispatch:
    inputs:
      phase:
        description: "Test phase to run (all, phase1, phase2, phase3, wave-a, phase4)"
        required: false
        default: "all"
      parallel_jobs:
        description: "Number of parallel compilation jobs"
        required: false
        default: "4"

concurrency:
  group: wave-b-transaction-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CMAKE_BUILD_TYPE: Release
  THEMIS_EDITION: COMMUNITY
  THEMIS_BUILD_TESTS: ON
  THEMIS_BUILD_BENCHMARKS: OFF
  CMAKE_GENERATOR: Ninja
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
  SCCACHE_CACHE_SIZE: 2G

jobs:
  configure:
    name: "CMake Configuration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build-dir: ${{ steps.configure.outputs.build-dir }}
      config-status: ${{ steps.configure.outputs.status }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false
          fetch-depth: 0

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libboost-filesystem-dev libboost-system-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake (community-release)"
        id: configure
        run: |
          BUILD_DIR="build-wave-b3-transaction-ci"
          echo "build-dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"
          
          cmake --preset community-release \
            -B "$BUILD_DIR" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM="$(command -v sccache)" \
            2>&1 | tee cmake-config.log
          
          if [ -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            cat cmake-config.log
            exit 1
          fi

      - name: "Upload CMake configuration log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configuration-log
          path: cmake-config.log
          retention-days: 30

  compile-tests:
    name: "Compile Transaction Tests"
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        phase: [phase1, phase2, phase3, wave-a]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libboost-filesystem-dev libboost-system-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM="$(command -v sccache)"

      - name: "Compile ${{ matrix.phase }} tests"
        id: compile
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          
          cmake --build "$BUILD_DIR" \
            --target \
            test_transaction_lifecycle_phase1 \
            test_transaction_isolation_contention_phase1 \
            test_transaction_error_path_determinism_phase1 \
            test_transaction_distributed_phase2 \
            test_transaction_saga_compensation_phase2 \
            test_transaction_fault_injection_phase3 \
            test_transaction_wave_a_closure \
            --parallel ${{ github.event.inputs.parallel_jobs || 4 }} \
            2>&1 | tee compile-${{ matrix.phase }}.log
          
          echo "compile_status=success" >> "$GITHUB_OUTPUT"

      - name: "Upload compilation log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-${{ matrix.phase }}-log
          path: compile-${{ matrix.phase }}.log
          retention-days: 30

  smoke-tests:
    name: "Smoke Tests (Critical 3)"
    needs: [configure, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libboost-filesystem-dev libboost-system-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM="$(command -v sccache)"

      - name: "Run smoke tests (3 critical)"
        id: smoke
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          cd "$BUILD_DIR"
          
          ctest \
            -R "TxnRecovery01|TxnSagaHardening02|TxnTimeout01" \
            -V --output-on-failure \
            2>&1 | tee smoke-test-results.txt
          
          TEST_RESULT=$?
          if [ $TEST_RESULT -eq 0 ]; then
            echo "smoke_status=success" >> "$GITHUB_OUTPUT"
            echo "✅ All 3 smoke tests PASSED"
          else
            echo "smoke_status=failed" >> "$GITHUB_OUTPUT"
            echo "❌ Smoke tests FAILED"
            exit 1
          fi

      - name: "Upload smoke test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: ${{ needs.configure.outputs.build-dir }}/smoke-test-results.txt
          retention-days: 30

      - name: "Publish smoke test summary"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: ${{ needs.configure.outputs.build-dir }}/smoke-test-results.txt
          retention-days: 30

  full-transaction-test-suite:
    name: "Full Transaction Test Suite (86 tests)"
    needs: [configure, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event.inputs.phase == 'all'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            libboost-filesystem-dev libboost-system-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM="$(command -v sccache)"

      - name: "Run all transaction tests"
        id: full-tests
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          cd "$BUILD_DIR"
          
          ctest \
            -R "test_transaction_" \
            -V --output-on-failure \
            -j 4 \
            2>&1 | tee full-test-results.xml
          
          TEST_RESULT=$?
          if [ $TEST_RESULT -eq 0 ]; then
            echo "full_tests_status=success" >> "$GITHUB_OUTPUT"
            echo "✅ All transaction tests PASSED"
          else
            echo "full_tests_status=failed" >> "$GITHUB_OUTPUT"
            echo "⚠️  Some tests FAILED - see logs"
          fi
          
          exit $TEST_RESULT

      - name: "Generate test report"
        if: always()
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          {
            echo "## Transaction Test Results"
            echo ""
            echo "**Status:** ${{ steps.full-tests.outputs.full_tests_status }}"
            echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            tail -50 "$BUILD_DIR/full-test-results.xml"
          } > test-report.md

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-test-results
          path: |
            ${{ needs.configure.outputs.build-dir }}/full-test-results.xml
            test-report.md
          retention-days: 30

      - name: "Post test summary to PR"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  chaos-recovery-evidence:
    name: "Chaos and Recovery Evidence"
    needs: [configure, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'wave-a'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfmt-dev libspdlog-dev nlohmann-json3-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libcpp-httplib-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM=sccache

      - name: "Run chaos/recovery release-critical transaction suites"
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          mkdir -p "$BUILD_DIR/transaction-chaos-evidence"
          {
            echo "# Transaction Chaos / Recovery Evidence"
            echo
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Hardware profile"
            echo '```'
            lscpu
            echo '```'
          } > "$BUILD_DIR/transaction-chaos-evidence/TRANSACTION_CHAOS_HARDWARE.md"

          cd "$BUILD_DIR"
          ctest \
            --tests-regex "TransactionDistributedPhase2Tests|TransactionSAGACompensationPhase2Tests|TransactionFaultInjectionPhase3Tests|TransactionWaveAClosureTests" \
            -V --output-on-failure -j 2 \
            2>&1 | tee transaction-chaos-evidence/chaos-recovery-results.txt

      - name: "Upload chaos/recovery evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-chaos-recovery-evidence
          path: |
            ${{ needs.configure.outputs.build-dir }}/transaction-chaos-evidence/chaos-recovery-results.txt
            ${{ needs.configure.outputs.build-dir }}/transaction-chaos-evidence/TRANSACTION_CHAOS_HARDWARE.md
          retention-days: 30

  phase4-benchmark-baseline:
    name: "Phase 4 Benchmark Baseline"
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' || github.event.inputs.phase == 'all' || github.event.inputs.phase == 'phase4'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          submodules: false

      - name: "Setup benchmark build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libbenchmark-dev libfmt-dev libspdlog-dev nlohmann-json3-dev \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev \
            libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev \
            libtbb-dev libboost-dev libboost-system-dev libboost-filesystem-dev \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpugixml-dev \
            libcpp-httplib-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**', 'benchmarks/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache"
        run: sudo apt-get install -y --no-install-recommends sccache

      - name: "Configure CMake with benchmarks"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM=sccache

      - name: "Build Phase 4 benchmark"
        run: cmake --build "${{ needs.configure.outputs.build-dir }}" --target bench_transaction_phase4 --parallel ${{ github.event.inputs.parallel_jobs || 4 }}

      - name: "Run Phase 4 benchmark baseline"
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          mkdir -p "$BUILD_DIR/transaction-phase4-benchmark"
          lscpu > "$BUILD_DIR/transaction-phase4-benchmark/lscpu.txt"
          free -h > "$BUILD_DIR/transaction-phase4-benchmark/memory.txt"
          "$BUILD_DIR/benchmarks/transaction/bench_transaction_phase4" \
            --benchmark_min_time=0.2s \
            --benchmark_repetitions=5 \
            --benchmark_out="$BUILD_DIR/transaction-phase4-benchmark/phase4_baseline.json" \
            --benchmark_out_format=json

      - name: "Render Phase 4 benchmark summary"
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          python3 - "$BUILD_DIR/transaction-phase4-benchmark/phase4_baseline.json" "$BUILD_DIR/transaction-phase4-benchmark/PHASE4_BASELINE_SUMMARY.md" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          data = json.loads(source.read_text(encoding="utf-8"))
          rows = []
          for bench in data.get("benchmarks", []):
              name = bench.get("name", "")
              if name.endswith(("_mean", "_median", "_stddev", "_cv")):
                  continue
              rows.append(
                  (
                      name,
                      bench.get("txns_per_sec", 0.0),
                      bench.get("p95_ms", 0.0),
                      bench.get("p99_ms", 0.0),
                      bench.get("gate_pass", 0.0),
                  )
              )

          lines = [
              "# Transaction Phase 4 Baseline Summary",
              "",
              "| Benchmark | txns/sec | p95 ms | p99 ms | Status |",
              "| --- | ---: | ---: | ---: | --- |",
          ]
          for name, txns_per_sec, p95_ms, p99_ms, gate_pass in rows:
              status = "PASS" if gate_pass >= 1.0 else "FAIL"
              lines.append(
                  f"| `{name}` | {txns_per_sec:.2f} | {p95_ms:.3f} | {p99_ms:.3f} | {status} |"
              )
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: "Upload Phase 4 benchmark artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-phase4-benchmark
          path: |
            ${{ needs.configure.outputs.build-dir }}/transaction-phase4-benchmark/phase4_baseline.json
            ${{ needs.configure.outputs.build-dir }}/transaction-phase4-benchmark/PHASE4_BASELINE_SUMMARY.md
            ${{ needs.configure.outputs.build-dir }}/transaction-phase4-benchmark/lscpu.txt
            ${{ needs.configure.outputs.build-dir }}/transaction-phase4-benchmark/memory.txt
          retention-days: 30

  collect-artifacts:
    name: "Collect Build Artifacts"
    needs: [configure, compile-tests, smoke-tests, chaos-recovery-evidence, phase4-benchmark-baseline]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4.1.3

      - name: "Create artifact archive"
        run: |
          mkdir -p transaction-ci-results
          cp -r cmake-configuration-log transaction-ci-results/ || true
          cp -r compile-*-log transaction-ci-results/ || true
          cp -r smoke-test-results transaction-ci-results/ || true
          cp -r transaction-test-results transaction-ci-results/ || true
          cp -r test-summary transaction-ci-results/ || true
          cp -r transaction-chaos-recovery-evidence transaction-ci-results/ || true
          cp -r transaction-phase4-benchmark transaction-ci-results/ || true
          
          zip -r transaction-ci-results.zip transaction-ci-results || true
          
          echo "Archive created: $(du -sh transaction-ci-results.zip | cut -f1)"

      - name: "Upload artifacts archive"
        uses: actions/upload-artifact@v4
        with:
          name: transaction-ci-results
          path: transaction-ci-results.zip
          retention-days: 90

  publish-results:
    name: "Publish CI Results"
    needs: [configure, compile-tests, smoke-tests, full-transaction-test-suite, chaos-recovery-evidence, phase4-benchmark-baseline, collect-artifacts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Download all artifacts"
        uses: actions/download-artifact@v4.1.3

      - name: "Generate CI report"
        run: |
          PHASE4_STATUS="pending"
          if [ "${{ needs.phase4-benchmark-baseline.result }}" = "success" ]; then
            PHASE4_STATUS="captured"
          elif [ "${{ needs.phase4-benchmark-baseline.result }}" = "failure" ]; then
            PHASE4_STATUS="failed"
          elif [ "${{ needs.phase4-benchmark-baseline.result }}" = "skipped" ]; then
            PHASE4_STATUS="skipped"
          fi

          {
            echo "# Wave B Transaction CI Execution Report"
            echo ""
            echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Build:** ${{ github.run_id }}"
            echo "**Status:** ${{ job.status }}"
            echo ""
            echo "## Results Summary"
            echo "- CMake Configuration: ${{ needs.configure.outputs.config-status }}"
            echo "- Test Compilation: ${{ needs.compile-tests.result }}"
            echo "- Smoke Tests: ${{ needs.smoke-tests.result }}"
            echo "- Full Suite: ${{ needs.full-transaction-test-suite.result }}"
            echo "- Chaos / Recovery evidence: ${{ needs.chaos-recovery-evidence.result }}"
            echo "- Phase 4 benchmark baseline: ${PHASE4_STATUS}"
            echo ""
            echo "## Artifacts"
            echo "- transaction-ci-results.zip"
            if [ -f transaction-phase4-benchmark/PHASE4_BASELINE_SUMMARY.md ]; then
              echo ""
              cat transaction-phase4-benchmark/PHASE4_BASELINE_SUMMARY.md
            fi
          } > CI_REPORT.md

      - name: "Upload final report"
        uses: actions/upload-artifact@v4
        with:
          name: CI-Report
          path: CI_REPORT.md
          retention-days: 90

  check-results:
    name: "Verify Test Results"
    needs: [smoke-tests, chaos-recovery-evidence]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Verify smoke and chaos/recovery success"
        run: |
          CHAOS_OK="true"
          if [ "${{ needs.chaos-recovery-evidence.result }}" != "success" ] && [ "${{ needs.chaos-recovery-evidence.result }}" != "skipped" ]; then
            CHAOS_OK="false"
          fi
          if [ "${{ needs.smoke-tests.result }}" == "success" ] && [ "$CHAOS_OK" = "true" ]; then
            echo "✅ Build verification passed - ready for Sept 7 CI execution"
            exit 0
          else
            echo "❌ Build verification failed - check logs"
            exit 1
          fi
