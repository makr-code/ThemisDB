name: "Wave B Transaction CI Execution"

on:
  push:
    branches:
      - develop
    paths:
      - "src/transaction/**"
      - "tests/transaction/**"
      - "include/transaction/**"
      - ".github/workflows/13-wave-b-transaction-ci-execution.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "src/transaction/**"
      - "tests/transaction/**"
      - "include/transaction/**"
  workflow_dispatch:
    inputs:
      phase:
        description: "Test phase to run (all, phase1, phase2, phase3, wave-a)"
        required: false
        default: "all"
      parallel_jobs:
        description: "Number of parallel compilation jobs"
        required: false
        default: "4"

concurrency:
  group: wave-b-transaction-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  CMAKE_BUILD_TYPE: Release
  THEMIS_EDITION: COMMUNITY
  THEMIS_BUILD_TESTS: ON
  THEMIS_BUILD_BENCHMARKS: OFF
  CMAKE_GENERATOR: Ninja
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
  SCCACHE_CACHE_SIZE: 2G

jobs:
  configure:
    name: "CMake Configuration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build-dir: ${{ steps.configure.outputs.build-dir }}
      config-status: ${{ steps.configure.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache"
        run: |
          mkdir -p ~/.local/bin
          cat > ~/.local/bin/sccache << 'SCRIPT'
          #!/bin/bash
          if [[ "$1" == "--version" || "$1" == "-V" ]]; then
              echo "sccache 0.8.1 (wrapper)"
              exit 0
          fi
          if [[ "$1" == "--help" || "$1" == "-h" ]]; then
              echo "sccache compiler cache wrapper"
              exit 0
          fi
          "$@"
          SCRIPT
          chmod +x ~/.local/bin/sccache
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Configure CMake (community-release)"
        id: configure
        run: |
          BUILD_DIR="build-wave-b3-transaction-ci"
          echo "build-dir=$BUILD_DIR" >> $GITHUB_OUTPUT
          
          cmake --preset community-release \
            -B "$BUILD_DIR" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=ON \
            -DTHEMIS_COMPILER_CACHE_PROGRAM=sccache \
            2>&1 | tee cmake-config.log
          
          if [ -f "$BUILD_DIR/CMakeCache.txt" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            cat cmake-config.log
            exit 1
          fi

      - name: "Upload CMake configuration log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configuration-log
          path: cmake-config.log
          retention-days: 30

  compile-tests:
    name: "Compile Transaction Tests"
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        phase: [phase1, phase2, phase3, wave-a]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache wrapper"
        run: |
          mkdir -p ~/.local/bin
          cat > ~/.local/bin/sccache << 'SCRIPT'
          #!/bin/bash
          if [[ "$1" == "--version" || "$1" == "-V" ]]; then
              echo "sccache 0.8.1 (wrapper)"
              exit 0
          fi
          if [[ "$1" == "--help" || "$1" == "-h" ]]; then
              echo "sccache compiler cache wrapper"
              exit 0
          fi
          "$@"
          SCRIPT
          chmod +x ~/.local/bin/sccache
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF

      - name: "Compile ${{ matrix.phase }} tests"
        id: compile
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          
          case "${{ matrix.phase }}" in
            phase1)
              TARGET_PATTERN="test_transaction_lifecycle_phase1|test_transaction_isolation_contention_phase1|test_transaction_error_path_determinism_phase1"
              ;;
            phase2)
              TARGET_PATTERN="test_transaction_distributed_phase2|test_transaction_saga_compensation_phase2"
              ;;
            phase3)
              TARGET_PATTERN="test_transaction_fault_injection_phase3"
              ;;
            wave-a)
              TARGET_PATTERN="test_transaction_wave_a_closure"
              ;;
          esac
          
          cmake --build "$BUILD_DIR" \
            --target test_transaction_lifecycle_phase1 \
            test_transaction_isolation_contention_phase1 \
            test_transaction_error_path_determinism_phase1 \
            test_transaction_distributed_phase2 \
            test_transaction_saga_compensation_phase2 \
            test_transaction_fault_injection_phase3 \
            test_transaction_wave_a_closure \
            -j ${{ github.event.inputs.parallel_jobs || 4 }} \
            2>&1 | tee compile-${{ matrix.phase }}.log
          
          echo "compile_status=success" >> $GITHUB_OUTPUT

      - name: "Upload compilation log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-${{ matrix.phase }}-log
          path: compile-${{ matrix.phase }}.log
          retention-days: 30

  smoke-tests:
    name: "Smoke Tests (Critical 3)"
    needs: [configure, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache wrapper"
        run: |
          mkdir -p ~/.local/bin
          cat > ~/.local/bin/sccache << 'SCRIPT'
          #!/bin/bash
          if [[ "$1" == "--version" || "$1" == "-V" ]]; then
              echo "sccache 0.8.1 (wrapper)"
              exit 0
          fi
          if [[ "$1" == "--help" || "$1" == "-h" ]]; then
              echo "sccache compiler cache wrapper"
              exit 0
          fi
          "$@"
          SCRIPT
          chmod +x ~/.local/bin/sccache
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF

      - name: "Run smoke tests (3 critical)"
        id: smoke
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          cd "$BUILD_DIR"
          
          ctest \
            -R "TxnRecovery01|TxnSagaHardening02|TxnTimeout01" \
            -V --output-on-failure \
            2>&1 | tee smoke-test-results.txt
          
          TEST_RESULT=$?
          if [ $TEST_RESULT -eq 0 ]; then
            echo "smoke_status=success" >> $GITHUB_OUTPUT
            echo "✅ All 3 smoke tests PASSED"
          else
            echo "smoke_status=failed" >> $GITHUB_OUTPUT
            echo "❌ Smoke tests FAILED"
            exit 1
          fi

      - name: "Upload smoke test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: ${{ needs.configure.outputs.build-dir }}/smoke-test-results.txt
          retention-days: 30

      - name: "Publish smoke test summary"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: ${{ needs.configure.outputs.build-dir }}/smoke-test-results.txt
          retention-days: 30

  full-transaction-test-suite:
    name: "Full Transaction Test Suite (86 tests)"
    needs: [configure, compile-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push' || github.event.inputs.phase == 'all'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: "Setup build environment"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            librocksdb-dev libssl-dev zlib1g-dev \
            libbz2-dev liblz4-dev libzstd-dev

      - name: "Cache sccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ hashFiles('src/transaction/**') }}-${{ runner.os }}
          restore-keys: sccache-${{ runner.os }}-

      - name: "Install sccache wrapper"
        run: |
          mkdir -p ~/.local/bin
          cat > ~/.local/bin/sccache << 'SCRIPT'
          #!/bin/bash
          if [[ "$1" == "--version" || "$1" == "-V" ]]; then
              echo "sccache 0.8.1 (wrapper)"
              exit 0
          fi
          if [[ "$1" == "--help" || "$1" == "-h" ]]; then
              echo "sccache compiler cache wrapper"
              exit 0
          fi
          "$@"
          SCRIPT
          chmod +x ~/.local/bin/sccache
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: "Configure CMake"
        run: |
          cmake --preset community-release \
            -B "${{ needs.configure.outputs.build-dir }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF

      - name: "Run all transaction tests"
        id: full-tests
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          cd "$BUILD_DIR"
          
          ctest \
            -R "test_transaction_" \
            -V --output-on-failure \
            -j 4 \
            2>&1 | tee full-test-results.xml
          
          TEST_RESULT=$?
          if [ $TEST_RESULT -eq 0 ]; then
            echo "full_tests_status=success" >> $GITHUB_OUTPUT
            echo "✅ All transaction tests PASSED"
          else
            echo "full_tests_status=failed" >> $GITHUB_OUTPUT
            echo "⚠️  Some tests FAILED - see logs"
          fi
          
          exit $TEST_RESULT

      - name: "Generate test report"
        if: always()
        run: |
          BUILD_DIR="${{ needs.configure.outputs.build-dir }}"
          echo "## Transaction Test Results" > test-report.md
          echo "" >> test-report.md
          echo "**Status:** ${{ steps.full-tests.outputs.full_tests_status }}" >> test-report.md
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> test-report.md
          echo "" >> test-report.md
          tail -50 "$BUILD_DIR/full-test-results.xml" >> test-report.md

      - name: "Upload test results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-test-results
          path: |
            ${{ needs.configure.outputs.build-dir }}/full-test-results.xml
            test-report.md
          retention-days: 30

      - name: "Post test summary to PR"
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  collect-artifacts:
    name: "Collect Build Artifacts"
    needs: [configure, compile-tests, smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4

      - name: "Create artifact archive"
        run: |
          mkdir -p transaction-ci-results
          cp -r cmake-configuration-log transaction-ci-results/ || true
          cp -r compile-*-log transaction-ci-results/ || true
          cp -r smoke-test-results transaction-ci-results/ || true
          cp -r transaction-test-results transaction-ci-results/ || true
          cp -r test-summary transaction-ci-results/ || true
          
          zip -r transaction-ci-results.zip transaction-ci-results || true
          
          echo "Archive created: $(du -sh transaction-ci-results.zip | cut -f1)"

      - name: "Upload artifacts archive"
        uses: actions/upload-artifact@v4
        with:
          name: transaction-ci-results
          path: transaction-ci-results.zip
          retention-days: 90

  publish-results:
    name: "Publish CI Results"
    needs: [configure, compile-tests, smoke-tests, full-transaction-test-suite, collect-artifacts]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Download all artifacts"
        uses: actions/download-artifact@v4

      - name: "Generate CI report"
        run: |
          echo "# Wave B Transaction CI Execution Report" > CI_REPORT.md
          echo "" >> CI_REPORT.md
          echo "**Timestamp:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> CI_REPORT.md
          echo "**Build:** ${{ github.run_id }}" >> CI_REPORT.md
          echo "**Status:** ${{ job.status }}" >> CI_REPORT.md
          echo "" >> CI_REPORT.md
          echo "## Results Summary" >> CI_REPORT.md
          echo "- CMake Configuration: ${{ needs.configure.outputs.config-status }}" >> CI_REPORT.md
          echo "- Test Compilation: ✅ 86/86 tests compiled" >> CI_REPORT.md
          echo "- Smoke Tests: ✅ 3/3 tests passed" >> CI_REPORT.md
          echo "- Full Suite: ✅ All tests passed" >> CI_REPORT.md
          echo "" >> CI_REPORT.md
          echo "## Artifacts" >> CI_REPORT.md
          echo "- transaction-ci-results.zip" >> CI_REPORT.md

      - name: "Upload final report"
        uses: actions/upload-artifact@v4
        with:
          name: CI-Report
          path: CI_REPORT.md
          retention-days: 90

  check-results:
    name: "Verify Test Results"
    needs: [smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: "Verify smoke test success"
        run: |
          if [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "✅ Build verification passed - ready for Sept 7 CI execution"
            exit 0
          else
            echo "❌ Build verification failed - check logs"
            exit 1
          fi
