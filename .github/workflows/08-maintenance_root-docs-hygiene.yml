name: Root Docs Hygiene

# Reports top-level markdown/text files that likely belong in docs/ or docs/archive
# instead of the repository root.

on:
  push:
    branches: [develop, community]
    paths:
      - '*.md'
      - '*.txt'
      - 'docs/**'
      - 'scripts/root-docs-hygiene.py'
      - '.github/workflows/08-maintenance_root-docs-hygiene.yml'
  schedule:
    - cron: '30 4 * * *'   # Daily at 04:30 UTC
  workflow_dispatch:
    inputs:
      fail_on_findings:
        description: 'Fail the workflow when root-doc hygiene findings are present'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: repo root markdown hygiene
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run root docs hygiene check
        id: hygiene
        run: |
          FAIL_FLAG=""
          if [ "${{ inputs.fail_on_findings }}" = "true" ]; then
            FAIL_FLAG="--fail-on-findings"
          fi

          python3 scripts/root-docs-hygiene.py \
            --format text \
            --output /tmp/root-docs-hygiene.txt \
            $FAIL_FLAG

      - name: Generate JSON hygiene report
        if: always()
        run: |
          python3 scripts/root-docs-hygiene.py \
            --format json \
            --output /tmp/root-docs-hygiene.json
        continue-on-error: true

      - name: Upload hygiene reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-docs-hygiene-${{ github.run_number }}
          path: |
            /tmp/root-docs-hygiene.txt
            /tmp/root-docs-hygiene.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          echo "## Root Docs Hygiene" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/root-docs-hygiene.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/root-docs-hygiene.json ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('/tmp/root-docs-hygiene.json')); print(d['summary']['total_root_docs'])" 2>/dev/null || echo "n/a")
            KEEP=$(python3 -c "import json; d=json.load(open('/tmp/root-docs-hygiene.json')); print(d['summary']['keep'])" 2>/dev/null || echo "n/a")
            DOCS=$(python3 -c "import json; d=json.load(open('/tmp/root-docs-hygiene.json')); print(d['summary']['docs_candidates'])" 2>/dev/null || echo "n/a")
            ARCHIVE=$(python3 -c "import json; d=json.load(open('/tmp/root-docs-hygiene.json')); print(d['summary']['archive_candidates'])" 2>/dev/null || echo "n/a")
            echo "| **Top-level docs** | ${TOTAL} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Keep** | ${KEEP} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Docs candidates** | ${DOCS} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Archive candidates** | ${ARCHIVE} |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f /tmp/root-docs-hygiene.txt ]; then
            echo "**Text Report:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/root-docs-hygiene.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
