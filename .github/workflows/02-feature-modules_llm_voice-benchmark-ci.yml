name: Voice Benchmark CI

# Optional CI runner for the Voice Assistant benchmark harness.
# Implements PERFORMANCE_EXPECTATIONS.md §1.4, Maßnahme #4:
#   "Voice-Benchmark-Pfad für CI via THEMIS_ENABLE_VOICE_ASSISTANT optionalen Job aktivieren"
#
# Key design decisions:
#   • THEMIS_ENABLE_VOICE_ASSISTANT=ON is passed explicitly so bench_voice_assistant
#     is compiled (it is guarded by this flag in benchmarks/CMakeLists.txt).
#   • The build step is marked continue-on-error so that CI remains green when
#     voice dependencies (STT/TTS models, audio libraries) are not available on
#     the runner; the outcome is documented as SKIP in the job summary.
#   • When the build succeeds, bench_voice_assistant runs with
#     --benchmark_min_time=0.1s to document at least 1 representative run.
#   • Results are uploaded as workflow artifacts (30-day retention) to satisfy
#     the "mindestens 1 Testlauf dokumentiert" acceptance criterion.
#   • On push to community a baseline JSON is committed back so future runs have a
#     reference point for delta comparison.
#
# Acceptance criteria (Issue: Voice-Benchmark-Pfad in optionalem Runner aktivieren):
#   AC-1  CI job with THEMIS_ENABLE_VOICE_ASSISTANT=ON  ✅ (this file)
#   AC-2  bench_voice_assistant.exe built and ≥1 run documented  ✅ (build + run steps)
#   AC-3  Missing voice-dependencies documented as SKIP  ✅ (continue-on-error + summary)
#   AC-4  Report linked in PERFORMANCE_EXPECTATIONS.md  ✅ (see §5.9 / §1.4 Maßnahme #4)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/voice/**'
      - 'src/voice/**'
      - 'include/content/stt_processor.h'
      - 'include/content/tts_processor.h'
      - 'src/content/stt_processor.cpp'
      - 'src/content/tts_processor.cpp'
      - 'benchmarks/bench_voice_assistant.cpp'
      - 'benchmarks/CMakeLists.txt'
      - 'benchmarks/baselines/voice/**'
      - '.github/workflows/02-feature-modules_llm_voice-benchmark-ci.yml'
  push:
    branches:
      - community
      - develop
    paths:
      - 'include/voice/**'
      - 'src/voice/**'
      - 'benchmarks/bench_voice_assistant.cpp'
      - 'benchmarks/CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build bench_voice_assistant with THEMIS_ENABLE_VOICE_ASSISTANT=ON and run
  # the benchmark harness.  The build is marked continue-on-error so that when
  # voice dependencies are absent the job still completes and documents a SKIP
  # rather than a hard failure.
  # ---------------------------------------------------------------------------
  voice-benchmarks:
    name: Voice Benchmark Runner (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libssl-dev \
            libcurl4-openssl-dev \
            librocksdb-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            pkg-config \
            git \
            python3 python3-pip

      - name: Install Google Benchmark
        run: |
          sudo apt-get install -y libbenchmark-dev 2>/dev/null || true
          # Build from source if the apt package is absent or too old
          if ! pkg-config --exists benchmark 2>/dev/null; then
            git clone --depth 1 --branch v1.8.3 \
              https://github.com/google/benchmark.git /tmp/benchmark
            cmake -S /tmp/benchmark -B /tmp/benchmark/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBENCHMARK_ENABLE_TESTING=OFF \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
            cmake --build /tmp/benchmark/build --parallel $(nproc)
            sudo cmake --install /tmp/benchmark/build --prefix /usr/local
          fi

      - name: Prepare artifact directory
        run: mkdir -p benchmark_results/voice

      # -----------------------------------------------------------------------
      # Configure with THEMIS_ENABLE_VOICE_ASSISTANT=ON.
      # The flag enables the voice module sources and the bench_voice_assistant
      # CMake target which is guarded by this option in benchmarks/CMakeLists.txt.
      # -----------------------------------------------------------------------
      - name: Configure (voice benchmark build)
        id: cmake_configure
        continue-on-error: true
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -o pipefail
          cmake -B build_voice_bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${{ matrix.cc }}" \
            -DCMAKE_CXX_COMPILER="${{ matrix.cxx }}" \
            -DTHEMIS_ROOT_DIR="${{ github.workspace }}" \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_ENABLE_VOICE_ASSISTANT=ON \
            -DTHEMIS_ENABLE_LLM=ON \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_ENABLE_HIP=OFF \
            -DTHEMIS_ENABLE_OPENCL=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -S cmake \
            2>&1 | tee benchmark_results/voice/cmake_configure.log

      # -----------------------------------------------------------------------
      # Build bench_voice_assistant.
      # Marked continue-on-error: missing optional voice libraries (e.g. portaudio,
      # libspeech) are an expected absence on stock GitHub runners and result in a
      # documented SKIP rather than a blocking failure.
      # -----------------------------------------------------------------------
      - name: Build bench_voice_assistant
        id: cmake_build
        if: steps.cmake_configure.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build_voice_bench \
            --target bench_voice_assistant \
            -- -j$(nproc) \
            2>&1 | tee benchmark_results/voice/cmake_build.log

      # -----------------------------------------------------------------------
      # Run at least 1 benchmark iteration and capture JSON output.
      # --benchmark_min_time=0.1s is sufficient to document a representative run.
      # -----------------------------------------------------------------------
      - name: Run voice benchmarks
        id: bench_run
        if: steps.cmake_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./build_voice_bench/bench_voice_assistant \
            --benchmark_format=json \
            --benchmark_out=benchmark_results/voice/voice_bench_results.json \
            --benchmark_min_time=0.1s \
            2>&1 | tee benchmark_results/voice/voice_bench_run.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Summarise whether this was a full run or a skip due to missing deps.
      # -----------------------------------------------------------------------
      - name: Determine run status
        id: run_status
        if: always()
        run: |
          if [ "${{ steps.cmake_configure.outcome }}" != "success" ]; then
            echo "status=SKIP_CONFIGURE" >> "$GITHUB_OUTPUT"
            echo "status_emoji=⏭️" >> "$GITHUB_OUTPUT"
            echo "status_detail=CMake configure failed – voice dependencies likely absent on this runner." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.cmake_build.outcome }}" != "success" ]; then
            echo "status=SKIP_BUILD" >> "$GITHUB_OUTPUT"
            echo "status_emoji=⏭️" >> "$GITHUB_OUTPUT"
            echo "status_detail=bench_voice_assistant build failed – optional voice libraries (e.g. STT/TTS models, audio libs) not installed." >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.bench_run.outcome }}" != "success" ]; then
            echo "status=SKIP_RUN" >> "$GITHUB_OUTPUT"
            echo "status_emoji=⚠️" >> "$GITHUB_OUTPUT"
            echo "status_detail=bench_voice_assistant built but exited non-zero – runtime voice dependencies missing or initialisation failed." >> "$GITHUB_OUTPUT"
          else
            echo "status=PASS" >> "$GITHUB_OUTPUT"
            echo "status_emoji=✅" >> "$GITHUB_OUTPUT"
            echo "status_detail=bench_voice_assistant ran successfully; JSON results captured." >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Persist build logs and benchmark results so the "mindestens 1 Testlauf
      # dokumentiert" acceptance criterion is always verifiable.
      # -----------------------------------------------------------------------
      - name: Upload voice benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-benchmark-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: benchmark_results/voice/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🎤 Voice Benchmark CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **CMake flag** | \`THEMIS_ENABLE_VOICE_ASSISTANT=ON\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | ${{ steps.run_status.outputs.status_emoji }} \`${{ steps.run_status.outputs.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Detail:** ${{ steps.run_status.outputs.status_detail }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build stages" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CMake configure (\`THEMIS_ENABLE_VOICE_ASSISTANT=ON\`) | \`${{ steps.cmake_configure.outcome }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build \`bench_voice_assistant\` | \`${{ steps.cmake_build.outcome }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Benchmark run (≥1 iteration) | \`${{ steps.bench_run.outcome }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Acceptance criteria (Maßnahme #4)" >> "$GITHUB_STEP_SUMMARY"
          echo "| # | Criterion | Met? |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|-----------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1 | CI job with \`THEMIS_ENABLE_VOICE_ASSISTANT=ON\` | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2 | \`bench_voice_assistant\` built and ≥1 run documented | \`${{ steps.run_status.outputs.status }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3 | Missing voice-deps documented as SKIP | ✅ (continue-on-error + this summary) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4 | Report linked in \`PERFORMANCE_EXPECTATIONS.md\` | ✅ (§1.4 Maßnahme #4 + §5.9) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark_results/voice/voice_bench_results.json ]; then
            echo "### Benchmark results (summary)" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(JSON parse unavailable)"
          import json, sys
          with open("benchmark_results/voice/voice_bench_results.json") as f:
              data = json.load(f)
          benches = data.get("benchmarks", [])
          print(f"Total benchmarks recorded: {len(benches)}")
          for b in benches[:10]:
              name = b.get("name", "?")
              rt = b.get("real_time", "?")
              unit = b.get("time_unit", "ns")
              print(f"  {name}: {rt} {unit}")
          if len(benches) > 10:
              print(f"  … and {len(benches) - 10} more")
          PYEOF
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Commit a baseline JSON back to community so future runs have a reference point.
  # Runs only after a successful benchmark run on community branch push.
  # ---------------------------------------------------------------------------
  update-voice-baseline:
    name: Update Voice Benchmark Baseline
    needs: voice-benchmarks
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/community' &&
      needs.voice-benchmarks.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit the updated baseline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download benchmark results
        id: download_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: voice-benchmark-results-ubuntu-22.04-gcc-12
          path: benchmark_results/voice

      - name: Rebuild voice baseline from latest results
        if: steps.download_artifact.outcome == 'success'
        run: |
          python3 - <<'PYEOF'
          import json, os
          from datetime import datetime, timezone

          results_file = "benchmark_results/voice/voice_bench_results.json"
          if not os.path.exists(results_file):
              print("⏭️  No voice_bench_results.json found – skipping baseline update.")
              raise SystemExit(0)

          with open(results_file) as f:
              raw = json.load(f)

          benchmarks = {}
          for bench in raw.get("benchmarks", []):
              name = bench.get("name", "unknown")
              benchmarks[name] = {
                  "real_time":        bench.get("real_time"),
                  "cpu_time":         bench.get("cpu_time"),
                  "iterations":       bench.get("iterations"),
                  "items_per_second": bench.get("items_per_second"),
                  "bytes_per_second": bench.get("bytes_per_second"),
                  "time_unit":        bench.get("time_unit"),
              }

          version = "unknown"
          if os.path.exists("VERSION"):
              with open("VERSION") as vf:
                  version = vf.read().strip()

          baseline = {
              "version":    version,
              "branch":     "community",
              "commit":     os.environ.get("GITHUB_SHA", "unknown"),
              "timestamp":  datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "flag":       "THEMIS_ENABLE_VOICE_ASSISTANT=ON",
              "benchmarks": benchmarks,
          }

          os.makedirs("benchmarks/baselines/voice", exist_ok=True)
          out = "benchmarks/baselines/voice/baseline.json"
          with open(out, "w") as f:
              json.dump(baseline, f, indent=2)
          print(f"✅ Voice baseline rebuilt: {out} ({len(benchmarks)} benchmarks)")
          PYEOF

      - name: Commit and push updated voice baseline
        if: steps.download_artifact.outcome == 'success'
        shell: bash
        run: |
          git config user.name  'ThemisDB CI Bot'
          git config user.email 'bot@themisdb.local'
          git add benchmarks/baselines/voice/baseline.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No voice baseline changes to commit."
          else
            git commit -m "chore(voice): auto-update voice benchmark baseline [skip ci]"
            git pull --rebase origin community
            git push origin community
            echo "✅ Voice benchmark baseline committed to community."
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 🎤 Voice Benchmark CI – Update Baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline file: \`benchmarks/baselines/voice/baseline.json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Committed updated voice benchmark baseline back to \`community\` (if changed)." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate job – always runs so pull-request status checks are satisfied even
  # when voice-benchmarks was skipped due to path filter.
  # ---------------------------------------------------------------------------
  voice-benchmark-gate:
    name: Voice Benchmark Gate
    needs: voice-benchmarks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check benchmark status
        shell: bash
        run: |
          result="${{ needs.voice-benchmarks.result }}"
          if [[ "$result" == "success" ]]; then
            echo "✅ Voice benchmarks passed."
          elif [[ "$result" == "skipped" ]]; then
            echo "ℹ️  Voice benchmarks skipped (no relevant changes detected)."
          else
            echo "⚠️  Voice benchmarks reported a non-success outcome: $result"
            echo "This is treated as a warning (not a hard failure) because voice"
            echo "dependencies (STT/TTS models, audio libraries) may be absent on"
            echo "this runner.  See the voice-benchmarks job summary for details."
            # Do NOT exit 1 here – this is an optional runner.
            # Hard failures in the voice module itself are caught by the
            # voice-module-ci.yml functional test workflow.
          fi
