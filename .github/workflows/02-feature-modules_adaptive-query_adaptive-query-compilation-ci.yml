name: Adaptive Query Compilation CI

# Triggered on every push/PR that touches the AdaptiveQueryCompiler sources,
# its test file, or this workflow itself.
# Targets v1.8.0 (roadmap:86:performance:v1.8.0:adaptive-query-compilation).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/performance/adaptive_query_compiler.h'
      - 'src/performance/adaptive_query_compiler.cpp'
      - 'tests/test_adaptive_query_compilation.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_adaptive-query-compilation-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/performance/adaptive_query_compiler.h'
      - 'src/performance/adaptive_query_compiler.cpp'
      - 'tests/test_adaptive_query_compilation.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_adaptive-query-compilation-ci.yml'
  workflow_dispatch:

concurrency:
  group: adaptive-query-compilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the AdaptiveQueryCompilationFocusedTests suite.
  # Tests cover all seven acceptance criteria (AC-1 to AC-7):
  #   AC-1  Hot Query Detection  – execution counter crosses hot_threshold
  #   AC-2  Type Specialisation  – compiled path uses typed predicate dispatch
  #   AC-3  Expression Folding   – constant predicates folded at compile time
  #   AC-4  Vectorized Codegen   – IR/assembly reflects vectorisation flag
  #   AC-5  Adaptive Recompilation – drift check triggers re-compile
  #   AC-6  LLVM IR generation   – CompiledQuery::llvm_ir is non-empty and valid
  #   AC-7  CompilationStats     – queries_compiled, failures, cache_size, etc.
  # ---------------------------------------------------------------------------
  adaptive-query-compilation-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Adaptive Query Compilation tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build (adaptive query compilation test target)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_adaptive_query_compilation_focused

      - name: Run Adaptive Query Compilation unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex AdaptiveQueryCompilationFocusedTests \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee adaptive_query_compilation_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-query-compilation-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/adaptive_query_compilation_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚡ Adaptive Query Compilation – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "AdaptiveQueryCompiler: hot-path detection, type specialisation, expression folding, vectorized codegen, adaptive recompilation." >> "$GITHUB_STEP_SUMMARY"
