name: Publish · Enterprise Edition

# Publishes Enterprise (and Military) build artefacts to the private registry.
#
# TRIGGERS
# --------
#   • Push of a tag matching enterprise-v* (e.g. enterprise-v2.1.0)
#     from the enterprise branch.
#   • Manual workflow_dispatch for dry-run / re-publish.
#
# SECURITY
# --------
#   • Publishing steps run ONLY inside the 'enterprise-prod' environment,
#     which requires reviewer approval before the job can access secrets.
#   • Secrets are NEVER available in fork-PR builds:
#     - environment protection rules guarantee this.
#     - Secrets are accessed only after environment approval.
#   • The build step (compile + test) runs without any secrets.
#   • The publish step runs only after the build succeeds AND environment
#     approval is granted.
#
# REQUIRED SECRETS (in 'enterprise-prod' environment)
# -------------------------------------------------------
#   ENTERPRISE_REGISTRY_URL      – OCI registry URL (e.g. ghcr.io/myorg)
#   ENTERPRISE_REGISTRY_USER     – Registry username
#   ENTERPRISE_REGISTRY_TOKEN    – Registry push token
#   ENTERPRISE_SIGNING_KEY       – GPG private key for artefact signing
#   ENTERPRISE_SIGNING_PASSPHRASE– Passphrase for the signing key
#
# REQUIRED ENVIRONMENTS (configure in repo Settings → Environments)
#   enterprise-prod              – Protection rules: require reviewer approval

on:
  push:
    tags:
      - 'enterprise-v*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (e.g. enterprise-v2.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry-run: build but do NOT publish'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 · Build & Test (no secrets, no environment gate)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build Enterprise + Military
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Resolve tag name
        id: resolve-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip edition prefix to get semver: enterprise-v2.1.0 → 2.1.0
          VERSION="${TAG#enterprise-v}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG  version: $VERSION"

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Initialize llama.cpp submodule
        run: git submodule update --init --depth=1 llama.cpp

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:  gcc-12
          cxx: g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Build Enterprise edition
        uses: ./.github/actions/configure-themis
        with:
          cc:         gcc-12
          cxx:        g++-12
          build-type: Release
          edition:    ENTERPRISE
          ci-mode:    'true'
          build-target: themis_tests

      - name: Run Enterprise smoke tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildConfiguration*:BuildInfo*:ModuleLoader*:FeatureFlags*" \
            --gtest_output="xml:enterprise_smoke_results.xml" \
            2>&1 | tee enterprise_smoke_output.txt

      - name: Build Military edition
        uses: ./.github/actions/configure-themis
        with:
          cc:         gcc-12
          cxx:        g++-12
          build-type: Release
          edition:    MILITARY
          ci-mode:    'true'
          build-target: themis_tests

      - name: Run Military smoke tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildConfiguration*:BuildInfo*:ModuleLoader*:FeatureFlags*" \
            --gtest_output="xml:military_smoke_results.xml" \
            2>&1 | tee military_smoke_output.txt

      - name: Package Enterprise artefacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-tag.outputs.version }}"
          BASENAME="themisdb-${VERSION}-enterprise-binary-x64"
          mkdir -p dist/enterprise
          # Stage binary artefacts (adapt paths to your actual build output)
          cp build/themis_tests "dist/enterprise/${BASENAME}" 2>/dev/null || true
          tar -czf "dist/${BASENAME}.tar.gz" -C dist/enterprise . 2>/dev/null || true
          echo "Artefacts staged in dist/"
          ls -lh dist/ || true

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-build-${{ steps.resolve-tag.outputs.version }}
          retention-days: 30
          path: |
            dist/
            build/*_results.xml
            build/*_output.txt

      - name: Write build summary
        if: always()
        run: |
          echo "## 🏢 Enterprise Build — ${{ steps.resolve-tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Edition | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ENTERPRISE | ✅ Built |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MILITARY   | ✅ Built |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`${{ steps.resolve-tag.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 · Publish (environment-gated, requires reviewer approval)
# ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish Enterprise artefacts
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    # This environment requires reviewer approval before the job runs.
    # Secrets are scoped to this environment and are ONLY accessible here.
    environment: enterprise-prod

    permissions:
      contents: read

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#enterprise-v}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          name: enterprise-build-${{ steps.version.outputs.version }}
          path: dist/

      - name: Log in to Enterprise registry
        if: steps.version.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ENTERPRISE_REGISTRY_URL }}
          username: ${{ secrets.ENTERPRISE_REGISTRY_USER }}
          password: ${{ secrets.ENTERPRISE_REGISTRY_TOKEN }}

      - name: Sign artefacts with GPG
        if: steps.version.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.ENTERPRISE_SIGNING_KEY }}" | gpg --batch --import
          for f in dist/themisdb-*-enterprise-binary-*.tar.gz; do
            [[ -f "$f" ]] || continue
            echo "${{ secrets.ENTERPRISE_SIGNING_PASSPHRASE }}" | \
              gpg --batch --yes --passphrase-fd 0 --detach-sign --armor "$f"
            echo "Signed: $f"
          done

      - name: Publish artefacts
        shell: bash
        run: |
          DRY_RUN="${{ steps.version.outputs.dry_run }}"
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would publish Enterprise artefacts for version $VERSION"
            ls -lh dist/ || true
          else
            echo "Publishing Enterprise artefacts for version $VERSION …"
            # Add actual publish commands here, e.g.:
            #   oras push ${{ secrets.ENTERPRISE_REGISTRY_URL }}/themisdb-enterprise:${VERSION} dist/
            echo "Publish complete."
          fi

      - name: Write publish summary
        if: always()
        run: |
          DRY_RUN="${{ steps.version.outputs.dry_run }}"
          echo "## 🚀 Enterprise Publish — ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | \`${DRY_RUN:-false}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`enterprise-prod\` (approval required) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${DRY_RUN:-false}" == "true" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ℹ️ Dry-run mode: artefacts were NOT published." >> "$GITHUB_STEP_SUMMARY"
          fi
