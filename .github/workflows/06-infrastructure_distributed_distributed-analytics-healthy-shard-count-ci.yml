name: DistributedAnalytics Healthy Shard Count CI

# Validates the fix for "DistributedAnalyticsSharding::getHealthyShardCount() — Network I/O Under Lock"
# (v1.8.0, Issue analytics-8).
# Covers:
#   AC-DAS-1  getHealthyShardCount() reads cached_healthy atomic (no network I/O, ≤ 2 µs)
#   AC-DAS-2  Background health monitor updates cached_healthy every health_check_interval
#   AC-DAS-3  getHealthyShardCountAsync() performs live isHealthy() calls off the registry lock
#   AC-DAS-4  addShard() completes within 50 ms while a 500 ms health check is in progress
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/distributed_analytics.h'
      - 'src/analytics/distributed_analytics.cpp'
      - 'tests/analytics/test_distributed_analytics.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_distributed_distributed-analytics-healthy-shard-count-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/distributed_analytics.h'
      - 'src/analytics/distributed_analytics.cpp'
      - 'tests/analytics/test_distributed_analytics.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_distributed_distributed-analytics-healthy-shard-count-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the DistributedAnalyticsFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-DAS-1  getHealthyShardCount() reads cached atomic — no isHealthy() call under lock
  #   AC-DAS-2  Background monitor (100 ms interval in test) updates cached_healthy after toggle
  #   AC-DAS-3  getHealthyShardCountAsync() future resolves with live count (not cached)
  #   AC-DAS-4  addShard() completes < 50 ms while monitor holds its dedicated mutex during
  #             a 500 ms simulated health check; old code would have blocked for ~300 ms
  # ---------------------------------------------------------------------------
  das-healthy-shard-count-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: DAS healthy-shard-count tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_distributed_analytics_focused

      - name: Run DistributedAnalyticsFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R DistributedAnalyticsFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee das_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_distributed_analytics_focused \
            --gtest_output="xml:das_gtest.xml" \
            2>&1 | tee das_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: das-healthy-shard-count-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/das_ctest.txt
            build/das_gtest.xml
            build/das_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 DistributedAnalytics Healthy Shard Count – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "DAS: cached health reads (no network I/O under lock), background monitor updates, async live path, addShard() non-blocking during health sweep." >> "$GITHUB_STEP_SUMMARY"
