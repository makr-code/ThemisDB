name: AI Context Wiki Sync

# Automated AI-context linting and optional write-back for LLM-Wiki style
# maintenance in ai_context/.

on:
  push:
    branches: [develop, community]
    paths:
      - 'ai_context/**'
      - 'INDEX.md'
      - 'LOG.md'
      - 'AI_WIKI_INTEGRATION_PLAYBOOK.md'
      - 'scripts/ai-context-lint.py'
      - '.github/workflows/08-maintenance_ai-context-wiki-sync.yml'
  pull_request:
    branches: [develop, community]
    paths:
      - 'ai_context/**'
      - 'INDEX.md'
      - 'LOG.md'
      - 'AI_WIKI_INTEGRATION_PLAYBOOK.md'
      - 'scripts/ai-context-lint.py'
      - '.github/workflows/08-maintenance_ai-context-wiki-sync.yml'
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      apply_updates:
        description: 'Write updates to ai_context/KNOWLEDGE_LINT_REPORT.md and ai_context/KNOWLEDGE_CONFLICTS.md'
        type: boolean
        default: false
      update_mode:
        description: 'How to publish updates: direct-commit or pull-request'
        type: choice
        options:
          - direct-commit
          - pull-request
        default: direct-commit
      fail_on_findings:
        description: 'Fail workflow when findings are present'
        type: boolean
        default: false
      target_branch:
        description: 'Branch for optional auto-commit'
        type: string
        default: 'develop'
      pr_branch_prefix:
        description: 'Branch prefix used in pull-request mode'
        type: string
        default: 'chore/ai-context-sync'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  lint-and-sync:
    name: ai_context lint and sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI context lint (text)
        id: lint_text
        run: |
          set -euo pipefail
          APPLY_FLAG=""
          FAIL_FLAG=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply_updates }}" = "true" ]; then
            APPLY_FLAG="--apply-updates"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.fail_on_findings }}" = "true" ]; then
            FAIL_FLAG="--fail-on-findings"
          fi

          python3 scripts/ai-context-lint.py \
            --format text \
            --output /tmp/ai-context-lint.txt \
            ${APPLY_FLAG} \
            ${FAIL_FLAG}

      - name: Generate JSON lint report
        if: always()
        run: |
          python3 scripts/ai-context-lint.py \
            --format json \
            --output /tmp/ai-context-lint.json

      - name: Upload lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-context-lint-${{ github.run_number }}
          path: |
            /tmp/ai-context-lint.txt
            /tmp/ai-context-lint.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit AI context updates (direct mode)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.apply_updates == true &&
          inputs.update_mode == 'direct-commit' &&
          github.ref == format('refs/heads/{0}', inputs.target_branch)
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ai_context/KNOWLEDGE_LINT_REPORT.md ai_context/KNOWLEDGE_CONFLICTS.md

          if git diff --cached --quiet; then
            echo "No ai_context changes to commit."
            exit 0
          fi

          git commit -m "chore(ai_context): automated lint sync [skip ci]"

          if ! git pull --rebase origin "${{ inputs.target_branch }}"; then
            git rebase --abort
            echo "::error::Rebase failed while syncing ai_context updates."
            exit 1
          fi

          git push

      - name: Prepare AI context update branch (PR mode)
        id: pr_branch
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.apply_updates == true &&
          inputs.update_mode == 'pull-request' &&
          github.ref == format('refs/heads/{0}', inputs.target_branch)
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ai_context/KNOWLEDGE_LINT_REPORT.md ai_context/KNOWLEDGE_CONFLICTS.md

          if git diff --cached --quiet; then
            echo "No ai_context changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH_NAME="${{ inputs.pr_branch_prefix }}-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore(ai_context): automated lint sync [skip ci]"
          git push --set-upstream origin "$BRANCH_NAME"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create AI context pull request
        id: create_pr
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.apply_updates == true &&
          inputs.update_mode == 'pull-request' &&
          steps.pr_branch.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${process.env.PR_BRANCH}`;
            const base = process.env.PR_BASE;

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base,
              per_page: 1,
            });

            if (existing.data.length > 0) {
              const pr = existing.data[0];
              core.setOutput('pr_url', pr.html_url);
              core.info(`PR already exists: ${pr.html_url}`);
              return;
            }

            const created = await github.rest.pulls.create({
              owner,
              repo,
              title: 'chore(ai_context): automated knowledge lint sync',
              head: process.env.PR_BRANCH,
              base,
              body: [
                'Automated AI-context update from workflow dispatch.',
                '',
                'Updated files:',
                '- ai_context/KNOWLEDGE_LINT_REPORT.md',
                '- ai_context/KNOWLEDGE_CONFLICTS.md',
                '',
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });

            core.setOutput('pr_url', created.data.html_url);
            core.info(`PR created: ${created.data.html_url}`);
        env:
          PR_BRANCH: ${{ steps.pr_branch.outputs.branch_name }}
          PR_BASE: ${{ inputs.target_branch }}

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## AI Context Wiki Sync"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| **Script** | \`scripts/ai-context-lint.py\` |"
            echo "| **Event** | \`${{ github.event_name }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "| **Apply updates** | ${{ inputs.apply_updates }} |"
              echo "| **Update mode** | ${{ inputs.update_mode }} |"
              echo "| **Fail on findings** | ${{ inputs.fail_on_findings }} |"
              echo "| **Target branch** | \`${{ inputs.target_branch }}\` |"
              if [ "${{ inputs.update_mode }}" = "pull-request" ]; then
                echo "| **PR branch prefix** | \`${{ inputs.pr_branch_prefix }}\` |"
              fi
            else
              echo "| **Apply updates** | false |"
              echo "| **Update mode** | n/a |"
              echo "| **Fail on findings** | false |"
            fi

            if [ -f /tmp/ai-context-lint.json ]; then
              TOTAL=$(python3 -c "import json; d=json.load(open('/tmp/ai-context-lint.json')); print(d['summary']['findings'])" 2>/dev/null || echo "n/a")
              CRIT=$(python3 -c "import json; d=json.load(open('/tmp/ai-context-lint.json')); print(d['summary']['severity']['critical'])" 2>/dev/null || echo "n/a")
              HIGH=$(python3 -c "import json; d=json.load(open('/tmp/ai-context-lint.json')); print(d['summary']['severity']['high'])" 2>/dev/null || echo "n/a")
              MED=$(python3 -c "import json; d=json.load(open('/tmp/ai-context-lint.json')); print(d['summary']['severity']['medium'])" 2>/dev/null || echo "n/a")
              LOW=$(python3 -c "import json; d=json.load(open('/tmp/ai-context-lint.json')); print(d['summary']['severity']['low'])" 2>/dev/null || echo "n/a")
              echo "| **Findings** | ${TOTAL} |"
              echo "| **Severity** | critical=${CRIT}, high=${HIGH}, medium=${MED}, low=${LOW} |"
            fi

            echo ""
            if [ -f /tmp/ai-context-lint.txt ]; then
              echo "**Text Report:**"
              echo '```'
              cat /tmp/ai-context-lint.txt
              echo '```'
            fi

            if [ "${{ steps.create_pr.outputs.pr_url }}" != "" ]; then
              echo ""
              echo "PR: ${{ steps.create_pr.outputs.pr_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
