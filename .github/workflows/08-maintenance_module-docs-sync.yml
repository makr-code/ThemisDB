name: Module Docs Sync

# Scans src/**/*.md and include/**/*.md, groups files by module, and generates
# one aggregated secondary-documentation index page per module:
#
#   docs/de/<module>/PRIMARY_SOURCES.md   (German labels)
#   docs/en/<module>/PRIMARY_SOURCES.md   (English labels)
#
# After building:
#   1. Creates GitHub Issues for underdocumented / new modules.
#   2. Updates CHANGELOG.md [Unreleased] → ### Documentation.
#   3. Commits all changes back to develop.
#
# Triggers:
#   - push to develop when *.md files in src/** or include/** change,
#     or when the generator / workflow files themselves change.
#   - nightly schedule at 03:00 UTC as a safety net.
#   - workflow_dispatch for manual runs.
#
# Auto-commit and issue creation are guarded by:
#   if: github.ref == 'refs/heads/develop'
# so they never run on PRs or other branches.

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**/*.md'
      - 'include/**/*.md'
      - 'tools/module_docs_builder.py'
      - 'tools/ci/changelog_updater.py'
      - 'tools/ci/module_docs_issue_reporter.py'
      - '.github/workflows/08-maintenance_module-docs-sync.yml'
  schedule:
    - cron: '0 3 * * *'  # Nightly at 03:00 UTC – sync module docs across all branches
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: scan and report without writing files or creating issues'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed for the commit-back step
  issues: write     # needed to create GitHub Issues

jobs:
  sync:
    name: Build · Changelog · Issues
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    env:
      REPO: ${{ github.repository }}
      DRY_RUN_FLAG: ${{ (inputs.dry_run == true) && '--dry-run' || '' }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history for accurate timestamps
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Build PRIMARY_SOURCES.md pages ───────────────────────────────────
      - name: Run module_docs_builder
        id: builder
        run: |
          python3 tools/module_docs_builder.py \
            --issues-json /tmp/module-findings.json \
            ${{ env.DRY_RUN_FLAG }}

          # Extract all counts in a single Python call for maintainability.
          python3 - <<'EOF'
          import json, os
          d = json.load(open("/tmp/module-findings.json"))
          module_count = len(d["modules"])
          file_count   = sum(len(v["files"]) for v in d["modules"].values())
          underdoc     = len(d["underdocumented_modules"])
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as fh:
              fh.write(f"module_count={module_count}\n")
              fh.write(f"file_count={file_count}\n")
              fh.write(f"underdoc_count={underdoc}\n")
          EOF

      # ── 4. Update CHANGELOG.md ──────────────────────────────────────────────
      - name: Update CHANGELOG.md
        if: github.ref == 'refs/heads/develop'
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          MODULE_COUNT=${{ steps.builder.outputs.module_count }}
          FILE_COUNT=${{ steps.builder.outputs.file_count }}
          UNDERDOC=${{ steps.builder.outputs.underdoc_count }}

          python3 tools/ci/changelog_updater.py \
            --entry-title "Module-Docs Sync 📚 — ${TODAY}" \
            --key "module-docs-sync-${TODAY}" \
            --entry-body "- ${MODULE_COUNT} Module indexiert; ${FILE_COUNT} Primary-Markdown-Dateien in \`src/\` und \`include/\`" \
            --entry-body "- ${UNDERDOC} Module ohne Sekundärdokumentation erkannt; Issues erzeugt" \
            --entry-body "- Sekundärdokumentation aktualisiert in \`docs/de/\` und \`docs/en/\`" \
            --entry-body "- Tool: \`tools/module_docs_builder.py\` v1.0.0" \
            ${{ env.DRY_RUN_FLAG }}

      # ── 5. Commit generated pages + CHANGELOG ───────────────────────────────
      - name: Commit and push changes
        if: github.ref == 'refs/heads/develop' && inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/de/ docs/en/ CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: sync module docs [skip ci]"
            # [R4] Rebase on any commits that landed on develop while this job ran.
            # Prevents "rejected — non-fast-forward" push failures.
            # On conflict: abort the rebase and fail with a clear message so the
            # next run (or a human) can resolve it — do not push partial state.
            if ! git pull --rebase origin develop; then
              git rebase --abort
              echo "::error::Rebase on develop failed (conflict). Re-run the workflow or resolve manually."
              exit 1
            fi
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Create GitHub Issues for underdocumented modules ─────────────────
      - name: Create issues for underdocumented modules
        if: github.ref == 'refs/heads/develop' && inputs.dry_run != true
        run: |
          python3 tools/ci/module_docs_issue_reporter.py \
            --report /tmp/module-findings.json \
            --repo "${{ env.REPO }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Step summary ─────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## 📚 Module Docs Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | ${{ inputs.dry_run == true && 'yes' || 'no' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Modules** | ${{ steps.builder.outputs.module_count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Primary files** | ${{ steps.builder.outputs.file_count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Underdocumented** | ${{ steps.builder.outputs.underdoc_count }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.ref }}" = "refs/heads/develop" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "✅ Changes committed to \`develop\` and CHANGELOG.md updated." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🐛 Issues created for modules without human-authored secondary docs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Running on \`${{ github.ref_name }}\` — no commit or issues created." >> "$GITHUB_STEP_SUMMARY"
          fi
