name: Copilot Ollama Router — CI

on:
  push:
    paths:
      - 'tools/copilot-ollama-router/**'
  pull_request:
    paths:
      - 'tools/copilot-ollama-router/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: tools/copilot-ollama-router

jobs:
  ci:
    name: Compile · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/copilot-ollama-router/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx mocha
