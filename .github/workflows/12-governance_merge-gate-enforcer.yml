name: '12: Governance - Merge Gate Enforcer'

on:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled
    branches:
      - develop
      - community
      - military
      - hyperscaler
  pull_request_review:
    types:
      - submitted
  issue_comment:
    types:
      - created

permissions:
  pull-requests: write
  contents: read
  issues: write
  checks: write

jobs:
  tier0-validation:
    name: Tier 0 Gate Validation
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize')
    
    outputs:
      tier0_status: ${{ steps.validate.outputs.tier0_status }}
      tier0_json: ${{ steps.validate.outputs.result_json }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Tier 0 Validator
        id: validate
        run: |
          python3 .github/scripts/tier0_gate_validator.py \
            --all-gates \
            --output /tmp/tier0_result.json
          
          # Read result and export outputs
          RESULT=$(cat /tmp/tier0_result.json)
          echo "result_json=$RESULT" >> $GITHUB_OUTPUT
          
          # Extract status
          STATUS=$(echo "$RESULT" | python3 -c "import sys, json; print(json.load(sys.stdin)['tier0_status'])")
          echo "tier0_status=$STATUS" >> $GITHUB_OUTPUT

      - name: Parse Tier 0 Results
        id: parse
        run: |
          python3 << 'EOF'
          import json
          import sys
          
          result = json.loads('${{ steps.validate.outputs.result_json }}')
          
          # Generate markdown table
          markdown = "## Tier 0 Gates Validation\n\n"
          markdown += f"**Status:** `{result['tier0_status']}`\n\n"
          markdown += "| Gate | Status | Details |\n"
          markdown += "|------|--------|----------|\n"
          
          for gate in result['gates']:
              status_emoji = "✅" if gate['status'] == "PASS" else "❌"
              markdown += f"| {gate['gate_id']} | {status_emoji} {gate['status']} | {gate['details']} |\n"
          
          markdown += f"\n**Summary:** {result['passed_gates']}/{result['total_gates']} gates passed"
          
          if result['critical_failures'] > 0:
              markdown += f"\n❗ **{result['critical_failures']} critical failures - merge blocked**"
          
          print(markdown)
          EOF

      - name: Comment PR - Tier 0 Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.validate.outputs.result_json }}`);
            
            let markdown = "## Tier 0 Gates Validation\n\n";
            markdown += `**Status:** \`${result.tier0_status}\`\n\n`;
            markdown += "| Gate | Status | Details |\n";
            markdown += "|------|--------|----------|\n";
            
            for (const gate of result.gates) {
              const emoji = gate.status === "PASS" ? "✅" : "❌";
              markdown += `| ${gate.gate_id} | ${emoji} ${gate.status} | ${gate.details} |\n`;
            }
            
            markdown += `\n**Summary:** ${result.passed_gates}/${result.total_gates} gates passed`;
            
            if (result.critical_failures > 0) {
              markdown += `\n\n❗ **${result.critical_failures} critical failures detected**`;
              markdown += `\n\nMerge is blocked until all Tier 0 gates pass.`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markdown
            });

      - name: Set Check Run Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.validate.outputs.result_json }}`);
            
            const conclusion = result.tier0_status === "PASS" ? "success" : "failure";
            const status = "completed";
            
            github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "Merge Gate Validation - Tier 0",
              head_sha: context.payload.pull_request.head.sha,
              status: status,
              conclusion: conclusion,
              output: {
                title: `Tier 0 Gates: ${result.tier0_status}`,
                summary: `${result.passed_gates}/${result.total_gates} gates passed`,
                text: JSON.stringify(result, null, 2)
              }
            });

  tier1-validation:
    name: Tier 1 Gate Escalation
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize') &&
      (github.base_ref == 'community' || github.base_ref == 'military')
    
    outputs:
      tier1_status: ${{ steps.escalate.outputs.tier1_status }}
      requires_escalation: ${{ steps.escalate.outputs.requires_escalation }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Tier 1 Escalator
        id: escalate
        run: |
          python3 .github/scripts/tier1_gate_escalator.py \
            --target-branch ${{ github.base_ref }} \
            --output /tmp/tier1_result.json
          
          RESULT=$(cat /tmp/tier1_result.json)
          echo "result_json=$RESULT" >> $GITHUB_OUTPUT
          
          STATUS=$(echo "$RESULT" | python3 -c "import sys, json; print(json.load(sys.stdin)['tier1_status'])")
          REQUIRES=$(echo "$RESULT" | python3 -c "import sys, json; print('true' if json.load(sys.stdin)['requires_escalation'] else 'false')")
          
          echo "tier1_status=$STATUS" >> $GITHUB_OUTPUT
          echo "requires_escalation=$REQUIRES" >> $GITHUB_OUTPUT

      - name: Comment PR - Tier 1 Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.escalate.outputs.result_json }}`);
            
            let markdown = "## Tier 1 Gates - Escalation Required\n\n";
            markdown += `**Status:** \`${result.tier1_status}\`\n`;
            markdown += `**Requires Escalation:** ${result.requires_escalation}\n\n`;
            
            markdown += "| Gate | Status | Threshold | Current |\n";
            markdown += "|------|--------|-----------|----------|\n";
            
            for (const gate of result.gates) {
              const emoji = gate.status === "PASS" ? "✅" : gate.status === "WAIVER_REQUIRED" ? "⚠️" : "❌";
              markdown += `| ${gate.gate_id} | ${emoji} ${gate.status} | ${gate.required_threshold} | ${gate.current_value} |\n`;
            }
            
            if (result.requires_escalation) {
              markdown += `\n**Escalation Required:** Release Lead review and waiver needed within 72 hours\n`;
              markdown += `\nTo approve with waiver, comment:\n`;
              markdown += `\`\`\`\n/approve-with-waiver <GATE_ID> "justification"\n\`\`\``;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markdown
            });

  waiver-processor:
    name: Waiver Command Processor
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '/approve-with-waiver')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Verify Approver Permissions
        id: verify
        run: |
          COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
          
          # Check if user is in release-leads team
          # This would call GitHub API to verify team membership
          # For now, log the verification attempt
          echo "Approver: $COMMENT_AUTHOR"
          echo "approver=$COMMENT_AUTHOR" >> $GITHUB_OUTPUT

      - name: Process Waiver Command
        id: process
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          APPROVER="${{ steps.verify.outputs.approver }}"
          
          python3 .github/scripts/waiver_validator.py \
            --parse-comment "$COMMENT" \
            --pr-number $PR_NUMBER \
            --approver "$APPROVER" \
            --output /tmp/waiver_result.json
          
          RESULT=$(cat /tmp/waiver_result.json)
          echo "result_json=$RESULT" >> $GITHUB_OUTPUT
          
          SUCCESS=$(echo "$RESULT" | python3 -c "import sys, json; print('true' if json.load(sys.stdin).get('success', False) else 'false')")
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT

      - name: Comment PR - Waiver Result
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.process.outputs.result_json }}`);
            
            let markdown = "";
            
            if (result.success) {
              const waiver = result.waiver;
              markdown = `✅ **Waiver Approved**\n\n`;
              markdown += `- **Gate:** ${waiver.gate_id}\n`;
              markdown += `- **Approver:** @${waiver.approver}\n`;
              markdown += `- **Expires:** ${waiver.expires.split('T')[0]}\n`;
              markdown += `- **Justification:** "${waiver.justification}"\n\n`;
              markdown += `Merge is now permitted. Waiver expires in 14 days and must be renewed if gate remains unresolved.`;
            } else {
              markdown = `❌ **Waiver Rejected**\n\n`;
              markdown += `**Error:** ${result.error || result.message}\n\n`;
              markdown += `Command format:\n\`/approve-with-waiver <GATE_ID> "justification"\``;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markdown
            });

      - name: Update Audit Log
        if: success() && steps.process.outputs.success == 'true'
        run: |
          # Append to merge gate audit log
          RESULT=$(cat /tmp/waiver_result.json)
          echo "Waiver processed at $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> ai_working/MERGE_GATE_AUDIT_LOG.jsonl
          echo "$RESULT" >> ai_working/MERGE_GATE_AUDIT_LOG.jsonl

  block-merge-on-failure:
    name: Block Merge on Tier 0 Failure
    runs-on: ubuntu-latest
    needs: [tier0-validation]
    if: |
      always() &&
      needs.tier0-validation.outputs.tier0_status == 'FAIL'
    
    steps:
      - name: Block merge
        run: |
          echo "❌ Merge blocked: Tier 0 gates failed"
          exit 1
