name: Plugin Security CRL/OCSP CI

# Validates PluginSecurityVerifier CRL and OCSP certificate revocation checking
# (v1.8.0, Issue #38).
# Covers:
#   AC-REV-1  checkCRL()  – empty/invalid cert returns false
#   AC-REV-2  checkCRL()  – cert with no CRL endpoints honours checkRevocation flag
#   AC-REV-3  checkCRL()  – unreachable CRL endpoint fails-safe when revocation required
#   AC-REV-4  checkCRL()  – network timeout does not hang; fails-safe
#   AC-REV-5  checkCRL()  – cache hit returns consistent result
#   AC-REV-6  DER CRL parse – revoked serial detected by X509_CRL_get0_by_cert
#   AC-REV-7  DER CRL parse – non-revoked serial not in list
#   AC-REV-8  DER CRL parse – expired CRL timestamp correctly detected
#   AC-REV-9  DER CRL parse – CRL with wrong signing key rejected by X509_CRL_verify (signature-invalid)
#   AC-REV-10 checkOCSP() – empty/invalid cert returns false
#   AC-REV-11 checkOCSP() – no OCSP AIA honours checkRevocation flag
#   AC-REV-12 checkOCSP() – unreachable OCSP responder fails-safe
#   AC-REV-13 checkOCSP() – network timeout does not hang; fails-safe
#   AC-REV-14 checkOCSP() – cache hit returns consistent result
#   AC-REV-15 OCSP request construction smoke-test
#   AC-REV-16 OCSP tampered DER blob not accepted as successful response (signature-invalid)
#   AC-REV-17 PE cert extraction – ELF file returns nullopt (no embedded cert)
#   AC-REV-18 PE cert extraction – PE file with empty security dir returns nullopt

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/acceleration/plugin_security.h'
      - 'src/acceleration/plugin_security.cpp'
      - 'tests/test_plugin_security_crl_ocsp.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/05-quality_security_plugin-security-crl-ocsp-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/acceleration/plugin_security.h'
      - 'src/acceleration/plugin_security.cpp'
      - 'tests/test_plugin_security_crl_ocsp.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/05-quality_security_plugin-security-crl-ocsp-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  plugin-security-crl-ocsp-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Plugin Security CRL/OCSP (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libcurl4-openssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Run PluginSecurityCRLOCSPTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PluginSecurityCRLOCSPTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee crl_ocsp_ctest.txt

      - name: Run PluginSecurityCRLOCSP focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_plugin_security_crl_ocsp_focused \
            --gtest_filter="*" \
            --gtest_output="xml:crl_ocsp_gtest.xml" \
            2>&1 | tee crl_ocsp_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crl-ocsp-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/crl_ocsp_ctest.txt
            build/crl_ocsp_gtest.xml
            build/crl_ocsp_gtest_output.txt
          retention-days: 30
