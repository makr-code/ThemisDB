name: Prompt Engineering – Context Window Budget Manager CI

# Validates ContextWindowBudgetManager (Phase 2: token counting and
# context-window budget enforcement).
# roadmap:prompt_engineering:v1.x:context-window-budget-enforcement
#
# Acceptance criteria covered:
#   AC-1  CharDivisionCounter — correct estimates, non-zero minimum, custom divisor
#   AC-2  ITokenCounter injection — pluggable counter used for all counts
#   AC-3  fitChunksInBudget(chunks, available_tokens) — greedy selection, budget boundary
#   AC-4  fitChunksInBudget(chunks, system_prompt, query) — overhead deduction
#   AC-5  computeBudget() — correct per-section breakdown, utilisation ratio
#   AC-6  computeAndCheck() — returns allocation when fits, throws PromptBudgetExceededError
#   AC-7  PromptBudgetExceededError — totalTokens / maxTokens / modelName accessors
#   AC-8  setUtilizationCallback() — invoked on computeBudget and computeAndCheck
#   AC-9  ModelTokenBudget::promptBudget() — max_tokens minus reserved
#   AC-10 ModelTokenBudget::promptBudget() — saturates at 0 when reserved >= max

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/context_window_manager.h'
      - 'src/prompt_engineering/context_window_manager.cpp'
      - 'include/prompt_engineering/rag_prompt_builder.h'
      - 'tests/test_context_window_manager.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_prompt-engineering-context-window-ci.yml'
  workflow_dispatch:

concurrency:
  group: prompt-engineering-context-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run ContextWindowBudgetManagerFocusedTests.
  # Covers AC-1 through AC-10 (correctness tests).
  # ---------------------------------------------------------------------------
  context-window-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ContextWindowBudgetManager (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_context_window_manager_focused

      - name: Run ContextWindowBudgetManagerFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ContextWindowBudgetManagerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee context_window_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_context_window_manager_focused \
            --gtest_output="xml:context_window_gtest.xml" \
            2>&1 | tee context_window_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-window-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/context_window_ctest.txt
            build/context_window_gtest.xml
            build/context_window_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🪟 Prompt Engineering – Context Window Budget Manager" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1: CharDivisionCounter — correct estimates, non-zero minimum | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2: ITokenCounter injection — pluggable counter used for all counts | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3: fitChunksInBudget(chunks, tokens) — greedy selection, boundary | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4: fitChunksInBudget(chunks, system, query) — overhead deduction | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5: computeBudget() — per-section breakdown, utilisation ratio | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6: computeAndCheck() — fits returns allocation, over throws | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7: PromptBudgetExceededError — accessor methods correct | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8: setUtilizationCallback() — invoked on compute calls | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9: ModelTokenBudget::promptBudget() — max minus reserved | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: ModelTokenBudget::promptBudget() — saturates at 0 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
