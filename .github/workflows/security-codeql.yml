name: "CodeQL Advanced"

# Rechenaufwand-Score: R=4 (K=5, L=4, N=4) | last-calibrated: 2026-08-26
# Build note: Uses direct cmake --build (not autobuild) so that the pre-configured
# community-release preset is respected (THEMIS_ENABLE_HIP=OFF, no ROCm required).
# Trigger policy: repo framework score calibration for workflow cost controls.
#
# ── Default Code Scanning coexistence ────────────────────────────────────────
# GitHub's managed Default Code Scanning setup is currently enabled for this
# repository and publishes the authoritative CodeQL alerts for PRs and branch
# pushes. Advanced CodeQL uploads fail in that mode with:
#   "advanced configurations cannot be processed when the default setup is enabled"
# To keep this workflow useful without fighting the managed setup, we still run
# CodeQL extraction and query execution here, but we keep the SARIF local and do
# not upload it to Code Scanning.
#
# ── Query-suite split (cost control) ─────────────────────────────────────────
#   pull_request / push  → security-extended   (security rules only, no quality)
#   schedule (weekly)    → security-and-quality (full suite, runs at 03:00 UTC)
#
# ── Database size control ─────────────────────────────────────────────────────
# .github/codeql/codeql-config.yml excludes vendored paths (vcpkg/, llama.cpp/,
# internal/, build/, docs/, …) from the database to reduce build and analysis
# time. Only production source (src/, include/, tests/, benchmarks/, tools/) is
# compiled into the CodeQL database.
#
# ── Copilot Autofix ──────────────────────────────────────────────────────────
# Enable via: Repository Settings → Code security → Copilot Autofix → Enable
# When enabled, Copilot automatically suggests fixes for CodeQL findings on PRs.

on:
  push:
    branches: [ "develop", "community" ]
    paths:
      - 'clients/rust/**/*.rs'
      - 'clients/rust/Cargo.toml'
      - 'clients/rust/Cargo.lock'
      - 'src/**/*.c'
      - 'src/**/*.cc'
      - 'src/**/*.cpp'
      - 'src/**/*.cxx'
      - 'src/**/*.h'
      - 'src/**/*.hh'
      - 'src/**/*.hpp'
      - 'src/**/*.hxx'
      - 'include/**/*.h'
      - 'include/**/*.hh'
      - 'include/**/*.hpp'
      - 'include/**/*.hxx'
      - 'tests/**/*.c'
      - 'tests/**/*.cc'
      - 'tests/**/*.cpp'
      - 'tests/**/*.cxx'
      - 'tests/**/*.h'
      - 'tests/**/*.hh'
      - 'tests/**/*.hpp'
      - 'tests/**/*.hxx'
      - 'benchmarks/**/*.c'
      - 'benchmarks/**/*.cc'
      - 'benchmarks/**/*.cpp'
      - 'benchmarks/**/*.cxx'
      - 'benchmarks/**/*.h'
      - 'benchmarks/**/*.hh'
      - 'benchmarks/**/*.hpp'
      - 'benchmarks/**/*.hxx'
      - 'tools/ci/**/*.py'
      - 'tools/ci/**/*.sh'
      - 'tools/ci/**/*.ps1'
      - 'tools/tests/**/*.py'
      - 'tools/tests/**/*.sh'
      - 'tools/tests/**/*.ps1'
      - '*.c'
      - '*.cc'
      - '*.cpp'
      - '*.hpp'
      - '*.h'
      - '*.cs'
      - '*.csproj'
      - 'tools/**/*.cs'
      - 'tools/**/*.csproj'
      - 'examples/**/*.cs'
      - 'examples/**/*.csproj'
      - '.github/workflows/security-codeql.yml'
      - '.github/codeql/codeql-config.yml'
  pull_request:
    branches: [ "develop", "community" ]
    paths:
      - 'clients/rust/**/*.rs'
      - 'clients/rust/Cargo.toml'
      - 'clients/rust/Cargo.lock'
      - 'src/**/*.c'
      - 'src/**/*.cc'
      - 'src/**/*.cpp'
      - 'src/**/*.cxx'
      - 'src/**/*.h'
      - 'src/**/*.hh'
      - 'src/**/*.hpp'
      - 'src/**/*.hxx'
      - 'include/**/*.h'
      - 'include/**/*.hh'
      - 'include/**/*.hpp'
      - 'include/**/*.hxx'
      - 'tests/**/*.c'
      - 'tests/**/*.cc'
      - 'tests/**/*.cpp'
      - 'tests/**/*.cxx'
      - 'tests/**/*.h'
      - 'tests/**/*.hh'
      - 'tests/**/*.hpp'
      - 'tests/**/*.hxx'
      - 'benchmarks/**/*.c'
      - 'benchmarks/**/*.cc'
      - 'benchmarks/**/*.cpp'
      - 'benchmarks/**/*.cxx'
      - 'benchmarks/**/*.h'
      - 'benchmarks/**/*.hh'
      - 'benchmarks/**/*.hpp'
      - 'benchmarks/**/*.hxx'
      - 'tools/ci/**/*.py'
      - 'tools/ci/**/*.sh'
      - 'tools/ci/**/*.ps1'
      - 'tools/tests/**/*.py'
      - 'tools/tests/**/*.sh'
      - 'tools/tests/**/*.ps1'
      - '*.c'
      - '*.cc'
      - '*.cpp'
      - '*.hpp'
      - '*.h'
      - '*.cs'
      - '*.csproj'
      - 'tools/**/*.cs'
      - 'tools/**/*.csproj'
      - 'examples/**/*.cs'
      - 'examples/**/*.csproj'
      - '.github/workflows/security-codeql.yml'
      - '.github/codeql/codeql-config.yml'
  schedule:
    # Weekly full scan (security-and-quality) — Sunday 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      query_suite:
        description: 'CodeQL query suite to use'
        required: false
        default: 'security-extended'
        type: choice
        options:
          - security-extended
          - security-and-quality

permissions:
  contents: read
  security-events: write  # Required for SARIF uploads and Copilot Autofix
  actions: read           # Required to fetch workflow run info

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-default-setup:
    name: Detect CodeQL setup mode
    runs-on: ubuntu-latest
    outputs:
      advanced_allowed: ${{ steps.detect.outputs.advanced_allowed }}
    steps:
      - name: Detect repository CodeQL default setup
        id: detect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/code-scanning/default-setup"
          auth_header="$(printf 'Authoriz%s: ******' 'ation' "${GITHUB_TOKEN}")"
          http_code="$(
            curl -sS \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "${auth_header}" \
              -o /tmp/codeql-default-setup.json \
              -w "%{http_code}" \
              "${api_url}"
          )"

          case "${http_code}" in
            200)
              echo "advanced_allowed=false" >> "$GITHUB_OUTPUT"
              echo "Repository CodeQL default setup is enabled; skipping advanced CodeQL workflow jobs to avoid SARIF upload failures."
              ;;
            404)
              echo "advanced_allowed=true" >> "$GITHUB_OUTPUT"
              echo "Repository CodeQL default setup is not configured; running advanced CodeQL workflow jobs."
              ;;
            *)
              echo "::warning::Unable to determine CodeQL default setup state (HTTP ${http_code}); proceeding with advanced CodeQL workflow jobs."
              cat /tmp/codeql-default-setup.json || true
              echo "advanced_allowed=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  analyze:
    name: Analyze (c-cpp)
    needs: detect-default-setup
    if: needs.detect-default-setup.outputs.advanced_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # v7.0.1
        with:
          fetch-depth: 1

      - name: Install C++ build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config sccache \
            librocksdb-dev libgtest-dev libssl-dev zlib1g-dev libzstd-dev \
            libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \
            libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev \
            libvulkan-dev glslc \
            libboost-dev libboost-system-dev libboost-filesystem-dev \
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc \
            libpugixml-dev

      - name: Select query suite
        id: suite
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "queries=security-and-quality" >> "$GITHUB_OUTPUT"
            echo "CodeQL suite: security-and-quality (scheduled full scan)"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "queries=${{ inputs.query_suite }}" >> "$GITHUB_OUTPUT"
            echo "CodeQL suite: ${{ inputs.query_suite }} (manual dispatch)"
          else
            echo "queries=security-extended" >> "$GITHUB_OUTPUT"
            echo "CodeQL suite: security-extended (PR / push)"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          languages: c-cpp
          config-file: .github/codeql/codeql-config.yml
          queries: ${{ steps.suite.outputs.queries }}

      - name: Configure (community-release preset)
        run: |
          set -euo pipefail
          git config --file .git/config --remove-section submodule.plugins/private/themisdb_ethic_ai 2>/dev/null || true
          git config --file .git/config --remove-section submodule.plugins/private/themisdb_importer 2>/dev/null || true
          git config --file .git/config --remove-section submodule.plugins/private/themisdb_storage 2>/dev/null || true
          git config --file .git/config --remove-section submodule.plugins/private/themisdb_llm_wiki 2>/dev/null || true
          git config --file .git/config --remove-section submodule.plugins/private/themisdb_plugin_signer 2>/dev/null || true
          cmake --preset community-release -DCMAKE_BUILD_TYPE=RelWithDebInfo 2>&1 | tail -30

      - name: Build (manual cmake build for CodeQL extraction)
        # Use direct cmake --build instead of autobuild: autobuild re-invokes cmake
        # without the community-release preset, enabling HIP (hipcc detected) and
        # failing to compile rotary_embeddings_hip.cpp without the full ROCm SDK.
        # After codeql-action/init, the tracer environment is already active, so
        # compiler calls made by cmake --build are captured for CodeQL extraction.
        run: |
          cmake --build build-community-release --parallel "$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          category: "/language:c-cpp"
          output: codeql-results
          upload: never
          ram: 6144
          threads: 4

  analyze-csharp:
    name: Analyze (csharp)
    needs: detect-default-setup
    if: needs.detect-default-setup.outputs.advanced_allowed == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Select query suite
        id: suite
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "schedule") {
            "queries=security-and-quality" >> $env:GITHUB_OUTPUT
            Write-Host "CodeQL suite: security-and-quality (scheduled full scan)"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "queries=${{ inputs.query_suite }}" >> $env:GITHUB_OUTPUT
            Write-Host "CodeQL suite: ${{ inputs.query_suite }} (manual dispatch)"
          } else {
            "queries=security-extended" >> $env:GITHUB_OUTPUT
            Write-Host "CodeQL suite: security-extended (PR / push)"
          }
      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          languages: csharp
          config-file: .github/codeql/codeql-config.yml
          queries: ${{ steps.suite.outputs.queries }}

      - name: Autobuild C#
        uses: github/codeql-action/autobuild@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          category: "/language:csharp"
          output: codeql-results-csharp
          upload: never
          ram: 4096
          threads: 2

  analyze-rust:
    name: Analyze (rust)
    needs: detect-default-setup
    if: needs.detect-default-setup.outputs.advanced_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # v7.0.1
        with:
          fetch-depth: 1

      - name: Select query suite
        id: suite
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "queries=security-and-quality" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "queries=${{ inputs.query_suite }}" >> "$GITHUB_OUTPUT"
          else
            echo "queries=security-extended" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          languages: rust
          config-file: .github/codeql/codeql-config.yml
          queries: ${{ steps.suite.outputs.queries }}

      - name: Build Rust client
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cd clients/rust
          cargo build --release 2>&1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          category: "/language:rust"
          output: codeql-results-rust
          upload: never
          ram: 4096
          threads: 2
