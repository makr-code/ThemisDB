name: Schema Version Manager CI

# Validates SchemaVersionManager (v1.8.0) – schema versioning, change history,
# rollback, diff, migration script generation, dry-run validation, audit-log
# integration, and SchemaConstraints persistence.
#
# Acceptance criteria covered:
#   AC-1  createSchemaVersion() assigns monotonically increasing version numbers
#         starting at 1; gaps are not permitted.
#   AC-2  getCurrentVersion() returns TABLE_NOT_FOUND when no version has been
#         recorded; returns the highest recorded version otherwise.
#   AC-3  getChangeHistory() returns an empty list (not an error) when no history
#         exists; returns all recorded changes in ascending version order.
#   AC-4  rollbackToVersion() applies the historical schema snapshot via
#         SchemaManager and records the rollback as a new version entry so
#         history is preserved.
#   AC-5  diffVersions() reports added, removed, and modified columns between
#         any two versions.
#   AC-6  generateMigrationScript() produces correct ALTER TABLE DDL for
#         ADD COLUMN, DROP COLUMN, and ALTER COLUMN changes, including type
#         mapping and NOT NULL / DROP NOT NULL clauses.
#   AC-7  validateMigration() (dry-run) rejects empty name, no columns,
#         duplicate columns, and schemas identical to the current version;
#         never persists a version record.
#   AC-8  setAuditLog() integration: createSchemaVersion() and
#         rollbackToVersion() emit entries to SchemaAuditLog when one is
#         attached; no crash when audit_log_ is nullptr.
#   AC-9  Full lifecycle regression: forward migration across 5 versions,
#         multi-step rollback, audit log populated, validateMigration gates
#         lifecycle.
#   AC-10 SchemaConstraints persistence: NOT NULL / UNIQUE / CHECK / DEFAULT /
#         foreign key definitions survive RocksDB round-trip.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/metadata/schema_version_manager.h'
      - 'include/metadata/schema_constraints.h'
      - 'src/metadata/schema_version_manager.cpp'
      - 'src/metadata/schema_constraints.cpp'
      - 'tests/test_schema_version_manager.cpp'
      - 'tests/test_schema_version_dryrun.cpp'
      - 'tests/test_schema_migration_script.cpp'
      - 'tests/test_schema_migration_regression.cpp'
      - 'tests/test_schema_constraints.cpp'
      - 'tests/test_schema_constraints_persistence.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/schema-version-manager-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/metadata/schema_version_manager.h'
      - 'include/metadata/schema_constraints.h'
      - 'src/metadata/schema_version_manager.cpp'
      - 'src/metadata/schema_constraints.cpp'
      - 'tests/test_schema_version_manager.cpp'
      - 'tests/test_schema_version_dryrun.cpp'
      - 'tests/test_schema_migration_script.cpp'
      - 'tests/test_schema_migration_regression.cpp'
      - 'tests/test_schema_constraints.cpp'
      - 'tests/test_schema_constraints_persistence.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/schema-version-manager-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  schema-version-manager-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Schema version manager tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            librocksdb-dev
            libssl-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Build SchemaVersionManager tests
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_schema_version_manager_focused

      - name: Build dry-run / validateMigration tests
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_schema_version_dryrun_focused

      - name: Build migration script tests
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_schema_migration_script_focused

      - name: Build migration regression tests
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_schema_migration_regression_focused

      - name: Build SchemaConstraints tests
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_schema_constraints_focused

      - name: Build SchemaConstraints persistence tests
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_schema_constraints_persistence_focused

      - name: Run all Schema Versioning tests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R "SchemaVersionManagerFocusedTests|SchemaVersionDryRunFocusedTests|SchemaMigrationScriptFocusedTests|SchemaMigrationRegressionFocusedTests|SchemaConstraintsFocusedTests|SchemaConstraintsPersistenceFocusedTests" \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee schema_versioning_ctest.txt

      - name: Run tests via focused binaries
        run: |
          set -o pipefail
          cd build
          ./tests/test_schema_version_manager_focused \
            --gtest_output="xml:svm_gtest.xml" \
            2>&1 | tee svm_gtest_output.txt
          ./tests/test_schema_version_dryrun_focused \
            --gtest_output="xml:svm_dryrun_gtest.xml" \
            2>&1 | tee svm_dryrun_gtest_output.txt
          ./tests/test_schema_migration_script_focused \
            --gtest_output="xml:svm_migration_script_gtest.xml" \
            2>&1 | tee svm_migration_script_gtest_output.txt
          ./tests/test_schema_migration_regression_focused \
            --gtest_output="xml:svm_migration_regression_gtest.xml" \
            2>&1 | tee svm_migration_regression_gtest_output.txt
          ./tests/test_schema_constraints_focused \
            --gtest_output="xml:schema_constraints_gtest.xml" \
            2>&1 | tee schema_constraints_gtest_output.txt
          ./tests/test_schema_constraints_persistence_focused \
            --gtest_output="xml:schema_constraints_persistence_gtest.xml" \
            2>&1 | tee schema_constraints_persistence_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-version-manager-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/schema_versioning_ctest.txt
            build/svm_gtest.xml
            build/svm_gtest_output.txt
            build/svm_dryrun_gtest.xml
            build/svm_dryrun_gtest_output.txt
            build/svm_migration_script_gtest.xml
            build/svm_migration_script_gtest_output.txt
            build/svm_migration_regression_gtest.xml
            build/svm_migration_regression_gtest_output.txt
            build/schema_constraints_gtest.xml
            build/schema_constraints_gtest_output.txt
            build/schema_constraints_persistence_gtest.xml
            build/schema_constraints_persistence_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📋 Schema Version Manager CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test suites" >> "$GITHUB_STEP_SUMMARY"
          echo "- SchemaVersionManagerFocusedTests (21 tests): version numbering, history, rollback, diff, JSON, audit log" >> "$GITHUB_STEP_SUMMARY"
          echo "- SchemaVersionDryRunFocusedTests (9 tests): validateMigration edge cases, no-persist guarantee" >> "$GITHUB_STEP_SUMMARY"
          echo "- SchemaMigrationScriptFocusedTests (16 tests): ADD/DROP/ALTER COLUMN DDL, type mapping, NOT NULL" >> "$GITHUB_STEP_SUMMARY"
          echo "- SchemaMigrationRegressionFocusedTests (16 tests): 5-version lifecycle, rollback chains, audit log" >> "$GITHUB_STEP_SUMMARY"
          echo "- SchemaConstraintsFocusedTests (31 tests): NOT NULL / UNIQUE / CHECK / DEFAULT / FK enforcement" >> "$GITHUB_STEP_SUMMARY"
          echo "- SchemaConstraintsPersistenceFocusedTests (8 tests): RocksDB round-trip for constraint definitions" >> "$GITHUB_STEP_SUMMARY"

