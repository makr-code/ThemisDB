# maintenance-architecture-ci.yml
# Regenerates the ThemisDB architecture model (ARCHITECTURE.JSON + ARCHITECTURE.md)
# from repository knowledge sources and opens a PR when outputs change.
#
# Triggers:
#   - schedule: weekly, Monday 02:00 UTC
#   - workflow_dispatch: manual run at any time
#   - push to develop: when knowledge source files change
#
# Governance: WORKFLOW_REGISTRY.md — maintenance lane

name: "Maintenance: Architecture CI"

on:
  schedule:
    - cron: "0 2 * * 1"   # Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate outputs without pushing a branch or opening a PR"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - develop
    paths:
      - "ai_context/MODULES_AND_NAMESPACES.md"
      - "ai_context/ARCHITECTURE_CLASSIFICATION.md"
      - "ai_context/api_contracts/**"
      - "ROADMAP.md"
      - "FUTURE_ENHANCEMENTS.md"

concurrency:
  group: architecture-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [generate-architecture]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Architecture CI validation"
          job-results: ${{ toJSON(needs) }}

  generate-architecture:
    name: "Maintenance: Generate Architecture Model"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"

      - name: Run architecture generator
        id: generate
        run: |
          python tools/architecture-generator/generate_architecture.py

      - name: Validate generated outputs
        id: validation
        run: |
          python tools/architecture-generator/validate_architecture.py

      - name: Check for changes
        id: diff
        run: |
          git diff --name-only HEAD -- ARCHITECTURE.JSON ARCHITECTURE.md > /tmp/changed_files.txt
          cat /tmp/changed_files.txt
          if [ -s /tmp/changed_files.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              echo "::notice::Architecture outputs changed — would open PR (dry run)"
            else
              echo "::notice::Architecture outputs changed — will open PR"
            fi
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes in architecture outputs"
          fi

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: architecture-outputs-${{ github.run_id }}
          path: |
            ARCHITECTURE.JSON
            ARCHITECTURE.md
          retention-days: 30

      - name: Configure git identity
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or update PR branch
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        id: branch
        run: |
          BRANCH="chore/update-architecture-model-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add ARCHITECTURE.JSON ARCHITECTURE.md
          git commit -m "chore(architecture): regenerate architecture model [skip ci]

          Automated update from maintenance-architecture-ci workflow.
          Source: $(git rev-parse --short HEAD)
          Triggered by: ${{ github.event_name }}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base develop --state open \
            --json number,headRefName \
            --jq 'first(.[] | select(.headRefName | startswith("chore/update-architecture-model-")) | .number) // empty' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "::notice::Open architecture PR #$EXISTING already exists — skipping PR creation"
            exit 0
          fi
          gh pr create \
            --base develop \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "chore(architecture): regenerate architecture model" \
            --body "## Automated Architecture Model Update

          This PR was automatically generated by the \`maintenance-architecture-ci\` workflow.

          ### Changed files
          - \`ARCHITECTURE.JSON\` — machine-readable architecture model
          - \`ARCHITECTURE.md\` — Mermaid diagram and dependency tables

          ### Trigger
          Event: \`${{ github.event_name }}\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Review guidance
          - Verify the module list reflects the current \`ai_context/MODULES_AND_NAMESPACES.md\`
          - Verify relationships match intended architectural dependencies
          - The Mermaid diagram in \`ARCHITECTURE.md\` can be previewed in GitHub's Markdown renderer

          > Auto-generated — merge after review." \
            --label "maintenance,documentation" 2>/dev/null || \
          echo "::notice::PR could not be created (may need 'maintenance' label to exist)"

      - name: Write architecture run summary
        if: always()
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          {
            echo "## Architecture CI Summary"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Dry run: **${DRY_RUN}**"
            echo "- Validation: **${{ steps.validation.outcome || 'not run' }}**"
            echo "- Changed: **${{ steps.diff.outputs.changed || 'unknown' }}**"
            if [ "$DRY_RUN" = "true" ]; then
              echo "- External changes: **none** (branch push and pull request creation suppressed)"
              if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
                echo "- Planned action: open or update an architecture-model pull request"
              fi
            else
              echo "- Pull request branch: **${{ steps.branch.outputs.branch || 'not created' }}**"
            fi
            echo "- Diagnostic artifact: \`architecture-outputs-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
