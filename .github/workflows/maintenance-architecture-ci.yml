# maintenance-architecture-ci.yml
# Regenerates the ThemisDB architecture model (architecture.json + architecture.md)
# from repository knowledge sources and opens a PR when outputs change.
#
# Triggers:
#   - schedule: weekly, Monday 02:00 UTC
#   - workflow_dispatch: manual run at any time
#   - push to develop: when knowledge source files change
#
# Governance: WORKFLOW_REGISTRY.md — maintenance lane

name: maintenance-architecture-ci

on:
  schedule:
    - cron: "0 2 * * 1"   # Monday 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print outputs, do not commit)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - develop
    paths:
      - "ai_context/MODULES_AND_NAMESPACES.md"
      - "ai_context/ARCHITECTURE_CLASSIFICATION.md"
      - "ai_context/api_contracts/**"
      - "ai_context/developer_llm_wiki/**"
      - "ai_working/**"
      - "ARCHITECTURE.md"
      - "ROADMAP.md"
      - "FUTURE_ENHANCEMENTS.md"
      - "docs/**"

concurrency:
  group: architecture-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-architecture:
    name: Generate Architecture Model
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run architecture generator
        id: generate
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python tools/architecture-generator/generate_architecture.py --dry-run
          else
            python tools/architecture-generator/generate_architecture.py
          fi

      - name: Validate generated outputs
        if: github.event.inputs.dry_run != 'true'
        run: |
          python tools/architecture-generator/validate_architecture.py

      - name: Check for changes
        id: diff
        if: github.event.inputs.dry_run != 'true'
        run: |
          git diff --name-only HEAD -- architecture.json architecture.md > /tmp/changed_files.txt
          cat /tmp/changed_files.txt
          if [ -s /tmp/changed_files.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Architecture outputs changed — will open PR"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No changes in architecture outputs"
          fi

      - name: Upload artifacts (always)
        if: github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: architecture-outputs-${{ github.run_id }}
          path: |
            architecture.json
            architecture.md
          retention-days: 30

      - name: Configure git identity
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or update PR branch
        if: steps.diff.outputs.changed == 'true'
        id: branch
        run: |
          BRANCH="chore/update-architecture-model-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add architecture.json architecture.md
          git commit -m "chore(architecture): regenerate architecture model [skip ci]

          Automated update from maintenance-architecture-ci workflow.
          Source: $(git rev-parse --short HEAD)
          Triggered by: ${{ github.event_name }}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "chore(architecture): regenerate architecture model" \
            --body "## Automated Architecture Model Update

          This PR was automatically generated by the \`maintenance-architecture-ci\` workflow.

          ### Changed files
          - \`architecture.json\` — machine-readable architecture model
          - \`architecture.md\` — Mermaid diagram and dependency tables

          ### Trigger
          Event: \`${{ github.event_name }}\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Review guidance
          - Verify the module list reflects the current \`ai_context/MODULES_AND_NAMESPACES.md\`
          - Verify relationships match intended architectural dependencies
          - The Mermaid diagram in \`architecture.md\` can be previewed in GitHub's Markdown renderer

          > Auto-generated — merge after review." \
            --label "maintenance,documentation" 2>/dev/null || \
          echo "::notice::PR already exists or could not be created (may need 'maintenance' label to exist)"
