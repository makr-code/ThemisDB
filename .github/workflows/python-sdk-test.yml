name: Python SDK [Dry-Run]

# Python SDK build and test workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Package is built but NOT uploaded to PyPI

on:
  workflow_dispatch:

# Minimal permissions for security
permissions:
  contents: read
  pull-requests: write
  checks: write

defaults:
  run:
    working-directory: clients/python

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow tests and builds the Python SDK."
          echo "No packages are uploaded to PyPI."
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine

      - name: Run import test
        run: |
          python -c "from themis import ThemisClient, __version__; print(f'ThemisDB SDK version: {__version__}')"

      - name: Run tests
        run: |
          if [ "${ACT:-false}" = "true" ]; then
            echo "ACT detected - running import smoke test only"
            python -c "import themis; print('Import successful')"
            exit 0
          fi
          if [ -d "tests" ] && [ -n "$(ls -A tests/)" ]; then
            pytest tests/ -v --tb=short --junit-xml=test-results.xml
          else
            echo "No tests found, running import test only"
            python -c "import themis; print('Import successful')"
          fi
        continue-on-error: true
      
      - name: Upload Test Results
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: clients/python/test-results.xml
          retention-days: 30
      
      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: always() && env.ACT != 'true'
        with:
          name: 'Python SDK Tests (Python ${{ matrix.python-version }})'
          path: clients/python/test-results.xml
          reporter: java-junit
          fail-on-error: false
          working-directory: clients/python

      - name: Lint with ruff (if available)
        if: env.ACT != 'true'
        continue-on-error: true
        run: |
          pip install ruff || true
          if command -v ruff &> /dev/null; then
            ruff check themis/ || true
          fi

  build:
    name: Build Package (Dry-Run)
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
        working-directory: .

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Display package info (Dry-Run)
        run: |
          echo "## Python SDK Build Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Package NOT uploaded to PyPI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built packages:" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          ls -la dist/ >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package metadata:" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          python -m pip show -f themisdb-client 2>/dev/null || echo "Package info from source" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Add PYPI_API_TOKEN as a repository secret" >> $GITHUB_STEP_SUMMARY
          echo "2. Uncomment the twine upload step" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        if: env.ACT != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: clients/python/dist/
          retention-days: 7

      # TODO: Uncomment for production releases
      # - name: Publish to PyPI
      #   env:
      #     TWINE_USERNAME: __token__
      #     TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      #   run: twine upload dist/*