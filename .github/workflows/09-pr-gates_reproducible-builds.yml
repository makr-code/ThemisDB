name: Reproducible Build Metadata

on:
  pull_request:
    branches: [ "develop" ]
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/*
      - cmake/*/**
      - include/updates/*
      - include/updates/*/**
      - .github/workflows/09-pr-gates_reproducible-builds.yml
  push:
    branches: [ "develop" ]
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/*
      - cmake/*/**
      - include/updates/*
      - include/updates/*/**
      - .github/workflows/09-pr-gates_reproducible-builds.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-info-reproducibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive SOURCE_DATE_EPOCH from HEAD commit
        id: source_date_epoch
        shell: bash
        run: |
          echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Verify reproducible build metadata
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source_date_epoch.outputs.value }}
        run: |
          cmake -DOUTPUT_DIR="$RUNNER_TEMP/themis-repro" \
            -P cmake/VerifyReproducibleBuildInfo.cmake

      - name: Record generated header hashes
        shell: bash
        run: |
          sha256sum \
            "$RUNNER_TEMP/themis-repro/same-epoch-a/include/updates/build_info.h" \
            "$RUNNER_TEMP/themis-repro/same-epoch-b/include/updates/build_info.h" \
            "$RUNNER_TEMP/themis-repro/different-epoch/include/updates/build_info.h" \
            | tee "$RUNNER_TEMP/themis-repro/build_info.sha256"

      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-build-metadata-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/themis-repro/same-epoch-a/include/updates/build_info.h
            ${{ runner.temp }}/themis-repro/same-epoch-b/include/updates/build_info.h
            ${{ runner.temp }}/themis-repro/different-epoch/include/updates/build_info.h
            ${{ runner.temp }}/themis-repro/build_info.sha256
