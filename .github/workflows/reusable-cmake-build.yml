name: "Reusable: CMake Build Pipeline"

# Rechenaufwand-Score: R=5 (K=5, L=5, N=5) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Timeout note: 360 minutes to accommodate Windows vcpkg builds.
# Performance optimizations applied:
#   - sccache compiler caching (30-50% speedup): enabled via enable_sccache_gha input
#   - Windows release dependency preparation is opt-in; ThemisDB MSVC stays serial.
#   - vcpkg binary caching: GHA cache layer + vcpkg archives directory to skip redundant deps
#   - CMAKE_BUILD_PARALLEL_LEVEL environment variable honors platform constraints
# Combined expected improvement: 30-50% reduction in Windows build time vs baseline.
# See: https://github.com/makr-code/ThemisDB/issues/xxxx
on:
  workflow_call:
    inputs:
      windows_dependency_mode:
        description: "Opt-in Windows release lane: off, prepare (configure only), or consume (binary-only install)"
        required: false
        default: 'off'
        type: string
      dependency_cache_key:
        description: Source/configure/toolchain identity of the completed prerequisite snapshot
        required: false
        default: ''
        type: string
      dependency_artifact_id:
        description: Run artifact ID of the completed prerequisite snapshot for consume mode
        required: false
        default: ''
        type: string
      source_sha:
        description: Optional pinned source commit
        required: false
        default: ''
        type: string
      enable_sccache_gha:
        description: "Enable GitHub Actions-backed sccache for supported build lanes."
        required: false
        default: false
        type: boolean
      runs_on:
        description: "Runner label or labels used by the build job."
        required: false
        default: ubuntu-latest
        type: string
      shell:
        description: "Shell used to execute setup, configure, build, and validation commands."
        required: false
        default: bash
        type: string
      cache_arch:
        description: "Architecture identifier included in compiler-cache keys."
        required: false
        default: ''
        type: string
      cache_compiler:
        description: "Compiler identity included in compiler-cache keys."
        required: false
        default: ''
        type: string
      vcpkg_triplet:
        description: "vcpkg target triplet used for dependency installation and cache identity."
        required: false
        default: ''
        type: string
      fetch_depth:
        description: "Git checkout depth; zero fetches full history."
        required: false
        default: '0'
        type: string
      submodules:
        description: "Initialize Git submodules during checkout."
        required: false
        default: false
        type: boolean
      working_directory:
        description: "Repository-relative working directory for build commands."
        required: false
        default: .
        type: string
      setup_command:
        description: "Optional shell command to prepare the runner before configuration."
        required: false
        default: ''
        type: string
      configure_command:
        description: "Optional custom configure command; when set it replaces the default configure step."
        required: false
        default: ''
        type: string
      build_command:
        description: "Optional custom build command; when set it replaces the default build step."
        required: false
        default: ''
        type: string
      validation_command:
        description: "Optional custom validation command; when set it replaces default validation."
        required: false
        default: ''
        type: string
      build_mode:
        description: "Build behavior profile selected by the reusable workflow."
        required: false
        default: default
        type: string
      preset:
        description: "CMake configure preset used when no custom configure command is supplied."
        required: false
        default: ''
        type: string
      build_directory:
        description: "Actual CMake binary directory for custom configure commands; defaults to build-<preset>."
        required: false
        default: ''
        type: string
      configure_flags:
        description: "Additional CMake configure arguments appended to the selected preset."
        required: false
        default: ''
        type: string
      build_targets:
        description: "Space-separated CMake targets to build; empty uses the default target."
        required: false
        default: ''
        type: string
      validation_mode:
        description: "Validation strategy, such as none, ctest, or benchmark."
        required: false
        default: none
        type: string
      ctest_label_filter:
        description: "CTest label expression selecting validation tests."
        required: false
        default: ''
        type: string
      ctest_filter:
        description: "CTest test-name expression selecting validation tests."
        required: false
        default: ''
        type: string
      ctest_build_directory:
        description: CMake binary directory whose complete CTest inventory is reported
        required: false
        default: ''
        type: string
      ctest_junit_path:
        description: CTest JUnit output path for required full-run evidence
        required: false
        default: ''
        type: string
      ctest_summary_path:
        description: Path for the validated commit-linked CTest summary
        required: false
        default: ''
        type: string
      ctest_preset:
        description: Optional CTest preset used to define the complete evidence test inventory
        required: false
        default: ''
        type: string
      benchmark_filter:
        description: "Optional benchmark name filter passed to benchmark validation."
        required: false
        default: ''
        type: string
      build_continue_on_error:
        description: "Allow the build step to continue the job after a failure."
        required: false
        default: false
        type: boolean
      validation_continue_on_error:
        description: "Allow validation failures without failing the job."
        required: false
        default: false
        type: boolean
      artifact_name:
        description: "Optional name for the primary uploaded build artifact."
        required: false
        default: ''
        type: string
      artifact_paths:
        description: "Newline-separated paths included in the primary artifact."
        required: false
        default: ''
        type: string
      artifact_name_secondary:
        description: "Optional name for a second uploaded build artifact."
        required: false
        default: ''
        type: string
      artifact_paths_secondary:
        description: "Newline-separated paths included in the secondary artifact."
        required: false
        default: ''
        type: string
      artifact_retention_days:
        description: "Retention period in days for the primary artifact."
        required: false
        default: '30'
        type: string
      artifact_retention_days_secondary:
        description: "Retention period in days for the secondary artifact."
        required: false
        default: '30'
        type: string
      summary_title:
        description: "Title shown in the build job's GitHub Actions summary."
        required: false
        default: CMake Build
        type: string
      timeout_minutes:
        description: "Maximum runtime for the build job in minutes."
        required: false
        default: '360'
        type: string
    secrets:
      THEMIS_HYPERSCALER_LICENSE_B64:
        required: false
      THEMIS_BUILD_SIG:
        required: false
    outputs:
      dependency-artifact-id:
        description: Persisted preparation artifact (only emitted after successful configure and upload)
        value: ${{ jobs.build.outputs.dependency-artifact-id }}
      dependency-cache-key:
        description: Preparation snapshot identity (only emitted after successful configure and upload)
        value: ${{ jobs.build.outputs.dependency-cache-key }}
      configure-outcome:
        description: Outcome of Configure step (success|failure|skipped)
        value: ${{ jobs.build.outputs.configure-outcome }}
      build-outcome:
        description: Outcome of Build step (success|failure|skipped)
        value: ${{ jobs.build.outputs.build-outcome }}
      validation-outcome:
        description: Outcome of Validation step (success|failure|skipped)
        value: ${{ jobs.build.outputs.validation-outcome }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}-${{ inputs.runs_on }}-${{ inputs.summary_title }}
  cancel-in-progress: false

jobs:
  build:
    name: "Reusable: ${{ inputs.summary_title }}"
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      PYTHONIOENCODING: utf-8
      SCCACHE_GHA_ENABLED: ${{ inputs.enable_sccache_gha }}
      THEMIS_CACHE_TOOLS_PREFIX: ${{ inputs.source_sha != '' && '.ci-cache-tools/' || '' }}
    outputs:
      dependency-artifact-id: ${{ steps.dependency_upload.outputs.artifact-id }}
      dependency-cache-key: ${{ steps.dependency_complete.outputs.cache_key }}
      configure-outcome: ${{ steps.configure.outcome }}
      build-outcome: ${{ steps.build.outcome }}
      validation-outcome: ${{ steps.validation.outcome || 'skipped' }}

    steps:
      - name: Validate dependency mode and start job budget
        shell: bash
        env:
          DEPENDENCY_MODE: ${{ inputs.windows_dependency_mode }}
          DEPENDENCY_CACHE_KEY: ${{ inputs.dependency_cache_key }}
          DEPENDENCY_ARTIFACT_ID: ${{ inputs.dependency_artifact_id }}
        run: |
          set -euo pipefail
          case "$DEPENDENCY_MODE" in
            off) ;;
            prepare|consume)
              test "$RUNNER_OS" = Windows
              if [ "$DEPENDENCY_MODE" = consume ]; then
                test -n "$DEPENDENCY_CACHE_KEY" || { echo "::error::Windows dependency prerequisite incomplete"; exit 1; }
                test -n "$DEPENDENCY_ARTIFACT_ID" || { echo "::error::Windows dependency artifact unavailable"; exit 1; }
              fi
              python -c 'import os,time; print("THEMIS_DEPENDENCY_DEADLINE="+str(time.time()+300*60))' >> "$GITHUB_ENV"
              ;;
            *) echo "::error::Unsupported Windows dependency mode"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          ref: ${{ inputs.source_sha || github.sha }}
          submodules: ${{ inputs.submodules }}

      - name: Checkout cache tooling for pinned release sources
        if: inputs.source_sha != ''
        uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-cache-tools
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/cache-directory-fingerprint.sh
            scripts/prepare-windows-dependencies.py
            triplets/x64-windows.cmake
          sparse-checkout-cone-mode: false

      - name: Setup MSVC environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Initialize compiler and dependency cache environment
        # Cache scope is intentionally segmented by runner OS + arch + compiler + vcpkg triplet
        # and manifest/config hash so Windows/Linux/ARM/Docker lanes cannot silently reuse each
        # other's VCPKG and compiler artifacts.
        shell: bash
        env:
          DEPENDENCY_CONFIGURE_SIGNATURE: ${{ inputs.build_mode }}-${{ inputs.preset }}-${{ inputs.configure_flags }}-${{ inputs.configure_command }}
        run: |
          set -euo pipefail
          sanitize() {
            printf '%s' "$1" | tr ':/ ' '__' | tr -cd 'A-Za-z0-9_.-'
          }

          runner_arch="${{ inputs.cache_arch }}"
          if [ -z "${runner_arch}" ]; then
            runner_arch="${{ runner.arch }}"
          fi
          toolchain_name="${{ inputs.cache_compiler }}"
          if [ -z "${toolchain_name}" ]; then
            if [ "${{ runner.os }}" = "Windows" ]; then
              toolchain_name="msvc"
            elif command -v gcc >/dev/null 2>&1; then
              toolchain_name="gcc"
            elif command -v clang >/dev/null 2>&1; then
              toolchain_name="clang"
            elif command -v cl >/dev/null 2>&1; then
              toolchain_name="msvc"
            else
              toolchain_name="toolchain"
            fi
          fi
          triplet_name="${{ inputs.vcpkg_triplet }}"
          if [ -z "${triplet_name}" ]; then
            triplet_name="${{ runner.os }}-${runner_arch}"
          fi
          cache_tag="$(sanitize "${{ runner.os }}-${runner_arch}-${toolchain_name}-${triplet_name}")"
          cache_scope="$(sanitize "${{ runner.os }}-${runner_arch}-${toolchain_name}-${triplet_name}")"
          if [ "${{ inputs.windows_dependency_mode }}" != off ]; then
            # Do not restore older build-tree/compiler snapshots into this lane.
            cache_tag="${cache_tag}-release-deps-v2"
            dependency_configure_hash="$(printf '%s' "$DEPENDENCY_CONFIGURE_SIGNATURE" | sha256sum | cut -d' ' -f1)"
            echo "THEMIS_DEPENDENCY_SOURCE=-$(git rev-parse HEAD)-${dependency_configure_hash}" >> "$GITHUB_ENV"
          fi
          sccache_dir="${GITHUB_WORKSPACE}/.cache/sccache-${cache_tag}"
          vcpkg_cache_dir="${GITHUB_WORKSPACE}/.cache/vcpkg-binary/${cache_tag}"
          vcpkg_downloads_dir="${GITHUB_WORKSPACE}/.cache/vcpkg-downloads/${cache_tag}"

          compiler_version=""
          case "$toolchain_name" in
            msvc)
              if [ -z "${VCToolsVersion:-}" ]; then
                echo "::error::MSVC toolset version unavailable after environment setup"
                exit 1
              fi
              compiler_version="msvc-${VCToolsVersion}"
              ;;
            gcc)
              compiler_version="gcc-$(gcc -dumpfullversion -dumpversion)"
              ;;
            clang)
              compiler_version="$(clang --version)"
              compiler_version="${compiler_version%%$'\n'*}"
              ;;
            *)
              compiler_version="$toolchain_name"
              ;;
          esac
          vcpkg_revision="$(git ls-tree HEAD -- vcpkg | awk '$1 == "160000" {print $3}')"

          cache_signature="${{ inputs.build_mode }}-${{ inputs.preset }}-${{ inputs.vcpkg_triplet }}-${{ inputs.cache_compiler }}-${{ inputs.configure_flags }}"
          cache_signature="$(printf '%s' "${cache_signature}" | tr ':/ ' '__' | tr -cd 'A-Za-z0-9_.-')"

          # Keep the build-tree cache stable across equivalent same-lane configure variants.
          # The full configure-signature is still recorded for diagnostics, but the restore key
          # should prioritize the actual lane fingerprint rather than the volatile flag string so
          # GitHub Actions can hit the cache for repeated rebuilds on the same platform/toolchain.
          mkdir -p "${sccache_dir}"
          mkdir -p "${vcpkg_downloads_dir}"
          mkdir -p "${vcpkg_cache_dir}"
          if [ "${{ runner.os }}" = Windows ] && [ "${{ inputs.windows_dependency_mode }}" != off ]; then
            # vcpkg is a native executable, not an MSYS program.
            sccache_dir="$(cygpath -m "$sccache_dir")"
            vcpkg_cache_dir="$(cygpath -m "$vcpkg_cache_dir")"
            vcpkg_downloads_dir="$(cygpath -m "$vcpkg_downloads_dir")"
          fi
          vcpkg_binary_sources="clear;files,${vcpkg_cache_dir},readwrite"
          {
            echo "THEMIS_CACHE_TAG=${cache_tag}"
            echo "THEMIS_SCCACHE_DIR=${sccache_dir}"
            echo "THEMIS_VCPKG_CACHE_DIR=${vcpkg_cache_dir}"
            echo "THEMIS_VCPKG_DOWNLOADS_DIR=${vcpkg_downloads_dir}"
            echo "SCCACHE_DIR=${sccache_dir}"
            echo "SCCACHE_CACHE_SIZE=8G"
            echo "VCPKG_DEFAULT_BINARY_CACHE=${vcpkg_cache_dir}"
            echo "VCPKG_BINARY_SOURCES=${vcpkg_binary_sources}"
            echo "VCPKG_DOWNLOADS=${vcpkg_downloads_dir}"
            echo "VCPKG_DOWNLOADS_ROOT=${vcpkg_downloads_dir}"
            echo "VCPKG_FORCE_SYSTEM_BINARIES=true"
            echo "THEMIS_COMPILER_VERSION=$(printf '%s' "${compiler_version:-toolchain}" | tr ' ' '_' | tr -cd 'A-Za-z0-9_.-')"
            echo "THEMIS_VCPKG_REVISION=${vcpkg_revision}"
            echo "THEMIS_CACHE_SCOPE=${cache_scope}"
            echo "THEMIS_CACHE_SIGNATURE=${cache_signature}"
          } >> "$GITHUB_ENV"

      - name: Restore CMake build caches
        id: restore_cmake_cache
        if: inputs.windows_dependency_mode != 'consume'
        timeout-minutes: ${{ inputs.windows_dependency_mode != 'off' && 15 || 360 }}
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.THEMIS_SCCACHE_DIR }}
            ${{ env.THEMIS_VCPKG_DOWNLOADS_DIR }}
            ${{ env.THEMIS_VCPKG_CACHE_DIR }}
          key: ${{ inputs.dependency_cache_key || format('cmake-cache-{0}-{1}-{2}-{3}-{4}{5}-snapshot-{6}-{7}{8}', runner.os, env.THEMIS_CACHE_TAG, hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**'), env.THEMIS_VCPKG_REVISION, env.THEMIS_COMPILER_VERSION, env.THEMIS_DEPENDENCY_SOURCE, github.run_id, github.run_attempt, inputs.windows_dependency_mode != 'off' && '-prepare' || '') }}
          restore-keys: |
            ${{ inputs.windows_dependency_mode != 'consume' && format('cmake-cache-{0}-{1}-', runner.os, env.THEMIS_CACHE_TAG) || '' }}
          enableCrossOsArchive: false

      - name: Download completed Windows dependency snapshot
        if: inputs.windows_dependency_mode == 'consume'
        timeout-minutes: 30
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ inputs.dependency_artifact_id }}
          path: ${{ runner.temp }}/windows-dependencies
          merge-multiple: true

      - name: Restore completed Windows dependency snapshot
        if: inputs.windows_dependency_mode == 'consume'
        shell: bash
        env:
          DEPENDENCY_CACHE_KEY: ${{ inputs.dependency_cache_key }}
          CACHE_EXPECTED_PREFIX: ${{ format('cmake-cache-{0}-{1}-{2}-{3}-{4}{5}-snapshot-', runner.os, env.THEMIS_CACHE_TAG, hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**', 'triplets/**'), env.THEMIS_VCPKG_REVISION, env.THEMIS_COMPILER_VERSION, env.THEMIS_DEPENDENCY_SOURCE) }}
        run: |
          set -euo pipefail
          case "$DEPENDENCY_CACHE_KEY" in
            "$CACHE_EXPECTED_PREFIX"*) ;;
            *) echo "::error::Dependency snapshot source/configure/toolchain identity mismatch"; exit 1 ;;
          esac
          cache_dir="$(cygpath -u "$GITHUB_WORKSPACE")/.cache"
          mkdir -p "$cache_dir"
          cd "$RUNNER_TEMP/windows-dependencies"
          tar -xf windows-dependencies.tar -C "$cache_dir"
          echo "THEMIS_WINDOWS_DEPENDENCY_FLAGS=-DVCPKG_INSTALL_OPTIONS=--only-binarycaching" >> "$GITHUB_ENV"

      - name: Record restored cache inventory
        id: cache_before
        shell: bash
        run: |
          fingerprint="$(bash "${THEMIS_CACHE_TOOLS_PREFIX}.github/scripts/cache-directory-fingerprint.sh" "$THEMIS_SCCACHE_DIR" "$THEMIS_VCPKG_DOWNLOADS_DIR" "$THEMIS_VCPKG_CACHE_DIR")"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Print initial cache hit state
        if: inputs.windows_dependency_mode != 'consume'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore_cmake_cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore_cmake_cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = true ]; then
            echo "dependency cache state: exact-match"
          elif [ -n "$CACHE_MATCHED_KEY" ]; then
            echo "dependency cache state: prefix-restored"
          else
            echo "dependency cache state: no-cache"
          fi
          echo "dependency cache matched key: $CACHE_MATCHED_KEY"

      - name: Print vcpkg cache resolution
        shell: bash
        run: |
          set -euo pipefail
          echo "vcpkg binary cache: ${VCPKG_DEFAULT_BINARY_CACHE:-<unset>}"
          echo "vcpkg binary sources: ${VCPKG_BINARY_SOURCES:-<unset>}"
          echo "vcpkg downloads: ${VCPKG_DOWNLOADS:-<unset>}"
          archive_count="$(find "${VCPKG_DEFAULT_BINARY_CACHE}" -type f -iname '*.zip' 2>/dev/null | wc -l)"
          echo "vcpkg binary archives restored: ${archive_count}"
          du -sh "${VCPKG_DEFAULT_BINARY_CACHE}" "${VCPKG_DOWNLOADS}" 2>/dev/null || true

      - name: Configure sccache environment
        if: inputs.enable_sccache_gha
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "SCCACHE_GHA_ENABLED=true"
            echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
            echo "SCCACHE_ERROR_WHEN_DISCONNECTED=false"
          } >> "$GITHUB_ENV"

      - name: Install sccache
        if: inputs.enable_sccache_gha && !(runner.os == 'Windows' && inputs.windows_dependency_mode != 'off')
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Setup
        if: inputs.setup_command != ''
        timeout-minutes: ${{ inputs.windows_dependency_mode != 'off' && 20 || 360 }}
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          SETUP_COMMAND: ${{ inputs.setup_command }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          cd "$WORKING_DIRECTORY"
          script_path="$RUNNER_TEMP/cmake-build-setup.sh"
          printf '%s\n' "$SETUP_COMMAND" > "$script_path"
          bash "$script_path"

      - name: Ensure Ninja binary is discoverable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -x /usr/bin/ninja ] || ! /usr/bin/ninja --version >/dev/null 2>&1; then
            echo "System Ninja is missing or unusable; installing ninja-build."
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ninja-build
          fi

          publish_ninja() {
            # CMake does not initialize CMAKE_MAKE_PROGRAM from the environment.
            # Publish only Ninja on PATH so nested vcpkg configures use it too.
            ninja_dir="${RUNNER_TEMP}/themis-ninja"
            mkdir -p "${ninja_dir}"
            ln -sf "$1" "${ninja_dir}/ninja"
            echo "${ninja_dir}" >> "$GITHUB_PATH"
            echo "CMAKE_MAKE_PROGRAM=${ninja_dir}/ninja" >> "$GITHUB_ENV"
          }

          if [ -x /usr/bin/ninja ] && /usr/bin/ninja --version >/dev/null 2>&1; then
            ninja_path="/usr/bin/ninja"
            echo "Using system Ninja at: /usr/bin/ninja"
            publish_ninja /usr/bin/ninja
            exit 0
          fi
          if command -v ninja >/dev/null 2>&1 && ninja --version >/dev/null 2>&1; then
            ninja_path="$(command -v ninja)"
            echo "Ninja already available at: ${ninja_path}"
            publish_ninja "${ninja_path}"
            exit 0
          fi
          if command -v ninja-build >/dev/null 2>&1 && ninja-build --version >/dev/null 2>&1; then
            ninja_path="$(command -v ninja-build)"
            echo "Using ninja-build binary at: ${ninja_path}"
            publish_ninja "${ninja_path}"
            exit 0
          fi

          # Expose only Ninja so other runner tool versions keep their PATH precedence.
          ninja_dir="${RUNNER_TEMP}/cmake-ninja"
          mkdir -p "$ninja_dir"
          ln -sf "$ninja_path" "$ninja_dir/ninja"
          echo "$ninja_dir" >> "$GITHUB_PATH"

      - name: Ensure vcpkg baseline commit is available
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [ ! -f "vcpkg.json" ] || [ ! -e "vcpkg/.git" ]; then
            exit 0
          fi

          BASELINE_COMMIT="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("vcpkg.json").read_text(encoding="utf-8")).get("builtin-baseline", ""))')"

          if [ -z "${BASELINE_COMMIT}" ]; then
            BASELINE_COMMIT="$(git -C vcpkg rev-parse HEAD)"
            OVERRIDE_DIR="${RUNNER_TEMP}/vcpkg-manifest-override"
            python scripts/create_vcpkg_manifest_override.py \
              --working-directory "$WORKING_DIRECTORY" \
              --override-dir "$OVERRIDE_DIR" \
              --baseline "${BASELINE_COMMIT}"
            echo "VCPKG_MANIFEST_DIR=${OVERRIDE_DIR}" >> "$GITHUB_ENV"
            echo "Injected workflow-local vcpkg manifest override with builtin-baseline ${BASELINE_COMMIT}"
          fi

          if ! git -C vcpkg cat-file -e "${BASELINE_COMMIT}^{commit}" 2>/dev/null; then
            echo "Fetching missing vcpkg builtin-baseline commit: ${BASELINE_COMMIT}"
            if git -C vcpkg rev-parse --is-shallow-repository | grep -qi '^true$'; then
              git -C vcpkg fetch --unshallow origin
            else
              git -C vcpkg fetch origin master
            fi
            git -C vcpkg cat-file -e "${BASELINE_COMMIT}^{commit}"
          fi

      - name: Resolve build line defaults
        id: resolve_mode
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          PRESET: ${{ inputs.preset }}
          BUILD_DIRECTORY: ${{ inputs.build_directory }}
          CONFIGURE_FLAGS: ${{ inputs.configure_flags }}
          BUILD_TARGETS: ${{ inputs.build_targets }}
          VALIDATION_MODE: ${{ inputs.validation_mode }}
          CTEST_LABEL_FILTER: ${{ inputs.ctest_label_filter }}
          CTEST_FILTER: ${{ inputs.ctest_filter }}
          BENCHMARK_FILTER: ${{ inputs.benchmark_filter }}
          CONFIGURE_COMMAND: ${{ inputs.configure_command }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          VALIDATION_COMMAND: ${{ inputs.validation_command }}
        run: |
          set -euo pipefail
          PRESET_NAME="${PRESET:-default}"
          BUILD_DIR="${BUILD_DIRECTORY:-build-${PRESET_NAME}}"
          case "$BUILD_MODE" in
            tests)
              if [ -z "$CONFIGURE_COMMAND" ]; then
                CONFIGURE_COMMAND="cmake -S . -B ${BUILD_DIR} -G Ninja -DTHEMIS_BUILD_TESTS=ON -DTHEMIS_BUILD_BENCHMARKS=OFF ${CONFIGURE_FLAGS}"
              fi
              if [ -z "$BUILD_COMMAND" ]; then
                if [ -n "$BUILD_TARGETS" ]; then
                  BUILD_COMMAND="cmake --build ${BUILD_DIR} --target ${BUILD_TARGETS} --parallel 16"
                else
                  BUILD_COMMAND="cmake --build ${BUILD_DIR} --parallel 16"
                fi
              fi
              # Validation is intentionally deferred to the outer gate workflows.
              # The reusable build acts as the shared build engine only; log triage
              # and issue creation remain the responsibility of the ctest/benchmark gate.
              if [ -z "$VALIDATION_COMMAND" ] && [ "$VALIDATION_MODE" != "none" ] && [ "$VALIDATION_MODE" != "auto" ]; then
                if [ -n "$CTEST_LABEL_FILTER" ]; then
                  VALIDATION_COMMAND="ctest --test-dir ${BUILD_DIR} --output-on-failure -j 1 --timeout 60 --label-regex '${CTEST_LABEL_FILTER}'"
                elif [ -n "$CTEST_FILTER" ]; then
                  VALIDATION_COMMAND="ctest --test-dir ${BUILD_DIR} --output-on-failure -j 1 --timeout 60 --tests-regex '${CTEST_FILTER}'"
                else
                  VALIDATION_COMMAND="ctest --test-dir ${BUILD_DIR} --output-on-failure -j 1 --timeout 60"
                fi
              fi
              if [ -z "$VALIDATION_COMMAND" ]; then
                VALIDATION_COMMAND=""
              fi
              ;;
            benchmarks)
              if [ -z "$CONFIGURE_COMMAND" ]; then
                CONFIGURE_COMMAND="cmake -S . -B ${BUILD_DIR} -G Ninja -DTHEMIS_BUILD_TESTS=OFF -DTHEMIS_BUILD_BENCHMARKS=ON ${CONFIGURE_FLAGS}"
              fi
              if [ -z "$BUILD_COMMAND" ]; then
                if [ -n "$BUILD_TARGETS" ]; then
                  BUILD_COMMAND="cmake --build ${BUILD_DIR} --target ${BUILD_TARGETS} --parallel 16"
                else
                  BUILD_COMMAND="cmake --build ${BUILD_DIR} --parallel 16"
                fi
              fi
              if [ -z "$VALIDATION_COMMAND" ] && [ "$VALIDATION_MODE" != "none" ] && [ "$VALIDATION_MODE" != "auto" ]; then
                if [ -n "$BENCHMARK_FILTER" ]; then
                  VALIDATION_COMMAND="ctest --test-dir ${BUILD_DIR} --output-on-failure -j 1 --timeout 60 --tests-regex '${BENCHMARK_FILTER}'"
                else
                  VALIDATION_COMMAND="ctest --test-dir ${BUILD_DIR} --output-on-failure -j 1 --timeout 60"
                fi
              fi
              if [ -z "$VALIDATION_COMMAND" ]; then
                VALIDATION_COMMAND=""
              fi
              ;;
            *)
              if [ -z "$CONFIGURE_COMMAND" ]; then
                CONFIGURE_COMMAND="cmake -S . -B ${BUILD_DIR} -G Ninja ${CONFIGURE_FLAGS}"
              fi
              if [ -z "$BUILD_COMMAND" ]; then
                BUILD_COMMAND="cmake --build ${BUILD_DIR} --parallel 16"
              fi
              if [ -z "$VALIDATION_COMMAND" ]; then
                VALIDATION_COMMAND=""
              fi
              ;;
          esac
          {
            echo "resolved_configure_command<<__HEREDOC__"
            printf '%s\n' "${CONFIGURE_COMMAND}"
            echo "__HEREDOC__"
            echo "resolved_build_command<<__HEREDOC__"
            printf '%s\n' "${BUILD_COMMAND}"
            echo "__HEREDOC__"
            echo "resolved_validation_command<<__HEREDOC__"
            printf '%s\n' "${VALIDATION_COMMAND}"
            echo "__HEREDOC__"
            echo "resolved_build_mode=${BUILD_MODE}"
            echo "resolved_build_dir=${BUILD_DIR}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore CMake build directory cache
        id: restore_build_dir_cache
        if: ${{ inputs.windows_dependency_mode == 'off' && steps.resolve_mode.outputs.resolved_build_dir != '' }}
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.resolve_mode.outputs.resolved_build_dir }}/CMakeCache.txt
            ${{ steps.resolve_mode.outputs.resolved_build_dir }}/CMakeFiles
            ${{ steps.resolve_mode.outputs.resolved_build_dir }}/build.ninja
            ${{ steps.resolve_mode.outputs.resolved_build_dir }}/compile_commands.json
            ${{ steps.resolve_mode.outputs.resolved_build_dir }}/.ninja_deps
            ${{ steps.resolve_mode.outputs.resolved_build_dir }}/.ninja_log
          key: cmake-build-tree-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_compiler || 'default' }}-${{ inputs.vcpkg_triplet || 'default' }}-${{ steps.resolve_mode.outputs.resolved_build_mode }}-${{ steps.resolve_mode.outputs.resolved_build_dir }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'vcpkg.json', 'vcpkg-configuration.json', 'cmake/**/*.cmake', 'cmake/**/*.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            cmake-build-tree-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_compiler || 'default' }}-${{ inputs.vcpkg_triplet || 'default' }}-${{ steps.resolve_mode.outputs.resolved_build_mode }}-${{ steps.resolve_mode.outputs.resolved_build_dir }}-
            cmake-build-tree-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_compiler || 'default' }}-${{ inputs.vcpkg_triplet || 'default' }}-${{ steps.resolve_mode.outputs.resolved_build_mode }}-
            cmake-build-tree-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache_compiler || 'default' }}-${{ inputs.vcpkg_triplet || 'default' }}-
          enableCrossOsArchive: false

      - name: Ensure vcpkg archive cache is available when build caches miss
        if: ${{ steps.restore_build_dir_cache.outputs.cache-hit != 'true' && steps.restore_cmake_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "No matching build-tree/dependency cache hit; retaining the vcpkg binary archive cache for dependency restore."
          mkdir -p "${GITHUB_WORKSPACE}/.cache/vcpkg-binary" "${GITHUB_WORKSPACE}/.cache/vcpkg-downloads"

      - name: Prepare Windows dependencies with bounded configure
        id: dependency_prepare
        if: inputs.windows_dependency_mode == 'prepare'
        timeout-minutes: 305
        shell: bash
        env:
          CONFIGURE_COMMAND: ${{ steps.resolve_mode.outputs.resolved_configure_command }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          set -euo pipefail
          cd "${{ inputs.working_directory }}"
          THEMIS_DEPENDENCY_BASH="$(cygpath -w "$BASH")"
          export THEMIS_DEPENDENCY_BASH
          python "${GITHUB_WORKSPACE}/${THEMIS_CACHE_TOOLS_PREFIX}scripts/prepare-windows-dependencies.py" --log "$RUNNER_TEMP/cmake-build-configure-output.log"

      - name: Save dependency snapshot before ThemisDB compile
        id: dependency_save
        if: ${{ !cancelled() && inputs.windows_dependency_mode == 'prepare' && (steps.dependency_prepare.outcome == 'success' || steps.dependency_prepare.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 30
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.THEMIS_SCCACHE_DIR }}
            ${{ env.THEMIS_VCPKG_DOWNLOADS_DIR }}
            ${{ env.THEMIS_VCPKG_CACHE_DIR }}
          key: ${{ steps.restore_cmake_cache.outputs.cache-primary-key }}
          enableCrossOsArchive: false

      - name: Archive completed Windows dependency snapshot
        if: inputs.windows_dependency_mode == 'prepare' && steps.dependency_prepare.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$(cygpath -u "$GITHUB_WORKSPACE")/.cache"
          cd "$RUNNER_TEMP"
          tar -cf windows-dependencies.tar -C "$cache_dir" \
            "sccache-${THEMIS_CACHE_TAG}" \
            "vcpkg-downloads/${THEMIS_CACHE_TAG}" \
            "vcpkg-binary/${THEMIS_CACHE_TAG}"

      - name: Upload completed Windows dependency snapshot
        id: dependency_upload
        if: inputs.windows_dependency_mode == 'prepare' && steps.dependency_prepare.outcome == 'success'
        timeout-minutes: 30
        uses: actions/upload-artifact@v5
        with:
          name: windows-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-dependencies.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Confirm completed dependency snapshot
        id: dependency_complete
        if: inputs.windows_dependency_mode == 'prepare' && steps.dependency_prepare.outcome == 'success' && steps.dependency_upload.outcome == 'success'
        shell: bash
        run: |
          echo "cache_key=${{ steps.restore_cmake_cache.outputs.cache-primary-key }}" >> "$GITHUB_OUTPUT"

      - name: Seed ARM64 Thrift source cache
        if: runner.os == 'Linux' && runner.arch == 'ARM64' && inputs.vcpkg_triplet == 'arm64-linux' && inputs.windows_dependency_mode != 'prepare'
        shell: bash
        run: |
          set -euo pipefail
          archive="${VCPKG_DOWNLOADS}/thrift-0.25.0.tar.gz"
          sha512="0570486bd6e4aa95a2eb329ad01a867a7999f7a936248e8fa3312a2dd20e247b7677d58f84a8e05e82de6bbb09647da2fe0e6aa720e825468e9f9b479831e76a"
          if [ -f "$archive" ] && echo "$sha512  $archive" | sha512sum --check --status; then
            echo "Verified Thrift source already cached."
            exit 0
          fi
          tmp="$(mktemp "${VCPKG_DOWNLOADS}/.thrift-0.25.0.XXXXXX")"
          trap 'rm -f "$tmp"' EXIT
          if curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --retry-max-time 120 --connect-timeout 15 --max-time 120 \
              --output "$tmp" "https://dlcdn.apache.org/thrift/0.25.0/thrift-0.25.0.tar.gz" \
              && echo "$sha512  $tmp" | sha512sum --check --status; then
            mv -f "$tmp" "$archive"
            echo "Verified Thrift source downloaded from Apache mirror."
          else
            echo "::warning::Could not obtain a verified Thrift source from the Apache mirror; vcpkg will use its configured source."
          fi

      - name: Configure
        id: configure
        if: inputs.windows_dependency_mode != 'prepare'
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          CONFIGURE_COMMAND: ${{ steps.resolve_mode.outputs.resolved_configure_command }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          echo "Reusing any existing CMake cache state when available; build directory cache is restored above."
          if [ -n "${{ steps.resolve_mode.outputs.resolved_build_dir }}" ] && [ -d "${{ steps.resolve_mode.outputs.resolved_build_dir }}" ]; then
            echo "Existing build dir detected: ${{ steps.resolve_mode.outputs.resolved_build_dir }}"
            find "${{ steps.resolve_mode.outputs.resolved_build_dir }}" -mindepth 1 -maxdepth 1 -printf '%M %u %g %s %TY-%Tm-%Td %TH:%TM %f\n' | head -n 20 || true
          fi
          script_path="$RUNNER_TEMP/cmake-build-configure.sh"
          configure_output_log="$RUNNER_TEMP/cmake-build-configure-output.log"
          configure_attempt_log="$RUNNER_TEMP/cmake-build-configure-attempt.log"
          configure_started="$RUNNER_TEMP/cmake-build-configure-start"
          printf '%s\n' "$CONFIGURE_COMMAND" > "$script_path"
          : > "$configure_output_log"
          touch "$configure_started"
          for delay in 10 30 60 0; do
            : > "$configure_attempt_log"
            set +e
            set +o pipefail
            bash "$script_path" 2>&1 | tee -a "$configure_output_log" "$configure_attempt_log"
            status=${PIPESTATUS[0]}
            set -o pipefail
            set -e
            if [ "$status" -eq 0 ] || [ "$delay" -eq 0 ]; then
              break
            fi
            if grep -Eq 'Download timed out|error: curl operation failed with error code 35 \(SSL connect error\)|error: curl operation failed with response code 5[0-9][0-9]' "$configure_attempt_log"; then
              echo "::warning::Transient vcpkg download failure detected during configure; retrying in ${delay}s."
              sleep "$delay"
            elif [ "$delay" -eq 10 ] && [ "${RUNNER_ARCH:-}" = "ARM64" ] && grep -Eq "building .* failed with: BUILD_FAILED" "$configure_attempt_log"; then
              echo "::warning::vcpkg build failure detected on ARM64; retrying once."
            else
              break
            fi
          done
          if [ "$status" -ne 0 ] && [ -d vcpkg/buildtrees/detect_compiler ]; then
            # vcpkg reports log paths, not the nested compiler error needed by recovery.
            while IFS= read -r -d '' log; do
              {
                printf '\n--- %s ---\n' "$log"
                cat "$log"
              } | tee -a "$configure_output_log"
            done < <(find vcpkg/buildtrees/detect_compiler -type f -newer "$configure_started" \( -name '*-out.log' -o -name '*-err.log' \) -print0)
          fi
          if [ "$status" -ne 0 ] && grep -Eq "sccache: error: Server startup failed|cache storage failed to read" "$configure_output_log"; then
            echo "::warning::Transient sccache backend failure detected during configure; disabling sccache launcher and retrying once."
            if command -v sccache >/dev/null 2>&1; then
              sccache --stop-server >/dev/null 2>&1 || true
            fi
            # Dependency builds can rediscover sccache even with empty CMake launchers.
            export SCCACHE_GHA_ENABLED=false
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            BUILD_DIR="${{ steps.resolve_mode.outputs.resolved_build_dir }}"
            if [ -n "${BUILD_DIR:-}" ] && [ -d "$BUILD_DIR" ]; then
              # Reuse cached configure options; rerunning the preset would re-enable the launcher.
              # Nested vcpkg configures also inherit launcher environment variables.
              unset CMAKE_C_COMPILER_LAUNCHER CMAKE_CXX_COMPILER_LAUNCHER
              set +e
              set +o pipefail
              cmake "$BUILD_DIR" -DTHEMIS_ENABLE_COMPILER_CACHE=OFF -DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER= 2>&1 | tee -a "$configure_output_log"
              status=${PIPESTATUS[0]}
              set -o pipefail
              set -e
            fi
          fi
          exit "$status"

      - name: Report Windows dependency cache reuse
        if: ${{ !cancelled() && inputs.windows_dependency_mode != 'off' && (steps.dependency_prepare.outcome == 'success' || steps.dependency_prepare.outcome == 'failure' || steps.configure.outcome == 'success' || steps.configure.outcome == 'failure') }}
        shell: bash
        run: |
          python "${GITHUB_WORKSPACE}/${THEMIS_CACHE_TOOLS_PREFIX}scripts/prepare-windows-dependencies.py" --metrics-only --log "$RUNNER_TEMP/cmake-build-configure-output.log" --cache "$THEMIS_VCPKG_CACHE_DIR"

      - name: Build
        id: build
        if: inputs.windows_dependency_mode != 'prepare'
        continue-on-error: ${{ inputs.build_continue_on_error }}
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          BUILD_COMMAND: ${{ steps.resolve_mode.outputs.resolved_build_command }}
          BUILD_DIR: ${{ steps.resolve_mode.outputs.resolved_build_dir }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          script_path="$RUNNER_TEMP/cmake-build-build.sh"
          build_output_log="$RUNNER_TEMP/cmake-build-build-output.log"
          printf '%s\n' "$BUILD_COMMAND" > "$script_path"
          : > "$build_output_log"
          set +e
          set +o pipefail
          bash "$script_path" 2>&1 | tee -a "$build_output_log"
          status=${PIPESTATUS[0]}
          set -o pipefail
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "sccache: error: Server startup failed|cache storage failed to read" "$build_output_log"; then
            echo "::warning::Transient sccache backend failure detected during build; disabling sccache launcher and retrying once."
            if command -v sccache >/dev/null 2>&1; then
              sccache --stop-server >/dev/null 2>&1 || true
            fi
            export SCCACHE_GHA_ENABLED=false
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
            unset CMAKE_C_COMPILER_LAUNCHER CMAKE_CXX_COMPILER_LAUNCHER
            if [ -n "${BUILD_DIR:-}" ] && [ -d "$BUILD_DIR" ]; then
              cmake "$BUILD_DIR" -DTHEMIS_ENABLE_COMPILER_CACHE=OFF -DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER= 2>&1 | tee -a "$build_output_log"
            fi
            set +e
            set +o pipefail
            bash "$script_path" 2>&1 | tee -a "$build_output_log"
            status=${PIPESTATUS[0]}
            set -o pipefail
            set -e
          fi
          exit "$status"

      - name: Record updated cache inventory
        id: cache_after
        if: ${{ !cancelled() && inputs.windows_dependency_mode == 'off' && steps.cache_before.outcome == 'success' && (steps.configure.outcome == 'success' || steps.configure.outcome == 'failure') }}
        shell: bash
        run: |
          fingerprint="$(bash "${THEMIS_CACHE_TOOLS_PREFIX}.github/scripts/cache-directory-fingerprint.sh" "$THEMIS_SCCACHE_DIR" "$THEMIS_VCPKG_DOWNLOADS_DIR" "$THEMIS_VCPKG_CACHE_DIR")"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Save updated compiler and dependency cache
        if: ${{ !cancelled() && steps.cache_after.outcome == 'success' && steps.cache_after.outputs.fingerprint != steps.cache_before.outputs.fingerprint }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.THEMIS_SCCACHE_DIR }}
            ${{ env.THEMIS_VCPKG_DOWNLOADS_DIR }}
            ${{ env.THEMIS_VCPKG_CACHE_DIR }}
          key: ${{ steps.restore_cmake_cache.outputs.cache-primary-key }}
          enableCrossOsArchive: false

      - name: Validation
        id: validation
        if: inputs.windows_dependency_mode != 'prepare' && steps.resolve_mode.outputs.resolved_validation_command != ''
        continue-on-error: ${{ inputs.validation_continue_on_error }}
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          VALIDATION_COMMAND: ${{ steps.resolve_mode.outputs.resolved_validation_command }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          cd "$WORKING_DIRECTORY"
          script_path="$RUNNER_TEMP/cmake-build-validation.sh"
          printf '%s\n' "$VALIDATION_COMMAND" > "$script_path"
          LOG_FILE="$RUNNER_TEMP/ctest-validation.log"
          rm -f "$LOG_FILE"
          set +e
          bash "$script_path" 2>&1 | tee "$LOG_FILE"
          VALIDATION_EXIT=${PIPESTATUS[0]}
          set -e
          echo "validation_exit=${VALIDATION_EXIT}" >> "$GITHUB_OUTPUT"
          exit "$VALIDATION_EXIT"

      - name: Validate and summarize full CTest evidence
        if: always() && inputs.ctest_junit_path != ''
        shell: bash
        env:
          CTEST_BUILD_DIR: ${{ inputs.ctest_build_directory }}
          CTEST_JUNIT_PATH: ${{ inputs.ctest_junit_path }}
          CTEST_SUMMARY_PATH: ${{ inputs.ctest_summary_path }}
          CTEST_PLATFORM: ${{ inputs.summary_title }}
          CTEST_COMMIT_SHA: ${{ github.sha }}
          CTEST_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CTEST_PRESET: ${{ inputs.ctest_preset }}
        run: |
          set -euo pipefail
          python3 tools/ci/summarize_ctest_evidence.py \
            --build-dir "${CTEST_BUILD_DIR}" \
            --junit "${CTEST_JUNIT_PATH}" \
            --output "${CTEST_SUMMARY_PATH}" \
            --platform "${CTEST_PLATFORM}" \
            --commit-sha "${CTEST_COMMIT_SHA}" \
            --workflow-run-url "${CTEST_WORKFLOW_RUN_URL}" \
            --ctest-preset "${CTEST_PRESET}"
          cat "${CTEST_SUMMARY_PATH}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: ${{ always() && !cancelled() && inputs.artifact_name != '' && inputs.artifact_paths != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_paths }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ${{ inputs.ctest_junit_path != '' && 'error' || 'ignore' }}

      - name: Upload secondary artifacts
        if: inputs.artifact_name_secondary != '' && inputs.artifact_paths_secondary != ''
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact_name_secondary }}
          path: ${{ inputs.artifact_paths_secondary }}
          retention-days: ${{ inputs.artifact_retention_days_secondary }}
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          VALIDATION_COMMAND: ${{ inputs.validation_command }}
        run: |
          cd "$WORKING_DIRECTORY"
          {
            printf '%s\n' "### ${{ inputs.summary_title }}"
            printf '%s\n' ""
            printf '%s\n' "- Configure: ${{ steps.configure.outcome }}"
            printf '%s\n' "- Build: ${{ steps.build.outcome }}"
            if [ -n "$VALIDATION_COMMAND" ]; then
              printf '%s\n' "- Validation: ${{ steps.validation.outcome }}"
            fi
            if command -v sccache >/dev/null 2>&1; then
              printf '%s\n' "" "#### sccache stats" '```'
              sccache --show-stats || true
              printf '%s\n' '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
