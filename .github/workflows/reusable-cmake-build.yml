name: Reusable CMake Build Pipeline

# Rechenaufwand-Score: R=5 (K=5, L=5, N=5) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Timeout note: 360 minutes to accommodate Windows vcpkg builds.
# Performance optimizations applied:
#   - sccache compiler caching (30-50% speedup): enabled via enable_sccache_gha input
#   - Parallel build jobs: --parallel 16 for Windows, tuned via platform-specific settings
#   - vcpkg binary caching: GHA cache layer + vcpkg archives directory to skip redundant deps
#   - CMAKE_BUILD_PARALLEL_LEVEL environment variable honors platform constraints
# Combined expected improvement: 30-50% reduction in Windows build time vs baseline.
# See: https://github.com/makr-code/ThemisDB/issues/xxxx
on:
  workflow_call:
    inputs:
      enable_sccache_gha:
        required: false
        default: false
        type: boolean
      runs_on:
        required: false
        default: ubuntu-latest
        type: string
      shell:
        required: false
        default: bash
        type: string
      fetch_depth:
        required: false
        default: '0'
        type: string
      submodules:
        required: false
        default: false
        type: boolean
      working_directory:
        required: false
        default: .
        type: string
      setup_command:
        required: false
        default: ''
        type: string
      configure_command:
        required: true
        type: string
      build_command:
        required: true
        type: string
      validation_command:
        required: false
        default: ''
        type: string
      build_continue_on_error:
        required: false
        default: false
        type: boolean
      validation_continue_on_error:
        required: false
        default: false
        type: boolean
      artifact_name:
        required: false
        default: ''
        type: string
      artifact_paths:
        required: false
        default: ''
        type: string
      artifact_name_secondary:
        required: false
        default: ''
        type: string
      artifact_paths_secondary:
        required: false
        default: ''
        type: string
      artifact_retention_days:
        required: false
        default: '30'
        type: string
      artifact_retention_days_secondary:
        required: false
        default: '30'
        type: string
      summary_title:
        required: false
        default: CMake Build
        type: string
    secrets:
      THEMIS_HYPERSCALER_LICENSE_B64:
        required: false
      THEMIS_BUILD_SIG:
        required: false
    outputs:
      configure-outcome:
        description: Outcome of Configure step (success|failure|skipped)
        value: ${{ jobs.build.outputs.configure-outcome }}
      build-outcome:
        description: Outcome of Build step (success|failure|skipped)
        value: ${{ jobs.build.outputs.build-outcome }}
      validation-outcome:
        description: Outcome of Validation step (success|failure|skipped)
        value: ${{ jobs.build.outputs.validation-outcome }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.summary_title }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs.enable_sccache_gha }}
    outputs:
      configure-outcome: ${{ steps.configure.outcome }}
      build-outcome: ${{ steps.build.outcome }}
      validation-outcome: ${{ steps.validation.outcome || 'skipped' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          submodules: ${{ inputs.submodules }}

      - name: Initialize compiler and dependency cache environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.cache/sccache"
          mkdir -p "${GITHUB_WORKSPACE}/.vcpkg-cache"
          mkdir -p "${GITHUB_WORKSPACE}/vcpkg/downloads"
          {
            echo "SCCACHE_DIR=${GITHUB_WORKSPACE}/.cache/sccache"
            echo "SCCACHE_CACHE_SIZE=8G"
            echo "VCPKG_DEFAULT_BINARY_CACHE=${GITHUB_WORKSPACE}/.vcpkg-cache"
            echo "VCPKG_BINARY_SOURCES=clear;files,${GITHUB_WORKSPACE}/.vcpkg-cache,readwrite"
          } >> "$GITHUB_ENV"

      - name: Restore CMake build caches
        uses: actions/cache@a9e10dcf69a7f3e89de08b13b4141dd478633dee
        with:
          path: |
            ${{ github.workspace }}/.cache/sccache
            ${{ github.workspace }}/.vcpkg-cache
            ${{ github.workspace }}/vcpkg/downloads
            ${{ github.workspace }}/vcpkg/archives
          key: cmake-cache-${{ runner.os }}-${{ inputs.runs_on }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakePresets.json', 'cmake/**/*.cmake', 'ports/**', 'ports-overlays/**', '.github/workflows/reusable-cmake-build.yml') }}
          restore-keys: |
            cmake-cache-${{ runner.os }}-${{ inputs.runs_on }}-
            cmake-cache-${{ runner.os }}-

      - name: Setup MSVC environment (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Install sccache
        if: inputs.enable_sccache_gha
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup
        if: inputs.setup_command != ''
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          SETUP_COMMAND: ${{ inputs.setup_command }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          cd "$WORKING_DIRECTORY"
          script_path="$RUNNER_TEMP/cmake-build-setup.sh"
          printf '%s\n' "$SETUP_COMMAND" > "$script_path"
          bash "$script_path"

      - name: Configure
        id: configure
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          CONFIGURE_COMMAND: ${{ inputs.configure_command }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          cd "$WORKING_DIRECTORY"
          # Clean stale CMake cache entries before reconfiguring so a previous
          # toolchain/bootstrap state cannot poison a later runner build.
          find . -maxdepth 2 \( -name CMakeCache.txt -o -name CMakeFiles \) -print
          find . -maxdepth 2 -name CMakeCache.txt -delete
          find . -maxdepth 2 -type d -name CMakeFiles -prune -exec rm -rf {} +
          script_path="$RUNNER_TEMP/cmake-build-configure.sh"
          printf '%s\n' "$CONFIGURE_COMMAND" > "$script_path"
          bash "$script_path"

      - name: Build
        id: build
        continue-on-error: ${{ inputs.build_continue_on_error }}
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          BUILD_COMMAND: ${{ inputs.build_command }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          cd "$WORKING_DIRECTORY"
          script_path="$RUNNER_TEMP/cmake-build-build.sh"
          printf '%s\n' "$BUILD_COMMAND" > "$script_path"
          bash "$script_path"

      - name: Validation
        id: validation
        if: inputs.validation_command != ''
        continue-on-error: ${{ inputs.validation_continue_on_error }}
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          VALIDATION_COMMAND: ${{ inputs.validation_command }}
          THEMIS_HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          THEMIS_BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          cd "$WORKING_DIRECTORY"
          script_path="$RUNNER_TEMP/cmake-build-validation.sh"
          printf '%s\n' "$VALIDATION_COMMAND" > "$script_path"
          bash "$script_path"

      - name: Upload artifacts
        if: inputs.artifact_name != '' && inputs.artifact_paths != ''
        uses: actions/upload-artifact@6f51b1e991eae641e69d16477226994b16345ebf
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_paths }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore

      - name: Upload secondary artifacts
        if: inputs.artifact_name_secondary != '' && inputs.artifact_paths_secondary != ''
        uses: actions/upload-artifact@6f51b1e991eae641e69d16477226994b16345ebf
        with:
          name: ${{ inputs.artifact_name_secondary }}
          path: ${{ inputs.artifact_paths_secondary }}
          retention-days: ${{ inputs.artifact_retention_days_secondary }}
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        shell: bash
        env:
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          VALIDATION_COMMAND: ${{ inputs.validation_command }}
        run: |
          cd "$WORKING_DIRECTORY"
          {
            printf '%s\n' "### ${{ inputs.summary_title }}"
            printf '%s\n' ""
            printf '%s\n' "- Configure: ${{ steps.configure.outcome }}"
            printf '%s\n' "- Build: ${{ steps.build.outcome }}"
            if [ -n "$VALIDATION_COMMAND" ]; then
              printf '%s\n' "- Validation: ${{ steps.validation.outcome }}"
            fi
            if command -v sccache >/dev/null 2>&1; then
              printf '%s\n' "" "#### sccache stats" '```'
              sccache --show-stats || true
              printf '%s\n' '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
