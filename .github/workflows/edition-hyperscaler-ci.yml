name: Edition - Hyperscaler CI

on:
  workflow_dispatch:
  push:
    branches:
      - hyperscaler
    paths:
      - 'src/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'plugins/private/**'
      - '.github/workflows/edition-hyperscaler-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hyperscaler-build:
    if: github.ref == 'refs/heads/hyperscaler'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive

      - name: Authorize actor
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          ALLOWED_ACTORS: ${{ vars.HYPERSCALER_ALLOWED_ACTORS }}
        run: |
          set -euo pipefail
          allowed_csv="${OWNER}"
          if [ -n "${ALLOWED_ACTORS:-}" ]; then
            allowed_csv="${allowed_csv},${ALLOWED_ACTORS}"
          fi

          IFS=',' read -ra allowed <<< "${allowed_csv}"
          authorized="false"
          for raw in "${allowed[@]}"; do
            candidate="$(echo "${raw}" | xargs)"
            if [ -n "${candidate}" ] && [ "${candidate}" = "${ACTOR}" ]; then
              authorized="true"
              break
            fi
          done

          if [ "${authorized}" != "true" ]; then
            echo "Actor '${ACTOR}' is not authorized for hyperscaler compile/sign pipeline."
            exit 1
          fi

      - name: Validate hyperscaler secrets
        env:
          HYPERSCALER_LICENSE_B64: ${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}
          BUILD_SIG: ${{ secrets.THEMIS_BUILD_SIG }}
        run: |
          set -euo pipefail
          test -n "${HYPERSCALER_LICENSE_B64}" || { echo "Missing secret THEMIS_HYPERSCALER_LICENSE_B64"; exit 1; }
          test -n "${BUILD_SIG}" || { echo "Missing secret THEMIS_BUILD_SIG"; exit 1; }

      - name: Validate private modules exist
        run: |
          set -euo pipefail
          test -f plugins/private/themisdb-hyperscaler-core/CMakeLists.txt \
            || { echo "Missing private module plugins/private/themisdb-hyperscaler-core"; exit 1; }
          test -f plugins/themisdb_plugin_signer/README.md \
            || { echo "Missing private module plugins/themisdb_plugin_signer"; exit 1; }

      - name: Restore hyperscaler license
        run: |
          set -euo pipefail
          mkdir -p /tmp/themis-hyperscaler
          echo "${{ secrets.THEMIS_HYPERSCALER_LICENSE_B64 }}" | base64 -d > /tmp/themis-hyperscaler/license.json

      - name: Configure (hyperscaler)
        run: |
          set -euo pipefail
          cmake -S cmake -B build-hyperscaler \
            -DTHEMIS_EDITION=HYPERSCALER \
            -DTHEMIS_BUILD_CHANNEL=official \
            -DTHEMIS_BUILD_SIG="${{ secrets.THEMIS_BUILD_SIG }}" \
            -DTHEMIS_LICENSE_FILE=/tmp/themis-hyperscaler/license.json

      - name: Build (hyperscaler)
        run: |
          set -euo pipefail
          cmake --build build-hyperscaler --config Release --parallel 4

