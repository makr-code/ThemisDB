name: "Edition: Hyperscaler [CI]"

# Rechenaufwand-Score: R=4 (K=4, L=4, N=4) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
on:
  workflow_dispatch:
  push:
    branches:
      - hyperscaler
    paths:
      - 'src/**/*.c'
      - 'src/**/*.cc'
      - 'src/**/*.cpp'
      - 'src/**/*.cxx'
      - 'src/**/*.h'
      - 'src/**/*.hh'
      - 'src/**/*.hpp'
      - 'src/**/*.hxx'
      - 'include/**/*.h'
      - 'include/**/*.hh'
      - 'include/**/*.hpp'
      - 'include/**/*.hxx'
      - 'include/**/*.ipp'
      - 'include/**/*.tpp'
      - 'cmake/**/*.cmake'
      - 'cmake/**/*.txt'
      - 'cmake/**/*.in'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'plugins/private/**/plugin.toml'
      - 'plugins/private/**/plugin.json'
      - 'plugins/private/**/CMakeLists.txt'
      - 'plugins/private/**/*.cmake'
      - 'plugins/private/**/*.in'
      - 'plugins/private/**/*.txt'
      - 'plugins/private/**/*.c'
      - 'plugins/private/**/*.cc'
      - 'plugins/private/**/*.cpp'
      - 'plugins/private/**/*.cxx'
      - 'plugins/private/**/*.h'
      - 'plugins/private/**/*.hh'
      - 'plugins/private/**/*.hpp'
      - 'plugins/private/**/*.hxx'
      - '.github/workflows/edition-hyperscaler-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hyperscaler-build:
    if: github.ref == 'refs/heads/hyperscaler'
    uses: ./.github/workflows/reusable-cmake-build.yml
    secrets: inherit
    with:
      runs_on: ubuntu-latest
      shell: bash
      submodules: false
      setup_command: |
        set -euo pipefail
        allowed_csv="${{ github.repository_owner }}"
        if [ -n "${{ vars.HYPERSCALER_ALLOWED_ACTORS }}" ]; then
          allowed_csv="${allowed_csv},${{ vars.HYPERSCALER_ALLOWED_ACTORS }}"
        fi

        IFS=',' read -ra allowed <<< "${allowed_csv}"
        authorized="false"
        for raw in "${allowed[@]}"; do
          candidate="$(echo "${raw}" | xargs)"
          if [ -n "${candidate}" ] && [ "${candidate}" = "${{ github.actor }}" ]; then
            authorized="true"
            break
          fi
        done

        if [ "${authorized}" != "true" ]; then
          echo "Actor '${{ github.actor }}' is not authorized for hyperscaler compile/sign pipeline."
          exit 1
        fi

        test -n "${THEMIS_HYPERSCALER_LICENSE_B64:-}" || { echo "Missing secret THEMIS_HYPERSCALER_LICENSE_B64"; exit 1; }
        test -n "${THEMIS_BUILD_SIG:-}" || { echo "Missing secret THEMIS_BUILD_SIG"; exit 1; }

        test -f plugins/private/themisdb-hyperscaler-core/CMakeLists.txt \
          || { echo "Missing private module plugins/private/themisdb-hyperscaler-core"; exit 1; }
        test -f plugins/themisdb_plugin_signer/README.md \
          || { echo "Missing private module plugins/themisdb_plugin_signer"; exit 1; }

        mkdir -p /tmp/themis-hyperscaler
        echo "${THEMIS_HYPERSCALER_LICENSE_B64}" | base64 -d > /tmp/themis-hyperscaler/license.json
      configure_command: |
        set -euo pipefail
        cmake -S cmake -B build-hyperscaler \
          -DTHEMIS_EDITION=HYPERSCALER \
          -DTHEMIS_BUILD_CHANNEL=official \
          -DTHEMIS_BUILD_SIG="${THEMIS_BUILD_SIG}" \
          -DTHEMIS_LICENSE_FILE=/tmp/themis-hyperscaler/license.json
      build_command: |
        set -euo pipefail
        cmake --build build-hyperscaler --config Release --parallel 4
      summary_title: Build (hyperscaler)
