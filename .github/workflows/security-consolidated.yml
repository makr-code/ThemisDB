name: "Security: Consolidated Scans"

# Rechenaufwand-Score: R=4 (K=4, L=4, N=4) | last-calibrated: 2026-08-31
# Trigger policy: repo framework score calibration for workflow cost controls.
# Consolidated security scanning workflow.
# Merges the former security.yml (Trivy + Gitleaks) and
# security-scanning.yml (KubeSec) into one scheduled workflow.
#
# Design decisions:
#   - All scanner jobs run on schedule and workflow_dispatch only.
#   - PR trigger is intentionally absent: heavy scanners must not block PRs.
#     CodeQL (security-codeql.yml) remains the sole PR security gate.
#   - Gitleaks is the only fast secret-scan job that may optionally run on PR if
#     needed, but it is also covered here on schedule for completeness.
#   - SARIF uploads go to GitHub Security tab (code scanning) for unified triage.
#   - Issue creation for SLA breaches is delegated to maintenance-issues.yml.
#
# DAST/ZAP has been moved to security-dast-zap.yml (dedicated workflow).
#
# Replaces:
#   - .github/workflows/security.yml
#   - .github/workflows/security-scanning.yml

on:
  schedule:
    - cron: '21 4 * * 1'   # Weekly Monday 04:21 UTC — Trivy + Gitleaks (was security.yml)
    - cron: '0 2 * * 0'    # Weekly Sunday 02:00 UTC — KubeSec (was security-scanning.yml)
  workflow_dispatch:
    inputs:
      run_trivy:
        description: 'Run Trivy vulnerability scan'
        type: boolean
        default: true
      run_gitleaks:
        description: 'Run Gitleaks secret scan'
        type: boolean
        default: true
      run_kubesec:
        description: 'Run Kubesec Kubernetes manifest scan'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: security-consolidated-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Trivy — filesystem vulnerability scan (OS packages + libraries)
  # ────────────────────────────────────────────────────────────────────────────
  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_trivy == true || inputs.run_trivy == 'true'))
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # v7.0.1

      - name: Run Trivy scan (human-readable summary)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Run Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ────────────────────────────────────────────────────────────────────────────
  # Gitleaks — secret detection scan
  # ────────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_gitleaks == true || inputs.run_gitleaks == 'true'))
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # v7.0.1

      - name: Run Gitleaks and generate SARIF
        run: |
          docker run --rm \
            -v "$PWD":/repo \
            zricethezav/gitleaks:v8.30.1 \
            detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif

      - name: Upload Gitleaks SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85  # v3.37.8
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Publish scanned-files summary
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif_path = Path("gitleaks.sarif")
          files = 0
          results = 0
          if sarif_path.exists():
              data = json.loads(sarif_path.read_text(encoding="utf-8"))
              runs = data.get("runs", [])
              if runs:
                  invocations = runs[0].get("invocations", [])
                  if invocations:
                      files = invocations[0].get("properties", {}).get("filesScanned", 0) or 0
                  results = len(runs[0].get("results", []))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("### Gitleaks Scan Summary\n")
                  f.write(f"- Files scanned: **{files}**\n")
                  f.write(f"- Findings: **{results}**\n")
          else:
              print(f"Files scanned: {files}")
              print(f"Findings: {results}")
          PY

  # ────────────────────────────────────────────────────────────────────────────
  # Kubesec — Kubernetes manifest security scan
  # ────────────────────────────────────────────────────────────────────────────
  kubesec:
    name: Kubesec — Kubernetes Manifest Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_kubesec == true || inputs.run_kubesec == 'true'))
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # v7.0.1

      - name: Run kubesec scanner
        uses: controlplaneio/kubesec-action@43d0ddff5ffee89a6bb9f29b64cd865411137b14
        with:
          input: deploy/kubernetes/operator/deployment.yaml
          format: json
          output: kubesec-results.json
          exit-code: "0"

      - name: Upload Kubesec JSON results
        uses: actions/upload-artifact@v4  # v7.0.1
        if: always()
        with:
          name: kubesec-results-${{ github.run_number }}
          path: kubesec-results.json
          retention-days: 30
          if-no-files-found: ignore

  # DAST/ZAP — moved to .github/workflows/security-dast-zap.yml
  # See that workflow for baseline, api-scan, and full-scan modes.
