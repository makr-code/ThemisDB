name: CDC Changefeed Sequence Counter CI

# Triggered on every push / PR that touches the changefeed sources or
# the sequence-counter test file.  Targets v1.8.0
# (roadmap:160:cdc:v1.8.0:changefeed-sequence-counter-rocksdb-merge-operator).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/cdc/changefeed.h'
      - 'src/cdc/changefeed.cpp'
      - 'tests/test_cdc_changefeed_sequence_counter.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cdc-changefeed-sequence-counter-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/cdc/changefeed.h'
      - 'src/cdc/changefeed.cpp'
      - 'tests/test_cdc_changefeed_sequence_counter.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/cdc-changefeed-sequence-counter-ci.yml'
  workflow_dispatch:

concurrency:
  group: cdc-changefeed-sequence-counter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the CDC Changefeed Sequence Counter focused test suite.
  # Tests cover all acceptance criteria for v1.8.0 roadmap:160:
  #   AC-1  makeSequenceMergeOperator() returns a named operator instance
  #   AC-2  SequenceIncrementOperator merges from absent key (no base value)
  #   AC-3  SequenceIncrementOperator merges on top of binary uint64 base
  #   AC-4  SequenceIncrementOperator handles legacy decimal-string base
  #   AC-5  nextSequence() returns monotonically increasing gap-free sequences
  #   AC-6  getLatestSequence() reflects the atomic counter (no DB round-trip)
  #   AC-7  No duplicate sequences under 8 concurrent writer threads
  #   AC-8  Throughput >= 200K sequences/s under 8 writer threads
  #   AC-9  Crash recovery: re-opening the DB continues from last persisted value
  #   AC-10 clear() resets both the atomic counter and the RocksDB base value
  # ---------------------------------------------------------------------------
  cdc-changefeed-sequence-counter-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: CDC Sequence Counter (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run CDCChangefeedSequenceCounterTests
        run: |
          set -o pipefail
          cd build
          ctest -R CDCChangefeedSequenceCounterTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee cdc_sequence_counter_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run sequence counter suites via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="SequenceMergeOperatorFactory*:SequenceMergeOperatorSemantics*:SequenceCounterTest*:SequenceCounterCrashRecovery*:SequenceCounterLegacyInit*" \
            --gtest_output="xml:cdc_sequence_counter_gtest.xml" \
            2>&1 | tee cdc_sequence_counter_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdc-sequence-counter-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/cdc_sequence_counter_results.txt
            build/cdc_sequence_counter_gtest.xml
            build/cdc_sequence_counter_gtest_output.txt
          retention-days: 30
