name: "Release: Packaging"

# Rechenaufwand-Score: R=6 (K=6, L=6, N=6) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Multi-edition release build: build matrix, package, publish.
# Replaces: release-build.yml
#
# Pipeline stages (end-to-end):
#   preflight → build-matrix (configure+build+test+cpack) → package
#   → validate-release-manifest → publish-community / publish-private
#   → changelog
#
# Edition tag patterns (RELEASE_STRATEGY.md §3):
#   vX.Y.Z                — community release
#   enterprise-vX.Y.Z     — enterprise release
#   hyperscaler-vX.Y.Z    — hyperscaler release
#   military-vX.Y.Z       — military release
#   minimal-vX.Y.Z        — minimal release
#
# Community guardrail: publish-community job must never require private
# credentials, private submodules, or private artefacts (RELEASE_STRATEGY.md §2.4).
#
# Packaging outputs per platform (via CPack):
#   Linux community-release : fallback build lane / raw binaries
#   Linux linux-release     : TGZ + DEB + RPM + ZIP
#   Windows windows-release : ZIP + WIX/MSI (WiX v3 required on runner)

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    tags:
      - 'v*'
      - 'enterprise-v*'
      - 'hyperscaler-v*'
      - 'military-v*'
      - 'minimal-v*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      build_matrix:
        description: 'Build matrix presets'
        required: false
        default: 'all'
        type: choice
        options: [all, community-only, linux-release-only, windows-release-only]
      edition:
        description: 'Edition to publish (for dispatch)'
        required: false
        default: 'community'
        type: choice
        options: [minimal, community, enterprise, hyperscaler, military]
      tag_name:
        description: 'Tag for image version (for dispatch)'
        required: false
        type: string
  workflow_call: {}

permissions:
  contents: read
  packages: write
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  preflight-release-policy:
    name: Preflight Release Policy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout (sparse — actions)
        uses: actions/checkout@v4  # v4.2.2
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - name: Bootstrap build tracker issue (schedule gate)
        if: github.event_name == 'schedule'
        uses: ./.github/actions/bootstrap-build-tracker
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check last develop build status (schedule gate)
        if: github.event_name == 'schedule'
        uses: ./.github/actions/check-build-status
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          enforce: 'true'
          fail-if-missing: 'true'
      - name: Validate tag/edition policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          EDITION_INPUT="${{ inputs.edition || '' }}"
          TAG_INPUT="${{ inputs.tag_name || '' }}"

          if [ "${EVENT}" = "schedule" ]; then
            VERSION_FILE="$(tr -d '\r\n' < VERSION 2>/dev/null || echo '2.4.0')"
            TARGET="v${VERSION_FILE}-nightly"
            echo "Nightly release tag computed as: ${TARGET}"
          else
            TARGET="${TAG_INPUT:-$REF_NAME}"
          fi

          CANONICAL_BRANCHES='^(develop|community|enterprise|hyperscaler|military|minimal)$'
          SEMVER_CORE='[0-9]+\.[0-9]+\.[0-9]+'
          SEMVER_SUFFIX='(-[0-9A-Za-z][0-9A-Za-z.-]*)?'

          if [ "${EVENT}" = "workflow_dispatch" ]; then
            if ! echo "${REF_NAME}" | grep -Eq "${CANONICAL_BRANCHES}"; then
              echo "::error::workflow_dispatch must run on canonical branch lanes only."
              exit 1
            fi

            if [ -n "${TAG_INPUT}" ] && echo "${TAG_INPUT}" | grep -Eq "^${SEMVER_CORE}${SEMVER_SUFFIX}$"; then
              TARGET="v${TAG_INPUT}"
              echo "Normalized dispatch tag to canonical format: ${TARGET}"
            fi
          fi

          if [ -n "${TARGET}" ]; then
            TAG_REGEX="^(v${SEMVER_CORE}${SEMVER_SUFFIX}|v${SEMVER_CORE}-nightly|enterprise-v${SEMVER_CORE}${SEMVER_SUFFIX}|hyperscaler-v${SEMVER_CORE}${SEMVER_SUFFIX}|military-v${SEMVER_CORE}${SEMVER_SUFFIX}|minimal-v${SEMVER_CORE}${SEMVER_SUFFIX})$"
            if ! echo "${TARGET}" | grep -Eq "${TAG_REGEX}"; then
              echo "::error::Invalid release tag format: ${TARGET}"
              exit 1
            fi

            # Protect stable candidate tags (e.g. v2.4.0-stable) from accidental overwrite.
            if echo "${TARGET}" | grep -Eq '(^|-)stable([.-].*)?$'; then
              API_URL="${{ github.api_url }}/repos/${{ github.repository }}/releases/tags/${TARGET}"
              HTTP_CODE="$(curl -sS -o /tmp/release-by-tag.json -w "%{http_code}" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${API_URL}")"

              if [ "${HTTP_CODE}" = "200" ]; then
                echo "::error::Stable tag release already exists and must not be overwritten: ${TARGET}"
                exit 1
              elif [ "${HTTP_CODE}" != "404" ]; then
                echo "::error::Could not validate stable tag overwrite guard (HTTP ${HTTP_CODE})"
                cat /tmp/release-by-tag.json || true
                exit 1
              fi
            fi
          fi

          if [ "${EDITION_INPUT}" = "community" ]; then
            echo "Community lane selected: private credentials/submodules must remain disabled."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Build Matrix: community-release, linux-release, windows-release
  # ─────────────────────────────────────────────────────────────────────────────
  build-matrix:
    needs: preflight-release-policy
    uses: ./.github/workflows/release-build-matrix.yml
    with:
      build_matrix: ${{ inputs.build_matrix || 'all' }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────────
  # Package: consolidate CPack artifacts from all presets into a single release
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package Release Artifacts
    runs-on: ubuntu-latest
    needs: build-matrix
    if: >
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'release' ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      ) && needs.build-matrix.result == 'success'

    steps:
      - uses: actions/checkout@v4  # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all CPack packages
        uses: actions/download-artifact@v4  # v4
        with:
          pattern: packages-*-${{ github.run_number }}
          merge-multiple: true
          path: release/

      - name: Download Linux community binaries (fallback)
        uses: actions/download-artifact@v4  # v4
        with:
          pattern: build-community-release-${{ github.run_number }}
          merge-multiple: true
          path: dist/

      - name: Determine edition and version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "${TAG}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            TAG="v${TAG}"
          fi
          if   echo "${TAG}" | grep -qE '^enterprise-v'; then
            EDITION=enterprise; VERSION="${TAG#enterprise-}"
          elif echo "${TAG}" | grep -qE '^hyperscaler-v'; then
            EDITION=hyperscaler; VERSION="${TAG#hyperscaler-}"
          elif echo "${TAG}" | grep -qE '^military-v'; then
            EDITION=military; VERSION="${TAG#military-}"
          elif echo "${TAG}" | grep -qE '^minimal-v'; then
            EDITION=minimal; VERSION="${TAG#minimal-}"
          elif echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-nightly$'; then
            EDITION=community; VERSION="${TAG#v}"; VERSION="${VERSION%-nightly}"
          else
            EDITION=community; VERSION="${TAG#v}"
          fi
          {
            echo "edition=${EDITION}"
            echo "version=${VERSION}"
            echo "archive_name=themisdb-${EDITION}-${VERSION}-nightly-linux-x64"
          } >> "$GITHUB_OUTPUT"

      - name: Create fallback archive if no CPack TGZ present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ARCHIVE="release/${{ steps.version.outputs.archive_name }}.tar.gz"
          if ls release/*.tar.gz &>/dev/null || ls release/*.tgz &>/dev/null; then
            echo "CPack TGZ already present — skipping fallback archive."
          elif [ "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "Creating fallback archive from raw build artifacts."
            tar -czf "${ARCHIVE}" -C dist/ . --exclude='*.a'
          else
            echo "::warning::No CPack packages and no raw artifacts found — release archive will be empty."
          fi

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release
          # Collect all distributable files
          DIST_FILES=()
          for ext in tar.gz tgz zip deb rpm msi; do
            while IFS= read -r -d '' f; do
              DIST_FILES+=("$(basename "${f}")")
            done < <(find . -maxdepth 1 -name "*.${ext}" -print0 2>/dev/null)
          done

          if [ ${#DIST_FILES[@]} -eq 0 ]; then
            echo "::error::No distributable files in release/ after packaging; build artifacts did not produce a final release archive."
            ls -la . || true
            exit 1
          fi

          sha256sum "${DIST_FILES[@]}" > SHA256SUMS.txt
          {
            echo "artifacts:"
            for f in "${DIST_FILES[@]}"; do
              echo "  - ${f}"
            done
          } > RELEASE_MANIFEST.txt

          echo "--- Release manifest ---"
          cat RELEASE_MANIFEST.txt

      - uses: actions/upload-artifact@v4  # v7.0.1
        with:
          name: release-packages-${{ github.run_number }}
          path: release/
          retention-days: 90

  validate-release-manifest:
    name: Validate Release Manifest
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4  # v4
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: release/

      - name: Validate artifacts, checksums, and metadata
        run: |
          set -euo pipefail
          if [ ! -f release/SHA256SUMS.txt ] || [ ! -f release/RELEASE_MANIFEST.txt ]; then
            echo "::error::Release manifest or checksum file missing after packaging."
            ls -la release/ || true
            exit 1
          fi
          # Require at least one archive (TGZ, ZIP, or source tarball)
          ARCHIVE_COUNT=$(find release -maxdepth 1 \( -name "*.tar.gz" -o -name "*.tgz" -o -name "*.zip" \) | wc -l)
          if [ "${ARCHIVE_COUNT}" -eq 0 ]; then
            echo "::error::No archive (.tar.gz/.tgz/.zip) found in release packages; packaging did not produce a distributable artifact."
            ls -lh release/ || true
            exit 1
          fi
          echo "Archive count: ${ARCHIVE_COUNT}"
          ls -lh release/
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Enforce LLM model distribution policy
        shell: bash
        run: |
          set -euo pipefail

          TMP_LIST="$(mktemp)"
          TMP_MODELS="$(mktemp)"

          # Collect archive entry paths from all distributable archives.
          for archive in release/*.zip release/*.tar.gz release/*.tgz; do
            [ -f "${archive}" ] || continue
            case "${archive}" in
              *.zip)
                unzip -Z1 "${archive}" >> "${TMP_LIST}"
                ;;
              *.tar.gz|*.tgz)
                tar -tf "${archive}" >> "${TMP_LIST}"
                ;;
            esac
          done

          # Extract GGUF payload entries under models/ (path may be prefixed by archive root folder).
          grep -Ei '(^|/)models/.*\.gguf$' "${TMP_LIST}" | sort -u > "${TMP_MODELS}" || true

          if [ ! -s "${TMP_MODELS}" ]; then
            echo "::error::No GGUF model payload found under models/ in release archives."
            echo "Expected TinyLlama distribution payload according to release policy."
            exit 1
          fi

          echo "GGUF entries found in release payloads:"
          cat "${TMP_MODELS}"

          # Distribution allowlist: tinyllama/default only.
          if grep -Evi '(^|/)models/.*(tinyllama|default)\.gguf$' "${TMP_MODELS}" >/dev/null; then
            echo "::error::Non-approved GGUF model detected in distributable payload (allowed: tinyllama/default only)."
            grep -Evi '(^|/)models/.*(tinyllama|default)\.gguf$' "${TMP_MODELS}" || true
            exit 1
          fi

          # Explicit deny-list for Gemma-family in distributable bundles.
          if grep -Ei '(^|/)models/.*gemma.*\.gguf$' "${TMP_MODELS}" >/dev/null; then
            echo "::error::Gemma-family GGUF payload detected in distributable release artifact."
            grep -Ei '(^|/)models/.*gemma.*\.gguf$' "${TMP_MODELS}" || true
            exit 1
          fi

          echo "Model distribution policy check passed."

  docker-image:
    name: Trigger Docker Image Workflow (non-blocking)
    runs-on: ubuntu-latest
    needs: validate-release-manifest
    if: >
      !cancelled() &&
      needs.validate-release-manifest.result == 'success' && (
        github.event_name == 'push' ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger docker-image workflow (best effort)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
          RAW_TARGET_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set +e
          TARGET_TAG="${RAW_TARGET_TAG}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "${TARGET_TAG}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            TARGET_TAG="v${TARGET_TAG}"
          fi
          gh workflow run .github/workflows/release-docker-image.yml \
            --ref "${TARGET_REF}" \
            -f push_to_registry=true \
            -f registry=ghcr.io \
            -f tag_name="${TARGET_TAG}"
          RC=$?
          if [ "${RC}" -ne 0 ]; then
            echo "::warning::Docker workflow trigger failed (non-blocking), rc=${RC}."
          fi
          exit 0

  ci-widget:
    name: Trigger CI Widget Workflow (dry-run, non-blocking)
    runs-on: ubuntu-latest
    needs: validate-release-manifest
    if: >
      !cancelled() &&
      needs.validate-release-manifest.result == 'success' && (
        github.event_name == 'push' ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      actions: write
    steps:
      - name: Trigger ci-widget workflow (dry-run, best effort)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
          RAW_TARGET_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set +e
          TARGET_TAG="${RAW_TARGET_TAG}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "${TARGET_TAG}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            TARGET_TAG="v${TARGET_TAG}"
          fi
          gh workflow run .github/workflows/build-widget.yml \
            --ref "${TARGET_REF}" \
            -f dry_run=true \
            -f source_workflow="CI - Release" \
            -f tag_name="${TARGET_TAG}"
          RC=$?
          if [ "${RC}" -ne 0 ]; then
            echo "::warning::Widget workflow trigger failed (non-blocking), rc=${RC}."
          fi
          exit 0

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish Community — no private credentials or private submodules
  # Community guardrail: RELEASE_STRATEGY.md §2.4
  # ─────────────────────────────────────────────────────────────────────────────
  publish-community:
    name: Publish Community Release
    runs-on: ubuntu-latest
    needs: validate-release-manifest
    # Only publish community on vX.Y.Z tags or explicit community dispatch.
    # Fail fast if the release did not produce a valid artifact set.
    if: >
      !cancelled() &&
      needs.validate-release-manifest.result == 'success' && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
         !startsWith(github.ref_name, 'enterprise-') &&
         !startsWith(github.ref_name, 'hyperscaler-') &&
         !startsWith(github.ref_name, 'military-') &&
         !startsWith(github.ref_name, 'minimal-')) ||
        (github.event_name == 'workflow_dispatch' && inputs.edition == 'community')
      )
    permissions:
      contents: write   # required: create/update GitHub Releases and upload assets
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@v4  # v7.0.1

      - name: Download release packages
        uses: actions/download-artifact@v4  # v4
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: release/

      - name: Publish to GitHub Releases (community)
        uses: actions/github-script@v7  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : ('${{ inputs.tag_name }}' || '');
            if (/^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$/.test(tag)) {
              tag = `v${tag}`;
              console.log(`Normalized dispatch tag to canonical format: ${tag}`);
            }
            if (!tag) {
              console.log('No tag — skipping GitHub Release upload.');
              return;
            }

            // Resolve or create the GitHub Release for this tag
            let releaseId = context.payload.release?.id;
            if (!releaseId) {
              try {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag,
                });
                releaseId = existing.data.id;
                console.log(`Found existing release ${releaseId} for tag ${tag}`);
              } catch (e) {
                if (e.status === 404) {
                  const created = await github.rest.repos.createRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag_name: tag,
                    name: `ThemisDB ${tag}`,
                    draft: false,
                    prerelease: tag.includes('-rc') || tag.includes('-beta') || tag.includes('-alpha'),
                    generate_release_notes: true,
                  });
                  releaseId = created.data.id;
                  console.log(`Created new release ${releaseId} for tag ${tag}`);
                } else {
                  throw e;
                }
              }
            }

            const releaseDir = 'release';
            const files = fs.readdirSync(releaseDir).filter(f =>
              ['.tar.gz', '.tgz', '.zip', '.deb', '.rpm', '.msi', '.txt'].some(ext => f.endsWith(ext))
            );
            if (files.length === 0) {
              console.log('No release files found — nothing uploaded.');
              return;
            }
            for (const file of files) {
              const filePath = path.join(releaseDir, file);
              const data = fs.readFileSync(filePath);
              console.log(`Uploading ${file} (${data.length} bytes)...`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: releaseId,
                name: file,
                data,
              }).catch(e => console.warn(`Upload failed for ${file}: ${e.message}`));
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish Private (enterprise / hyperscaler / military / minimal)
  # Requires PRIVATE_REGISTRY_TOKEN for private container/package registries
  # ─────────────────────────────────────────────────────────────────────────────
  publish-private:
    name: Publish ${{ github.event_name == 'workflow_dispatch' && inputs.edition || 'private' }} Release
    runs-on: ubuntu-latest
    needs: validate-release-manifest
    if: >
      !cancelled() &&
      needs.validate-release-manifest.result == 'success' && (
        (github.event_name == 'push' && (
          startsWith(github.ref_name, 'enterprise-v') ||
          startsWith(github.ref_name, 'hyperscaler-v') ||
          startsWith(github.ref_name, 'military-v') ||
          startsWith(github.ref_name, 'minimal-v')
        )) ||
        (github.event_name == 'workflow_dispatch' &&
         contains(fromJSON('["enterprise","hyperscaler","military","minimal"]'), inputs.edition))
      )
    environment:
      name: ${{ startsWith(github.ref_name, 'enterprise-v') && 'enterprise-release' || startsWith(github.ref_name, 'hyperscaler-v') && 'hyperscaler-release' || startsWith(github.ref_name, 'military-v') && 'military-release' || startsWith(github.ref_name, 'minimal-v') && 'minimal-release' || inputs.edition == 'enterprise' && 'enterprise-release' || inputs.edition == 'hyperscaler' && 'hyperscaler-release' || inputs.edition == 'military' && 'military-release' || inputs.edition == 'minimal' && 'minimal-release' || 'private-release' }}

    permissions:
      contents: write   # required: create/update GitHub Releases and upload assets
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@v4  # v7.0.1

      - name: Download release packages
        uses: actions/download-artifact@v4  # v4
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: release/

      - name: Validate private edition tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag_name || github.ref_name }}"
          case "${TAG}" in
            enterprise-v*|hyperscaler-v*|military-v*|minimal-v*)
              echo "Private release tag validated: ${TAG}"
              ;;
            *)
              echo "::error::Private release publish was reached with an invalid tag: ${TAG}"
              exit 1
              ;;
          esac

      - name: Determine edition
        id: edition
        shell: bash
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if echo "${TAG}" | grep -q '^enterprise-'; then ED=enterprise
          elif echo "${TAG}" | grep -q '^hyperscaler-'; then ED=hyperscaler
          elif echo "${TAG}" | grep -q '^military-'; then ED=military
          elif echo "${TAG}" | grep -q '^minimal-'; then ED=minimal
          else ED="${{ inputs.edition }}"
          fi
          echo "edition=${ED}" >> "$GITHUB_OUTPUT"

      - name: Publish to private registry
        env:
          PRIVATE_REGISTRY_TOKEN: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}
        run: |
          echo "Publishing ${{ steps.edition.outputs.edition }} release artifacts..."
          # Actual registry push implemented via scripts/publish_private_release.sh
          if [ -f scripts/publish_private_release.sh ]; then
            bash scripts/publish_private_release.sh \
              --edition "${{ steps.edition.outputs.edition }}" \
              --release-dir release/ \
              --token "${PRIVATE_REGISTRY_TOKEN}"
          else
            echo "::warning::scripts/publish_private_release.sh not found — skipping private publish step."
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # Changelog — update CHANGELOG.md after community release
  # ─────────────────────────────────────────────────────────────────────────────
  changelog:
    name: Update Changelog
    needs: publish-community
    if: >
      always() &&
      needs.publish-community.result == 'success'
    uses: ./.github/workflows/release-changelog.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      mode: update
      entry-title: "${{ github.ref_name }}"
      entry-body: "- Released ${{ github.ref_name }} — see GitHub Release for full artifact list."
      section: "Changed"
      target-version: "${{ github.ref_name }}"
      release-date: ""
      key: "release-${{ github.ref_name }}"
      target-branch: "develop"
      dry-run: false
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────────
  # LLM Inference Gate — optional blocking gate for release validation.
  #
  # Activation: include '[llm-gate]' in the commit message, or trigger
  #             via workflow_dispatch.  Required: false for v1-beta;
  #             promote to required: true for GA by updating branch protection.
  #
  # Uses the same build-llm-inference.yml reusable workflow and the canonical
  # HuggingFace TinyLlama GGUF model download path.
  # ─────────────────────────────────────────────────────────────────────────────
  llm-inference-gate:
    name: LLM Inference Gate (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: validate-release-manifest
    # Activate on '[llm-gate]' commit message keyword OR explicit dispatch.
    if: >
      always() &&
      needs.validate-release-manifest.result == 'success' &&
      (
        contains(github.event.head_commit.message, '[llm-gate]') ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # v7.0.1
        with:
          fetch-depth: 1

      - name: Restore model cache
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/models
          key: tinyllama-gguf-q4km-${{ hashFiles('scripts/ci-download-tinyllama.sh') }}
          restore-keys: |
            tinyllama-gguf-q4km-

      - name: Download TinyLlama GGUF
        if: steps.cache-model.outputs.cache-hit != 'true'
        env:
          MODEL_DIR: ${{ github.workspace }}/models
        run: |
          set -euo pipefail
          chmod +x scripts/ci-download-tinyllama.sh
          bash scripts/ci-download-tinyllama.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            librocksdb-dev libgtest-dev libssl-dev zlib1g-dev libzstd-dev \
            libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \
            libyaml-cpp-dev libcurl4-openssl-dev libcpp-httplib-dev libboost-system-dev \
            libboost-dev libboost-filesystem-dev libpugixml-dev

      - name: Build doku.db
        env:
          OUTPUT_DIR: ${{ github.workspace }}/build/test-assets
          REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci-build-doku-db.sh
          bash scripts/ci-build-doku-db.sh

      - name: Configure and build LLM inference tests
        run: |
          set -euo pipefail
          mkdir -p internal llama.cpp vcpkg/downloads
          cmake -S . -B build \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_LLM_INFERENCE_TESTS=ON \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_TEST_MODEL_DIR="${{ github.workspace }}/models" \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
          cmake --build build --parallel 8 \
            --target \
              module_llm_test_llm_tinyllama_inference_focused \
              module_llm_test_llm_doku_rag_focused \
              module_llm_test_llm_adalora_doku_training_focused

      - name: Run all LLM inference CTest suites
        env:
          THEMIS_TEST_MODEL_PATH: ${{ github.workspace }}/models/tinyllama.gguf
          THEMIS_DOKU_DB_PATH: ${{ github.workspace }}/build/test-assets/doku.db.json
        run: |
          set -euo pipefail
          ctest --test-dir build \
            --output-on-failure \
            -j1 \
            --timeout 300 \
            -L "llm_inference|llm_rag_doku|adalora_training" \
            --output-log build/ctest-llm-gate.log \
            || CTEST_EXIT=$?
          echo "LLM gate CTest exit: ${CTEST_EXIT:-0}"
          exit "${CTEST_EXIT:-0}"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4  # v7.0.1
        with:
          name: llm-gate-results-${{ github.run_number }}
          path: |
            build/Testing/
            build/ctest-llm-gate.log
          retention-days: 14
          if-no-files-found: ignore
