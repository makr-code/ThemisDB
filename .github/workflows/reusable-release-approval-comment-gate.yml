name: "Reusable: Release Approval Comment Gate"

on:
  workflow_call:
    inputs:
      issue_label:
        description: "Issue label required before approval commands are processed."
        required: true
        type: string
      match_regex:
        description: "Regular expression matching any supported approval, hold, reject, or rollback command."
        required: true
        type: string
      hold_regex:
        description: "Regular expression identifying a hold command."
        required: true
        type: string
      reject_regex:
        description: "Regular expression identifying a rejection command."
        required: true
        type: string
      rollback_regex:
        description: "Regular expression identifying a rollback command."
        required: true
        type: string
      subject:
        description: "Publication subject inserted into status comments."
        required: true
        type: string
      environment_name:
        description: "GitHub Environment used to protect the publication approval job."
        required: true
        type: string
      environment_url:
        description: "URL displayed for the protected GitHub Environment."
        required: true
        type: string
      target_workflow_id:
        description: "Workflow filename or ID dispatched after a valid maintainer approval."
        required: true
        type: string
      target_ref:
        description: "Branch or tag passed to the target workflow; defaults to develop."
        required: false
        default: develop
        type: string
      dispatch_inputs_json:
        description: "Optional JSON object of additional inputs passed to the target workflow."
        required: false
        default: "{}"
        type: string
      version_input_name:
        description: "Target workflow input receiving the version extracted from the issue; defaults to version."
        required: false
        default: version
        type: string
      approved_label:
        description: "Label applied after publication approval."
        required: false
        default: "distro-approved"
        type: string
      approval_note:
        description: "Optional note included in the approval status comment."
        required: false
        default: ""
        type: string
      require_prerelease_opt_in:
        description: "Require an explicit issue opt-in for WinGet prerelease submissions."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-approval-gate-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  pre-validation:
    name: "Validate: Maintainer and Command"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      gate-skip: ${{ steps.gate.outputs.skip }}
      gate-status: ${{ steps.gate.outputs.status }}
      gate-is-maintainer: ${{ steps.gate.outputs.is_maintainer }}
    steps:
      - name: Validate maintainer and command
        id: gate
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          ISSUE_LABEL: ${{ inputs.issue_label }}
          MATCH_REGEX: ${{ inputs.match_regex }}
          HOLD_REGEX: ${{ inputs.hold_regex }}
          REJECT_REGEX: ${{ inputs.reject_regex }}
          ROLLBACK_REGEX: ${{ inputs.rollback_regex }}
        with:
          script: |
            const issue = context.payload.issue;
            const body = (context.payload.comment.body || '').trim();
            const user = context.payload.comment.user.login;
            const labels = (issue.labels || []).map((l) => l.name);

            if (context.payload.action !== 'created') {
              core.setOutput('skip', 'true');
              core.notice('Skipping: only newly created comments can authorize an action.');
              return;
            }

            if (!labels.includes(process.env.ISSUE_LABEL)) {
              core.setOutput('skip', 'true');
              core.notice(`Skipping: issue label '${process.env.ISSUE_LABEL}' not found`);
              return;
            }

            const exact = (pattern) => new RegExp(`^(?:${pattern})$`, 'i').test(body);
            if (!exact(process.env.MATCH_REGEX)) {
              core.setOutput('skip', 'true');
              core.notice('Skipping: comment is not an exact approval/hold/reject/rollback command');
              return;
            }

            if (issue.state !== 'open') {
              core.setFailed('Approval issue is closed. Reopen or create the correct review issue before requesting approval.');
              return;
            }

            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: user,
            });

            const level = permission.data.permission;
            const isMaintainer = level === 'admin' || level === 'maintain';
            core.setOutput('is_maintainer', isMaintainer ? 'true' : 'false');
            if (!isMaintainer) {
              core.setFailed(`User @${user} does not have maintainer permissions (required: admin or maintain, found: ${level})`);
              return;
            }

            const currentIssue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });
            if (currentIssue.data.state !== 'open') {
              core.setFailed('Approval issue is closed. Reopen or create the correct review issue before requesting approval.');
              return;
            }

            const hold = exact(process.env.HOLD_REGEX);
            const reject = exact(process.env.REJECT_REGEX);
            const rollback = exact(process.env.ROLLBACK_REGEX);
            core.setOutput('status', hold ? 'hold' : reject ? 'reject' : rollback ? 'rollback' : 'approve');

      - name: Handle hold/reject/rollback requests
        if: steps.gate.outputs.skip != 'true' && steps.gate.outputs.is_maintainer == 'true' && steps.gate.outputs.status != 'approve'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const issue = context.payload.issue;
            const user = context.payload.comment.user.login;
            const subject = '${{ inputs.subject }}';
            const status = '${{ steps.gate.outputs.status }}';
            const body = {
              hold: `⏸️ **${subject} Hold**\n\n**Requested By:** @${user}\n**Status:** Publication is paused pending human review.\n**Next Step:** Resolve blockers and request approval again.`,
              reject: `⛔ **${subject} Rejected**\n\n**Rejected By:** @${user}\n**Status:** Publication is not approved.\n**Next Step:** Remediate and request approval again.`,
              rollback: `↩️ **${subject} Rollback Requested**\n\n**Requested By:** @${user}\n**Status:** A rollback or hold is required before publication proceeds.\n**Next Step:** Use rollback workflow and document reason before retrying.`
            }[status];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

  approval-gate:
    name: "Publish: Approved Release Dispatch"
    needs: [pre-validation]
    if: needs.pre-validation.result == 'success' && needs.pre-validation.outputs.gate-skip != 'true' && needs.pre-validation.outputs.gate-is-maintainer == 'true' && needs.pre-validation.outputs.gate-status == 'approve'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: write
    outputs:
      gate-version: ${{ steps.extract_version.outputs.version }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.environment_url }}
    steps:
      - name: Extract version from issue body
        id: extract_version
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/##\s+Release Version:\s+v?(\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)(?:\s|$)/);
            if (!match) {
              core.setFailed('Could not extract release version from issue body. Expected format: "## Release Version: v2.5.0"');
              return;
            }
            core.setOutput('version', match[1]);

      - name: Verify release tag exists
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const version = '${{ steps.extract_version.outputs.version }}';
            const tag = `v${version}`;
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (error) {
              core.setFailed(`Release tag ${tag} does not exist. Cannot publish.`);
            }

      - name: Validate WinGet prerelease authorization
        id: prerelease
        if: inputs.require_prerelease_opt_in
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        with:
          script: |
            const body = context.payload.issue.body || '';
            const fields = body.split(/\r?\n/).filter((line) =>
              /^\s*\*\*WinGet prerelease opt-in:\*\*/i.test(line));
            if (fields.length > 1 || (fields.length === 1 &&
                !/^\s*\*\*WinGet prerelease opt-in:\*\*\s*(?:true|false)\s*$/i.test(fields[0]))) {
              core.setFailed('Invalid or duplicate WinGet prerelease opt-in issue field. Use **WinGet prerelease opt-in:** true or false.');
              return;
            }
            const allowed = fields.length === 1 &&
              /^\s*\*\*WinGet prerelease opt-in:\*\*\s*true\s*$/i.test(fields[0]);
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: `v${process.env.VERSION}`,
            });
            if (release.data.draft) {
              core.setFailed('WinGet requires a published GitHub Release.');
              return;
            }
            if ((process.env.VERSION.includes('-') || release.data.prerelease) && !allowed) {
              core.setFailed('WinGet prereleases require the issue field **WinGet prerelease opt-in:** true.');
              return;
            }
            core.setOutput('allowed', allowed ? 'true' : 'false');

      - name: Dispatch target workflow
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          WORKFLOW_ID: ${{ inputs.target_workflow_id }}
          TARGET_REF: ${{ inputs.target_ref }}
          EXTRA_INPUTS_JSON: ${{ inputs.dispatch_inputs_json }}
          VERSION_INPUT_NAME: ${{ inputs.version_input_name }}
          REQUIRE_PRERELEASE_OPT_IN: ${{ inputs.require_prerelease_opt_in }}
          PRERELEASE_ALLOWED: ${{ steps.prerelease.outputs.allowed }}
          ISSUE_LABEL: ${{ inputs.issue_label }}
        with:
          script: |
            const version = '${{ steps.extract_version.outputs.version }}';
            let extraInputs;
            try {
              extraInputs = JSON.parse(process.env.EXTRA_INPUTS_JSON || '{}');
            } catch {
              core.setFailed('Invalid dispatch_inputs_json; expected a JSON object.');
              return;
            }
            if (!extraInputs || typeof extraInputs !== 'object' || Array.isArray(extraInputs)) {
              core.setFailed('Invalid dispatch_inputs_json; expected a JSON object.');
              return;
            }
            const versionInputName = process.env.VERSION_INPUT_NAME || 'version';
            if (process.env.REQUIRE_PRERELEASE_OPT_IN === 'true') {
              if (!['true', 'false'].includes(process.env.PRERELEASE_ALLOWED)) {
                core.setFailed('WinGet prerelease authorization was not verified.');
                return;
              }
              if (versionInputName === 'allow_prerelease' || Object.hasOwn(extraInputs, 'allow_prerelease')) {
                core.setFailed('allow_prerelease must be authorized by the issue field, not dispatch_inputs_json.');
                return;
              }
              if (process.env.PRERELEASE_ALLOWED === 'true') {
                extraInputs.allow_prerelease = 'true';
              }
            }
            const workflowInputs = { ...extraInputs, [versionInputName]: version };
            const currentIssue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            });
            if (currentIssue.data.state !== 'open') {
              core.setFailed('Approval issue was closed before dispatch. Reopen or create the correct review issue before retrying.');
              return;
            }
            if ((currentIssue.data.body || '') !== (context.payload.issue.body || '') ||
                !(currentIssue.data.labels || []).some((label) => label.name === process.env.ISSUE_LABEL)) {
              core.setFailed('Approval issue body or required label changed before dispatch. Review the current issue and request approval again.');
              return;
            }
            const permission = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            if (!['admin', 'maintain'].includes(permission.data.permission)) {
              core.setFailed('Comment author no longer has maintainer permissions. Request a new maintainer approval.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: process.env.WORKFLOW_ID,
              ref: process.env.TARGET_REF,
              inputs: workflowInputs,
            });

      - name: Comment approval status
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const issue = context.payload.issue;
            const version = '${{ steps.extract_version.outputs.version }}';
            const user = context.payload.comment.user.login;
            const subject = '${{ inputs.subject }}';
            const note = `${{ inputs.approval_note }}`.trim();
            const extra = note ? `\n\n${note}` : '';

            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/${encodeURIComponent('${{ inputs.target_workflow_id }}')}`;
            const body = `✅ **${subject} Approved**\n\n**Approved By:** @${user}\n**Version:** ${version}\n**Environment:** \`${{ inputs.environment_name }}\`\n**Workflow:** [${{ inputs.target_workflow_id }}](${workflowUrl})\n**Status:** Dispatch requested after maintainer approval; publication has not been confirmed. Check the workflow runs for the corresponding execution.${extra}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });

      - name: Update issue label
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['${{ inputs.approved_label }}'],
            });

  summary:
    name: "Validate: Approval Gate Summary"
    needs: [pre-validation, approval-gate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write workflow summary
        if: always()
        run: |
          set -euo pipefail
          gate_skip="${{ needs.pre-validation.outputs.gate-skip }}"
          gate_status="${{ needs.pre-validation.outputs.gate-status }}"
          gate_maintainer="${{ needs.pre-validation.outputs.gate-is-maintainer }}"
          gate_version="${{ needs.approval-gate.outputs.gate-version }}"
          if [[ -z "${gate_status}" ]]; then
            gate_status="n/a"
          fi
          if [[ -z "${gate_maintainer}" ]]; then
            gate_maintainer="n/a"
          fi
          if [[ -z "${gate_version}" ]]; then
            gate_version="n/a"
          fi
          {
            echo "## Validate: Release Approval Comment Gate"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            echo "| Subject | ${{ inputs.subject }} |"
            echo "| Issue Label Gate | ${{ inputs.issue_label }} |"
            echo "| Maintainer | ${gate_maintainer} |"
            echo "| Command Status | ${gate_status} |"
            echo "| Skipped | ${gate_skip} |"
            echo "| Pre-validation result | ${{ needs.pre-validation.result }} |"
            echo "| Protected dispatch result | ${{ needs.approval-gate.result }} |"
            echo "| Extracted Version | ${gate_version} |"
            echo "| Target Workflow | ${{ inputs.target_workflow_id }} |"
            echo "| Environment | ${{ inputs.environment_name }} |"
            echo "| Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  human-loop-escalation:
    name: "Validate: Human-in-the-loop Escalation"
    needs: [pre-validation, approval-gate]
    if: always() && (needs.pre-validation.result == 'failure' || needs.pre-validation.result == 'cancelled' || needs.approval-gate.result == 'failure' || needs.approval-gate.result == 'cancelled') && github.event_name == 'issue_comment'
    uses: ./.github/workflows/reusable-status-flags-and-issues.yml
    permissions:
      contents: read
      issues: write
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
    with:
      operation: upsert_issue
      issue-title: "Decision Required: Release approval gate blocked (${{ inputs.subject }})"
      issue-marker: "<!-- workflow-human-loop:release-approval:${{ inputs.target_workflow_id }} -->"
      labels-to-add: "status/needs-approval,ci/failure"
      issue-body: |
        <!-- workflow-human-loop:release-approval:${{ inputs.target_workflow_id }} -->
        # Human Decision Required: Release Approval Gate

        The reusable release approval gate is blocked and needs maintainer decision.

        - **Subject:** `${{ inputs.subject }}`
        - **Environment:** `${{ inputs.environment_name }}`
        - **Target Workflow:** `${{ inputs.target_workflow_id }}`
        - **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        - **Workflow:** `${{ github.workflow }}`
        - **Ref:** `${{ github.ref }}`
        - **Actor:** `${{ github.actor }}`
        - **Pre-validation result:** `${{ needs.pre-validation.result }}`
        - **Protected dispatch result:** `${{ needs.approval-gate.result }}`

        ## Required Maintainer Decision

        Please decide one of:
        1. Approve and re-run via canonical command
        2. Hold and document blockers
        3. Reject and document remediation requirements
        4. Rollback and document rollback scope
      source-workflow: ${{ github.workflow }}
      source-run-id: ${{ github.run_id }}
      source-sha: ${{ github.sha }}
