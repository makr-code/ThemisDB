name: High Exception Record Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
    paths:
      - '.github/pull_request_template.md'
      - '.github/copilot/REVIEW_SEVERITY_POLICY.md'
      - '.github/prompts/verify-high-exception-record.prompt.md'
      - '.github/scripts/check_pr_high_exception_record.py'
      - '.github/workflows/09-pr-gates_high-exception-record.yml'
  workflow_dispatch:

concurrency:
  group: high-exception-record-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  high-exception-record:
    name: Validate High exception record
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write PR body to file
        if: github.event_name == 'pull_request'
        run: |
          cat > pr_body.md <<'EOF'
          ${{ github.event.pull_request.body }}
          EOF

      - name: Validate PR high-exception section
        if: github.event_name == 'pull_request'
        run: |
          python .github/scripts/check_pr_high_exception_record.py --body-file pr_body.md

      - name: Manual run note
        if: github.event_name != 'pull_request'
        run: |
          echo "Workflow dispatch run: provide PR body via script input in local checks." >> "$GITHUB_STEP_SUMMARY"
