name: CI

# Main CI workflow using pre-built system libraries from apt
# Fast build: ~5-10 minutes vs 30+ minutes with full vcpkg
# Strategy: System libraries (apt) + minimal vcpkg for unavailable packages
#
# Note: This workflow is supplementary to the Git Flow specific workflows.
# Git Flow workflows (feature-ci.yml, develop-ci.yml, etc.) handle branch-specific logic.
# This workflow provides a general-purpose CI check for all PRs.

on:
  workflow_dispatch:

# Concurrency: Cancel in-progress runs for same workflow on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  USE_SYSTEM_LIBS: ON

jobs:
  build-and-test-ubuntu:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure fast-path directories for act
        if: ${{ env.ACT }}
        run: |
          echo "VCPKG_ROOT=/tmp/vcpkg" >> $GITHUB_ENV
          echo "BUILD_DIR=/tmp/themis-build" >> $GITHUB_ENV
          mkdir -p /tmp/themis-build

      - name: Install system dependencies (pre-built)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            librocksdb-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libboost-dev \
            libboost-system-dev \
            libyaml-cpp-dev \
            libzstd-dev \
            libgtest-dev \
            libbenchmark-dev \
            cppcheck clang-tidy flex bison

      - name: Install missing dependencies via vcpkg (minimal set)
        run: |
          # Only install packages NOT available in apt
          # This significantly reduces build time

          VCPKG_DIR="${VCPKG_ROOT:-vcpkg}"

          # Reuse existing vcpkg checkout when present; if bootstrap is missing, replace with a fresh clone
          if [ -f "$VCPKG_DIR/bootstrap-vcpkg.sh" ]; then
            echo "Using existing vcpkg directory at $VCPKG_DIR"
          else
            echo "vcpkg bootstrap not found; cloning fresh copy to $VCPKG_DIR"
            rm -rf "$VCPKG_DIR"
            git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          fi

          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          
          # Enable binary caching for faster builds (93% speedup)
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES" >> $GITHUB_ENV

          # Install with retry logic for transient network failures
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if "$VCPKG_DIR/vcpkg" install --clean-after-build; then
              echo "vcpkg installation successful"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "WARNING: vcpkg installation failed (attempt $RETRY_COUNT/$MAX_RETRIES). Retrying in 10 seconds..."
                sleep 10
              else
                echo "ERROR: vcpkg installation failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done
          
      - name: Configure CMake (System Libraries)
        run: |
          BUILD_DIR="${BUILD_DIR:-build}"
          VCPKG_DIR="${VCPKG_ROOT:-${GITHUB_WORKSPACE}/vcpkg}"
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF

      - name: Build
        run: |
          BUILD_DIR="${BUILD_DIR:-build}"
          cmake --build "$BUILD_DIR" --config ${{ env.BUILD_TYPE }} -j $(nproc)

      - name: Run Unit Tests
        run: |
          BUILD_DIR="${BUILD_DIR:-build}"
          cd "$BUILD_DIR"
          ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --timeout 300 -j $(nproc)

      - name: Run cppcheck
        if: always()
        run: |
          if [ ! -f .cppcheck-suppressions ]; then
            touch .cppcheck-suppressions
          fi
          
          BUILD_DIR="${BUILD_DIR:-build}"
          cppcheck --project="$BUILD_DIR/compile_commands.json" \
            --enable=warning,performance,portability \
            --suppressions-list=.cppcheck-suppressions \
            --error-exitcode=0 \
            --xml --xml-version=2 2> cppcheck-report.xml || true
        continue-on-error: true

      - name: Upload cppcheck report
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: cppcheck-report.xml
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Fast CI using system libraries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build Type: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: Executed" >> $GITHUB_STEP_SUMMARY
          echo "- Platform: Ubuntu Latest" >> $GITHUB_STEP_SUMMARY
