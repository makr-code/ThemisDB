name: CI

# Main CI workflow for C++ build, unit tests and code quality checks
# Fast build using system libraries from apt + minimal vcpkg for unavailable packages

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Concurrency: Cancel in-progress runs for same workflow on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions for security
permissions:
  contents: read

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  build-and-test-linux:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45  # System libs + minimal vcpkg: ~2-3min deps, ~5-8min vcpkg, ~8-10min build, ~5-10min tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies (fast-path)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config flex bison \
            libssl-dev libcurl4-openssl-dev \
            librocksdb-dev \
            libboost-dev libboost-system-dev libboost-container-dev libboost-thread-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libtbb-dev \
            libzstd-dev \
            libgtest-dev \
            cppcheck

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg-cache
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-ubuntu-minimal-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-ubuntu-minimal-

      - name: Setup vcpkg (manifest mode, minimal packages)
        run: |
          set -e
          VCPKG_DIR="${{ github.workspace }}/vcpkg"
          if [ -f "$VCPKG_DIR/bootstrap-vcpkg.sh" ]; then
            echo "Using existing vcpkg directory"
          else
            echo "Cloning vcpkg..."
            git clone https://github.com/Microsoft/vcpkg.git "$VCPKG_DIR"
          fi
          cd "$VCPKG_DIR"
          if [ ! -f vcpkg ]; then
            ./bootstrap-vcpkg.sh
          fi
          echo "$VCPKG_DIR" >> $GITHUB_PATH

      - name: Install vcpkg packages (manifest mode)
        run: |
          cd ${{ github.workspace }}
          ${{ github.workspace }}/vcpkg/vcpkg install --clean-after-build
        env:
          VCPKG_FORCE_SYSTEM_BINARIES: 'true'

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j $(nproc)

      - name: Run Unit Tests
        run: |
          cd build
          ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --timeout 300 -j $(nproc)

      - name: Run cppcheck
        if: always()
        run: |
          cppcheck --project=build/compile_commands.json \
            --enable=warning,performance,portability \
            --suppressions-list=.cppcheck-suppressions \
            --error-exitcode=0 \
            --xml --xml-version=2 2> cppcheck-report.xml || true
        continue-on-error: true

      - name: Upload cppcheck report
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report-ubuntu
          path: cppcheck-report.xml
          retention-days: 7

      - name: Build Summary
        run: |
          echo "## Build Summary (Ubuntu - Fast Path)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Fast build using system libraries + minimal vcpkg" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Build Type: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: Executed" >> $GITHUB_STEP_SUMMARY
          echo "- Platform: Ubuntu Latest" >> $GITHUB_STEP_SUMMARY

