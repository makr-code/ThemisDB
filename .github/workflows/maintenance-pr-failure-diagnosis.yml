name: "Maintenance: PR Failure Diagnosis [Recommend-Only]"

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Recommend-only helper for failed PR workflow runs.
# It never closes issues, never mutates code, and never applies labels.
# It only posts or updates a diagnostic PR comment with failure evidence.

on:
  workflow_run:
    workflows:
      - "Build: Mainline"
      - "Gate: PR Core"
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect diagnosis evidence and preview the PR comment without creating or updating comments."
        required: false
        default: true
        type: boolean
      run_id:
        description: 'Optional workflow run ID for manual diagnosis'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-maintenance-pr-failure-diagnosis-${{ github.event.workflow_run.id || github.ref }}
  cancel-in-progress: false  # Maintenance jobs should not be cancelled

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [diagnose-pr-failure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "PR failure diagnosis recommendations"
          job-results: ${{ toJSON(needs) }}

  diagnose-pr-failure:
    name: "Maintenance: PR Failure Diagnosebericht"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Print context
        run: |
          echo "============================================================"
          echo " Maintenance — PR Failure Diagnosis (Recommend-Only)"
          echo "============================================================"
          echo "  Event            : ${{ github.event_name }}"
          echo "  Workflow run ID  : ${{ github.event.workflow_run.id || inputs.run_id || 'n/a' }}"
          echo "  Workflow name    : ${{ github.event.workflow_run.name || 'manual' }}"
          echo "  Conclusion       : ${{ github.event.workflow_run.conclusion || 'n/a' }}"
          echo "  Trigger actor    : ${{ github.actor }}"
          echo "  Run ID           : ${{ github.run_id }}"
          echo "============================================================"

      - name: Generate and publish recommend-only diagnosis comment
        id: diagnose
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v9.0.0
        env:
          RUN_ID_INPUT: ${{ inputs.run_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const marker = '<!-- maintenance-pr-failure-diagnosis -->';

            const determineRun = async () => {
              if (context.eventName === 'workflow_run') {
                return context.payload.workflow_run;
              }

              const manualRunIdRaw = String(process.env.RUN_ID_INPUT || '').trim();
              if (!manualRunIdRaw) {
                core.notice('No run_id provided on workflow_dispatch; nothing to diagnose.');
                return null;
              }

              const runId = Number.parseInt(manualRunIdRaw, 10);
              if (!Number.isFinite(runId) || runId <= 0) {
                core.setFailed(`Invalid run_id input: ${manualRunIdRaw}`);
                return null;
              }

              const { data } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: runId,
              });
              return data;
            };

            const run = await determineRun();
            if (!run) {
              core.notice('No run determined for diagnosis.');
              core.setOutput('diagnosis_status', 'skipped');
              return;
            }
            const runUrl = run.html_url || `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
            core.setOutput('source_run_url', runUrl);

            if (run.conclusion !== 'failure') {
              core.notice(`Run ${run.id} conclusion is '${run.conclusion}', no failure diagnosis comment required.`);
              core.setOutput('diagnosis_status', 'not-required');
              return;
            }

            if (run.event !== 'pull_request') {
              core.warning(`Run ${run.id} is event '${run.event}', expected 'pull_request'.`);
              core.setOutput('diagnosis_status', 'no-pr-trigger');
              return;
            }

            const prRefs = Array.isArray(run.pull_requests) ? run.pull_requests : [];
            if (prRefs.length === 0) {
              core.warning(`Run ${run.id} has no associated PR refs in payload.`);
              core.setOutput('diagnosis_status', 'no-pr-refs');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });

            const failedJobs = jobs.filter(j => ['failure', 'timed_out', 'cancelled'].includes(j.conclusion));
            const topFailedJobs = failedJobs.slice(0, 6);

            const jobLines = topFailedJobs.map(job => {
              const failedSteps = (job.steps || []).filter(step => ['failure', 'timed_out', 'cancelled'].includes(step.conclusion || ''));
              const firstFailedStep = failedSteps[0]?.name || 'n/a';
              const started = job.started_at ? new Date(job.started_at).toISOString() : 'n/a';
              return `- ${job.name} (conclusion: ${job.conclusion}, first failed step: ${firstFailedStep}, started: ${started})`;
            });

            const shortSha = (run.head_sha || '').slice(0, 8) || 'n/a';
            const workflowName = run.name || 'Unknown Workflow';
            const dryRun = context.eventName === 'workflow_dispatch' && process.env.DRY_RUN === 'true';

            const recommendationLines = [
              '1. Oeffne den fehlgeschlagenen Job und pruefe den ersten fehlerhaften Step.',
              '2. Reproduziere lokal nur den betroffenen Scope (zielgerichteter Build/Test statt Full Run).',
              '3. Wenn der Fehler infra- oder flake-verdaechtig ist: Re-Run + Vergleich der Job-Logs.',
              '4. Wenn reproduzierbar: kleine Fix-PR mit klarer Root-Cause-Notiz und Testnachweis erstellen.'
            ];

            const body = [
              marker,
              `<!-- workflow-name:${workflowName} -->`,
              '## Recommend-Only CI Failure Diagnose',
              '',
              `Workflow: ${workflowName}`,
              `Run: ${runUrl}`,
              `Branch: ${run.head_branch || 'n/a'}`,
              `Commit: ${shortSha}`,
              '',
              'Beobachtung:',
              ...(jobLines.length ? jobLines : ['- Keine fehlgeschlagenen Jobs aus der API abrufbar (moeglicherweise bereits bereinigt).']),
              '',
              'Empfohlene naechste Schritte:',
              ...recommendationLines.map(line => `- ${line}`),
              '',
              'Hinweis: Dieser Workflow ist recommend-only. Keine Labels, keine Auto-Close-Aktionen, keine Code-Aenderungen.',
              `Aktualisiert: ${new Date().toISOString()}`,
            ].join('\n');

            const plannedActions = [];
            for (const prRef of prRefs) {
              const issueNumber = prRef.number;
              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              });

              const existing = comments.find(c =>
                (c.body || '').includes(marker) &&
                (c.body || '').includes(`<!-- workflow-name:${workflowName} -->`)
              );

              if (dryRun) {
                plannedActions.push(`- Would ${existing ? 'update' : 'create'} a diagnosis comment on PR #${issueNumber}.`);
                continue;
              }

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                core.notice(`Updated diagnose comment on PR #${issueNumber}.`);
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                });
                core.notice(`Created diagnose comment on PR #${issueNumber}.`);
              }
            }

            if (dryRun) {
              const summaryLines = [
                '## PR Failure Diagnosis — Dry Run',
                '',
                `- Source run: [${run.id}](${runUrl})`,
                `- Diagnosis comment writes: suppressed`,
                ...(plannedActions.length ? plannedActions : ['- No PR comment changes are required.']),
              ];
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summaryLines.join('\n')}\n`);
              core.setOutput('diagnosis_status', 'dry-run');
              core.notice(`Dry run: diagnosis collected; no comments changed. ${plannedActions.length} PR comment action(s) previewed.`);
              return;
            }

            core.setOutput('diagnosis_status', 'success');
            core.notice(`Diagnosis successfully posted to ${prRefs.length} PR(s).`);
            return;

      - name: Write diagnosis run summary
        if: always()
        env:
          DIAGNOSIS_OUTCOME: ${{ steps.diagnose.outcome }}
          DIAGNOSIS_STATUS: ${{ steps.diagnose.outputs.diagnosis_status || 'not reported' }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id || 'n/a' }}
          SOURCE_RUN_URL: ${{ steps.diagnose.outputs.source_run_url }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          {
            echo "## PR Failure Diagnosis"
            echo "- Mode: recommend-only; this workflow does not modify code or labels."
            if [ -n "${SOURCE_RUN_URL}" ]; then
              echo "- Source workflow run: [\`${SOURCE_RUN_ID}\`](${SOURCE_RUN_URL})"
            else
              echo "- Source workflow run: \`${SOURCE_RUN_ID}\`"
            fi
            echo "- Diagnosis step outcome: \`${DIAGNOSIS_OUTCOME:-not run}\`"
            echo "- Diagnosis status: \`${DIAGNOSIS_STATUS}\`"
            if [ "${DRY_RUN}" = "true" ]; then
              echo "- Manual dry-run: PR comment writes were suppressed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
