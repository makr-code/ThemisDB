name: Auto-Queue Issues for Copilot

# Automatically adds the `queue/copilot` label to issues so the Copilot Issue
# Dispatcher picks them up without any manual label step.
#
# Two modes of operation:
#
#   1. Event-driven (issues: opened)
#      When a new issue is opened the workflow immediately adds `queue/copilot`
#      unless the issue is already blocked or delegated.
#
#   2. Back-fill (workflow_dispatch)
#      Scan ALL open issues and add `queue/copilot` to those that are not yet
#      queued, delegated, or blocked.  Use this once to enqueue existing issues,
#      or whenever a batch of issues needs to be (re-)queued.
#
# Skip conditions (applied in both modes):
#   - Issue already has  copilot/delegated  → already handled, skip.
#   - Issue already has  queue/copilot      → already queued, skip.
#   - Issue already has  blocked  OR  status:blocked  → skip.
#   - (Back-fill only) Issue is closed → skip.

on:
  issues:
    types: [opened]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run – log what would change, no writes'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      max_issues:
        description: 'Maximum issues to queue in this back-fill run (0 = unlimited)'
        required: false
        default: '0'

# Prevent concurrent back-fill runs from racing over the same issue list.
concurrency:
  group: auto-queue-issues
  cancel-in-progress: false

permissions:
  issues: write   # add labels to issues

jobs:
  queue:
    name: Queue issues for the Copilot Dispatcher
    runs-on: ubuntu-latest

    steps:
      - name: Add queue/copilot label (event-driven)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const OWNER        = context.repo.owner;
            const REPO         = context.repo.repo;
            const issueNumber  = context.issue.number;
            const SKIP_LABELS  = new Set(['copilot/delegated', 'queue/copilot', 'blocked', 'status:blocked']);
            const QUEUE_LABEL  = 'queue/copilot';

            const issue = context.payload.issue;
            const labels = (issue.labels ?? []).map(l => l.name);

            if (labels.some(l => SKIP_LABELS.has(l))) {
              core.info(`Issue #${issueNumber} skipped – has one of: ${labels.filter(l => SKIP_LABELS.has(l)).join(', ')}`);
              return;
            }

            await github.rest.issues.addLabels({
              owner: OWNER,
              repo:  REPO,
              issue_number: issueNumber,
              labels: [QUEUE_LABEL],
            });
            core.info(`Added '${QUEUE_LABEL}' to issue #${issueNumber}: "${issue.title}"`);

      - name: Back-fill existing open issues (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const OWNER       = context.repo.owner;
            const REPO        = context.repo.repo;
            const DRY_RUN     = '${{ github.event.inputs.dry_run }}' === 'true';
            const MAX_ISSUES  = parseInt('${{ github.event.inputs.max_issues }}' || '0', 10);
            const QUEUE_LABEL = 'queue/copilot';
            const SKIP_LABELS = new Set(['copilot/delegated', 'queue/copilot', 'blocked', 'status:blocked']);

            core.info(`Back-fill mode  dry_run=${DRY_RUN}  max_issues=${MAX_ISSUES || 'unlimited'}`);

            // Fetch all open issues (excludes PRs via the GitHub Issues list endpoint).
            const allIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner: OWNER, repo: REPO, state: 'open', per_page: 100 }
            );
            // The issues list endpoint includes PRs; filter them out.
            const openIssues = allIssues.filter(i => !i.pull_request);
            core.info(`Open issues found: ${openIssues.length}`);

            let queued = 0;
            let skipped = 0;

            for (const issue of openIssues) {
              if (MAX_ISSUES > 0 && queued >= MAX_ISSUES) {
                core.info(`Reached max_issues limit of ${MAX_ISSUES} – stopping.`);
                break;
              }

              const labels = (issue.labels ?? []).map(l => l.name);
              if (labels.some(l => SKIP_LABELS.has(l))) {
                core.info(`Skip #${issue.number}: has label(s) ${labels.filter(l => SKIP_LABELS.has(l)).join(', ')}`);
                skipped++;
                continue;
              }

              if (DRY_RUN) {
                core.info(`[dry-run] Would add '${QUEUE_LABEL}' to #${issue.number}: "${issue.title}"`);
                queued++;
                continue;
              }

              try {
                await github.rest.issues.addLabels({
                  owner: OWNER,
                  repo:  REPO,
                  issue_number: issue.number,
                  labels: [QUEUE_LABEL],
                });
                core.info(`Queued #${issue.number}: "${issue.title}"`);
                queued++;
              } catch (e) {
                core.warning(`Could not add '${QUEUE_LABEL}' to #${issue.number}: ${e.message}`);
              }
            }

            core.info(`Back-fill complete. Queued: ${queued}  Skipped: ${skipped}`);
            core.setOutput('queued_count',  String(queued));
            core.setOutput('skipped_count', String(skipped));

      - name: Write job summary
        if: always()
        run: |
          echo "## 🤖 Auto-Queue Issues for Copilot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Repository** | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "| **Issue** | #${{ github.event.issue.number }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "New issue received \`queue/copilot\` label – the Copilot Dispatcher will pick it up within ≤ 30 minutes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Dry-run** | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Max issues** | ${{ github.event.inputs.max_issues || '0 (unlimited)' }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Back-filled open issues with \`queue/copilot\` label. The Copilot Dispatcher will process them on its next run." >> "$GITHUB_STEP_SUMMARY"
          fi
