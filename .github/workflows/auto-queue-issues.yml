name: Auto-Queue Issues for Copilot

# Automatically adds the `queue/copilot` label to open issues when they
# receive a label listed in `auto_queue_labels` in `.github/copilot-dispatcher.yml`.
# This closes the manual labelling gap and makes the pipeline fully automatic:
#
#   Issue created + qualifying label added
#     → auto-queue-issues adds queue/copilot
#       → copilot-dispatcher picks it up (≤ 30 min or on next labeled event)
#         → Copilot Coding Agent opens a PR
#
# The workflow skips issues that already carry `queue/copilot`,
# `copilot/delegated`, or any label from `auto_queue_exclude_labels`.

on:
  issues:
    types: [labeled]

# One run per issue at a time; new label events queue, never cancel.
concurrency:
  group: auto-queue-issues-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write   # add queue/copilot label

jobs:
  auto-queue:
    name: Add queue/copilot if qualifying label applied
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (needed to read config)
        uses: actions/checkout@v4
        with:
          # Always check out 'develop' – the branch where Copilot automation
          # config is maintained, consistent with copilot-dispatcher.yml and
          # copilot-readiness-gate.yml.
          ref: develop

      - name: Install js-yaml
        run: npm install js-yaml

      - name: Evaluate and queue issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs   = require('fs');
            const yaml = require(`${process.env.GITHUB_WORKSPACE}/node_modules/js-yaml`);

            // ── Load configuration ──────────────────────────────────────────
            // Fallback defaults are used only when the config file is missing
            // or does not define the key.  The canonical values live in
            // .github/copilot-dispatcher.yml; keep them in sync there.
            let config = {
              auto_queue_labels: [],
              // Fallback exclude list – should match the defaults in copilot-dispatcher.yml.
              auto_queue_exclude_labels: ['blocked', 'status:blocked', 'wontfix', 'duplicate', 'invalid', 'question', 'copilot/delegated', 'queue/copilot'],
            };
            try {
              const raw = fs.readFileSync('.github/copilot-dispatcher.yml', 'utf8');
              config = { ...config, ...yaml.load(raw) };
            } catch (e) {
              core.warning(`Could not read .github/copilot-dispatcher.yml: ${e.message}. Using defaults.`);
            }

            const AUTO_QUEUE_LABELS   = new Set((config.auto_queue_labels   ?? []).map(l => String(l).toLowerCase()));
            const EXCLUDE_LABELS      = new Set((config.auto_queue_exclude_labels ?? []).map(l => String(l).toLowerCase()));
            const QUEUE_LABEL         = 'queue/copilot';
            const OWNER               = context.repo.owner;
            const REPO                = context.repo.repo;

            if (AUTO_QUEUE_LABELS.size === 0) {
              core.info('auto_queue_labels is empty – automatic queueing is disabled. Exiting.');
              return;
            }

            // ── Inspect the label that was just applied ─────────────────────
            const appliedLabel = (context.payload.label?.name ?? '').toLowerCase();
            core.info(`Label applied to issue #${context.payload.issue.number}: "${appliedLabel}"`);

            if (!AUTO_QUEUE_LABELS.has(appliedLabel)) {
              core.info(`"${appliedLabel}" is not in auto_queue_labels – nothing to do.`);
              return;
            }

            // ── Fetch current issue labels (fresh from API, not payload) ────
            const { data: issue } = await github.rest.issues.get({
              owner: OWNER,
              repo: REPO,
              issue_number: context.payload.issue.number,
            });

            if (issue.state !== 'open') {
              core.info(`Issue #${issue.number} is ${issue.state} – skipping.`);
              return;
            }

            const currentLabels = (issue.labels ?? []).map(l => (l.name ?? '').toLowerCase());
            core.info(`Current labels on #${issue.number}: ${currentLabels.join(', ') || '(none)'}`);

            // ── Skip if any exclude label is present ────────────────────────
            const blockedBy = currentLabels.filter(l => EXCLUDE_LABELS.has(l));
            if (blockedBy.length > 0) {
              core.info(`Issue #${issue.number} has excluded label(s) [${blockedBy.join(', ')}] – skipping auto-queue.`);
              return;
            }

            // ── Add queue/copilot ───────────────────────────────────────────
            core.info(`Adding "${QUEUE_LABEL}" to issue #${issue.number} ("${issue.title}").`);
            try {
              await github.rest.issues.addLabels({
                owner: OWNER,
                repo: REPO,
                issue_number: issue.number,
                labels: [QUEUE_LABEL],
              });
              core.info(`"${QUEUE_LABEL}" added to issue #${issue.number}.`);
            } catch (e) {
              core.setFailed(`Failed to add "${QUEUE_LABEL}" to issue #${issue.number}: ${e.message}`);
            }

      - name: Write job summary
        if: always()
        run: |
          echo "## 🏷️ Auto-Queue Issues for Copilot" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Issue** | #${{ github.event.issue.number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Label applied** | \`${{ github.event.label.name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Repository** | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Issues receiving a label from \`auto_queue_labels\` get \`queue/copilot\` added automatically." >> "$GITHUB_STEP_SUMMARY"
