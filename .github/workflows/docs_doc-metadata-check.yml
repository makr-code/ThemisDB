name: Doc Metadata Check

# Enforces YAML front-matter metadata (status, doc_version) on Secondary Docs.
#
# Scope: files listed under --metadata-paths.
# Add more paths here as additional docs receive front-matter.
#
# See docs/de/development/DOC_METADATA.md for the metadata convention.

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'docs/**'
      - 'scripts/docs-lint.py'

  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'scripts/docs-lint.py'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata-check:
    name: Validate Doc Metadata (Secondary Docs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check YAML front-matter metadata
        id: metadata
        run: |
          python3 scripts/docs-lint.py --check-metadata \
            --metadata-paths \
              docs/de/development/DOC_METADATA.md \
              docs/de/development/README.md

      - name: Write job summary
        if: always()
        run: |
          echo "## 📋 Doc Metadata Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates \`status\` and \`doc_version\` YAML front-matter on Secondary Docs." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metadata (status + doc_version) | ${{ steps.metadata.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scope:** \`docs/de/development/DOC_METADATA.md\`, \`docs/de/development/README.md\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "See [DOC_METADATA.md](../../docs/de/development/DOC_METADATA.md) for the full convention." >> "$GITHUB_STEP_SUMMARY"
