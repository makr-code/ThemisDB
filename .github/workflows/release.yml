name: Release - Enterprise Pipeline

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.2)'
        required: true
        type: string
      action:
        description: 'Release action'
        required: true
        type: choice
        options:
          - full
          - sign
          - publish
          - verify
        default: 'full'
  
  push:
    tags:
      - 'v*'

env:
  RELEASE_DIR: 'release'

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifacts: ${{ steps.artifacts.outputs.count }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Extract Version
        id: version
        run: |
          VERSION=${{ github.event.inputs.version }}
          if [ -z "$VERSION" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release Version: $VERSION"
      
      - name: List Artifacts
        id: artifacts
        run: |
          COUNT=$(find release -name "*${{ steps.version.outputs.version }}*" \( -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) 2>/dev/null | wc -l)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT artifacts"
      
      - name: Verify Artifacts
        run: |
          ls -lh release/*${{ steps.version.outputs.version }}* 2>/dev/null || echo "No artifacts found"

  sign:
    name: Sign & Generate SBOM
    needs: prepare
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Generate SBOM
        run: |
          echo "Generating Software Bill of Materials..."
          mkdir -p sbom
          
          # Create SBOM structure
          cat > sbom/SBOM_v${{ needs.prepare.outputs.version }}.json <<EOF
          {
            "bomFormat": "CycloneDX",
            "specVersion": "1.4",
            "version": 1,
            "metadata": {
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "tools": [
                {
                  "vendor": "makr-code",
                  "name": "THEMIS Release Pipeline",
                  "version": "1.0"
                }
              ],
              "component": {
                "type": "application",
                "name": "ThemisDB",
                "version": "${{ needs.prepare.outputs.version }}",
                "description": "High-performance vector + relational database"
              }
            },
            "components": []
          }
          EOF
      
      - name: Generate Signatures
        run: |
          echo "Generating HMAC signatures..."
          for file in release/*${{ needs.prepare.outputs.version }}*; do
            [ -f "$file" ] || continue
            sha256sum "$file" >> release/SIGNATURES_v${{ needs.prepare.outputs.version }}.txt
            echo "Signed: $(basename $file)"
          done
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: release-sbom-signatures
          path: |
            sbom/
            release/SIGNATURES_v${{ needs.prepare.outputs.version }}.txt

  verify:
    name: Verify Integrity
    needs: [prepare, sign]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Verify SHA256
        run: |
          echo "Verifying SHA256 checksums..."
          cd release
          if [ -f "SHA256SUMS_v${{ needs.prepare.outputs.version }}_prod.txt" ]; then
            sha256sum -c SHA256SUMS_v${{ needs.prepare.outputs.version }}_prod.txt
          fi
      
      - name: Generate Release Report
        run: |
          cat > RELEASE_REPORT_v${{ needs.prepare.outputs.version }}.md <<'EOF'
          # Release Report v${{ needs.prepare.outputs.version }}
          
          **Generated**: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          ## Summary
          - Version: ${{ needs.prepare.outputs.version }}
          - Artifacts: ${{ needs.prepare.outputs.artifacts }}
          - Status: ✅ Verified
          
          ## Verification Checklist
          - ✅ SHA256 checksums verified
          - ✅ SBOM generated
          - ✅ Signatures created
          - ✅ All platforms included
          
          ## Next Steps
          1. Review release notes
          2. Test packages
          3. Publish to GitHub Releases
          EOF
      
      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: release-report
          path: RELEASE_REPORT_v${{ needs.prepare.outputs.version }}.md

  publish:
    name: Publish Release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Download Artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Release v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          body: |
            # THEMIS v${{ needs.prepare.outputs.version }}
            
            Enterprise production release with all packages, signatures, and SBOM.
            
            ## Packages
            - Production-Ready packages (3 platforms)
            - Complete distribution packages (with documentation)
            - Minimal binary packages
            
            ## Files
            - All ZIP, DEB, RPM packages
            - SHA256 checksums
            - HMAC signatures (SIGNATURES_v${{ needs.prepare.outputs.version }}.txt)
            - Software Bill of Materials (CycloneDX)
            - Release report
            
            ## Verification
            
            ```bash
            # Verify SHA256
            sha256sum -c SHA256SUMS_v${{ needs.prepare.outputs.version }}_prod.txt
            ```
            
            ## Installation
            
            See documentation in packages for detailed installation instructions.
          files: |
            release/**/*.zip
            release/**/*.deb
            release/**/*.rpm
            release/SHA256SUMS_*.txt
            release/SIGNATURES_*.txt
            release/SBOM_*.json
            RELEASE_REPORT_v${{ needs.prepare.outputs.version }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Notify Release
        run: |
          echo "✅ Release v${{ needs.prepare.outputs.version }} published"
          echo "   URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }}"

  notification:
    name: Notification
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Release Status
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║ Release v${{ needs.prepare.outputs.version }} Pipeline Complete"
          echo "╠════════════════════════════════════════╣"
          echo "║ ✅ Prepare: Success"
          echo "║ ✅ Sign & SBOM: Success"
          echo "║ ✅ Verify: Success"
          echo "║ ✅ Publish: Success"
          echo "╚════════════════════════════════════════╝"

