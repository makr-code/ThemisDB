name: Release - Automated Build & Publish

# Automated release workflow triggered by version tags
# Builds release binaries for all platforms and creates GitHub Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.2.3-alpha, etc.

permissions:
  contents: write  # Required to create releases and upload assets
  packages: write

env:
  BUILD_TYPE: Release

jobs:
  # Extract version from tag
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          
          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Check if this is a prerelease (contains -, like v1.0.0-alpha)
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "✅ Pre-release: $VERSION" >> $GITHUB_STEP_SUMMARY
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "✅ Stable release: $VERSION" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate version matches VERSION file
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION="${{ steps.version.outputs.version }}"
          
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch!"
            echo "::error::VERSION file: $FILE_VERSION"
            echo "::error::Git tag: $TAG_VERSION"
            exit 1
          fi
          
          echo "✅ Version validated: $TAG_VERSION" >> $GITHUB_STEP_SUMMARY

  # Build release binaries for Ubuntu
  build-ubuntu:
    name: Build Release - Ubuntu
    runs-on: ubuntu-latest
    needs: prepare-release
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libssl-dev \
            libcurl4-openssl-dev \
            librocksdb-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libboost-dev \
            libboost-system-dev \
            libyaml-cpp-dev \
            libzstd-dev

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          
          # Enable binary caching for faster builds (93% speedup)
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES" >> $GITHUB_ENV
          ./vcpkg/vcpkg install --clean-after-build

      - name: Configure CMake (Release Build)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_TRACING=ON

      - name: Build Release Binary
        run: cmake --build build --config Release -j $(nproc)

      - name: Package Ubuntu Release
        run: |
          cd build
          cpack -G "TGZ;DEB"
          ls -lh themisdb-*.tar.gz themisdb-*.deb

      - name: Upload Ubuntu artifacts
        uses: actions/upload-artifact@v4
        with:
          name: themis-ubuntu-${{ needs.prepare-release.outputs.version }}
          path: |
            build/themisdb-*.tar.gz
            build/themisdb-*.deb
          retention-days: 90

  # Build release binaries for Windows
  build-windows:
    name: Build Release - Windows
    runs-on: windows-latest
    needs: prepare-release
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg install --clean-after-build

      - name: Configure CMake (Release Build)
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${env:GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DTHEMIS_BUILD_TESTS=OFF `
            -DTHEMIS_BUILD_BENCHMARKS=OFF `
            -DTHEMIS_ENABLE_TRACING=ON

      - name: Build Release Binary
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Package Windows Release
        run: |
          cd build
          cpack -G "ZIP"
          Get-ChildItem ThemisDB-*.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: themis-windows-${{ needs.prepare-release.outputs.version }}
          path: build/ThemisDB-*.zip
          retention-days: 90

  # Build release binaries for macOS
  build-macos:
    name: Build Release - macOS
    runs-on: macos-latest
    needs: prepare-release
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config openssl

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          
          # Enable binary caching for faster builds (93% speedup)
          export VCPKG_BINARY_SOURCES="clear;x-gha,readwrite"
          echo "VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES" >> $GITHUB_ENV
          ./vcpkg/vcpkg install --clean-after-build

      - name: Configure CMake (Release Build)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_TRACING=ON

      - name: Build Release Binary
        run: cmake --build build --config Release -j $(sysctl -n hw.ncpu)

      - name: Package macOS Release
        run: |
          cd build
          cpack -G "TGZ"
          ls -lh themisdb-*.tar.gz

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: themis-macos-${{ needs.prepare-release.outputs.version }}
          path: build/themisdb-*.tar.gz
          retention-days: 90

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare-release, build-ubuntu, build-windows, build-macos]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          TAG_NAME="v$VERSION"
          
          # Try to extract release notes from CHANGELOG
          if [ -f CHANGELOG.md ]; then
            # Extract section for this version
            NOTES=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d')
            
            if [ -n "$NOTES" ]; then
              echo "Release notes found in CHANGELOG.md"
              echo "$NOTES" > release_notes.md
            else
              echo "No specific release notes found, generating from commits"
              git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%an)" > release_notes.md
            fi
          else
            echo "Generating release notes from commits"
            git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD --pretty=format:"- %s (%an)" > release_notes.md || echo "Initial release" > release_notes.md
          fi
          
          # Add build information
          echo "" >> release_notes.md
          echo "## Build Information" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Version**: $VERSION" >> release_notes.md
          echo "- **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> release_notes.md
          echo "- **Commit**: ${{ github.sha }}" >> release_notes.md
          
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: ThemisDB ${{ needs.prepare-release.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          files: |
            release-artifacts/**/*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## 🎉 Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.prepare-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type**: ${{ needs.prepare-release.outputs.is_prerelease == 'true' && 'Pre-release' || 'Stable Release' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "✅ Ubuntu (TGZ, DEB)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Windows (ZIP)" >> $GITHUB_STEP_SUMMARY
          echo "✅ macOS (TGZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> $GITHUB_STEP_SUMMARY
