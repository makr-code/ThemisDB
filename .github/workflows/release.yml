name: Release Build & Package

# Complete release pipeline for ThemisDB
# Uses pre-built binaries strategy to minimize build time and costs
# Builds once, packages for multiple distributions

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1). Uses VERSION file if not specified.'
        required: false
        default: ''
      use_prebuilt:
        description: 'Use pre-built binaries from release/'
        required: false
        type: boolean
        default: true

# Concurrency: Only one release at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel releases

env:
  BUILD_TYPE: Release
  VCPKG_COMMIT_ID: '971828fe0920d00c077c7b5d34798bc45b261ec4'  # master (latest)

permissions:
  contents: write
  packages: write

jobs:
  # Set version from VERSION file if not provided
  set-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get version
        id: get-version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

  # Only build if we don't have pre-built binaries
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Protect against runaway builds
    needs: set-version
    if: github.event.inputs.use_prebuilt != 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg-cache
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-linux-x64-release-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-x64-release-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            libssl-dev libcurl4-openssl-dev \
            pkg-config autoconf automake libtool

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_STATIC_BUILD=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target themis_server -j $(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: themis_server_linux_x64
          path: build/themis_server
          retention-days: 7

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45  # Protect against runaway builds
    needs: set-version
    if: github.event.inputs.use_prebuilt != 'true'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg-cache
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-windows-x64-release-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-windows-x64-release-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DTHEMIS_BUILD_TESTS=OFF `
            -DTHEMIS_BUILD_BENCHMARKS=OFF `
            -DTHEMIS_ENABLE_TRACING=OFF `
            -DTHEMIS_STATIC_BUILD=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target themis_server -j $env:NUMBER_OF_PROCESSORS

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: themis_server_windows_x64
          path: build/${{ env.BUILD_TYPE }}/themis_server.exe
          retention-days: 7

  # Package pre-built binaries
  package-linux-x64:
    name: Package Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Packaging is fast
    needs: [set-version, build-linux-x64]
    if: always() && (needs.build-linux-x64.result == 'success' || github.event.inputs.use_prebuilt == 'true')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use pre-built binary from release/
        if: github.event.inputs.use_prebuilt == 'true'
        run: |
          mkdir -p build
          if [ -f release/themis_server_linux ]; then
            cp release/themis_server_linux build/themis_server
          elif [ -f release/themis_server_linux_x64 ]; then
            cp release/themis_server_linux_x64 build/themis_server
          else
            echo "ERROR: No pre-built binary found in release/. Expected release/themis_server_linux or release/themis_server_linux_x64."
            exit 1
          fi
          chmod +x build/themis_server

      - name: Download built binary
        if: github.event.inputs.use_prebuilt != 'true'
        uses: actions/download-artifact@v4
        with:
          name: themis_server_linux_x64
          path: build

      - name: Create package structure
        run: |
          mkdir -p release-linux-x64/bin
          chmod +x build/themis_server
          cp build/themis_server release-linux-x64/bin/
          
          # Copy optional resources with explicit checks
          if [ -d config ]; then
            cp -r config release-linux-x64/
          else
            echo "Warning: config directory not found"
          fi
          if [ -d docs ]; then
            cp -r docs release-linux-x64/
          else
            echo "Warning: docs directory not found"
          fi
          if [ -d examples ]; then
            cp -r examples release-linux-x64/
          else
            echo "Warning: examples directory not found"
          fi
          if [ -f README.md ]; then
            cp README.md release-linux-x64/
          else
            echo "Warning: README.md not found"
          fi
          if [ -f LICENSE ]; then
            cp LICENSE release-linux-x64/
          else
            echo "Warning: LICENSE not found"
          fi
          
      - name: Create archive
        run: |
          VERSION="${{ needs.set-version.outputs.version }}"
          cd release-linux-x64
          tar czf ../themisdb-${VERSION}-linux-x64.tar.gz .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: themisdb-*.tar.gz
          retention-days: 7

  package-windows-x64:
    name: Package Windows x64
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Packaging is fast
    needs: [set-version, build-windows-x64]
    if: always() && (needs.build-windows-x64.result == 'success' || github.event.inputs.use_prebuilt == 'true')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Use pre-built binary from release/
        if: github.event.inputs.use_prebuilt == 'true'
        run: |
          mkdir -p build
          VERSION="${{ needs.set-version.outputs.version }}"
          # Try version-specific file first, then fall back to any Windows zip
          if [ -f "release/themis-${VERSION}-windows-x64.zip" ]; then
            unzip "release/themis-${VERSION}-windows-x64.zip" -d build/
          else
            shopt -s nullglob
            files=(release/themis-*-windows-x64.zip)
            if [ ${#files[@]} -gt 0 ]; then
              unzip "${files[0]}" -d build/
            else
              echo "ERROR: No pre-built Windows binary found in release/"
              exit 1
            fi
            shopt -u nullglob
          fi

      - name: Download built binary
        if: github.event.inputs.use_prebuilt != 'true'
        uses: actions/download-artifact@v4
        with:
          name: themis_server_windows_x64
          path: build

      - name: Create package structure
        run: |
          mkdir -p release-windows-x64/bin
          # Try different possible locations for the binary
          if [ -f build/themis_server.exe ]; then
            cp build/themis_server.exe release-windows-x64/bin/
          elif [ -f build/bin/themis_server.exe ]; then
            cp build/bin/themis_server.exe release-windows-x64/bin/
          elif [ -f build/Release/themis_server.exe ]; then
            cp build/Release/themis_server.exe release-windows-x64/bin/
          else
            echo "ERROR: themis_server.exe not found in build directory"
            exit 1
          fi
          
          # Copy optional resources with explicit checks
          if [ -d config ]; then
            cp -r config release-windows-x64/
          else
            echo "Warning: config directory not found"
          fi
          if [ -d docs ]; then
            cp -r docs release-windows-x64/
          else
            echo "Warning: docs directory not found"
          fi
          if [ -d examples ]; then
            cp -r examples release-windows-x64/
          else
            echo "Warning: examples directory not found"
          fi
          if [ -f README.md ]; then
            cp README.md release-windows-x64/
          else
            echo "Warning: README.md not found"
          fi
          if [ -f LICENSE ]; then
            cp LICENSE release-windows-x64/
          else
            echo "Warning: LICENSE not found"
          fi

      - name: Create archive
        run: |
          VERSION="${{ needs.set-version.outputs.version }}"
          cd release-windows-x64
          zip -r ../themisdb-${VERSION}-windows-x64.zip .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: themisdb-*.zip
          retention-days: 7

  build-deb-package:
    name: Build DEB Package
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Package build
    needs: [package-linux-x64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: package-linux-x64

      - name: Extract and build DEB
        run: |
          tar xzf themisdb-*.tar.gz
          sudo apt-get update && sudo apt-get install -y dpkg-dev debhelper
          if [ -f build-deb.sh ]; then
            chmod +x build-deb.sh
            ./build-deb.sh
          else
            echo "ERROR: build-deb.sh not found in repository root"
            echo "This script is required to build DEB packages."
            echo "Expected location: ./build-deb.sh"
            echo "The script should handle Debian package creation from the extracted archive."
            exit 1
          fi

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: "*.deb"
          retention-days: 7

  build-rpm-package:
    name: Build RPM Package
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Package build
    needs: [package-linux-x64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: package-linux-x64

      - name: Extract and build RPM
        run: |
          tar xzf themisdb-*.tar.gz
          sudo apt-get update && sudo apt-get install -y rpm
          if [ -f build-rpm.sh ]; then
            chmod +x build-rpm.sh
            ./build-rpm.sh
          else
            echo "ERROR: build-rpm.sh not found in repository root"
            echo "This script is required to build RPM packages."
            echo "Expected location: ./build-rpm.sh"
            echo "The script should handle RPM package creation from the extracted archive."
            exit 1
          fi

      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: package-rpm
          path: "*.rpm"
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Release creation
    needs: [package-linux-x64, package-windows-x64, build-deb-package, build-rpm-package]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://github.com/makr-code/ThemisDB/releases
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: package-*

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" \) -exec sha256sum {} \; > ../SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.rpm
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [package-linux-x64, package-windows-x64, build-deb-package, build-rpm-package]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version: ${{ github.event.inputs.version || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "### Strategy: ${{ github.event.inputs.use_prebuilt == 'true' && 'Pre-built binaries' || 'Fresh build' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Package Results" >> $GITHUB_STEP_SUMMARY
          echo "- Linux x64 Package: ${{ needs.package-linux-x64.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Windows x64 Package: ${{ needs.package-windows-x64.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- DEB Package: ${{ needs.build-deb-package.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- RPM Package: ${{ needs.build-rpm-package.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts Created" >> $GITHUB_STEP_SUMMARY
          echo "- themisdb-*-linux-x64.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- themisdb-*-windows-x64.zip" >> $GITHUB_STEP_SUMMARY
          echo "- themisdb_*.deb" >> $GITHUB_STEP_SUMMARY
          echo "- themisdb-*.rpm" >> $GITHUB_STEP_SUMMARY

