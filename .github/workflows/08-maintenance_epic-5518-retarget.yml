name: EPIC 5518 PR Retarget

# Automated workflow to retarget PRs to the EPIC 5518 branch when they are
# marked as part of EPIC #5518.
#
# Policy (issue #5545):
#   When a PR implements a subtask of EPIC #5518, include either:
#   - "Part of makr-code/ThemisDB#5518" in the PR body (recommended)
#   - OR add the label 'epic/5518'
#
#   The automation will then retarget the PR to epic/hybrid-boundaries-5518.
#
# Triggers:
#   - pull_request_target: when opened, edited, labeled, unlabeled, synchronize
#
# Governance note:
#   This workflow is classified as Maintenance (lane 08). It only modifies
#   PR base branches when specific signals are present. It is not a required
#   PR gate and does not block PR merge.

on:
  pull_request_target:
    types: [opened, edited, labeled, unlabeled, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  retarget-to-epic-5518:
    name: Retarget to EPIC 5518 Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for EPIC 5518 markers
        id: check-epic
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const epicIssueRef = "makr-code/ThemisDB#5518";
            const epicIssueRefAlt = "#5518";
            const epicLabel = "epic/5518";
            const epicBranch = "epic/hybrid-boundaries-5518";
            const currentBase = pr.base.ref;

            // Check if PR body contains EPIC reference
            const bodyHasEpicRef = pr.body && (
              pr.body.includes(`Part of ${epicIssueRef}`) ||
              pr.body.includes(`Part of ${epicIssueRefAlt}`)
            );

            // Check if PR has epic/5518 label
            const hasEpicLabel = pr.labels.some(label =>
              label.name === epicLabel
            );

            // Determine if we should retarget
            const shouldRetarget = (bodyHasEpicRef || hasEpicLabel) &&
                                   currentBase !== epicBranch;

            core.setOutput("should-retarget",
              shouldRetarget ? "true" : "false");
            core.setOutput("epic-branch", epicBranch);
            core.setOutput("current-base", currentBase);
            core.setOutput("has-epic-label",
              hasEpicLabel ? "true" : "false");
            core.setOutput("body-has-epic-ref",
              bodyHasEpicRef ? "true" : "false");

            console.log(`PR #${pr.number}: ${pr.title}`);
            console.log(`  Current base: ${currentBase}`);
            console.log(`  Has epic/5518 label: ${hasEpicLabel}`);
            console.log(`  Body has EPIC reference: ${bodyHasEpicRef}`);
            console.log(`  Should retarget: ${shouldRetarget}`);

      - name: Verify EPIC branch exists
        if: steps.check-epic.outputs.should-retarget == 'true'
        id: verify-branch
        uses: actions/github-script@v7
        with:
          script: |
            const epicBranch = "${{ steps.check-epic.outputs.epic-branch }}";
            try {
              const { data: branch } = await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: epicBranch,
              });
              console.log(`✓ EPIC branch exists: ${epicBranch}`);
              console.log(`  commit: ${branch.commit.sha.substring(0, 7)}`);
              core.setOutput("branch-exists", "true");
            } catch (error) {
              if (error.status === 404) {
                core.warning(`EPIC branch does not exist: ${epicBranch}`);
                core.setOutput("branch-exists", "false");
              } else {
                throw error;
              }
            }

      - name: Retarget PR to EPIC branch
        id: retarget-branch
        if: |
          steps.check-epic.outputs.should-retarget == 'true' &&
          steps.verify-branch.outputs.branch-exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const epicBranch = "${{ steps.check-epic.outputs.epic-branch }}";

            try {
              const { data: updated } = await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                base: epicBranch,
              });

              console.log(`✓ Retargeted PR #${pr.number} to ${epicBranch}`);
              core.setOutput("retargeted", "true");
            } catch (error) {
              core.error(`Failed to retarget PR: ${error.message}`);
              core.setOutput("retargeted", "false");
              throw error;
            }

      - name: Add informational comment
        if: |
          steps.check-epic.outputs.should-retarget == 'true' &&
          steps.verify-branch.outputs.branch-exists == 'true' &&
          steps.retarget-branch.outputs.retargeted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const epicBranch =
              "${{ steps.check-epic.outputs.epic-branch }}";
            const hasLabel =
              "${{ steps.check-epic.outputs.has-epic-label }}" === "true";
            const marker = hasLabel
              ? "label `epic/5518`"
              : "marker \"Part of makr-code/ThemisDB#5518\"";

            const comment =
              `🎯 **EPIC 5518 Automation**: This PR was detected with ` +
              `${marker} and has been automatically retargeted to ` +
              `**${epicBranch}**.\n\n` +
              `If this is incorrect, maintainers can manually change ` +
              `the base branch. For questions about EPIC policy, see ` +
              `[makr-code/ThemisDB#5545](https://github.com/makr-code/` +
              `ThemisDB/issues/5545).`;

            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: comment,
              });
              console.log(
                `✓ Posted informational comment on PR #${pr.number}`);
            } catch (error) {
              core.warning(`Failed to post comment: ${error.message}`);
            }

      - name: Workflow summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const branchExists =
              "${{ steps.verify-branch.outputs.branch-exists }}" || "N/A";
            const retargeted =
              "${{ steps.retarget-branch.outputs.retargeted }}" || "N/A";

            const summary =
              `## 🎯 EPIC 5518 PR Retarget Summary\n\n` +
              `| Key | Value |\n` +
              `|-----|-------|\n` +
              `| PR Number | ` +
              `${{ github.event.pull_request.number }} |\n` +
              `| Current Base | ` +
              `${{ steps.check-epic.outputs.current-base }} |\n` +
              `| Has epic/5518 Label | ` +
              `${{ steps.check-epic.outputs.has-epic-label }} |\n` +
              `| Body Has EPIC Reference | ` +
              `${{ steps.check-epic.outputs.body-has-epic-ref }} |\n` +
              `| Should Retarget | ` +
              `${{ steps.check-epic.outputs.should-retarget }} |\n` +
              `| Branch Exists | ${branchExists} |\n` +
              `| Retargeted | ${retargeted} |\n`;

            core.summary = summary;
            console.log(summary);
