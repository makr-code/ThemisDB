name: "Reusable: Docs-to-ThemisDB Database Builder"

# Rechenaufwand-Score: R=3 (K=2, L=3, N=3) | last-calibrated: 2026-08-31
# Reusable workflow that compiles the themis_docs_builder C++ tool and
# ingests any folder structure (docs/, legals/, runbooks/, …) into a
# ThemisDB-compatible RocksDB database.
#
# Caller pattern:
#   uses: ./.github/workflows/reusable-docs-db-builder.yml
#   with:
#     input_dir:   docs            # folder relative to repo root
#     namespace:   com.themisdb.docs
#     output_name: docs-db
#
# Outdated detection (two-layer):
#   1. paths: trigger in the calling workflow → only fires when source folder changes.
#   2. Content hash check inside this job → skip build when file tree is unchanged
#      (guards against re-runs triggered by unrelated changes).

on:
  workflow_call:
    inputs:
      input_dir:
        description: >
          Source folder to ingest (relative to repo root, e.g. docs, legals, runbooks).
        type: string
        required: true
      namespace:
        description: >
          ThemisDB namespace for document isolation (reverse-domain notation,
          e.g. com.themisdb.docs).
        type: string
        required: true
      output_name:
        description: >
          Name for the output artifact and cache key (e.g. docs-db, legals-db).
          Must be unique per input_dir.
        type: string
        required: true
      formats:
        description: >
          Comma-separated list of input formats to process.
          Supported: markdown, html, text, json.
        type: string
        required: false
        default: 'markdown'
      exclude_patterns:
        description: >
          Comma-separated glob patterns to exclude from ingestion.
        type: string
        required: false
        default: '*.tmp,*.bak,*.draft,draft_*,temp_*'
      artifact_retention_days:
        description: 'Retention period for the uploaded database artifact (days).'
        type: number
        required: false
        default: 30
      force_rebuild:
        description: 'Force rebuild even if hash matches cached build.'
        type: boolean
        required: false
        default: false

jobs:
  build-db:
    name: "Build: ${{ inputs.output_name }} (${{ inputs.input_dir }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Layer 2: Content hash check ─────────────────────────────────────
      # Computes a stable SHA-256 fingerprint of the entire input folder tree.
      # If a cached build with this exact hash already exists, the build is
      # skipped to avoid redundant compilation and ingestion.

      - name: Compute input-directory content hash
        id: hash
        shell: bash
        run: |
          if [ ! -d "${{ inputs.input_dir }}" ]; then
            echo "::error::Input directory '${{ inputs.input_dir }}' does not exist."
            exit 1
          fi
          HASH=$(find "${{ inputs.input_dir }}" -type f | LC_ALL=C sort \
                 | xargs sha256sum 2>/dev/null | sha256sum | awk '{print $1}')
          echo "value=${HASH}" >> "$GITHUB_OUTPUT"
          echo "Input hash: ${HASH}"

      - name: Restore hash-based build cache
        id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .db-cache/${{ inputs.output_name }}.sha
          key: docs-db-${{ inputs.output_name }}-${{ steps.hash.outputs.value }}

      - name: Determine whether rebuild is needed
        id: check
        shell: bash
        run: |
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild requested."
          elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Cache hit — input hash unchanged. Skipping rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "No cache hit — rebuild required."
          fi

      # ── Build themis_docs_builder ────────────────────────────────────────

      - name: Install build dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            librocksdb-dev \
            libyaml-cpp-dev

      - name: Build themis_docs_builder
        if: steps.check.outputs.skip != 'true'
        run: |
          cmake -S tools/themis_docs_builder \
                -B /tmp/builder-build \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_YAML=ON \
                -DBUILD_TESTS=OFF
          cmake --build /tmp/builder-build --parallel

      # ── Ingest source folder into ThemisDB database ──────────────────────

      - name: Build ThemisDB database from ${{ inputs.input_dir }}/
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p output-db

          # Expand comma-separated format list into --format flags
          FORMAT_FLAGS=()
          IFS=',' read -ra FORMATS <<< "${{ inputs.formats }}"
          for fmt in "${FORMATS[@]}"; do
            fmt="${fmt// /}"   # strip spaces
            [ -n "$fmt" ] && FORMAT_FLAGS+=(--format "$fmt")
          done

          # Expand comma-separated exclude list into --exclude flags
          EXCLUDE_FLAGS=()
          IFS=',' read -ra EXCLUDES <<< "${{ inputs.exclude_patterns }}"
          for pat in "${EXCLUDES[@]}"; do
            pat="${pat// /}"
            [ -n "$pat" ] && EXCLUDE_FLAGS+=(--exclude "$pat")
          done

          /tmp/builder-build/themis_docs_builder \
            --input   "${{ inputs.input_dir }}" \
            --output  "output-db/${{ inputs.output_name }}.db" \
            --namespace "${{ inputs.namespace }}" \
            "${FORMAT_FLAGS[@]}" \
            "${EXCLUDE_FLAGS[@]}" \
            --recursive \
            --validate \
            --verbose

      # ── Cache update ─────────────────────────────────────────────────────

      - name: Save content hash to cache
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p .db-cache
          echo "${{ steps.hash.outputs.value }}" > ".db-cache/${{ inputs.output_name }}.sha"

      # ── Upload database artifact ──────────────────────────────────────────

      - name: Upload database artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.output_name }}
          path: output-db/${{ inputs.output_name }}.db
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            {
              echo "### ✅ Database up-to-date — no rebuild required"
              echo "Artifact \`${{ inputs.output_name }}\` was already current (hash matched cached build)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ✅ Database rebuilt"
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Input directory | \`${{ inputs.input_dir }}/\` |"
              echo "| Namespace | \`${{ inputs.namespace }}\` |"
              echo "| Artifact | \`${{ inputs.output_name }}\` |"
              echo "| Content hash | \`${{ steps.hash.outputs.value }}\` |"
              echo "| Retention | ${{ inputs.artifact_retention_days }} days |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
