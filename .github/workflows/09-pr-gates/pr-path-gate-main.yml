name: PR Path Gate · main (Community)

# Enforces the Community-only release policy on pull requests targeting main.
#
# POLICY
# ------
#   main is the Community/MINIMAL release lane.  It must not contain:
#     • docker/hyperscaler/**   – Hyperscaler Docker images
#     • docker/enterprise/**    – Enterprise Docker images
#     • helm/**                 – Helm charts (Hyperscaler/Enterprise only)
#     • operator/**             – Kubernetes Operator (Hyperscaler only)
#     • deploy/**               – Deployment artefacts (higher editions)
#     • packaging/enterprise/** – Enterprise packaging
#     • packaging/hyperscaler/**– Hyperscaler packaging
#
#   Community documentation (docs/**) is always allowed, even files that
#   mention "enterprise" or "hyperscaler" in their names.
#   Root-level Community Dockerfiles (Dockerfile, Dockerfile.community-simple, etc.)
#   and docker/community/** are explicitly allowed.
#
# RATIONALE
# ---------
#   Source code stays fully public.  The gate prevents runtime/deploy
#   artefacts for higher editions from landing in the Community release lane.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-path-gate-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  path-gate:
    name: Community-only path policy
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}" HEAD > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Enforce Community-only path policy
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          # Blocked path prefixes – deploy/runtime artefacts for higher editions.
          # Paths are anchored at the repo root (no leading slash).
          BLOCKED_PATTERNS=(
            "docker/hyperscaler/"
            "docker/enterprise/"
            "helm/"
            "operator/"
            "deploy/"
            "packaging/enterprise/"
            "packaging/hyperscaler/"
          )

          VIOLATIONS=()
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            for pattern in "${BLOCKED_PATTERNS[@]}"; do
              if [[ "$file" == ${pattern}* ]]; then
                VIOLATIONS+=("$file  (blocked: ${pattern}*)")
                break
              fi
            done
          done < /tmp/changed_files.txt

          if [[ ${#VIOLATIONS[@]} -gt 0 ]]; then
            echo "::error::PR to 'main' contains higher-edition deploy/runtime artefacts that are not allowed in the Community release lane."
            echo ""
            echo "Blocked files:"
            for v in "${VIOLATIONS[@]}"; do
              echo "  ❌  $v"
              echo "::error::Blocked path: $v"
            done
            echo ""
            echo "Explanation:"
            echo "  'main' is the Community release lane."
            echo "  Hyperscaler/Enterprise Docker images, Helm charts, Kubernetes Operators,"
            echo "  and higher-edition deploy/packaging artefacts must stay in the"
            echo "  'enterprise' or 'hyperscaler' release branches."
            echo ""
            echo "How to fix:"
            echo "  • Remove the blocked files from this PR."
            echo "  • Target the 'enterprise' or 'hyperscaler' branch instead, if you intend"
            echo "    to update those release lanes."
            echo "  • Community documentation (docs/**) referencing enterprise/hyperscaler"
            echo "    features is allowed and does not need to be removed."
            {
              echo "GATE_PASSED=false"
              echo "VIOLATION_COUNT=${#VIOLATIONS[@]}"
              VIOLATION_LIST=""
              for v in "${VIOLATIONS[@]}"; do
                VIOLATION_LIST+="- \`${v}\`\n"
              done
              echo "VIOLATION_LIST<<EOF"
              printf '%b' "$VIOLATION_LIST"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅  All changed files comply with the Community-only path policy."
          echo "GATE_PASSED=true" >> "$GITHUB_OUTPUT"
          echo "VIOLATION_COUNT=0" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔒 PR Path Gate — Community release lane (main)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.gate.outputs.GATE_PASSED }}" == "true" ]]; then
            echo "✅ **PASSED** — No higher-edition deploy/runtime artefacts detected." >> "$GITHUB_STEP_SUMMARY"
          else
            VIOLATIONS="${{ steps.gate.outputs.VIOLATION_COUNT }}"
            echo "❌ **FAILED** — ${VIOLATIONS} blocked file(s) found." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Blocked files" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.gate.outputs.VIOLATION_LIST }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Blocked path prefixes" >> "$GITHUB_STEP_SUMMARY"
            echo "| Path prefix | Edition |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`docker/hyperscaler/**\` | Hyperscaler |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`docker/enterprise/**\` | Enterprise |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`helm/**\` | Hyperscaler/Enterprise |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`operator/**\` | Hyperscaler |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`deploy/**\` | Enterprise/Hyperscaler |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`packaging/enterprise/**\` | Enterprise |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`packaging/hyperscaler/**\` | Hyperscaler |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target branch:** \`main\` (Community release lane)" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR:** #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> See [RELEASE_STRATEGY.md](../../RELEASE_STRATEGY.md) for the full branch model and PR rules." >> "$GITHUB_STEP_SUMMARY"
