name: Validate Roadmap

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'roadmap.md'
      - 'ROADMAP.md'
      - 'future_enhancement.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'roadmap.md'
      - 'ROADMAP.md'
      - 'future_enhancement.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  validate-roadmap:
    needs: ci-scope-classifier
    name: Validate Roadmap Structure
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate roadmap structure
        run: |
          python .github/scripts/validate_roadmap.py

      - name: Write job summary
        if: always()
        run: |
          echo "## 🗺️ Validate Roadmap Structure" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Validator** | \`.github/scripts/validate_roadmap.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Files checked: \`roadmap.md\`, \`ROADMAP.md\`, \`future_enhancement.md\`" >> "$GITHUB_STEP_SUMMARY"
