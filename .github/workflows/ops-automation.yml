name: 'Ops Automation'

on:
  schedule:
    # Monthly operations review on 1st at 6 AM UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - access-review
          - incident-drill
          - performance-baseline
          - all
        default: 'all'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Access control review
  access-review:
    name: Access Control Review
    runs-on: ubuntu-latest
    if: inputs.operation == 'all' || inputs.operation == 'access-review' || inputs.operation == ''
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review access patterns
        run: |
          echo "## 👥 Access Control Review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Review Date:** $(date -u +"%Y-%m-%d")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Items to Review" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Repository collaborators and permissions" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Branch protection rules" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Deploy keys and secrets" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] GitHub Actions permissions" >> $GITHUB_STEP_SUMMARY
          echo "- [ ] Third-party integrations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Workflow Permissions Audit" >> $GITHUB_STEP_SUMMARY
          
          # Check for overly permissive workflows
          WRITE_ALL=$(grep -r "permissions:.*write-all" .github/workflows/ 2>/dev/null | wc -l)
          if [ "$WRITE_ALL" -gt 0 ]; then
            echo "⚠️ Found $WRITE_ALL workflow(s) with write-all permissions" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No write-all permissions found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create access review issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[OPS] Monthly Access Control Review - ${date}`,
              body: `# Monthly Access Control Review\n\n` +
                    `**Date:** ${date}\n\n` +
                    `## Review Checklist\n\n` +
                    `- [ ] Review repository collaborators and their permissions\n` +
                    `- [ ] Verify branch protection rules are appropriate\n` +
                    `- [ ] Audit deploy keys and secrets\n` +
                    `- [ ] Review GitHub Actions permissions\n` +
                    `- [ ] Check third-party integrations\n` +
                    `- [ ] Verify 2FA is enabled for all collaborators\n\n` +
                    `## Actions\n\n` +
                    `Please complete this review and close this issue when done.`,
              labels: ['ops', 'security', 'access-review']
            });
            console.log(`Created issue #${issue.data.number}`);
        continue-on-error: true

  # Incident response drill
  incident-drill:
    name: Incident Response Drill
    runs-on: ubuntu-latest
    if: inputs.operation == 'all' || inputs.operation == 'incident-drill' || inputs.operation == ''
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run incident drill
        run: |
          echo "## 🚨 Incident Response Drill" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Drill Date:** $(date -u +"%Y-%m-%d")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scenarios" >> $GITHUB_STEP_SUMMARY
          echo "1. **Database corruption:** Recovery procedures" >> $GITHUB_STEP_SUMMARY
          echo "2. **Security breach:** Incident response protocol" >> $GITHUB_STEP_SUMMARY
          echo "3. **Service outage:** Communication and restoration" >> $GITHUB_STEP_SUMMARY
          echo "4. **Data loss:** Backup restoration procedures" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation" >> $GITHUB_STEP_SUMMARY
          
          # Check if incident response docs exist
          if [ -f "docs/operations/incident-response.md" ]; then
            echo "✅ Incident response documentation found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Incident response documentation missing" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "docs/operations/runbook.md" ]; then
            echo "✅ Operational runbook found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Operational runbook missing" >> $GITHUB_STEP_SUMMARY
          fi

  # Performance baseline update
  performance-baseline:
    name: Update Performance Baseline
    runs-on: ubuntu-latest
    if: inputs.operation == 'all' || inputs.operation == 'performance-baseline' || inputs.operation == ''
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run benchmarks
        uses: ./.github/workflows/reusable-benchmark.yml
        with:
          benchmark-suite: 'all'
          baseline-ref: 'main'
          upload-results: true
          update-baseline: true
        secrets: inherit

      - name: Baseline update summary
        run: |
          echo "## 📊 Performance Baseline Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Update Date:** $(date -u +"%Y-%m-%d")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Performance baselines have been updated." >> $GITHUB_STEP_SUMMARY

  # Operations summary
  summary:
    name: Operations Summary
    runs-on: ubuntu-latest
    needs: [access-review, incident-drill, performance-baseline]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          echo "# 🔧 Operations Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Operation | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Access Review | ${{ needs.access-review.result == 'success' && '✅' || (needs.access-review.result == 'skipped' && '⏭️' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Incident Drill | ${{ needs.incident-drill.result == 'success' && '✅' || (needs.incident-drill.result == 'skipped' && '⏭️' || '❌') }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Baseline | ${{ needs.performance-baseline.result == 'success' && '✅' || (needs.performance-baseline.result == 'skipped' && '⏭️' || '❌') }} |" >> $GITHUB_STEP_SUMMARY

      - name: Send notification
        uses: ./.github/actions/notification
        with:
          status: success
          message: 'Monthly operations automation completed'
          channels: 'summary'
