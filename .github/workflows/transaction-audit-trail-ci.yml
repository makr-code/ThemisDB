name: Transaction Audit Trail CI

# Validates TransactionAuditor — append-only transaction audit log (v1.8.0).
# (roadmap:transaction:v1.8.0:transaction-audit-trail)
# Covers:
#   AC-1  Auditing disabled by default; record() is a no-op before enableAuditing(true)
#   AC-2  enableAuditing(true/false) toggles recording
#   AC-3  isEnabled() reflects the current auditing state
#   AC-4  record() appends one AuditRecord when enabled
#   AC-5  record() is a no-op when disabled
#   AC-6  queryAuditLog() returns all records with no filters
#   AC-7  queryAuditLog() filters by user_id
#   AC-8  queryAuditLog() filters by start_time (lower bound inclusive)
#   AC-9  queryAuditLog() filters by end_time (upper bound inclusive)
#   AC-10 queryAuditLog() applies combined start + end time range
#   AC-11 queryAuditLog() respects limit (most-recent-first)
#   AC-12 queryAuditLog() with limit=0 returns all matching records
#   AC-13 queryAuditLog() sorts most-recent-first
#   AC-14 size() reflects the stored record count
#   AC-15 clear() empties the log; size() returns 0 afterwards
#   AC-16 exportToKafka() returns error status (not yet implemented)
#   AC-17 exportToS3() returns error status (not yet implemented)
#   AC-18 AuditRecord::Result enum has COMMITTED, ABORTED, DEADLOCK values
#   AC-19 Operation::Type enum has PUT, DELETE, ADD_EDGE, DELETE_EDGE, ADD_VECTOR
#   AC-20 Concurrent record() from multiple threads are all stored correctly
#   AC-21 All AuditRecord fields are preserved on round-trip
#   AC-22 Combined user_id + time range filter returns correct subset
#   AC-23 record() after clear() starts a fresh log
#   AC-24 Operations list inside AuditRecord is preserved
#   AC-25 Default limit of 1000 is respected
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/transaction/transaction_auditor.h'
      - 'include/transaction/isolation_level.h'
      - 'src/transaction/transaction_auditor.cpp'
      - 'tests/test_transaction_auditor.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/transaction-audit-trail-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/transaction/transaction_auditor.h'
      - 'include/transaction/isolation_level.h'
      - 'src/transaction/transaction_auditor.cpp'
      - 'tests/test_transaction_auditor.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/transaction-audit-trail-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  transaction-audit-trail-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Transaction audit trail tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_transaction_auditor_focused

      - name: Run TransactionAuditorFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R TransactionAuditorFocusedTests \
                --output-on-failure \
                --timeout 60 \
                2>&1 | tee auditor_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_transaction_auditor_focused \
            --gtest_output="xml:auditor_gtest.xml" \
            2>&1 | tee auditor_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-audit-trail-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/auditor_ctest.txt
            build/auditor_gtest.xml
            build/auditor_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 Transaction Audit Trail CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Validates TransactionAuditor: enableAuditing, record, queryAuditLog (filters, limit, sort)," >> "$GITHUB_STEP_SUMMARY"
          echo "size, clear, exportToKafka/S3 (not-implemented stubs), and thread-safe concurrent recording." >> "$GITHUB_STEP_SUMMARY"
