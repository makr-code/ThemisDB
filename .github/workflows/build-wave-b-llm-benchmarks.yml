name: "Build: Wave B LLM Benchmarks"

# Rechenaufwand-Score: R=8 (K=8, L=8, N=8) | last-calibrated: 2026-09-23
# Trigger policy: Manual dispatch-only; hardware-intensive benchmark execution.
# Experimental Wave-B LLM inference + wiki embedding benchmarking.
#
# Purpose: Validate performance of:
#   - TinyLlama inference (Q4_K_M quantization)
#   - doku.db vector similarity search (HNSW index)
#   - AdaLoRA fine-tuning integration
#   - Multi-GPU index operations (Wave A GPU bridge)
#
# Scenarios:
#   - small_10k:  10k documents, validate inference + embedding baseline
#   - medium_1m:  1M documents, stress test retrieval latency
#   - large_10m:  10M documents, measure scaling limits
#   - all:        Run all scenarios sequentially (6–8 hours total)
#
# Inputs:
#   - scenario: Benchmark scale (small_10k/medium_1m/large_10m/all)
#
# Output: Benchmark results uploaded as workflow artifact + optional issue comment
# Trigger: Manual `gh workflow run` or GitHub UI dispatch
# Non-blocking: Does not affect releases or PR gates

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Benchmark scenario'
        required: true
        default: 'small_10k'
        type: choice
        options:
          - small_10k
          - medium_1m
          - large_10m
          - all


concurrency:
  group: build-wave-b-llm-${{ github.ref }}
  cancel-in-progress: true
env:
  WAVE_B_DATA_DIR: benchmarks/wave_b_data
  WAVE_B_RESULTS_DIR: benchmarks/wave_b_results

jobs:
  hardware-detection:
    name: 'Hardware Detection'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    outputs:
      hardware_profile: ${{ steps.detect.outputs.hardware_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Hardware
        id: detect
        shell: bash
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo "GPU detected"
            echo "hardware_profile=gpu" >> "$GITHUB_OUTPUT"
          else
            echo "CPU fallback"
            echo "hardware_profile=cpu" >> "$GITHUB_OUTPUT"
          fi

  data-preparation:
    name: 'Data Preparation'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: hardware-detection
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Data
        shell: bash
        run: |
          mkdir -p "${{ env.WAVE_B_DATA_DIR }}"
          mkdir -p "${{ env.WAVE_B_RESULTS_DIR }}"
          echo "Data preparation for ${{ inputs.scenario }}"

  benchmark-execution:
    name: 'Benchmark (${{ matrix.scenario }})'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: data-preparation
    timeout-minutes: 120
    strategy:
      matrix:
        scenario: ${{ fromJson(inputs.scenario == 'all' && '["small_10k", "medium_1m", "large_10m"]' || format('["{0}"]', inputs.scenario)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Execute Benchmark
        shell: bash
        run: |
          echo "Executing benchmark: ${{ matrix.scenario }}"
          mkdir -p ${{ env.WAVE_B_RESULTS_DIR }}
          echo '{"status": "phase_1_skeleton", "scenario": "${{ matrix.scenario }}"}' > ${{ env.WAVE_B_RESULTS_DIR }}/results_${{ matrix.scenario }}.json

      - name: Upload Results
        uses: actions/upload-artifact@v5
        with:
          name: wave-b-results-${{ matrix.scenario }}
          path: ${{ env.WAVE_B_RESULTS_DIR }}/
          retention-days: 30
