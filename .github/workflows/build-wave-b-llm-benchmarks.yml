name: "Build: Wave B LLM Benchmarks"

# Rechenaufwand-Score: R=8 (K=8, L=8, N=8) | last-calibrated: 2026-10-22
# Trigger policy: Manual dispatch-only; hardware-intensive benchmark execution.
# Wave-B benchmarking with real benchmark binaries (no skeleton placeholders).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Benchmark scenario'
        required: true
        default: 'small_10k'
        type: choice
        options:
          - small_10k
          - medium_1m
          - large_10m
          - all
      benchmark_filter:
        description: 'Optional Google Benchmark filter regex override'
        required: false
        default: ''
        type: string
      benchmark_suite:
        description: 'Thematic benchmark suite'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - baseline
          - core
          - index
          - search
          - llm
      execution_backend:
        description: 'Execution backend'
        required: true
        default: 'gbenchmark'
        type: choice
        options:
          - gbenchmark
          - ctest
      benchmark_framework:
        description: 'Benchmark framework mode'
        required: true
        default: 'gbenchmark'
        type: choice
        options:
          - gbenchmark
          - cbenchmark

concurrency:
  group: build-wave-b-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hardware-detection:
    name: "Validate: Hardware Detection"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hardware_profile: ${{ steps.detect.outputs.hardware_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Hardware
        id: detect
        shell: bash
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            echo "GPU detected"
            echo "hardware_profile=gpu" >> "$GITHUB_OUTPUT"
          else
            echo "CPU fallback"
            echo "hardware_profile=cpu" >> "$GITHUB_OUTPUT"
          fi

  benchmark-execution:
    name: "Benchmark: (${{ matrix.scenario }})"
    uses: ./.github/workflows/reusable-benchmark-build-run-report.yml
    needs: hardware-detection
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJson(inputs.scenario == 'all' && '["small_10k", "medium_1m", "large_10m"]' || format('["{0}"]', inputs.scenario)) }}
    with:
      scenario_label: ${{ matrix.scenario }}
      benchmark_suite: ${{ inputs.benchmark_suite }}
      benchmark_filter: ${{ inputs.benchmark_filter }}
      execution_backend: ${{ inputs.execution_backend }}
      benchmark_framework: ${{ inputs.benchmark_framework }}
      benchmark_min_time: ${{ matrix.scenario == 'small_10k' && '0.10s' || matrix.scenario == 'medium_1m' && '0.25s' || '0.50s' }}
      benchmark_repetitions: 3
      hardware_profile: ${{ needs.hardware-detection.outputs.hardware_profile }}
      timeout_minutes: 180
      run_hybrid_break_even: true
      enable_ctest_validation: true
