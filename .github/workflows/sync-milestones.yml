name: Sync Milestones from Roadmap

# Manually triggered via the GitHub Actions UI or GitHub CLI.
# Parses src/**/ROADMAP.md for (Target: QN YYYY) + (Issue: #NNN) annotations,
# creates missing milestones, and assigns the referenced open issues.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (show what would change, no writes)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      audit_only:
        description: 'Only generate docs/issue-milestone-audit.md (no milestone writes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      verbose:
        description: 'Verbose output (one line per issue)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  issues: write    # update issue milestones
  contents: write  # commit the refreshed audit report

jobs:
  sync:
    name: Sync milestones from roadmap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build flags
        id: flags
        run: |
          FLAGS=""
          [ "${{ github.event.inputs.dry_run }}"    = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "${{ github.event.inputs.audit_only }}" = "true" ] && FLAGS="$FLAGS --audit-only"
          [ "${{ github.event.inputs.verbose }}"    = "true" ] && FLAGS="$FLAGS --verbose"
          echo "flags=$FLAGS" >> "$GITHUB_OUTPUT"

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/sync-milestones-from-roadmap.py ${{ steps.flags.outputs.flags }}

      - name: Commit refreshed audit report
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/issue-milestone-audit.md
          if git diff --cached --quiet; then
            echo "Audit report unchanged – nothing to commit."
          else
            git commit -m "chore: refresh issue-milestone audit report"
            git push
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Sync Milestones from Roadmap" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | ${{ github.event.inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Audit only** | ${{ github.event.inputs.audit_only }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Verbose** | ${{ github.event.inputs.verbose }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Repository** | ${{ github.repository }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Parses \`src/**/ROADMAP.md\` for \`(Target: QN YYYY)\` + \`(Issue: #NNN)\` annotations." >> "$GITHUB_STEP_SUMMARY"
