name: "Gate: PR Core [Edition & License]"

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Enforces edition compatibility and license feature gates.
# Validates that enterprise/hyperscaler/military features do not leak to community builds.
# Ensures license_feature field matches feature availability per edition.

on:
  workflow_call: {}
  push:
    branches: [develop]
    paths:
      - 'plugins/**/plugin.toml'
      - 'plugins/**/plugin.json'
      - 'plugins/**/CMakeLists.txt'
      - 'plugins/**/*.cmake'
      - 'plugins/**/*.in'
      - 'plugins/**/*.txt'
      - 'plugins/**/*.c'
      - 'plugins/**/*.cc'
      - 'plugins/**/*.cpp'
      - 'plugins/**/*.cxx'
      - 'plugins/**/*.h'
      - 'plugins/**/*.hh'
      - 'plugins/**/*.hpp'
      - 'plugins/**/*.hxx'
      - 'include/**/*.h'
      - 'include/**/*.hh'
      - 'include/**/*.hpp'
      - 'include/**/*.hxx'
      - 'include/**/*.ipp'
      - 'include/**/*.tpp'
      - 'src/**/*.c'
      - 'src/**/*.cc'
      - 'src/**/*.cpp'
      - 'src/**/*.cxx'
      - 'src/**/*.h'
      - 'src/**/*.hh'
      - 'src/**/*.hpp'
      - 'src/**/*.hxx'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: edition-license-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  edition-license-validation:
    name: "Validate: Edition & License Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate edition matrix consistency
        id: check-edition-matrix
        run: |
          set -euo pipefail
          
          TARGET_BRANCH="${{ github.base_ref || 'develop' }}"
          echo "Target branch: $TARGET_BRANCH"
          
          case "$TARGET_BRANCH" in
            community)  ALLOWED_EDITIONS="public" ;;
            minimal)    ALLOWED_EDITIONS="public" ;;
            enterprise) ALLOWED_EDITIONS="public,enterprise" ;;
            hyperscaler) ALLOWED_EDITIONS="public,enterprise,hyperscaler" ;;
            military)   ALLOWED_EDITIONS="public,enterprise,military" ;;
            develop)    ALLOWED_EDITIONS="public,enterprise,hyperscaler,military" ;;
            *)          ALLOWED_EDITIONS="public" ;;
          esac
          
          echo "Allowed editions for $TARGET_BRANCH: $ALLOWED_EDITIONS"
          
          INVALID_EDITIONS=0
          MANIFEST_FILES=$(find plugins -name "plugin.toml" -o -name "plugin.json" 2>/dev/null || echo "")
          
          while IFS= read -r manifest_file; do
            [ -z "$manifest_file" ] && continue
            DECLARED_EDITIONS=$(grep -oP 'allowed_editions\s*=\s*"?\K[^"]*' "$manifest_file" || echo "")
            [ -z "$DECLARED_EDITIONS" ] && continue
            for edition in $(echo "$DECLARED_EDITIONS" | tr ',' '\n'); do
              edition=$(echo "$edition" | xargs)
              if ! echo "$ALLOWED_EDITIONS" | grep -q "$edition"; then
                echo "::error::$manifest_file declares edition '$edition' not allowed on branch '$TARGET_BRANCH'"
                ((INVALID_EDITIONS++)) || true
              fi
            done
          done <<< "$MANIFEST_FILES"
          
          if [ $INVALID_EDITIONS -gt 0 ]; then
            ERR="$INVALID_EDITIONS manifest(s) have incompatible edition declarations for branch '$TARGET_BRANCH'"
            echo "::error::$ERR"
            echo "error_summary=$ERR" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          echo "✓ Edition matrix validation passed"

      - name: Validate license_feature gates
        id: check-license-gates
        run: |
          set -euo pipefail
          
          TARGET_BRANCH="${{ github.base_ref || 'develop' }}"
          
          if [[ "$TARGET_BRANCH" == "community" ]] || [[ "$TARGET_BRANCH" == "minimal" ]]; then
            INVALID_LICENSES=0
            MANIFEST_FILES=$(find plugins -name "plugin.toml" -o -name "plugin.json" 2>/dev/null || echo "")
            
            while IFS= read -r manifest_file; do
              [ -z "$manifest_file" ] && continue
              if grep -qE 'license_feature.*=.*"(ENTERPRISE|HYPERSCALER|MILITARY)"' "$manifest_file"; then
                echo "::error::$manifest_file declares enterprise license feature in community-targetable plugin"
                ((INVALID_LICENSES++)) || true
              fi
            done <<< "$MANIFEST_FILES"
            
            if [ $INVALID_LICENSES -gt 0 ]; then
              ERR="$INVALID_LICENSES plugin(s) have restricted license features in community build"
              echo "::error::$ERR"
              echo "error_summary=$ERR" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          
          echo "✓ License feature validation passed"

      - name: Detect enterprise/hyperscaler/military markers in community paths
        id: check-edition-markers
        run: |
          set -euo pipefail
          
          TARGET_BRANCH="${{ github.base_ref || 'develop' }}"
          
          if [[ "$TARGET_BRANCH" == "community" ]] || [[ "$TARGET_BRANCH" == "minimal" ]]; then
            BASE_REF="${{ github.base_ref || 'develop' }}"
            git fetch origin "${BASE_REF}" --depth=1
            CHANGED_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" || echo "")
            
            ENTERPRISE_MARKERS=0
            
            while IFS= read -r file; do
              if [[ "$file" =~ \.(cpp|h|hpp)$ ]]; then
                if grep -q "THEMIS_ENTERPRISE_ONLY\|THEMIS_HYPERSCALER_ONLY\|THEMIS_MILITARY_ONLY" "$file"; then
                  if ! grep -q "#ifdef THEMIS_ENTERPRISE_ONLY\|#ifdef THEMIS_HYPERSCALER_ONLY\|#ifdef THEMIS_MILITARY_ONLY" "$file"; then
                    echo "::warning::Edition marker found in $file but may not be properly guarded"
                  fi
                fi
              fi
            done <<< "$CHANGED_FILES"
            
            if [ $ENTERPRISE_MARKERS -gt 0 ]; then
              echo "::warning::Found $ENTERPRISE_MARKERS potential edition-marker issues"
            fi
          fi
          
          echo "✓ Enterprise/military marker detection passed"

      - name: Collect error summary for comment
        id: collect-errors
        if: failure()
        run: |
          SUMMARY=""
          for step_out in \
            "${{ steps.check-edition-matrix.outputs.error_summary }}" \
            "${{ steps.check-license-gates.outputs.error_summary }}"; do
            [ -n "$step_out" ] && SUMMARY="${SUMMARY}${step_out}\n"
          done
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"

      - name: Post edition validation result
        if: always() && github.event_name == 'pull_request'
        uses: ./.github/actions/post-failure-comment
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          gate-name: Edition & License Validation
          workflow-file: gate-pr-edition-license.yml
          job-status: ${{ job.status }}
          checklist: |
            - ${{ steps.check-edition-matrix.outcome == 'success' && '✅' || '❌' }} Edition matrix consistency check
            - ${{ steps.check-license-gates.outcome == 'success' && '✅' || '❌' }} License feature gate validation
            - ${{ steps.check-edition-markers.outcome == 'success' && '✅' || '❌' }} Enterprise/military marker detection
            - ℹ️ Target branch: `${{ github.base_ref || 'develop' }}`
          error-summary: ${{ steps.collect-errors.outputs.summary }}

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Validate: Edition & License Validation"
            echo ""
            echo "| Check | Outcome |"
            echo "|-------|---------|"
            echo "| Edition matrix consistency | ${{ steps.check-edition-matrix.outcome }} |"
            echo "| License feature gates | ${{ steps.check-license-gates.outcome }} |"
            echo "| Edition marker detection | ${{ steps.check-edition-markers.outcome }} |"
            echo "| Target branch | ${{ github.base_ref || 'develop' }} |"
            echo "| Job result | ${{ job.status }} |"
            echo "| Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  human-loop-escalation:
    name: "Validate: Human-in-the-loop Escalation"
    needs: [edition-license-validation]
    if: always() && needs.edition-license-validation.result != 'success' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-status-flags-and-issues.yml
    permissions:
      contents: read
      issues: write
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
    with:
      operation: upsert_issue
      issue-title: "Decision Required: Edition and license gate failed"
      issue-marker: "<!-- workflow-human-loop:edition-license -->"
      labels-to-add: "status/needs-approval,ci/failure"
      issue-body: |
        <!-- workflow-human-loop:edition-license -->
        # Human Decision Required: Edition & License Gate

        The edition/license policy gate failed and needs maintainer decision.

        - **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        - **Workflow:** `${{ github.workflow }}`
        - **Ref:** `${{ github.ref }}`
        - **Result:** `${{ needs.edition-license-validation.result }}`

        ## Required Decision
        1. Fix now in current PR
        2. Approve temporary waiver with rationale and follow-up issue
        3. Remove/adjust affected change scope
      source-workflow: ${{ github.workflow }}
      source-run-id: ${{ github.run_id }}
      source-sha: ${{ github.sha }}

  human-loop-resolution:
    name: "Validate: Human-in-the-loop Resolution Labels"
    needs: [edition-license-validation]
    if: always() && needs.edition-license-validation.result == 'success' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-status-flags-and-issues.yml
    permissions:
      contents: read
      issues: write
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
    with:
      operation: replace_status_group
      issue-marker: "<!-- workflow-human-loop:edition-license -->"
      status-group: "status/needs-approval,status/needs-attention,status/needs-triage,status/resolved"
      labels-to-add: "status/resolved"
      labels-to-remove: "ci/failure"
      allow-missing: ${{ 'true' }}
      source-workflow: ${{ github.workflow }}
      source-run-id: ${{ github.run_id }}
      source-sha: ${{ github.sha }}
