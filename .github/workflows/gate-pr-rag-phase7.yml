name: "Gate: PR RAG Phase 7 (Freshness SLA)"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'include/rag/ingestion_latency_monitor.h'
      - 'include/rag/staleness_aware_router.h'
      - 'include/rag/index_refresh_scheduler.h'
      - 'include/rag/freshness_sla_enforcer.h'
      - 'src/rag/ingestion_latency_monitor.cpp'
      - 'src/rag/staleness_aware_router.cpp'
      - 'src/rag/index_refresh_scheduler.cpp'
      - 'src/rag/freshness_sla_enforcer.cpp'
      - 'tests/rag/test_ingestion_latency_monitor.cpp'
      - 'tests/rag/test_staleness_aware_router.cpp'
      - 'tests/rag/test_index_refresh_scheduler.cpp'
      - 'tests/rag/test_freshness_sla_enforcer.cpp'
      - '.github/workflows/gate-pr-rag-phase7.yml'
      - '.github/workflows/reusable-rag-phase-gate.yml'

concurrency:
  group: rag-phase7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  issues: write
  checks: write

jobs:
  phase7_validation:
    uses: ./.github/workflows/reusable-rag-phase-gate.yml
    with:
      phase_id: "7"
      phase_title: "Phase 7 Freshness SLA"
      headers_json: '["include/rag/ingestion_latency_monitor.h","include/rag/staleness_aware_router.h","include/rag/index_refresh_scheduler.h","include/rag/freshness_sla_enforcer.h"]'
      impls_json: '["src/rag/ingestion_latency_monitor.cpp","src/rag/staleness_aware_router.cpp","src/rag/index_refresh_scheduler.cpp","src/rag/freshness_sla_enforcer.cpp"]'
      tests_json: '["tests/rag/test_ingestion_latency_monitor.cpp","tests/rag/test_staleness_aware_router.cpp","tests/rag/test_index_refresh_scheduler.cpp","tests/rag/test_freshness_sla_enforcer.cpp"]'
      grep_checks_json: '[{"file":"src/rag/freshness_sla_enforcer.cpp","pattern":"healthy|degraded|critical","error":"SLA state machine not implemented"},{"file":"src/rag/freshness_sla_enforcer.cpp","pattern":"UpdateCompliance|Breach|Recovery","error":"SLA enforcement methods not found"}]'
      labels_csv: "rag-phase7-validated,quality/freshness-sla"

  phase7_tests:
    name: "Validate: Phase 7 Tests"
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: ubuntu-22.04
      shell: bash
      setup_command: |
        sudo apt-get update && sudo apt-get install -y \
          cmake ninja-build g++ libfmt-dev libspdlog-dev nlohmann-json3-dev libboost-filesystem-dev libboost-system-dev libgtest-dev
        cargo install sccache || (curl -L https://github.com/mozilla/sccache/releases/download/v0.7.7/sccache-v0.7.7-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp && sudo mv /tmp/sccache-v0.7.7-x86_64-unknown-linux-musl/sccache /usr/local/bin/)
      configure_command: ":"
      build_command: ":"
      validation_command: |
        set -euo pipefail
        mkdir -p /tmp/phase7-build
        build_phase7_test() {
          local test_name="$1"
          shift
          g++ -std=c++20 -pthread \
            -I"${GITHUB_WORKSPACE}/include" \
            "$@" \
            -lgtest -lgtest_main \
            -o "/tmp/phase7-build/${test_name}"
        }

        build_phase7_test \
          test_ingestion_latency_monitor \
          "${GITHUB_WORKSPACE}/tests/rag/test_ingestion_latency_monitor.cpp" \
          "${GITHUB_WORKSPACE}/src/rag/ingestion_latency_monitor.cpp"

        build_phase7_test \
          test_staleness_aware_router \
          "${GITHUB_WORKSPACE}/tests/rag/test_staleness_aware_router.cpp" \
          "${GITHUB_WORKSPACE}/src/rag/staleness_aware_router.cpp" \
          "${GITHUB_WORKSPACE}/src/rag/ingestion_latency_monitor.cpp"

        build_phase7_test \
          test_index_refresh_scheduler \
          "${GITHUB_WORKSPACE}/tests/rag/test_index_refresh_scheduler.cpp" \
          "${GITHUB_WORKSPACE}/src/rag/index_refresh_scheduler.cpp"

        build_phase7_test \
          test_freshness_sla_enforcer \
          "${GITHUB_WORKSPACE}/tests/rag/test_freshness_sla_enforcer.cpp" \
          "${GITHUB_WORKSPACE}/src/rag/freshness_sla_enforcer.cpp" \
          "${GITHUB_WORKSPACE}/src/rag/index_refresh_scheduler.cpp" \
          "${GITHUB_WORKSPACE}/src/rag/ingestion_latency_monitor.cpp"

        for test_binary in \
          /tmp/phase7-build/test_ingestion_latency_monitor \
          /tmp/phase7-build/test_staleness_aware_router \
          /tmp/phase7-build/test_index_refresh_scheduler \
          /tmp/phase7-build/test_freshness_sla_enforcer; do
          "${test_binary}" --gtest_color=yes
        done
      summary_title: "Validate: Phase 7 Tests"
      timeout_minutes: "30"

  gate_status:
    name: "Validate: Gate Status Summary"
    runs-on: ubuntu-22.04
    needs: [phase7_validation, phase7_tests]
    if: always()
    steps:
      - name: Check Gate Status
        run: |
          if [ "${{ needs.phase7_validation.result }}" = "success" ] && [ "${{ needs.phase7_tests.result }}" = "success" ]; then
            echo "✅ Phase 7 Freshness SLA Gate: PASS"
            exit 0
          fi
          echo "❌ Phase 7 Freshness SLA Gate: FAIL"
          exit 1

  wrapper_summary:
    name: "Validate: Wrapper Summary"
    runs-on: ubuntu-22.04
    needs: [phase7_validation, phase7_tests, gate_status]
    if: always()
    steps:
      - name: Write summary
        run: |
          {
            echo "## Validate: RAG Phase 7 Wrapper Summary"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| phase7_validation | ${{ needs.phase7_validation.result }} |"
            echo "| phase7_tests | ${{ needs.phase7_tests.result }} |"
            echo "| gate_status | ${{ needs.gate_status.result }} |"
            echo "| Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
