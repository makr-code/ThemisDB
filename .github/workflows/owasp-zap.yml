name: OWASP ZAP Security Scan

on:
  # Run on pull requests
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'include/**'
      - '.github/workflows/owasp-zap.yml'
  
  # Run on pushes to main/develop
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'include/**'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Weekly scheduled scan
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  zap_baseline_scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start ThemisDB server for scanning
        run: |
          # Start server in background for ZAP to scan
          # Use Docker for consistent environment
          docker pull themisdb/themisdb:latest || echo "No pre-built image, will build locally"
          
          # Start server with minimal configuration
          docker run -d \
            --name themis-zap-target \
            -p 8080:8080 \
            -e THEMIS_AUTH_ENABLED=true \
            -e THEMIS_RATE_LIMIT_ENABLED=true \
            themisdb/themisdb:latest || {
              echo "Docker start failed, skipping ZAP scan"
              exit 0
            }
          
          # Wait for server to be ready
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done' || {
            echo "Server failed to start, skipping ZAP scan"
            docker logs themis-zap-target
            exit 0
          }
      
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.github/zap/rules.tsv'
          cmd_options: '-a -j -l INFO'
          fail_action: false  # Don't fail build on vulnerabilities (report only)
          allow_issue_writing: true
      
      - name: Upload ZAP Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-results
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
      
      - name: Stop ThemisDB server
        if: always()
        run: |
          docker stop themis-zap-target || true
          docker rm themis-zap-target || true
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read markdown report if it exists
            let comment = '## OWASP ZAP Security Scan Results\n\n';
            
            try {
              const report = fs.readFileSync('report_md.md', 'utf8');
              comment += report;
            } catch (e) {
              comment += 'Scan completed. See artifacts for detailed results.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  zap_full_scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    # Only run full scan on schedule or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start ThemisDB server for scanning
        run: |
          docker run -d \
            --name themis-zap-full-target \
            -p 8080:8080 \
            -e THEMIS_AUTH_ENABLED=true \
            -e THEMIS_RATE_LIMIT_ENABLED=true \
            themisdb/themisdb:latest || exit 0
          
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done' || exit 0
      
      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.github/zap/rules.tsv'
          cmd_options: '-a -j -l INFO'
          fail_action: false
          allow_issue_writing: true
      
      - name: Upload Full Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-scan-results
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 90
      
      - name: Stop ThemisDB server
        if: always()
        run: |
          docker stop themis-zap-full-target || true
          docker rm themis-zap-full-target || true

  zap_api_scan:
    name: OWASP ZAP API Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start ThemisDB server for scanning
        run: |
          docker run -d \
            --name themis-zap-api-target \
            -p 8080:8080 \
            -e THEMIS_AUTH_ENABLED=true \
            -e THEMIS_RATE_LIMIT_ENABLED=true \
            themisdb/themisdb:latest || exit 0
          
          timeout 60 bash -c 'until curl -f http://localhost:8080/health; do sleep 2; done' || exit 0
      
      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.6.0
        with:
          target: 'http://localhost:8080'
          format: 'openapi'
          api_file: 'openapi/openapi.yaml'
          rules_file_name: '.github/zap/rules.tsv'
          cmd_options: '-a -j'
          fail_action: false
          allow_issue_writing: false
      
      - name: Upload API Scan Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-scan-results
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 30
      
      - name: Stop ThemisDB server
        if: always()
        run: |
          docker stop themis-zap-api-target || true
          docker rm themis-zap-api-target || true
