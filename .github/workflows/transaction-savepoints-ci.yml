name: Transaction Savepoints CI

# Triggered on every push / PR that touches the savepoint implementation in
# TransactionManager sources or the dedicated test file.
# Targets v1.8.0
# (roadmap:232:transaction:v1.8.0:transaction-savepoints).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/transaction/transaction_manager.h'
      - 'src/transaction/transaction_manager.cpp'
      - 'tests/test_savepoints.cpp'
      - 'benchmarks/bench_transaction_throughput.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/transaction-savepoints-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/transaction/transaction_manager.h'
      - 'src/transaction/transaction_manager.cpp'
      - 'tests/test_savepoints.cpp'
      - 'benchmarks/bench_transaction_throughput.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/transaction-savepoints-ci.yml'
  workflow_dispatch:

concurrency:
  group: transaction-savepoints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the savepoint test suite (TransactionSavepointTests).
  # Tests cover all acceptance criteria for v1.8.0:
  #   AC-1  createSavepoint creates a named savepoint and tracks it in getSavepoints()
  #   AC-2  createSavepoint returns an error for duplicate names
  #   AC-3  createSavepoint returns an error for empty names
  #   AC-4  rollbackToSavepoint undoes all writes made after the savepoint
  #   AC-5  rollbackToSavepoint removes the target savepoint and all newer ones
  #   AC-6  rollbackToSavepoint returns an error for unknown savepoint names
  #   AC-7  releaseSavepoint removes the target savepoint and all newer ones without rolling back
  #   AC-8  releaseSavepoint returns an error for unknown savepoint names
  #   AC-9  hasSavepoint returns correct true/false
  #   AC-10 getSavepoints returns savepoints in creation order
  #   AC-11 All savepoint operations return an error when the transaction is already finished
  #   AC-12 SAGA steps added after a savepoint are trimmed on rollbackToSavepoint
  #   AC-13 releaseSavepoint preserves all SAGA steps (writes are kept)
  #   AC-14 Anonymous stack API (setSavePoint / rollbackToSavePoint / popSavePoint) works correctly
  #   AC-15 Nested anonymous savepoints roll back in LIFO order
  # ---------------------------------------------------------------------------
  transaction-savepoints-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Transaction Savepoints tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build (savepoint test target)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_savepoints

      - name: Run Transaction Savepoint unit tests
        run: |
          set -o pipefail
          cd build
          ctest --test-dir . \
            --tests-regex TransactionSavepointTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee transaction_savepoints_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-savepoints-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/transaction_savepoints_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 💾 Transaction Savepoints – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Savepoints: named partial rollback, createSavepoint/rollbackToSavepoint/releaseSavepoint, SAGA step trimming, LIFO stack ordering, anonymous setSavePoint/rollbackToSavePoint/popSavePoint API." >> "$GITHUB_STEP_SUMMARY"
