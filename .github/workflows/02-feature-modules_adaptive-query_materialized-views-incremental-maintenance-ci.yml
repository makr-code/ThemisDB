name: Materialized Views Incremental Maintenance CI

# Triggered on every push/PR that touches the MaterializedView sources,
# its test file, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/query/materialized_view.h'
      - 'src/query/materialized_view.cpp'
      - 'tests/test_materialized_view.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_materialized-views-incremental-maintenance-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/query/materialized_view.h'
      - 'src/query/materialized_view.cpp'
      - 'tests/test_materialized_view.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_materialized-views-incremental-maintenance-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated MaterializedView focused test suite.
  # Tests cover all seven acceptance criteria (AC-1 to AC-7):
  #   AC-1  View definition and creation
  #   AC-2  Automatic query rewriting (canRewrite)
  #   AC-3  Incremental maintenance on data changes (IMMEDIATE strategy)
  #   AC-4  Partial refresh strategies (IMMEDIATE / DEFERRED / PERIODIC / MANUAL)
  #   AC-5  View staleness tracking (markStale / isStale / time-based expiry)
  #   AC-6  Query speedup: pre-computed rows returned in O(1) snapshot reads
  #   AC-7  Insert overhead: IMMEDIATE maintenance applies deltas in-place
  # ---------------------------------------------------------------------------
  materialized-views-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Materialized Views tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            compiler: GCC-13
          - os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            compiler: GCC-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            nlohmann-json3-dev
            libssl-dev
            librocksdb-dev
            libspdlog-dev
            libfmt-dev
            libyaml-cpp-dev
            libtbb-dev
            libboost-all-dev
            libsimdjson-dev
            libsnappy-dev
            liblz4-dev

      - name: Configure (materialized view test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_MIMALLOC=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_BUILD_TESTS=ON

      - name: Build focused test binary
        run: cmake --build build --target test_materialized_view_focused -- -j$(nproc)

      - name: Run focused tests
        run: |
          cd build
          ctest --test-dir . -R MaterializedViewFocusedTests \
                --output-on-failure --timeout 60
