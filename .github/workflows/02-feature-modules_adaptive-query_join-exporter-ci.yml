name: Join Exporter CI

# Validates JoinExporter (v1.9.0).
# Covers cross-collection hash-join, output-field aliasing, join predicate
# filtering, PII detection/redaction, memory budget enforcement, throughput.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/exporters/join_exporter.h'
      - 'src/exporters/join_exporter.cpp'
      - 'tests/exporters/test_join_exporter.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_join-exporter-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/exporters/join_exporter.h'
      - 'src/exporters/join_exporter.cpp'
      - 'tests/exporters/test_join_exporter.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_adaptive-query_join-exporter-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the JoinExporterFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-1  JoinExporter implements IExporter (getName/getVersion/getSupportedFormats)
  #   AC-2  setRightCollection() builds in-memory hash table keyed on right_key_field
  #   AC-3  setRightCollection() throws ERR_EXPORT_JOIN_MEMORY_LIMIT when budget exceeded
  #   AC-4  JoinExportConfig struct with correct defaults (1 GiB memory limit, etc.)
  #   AC-5  exportEntities() performs inner hash-join; unmatched left rows are skipped
  #   AC-6  output_fields selection and "src:alias" renaming applied to merged record
  #   AC-7  Qualified "left.<field>" / "right.<field>" resolves ambiguous field names
  #   AC-8  join_predicate (AQL FILTER) applied on merged record; non-matching rows skipped
  #   AC-9  ERR_EXPORT_JOIN_AMBIGUOUS_FIELD thrown for unaliased common field names
  #   AC-10 ERR_EXPORT_JOIN_PREDICATE_INVALID thrown for unparseable AQL predicate
  #   AC-11 PII detection and redaction on merged serialised JSON
  #   AC-12 PII fail_on_pii=true throws ERR_EXPORT_PII_VIOLATION when redaction off
  #   AC-13 Throughput ≥ 50 000 merged docs/sec on modern hardware
  # ---------------------------------------------------------------------------
  join-exporter-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Join exporter tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure (join exporter test target only)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: ''

      - name: Build JoinExporter focused test binary
        run: cmake --build build --target test_join_exporter_focused -- -j$(nproc)

      - name: Run JoinExporter unit tests
        run: |
          set -o pipefail
          cd build
          ctest --test-dir . \
            --tests-regex JoinExporterFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee join_exporter_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: join-exporter-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/join_exporter_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔗 Join Exporter – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "JoinExporter: cross-collection hash-join, output-field aliasing, PII redaction, memory budget enforcement, 50k docs/sec throughput." >> "$GITHUB_STEP_SUMMARY"
