name: Kafka Consumer Source Connector CI

# Triggered on every push / PR that touches the KafkaConnector sources,
# its test file, or this workflow itself.  Targets v1.7.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/ingestion/kafka_connector.h'
      - 'src/ingestion/kafka_connector.cpp'
      - 'src/ingestion/ingestion_manager.cpp'
      - 'include/ingestion/ingestion_manager.h'
      - 'tests/test_ingestion_kafka.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/kafka-consumer-source-connector-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/ingestion/kafka_connector.h'
      - 'src/ingestion/kafka_connector.cpp'
      - 'src/ingestion/ingestion_manager.cpp'
      - 'include/ingestion/ingestion_manager.h'
      - 'tests/test_ingestion_kafka.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/kafka-consumer-source-connector-ci.yml'
  workflow_dispatch:

concurrency:
  group: kafka-consumer-source-connector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the KafkaConnector focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  kafka_connector.cpp implements ISourceConnector (librdkafka consumer group)
  #   AC-2  Consumer group ID configurable via options["consumer_group"];
  #         offset commit tied to IngestionCheckpointStore::commit() (checkpoint sync)
  #   AC-3  IngestionBuilder::withKafkaSource() fluent API
  #   AC-4  JSON-encoded and Avro-encoded message support;
  #         Avro schema_registry_url option accepted
  #   AC-5  Graceful shutdown (rd_kafka_consumer_close on IngestionManager stop)
  # ---------------------------------------------------------------------------
  kafka-connector-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Kafka Consumer Source Connector (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run IngestionKafkaFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R IngestionKafkaFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee kafka_connector_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run KafkaConnectorTest suite via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="KafkaConnectorTest*" \
            --gtest_output="xml:kafka_connector_gtest.xml" \
            2>&1 | tee kafka_connector_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-connector-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/kafka_connector_results.txt
            build/kafka_connector_gtest.xml
            build/kafka_connector_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## ⚡ Kafka Consumer Source Connector CI – v1.7.0" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Acceptance Criteria Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC | Description | Test(s) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----|-------------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1 | \`kafka_connector.cpp\` implements \`ISourceConnector\` with librdkafka | \`InitializeValidConfig\`, \`IngestJsonMessages\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2 | Consumer group configurable; offset commit tied to \`CheckpointStore\` | \`ConsumerGroupIsConfigurable\`, \`CheckpointWrittenAfterMockIngest\`, \`CheckpointNotWrittenWithoutStore\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3 | \`IngestionBuilder::withKafkaSource()\` fluent API | \`BuilderWithKafkaSource\`, \`BuilderWithKafkaSourceDefaultOptions\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4 | JSON and Avro message formats; \`schema_registry_url\` option | \`IngestJsonMessages\`, \`AvroMagicByteStripped\`, \`SchemaRegistryUrlStoredForAvro\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5 | Graceful shutdown via \`rd_kafka_consumer_close()\` | \`EmptyBatchTerminates\`, \`MaxMessagesLimit\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6 | Throughput ≥ 100 000 msgs/sec (1 KB, single partition) | \`ThroughputAtLeast100kMessagesPerSec\` (THEMIS_RUN_PERF_TESTS=1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7 | Connector processing latency < 100 ms (unit); full e2e ≤ 500 ms p99 in integration | \`SingleMessageProcessingLatencyBelow100ms\` |" >> "$GITHUB_STEP_SUMMARY"
