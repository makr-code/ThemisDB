name: "[Manual] Bootstrap Release Branches"

# Creates the permanent release-lane branches (enterprise, hyperscaler)
# from develop if they do not already exist.
#
# PURPOSE
# -------
# This is a one-time setup workflow. Run it once after the release strategy
# is merged into develop to create the two additional release-lane branches.
#
# SAFETY
# ------
#   • Only creates a branch if it does NOT already exist (idempotent).
#   • Never force-pushes or overwrites an existing branch.
#   • Only runs on workflow_dispatch (never automated).
#
# USAGE
# -----
#   1. Merge the release strategy PR into develop.
#   2. Go to Actions → "Bootstrap Release Branches" → Run workflow.
#   3. Leave "Source branch" as "develop" (default).
#   4. Click "Run workflow".
#
# After the workflow succeeds, configure branch protection rules for
# enterprise and hyperscaler as described in RELEASE_STRATEGY.md §9.

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Source branch to create release lanes from (default: develop)'
        required: false
        default: 'develop'
        type: string
      dry_run:
        description: 'Dry-run: check which branches would be created without creating them'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  bootstrap:
    name: Create release-lane branches
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine source ref
        id: source
        shell: bash
        run: |
          SOURCE="${{ github.event.inputs.source_branch }}"
          SOURCE="${SOURCE:-develop}"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          # Verify the source branch exists
          if ! git ls-remote --exit-code --heads origin "$SOURCE" > /dev/null 2>&1; then
            echo "::error::Source branch '$SOURCE' does not exist on origin."
            exit 1
          fi
          SOURCE_SHA=$(git ls-remote origin "refs/heads/$SOURCE" | cut -f1)
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Source: $SOURCE @ $SOURCE_SHA"

      - name: Create enterprise branch
        id: enterprise
        shell: bash
        run: |
          SOURCE="${{ steps.source.outputs.source }}"
          SOURCE_SHA="${{ steps.source.outputs.source_sha }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          # Check if enterprise branch already exists
          if git ls-remote --exit-code --heads origin enterprise > /dev/null 2>&1; then
            EXISTING_SHA=$(git ls-remote origin refs/heads/enterprise | cut -f1)
            echo "Branch 'enterprise' already exists at $EXISTING_SHA – skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "sha=$EXISTING_SHA" >> "$GITHUB_OUTPUT"
            echo "status=already_exists" >> "$GITHUB_OUTPUT"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would create branch 'enterprise' from $SOURCE @ $SOURCE_SHA"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "status=dry_run" >> "$GITHUB_OUTPUT"
          else
            echo "Creating branch 'enterprise' from $SOURCE @ $SOURCE_SHA …"
            git fetch origin "$SOURCE"
            git checkout -b enterprise "origin/$SOURCE"
            git push origin enterprise
            echo "✅  Branch 'enterprise' created at $SOURCE_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "status=created" >> "$GITHUB_OUTPUT"
          fi

      - name: Create hyperscaler branch
        id: hyperscaler
        shell: bash
        run: |
          SOURCE="${{ steps.source.outputs.source }}"
          SOURCE_SHA="${{ steps.source.outputs.source_sha }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          # Return to detached HEAD or main to avoid branch conflict
          git checkout "$SOURCE_SHA" --detach 2>/dev/null || true

          if git ls-remote --exit-code --heads origin hyperscaler > /dev/null 2>&1; then
            EXISTING_SHA=$(git ls-remote origin refs/heads/hyperscaler | cut -f1)
            echo "Branch 'hyperscaler' already exists at $EXISTING_SHA – skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "sha=$EXISTING_SHA" >> "$GITHUB_OUTPUT"
            echo "status=already_exists" >> "$GITHUB_OUTPUT"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would create branch 'hyperscaler' from $SOURCE @ $SOURCE_SHA"
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "status=dry_run" >> "$GITHUB_OUTPUT"
          else
            echo "Creating branch 'hyperscaler' from $SOURCE @ $SOURCE_SHA …"
            git checkout -b hyperscaler "origin/$SOURCE"
            git push origin hyperscaler
            echo "✅  Branch 'hyperscaler' created at $SOURCE_SHA"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            echo "status=created" >> "$GITHUB_OUTPUT"
          fi

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          SOURCE="${{ steps.source.outputs.source }}"
          SOURCE_SHA="${{ steps.source.outputs.source_sha }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          STATUS_ENTERPRISE="${{ steps.enterprise.outputs.status }}"
          STATUS_HYPERSCALER="${{ steps.hyperscaler.outputs.status }}"

          status_icon() {
            case "$1" in
              created)       echo "✅ Created" ;;
              already_exists) echo "⏭️ Already exists" ;;
              dry_run)       echo "🔍 Dry-run (not created)" ;;
              *)             echo "❓ Unknown" ;;
            esac
          }

          echo "## 🌿 Bootstrap Release Branches" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source branch | \`$SOURCE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source SHA | \`${SOURCE_SHA:-unknown}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | \`${DRY_RUN:-false}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Branch results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | Status | SHA |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`enterprise\` | $(status_icon "$STATUS_ENTERPRISE") | \`${{ steps.enterprise.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`hyperscaler\` | $(status_icon "$STATUS_HYPERSCALER") | \`${{ steps.hyperscaler.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${DRY_RUN:-false}" != "true" ]]; then
            echo "### Next steps" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure branch protection rules for the new branches:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Branch | Required status checks | Require PR |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`enterprise\` | \`pr-path-gate-enterprise / Enterprise-lane path policy\` | Yes |" >> "$GITHUB_STEP_SUMMARY"
            echo "| \`hyperscaler\` | \`pr-path-gate-hyperscaler / Hyperscaler-lane path policy\` | Yes |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "See [RELEASE_STRATEGY.md §9](../../RELEASE_STRATEGY.md#9-branch-creation-one-time-setup) for full instructions." >> "$GITHUB_STEP_SUMMARY"
          fi
