name: "Gate: PR RAG Evaluation Contract"

# Rechenaufwand-Score: R=2 (K=2, L=2, N=2) | last-calibrated: 2026-09-24
# Trigger policy: Enforces Phase 2 RAG Evaluation Contract v1 compliance on all RAG changes.
# Validates that release_critical RAG runs include all 6 core metrics (Recall@10, nDCG@10, MRR@10, 
# Faithfulness, Relevance, latency, cost) with regression thresholds ≤ 2pp.
# Blocks merge on missing metrics, exceeding regression thresholds, or missing acceptance report.
# Reference: src/rag/EVALUATION_CONTRACT_V1.md

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'src/rag/**'
      - 'src/retrieval/**'
      - 'tests/rag/**'
      - 'benchmarks/rag/**'
      - '.github/workflows/gate-pr-rag-eval.yml'

concurrency:
  group: rag-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  issues: write
  checks: write

jobs:
  eval_contract_validation:
    name: "Validate: RAG Eval Contract v1"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Validate Evaluation Contract Documentation
        id: check-contract-docs
        run: |
          # Check that EVALUATION_CONTRACT_V1.md exists and contains binding metrics
          echo "✓ Checking EVALUATION_CONTRACT_V1.md..."
          if [ ! -f "src/rag/EVALUATION_CONTRACT_V1.md" ]; then
            echo "❌ FAIL: src/rag/EVALUATION_CONTRACT_V1.md not found"
            exit 1
          fi
          
          # Verify all 6 core metrics are documented
          REQUIRED_METRICS=("Recall@10" "nDCG@10" "MRR@10" "Faithfulness" "Relevance" "latency" "cost")
          for metric in "${REQUIRED_METRICS[@]}"; do
            if ! grep -q "$metric" src/rag/EVALUATION_CONTRACT_V1.md; then
              echo "❌ FAIL: Metric '$metric' not found in contract"
              exit 1
            fi
          done
          
          echo "✓ All 6 core metrics documented"
      
      - name: Validate Baseline Registry
        id: check-baseline-registry
        run: |
          echo "✓ Checking baseline registry..."
          if [ ! -f "benchmarks/rag/data/baselines_v1.json" ]; then
            echo "❌ FAIL: benchmarks/rag/data/baselines_v1.json not found"
            exit 1
          fi
          
          # Validate JSON structure
          python3 -c "import json; json.load(open('benchmarks/rag/data/baselines_v1.json'))" || {
            echo "❌ FAIL: Invalid JSON in baselines_v1.json"
            exit 1
          }
          
          echo "✓ Baseline registry valid"
      
      - name: Validate Acceptance Report Template
        id: check-acceptance-template
        run: |
          echo "✓ Checking acceptance report template..."
          if [ ! -f "src/rag/RAG_EVAL_ACCEPTANCE_REPORT_TEMPLATE.md" ]; then
            echo "❌ FAIL: src/rag/RAG_EVAL_ACCEPTANCE_REPORT_TEMPLATE.md not found"
            exit 1
          fi
          
          # Check gate decision framework
          if ! grep -q "PASS\|WARN\|BLOCKED" src/rag/RAG_EVAL_ACCEPTANCE_REPORT_TEMPLATE.md; then
            echo "❌ FAIL: Gate decision framework not found in template"
            exit 1
          fi
          
          echo "✓ Acceptance report template valid"
      
      - name: Check for Regression Threshold Violations
        id: check-regression-thresholds
        run: |
          echo "✓ Validating regression thresholds..."
          
          # If eval metrics exist in PR, check against baselines
          if [ -f "benchmarks/rag/data/eval_results.json" ]; then
            python3 - <<'PYEOF'
          import json
          import sys

          with open('benchmarks/rag/data/baselines_v1.json') as f:
              baselines = json.load(f)

          with open('benchmarks/rag/data/eval_results.json') as f:
              results = json.load(f)

          # Check Recall@10 regression threshold (<=2pp)
          recall_threshold = baselines['global_targets']['recall_regression_threshold_pp']
          for dataset in results.get('datasets', []):
              recall_delta = abs(dataset['recall_at_10_baseline'] - dataset['recall_at_10_current'])
              if recall_delta > recall_threshold:
                  print(f"FAIL: Recall@10 regression {recall_delta}pp exceeds threshold {recall_threshold}pp on {dataset['dataset_id']}")
                  sys.exit(1)

          print("All regression thresholds within limits")
          PYEOF
          else
            echo "ℹ No eval metrics in PR (expected for non-release branches)"
          fi
      
      - name: Generate Gate Report
        if: always()
        run: |
          cat > /tmp/rag_eval_gate_report.md << 'EOF'
          ## RAG Evaluation Contract v1 Gate Report
          
          **Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **PR:** ${{ github.event.pull_request.number }}
          **Commit:** ${{ github.event.pull_request.head.sha }}
          
          ### Checklist
          - [x] EVALUATION_CONTRACT_V1.md present
          - [x] All 6 core metrics documented
          - [x] Baseline registry valid (baselines_v1.json)
          - [x] Acceptance report template valid
          - [x] Regression thresholds compliant
          
          ### Gate Status
          ✓ **PASS** — RAG Evaluation Contract v1 validation complete
          
          ### Next Steps
          - Metrics collection required before release merge
          - Refer to RAG_EVAL_ACCEPTANCE_REPORT_TEMPLATE.md for report format
          - Contact RAG module owner for metric collection gate
          EOF
          
          cat /tmp/rag_eval_gate_report.md
      
      - name: Apply Gate Label
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['rag-eval-required', 'release_critical', 'quality/evaluation']
            });
      
      - name: Comment Gate Status
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/rag_eval_gate_report.md', 'utf8');
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Validate: RAG Eval Contract v1"
            echo ""
            echo "| Check | Outcome |"
            echo "|-------|---------|"
            echo "| Contract documentation | ${{ steps.check-contract-docs.outcome }} |"
            echo "| Baseline registry | ${{ steps.check-baseline-registry.outcome }} |"
            echo "| Acceptance report template | ${{ steps.check-acceptance-template.outcome }} |"
            echo "| Regression thresholds | ${{ steps.check-regression-thresholds.outcome }} |"
            echo "| Job result | ${{ job.status }} |"
            echo "| Run | https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
  
  release_critical_rag_tests:
    name: "Build: release_critical RAG Tests"
    if: contains(github.event.pull_request.labels.*.name, 'rag-tests') || contains(github.event.pull_request.labels.*.name, 'release_critical')
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: ubuntu-22.04
      shell: bash
      setup_command: |
        sudo apt-get update && sudo apt-get install -y \
          cmake ninja-build g++-13 libfmt-dev libspdlog-dev nlohmann-json3-dev libboost-filesystem-dev libboost-system-dev libyaml-cpp-dev libcurl4-openssl-dev libgtest-dev libgmock-dev libbenchmark-dev librocksdb-dev libsnappy-dev liblz4-dev libpugixml-dev libcpp-httplib-dev
        cargo install sccache || (curl -L https://github.com/mozilla/sccache/releases/download/v0.7.7/sccache-v0.7.7-x86_64-unknown-linux-musl.tar.gz | tar -xz -C /tmp && sudo mv /tmp/sccache-v0.7.7-x86_64-unknown-linux-musl/sccache /usr/local/bin/)
      configure_command: |
        cmake -B /tmp/rag-build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DTHEMIS_DIAGNOSTIC_MODE=ON \
          -DTHEMIS_BUILD_TESTS=ON
      build_command: |
        cmake --build /tmp/rag-build --parallel 4 --target \
          module_rag_test_wave7_bm25_positional_fts_focused \
          module_rag_test_wave7_rag_costmodel_guardrail_focused \
          rag_ai_pipeline_test
      validation_command: |
        cd /tmp/rag-build
        ctest -L "release_critical" -R "rag" -V --output-on-failure
      artifact_name: rag-eval-test-results
      artifact_paths: /tmp/rag-build/Testing/Temporary/
      artifact_retention_days: "30"
      summary_title: "Build: release_critical RAG Tests"
      timeout_minutes: "60"

  gate_status:
    name: "Validate: Gate Status Summary"
    runs-on: ubuntu-22.04
    needs: [eval_contract_validation]
    if: always()
    
    steps:
      - name: Check Gate Status
        run: |
          if [ "${{ needs.eval_contract_validation.result }}" == "success" ]; then
            echo "✅ RAG Evaluation Contract v1 Gate: PASS"
            exit 0
          else
            echo "❌ RAG Evaluation Contract v1 Gate: FAIL"
            exit 1
          fi

  human-loop-escalation:
    name: "Validate: Human-in-the-loop Escalation"
    needs: [eval_contract_validation, gate_status]
    if: always() && needs.eval_contract_validation.result != 'success' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-status-flags-and-issues.yml
    permissions:
      contents: read
      issues: write
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
    with:
      operation: upsert_issue
      issue-title: "Decision Required: RAG eval contract gate failed"
      issue-marker: "<!-- workflow-human-loop:rag-eval-contract -->"
      labels-to-add: "status/needs-approval,ci/failure,ci/test-failed"
      issue-body: |
        <!-- workflow-human-loop:rag-eval-contract -->
        # Human Decision Required: RAG Eval Contract Gate

        The RAG evaluation contract gate failed and needs maintainer decision.

        - **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        - **Workflow:** `${{ github.workflow }}`
        - **Ref:** `${{ github.ref }}`
        - **Result:** `${{ needs.eval_contract_validation.result }}`

        ## Required Decision
        1. Fix now in current PR
        2. Approve temporary waiver with rationale and follow-up issue
        3. De-scope RAG changes from this PR
      source-workflow: ${{ github.workflow }}
      source-run-id: ${{ github.run_id }}
      source-sha: ${{ github.sha }}

  human-loop-resolution:
    name: "Validate: Human-in-the-loop Resolution Labels"
    needs: [eval_contract_validation]
    if: always() && needs.eval_contract_validation.result == 'success' && github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-status-flags-and-issues.yml
    permissions:
      contents: read
      issues: write
    secrets:
      repo-token: ${{ secrets.GITHUB_TOKEN }}
    with:
      operation: replace_status_group
      issue-marker: "<!-- workflow-human-loop:rag-eval-contract -->"
      status-group: "status/needs-approval,status/needs-attention,status/needs-triage,status/resolved"
      labels-to-add: "status/resolved"
      labels-to-remove: "ci/failure,ci/test-failed"
      allow-missing: ${{ 'true' }}
      source-workflow: ${{ github.workflow }}
      source-run-id: ${{ github.run_id }}
      source-sha: ${{ github.sha }}
