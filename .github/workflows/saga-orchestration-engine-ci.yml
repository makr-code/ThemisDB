name: SAGA Orchestration Engine CI

# Triggered on every push/PR that touches the SAGA orchestrator sources or tests.
# Targets milestone v1.8.0 / Issue #4043.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/transaction/saga_orchestrator.h'
      - 'src/transaction/saga_orchestrator.cpp'
      - 'tests/test_saga_orchestrator.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/saga-orchestration-engine-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/transaction/saga_orchestrator.h'
      - 'src/transaction/saga_orchestrator.cpp'
      - 'tests/test_saga_orchestrator.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/saga-orchestration-engine-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the SAGAOrchestrator focused test suite.
  # Tests cover all acceptance criteria from Issue #4043:
  #   AC-1  Parallel step execution (DAG-based)
  #   AC-2  Conditional branching (condition=false → SKIPPED)
  #   AC-3  Retry policies per step (exponential back-off, max_retries)
  #   AC-4  Timeout management (step timeout → abort)
  #   AC-5  SAGA templates (register/instantiate with context overrides)
  #   AC-6  Visual workflow designer (renderWorkflow() ASCII DAG)
  #   AC-7  Complex workflow support (multi-level diamond DAG)
  #   AC-8  Automatic dependency resolution (topological sort)
  #   AC-9  Compensation on failure (reverse LIFO order)
  #   AC-10 Validation (duplicates, cycles, unknown deps, empty id)
  #   AC-11 getStatus() post-execute + nullopt for unknown id
  #   AC-12 getMetrics() counters (started/completed/compensated/failed)
  #   AC-13 Exponential back-off timing
  #   AC-14 Context map merged from template + overrides
  #   AC-15 No-compensation steps handled silently
  #   AC-16 Parallel speedup (faster than sequential)
  #   AC-17 Skipped steps not compensated
  #   AC-18 Multi-level fan-out/fan-in
  #   AC-19 Journal file written when path configured
  #   AC-20 Thread safety (concurrent execute() calls)
  # ---------------------------------------------------------------------------
  saga-orchestrator-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: SAGA Orchestrator (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run SAGAOrchestratorFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R SAGAOrchestratorFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee saga_orchestrator_ctest.txt

      # ── Full test filter via focused binary ───────────────────────────────
      - name: Run all SAGAOrchestratorTest groups
        run: |
          set -o pipefail
          cd build
          ./tests/test_saga_orchestrator_focused \
            --gtest_filter="SAGAOrchestratorTest*" \
            --gtest_output="xml:saga_orchestrator_gtest.xml" \
            2>&1 | tee saga_orchestrator_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saga-orchestrator-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/saga_orchestrator_ctest.txt
            build/saga_orchestrator_gtest.xml
            build/saga_orchestrator_gtest_output.txt
          retention-days: 30
