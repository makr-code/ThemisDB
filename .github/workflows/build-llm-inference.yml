name: "Build: LLM Inferencing [TinyLlama + doku.db RAG + AdaLoRA]"

# Rechenaufwand-Score: R=6 (K=7, L=6, N=6) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Canonical LLM inference CI gate for ThemisDB.
#
# Tests covered:
#   llm_inference    — INFER-01..10: LlamacppInferenceEngine / EmbeddedLLM
#   llm_rag_doku     — RAG-01..07:   WikiRagSource + JsonWikiIndexReader + doku.db
#   adalora_training — LORA-01..07:  AdaLoRAAdapter training pipeline
#
# Model acquisition: HuggingFace direct GGUF (primary) → Ollama export (fallback)
# Model: TinyLlama-1.1B-Chat-v1.0 Q4_K_M (≈636 MB, CPU-only)
#
# Knowledge base: doku.db built from repository markdown documentation
#   (docs/, src/*/ROADMAP.md, ARCHITECTURE.md, etc.) via ci-build-doku-db.sh

on:
  push:
    branches:
      - develop
    paths:
      - 'src/llm/**'
      - 'src/training/**'
      - 'src/llm_wiki/**'
      - 'tests/llm/**'
      - 'include/llm/**'
      - 'include/training/**'
      - 'scripts/ci-download-tinyllama.sh'
      - 'scripts/ci-build-doku-db.sh'
  schedule:
    # Weekly regression monitoring — Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_model_download:
        description: 'Force re-download of TinyLlama GGUF (bypass cache)'
        type: boolean
        default: false
      skip_rag_suite:
        description: 'Skip RAG test suite (RAG-01..07)'
        type: boolean
        default: false
      skip_adalora_suite:
        description: 'Skip AdaLoRA test suite (LORA-01..07)'
        type: boolean
        default: false

concurrency:
  group: ci-llm-inference-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write   # For failure issue labelling

env:
  MODEL_DIR: ${{ github.workspace }}/models
  DOKU_DB_DIR: ${{ github.workspace }}/build/test-assets
  TINYLLAMA_GGUF: ${{ github.workspace }}/models/tinyllama.gguf
  CMAKE_BUILD_DIR: ${{ github.workspace }}/build
  # CPU thread budget: keep low for portable CI runners
  LLM_N_THREADS: '4'

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Download TinyLlama GGUF model (cached across runs)
  # ─────────────────────────────────────────────────────────────────────────
  setup-and-download:
    name: Download TinyLlama GGUF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      model-cache-hit: ${{ steps.cache-model.outputs.cache-hit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Restore model cache
        id: cache-model
        if: inputs.force_model_download != true
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_DIR }}
          # Key includes week number so cache refreshes weekly on schedule
          key: tinyllama-gguf-q4km-${{ hashFiles('scripts/ci-download-tinyllama.sh') }}-week${{ github.run_number }}
          restore-keys: |
            tinyllama-gguf-q4km-

      - name: Download TinyLlama GGUF (HuggingFace → Ollama fallback)
        if: steps.cache-model.outputs.cache-hit != 'true' || inputs.force_model_download == true
        env:
          MODEL_DIR: ${{ env.MODEL_DIR }}
          FORCE: ${{ inputs.force_model_download == true && '1' || '0' }}
        run: |
          set -euo pipefail
          chmod +x scripts/ci-download-tinyllama.sh
          bash scripts/ci-download-tinyllama.sh

      - name: Verify model file
        run: |
          set -euo pipefail
          if [[ ! -f "${{ env.TINYLLAMA_GGUF }}" ]]; then
            echo "::error::TinyLlama GGUF not found at ${{ env.TINYLLAMA_GGUF }}"
            exit 1
          fi
          SIZE=$(stat -c%s "${{ env.TINYLLAMA_GGUF }}" 2>/dev/null || stat -f%z "${{ env.TINYLLAMA_GGUF }}")
          echo "Model size: $(( SIZE / 1024 / 1024 )) MB"
          if (( SIZE < 100000000 )); then
            echo "::error::Model file suspiciously small ($SIZE bytes); download may have failed"
            exit 1
          fi
          echo "Model OK: ${{ env.TINYLLAMA_GGUF }}"

      - name: Upload model artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tinyllama-gguf-${{ github.run_number }}
          path: ${{ env.MODEL_DIR }}/tinyllama.gguf
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build with LLM inference tests enabled
  # ─────────────────────────────────────────────────────────────────────────
  build-with-llm-tests:
    name: Build (THEMIS_LLM_INFERENCE_TESTS=ON)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: setup-and-download

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            librocksdb-dev libgtest-dev libssl-dev zlib1g-dev libzstd-dev \
            libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \
            libyaml-cpp-dev libcurl4-openssl-dev libboost-system-dev \
            libboost-filesystem-dev libpugixml-dev

      - name: Prepare optional submodule paths
        run: |
          mkdir -p internal llama.cpp vcpkg/downloads

      - name: Configure CMake (inference tests enabled)
        run: |
          set -euo pipefail
          cmake -S . -B "${{ env.CMAKE_BUILD_DIR }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_LLM_INFERENCE_TESTS=ON \
            -DTHEMIS_TEST_MODEL_DIR="${{ env.MODEL_DIR }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: |
          set -euo pipefail
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --parallel 8 \
            --target \
              module_llm_test_llm_tinyllama_inference_focused \
              module_llm_test_llm_doku_rag_focused \
              module_llm_test_llm_adalora_doku_training_focused

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: llm-inference-build-${{ github.run_number }}
          path: |
            ${{ env.CMAKE_BUILD_DIR }}/module_llm_test_llm_*_focused
            ${{ env.CMAKE_BUILD_DIR }}/CTestTestfile.cmake
            ${{ env.CMAKE_BUILD_DIR }}/tests/llm/CTestTestfile.cmake
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Build doku.db knowledge base
  # ─────────────────────────────────────────────────────────────────────────
  build-doku-db:
    name: Build doku.db (documentation knowledge base)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup-and-download

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Restore doku.db cache
        id: cache-dokudb
        uses: actions/cache@v4
        with:
          path: ${{ env.DOKU_DB_DIR }}
          # Invalidate when any markdown doc changes
          key: doku-db-${{ hashFiles('docs/**/*.md', 'src/**/ROADMAP.md', 'ROADMAP.md') }}
          restore-keys: |
            doku-db-

      - name: Build doku.db JSON index
        if: steps.cache-dokudb.outputs.cache-hit != 'true'
        env:
          OUTPUT_DIR: ${{ env.DOKU_DB_DIR }}
          REPO_ROOT: ${{ github.workspace }}
          CHUNK_MAX_TOKENS: '512'
          CHUNK_OVERLAP_TOKENS: '64'
        run: |
          set -euo pipefail
          chmod +x scripts/ci-build-doku-db.sh
          bash scripts/ci-build-doku-db.sh

      - name: Verify doku.db
        run: |
          set -euo pipefail
          DB_FILE="${{ env.DOKU_DB_DIR }}/doku.db.json"
          if [[ ! -f "$DB_FILE" ]]; then
            echo "::error::doku.db.json not found at $DB_FILE"
            exit 1
          fi
          CHUNK_COUNT=$(python3 -c "import json; d=json.load(open('$DB_FILE')); print(d['chunk_count'])")
          echo "doku.db: $CHUNK_COUNT chunks"
          if (( CHUNK_COUNT < 50 )); then
            echo "::error::doku.db has fewer than 50 chunks ($CHUNK_COUNT); build may have failed"
            exit 1
          fi

      - name: Upload doku.db artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: doku-db-${{ github.run_number }}
          path: ${{ env.DOKU_DB_DIR }}/doku.db.json
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Run INFER-01..10 (llm_inference label)
  # ─────────────────────────────────────────────────────────────────────────
  run-inference-suite:
    name: "CTest: llm_inference (INFER-01..10)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-with-llm-tests, setup-and-download]

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: llm-inference-build-${{ github.run_number }}
          path: ${{ env.CMAKE_BUILD_DIR }}

      - name: Download TinyLlama model
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: tinyllama-gguf-${{ github.run_number }}
          path: ${{ env.MODEL_DIR }}

      - name: Make test binaries executable
        run: chmod +x ${{ env.CMAKE_BUILD_DIR }}/module_llm_*_focused || true

      - name: Run inference test suite
        env:
          THEMIS_TEST_MODEL_PATH: ${{ env.TINYLLAMA_GGUF }}
        run: |
          set -euo pipefail
          ctest --test-dir "${{ env.CMAKE_BUILD_DIR }}" \
            --output-on-failure \
            -j1 \
            --timeout 120 \
            -L "llm_inference" \
            --output-log "${{ env.CMAKE_BUILD_DIR }}/ctest-inference.log" \
            || CTEST_EXIT=$?
          echo "CTest exit: ${CTEST_EXIT:-0}"
          exit "${CTEST_EXIT:-0}"

      - name: Upload inference test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: inference-results-${{ github.run_number }}
          path: |
            ${{ env.CMAKE_BUILD_DIR }}/Testing/
            ${{ env.CMAKE_BUILD_DIR }}/ctest-inference.log
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Run RAG-01..07 (llm_rag_doku label)
  # ─────────────────────────────────────────────────────────────────────────
  run-rag-suite:
    name: "CTest: llm_rag_doku (RAG-01..07)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-with-llm-tests, build-doku-db]
    if: inputs.skip_rag_suite != true

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: llm-inference-build-${{ github.run_number }}
          path: ${{ env.CMAKE_BUILD_DIR }}

      - name: Download doku.db
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: doku-db-${{ github.run_number }}
          path: ${{ env.DOKU_DB_DIR }}

      - name: Make test binaries executable
        run: chmod +x ${{ env.CMAKE_BUILD_DIR }}/module_llm_*_focused || true

      - name: Run RAG test suite
        env:
          THEMIS_DOKU_DB_PATH: ${{ env.DOKU_DB_DIR }}/doku.db.json
        run: |
          set -euo pipefail
          ctest --test-dir "${{ env.CMAKE_BUILD_DIR }}" \
            --output-on-failure \
            -j1 \
            --timeout 180 \
            -L "llm_rag_doku" \
            --output-log "${{ env.CMAKE_BUILD_DIR }}/ctest-rag.log" \
            || CTEST_EXIT=$?
          echo "CTest exit: ${CTEST_EXIT:-0}"
          exit "${CTEST_EXIT:-0}"

      - name: Upload RAG test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rag-results-${{ github.run_number }}
          path: |
            ${{ env.CMAKE_BUILD_DIR }}/Testing/
            ${{ env.CMAKE_BUILD_DIR }}/ctest-rag.log
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Job 6: Run LORA-01..07 (adalora_training label)
  # ─────────────────────────────────────────────────────────────────────────
  run-adalora-suite:
    name: "CTest: adalora_training (LORA-01..07)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-with-llm-tests, build-doku-db]
    if: inputs.skip_adalora_suite != true

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: llm-inference-build-${{ github.run_number }}
          path: ${{ env.CMAKE_BUILD_DIR }}

      - name: Download doku.db
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: doku-db-${{ github.run_number }}
          path: ${{ env.DOKU_DB_DIR }}

      - name: Make test binaries executable
        run: chmod +x ${{ env.CMAKE_BUILD_DIR }}/module_llm_*_focused || true

      - name: Run AdaLoRA training test suite
        env:
          THEMIS_DOKU_DB_PATH: ${{ env.DOKU_DB_DIR }}/doku.db.json
        run: |
          set -euo pipefail
          ctest --test-dir "${{ env.CMAKE_BUILD_DIR }}" \
            --output-on-failure \
            -j1 \
            --timeout 300 \
            -L "adalora_training" \
            --output-log "${{ env.CMAKE_BUILD_DIR }}/ctest-adalora.log" \
            || CTEST_EXIT=$?
          echo "CTest exit: ${CTEST_EXIT:-0}"
          exit "${CTEST_EXIT:-0}"

      - name: Upload AdaLoRA test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: adalora-results-${{ github.run_number }}
          path: |
            ${{ env.CMAKE_BUILD_DIR }}/Testing/
            ${{ env.CMAKE_BUILD_DIR }}/ctest-adalora.log
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Job 7: Summary report and failure issue labelling
  # ─────────────────────────────────────────────────────────────────────────
  report:
    name: Summary Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - run-inference-suite
      - run-rag-suite
      - run-adalora-suite

    steps:
      - name: Download all test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: '*-results-${{ github.run_number }}'
          path: all-results
          merge-multiple: true

      - name: Generate CTest summary
        run: |
          set -euo pipefail
          {
            echo "## LLM Inferencing CI Results"
            echo ""
            echo "| Suite | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          infer_status="${{ needs.run-inference-suite.result }}"
          rag_status="${{ needs.run-rag-suite.result }}"
          adalora_status="${{ needs.run-adalora-suite.result }}"

          emoji() {
            case "$1" in
              success)  echo "✅ passed" ;;
              skipped)  echo "⏭ skipped" ;;
              failure)  echo "❌ failed" ;;
              *)        echo "⚠ $1" ;;
            esac
          }

          {
            echo "| INFER-01..10 (llm_inference) | $(emoji "$infer_status") |"
            echo "| RAG-01..07 (llm_rag_doku) | $(emoji "$rag_status") |"
            echo "| LORA-01..07 (adalora_training) | $(emoji "$adalora_status") |"
            echo ""
            echo "**Run:** ${{ github.run_id }} | **Branch:** \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Find and display any CTest XML
          if find all-results -name "*.xml" 2>/dev/null | grep -q .; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### CTest XML Artifacts" >> "$GITHUB_STEP_SUMMARY"
            find all-results -name "*.xml" | while read -r f; do
              echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Label failure issue
        if: >
          needs.run-inference-suite.result == 'failure' ||
          needs.run-rag-suite.result == 'failure' ||
          needs.run-adalora-suite.result == 'failure'
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: 'LLM CI failure — run #${{ github.run_number }} (${{ github.ref_name }})'
          issue-marker: '<!-- llm-ci-failure:run:${{ github.run_id }} -->'
          issue-body: |
            ## LLM Inferencing CI Failure

            **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            | Suite | Result |
            |---|---|
            | INFER-01..10 | ${{ needs.run-inference-suite.result }} |
            | RAG-01..07   | ${{ needs.run-rag-suite.result }} |
            | LORA-01..07  | ${{ needs.run-adalora-suite.result }} |

            Please investigate and fix before the next release gate.

            _Auto-generated by build-llm-inference.yml at ${{ github.run_id }}_
          labels-to-add: 'llm-ci-failure,needs-triage'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}
