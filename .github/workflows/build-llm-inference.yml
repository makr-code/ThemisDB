name: "Build: LLM Inferencing [TinyLlama + embeddings + RAG + LoRA]"

# Rechenaufwand-Score: R=6 (K=7, L=6, N=6) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Canonical LLM inference CI gate for ThemisDB.
#
# Tests covered:
#   llm_inference    — INFER-01..10: LlamacppInferenceEngine / EmbeddedLLM
#   model embeddings — real EmbeddingProvider output, shape, finiteness, and cache hit
#   model LoRA       — fail-closed adapter application against a loaded TinyLlama model
#   wiki Phase B     — RocksDB-backed integration; skips are not accepted
#   llm_rag_doku     — RAG-01..07:   WikiRagSource + JsonWikiIndexReader + doku.db
#   adalora_training — LORA-01..07:  AdaLoRAAdapter training pipeline
#
# Model acquisition uses reusable-llm-model-cache.yml and the SHA256-pinned downloader.
# Model: TinyLlama-1.1B-Chat-v1.0 Q4_K_M (≈636 MB, CPU-only)
#
# Knowledge base: doku.db built from repository markdown documentation
#   (docs/, src/*/ROADMAP.md, ARCHITECTURE.md, etc.) via ci-build-doku-db.sh
#
# Heavy LLM validation intentionally runs only on schedule and manual dispatch.
# Fast PR feedback is provided by the lightweight gate workflow(s), not by this large
# inference pipeline.

on:
  schedule:
    # Weekly regression monitoring — Monday 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force_model_download:
        description: 'Force re-download of TinyLlama GGUF (bypass cache)'
        type: boolean
        default: false
      skip_rag_suite:
        description: 'Skip RAG test suite (RAG-01..07)'
        type: boolean
        default: false
      skip_adalora_suite:
        description: 'Skip AdaLoRA test suite (LORA-01..07)'
        type: boolean
        default: false
      dry_run:
        description: 'Run all selected inference tests without updating the failure tracker (scheduled runs remain live)'
        type: boolean
        required: false
        default: true

concurrency:
  group: ci-llm-inference-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MODEL_DIR: ${{ github.workspace }}/models
  DOKU_DB_DIR: ${{ github.workspace }}/build/test-assets
  TINYLLAMA_GGUF: ${{ github.workspace }}/models/tinyllama.gguf
  CMAKE_BUILD_DIR: ${{ github.workspace }}/build
  LLM_TEST_DIR: ${{ github.workspace }}/build/cmake/tests/llm
  LLM_TEST_BIN_DIR: ${{ github.workspace }}/build/bin/tests_by_module/llm/Release
  THEMIS_CTEST_EMIT_TEST_OUTPUT: '1'
  THEMIS_CTEST_DISABLE_ON_DEMAND_BUILD: '1'
  # CPU thread budget: keep low for portable CI runners
  LLM_N_THREADS: '4'

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Prepare TinyLlama through the shared verified model cache
  # ─────────────────────────────────────────────────────────────────────────
  setup-and-download:
    name: "Build: Download SHA256-pinned TinyLlama"
    uses: ./.github/workflows/reusable-llm-model-cache.yml
    with:
      include_tinyllama: true
      llm_model: tinyllama
      llm_model_file: tinyllama.gguf
      tinyllama_force_download: ${{ inputs.force_model_download }}
      cache_key_suffix: real-model-ci
      publish_model_artifact: true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build with LLM inference tests enabled
  # ─────────────────────────────────────────────────────────────────────────
  build-with-llm-tests:
    name: "Build: THEMIS_LLM_INFERENCE_TESTS=ON"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: setup-and-download

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache \
            librocksdb-dev libgtest-dev libgmock-dev libbenchmark-dev libssl-dev zlib1g-dev libzstd-dev \
            libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \
            libyaml-cpp-dev libcurl4-openssl-dev libcpp-httplib-dev libboost-system-dev \
            libboost-dev libboost-filesystem-dev libpugixml-dev libvulkan-dev

      - name: Prepare optional submodule paths
        run: |
          mkdir -p internal llama.cpp vcpkg/downloads

      - name: Test pinned model checksum validation
        run: bash tests/scripts/test_ci_download_tinyllama.sh

      - name: Test reusable TinyLlama cache integrity
        run: bash tests/scripts/test_prepare_llm_model_cache.sh

      - name: Test LLM skip-budget enforcement
        run: bash tests/scripts/test_ci_check_llm_skip_budget.sh

      - name: Configure CMake (inference tests enabled)
        run: |
          set -euo pipefail
          ccache_path="$(command -v ccache)"
          export THEMIS_COMPILER_CACHE_PROGRAM="${ccache_path}"
          cmake -S . -B "${{ env.CMAKE_BUILD_DIR }}" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_LLM_INFERENCE_TESTS=ON \
            -DTHEMIS_TEST_MODEL_DIR="${{ env.MODEL_DIR }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: |
          set -euo pipefail
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --parallel 8 \
            --target \
              module_llm_test_llm_tinyllama_inference_focused \
              module_llm_test_llm_doku_rag_focused \
              module_llm_test_llm_adalora_doku_training_focused \
              module_llm_test_real_embeddings_focused \
              module_llm_test_lora_adapters_focused \
              module_llm_test_wiki_index_store_phase_b_focused

      - name: Verify test artifact contents
        run: |
          set -euo pipefail
          test -f "${LLM_TEST_DIR}/CTestTestfile.cmake"
          test -f "${LLM_TEST_BIN_DIR}/themisdb_rag_golden_dataset.yaml"
          for target in \
            test_llm_tinyllama_inference test_llm_doku_rag test_llm_adalora_doku_training \
            test_real_embeddings test_lora_adapters test_wiki_index_store_phase_b; do
            test -x "${LLM_TEST_BIN_DIR}/module_llm_${target}_focused"
          done
          for label in llm_inference llm_rag_doku adalora_training; do
            ctest --test-dir "${LLM_TEST_DIR}" -N --no-tests=error -L "^${label}$"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: llm-inference-build-${{ github.run_number }}
          path: |
            ${{ env.LLM_TEST_BIN_DIR }}/module_llm_*_focused
            ${{ env.LLM_TEST_BIN_DIR }}/themisdb_rag_golden_dataset.yaml
            ${{ env.LLM_TEST_DIR }}/CTestTestfile.cmake
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Build doku.db knowledge base
  # ─────────────────────────────────────────────────────────────────────────
  build-doku-db:
    name: "Build: doku.db (documentation knowledge base)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: setup-and-download

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore doku.db cache
        id: cache-dokudb
        uses: actions/cache@v5
        with:
          path: ${{ env.DOKU_DB_DIR }}
          # Invalidate when any markdown doc changes
          key: doku-db-${{ hashFiles('docs/**/*.md', 'src/**/ROADMAP.md', 'ROADMAP.md') }}
          restore-keys: |
            doku-db-

      - name: Build doku.db JSON index
        if: steps.cache-dokudb.outputs.cache-hit != 'true'
        env:
          OUTPUT_DIR: ${{ env.DOKU_DB_DIR }}
          REPO_ROOT: ${{ github.workspace }}
          CHUNK_MAX_TOKENS: '512'
          CHUNK_OVERLAP_TOKENS: '64'
        run: |
          set -euo pipefail
          chmod +x scripts/ci-build-doku-db.sh
          bash scripts/ci-build-doku-db.sh

      - name: Verify doku.db
        run: |
          set -euo pipefail
          DB_FILE="${{ env.DOKU_DB_DIR }}/doku.db.json"
          if [[ ! -f "$DB_FILE" ]]; then
            echo "::error::doku.db.json not found at $DB_FILE"
            exit 1
          fi
          CHUNK_COUNT=$(python3 -c "import json; d=json.load(open('$DB_FILE')); print(d['chunk_count'])")
          echo "doku.db: $CHUNK_COUNT chunks"
          if (( CHUNK_COUNT < 50 )); then
            echo "::error::doku.db has fewer than 50 chunks ($CHUNK_COUNT); build may have failed"
            exit 1
          fi

      - name: Upload doku.db artifact
        uses: actions/upload-artifact@v5
        with:
          name: doku-db-${{ github.run_number }}
          path: ${{ env.DOKU_DB_DIR }}/doku.db.json
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Run INFER-01..10 (llm_inference label)
  # ─────────────────────────────────────────────────────────────────────────
  run-inference-suite:
    name: "Validate: TinyLlama inference, embedding, LoRA, and Wiki integration"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-with-llm-tests, setup-and-download]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            librocksdb-dev libssl-dev zlib1g-dev libzstd-dev libfmt-dev libspdlog-dev \
            libtbb-dev libyaml-cpp-dev libcurl4-openssl-dev libcpp-httplib-dev \
            libboost-system-dev libboost-filesystem-dev libpugixml-dev libvulkan-dev

      - name: Download build artifacts
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85  # v4.1.3
        with:
          name: llm-inference-build-${{ github.run_number }}
          path: ${{ env.CMAKE_BUILD_DIR }}

      - name: Download TinyLlama model
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85  # v4.1.3
        with:
          name: ${{ needs.setup-and-download.outputs.model_artifact }}
          path: ${{ env.MODEL_DIR }}

      - name: Verify downloaded TinyLlama checksum
        env:
          TINYLLAMA_GGUF: ${{ env.TINYLLAMA_GGUF }}
        run: |
          source scripts/ci-download-tinyllama.sh
          verify_sha256 "${TINYLLAMA_GGUF}" "${EXPECTED_SHA256}"

      - name: Make test binaries executable
        run: chmod +x ${{ env.LLM_TEST_BIN_DIR }}/module_llm_*_focused

      - name: Run inference test suite
        env:
          THEMIS_TEST_MODEL_PATH: ${{ env.TINYLLAMA_GGUF }}
        run: |
          set -euo pipefail
          CONSOLE_LOG="${{ env.CMAKE_BUILD_DIR }}/ctest-inference-console.log"
          ctest --test-dir "${{ env.LLM_TEST_DIR }}" \
            --output-on-failure \
            --verbose \
            -j1 \
            --timeout 120 \
            -L "llm_inference" \
            --output-log "${{ env.CMAKE_BUILD_DIR }}/ctest-inference.log" \
            2>&1 | tee "${CONSOLE_LOG}" || CTEST_EXIT=$?
          bash scripts/ci-check-llm-skip-budget.sh llm 0 "${CONSOLE_LOG}"
          echo "CTest exit: ${CTEST_EXIT:-0}"
          exit "${CTEST_EXIT:-0}"

      - name: Run real embedding provider tests
        env:
          THEMIS_TEST_MODEL_PATH: ${{ env.TINYLLAMA_GGUF }}
        run: |
          set -euo pipefail
          CONSOLE_LOG="${{ env.CMAKE_BUILD_DIR }}/ctest-real-embeddings-console.log"
          "${{ env.LLM_TEST_BIN_DIR }}/module_llm_test_real_embeddings_focused" \
            2>&1 | tee "${CONSOLE_LOG}" || TEST_EXIT=$?
          bash scripts/ci-check-llm-skip-budget.sh llm 0 "${CONSOLE_LOG}"
          exit "${TEST_EXIT:-0}"

      - name: Run real-model LoRA adapter failure tests
        env:
          THEMIS_TEST_MODEL_PATH: ${{ env.TINYLLAMA_GGUF }}
        run: |
          set -euo pipefail
          CONSOLE_LOG="${{ env.CMAKE_BUILD_DIR }}/ctest-lora-adapters-console.log"
          "${{ env.LLM_TEST_BIN_DIR }}/module_llm_test_lora_adapters_focused" \
            2>&1 | tee "${CONSOLE_LOG}" || TEST_EXIT=$?
          bash scripts/ci-check-llm-skip-budget.sh llm 0 "${CONSOLE_LOG}"
          exit "${TEST_EXIT:-0}"

      - name: Run WikiIndexStore Phase B integration tests
        run: |
          set -euo pipefail
          CONSOLE_LOG="${{ env.CMAKE_BUILD_DIR }}/ctest-wiki-index-phase-b-console.log"
          "${{ env.LLM_TEST_BIN_DIR }}/module_llm_test_wiki_index_store_phase_b_focused" \
            2>&1 | tee "${CONSOLE_LOG}" || TEST_EXIT=$?
          bash scripts/ci-check-llm-skip-budget.sh llm 0 "${CONSOLE_LOG}"
          exit "${TEST_EXIT:-0}"

      - name: Upload inference test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: inference-results-${{ github.run_number }}
          path: |
            ${{ env.LLM_TEST_DIR }}/Testing/
            ${{ env.CMAKE_BUILD_DIR }}/ctest-inference.log
            ${{ env.CMAKE_BUILD_DIR }}/ctest-inference-console.log
            ${{ env.CMAKE_BUILD_DIR }}/ctest-real-embeddings-console.log
            ${{ env.CMAKE_BUILD_DIR }}/ctest-lora-adapters-console.log
            ${{ env.CMAKE_BUILD_DIR }}/ctest-wiki-index-phase-b-console.log
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Job 5: Run RAG-01..07 (llm_rag_doku label)
  # ─────────────────────────────────────────────────────────────────────────
  run-rag-suite:
    name: "Validate: CTest llm_rag_doku (RAG-01..07)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-with-llm-tests, build-doku-db, setup-and-download]
    if: inputs.skip_rag_suite != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            librocksdb-dev libssl-dev zlib1g-dev libzstd-dev libfmt-dev libspdlog-dev \
            libtbb-dev libyaml-cpp-dev libcurl4-openssl-dev libcpp-httplib-dev \
            libboost-system-dev libboost-filesystem-dev libpugixml-dev libvulkan-dev

      - name: Download build artifacts
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85  # v4.1.3
        with:
          name: llm-inference-build-${{ github.run_number }}
          path: ${{ env.CMAKE_BUILD_DIR }}

      - name: Download doku.db
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85  # v4.1.3
        with:
          name: doku-db-${{ github.run_number }}
          path: ${{ env.DOKU_DB_DIR }}

      - name: Download TinyLlama model
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85  # v4.1.3
        with:
          name: ${{ needs.setup-and-download.outputs.model_artifact }}
          path: ${{ env.MODEL_DIR }}

      - name: Verify downloaded TinyLlama checksum
        env:
          TINYLLAMA_GGUF: ${{ env.TINYLLAMA_GGUF }}
        run: |
          source scripts/ci-download-tinyllama.sh
          verify_sha256 "${TINYLLAMA_GGUF}" "${EXPECTED_SHA256}"

      - name: Make test binaries executable
        run: chmod +x ${{ env.LLM_TEST_BIN_DIR }}/module_llm_*_focused

      - name: Run RAG test suite
        env:
          THEMIS_DOKU_DB_PATH: ${{ env.DOKU_DB_DIR }}/doku.db.json
        run: |
          set -euo pipefail
          CONSOLE_LOG="${{ env.CMAKE_BUILD_DIR }}/ctest-rag-console.log"
          ctest --test-dir "${{ env.LLM_TEST_DIR }}" \
            --output-on-failure \
            --verbose \
            -j1 \
            --timeout 180 \
            -L "llm_rag_doku" \
            --output-log "${{ env.CMAKE_BUILD_DIR }}/ctest-rag.log" \
            2>&1 | tee "${CONSOLE_LOG}" || CTEST_EXIT=$?
          bash scripts/ci-check-llm-skip-budget.sh llm 0 "${CONSOLE_LOG}"
          echo "CTest exit: ${CTEST_EXIT:-0}"
          exit "${CTEST_EXIT:-0}"

      - name: Upload RAG test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rag-results-${{ github.run_number }}
          path: |
            ${{ env.LLM_TEST_DIR }}/Testing/
            ${{ env.CMAKE_BUILD_DIR }}/ctest-rag.log
            ${{ env.CMAKE_BUILD_DIR }}/ctest-rag-console.log
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Job 6: Run LORA-01..07 (adalora_training label)
  # ─────────────────────────────────────────────────────────────────────────
  run-adalora-suite:
    name: "Validate: CTest adalora_training (LORA-01..07)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [build-with-llm-tests, build-doku-db]
    if: inputs.skip_adalora_suite != true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            librocksdb-dev libssl-dev zlib1g-dev libzstd-dev libfmt-dev libspdlog-dev \
            libtbb-dev libyaml-cpp-dev libcurl4-openssl-dev libcpp-httplib-dev \
            libboost-system-dev libboost-filesystem-dev libpugixml-dev libvulkan-dev

      - name: Download build artifacts
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85  # v4.1.3
        with:
          name: llm-inference-build-${{ github.run_number }}
          path: ${{ env.CMAKE_BUILD_DIR }}

      - name: Download doku.db
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85  # v4.1.3
        with:
          name: doku-db-${{ github.run_number }}
          path: ${{ env.DOKU_DB_DIR }}

      - name: Make test binaries executable
        run: chmod +x ${{ env.LLM_TEST_BIN_DIR }}/module_llm_*_focused

      - name: Run AdaLoRA training test suite
        env:
          THEMIS_DOKU_DB_PATH: ${{ env.DOKU_DB_DIR }}/doku.db.json
        run: |
          set -euo pipefail
          CONSOLE_LOG="${{ env.CMAKE_BUILD_DIR }}/ctest-adalora-console.log"
          ctest --test-dir "${{ env.LLM_TEST_DIR }}" \
            --output-on-failure \
            --verbose \
            -j1 \
            --timeout 300 \
            -L "adalora_training" \
            --output-log "${{ env.CMAKE_BUILD_DIR }}/ctest-adalora.log" \
            2>&1 | tee "${CONSOLE_LOG}" || CTEST_EXIT=$?
          bash scripts/ci-check-llm-skip-budget.sh llm 0 "${CONSOLE_LOG}"
          echo "CTest exit: ${CTEST_EXIT:-0}"
          exit "${CTEST_EXIT:-0}"

      - name: Upload AdaLoRA test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: adalora-results-${{ github.run_number }}
          path: |
            ${{ env.LLM_TEST_DIR }}/Testing/
            ${{ env.CMAKE_BUILD_DIR }}/ctest-adalora.log
            ${{ env.CMAKE_BUILD_DIR }}/ctest-adalora-console.log
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # Job 7: Summary report and failure issue labelling
  # ─────────────────────────────────────────────────────────────────────────
  report:
    name: "Automation: Summary Report"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    needs:
      - run-inference-suite
      - run-rag-suite
      - run-adalora-suite
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all test results
        uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85  # v4.1.3
        with:
          pattern: '*-results-${{ github.run_number }}'
          path: all-results
          merge-multiple: true

      - name: Generate CTest summary
        run: |
          set -euo pipefail
          {
            echo "## LLM Inferencing CI Results"
            echo ""
            echo "| Suite | Status |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          infer_status="${{ needs.run-inference-suite.result }}"
          rag_status="${{ needs.run-rag-suite.result }}"
          adalora_status="${{ needs.run-adalora-suite.result }}"
          if [ "${infer_status}" != "success" ] || [ "${rag_status}" != "success" ] || [ "${adalora_status}" != "success" ]; then
            echo "::error::At least one required real-model test suite did not succeed."
          fi

          emoji() {
            case "$1" in
              success)  echo "✅ passed" ;;
              skipped)  echo "⏭ skipped" ;;
              failure)  echo "❌ failed" ;;
              *)        echo "⚠ $1" ;;
            esac
          }

          {
            echo "| INFER-01..10 (llm_inference) | $(emoji "$infer_status") |"
            echo "| RAG-01..07 (llm_rag_doku) | $(emoji "$rag_status") |"
            echo "| LORA-01..07 (adalora_training) | $(emoji "$adalora_status") |"
            echo ""
            echo "**Run:** ${{ github.run_id }} | **Branch:** \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # Find and display any CTest XML
          if find all-results -name "*.xml" 2>/dev/null | grep -q .; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### CTest XML Artifacts" >> "$GITHUB_STEP_SUMMARY"
            find all-results -name "*.xml" | while read -r f; do
              echo "- \`$(basename "$f")\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Preview failure tracker update
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          INFERENCE_RESULT: ${{ needs.run-inference-suite.result }}
          RAG_RESULT: ${{ needs.run-rag-suite.result }}
          ADALORA_RESULT: ${{ needs.run-adalora-suite.result }}
        run: |
          {
            echo ""
            echo "### Failure tracker dry-run preview"
            if [ "${INFERENCE_RESULT}" != "success" ] || [ "${RAG_RESULT}" != "success" ] || [ "${ADALORA_RESULT}" != "success" ]; then
              echo "A failure issue upsert and status-label normalization would be attempted."
            else
              echo "A recovery comment and resolved-status normalization would be attempted if a matching issue exists."
            fi
            echo "All tracker issue, label, and comment writes were suppressed; validation and artifacts still ran."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Label failure issue
        if: >
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) &&
          (
          needs.run-inference-suite.result != 'success' ||
          needs.run-rag-suite.result != 'success' ||
          needs.run-adalora-suite.result != 'success'
          )
        id: llm-state
        shell: bash
        run: |
          labels="llm-ci-failure,status/needs-triage"
          if [ "${{ needs.run-inference-suite.result }}" != "success" ]; then
            labels="${labels},ci/llm-inference-failed"
          fi
          if [ "${{ needs.run-rag-suite.result }}" != "success" ]; then
            labels="${labels},ci/llm-rag-failed"
          fi
          if [ "${{ needs.run-adalora-suite.result }}" != "success" ]; then
            labels="${labels},ci/llm-adalora-failed"
          fi
          echo "labels=${labels}" >> "$GITHUB_OUTPUT"

      - name: Upsert failure issue
        if: >
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) &&
          (
          needs.run-inference-suite.result != 'success' ||
          needs.run-rag-suite.result != 'success' ||
          needs.run-adalora-suite.result != 'success'
          )
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: 'LLM CI failure tracker — ${{ github.ref_name }}'
          issue-marker: '<!-- llm-ci-failure:ref:${{ github.ref_name }} -->'
          issue-body: |
            <!-- llm-ci-failure:ref:${{ github.ref_name }} -->
            ## LLM Inferencing CI Failure

            **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            | Suite | Result |
            |---|---|
            | INFER-01..10 | ${{ needs.run-inference-suite.result }} |
            | RAG-01..07   | ${{ needs.run-rag-suite.result }} |
            | LORA-01..07  | ${{ needs.run-adalora-suite.result }} |

            Please investigate and fix before the next release gate.

            _Auto-generated by build-llm-inference.yml at ${{ github.run_id }}_
          labels-to-add: ${{ steps.llm-state.outputs.labels }}
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Normalize LLM failure state labels
        if: >
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) &&
          (
          needs.run-inference-suite.result != 'success' ||
          needs.run-rag-suite.result != 'success' ||
          needs.run-adalora-suite.result != 'success'
          )
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-marker: '<!-- llm-ci-failure:ref:${{ github.ref_name }} -->'
          labels-to-add: ${{ steps.llm-state.outputs.labels }}
          status-group: 'llm-ci-failure,ci/llm-inference-failed,ci/llm-rag-failed,ci/llm-adalora-failed,status/needs-triage,status/in-progress,status/needs-approval,status/resolved'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Comment LLM recovery state
        if: >
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) &&
          (
          needs.run-inference-suite.result == 'success' &&
          needs.run-rag-suite.result == 'success' &&
          needs.run-adalora-suite.result == 'success'
          )
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-marker: '<!-- llm-ci-failure:ref:${{ github.ref_name }} -->'
          allow-missing: true
          issue-body: |
            ✅ LLM CI recovered: no suite failure in run #${{ github.run_number }}.

            _Auto-updated by build-llm-inference.yml at ${{ github.run_id }}_
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Fail if a required suite did not succeed
        if: always()
        env:
          INFERENCE_RESULT: ${{ needs.run-inference-suite.result }}
          RAG_RESULT: ${{ needs.run-rag-suite.result }}
          ADALORA_RESULT: ${{ needs.run-adalora-suite.result }}
        run: |
          set -euo pipefail
          for result in "${INFERENCE_RESULT}" "${RAG_RESULT}" "${ADALORA_RESULT}"; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::Required LLM CI suite ended with status '${result}', expected success."
              exit 1
            fi
          done

      - name: Normalize LLM resolved state
        if: >
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) &&
          (
          needs.run-inference-suite.result == 'success' &&
          needs.run-rag-suite.result == 'success' &&
          needs.run-adalora-suite.result == 'success'
          )
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-marker: '<!-- llm-ci-failure:ref:${{ github.ref_name }} -->'
          allow-missing: true
          labels-to-add: 'status/resolved'
          status-group: 'llm-ci-failure,ci/llm-inference-failed,ci/llm-rag-failed,ci/llm-adalora-failed,status/needs-triage,status/in-progress,status/needs-approval,status/resolved'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}
