name: PII Redaction Policy Check

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'copilot/**'
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'config/pii_patterns.yaml'
      - '.github/scripts/check_pii_leakage.py'
      - '.github/workflows/pii-redaction-check.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fuzz/**'
      - 'config/pii_patterns.yaml'
      - '.github/scripts/check_pii_leakage.py'
      - '.github/workflows/pii-redaction-check.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pii-leakage-lint:
    name: PII Leakage Static Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run PII leakage check
        run: |
          python .github/scripts/check_pii_leakage.py --root .
        # Exit code 1 means violations found → CI fails.
        # Exit code 2 means script configuration error.

  pii-pattern-config-validation:
    name: PII Pattern Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate pii_patterns.yaml schema
        run: |
          python - <<'EOF'
          import sys
          import yaml

          paths = [
              "config/pii_patterns.yaml",
              "config/security/pii_patterns.yaml",
          ]

          errors = []
          for path in paths:
              try:
                  with open(path) as f:
                      cfg = yaml.safe_load(f)
              except FileNotFoundError:
                  print(f"INFO: {path} not found – skipping")
                  continue
              except yaml.YAMLError as e:
                  errors.append(f"{path}: YAML parse error – {e}")
                  continue

              if not isinstance(cfg, dict):
                  errors.append(f"{path}: Top-level must be a mapping")
                  continue

              engines = cfg.get("detection_engines", [])
              if not isinstance(engines, list) or len(engines) == 0:
                  errors.append(f"{path}: 'detection_engines' must be a non-empty list")
                  continue

              for i, engine in enumerate(engines):
                  for field in ("type", "enabled"):
                      if field not in engine:
                          errors.append(
                              f"{path}: detection_engines[{i}] missing required field '{field}'"
                          )

              print(f"OK: {path} ({len(engines)} engine(s) defined)")

          if errors:
              print("\nValidation FAILED:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)

          print("All PII pattern configs are valid.")
          EOF

  pii-docs-check:
    name: PII Documentation Presence Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check that PII Redaction Policy docs exist
        run: |
          DOC="docs/en/security/PII_REDACTION_POLICY.md"
          if [ ! -f "$DOC" ]; then
            echo "ERROR: $DOC is missing."
            echo "Every PII redaction policy change must be accompanied by documentation."
            exit 1
          fi
          echo "OK: $DOC found"

      - name: Check docs contain required sections
        run: |
          DOC="docs/en/security/PII_REDACTION_POLICY.md"
          REQUIRED_SECTIONS=(
            "## What is PII"
            "## Redaction Policy"
            "## Configuration"
            "## Extending"
          )
          MISSING=()
          for section in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -qF "$section" "$DOC"; then
              MISSING+=("$section")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "ERROR: The following required sections are missing from $DOC:"
            for s in "${MISSING[@]}"; do
              echo "  $s"
            done
            exit 1
          fi
          echo "OK: All required sections present in $DOC"
