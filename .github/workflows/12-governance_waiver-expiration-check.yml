name: '12: Governance - Waiver Expiration Check'

on:
  schedule:
    # Run daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  check-expiration:
    name: Check Expiring Waivers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Check Expiring Waivers
        id: check
        run: |
          python3 .github/scripts/waiver_validator.py \
            --check-expiration \
            --output /tmp/expiring_waivers.json
          
          RESULT=$(cat /tmp/expiring_waivers.json)
          echo "result_json=$RESULT" >> $GITHUB_OUTPUT
          
          COUNT=$(echo "$RESULT" | python3 -c "import sys, json; print(json.load(sys.stdin)['total'])")
          echo "expiring_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Post Expiration Reminders
        if: steps.check.outputs.expiring_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.check.outputs.result_json }}`);
            
            // Group by PR
            const byPr = {};
            for (const waiver of result.expiring_waivers) {
              if (!byPr[waiver.pr_number]) {
                byPr[waiver.pr_number] = [];
              }
              byPr[waiver.pr_number].push(waiver);
            }
            
            // Post reminder on each PR
            for (const [prNum, waivers] of Object.entries(byPr)) {
              let markdown = "⏰ **Waiver Expiration Reminder**\n\n";
              markdown += "The following waivers are expiring soon:\n\n";
              
              for (const waiver of waivers) {
                markdown += `- **${waiver.gate_id}**: Expires in ${waiver.days_until_expiry} days\n`;
              }
              
              markdown += `\nPlease resolve the underlying issue or request a new waiver before expiration.`;
              
              github.rest.issues.createComment({
                issue_number: prNum,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: markdown
              });
            }

  update-dashboard:
    name: Update Live Dashboard
    runs-on: ubuntu-latest
    needs: [check-expiration]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Generate Dashboard
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime
          from pathlib import Path
          
          # Read audit log and waiver list
          repo_root = Path('.')
          audit_log = repo_root / 'ai_working' / 'MERGE_GATE_AUDIT_LOG.json'
          waiver_log = repo_root / 'ai_working' / 'ENFORCEMENT_WAIVERS.md'
          
          # Initialize dashboard
          dashboard = f"""# Merge Gate Status Dashboard (Live)

Last Updated: {datetime.now().isoformat()}Z

## Current Merge Requests Under Gate Validation

| PR # | Source | Target | Modules | Tier 0 | Tier 1 | Status |
|------|--------|--------|---------|--------|--------|--------|
| (no active PRs) | - | - | - | - | - | - |

## Active Waivers

| PR | Gate | Expires | Days Left |
|----|------|---------|-----------|
| (no active waivers) | - | - | - |

## Recent Escalations

- (no recent escalations)

## Weekly Summary

**PRs Merged:** 0
**Gates PASSED:** 0
**Gates FAILED:** 0
**Waivers Issued:** 0
**Average Gate Time:** N/A

---

**Automation Version:** Phase 3
**Next Update:** Tomorrow at 09:00 UTC
"""
          
          # Write dashboard
          dashboard_path = Path('docs/governance/MERGE_GATE_STATUS_LIVE.md')
          dashboard_path.parent.mkdir(parents=True, exist_ok=True)
          with open(dashboard_path, 'w') as f:
              f.write(dashboard)
          
          print(f"Dashboard updated: {dashboard_path}")
          EOF

      - name: Commit Dashboard Update
        run: |
          git config user.name "ThemisDB Bot"
          git config user.email "bot@themisdb.ai"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update merge gate live dashboard"
          git push origin HEAD:${{ github.ref }} || true
