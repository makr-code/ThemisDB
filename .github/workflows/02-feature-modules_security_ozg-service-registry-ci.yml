name: OZG Service Registry CI

# Validates OZG Service Schema Registry (v2.2.0):
#   - OZGServiceEntry, IOZGServiceRegistry, InMemoryOZGServiceRegistry
#   - German Onlinezugangsgesetz (OZG 2.0) service catalog integration
#
# Acceptance criteria covered:
#   AC-OZG-01  Empty registry has size 0 and empty() == true
#   AC-OZG-02  registerService() adds an entry; size() == 1
#   AC-OZG-03  registerService() throws on empty ID
#   AC-OZG-04  registerService() throws on duplicate ID
#   AC-OZG-05  findById() returns nullopt for unknown ID
#   AC-OZG-06  findById() returns the correct entry after registration
#   AC-OZG-07  updateService() replaces an existing entry
#   AC-OZG-08  updateService() throws on unknown ID
#   AC-OZG-09  updateService() throws on empty ID
#   AC-OZG-10  removeService() removes a known entry; size decrements
#   AC-OZG-11  removeService() is a no-op for unknown IDs
#   AC-OZG-12  findByStatus() returns only matching entries
#   AC-OZG-13  findByStatus() returns empty vector when no match
#   AC-OZG-14  findByState() returns only services applicable to the state
#   AC-OZG-15  findByState() returns empty vector when no match
#   AC-OZG-16  findByComplianceTag() returns only tagged services
#   AC-OZG-17  findByComplianceTag() returns empty for unknown tag
#   AC-OZG-18  all() returns all registered entries
#   AC-OZG-19  all() returns empty vector when registry is empty
#   AC-OZG-20  OZGDataField default values are correct
#   AC-OZG-21  OZGServiceEntry with multiple fields round-trips through registry
#   AC-OZG-22  findByStatus() handles all OZGServiceStatus values
#   AC-OZG-23  SDG-relevant flag is preserved on findById()
#   AC-OZG-24  legal_basis vector is preserved
#   AC-OZG-25  fim_process_id is preserved
#   AC-OZG-26  Concurrent registerService() calls are thread-safe
#   AC-OZG-27  Concurrent findById() and registerService() are thread-safe
#   AC-OZG-28  Multiple states per service — findByState() finds correct entries
#   AC-OZG-29  Polymorphic usage via IOZGServiceRegistry*
#   AC-OZG-30  ONLINE_TRANSACTION services are searchable by status

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/importers/ozg_service_registry.h'
      - 'tests/test_ozg_service_registry.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_security_ozg-service-registry-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/importers/ozg_service_registry.h'
      - 'tests/test_ozg_service_registry.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_security_ozg-service-registry-ci.yml'
  workflow_dispatch:

concurrency:
  group: ozg-service-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  ozg-service-registry:
    name: OZG Service Registry – ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: ci-scope-classifier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            ${{ matrix.cc }} ${{ matrix.cxx }} \
            libgtest-dev libgmock-dev

      - name: Configure focused tests
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S tests -B build_ozg \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTHEMIS_ROOT_DIR=${{ github.workspace }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build focused test binary
        run: |
          cmake --build build_ozg --target test_ozg_service_registry_focused -- -j$(nproc)

      - name: Run via ctest
        working-directory: build_ozg
        run: |
          ctest --output-on-failure \
            -R "OZGServiceRegistryFocusedTests" \
            2>&1 | tee ozg_ctest.txt

      - name: Run tests directly
        working-directory: build_ozg
        run: |
          ./test_ozg_service_registry_focused \
            --gtest_output=xml:ozg_gtest.xml \
            2>&1 | tee ozg_gtest_output.txt

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozg-service-registry-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          retention-days: 14
          path: |
            build_ozg/ozg_ctest.txt
            build_ozg/ozg_gtest.xml
            build_ozg/ozg_gtest_output.txt

      - name: Write job summary
        if: always()
        run: |
          echo "## OZG Service Registry CI — ${{ matrix.os }} / ${{ matrix.compiler }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Suite: OZGServiceRegistryFocusedTests" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Tests |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| OZGServiceRegistry | 30 (AC-OZG-01..30) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: 30 acceptance-criteria tests**" >> $GITHUB_STEP_SUMMARY
