name: Publish · Hyperscaler Edition

# Publishes Hyperscaler build artefacts, Docker images, and Helm charts
# to the private Hyperscaler registry.
#
# TRIGGERS
# --------
#   • Push of a tag matching hyperscaler-v* (e.g. hyperscaler-v3.0.0)
#     from the hyperscaler branch.
#   • Manual workflow_dispatch for dry-run / re-publish.
#
# SECURITY
# --------
#   • Publishing steps run ONLY inside the 'hyperscaler-prod' environment,
#     which requires reviewer approval before the job can access secrets.
#   • Secrets are NEVER available in fork-PR builds.
#   • The build step (compile + test) runs without any secrets.
#
# REQUIRED SECRETS (in 'hyperscaler-prod' environment)
# -------------------------------------------------------
#   HYPERSCALER_REGISTRY_URL     – OCI/Docker registry URL
#   HYPERSCALER_REGISTRY_USER    – Registry username
#   HYPERSCALER_REGISTRY_TOKEN   – Registry push token
#   HYPERSCALER_HELM_REPO_URL    – Helm repository URL (OCI or chart museum)
#   HYPERSCALER_HELM_REPO_USER   – Helm repo username
#   HYPERSCALER_HELM_REPO_TOKEN  – Helm repo push token
#   HYPERSCALER_SIGNING_KEY      – GPG private key for artefact signing
#   HYPERSCALER_SIGNING_PASSPHRASE – Passphrase for the signing key
#
# REQUIRED ENVIRONMENTS (configure in repo Settings → Environments)
#   hyperscaler-prod             – Protection rules: require reviewer approval

on:
  push:
    tags:
      - 'hyperscaler-v*'

  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to publish (e.g. hyperscaler-v3.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry-run: build but do NOT publish'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Job 1 · Build & Test (no secrets, no environment gate)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build Hyperscaler Edition
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Resolve tag name
        id: resolve-tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          VERSION="${TAG#hyperscaler-v}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG  version: $VERSION"

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Initialize llama.cpp submodule
        run: git submodule update --init --depth=1 llama.cpp

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:  gcc-12
          cxx: g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Build Hyperscaler edition
        uses: ./.github/actions/configure-themis
        with:
          cc:         gcc-12
          cxx:        g++-12
          build-type: Release
          edition:    HYPERSCALER
          ci-mode:    'true'
          build-target: themis_tests

      - name: Run Hyperscaler smoke tests
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildConfiguration*:BuildInfo*:ModuleLoader*:FeatureFlags*" \
            --gtest_output="xml:hyperscaler_smoke_results.xml" \
            2>&1 | tee hyperscaler_smoke_output.txt

      - name: Validate Helm charts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "helm" ]]; then
            CHART_COUNT=$(find helm/ -name "Chart.yaml" 2>/dev/null | wc -l)
            echo "Found $CHART_COUNT Helm chart(s)"
            find helm/ -name "Chart.yaml" -print
          else
            echo "No helm/ directory found – skipping Helm validation."
          fi

      - name: Build Docker image (Hyperscaler)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hyperscaler/Dockerfile
          push: false
          tags: |
            themisdb-hyperscaler:${{ steps.resolve-tag.outputs.version }}-hyperscaler-binary-x64
            themisdb-hyperscaler:${{ steps.resolve-tag.outputs.version }}-hyperscaler-binary-arm
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Hyperscaler artefacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve-tag.outputs.version }}"
          BASENAME="themisdb-${VERSION}-hyperscaler-binary-x64"
          mkdir -p dist/hyperscaler
          cp build/themis_tests "dist/hyperscaler/${BASENAME}" 2>/dev/null || true
          tar -czf "dist/${BASENAME}.tar.gz" -C dist/hyperscaler . 2>/dev/null || true
          echo "Artefacts staged:"
          ls -lh dist/ || true

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: hyperscaler-build-${{ steps.resolve-tag.outputs.version }}
          retention-days: 30
          path: |
            dist/
            build/*_results.xml
            build/*_output.txt

      - name: Write build summary
        if: always()
        run: |
          echo "## 🌐 Hyperscaler Build — ${{ steps.resolve-tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Edition | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| HYPERSCALER | ✅ Built |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`${{ steps.resolve-tag.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# Job 2 · Publish Docker image (environment-gated)
# ─────────────────────────────────────────────────────────────────────────────
  publish-docker:
    name: Publish Hyperscaler Docker image
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    environment: hyperscaler-prod

    permissions:
      contents: read

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#hyperscaler-v}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Hyperscaler registry
        if: steps.version.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HYPERSCALER_REGISTRY_URL }}
          username: ${{ secrets.HYPERSCALER_REGISTRY_USER }}
          password: ${{ secrets.HYPERSCALER_REGISTRY_TOKEN }}

      - name: Build and push Hyperscaler Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hyperscaler/Dockerfile
          push: ${{ steps.version.outputs.dry_run != 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.HYPERSCALER_REGISTRY_URL }}/themisdb-hyperscaler:${{ steps.version.outputs.version }}-hyperscaler-binary-x64
            ${{ secrets.HYPERSCALER_REGISTRY_URL }}/themisdb-hyperscaler:${{ steps.version.outputs.version }}-hyperscaler-binary-arm
            ${{ secrets.HYPERSCALER_REGISTRY_URL }}/themisdb-hyperscaler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write Docker publish summary
        if: always()
        run: |
          DRY_RUN="${{ steps.version.outputs.dry_run }}"
          echo "## 🐳 Hyperscaler Docker Publish — ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | \`${DRY_RUN:-false}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`hyperscaler-prod\` (approval required) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
# Job 3 · Publish Helm charts (environment-gated)
# ─────────────────────────────────────────────────────────────────────────────
  publish-helm:
    name: Publish Helm charts
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    environment: hyperscaler-prod

    permissions:
      contents: read

    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#hyperscaler-v}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          echo "dry_run=${DRY_RUN:-false}" >> "$GITHUB_OUTPUT"

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package Helm charts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          if [[ -d "helm" ]]; then
            mkdir -p helm-dist
            find helm/ -name "Chart.yaml" -exec dirname {} \; | while read chart_dir; do
              helm package "$chart_dir" --version "$VERSION" --destination helm-dist/
            done
            echo "Packaged charts:"
            ls -lh helm-dist/
          else
            echo "No helm/ directory – skipping Helm packaging."
          fi

      - name: Log in to Helm repository
        if: steps.version.outputs.dry_run != 'true'
        shell: bash
        run: |
          helm registry login "${{ secrets.HYPERSCALER_HELM_REPO_URL }}" \
            --username "${{ secrets.HYPERSCALER_HELM_REPO_USER }}" \
            --password "${{ secrets.HYPERSCALER_HELM_REPO_TOKEN }}"

      - name: Push Helm charts
        shell: bash
        run: |
          DRY_RUN="${{ steps.version.outputs.dry_run }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "DRY-RUN: would push Helm charts to ${{ secrets.HYPERSCALER_HELM_REPO_URL }}"
            ls helm-dist/ || echo "No charts packaged."
          else
            for pkg in helm-dist/*.tgz; do
              [[ -f "$pkg" ]] || continue
              helm push "$pkg" "oci://${{ secrets.HYPERSCALER_HELM_REPO_URL }}"
              echo "Pushed: $pkg"
            done
          fi

      - name: Write Helm publish summary
        if: always()
        run: |
          DRY_RUN="${{ steps.version.outputs.dry_run }}"
          echo "## ⛵ Hyperscaler Helm Publish — ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | \`${DRY_RUN:-false}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`hyperscaler-prod\` (approval required) |" >> "$GITHUB_STEP_SUMMARY"
