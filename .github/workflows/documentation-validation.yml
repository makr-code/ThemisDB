name: Documentation Validation

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    paths:
      - 'docs/**'
      - 'compendium/**'
      - 'aql/**'
      - 'scripts/docs-lint.py'
      - 'scripts/link-check.py'
      - 'scripts/toc-check.py'
      - 'scripts/validate-docs.sh'
      - 'mkdocs.yml'
      - 'mkdocs-nopdf.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'compendium/**'
      - 'aql/**'
      - 'scripts/docs-lint.py'
      - 'scripts/link-check.py'
      - 'scripts/toc-check.py'
      - 'scripts/validate-docs.sh'
      - 'mkdocs.yml'
      - 'mkdocs-nopdf.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-lint:
    name: Documentation Linting
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run documentation linter
        run: python3 scripts/docs-lint.py

      - name: Generate lint report (JSON)
        if: always()
        run: python3 scripts/docs-lint.py --format json --output /tmp/lint-report.json
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: /tmp/lint-report.json
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## 📝 Documentation Linting" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/docs-lint.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  link-check:
    name: Link Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run link checker (internal links only)
        run: python3 scripts/link-check.py --internal-only

      - name: Generate link report (JSON)
        if: always()
        run: python3 scripts/link-check.py --internal-only --format json --output /tmp/link-report.json
        continue-on-error: true

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: /tmp/link-report.json
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔗 Link Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/link-check.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Scope** | Internal links only |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  external-link-check:
    name: External Link Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run link checker (all links)
        run: python3 scripts/link-check.py
        continue-on-error: true

      - name: Generate external link report (JSON)
        if: always()
        run: python3 scripts/link-check.py --format json --output /tmp/external-link-report.json
        continue-on-error: true

      - name: Upload external link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: /tmp/external-link-report.json
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## 🌐 External Link Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/link-check.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Scope** | All links (internal + external) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  toc-validation:
    name: TOC Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run TOC validator
        run: python3 scripts/toc-check.py

      - name: Generate TOC report (JSON)
        if: always()
        run: python3 scripts/toc-check.py --format json --output /tmp/toc-report.json
        continue-on-error: true

      - name: Upload TOC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toc-report
          path: /tmp/toc-report.json
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## 📚 TOC Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/toc-check.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Config** | \`mkdocs.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [docs-lint, link-check, toc-validation]
    if: always()

    permissions:
      contents: read

    steps:
      - name: Check job results
        run: |
          LINT="${{ needs.docs-lint.result }}"
          LINK="${{ needs.link-check.result }}"
          TOC="${{ needs.toc-validation.result }}"

          echo "## ✅ Documentation Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          [[ "$LINT" == "success" ]] && LINT_ICON="✅" || LINT_ICON="❌"
          [[ "$LINK" == "success" ]] && LINK_ICON="✅" || LINK_ICON="❌"
          [[ "$TOC"  == "success" ]] && TOC_ICON="✅"  || TOC_ICON="❌"

          echo "| Documentation Linting | ${LINT_ICON} ${LINT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Link Validation       | ${LINK_ICON} ${LINK} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TOC Validation        | ${TOC_ICON} ${TOC} |"  >> "$GITHUB_STEP_SUMMARY"

          if [[ "$LINT" != "success" || "$LINK" != "success" || "$TOC" != "success" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ One or more required documentation checks failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All required documentation checks passed." >> "$GITHUB_STEP_SUMMARY"
