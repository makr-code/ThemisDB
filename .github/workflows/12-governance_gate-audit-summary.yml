name: '12: Governance - Audit Summary & Weekly Report'

on:
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * MON'
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: read
  issues: write

jobs:
  generate-summary:
    name: Generate Weekly Gate Audit Summary
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Analyze Gate Metrics
        run: |
          python3 << 'EOF'
          import json
          import re
          from pathlib import Path
          from datetime import datetime, timedelta
          from collections import defaultdict
          
          repo_root = Path('.')
          audit_log_file = repo_root / 'ai_working' / 'MERGE_GATE_AUDIT_LOG.jsonl'
          waiver_log_file = repo_root / 'ai_working' / 'ENFORCEMENT_WAIVERS.md'
          
          # Initialize metrics
          metrics = {
              "period_start": (datetime.now() - timedelta(days=7)).isoformat(),
              "period_end": datetime.now().isoformat(),
              "total_validations": 0,
              "total_passes": 0,
              "total_failures": 0,
              "total_waivers": 0,
              "gate_failure_counts": defaultdict(int),
              "most_common_failures": [],
              "waiver_by_gate": defaultdict(int),
              "average_gate_time_minutes": 0
          }
          
          # Parse audit log
          validation_times = []
          if audit_log_file.exists():
              with open(audit_log_file) as f:
                  for line in f:
                      try:
                          entry = json.loads(line.strip())
                          if "validation_time" in entry:
                              metrics["total_validations"] += 1
                              if "tier0_status" in entry:
                                  if entry["tier0_status"] == "PASS":
                                      metrics["total_passes"] += 1
                                  else:
                                      metrics["total_failures"] += 1
                                  
                                  # Track failed gates
                                  for gate in entry.get("gates", []):
                                      if gate["status"] == "FAIL":
                                          metrics["gate_failure_counts"][gate["gate_id"]] += 1
                      except json.JSONDecodeError:
                          pass
          
          # Parse waiver log
          if waiver_log_file.exists():
              with open(waiver_log_file) as f:
                  content = f.read()
                  # Count active waivers in markdown table
                  waiver_rows = re.findall(r'\| #\d+ \| (\S+) \|.*\| ACTIVE \|', content)
                  metrics["total_waivers"] = len(waiver_rows)
                  for gate_id in waiver_rows:
                      metrics["waiver_by_gate"][gate_id] += 1
          
          # Get most common failures
          sorted_failures = sorted(metrics["gate_failure_counts"].items(), key=lambda x: x[1], reverse=True)
          metrics["most_common_failures"] = [{"gate": g, "count": c} for g, c in sorted_failures[:5]]
          
          # Write metrics
          metrics_file = repo_root / 'ai_working' / 'GATE_METRICS_WEEKLY.json'
          with open(metrics_file, 'w') as f:
              json.dump(metrics, f, indent=2, default=str)
          
          print(json.dumps(metrics, indent=2, default=str))
          EOF

      - name: Create Summary Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metricsJson = fs.readFileSync('ai_working/GATE_METRICS_WEEKLY.json', 'utf-8');
            const metrics = JSON.parse(metricsJson);
            
            const passRate = metrics.total_validations > 0 
              ? ((metrics.total_passes / metrics.total_validations) * 100).toFixed(1)
              : 'N/A';
            
            let markdown = `## Weekly Merge Gate Audit Summary\n\n`;
            markdown += `**Period:** ${metrics.period_start.split('T')[0]} to ${metrics.period_end.split('T')[0]}\n\n`;
            
            markdown += `### Key Metrics\n\n`;
            markdown += `| Metric | Value |\n`;
            markdown += `|--------|-------|\n`;
            markdown += `| Total Validations | ${metrics.total_validations} |\n`;
            markdown += `| Passed | ${metrics.total_passes} |\n`;
            markdown += `| Failed | ${metrics.total_failures} |\n`;
            markdown += `| Pass Rate | ${passRate}% |\n`;
            markdown += `| Active Waivers | ${metrics.total_waivers} |\n\n`;
            
            if (metrics.most_common_failures.length > 0) {
              markdown += `### Most Common Failures\n\n`;
              markdown += `| Gate | Count |\n`;
              markdown += `|------|-------|\n`;
              for (const failure of metrics.most_common_failures) {
                markdown += `| ${failure.gate} | ${failure.count} |\n`;
              }
              markdown += `\n`;
            }
            
            markdown += `### Active Waivers by Gate\n\n`;
            if (Object.keys(metrics.waiver_by_gate).length > 0) {
              markdown += `| Gate | Active Waivers |\n`;
              markdown += `|------|----------------|\n`;
              for (const [gate, count] of Object.entries(metrics.waiver_by_gate)) {
                markdown += `| ${gate} | ${count} |\n`;
              }
            } else {
              markdown += `No active waivers\n`;
            }
            
            markdown += `\n### Recommendations\n\n`;
            if (passRate < 80) {
              markdown += `- ⚠️ Gate pass rate below 80%. Review most common failures and remediate root causes.\n`;
            }
            if (metrics.total_waivers > 3) {
              markdown += `- ⚠️ ${metrics.total_waivers} active waivers. Review trending gates for escalation to Tier 0.\n`;
            }
            if (metrics.most_common_failures.length > 0) {
              const topFailure = metrics.most_common_failures[0];
              markdown += `- **${topFailure.gate}** failed ${topFailure.count} times. Investigate root cause and implement fix.\n`;
            }
            
            markdown += `\n---\n`;
            markdown += `*Report generated by Merge Gate Audit automation*\n`;
            
            // Create issue
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Merge Gate Audit Summary - ${new Date().toISOString().split('T')[0]}`,
              body: markdown,
              labels: ['governance', 'merge-gate', 'automation'],
              assignees: ['makr-code']  // Assign to release lead
            });

      - name: Update Live Dashboard
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          from datetime import datetime
          
          repo_root = Path('.')
          metrics_file = repo_root / 'ai_working' / 'GATE_METRICS_WEEKLY.json'
          
          if metrics_file.exists():
              with open(metrics_file) as f:
                  metrics = json.load(f)
              
              pass_rate = (metrics['total_passes'] / metrics['total_validations'] * 100) if metrics['total_validations'] > 0 else 0
              
              dashboard = f"""# Merge Gate Status Dashboard (Live)

Last Updated: {datetime.now().isoformat()}Z

## Weekly Summary (Last 7 Days)

| Metric | Value |
|--------|-------|
| Validations | {metrics['total_validations']} |
| Pass Rate | {pass_rate:.1f}% |
| Passes | {metrics['total_passes']} |
| Failures | {metrics['total_failures']} |
| Active Waivers | {metrics['total_waivers']} |

## Most Common Failures

| Gate | Failures |
|------|----------|
"""
              for failure in metrics.get('most_common_failures', []):
                  dashboard += f"| {failure['gate']} | {failure['count']} |\n"
              
              dashboard += f"""
## Active Waivers

| Gate | Count |
|------|-------|
"""
              for gate, count in metrics.get('waiver_by_gate', {}).items():
                  dashboard += f"| {gate} | {count} |\n"
              
              dashboard += f"""
---

**Automation Version:** Phase 3
**Next Update:** {(datetime.now() + timedelta(days=7)).isoformat()}Z
**Last Gate Status:** {'✅ Healthy' if pass_rate >= 80 else '⚠️ Degraded' if pass_rate >= 70 else '❌ Critical'}
"""
              
              dashboard_path = repo_root / 'docs' / 'governance' / 'MERGE_GATE_STATUS_LIVE.md'
              dashboard_path.parent.mkdir(parents=True, exist_ok=True)
              with open(dashboard_path, 'w') as f:
                  f.write(dashboard)
          EOF
        env:
          PYTHONPATH: .
