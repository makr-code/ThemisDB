name: "Publish: GitHub Wiki"

# Rechenaufwand-Score: R=1 (K=1, L=1, N=1) | last-calibrated: 2026-08-31
# Publishes repository documentation to the GitHub Wiki with breadcrumb navigation
# and automatic document sorting by currency.
#
# Pipeline phases:
#   Phase 1 (maintenance-docs.yml): regenerates ai_context/developer_llm_wiki/*.md
#            and optionally extracts Doxygen XML to API_REFERENCE_<module>.md.
#   Phase 2 (this workflow):
#       1. Checkout repository
#       2. Build wiki staging (scripts/build_wiki.py)
#            - user-facing docs (tutorials, AQL/API ref, FAQ, quickstart, ...)
#            - module/plugin docs, developer-wiki artifacts
#            - audience-first _Sidebar.md, _Footer.md, Module-Index.md
#            - breadcrumb navigation on all content pages (enabled by default)
#            - document sorting by currency (freshness + modification date)
#       3. Validate internal [[links]] (scripts/validate_wiki_links.py)
#       4. [Optional] AI enrichment via GitHub Models API (workflow_dispatch opt-in)
#       5. Dispatch the human-review issue gate workflow
#       6. The gate upserts a single tracking issue and adds a per-run comment
#
# Wiki Features:
#   - Breadcrumbs: Every page shows "Home > Category > ... > Page" navigation
#   - Currency Sorting: Fresh documents (0-30 days) sorted first for visibility
#   - Community Guardrails: Blocks private content paths before publishing
#   - Link Validation: Ensures all [[wiki links]] point to valid pages
#
# Workflow interplay:
#   - maintenance-docs.yml fires first (on push to develop when ai_context/** or
#     root docs change), regenerating developer_llm_wiki artifacts.
#     This workflow then fires via workflow_run trigger.
#   - maintenance-ai-working.yml can also fire this workflow after compact/sync
#     updates that affect ai_context/developer_llm_wiki.
#   - SoC boundary: upstream workflows generate and curate documentation assets;
#     this workflow only stages, validates and publishes wiki pages.
#   - gate-pr-doxygen-governance.yml governs quality at PR time only;
#     this workflow is post-merge.
#
# Prerequisites:
#   1. GitHub Wiki must be enabled (Settings -> Features -> Wikis).
#   2. Wiki must be initialized with at least one page before this workflow
#      can push (create one page once via the GitHub UI).
#   3. GITHUB_TOKEN with contents:write scope for the wiki push.

on:
  # SoC chain: this publisher runs after documentation-producing workflows finish successfully.
  # Upstream generators keep their own responsibilities; this workflow only stages, validates and publishes.
  workflow_run:
    workflows:
      - "Maintenance: Docs"
      - "Maintenance: AI Working Cleanup - LLM Wiki"
    types:
      - completed

  schedule:
    - cron: '0 1 * * *'   # Nightly 01:00 UTC (staggered away from 03:00 cluster)   # Nightly 03:00 UTC — full wiki sync

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run only (print pages, do not push wiki)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      enable_ai_enrichment:
        description: 'AI enrichment: generate LLM module overviews via GitHub Models API'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      fail_on_broken_links:
        description: 'Fail build if broken [[wiki links]] are found'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
      fail_on_blocked_private:
        description: 'Fail build if private-content guardrail blocks wiki sources (workflow_dispatch only)'
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']
      approve_and_publish:
        description: 'Human approval: approve review and publish to GitHub wiki repository'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  actions: write
  contents: write

concurrency:
  group: publish-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-wiki:
    name: Build, validate and publish wiki
    if: |
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'community')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # Phase 2a0: Generate dynamic glossary from repository documentation
      # -----------------------------------------------------------------------
      - name: Scan glossary term candidates
        id: glossary_scan
        continue-on-error: true
        run: |
          python scripts/scan_glossary_terms.py \
            --repo-root . \
            --output docs/glossary_candidates.json \
            --min-priority low
          echo "candidates_found=true" >> "$GITHUB_OUTPUT"

      - name: Build enriched glossary index
        id: glossary_build
        if: steps.glossary_scan.outputs.candidates_found == 'true'
        continue-on-error: true
        run: |
          python scripts/build_glossary_with_copilot.py \
            --input docs/glossary_candidates.json \
            --output docs/glossary_index.json \
            --repo-root . \
            --enable-copilot false
          echo "index_created=true" >> "$GITHUB_OUTPUT"

      - name: Generate language-specific glossaries
        id: glossary_gen
        if: steps.glossary_build.outputs.index_created == 'true'
        continue-on-error: true
        run: |
          python scripts/generate_glossaries.py \
            --input docs/glossary_index.json \
            --output docs/ \
            --languages en,de,fr
          echo "glossaries_generated=true" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Phase 2a: Build wiki staging directory
      # -----------------------------------------------------------------------
      - name: Build wiki staging
        id: build
        env:
          _RAW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          _RAW_REF_NAME: ${{ github.ref_name }}
          _RAW_EVENT_NAME: ${{ github.event_name }}
          _RAW_FAIL_ON_BLOCKED_PRIVATE: ${{ github.event.inputs.fail_on_blocked_private }}
        run: |
          SOURCE_BRANCH="${_RAW_HEAD_BRANCH:-$_RAW_REF_NAME}"
          # Automation policy: workflow_run/schedule warn on blocked-private instead of failing.
          FAIL_ON_BLOCKED_PRIVATE="false"
          if [ "$_RAW_EVENT_NAME" = "workflow_dispatch" ]; then
            FAIL_ON_BLOCKED_PRIVATE="${_RAW_FAIL_ON_BLOCKED_PRIVATE}"
          fi

          build_args=(
            --repo-root .
            --output /tmp/wiki-staging
            --enable-breadcrumbs
            --sort-by currency
            --source-branch "${SOURCE_BRANCH}"
            --manifest /tmp/wiki-manifest.json
          )
          DRY_RUN_FLAG="false"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            build_args+=(--dry-run)
            DRY_RUN_FLAG="true"
          fi
          if [ "${{ steps.glossary_gen.outputs.glossaries_generated }}" = "true" ]; then
            build_args+=(--enable-term-linking --term-link-priority high)
          fi
          if [ "${FAIL_ON_BLOCKED_PRIVATE}" = "true" ]; then
            build_args+=(--fail-on-blocked-private)
          fi
          python scripts/build_wiki.py "${build_args[@]}"
          {
            echo "staging_dir=/tmp/wiki-staging"
            echo "is_dry_run=${DRY_RUN_FLAG}"
            echo "source_branch=${SOURCE_BRANCH}"
            if [ -f /tmp/wiki-manifest.json ]; then
              python3 -c "import json; from pathlib import Path; manifest=json.loads(Path('/tmp/wiki-manifest.json').read_text(encoding='utf-8')); stats=manifest.get('stats', {}); classes=stats.get('source_class_totals', {}); print(f'pages_written={stats.get(\"pages_written\", 0)}'); print(f'blocked_private={stats.get(\"blocked_private\", 0)}'); print(f'primary_sources={classes.get(\"primary\", 0)}'); print(f'secondary_sources={classes.get(\"secondary\", 0)}'); print(f'metadata_sources={classes.get(\"metadata\", 0)}')"
            fi
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Phase 2b: Validate internal [[wiki links]] before publishing
      # -----------------------------------------------------------------------
      - name: Validate internal wiki links
        if: steps.build.outputs.is_dry_run != 'true'
        id: linkcheck
        run: |
          FAIL_ON_BROKEN="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FAIL_ON_BROKEN="${{ github.event.inputs.fail_on_broken_links }}"
          fi
          validate_args=(
            --wiki-dir /tmp/wiki-staging
            --report /tmp/wiki-link-report.txt
          )
          if [ "${FAIL_ON_BROKEN}" = "true" ]; then
            validate_args+=(--fail-on-broken)
          fi
          python scripts/validate_wiki_links.py "${validate_args[@]}"

      - name: Upload link validation report
        if: always() && steps.build.outputs.is_dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wiki-link-report-${{ github.run_number }}
          path: /tmp/wiki-link-report.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload wiki build manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-build-manifest-${{ github.run_number }}
          path: /tmp/wiki-manifest.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Extract link metrics
        if: always() && steps.build.outputs.is_dry_run != 'true'
        id: link_metrics
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          report = Path('/tmp/wiki-link-report.txt')
          broken = 0
          warnings = 0
          checked = 0
          if report.exists():
              text = report.read_text(encoding='utf-8', errors='replace')
              m = re.search(r"Summary:\s*(\d+)\s+broken,\s*(\d+)\s+warnings,\s*(\d+)\s+checked", text)
              if m:
                  broken = int(m.group(1))
                  warnings = int(m.group(2))
                  checked = int(m.group(3))

          out = Path('/tmp/link-metrics.out')
          out.write_text(
              f"broken_links={broken}\n"
              f"link_warnings={warnings}\n"
              f"links_checked={checked}\n",
              encoding='utf-8'
          )
          PY
          cat /tmp/link-metrics.out >> "$GITHUB_OUTPUT"

      - name: Write link check summary
        if: always() && steps.build.outputs.is_dry_run != 'true'
        run: |
          {
            echo "## Wiki Link Validation"
            if [ -f /tmp/wiki-link-report.txt ]; then
              echo '```'
              cat /tmp/wiki-link-report.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # Phase 2c: Optional AI Enrichment (workflow_dispatch opt-in only)
      # Generates LLM-powered module overview pages via GitHub Models API.
      # Non-blocking: failures are warnings; pipeline always continues.
      # -----------------------------------------------------------------------
      - name: AI enrichment — generate module overviews
        if: |
          steps.build.outputs.is_dry_run != 'true' &&
          github.event.inputs.enable_ai_enrichment == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f scripts/ai_wiki_enrichment.py ]; then
            echo "::warning::scripts/ai_wiki_enrichment.py not found; skipping AI enrichment."
            exit 0
          fi
          python scripts/ai_wiki_enrichment.py \
            --staging /tmp/wiki-staging \
            --max-modules 10 \
            --model gpt-4o-mini \
            || echo "::warning::AI enrichment failed or partially completed; continuing."

      # -----------------------------------------------------------------------
      # Phase 3: Publish to GitHub wiki repository (on human approval)
      # -----------------------------------------------------------------------
      - name: Publish wiki to GitHub repository
        id: publish
        if: |
          steps.build.outputs.is_dry_run != 'true' &&
          github.event.inputs.approve_and_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WIKI_REPO="${{ github.repository }}.wiki.git"
          WIKI_CLONE_DIR="/tmp/wiki-publish-clone"
          WIKI_STAGING_DIR="${{ steps.build.outputs.staging_dir }}"

          echo "::notice::Publishing wiki to GitHub repository: $WIKI_REPO"

          # Verify staging directory exists and is non-empty
          if [ ! -d "$WIKI_STAGING_DIR" ] || [ -z "$(find "$WIKI_STAGING_DIR" -type f 2>/dev/null | head -1)" ]; then
            echo "::error::Wiki staging directory is empty or missing: $WIKI_STAGING_DIR"
            exit 1
          fi

          # Clone the wiki repository with inline credentials (token not persisted to disk)
          # Using oauth2 scheme for git authentication
          git clone "https://oauth2:${GH_TOKEN}@github.com/${WIKI_REPO}" "$WIKI_CLONE_DIR"

          cd "$WIKI_CLONE_DIR"

          # Configure git for commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Detect the default branch (handles both master and main conventions)
          # Primary method: git remote show origin | awk
          # Fallback: git symbolic-ref, then master
          DEFAULT_BRANCH=$(git remote show origin 2>/dev/null | awk '/HEAD branch/ {print $NF}' || echo "")
          if [ -z "$DEFAULT_BRANCH" ]; then
            # Only fall back to symbolic-ref if remote show returned nothing
            DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || echo "master")
          fi
          echo "::notice::Detected wiki default branch: $DEFAULT_BRANCH"

          # Remove old pages (but keep git history), including nested directories
          find . -maxdepth 1 -name '*.md' -not -name '_Sidebar.md' -not -name '_Footer.md' -delete
          find . -maxdepth 1 -type d -not -name '.' -not -name '.git' -exec rm -rf {} + 2>/dev/null || true

          # Copy new pages from staging
          cp -r "$WIKI_STAGING_DIR"/* .

          # Check for changes
          git add .
          CHANGES=$(git status --porcelain | wc -l)

          if [ "$CHANGES" -gt 0 ]; then
            COMMIT_MSG="docs: update wiki from repository (run ${{ github.run_number }}, commit ${{ github.sha }})"
            git commit -m "$COMMIT_MSG"

            echo "::notice::Pushing $CHANGES file(s) to wiki repository"
            # Push with inline credentials (not persisted to disk)
            git push "https://oauth2:${GH_TOKEN}@github.com/${WIKI_REPO}" "$DEFAULT_BRANCH"

            {
              echo "wiki_published=true"
              echo "changes_pushed=$CHANGES"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No changes to publish"
            {
              echo "wiki_published=no_changes"
              echo "changes_pushed=0"
            } >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Phase 3a: Hand off to the human-review PR gate (if not published)
      # -----------------------------------------------------------------------
      - name: Dispatch wiki review gate
        id: review_dispatch
        if: |
          steps.build.outputs.is_dry_run != 'true' &&
          github.event.inputs.approve_and_publish != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REVIEW_BRANCH="${{ steps.build.outputs.source_branch }}"
          if [ -z "$REVIEW_BRANCH" ]; then
            REVIEW_BRANCH="${{ github.ref_name }}"
          fi
          if [ -z "$REVIEW_BRANCH" ]; then
            REVIEW_BRANCH="develop"
          fi

          gh api \
            repos/${{ github.repository }}/actions/workflows/wiki-pr-gate.yml/dispatches \
            -f ref="$REVIEW_BRANCH" \
            -f "inputs[source_branch]=$REVIEW_BRANCH" \
            -f "inputs[dry_run]=false"

          {
            echo "review_gate_dispatched=true"
            echo "review_source_branch=$REVIEW_BRANCH"
          } >> "$GITHUB_OUTPUT"

      - name: Write publish summary
        if: always()
        run: |
          PAGE_COUNT=$(find /tmp/wiki-staging -maxdepth 1 -name '*.md' 2>/dev/null | wc -l || echo 0)
          BLOCKED_COUNT="${{ steps.build.outputs.blocked_private || '0' }}"
          PRIMARY="${{ steps.build.outputs.primary_sources || '0' }}"
          SECONDARY="${{ steps.build.outputs.secondary_sources || '0' }}"
          METADATA="${{ steps.build.outputs.metadata_sources || '0' }}"
          BROKEN_LINKS="${{ steps.link_metrics.outputs.broken_links || '0' }}"
          LINK_WARNINGS="${{ steps.link_metrics.outputs.link_warnings || '0' }}"
          LINKS_CHECKED="${{ steps.link_metrics.outputs.links_checked || '0' }}"
          REVIEW_DISPATCHED="${{ steps.review_dispatch.outputs.review_gate_dispatched || 'false' }}"

          TOTAL_SOURCES=$((PRIMARY + SECONDARY + METADATA))
          EVIDENCE_SCORE="n/a"
          PRIMARY_SHARE="n/a"
          SECONDARY_SHARE="n/a"
          METADATA_SHARE="n/a"
          if [ "$TOTAL_SOURCES" -gt 0 ]; then
            EVIDENCE_SCORE=$(awk -v p="$PRIMARY" -v s="$SECONDARY" -v m="$METADATA" 'BEGIN{t=p+s+m; if(t<=0){print "n/a"} else {printf "%.1f", ((p*100)+(s*60)+(m*20))/t}}')
            PRIMARY_SHARE=$(awk -v p="$PRIMARY" -v t="$TOTAL_SOURCES" 'BEGIN{if(t<=0){print "n/a"} else {printf "%.1f%%", (p*100.0)/t}}')
            SECONDARY_SHARE=$(awk -v s="$SECONDARY" -v t="$TOTAL_SOURCES" 'BEGIN{if(t<=0){print "n/a"} else {printf "%.1f%%", (s*100.0)/t}}')
            METADATA_SHARE=$(awk -v m="$METADATA" -v t="$TOTAL_SOURCES" 'BEGIN{if(t<=0){print "n/a"} else {printf "%.1f%%", (m*100.0)/t}}')
          fi

          LINK_HEALTH="PASS"
          if [ "$BROKEN_LINKS" -gt 0 ]; then
            LINK_HEALTH="FAIL"
          elif [ "$LINK_WARNINGS" -gt 0 ]; then
            LINK_HEALTH="WARN"
          fi

          {
            echo "## Wiki Publish Summary"
            echo "- Pages generated: **$PAGE_COUNT**"
            echo "- Pages written (manifest): **${{ steps.build.outputs.pages_written || '0' }}**"
            echo "- Private-content blocks: **${BLOCKED_COUNT}**"
            echo "- Source classes: primary=${PRIMARY}, secondary=${SECONDARY}, metadata=${METADATA}"
            echo "- Breadcrumbs: **Enabled** (navigation at top of each page)"
            echo "- Document sorting: **By currency** (fresh docs prioritized)"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Source branch for blob links: \`${{ steps.build.outputs.source_branch }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Review gate dispatched: **${REVIEW_DISPATCHED}** (issue-based — no PR branch created)"
            echo ""
            echo "### Reader KPIs"
            echo "- Evidence quality score (0-100): **${EVIDENCE_SCORE}**"
            echo "- Evidence mix: primary=${PRIMARY_SHARE}, secondary=${SECONDARY_SHARE}, metadata=${METADATA_SHARE}"
            echo "- Link health: **${LINK_HEALTH}** (broken=${BROKEN_LINKS}, warnings=${LINK_WARNINGS}, checked=${LINKS_CHECKED})"
            echo ""
            echo "### Navigation Features"
            echo "- ✅ Breadcrumb navigation added to all content pages"
            echo "- ✅ Documents sorted by modification date and freshness"
            echo "- ✅ Category indexes auto-generated (Module-Index, Wiki-Index, etc.)"
            echo "- ✅ Community guardrails enforced (private content blocked)"
          } >> "$GITHUB_STEP_SUMMARY"
