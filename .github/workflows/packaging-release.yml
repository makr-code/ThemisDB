name: release-build

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  package:
    name: Build + Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            librocksdb-dev \
            libgtest-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libtbb-dev \
            libyaml-cpp-dev \
            libmimalloc-dev \
            libcurl4-openssl-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc

      - name: Configure (community-release)
        run: |
          cmake --preset community-release

      - name: Build
        run: |
          cmake --build build-community-release --config Release --parallel 4

      - name: Package (ZIP)
        run: |
          if [ -f build-community-release/CPackConfig.cmake ]; then
            (cd build-community-release && cpack -G ZIP --config CPackConfig.cmake -C Release)
          else
            echo "CPackConfig.cmake not found in build dir; skipping cpack"
            exit 1
          fi

      - name: Generate SHA256 checksums
        run: |
          find build-community-release -maxdepth 1 -name '*.zip' -exec sh -c '
            sha256sum "$1" > "$1.sha256"
          ' _ {} \;

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: themisdb-community-zip
          path: |
            build-community-release/*.zip
            build-community-release/*.sha256

  docker:
    name: Build + Push Docker Image
    runs-on: ubuntu-latest
    needs: package
    if: ${{ vars.DOCKER_PUSH == 'true' }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          MINOR="$(echo $VERSION | cut -d. -f1-2)"
          TAGS="themisdb/themisdb:${VERSION},themisdb/themisdb:${MINOR}"
          # Only tag latest for stable releases (no pre-release suffix)
          if [[ ! "$VERSION" =~ [-] ]]; then
            TAGS="$TAGS,themisdb/themisdb:latest"
          fi
          echo "value=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.unified
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            THEMIS_EDITION=COMMUNITY
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker Hub image summary
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "Tags: ${{ steps.tags.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull themisdb/themisdb:${{ steps.version.outputs.value }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  linux-packages:
    name: Build Linux Packages (DEB / RPM / TGZ)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            rpm \
            dpkg-dev \
            file \
            librocksdb-dev \
            libgtest-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            libfmt-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libtbb-dev \
            libyaml-cpp-dev \
            libmimalloc-dev \
            libcurl4-openssl-dev \
            libboost-system-dev \
            libboost-filesystem-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            protobuf-compiler-grpc

      - name: Configure (community-release)
        run: cmake --preset community-release

      - name: Build
        run: cmake --build build-community-release --config Release --parallel 4

      - name: Package DEB
        run: |
          if [ -f build-community-release/CPackConfig.cmake ]; then
            (cd build-community-release && cpack -G DEB --config CPackConfig.cmake -C Release)
          else
            echo "CPackConfig.cmake not found; skipping DEB"
            exit 1
          fi

      - name: Package RPM
        run: |
          (cd build-community-release && cpack -G RPM --config CPackConfig.cmake -C Release) || \
            echo "RPM packaging skipped (rpmbuild not available)"

      - name: Package TGZ
        run: |
          (cd build-community-release && cpack -G TGZ --config CPackConfig.cmake -C Release)

      - name: Generate SHA256 checksums
        run: |
          find build-community-release -maxdepth 1 \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \) \
            -exec sh -c 'sha256sum "$1" > "$1.sha256"' _ {} \;

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: themisdb-community-linux-packages
          path: |
            build-community-release/*.deb
            build-community-release/*.rpm
            build-community-release/*.tar.gz
            build-community-release/*.sha256
