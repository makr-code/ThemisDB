---
name: "Maintenance: Nightly Coverage Collection & Baseline Update"

on:
  schedule:
    # Collect coverage data nightly at 02:00 UTC
    # (runs after build-benchmarks.yml completes at 01:30 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      generate_baseline:
        description: 'Commit the generated baseline to develop (manual live runs only; default: report-only)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Run validation and upload reports without committing the baseline (scheduled runs remain live)'
        type: boolean
        required: false
        default: true

env:
  THEMIS_AUTO_BOOTSTRAP_DEPS: 'OFF'
  THEMIS_ALLOW_MISSING_ROCKSDB: 'OFF'
  THEMIS_DIAGNOSTIC_MODE: 'ON'

permissions:
  contents: read

concurrency:
  group: coverage-report-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-collection:
    name: Collect Coverage & Update Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      
      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov python3-pip jq sccache libfmt-dev libspdlog-dev libboost-system-dev libboost-filesystem-dev libcpp-httplib-dev libyaml-cpp-dev libcurl4-openssl-dev librocksdb-dev nlohmann-json3-dev libgtest-dev libgmock-dev libpugixml-dev
          pip3 install --upgrade pip
          echo "✓ Coverage tools installed"
      
      - name: Setup build cache (vcpkg)
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cache/vcpkg
            vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      
      - name: CMake configure (with coverage enabled)
        run: |
          mkdir -p build
          cmake -S . -B build \
            -DTHEMIS_ENABLE_COVERAGE=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_ENABLE_GPU=ON \
            -DTHEMIS_GPU_AUTO_DETECT=OFF \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_ENABLE_HIP=OFF \
            -DTHEMIS_ENABLE_VULKAN=OFF \
            -DTHEMIS_ENABLE_HTTP_SERVER=OFF \
            -DTHEMIS_ALLOW_MISSING_ROCKSDB=OFF \
            -DTHEMIS_DIAGNOSTIC_MODE=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc
          echo "✓ CMake configured with coverage instrumentation"

      - name: Generate per-module test-quality inventory
        run: |
          ctest --test-dir build --show-only=json-v1 > build/ctest-tests.json
          python3 - <<'PY'
          import collections
          import json
          import re
          from pathlib import Path

          test_sources = sorted(Path("tests/analytics").glob("test_*.cpp"))
          expected = sorted(
              f"{path.stem}_AnalyticsFocusedTests" for path in test_sources
          )
          tests = json.loads(Path("build/ctest-tests.json").read_text(encoding="utf-8"))["tests"]
          registered = [
              test["name"] for test in tests
              if test["name"].endswith("_AnalyticsFocusedTests")
          ]
          counts = collections.Counter(registered)
          duplicates = sorted(name for name, count in counts.items() if count != 1)
          missing = sorted(set(expected) - set(registered))
          unexpected = sorted(set(registered) - set(expected))
          evidence = {
              "expected": expected,
              "registered": registered,
              "duplicates": duplicates,
              "missing": missing,
              "unexpected": unexpected,
          }
          Path("build/analytics-test-registration.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          patterns = {
              "EXPECT_TRUE(true)": re.compile(r"^\s*EXPECT_TRUE\s*\(\s*true\s*\)\s*;\s*(?://.*)?$"),
              "SUCCEED": re.compile(r"^\s*SUCCEED\s*\(\s*\)\s*;\s*(?://.*)?$"),
              "tautological empty-state assertion": re.compile(
                  r"^\s*(?:EXPECT_TRUE|ASSERT_TRUE)\s*\(\s*"
                  r"(?P<value>\w+(?:\.\w+)*\.empty\(\))\s*\|\|\s*"
                  r"!(?P=value)\s*\)\s*;\s*(?://.*)?$"
              ),
          }
          after = {}
          for source in test_sources:
              counts = {name: 0 for name in patterns}
              for line in source.read_text(encoding="utf-8").splitlines():
                  for name, pattern in patterns.items():
                      counts[name] += bool(pattern.match(line))
              after[source.as_posix()] = counts
          assertion_inventory = {
              "baseline": {
                  "source": "Deep-Dive-Audit TST-02 (2026-10-31)",
                  "trivial_assertion_total": 90,
                  "by_file": {
                      "tests/analytics/test_analytics_gap_closure.cpp": 84,
                      "tests/analytics/test_process_pattern_matcher.cpp": 4,
                      "tests/analytics/test_olap_lru_cache.cpp": 1,
                      "tests/analytics/test_analytics_phase2_a2_connection_safety.cpp": 1,
                  },
              },
              "current": {
                  "trivial_assertion_total": sum(sum(counts.values()) for counts in after.values()),
                  "by_file": after,
              },
          }
          Path("build/analytics-assertion-inventory.json").write_text(
              json.dumps(assertion_inventory, indent=2) + "\n", encoding="utf-8"
          )
          if assertion_inventory["current"]["trivial_assertion_total"] != 0:
              raise SystemExit(f"Vacuous analytics assertions remain: {json.dumps(after)}")
          if duplicates or missing or unexpected:
              raise SystemExit(
                  f"Analytics test registration mismatch: {json.dumps(evidence)}"
              )
          print(f"Verified {len(expected)} analytics test files are registered exactly once.")
          PY
          python3 tools/ci/test_quality_inventory.py \
            --root . \
            --compile-commands build/compile_commands.json \
            --ctest-json build/ctest-tests.json \
            --source-commit "$GITHUB_SHA" \
            --source-branch "$GITHUB_REF_NAME" \
            --output build/test-quality-inventory.json

      - name: Upload test-quality inventory
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-quality-inventory-${{ github.run_id }}
          path: build/test-quality-inventory.json
          retention-days: 30
          if-no-files-found: warn

      - name: Build (with coverage)
        id: coverage_build
        run: |
          cmake --build build --parallel 8 --config Debug
          echo "✓ Build complete with coverage flags"
      
      - name: Run analytics focused tests
        id: analytics_focus_tests
        run: |
          set -o pipefail
          ctest --test-dir build \
            --tests-regex "_AnalyticsFocusedTests$" \
            -v --output-on-failure \
            --timeout 120 2>&1 | tee build/analytics-focused-tests.log
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Run focused tests (Tier A priority)
        id: focused_tests
        run: |
          set -o pipefail
          ctest --test-dir build \
            --label-regex "focused" \
            -v --output-on-failure \
            --timeout 30 2>&1 | tee build/focused-tests.log
          echo "status=success" >> "$GITHUB_OUTPUT"
      
      - name: Run release-critical tests (Tier A subset)
        id: critical_tests
        run: |
          set -o pipefail
          ctest --test-dir build \
            --label-regex "release_critical" \
            -v --output-on-failure \
            --timeout 30 2>&1 | tee build/release-critical-tests.log
          echo "status=success" >> "$GITHUB_OUTPUT"
      
      - name: Collect coverage data
        id: collect_coverage
        if: always() && steps.coverage_build.outcome == 'success'
        run: |
          echo "Collecting .gcda files..."
          find build -name "*.gcda" -o -name "*.profraw" | wc -l
          
          echo "Generating lcov report..."
          lcov --capture \
            --branch-coverage \
            --directory build \
            --output-file coverage.lcov \
            --exclude '/usr/*' \
            --exclude '*third_party*' \
            --exclude '*vcpkg*'
          
          echo "Coverage report summary:"
          lcov --summary coverage.lcov | head -20

      - name: Generate and enforce analytics coverage evidence
        if: steps.collect_coverage.outcome == 'success'
        run: |
          lcov --extract coverage.lcov '*/src/analytics/*' \
            --branch-coverage \
            --output-file analytics-coverage.lcov
          python3 scripts/generate_coverage_baseline.py analytics-coverage.lcov \
            --output analytics-coverage-baseline.txt \
            --json analytics-coverage.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          line_target = 70.0
          branch_target = 60.0
          critical_paths = [
              "src/analytics/aggregation.cpp",
              "src/analytics/cep_engine.cpp",
              "src/analytics/columnar_execution.cpp",
              "src/analytics/forecasting.cpp",
              "src/analytics/process_mining.cpp",
          ]
          report = json.loads(Path("analytics-coverage.json").read_text(encoding="utf-8"))
          module = report.get("modules", {}).get("analytics")
          if not module:
              raise SystemExit("No src/analytics coverage records were generated")

          records = {}
          current_path = None
          for raw_line in Path("analytics-coverage.lcov").read_text(encoding="utf-8").splitlines():
              if raw_line.startswith("SF:"):
                  current_path = raw_line[3:].replace("\\", "/")
                  records[current_path] = {"lines": [], "branches": []}
              elif current_path and raw_line.startswith("DA:"):
                  _, hits = raw_line[3:].split(",")[:2]
                  records[current_path]["lines"].append(int(hits) > 0)
              elif current_path and raw_line.startswith("BRDA:"):
                  taken = raw_line.split(":")[1].split(",")[3]
                  if taken != "-":
                      records[current_path]["branches"].append(int(taken) > 0)
              elif raw_line == "end_of_record":
                  current_path = None

          def measure(path):
              record = next(
                  (item for source, item in records.items()
                   if source.endswith("/" + path) or source == path),
                  {"lines": [], "branches": []},
              )
              line_total = len(record["lines"])
              branch_total = len(record["branches"])
              line_covered = sum(record["lines"])
              branch_covered = sum(record["branches"])
              return {
                  "lines_covered": line_covered,
                  "lines_total": line_total,
                  "line_percent": round(100.0 * line_covered / line_total, 1) if line_total else 0.0,
                  "branches_covered": branch_covered,
                  "branches_total": branch_total,
                  "branch_percent": (
                      round(100.0 * branch_covered / branch_total, 1) if branch_total else 0.0
                  ),
              }

          measurements = {path: measure(path) for path in critical_paths}
          failures = [
              path for path, data in measurements.items()
              if data["line_percent"] < line_target or data["branch_percent"] < branch_target
          ]
          module_meets = (
              module["coverage_percent"] >= line_target
              and module["branch_coverage_percent"] >= branch_target
          )
          evidence = {
              "source_commit": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF"],
              "thresholds": {"line_percent": line_target, "branch_percent": branch_target},
              "module": module,
              "release_critical_paths": measurements,
              "status": "meets_target" if module_meets and not failures else "below_target",
              "under_target_paths": failures,
              "exception_policy": "No exception is accepted without evidence and a named owner.",
          }
          Path("analytics-coverage-evidence.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(evidence, indent=2))
          if not module_meets or failures:
              raise SystemExit("Analytics line/branch coverage thresholds were not met")
          PY

      - name: Generate GPU module coverage evidence
        if: steps.collect_coverage.outcome == 'success'
        run: |
          lcov --extract coverage.lcov '*/src/gpu/*' \
            --branch-coverage \
            --output-file gpu-coverage.lcov
          python3 scripts/generate_coverage_baseline.py gpu-coverage.lcov \
            --output gpu-coverage-baseline.txt \
            --json gpu-coverage.json
          lcov --extract coverage.lcov \
            '*/src/gpu/gpu_module.cpp' \
            '*/src/gpu/safe_fail.cpp' \
            '*/src/gpu/metrics.cpp' \
            '*/src/gpu/audit_log.cpp' \
            --branch-coverage \
            --output-file gpu-release-critical-coverage.lcov
          python3 scripts/generate_coverage_baseline.py gpu-release-critical-coverage.lcov \
            --output gpu-release-critical-coverage-baseline.txt \
            --json gpu-release-critical-coverage.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          module_report = json.loads(Path("gpu-coverage.json").read_text(encoding="utf-8"))
          critical_report = json.loads(
              Path("gpu-release-critical-coverage.json").read_text(encoding="utf-8")
          )
          gpu = module_report.get("modules", {}).get("gpu")
          critical = critical_report.get("modules", {}).get("gpu")
          if not gpu or not critical:
              raise SystemExit("No src/gpu coverage records were generated")
          line_target = 70.0
          branch_target = 60.0
          module_meets_target = (
              gpu["coverage_percent"] >= line_target
              and gpu["branch_coverage_percent"] >= branch_target
          )
          critical_paths = [
              "src/gpu/gpu_module.cpp",
              "src/gpu/safe_fail.cpp",
              "src/gpu/metrics.cpp",
              "src/gpu/audit_log.cpp",
          ]

          def measure_paths(lcov_path, paths):
              records = {}
              current_path = None
              for raw_line in Path(lcov_path).read_text(encoding="utf-8").splitlines():
                  if raw_line.startswith("SF:"):
                      current_path = raw_line[3:]
                      records[current_path] = {"lines": [], "branches": []}
                  elif current_path and raw_line.startswith("DA:"):
                      _, hits = raw_line[3:].split(",")[:2]
                      records[current_path]["lines"].append(int(hits) > 0)
                  elif current_path and raw_line.startswith("BRDA:"):
                      taken = raw_line.split(":")[1].split(",")[3]
                      if taken != "-":
                          records[current_path]["branches"].append(int(taken) > 0)
                  elif raw_line == "end_of_record":
                      current_path = None

              measurements = {}
              for path in paths:
                  matching = next(
                      (record for source, record in records.items()
                       if source.replace("\\", "/").endswith("/" + path)),
                      {"lines": [], "branches": []},
                  )
                  line_count = len(matching["lines"])
                  branch_count = len(matching["branches"])
                  line_covered = sum(matching["lines"])
                  branch_covered = sum(matching["branches"])
                  line_percent = 100.0 * line_covered / line_count if line_count else 0.0
                  branch_percent = (
                      100.0 * branch_covered / branch_count if branch_count else 0.0
                  )
                  meets_target = line_percent >= line_target and branch_percent >= branch_target
                  measurements[path] = {
                      "lines_covered": line_covered,
                      "lines_total": line_count,
                      "coverage_percent": round(line_percent, 1),
                      "branches_covered": branch_covered,
                      "branches_total": branch_count,
                      "branch_coverage_percent": round(branch_percent, 1),
                      "threshold_status": "meets_target" if meets_target else "below_target",
                  }
              return measurements

          critical_measurements = measure_paths("gpu-release-critical-coverage.lcov", critical_paths)
          critical_meets_target = all(
              measurement["threshold_status"] == "meets_target"
              for measurement in critical_measurements.values()
          )
          under_target_paths = [
              path for path, measurement in critical_measurements.items()
              if measurement["threshold_status"] == "below_target"
          ]
          manifest = {
              "source_commit": os.environ["GITHUB_SHA"],
              "source_ref": os.environ["GITHUB_REF"],
              "coverage_scope": "src/gpu/",
              "execution_lane": "CPU-only; GPU module enabled; CUDA/HIP/Vulkan disabled",
              "hardware_backend_enabled": False,
              "module_thresholds": {
                  "line_percent": line_target,
                  "branch_percent": branch_target,
              },
              "measured": gpu,
              "module_threshold_status": (
                  "meets_target" if module_meets_target else "below_target"
              ),
              "release_critical": {
                  "paths": critical_paths,
                  "path_measurements": critical_measurements,
                  "thresholds": {
                      "line_percent": line_target,
                      "branch_percent": branch_target,
                  },
                  "module_aggregate": critical,
                  "threshold_status": (
                      "meets_target" if critical_meets_target else "below_target"
                  ),
                  "path_specific_exceptions": [
                      {
                          "path": path,
                          "status": "unapproved",
                          "owner_issue": 7492,
                          "description": (
                                "This release-critical path is below target; "
                                "a maintainer-approved exception has not been recorded."
                          ),
                      }
                      for path in under_target_paths
                  ],
              },
          }
          Path("gpu-coverage-evidence.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
          mkdir -p gpu-coverage-report
          genhtml gpu-coverage.lcov --branch-coverage \
            --output-directory gpu-coverage-report \
            --title "ThemisDB GPU Module Coverage" \
            --show-details \
            --legend
          mkdir -p gpu-release-critical-coverage-report
          genhtml gpu-release-critical-coverage.lcov --branch-coverage \
            --output-directory gpu-release-critical-coverage-report \
            --title "ThemisDB GPU Release-Critical Coverage" \
            --show-details \
            --legend
      
      - name: Generate baseline metrics
        run: |
          python3 scripts/generate_coverage_baseline.py coverage.lcov \
            --output .github/coverage-baseline-latest.txt \
            --json .github/coverage-baseline-latest.json

      - name: Add module coverage to test-quality inventory
        run: |
          python3 tools/ci/test_quality_inventory.py \
            --root . \
            --compile-commands build/compile_commands.json \
            --ctest-json build/ctest-tests.json \
            --coverage-json .github/coverage-baseline-latest.json \
            --source-commit "$GITHUB_SHA" \
            --source-branch "$GITHUB_REF_NAME" \
            --output build/test-quality-inventory-with-coverage.json
      
      - name: Compare with previous baseline
        id: baseline_delta
        run: |
          if [ -f .github/coverage-baseline.txt ]; then
            echo "Comparing with previous baseline..."
            python3 << 'EOF'
          import re
          
          def parse_baseline(path):
              data = {}
              with open(path) as f:
                  for line in f:
                      if line.startswith('#') or not line.strip():
                          continue
                      parts = [p.strip() for p in line.split('|')]
                      if len(parts) >= 5:
                          module, total, exec, covered, cov_pct = parts[:5]
                          data[module] = {
                              'covered': int(covered),
                              'total': int(exec),
                              'percent': float(cov_pct.rstrip('%'))
                          }
              return data
          
          prev = parse_baseline('.github/coverage-baseline.txt')
          curr = parse_baseline('.github/coverage-baseline-latest.txt')
          
          deltas = {}
          for module in set(list(prev.keys()) + list(curr.keys())):
              prev_val = prev.get(module, {}).get('percent', 0)
              curr_val = curr.get(module, {}).get('percent', 0)
              delta = curr_val - prev_val
              if abs(delta) > 0.1:  # Significant change (>0.1%)
                  deltas[module] = delta
          
          print(f"Modules with coverage delta:")
          for module in sorted(deltas.keys()):
              delta = deltas[module]
              sign = '+' if delta > 0 else ''
              print(f"  {module}: {sign}{delta:.1f}%")
          
          with open('coverage-delta.json', 'w') as f:
              import json
              json.dump(deltas, f)
          EOF
          else
            echo "No previous baseline found (first run)"
            echo "{}" > coverage-delta.json
          fi
      
      - name: Generate HTML coverage report
        run: |
          mkdir -p coverage-report
          genhtml coverage.lcov --output-directory coverage-report \
            --title "ThemisDB Code Coverage" \
            --show-details \
            --legend
          echo "✓ HTML report generated"
      
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            coverage-report/
            .github/coverage-baseline-latest.*
            build/test-quality-inventory-with-coverage.json
            coverage.lcov
            analytics-coverage.lcov
            analytics-coverage-baseline.txt
            analytics-coverage.json
            analytics-coverage-evidence.json
            build/analytics-test-registration.json
            build/analytics-assertion-inventory.json
            gpu-coverage.lcov
            gpu-coverage-baseline.txt
            gpu-coverage.json
            gpu-coverage-evidence.json
            gpu-coverage-report/
            gpu-release-critical-coverage.lcov
            gpu-release-critical-coverage-baseline.txt
            gpu-release-critical-coverage.json
            gpu-release-critical-coverage-report/
            coverage-delta.json
            build/focused-tests.log
            build/analytics-focused-tests.log
            build/release-critical-tests.log
          retention-days: 30
          if-no-files-found: warn

      - name: Fail workflow when required tests fail
        if: always() && (steps.analytics_focus_tests.outcome == 'failure' || steps.focused_tests.outcome == 'failure' || steps.critical_tests.outcome == 'failure')
        run: |
          echo "::error::Focused or release-critical coverage tests failed; see their logs and the uploaded coverage artifacts."
          exit 1
      
      - name: Update baseline on develop
        id: update_baseline
        if: >-
          github.ref == 'refs/heads/develop' &&
          steps.focused_tests.outcome == 'success' &&
          steps.critical_tests.outcome == 'success' &&
          (github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.generate_baseline == 'true' &&
          github.event.inputs.dry_run != 'true'))
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Update baseline
          cp .github/coverage-baseline-latest.txt .github/coverage-baseline.txt
          cp .github/coverage-baseline-latest.json .github/coverage-baseline.json
          
          # Stage and commit
          git add .github/coverage-baseline.*
          git diff --cached --quiet || git commit -m "ci: Update coverage baseline from nightly run"
          
          # Push only if changes exist
          git push || echo "No baseline changes to push"
      
      - name: Create PR comment with coverage summary (manual run only)
        if: github.event_name == 'workflow_dispatch' && github.event.repository.fork == false
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const baseline = JSON.parse(fs.readFileSync('.github/coverage-baseline-latest.json', 'utf8'));
              const deltas = JSON.parse(fs.readFileSync('coverage-delta.json', 'utf8'));
              
              const summary = baseline.summary.overall;
              let report = `## 📊 Coverage Report\n\n`;
              report += `**Overall Coverage:** ${summary.coverage_percent}%\n`;
              report += `- Lines covered: ${summary.lines_covered} / ${summary.lines_executable}\n`;
              report += `- Branch coverage: ${summary.branch_coverage_percent}%\n\n`;
              
              if (Object.keys(deltas).length > 0) {
                report += `**Changes from previous baseline:**\n`;
                for (const [module, delta] of Object.entries(deltas)) {
                  const sign = delta > 0 ? '📈' : '📉';
                  report += `- ${sign} ${module}: ${delta > 0 ? '+' : ''}${delta.toFixed(1)}%\n`;
                }
              } else {
                report += `**No significant changes from previous baseline** ✓\n`;
              }
              
              console.log(report);
              
              // Optionally post as workflow run summary
              core.summary.addRaw(report);
              await core.summary.write();
              
            } catch (e) {
              console.log(`Warning: Could not generate report: ${e.message}`);
            }
      
      - name: Workflow summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          GENERATE_BASELINE: ${{ inputs.generate_baseline }}
          BUILD_OUTCOME: ${{ steps.coverage_build.outcome }}
          FOCUSED_TESTS_OUTCOME: ${{ steps.focused_tests.outcome }}
          CRITICAL_TESTS_OUTCOME: ${{ steps.critical_tests.outcome }}
          COVERAGE_OUTCOME: ${{ steps.collect_coverage.outcome }}
          BASELINE_UPDATE_OUTCOME: ${{ steps.update_baseline.outcome }}
        run: |
          {
            echo "## Coverage Collection Summary"
            echo ""
            echo "| Run setting | Value |"
            echo "|-------------|-------|"
            echo "| Trigger | \`${EVENT_NAME}\` |"
            echo "| Manual dry-run | \`${DRY_RUN}\` |"
            echo "| Baseline update requested | \`${GENERATE_BASELINE}\` |"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Build | \`${BUILD_OUTCOME:-not run}\` |"
            echo "| Focused tests | \`${FOCUSED_TESTS_OUTCOME:-not run}\` |"
            echo "| Analytics focused tests | \`${{ steps.analytics_focus_tests.outcome }}\` |"
            echo "| Release-critical tests | \`${CRITICAL_TESTS_OUTCOME:-not run}\` |"
            echo "| Coverage collection | \`${COVERAGE_OUTCOME:-not run}\` |"
            echo "| Baseline update | \`${BASELINE_UPDATE_OUTCOME:-not run}\` |"
            echo ""
            echo "Artifacts uploaded: coverage-report-${{ github.run_id }}"
            if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN}" = "true" ] && [ "${GENERATE_BASELINE}" = "true" ]; then
              echo ""
              echo "Manual dry-run preview: the generated baseline would be committed to \`develop\`; no commit or push was performed."
            elif [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${DRY_RUN}" = "true" ]; then
              echo ""
              echo "Manual dry-run: baseline commit/push is disabled; build, tests, coverage reports, and artifacts still run."
            elif [ "${EVENT_NAME}" = "schedule" ]; then
              echo ""
              echo "Scheduled runs retain the existing baseline update behavior on \`develop\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
