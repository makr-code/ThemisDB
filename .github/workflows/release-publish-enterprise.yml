name: "[Manual] Publish Enterprise Edition"

# ---------------------------------------------------------------------------
# ROOT-LEVEL TRIGGER
# ------------------
# This file exists at the root of .github/workflows/ so that it appears in
# the GitHub Web UI and GitHub App under the Actions tab.
#
# GitHub only shows workflow_dispatch triggers for workflows directly in
# .github/workflows/. The real implementation lives in:
#   .github/workflows/04-release_publish-enterprise.yml
#
# The real workflow also runs automatically on tag push matching
# enterprise-v* from the enterprise branch.
#
# SECURITY NOTE
# -------------
# Publishing steps run inside the 'enterprise-prod' environment, which
# requires reviewer approval before secrets are accessible. The dry_run
# default is 'true' to prevent accidental publishes.
#
# ALTERNATIVE: GitHub CLI
#   gh workflow run "04-release/publish-enterprise.yml" \
#     --repo makr-code/ThemisDB --ref enterprise \
#     --field tag_name=enterprise-v2.1.0 --field dry_run=true
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish (e.g. enterprise-v2.1.0)"
        required: true
        type: string
      dry_run:
        description: "Dry-run: build but do NOT publish"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ref:
        description: "Branch or tag to run on (default: enterprise)"
        required: false
        default: "enterprise"
        type: string

permissions:
  actions: write

jobs:
  trigger:
    name: "Trigger › 04-release/publish-enterprise.yml"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "04-release/publish-enterprise.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ inputs.ref }}" \
            --field "tag_name=${{ inputs.tag_name }}" \
            --field "dry_run=${{ inputs.dry_run }}"

          echo "✅ Dispatched 04-release/publish-enterprise.yml"
          echo "   tag_name : ${{ inputs.tag_name }}"
          echo "   dry_run  : ${{ inputs.dry_run }}"
          echo "   ref      : ${{ inputs.ref }}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🏢 [Manual] Publish Enterprise Edition" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ inputs.tag_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | \`${{ inputs.dry_run }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target workflow** | \`04-release/publish-enterprise.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ⚠️ Publishing requires **enterprise-prod** environment approval." >> "$GITHUB_STEP_SUMMARY"
          echo "> Default dry_run=true prevents accidental publishing." >> "$GITHUB_STEP_SUMMARY"
