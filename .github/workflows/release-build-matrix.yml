name: "Release: Build Matrix"

# Rechenaufwand-Score: R=6 (K=6, L=6, N=5) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
on:
  workflow_call:
    inputs:
      build_matrix:
        description: Build matrix presets
        required: false
        default: all
        type: string

permissions:
  contents: read
  actions: read

jobs:
  community-release:
    if: inputs.build_matrix == 'all' || inputs.build_matrix == 'community-only'
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: ubuntu-latest
      shell: bash
      fetch_depth: '0'
      setup_command: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkg-config sccache \
          librocksdb-dev libgtest-dev libssl-dev zlib1g-dev libzstd-dev \
          libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \
          libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev \
          libvulkan-dev glslc \
          libboost-system-dev libboost-filesystem-dev \
          libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev \
          dpkg-dev rpm
      configure_command: |
        set -euo pipefail
        export CMAKE_C_COMPILER_LAUNCHER=sccache
        export CMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --preset community-release 2>&1 | tee configure-community-release.log
      build_command: |
        set -euo pipefail
        export CMAKE_C_COMPILER_LAUNCHER=sccache
        export CMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build --preset community-release --parallel 16 2>&1 | tee build-community-release.log
      validation_command: |
        set -euo pipefail
        ctest --preset community-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-community-release.log
      artifact_name: build-community-release-${{ github.run_number }}
      artifact_paths: |
        build-community-release/themisdb*
        build-community-release/*.so
        build-community-release/*.dll
        configure-community-release.log
        build-community-release.log
        test-community-release.log
      artifact_retention_days: '30'
      summary_title: Build (community-release on ubuntu-latest)

  linux-release:
    if: inputs.build_matrix == 'all' || inputs.build_matrix == 'linux-release-only'
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: ubuntu-latest
      shell: bash
      fetch_depth: '0'
      setup_command: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build pkg-config sccache ccache \
          librocksdb-dev libgtest-dev libssl-dev zlib1g-dev libzstd-dev \
          libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \
          libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev \
          libvulkan-dev glslc \
          libboost-system-dev libboost-filesystem-dev \
          libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev \
          dpkg-dev rpm
        git submodule sync --recursive || true
        git submodule update --init --recursive --depth 1 || true
        test -f vcpkg/scripts/buildsystems/vcpkg.cmake || {
          echo "::error::vcpkg submodule/toolchain missing before bootstrap"
          exit 1
        }
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
        export PATH="${VCPKG_ROOT}:${PATH}"
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      configure_command: |
        set -euo pipefail
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
        export PATH="${VCPKG_ROOT}:${PATH}"
        export VCPKG_FORCE_SYSTEM_BINARIES=true
        export CMAKE_C_COMPILER_LAUNCHER=sccache
        export CMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --preset linux-release 2>&1 | tee configure-linux-release.log
      build_command: |
        set -euo pipefail
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
        export PATH="${VCPKG_ROOT}:${PATH}"
        export VCPKG_FORCE_SYSTEM_BINARIES=true
        export CMAKE_C_COMPILER_LAUNCHER=sccache
        export CMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build --preset linux-release --parallel 16 2>&1 | tee build-linux-release.log
      validation_command: |
        set -euo pipefail
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"
        export PATH="${VCPKG_ROOT}:${PATH}"
        ctest --preset linux-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-linux-release.log

        BUILD_DIR="${GITHUB_WORKSPACE}/build-gcc-linux-release"
        PACKAGES_DIR="${GITHUB_WORKSPACE}/packages"
        rm -rf "${PACKAGES_DIR}"
        mkdir -p "${PACKAGES_DIR}"

        cmake --install "${BUILD_DIR}" --prefix "${BUILD_DIR}/install" 2>&1 | tee install-linux-release.log

        for GEN in TGZ DEB RPM; do
          echo "--- Running CPack generator: ${GEN} ---"
          cpack --config "${BUILD_DIR}/CPackConfig.cmake" \
            -DCPACK_PACKAGE_DIRECTORY="${PACKAGES_DIR}" \
            -G "${GEN}" 2>&1 | tee "${GITHUB_WORKSPACE}/cpack-${GEN}-linux-release.log" || \
            echo "::warning::CPack generator ${GEN} failed - continuing."
        done

        if ! find "${PACKAGES_DIR}" -maxdepth 1 \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.deb' -o -name '*.rpm' \) -print -quit | grep -q .; then
          echo "::error::No Linux package artifacts were produced in ${PACKAGES_DIR}"
          ls -la "${PACKAGES_DIR}" || true
          exit 1
        fi

        echo "Packages produced:"
        ls -lh "${PACKAGES_DIR}" || true
      artifact_name: build-linux-release-${{ github.run_number }}
      artifact_paths: |
        build-gcc-linux-release/themisdb*
        build-gcc-linux-release/*.so
        configure-linux-release.log
        build-linux-release.log
        test-linux-release.log
        install-linux-release.log
        cpack-*-linux-release.log
      artifact_name_secondary: packages-linux-release-${{ github.run_number }}
      artifact_paths_secondary: packages/
      artifact_retention_days: '30'
      artifact_retention_days_secondary: '90'
      summary_title: Build (linux-release on ubuntu-latest)

  windows-release:
    if: inputs.build_matrix == 'all' || inputs.build_matrix == 'windows-release-only'
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: windows-latest
      shell: bash
      fetch_depth: '0'
      setup_command: |
        set -euo pipefail
        choco install -y sccache || echo "::warning::sccache install via choco failed; continuing without sccache cache."
        git submodule sync --recursive || true
        git submodule update --init --recursive --depth 1 || true
        test -f vcpkg/scripts/buildsystems/vcpkg.cmake || {
          echo "::error::vcpkg submodule/toolchain missing before bootstrap"
          exit 1
        }
        ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
      configure_command: |
        set -euo pipefail
        export CMAKE_C_COMPILER_LAUNCHER=sccache
        export CMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --preset windows-release 2>&1 | tee configure-windows-release.log
      build_command: |
        set -euo pipefail
        export CMAKE_C_COMPILER_LAUNCHER=sccache
        export CMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build --preset windows-release --parallel 16 2>&1 | tee build-windows-release.log
      validation_command: |
        set -euo pipefail
        ctest --preset windows-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-windows-release.log

        cmake --install build-msvc-windows-release --prefix build-msvc-windows-release/install 2>&1 | tee install-windows-release.log

        BUILD_DIR="${GITHUB_WORKSPACE}/build-msvc-windows-release"
        PACKAGES_DIR="${GITHUB_WORKSPACE}/packages"
        rm -rf "${PACKAGES_DIR}"
        mkdir -p "${PACKAGES_DIR}"

        for GEN in ZIP WIX; do
          if ! command -v candle &>/dev/null 2>&1 && [ "${GEN}" = "WIX" ]; then
            echo "::notice::WiX (candle) not found - MSI generator skipped."
            continue
          fi
          echo "--- Running CPack generator: ${GEN} ---"
          cpack --config "${BUILD_DIR}/CPackConfig.cmake" \
            -DCPACK_PACKAGE_DIRECTORY="${PACKAGES_DIR}" \
            -G "${GEN}" 2>&1 | tee "${GITHUB_WORKSPACE}/cpack-${GEN}-windows-release.log" || \
            echo "::warning::CPack generator ${GEN} failed - continuing."
        done

        if ! find "${PACKAGES_DIR}" -maxdepth 1 \( -name '*.zip' -o -name '*.msi' -o -name '*.exe' \) -print -quit | grep -q .; then
          echo "::error::No Windows package artifacts were produced in ${PACKAGES_DIR}"
          ls -la "${PACKAGES_DIR}" || true
          exit 1
        fi

        echo "Packages produced:"
        ls -lh "${PACKAGES_DIR}" || true
      artifact_name: build-windows-release-${{ github.run_number }}
      artifact_paths: |
        build-msvc-windows-release/*.exe
        build-msvc-windows-release/*.dll
        configure-windows-release.log
        build-windows-release.log
        test-windows-release.log
        install-windows-release.log
        cpack-*windows-release.log
      artifact_name_secondary: packages-windows-release-${{ github.run_number }}
      artifact_paths_secondary: packages/
      artifact_retention_days: '30'
      artifact_retention_days_secondary: '90'
      summary_title: Build (windows-release on windows-latest)
