name: "Release: Build Matrix"

# Rechenaufwand-Score: R=6 (K=6, L=6, N=5) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Resolved release source commit
        required: false
        default: ''
        type: string
      build_matrix:
        description: Build matrix presets
        required: false
        default: os
        type: string
      os:
        description: OS selector (all/linux/windows/macos)
        required: false
        default: all
        type: string
      architecture:
        description: Architecture selector (all/amd64/arm64)
        required: false
        default: all
        type: string
      edition:
        description: Edition selector passed to CMake
        required: false
        default: community
        type: string
      build_type:
        description: Build type passed to CMake
        required: false
        default: Release
        type: string
      packaging:
        description: CPack generators (auto or comma-separated)
        required: false
        default: auto
        type: string
      distribution:
        description: Distribution selector metadata
        required: false
        default: all
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-release-matrix-${{ github.workflow }}-${{ github.ref_name || github.ref }}-${{ inputs.build_matrix }}-${{ inputs.os }}-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [linux-release, windows-release, prepare-release-matrix, release-platform-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Cross-platform release build matrix"
          job-results: ${{ toJSON(needs) }}

  linux-release:
    name: "Build: Linux Release"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: "Sync declared release submodules"
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true
          git submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF
          test -f vcpkg/scripts/buildsystems/vcpkg.cmake

  windows-release:
    name: "Build: Windows Release"
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: "Sync declared release submodules"
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true
          git submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF
          test -f vcpkg/scripts/buildsystems/vcpkg.cmake

  prepare-release-matrix:
    name: "Build: Prepare Release Build Matrix"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan selected build matrix entries
        id: plan
        shell: bash
        env:
          BUILD_MATRIX: ${{ inputs.build_matrix }}
          OS_SELECTOR: ${{ inputs.os }}
          ARCH_SELECTOR: ${{ inputs.architecture }}
          EDITION: ${{ inputs.edition }}
          BUILD_TYPE: ${{ inputs.build_type }}
          PACKAGING: ${{ inputs.packaging }}
          DISTRIBUTION: ${{ inputs.distribution }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          build_matrix = os.environ["BUILD_MATRIX"].strip().lower()
          os_selector = os.environ["OS_SELECTOR"].strip().lower()
          arch_selector = os.environ["ARCH_SELECTOR"].strip().lower()
          edition = os.environ["EDITION"].strip().lower()
          build_type = os.environ["BUILD_TYPE"].strip()
          packaging = os.environ["PACKAGING"].strip()
          distribution = os.environ["DISTRIBUTION"].strip().lower()
          run_number = os.environ["RUN_NUMBER"]
          allowed_editions = {"minimal", "community", "enterprise", "hyperscaler", "military"}
          allowed_build_types = {"Release", "Debug"}
          packaging_token_normalization = {
              "TGZ": "TGZ",
              "DEB": "DEB",
              "RPM": "RPM",
              "ZIP": "ZIP",
              "WIX": "WIX",
              "DRAGNDROP": "DragNDrop",
              "DMG": "DragNDrop",
          }
          allowed_distributions = {"all", "github", "docker", "winget", "linux"}
          if edition not in allowed_editions:
              raise ValueError(f"Unsupported edition selector: {edition}")
          if build_type not in allowed_build_types:
              raise ValueError(f"Unsupported build type selector: {build_type}")
          if distribution not in allowed_distributions:
              raise ValueError(f"Unsupported distribution selector: {distribution}")
          cmake_flags = (
              f"-DTHEMIS_EDITION={edition.upper()} -DCMAKE_BUILD_TYPE={build_type} "
              "-DTHEMIS_DOCS_DB_MODE=BUILD -DTHEMIS_MODELS_MODE=PACKAGE "
              "-DTHEMIS_PACKAGE_INCLUDE_TINYLLAMA=ON -DTHEMIS_PACKAGE_INCLUDE_GEMMA=OFF"
          )

          def lane_enabled(lane_id: str) -> bool:
              # Platform-specific -only patterns
              if build_matrix == "linux-amd64-only":
                  return lane_id == "linux-amd64"
              if build_matrix == "linux-arm64-only":
                  return lane_id == "linux-arm64"
              if build_matrix == "windows-amd64-only":
                  return lane_id == "windows-amd64"
              if build_matrix == "macos-arm64-only":
                  return lane_id == "macos-arm64"

              # Community release lane intentionally excludes the experimental macOS ARM64
              # package path until the lane is GA. Nightly and community publication must
              # only exercise the supported public build targets.
              if build_matrix == "community-only":
                  return lane_id in {"linux-amd64", "linux-arm64", "windows-amd64"}

              # Edition-only patterns (e.g., "enterprise-only", "hyperscaler-only") and
              # generic selectors. These still include experimental macOS when explicitly
              # selected via os=macos or build_matrix=all.
              if build_matrix.endswith("-only") or build_matrix in ("os", "all"):
                  if lane_id.startswith("linux"):
                      lane_os, lane_arch = "linux", lane_id.split("-")[1]
                  elif lane_id.startswith("windows"):
                      lane_os, lane_arch = "windows", lane_id.split("-")[1]
                  else:
                      lane_os, lane_arch = "macos", lane_id.split("-")[1]

                  return (os_selector in ("all", lane_os)) and (arch_selector in ("all", lane_arch))

              return False

          def generators_for(lane_os: str) -> str:
              if packaging and packaging.lower() != "auto":
                  tokens = []
                  for tok in packaging.split(","):
                      token = tok.strip()
                      if not token:
                          continue
                      normalized_token = packaging_token_normalization.get(token.upper())
                      if normalized_token is None:
                          raise ValueError(f"Unsupported packaging generator: {token}")
                      tokens.append(normalized_token)
                  if not tokens:
                      raise ValueError("Packaging selector resolved to empty generator set")
                  return " ".join(tokens)
              if lane_os == "linux":
                  return "TGZ DEB RPM"
              if lane_os == "windows":
                  return "ZIP WIX"
              return "TGZ DragNDrop"

          entries = [
              {
                  "id": "linux-amd64",
                  "enable_sccache_gha": False,
                  "enabled": lane_enabled("linux-amd64"),
                  "runs_on": "ubuntu-24.04",
                  "arch": "x64",
                  "compiler": "gcc",
                  "triplet": "x64-linux",
                  "setup_command": "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends \\\n  build-essential cmake ninja-build pkg-config sccache ccache \\\n  autoconf autoconf-archive automake libtool curl ca-certificates \\\n  libssl-dev zlib1g-dev libzstd-dev libcurl4-openssl-dev libkrb5-dev \\\n  libgtest-dev libgmock-dev librocksdb-dev libfmt-dev libspdlog-dev \\\n  libtbb-dev libyaml-cpp-dev libboost-dev libprotobuf-dev protobuf-compiler \\\n  dpkg-dev rpm\nif [ ! -x /usr/bin/ninja ] && command -v ninja-build >/dev/null 2>&1; then\n  sudo ln -sf \"$(command -v ninja-build)\" /usr/bin/ninja\nfi\ngit submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\ngit submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF\ntest -f vcpkg/scripts/buildsystems/vcpkg.cmake || {\n  echo \"::error::vcpkg submodule/toolchain missing before bootstrap\"\n  exit 1\n}\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\n./vcpkg/bootstrap-vcpkg.sh -disableMetrics",
                  "configure_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nexport VCPKG_FORCE_SYSTEM_BINARIES=true\nexport VCPKG_BUILD_TYPE=release\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --preset linux-release ${CMAKE_FLAGS} 2>&1 | tee configure-linux-release.log",
                  "build_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nexport VCPKG_FORCE_SYSTEM_BINARIES=true\nexport VCPKG_BUILD_TYPE=release\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --build --preset linux-release --parallel 16 2>&1 | tee build-linux-release.log",
                  "validation_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nctest --preset linux-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-linux-release.log\n\nBUILD_DIR=\"${GITHUB_WORKSPACE}/build-gcc-linux-release\"\nPACKAGES_DIR=\"${GITHUB_WORKSPACE}/packages\"\nrm -rf \"${PACKAGES_DIR}\"\nmkdir -p \"${PACKAGES_DIR}\"\n\ncmake --install \"${BUILD_DIR}\" --prefix \"${BUILD_DIR}/install\" 2>&1 | tee install-linux-release.log\n\nfor GEN in ${PACKAGE_GENERATORS}; do\n  echo \"--- Running CPack generator: ${GEN} ---\"\n  cpack --config \"${BUILD_DIR}/CPackConfig.cmake\" \\\n    -B \"${PACKAGES_DIR}\" \\\n    -G \"${GEN}\" 2>&1 | tee \"${GITHUB_WORKSPACE}/cpack-${GEN}-linux-release.log\" || \\\n    echo \"::warning::CPack generator ${GEN} failed - continuing.\"\ndone\n\nif ! find \"${PACKAGES_DIR}\" -maxdepth 1 \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.deb' -o -name '*.rpm' \) -print -quit | grep -q .; then\n  echo \"::error::No Linux package artifacts were produced in ${PACKAGES_DIR}\"\n  exit 1\nelse\n  echo \"Packages produced:\"\nls -lh \"${PACKAGES_DIR}\" || true\nfi",
                  "build_directory": "build-gcc-linux-release",
                  "artifact_name": f"build-linux-amd64-release-{run_number}",
                  "artifact_paths": "build-gcc-linux-release/themisdb*\nbuild-gcc-linux-release/*.so\nconfigure-linux-release.log\nbuild-linux-release.log\ntest-linux-release.log\ninstall-linux-release.log\ncpack-*-linux-release.log",
                  "artifact_name_secondary": f"packages-linux-amd64-release-{run_number}",
                  "artifact_paths_secondary": "packages/",
                  "artifact_retention_days": "30",
                  "artifact_retention_days_secondary": "90",
                  "summary_title": "Linux AMD64 Release (ubuntu-24.04)",
              },
              {
                  "id": "linux-arm64",
                  "enable_sccache_gha": False,
                  "enabled": lane_enabled("linux-arm64"),
                  "runs_on": "ubuntu-24.04-arm",
                  "arch": "arm64",
                  "compiler": "gcc",
                  "triplet": "arm64-linux",
                  "setup_command": "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends \\\n  build-essential cmake ninja-build pkg-config sccache ccache \\\n  autoconf autoconf-archive automake libtool \\\n  librocksdb-dev libgtest-dev libgmock-dev libssl-dev zlib1g-dev libzstd-dev \\\n  libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \\\n  libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev libkrb5-dev \\\n  libvulkan-dev glslc \\\n  libcpp-httplib-dev \\\n  libboost-dev libboost-system-dev libboost-filesystem-dev \\\n  libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev \\\n  dpkg-dev rpm\nif [ ! -x /usr/bin/ninja ] && command -v ninja-build >/dev/null 2>&1; then\n  sudo ln -sf \"$(command -v ninja-build)\" /usr/bin/ninja\nfi\ngit submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\ngit submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF\ntest -f vcpkg/scripts/buildsystems/vcpkg.cmake || {\n  echo \"::error::vcpkg submodule/toolchain missing before bootstrap\"\n  exit 1\n}\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\n./vcpkg/bootstrap-vcpkg.sh -disableMetrics",
                  "configure_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nexport VCPKG_FORCE_SYSTEM_BINARIES=true\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --preset linux-arm64-release ${CMAKE_FLAGS} 2>&1 | tee configure-linux-arm64-release.log",
                  "build_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nexport VCPKG_FORCE_SYSTEM_BINARIES=true\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --build --preset linux-arm64-release --parallel 8 2>&1 | tee build-linux-arm64-release.log",
                  "validation_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nctest --preset linux-arm64-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-linux-arm64-release.log\n\nBUILD_DIR=\"${GITHUB_WORKSPACE}/build-gcc-linux-arm64-release\"\nPACKAGES_DIR=\"${GITHUB_WORKSPACE}/packages\"\nrm -rf \"${PACKAGES_DIR}\"\nmkdir -p \"${PACKAGES_DIR}\"\n\ncmake --install \"${BUILD_DIR}\" --prefix \"${BUILD_DIR}/install\" 2>&1 | tee install-linux-arm64-release.log\n\nfor GEN in ${PACKAGE_GENERATORS}; do\n  echo \"--- Running CPack generator: ${GEN} ---\"\n  cpack --config \"${BUILD_DIR}/CPackConfig.cmake\" \\\n    -B \"${PACKAGES_DIR}\" \\\n    -G \"${GEN}\" 2>&1 | tee \"${GITHUB_WORKSPACE}/cpack-${GEN}-linux-arm64-release.log\" || \\\n    echo \"::warning::CPack generator ${GEN} failed - continuing.\"\ndone\n\nif ! find \"${PACKAGES_DIR}\" -maxdepth 1 \\( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.deb' -o -name '*.rpm' \\) -print -quit | grep -q .; then\n  echo \"::error::No Linux package artifacts were produced in ${PACKAGES_DIR}\"\n  exit 1\nelse\n  echo \"Packages produced:\"\nls -lh \"${PACKAGES_DIR}\" || true\nfi",
                  "build_directory": "build-gcc-linux-arm64-release",
                  "artifact_name": f"build-linux-arm64-release-{run_number}",
                  "artifact_paths": "build-gcc-linux-arm64-release/themisdb*\nbuild-gcc-linux-arm64-release/*.so\nconfigure-linux-arm64-release.log\nbuild-linux-arm64-release.log\ntest-linux-arm64-release.log\ninstall-linux-arm64-release.log\ncpack-*-linux-arm64-release.log",
                  "artifact_name_secondary": f"packages-linux-arm64-release-{run_number}",
                  "artifact_paths_secondary": "packages/",
                  "artifact_retention_days": "30",
                  "artifact_retention_days_secondary": "90",
                  "summary_title": "Linux ARM64 Release (ubuntu-24.04-arm)",
              },
              {
                  "id": "windows-amd64",
                  "enable_sccache_gha": True,
                  "enabled": lane_enabled("windows-amd64"),
                  "runs_on": "windows-latest",
                  "arch": "x64",
                  "compiler": "msvc",
                  "triplet": "x64-windows",
                  "setup_command": "set -euo pipefail\nchoco install -y sccache || echo \"::warning::sccache install via choco failed; continuing without sccache cache.\"\ngit submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\ngit submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF\ntest -f vcpkg/scripts/buildsystems/vcpkg.cmake || {\n  echo \"::error::vcpkg submodule/toolchain missing before bootstrap\"\n  exit 1\n}\n./vcpkg/bootstrap-vcpkg.bat -disableMetrics",
                  "configure_command": "set -euo pipefail\nexport VCPKG_MAX_CONCURRENCY=2\nexport CMAKE_BUILD_PARALLEL_LEVEL=2\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --preset windows-release ${CMAKE_FLAGS} 2>&1 | tee configure-windows-release.log",
                  "build_command": "set -euo pipefail\nexport VCPKG_MAX_CONCURRENCY=2\nexport CMAKE_BUILD_PARALLEL_LEVEL=2\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --build --preset windows-release --parallel 2 2>&1 | tee build-windows-release.log",
                  "validation_command": "set -euo pipefail\nctest --preset windows-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-windows-release.log\n\ncmake --install build-msvc-windows-release --prefix build-msvc-windows-release/install 2>&1 | tee install-windows-release.log\n\nBUILD_DIR=\"${GITHUB_WORKSPACE}/build-msvc-windows-release\"\nPACKAGES_DIR=\"${GITHUB_WORKSPACE}/packages\"\nrm -rf \"${PACKAGES_DIR}\"\nmkdir -p \"${PACKAGES_DIR}\"\n\nfor GEN in ${PACKAGE_GENERATORS}; do\n  if ! command -v candle &>/dev/null 2>&1 && [ \"${GEN}\" = \"WIX\" ]; then\n    echo \"::notice::WiX (candle) not found - MSI generator skipped.\"\n    continue\n  fi\n  echo \"--- Running CPack generator: ${GEN} ---\"\n  cpack --config \"${BUILD_DIR}/CPackConfig.cmake\" \\\n    -B \"${PACKAGES_DIR}\" \\\n    -G \"${GEN}\" 2>&1 | tee \"${GITHUB_WORKSPACE}/cpack-${GEN}-windows-release.log\" || \\\n    echo \"::warning::CPack generator ${GEN} failed - continuing.\"\ndone\n\nif ! find \"${PACKAGES_DIR}\" -maxdepth 1 \( -name '*.zip' -o -name '*.msi' -o -name '*.exe' \) -print -quit | grep -q .; then\n  echo \"::error::No Windows package artifacts were produced in ${PACKAGES_DIR}\"\n  exit 1\nelse\n  echo \"Packages produced:\"\nls -lh \"${PACKAGES_DIR}\" || true\nfi",
                  "build_directory": "build-msvc-windows-release",
                  "artifact_name": f"build-windows-amd64-release-{run_number}",
                  "artifact_paths": "build-msvc-windows-release/*.exe\nbuild-msvc-windows-release/*.dll\nconfigure-windows-release.log\nbuild-windows-release.log\ntest-windows-release.log\ninstall-windows-release.log\ncpack-*windows-release.log",
                  "artifact_name_secondary": f"packages-windows-amd64-release-{run_number}",
                  "artifact_paths_secondary": "packages/",
                  "artifact_retention_days": "30",
                  "artifact_retention_days_secondary": "90",
                  "summary_title": "Windows AMD64 Release (windows-latest)",
                  "timeout_minutes": "360",
              },
              {
                  "id": "macos-arm64",
                  "enable_sccache_gha": True,
                  "enabled": lane_enabled("macos-arm64"),
                  "runs_on": "macos-14",
                  "arch": "arm64",
                  "compiler": "clang",
                  "triplet": "arm64-osx",
                  "setup_command": "set -euo pipefail\necho \"Using macos-14 intentionally for ARM64 runner stability in release matrix lane.\"\necho \"macOS ARM64 lane uses Homebrew/system dependencies by design (no vcpkg toolchain).\"\nexport HOMEBREW_NO_AUTO_UPDATE=1\nexport HOMEBREW_NO_INSTALL_CLEANUP=1\nbrew install \\\n  cmake ninja pkg-config sccache \\\n  openssl@3 zstd rocksdb fmt spdlog nlohmann-json tbb \\\n  yaml-cpp mimalloc curl cpp-httplib boost grpc protobuf pugixml || true\necho \"Disabling GitHub Actions sccache backend for this experimental macOS ARM64 lane; the cache service is intermittently unavailable.\"\nexport SCCACHE_GHA_ENABLED=false\nprintf '%s\n' \"SCCACHE_GHA_ENABLED=false\" >> \"$GITHUB_ENV\"\nsccache --stop-server || true\ngit submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\ngit submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true",
                  "configure_command": "set -euo pipefail\nif command -v sccache >/dev/null 2>&1 && [ \"${SCCACHE_GHA_ENABLED:-true}\" != \"false\" ]; then\n  export CMAKE_C_COMPILER_LAUNCHER=sccache\n  export CMAKE_CXX_COMPILER_LAUNCHER=sccache\nfi\ncmake --preset macos-arm64-release ${CMAKE_FLAGS} 2>&1 | tee configure-macos-release.log",
                  "build_command": "set -euo pipefail\nif command -v sccache >/dev/null 2>&1 && [ \"${SCCACHE_GHA_ENABLED:-true}\" != \"false\" ]; then\n  export CMAKE_C_COMPILER_LAUNCHER=sccache\n  export CMAKE_CXX_COMPILER_LAUNCHER=sccache\nfi\ncmake --build --preset macos-arm64-release --parallel 8 2>&1 | tee build-macos-release.log",
                  "validation_command": "set -euo pipefail\nctest --preset macos-arm64-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-macos-release.log || true\n\nBUILD_DIR=\"${GITHUB_WORKSPACE}/build-macos-arm64-release\"\nPACKAGES_DIR=\"${GITHUB_WORKSPACE}/packages\"\nrm -rf \"${PACKAGES_DIR}\"\nmkdir -p \"${PACKAGES_DIR}\"\n\ncmake --install \"${BUILD_DIR}\" --prefix \"${BUILD_DIR}/install\" 2>&1 | tee install-macos-release.log || \\\n  echo \"::warning::Install step failed on macOS experimental lane.\"\n\nfor GEN in ${PACKAGE_GENERATORS}; do\n  echo \"--- Running CPack generator: ${GEN} ---\"\n  cpack --config \"${BUILD_DIR}/CPackConfig.cmake\" \\\n    -B \"${PACKAGES_DIR}\" \\\n    -G \"${GEN}\" 2>&1 | tee \"${GITHUB_WORKSPACE}/cpack-${GEN}-macos-release.log\" || \\\n    echo \"::warning::CPack generator ${GEN} failed on macOS experimental lane.\"\ndone\n\nif ! find \"${PACKAGES_DIR}\" -maxdepth 1 \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.dmg' \) -print -quit | grep -q .; then\n  echo \"::notice::No macOS package artifact produced in experimental lane.\"\nfi\n\necho \"Packages produced (if any):\"\nls -lh \"${PACKAGES_DIR}\" || true",
                  "build_continue_on_error": True,
                  "validation_continue_on_error": True,
                  "build_directory": "build-macos-arm64-release",
                  "artifact_name": f"build-macos-arm64-release-{run_number}",
                  "artifact_paths": "build-macos-arm64-release/themisdb*\nbuild-macos-arm64-release/*.dylib\nconfigure-macos-release.log\nbuild-macos-release.log\ntest-macos-release.log\ninstall-macos-release.log\ncpack-*-macos-release.log",
                  "artifact_name_secondary": f"packages-macos-arm64-release-{run_number}",
                  "artifact_paths_secondary": "packages/",
                  "artifact_retention_days": "30",
                  "artifact_retention_days_secondary": "30",
                  "summary_title": "macOS ARM64 Release (macos-14, experimental)",
              },
          ]

          for entry in entries:
              if not entry.get("enabled"):
                  continue
              lane_os = "linux" if entry["id"].startswith("linux") else ("windows" if entry["id"].startswith("windows") else "macos")
              if lane_os == "macos":
                  # Xcode 15.4's libc++ lacks jthread/stop_token; use LLVM's matching headers and runtime.
                  entry["compiler"] = "homebrew-llvm"
                  entry["setup_command"] += (
                      '\nbrew install llvm\n'
                      'LLVM_PREFIX="$(brew --prefix llvm)"\n'
                      '{\n'
                      '  echo "CC=${LLVM_PREFIX}/bin/clang"\n'
                      '  echo "CXX=${LLVM_PREFIX}/bin/clang++"\n'
                      '  echo "CXXFLAGS=-nostdinc++ -isystem ${LLVM_PREFIX}/include/c++/v1"\n'
                      '  echo "LDFLAGS=-L${LLVM_PREFIX}/lib/c++ -Wl,-rpath,${LLVM_PREFIX}/lib/c++"\n'
                      '} >> "$GITHUB_ENV"\n'
                  )
              entry["setup_command"] += (
                  '\nMODEL_DIR="${GITHUB_WORKSPACE}/models" OUTPUT_NAME=tinyllama.gguf '
                  'bash scripts/download-tinyllama-hf.sh'
              )
              if lane_os == "linux":
                  entry["setup_command"] += "\nsudo apt-get install -y --no-install-recommends libarchive-tools"
              entry["configure_command"] = entry["configure_command"].replace("${CMAKE_FLAGS}", cmake_flags)
              payload_gate = (
                  f'cmake --build "{entry["build_directory"]}" --target docs_database --config {build_type}\n'
                  f'cmake --install "{entry["build_directory"]}" --config {build_type} '
                  f'--prefix "{entry["build_directory"]}/runtime-payload" --component documentation\n'
                  f'cmake --install "{entry["build_directory"]}" --config {build_type} '
                  f'--prefix "{entry["build_directory"]}/runtime-payload" --component models\n'
                  f'python3 scripts/release/validate_runtime_payload.py "{entry["build_directory"]}/runtime-payload"\n'
              )
              entry["validation_command"] = "set -euo pipefail\n" + payload_gate + entry["validation_command"]
              entry["validation_command"] = entry["validation_command"].replace("${PACKAGE_GENERATORS}", generators_for(lane_os))
              entry["validation_command"] += '\npython3 scripts/release/validate_runtime_payload.py "${PACKAGES_DIR}" --packages'
              entry["validation_continue_on_error"] = False

          selected = [entry for entry in entries if entry["enabled"]]
          print(f"matrix={json.dumps({'include': selected})}")
          PY

  release-platform-matrix:
    name: "Build: ${{ matrix.summary_title }}"
    needs: prepare-release-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release-matrix.outputs.matrix) }}
    concurrency:
      group: release-build-matrix-${{ github.ref }}-${{ matrix.id }}
      cancel-in-progress: false

    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      enable_sccache_gha: ${{ matrix.enable_sccache_gha }}
      runs_on: ${{ matrix.runs_on }}
      cache_arch: ${{ matrix.arch }}
      cache_compiler: ${{ matrix.compiler }}
      vcpkg_triplet: ${{ matrix.triplet }}
      shell: bash
      fetch_depth: '0'
      source_sha: ${{ inputs.source_sha }}
      setup_command: ${{ matrix.setup_command }}
      configure_command: ${{ matrix.configure_command }}
      build_directory: ${{ matrix.build_directory }}
      build_command: ${{ matrix.build_command }}
      validation_command: ${{ matrix.validation_command }}
      build_continue_on_error: ${{ matrix.build_continue_on_error || false }}
      validation_continue_on_error: ${{ matrix.validation_continue_on_error || false }}
      artifact_name: ${{ matrix.artifact_name }}
      artifact_paths: ${{ matrix.artifact_paths }}
      artifact_name_secondary: ${{ matrix.artifact_name_secondary }}
      artifact_paths_secondary: ${{ matrix.artifact_paths_secondary }}
      artifact_retention_days: ${{ matrix.artifact_retention_days }}
      artifact_retention_days_secondary: ${{ matrix.artifact_retention_days_secondary }}
      summary_title: ${{ matrix.summary_title }}
      timeout_minutes: ${{ matrix.timeout_minutes || '360' }}
