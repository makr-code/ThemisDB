name: "Release: Build Matrix"

# Rechenaufwand-Score: R=6 (K=6, L=6, N=5) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
on:
  workflow_call:
    inputs:
      build_matrix:
        description: Build matrix presets
        required: false
        default: all
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-build-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release-matrix:
    name: "Build: Prepare Release Build Matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan selected build matrix entries
        id: plan
        shell: bash
        env:
          BUILD_MATRIX: ${{ inputs.build_matrix }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          build_matrix = os.environ["BUILD_MATRIX"]
          run_number = os.environ["RUN_NUMBER"]
          entries = [
              {
                  "id": "community-release",
                  "enabled": build_matrix in ("all", "community-only"),
                  "runs_on": "ubuntu-latest",
                  "setup_command": "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends \\\n  build-essential cmake ninja-build pkg-config sccache \\\n  librocksdb-dev libgtest-dev libgmock-dev libssl-dev zlib1g-dev libzstd-dev \\\n  libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \\\n  libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev \\\n  libvulkan-dev glslc \\\n  libcpp-httplib-dev \\\n  libboost-dev libboost-system-dev libboost-filesystem-dev \\\n  libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev \\\n  dpkg-dev rpm",
                  "configure_command": "set -euo pipefail\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --preset community-release 2>&1 | tee configure-community-release.log",
                  "build_command": "set -euo pipefail\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --build --preset community-release --parallel 16 2>&1 | tee build-community-release.log",
                  "validation_command": "set -euo pipefail\nctest --preset community-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-community-release.log",
                  "artifact_name": f"build-community-release-{run_number}",
                  "artifact_paths": "build-community-release/themisdb*\nbuild-community-release/*.so\nbuild-community-release/*.dll\nconfigure-community-release.log\nbuild-community-release.log\ntest-community-release.log",
                  "artifact_retention_days": "30",
                  "artifact_name_secondary": "",
                  "artifact_paths_secondary": "",
                  "artifact_retention_days_secondary": "30",
                  "summary_title": "Community Release (ubuntu-latest)",
              },
              {
                  "id": "linux-release",
                  "enabled": build_matrix in ("all", "linux-release-only"),
                  "runs_on": "ubuntu-latest",
                  "setup_command": "set -euo pipefail\nsudo apt-get update -qq\nsudo apt-get install -y --no-install-recommends \\\n  build-essential cmake ninja-build pkg-config sccache ccache \\\n  librocksdb-dev libgtest-dev libgmock-dev libssl-dev zlib1g-dev libzstd-dev \\\n  libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev \\\n  libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev \\\n  libvulkan-dev glslc \\\n  libcpp-httplib-dev \\\n  libboost-dev libboost-system-dev libboost-filesystem-dev \\\n  libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev \\\n  dpkg-dev rpm\ngit submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\ngit submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\nif [ ! -f vcpkg/scripts/buildsystems/vcpkg.cmake ]; then\n  rm -rf vcpkg\n  git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg\nfi\ntest -f vcpkg/scripts/buildsystems/vcpkg.cmake || {\n  echo \"::error::vcpkg submodule/toolchain missing before bootstrap\"\n  exit 1\n}\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\n./vcpkg/bootstrap-vcpkg.sh -disableMetrics",
                  "configure_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nexport VCPKG_FORCE_SYSTEM_BINARIES=true\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --preset linux-release 2>&1 | tee configure-linux-release.log",
                  "build_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nexport VCPKG_FORCE_SYSTEM_BINARIES=true\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --build --preset linux-release --parallel 16 2>&1 | tee build-linux-release.log",
                  "validation_command": "set -euo pipefail\nexport VCPKG_ROOT=\"${GITHUB_WORKSPACE}/vcpkg\"\nexport PATH=\"${VCPKG_ROOT}:${PATH}\"\nctest --preset linux-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-linux-release.log\n\nBUILD_DIR=\"${GITHUB_WORKSPACE}/build-gcc-linux-release\"\nPACKAGES_DIR=\"${GITHUB_WORKSPACE}/packages\"\nrm -rf \"${PACKAGES_DIR}\"\nmkdir -p \"${PACKAGES_DIR}\"\n\ncmake --install \"${BUILD_DIR}\" --prefix \"${BUILD_DIR}/install\" 2>&1 | tee install-linux-release.log\n\nfor GEN in TGZ DEB RPM; do\n  echo \"--- Running CPack generator: ${GEN} ---\"\n  cpack --config \"${BUILD_DIR}/CPackConfig.cmake\" \\\n    -DCPACK_PACKAGE_DIRECTORY=\"${PACKAGES_DIR}\" \\\n    -G \"${GEN}\" 2>&1 | tee \"${GITHUB_WORKSPACE}/cpack-${GEN}-linux-release.log\" || \\\n    echo \"::warning::CPack generator ${GEN} failed - continuing.\"\ndone\n\nif ! find \"${PACKAGES_DIR}\" -maxdepth 1 \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.deb' -o -name '*.rpm' \) -print -quit | grep -q .; then\n  echo \"::error::No Linux package artifacts were produced in ${PACKAGES_DIR}\"\n  ls -la \"${PACKAGES_DIR}\" || true\n  exit 1\nfi\n\necho \"Packages produced:\"\nls -lh \"${PACKAGES_DIR}\" || true",
                  "artifact_name": f"build-linux-release-{run_number}",
                  "artifact_paths": "build-gcc-linux-release/themisdb*\nbuild-gcc-linux-release/*.so\nconfigure-linux-release.log\nbuild-linux-release.log\ntest-linux-release.log\ninstall-linux-release.log\ncpack-*-linux-release.log",
                  "artifact_name_secondary": f"packages-linux-release-{run_number}",
                  "artifact_paths_secondary": "packages/",
                  "artifact_retention_days": "30",
                  "artifact_retention_days_secondary": "90",
                  "summary_title": "Linux Release (ubuntu-latest)",
              },
              {
                  "id": "windows-release",
                  "enabled": build_matrix in ("all", "windows-release-only"),
                  "runs_on": "windows-latest",
                  "setup_command": "set -euo pipefail\nchoco install -y sccache || echo \"::warning::sccache install via choco failed; continuing without sccache cache.\"\ngit submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\ngit submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\nif [ ! -f vcpkg/scripts/buildsystems/vcpkg.cmake ]; then\n  rm -rf vcpkg\n  git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg\nfi\nVCPKG_BASELINE=$(python3 -c \"import json; print(json.load(open('vcpkg.json')).get('builtin-baseline',''))\" 2>/dev/null || echo \"\")\nif [ -n \"$VCPKG_BASELINE\" ] && [ -d vcpkg/.git ]; then\n  git -C vcpkg fetch --depth=1 origin \"$VCPKG_BASELINE\" 2>/dev/null || \\\n    git -C vcpkg fetch --unshallow 2>/dev/null || true\nfi\ntest -f vcpkg/scripts/buildsystems/vcpkg.cmake || {\n  echo \"::error::vcpkg submodule/toolchain missing before bootstrap\"\n  exit 1\n}\n./vcpkg/bootstrap-vcpkg.bat -disableMetrics",
                  "configure_command": "set -euo pipefail\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --preset windows-release 2>&1 | tee configure-windows-release.log",
                  "build_command": "set -euo pipefail\nexport CMAKE_C_COMPILER_LAUNCHER=sccache\nexport CMAKE_CXX_COMPILER_LAUNCHER=sccache\ncmake --build --preset windows-release --parallel 16 2>&1 | tee build-windows-release.log",
                  "validation_command": "set -euo pipefail\nctest --preset windows-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-windows-release.log\n\ncmake --install build-msvc-windows-release --prefix build-msvc-windows-release/install 2>&1 | tee install-windows-release.log\n\nBUILD_DIR=\"${GITHUB_WORKSPACE}/build-msvc-windows-release\"\nPACKAGES_DIR=\"${GITHUB_WORKSPACE}/packages\"\nrm -rf \"${PACKAGES_DIR}\"\nmkdir -p \"${PACKAGES_DIR}\"\n\nfor GEN in ZIP WIX; do\n  if ! command -v candle &>/dev/null 2>&1 && [ \"${GEN}\" = \"WIX\" ]; then\n    echo \"::notice::WiX (candle) not found - MSI generator skipped.\"\n    continue\n  fi\n  echo \"--- Running CPack generator: ${GEN} ---\"\n  cpack --config \"${BUILD_DIR}/CPackConfig.cmake\" \\\n    -DCPACK_PACKAGE_DIRECTORY=\"${PACKAGES_DIR}\" \\\n    -G \"${GEN}\" 2>&1 | tee \"${GITHUB_WORKSPACE}/cpack-${GEN}-windows-release.log\" || \\\n    echo \"::warning::CPack generator ${GEN} failed - continuing.\"\ndone\n\nif ! find \"${PACKAGES_DIR}\" -maxdepth 1 \( -name '*.zip' -o -name '*.msi' -o -name '*.exe' \) -print -quit | grep -q .; then\n  echo \"::error::No Windows package artifacts were produced in ${PACKAGES_DIR}\"\n  ls -la \"${PACKAGES_DIR}\" || true\n  exit 1\nfi\n\necho \"Packages produced:\"\nls -lh \"${PACKAGES_DIR}\" || true",
                  "artifact_name": f"build-windows-release-{run_number}",
                  "artifact_paths": "build-msvc-windows-release/*.exe\nbuild-msvc-windows-release/*.dll\nconfigure-windows-release.log\nbuild-windows-release.log\ntest-windows-release.log\ninstall-windows-release.log\ncpack-*windows-release.log",
                  "artifact_name_secondary": f"packages-windows-release-{run_number}",
                  "artifact_paths_secondary": "packages/",
                  "artifact_retention_days": "30",
                  "artifact_retention_days_secondary": "90",
                  "summary_title": "Windows Release (windows-latest)",
              },
              {
                  "id": "macos-release",
                  "enabled": build_matrix == "macos-release-only",
                  "runs_on": "macos-latest",
                  "setup_command": "set -euo pipefail\nbrew update || true\nbrew install \\\n  cmake ninja pkg-config sccache \\\n  openssl@3 zstd fmt spdlog nlohmann-json tbb \\\n  yaml-cpp mimalloc curl cpp-httplib boost grpc protobuf pugixml || true\ngit submodule sync -- vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true\ngit submodule update --init --depth 1 vcpkg whisper.cpp stable-diffusion.cpp ffmpeg external/GIUF || true",
                  "configure_command": "set -euo pipefail\nif command -v sccache >/dev/null 2>&1; then\n  export CMAKE_C_COMPILER_LAUNCHER=sccache\n  export CMAKE_CXX_COMPILER_LAUNCHER=sccache\nfi\ncmake --preset community-release 2>&1 | tee configure-macos-release.log",
                  "build_command": "set -euo pipefail\nif command -v sccache >/dev/null 2>&1; then\n  export CMAKE_C_COMPILER_LAUNCHER=sccache\n  export CMAKE_CXX_COMPILER_LAUNCHER=sccache\nfi\ncmake --build --preset community-release --parallel 8 2>&1 | tee build-macos-release.log",
                  "validation_command": "set -euo pipefail\nctest --preset community-release --output-on-failure -j 1 --timeout 60 2>&1 | tee test-macos-release.log || true\n\nBUILD_DIR=\"${GITHUB_WORKSPACE}/build-community-release\"\nPACKAGES_DIR=\"${GITHUB_WORKSPACE}/packages\"\nrm -rf \"${PACKAGES_DIR}\"\nmkdir -p \"${PACKAGES_DIR}\"\n\ncmake --install \"${BUILD_DIR}\" --prefix \"${BUILD_DIR}/install\" 2>&1 | tee install-macos-release.log || \\\n  echo \"::warning::Install step failed on macOS experimental lane.\"\n\nfor GEN in TGZ DragNDrop; do\n  echo \"--- Running CPack generator: ${GEN} ---\"\n  cpack --config \"${BUILD_DIR}/CPackConfig.cmake\" \\\n    -DCPACK_PACKAGE_DIRECTORY=\"${PACKAGES_DIR}\" \\\n    -G \"${GEN}\" 2>&1 | tee \"${GITHUB_WORKSPACE}/cpack-${GEN}-macos-release.log\" || \\\n    echo \"::warning::CPack generator ${GEN} failed on macOS experimental lane.\"\ndone\n\nif ! find \"${PACKAGES_DIR}\" -maxdepth 1 \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.dmg' \) -print -quit | grep -q .; then\n  echo \"::notice::No macOS package artifact produced in experimental lane.\"\nfi\n\necho \"Packages produced (if any):\"\nls -lh \"${PACKAGES_DIR}\" || true",
                  "build_continue_on_error": True,
                  "validation_continue_on_error": True,
                  "artifact_name": f"build-macos-release-{run_number}",
                  "artifact_paths": "build-community-release/themisdb*\nbuild-community-release/*.dylib\nconfigure-macos-release.log\nbuild-macos-release.log\ntest-macos-release.log\ninstall-macos-release.log\ncpack-*-macos-release.log",
                  "artifact_name_secondary": f"packages-macos-release-{run_number}",
                  "artifact_paths_secondary": "packages/",
                  "artifact_retention_days": "30",
                  "artifact_retention_days_secondary": "30",
                  "summary_title": "macOS Release (macos-latest, experimental opt-in)",
              },
          ]

          selected = [entry for entry in entries if entry["enabled"]]
          print(f"matrix={json.dumps({'include': selected})}")
          PY

  release-platform-matrix:
    name: "Build: ${{ matrix.summary_title }}"
    needs: prepare-release-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release-matrix.outputs.matrix) }}

    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      enable_sccache_gha: true
      runs_on: ${{ matrix.runs_on }}
      shell: bash
      fetch_depth: '0'
      setup_command: ${{ matrix.setup_command }}
      configure_command: ${{ matrix.configure_command }}
      build_command: ${{ matrix.build_command }}
      validation_command: ${{ matrix.validation_command }}
      build_continue_on_error: ${{ matrix.build_continue_on_error || false }}
      validation_continue_on_error: ${{ matrix.validation_continue_on_error || false }}
      artifact_name: ${{ matrix.artifact_name }}
      artifact_paths: ${{ matrix.artifact_paths }}
      artifact_name_secondary: ${{ matrix.artifact_name_secondary }}
      artifact_paths_secondary: ${{ matrix.artifact_paths_secondary }}
      artifact_retention_days: ${{ matrix.artifact_retention_days }}
      artifact_retention_days_secondary: ${{ matrix.artifact_retention_days_secondary }}
      summary_title: ${{ matrix.summary_title }}
