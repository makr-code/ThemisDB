name: "Governance: Nightly Audit Scope"

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      include_pr_validation:
        description: 'Run parity checks against the governance PR checklist'
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: nightly-governance-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  governance-audit:
    name: Audit governance docs and release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.11'

      - name: Validate required governance artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          repo = Path('.')
          required = [
              repo / 'audit' / 'BLOCK_D_GOVERNANCE_IMPLEMENTATION_GUIDE.md',
              repo / 'audit' / 'GOVERNANCE_TEST_TEMPLATE.md',
              repo / 'PR_GOVERNANCE_TESTS_CHECKLIST.md',
              repo / 'PR_PHASE3_BATCH1_CHECKLIST.md',
              repo / 'CODE_REVIEW_PROTOCOL.md',
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f'Missing required governance artifacts: {missing}')

          for path in required:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  raise SystemExit(f'Metadata front matter is missing in {path}')
          print('Required governance artifacts are present and metadata-gated.')
          PY

      - name: Validate review and phase-3 artifact metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          repo = Path('.')
          checklist_files = [
              repo / 'PR_GOVERNANCE_TESTS_CHECKLIST.md',
              repo / 'PR_PHASE3_BATCH1_CHECKLIST.md',
              repo / 'CODE_REVIEW_PROTOCOL.md',
          ]
          required_tokens = {
              'PR_GOVERNANCE_TESTS_CHECKLIST.md': ['Wave 10 Phase 1 - Parallel D+A', 'wave-10', 'block-d', 'Governance Test Update'],
              'PR_PHASE3_BATCH1_CHECKLIST.md': ['Wave 10 Phase 1 - Parallel D+A', 'wave-10', 'block-a', 'Phase 3 Batch 1 Test Update'],
              'CODE_REVIEW_PROTOCOL.md': ['Wave 10 Phase 1', 'Block D', 'Phase 3 Batch 1', 'approved'],
          }
          for path in checklist_files:
              text = path.read_text(encoding='utf-8')
              missing = [token for token in required_tokens[path.name] if token not in text]
              if missing:
                  raise SystemExit(f'{path.name} is missing required metadata: {missing}')
          print('Review artifact metadata is present and aligned with Wave 10 milestone requirements.')
          PY

      - name: Gather audit scope inventory
        run: |
          mkdir -p artifacts/nightly/audit
          find audit -maxdepth 2 -type f -name '*.md' | sort > artifacts/nightly/audit/audit-files.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          audit_dir = Path('audit')
          files = sorted(str(p) for p in audit_dir.rglob('*.md'))
          payload = {
              'generated_at': 'nightly',
              'count': len(files),
              'files': files,
          }
          Path('artifacts/nightly/audit/audit-file-index.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(f'Indexed {len(files)} audit markdown files.')
          PY

      - name: Validate governance PR checklist metadata
        if: ${{ github.event.inputs.include_pr_validation == 'true' || github.event_name == 'schedule' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checklists = [
              Path('PR_GOVERNANCE_TESTS_CHECKLIST.md'),
              Path('PR_PHASE3_BATCH1_CHECKLIST.md'),
          ]
          required_tokens = {
              'PR_GOVERNANCE_TESTS_CHECKLIST.md': ['Wave 10 Phase 1 - Parallel D+A', 'wave-10', 'block-d', 'Governance Test Update'],
              'PR_PHASE3_BATCH1_CHECKLIST.md': ['Wave 10 Phase 1 - Parallel D+A', 'wave-10', 'block-a', 'Phase 3 Batch 1 Test Update'],
          }
          for checklist in checklists:
              text = checklist.read_text(encoding='utf-8')
              missing = [token for token in required_tokens[checklist.name] if token not in text]
              if missing:
                  raise SystemExit(f'{checklist.name} is missing required metadata: {missing}')
          print('Governance and Phase 3 PR checklists contain the required milestone and label references.')
          PY

      - name: Upload nightly audit artifact
        uses: actions/upload-artifact@v5
        with:
          name: governance-audit-${{ github.run_id }}
          path: artifacts/nightly/audit/
          retention-days: 14
          if-no-files-found: error

      - name: Summarize nightly governance audit
        if: always()
        run: |
          {
            echo "## Governance Audit Summary"
            echo ""
            echo "- Scope: \`audit/\` governance docs and release evidence"
            echo "- Template: \`audit/GOVERNANCE_TEST_TEMPLATE.md\`"
            echo "- Checklist: \`PR_GOVERNANCE_TESTS_CHECKLIST.md\`"
            echo "- Artifact: \`artifacts/nightly/audit/\`"
          } >> "$GITHUB_STEP_SUMMARY"
