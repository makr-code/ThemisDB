name: "Build: Mainline"

# Mainline owns platform/runtime builds. CTest, benchmark execution, and the
# macOS kqueue suite are delegated to reusable validation gates.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      sanitizer:
        description: 'Additional sanitizer job (asan|ubsan|none|both)'
        required: false
        default: 'none'
        type: choice
        options: [none, asan, ubsan, both]
      debug_mode:
        description: 'Enable extra verbose debug output'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Run all build and gate validation without updating the build tracker'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-build-mainline-${{ github.ref }}-matrix.mainline
  cancel-in-progress: false

jobs:
  mark-build-pending:
    name: "Build: Mark Pending State"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set build tracker pending label
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[CI] Build status tracker — develop'
          issue-marker: '<!-- ci-build:type:build-status -->'
          issue-body: |
            <!-- ci-build:type:build-status -->
            ## CI Build Status — `develop`

            Current status: **⏳ pending**

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.sha }}`

            _This issue tracks post-merge build and validation health on develop._
            _Labels: `status/build-pending` = build running; final state is applied after workflow completion._
          labels-to-add: 'status/build-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Preview build tracker pending label
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: |
          {
            echo "## Build tracker dry-run preview"
            echo "Would set the tracker to pending; no issue or label was changed."
          } >> "$GITHUB_STEP_SUMMARY"

  step2-platform-matrix:
    name: "Build: Step 2 · Matrix (Mainline Orchestration)"
    needs: mark-build-pending
    uses: ./.github/workflows/release-build-matrix.yml
    with:
      build_matrix: community-only
      run_ctest: false
      os: all
      architecture: all
      edition: community
      build_type: Release
      packaging: auto
      distribution: all
    permissions:
      contents: read
      actions: read

  step2-architecture-summary:
    name: "Validate: Step 2 · Architecture Summary"
    needs: step2-platform-matrix
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "Validate: Summarize Step 2 architecture matrix"
        shell: bash
        run: |
          {
            echo "### Step 2 · Architecture Matrix"
            echo ""
            echo "- Matrix job result: ${{ needs.step2-platform-matrix.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

  fast-compile-check:
    name: "Build: Mainline Fast Compile Check"
    needs: step2-architecture-summary
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      build_directory: build-fast
      enable_sccache_gha: true
      runs_on: ubuntu-24.04
      cache_arch: x64
      cache_compiler: gcc
      vcpkg_triplet: x64-linux
      shell: bash
      fetch_depth: '0'
      submodules: false
      working_directory: .
      setup_command: >-
        set -euo pipefail; echo "Build: Mainline faster compile feedback lane"; git config --file .git/config --remove-section submodule.plugins/themisdb_ethic_ai || true; git config --file .git/config --remove-section submodule.plugins/themisdb_importer || true; git config --file .git/config --remove-section submodule.plugins/themisdb_storage || true; git config --file .git/config --remove-section submodule.plugins/themisdb_llm_wiki || true; git config --file .git/config --remove-section submodule.plugins/themisdb_plugin_signer || true; sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config librocksdb-dev libgtest-dev libgmock-dev libssl-dev zlib1g-dev libzstd-dev libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev libvulkan-dev glslc libcpp-httplib-dev libboost-dev libboost-system-dev libboost-filesystem-dev libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev dpkg-dev rpm; echo "Fast-path dependencies installed"
      configure_command: >-
        export SCCACHE_GHA_ENABLED=true; cmake -S . -B build-fast -G Ninja -DCMAKE_TOOLCHAIN_FILE= -DTHEMIS_BUILD_TESTS=OFF -DTHEMIS_BUILD_BENCHMARKS=OFF -DTHEMIS_ENABLE_LLM=OFF -DCMAKE_C_COMPILER_LAUNCHER="${SCCACHE_PATH:-sccache}" -DCMAKE_CXX_COMPILER_LAUNCHER="${SCCACHE_PATH:-sccache}"
      build_command: >-
        export SCCACHE_GHA_ENABLED=true;
        set -euo pipefail;
        cmake --build build-fast --parallel 12 --target themis_base
      summary_title: "Build: Mainline Fast Compile Check"

  build:
    name: "Build: Mainline (Linux)"
    needs: step2-architecture-summary
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      build_directory: build
      enable_sccache_gha: true
      runs_on: ubuntu-24.04
      cache_arch: x64
      cache_compiler: gcc
      vcpkg_triplet: x64-linux
      shell: bash
      fetch_depth: '0'
      submodules: false
      working_directory: .
      setup_command: >-
        set -euo pipefail; echo "Build: Mainline runtime build"; git config --file .git/config --remove-section submodule.plugins/themisdb_ethic_ai || true; git config --file .git/config --remove-section submodule.plugins/themisdb_importer || true; git config --file .git/config --remove-section submodule.plugins/themisdb_storage || true; git config --file .git/config --remove-section submodule.plugins/themisdb_llm_wiki || true; git config --file .git/config --remove-section submodule.plugins/themisdb_plugin_signer || true; sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config librocksdb-dev libgtest-dev libgmock-dev libssl-dev zlib1g-dev libzstd-dev libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev libvulkan-dev glslc libcpp-httplib-dev libboost-dev libboost-system-dev libboost-filesystem-dev libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev dpkg-dev rpm; echo "Runtime build dependencies installed"
      configure_command: >-
        cmake -S . -B build -G Ninja
        -DTHEMIS_BUILD_TESTS=OFF -DTHEMIS_BUILD_BENCHMARKS=OFF
        -DCMAKE_C_COMPILER_LAUNCHER="${SCCACHE_PATH:-sccache}"
        -DCMAKE_CXX_COMPILER_LAUNCHER="${SCCACHE_PATH:-sccache}"
      build_command: |
        set -euo pipefail
        build_log="$(mktemp)"
        exit_file="$(mktemp)"
        trap 'rm -f "${build_log}" "${exit_file}"' EXIT
        set +e
        (cmake --build build --parallel 16; echo "$?" > "${exit_file}") 2>&1 | tee "${build_log}"
        build_exit="$(cat "${exit_file}")"
        set -e
        if [ "${build_exit}" -ne 0 ] && grep -Eq 'sccache: error: Server startup failed|cache storage failed to read' "${build_log}"; then
          echo "::warning::Transient sccache backend failure detected; retrying the runtime build without compiler cache"
          export SCCACHE_GHA_ENABLED=false
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          "${SCCACHE_PATH:-sccache}" --stop-server || true
          cmake -S . -B build \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_ENABLE_COMPILER_CACHE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER= \
            -DCMAKE_CXX_COMPILER_LAUNCHER=
          cmake --build build --parallel 16
        else
          "${SCCACHE_PATH:-sccache}" --show-stats || true
          exit "${build_exit}"
        fi
      summary_title: "Build: Mainline Runtime"

  validation-gates:
    name: "Gate: Mainline CTest, Benchmarks, and macOS"
    needs: step2-architecture-summary
    uses: ./.github/workflows/reusable-mainline-validation-gates.yml
    permissions:
      contents: read
      actions: read

  update-build-labels:
    name: "Build: Update build-status labels"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - step2-platform-matrix
      - build
      - fast-compile-check
      - validation-gates
    if: always()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Derive build and gate status
        id: status
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.step2-platform-matrix.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          FAST_RESULT: ${{ needs.fast-compile-check.result }}
          CTEST_RESULT: ${{ needs.validation-gates.outputs.ctest_result }}
          BENCHMARK_RESULT: ${{ needs.validation-gates.outputs.benchmark_result }}
          MACOS_RESULT: ${{ needs.validation-gates.outputs.macos_kqueue_result }}
        run: |
          if [[ "${MATRIX_RESULT}" == success && "${BUILD_RESULT}" == success && "${FAST_RESULT}" == success && "${CTEST_RESULT}" == success && "${BENCHMARK_RESULT}" == success && "${MACOS_RESULT}" == success ]]; then
            {
              echo "status_label=ci/build-ok"
              echo "status_text=passing"
              echo "status_icon=✅"
              echo "status_reason=platform builds and all reusable validation gates succeeded"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${MATRIX_RESULT}" == cancelled || "${BUILD_RESULT}" == cancelled || "${FAST_RESULT}" == cancelled || "${CTEST_RESULT}" == cancelled || "${BENCHMARK_RESULT}" == cancelled || "${MACOS_RESULT}" == cancelled || "${MATRIX_RESULT}" == skipped || "${BUILD_RESULT}" == skipped || "${FAST_RESULT}" == skipped || "${CTEST_RESULT}" == skipped || "${BENCHMARK_RESULT}" == skipped || "${MACOS_RESULT}" == skipped ]]; then
            {
              echo "status_label=ci/build-cancelled"
              echo "status_text=cancelled, skipped, or incomplete"
              echo "status_icon=⏭️"
              echo "status_reason=a required platform build or validation gate did not complete"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${BUILD_RESULT}" == failure || "${FAST_RESULT}" == failure || "${MATRIX_RESULT}" == failure ]]; then
            {
              echo "status_label=ci/build-failed"
              echo "status_text=failing (platform or compiler build)"
              echo "status_icon=❌"
              echo "status_reason=mainline platform matrix or runtime build failed"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${CTEST_RESULT}" == failure || "${BENCHMARK_RESULT}" == failure || "${MACOS_RESULT}" == failure ]]; then
            {
              echo "status_label=ci/build-ok,ci/test-failed"
              echo "status_text=build ok, validation gate failing"
              echo "status_icon=⚠️"
              echo "status_reason=platform builds passed but a CTest or benchmark gate failed"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "status_label=ci/build-cancelled"
              echo "status_text=unknown or incomplete"
              echo "status_icon=⚠️"
              echo "status_reason=one or more required outcomes were unavailable"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert build tracker issue
        id: tracker
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[CI] Build status tracker — develop'
          issue-marker: '<!-- ci-build:type:build-status -->'
          issue-body: |
            <!-- ci-build:type:build-status -->
            ## CI Build Status — `develop`

            Current status: **${{ steps.status.outputs.status_icon }} ${{ steps.status.outputs.status_text }}**
            Reason: `${{ steps.status.outputs.status_reason }}`

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.sha }}`
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Replace status labels atomically
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-number: ${{ steps.tracker.outputs.issue-number }}
          labels-to-add: ${{ steps.status.outputs.status_label }}
          status-group: 'ci/build-ok,ci/build-failed,ci/compiler-linker-failed,ci/test-failed,status/build-pending,ci/build-cancelled'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Comment build status
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-number: ${{ steps.tracker.outputs.issue-number }}
          issue-body: '${{ steps.status.outputs.status_icon }} Mainline: ${{ steps.status.outputs.status_text }} for `${{ github.sha }}` — [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Preview build tracker status
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        env:
          STATUS_TEXT: ${{ steps.status.outputs.status_text }}
        run: |
          {
            echo "## Build tracker dry-run preview"
            echo "- Resolved status: \`${STATUS_TEXT:-unavailable}\`"
            echo "- Preview: issue upsert, status-label replacement, and comment were suppressed."
          } >> "$GITHUB_STEP_SUMMARY"
