name: "Build: Mainline"

# Rechenaufwand-Score: R=7 (K=8, L=7, N=7) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# ──────────────────────────────────────────────────────────────────────────────
# Trigger policy: push to develop only (no pull_request trigger).
# Heavy C++ builds (up to 120 min) run post-merge, not on every PR push.
# PR-level feedback is provided by lightweight gate-pr-core.yml and gate-pr-*.yml.
# See .github/WORKFLOW_GUIDELINES.md §Label Policy for build-status labels.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**/*.c'
      - 'src/**/*.cc'
      - 'src/**/*.cpp'
      - 'src/**/*.cxx'
      - 'src/**/*.h'
      - 'src/**/*.hh'
      - 'src/**/*.hpp'
      - 'src/**/*.hxx'
      - 'include/**/*.h'
      - 'include/**/*.hh'
      - 'include/**/*.hpp'
      - 'include/**/*.hxx'
      - 'include/**/*.ipp'
      - 'include/**/*.tpp'
      - 'tests/**/*.c'
      - 'tests/**/*.cc'
      - 'tests/**/*.cpp'
      - 'tests/**/*.cxx'
      - 'tests/**/*.h'
      - 'tests/**/*.hh'
      - 'tests/**/*.hpp'
      - 'tests/**/*.hxx'
      - 'tests/**/CMakeLists.txt'
      - 'tests/**/*.cmake'
      - 'tests/**/*.in'
      - 'plugins/**/*.c'
      - 'plugins/**/*.cc'
      - 'plugins/**/*.cpp'
      - 'plugins/**/*.cxx'
      - 'plugins/**/*.h'
      - 'plugins/**/*.hh'
      - 'plugins/**/*.hpp'
      - 'plugins/**/*.hxx'
      - 'plugins/**/plugin.toml'
      - 'plugins/**/plugin.json'
      - 'plugins/**/CMakeLists.txt'
      - 'plugins/**/*.cmake'
      - 'plugins/**/*.in'
      - 'plugins/**/*.txt'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**/*.cmake'
      - 'cmake/**/*.txt'
      - 'cmake/**/*.in'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - '.github/actions/**/action.yml'
      - '.github/actions/**/*.js'
      - '.github/workflows/build-mainline.yml'
  workflow_dispatch:
    inputs:
      sanitizer:
        description: 'Additional sanitizer job (asan|ubsan|none|both)'
        required: false
        default: 'none'
        type: choice
        options: [none, asan, ubsan, both]
      debug_mode:
        description: 'Enable extra verbose debug output'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
  checks: read

concurrency:
  group: ci-build-mainline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mark-build-pending:
    name: Mark build pending state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build tracker pending label
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[CI] Build status tracker — develop'
          issue-marker: '<!-- ci-build:type:build-status -->'
          issue-body: |
            <!-- ci-build:type:build-status -->
            ## CI Build Status — `develop`

            Current status: **⏳ pending**

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.sha }}`

            _This issue tracks post-merge build health on develop._
            _Labels: `status/build-pending` = build running; final state is applied after workflow completion._
          labels-to-add: 'status/build-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

  build:
    needs: mark-build-pending
    uses: ./.github/workflows/reusable-cmake-build.yml
    with:
      runs_on: ubuntu-latest
      shell: bash
      fetch_depth: '0'
      submodules: false
      working_directory: .
      setup_command: >-
        set -euo pipefail; echo "CI — Build wrapper delegating to reusable CMake build pipeline"; git config --file .git/config --remove-section submodule.plugins/private/themisdb_ethic_ai || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_importer || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_storage || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_llm_wiki || true; git config --file .git/config --remove-section submodule.plugins/private/themisdb_plugin_signer || true; sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config sccache librocksdb-dev libgtest-dev libgmock-dev libssl-dev zlib1g-dev libzstd-dev libfmt-dev libspdlog-dev nlohmann-json3-dev libtbb-dev libyaml-cpp-dev libmimalloc-dev libcurl4-openssl-dev libvulkan-dev glslc libcpp-httplib-dev libboost-dev libboost-system-dev libboost-filesystem-dev libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev dpkg-dev rpm; if [ ! -f vcpkg/scripts/buildsystems/vcpkg.cmake ]; then rm -rf vcpkg; git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg; fi; test -f vcpkg/scripts/buildsystems/vcpkg.cmake || { echo "::error::vcpkg toolchain missing before bootstrap"; exit 1; }; export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"; export PATH="${VCPKG_ROOT}:${PATH}"; ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      configure_command: >-
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"; export PATH="${VCPKG_ROOT}:${PATH}"; cmake -S . -B build -DTHEMIS_BUILD_TESTS=ON -DTHEMIS_BUILD_BENCHMARKS=OFF
      build_command: >-
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"; export PATH="${VCPKG_ROOT}:${PATH}"; cmake --build build --parallel 16
      validation_command: >-
        export VCPKG_ROOT="${GITHUB_WORKSPACE}/vcpkg"; export PATH="${VCPKG_ROOT}:${PATH}"; ctest --test-dir build --output-on-failure -j 1 --timeout 60
      artifact_name: ctest-results-${{ github.run_number }}
      artifact_paths: |
        build/Testing
        build/ctest-results.xml
        build/ctest-output.txt
      artifact_retention_days: '7'
      summary_title: CI — Build

  # ── macOS kqueue path validation ──────────────────────────────────────────
  # Validates that kqueue-backed file watchers (ConfigFileWatcher,
  # PluginHotPlugMonitor) build and pass tests on macOS runners.
  # Must be resilient to transient sccache/GHA-cache backend outages so that
  # infrastructure blips never block platform validation.
  macos-kqueue-validation:
    name: 🍎 macOS kqueue Path Validation
    runs-on: macos-latest
    timeout-minutes: 45
    needs: mark-build-pending
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Print macOS kqueue job context
        run: |
          echo "============================================================"
          echo " Build: Mainline  |  macOS kqueue Validation Job"
          echo "============================================================"
          echo "  Trigger  : ${{ github.event_name }}"
          echo "  SHA      : ${{ github.sha }}"
          echo "  OS       : $(sw_vers -productVersion) ($(uname -m))"
          echo "  Scope    : config_file_watcher + plugin_hot_plug_monitor kqueue paths"
          echo "============================================================"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # sccache is used for build caching when the GHA cache backend is
      # available.  The step is non-fatal so that a transient cache-service
      # outage (Azure / GHA cache) never blocks compilation.
      - name: Setup sccache
        id: sccache-setup
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Install Homebrew dependencies
        run: |
          echo "  Installing macOS build dependencies via Homebrew..."
          brew update --quiet
          brew install cmake ninja fmt spdlog nlohmann-json tbb openssl@3 boost rocksdb zstd lz4 snappy yaml-cpp googletest
          echo "  ✅ Homebrew packages installed"
          cmake --version
          ninja --version

      - name: Configure CMake (macOS, kqueue-enabled modules only)
        id: cmake_configure_macos
        run: |
          echo "──────────────────────────────────────────────"
          echo "  CMake configure (macOS) — scoped to config + plugins"
          echo "──────────────────────────────────────────────"
          T0=$(date +%s)
          OPENSSL_ROOT=$(brew --prefix openssl@3)
          BREW_PREFIX=$(brew --prefix)

          # Conditionally enable sccache compiler launcher only when the
          # sccache server actually started successfully.  This prevents the
          # build from failing when the GHA cache backend is unavailable.
          if [ "${{ steps.sccache-setup.outcome }}" = "success" ] && sccache --show-stats &>/dev/null; then
            echo "  sccache available — enabling compiler launcher"
            C_LAUNCHER="-DCMAKE_C_COMPILER_LAUNCHER=sccache"
            CXX_LAUNCHER="-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          else
            echo "::warning::sccache unavailable or not running; building without cache"
            C_LAUNCHER=""
            CXX_LAUNCHER=""
          fi

          cmake -S . -B build-macos \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${C_LAUNCHER:+$C_LAUNCHER} \
            ${CXX_LAUNCHER:+$CXX_LAUNCHER} \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}" \
            -DCMAKE_PREFIX_PATH="${BREW_PREFIX}" \
            -DCMAKE_EXE_LINKER_FLAGS="-L${BREW_PREFIX}/lib" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L${BREW_PREFIX}/lib" \
            -DCMAKE_MODULE_LINKER_FLAGS="-L${BREW_PREFIX}/lib" \
            -DTHEMIS_BUILD_TESTS=ON \
            -DTHEMIS_MODELS_MODE=SKIP \
            -DTHEMIS_EDITION=COMMUNITY
          echo "  ✅ Configure completed in $(( $(date +%s) - T0 ))s"

      # Build only the three kqueue-scoped test targets.  Scoping to specific
      # targets means that unrelated C++ compile errors elsewhere in the tree
      # cannot block kqueue path validation.  Each target is built in a
      # separate cmake --build invocation so that a failure in one target
      # (e.g. a source file removed by a refactor) is recorded as a warning
      # rather than immediately aborting the step.
      - name: Build kqueue-scoped test targets (macOS)
        id: macos_build
        run: |
          set -euo pipefail
          T0=$(date +%s)
          NCPU="$(sysctl -n hw.logicalcpu)"
          BUILD_WARN=0
          BUILT_COUNT=0
          BUILT_TEST_REGEX=""
          DECLARED_COUNT=0

          DECLARED_TARGETS=()
          while IFS= read -r _line; do
            DECLARED_TARGETS+=("$_line")
          done < <(
            ninja -C build-macos -t targets all \
              | awk -F: '{print $1}' \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | sort -u
          )

          has_declared_target() {
            local wanted="$1"
            for declared in "${DECLARED_TARGETS[@]}"; do
              if [ "${declared}" = "${wanted}" ]; then
                return 0
              fi
            done
            return 1
          }

          build_target() {
            local target="$1"
            local test_name="$2"
            if ! has_declared_target "${target}"; then
              echo "::warning::Target ${target} is not registered in this CMake graph; skipping"
              BUILD_WARN=$(( BUILD_WARN + 1 ))
              return 0
            fi
            DECLARED_COUNT=$(( DECLARED_COUNT + 1 ))
            echo "  → Building ${target}…"
            if cmake --build build-macos --parallel "${NCPU}" --target "${target}" 2>&1; then
              echo "    ✅ ${target} built"
              BUILT_COUNT=$(( BUILT_COUNT + 1 ))
              if [ -z "${BUILT_TEST_REGEX}" ]; then
                BUILT_TEST_REGEX="${test_name}"
              else
                BUILT_TEST_REGEX="${BUILT_TEST_REGEX}|${test_name}"
              fi
            else
              echo "::warning::Target ${target} failed to build; skipping its tests"
              BUILD_WARN=$(( BUILD_WARN + 1 ))
            fi
          }

          build_target test_config_file_watcher_focused ConfigFileWatcherFocusedTests
          build_target test_plugin_hot_plug_focused PluginHotPlugFocusedTests
          build_target test_plugin_hot_reload_enhanced_focused PluginHotReloadEnhancedFocusedTests

          SECS=$(( $(date +%s) - T0 ))
          echo "  ✅ kqueue-scoped targets built in ${SECS}s (${BUILD_WARN} target(s) with warnings)"

          if [ "${DECLARED_COUNT}" -eq 0 ]; then
            echo "::error::No kqueue-focused targets are registered by CMake on this runner"
            exit 1
          fi
          if [ "${BUILT_COUNT}" -eq 0 ]; then
            echo "::error::No declared kqueue-focused target built successfully; see build output above"
            exit 1
          fi
          {
            echo "built_count=${BUILT_COUNT}"
            echo "built_test_regex=${BUILT_TEST_REGEX}"
            echo "warn_count=${BUILD_WARN}"
          } >> "$GITHUB_OUTPUT"

      # Emit a discovery table so engineers can immediately see which test
      # binaries are present before the test run starts.
      - name: Verify kqueue test binaries
        run: |
          echo "──────────────────────────────────────────────"
          echo "  kqueue test discovery"
          echo "──────────────────────────────────────────────"
          TEST_REGEX="${{ steps.macos_build.outputs.built_test_regex }}"
          if [ -z "${TEST_REGEX}" ]; then
            echo "::error::No built kqueue tests were exported by macOS build step"
            exit 1
          fi
          echo "  Built test regex: ${TEST_REGEX}"
          ctest --test-dir build-macos -N -R "${TEST_REGEX}" || true
          {
            echo "#### 🍎 kqueue test discovery"
            echo "| Signal | Value |"
            echo "|---|---|"
            echo "| Built targets | \`${{ steps.macos_build.outputs.built_count }}\` |"
            echo "| Build warnings | \`${{ steps.macos_build.outputs.warn_count }}\` |"
            echo "| Built test regex | \`${TEST_REGEX}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run kqueue-related tests
        run: |
          set -o pipefail
          TEST_REGEX="${{ steps.macos_build.outputs.built_test_regex }}"
          if [ -z "${TEST_REGEX}" ]; then
            echo "::error::No built kqueue tests available to run"
            exit 1
          fi
          echo "──────────────────────────────────────────────"
          echo "  Running config + plugin tests (kqueue paths)"
          echo "  Test regex: ${TEST_REGEX}"
          echo "──────────────────────────────────────────────"
          T0=$(date +%s)
          ctest --test-dir build-macos \
            --output-on-failure \
            --parallel 2 \
            --timeout 120 \
            -R "${TEST_REGEX}" \
            2>&1 | tee macos-kqueue-output.txt
          EXIT_CODE="${PIPESTATUS[0]}"
          SECS=$(( $(date +%s) - T0 ))
          if [ "${EXIT_CODE}" -eq 0 ]; then
            echo "  ✅ kqueue tests completed in ${SECS}s"
          else
            echo "::error::kqueue tests failed (exit ${EXIT_CODE}); see macos-kqueue-output.txt artifact"
          fi
          {
            echo "### 🍎 macOS kqueue Results"
            echo ""
            if [ "${EXIT_CODE}" -eq 0 ]; then
              echo "✅ Tests completed in **${SECS}s**. Check \`macos-kqueue-results\` artifact for details."
            else
              echo "❌ Tests **FAILED** after ${SECS}s (exit ${EXIT_CODE}). Check \`macos-kqueue-results\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${EXIT_CODE}"

      - name: Print sccache statistics
        if: always() && steps.sccache-setup.outcome == 'success'
        run: sccache --show-stats || true

      - name: Upload macOS kqueue results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: macos-kqueue-results-${{ github.run_number }}
          path: macos-kqueue-output.txt
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Build-status label management
  # Sets ci/build-ok or ci/build-failed on the develop branch after each run.
  # These labels are used by branch protection rules and downstream workflows.
  # ──────────────────────────────────────────────────────────────────────────
  update-build-labels:
    name: Update build-status labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive status payload
        id: status
        shell: bash
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CONFIGURE_OUTCOME: ${{ needs.build.outputs.configure-outcome }}
          BUILD_OUTCOME: ${{ needs.build.outputs.build-outcome }}
          VALIDATION_OUTCOME: ${{ needs.build.outputs.validation-outcome }}
        run: |
          if [ "${BUILD_RESULT}" = "success" ]; then
            {
              echo "status_label=ci/build-ok"
              echo "status_text=passing"
              echo "status_icon=✅"
              echo "status_reason=full pipeline succeeded"
              echo "status_markers="
            } >> "$GITHUB_OUTPUT"
          elif [ "${BUILD_OUTCOME}" = "failure" ]; then
            {
              echo "status_label=ci/build-failed,ci/compiler-linker-failed"
              echo "status_text=failing (compiler/linker)"
              echo "status_icon=❌"
              echo "status_reason=build step failed (compiler/linker stage)"
              echo "status_markers=ci/compiler-linker-failed"
            } >> "$GITHUB_OUTPUT"
          elif [ "${VALIDATION_OUTCOME}" = "failure" ]; then
            {
              echo "status_label=ci/build-ok,ci/test-failed"
              echo "status_text=build ok, tests failing"
              echo "status_icon=⚠️"
              echo "status_reason=validation/test stage failed (non-build blocker)"
              echo "status_markers=ci/test-failed"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "status_label=ci/build-ok"
              echo "status_text=build status unknown (non compiler/linker failure)"
              echo "status_icon=⚠️"
              echo "status_reason=configure/setup or non-build stage failed"
              echo "status_markers="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert build tracker issue
        id: tracker
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[CI] Build status tracker — develop'
          issue-marker: '<!-- ci-build:type:build-status -->'
          issue-body: |
            <!-- ci-build:type:build-status -->
            ## CI Build Status — `develop`

            Current status: **${{ steps.status.outputs.status_icon }} ${{ steps.status.outputs.status_text }}**
            Reason: `${{ steps.status.outputs.status_reason }}`
            Marker: `${{ steps.status.outputs.status_markers || 'none' }}`

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.sha }}`

            _This issue tracks post-merge build health on develop._
            _Labels: `ci/build-failed` + `ci/compiler-linker-failed` = compiler/linker blocker; `ci/test-failed` = non-build blocker; `status/build-pending` = in progress._

      - name: Replace status labels atomically
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-number: ${{ steps.tracker.outputs.issue-number }}
          labels-to-add: ${{ steps.status.outputs.status_label }}
          status-group: 'ci/build-ok,ci/build-failed,ci/compiler-linker-failed,ci/test-failed,status/build-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Comment build status
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-number: ${{ steps.tracker.outputs.issue-number }}
          issue-body: '${{ steps.status.outputs.status_icon }} Build ${{ needs.build.result }} for `${{ github.sha }}` — [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}
