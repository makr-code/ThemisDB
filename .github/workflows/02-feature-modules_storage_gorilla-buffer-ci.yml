name: Gorilla Buffer CI

# Validates TSStore single-point insert buffering for Gorilla compression (v1.8.0, Issue #116).
# Triggered on every push/PR that touches the relevant source files.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/timeseries/ts_auto_buffer.h'
      - 'src/timeseries/ts_auto_buffer.cpp'
      - 'include/timeseries/tsstore.h'
      - 'src/timeseries/tsstore.cpp'
      - 'include/timeseries/query_optimizer.h'
      - 'src/timeseries/query_optimizer.cpp'
      - 'tests/test_tsstore_gorilla_buffer.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_gorilla-buffer-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/timeseries/ts_auto_buffer.h'
      - 'src/timeseries/ts_auto_buffer.cpp'
      - 'include/timeseries/tsstore.h'
      - 'src/timeseries/tsstore.cpp'
      - 'include/timeseries/query_optimizer.h'
      - 'src/timeseries/query_optimizer.cpp'
      - 'tests/test_tsstore_gorilla_buffer.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_gorilla-buffer-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the TSStoreGorillaBuf focused test suite.
  # Acceptance criteria covered:
  #   AC-GB-1  TSStore::putDataPoint() routes through TSAutoBuffer when Gorilla + auto_buffer set
  #   AC-GB-2  TSAutoBuffer::push() returns OK on normal insert
  #   AC-GB-3  TSAutoBuffer::push() returns BUFFER_FULL when max_buffer_bytes exceeded
  #   AC-GB-4  TSAutoBuffer gorilla_batch_size triggers flush after N points
  #   AC-GB-5  1000 single-point inserts: p99 latency within 500 µs (CI headroom)
  #   AC-GB-6  Gorilla-compressed on-disk size < raw uncompressed size
  #   AC-GB-7  TSQueryOptimizer::OptimizationHint decode_width propagated to QueryPlan
  # ---------------------------------------------------------------------------
  gorilla-buffer-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Gorilla Buffer (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run TSStoreGorillaBufFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R TSStoreGorillaBufFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee gorilla_buffer_ctest.txt

      # ── Full test filter via unified binary ────────────────────────────────
      - name: Run GorillaBufFixture tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_tsstore_gorilla_buffer_focused \
            --gtest_filter="GorillaBufFixture*" \
            --gtest_output="xml:gorilla_buffer_gtest.xml" \
            2>&1 | tee gorilla_buffer_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gorilla-buffer-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/gorilla_buffer_ctest.txt
            build/gorilla_buffer_gtest.xml
            build/gorilla_buffer_gtest_output.txt
          retention-days: 30
