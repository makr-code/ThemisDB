name: Process Discovery & Conformance Checking CI

# Validates:
#   AC-PDC-1  Inductive Miner (runInductiveMiner) is a real divide-and-conquer
#             implementation — not a fallback to HeuristicMiner
#   AC-PDC-2  XOR / SEQ / AND / LOOP cut detection and sub-log splitting
#   AC-PDC-3  Alignment-based conformance checking uses DP edit-distance
#             (fitness == 1.0 for perfect match, 0.0 for fully deviant trace)
#   AC-PDC-4  computeAlignment backtrack produces typed move sequences
#             (sync / log / model moves with correct costs)
#   AC-PDC-5  BPMN 2.0 export from Inductive Miner result produces valid XML

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/process_mining.h'
      - 'src/analytics/process_mining.cpp'
      - 'tests/analytics/test_process_discovery_conformance.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_process-discovery-conformance-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/process_mining.h'
      - 'src/analytics/process_mining.cpp'
      - 'tests/analytics/test_process_discovery_conformance.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_process-discovery-conformance-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ProcessDiscoveryConformanceFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-PDC-1  runInductiveMiner() returns distinct result from runHeuristicMiner()
  #             for structured logs (SEQ / XOR / AND / LOOP cuts)
  #   AC-PDC-2  Linear log → SEQ cut detected; XOR log → XOR cut detected;
  #             parallel log → AND cut detected; loop log → LOOP cut detected
  #   AC-PDC-3  alignFitness(A→B→C, A→B→C) == 1.0; alignFitness(X→Y→Z, A→B→C) == 0.0
  #   AC-PDC-4  Move sequences contain "sync", "log", "model" typed moves
  #   AC-PDC-5  exportToBPMN() on Inductive Miner result starts with <?xml
  # ---------------------------------------------------------------------------
  process-discovery-conformance-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ProcessDiscoveryConformance tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_process_discovery_conformance_focused

      - name: Run ProcessDiscoveryConformanceFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R ProcessDiscoveryConformanceFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee pdc_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_process_discovery_conformance_focused \
            --gtest_output="xml:pdc_gtest.xml" \
            2>&1 | tee pdc_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdc-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/pdc_ctest.txt
            build/pdc_gtest.xml
            build/pdc_gtest_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 Process Discovery & Conformance Checking – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Inductive Miner: XOR/SEQ/AND/LOOP cut detection, divide-and-conquer recursion, flower-model fallback." >> "$GITHUB_STEP_SUMMARY"
          echo "Alignment conformance: DP edit-distance, fitness=1.0 for perfect match, typed move sequences." >> "$GITHUB_STEP_SUMMARY"
