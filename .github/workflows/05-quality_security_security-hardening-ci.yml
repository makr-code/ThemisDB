name: Security Hardening CI

# Triggered whenever security-relevant sources or this workflow itself change.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/auth/**'
      - 'src/security/**'
      - 'src/server/api_auth_config.cpp'
      - 'src/server/api_security_audit.cpp'
      - 'src/server/auth_middleware.cpp'
      - 'include/auth/**'
      - 'include/security/**'
      - 'include/server/api_auth_config.h'
      - 'include/server/api_security_audit.h'
      - 'include/server/auth_middleware.h'
      - 'tests/security/**'
      - 'tests/test_jwt_validator.cpp'
      - 'tests/test_jwt_validation_hardening.cpp'
      - 'tests/test_rbac_comprehensive.cpp'
      - 'tests/test_api_security_audit.cpp'
      - 'tests/test_vault_key_provider.cpp'
      - 'tests/test_vault_signing_provider_errors.cpp'
      - 'tests/test_hsm_stub_gating.cpp'
      - 'tests/test_hsm_startup_integration.cpp'
      - 'tests/test_hsm_security_checker.cpp'
      - 'tests/test_hsm_security_metrics.cpp'
      - 'tests/test_hsm_provider.cpp'
      - 'tests/test_usb_admin_authenticator.cpp'
      - 'tests/test_usb_volume_hardening.cpp'
      - 'fuzz/harnesses/jwt_rbac_config_harness.cpp'
      - 'fuzz/corpus/jwt/**'
      - 'fuzz/corpus/rbac/**'
      - '.github/workflows/05-quality_security_security-hardening-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/auth/**'
      - 'src/security/**'
      - 'src/server/api_auth_config.cpp'
      - 'src/server/api_security_audit.cpp'
      - 'src/server/auth_middleware.cpp'
      - 'include/auth/**'
      - 'include/security/**'
      - 'include/server/api_auth_config.h'
      - 'include/server/api_security_audit.h'
      - 'include/server/auth_middleware.h'
      - 'tests/security/**'
      - 'tests/test_jwt_validator.cpp'
      - 'tests/test_jwt_validation_hardening.cpp'
      - 'tests/test_rbac_comprehensive.cpp'
      - 'tests/test_api_security_audit.cpp'
      - 'tests/test_vault_key_provider.cpp'
      - 'tests/test_vault_signing_provider_errors.cpp'
      - 'tests/test_hsm_stub_gating.cpp'
      - 'tests/test_hsm_startup_integration.cpp'
      - 'tests/test_hsm_security_checker.cpp'
      - 'tests/test_hsm_security_metrics.cpp'
      - 'tests/test_hsm_provider.cpp'
      - 'tests/test_usb_admin_authenticator.cpp'
      - 'tests/test_usb_volume_hardening.cpp'
      - 'fuzz/harnesses/jwt_rbac_config_harness.cpp'
      - 'fuzz/corpus/jwt/**'
      - 'fuzz/corpus/rbac/**'
      - '.github/workflows/05-quality_security_security-hardening-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs
# ─────────────────────────────────────────────────────────────────────────────
jobs:

  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Negative security tests across MINIMAL / COMMUNITY / ENTERPRISE editions
  # ───────────────────────────────────────────────────────────────────────────
  security-negative-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_security_changes == 'true'
    name: Security negative tests (${{ matrix.edition }} / ${{ matrix.compiler }})
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      HSM_TEST_FILTER: "HSMStubGatingTest*:HSMStartupIntegrationTest*:HSMSecurityCheckerTest*:HSMSecurityMetricsTest*:HSMProviderTest*"

    strategy:
      fail-fast: false
      matrix:
        include:
          # COMMUNITY edition – GCC 12 (default edition)
          # NOTE: MINIMAL edition forces THEMIS_BUILD_TESTS=OFF, so security
          #       tests are not applicable; use the 'edition-build-check' job
          #       below to verify MINIMAL compiles correctly.
          - edition: COMMUNITY
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          # COMMUNITY edition – Clang 15
          - edition: COMMUNITY
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          # ENTERPRISE edition – GCC 12
          - edition: ENTERPRISE
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev nlohmann-json3-dev librocksdb-dev libfmt-dev

      - name: Configure and build (${{ matrix.edition }})
        uses: ./.github/actions/configure-themis
        with:
          cc:      ${{ matrix.cc }}
          cxx:     ${{ matrix.cxx }}
          edition: ${{ matrix.edition }}

      # ── Negative integration tests (required for merge) ──────────────────
      - name: Run JWT negative tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="JWTNegativeTest*:JWTValidationTest*:JWTValidatorTest*:KidRevocationTest*" \
            --gtest_output="xml:jwt_negative_results.xml" \
            2>&1 | tee jwt_negative_output.txt

      - name: Run RBAC negative tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="RBACNegativeTest*:RBACTest*:PermissionTest*:RBACBuiltinRolesTest*:RBACInheritanceTest*:RBACThreadSafetyTest*:RBACSerializationTest*" \
            --gtest_output="xml:rbac_negative_results.xml" \
            2>&1 | tee rbac_negative_output.txt

      - name: Run Vault negative tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="VaultNegativeTest*:VaultSigningProviderErrorTest*" \
            --gtest_output="xml:vault_negative_results.xml" \
            2>&1 | tee vault_negative_output.txt

      - name: Run HSM stub gating and security tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="${HSM_TEST_FILTER}" \
            --gtest_output="xml:hsm_security_results.xml" \
            2>&1 | tee hsm_security_output.txt

      - name: Run USB volume hardening tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="USBVolumeHardeningTest*:USBAdminHardeningIntegrationTest*:USBAdminAuthenticatorTest*:USBChallengeResponseTest*" \
            --gtest_output="xml:usb_hardening_results.xml" \
            2>&1 | tee usb_hardening_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-negative-results-${{ matrix.edition }}-${{ matrix.compiler }}
          path: |
            build/*_negative_results.xml
            build/*_negative_output.txt
            build/hsm_security_results.xml
            build/hsm_security_output.txt
            build/usb_hardening_results.xml
            build/usb_hardening_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔐 Security Hardening CI – Negative Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Edition** | \`${{ matrix.edition }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Security tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- JWT negative tests (invalid tokens, KID revocation)" >> "$GITHUB_STEP_SUMMARY"
          echo "- RBAC negative tests (permission violations, inheritance, serialization)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Vault signing provider error tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- HSM stub gating tests (production mode fail-fast, environment detection)" >> "$GITHUB_STEP_SUMMARY"
          echo "- HSM startup integration tests (production safety validation)" >> "$GITHUB_STEP_SUMMARY"
          echo "- HSM security checker and metrics tests" >> "$GITHUB_STEP_SUMMARY"
          echo "- USB volume hardening tests (FAT-tamper detection, RO-mount, serial binding)" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 2. AddressSanitizer + UndefinedBehaviorSanitizer
  # ───────────────────────────────────────────────────────────────────────────
  sanitizer-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_security_changes == 'true'
    name: Sanitizer tests (ASan + UBSan)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      CC:  clang-15
      CXX: clang++-15
      HSM_TEST_FILTER: "HSMStubGatingTest*:HSMStartupIntegrationTest*:HSMSecurityCheckerTest*:HSMSecurityMetricsTest*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             gcc-12
          cxx:            g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev nlohmann-json3-dev clang-15 clang++-15 librocksdb-dev libfmt-dev

      - name: Configure and build (ASan + UBSan)
        uses: ./.github/actions/configure-themis
        with:
          cc:                clang-15
          cxx:               clang++-15
          enable-sanitizers: 'true'

      - name: Run security tests under sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: |
          SECURITY_FILTER="\
            JWTNegativeTest*:\
            JWTValidationTest*:\
            JWTValidatorTest*:\
            KidRevocationTest*:\
            RBACNegativeTest*:\
            RBACTest*:\
            PermissionTest*:\
            RBACBuiltinRolesTest*:\
            VaultNegativeTest*:\
            VaultSigningProviderErrorTest*:\
            ${HSM_TEST_FILTER}"
          cd build
          ./tests/themis_tests \
            --gtest_filter="${SECURITY_FILTER}" \
            --gtest_output="xml:sanitizer_results.xml" \
            2>&1 | tee sanitizer_output.txt

      - name: Upload sanitizer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-results
          path: |
            build/sanitizer_results.xml
            build/sanitizer_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🧪 Security Hardening CI – Sanitizer Tests (ASan + UBSan)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`clang-15\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Sanitizers** | AddressSanitizer + UndefinedBehaviorSanitizer |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "JWT, RBAC, and Vault security tests run under ASan + UBSan to detect memory and UB errors." >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Edition build check: verify all three editions compile without errors
  #    MINIMAL is included here because it disables THEMIS_BUILD_TESTS, so the
  #    security-negative-tests job cannot run against it; a compile-only check
  #    is sufficient to verify the MINIMAL edition doesn't regress on security
  #    source changes.
  # ───────────────────────────────────────────────────────────────────────────
  edition-build-check:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_security_changes == 'true'
    name: Edition compile check (${{ matrix.edition }})
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        edition: [MINIMAL, COMMUNITY, ENTERPRISE]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             gcc-12
          cxx:            g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev nlohmann-json3-dev librocksdb-dev libfmt-dev

      - name: Configure and build themis_core (${{ matrix.edition }})
        uses: ./.github/actions/configure-themis
        with:
          cc:           gcc-12
          cxx:          g++-12
          edition:      ${{ matrix.edition }}
          build-tests:  'OFF'
          build-target: 'themis_core'

      - name: Write job summary
        if: always()
        run: |
          echo "## 🏗️ Security Hardening CI – Edition Compile Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Edition** | \`${{ matrix.edition }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`gcc-12\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Compile-only check for \`themis_core\` target (no test binary). Validates all editions build cleanly with security sources." >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Static analysis with clang-tidy
  # ───────────────────────────────────────────────────────────────────────────
  static-analysis:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_security_changes == 'true'
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             clang-15
          cxx:            clang++-15
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev nlohmann-json3-dev clang-tidy-15 librocksdb-dev libfmt-dev

      - name: Configure (generate compile_commands.json)
        uses: ./.github/actions/configure-themis
        with:
          cc:               clang-15
          cxx:              clang++-15
          extra-cmake-flags: '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON'
          build-target:     ''

      - name: Run clang-tidy on security sources
        run: |
          set -o pipefail
          # Security-critical source files to analyse
          SECURITY_SOURCES=(
            src/auth/jwt_validator.cpp
            src/auth/jwks_security.cpp
            src/auth/jwt_key_rotation_manager.cpp
            src/security/rbac.cpp
            src/security/vault_key_provider.cpp
            src/security/vault_signing_provider.cpp
            src/server/auth_middleware.cpp
            src/server/api_auth_config.cpp
            src/server/api_security_audit.cpp
          )

          TIDY_FLAGS="-p build --config-file=.clang-tidy"

          for src in "${SECURITY_SOURCES[@]}"; do
            if [ -f "$src" ]; then
              echo "==> Analysing $src"
              clang-tidy-15 $TIDY_FLAGS "$src" 2>&1 | tee -a clang_tidy_output.txt
            else
              echo "SKIP (not found): $src"
            fi
          done

          # Hard-fail on clang-tidy errors; emit advisory warnings for warnings.
          if grep -q ": error:" clang_tidy_output.txt 2>/dev/null; then
            echo "::error::clang-tidy reported errors in security sources – see artifact clang-tidy-report"
            exit 1
          fi
          if grep -q ": warning:" clang_tidy_output.txt 2>/dev/null; then
            echo "::warning::clang-tidy reported warnings in security sources – review artifact clang-tidy-report"
          fi

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang_tidy_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔍 Security Hardening CI – Static Analysis (clang-tidy)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tool** | clang-tidy-15 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Sources analysed" >> "$GITHUB_STEP_SUMMARY"
          echo "jwt_validator, jwks_security, jwt_key_rotation_manager, rbac, vault_key_provider, vault_signing_provider, auth_middleware, api_auth_config, api_security_audit" >> "$GITHUB_STEP_SUMMARY"
          if [ -f clang_tidy_output.txt ]; then
            ERRORS=$(grep -c ": error:" clang_tidy_output.txt 2>/dev/null || echo 0)
            WARNINGS=$(grep -c ": warning:" clang_tidy_output.txt 2>/dev/null || echo 0)
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Errors | Warnings |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|----------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| ${ERRORS} | ${WARNINGS} |" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Fuzz smoke-test (libFuzzer, short time limit suitable for CI)
  # ───────────────────────────────────────────────────────────────────────────
  fuzz-smoke-test:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_security_changes == 'true'
    name: Fuzz smoke test (JWT + RBAC config)
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-15 clang++-15 \
            libssl-dev libcurl4-openssl-dev \
            nlohmann-json3-dev \
            pkg-config git

      - name: Build JWT/RBAC fuzz harness with libFuzzer
        run: |
          clang++-15 -std=c++20 \
            -fsanitize=address,undefined,fuzzer \
            -fno-omit-frame-pointer \
            -O1 -g \
            -I include \
            -o fuzz_jwt_rbac \
            fuzz/harnesses/jwt_rbac_config_harness.cpp
          echo "Fuzz harness built successfully"

      - name: Run JWT fuzz corpus smoke-test (30 s)
        run: |
          # -max_total_time limits each run to 30 seconds – enough to catch
          # obvious crashes without holding the CI runner for long.
          ./fuzz_jwt_rbac \
            -max_total_time=30 \
            -max_len=4096 \
            -print_final_stats=1 \
            fuzz/corpus/jwt/ \
            2>&1 | tee fuzz_jwt_output.txt || {
              echo "::error::libFuzzer found a crash in JWT parsing – see artifact fuzz-smoke-results for crash-* files"
              exit 1
            }

      - name: Run RBAC fuzz corpus smoke-test (30 s)
        run: |
          ./fuzz_jwt_rbac \
            -max_total_time=30 \
            -max_len=4096 \
            -print_final_stats=1 \
            fuzz/corpus/rbac/ \
            fuzz/corpus/policy_engine/ \
            2>&1 | tee fuzz_rbac_output.txt || {
              echo "::error::libFuzzer found a crash in RBAC config parsing – see artifact fuzz-smoke-results for crash-* files"
              exit 1
            }

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-results
          path: |
            fuzz_jwt_output.txt
            fuzz_rbac_output.txt
            # Any crash/timeout/OOM artifacts generated by libFuzzer
            crash-*
            timeout-*
            oom-*
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔥 Security Hardening CI – Fuzz Smoke Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Fuzzer** | libFuzzer (clang-15, ASan+UBSan) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Max time per corpus** | 30 s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Max input length** | 4096 bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Fuzz corpora: \`fuzz/corpus/jwt/\`, \`fuzz/corpus/rbac/\`, \`fuzz/corpus/policy_engine/\`" >> "$GITHUB_STEP_SUMMARY"
