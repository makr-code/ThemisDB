name: Release Binary Build

on:
  push:
    tags:
      - v*
      - enterprise-v*
      - hyperscaler-v*
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag or branch)
        required: true
        default: develop
        type: string
      edition:
        description: Edition
        required: true
        default: COMMUNITY
        type: choice
        options:
          - MINIMAL
          - COMMUNITY
          - ENTERPRISE
          - MILITARY
          - HYPERSCALER

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Initialize llama.cpp submodule
        run: git submodule update --init --depth=1 llama.cpp

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: gcc-12
          cxx: g++-12
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev libsimdjson-dev libsnappy-dev

      - name: Resolve edition
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "edition=${{ github.event.inputs.edition }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == enterprise-v* ]]; then
            echo "edition=ENTERPRISE" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" == hyperscaler-v* ]]; then
            echo "edition=HYPERSCALER" >> "$GITHUB_OUTPUT"
          else
            echo "edition=COMMUNITY" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure and build server binary
        uses: ./.github/actions/configure-themis
        with:
          cc: gcc-12
          cxx: g++-12
          build-type: Release
          edition: ${{ steps.vars.outputs.edition }}
          ci-mode: "true"
          build-target: themis_server
          source-dir: .

      - name: Build documentation database bundle
        run: cmake --build build --target docs_database -- -j$(nproc)

      - name: Prepare mini llama.cpp model
        run: |
          python3 scripts/prepare_release_mini_llm.py \
            --output-dir "out/themis-${{ steps.vars.outputs.edition }}-linux-x64/models"

      - name: Package release bundle
        run: |
          bundle_dir="out/themis-${{ steps.vars.outputs.edition }}-linux-x64"
          mkdir -p "$bundle_dir/bin" "$bundle_dir/data"
          cp build/bin/themis_server "$bundle_dir/bin/themis_server"
          if [ -f build/data/docs.db ]; then
            cp build/data/docs.db "$bundle_dir/data/docs.db"
          fi
          if [ -f build/data/docs_database.json ]; then
            cp build/data/docs_database.json "$bundle_dir/data/docs_database.json"
          fi
          tar -C out -czf "out/themis-${{ steps.vars.outputs.edition }}-linux-x64.tar.gz" "themis-${{ steps.vars.outputs.edition }}-linux-x64"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: themis-binary-${{ steps.vars.outputs.edition }}-linux-x64
          path: |
            out/themis-${{ steps.vars.outputs.edition }}-linux-x64
            out/themis-${{ steps.vars.outputs.edition }}-linux-x64.tar.gz
          retention-days: 14
