name: Validate AI-Guardrails

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/COPILOT_INSTRUCTIONS.md'
      - '.github/copilot/**'
      - '.github/scripts/validate_copilot_refs.py'
      - '.github/workflows/validate-ai-guardrails.yml'
  pull_request:
    paths:
      - '.github/COPILOT_INSTRUCTIONS.md'
      - '.github/copilot/**'
      - '.github/scripts/validate_copilot_refs.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-scope-classifier:
    permissions: {}
    uses: ./.github/workflows/ci-scope-classifier.yml

  validate-copilot-instructions:
    needs: ci-scope-classifier
    if: >
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_config_changes == 'true'
    name: Validate Copilot Instructions
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate file references
        run: |
          python .github/scripts/validate_copilot_refs.py
      
      - name: Check file size
        run: |
          MAIN_FILE=".github/COPILOT_INSTRUCTIONS.md"
          LINE_COUNT=$(wc -l < "$MAIN_FILE")
          echo "Main file has $LINE_COUNT lines"
          
          if [ "$LINE_COUNT" -gt 300 ]; then
            echo "❌ Error: Main COPILOT_INSTRUCTIONS.md is too large ($LINE_COUNT lines)"
            echo "Target is under 200 lines. Consider moving content to module files."
            exit 1
          else
            echo "✅ File size check passed ($LINE_COUNT/300 lines)"
          fi
      
      - name: Check for broken links
        run: |
          echo "Checking for broken internal links..."
          
          # Check all markdown files in .github
          find .github -name "*.md" -not -path "*/.git/*" | while read -r file; do
            echo "Checking $file..."
            
            # Extract markdown links [text](path)
            grep -oP '\[([^\]]+)\]\(([^)]+)\)' "$file" || true | while read -r link; do
              path=$(echo "$link" | grep -oP '\]\(\K[^)]+')
              
              # Skip external links
              if [[ "$path" =~ ^https?:// ]] || [[ "$path" =~ ^mailto: ]] || [[ "$path" =~ ^# ]]; then
                continue
              fi
              
              # Remove anchors
              clean_path="${path%%#*}"
              
              if [ -n "$clean_path" ]; then
                # Resolve relative to file's directory
                dir=$(dirname "$file")
                full_path="$dir/$clean_path"
                
                if [ ! -f "$full_path" ] && [ ! -d "$full_path" ]; then
                  echo "❌ Broken link in $file: $path"
                  exit 1
                fi
              fi
            done
          done
          
          echo "✅ No broken links found"
  
  lint-markdown:
    needs: ci-scope-classifier
    if: >
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_config_changes == 'true'
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run markdownlint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .github/*.md .github/copilot/*.md
          config_file: .markdownlint.json
          ignore_files: .github/COPILOT_INSTRUCTIONS.md.backup
        continue-on-error: true
  
  check-structure:
    needs: ci-scope-classifier
    if: >
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_config_changes == 'true'
    name: Check Module Structure
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify required modules exist
        run: |
          echo "Checking for required Copilot modules..."
          
          REQUIRED_MODULES=(
            "BRANCHING_GUIDE.md"
            "BUILD_GUIDE.md"
            "CODE_STANDARDS.md"
            "TESTING_GUIDE.md"
            "CROSS_COMPILATION_CONTEXT.md"
            "VSCODE_CONTEXT.md"
          )
          
          missing_count=0
          for module in "${REQUIRED_MODULES[@]}"; do
            if [ ! -f ".github/copilot/$module" ]; then
              echo "❌ Missing required module: $module"
              missing_count=$((missing_count + 1))
            else
              echo "✅ Found: $module"
            fi
          done
          
          if [ $missing_count -gt 0 ]; then
            echo ""
            echo "❌ Error: $missing_count required module(s) missing"
            exit 1
          fi
          
          echo ""
          echo "✅ All required modules present"
