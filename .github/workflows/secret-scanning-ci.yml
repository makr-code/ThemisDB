name: Secret Scanning CI

# Runs on every push and pull-request to catch secrets before they are merged.
# Combines three complementary scanners:
#   1. Gitleaks  – git history + staged content, regex rules (.gitleaks.toml)
#   2. detect-secrets – keyword + entropy detector (.secrets.baseline)
#   3. secret_scan.py – ThemisDB entropy scanner (Shannon ≥ 4.5 bits/char)
#
# All three jobs must pass for the check suite to go green.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Gitleaks – git-history and diff secret scan
  # ───────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: false

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔐 Secret Scanning – Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Config** | \`.gitleaks.toml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 2. detect-secrets – keyword + entropy baseline check
  # ───────────────────────────────────────────────────────────────────────────
  detect-secrets:
    name: detect-secrets baseline audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.4.0

      - name: Audit against baseline
        run: |
          detect-secrets audit --report --only-allowlisted .secrets.baseline || true
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files '^(vcpkg/|vcpkg_installed/|build.*/|\.git/|llama\.cpp/|releases/)' \
            > /tmp/new_baseline.json
          # Diff: fail if new secrets were found beyond the committed baseline
          python3 - << 'PYEOF'
          import json, sys

          with open(".secrets.baseline") as f:
              baseline = json.load(f)
          with open("/tmp/new_baseline.json") as f:
              current = json.load(f)

          baseline_keys = set(baseline.get("results", {}).keys())
          current_keys  = set(current.get("results", {}).keys())
          new_files = current_keys - baseline_keys

          new_findings = {}
          for fname in current_keys:
              cur_secrets = current["results"].get(fname, [])
              base_secrets = baseline["results"].get(fname, [])
              # Compare by (line_number, type) tuple
              base_set = {(s["line_number"], s["type"]) for s in base_secrets}
              new_set  = {(s["line_number"], s["type"]) for s in cur_secrets}
              extra = new_set - base_set
              if extra:
                  new_findings[fname] = list(extra)

          if new_findings:
              print("::error::detect-secrets found new secrets not in baseline:")
              for fname, locs in new_findings.items():
                  for line_no, stype in locs:
                      print(f"  {fname}:{line_no} [{stype}]")
              print()
              print("Run 'detect-secrets scan > .secrets.baseline' locally, review")
              print("and commit the updated baseline if findings are false positives.")
              sys.exit(1)

          print(f"OK – no new secrets beyond baseline ({len(baseline.get('results', {}))} file(s) in baseline).")
          PYEOF

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔐 Secret Scanning – detect-secrets" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Baseline** | \`.secrets.baseline\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 3. ThemisDB entropy + pattern scanner (secret_scan.py)
  # ───────────────────────────────────────────────────────────────────────────
  entropy-scan:
    name: Entropy and pattern scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run entropy scanner on all tracked files
        run: |
          python3 scripts/secret_scan.py --all \
            --allowlist .secret-scan-allowlist.txt
        # Exit code 1 → findings present → CI fails.
        # Exit code 2 → configuration/runtime error.

      - name: Upload scan report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: entropy-scan-findings
          path: /tmp/secret-scan-*.txt
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔐 Secret Scanning – Entropy + Pattern Scanner" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/secret_scan.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Entropy threshold** | ≥ 4.5 bits/char (truffleHog / detect-secrets default) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Allow-list** | \`.secret-scan-allowlist.txt\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Scans all tracked files for Shannon entropy ≥ 4.5 bits/char and known" >> "$GITHUB_STEP_SUMMARY"
          echo "secret patterns (AWS keys, GitHub tokens, JWT secrets, DB connection" >> "$GITHUB_STEP_SUMMARY"
          echo "strings, PEM private keys, Slack/Stripe/SendGrid tokens, and more)." >> "$GITHUB_STEP_SUMMARY"
