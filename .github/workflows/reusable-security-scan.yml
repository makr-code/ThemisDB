name: 'Reusable Security Scan'

on:
  workflow_call:
    inputs:
      scanner-type:
        description: 'Scanner type (codeql, trivy, gitleaks, cppcheck, all)'
        required: false
        type: string
        default: 'all'
      target-path:
        description: 'Path to scan'
        required: false
        type: string
        default: '.'
      upload-sarif:
        description: 'Upload SARIF to GitHub Security'
        required: false
        type: boolean
        default: true
      create-issues:
        description: 'Create GitHub issues for findings'
        required: false
        type: boolean
        default: false
      severity-threshold:
        description: 'Minimum severity (low, medium, high, critical)'
        required: false
        type: string
        default: 'medium'
    outputs:
      scan-status:
        description: 'Scan status'
        value: ${{ jobs.scan.outputs.status }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: Security Scan (${{ inputs.scanner-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      status: ${{ steps.scan-result.outputs.status }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks - Secret Scanning
      - name: Run Gitleaks
        if: inputs.scanner-type == 'gitleaks' || inputs.scanner-type == 'all'
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Upload Gitleaks report
        if: always() && (inputs.scanner-type == 'gitleaks' || inputs.scanner-type == 'all')
        uses: ./.github/actions/security-report
        with:
          sarif-path: results.sarif
          category: 'gitleaks'
          artifact-name: 'gitleaks-report'
        continue-on-error: true

      # Trivy - Vulnerability Scanning
      - name: Install Trivy
        if: inputs.scanner-type == 'trivy' || inputs.scanner-type == 'all'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy vulnerability scan
        if: inputs.scanner-type == 'trivy' || inputs.scanner-type == 'all'
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy-report.sarif \
            --severity HIGH,CRITICAL \
            ${{ inputs.target-path }} || true

      - name: Upload Trivy report
        if: always() && (inputs.scanner-type == 'trivy' || inputs.scanner-type == 'all')
        uses: ./.github/actions/security-report
        with:
          sarif-path: trivy-report.sarif
          category: 'trivy'
          artifact-name: 'trivy-report'
        continue-on-error: true

      # cppcheck - C++ Static Analysis
      - name: Install cppcheck
        if: inputs.scanner-type == 'cppcheck' || inputs.scanner-type == 'all'
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        if: inputs.scanner-type == 'cppcheck' || inputs.scanner-type == 'all'
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --inline-suppr \
            --error-exitcode=0 \
            --xml --xml-version=2 \
            --output-file=cppcheck-report.xml \
            src/ include/ 2>&1 | tee cppcheck-output.txt || true

      - name: Upload cppcheck report
        if: always() && (inputs.scanner-type == 'cppcheck' || inputs.scanner-type == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-report
          path: |
            cppcheck-report.xml
            cppcheck-output.txt
          retention-days: 30
        continue-on-error: true

      # CodeQL Analysis
      - name: Initialize CodeQL
        if: inputs.scanner-type == 'codeql' || inputs.scanner-type == 'all'
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: +security-extended,security-and-quality

      - name: Autobuild
        if: inputs.scanner-type == 'codeql' || inputs.scanner-type == 'all'
        uses: github/codeql-action/autobuild@v3
        continue-on-error: true

      - name: Perform CodeQL Analysis
        if: inputs.scanner-type == 'codeql' || inputs.scanner-type == 'all'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
        continue-on-error: true

      - name: Security scan summary
        if: always()
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scanner:** ${{ inputs.scanner-type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ inputs.target-path }}" >> $GITHUB_STEP_SUMMARY
          echo "**Threshold:** ${{ inputs.severity-threshold }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Reports available in Security tab and artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Set scan result
        id: scan-result
        if: always()
        run: |
          echo "status=success" >> $GITHUB_OUTPUT
