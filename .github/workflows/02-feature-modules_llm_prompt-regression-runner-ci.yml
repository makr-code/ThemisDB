name: Prompt Engineering – Prompt Regression Runner CI

# Validates PromptRegressionRunner, RegressionFixture, RegressionConfig,
# RegressionResult, FixtureDelta, and FeedbackCollector integration
# (Phase 5, item 2 — v1.8.0).
# roadmap:prompt_engineering:v1.8.0:prompt-regression-runner
#
# Acceptance criteria covered:
#   AC-1  to AC-7   Construction, fixture management, inconclusive cases
#   AC-8  to AC-14  Score computation, regression detection, block gate
#   AC-15 to AC-20  FixtureDelta counts, mean arithmetic, toJson keys
#   AC-21 to AC-27  JSON round-trip, log callback, FeedbackCollector integration
#   AC-28 to AC-30  setRunConfig, independent runs, valid-run check

on:
  workflow_run:
    workflows: ["🚦 Post-Merge Smoke Test"]
    types: [completed]
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/prompt_engineering/prompt_regression_runner.h'
      - 'src/prompt_engineering/prompt_regression_runner.cpp'
      - 'tests/test_prompt_regression_runner.cpp'
      - 'tests/CMakeLists.txt'
      - 'cmake/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_prompt-regression-runner-ci.yml'
  workflow_dispatch:

concurrency:
  group: prompt-regression-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  prompt-regression-runner-tests:
    needs: ci-scope-classifier
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule') ||
      needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: PromptRegressionRunner (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            librocksdb-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_prompt_regression_runner_focused

      - name: Run PromptRegressionRunnerFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R PromptRegressionRunnerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee regression_runner_ctest.txt

      - name: Run tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_prompt_regression_runner_focused \
            --gtest_output="xml:regression_runner_gtest.xml" \
            2>&1 | tee regression_runner_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-runner-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/regression_runner_ctest.txt
            build/regression_runner_gtest.xml
            build/regression_runner_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 📉 Prompt Engineering – Prompt Regression Runner" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Acceptance Criterion | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-1:  Default construction | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-2:  fixtureCount starts at 0 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-3:  setFixtures replaces all fixtures | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-4:  clearFixtures empties fixture set | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-5:  run() 0 fixtures → inconclusive | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-6:  mismatched output sizes → inconclusive | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-7:  below min_fixtures → inconclusive | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-8:  identical outputs → delta_pct==0 | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-9:  improved candidate → positive delta | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-10: regressed candidate → negative delta | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-11: is_regression=true on big drop | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-12: is_regression=false within tolerance | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-13: blocked=true when regression + flag | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-14: blocked=false when flag disabled | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-15: fixture_deltas count matches fixtures | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-16: FixtureDelta.delta = candidate - baseline | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-17: mean_baseline arithmetic mean | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-18: mean_candidate arithmetic mean | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-19: delta_pct formula verified | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-20: RegressionResult::toJson() all keys | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-21: RegressionFixture JSON round-trip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-22: log callback invoked once per run | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-23: log callback correct fields | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-24: throwing log callback does not abort | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-25: loadFeedbackFixtures imports positive entries | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-26: loadFeedbackFixtures appends | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-27: loadFeedbackFixtures respects limit | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-28: setRunConfig updates config | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-29: multiple run() calls independent | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AC-30: valid run not inconclusive | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
