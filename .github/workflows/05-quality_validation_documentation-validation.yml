name: Documentation Validation

on:
  # Called exclusively by docs_docs-pipeline.yml as Stage 1 (validate).
  # All push/PR events are funnelled through docs_docs-pipeline.yml so this
  # workflow has no direct push/PR triggers, preventing duplicate runs.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-lint:
    name: Documentation Linting
    runs-on: ubuntu-latest

    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run documentation linter
        run: python3 scripts/docs-lint.py

      - name: Generate lint report (JSON)
        if: always()
        run: python3 scripts/docs-lint.py --format json --output /tmp/lint-report.json
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: /tmp/lint-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          echo "## 📝 Documentation Linting" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/docs-lint.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  link-check:
    name: Link Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run link checker (internal links only)
        run: python3 scripts/link-check.py --internal-only

      - name: Generate link report (JSON)
        if: always()
        run: python3 scripts/link-check.py --internal-only --format json --output /tmp/link-report.json
        continue-on-error: true

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: /tmp/link-report.json
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔗 Link Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/link-check.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Scope** | Internal links only |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  external-link-check:
    name: External Link Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run link checker (all links)
        run: python3 scripts/link-check.py
        continue-on-error: true

      - name: Generate external link report (JSON)
        if: always()
        run: python3 scripts/link-check.py --format json --output /tmp/external-link-report.json
        continue-on-error: true

      - name: Upload external link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: /tmp/external-link-report.json
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## 🌐 External Link Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/link-check.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Scope** | All links (internal + external) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  toc-validation:
    name: TOC Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run TOC validator
        run: python3 scripts/toc-check.py

      - name: Generate TOC report (JSON)
        if: always()
        run: python3 scripts/toc-check.py --format json --output /tmp/toc-report.json
        continue-on-error: true

      - name: Upload TOC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toc-report
          path: /tmp/toc-report.json
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          echo "## 📚 TOC Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/toc-check.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Config** | \`mkdocs.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  metadata-check:
    name: Doc Metadata Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check doc metadata (Secondary Docs)
        run: |
          python3 scripts/docs-lint.py \
            --check-metadata \
            --metadata-paths \
              docs/de/development/DOC_METADATA.md \
              docs/de/development/README.md \
              docs/de/development/developers.md

      - name: Generate metadata report (JSON)
        if: always()
        run: |
          python3 scripts/docs-lint.py \
            --check-metadata \
            --metadata-paths \
              docs/de/development/DOC_METADATA.md \
              docs/de/development/README.md \
              docs/de/development/developers.md \
            --format json --output /tmp/metadata-report.json
        continue-on-error: true

      - name: Upload metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-report
          path: /tmp/metadata-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          echo "## 🏷️ Doc Metadata Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/docs-lint.py --check-metadata\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Scope** | Secondary Docs (docs/de/development) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  doc-header-check:
    name: Doc Header Check (changed-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run doc header check (changed-only)
        run: python3 scripts/doc-header-check.py --mode changed-only --base-ref origin/develop

      - name: Generate header check report (JSON)
        if: always()
        run: |
          python3 scripts/doc-header-check.py \
            --mode changed-only \
            --base-ref origin/develop \
            --format json > /tmp/header-report.json || true
        continue-on-error: true

      - name: Upload header report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: header-check-report
          path: /tmp/header-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          echo "## 📋 Doc Header Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/doc-header-check.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Mode** | changed-only |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Base ref** | origin/develop |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Schema** | \`docs/_standards/doc_header.schema.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

  drift-detection:
    name: Drift Detection (Primary → Secondary)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write    # needed to create drift-warning issues
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run drift detector
        id: drift_text
        run: |
          python3 scripts/drift-detector.py \
            --format text \
            --output /tmp/drift-report.txt
        continue-on-error: true

      - name: Generate drift report (JSON)
        id: drift_json
        if: always()
        run: |
          python3 scripts/drift-detector.py \
            --format json \
            --output /tmp/drift-report.json
        continue-on-error: true

      - name: Create issues for drifting / stale docs
        # Only create issues on the develop branch to avoid noise from PRs.
        # Only runs when the JSON report was successfully generated.
        if: >
          always() &&
          steps.drift_json.outcome == 'success' &&
          github.ref == 'refs/heads/develop' &&
          github.event_name != 'pull_request'
        run: |
          python3 tools/ci/module_docs_issue_reporter.py \
            --report /tmp/drift-report.json \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: /tmp/drift-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Drift Detection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/drift-detector.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Primary Index** | \`docs/_generated/primary_index.json\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Drifting threshold** | 90 days |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Stale threshold** | 180 days |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Issue creation** | on \`develop\` push only |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/drift-report.txt ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Drift Summary:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            head -10 /tmp/drift-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [docs-lint, link-check, toc-validation, metadata-check]
    if: always()

    permissions:
      contents: read

    steps:
      - name: Check job results
        run: |
          LINT="${{ needs.docs-lint.result }}"
          LINK="${{ needs.link-check.result }}"
          TOC="${{ needs.toc-validation.result }}"
          META="${{ needs.metadata-check.result }}"

          echo "## ✅ Documentation Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          [[ "$LINT" == "success" ]] && LINT_ICON="✅" || LINT_ICON="❌"
          [[ "$LINK" == "success" ]] && LINK_ICON="✅" || LINK_ICON="❌"
          [[ "$TOC"  == "success" ]] && TOC_ICON="✅"  || TOC_ICON="❌"
          [[ "$META" == "success" ]] && META_ICON="✅"  || META_ICON="❌"

          echo "| Documentation Linting | ${LINT_ICON} ${LINT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Link Validation       | ${LINK_ICON} ${LINK} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TOC Validation        | ${TOC_ICON} ${TOC} |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| Doc Metadata Check    | ${META_ICON} ${META} |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$LINT" != "success" || "$LINK" != "success" || "$TOC" != "success" || "$META" != "success" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ One or more required documentation checks failed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All required documentation checks passed." >> "$GITHUB_STEP_SUMMARY"
