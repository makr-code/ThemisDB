name: "Release: Docker Image Consumer"

# Downstream delivery workflow. This workflow does not create the canonical release package.
# Source of truth for release artifacts remains release-mainline.yml + release-build-matrix.yml.
# Docker publication consumes the release identity and tags derived from the final Git tag,
# not a parallel artifact build path.
#
# Rechenaufwand-Score: R=5 (K=6, L=5, N=5) | last-calibrated: 2026-08-25
# Trigger policy: repo framework score calibration for workflow cost controls.
# Security hardening (2026-08-11):
#   - Explicit least-privilege permissions at workflow and job level.
#   - OIDC-based secret-less login replaces long-lived DOCKERHUB_TOKEN PAT
#     for ghcr.io; Docker Hub still uses token until OIDC federation is set up.
#   - SLSA Level 2 build provenance attestation via actions/attest-build-provenance.
#   - Docker layer cache via GitHub Actions cache backend (no external registry required).

on:
  workflow_call:
    inputs:
      push_to_registry:
        description: "Push built images to Docker registry"
        required: false
        default: true
        type: boolean
      registry:
        description: "Docker registry to push to"
        required: false
        default: "ghcr.io"
        type: string
      tag_name:
        description: "Optional release tag; if omitted, VERSION and RELEASE_TYPE files are used"
        required: false
        default: ""
        type: string
      include_tinyllama:
        description: "Include an LLM model in the Docker image (default: TinyLlama)"
        required: false
        default: true
        type: boolean
      llm_model:
        description: "Model preset: tinyllama, qwen2.5-coder-7b-instruct, llama-3.2-3b-instruct, or custom"
        required: false
        default: "tinyllama"
        type: string
      llm_model_url:
        description: "Optional direct model URL for a custom GGUF override"
        required: false
        default: ""
        type: string
      llm_model_file:
        description: "Optional cache filename for the selected GGUF model"
        required: false
        default: ""
        type: string
      tinyllama_force_download:
        description: "Force a fresh download of the selected model during Docker build"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: "Push built images to Docker registry"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      registry:
        description: "Docker registry to push to"
        required: false
        default: "ghcr.io"
        type: choice
        options:
          - "ghcr.io"
          - "docker.io"
          - "both"
      tag_name:
        description: "Optional release tag (e.g. v2.4.0-alpha); if omitted, VERSION and RELEASE_TYPE files are used"
        required: false
        type: string
      include_tinyllama:
        description: "Include an LLM model in the image"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      llm_model:
        description: "LLM preset to include in the Docker image"
        required: false
        default: "tinyllama"
        type: choice
        options:
          - "tinyllama"
          - "qwen2.5-coder-7b-instruct"
          - "llama-3.2-3b-instruct"
          - "custom"
      llm_model_url:
        description: "Direct GGUF URL for custom model overrides"
        required: false
        default: ""
        type: string
      llm_model_file:
        description: "Optional GGUF filename for cache reuse"
        required: false
        default: ""
        type: string
      tinyllama_force_download:
        description: "Force a fresh download of the selected model during Docker build"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: docker-image-${{ github.workflow }}-${{ github.ref_type || 'ref' }}-${{ github.ref_name || github.sha }}-${{ inputs.registry || github.event.inputs.registry || 'ghcr.io' }}-${{ inputs.push_to_registry || github.event.inputs.push_to_registry || 'false' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

jobs:
  run-summary:
    name: "Validate: Run Summary"
    if: always()
    needs: [mark-release-pending, prepare-release-context, build-platforms, merge-image-manifest, finalize-release-status]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/write-run-summary
        with:
          scope: "Docker image build, manifest, and release status"
          job-results: ${{ toJSON(needs) }}

  mark-release-pending:
    name: "Release: Mark Docker Status"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name == 'release' || github.event_name == 'push'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set Docker release tracker pending label
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Release] Status tracker — docker-image'
          issue-marker: '<!-- release-docker:type:release-status -->'
          issue-body: |
            <!-- release-docker:type:release-status -->
            ## Release Status — `docker-image`

            Current status: **⏳ pending**

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.sha }}`

            _This issue tracks Docker image publication health for the connected release lane._
            _Labels: `status/release-pending` = release running; final state is applied after workflow completion._
          labels-to-add: 'status/release-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

  prepare-release-context:
    name: "Release: Prepare Docker Context"
    needs: mark-release-pending
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      edition: ${{ steps.version.outputs.edition }}
      release_type: ${{ steps.version.outputs.release_type }}
      tag_list: ${{ steps.tags.outputs.value }}
      push_requested: ${{ steps.push-policy.outputs.push_requested }}
      registry: ${{ steps.push-policy.outputs.registry }}
      include_tinyllama: ${{ steps.push-policy.outputs.include_tinyllama }}
      llm_model: ${{ steps.push-policy.outputs.llm_model }}
      llm_model_url: ${{ steps.push-policy.outputs.llm_model_url }}
      llm_model_file: ${{ steps.push-policy.outputs.llm_model_file }}
      tinyllama_force_download: ${{ steps.push-policy.outputs.tinyllama_force_download }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate canonical version contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/scripts/version-release-type-manager.sh
          bash .github/scripts/version-release-type-manager.sh validate

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          TAG_INPUT: ${{ inputs.tag_name || github.event.inputs.tag_name || '' }}
          PUSH_INPUT: ${{ inputs.push_to_registry }}
        run: |
          set -euo pipefail
          echo "──────────────────────────────────────────────"
          echo "  Version detection"
          RELEASE_TAG_NAME="$(jq -r '.release.tag_name // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null || true)"
          TAG_REGEX='^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?|enterprise-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?|hyperscaler-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?|military-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?|minimal-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$'
          SEMVER_REGEX='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'

          resolve_version_from_files() {
            local canonical_version
            local canonical_release_type
            local version_suffix

            canonical_version="$(bash .github/scripts/version-release-type-manager.sh read-version)"
            canonical_release_type="$(bash .github/scripts/version-release-type-manager.sh read-release-type)"
            CANONICAL_RELEASE_TYPE="${canonical_release_type}"

            case "${canonical_release_type}" in
              stable)
                if [[ "${canonical_version}" == *-* ]]; then
                  echo "::error::VERSION contains a prerelease suffix but RELEASE_TYPE is stable." >&2
                  exit 1
                fi
                VERSION="v${canonical_version}"
                ;;
              alpha|beta|rc)
                if [[ "${canonical_version}" == *-* ]]; then
                  version_suffix="${canonical_version#*-}"
                  if ! [[ "${version_suffix}" =~ ^${canonical_release_type}([0-9A-Za-z.-]*)?$ ]]; then
                    echo "::error::VERSION prerelease suffix does not match RELEASE_TYPE=${canonical_release_type}." >&2
                    exit 1
                  fi
                  VERSION="v${canonical_version}"
                else
                  VERSION="v${canonical_version}-${canonical_release_type}"
                fi
                ;;
              nightly)
                VERSION="v$(bash .github/scripts/version-release-type-manager.sh generate-nightly-version "${GITHUB_RUN_NUMBER}")"
                ;;
              *)
                echo "::error::Unsupported canonical RELEASE_TYPE: ${canonical_release_type}" >&2
                exit 1
                ;;
            esac
          }

          CANONICAL_RELEASE_TYPE=""
          if [[ -n "${TAG_INPUT}" ]]; then
            if [[ "${TAG_INPUT}" =~ ${SEMVER_REGEX} ]]; then
              TAG_INPUT="v${TAG_INPUT}"
            fi
            VERSION="${TAG_INPUT}"
          elif [[ "${GIT_REF}" == refs/tags/* ]]; then
            VERSION="${GIT_REF}"
            VERSION="${VERSION#refs/tags/}"
            echo "  Source   : git tag"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == "release" ]]; then
            VERSION="${RELEASE_TAG_NAME}"
            echo "  Source   : release event"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          else
            resolve_version_from_files
            echo "  Source   : canonical VERSION and RELEASE_TYPE files"
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          fi
          if ! [[ "${VERSION}" =~ ${TAG_REGEX} ]]; then
            echo "::error::Invalid release tag: ${VERSION}"; exit 1
          fi
          case "${VERSION}" in
            minimal-v*) EDITION=MINIMAL ;;
            v*) EDITION=COMMUNITY ;;
            *) echo "::error::Private-edition images require a provisioned private delivery pipeline."; exit 1 ;;
          esac
          if [[ -n "${TAG_INPUT}" || "${GIT_REF}" == refs/tags/* || "${EVENT_NAME}" == "release" || "${PUSH_INPUT}" == "true" ]]; then
            TAG_REF="refs/tags/${VERSION}"
            if ! git show-ref --verify --quiet "${TAG_REF}"; then
              echo "::error::Requested release tag '${VERSION}' does not exist in the checked-out repository; push the tag before starting Docker publication." >&2
              exit 1
            fi
            SOURCE_SHA="$(git rev-parse --verify "${TAG_REF}^{commit}")"
            git checkout --detach "${SOURCE_SHA}"
          else
            SOURCE_SHA="$(git rev-parse HEAD)"
          fi
          RELEASE_TYPE="${CANONICAL_RELEASE_TYPE:-stable}"
          if [[ -z "${CANONICAL_RELEASE_TYPE}" ]]; then
            BASE_VERSION="${VERSION#minimal-v}"
            BASE_VERSION="${BASE_VERSION#v}"
            case "${BASE_VERSION}" in
              *-nightly*) RELEASE_TYPE=nightly ;;
              *-alpha*) RELEASE_TYPE=alpha ;;
              *-beta*) RELEASE_TYPE=beta ;;
              *-rc*) RELEASE_TYPE=rc ;;
              *-*) echo "::error::Unsupported prerelease channel: ${VERSION}"; exit 1 ;;
            esac
          fi
          printf 'version=%s\nsource_sha=%s\nedition=%s\nrelease_type=%s\n' \
            "${VERSION}" "${SOURCE_SHA}" "${EDITION}" "${RELEASE_TYPE}" >> "${GITHUB_OUTPUT}"
          echo "  Version  : ${VERSION}"
          echo "──────────────────────────────────────────────"

      - name: Determine Docker tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          TARGET_REGISTRY_INPUT: ${{ inputs.registry || github.event.inputs.registry || '' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS=""
          RELEASE_TAG_REGEX='^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?|enterprise-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?|hyperscaler-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?|military-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?|minimal-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$'
          REPO_LC="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          GHCR_REPO="ghcr.io/${REPO_LC}"
          DOCKERHUB_REPO="themisdb/themisdb"
          TARGET_REGISTRY="${TARGET_REGISTRY_INPUT:-ghcr.io}"
          RELEASE_TYPE="${{ steps.version.outputs.release_type }}"
          RELEASE_TYPE="$(printf '%s' "${RELEASE_TYPE}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')"

          case "${RELEASE_TYPE}" in
            nightly|alpha|beta|rc|stable) ;;
            *)
              echo "::error::Invalid RELEASE_TYPE '${RELEASE_TYPE}' for Docker tag derivation. Expected one of: nightly, alpha, beta, rc, stable"
              exit 1
              ;;
          esac

          append_tag() {
            local candidate="$1"
            if [[ -z "${TAGS}" ]]; then
              TAGS="${candidate}"
            else
              TAGS="${TAGS},${candidate}"
            fi
          }

          normalize_version() {
            local v="$1"
            v="${v#v}"
            v="${v#enterprise-v}"
            v="${v#hyperscaler-v}"
            v="${v#military-v}"
            v="${v#minimal-v}"
            printf '%s' "${v}"
          }

          BASE_VERSION="$(normalize_version "${VERSION}")"
          IMAGE_PREFIX=""
          if [[ "${{ steps.version.outputs.edition }}" == "MINIMAL" ]]; then
            IMAGE_PREFIX="minimal-"
          fi
          BASE_VERSION="${IMAGE_PREFIX}${BASE_VERSION}"
          MINOR_VERSION="$(echo "${BASE_VERSION}" | cut -d. -f1-2)"
          TODAY="$(date -u +%Y%m%d)"

          if [[ "${VERSION}" =~ ${RELEASE_TAG_REGEX} ]]; then
            if [[ "${RELEASE_TYPE}" == "stable" ]]; then
              if [[ "${TARGET_REGISTRY}" == "docker.io" || "${TARGET_REGISTRY}" == "both" ]]; then
                append_tag "${DOCKERHUB_REPO}:${BASE_VERSION}"
                append_tag "${DOCKERHUB_REPO}:${MINOR_VERSION}"
                append_tag "${DOCKERHUB_REPO}:${IMAGE_PREFIX}latest"
              fi
              if [[ "${TARGET_REGISTRY}" == "ghcr.io" || "${TARGET_REGISTRY}" == "both" ]]; then
                append_tag "${GHCR_REPO}:${BASE_VERSION}"
                append_tag "${GHCR_REPO}:${MINOR_VERSION}"
                append_tag "${GHCR_REPO}:${IMAGE_PREFIX}latest"
              fi
            elif [[ "${RELEASE_TYPE}" == "nightly" ]]; then
              if [[ "${TARGET_REGISTRY}" == "docker.io" || "${TARGET_REGISTRY}" == "both" ]]; then
                append_tag "${DOCKERHUB_REPO}:${BASE_VERSION}"
                append_tag "${DOCKERHUB_REPO}:${IMAGE_PREFIX}nightly"
                append_tag "${DOCKERHUB_REPO}:${IMAGE_PREFIX}nightly-${TODAY}"
              fi
              if [[ "${TARGET_REGISTRY}" == "ghcr.io" || "${TARGET_REGISTRY}" == "both" ]]; then
                append_tag "${GHCR_REPO}:${BASE_VERSION}"
                append_tag "${GHCR_REPO}:${IMAGE_PREFIX}nightly"
                append_tag "${GHCR_REPO}:${IMAGE_PREFIX}nightly-${TODAY}"
              fi
            else
              if [[ "${TARGET_REGISTRY}" == "docker.io" || "${TARGET_REGISTRY}" == "both" ]]; then
                append_tag "${DOCKERHUB_REPO}:${BASE_VERSION}"
                append_tag "${DOCKERHUB_REPO}:${MINOR_VERSION}-${RELEASE_TYPE}"
              fi
              if [[ "${TARGET_REGISTRY}" == "ghcr.io" || "${TARGET_REGISTRY}" == "both" ]]; then
                append_tag "${GHCR_REPO}:${BASE_VERSION}"
                append_tag "${GHCR_REPO}:${MINOR_VERSION}-${RELEASE_TYPE}"
              fi
            fi
          elif [[ "${GIT_REF}" == "refs/heads/develop" ]]; then
            SHORT_SHA="$(echo "${COMMIT_SHA}" | cut -c1-7)"
            if [[ "${TARGET_REGISTRY}" == "docker.io" || "${TARGET_REGISTRY}" == "both" ]]; then
              append_tag "${DOCKERHUB_REPO}:dev-${SHORT_SHA}"
              append_tag "${DOCKERHUB_REPO}:develop"
            fi
            if [[ "${TARGET_REGISTRY}" == "ghcr.io" || "${TARGET_REGISTRY}" == "both" ]]; then
              append_tag "${GHCR_REPO}:dev-${SHORT_SHA}"
              append_tag "${GHCR_REPO}:develop"
            fi
          else
            if [[ "${TARGET_REGISTRY}" == "docker.io" || "${TARGET_REGISTRY}" == "both" ]]; then
              append_tag "${DOCKERHUB_REPO}:manual-${RUN_ID}"
            fi
            if [[ "${TARGET_REGISTRY}" == "ghcr.io" || "${TARGET_REGISTRY}" == "both" ]]; then
              append_tag "${GHCR_REPO}:manual-${RUN_ID}"
            fi
          fi

          echo "value=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "Tags to be pushed: ${TAGS}"

      - name: Determine push policy
        id: push-policy
        shell: bash
        env:
          PUSH_REQUESTED: ${{ inputs.push_to_registry }}
          REGISTRY: ${{ inputs.registry }}
          INCLUDE_TINYLLAMA: ${{ inputs.include_tinyllama }}
          LLM_MODEL: ${{ inputs.llm_model }}
          LLM_MODEL_URL: ${{ inputs.llm_model_url }}
          LLM_MODEL_FILE: ${{ inputs.llm_model_file }}
          FORCE_DOWNLOAD: ${{ inputs.tinyllama_force_download }}
        run: |
          set -euo pipefail
          case "$REGISTRY" in
            ghcr.io|docker.io|both) ;;
            *) echo "::error::Unsupported registry: $REGISTRY"; exit 1 ;;
          esac
          {
            echo "push_requested=${PUSH_REQUESTED}"
            echo "registry=${REGISTRY}"
            echo "include_tinyllama=${INCLUDE_TINYLLAMA}"
            echo "llm_model=${LLM_MODEL}"
            echo "llm_model_url=${LLM_MODEL_URL}"
            echo "llm_model_file=${LLM_MODEL_FILE}"
            echo "tinyllama_force_download=${FORCE_DOWNLOAD}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require a published GitHub release before registry publication
        if: steps.push-policy.outputs.push_requested == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')"
          if [[ "$draft" != "false" ]]; then
            echo "::error::GitHub Release must be published before Docker publication."; exit 1
          fi

  build-platforms:
    name: "Build: Docker Platform Images"
    needs: [mark-release-pending, prepare-release-context]
    if: >
      always() && needs.prepare-release-context.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    uses: ./.github/workflows/reusable-docker-image-platform.yml
    with:
      platform: ${{ matrix.platform }}
      version: ${{ needs.prepare-release-context.outputs.version }}
      tag_list: ${{ needs.prepare-release-context.outputs.tag_list }}
      registry: ${{ needs.prepare-release-context.outputs.registry }}
      push_to_registry: ${{ needs.prepare-release-context.outputs.push_requested == 'true' }}
      include_tinyllama: ${{ needs.prepare-release-context.outputs.include_tinyllama == 'true' }}
      llm_model: ${{ needs.prepare-release-context.outputs.llm_model }}
      llm_model_url: ${{ needs.prepare-release-context.outputs.llm_model_url }}
      llm_model_file: ${{ needs.prepare-release-context.outputs.llm_model_file }}
      tinyllama_force_download: ${{ needs.prepare-release-context.outputs.tinyllama_force_download == 'true' }}
      source_run_id: ${{ github.run_id }}
      source_sha: ${{ needs.prepare-release-context.outputs.source_sha }}
      edition: ${{ needs.prepare-release-context.outputs.edition }}
    secrets: inherit

  merge-image-manifest:
    name: "Publish: Docker Multi-Arch Manifest"
    needs: [prepare-release-context, build-platforms]
    if: >
      always() &&
      needs.prepare-release-context.result == 'success' &&
      needs.build-platforms.result == 'success' &&
      needs.prepare-release-context.outputs.push_requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v5
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: ./docker-digests

      - name: Log in to Docker Hub
        if: |
          contains(needs.prepare-release-context.outputs.tag_list, 'themisdb/themisdb:')
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: |
          contains(needs.prepare-release-context.outputs.tag_list, 'ghcr.io/')
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create final multi-arch manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tags < <(printf '%s' "${{ needs.prepare-release-context.outputs.tag_list }}" | tr ',' '\n' | sed '/^$/d')
          refs=()
          for digest_file in ./docker-digests/*; do
            [ -f "${digest_file}" ] || continue
            refs+=("$(tr -d '\r\n' < "${digest_file}")")
          done

          expected_platform_count=2
          if [ "${#refs[@]}" -ne "${expected_platform_count}" ]; then
            echo "::error::Expected exactly ${expected_platform_count} platform digests to assemble the final manifest, but found ${#refs[@]}."
            ls -la ./docker-digests || true
            exit 1
          fi
          for platform in linux-amd64 linux-arm64; do
            if [ ! -s "./docker-digests/docker-digest-${platform}.txt" ]; then
              echo "::error::Missing digest for ${platform}"; exit 1
            fi
          done
          for ref in "${refs[@]}"; do
            if ! [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid platform digest reference: $ref"; exit 1
            fi
          done
          if [ "${refs[0]##*@}" = "${refs[1]##*@}" ] || [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::Distinct platform digests and at least one tag are required."; exit 1
          fi

          create_cmd=(docker buildx imagetools create)
          for tag in "${tags[@]}"; do
            create_cmd+=( -t "${tag}" )
          done
          for ref in "${refs[@]}"; do
            create_cmd+=( "${ref}" )
          done
          "${create_cmd[@]}"

          PRIMARY_TAG="${tags[0]}"
          echo "primary_tag=${PRIMARY_TAG}" >> "${GITHUB_OUTPUT}"
          PRIMARY_IMAGE="${PRIMARY_TAG%:*}"
          case "${PRIMARY_IMAGE}" in
            ghcr.io/*) ATTESTATION_SUBJECT="${PRIMARY_IMAGE}" ;;
            *) ATTESTATION_SUBJECT="index.docker.io/${PRIMARY_IMAGE}" ;;
          esac
          echo "subject_name=${ATTESTATION_SUBJECT}" >> "${GITHUB_OUTPUT}"
          DIGEST="$(docker buildx imagetools inspect "${PRIMARY_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '\"')"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Created multi-arch manifest for ${PRIMARY_TAG} with digest ${DIGEST}"

      - name: Generate SLSA provenance attestation
        if: steps.manifest.outputs.digest != ''
        uses: actions/attest-build-provenance@v1  # v1.4.3
        with:
          subject-name: ${{ steps.manifest.outputs.subject_name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Print manifest result
        if: always()
        shell: bash
        run: |
          echo "──────────────────────────────────────────────"
          echo "  Docker manifest finalized"
          echo "  Primary tag : ${{ steps.manifest.outputs.primary_tag || 'not available' }}"
          echo "  Digest      : ${{ steps.manifest.outputs.digest || 'not available' }}"
          echo "──────────────────────────────────────────────"

  finalize-release-status:
    name: "Release: Finalize Docker Status"
    needs: [mark-release-pending, prepare-release-context, build-platforms, merge-image-manifest]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve final Docker outcome
        id: status
        shell: bash
        env:
          PLATFORM_RESULT: ${{ needs.build-platforms.result }}
          MANIFEST_RESULT: ${{ needs.merge-image-manifest.result }}
        run: |
          set -euo pipefail
          if [ "${MANIFEST_RESULT}" = "success" ]; then
            {
              echo "status_label=ci/build-ok"
              echo "status_text=passing"
              echo "status_icon=✅"
              echo "status_reason=docker image publication succeeded"
              echo "status_markers="
            } >> "${GITHUB_OUTPUT}"
          elif [ "${PLATFORM_RESULT}" = "cancelled" ] || [ "${MANIFEST_RESULT}" = "cancelled" ]; then
            {
              echo "status_label=ci/build-cancelled"
              echo "status_text=cancelled"
              echo "status_icon=⏹️"
              echo "status_reason=docker image publication was cancelled"
              echo "status_markers=ci/build-cancelled"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "status_label=ci/build-failed"
              echo "status_text=failing"
              echo "status_icon=❌"
              echo "status_reason=docker image publication failed"
              echo "status_markers=ci/build-failed"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Upsert Docker tracker issue
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: upsert_issue
          issue-title: '[Release] Status tracker — docker-image'
          issue-marker: '<!-- release-docker:type:release-status -->'
          issue-body: |
            <!-- release-docker:type:release-status -->
            ## Release Status — `docker-image`

            Current status: **${{ steps.status.outputs.status_icon }} ${{ steps.status.outputs.status_text }}**
            Reason: `${{ steps.status.outputs.status_reason }}`
            Marker: `${{ steps.status.outputs.status_markers || 'none' }}`

            Last run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) at `${{ github.sha }}`

            _This issue tracks Docker image publication health for the connected release lane._
            _Labels: `status/release-pending` = release in progress; `ci/build-failed` = release gate failed; `ci/build-cancelled` = release was interrupted._

      - name: Replace Docker status labels atomically
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: replace_status_group
          issue-title: '[Release] Status tracker — docker-image'
          issue-marker: '<!-- release-docker:type:release-status -->'
          labels-to-add: ${{ steps.status.outputs.status_label }}
          status-group: 'ci/build-ok,ci/build-failed,ci/build-cancelled,status/release-pending'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}

      - name: Comment Docker release status
        uses: ./.github/actions/status-flags-and-issues
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operation: comment_issue
          issue-title: '[Release] Status tracker — docker-image'
          issue-marker: '<!-- release-docker:type:release-status -->'
          issue-body: '${{ steps.status.outputs.status_icon }} Docker release `${{ github.sha }}` — [run ${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
          source-workflow: ${{ github.workflow }}
          source-run-id: ${{ github.run_id }}
          source-sha: ${{ github.sha }}
