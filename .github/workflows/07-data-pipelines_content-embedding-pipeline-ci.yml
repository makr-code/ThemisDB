name: Content Embedding Pipeline CI

# Triggered on every push / PR that touches the embedding pipeline sources,
# the ContentManager embedding integration, ContentMetrics, ContentPolicy,
# or this workflow itself.
# Targets v1.8.0 (roadmap:62:content:v1.8.0:embedding-generation-pipeline-text-vector).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/content/embedding_pipeline.h'
      - 'src/content/embedding_pipeline.cpp'
      - 'src/content/content_manager_embedding.cpp'
      - 'include/content/content_manager.h'
      - 'src/content/content_manager.cpp'
      - 'include/content/content_metrics.h'
      - 'src/content/content_metrics.cpp'
      - 'include/content/content_policy.h'
      - 'src/content/content_policy.cpp'
      - 'tests/test_content_embedding_pipeline.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_content-embedding-pipeline-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/content/embedding_pipeline.h'
      - 'src/content/embedding_pipeline.cpp'
      - 'src/content/content_manager_embedding.cpp'
      - 'include/content/content_manager.h'
      - 'src/content/content_manager.cpp'
      - 'include/content/content_metrics.h'
      - 'src/content/content_metrics.cpp'
      - 'include/content/content_policy.h'
      - 'src/content/content_policy.cpp'
      - 'tests/test_content_embedding_pipeline.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_content-embedding-pipeline-ci.yml'
  workflow_dispatch:

concurrency:
  group: content-embedding-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the ContentEmbeddingPipelineFocusedTests suite.
  # Tests cover all acceptance criteria:
  #   AC-1  EmbeddingPipeline disabled when model_name is empty; enabled otherwise
  #   AC-2  batch_size clamped to [1, 32]; timeout_ms clamped to ≥100 ms
  #   AC-3  generateEmbedding returns empty vector when pipeline is disabled
  #   AC-4  generateEmbeddingBatch result size matches input size (shape invariant)
  #   AC-5  ContentMetrics::recordEmbeddingFailure increments
  #         content_embedding_failures_total; reset() clears it; Prometheus
  #         output contains the counter name
  #   AC-6  ContentPolicy::embedding_model field wired and round-trips correctly
  #   AC-7  EmbeddingPipelineConfig::metrics pointer is forwarded correctly
  # ---------------------------------------------------------------------------
  content-embedding-pipeline-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Content Embedding Pipeline (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_content_embedding_pipeline_focused

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run ContentEmbeddingPipelineFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ContentEmbeddingPipelineFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee content_embedding_pipeline_results.txt

      # ── Broader AC validation via unified binary ───────────────────────────
      - name: Run embedding pipeline tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="EmbeddingPipelineTest*:ContentMetricsTest_Embedding*:ContentPolicyTest_Embedding*" \
            --gtest_output="xml:content_embedding_pipeline_gtest.xml" \
            2>&1 | tee content_embedding_pipeline_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-embedding-pipeline-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/content_embedding_pipeline_results.txt
            build/content_embedding_pipeline_gtest.xml
            build/content_embedding_pipeline_gtest_output.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔢 Content Embedding Pipeline – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "EmbeddingPipeline: config clamping (batch_size ≤32, timeout ≥100 ms), enable/disable," >> "$GITHUB_STEP_SUMMARY"
          echo "generateEmbedding and generateEmbeddingBatch shape invariants." >> "$GITHUB_STEP_SUMMARY"
          echo "ContentMetrics: recordEmbeddingFailure, getEmbeddingFailuresTotal, Prometheus export." >> "$GITHUB_STEP_SUMMARY"
          echo "ContentPolicy: embedding_model field. Metrics pointer wiring." >> "$GITHUB_STEP_SUMMARY"
