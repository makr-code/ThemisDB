name: Matryoshka Truncation CI

# Validates MatryoshkaTruncation and MatryoshkaTruncatedIndex (v1.8.0).
# Covers MRL prefix truncation, L2 normalisation, IAnnIndex wrapper correctness
# and recall, save/load roundtrip, edge cases (zero vector, zero-pad, k > size).
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/index/matryoshka_truncation.h'
      - 'src/index/matryoshka_truncation.cpp'
      - 'tests/index/test_matryoshka_truncation.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_matryoshka-truncation-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the MatryoshkaTruncationFocusedTests suite.
  # Acceptance criteria covered:
  #   AC-1  truncate() keeps first trunc_dim elements from a longer vector
  #   AC-2  truncate() is a no-op when trunc_dim == full_dim (modulo normalisation)
  #   AC-3  truncate() zero-pads output when trunc_dim > full_dim
  #   AC-4  Normalisation: output has unit L2 norm
  #   AC-5  Normalisation disabled: raw truncated values are preserved
  #   AC-6  Zero vector: no division-by-zero; output remains zero
  #   AC-7  trunc_dim=1 edge case handled correctly
  #   AC-8  Standard MRL granularity constants (64/128/256/512/768/1024/1536)
  #   AC-9  Constructor rejects trunc_dim=0 with std::invalid_argument
  #   AC-10 MatryoshkaTruncatedIndex::size() returns 0 before build
  #   AC-11 build() populates size to match input count
  #   AC-12 search() returns non-empty results after build
  #   AC-13 Nearest to self has id == 0
  #   AC-14 Recall@K: truncated-space ANN overlaps brute-force ≥ 60%
  #   AC-15 add() increments size
  #   AC-16 build() on empty dataset returns true; size() == 0
  #   AC-17 search() on empty index returns empty (no crash)
  #   AC-18 Null backend raises std::invalid_argument
  #   AC-19 save/load roundtrip preserves size
  #   AC-20 trunc_dim > full_dim: zero-pad path builds and searches
  #   AC-21 Polymorphic IAnnIndex pointer dispatches correctly
  #   AC-22 truncation() accessor returns correct trunc_dim
  #   AC-23 backend() accessor returns wrapped index
  #   AC-24 k > index size does not crash
  #   AC-25 Multiple add() then search() works correctly
  # ---------------------------------------------------------------------------
  matryoshka-truncation-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Matryoshka truncation tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libfmt-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure (matryoshka truncation test target only)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: ''

      - name: Build MatryoshkaTruncation focused test binary
        run: cmake --build build --target test_matryoshka_truncation_focused -- -j$(nproc)

      - name: Run MatryoshkaTruncation unit tests
        run: |
          set -o pipefail
          cd build
          ctest --test-dir . \
            --tests-regex MatryoshkaTruncationFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee matryoshka_truncation_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matryoshka-truncation-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/matryoshka_truncation_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🪆 Matryoshka Truncation – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "MatryoshkaTruncation: MRL prefix truncation, L2 normalisation, MatryoshkaTruncatedIndex wrapper over ScaNN/DiskANN, 25 acceptance criteria." >> "$GITHUB_STEP_SUMMARY"
