name: Temporal Phase 4 CI

# Validates temporal Phase 4 implementations:
#   - IntervalTreeIndex: augmented interval tree, O(log n + k) overlap detection
#   - TemporalCompressor: delta/ZSTD/Gorilla/dictionary compression for historical versions
#   - TemporalCDC: version-aware change data capture with subscribe/replay

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/temporal/interval_tree_index.h'
      - 'src/temporal/interval_tree_index.cpp'
      - 'include/temporal/temporal_compressor.h'
      - 'src/temporal/temporal_compressor.cpp'
      - 'include/temporal/temporal_cdc.h'
      - 'src/temporal/temporal_cdc.cpp'
      - 'tests/temporal/test_interval_tree_index.cpp'
      - 'tests/temporal/test_temporal_compressor.cpp'
      - 'tests/temporal/test_temporal_cdc.cpp'
      - '.github/workflows/temporal-phase4-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/temporal/interval_tree_index.h'
      - 'src/temporal/interval_tree_index.cpp'
      - 'include/temporal/temporal_compressor.h'
      - 'src/temporal/temporal_compressor.cpp'
      - 'include/temporal/temporal_cdc.h'
      - 'src/temporal/temporal_cdc.cpp'
      - 'tests/temporal/test_interval_tree_index.cpp'
      - 'tests/temporal/test_temporal_compressor.cpp'
      - 'tests/temporal/test_temporal_cdc.cpp'
      - '.github/workflows/temporal-phase4-ci.yml'
  workflow_dispatch:

concurrency:
  group: temporal-phase4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  temporal-phase4-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Temporal Phase 4 tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libssl-dev \
            libboost-all-dev \
            librocksdb-dev \
            libfmt-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      - name: Run IntervalTreeIndex tests
        run: |
          set -o pipefail
          cd build
          ctest -R IntervalTreeIndexTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee interval_tree_ctest.txt

      - name: Run TemporalCompressor tests
        run: |
          set -o pipefail
          cd build
          ctest -R TemporalCompressorTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee temporal_compressor_ctest.txt

      - name: Run TemporalCDC tests
        run: |
          set -o pipefail
          cd build
          ctest -R TemporalCDCTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee temporal_cdc_ctest.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-phase4-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/interval_tree_ctest.txt
            build/temporal_compressor_ctest.txt
            build/temporal_cdc_ctest.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🕐 Temporal Phase 4 – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "IntervalTreeIndex: augmented BST, max-end tracking, O(log n + k) overlap queries." >> "$GITHUB_STEP_SUMMARY"
          echo "TemporalCompressor: delta/ZSTD/Gorilla/dictionary compression for historical version payloads." >> "$GITHUB_STEP_SUMMARY"
          echo "TemporalCDC: subscribe/publish/replay CDC for system-versioned tables." >> "$GITHUB_STEP_SUMMARY"
