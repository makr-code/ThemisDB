name: Canary Deployments CI

# Triggered on every push / PR that touches the CanaryRollout / CanaryDeployment
# sources, tests, or this workflow file.  Targets v1.7.0 (Issue #4046).
on:
  workflow_dispatch:

concurrency:
  group: canary-deployments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated CanaryRolloutFocusedTests suite.
  #
  # Tests cover:
  #   1. Progressive rollout (1% → 5% → 25% → 100%)
  #   2. Automatic error-rate monitoring with auto-rollback
  #   3. CanaryDeployment builder API (setVersion / setStages / setThresholds)
  #   4. Latency percentile tracking (p50 / p95 / p99) with threshold rollback
  #   5. Memory, CPU, disk I/O metric collection
  #   6. Custom metrics (query errors, transaction failures)
  #   7. A/B testing (deterministic traffic splitting, isCanaryRequest/isControlRequest)
  #   8. Traffic splitting (isNodeInCanaryGroup)
  #   9. UpdatesConfig JSON / YAML round-trip for canary section
  # ---------------------------------------------------------------------------
  canary-deployments-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Canary deployments unit tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libcurl4-openssl-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev
            libzstd-dev
            libyaml-cpp-dev

      - name: Configure (canary deployments test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=ON \
            -DTHEMIS_ENABLE_GPU=ON \
            -DTHEMIS_BUILD_TESTS=ON \
            -S cmake/

      - name: Build focused test binary
        run: cmake --build build --target test_canary_rollout_focused -- -j$(nproc)

      - name: Run CanaryRolloutFocusedTests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex CanaryRolloutFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee canary_deployments_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-deployments-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/canary_deployments_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🐦 Canary Deployments – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "CanaryDeployment: progressive rollout, error-rate auto-rollback, latency p50/p95/p99," \
               "memory/CPU/disk I/O metrics, custom metrics, A/B testing, traffic splitting." \
               >> "$GITHUB_STEP_SUMMARY"
