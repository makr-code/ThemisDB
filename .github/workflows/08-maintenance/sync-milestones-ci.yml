name: Sync-Milestones CI

# Run unit tests and a dry-run smoke-test whenever the sync script,
# its tests, or any roadmap file changes.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'scripts/sync-milestones-from-roadmap.py'
      - 'tests/test_sync_milestones.py'
      - 'src/**/ROADMAP.md'
      - '.github/workflows/08-maintenance/sync-milestones-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/sync-milestones-from-roadmap.py'
      - 'tests/test_sync_milestones.py'
      - 'src/**/ROADMAP.md'
      - '.github/workflows/08-maintenance/sync-milestones-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest --quiet

      - name: Run unit tests
        run: python -m pytest tests/test_sync_milestones.py -v

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Sync-Milestones CI – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Test file** | \`tests/test_sync_milestones.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    name: Dry-run smoke test
    runs-on: ubuntu-latest
    # No token needed – dry-run skips all GitHub API calls for issue assignment,
    # but still attempts to fetch existing milestones. We tolerate the fetch
    # failure (empty list) and verify the script exits 0 with --dry-run.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dry-run the sync script
        run: python scripts/sync-milestones-from-roadmap.py --dry-run

      - name: Verify audit report was generated
        run: test -f docs/issue-milestone-audit.md && echo "✅ Audit report present"

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Sync-Milestones CI – Dry-Run Smoke Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`scripts/sync-milestones-from-roadmap.py --dry-run\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Audit report** | \`docs/issue-milestone-audit.md\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
