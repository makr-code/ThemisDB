name: Data Augmentation Pipeline Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/exporters/data_augmentation.cpp'
      - 'src/exporters/jsonl_llm_exporter.cpp'
      - 'src/exporters/exporter_metrics.cpp'
      - 'include/exporters/data_augmentation.h'
      - 'include/exporters/exporter_interface.h'
      - 'tests/exporters/test_data_augmentation.cpp'
      - '.github/workflows/08-maintenance/data-augmentation-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/exporters/data_augmentation.cpp'
      - 'src/exporters/jsonl_llm_exporter.cpp'
      - 'src/exporters/exporter_metrics.cpp'
      - 'include/exporters/data_augmentation.h'
      - 'include/exporters/exporter_interface.h'
      - 'tests/exporters/test_data_augmentation.cpp'
      - '.github/workflows/08-maintenance/data-augmentation-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build & run the data augmentation pipeline test suite
  # ---------------------------------------------------------------------------
  data-augmentation-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Data augmentation unit tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev

      - name: Configure (data augmentation tests only)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      - name: Run data augmentation unit tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="DataAugmentationTest.*" \
            --gtest_output="xml:data_augmentation_test_results.xml" \
            2>&1 | tee data_augmentation_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-augmentation-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/data_augmentation_test_results.xml
            build/data_augmentation_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Data Augmentation Pipeline Tests – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Synthetic data augmentation pipeline: synonym replacement, question reformulation, whitespace normalization, lowercase, sentence casing." >> "$GITHUB_STEP_SUMMARY"
