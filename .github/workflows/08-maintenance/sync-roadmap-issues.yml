name: Sync Roadmap Issues

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
          - backfill
      priority:
        description: 'Optional priority filter (select "all" for no filter)'
        required: false
        default: all
        type: choice
        options:
          - all
          - critical
          - high
          - medium
          - low
      module:
        description: Optional module filter
        required: false
        default: ""
        type: string
      limit:
        description: Optional max item count
        required: false
        default: ""
        type: string
      backfill:
        description: Backfill issue refs into src/ROADMAP.md after apply
        required: false
        default: false
        type: boolean
      manifest:
        description: Manifest path for backfill mode
        required: false
        default: artifacts/roadmap-issues/roadmap-issues-apply.json
        type: string

permissions:
  contents: write
  issues: write

jobs:
  sync-roadmap-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build command line
        id: flags
        shell: bash
        run: |
          FLAGS=(--mode "${{ github.event.inputs.mode }}")
          if [ -n "${{ github.event.inputs.priority }}" ] && [ "${{ github.event.inputs.priority }}" != "all" ]; then
            FLAGS+=(--priority "${{ github.event.inputs.priority }}")
          fi
          if [ -n "${{ github.event.inputs.module }}" ]; then
            FLAGS+=(--module "${{ github.event.inputs.module }}")
          fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            FLAGS+=(--limit "${{ github.event.inputs.limit }}")
          fi
          if [ "${{ github.event.inputs.backfill }}" = "true" ]; then
            FLAGS+=(--backfill)
          fi
          if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then
            FLAGS+=(--manifest "${{ github.event.inputs.manifest }}")
          fi
          printf 'flags=%q ' "${FLAGS[@]}" >> "$GITHUB_OUTPUT"

      - name: Run roadmap issue sync
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync-issues-from-roadmap.py ${{ steps.flags.outputs.flags }}

      - name: Upload roadmap issue artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-issues-${{ github.run_id }}
          path: |
            artifacts/roadmap-issues/

      - name: Commit roadmap backfill
        if: ${{ github.event.inputs.backfill == 'true' || github.event.inputs.mode == 'backfill' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/ROADMAP.md
          if git diff --cached --quiet; then
            echo "No roadmap changes to commit."
          else
            git commit -m "chore: backfill roadmap issue references"
            git push
          fi

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## Roadmap Issue Sync" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | ${{ github.event.inputs.mode }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Priority | ${{ github.event.inputs.priority || 'all' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | ${{ github.event.inputs.module || 'all' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Limit | ${{ github.event.inputs.limit || 'all' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backfill | ${{ github.event.inputs.backfill }} |" >> "$GITHUB_STEP_SUMMARY"