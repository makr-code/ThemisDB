name: Bench-Source CI Guard

# Implements PERFORMANCE_EXPECTATIONS.md §1.4, Maßnahme #8:
#   "Build-Check 'source exists but binary missing' als CI-Guard"
#
# Runs tools/perf_expectations_audit.py which executes two hard checks:
#
#   Check 8a – every bench_*.cpp in benchmarks/ is covered by a CMake target
#              (explicit add_executable() OR auto-registration block present).
#              STATUS_FAIL when orphaned_sources != [].
#
#   Check 8b – tools/check_bench_targets.py (standalone guard) exists.
#              STATUS_FAIL when the guard script is absent.
#
# The job fails (exit-code 1) if either check returns STATUS_FAIL, blocking
# the PR merge.  This prevents new bench_*.cpp files from being silently
# stranded without a build target.
#
# Triggers:
#   • pull_request  – on any change to benchmarks/ sources or CI guard tools
#   • push to main  – after merge, to keep the baseline green
#   • schedule      – nightly to catch configuration drift
#   • workflow_dispatch – manual run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'benchmarks/bench_*.cpp'
      - 'benchmarks/CMakeLists.txt'
      - 'tools/check_bench_targets.py'
      - 'tools/perf_expectations_audit.py'
      - '.github/workflows/05-quality_build_bench-source-guard-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'benchmarks/bench_*.cpp'
      - 'benchmarks/CMakeLists.txt'
      - 'tools/check_bench_targets.py'
      - 'tools/perf_expectations_audit.py'
  schedule:
    - cron: '0 1 * * *'   # Nightly at 01:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-source-guard:
    name: Bench-Source CI Guard
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Run the standalone guard first so the error message is immediately
      # visible even without the full audit context.
      - name: Run standalone bench-target guard (check_bench_targets.py)
        id: guard
        run: |
          python3 tools/check_bench_targets.py \
            --no-color \
            --format text

      # Run the full audit which also verifies the guard script exists (8b).
      - name: Run perf-expectations audit (checks 8a + 8b)
        id: audit
        run: |
          python3 tools/perf_expectations_audit.py \
            --no-color \
            --format text

      - name: Export JSON audit results for step summary
        if: always()
        id: audit_json
        run: |
          python3 tools/perf_expectations_audit.py \
            --no-color \
            --format json \
            > /tmp/perf_audit_results.json 2>&1 || true
          echo "audit_json<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/perf_audit_results.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-audit-results-${{ github.sha }}
          path: /tmp/perf_audit_results.json
          retention-days: 14

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔬 Bench-Source CI Guard – PERFORMANCE_EXPECTATIONS.md §1.4 Maßnahme #8" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Guard step** | ${{ steps.guard.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Audit step** | ${{ steps.audit.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Checks" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Description | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 8a | bench_*.cpp ohne CMake-Target (orphaned sources) | \`${{ steps.guard.outcome }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "| 8b | Externer Guard (check_bench_targets.py) vorhanden | \`${{ steps.audit.outcome }}\` |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/perf_audit_results.json ]; then
            echo "### Audit JSON" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/perf_audit_results.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi
