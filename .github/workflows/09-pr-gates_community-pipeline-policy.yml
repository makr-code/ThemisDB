name: Community Pipeline Policy — No Private Credentials

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - community
      - minimal
    paths:
      - '.github/workflows/**'
      - 'cmake/**'
      - 'scripts/**'
      - '.github/workflows/09-pr-gates_community-pipeline-policy.yml'
  workflow_dispatch: {}

concurrency:
  group: community-pipeline-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-private-credentials:
    name: Verify no private credentials in community CI/build files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              -- '.github/workflows/**' 'cmake/**' 'scripts/**' > changed_files.txt
          else
            git ls-files '.github/workflows' 'cmake' 'scripts' > changed_files.txt
          fi
          cat changed_files.txt

      - name: Scan for private credential patterns
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          # Patterns that must NEVER appear in community/minimal CI or build files.
          # These signal the presence of private tokens, secrets, or repository access
          # that would break community builds or leak credentials.
          FORBIDDEN_PATTERNS = [
              # GitHub tokens or PAT references to private repos
              (r'\$\{\{[^}]*secrets\.[A-Z_]*PRIVATE[A-Z_]*\}\}',
               "Secret reference to a private-repo credential"),
              (r'\$\{\{[^}]*secrets\.[A-Z_]*PLUGIN[A-Z_]*\}\}',
               "Secret reference to a plugin credential"),
              (r'\$\{\{[^}]*secrets\.[A-Z_]*ENTERPRISE[A-Z_]*\}\}',
               "Secret reference to an enterprise credential"),
              (r'\$\{\{[^}]*secrets\.[A-Z_]*HYPERSCALER[A-Z_]*\}\}',
               "Secret reference to a hyperscaler credential"),
              (r'\$\{\{[^}]*secrets\.[A-Z_]*MILITARY[A-Z_]*\}\}',
               "Secret reference to a military credential"),
              # Hard-coded submodule token patterns
              (r'https://[^@\s]+:[^@\s]+@github\.com/makr-code/themisdb_',
               "Hard-coded credentials in private submodule URL"),
              # cmake/scripts referencing private plugin credentials directly
              (r'WITH_PRIVATE_PLUGINS\s*=\s*ON',
               "Private plugin flag must not be set ON in community/minimal builds"),
          ]

          changed = [line.strip() for line in Path('changed_files.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          findings = []

          for rel_path in changed:
              p = Path(rel_path)
              if not p.is_file():
                  continue
              suffix = p.suffix.lower()
              if suffix not in {'.yml', '.yaml', '.cmake', '.py', '.sh', '.ps1', '.txt', ''}:
                  continue
              text = p.read_text(encoding='utf-8', errors='ignore')
              for pattern, description in FORBIDDEN_PATTERNS:
                  for m in re.finditer(pattern, text, re.IGNORECASE):
                      line_no = text[:m.start()].count('\n') + 1
                      findings.append(f"{rel_path}:{line_no}: {description} — matched: {m.group(0)!r}")

          if findings:
              print("FAIL: Community/minimal pipeline files must not contain private credentials.")
              print("Policy: docs/plugins/COMMUNITY_BUILD_VALIDATION_GUIDE.md §No Private Content in Community Builds")
              print()
              for f in findings:
                  print(f"  {f}")
              sys.exit(1)

          print(f"OK: No private credential patterns found in {len(changed)} changed community CI/build files.")
          PY

      - name: Verify no private submodule checkout in CI steps
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          # Verify that community/minimal workflows do not attempt to check out
          # private plugin submodules that require authentication.
          PRIVATE_SUBMODULE_PATHS = [
              "plugins/themisdb_ethic_ai",
              "plugins/themisdb_llm_wiki",
              "plugins/themisdb_storage",
              "plugins/themisdb_importer",
              "plugins/themisdb_plugin_signer",
              "plugins/themisdb_geo",
              "plugins/themisdb_timeseries",
          ]

          workflow_dir = Path(".github/workflows")
          offenders = []

          for wf in workflow_dir.glob("*.yml"):
              text = wf.read_text(encoding='utf-8', errors='ignore')
              # Skip files that are explicitly scoped to enterprise/hyperscaler/military
              if re.search(r'branches:\s*\n(?:.*\n)*?\s*-\s*(enterprise|hyperscaler|military)', text):
                  continue
              for sp in PRIVATE_SUBMODULE_PATHS:
                  if sp in text and 'submodules: true' in text:
                      offenders.append(f"{wf}: references private submodule '{sp}' with 'submodules: true'")

          if offenders:
              print("FAIL: Community workflows must not check out private submodules.")
              for o in offenders:
                  print(f"  {o}")
              sys.exit(1)

          print("OK: No community/minimal workflows check out private submodules.")
          PY
