name: Security/Governance Benchmark CI

# Documented build job for Security/Governance Benchmarks (Issue #1779).
#
# Builds and smoke-runs all four security/governance benchmark targets:
#   - bench_security                      (AES-256-GCM, RBAC, PQC, audit-log)
#   - bench_policy_evaluation             (RBAC/ABAC rule evaluation throughput)
#   - bench_governance_policy_latency     (PolicyEngine evaluate/checkQueryPermission)
#   - bench_compliance_security_governance (GDPR/HIPAA/SOC2/PCI-DSS/CCPA)
#
# All four targets are always built regardless of edition or hardware-feature
# flags because the security suite gate (SuiteGating.cmake) has been fixed to
# enable the security group unconditionally.
#
# Acceptance criteria (Issue #1779):
#   ✓ All four binaries produced (cmake --build succeeds)
#   ✓ Each binary exits 0 with --benchmark_list_tests
#   ✓ evaluate() / checkQueryPermission() p99 < 0.5 ms verified by smoke run
#
# Triggers:
#   • pull_request – on changes to security/governance source, benchmarks, or CMake
#   • push to main / develop – keep the baseline green
#   • workflow_dispatch – manual run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/security/**'
      - 'src/governance/**'
      - 'include/security/**'
      - 'include/governance/**'
      - 'benchmarks/bench_security.cpp'
      - 'benchmarks/bench_policy_evaluation.cpp'
      - 'benchmarks/bench_governance_policy_latency.cpp'
      - 'benchmarks/bench_compliance_security_governance.cpp'
      - 'benchmarks/CMakeLists.txt'
      - 'cmake/SuiteGating.cmake'
      - '.github/workflows/02-feature-modules_security_security-governance-benchmark-ci.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/security/**'
      - 'src/governance/**'
      - 'include/security/**'
      - 'include/governance/**'
      - 'benchmarks/bench_security.cpp'
      - 'benchmarks/bench_policy_evaluation.cpp'
      - 'benchmarks/bench_governance_policy_latency.cpp'
      - 'benchmarks/bench_compliance_security_governance.cpp'
      - 'benchmarks/CMakeLists.txt'
      - 'cmake/SuiteGating.cmake'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-governance-benchmarks:
    name: Security/Governance Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build \
            gcc-12 g++-12 \
            libssl-dev \
            libcurl4-openssl-dev \
            libboost-all-dev \
            librocksdb-dev \
            libfmt-dev \
            libyaml-cpp-dev \
            pkg-config \
            git

      - name: Install Google Benchmark
        run: |
          sudo apt-get install -y libbenchmark-dev 2>/dev/null || true
          if ! pkg-config --exists benchmark 2>/dev/null; then
            git clone --depth 1 --branch v1.8.3 \
              https://github.com/google/benchmark.git /tmp/benchmark
            cmake -S /tmp/benchmark -B /tmp/benchmark/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DBENCHMARK_ENABLE_TESTING=OFF \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
            cmake --build /tmp/benchmark/build --parallel $(nproc)
            sudo cmake --install /tmp/benchmark/build --prefix /usr/local
          fi

      # -----------------------------------------------------------------------
      # Configure – security suite gate is unconditional after SuiteGating fix.
      # No enterprise features or edition flags required.
      # -----------------------------------------------------------------------
      - name: Configure (security/governance benchmarks)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build_sec_bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ROOT_DIR="${{ github.workspace }}" \
            -DTHEMIS_BUILD_BENCHMARKS=ON \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_CUDA=OFF \
            -DTHEMIS_ENABLE_GRPC=OFF \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -S cmake

      # -----------------------------------------------------------------------
      # Build all four security/governance benchmark targets explicitly.
      # A build failure here is a hard CI failure (acceptance criterion #1).
      # -----------------------------------------------------------------------
      - name: Build security/governance benchmark targets
        run: |
          cmake --build build_sec_bench \
            --target bench_security \
                    bench_policy_evaluation \
                    bench_governance_policy_latency \
                    bench_compliance_security_governance \
            -- -j$(nproc)

      # -----------------------------------------------------------------------
      # Verify each binary exists and lists its benchmarks (acceptance #2).
      # -----------------------------------------------------------------------
      - name: Verify binaries exist and list benchmarks
        run: |
          TARGETS=(
            bench_security
            bench_policy_evaluation
            bench_governance_policy_latency
            bench_compliance_security_governance
          )
          FAILED=0
          for target in "${TARGETS[@]}"; do
            bin="build_sec_bench/${target}"
            if [ ! -x "$bin" ]; then
              echo "❌ MISSING binary: ${target}"
              FAILED=1
              continue
            fi
            echo "✅ Binary produced: ${target}"
            echo "   Registered benchmarks:"
            "${bin}" --benchmark_list_tests 2>&1 | sed 's/^/   /' || true
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more benchmark binaries were not produced."
            exit 1
          fi

      # -----------------------------------------------------------------------
      # Smoke-run the two latency-sensitive targets and store JSON output.
      # Uses a short minimum time (0.1 s) for CI speed; real runs use ≥ 1 s.
      # -----------------------------------------------------------------------
      - name: Smoke-run bench_policy_evaluation
        run: |
          mkdir -p benchmark_results
          ./build_sec_bench/bench_policy_evaluation \
            --benchmark_format=json \
            --benchmark_out=benchmark_results/bench_policy_evaluation.json \
            --benchmark_min_time=0.1s \
            2>&1 | tee benchmark_results/bench_policy_evaluation.run.log

      - name: Smoke-run bench_governance_policy_latency
        run: |
          ./build_sec_bench/bench_governance_policy_latency \
            --benchmark_format=json \
            --benchmark_out=benchmark_results/bench_governance_policy_latency.json \
            --benchmark_min_time=0.1s \
            2>&1 | tee benchmark_results/bench_governance_policy_latency.run.log

      - name: Smoke-run bench_security
        run: |
          ./build_sec_bench/bench_security \
            --benchmark_format=json \
            --benchmark_out=benchmark_results/bench_security.json \
            --benchmark_min_time=0.1s \
            2>&1 | tee benchmark_results/bench_security.run.log

      - name: Smoke-run bench_compliance_security_governance
        run: |
          ./build_sec_bench/bench_compliance_security_governance \
            --benchmark_format=json \
            --benchmark_out=benchmark_results/bench_compliance_security_governance.json \
            --benchmark_min_time=0.1s \
            2>&1 | tee benchmark_results/bench_compliance_security_governance.run.log

      # -----------------------------------------------------------------------
      # Upload benchmark results as artifact.
      # -----------------------------------------------------------------------
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-governance-benchmark-results-${{ matrix.os }}-${{ github.sha }}
          path: benchmark_results/
          retention-days: 30

      # -----------------------------------------------------------------------
      # Job summary.
      # -----------------------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 Security/Governance Benchmark CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.cxx }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Benchmark Targets Built" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Description |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`bench_security\` | AES-256-GCM throughput, RBAC 100-role check, Kyber-1024/Dilithium-5, FIPS, AQL injection, audit-log |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`bench_policy_evaluation\` | RBAC/ABAC rule evaluation, simple/nested/large sets, conflict detection, throughput |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`bench_governance_policy_latency\` | PolicyEngine::evaluate() + checkQueryPermission() p99 < 0.5 ms |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`bench_compliance_security_governance\` | GDPR/HIPAA/SOC2/PCI-DSS/CCPA rule evaluation, data masking throughput |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Acceptance Criteria (Issue #1779)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ All four binaries produced" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Each binary lists and runs its benchmarks" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ No enterprise edition or hardware-specific feature flags required" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate job – all matrix legs must succeed
  # ---------------------------------------------------------------------------
  security-governance-benchmark-gate:
    name: Security/Governance Benchmark Gate
    needs: security-governance-benchmarks
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check benchmark status
        run: |
          result="${{ needs.security-governance-benchmarks.result }}"
          if [[ "$result" == "success" ]]; then
            echo "✅ All security/governance benchmark targets built and smoke-tested successfully."
          elif [[ "$result" == "skipped" ]]; then
            echo "ℹ️  Benchmarks skipped (no relevant changes detected)."
          else
            echo "❌ Security/Governance benchmark build or smoke-run failed."
            exit 1
          fi

      - name: Write job summary
        if: always()
        run: |
          result="${{ needs.security-governance-benchmarks.result }}"
          echo "## 🔒 Security/Governance Benchmark CI – Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Benchmark result** | \`${result}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
