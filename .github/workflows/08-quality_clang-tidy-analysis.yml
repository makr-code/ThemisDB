name: "Static Analysis — clang-tidy + clang-format"

# ---------------------------------------------------------------------------
# 08-quality — clang-tidy static analysis and clang-format style check
#
# First rollout: workflow_dispatch only (manual trigger).
#   After trigger quality is verified, a non-blocking PR gate or a nightly
#   schedule may be added per WORKFLOW_GUIDELINES.md.
#
# clang-tidy job:
#   - Configures the project (community-release preset) to generate
#     compile_commands.json, then runs clang-tidy over src/ and include/.
#   - Emits SARIF output (clang_tidy_to_sarif.py) uploaded to GitHub Code
#     Scanning for persistent tracking in the Security tab.
#   - Raw text output is also uploaded as a workflow artifact for offline
#     triage. This job never fails the workflow by default; use
#     fail_on_warnings=true to enforce a hard gate.
#
# clang-format job:
#   - Runs clang-format --dry-run --Werror over all C++ source files and
#     uploads a diff-report artifact. Does not fail the workflow by default;
#     use fail_on_format_violations=true for a hard gate.
#
# Governance: Phase 4.1 implementation per .github/TODO_KI_WORKFLOW_IMPROVEMENTS.md
# See also: .github/WORKFLOW_REGISTRY.md · .github/WORKFLOW_GUIDELINES.md
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      fail_on_warnings:
        description: >
          Fail the clang-tidy job if any warnings or errors are found.
          Set to true to enforce a hard quality gate.
        type: boolean
        default: false
      fail_on_format_violations:
        description: >
          Fail the clang-format job if any formatting violations are found.
          Set to true to enforce code-style compliance.
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write  # required for uploading SARIF to Code Scanning

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: clang-tidy static analysis
  # ---------------------------------------------------------------------------
  clang-tidy:
    name: "clang-tidy (community-release, Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            clang \
            clang-tidy \
            librocksdb-dev \
            libssl-dev \
            zlib1g-dev \
            libzstd-dev \
            libgtest-dev \
            pkg-config \
            python3

      - name: Detect clang-tidy version
        id: ct_version
        run: |
          VERSION=$(clang-tidy --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "unknown")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "clang-tidy version: ${VERSION}"

      - name: Configure project (generate compile_commands.json)
        # Configure only — do not build. compile_commands.json is written
        # at configure time when CMAKE_EXPORT_COMPILE_COMMANDS=ON.
        run: |
          cmake --preset community-release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DENABLE_LOCAL_CLANG_TIDY=OFF

      - name: Run clang-tidy
        id: tidy
        # Run clang-tidy in parallel over all .cpp / .cc files under src/ and
        # include/. The -quiet flag suppresses per-file progress messages.
        # Exit code is captured but the step does not abort immediately so the
        # SARIF and artifact upload always complete.
        run: |
          set -o pipefail
          set +e  # do not abort on non-zero exit; capture exit code manually
          find src/ include/ -type f \( -name '*.cpp' -o -name '*.cc' \) \
            | sort \
            | xargs -P "$(nproc)" -I{} \
                clang-tidy -p build-community-release --quiet {} 2>&1 \
            | tee clang-tidy-output.txt
          XARGS_EXIT=${PIPESTATUS[1]}
          EXIT_CODE=${XARGS_EXIT}

          # Determine if actionable findings were emitted
          if grep -qE '^\S.*:[0-9]+:[0-9]+: (warning|error):' clang-tidy-output.txt; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Convert output to SARIF
        run: |
          python3 .github/scripts/clang_tidy_to_sarif.py \
            clang-tidy-output.txt \
            clang-tidy.sarif \
            --repo-root "$(pwd)" \
            --tool-version "${{ steps.ct_version.outputs.version }}"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        # Continue even when no results — upload an empty-results SARIF to
        # keep the Code Scanning status green.
        with:
          sarif_file: clang-tidy.sarif
          category: clang-tidy

      - name: Upload raw output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-results
          path: |
            clang-tidy-output.txt
            clang-tidy.sarif
          retention-days: 14

      - name: Enforce hard gate (optional)
        if: ${{ inputs.fail_on_warnings && steps.tidy.outputs.has_findings == 'true' }}
        run: |
          echo "::error::clang-tidy found warnings/errors (fail_on_warnings=true). See artifact clang-tidy-results."
          exit 1

  # ---------------------------------------------------------------------------
  # Job 2: clang-format style check
  # ---------------------------------------------------------------------------
  clang-format:
    name: "clang-format style check (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Run clang-format check
        id: fmt
        # --dry-run: do not modify files; --Werror: exit non-zero on any violation.
        # Captures violations; does not abort so artifact upload always runs.
        run: |
          set -o pipefail
          set +e  # do not abort on non-zero exit; capture exit code manually
          find src/ include/ -type f \( -name '*.cpp' -o -name '*.cc' -o -name '*.h' -o -name '*.hpp' \) \
            | sort \
            | xargs clang-format --dry-run --Werror 2>&1 \
            | tee clang-format-report.txt
          XARGS_EXIT=${PIPESTATUS[1]}
          EXIT_CODE=${XARGS_EXIT}

          if [ -s clang-format-report.txt ]; then
            echo "has_violations=true" >> "$GITHUB_OUTPUT"
            LINES=$(wc -l < clang-format-report.txt)
            echo "::warning::clang-format found style violations (${LINES} line(s)). See artifact clang-format-results."
          else
            echo "has_violations=false" >> "$GITHUB_OUTPUT"
            echo "No clang-format violations found."
          fi
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Upload format report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-format-results
          path: clang-format-report.txt
          retention-days: 7

      - name: Enforce hard gate (optional)
        if: ${{ inputs.fail_on_format_violations && steps.fmt.outputs.has_violations == 'true' }}
        run: |
          echo "::error::clang-format style violations found (fail_on_format_violations=true). See artifact clang-format-results."
          exit 1
