name: Nightly AI Quality Gate

# Runs after the scheduled post-merge smoke build and produces machine-readable
# quality evidence from GoogleTest and Google Benchmark.
#
# Outputs:
# - artifacts/quality_gate/gtest/*.json
# - artifacts/quality_gate/bench/*.json
# - artifacts/quality_gate/quality_gate_summary.json
# - artifacts/quality_gate/quality_gate_report.md

on:
  workflow_run:
    workflows: ["🚦 Post-Merge Smoke Test"]
    types: [completed]
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      create_issue:
        description: "Create or update a nightly quality issue on gate failure"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      issue_assignees:
        description: "Optional comma-separated assignees override"
        required: false
        default: ""
        type: string
      issue_labels:
        description: "Optional comma-separated extra labels override"
        required: false
        default: ""
        type: string

concurrency:
  group: nightly-ai-quality-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  nightly-ai-quality-gate:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    name: Nightly AI Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      GTEST_DIR: artifacts/quality_gate/gtest
      BENCH_DIR: artifacts/quality_gate/bench

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: gcc-14
          cxx: g++-14
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev
            libbenchmark-dev

      - name: Create artifact directories
        run: |
          mkdir -p "$GTEST_DIR" "$BENCH_DIR"

      - name: Configure and build focused AI test binaries
        uses: ./.github/actions/configure-themis
        with:
          cc: gcc-14
          cxx: g++-14
          edition: COMMUNITY
          ci-mode: 'true'
          build-target: test_prompt_regression_runner_focused

      - name: Build additional focused AI test binaries
        run: |
          set -o pipefail
          cd build
          cmake --build . --target test_dspy_module_focused -- -j$(nproc) 2>&1 | tee build_dspy.log
          cmake --build . --target test_tree_of_thoughts_focused -- -j$(nproc) 2>&1 | tee build_tot.log

      - name: Run GoogleTest suites (JSON output)
        run: |
          set -o pipefail
          cd build

          ./tests/test_prompt_regression_runner_focused \
            --gtest_output="json:../$GTEST_DIR/prompt_regression_gtest.json" \
            2>&1 | tee ../$GTEST_DIR/prompt_regression_gtest.log

          ./tests/test_dspy_module_focused \
            --gtest_output="json:../$GTEST_DIR/dspy_module_gtest.json" \
            2>&1 | tee ../$GTEST_DIR/dspy_module_gtest.log

          ./tests/test_tree_of_thoughts_focused \
            --gtest_output="json:../$GTEST_DIR/tree_of_thoughts_gtest.json" \
            2>&1 | tee ../$GTEST_DIR/tree_of_thoughts_gtest.log

      - name: Configure benchmark build
        run: |
          set -o pipefail
          cmake --preset nightly-bench-sweep 2>&1 | tee "$BENCH_DIR/cmake_configure.log"

      - name: Build selected Google Benchmark binaries
        run: |
          set -o pipefail
          cmake --build build/nightly \
            --target bench_tpcc bench_ycsb bench_llm_model_loading_from_themisdb \
            -j$(nproc) 2>&1 | tee "$BENCH_DIR/cmake_build.log"

      - name: Run Google Benchmarks (JSON output)
        id: run_bench
        run: |
          set -euo pipefail
          BENCH_COUNT=0
          BENCH_FAIL=0

          run_bench() {
            local exe="$1"
            local out_name="$2"
            shift 2

            if [ ! -x "$exe" ]; then
              echo "SKIP: missing $exe"
              return 0
            fi

            BENCH_COUNT=$((BENCH_COUNT + 1))
            if "$exe" "$@" \
              --benchmark_format=json \
              --benchmark_out="$BENCH_DIR/${out_name}.json" \
              2>&1 | tee "$BENCH_DIR/${out_name}.log"; then
              echo "OK: ${out_name}"
            else
              BENCH_FAIL=$((BENCH_FAIL + 1))
              echo "FAIL: ${out_name}"
            fi
          }

          run_bench build/nightly/bench_tpcc tpcc --benchmark_min_time=0.05s
          run_bench build/nightly/bench_ycsb ycsb --benchmark_min_time=0.05s --benchmark_filter="YCSBLiteFixture/WorkloadC_ReadOnly/1000000|YCSBLiteFixture/WorkloadA/100000|YCSBLiteFixture/WorkloadB/100000"
          run_bench build/nightly/bench_llm_model_loading_from_themisdb llm_model_loading --benchmark_min_time=0.05s

          echo "bench_count=$BENCH_COUNT" >> "$GITHUB_OUTPUT"
          echo "bench_fail=$BENCH_FAIL" >> "$GITHUB_OUTPUT"

      - name: Aggregate JSON evidence and generate report
        id: aggregate
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import glob
          import json
          import os
          from datetime import datetime, timezone

          gtest_dir = os.environ["GTEST_DIR"]
          bench_dir = os.environ["BENCH_DIR"]

          def parse_gtest(path):
              data = json.load(open(path, "r", encoding="utf-8"))
              tests = 0
              failures = 0

              def walk(node):
                  nonlocal tests, failures
                  if isinstance(node, dict):
                      if "testsuite" in node and isinstance(node["testsuite"], list):
                          for ts in node["testsuite"]:
                              walk(ts)
                      if "tests" in node:
                          try:
                              tests += int(node.get("tests", 0))
                          except Exception:
                              pass
                      if "failures" in node:
                          try:
                              failures += int(node.get("failures", 0))
                          except Exception:
                              pass
                      if "testsuite" in node and isinstance(node["testsuite"], dict):
                          walk(node["testsuite"])
                  elif isinstance(node, list):
                      for x in node:
                          walk(x)

              walk(data)
              return {"file": path, "tests": tests, "failures": failures}

          def parse_bench(path):
              data = json.load(open(path, "r", encoding="utf-8"))
              benches = data.get("benchmarks", []) if isinstance(data, dict) else []
              return {
                  "file": path,
                  "benchmarks": len(benches),
                  "names": [b.get("name", "") for b in benches[:20]]
              }

          gtest_files = sorted(glob.glob(os.path.join(gtest_dir, "*_gtest.json")))
          bench_files = sorted(glob.glob(os.path.join(bench_dir, "*.json")))

          gtest_results = [parse_gtest(p) for p in gtest_files]
          bench_results = [parse_bench(p) for p in bench_files]

          gtest_total = sum(r["tests"] for r in gtest_results)
          gtest_failures = sum(r["failures"] for r in gtest_results)
          bench_total = sum(r["benchmarks"] for r in bench_results)

          summary = {
              "timestamp_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "workflow": os.environ.get("GITHUB_WORKFLOW", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "event": os.environ.get("GITHUB_EVENT_NAME", ""),
              "gtest": {
                  "files": len(gtest_results),
                  "total_tests": gtest_total,
                  "total_failures": gtest_failures,
                  "results": gtest_results,
              },
              "benchmark": {
                  "files": len(bench_results),
                  "total_benchmarks": bench_total,
                  "results": bench_results,
              },
          }

          os.makedirs("artifacts/quality_gate", exist_ok=True)
          with open("artifacts/quality_gate/quality_gate_summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2)

          gate_failed = (gtest_failures > 0) or (gtest_total == 0) or (bench_total == 0)

          lines = []
          lines.append("## Nightly AI Quality Gate Report")
          lines.append("")
          lines.append(f"- Timestamp (UTC): {summary['timestamp_utc']}")
          lines.append(f"- Event: {summary['event']}")
          lines.append(f"- Ref: {summary['ref']}")
          lines.append(f"- SHA: {summary['sha']}")
          lines.append("")
          lines.append("### GoogleTest")
          lines.append(f"- JSON files: {summary['gtest']['files']}")
          lines.append(f"- Total tests: {gtest_total}")
          lines.append(f"- Total failures: {gtest_failures}")
          lines.append("")
          lines.append("### Google Benchmark")
          lines.append(f"- JSON files: {summary['benchmark']['files']}")
          lines.append(f"- Total benchmarks: {bench_total}")
          lines.append("")
          lines.append("### Gate Result")
          lines.append(f"- Status: {'FAIL' if gate_failed else 'PASS'}")
          lines.append("- Failure criteria: GoogleTest failures > 0 OR no GoogleTest JSON OR no Benchmark JSON")

          with open("artifacts/quality_gate/quality_gate_report.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"gtest_total={gtest_total}\n")
              out.write(f"gtest_failures={gtest_failures}\n")
              out.write(f"bench_total={bench_total}\n")
              out.write(f"gate_failed={'true' if gate_failed else 'false'}\n")
          PY

      - name: Upload quality gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-ai-quality-gate-${{ github.run_id }}
          path: |
            artifacts/quality_gate/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## Nightly AI Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| GoogleTest total tests | ${{ steps.aggregate.outputs.gtest_total }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GoogleTest failures | ${{ steps.aggregate.outputs.gtest_failures }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Google Benchmark entries | ${{ steps.aggregate.outputs.bench_total }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate failed | ${{ steps.aggregate.outputs.gate_failed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/quality_gate/quality_gate_report.md ]; then
            cat artifacts/quality_gate/quality_gate_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update issue on gate failure
        if: >
          always() &&
          steps.aggregate.outputs.gate_failed == 'true' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.create_issue == 'true')
        uses: actions/github-script@v7
        env:
          INPUT_ISSUE_ASSIGNEES: ${{ github.event.inputs.issue_assignees }}
          INPUT_ISSUE_LABELS: ${{ github.event.inputs.issue_labels }}
        with:
          script: |
            const fs = require('fs');
            const branch = context.payload.workflow_run?.head_branch || context.ref.replace('refs/heads/', '');
            const title = `[Nightly Quality Gate] FAIL on ${branch}`;
            const summary = JSON.parse(fs.readFileSync('artifacts/quality_gate/quality_gate_summary.json', 'utf8'));
            const reportMd = fs.readFileSync('artifacts/quality_gate/quality_gate_report.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              '## Summary',
              '',
              'Nightly quality gate reported a failure and requires triage.',
              '',
              '## Gate Result',
              '',
              '- Status: FAIL',
              '- Failure criteria:',
              '  - GoogleTest failures > 0',
              '  - OR no GoogleTest JSON evidence',
              '  - OR no Google Benchmark JSON evidence',
              '',
              '## Run Metadata',
              '',
              `- Branch: ${branch}`,
              `- Commit: ${context.sha}`,
              `- Workflow run URL: ${runUrl}`,
              `- Trigger event: ${context.eventName}`,
              '',
              '## GoogleTest Metrics',
              '',
              `- JSON files: ${summary.gtest?.files ?? 0}`,
              `- Total tests: ${summary.gtest?.total_tests ?? 0}`,
              `- Total failures: ${summary.gtest?.total_failures ?? 0}`,
              '',
              '## Google Benchmark Metrics',
              '',
              `- JSON files: ${summary.benchmark?.files ?? 0}`,
              `- Total benchmark entries: ${summary.benchmark?.total_benchmarks ?? 0}`,
              '',
              '## Triage Checklist',
              '',
              '- [ ] Reproduce the failure locally or in rerun',
              '- [ ] Identify failing test/benchmark scope',
              '- [ ] Decide: code fix vs. flaky-infra mitigation',
              '- [ ] Add/update regression tests if needed',
              '- [ ] Verify nightly gate returns to PASS',
              '',
              '## Attached Report (Generated)',
              '',
              reportMd,
            ].join('\n');

            const parseCsv = (s) => (s || '')
              .split(',')
              .map(v => v.trim())
              .filter(Boolean);

            const branchLabel = branch === 'main' ? 'branch:main' : branch === 'develop' ? 'branch:develop' : `branch:${branch}`;
            const defaultLabels = ['nightly-quality-gate', 'ci', 'quality-gate', 'area:ai', branchLabel];
            const configuredLabels = parseCsv(process.env.INPUT_ISSUE_LABELS);
            const labels = Array.from(new Set([...defaultLabels, ...configuredLabels]));
            const assignees = parseCsv(process.env.INPUT_ISSUE_ASSIGNEES);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-quality-gate',
              per_page: 100
            });

            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                labels,
                assignees
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels,
                assignees
              });
              core.info(`Created issue #${created.data.number}`);
            }

      - name: Resolve nightly issue on gate recovery
        if: >
          always() &&
          steps.aggregate.outputs.gate_failed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.workflow_run?.head_branch || context.ref.replace('refs/heads/', '');
            const title = `[Nightly Quality Gate] FAIL on ${branch}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-quality-gate',
              per_page: 100
            });

            const existing = issues.find(i => i.title === title);
            if (!existing) {
              core.info('No open nightly issue to resolve.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Nightly quality gate recovered to PASS. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed'
            });
            core.info(`Closed recovered nightly issue #${existing.number}`);

      - name: Enforce gate result
        if: always()
        run: |
          if [ "${{ steps.aggregate.outputs.gate_failed }}" = "true" ]; then
            echo "::error::Nightly AI Quality Gate failed. See artifacts/quality_gate/quality_gate_summary.json"
            exit 1
          fi
