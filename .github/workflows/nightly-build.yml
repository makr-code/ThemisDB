name: Nightly Build & DockerHub Push

# Overnight builds for ThemisDB with automatic DockerHub push
# Runs daily at 2 AM UTC (overnight for most timezones)
# Can also be triggered manually for testing

on:
  schedule:
    # Run every day at 2:00 AM UTC (only if changes detected)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: 'Push to DockerHub'
        required: true
        type: boolean
        default: true
      build_platforms:
        description: 'Build platforms'
        required: true
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        default: 'linux/amd64'
      enable_llm:
        description: 'Enable LLM support (llama.cpp)'
        required: false
        type: boolean
        default: false
      force_build:
        description: 'Force build even without changes'
        required: false
        type: boolean
        default: false

# Prevent concurrent builds
concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: themisdb/server
  BUILD_TYPE: Release

permissions:
  contents: read
  packages: write

jobs:
  # Check if there are changes since last nightly build
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      should_build: ${{ steps.decision.outputs.should_build }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history to check for changes
      
      - name: Check for changes since yesterday
        id: changes
        run: |
          # Get commits from the last 24 hours
          SINCE_TIME=$(date -u -d '24 hours ago' '+%Y-%m-%d %H:%M:%S')
          RECENT_COMMITS=$(git log --since="$SINCE_TIME" --oneline | wc -l)
          
          echo "Commits in last 24 hours: $RECENT_COMMITS"
          
          if [ "$RECENT_COMMITS" -gt 0 ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in last 24 hours"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes detected in last 24 hours"
          fi
      
      - name: Determine if build should run
        id: decision
        run: |
          # Always build if manually triggered
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.force_build }}" = "true" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "✅ Manual trigger with force_build - will build"
            elif [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "✅ Manual trigger with changes - will build"
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "⏭️ Manual trigger without changes and force_build=false - skipping"
            fi
          # For scheduled runs, only build if there are changes
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "✅ Scheduled run with changes - will build"
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "⏭️ Scheduled run without changes - skipping build"
            fi
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Unknown trigger - will build"
          fi

  # Generate nightly changelog
  generate-changelog:
    name: Generate Nightly Changelog
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation
      
      - name: Generate changelog from recent changes
        id: changelog
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          
          # Get commits from last 24 hours
          SINCE_TIME=$(date -u -d '24 hours ago' '+%Y-%m-%d %H:%M:%S')
          
          # Create nightly changelog file
          CHANGELOG_FILE="NIGHTLY_CHANGELOG_${BUILD_DATE}.md"
          
          echo "# Nightly Build Changelog - $BUILD_DATE" > $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          echo "**Build Time**: $BUILD_TIME" >> $CHANGELOG_FILE
          echo "**Version**: $(cat VERSION 2>/dev/null || echo 'dev')" >> $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          echo "## Changes Since Last Build" >> $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          
          # Get list of commits
          COMMITS=$(git log --since="$SINCE_TIME" --pretty=format:"- %s (%h) - %an" --no-merges)
          
          if [ -n "$COMMITS" ]; then
            echo "### Commits" >> $CHANGELOG_FILE
            echo "" >> $CHANGELOG_FILE
            echo "$COMMITS" >> $CHANGELOG_FILE
            echo "" >> $CHANGELOG_FILE
          fi
          
          # Get changed files with stats
          echo "### Changed Files" >> $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          
          CHANGED_FILES=$(git diff --name-status HEAD@{24.hours.ago}..HEAD 2>/dev/null || git log --since="$SINCE_TIME" --name-status --pretty=format: | sort -u)
          
          if [ -n "$CHANGED_FILES" ]; then
            echo '```' >> $CHANGELOG_FILE
            echo "$CHANGED_FILES" | head -50 >> $CHANGELOG_FILE
            echo '```' >> $CHANGELOG_FILE
            echo "" >> $CHANGELOG_FILE
            
            # Count file types
            echo "### File Statistics" >> $CHANGELOG_FILE
            echo "" >> $CHANGELOG_FILE
            
            CPP_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(cpp|cc|cxx|hpp|h)$' | wc -l)
            PY_FILES=$(echo "$CHANGED_FILES" | grep '\.py$' | wc -l)
            MD_FILES=$(echo "$CHANGED_FILES" | grep '\.md$' | wc -l)
            YML_FILES=$(echo "$CHANGED_FILES" | grep -E '\.(yml|yaml)$' | wc -l)
            
            echo "- C++ files: $CPP_FILES" >> $CHANGELOG_FILE
            echo "- Python files: $PY_FILES" >> $CHANGELOG_FILE
            echo "- Markdown files: $MD_FILES" >> $CHANGELOG_FILE
            echo "- YAML files: $YML_FILES" >> $CHANGELOG_FILE
            echo "" >> $CHANGELOG_FILE
          fi
          
          # Analyze commit messages for categories
          echo "### Change Categories" >> $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          
          FEAT_COUNT=$(git log --since="$SINCE_TIME" --pretty=format:"%s" --no-merges | grep -iE '^(feat|feature|add)' | wc -l)
          FIX_COUNT=$(git log --since="$SINCE_TIME" --pretty=format:"%s" --no-merges | grep -iE '^(fix|bugfix)' | wc -l)
          DOCS_COUNT=$(git log --since="$SINCE_TIME" --pretty=format:"%s" --no-merges | grep -iE '^(docs|doc|documentation)' | wc -l)
          REFACTOR_COUNT=$(git log --since="$SINCE_TIME" --pretty=format:"%s" --no-merges | grep -iE '^(refactor|refact)' | wc -l)
          
          echo "- Features: $FEAT_COUNT commits" >> $CHANGELOG_FILE
          echo "- Bug Fixes: $FIX_COUNT commits" >> $CHANGELOG_FILE
          echo "- Documentation: $DOCS_COUNT commits" >> $CHANGELOG_FILE
          echo "- Refactoring: $REFACTOR_COUNT commits" >> $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          
          # Add footer
          echo "---" >> $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          echo "**Docker Tags Available**:" >> $CHANGELOG_FILE
          echo "- \`themisdb/server:nightly\`" >> $CHANGELOG_FILE
          echo "- \`themisdb/server:nightly-$(date -u +'%Y%m%d')\`" >> $CHANGELOG_FILE
          echo "- \`themisdb/server:$(cat VERSION 2>/dev/null || echo 'dev')-nightly\`" >> $CHANGELOG_FILE
          echo "" >> $CHANGELOG_FILE
          
          # Output for artifact upload
          echo "changelog_file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT
          
          # Display changelog
          echo "Generated changelog:"
          cat $CHANGELOG_FILE
      
      - name: Upload changelog as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-changelog
          path: NIGHTLY_CHANGELOG_*.md
          retention-days: 30
      
      - name: Commit changelog to repository
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%d')
          CHANGELOG_FILE="NIGHTLY_CHANGELOG_${BUILD_DATE}.md"
          
          # Configure git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Create nightly-changelogs directory if it doesn't exist
          mkdir -p nightly-changelogs
          mv $CHANGELOG_FILE nightly-changelogs/
          
          # Add and commit
          git add nightly-changelogs/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add nightly changelog for $BUILD_DATE [automated]"
            git push
          fi

  # Determine version and build metadata
  setup:
    name: Setup Build
    runs-on: ubuntu-latest
    needs: [check-changes, generate-changelog]
    if: needs.check-changes.outputs.should_build == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.date.outputs.date }}
      should_push: ${{ steps.push.outputs.should_push }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"
      
      - name: Get build date
        id: date
        run: |
          BUILD_DATE=$(date -u +'%Y%m%d')
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Build date: $BUILD_DATE"
      
      - name: Determine push strategy
        id: push
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
            echo "Scheduled build - will push to DockerHub"
          elif [ "${{ github.event.inputs.push_to_dockerhub }}" = "true" ]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
            echo "Manual trigger with push enabled"
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
            echo "Manual trigger without push"
          fi

  # Build ThemisDB binary
  build-binary:
    name: Build ThemisDB Binary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: setup
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h
      
      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg-cache
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-nightly-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-nightly-
            vcpkg-docker-build-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            git curl zip unzip tar pkg-config \
            autoconf automake libtool
      
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '2024.10.21'
      
      - name: Configure CMake
        run: |
          ENABLE_LLM="${{ github.event.inputs.enable_llm || 'false' }}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_STATIC_BUILD=OFF \
            -DTHEMIS_ENABLE_LLM=$([ "$ENABLE_LLM" = "true" ] && echo "ON" || echo "OFF")
      
      - name: Build ThemisDB
        run: |
          cmake --build build --target themis_server -j $(nproc)
          ls -lh build/themis_server
          file build/themis_server
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: themis_server_nightly
          path: build/themis_server
          retention-days: 7

  # Build and push Docker image
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, build-binary]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: themis_server_nightly
          path: build
      
      - name: Make binary executable
        run: chmod +x build/themis_server
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ github.event.inputs.build_platforms || 'linux/amd64' }}
      
      - name: Login to Docker Hub
        if: needs.setup.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.setup.outputs.build_date }}
            type=raw,value=${{ needs.setup.outputs.version }}-nightly
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.simple
          platforms: ${{ github.event.inputs.build_platforms || 'linux/amd64' }}
          push: ${{ needs.setup.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Generate build summary
        run: |
          echo "## Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: ${{ needs.setup.outputs.build_date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ github.event.inputs.build_platforms || 'linux/amd64' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.setup.outputs.should_push }}" = "true" ]; then
            echo "✅ **Image pushed to Docker Hub**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.IMAGE_NAME }}:nightly" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Image built locally (not pushed)**" >> $GITHUB_STEP_SUMMARY
          fi

  # Post-build notification
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [check-changes, setup, build-docker]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          # Check if build was skipped due to no changes
          if [ "${{ needs.check-changes.outputs.should_build }}" = "false" ]; then
            echo "⏭️ Nightly build skipped - no changes detected in last 24 hours"
            echo "To force a build, trigger manually with 'force_build' option enabled"
            exit 0
          fi
          
          # Check actual build status
          if [ "${{ needs.build-docker.result }}" = "success" ]; then
            echo "✅ Nightly build completed successfully"
            echo "Version: ${{ needs.setup.outputs.version }}"
            echo "Date: ${{ needs.setup.outputs.build_date }}"
            echo "📝 Nightly changelog generated and committed"
            if [ "${{ needs.setup.outputs.should_push }}" = "true" ]; then
              echo "Docker image pushed to: ${{ env.IMAGE_NAME }}:nightly"
            fi
          elif [ "${{ needs.build-docker.result }}" = "skipped" ]; then
            echo "⏭️ Build was skipped"
          else
            echo "❌ Nightly build failed"
            exit 1
          fi
