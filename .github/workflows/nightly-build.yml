name: Nightly Build & DockerHub Push

# Overnight builds for ThemisDB with automatic DockerHub push
# Runs daily at 2 AM UTC (overnight for most timezones)
# Can also be triggered manually for testing

on:
  schedule:
    # Run every day at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: 'Push to DockerHub'
        required: true
        type: boolean
        default: true
      build_platforms:
        description: 'Build platforms'
        required: true
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        default: 'linux/amd64'
      enable_llm:
        description: 'Enable LLM support (llama.cpp)'
        required: false
        type: boolean
        default: false

# Prevent concurrent builds
concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: themisdb/server
  BUILD_TYPE: Release

permissions:
  contents: read
  packages: write

jobs:
  # Determine version and build metadata
  setup:
    name: Setup Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_date: ${{ steps.date.outputs.date }}
      should_push: ${{ steps.push.outputs.should_push }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"
      
      - name: Get build date
        id: date
        run: |
          BUILD_DATE=$(date -u +'%Y%m%d')
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Build date: $BUILD_DATE"
      
      - name: Determine push strategy
        id: push
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
            echo "Scheduled build - will push to DockerHub"
          elif [ "${{ github.event.inputs.push_to_dockerhub }}" = "true" ]; then
            echo "should_push=true" >> $GITHUB_OUTPUT
            echo "Manual trigger with push enabled"
          else
            echo "should_push=false" >> $GITHUB_OUTPUT
            echo "Manual trigger without push"
          fi

  # Build ThemisDB binary
  build-binary:
    name: Build ThemisDB Binary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: setup
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "Disk space after cleanup:"
          df -h
      
      - name: Setup vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg-cache
            ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-nightly-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-nightly-
            vcpkg-docker-build-
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            git curl zip unzip tar pkg-config \
            autoconf automake libtool
      
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '2024.10.21'
      
      - name: Configure CMake
        run: |
          ENABLE_LLM="${{ github.event.inputs.enable_llm || 'false' }}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_STATIC_BUILD=OFF \
            -DTHEMIS_ENABLE_LLM=$([ "$ENABLE_LLM" = "true" ] && echo "ON" || echo "OFF")
      
      - name: Build ThemisDB
        run: |
          cmake --build build --target themis_server -j $(nproc)
          ls -lh build/themis_server
          file build/themis_server
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: themis_server_nightly
          path: build/themis_server
          retention-days: 7

  # Build and push Docker image
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [setup, build-binary]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: themis_server_nightly
          path: build
      
      - name: Make binary executable
        run: chmod +x build/themis_server
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ github.event.inputs.build_platforms || 'linux/amd64' }}
      
      - name: Login to Docker Hub
        if: needs.setup.outputs.should_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ needs.setup.outputs.build_date }}
            type=raw,value=${{ needs.setup.outputs.version }}-nightly
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.simple
          platforms: ${{ github.event.inputs.build_platforms || 'linux/amd64' }}
          push: ${{ needs.setup.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Generate build summary
        run: |
          echo "## Nightly Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: ${{ needs.setup.outputs.build_date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ github.event.inputs.build_platforms || 'linux/amd64' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.setup.outputs.should_push }}" = "true" ]; then
            echo "✅ **Image pushed to Docker Hub**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.IMAGE_NAME }}:nightly" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Image built locally (not pushed)**" >> $GITHUB_STEP_SUMMARY
          fi

  # Post-build notification
  notify:
    name: Build Notification
    runs-on: ubuntu-latest
    needs: [setup, build-docker]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build-docker.result }}" = "success" ]; then
            echo "✅ Nightly build completed successfully"
            echo "Version: ${{ needs.setup.outputs.version }}"
            echo "Date: ${{ needs.setup.outputs.build_date }}"
            if [ "${{ needs.setup.outputs.should_push }}" = "true" ]; then
              echo "Docker image pushed to: ${{ env.IMAGE_NAME }}:nightly"
            fi
          else
            echo "❌ Nightly build failed"
            exit 1
          fi
