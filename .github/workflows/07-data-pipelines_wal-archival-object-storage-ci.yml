name: WAL Archival to Object Storage CI

# Triggered on every push/PR that touches WALArchivalManager sources,
# its tests, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/replication/replication_manager.cpp'
      - 'include/replication/replication_manager.h'
      - 'tests/test_replication_ha.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_wal-archival-object-storage-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/replication/replication_manager.cpp'
      - 'include/replication/replication_manager.h'
      - 'tests/test_replication_ha.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/07-data-pipelines_wal-archival-object-storage-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the WALArchivalTest suite.
  # Tests cover:
  #   1. Archive and retrieve with compression (existing baseline)
  #   2. AES-256-GCM encryption at rest round-trip
  #   3. Combined compress + encrypt round-trip
  #   4. Missing/invalid key falls back to unencrypted storage
  #   5. Default storage tier is "standard"
  #   6. transitionStorageTiers() disabled when transition_to_cold_after_days=0
  #   7. Lifecycle: segment transitions to "cold" after threshold
  #   8. Lifecycle: segment transitions to "glacier" after triple threshold
  #   9. Index persistence of tier and encrypted fields across manager restarts
  # ---------------------------------------------------------------------------
  wal-archival-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: WAL Archival tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev libzstd-dev

      - name: Configure (replication HA focused test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build focused test binary
        run: cmake --build build --target test_replication_ha_focused -- -j$(nproc)

      - name: Run WALArchival unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex WALArchivalTest \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee wal_archival_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wal-archival-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/wal_archival_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📦 WAL Archival to Object Storage – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "WALArchivalManager: AES-256-GCM encryption at rest, storage tier tracking, lifecycle transitions (standard→cold→glacier), index persistence." >> "$GITHUB_STEP_SUMMARY"
