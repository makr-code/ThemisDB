name: "Gate: PR RAG Phase 8 (Observability SLO)"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'include/rag/realtime_slo_tracker.h'
      - 'include/rag/otel_span_emitter.h'
      - 'include/rag/cost_attribution_tracker.h'
      - 'src/rag/realtime_slo_tracker.cpp'
      - 'src/rag/otel_span_emitter.cpp'
      - 'src/rag/cost_attribution_tracker.cpp'
      - 'tests/rag/test_realtime_slo_tracker.cpp'
      - 'tests/rag/test_otel_span_emitter.cpp'
      - 'tests/rag/test_cost_attribution_tracker.cpp'
      - '.github/workflows/gate-pr-rag-phase8.yml'
      - '.github/workflows/reusable-rag-phase-gate.yml'

concurrency:
  group: rag-phase8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  issues: write
  checks: write

jobs:
  phase8_validation:
    uses: ./.github/workflows/reusable-rag-phase-gate.yml
    with:
      phase_id: "8"
      phase_title: "Phase 8 Observability SLO"
      headers_json: '["include/rag/realtime_slo_tracker.h","include/rag/otel_span_emitter.h","include/rag/cost_attribution_tracker.h"]'
      impls_json: '["src/rag/realtime_slo_tracker.cpp","src/rag/otel_span_emitter.cpp","src/rag/cost_attribution_tracker.cpp"]'
      tests_json: '["tests/rag/test_realtime_slo_tracker.cpp","tests/rag/test_otel_span_emitter.cpp","tests/rag/test_cost_attribution_tracker.cpp"]'
      grep_checks_json: '[{"file":"src/rag/realtime_slo_tracker.cpp","pattern":"RecordQuery|IsCompliant|GetHealthScore","error":"Core SLO methods not implemented"},{"file":"src/rag/otel_span_emitter.cpp","pattern":"SetAttribute|RecordEvent|EndSpan","error":"Span lifecycle methods not implemented"},{"file":"src/rag/cost_attribution_tracker.cpp","pattern":"RecordCost|GetTenantCost|GetBudgetAlerts","error":"Cost tracking methods not implemented"}]'
      labels_csv: "rag-phase8-validated,quality/observability"
