name: API Gateway Enhancements CI

# Triggered on every push/PR that touches RequestCoalescingManager,
# SmartRouter, or their tests.  Targets v1.7.0 / v1.8.0.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/server/request_coalescing.h'
      - 'src/server/request_coalescing.cpp'
      - 'include/server/smart_routing.h'
      - 'src/server/smart_routing.cpp'
      - 'tests/test_api_gateway_enhancements.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_networking_api-gateway-enhancements-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the APIGatewayEnhancements focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-RC-1  Single GET request reaches backend exactly once
  #   AC-RC-2  POST/non-safe methods bypass coalescing (always go to backend)
  #   AC-RC-3  Disabled manager is fully transparent
  #   AC-RC-4  Statistics (total/coalesced/backend_calls/fallbacks) updated correctly
  #   AC-RC-5  Concurrent duplicate requests share a single backend call
  #   AC-RC-6  Capacity fallback when max_waiters_per_key reached
  #   AC-RC-7  Stats JSON contains all required keys
  #   AC-SR-1  Backend registry: add / remove / list
  #   AC-SR-2  Route returns nullopt when no backends registered
  #   AC-SR-3  Least-loaded routing selects backend with fewest active connections
  #   AC-SR-4  High-tail-latency backend excluded when alternative exists
  #   AC-SR-5  All-high-tail scenario falls back to the only available backend
  #   AC-SR-6  Cache-hit prediction selects backend with highest hit count
  #   AC-SR-7  Cache prediction disabled → falls back to least-loaded
  #   AC-SR-8  route() applies cache prediction before least-loaded
  #   AC-SR-9  Per-backend stats JSON contains all required fields
  #   AC-SR-10 Concurrent record operations are data-race free
  # ---------------------------------------------------------------------------
  api-gateway-enhancements-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: API Gateway Enhancements (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run APIGatewayEnhancementsFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R APIGatewayEnhancementsFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee api_gateway_enhancements_ctest.txt

      # ── Full test filter via unified binary ────────────────────────────────
      - name: Run RequestCoalescingTest and SmartRoutingTest via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_api_gateway_enhancements_focused \
            --gtest_filter="RequestCoalescingTest*:SmartRoutingTest*" \
            --gtest_output="xml:api_gateway_enhancements_gtest.xml" \
            2>&1 | tee api_gateway_enhancements_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-enhancements-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/api_gateway_enhancements_ctest.txt
            build/api_gateway_enhancements_gtest.xml
            build/api_gateway_enhancements_gtest_output.txt
          retention-days: 30
