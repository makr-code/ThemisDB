name: CI - Widget Path

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no external publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      tag_name:
        description: "Release tag context (e.g. v2.4.0-alpha)"
        required: false
        type: string
      source_workflow:
        description: "Origin workflow name"
        required: false
        default: "CI - Release"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-widget-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  widget-dry-run:
    name: Widget Pipeline (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print widget context
        shell: bash
        run: |
          set -euo pipefail
          DRY_RUN="${{ inputs.dry_run || 'true' }}"
          TAG="${{ inputs.tag_name || github.ref_name }}"
          SOURCE="${{ inputs.source_workflow || 'CI - Release' }}"

          echo "============================================================"
          echo " CI - Widget Path"
          echo "============================================================"
          echo "  Dry run        : ${DRY_RUN}"
          echo "  Source workflow: ${SOURCE}"
          echo "  Tag context    : ${TAG}"
          echo "  Trigger        : ${{ github.event_name }}"
          echo "  Run ID         : ${{ github.run_id }}"
          echo "============================================================"

          mkdir -p widget
          cat > widget/widget-path.json <<EOF
          {
            "workflow": "ci-widget",
            "source_workflow": "${SOURCE}",
            "dry_run": "${DRY_RUN}",
            "tag": "${TAG}",
            "run_id": "${{ github.run_id }}",
            "sha": "${{ github.sha }}"
          }
          EOF

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run enabled: no publish side-effects executed."
          else
            echo "::warning::Non-dry-run path not implemented yet; keeping no-op behavior."
          fi

      - name: Upload widget dry-run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: widget-path-${{ github.run_number }}
          path: widget/widget-path.json
          retention-days: 14
          if-no-files-found: error
