name: "Reusable: PR Task Completion"

on:
  workflow_call:
    secrets:
      copilot-token:
        description: Copilot-enabled token used only for the read-only assessment job.
        required: false

permissions:
  contents: read

jobs:
  analyze:
    name: "Validate: Copilot Task Assessment"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      passed: ${{ steps.evaluate.outputs.passed }}
      comment_body: ${{ steps.evaluate.outputs.comment }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Collect PR, linked issue, and diff context
        id: collect-context
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v9.0.0
        env:
          CONTEXT_PATH: ${{ runner.temp }}/pr-task-context.json
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            if (!pr) {
              throw new Error('This workflow requires a pull_request_target event.');
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumbers = new Set();
            for (const match of (pr.body || '').matchAll(/(?:^|[^A-Za-z0-9_])#([0-9]+)\b/g)) {
              issueNumbers.add(Number(match[1]));
            }
            for (const match of (pr.body || '').matchAll(
              new RegExp(`https://github\\.com/${owner}/${repo}/issues/([0-9]+)`, 'g')
            )) {
              issueNumbers.add(Number(match[1]));
            }

            const linkedIssues = [];
            let truncated = false;
            const issueLimit = 5;
            const sortedIssueNumbers = [...issueNumbers].sort((a, b) => a - b);
            if (sortedIssueNumbers.length > issueLimit) truncated = true;
            for (const number of sortedIssueNumbers.slice(0, issueLimit)) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
              if (!data.pull_request) {
                linkedIssues.push({
                  number: data.number,
                  title: data.title || '',
                  body: data.body || ''
                });
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });
            const fileLimit = 80;
            if (files.length > fileLimit) truncated = true;
            const changedFiles = [];
            let diffChars = 0;
            const diffLimit = 30000;
            for (const file of files.slice(0, fileLimit)) {
              const patch = file.patch || '';
              if (diffChars + patch.length > diffLimit) {
                truncated = true;
                break;
              }
              diffChars += patch.length;
              changedFiles.push({
                path: file.filename,
                status: file.status,
                patch
              });
            }

            const bodyLimit = 12000;
            const prBody = pr.body || '';
            if (prBody.length > bodyLimit) truncated = true;
            for (const issue of linkedIssues) {
              if (issue.body.length > bodyLimit) truncated = true;
            }

            const payload = {
              pull_request: {
                number: pr.number,
                title: pr.title || '',
                body: prBody.slice(0, bodyLimit)
              },
              issues: linkedIssues.map(issue => ({
                number: issue.number,
                title: issue.title,
                body: issue.body.slice(0, bodyLimit)
              })),
              changed_files: changedFiles,
              truncated
            };
            fs.writeFileSync(process.env.CONTEXT_PATH, JSON.stringify(payload), { mode: 0o600 });

      - name: Prepare bounded Copilot prompt
        id: prepare
        env:
          CONTEXT_PATH: ${{ runner.temp }}/pr-task-context.json
          PROMPT_PATH: ${{ runner.temp }}/pr-task-prompt.txt
        run: |
          python3 tools/ci/pr_task_completion_gate.py prepare \
            --context "$CONTEXT_PATH" \
            --prompt "$PROMPT_PATH"

      - name: Verify Copilot credential is configured
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot-token }}
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::Configure the COPILOT_GITHUB_TOKEN repository secret to enable this required gate."
            exit 1
          fi

      - name: Set up Node.js for Copilot CLI
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned Copilot CLI
        run: npm install --global @github/copilot@1.0.114

      - name: Assess task completion with Copilot
        id: copilot
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          prompt-file: ${{ runner.temp }}/pr-task-prompt.txt
          system-prompt-file: .github/prompts/pr-task-completion-system.txt
          model: gpt-4.1
          token: ${{ secrets.copilot-token }}
          copilot-allow-tools: ""
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.copilot-token }}

      - name: Validate assessment and render report
        id: evaluate
        if: always()
        env:
          CONTEXT_PATH: ${{ runner.temp }}/pr-task-context.json
          RESPONSE_PATH: ${{ steps.copilot.outputs.response-file }}
          EVALUATION_OUTPUT_PATH: ${{ runner.temp }}/evaluation-output
          OUTPUT_PATH: ${{ runner.temp }}/pr-task-report.json
        run: |
          python3 tools/ci/pr_task_completion_gate.py evaluate \
            --context "$CONTEXT_PATH" \
            --response "$RESPONSE_PATH" \
            --output "$OUTPUT_PATH" \
            --github-output "$EVALUATION_OUTPUT_PATH"
          cat "$EVALUATION_OUTPUT_PATH" >> "$GITHUB_OUTPUT"

  publish-comment:
    name: "Validate: Publish Task Report"
    needs: [analyze]
    if: always() && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create or update the task-completion comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v9.0.0
        env:
          COMMENT_BODY: ${{ needs.analyze.outputs.comment_body }}
        with:
          script: |
            const marker = '<!-- pr-task-completion-gate -->';
            const body = process.env.COMMENT_BODY ||
              `${marker}\n## Copilot task completion review: BLOCKED\n\n` +
              'Assessment could not be completed. This gate fails closed; inspect the workflow run and configure its Copilot token.';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && (comment.body || '').includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  enforce-gate:
    name: "Validate: Enforce Task Completion"
    needs: [analyze, publish-comment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: none
    steps:
      - name: Enforce fail-closed verdict
        env:
          ANALYSIS_RESULT: ${{ needs.analyze.result }}
          PUBLISH_RESULT: ${{ needs.publish-comment.result }}
          PASSED: ${{ needs.analyze.outputs.passed }}
        run: |
          if [[ "$ANALYSIS_RESULT" != "success" || "$PUBLISH_RESULT" != "success" || "$PASSED" != "true" ]]; then
            echo "::error::PR task completion gate blocked. Review the Copilot report and resolve open or unverified tasks."
            exit 1
          fi
          echo "All assessed tasks are fulfilled."
