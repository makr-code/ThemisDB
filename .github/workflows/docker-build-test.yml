name: Docker Multi-Arch Build [Dry-Run]

# Docker multi-arch build workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Images are built but NOT pushed to any registry
#
# Integrated Build Variants:
# - Standard (Ubuntu 22.04): linux/amd64, linux/arm64
# - QNAP (Ubuntu 20.04): linux/amd64 (optimized for QNAP NAS)
# - Raspberry Pi (ARM64): linux/arm64 (via standard Dockerfile)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to registry (requires credentials)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===========================================================================
  # Standard Multi-Arch Build (Ubuntu 22.04)
  # Platforms: linux/amd64, linux/arm64
  # ===========================================================================
  build-standard:
    name: Standard Build (Multi-Arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "Building Standard Multi-Arch images (amd64 + arm64)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (Standard)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Standard Multi-Arch Image (Dry-Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=standard
          cache-to: type=gha,mode=max,scope=standard
          build-args: |
            QNAP_BUILD=OFF

      - name: Standard Build Summary
        run: |
          echo "## Standard Multi-Arch Build (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Image NOT pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dockerfile: \`Dockerfile\`" >> $GITHUB_STEP_SUMMARY
          echo "### Base: Ubuntu 22.04" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # QNAP Build (Ubuntu 20.04 for GLIBC 2.31 compatibility)
  # Platform: linux/amd64 (most QNAP NAS are x64)
  # ===========================================================================
  build-qnap:
    name: QNAP Build (x64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "Building QNAP-optimized image (Ubuntu 20.04, x64)"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (QNAP)
        id: meta-qnap
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-qnap,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=qnap,enable={{is_default_branch}}

      - name: Build QNAP Image (Dry-Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.qnap
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta-qnap.outputs.tags }}
          labels: ${{ steps.meta-qnap.outputs.labels }}
          cache-from: type=gha,scope=qnap
          cache-to: type=gha,mode=max,scope=qnap
          build-args: |
            VCPKG_TRIPLET=x64-linux

      - name: QNAP Build Summary
        run: |
          echo "## QNAP Build (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Image NOT pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dockerfile: \`Dockerfile.qnap\`" >> $GITHUB_STEP_SUMMARY
          echo "### Base: Ubuntu 20.04 (GLIBC 2.31)" >> $GITHUB_STEP_SUMMARY
          echo "### Optimizations: SSE4.2 baseline (no AVX)" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-qnap.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Raspberry Pi Build (ARM64)
  # Platform: linux/arm64
  # Uses standard Dockerfile with ARM64 triplet
  # ===========================================================================
  build-rpi:
    name: Raspberry Pi Build (ARM64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "Building Raspberry Pi ARM64 image"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (RPI)
        id: meta-rpi
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-rpi,onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=rpi,enable={{is_default_branch}}

      - name: Build Raspberry Pi Image (Dry-Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: false
          tags: ${{ steps.meta-rpi.outputs.tags }}
          labels: ${{ steps.meta-rpi.outputs.labels }}
          cache-from: type=gha,scope=rpi
          cache-to: type=gha,mode=max,scope=rpi
          build-args: |
            TARGETARCH=arm64
            VCPKG_TRIPLET=arm64-linux
            QNAP_BUILD=OFF

      - name: Raspberry Pi Build Summary
        run: |
          echo "## Raspberry Pi Build (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Image NOT pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dockerfile: \`Dockerfile\`" >> $GITHUB_STEP_SUMMARY
          echo "### Base: Ubuntu 22.04" >> $GITHUB_STEP_SUMMARY
          echo "### Target: Raspberry Pi 4/5 (64-bit)" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-rpi.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Build Summary Job
  # ===========================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-standard, build-qnap, build-rpi]
    if: always()
    
    steps:
      - name: Generate Final Summary
        run: |
          echo "# 🐳 Docker Multi-Arch Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - No images were pushed to registries" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Dockerfile | Base | Platforms | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------------|------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Standard | \`Dockerfile\` | Ubuntu 22.04 | amd64, arm64 | ${{ needs.build-standard.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| QNAP | \`Dockerfile.qnap\` | Ubuntu 20.04 | amd64 | ${{ needs.build-qnap.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Raspberry Pi | \`Dockerfile\` | Ubuntu 22.04 | arm64 | ${{ needs.build-rpi.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Available Tags (when published)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`latest\` | Latest stable (multi-arch: amd64+arm64) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`<version>\` | Specific version (multi-arch) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`qnap\` | QNAP NAS optimized (x64) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`<version>-qnap\` | QNAP specific version |" >> $GITHUB_STEP_SUMMARY
          echo "| \`rpi\` | Raspberry Pi optimized (arm64) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`<version>-rpi\` | Raspberry Pi specific version |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## To Enable Publishing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Add repository secrets:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`DOCKERHUB_USERNAME\`: Docker Hub username" >> $GITHUB_STEP_SUMMARY
          echo "   - \`DOCKERHUB_TOKEN\`: Docker Hub access token" >> $GITHUB_STEP_SUMMARY
          echo "2. Use workflow dispatch with \`push_images: true\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Or modify workflow to enable push on releases" >> $GITHUB_STEP_SUMMARY

