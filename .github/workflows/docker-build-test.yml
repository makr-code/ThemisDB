name: Docker Build [Dry-Run]

# Docker multi-arch build workflow (dry-run mode)
# 🔶 DRY-RUN MODE - Images are built but NOT pushed to any registry

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # Only read, not write (dry-run mode)
    
    steps:
      - name: 🔶 Dry-Run Notice
        run: |
          echo "🔶 DRY-RUN MODE - No actual publishing"
          echo "This workflow builds Docker images but does NOT push them."
          echo "To enable publishing, change 'push: false' to 'push: true'"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            # TODO: Add Docker Hub image for production releases
            # docker.io/themisdb/themisdb
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build Docker image (Dry-Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          # TODO: Enable multi-arch for production releases
          # platforms: linux/amd64,linux/arm64
          push: false  # TODO: Change to 'true' for production releases
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push=false

      - name: Simulated Tag Output
        run: |
          echo "## Docker Build Summary (DRY-RUN)" >> $GITHUB_STEP_SUMMARY
          echo "🔶 **DRY-RUN MODE** - Image NOT pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags that would be created:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- linux/amd64 (built)" >> $GITHUB_STEP_SUMMARY
          echo "- linux/arm64 (TODO: enable for production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To enable publishing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Add Docker Hub and GHCR credentials as secrets" >> $GITHUB_STEP_SUMMARY
          echo "2. Change \`push: false\` to \`push: true\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Add login steps for registries" >> $GITHUB_STEP_SUMMARY

      # TODO: Uncomment for production releases
