name: Distributed Cache Integration CI

# Triggered on every push/PR that touches the RedisCache sources,
# its test file, or this workflow itself.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/core/concerns/redis_cache.cpp'
      - 'include/core/concerns/redis_cache.h'
      - 'include/core/concerns/concerns_context.h'
      - 'src/core/concerns/concerns_context.cpp'
      - 'include/core/config_validator.h'
      - 'tests/test_distributed_cache_integration.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/06-infrastructure_distributed_distributed-cache-integration-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated DistributedCacheIntegration focused test suite.
  # Tests cover all seven acceptance criteria (AC-1 to AC-7):
  #   AC-1  Cluster-wide cache invalidation
  #   AC-2  Consistent hashing for distributed keys (URL parsing, ring properties)
  #   AC-3  TTL support
  #   AC-4  Pub/sub for cache invalidation messages
  #   AC-5  Query result caching across nodes (graceful degradation)
  #   AC-6  Session state management
  #   AC-7  Distributed rate limiting state
  # ---------------------------------------------------------------------------
  distributed-cache-integration-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Distributed cache integration tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            compiler: GCC-13
          - os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            compiler: GCC-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev libssl-dev librocksdb-dev libspdlog-dev libfmt-dev libyaml-cpp-dev libtbb-dev libboost-all-dev libsimdjson-dev libsnappy-dev liblz4-dev

      - name: Configure (distributed cache integration test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_BUILD_TESTS=ON

      - name: Build focused test binary
        run: cmake --build build --target test_distributed_cache_integration_focused -- -j$(nproc)

      - name: Run focused tests
        run: |
          cd build
          ctest --test-dir . -R DistributedCacheIntegrationFocusedTests \
                --output-on-failure --timeout 60
