name: SAGA Orchestration Engine CI

# Triggered on every push/PR that touches the SAGAOrchestrator sources or tests.
# Targets milestone v1.8.0.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/transaction/saga_orchestrator.h'
      - 'src/transaction/saga_orchestrator.cpp'
      - 'tests/test_saga_orchestrator.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_transactions_transaction-saga-orchestration-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the SAGAOrchestrator focused test suite.
  # Tests cover all acceptance criteria:
  #   AC-1  Parallel step execution (DAG-based)
  #   AC-2  Conditional branching (steps with/without compensation)
  #   AC-3  Retry policies per step
  #   AC-4  Timeout management
  #   AC-5  SAGA templates (registerTemplate / getTemplate)
  #   AC-6  Automatic dependency resolution
  #   AC-7  Compensation runs in reverse execution order (LIFO)
  #   AC-8  validate() rejects empty name
  #   AC-9  validate() rejects empty steps
  #   AC-10 validate() rejects duplicate step names
  #   AC-11 validate() rejects unknown depends_on reference
  #   AC-12 validate() detects dependency cycles
  #   AC-13 Single-step SAGA success path
  #   AC-14 Multi-step sequential SAGA success path
  #   AC-15 Multi-step parallel SAGA success path (DAG wave execution)
  #   AC-16 Step failure triggers compensation of preceding steps
  #   AC-17 Step without compensate is skipped during compensation
  #   AC-18 Retry retries up to max_retries times before failing
  #   AC-19 Step timeout fires and returns error
  #   AC-20 Metrics: sagas_started / sagas_completed / sagas_failed / sagas_compensated
  #   AC-21 Metrics: total_step_executions, total_retries, total_timeout_aborts
  #   AC-22 getStatus() returns per-step states after execution
  #   AC-23 getStatus() returns empty struct for unknown saga_id
  #   AC-24 Concurrent independent SAGAs all complete successfully
  #   AC-25 Performance: parallel SAGA faster than sequential equivalent
  # ---------------------------------------------------------------------------
  saga-orchestration-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: SAGA Orchestration (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev
            libboost-all-dev
            librocksdb-dev
            libfmt-dev
            libtbb-dev
            libspdlog-dev
            nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run SAGAOrchestratorFocusedTests via ctest
        run: |
          set -o pipefail
          cd build
          ctest -R SAGAOrchestratorFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee saga_orchestrator_ctest.txt

      # ── Full test filter via focused binary ───────────────────────────────
      - name: Run all SAGAOrchestratorTest groups
        run: |
          set -o pipefail
          cd build
          ./tests/test_saga_orchestrator_focused \
            --gtest_filter="SAGAOrchestratorTest*" \
            --gtest_output="xml:saga_orchestrator_gtest.xml" \
            2>&1 | tee saga_orchestrator_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saga-orchestration-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/saga_orchestrator_ctest.txt
            build/saga_orchestrator_gtest.xml
            build/saga_orchestrator_gtest_output.txt
          retention-days: 30
