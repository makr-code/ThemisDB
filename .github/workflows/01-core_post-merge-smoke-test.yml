name: 🚦 Post-Merge Smoke Test

# Runs on every push to main / develop regardless of which files changed.
# Purpose: fast sanity check that the 10 most critical modules still build
# and pass their unit tests after a merge.  Individual feature-module CI
# (02-, 06-, 07- categories) only runs on pull_request; this workflow
# compensates by covering the critical path on the merged branch.

on:
  schedule:
    - cron: '0 20 * * *'  # Daily at 20:00 UTC (22:00 CEST)
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake build type'
        required: false
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

concurrency:
  group: post-merge-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  BUILD_TYPE: ${{ inputs.build_type || 'Debug' }}

# ─────────────────────────────────────────────────────────────────────────────
# Single fast job – gcc-14 on ubuntu-24.04 (avoids matrix overhead)
# Covers the 10 critical modules listed below:
#   1. Core framework    (build-info, module-loader, wire-protocol)
#   2. Security & Auth   (RBAC, JWT, access-control)
#   3. Query Engine      (AQL parser, query-federation)
#   4. Index             (HNSW / ANN base)
#   5. Storage           (WAL, base storage layer)
#   6. Sharding          (epoch-fencing, sharding-manager)
#   7. Temporal          (temporal-query-engine)
#   8. API               (gRPC server)
#   9. Analytics         (forecasting core)
#  10. Exporters         (data-augmentation / JSONL)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  smoke-test:
    name: Smoke Test · ubuntu-24.04 / gcc-14
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: gcc-14
          cxx: g++-14
          extra-packages: >
            libssl-dev libcurl4-openssl-dev libboost-all-dev
            librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev
            nlohmann-json3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Smoke · Python tools (8.3)
        run: |
          set -o pipefail
          python tools/python_tools/admin/tsmoke.py --headless --action run --format text \
            2>&1 | tee build/smoke_python_tools.txt

      - name: Configure CMake (COMMUNITY edition)
        uses: ./.github/actions/configure-themis
        with:
          cc: gcc-14
          cxx: g++-14
          build-type: ${{ env.BUILD_TYPE }}
          build-tests: 'ON'
          edition: 'COMMUNITY'

      - name: Build smoke-test targets
        run: |
          set -o pipefail
          cd build
          cmake --build . --config ${{ env.BUILD_TYPE }} \
            --target themis_tests \
            -- -j$(nproc) 2>&1 | tee smoke_build.log
          echo "Build exit code: $?"

      # ── 1. Core framework ──────────────────────────────────────────────
      - name: Smoke · Core framework
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="BuildConfiguration*:BuildInfo*:ModuleQuery*:ModuleLoader*:ModuleRegistry*:WireV2*:V2Frame*" \
            --gtest_output="xml:smoke_core.xml" \
            2>&1 | tee smoke_core.txt

      # ── 2. Security & Auth ─────────────────────────────────────────────
      - name: Smoke · Security & Auth
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="JWTValidationTest*:RBACTest*:RBACNegativeTest*:PermissionTest*:AccessControlTest*" \
            --gtest_output="xml:smoke_security.xml" \
            2>&1 | tee smoke_security.txt

      # ── 3. Query Engine ────────────────────────────────────────────────
      - name: Smoke · Query Engine
        run: |
          set -o pipefail
          cd build
          ctest -R "AQLQueryTests|AQLParserTests|QueryFederationTests|QueryPlannerTests" \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee smoke_query.txt

      # ── 4. Index ───────────────────────────────────────────────────────
      - name: Smoke · Index
        run: |
          set -o pipefail
          cd build
          ctest -R "HNSWIndexTests|ANNIndexTests|MatryoshkaTruncationTests" \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee smoke_index.txt

      # ── 5. Sharding & Epoch Fencing ────────────────────────────────────
      - name: Smoke · Sharding
        run: |
          set -o pipefail
          cd build
          ctest -R "EpochFencingTests|ShardingManagerTests|QueryFederationRoutingFocusedTests" \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee smoke_sharding.txt

      # ── 6. Temporal ────────────────────────────────────────────────────
      - name: Smoke · Temporal Query Engine
        run: |
          set -o pipefail
          cd build
          ctest -R "TemporalQueryEngineFocusedTests|BiTemporalTests" \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee smoke_temporal.txt

      # ── 7. API / gRPC ──────────────────────────────────────────────────
      - name: Smoke · API & gRPC
        run: |
          set -o pipefail
          cd build
          ctest -R "GrpcApiServerTests|ThemisDBGrpcServiceTests" \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee smoke_api.txt

      # ── 8. Analytics ───────────────────────────────────────────────────
      - name: Smoke · Analytics / Forecasting
        run: |
          set -o pipefail
          cd build
          ctest -R "ForecastingBatchStreamingTests|ForecastingModelTests" \
            --output-on-failure \
            --timeout 60 \
            2>&1 | tee smoke_analytics.txt

      # ── Upload results ─────────────────────────────────────────────────
      - name: Upload smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-${{ github.sha }}
          path: |
            build/smoke_*.xml
            build/smoke_*.txt
            build/smoke_build.log
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Smoke Test Results
          path: build/smoke_*.xml
          reporter: java-junit
          fail-on-error: true
