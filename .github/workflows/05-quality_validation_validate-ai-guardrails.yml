name: Validate AI-Guardrails

on:
  workflow_run:
    workflows: ["🚦 Post-Merge Smoke Test"]
    types: [completed]
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/copilot-instructions.md'
      - '.github/copilot/**'
      - '.github/scripts/validate_copilot_refs.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  validate-copilot-instructions:
    needs: ci-scope-classifier
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule') ||
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_config_changes == 'true'
    name: Validate Copilot Instructions
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate file references
        run: |
          python .github/scripts/validate_copilot_refs.py
      
      - name: Check file size
        run: |
          MAIN_FILE=".github/copilot-instructions.md"
          LINE_COUNT=$(wc -l < "$MAIN_FILE")
          echo "Main file has $LINE_COUNT lines"
          
          if [ "$LINE_COUNT" -gt 300 ]; then
            echo "❌ Error: Main copilot-instructions.md is too large ($LINE_COUNT lines)"
            echo "Target is under 200 lines. Consider moving content to module files."
            exit 1
          else
            echo "✅ File size check passed ($LINE_COUNT/300 lines)"
          fi
      
      - name: Check for broken links
        run: |
          echo "Checking for broken internal links..."
          
          # Check all markdown files in .github
          find .github -name "*.md" -not -path "*/.git/*" | while read -r file; do
            echo "Checking $file..."
            
            # Extract markdown links [text](path)
            grep -oP '\[([^\]]+)\]\(([^)]+)\)' "$file" || true | while read -r link; do
              path=$(echo "$link" | grep -oP '\]\(\K[^)]+')
              
              # Skip external links
              if [[ "$path" =~ ^https?:// ]] || [[ "$path" =~ ^mailto: ]] || [[ "$path" =~ ^# ]]; then
                continue
              fi
              
              # Remove anchors
              clean_path="${path%%#*}"
              
              if [ -n "$clean_path" ]; then
                # Resolve relative to file's directory
                dir=$(dirname "$file")
                full_path="$dir/$clean_path"
                
                if [ ! -f "$full_path" ] && [ ! -d "$full_path" ]; then
                  echo "❌ Broken link in $file: $path"
                  exit 1
                fi
              fi
            done
          done
          
          echo "✅ No broken links found"

      - name: Write job summary
        if: always()
        run: |
          echo "## 🤖 AI Guardrails – Copilot Instructions Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Script** | \`.github/scripts/validate_copilot_refs.py\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks: file references, file size (≤300 lines), broken internal links." >> "$GITHUB_STEP_SUMMARY"
  
  lint-markdown:
    needs: ci-scope-classifier
    if: >
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_config_changes == 'true'
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run markdownlint
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .github/*.md .github/copilot/*.md
          config_file: .markdownlint.json
          ignore_files: .github/copilot-instructions.md.backup
        continue-on-error: true

      - name: Write job summary
        if: always()
        run: |
          echo "## 📝 AI Guardrails – Markdown Lint" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Files** | \`.github/*.md\`, \`.github/copilot/*.md\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Config** | \`.markdownlint.json\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
  
  check-structure:
    needs: ci-scope-classifier
    if: >
      needs.ci-scope-classifier.outputs.has_doc_only_changes == 'true' ||
      needs.ci-scope-classifier.outputs.has_config_changes == 'true'
    name: Check Module Structure
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify required modules exist
        run: |
          echo "Checking for required Copilot modules..."
          
          REQUIRED_MODULES=(
            "BRANCHING_GUIDE.md"
            "BUILD_GUIDE.md"
            "CODE_STANDARDS.md"
            "TESTING_GUIDE.md"
            "CROSS_COMPILATION_CONTEXT.md"
            "VSCODE_CONTEXT.md"
          )
          
          missing_count=0
          for module in "${REQUIRED_MODULES[@]}"; do
            if [ ! -f ".github/copilot/$module" ]; then
              echo "❌ Missing required module: $module"
              missing_count=$((missing_count + 1))
            else
              echo "✅ Found: $module"
            fi
          done
          
          if [ $missing_count -gt 0 ]; then
            echo ""
            echo "❌ Error: $missing_count required module(s) missing"
            exit 1
          fi
          
          echo ""
          echo "✅ All required modules present"

      - name: Write job summary
        if: always()
        run: |
          echo "## 🏗️ AI Guardrails – Module Structure Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Directory** | \`.github/copilot/\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Required modules: BRANCHING_GUIDE, BUILD_GUIDE, CODE_STANDARDS, TESTING_GUIDE, CROSS_COMPILATION_CONTEXT, VSCODE_CONTEXT" >> "$GITHUB_STEP_SUMMARY"
