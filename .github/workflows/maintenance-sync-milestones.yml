name: "[Manual] Sync Milestones from Roadmap"

# ---------------------------------------------------------------------------
# ROOT-LEVEL TRIGGER
# ------------------
# This file exists at the root of .github/workflows/ so that it appears in
# the GitHub Web UI and GitHub App under the Actions tab.
#
# GitHub only shows workflow_dispatch triggers for workflows directly in
# .github/workflows/. The real implementation lives in:
#   .github/workflows/08-maintenance/sync-milestones.yml
#
# This wrapper captures the inputs and dispatches the actual workflow via
# the GitHub CLI.
#
# ALTERNATIVE: GitHub CLI
#   gh workflow run "08-maintenance/sync-milestones.yml" \
#     --repo makr-code/ThemisDB --ref main \
#     --field dry_run=true
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (show what would change, no writes)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      audit_only:
        description: "Only generate docs/issue-milestone-audit.md (no milestone writes)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      verbose:
        description: "Verbose output (one line per issue)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      ref:
        description: "Branch, tag, or SHA to run on (default: main)"
        required: false
        default: "main"
        type: string

permissions:
  actions: write

jobs:
  trigger:
    name: "Trigger › 08-maintenance/sync-milestones.yml"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "08-maintenance/sync-milestones.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ inputs.ref }}" \
            --field "dry_run=${{ inputs.dry_run }}" \
            --field "audit_only=${{ inputs.audit_only }}" \
            --field "verbose=${{ inputs.verbose }}"

          echo "✅ Dispatched 08-maintenance/sync-milestones.yml"
          echo "   dry_run    : ${{ inputs.dry_run }}"
          echo "   audit_only : ${{ inputs.audit_only }}"
          echo "   verbose    : ${{ inputs.verbose }}"
          echo "   ref        : ${{ inputs.ref }}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🏁 [Manual] Sync Milestones from Roadmap" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | \`${{ inputs.dry_run }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Audit only** | \`${{ inputs.audit_only }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Verbose** | \`${{ inputs.verbose }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target workflow** | \`08-maintenance/sync-milestones.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
