name: UDP Server (Ingestion) CI

# Triggered on every push / PR that touches the UDP Server sources
# (header, implementation, tests) or this workflow.  Targets v1.8.0.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/network/udp_server.h'
      - 'src/network/udp_server.cpp'
      - 'tests/test_udp_server.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/udp-server-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/network/udp_server.h'
      - 'src/network/udp_server.cpp'
      - 'tests/test_udp_server.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/udp-server-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the UDPServerFocusedTests suite.
  #
  # Tests cover all acceptance criteria:
  #   AC-1  UDP server for high-throughput ingestion
  #   AC-2  Connection-less protocol (no handshake overhead)
  #   AC-3  Suitable for metrics, logs, events (METRIC/LOG/EVENT/BATCH opcodes)
  #   AC-4  Optional reliability via application-level ACKs (enable_acks + FLAG_ACK_REQUESTED)
  #   AC-5  Packet loss tolerance (fire-and-forget, no flow control)
  #   AC-6  Metrics ingestion (Prometheus remote write, StatsD) via METRIC opcode
  #   AC-7  Log aggregation (syslog, structured logs) via LOG opcode
  #   AC-8  IoT sensor data ingestion via METRIC/EVENT opcodes
  #   AC-9  Real-time event streaming via EVENT/BATCH opcodes
  #   AC-10 High-frequency trading data feeds via METRIC opcode
  #   AC-11 Use Boost.Asio UDP sockets
  #   AC-12 Application-level ACKs (optional, per-config or per-packet flag)
  #   AC-13 Packet deduplication via sequence numbers (sliding window per source IP)
  #   AC-14 Rate limiting per source IP
  #   AC-15 Metrics for packet loss monitoring (Stats struct)
  # ---------------------------------------------------------------------------
  udp-server-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: UDP Server (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            ${{ matrix.cxx }} ${{ matrix.cc }} \
            libgtest-dev \
            libssl-dev \
            librocksdb-dev \
            libboost-all-dev \
            libfmt-dev \
            libtbb-dev \
            libspdlog-dev \
            nlohmann-json3-dev \
            libzstd-dev \
            liblz4-dev \
            pkg-config

      - name: Configure CMake (COMMUNITY edition)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHEMIS_EDITION=COMMUNITY \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DBUILD_TESTING=ON \
            -DBUILD_BENCHMARKS=OFF

      - name: Build test_udp_server_focused
        run: |
          cmake --build build \
            --target test_udp_server_focused \
            --parallel 4

      - name: Run UDPServerFocusedTests (CTest)
        run: |
          set -o pipefail
          cd build
          ctest -R UDPServerFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee udp_server_ctest_results.txt

      - name: Run all UDP Server tests via focused binary
        run: |
          set -o pipefail
          cd build
          ./tests/test_udp_server_focused \
            --gtest_filter="UDPServer*" \
            --gtest_output="xml:udp_server_test_results.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: udp-server-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/udp_server_ctest_results.txt
            build/udp_server_test_results.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Documentation / interface gate: verify API surface in header
  # ---------------------------------------------------------------------------
  udp-server-docs-gate:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: UDP Server — Documentation Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify UDP Server header present
        run: |
          test -f include/network/udp_server.h && \
            echo "✅ include/network/udp_server.h found" || \
            (echo "❌ include/network/udp_server.h missing" && exit 1)

      - name: Verify UDP Server implementation present
        run: |
          test -f src/network/udp_server.cpp && \
            echo "✅ src/network/udp_server.cpp found" || \
            (echo "❌ src/network/udp_server.cpp missing" && exit 1)

      - name: Verify test file present
        run: |
          test -f tests/test_udp_server.cpp && \
            echo "✅ tests/test_udp_server.cpp found" || \
            (echo "❌ tests/test_udp_server.cpp missing" && exit 1)

      - name: Verify TM magic bytes declared
        run: |
          grep -q "kUdpServerMagic0" include/network/udp_server.h && \
            echo "✅ kUdpServerMagic0 found" || \
            (echo "❌ kUdpServerMagic0 missing" && exit 1)
          grep -q "kUdpServerMagic1" include/network/udp_server.h && \
            echo "✅ kUdpServerMagic1 found" || \
            (echo "❌ kUdpServerMagic1 missing" && exit 1)

      - name: Verify ingestion opcodes declared
        run: |
          grep -q "METRIC" include/network/udp_server.h && \
            echo "✅ METRIC opcode found" || \
            (echo "❌ METRIC opcode missing" && exit 1)
          grep -q "LOG" include/network/udp_server.h && \
            echo "✅ LOG opcode found" || \
            (echo "❌ LOG opcode missing" && exit 1)
          grep -q "EVENT" include/network/udp_server.h && \
            echo "✅ EVENT opcode found" || \
            (echo "❌ EVENT opcode missing" && exit 1)
          grep -q "BATCH" include/network/udp_server.h && \
            echo "✅ BATCH opcode found" || \
            (echo "❌ BATCH opcode missing" && exit 1)

      - name: Verify ACK support declared
        run: |
          grep -q "enable_acks" include/network/udp_server.h && \
            echo "✅ enable_acks config field found" || \
            (echo "❌ enable_acks missing from Config" && exit 1)
          grep -q "kUdpServerFlagAckRequested" include/network/udp_server.h && \
            echo "✅ kUdpServerFlagAckRequested flag found" || \
            (echo "❌ kUdpServerFlagAckRequested missing" && exit 1)
          grep -q "buildAck" include/network/udp_server.h && \
            echo "✅ buildAck() method found" || \
            (echo "❌ buildAck() missing" && exit 1)

      - name: Verify batching support declared
        run: |
          grep -q "enable_batching" include/network/udp_server.h && \
            echo "✅ enable_batching config field found" || \
            (echo "❌ enable_batching missing from Config" && exit 1)
          grep -q "batch_interval_ms" include/network/udp_server.h && \
            echo "✅ batch_interval_ms config field found" || \
            (echo "❌ batch_interval_ms missing from Config" && exit 1)

      - name: Verify rate limiting declared
        run: |
          grep -q "max_packets_per_second_per_ip" include/network/udp_server.h && \
            echo "✅ max_packets_per_second_per_ip config field found" || \
            (echo "❌ max_packets_per_second_per_ip missing from Config" && exit 1)

      - name: Verify deduplication declared
        run: |
          grep -q "dedup_window_size" include/network/udp_server.h && \
            echo "✅ dedup_window_size config field found" || \
            (echo "❌ dedup_window_size missing from Config" && exit 1)

      - name: Verify Stats struct for packet loss monitoring
        run: |
          grep -q "duplicate_drops" include/network/udp_server.h && \
            echo "✅ duplicate_drops stat found" || \
            (echo "❌ duplicate_drops missing from Stats" && exit 1)
          grep -q "rate_limit_drops" include/network/udp_server.h && \
            echo "✅ rate_limit_drops stat found" || \
            (echo "❌ rate_limit_drops missing from Stats" && exit 1)

      - name: Verify UDPServer lifecycle API declared
        run: |
          grep -q "void start" include/network/udp_server.h && \
            echo "✅ UDPServer::start() declared" || \
            (echo "❌ UDPServer::start() missing" && exit 1)
          grep -q "void stop" include/network/udp_server.h && \
            echo "✅ UDPServer::stop() declared" || \
            (echo "❌ UDPServer::stop() missing" && exit 1)
          grep -q "isRunning" include/network/udp_server.h && \
            echo "✅ UDPServer::isRunning() declared" || \
            (echo "❌ UDPServer::isRunning() missing" && exit 1)

      - name: Write job summary
        if: always()
        run: |
          echo "## 📡 UDP Ingestion Server (v1.8.0) — Documentation Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Protocol header present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Implementation source present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test file present | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TM magic bytes (0x54 0x4D) | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Opcodes: METRIC/LOG/EVENT/BATCH | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ACK support: enable_acks + FLAG_ACK_REQUESTED + buildAck | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Batching: enable_batching + batch_interval_ms | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rate limiting: max_packets_per_second_per_ip | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deduplication: dedup_window_size | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Packet loss monitoring: duplicate_drops + rate_limit_drops | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lifecycle: start/stop/isRunning | ✅ |" >> "$GITHUB_STEP_SUMMARY"
