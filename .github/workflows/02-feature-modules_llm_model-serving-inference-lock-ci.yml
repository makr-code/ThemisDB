name: ModelServingEngine Inference Under Registry Lock CI

# Triggered on every push / PR that touches the model-serving sources,
# its test file, or this workflow itself.
# Targets v1.8.0 (roadmap:43:analytics:v1.8.0:4-modelservingenginepredict-inference-under-registry-lock).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/analytics/model_serving.h'
      - 'src/analytics/model_serving.cpp'
      - 'tests/analytics/test_model_serving.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_model-serving-inference-lock-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/analytics/model_serving.h'
      - 'src/analytics/model_serving.cpp'
      - 'tests/analytics/test_model_serving.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_llm_model-serving-inference-lock-ci.yml'
  workflow_dispatch:

concurrency:
  group: model-serving-inference-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated ModelServingFocusedTests suite.
  # Tests cover all acceptance criteria:
  #   AC-1  predict() captures shared_ptr and releases registry lock before inference
  #   AC-2  predictBatch() applies same lock-release pattern
  #   AC-3  predictProba() applies same lock-release pattern
  #   AC-4  Registry uses shared_ptr<Entry>; Entry survives concurrent unregisterModel()
  #   AC-5  healthMetrics() releases registry lock before taking health_mu
  #   AC-6  serializeModel() releases registry lock before serializing
  #   AC-7  Concurrent predict() + unregisterModel() does not crash or deadlock
  #   AC-8  All existing functional tests still pass
  #   AC-9  Throughput benchmark: 16 threads ≥ 10 000 predictions/s/core (opt-in: THEMIS_RUN_PERF_TESTS=1)
  # ---------------------------------------------------------------------------
  model-serving-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: ModelServing tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            libssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev
            libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-target: test_model_serving_focused

      # ── Focused test target (AC-1 through AC-8) ───────────────────────────
      - name: Run ModelServingFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R ModelServingFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee model_serving_results.txt

      # ── Throughput benchmark (AC-9, opt-in) ───────────────────────────────
      # Performance test skips unless THEMIS_RUN_PERF_TESTS=1.
      - name: Run model-serving throughput benchmark (opt-in)
        env:
          THEMIS_RUN_PERF_TESTS: "1"
        run: |
          set -o pipefail
          cd build
          timeout 60 ./test_model_serving_focused \
            --gtest_filter="*Throughput*" \
            --gtest_output="xml:model_serving_bench.xml" \
            2>&1 | tee model_serving_bench_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-serving-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/model_serving_results.txt
            build/model_serving_bench.xml
            build/model_serving_bench_output.txt
          retention-days: 30
