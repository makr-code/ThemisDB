name: "[Manual] CI Scope Classifier (Debug)"

# ---------------------------------------------------------------------------
# ROOT-LEVEL TRIGGER
# ------------------
# This file exists at the root of .github/workflows/ so that it appears in
# the GitHub Web UI and GitHub App under the Actions tab.
#
# GitHub only shows workflow_dispatch triggers for workflows directly in
# .github/workflows/. The real implementation lives in:
#   .github/workflows/01-core_ci-scope-classifier.yml
#
# The CI Scope Classifier is normally called as a reusable workflow by other
# CI pipelines (via workflow_call). Use this wrapper to run it standalone
# for testing or debugging the classification logic on a specific branch.
#
# ALTERNATIVE: GitHub CLI
#   gh workflow run "01-core/ci-scope-classifier.yml" \
#     --repo makr-code/ThemisDB --ref main
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to classify (default: main)"
        required: false
        default: "main"
        type: string

permissions:
  actions: write

jobs:
  trigger:
    name: "Trigger › 01-core/ci-scope-classifier.yml"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "01-core/ci-scope-classifier.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ inputs.ref }}"

          echo "✅ Dispatched 01-core/ci-scope-classifier.yml"
          echo "   ref : ${{ inputs.ref }}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔍 [Manual] CI Scope Classifier (Debug)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ref** | \`${{ inputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target workflow** | \`01-core/ci-scope-classifier.yml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Timestamp** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ℹ️ This workflow is normally called automatically by other CI pipelines." >> "$GITHUB_STEP_SUMMARY"
          echo "> Use standalone runs only for testing or debugging the classifier." >> "$GITHUB_STEP_SUMMARY"
