name: RS Repair Engine Parallelisation CI

# Triggered on every push / PR that touches the repair engine sources,
# shard_resource_manager, slo_monitor, or their test files.
# Targets v1.6.0 (Issue #204).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/sharding/shard_repair_engine.h'
      - 'src/sharding/shard_repair_engine.cpp'
      - 'include/sharding/shard_resource_manager.h'
      - 'src/sharding/shard_resource_manager.cpp'
      - 'include/sharding/slo_monitor.h'
      - 'src/sharding/slo_monitor.cpp'
      - 'include/utils/thread_pool_manager.h'
      - 'src/utils/thread_pool_manager.cpp'
      - 'include/utils/rate_limiter.h'
      - 'tests/test_sharding_repair.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_rs-repair-engine-parallelisation-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/sharding/shard_repair_engine.h'
      - 'src/sharding/shard_repair_engine.cpp'
      - 'include/sharding/shard_resource_manager.h'
      - 'src/sharding/shard_resource_manager.cpp'
      - 'include/sharding/slo_monitor.h'
      - 'src/sharding/slo_monitor.cpp'
      - 'include/utils/thread_pool_manager.h'
      - 'src/utils/thread_pool_manager.cpp'
      - 'include/utils/rate_limiter.h'
      - 'tests/test_sharding_repair.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_storage_rs-repair-engine-parallelisation-ci.yml'

concurrency:
  group: rs-repair-parallelisation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  rs-repair-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: RS Repair Parallelisation (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libssl-dev libcurl4-openssl-dev libboost-all-dev librocksdb-dev libfmt-dev libtbb-dev libspdlog-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:  ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}

      # ── Focused test target ────────────────────────────────────────────────
      - name: Run RSRepairParallelisationFocusedTests
        run: |
          set -o pipefail
          cd build
          ctest -R RSRepairParallelisationFocusedTests \
                --output-on-failure \
                --timeout 120 \
                2>&1 | tee rs_repair_results.txt

      # ── Broader validation via unified binary ──────────────────────────────
      - name: Run RS Repair Parallelisation tests via unified binary
        run: |
          set -o pipefail
          cd build
          ./tests/themis_tests \
            --gtest_filter="ParallelRepairScanTest*:SLOMonitorRepairProgressTest*:ShardResourceManagerGPUTest*:ShardResourceManagerIOPSTest*" \
            --gtest_output="xml:rs_repair_gtest.xml" \
            2>&1 | tee rs_repair_gtest_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs-repair-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/rs_repair_results.txt
            build/rs_repair_gtest.xml
            build/rs_repair_gtest_output.txt
          retention-days: 30
