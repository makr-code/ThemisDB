name: Nightly Benchmark Sweep

# Modulewise benchmark sweeps for modules 2–35 (PERFORMANCE_EXPECTATIONS.md §1.4, Maßnahme #10).
# Modules 34 (Temporal) and 35 (Process Mining) added 2026-04-15 (Wave-2 reference benchmarks).
#
# • Runs every night at 02:00 UTC and on manual dispatch.
# • Uses the `nightly-bench-sweep` CMake preset (inherits linux-ninja-perf,
#   CPU-only, LLM stub models, all bench targets).
# • Produces per-module JSON benchmark results, a traffic-light coverage report
#   (🟢/🟡/🔴) with delta comparison against the previous run, and uploads
#   everything as a workflow artifact.
# • CI-Audit checks 10a (schedule exists) and 10b (nightly-bench-sweep preset
#   present) are satisfied by this file and by CMakePresets.json respectively.

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC — modules 2..35 sweep (§1.4 Maßnahme #10)
  workflow_run:
    workflows: ["🚦 Post-Merge Smoke Test"]
    types: [completed]
    branches:
      - community
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Let nightly runs complete; don't cancel mid-sweep

jobs:
  sweep:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    name: Nightly Benchmark Sweep
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ARTIFACT_DIR: artifacts/nightly
      STORAGE_MODULE2_REQUIRED_CASE: BM_Storage_SustainedWrite_NoSync

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Install benchmark analysis dependencies if available
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare artifact directory
        run: mkdir -p "$ARTIFACT_DIR/audit"

      # -------------------------------------------------------------------------
      # LLM / LoRA / gguf artefact preparation (Maßnahme #6)
      # Must run before the CMake build so THEMIS_MODEL_DIR is set for all
      # subsequent steps.  Uses stub models so no GPU / HuggingFace download is
      # required on standard CI runners.
      # -------------------------------------------------------------------------
      - name: Prepare LLM/LoRA benchmark artefacts (stub mode)
        run: |
          set -o pipefail
          bash scripts/download_models.sh --stub-only \
            2>&1 | tee "$ARTIFACT_DIR/artifact_prep.log"
          echo "THEMIS_MODEL_DIR=$THEMIS_MODEL_DIR" >> "$GITHUB_ENV"
          echo "THEMIS_LLM_STUB_MODELS=ON"          >> "$GITHUB_ENV"

      # -------------------------------------------------------------------------
      # CMake configuration using nightly-bench-sweep preset.
      # Falls back gracefully when the full C++ build environment is not
      # available (e.g. missing vcpkg/dependencies): we still run the Python-
      # based coverage report so the CI-audit checks always have fresh data.
      # -------------------------------------------------------------------------
      - name: Configure (nightly-bench-sweep preset)
        id: cmake_configure
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --preset nightly-bench-sweep 2>&1 | tee "$ARTIFACT_DIR/cmake_configure.log"
          echo "cmake_ok=$?" >> "$GITHUB_OUTPUT"

      - name: Build all bench targets
        id: cmake_build
        if: steps.cmake_configure.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build-gcc-linux-nightly --target all -j$(nproc) 2>&1 | tee "$ARTIFACT_DIR/cmake_build.log"

      # -------------------------------------------------------------------------
      # Run every bench_* binary that was produced and store JSON output.
      # -------------------------------------------------------------------------
      - name: Run benchmark sweep
        if: steps.cmake_build.outcome == 'success'
        run: |
          set -o pipefail
          shopt -s nullglob
          BENCH_COUNT=0
          BENCH_FAILED=0
          for bench in build-gcc-linux-nightly/bench_*; do
            [ -x "$bench" ] || continue
            name=$(basename "$bench")
            out="$ARTIFACT_DIR/${name}.json"
            echo "▶ Running $name …"
            if "$bench" \
                --benchmark_format=json \
                --benchmark_out="$out" \
                --benchmark_min_time=0.1s \
                2>&1 | tee "$ARTIFACT_DIR/${name}.run.log"; then
              echo "  ✅ $name"
            else
              echo "  ⚠️  $name exited with $? (non-zero exit treated as warning)"
              BENCH_FAILED=$((BENCH_FAILED + 1))
            fi
            BENCH_COUNT=$((BENCH_COUNT + 1))
          done
          echo "BENCH_COUNT=$BENCH_COUNT" >> "$GITHUB_ENV"
          echo "BENCH_FAILED=$BENCH_FAILED" >> "$GITHUB_ENV"
          echo "Ran $BENCH_COUNT benchmarks, $BENCH_FAILED reported non-zero exit."

      - name: Validate Module 2 (Storage) required case
        if: steps.cmake_build.outcome == 'success'
        run: |
          python3 - << 'PY'
          import json
          import os
          import pathlib
          import sys

          required_case = os.environ["STORAGE_MODULE2_REQUIRED_CASE"]
          result_file = pathlib.Path(os.environ["ARTIFACT_DIR"]) / "bench_storage_performance.json"
          if not result_file.exists():
              print(f"❌ Missing required benchmark output: {result_file}")
              sys.exit(1)

          data = json.loads(result_file.read_text(encoding="utf-8"))
          names = [b.get("name", "") for b in data.get("benchmarks", [])]
          case_present = any(name == required_case or name.startswith(f"{required_case}/") for name in names)
          if not case_present:
              print(f"❌ Required storage case not found: {required_case}")
              sys.exit(1)

          print(f"✅ Required storage case found: {required_case}")
          PY

      # -------------------------------------------------------------------------
      # Additional ASan pass for dynamic runtime memory checks in nightly CI.
      # -------------------------------------------------------------------------
      - name: Configure (nightly-bench-sweep-asan preset)
        id: cmake_configure_asan
        if: steps.cmake_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --preset nightly-bench-sweep-asan 2>&1 | tee "$ARTIFACT_DIR/cmake_configure_asan.log"

      - name: Build ASan bench targets
        id: cmake_build_asan
        if: steps.cmake_configure_asan.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build-gcc-linux-nightly-asan --target all -j$(nproc) 2>&1 | tee "$ARTIFACT_DIR/cmake_build_asan.log"

      - name: Run ASan smoke benchmark
        if: steps.cmake_build_asan.outcome == 'success'
        run: |
          set -o pipefail
          shopt -s nullglob
          benches=(build-gcc-linux-nightly-asan/bench_*)
          if [ "${#benches[@]}" -eq 0 ]; then
            echo "❌ No ASan benchmark binaries found in build-gcc-linux-nightly-asan/"
            exit 1
          fi
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1:abort_on_error=1
          bench="${benches[0]}"
          echo "▶ Running ASan smoke benchmark: $(basename "$bench")"
          "$bench" \
            --benchmark_min_time=0.05s \
            --benchmark_filter='.*' \
            2>&1 | tee "$ARTIFACT_DIR/asan_smoke.log"

      # -------------------------------------------------------------------------
      # Download the previous nightly artifact for delta comparison.
      # Failure here is non-fatal – the report simply shows "no previous run".
      # -------------------------------------------------------------------------
      - name: Download previous nightly artifact (for delta comparison)
        id: prev_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: nightly-bench-report-previous
          path: artifacts/nightly-prev

      # -------------------------------------------------------------------------
      # Generate traffic-light coverage report (🟢/🟡/🔴) per module.
      # -------------------------------------------------------------------------
      - name: Generate coverage report
        run: |
          set -o pipefail
          PREV_DIR=""
          if [ -d artifacts/nightly-prev ]; then
            PREV_DIR="--prev-dir artifacts/nightly-prev"
          fi
          python3 tools/bench_coverage_report.py \
            --bench-dir "$ARTIFACT_DIR" \
            --output-dir "$ARTIFACT_DIR/audit" \
            $PREV_DIR \
            2>&1 | tee "$ARTIFACT_DIR/audit/coverage_report.log"

      # -------------------------------------------------------------------------
      # Validate goal-to-benchmark mapping (Check 7a) and append result to
      # the job summary so coverage % is always visible after each nightly run.
      # -------------------------------------------------------------------------
      - name: Verify goal-to-benchmark mapping (Check 7a)
        if: always()
        run: |
          set -o pipefail
          python3 tools/verify_benchmark_mapping.py \
            2>&1 | tee "$ARTIFACT_DIR/audit/mapping_check.log"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🗺️ Goal-to-Benchmark Mapping (Check 7a)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_DIR/audit/mapping_check.log" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------------
      # Save current results so the next nightly run can use them for delta.
      # -------------------------------------------------------------------------
      - name: Upload current results as "previous" reference for next run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench-report-previous
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 2
          overwrite: true

      # -------------------------------------------------------------------------
      # Upload the full nightly report artifact.
      # -------------------------------------------------------------------------
      - name: Upload nightly bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench-report-${{ github.run_number }}
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 30

      # -------------------------------------------------------------------------
      # Write a GitHub Step Summary with the coverage report.
      # -------------------------------------------------------------------------
      - name: Write job summary
        if: always()
        run: |
          echo "## 🌙 Nightly Benchmark Sweep — \`${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **CMake preset** | \`nightly-bench-sweep\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Benchmarks run** | \`${BENCH_COUNT:-n/a}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Benchmarks with non-zero exit** | \`${BENCH_FAILED:-n/a}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **ASan configure** | \`${{ steps.cmake_configure_asan.outcome || 'skipped' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **ASan build** | \`${{ steps.cmake_build_asan.outcome || 'skipped' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$ARTIFACT_DIR/audit/coverage_report.md" ]; then
            cat "$ARTIFACT_DIR/audit/coverage_report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Coverage report not available._" >> "$GITHUB_STEP_SUMMARY"
          fi
