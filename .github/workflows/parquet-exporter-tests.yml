name: Parquet Exporter Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/exporters/parquet_exporter.cpp'
      - 'src/exporters/exporter_metrics.cpp'
      - 'src/exporters/pii_detector.cpp'
      - 'src/exporters/stream_writer.cpp'
      - 'include/exporters/parquet_exporter.h'
      - 'include/exporters/exporter_interface.h'
      - 'include/exporters/exporter_metrics.h'
      - 'include/exporters/pii_detector.h'
      - 'tests/exporters/test_parquet_exporter.cpp'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/parquet-exporter-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/exporters/parquet_exporter.cpp'
      - 'src/exporters/exporter_metrics.cpp'
      - 'src/exporters/pii_detector.cpp'
      - 'src/exporters/stream_writer.cpp'
      - 'include/exporters/parquet_exporter.h'
      - 'include/exporters/exporter_interface.h'
      - 'include/exporters/exporter_metrics.h'
      - 'include/exporters/pii_detector.h'
      - 'tests/exporters/test_parquet_exporter.cpp'
      - 'cmake/ModularBuild.cmake'
      - '.github/workflows/parquet-exporter-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build & run the Parquet exporter test suite (no external DB or Arrow needed)
  # ---------------------------------------------------------------------------
  parquet-exporter-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Parquet exporter unit tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
            arrow_enabled: false
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
            arrow_enabled: false
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14
            arrow_enabled: false
          # Arrow-enabled path: tests the Apache Arrow code path (#ifdef ARROW_ENABLED).
          # Requires libarrow-dev and libparquet-dev packages available on ubuntu-24.04.
          - os: ubuntu-24.04
            compiler: gcc-14-arrow
            cc: gcc-14
            cxx: g++-14
            arrow_enabled: true

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Apache Arrow and Parquet libraries (Arrow path only)
        if: matrix.arrow_enabled
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libarrow-dev libparquet-dev

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: nlohmann-json3-dev

      - name: Configure (parquet exporter tests only)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      # Build only the unified test binary (all test_*.cpp files are compiled in)
      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      - name: Run parquet exporter unit tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="ParquetExporterTest.*" \
            --gtest_output="xml:parquet_exporter_test_results.xml" \
            2>&1 | tee parquet_exporter_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parquet-exporter-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/parquet_exporter_test_results.xml
            build/parquet_exporter_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 📦 Parquet Exporter Tests – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Parquet exporter: configurable Arrow schema, column hints, PII redaction, tenant isolation, metrics." >> "$GITHUB_STEP_SUMMARY"
