name: security-scan

on:
  push:
    branches:
      - develop
      - community
    paths:
      - 'src/**'
      - 'include/**'
      - '.github/workflows/security-scan.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/security-scanning.yml'
  pull_request:
    branches:
      - develop
      - community
    paths:
      - 'src/**'
      - 'include/**'
      - '.github/workflows/security-scan.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/security-scanning.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Security scan compatibility marker
        run: |
          echo "Compatibility workflow restored at .github/workflows/security-scan.yml"
          echo "Canonical security workflows: codeql.yml and security-scanning.yml"
