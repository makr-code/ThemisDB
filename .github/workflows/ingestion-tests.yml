name: Ingestion Module Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/ingestion/**'
      - 'include/ingestion/**'
      - 'tests/test_ingestion_*.cpp'
      - '.github/workflows/ingestion-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/ingestion/**'
      - 'include/ingestion/**'
      - 'tests/test_ingestion_*.cpp'
      - '.github/workflows/ingestion-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build & run the ingestion module unit tests (no external services needed)
  # ---------------------------------------------------------------------------
  ingestion-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Ingestion unit tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-14
            cc: gcc-14
            cxx: g++-14

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: libcurl4-openssl-dev libssl-dev

      - name: Configure (ingestion tests only)
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF

      - name: Build test binary
        run: cmake --build build --target themis_tests -- -j$(nproc)

      - name: Run ingestion unit tests
        run: |
          cd build
          ./tests/themis_tests \
            --gtest_filter="OAuthConfigTest*:GenericApiConnectorOAuthTest*:HuggingFaceConnectorOAuthTest*:ApiConnectorTest*:ApiConnectorCursorTest*:ApiConnectorSchemaTest*:HuggingFaceConnector*:IngestionManagerTest*:IngestionManagerApiTest*:IngestionManagerDryRunTest*:IngestionManagerErrorsTest*:IngestionManagerParallelTest*:IngestionManagerPauseResumeTest*:IngestionManagerPluginTest*:IngestionManagerQuarantineTest*:IngestionManagerRateLimitTest*:IngestionManagerRetryTest*:IngestionManagerSchemaTest*:IngestionManagerSchemaE2ETest*:IngestionManagerAdapterTest*:IngestionBuilderTest*:IngestionBuilderApiSourceTest*:IngestionBuilderPluginTest*:IngestionBuilderSchemaTest*:IngestionStatsTest*:IngestionStatsCorrelationIdTest*:IngestionReportTest*:IngestionErrorTest*:IngestionMetricsTest*:IngestionMetricsExporterTest*:IngestionMetricsExporterErrorCodeTest*:IngestionMetricsExporterSourceTypeTest*:IngestionMetricsQuotaTest*:IngestionPipelineTest*:IngestionResilienceTest*:IngestionResilienceConcurrencyTest*:IngestionAdminApiTest*:IngestionPluginSourceTypeTest*:CheckpointTest*:RateLimitConfigTest*:RetryConfigTest*:QuarantineEntryTest*:QuarantineRetryTest*:QuarantineRetrySuccessCountTest*:SchemaConfigTest*:SchemaMetricsTest*:DocumentValidationResultTest*:KafkaConnectorTest*:ObjectStorageConnectorTest*:DatabaseConnectorTest*:CdcConnectorTest*:WebCrawlerConnectorTest*:FileSystemIngesterErrorsTest*:FileSystemIngesterFormatsTest*:FSIngesterSchemaTest*:BinaryMimeDetectionTest*:BinaryConverterTest*:IsConverterSafeTest*:IngestionCoordinatorTest*:IngestionCoordinatorAggregateTest*:IngestionCoordinatorCallbackTest*:IngestionCoordinatorErrorKeyTest*:IngestionCoordinatorIngestTest*:IngestionCoordinatorLeaderTest*:IngestionCoordinatorLifecycleTest*:IngestionCoordinatorMetricsTest*:IngestionCoordinatorNodesTest*:IngestionCoordinatorPartitionTest*:IngestionCoordinatorShutdownTest*:ConnectorPluginRegistryTest*:ConsistentHashRingTest*:InProcessLeaderElectionTest*:InProcessWorkerNodeTest*:ReconfigureSourceTest*:AdminApiReconfigureSourceTest*:RejectInvalidFalseTest*:SourcePreviewTest*:FileSystemIntegrationTest*:HuggingFaceIntegrationTest*:GenericApiIntegrationTest*:MultiSourceIntegrationTest*" \
            --gtest_output="xml:ingestion_test_results.xml" \
            2>&1 | tee ingestion_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/ingestion_test_results.xml
            build/ingestion_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔄 Ingestion Module Tests – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ingestion connectors tested: GenericApiConnector (OAuth, offset/cursor pagination)," >> "$GITHUB_STEP_SUMMARY"
          echo "HuggingFaceConnector (OAuth, batch/streaming), Kafka, ObjectStorage, Database," >> "$GITHUB_STEP_SUMMARY"
          echo "WebCrawler, CDC, FileSystem – plus IngestionManager, IngestionBuilder," >> "$GITHUB_STEP_SUMMARY"
          echo "IngestionCoordinator, schema validation, quarantine, metrics, and checkpoint tests." >> "$GITHUB_STEP_SUMMARY"
          echo "Integration tests: FileSystemIntegrationTest, HuggingFaceIntegrationTest," >> "$GITHUB_STEP_SUMMARY"
          echo "GenericApiIntegrationTest, MultiSourceIntegrationTest." >> "$GITHUB_STEP_SUMMARY"
