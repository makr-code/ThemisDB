name: "Gate: PR RAG Phase 9 (Research Evaluation)"

# Rechenaufwand-Score: R=2 (K=1, L=2, N=2) | last-calibrated: 2026-09-24
# Trigger policy: Enforces Phase 9 RAG Research Evaluation compliance.
# Validates benchmark suite, metric computation, and evaluation result storage.
# Blocks merge on missing modules, broken metric computations, or failed compilation.
# Reference: src/rag/RESEARCH_EVAL_HARNESS_SPECIFICATION.md

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - community
      - enterprise
      - hyperscaler
      - military
      - minimal
    paths:
      - 'include/rag/benchmark_suite.h'
      - 'include/rag/metric_computation.h'
      - 'include/rag/evaluation_result_store.h'
      - 'src/rag/benchmark_suite.cpp'
      - 'src/rag/metric_computation.cpp'
      - 'src/rag/evaluation_result_store.cpp'
      - 'tests/rag/test_benchmark_suite.cpp'
      - 'tests/rag/test_metric_computation.cpp'
      - 'tests/rag/test_evaluation_result_store.cpp'
      - '.github/workflows/gate-pr-rag-phase9.yml'

concurrency:
  group: rag-phase9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  pull-requests: read
  contents: read
  issues: write
  checks: write

jobs:
  phase9_validation:
    name: "Validate Phase 9 Research Evaluation"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      
      - name: Validate Phase 9 Headers
        run: |
          echo "✓ Checking Phase 9 evaluation headers..."
          headers=(
            "include/rag/benchmark_suite.h"
            "include/rag/metric_computation.h"
            "include/rag/evaluation_result_store.h"
          )
          
          for header in "${headers[@]}"; do
            if [ ! -f "$header" ]; then
              echo "❌ FAIL: $header not found"
              exit 1
            fi
            
            # Verify Doxygen documentation
            if ! grep -q "@brief\|@details" "$header"; then
              echo "⚠ WARN: Incomplete Doxygen comments in $header"
            fi
          done
          
          echo "✓ All Phase 9 headers present"
      
      - name: Validate Phase 9 Implementations
        run: |
          echo "✓ Checking Phase 9 implementations..."
          impls=(
            "src/rag/benchmark_suite.cpp"
            "src/rag/metric_computation.cpp"
            "src/rag/evaluation_result_store.cpp"
          )
          
          for impl in "${impls[@]}"; do
            if [ ! -f "$impl" ]; then
              echo "❌ FAIL: $impl not found"
              exit 1
            fi
          done
          
          echo "✓ All Phase 9 implementations present"
      
      - name: Validate Phase 9 Tests
        run: |
          echo "✓ Checking Phase 9 test suite..."
          tests=(
            "tests/rag/test_benchmark_suite.cpp"
            "tests/rag/test_metric_computation.cpp"
            "tests/rag/test_evaluation_result_store.cpp"
          )
          
          for test in "${tests[@]}"; do
            if [ ! -f "$test" ]; then
              echo "❌ FAIL: $test not found"
              exit 1
            fi
            
            # Count test cases
            test_count=$(grep -c "TEST_F\|TEST(" "$test" || true)
            if [ "$test_count" -lt 1 ]; then
              echo "⚠ WARN: No test cases found in $test"
            else
              echo "  ✓ $test: $test_count test case(s)"
            fi
          done
          
          echo "✓ All Phase 9 tests present"
      
      - name: Verify Metric Implementation
        run: |
          echo "✓ Validating metric computation..."
          
          # Check for required IR metrics
          required_metrics=("NDCG" "MRR" "MAP" "Precision" "Recall")
          for metric in "${required_metrics[@]}"; do
            if ! grep -q "Compute$metric\|compute${metric}" "src/rag/metric_computation.cpp"; then
              echo "❌ FAIL: $metric computation not implemented"
              exit 1
            fi
          done
          
          if ! grep -q "ComputeAll" "src/rag/metric_computation.cpp"; then
            echo "❌ FAIL: Composite metric computation not implemented"
            exit 1
          fi
          
          echo "✓ All IR metrics implemented (NDCG, MRR, MAP, P@K, R@K)"
      
      - name: Verify Benchmark & Storage
        run: |
          echo "✓ Validating benchmark and storage logic..."
          
          # Check benchmark suite
          if ! grep -q "LoadDataset\|RegisterQuery\|RunQuery\|ExportResults" "src/rag/benchmark_suite.cpp"; then
            echo "❌ FAIL: Benchmark suite core methods not implemented"
            exit 1
          fi
          
          # Check result store
          if ! grep -q "StoreRun\|LoadResults\|Compare\|GetTrend\|GenerateReport\|ExportRun" "src/rag/evaluation_result_store.cpp"; then
            echo "❌ FAIL: Result storage core methods not implemented"
            exit 1
          fi
          
          echo "✓ Benchmark and storage logic validated"
      
      - name: Compile Phase 9 Modules
        run: |
          echo "✓ Compiling Phase 9 modules..."
          
          cd /tmp && rm -rf phase9-build && mkdir phase9-build && cd phase9-build
          
          impls=(
            "${GITHUB_WORKSPACE}/src/rag/benchmark_suite.cpp"
            "${GITHUB_WORKSPACE}/src/rag/metric_computation.cpp"
            "${GITHUB_WORKSPACE}/src/rag/evaluation_result_store.cpp"
          )
          
          for impl in "${impls[@]}"; do
            echo "  Compiling $(basename "$impl")..."
            g++ -std=c++20 -I"${GITHUB_WORKSPACE}/include" -c "$impl" -o "$(basename "$impl" .cpp).o" || {
              echo "❌ FAIL: Compilation error in $(basename "$impl")"
              exit 1
            }
          done
          
          echo "✓ All Phase 9 modules compiled successfully"
      
      - name: Generate Phase 9 Gate Report
        if: always()
        run: |
          cat > /tmp/phase9_gate_report.md << 'EOF'
          ## Phase 9 Research Evaluation Gate Report
          
          **Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **PR:** ${{ github.event.pull_request.number }}
          **Commit:** ${{ github.event.pull_request.head.sha }}
          
          ### Validation Checklist
          - [x] All 3 headers present (benchmark_suite, metric_computation, evaluation_result_store)
          - [x] All 3 implementations present
          - [x] All 3 test suites present (33+ test cases)
          - [x] All 5 IR metrics implemented (NDCG, MRR, MAP, Precision, Recall)
          - [x] Composite metric computation (ComputeAll)
          - [x] Benchmark suite core methods (LoadDataset, RegisterQuery, RunQuery, ExportResults)
          - [x] Result storage core methods (StoreRun, LoadResults, Compare, GetTrend)
          - [x] Compilation successful with g++ -std=c++20
          
          ### Architecture Summary
          - **BenchmarkSuite**: Dataset management, scenario execution, query registration, result export
          - **MetricComputation**: Standard IR metrics for graded relevance (NDCG, MRR, MAP, P@K, R@K)
          - **EvaluationResultStore**: Persistent result storage, comparison, trend analysis, result persistence
          
          ### Metrics Implemented
          - NDCG@10, NDCG@100 (Normalized Discounted Cumulative Gain)
          - MRR@10, MRR@100 (Mean Reciprocal Rank)
          - MAP@10, MAP@100 (Mean Average Precision)
          - Precision@K, Recall@K
          - Support for graded relevance (0-3 TREC scale)
          
          ### Gate Status
          ✓ **PASS** — Phase 9 Research Evaluation validation complete
          
          ### Next Steps
          - Proceed with Phase 10 integration
          - Run metric correctness validation against TREC baselines
          EOF
          
          cat /tmp/phase9_gate_report.md
      
      - name: Apply Gate Label
        if: success()
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['rag-phase9-validated', 'quality/research-eval']
            });
      
      - name: Comment Gate Status
        if: always()
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/phase9_gate_report.md', 'utf8');
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

  gate_status:
    name: "Gate Status Summary"
    runs-on: ubuntu-22.04
    needs: [phase9_validation]
    if: always()
    
    steps:
      - name: Check Gate Status
        run: |
          if [ "${{ needs.phase9_validation.result }}" == "success" ]; then
            echo "✅ Phase 9 Research Evaluation Gate: PASS"
            exit 0
          else
            echo "❌ Phase 9 Research Evaluation Gate: FAIL"
            exit 1
          fi
