name: Error-Handling Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'include/**'
      - 'apps/**'
      - 'tools/**'
      - 'scripts/**'
      - 'clients/**'
      - 'plugins/**'
      - 'tools/error_handling_audit.py'
      - 'tools/error_handling_audit.ignore'
      - 'tests/test_error_handling_audit.py'
      - '.github/workflows/05-quality_build_error-handling-audit.yml'
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC – full repo-wide error-handling audit
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Error-Handling Compliance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests for the audit tool
        run: |
          pip install pytest --quiet
          python -m pytest tests/test_error_handling_audit.py -v

      - name: Run error-handling audit
        # The --max-violations budget is set to the violation count at the time this
        # workflow was introduced (2026-02). The intent is to ratchet this number down
        # over time as the migration documented in docs/error_handling/ progresses.
        # A PR that introduces NEW violations will push the count above the budget and
        # fail this job.  To tighten enforcement: lower N here and fix the violations.
        run: |
          python tools/error_handling_audit.py \
            --ignore-file tools/error_handling_audit.ignore \
            --format text \
            --no-color \
            --max-violations 819 \
            src include apps tools scripts clients plugins

      - name: Write job summary
        if: always()
        run: |
          echo "## 🛡️ Error-Handling Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Max violations budget** | 819 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Scope** | \`src\`, \`include\`, \`apps\`, \`tools\`, \`scripts\`, \`clients\`, \`plugins\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Violation budget is ratcheted down over time as the error-handling migration progresses." >> "$GITHUB_STEP_SUMMARY"
