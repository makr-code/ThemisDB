name: "Release: Windows Distro Approval Gate"

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  contents: read
  actions: write

concurrency:
  group: release-windows-distro-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  windows_distro_publish_from_issue:
    name: "Publish: Windows Distro Packages on Approval Comment"
    if: |
      contains(github.event.issue.labels.*.name, 'windows-distro-review') &&
      (
        contains(github.event.comment.body, '/publish-windows') ||
        contains(github.event.comment.body, '/approve-windows') ||
        contains(github.event.comment.body, '@publish-windows') ||
        contains(github.event.comment.body, '/hold-windows') ||
        contains(github.event.comment.body, '/pause-windows') ||
        contains(github.event.comment.body, '/reject-windows') ||
        contains(github.event.comment.body, '/cancel-windows') ||
        contains(github.event.comment.body, '/rollback-windows')
      )
    uses: ./.github/workflows/reusable-release-approval-comment-gate.yml
    with:
      issue_label: windows-distro-review
      match_regex: "/publish-windows\\b|/approve-windows\\b|@publish-windows\\b|/hold-windows\\b|/pause-windows\\b|/reject-windows\\b|/cancel-windows\\b|/rollback-windows\\b"
      hold_regex: "/hold-windows\\b|/pause-windows\\b"
      reject_regex: "/reject-windows\\b|/cancel-windows\\b"
      rollback_regex: "/rollback-windows\\b"
      subject: "Windows Distro Publication"
      environment_name: windows-distro-production
      environment_url: https://github.com/${{ github.repository }}/actions/workflows/release-windows-distro-approval.yml
      target_workflow_id: release-windows-distribution.yml
      target_ref: develop
      dispatch_inputs_json: '{"publish_bundle":"true","channel":"stable"}'
      approved_label: distro-approved
      approval_note: |
        Monitor `release-windows-distribution.yml` for manifest and endpoint publication.
