name: BackendRegistry Thread-Safety CI

# Triggered on every push/PR that touches BackendRegistry sources,
# the thread-safety test file, or this workflow itself.
# Targets v1.8.0 (roadmap:133:acceleration:v1.8.0:backendregistry-thread-safe-read-access-after-initialization).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/acceleration/compute_backend.h'
      - 'src/acceleration/backend_registry.cpp'
      - 'tests/acceleration/test_backend_registry_thread_safety.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_resilience_backend-registry-thread-safety-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/acceleration/compute_backend.h'
      - 'src/acceleration/backend_registry.cpp'
      - 'tests/acceleration/test_backend_registry_thread_safety.cpp'
      - 'cmake/CMakeLists.txt'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_resilience_backend-registry-thread-safety-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-registry-thread-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the BackendRegistryThreadSafetyFocusedTests suite.
  # Tests cover all acceptance criteria (AC-1 to AC-4):
  #   AC-1  16 reader threads + autoDetect() writer — no crash / no data race
  #   AC-2  16 concurrent getBestVectorBackend() calls — no crash / no data race
  #   AC-3  isRuntimeInitialized() concurrent reads — consistent atomic result
  #   AC-4  getSelectedXBackend() + autoDetect() concurrent — no crash / no data race
  # ---------------------------------------------------------------------------
  backend-registry-thread-safety-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: BackendRegistry thread-safety tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build (thread-safety test target)
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_backend_registry_thread_safety_focused

      - name: Run BackendRegistry thread-safety unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex BackendRegistryThreadSafetyFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee backend_registry_thread_safety_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-registry-thread-safety-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/backend_registry_thread_safety_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 BackendRegistry Thread-Safety – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| OS | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Compiler | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Issue | #133 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | v1.8.0 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if grep -q "PASSED" build/backend_registry_thread_safety_test_output.txt 2>/dev/null; then
            echo "✅ All thread-safety tests passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Some tests failed — see artifact for details." >> "$GITHUB_STEP_SUMMARY"
          fi
