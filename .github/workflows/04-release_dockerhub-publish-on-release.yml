name: Publish Docker image to Docker Hub (on GitHub Release)

on:
  release:
    types: [published]

  # Allow manual re-runs for historical releases, dry-run validation, or
  # building debug images for pre-release candidates.
  #
  # Usage:
  #   1. Go to Actions → "Publish Docker image to Docker Hub" → Run workflow.
  #   2. Enter the release tag (e.g. v1.4.0 or v1.4.0-rc1).
  #   3. Choose build_target=debug to build a debug image (includes gdb,
  #      valgrind, source); tags will have a -debug suffix.
  #   4. Set dry_run=true to validate without actually pushing to Docker Hub.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build and push (e.g. v1.4.0 or v1.4.0-rc1)'
        required: true
        type: string
      build_target:
        description: |
          Docker build target.
          runtime = lean production image (default).
          debug   = includes gdb/valgrind/strace/source; tag gets -debug suffix; no :latest.
        required: false
        default: 'runtime'
        type: choice
        options:
          - 'runtime'
          - 'debug'
      dry_run:
        description: 'Dry-run: build the image but do NOT push to Docker Hub'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  dockerhub:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest

    steps:
      # Determine the effective release tag regardless of how the workflow was
      # triggered (automatic release event or manual workflow_dispatch).
      - name: Resolve tag name
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
          fi
          if [[ -z "$TAG_NAME" ]]; then
            echo "ERROR: tag_name is empty"
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG_NAME (trigger: ${{ github.event_name }})"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.tag_name }}

      # The release tag is e.g. "v1.4.0" or "v1.4.0-rc1".
      # Docker tags are created without the leading "v": "1.4.0" / "1.4.0-rc1".
      # "latest" is only pushed for stable releases (no pre-release suffix).
      - name: Compute Docker tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ steps.resolve-tag.outputs.tag_name }}"   # e.g. v1.4.0 or v1.4.0-rc1
          VERSION="${TAG_NAME#v}"                                 # strip leading "v" if present

          if [[ -z "$VERSION" ]]; then
            echo "ERROR: Could not derive VERSION from tag_name='$TAG_NAME'"
            exit 1
          fi

          IMAGE="themisdb/themisdb"
          RELEASE_FAMILY="${VERSION}-community-binary"

          # build_target: 'debug' (manual only) adds a -debug suffix to the tag
          # and suppresses :latest. Release events always produce a runtime image.
          BUILD_TARGET="${{ github.event.inputs.build_target }}"
          if [[ "$BUILD_TARGET" == "debug" ]]; then
            TAG_SUFFIX="-debug"
          else
            TAG_SUFFIX=""
          fi

          # Pre-release detection: any suffix containing alpha|beta|rc|pre|dev|snapshot|preview
          # (case-insensitive), followed by a digit, non-letter character, or end of string.
          # This avoids false positives like "-developer" matching "-dev".
          if echo "$VERSION" | grep -Eiq '[-.](alpha|beta|rc|pre|dev|snapshot|preview)([0-9]|[^a-zA-Z]|$)'; then
            STABLE="false"
          else
            STABLE="true"
          fi

          echo "version=$VERSION"                   >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE"                     >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE"                       >> "$GITHUB_OUTPUT"
          echo "release_family=$RELEASE_FAMILY"     >> "$GITHUB_OUTPUT"
          echo "build_target=${BUILD_TARGET:-runtime}" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=$TAG_SUFFIX"             >> "$GITHUB_OUTPUT"

          # Build the newline-delimited tags list consumed by docker/build-push-action.
          # :latest is only added for stable runtime images.
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${RELEASE_FAMILY}-x64${TAG_SUFFIX}"
            echo "${IMAGE}:${RELEASE_FAMILY}-arm${TAG_SUFFIX}"
            if [[ "$STABLE" == "true" && -z "$TAG_SUFFIX" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Computed:"
          echo "  TAG_NAME     = $TAG_NAME"
          echo "  VERSION      = $VERSION"
          echo "  STABLE       = $STABLE"
          echo "  FAMILY       = $RELEASE_FAMILY"
          echo "  BUILD_TARGET = ${BUILD_TARGET:-runtime}"
          echo "  TAG_SUFFIX   = ${TAG_SUFFIX:-(none)}"
          echo "  TAGS:"
          echo "    ${IMAGE}:${RELEASE_FAMILY}-x64${TAG_SUFFIX}"
          echo "    ${IMAGE}:${RELEASE_FAMILY}-arm${TAG_SUFFIX}"
          if [[ "$STABLE" == "true" && -z "$TAG_SUFFIX" ]]; then
            echo "    ${IMAGE}:latest"
          fi

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Login is not required when doing a dry-run (nothing will be pushed).
        if: github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Release events always build the runtime (production) stage.
          # Manual dispatch can choose runtime (default) or debug.
          target: ${{ github.event.inputs.build_target == 'debug' && 'debug' || 'runtime' }}
          # push=false when dry_run=true (workflow_dispatch only).
          # For release events github.event.inputs.dry_run is empty (≠ 'true'),
          # so the image is always pushed on automatic release triggers.
          push: ${{ github.event.inputs.dry_run != 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: success() || failure()
        shell: bash
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          BUILD_OUTCOME="${{ steps.build-push.outcome }}"
          if [[ "$DRY_RUN" == "true" ]]; then
            PUSHED="no (dry-run)"
          elif [[ "$BUILD_OUTCOME" == "success" ]]; then
            PUSHED="yes ✅"
          else
            PUSHED="no (build/push failed ❌)"
          fi
          echo "## 🐳 DockerHub publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release tag | \`${{ steps.resolve-tag.outputs.tag_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ steps.meta.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stable | \`${{ steps.meta.outputs.stable }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ steps.meta.outputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build target | \`${{ steps.meta.outputs.build_target }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry-run | \`${DRY_RUN:-false}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pushed | ${PUSHED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
