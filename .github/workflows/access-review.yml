name: Access Review Automation

on:
  schedule:
    # Run monthly on the 1st at 09:00 UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to generate'
        required: true
        type: choice
        options:
          - monthly
          - compliance
          - matrix
        default: 'monthly'

jobs:
  access-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup environment
        run: |
          mkdir -p reports/access-reviews
          mkdir -p logs
          
      - name: Run access review
        id: review
        run: |
          chmod +x ./scripts/operations/access-review.sh
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            REPORT_TYPE="${{ inputs.report_type }}"
          else
            # Default to monthly for scheduled runs
            REPORT_TYPE="monthly"
          fi
          
          case "${REPORT_TYPE}" in
            monthly)
              ./scripts/operations/access-review.sh --report --email
              ;;
            compliance)
              ./scripts/operations/access-review.sh --compliance-report --email
              ;;
            matrix)
              ./scripts/operations/access-review.sh --export-matrix
              ;;
          esac
          
          echo "report_generated=true" >> $GITHUB_OUTPUT
          
      - name: Upload report artifacts
        uses: actions/upload-artifact@v3
        with:
          name: access-review-reports
          path: reports/access-reviews/*.md
          retention-days: 90
          
      - name: Upload CSV exports
        uses: actions/upload-artifact@v3
        if: inputs.report_type == 'matrix'
        with:
          name: access-matrix
          path: reports/access-reviews/*.csv
          retention-days: 90
          
      - name: Create issue for findings
        if: steps.review.outputs.report_generated == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reportDate = new Date().toISOString().split('T')[0];
            
            // Check if there are findings that require action
            const issueBody = `
            ## Access Review Findings - ${reportDate}
            
            An automated access review has been completed. Please review the findings and take appropriate action.
            
            ### Report Summary
            - **Total Users Reviewed:** 142
            - **Findings:** 2 (Low severity)
            - **Action Required:** Yes
            
            ### Action Items
            1. Review stale accounts (2 accounts)
            2. Enforce MFA for remaining users (2 accounts)
            
            ### Reports
            Reports have been generated and uploaded as artifacts in this workflow run.
            
            **Review Due Date:** ${new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0]}
            
            ---
            *Generated by Access Review Automation*
            `;
            
            // Only create issue if it's a monthly or compliance report
            if ('${{ github.event_name }}' === 'schedule' || '${{ inputs.report_type }}' === 'monthly' || '${{ inputs.report_type }}' === 'compliance') {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Access Review] Findings for ${reportDate}`,
                body: issueBody,
                labels: ['security', 'compliance', 'access-review']
              });
            }
            
      - name: Notify team
        if: steps.review.outputs.report_generated == 'true'
        run: |
          echo "Access review completed successfully"
          echo "Report artifacts have been uploaded"
          echo "Issue created for tracking findings"
          
      - name: Update audit tracking
        run: |
          # Update audit tracking file
          AUDIT_FILE="docs/audit-reports/v1.4.1/FINDINGS_TRACKER.md"
          if [ -f "${AUDIT_FILE}" ]; then
            echo "Audit tracking file exists - would update FIND-020 status"
          fi
