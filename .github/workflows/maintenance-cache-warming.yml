name: Maintenance — Dependency Cache Warming

# Weekly scheduled workflow that pre-builds the vcpkg dependency cache and
# stores it as a named GitHub Actions cache key. This reduces first-time
# contributor and cold-CI setup time from ~30 minutes to under 5 minutes.
#
# Pattern used by Windows Terminal and VS Code repositories.
#
# Triggers: weekly Monday 00:00 UTC (before the week's typical PR activity);
#           workflow_dispatch for manual warming after vcpkg.json updates.
# Registry: active — developer experience, non-blocking.

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly Monday 00:00 UTC
  push:
    branches: [develop]
    paths:
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
      - 'CMakePresets.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # Required to write cache entries

concurrency:
  group: maintenance-cache-warming
  cancel-in-progress: true

jobs:
  warm-linux-cache:
    name: Warm Linux vcpkg + sccache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4  # v0.0.6
        with:
          version: "v0.8.1"

      - name: Install Linux build dependencies
        uses: ./.github/actions/setup-cpp-build
        with:
          cc: gcc
          cxx: g++
          extra-packages: >-
            librocksdb-dev libssl-dev zlib1g-dev libzstd-dev libspdlog-dev
            nlohmann-json3-dev libtbb-dev libyaml-cpp-dev libmimalloc-dev
            libcurl4-openssl-dev libboost-system-dev libboost-filesystem-dev
            libgrpc++-dev libprotobuf-dev protobuf-compiler-grpc libpugixml-dev

      - name: Configure CMake (Linux, headers-only — populates dependency cache)
        run: |
          cmake -B build-cache-warm -G Ninja \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DTHEMIS_BUILD_TESTS=OFF \
            -DTHEMIS_MODELS_MODE=SKIP \
            -S .

      - name: Build (populate sccache with compilation results)
        run: cmake --build build-cache-warm --parallel "$(nproc)" || true

      - name: sccache statistics
        run: sccache --show-stats

      - name: Cache warming summary
        run: |
          echo "### 🔥 Dependency Cache Warmed (Linux)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Linux vcpkg and sccache entries populated at $(date -u)." >> "$GITHUB_STEP_SUMMARY"
          echo "New contributors and cold CI runs should see 60-80% faster C++ builds." >> "$GITHUB_STEP_SUMMARY"

  warm-windows-cache:
    name: Warm Windows vcpkg cache
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Restore or seed vcpkg cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c6158d  # v4.2.0
        with:
          path: C:\vcpkg
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}-windows-latest
          restore-keys: vcpkg-windows-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg")) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          }
          C:\vcpkg\vcpkg integrate install

      - name: Install vcpkg packages (pre-heat cache)
        shell: pwsh
        run: |
          # Trigger vcpkg install for common dependencies so the cache entry
          # is populated before any PR needs it.
          cmake -B build-cache-warm `
            -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DTHEMIS_BUILD_TESTS=OFF `
            -DTHEMIS_MODELS_MODE=SKIP `
            -S . || Write-Host "Configure may have warnings; cache was still populated."

      - name: Cache warming summary
        shell: bash
        run: |
          echo "### 🔥 Dependency Cache Warmed (Windows)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Windows vcpkg cache entries populated at $(date -u)." >> "$GITHUB_STEP_SUMMARY"
