name: "Shared · Changelog Update"

# ---------------------------------------------------------------------------
# PURPOSE
# -------
# Reusable workflow (workflow_call) that lets any CI/CD job write a
# structured entry into the root CHANGELOG.md without duplicating the
# checkout / commit / push boilerplate.
#
# USAGE — calling workflow example
# ---------------------------------
#
#   jobs:
#     update-changelog:
#       needs: [build, test]       # run after your actual CI work
#       if: github.ref == 'refs/heads/develop'
#       uses: ./.github/workflows/00-shared_changelog-update.yml
#       with:
#         entry-title: "My Feature — ${{ github.run_number }}"
#         entry-body: |
#           - Implemented XYZ feature
#           - Fixed edge-case in ABC
#           - 42 tests added
#         section: Added
#         key: my-feature-${{ github.run_id }}
#         commit-message: "chore: update CHANGELOG.md [skip ci]"
#       secrets: inherit
#
# INPUTS
# ------
#   entry-title    (string, required)
#       Bold title shown inside CHANGELOG.md as "- **<title>**".
#
#   entry-body     (string, required)
#       Newline-separated body lines.  Each non-empty line becomes a
#       separate "  - …" indented bullet under the title.
#
#   section        (string, default "Added")
#       Sub-section under ## [Unreleased].  Standard Keep-a-Changelog
#       values: Added | Changed | Deprecated | Removed | Fixed |
#               Security | Documentation | Performance | Infrastructure
#       Any value is accepted; the section is auto-created when absent.
#
#   key            (string, default "")
#       Idempotency key.  The same key prevents duplicate entries even
#       if the workflow runs multiple times (e.g. retries).
#       When empty, changelog_updater.py defaults to entry-title + today.
#
#   target-branch  (string, default "develop")
#       Commits are only pushed when github.ref matches this branch.
#       On any other ref the changelog is updated in the workspace but
#       the commit step is skipped (safe for PR preview runs).
#
#   commit-message (string, default "chore: update CHANGELOG.md [skip ci]")
#       Git commit message for the CHANGELOG.md update commit.
#
#   dry-run        (boolean, default false)
#       When true, print what would be inserted without writing the file
#       or creating a commit.
#
# OUTPUTS
# -------
#   changed   – "true" when the CHANGELOG.md entry was actually inserted;
#               "false" when the idempotency key was already present.
#
# SECRETS
# -------
#   The workflow reads GITHUB_TOKEN from the calling workflow context
#   (pass `secrets: inherit` or map it explicitly).
#
# PERMISSIONS
# -----------
# The *calling* workflow must grant:
#   permissions:
#     contents: write
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      entry-title:
        description: "Bold title for the CHANGELOG entry (required)"
        required: true
        type: string

      entry-body:
        description: >
          Newline-separated body lines.  Each non-empty line becomes a
          separate indented bullet under the title.
        required: true
        type: string

      section:
        description: >
          Sub-section under ## [Unreleased] (default: Added).
          Standard values: Added | Changed | Deprecated | Removed |
          Fixed | Security | Documentation | Performance | Infrastructure
        required: false
        default: "Added"
        type: string

      key:
        description: >
          Idempotency key.  Prevents duplicate entries on re-runs.
          Defaults to entry-title + today's date when empty.
        required: false
        default: ""
        type: string

      target-branch:
        description: "Branch to commit the CHANGELOG change to (default: develop)"
        required: false
        default: "develop"
        type: string

      commit-message:
        description: "Git commit message for the CHANGELOG.md update"
        required: false
        default: "chore: update CHANGELOG.md [skip ci]"
        type: string

      dry-run:
        description: "Print the change without writing or committing"
        required: false
        default: false
        type: boolean

    outputs:
      changed:
        description: "'true' if a new entry was inserted; 'false' if idempotency key already present"
        value: ${{ jobs.update.outputs.changed }}

jobs:
  update:
    name: "Update CHANGELOG.md"
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      changed: ${{ steps.run-updater.outputs.changed }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ───────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Run changelog_updater.py ─────────────────────────────────────────
      #
      # The entry-body input is a multi-line string.  We split it into
      # individual lines here and pass each as a separate --entry-body flag
      # so that changelog_updater.py receives them as a proper list.
      #
      - name: Insert CHANGELOG entry
        id: run-updater
        env:
          ENTRY_TITLE: ${{ inputs.entry-title }}
          ENTRY_BODY:  ${{ inputs.entry-body }}
          SECTION:     ${{ inputs.section }}
          KEY:         ${{ inputs.key }}
          DRY_RUN:     ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          # Build --entry-body arguments from each non-empty line of ENTRY_BODY.
          BODY_ARGS=()
          while IFS= read -r line; do
            # Skip blank lines silently.
            [[ -z "${line// }" ]] && continue
            BODY_ARGS+=("--entry-body" "$line")
          done <<< "$ENTRY_BODY"

          # Build optional --key argument.
          KEY_ARG=()
          if [[ -n "$KEY" ]]; then
            KEY_ARG=("--key" "$KEY")
          fi

          # Build optional --dry-run flag.
          DRY_FLAG=()
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_FLAG=("--dry-run")
          fi

          # Run the updater and capture stdout so we can detect the "skipped" case.
          OUTPUT=$(python3 tools/ci/changelog_updater.py \
            --entry-title "$ENTRY_TITLE" \
            --section     "$SECTION" \
            "${BODY_ARGS[@]}" \
            "${KEY_ARG[@]}" \
            "${DRY_FLAG[@]}" \
          2>&1)

          echo "$OUTPUT"

          # Determine whether an actual change was made.
          if echo "$OUTPUT" | grep -q "already contains entry"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Commit and push ──────────────────────────────────────────────────
      - name: Commit CHANGELOG.md
        if: >-
          inputs.dry-run == false &&
          github.ref == format('refs/heads/{0}', inputs.target-branch) &&
          steps.run-updater.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No staged changes – nothing to commit."
            exit 0
          fi

          git commit -m "${{ inputs.commit-message }}"

          # Rebase on any commits that landed while this job ran to avoid
          # non-fast-forward rejections.  Abort and fail on conflicts so the
          # next run (or a human) can resolve them.
          if ! git pull --rebase origin "${{ inputs.target-branch }}"; then
            git rebase --abort
            echo "::error::Rebase on ${{ inputs.target-branch }} failed (conflict). Re-run or resolve manually."
            exit 1
          fi

          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Job summary ──────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## 📝 Changelog Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Title** | ${{ inputs.entry-title }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Section** | \`### ${{ inputs.section }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target branch** | \`${{ inputs.target-branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Dry-run** | ${{ inputs.dry-run == true && 'yes' || 'no' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Changed** | ${{ steps.run-updater.outputs.changed }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.run-updater.outputs.changed }}" == "true" ]]; then
            if [[ "${{ inputs.dry-run }}" == "true" ]]; then
              echo "ℹ️ Dry-run mode — entry printed but not written." >> "$GITHUB_STEP_SUMMARY"
            elif [[ "${{ github.ref }}" == "refs/heads/${{ inputs.target-branch }}" ]]; then
              echo "✅ CHANGELOG.md updated and committed to \`${{ inputs.target-branch }}\`." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "ℹ️ Running on \`${{ github.ref_name }}\` (not target branch \`${{ inputs.target-branch }}\`) — file updated in workspace but not committed." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "⏭️ Entry already present (idempotency key matched) — no change." >> "$GITHUB_STEP_SUMMARY"
          fi
