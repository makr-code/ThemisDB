name: Plugin Registry Shared Mutex CI

# Triggered on every push / PR that touches the PluginRegistry sources,
# the WASM host API / loader scaffold, its test file, or this workflow.
# Targets v1.8.0 (roadmap:193:plugins:v1.8.0:pluginregistry-upgrade-global-mutex-to-shared-mutex).
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/plugins/plugin_registry.h'
      - 'src/plugins/plugin_registry.cpp'
      - 'include/plugins/wasm_host_api.h'
      - 'src/plugins/wasm_plugin_loader.cpp'
      - 'src/plugins/plugin_system_edition.cpp'
      - 'tests/test_generic_plugin_registry.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_plugin-registry-shared-mutex-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/plugins/plugin_registry.h'
      - 'src/plugins/plugin_registry.cpp'
      - 'include/plugins/wasm_host_api.h'
      - 'src/plugins/wasm_plugin_loader.cpp'
      - 'src/plugins/plugin_system_edition.cpp'
      - 'tests/test_generic_plugin_registry.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/02-feature-modules_plugin-registry-shared-mutex-ci.yml'
  workflow_dispatch:

concurrency:
  group: plugin-registry-shared-mutex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/01-core_ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the GenericPluginRegistryFocusedTests suite.
  # Tests cover all acceptance criteria for the shared_mutex upgrade:
  #   AC-1  getMutex() returns std::shared_mutex (compile-time guarantee)
  #   AC-2  registerFactory / unregisterFactory / clearRegistry use unique_lock
  #   AC-3  create / listPlugins / hasPlugin use shared_lock
  #   AC-4  Eight concurrent reader threads do not deadlock or data-race
  #   AC-5  unregisterFactory is selective (other plugins / interfaces unaffected)
  # ---------------------------------------------------------------------------
  plugin-registry-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Plugin Registry tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-12
            cc: gcc-12
            cxx: g++-12
          - os: ubuntu-22.04
            compiler: clang-15
            cc: clang-15
            cxx: clang++-15
          - os: ubuntu-24.04
            compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: librocksdb-dev libssl-dev libzstd-dev nlohmann-json3-dev

      - name: Configure and build
        uses: ./.github/actions/configure-themis
        with:
          cc:           ${{ matrix.cc }}
          cxx:          ${{ matrix.cxx }}
          build-target: test_generic_plugin_registry_focused

      - name: Run Generic PluginRegistry unit tests
        run: |
          cd build
          ctest --test-dir . \
            --tests-regex GenericPluginRegistryFocusedTests \
            --output-on-failure \
            --timeout 120 \
            2>&1 | tee plugin_registry_test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-registry-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/plugin_registry_test_output.txt
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## 🔒 Plugin Registry shared_mutex – Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **OS** | \`${{ matrix.os }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Compiler** | \`${{ matrix.compiler }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Event** | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PluginRegistry: shared_mutex upgrade, unregisterFactory, concurrent reads (8 threads), WASM loader scaffold." >> "$GITHUB_STEP_SUMMARY"
