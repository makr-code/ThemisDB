name: Query Plan Caching CI

# Triggered on every push/PR that touches the PlanCache sources,
# its test file, or this workflow itself.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'include/query/plan_cache.h'
      - 'src/query/plan_cache.cpp'
      - 'tests/test_query_plan_caching.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/query-plan-caching-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'include/query/plan_cache.h'
      - 'src/query/plan_cache.cpp'
      - 'tests/test_query_plan_caching.cpp'
      - 'cmake/CMakeLists.txt'
      - 'cmake/ModularBuild.cmake'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/query-plan-caching-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-scope-classifier:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-scope-classifier.yml

  # ---------------------------------------------------------------------------
  # Build and run the dedicated QueryPlanCaching focused test suite.
  # Tests cover all seven acceptance criteria (AC-1 to AC-7):
  #   AC-1  Plan fingerprinting (query structure + statistics)
  #   AC-2  Parameterized plan reuse
  #   AC-3  Plan invalidation on schema/statistics changes
  #   AC-4  Statistics-aware plan selection
  #   AC-5  Schema changes: invalidate all plans for affected tables
  #   AC-6  Statistics drift: invalidate if cardinality changes >10×
  #   AC-7  Periodic: refresh plans every 24 hours
  # ---------------------------------------------------------------------------
  query-plan-caching-unit-tests:
    needs: ci-scope-classifier
    if: needs.ci-scope-classifier.outputs.has_code_changes == 'true'
    name: Query Plan Caching tests (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            compiler: GCC-13
          - os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            compiler: GCC-12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up C++ build environment
        uses: ./.github/actions/setup-cpp-build
        with:
          cc:             ${{ matrix.cc }}
          cxx:            ${{ matrix.cxx }}
          extra-packages: >-
            nlohmann-json3-dev
            libssl-dev
            librocksdb-dev
            libspdlog-dev
            libfmt-dev
            libyaml-cpp-dev
            libtbb-dev
            libboost-all-dev
            libsimdjson-dev
            libsnappy-dev
            liblz4-dev

      - name: Configure (query plan caching test target)
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DTHEMIS_ENABLE_LLM=OFF \
            -DTHEMIS_ENABLE_GPU=OFF \
            -DTHEMIS_ENABLE_TRACING=OFF \
            -DTHEMIS_ENABLE_MIMALLOC=OFF \
            -DTHEMIS_BUILD_BENCHMARKS=OFF \
            -DTHEMIS_BUILD_TESTS=ON

      - name: Build focused test binary
        run: cmake --build build --target test_query_plan_caching_focused -- -j$(nproc)

      - name: Run focused tests
        run: |
          cd build
          ctest --test-dir . -R QueryPlanCachingFocusedTests \
                --output-on-failure --timeout 60
