name: 'CI - Pull Request'

on:
  pull_request:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - hotfix/*
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  VCPKG_MAX_CONCURRENCY: 4

jobs:
  # Quick validation checks
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          for file in .github/workflows/*.yml; do
            echo "Checking $file..."
            yamllint "$file" || true
          done
        continue-on-error: true

      - name: Validate CMake
        run: |
          cmake --version
          # Basic syntax check
          cmake -P CMakeLists.txt --trace 2>&1 | head -20 || true
        continue-on-error: true

  # Fast C++ build using system libraries
  cpp-build-fast:
    name: C++ Build (Fast)
    needs: validate
    uses: ./.github/workflows/reusable-cpp-build.yml
    with:
      os: ubuntu-latest
      build-type: Release
      use-system-libs: 'ON'
      run-tests: true
      upload-artifacts: false

  # Full C++ build with vcpkg
  cpp-build-full:
    name: C++ Build (Full)
    needs: validate
    uses: ./.github/workflows/reusable-cpp-build.yml
    with:
      os: ubuntu-latest
      build-type: Release
      use-system-libs: 'OFF'
      run-tests: true
      upload-artifacts: true
      artifact-name: themisdb-pr-build

  # Security scanning
  security-scan:
    name: Security Scan
    needs: validate
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      scanner-type: 'all'
      upload-sarif: true
    secrets: inherit

  # SDK tests for critical languages
  sdk-python:
    name: Python SDK
    needs: validate
    uses: ./.github/workflows/reusable-sdk-test.yml
    with:
      language: python
      version: '3.11'

  sdk-javascript:
    name: JavaScript SDK
    needs: validate
    uses: ./.github/workflows/reusable-sdk-test.yml
    with:
      language: javascript
      version: '18'

  # PR Summary
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [cpp-build-fast, cpp-build-full, security-scan, sdk-python, sdk-javascript]
    if: always()
    steps:
      - name: Generate PR Summary
        run: |
          echo "# 🔄 Pull Request CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| C++ Build (Fast) | ${{ needs.cpp-build-fast.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| C++ Build (Full) | ${{ needs.cpp-build-full.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python SDK | ${{ needs.sdk-python.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript SDK | ${{ needs.sdk-javascript.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [[ "${{ needs.cpp-build-fast.result }}" == "success" ]] && \
             [[ "${{ needs.cpp-build-full.result }}" == "success" ]]; then
            echo "✅ **All critical checks passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some checks failed - review required**" >> $GITHUB_STEP_SUMMARY
          fi
