name: PR Path Gate · hyperscaler

# Enforces the Hyperscaler release-lane policy on pull requests targeting hyperscaler.
#
# POLICY
# ------
#   hyperscaler is the Hyperscaler release lane.
#   It may contain all artefacts from all editions.
#   This gate enforces mandatory validations:
#     • Helm charts in helm/** must contain a Chart.yaml
#     • Kubernetes manifests in operator/** must be valid YAML
#     • docker/hyperscaler/** Dockerfiles must be present if changed
#
#   Additionally, publishing steps in CI are only executed when:
#     • The push is on the hyperscaler branch (or hyperscaler-v* tag)
#     • The hyperscaler-prod environment has been approved
#     • Required secrets are present (checked at job level)
#
# NOTE
# ----
#   The Hyperscaler lane allows Enterprise and Community content.
#   There are no "blocked paths" here, but mandatory checks are enforced.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - hyperscaler

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-path-gate-hyperscaler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  path-gate:
    name: Hyperscaler-lane path policy
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}" HEAD > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Validate Helm charts (if changed)
        id: helm-check
        shell: bash
        run: |
          set -euo pipefail
          HELM_CHANGED=false
          while IFS= read -r file; do
            if [[ "$file" == helm/* ]]; then
              HELM_CHANGED=true
              break
            fi
          done < /tmp/changed_files.txt

          if [[ "$HELM_CHANGED" == "true" ]]; then
            echo "Helm files changed – validating chart structure..."
            # Find all Chart.yaml files
            CHART_COUNT=$(find helm/ -name "Chart.yaml" 2>/dev/null | wc -l)
            if [[ "$CHART_COUNT" -eq 0 ]]; then
              echo "::error::helm/ directory was changed but no Chart.yaml found."
              exit 1
            fi
            echo "✅  Found $CHART_COUNT Helm chart(s) with Chart.yaml."
          else
            echo "No Helm files changed – skipping Helm validation."
          fi
          echo "helm_changed=$HELM_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Validate Kubernetes operator manifests (if changed)
        id: operator-check
        shell: bash
        run: |
          set -euo pipefail
          OPERATOR_CHANGED=false
          while IFS= read -r file; do
            if [[ "$file" == operator/* ]]; then
              OPERATOR_CHANGED=true
              break
            fi
          done < /tmp/changed_files.txt

          if [[ "$OPERATOR_CHANGED" == "true" ]]; then
            echo "Operator files changed – checking YAML syntax..."
            YAML_ERRORS=0
            # Basic YAML syntax check for changed operator manifests
            while IFS= read -r file; do
              if [[ "$file" == operator/* && ("$file" == *.yaml || "$file" == *.yml) && -f "$file" ]]; then
                if ! python3 -c "import sys,yaml; yaml.safe_load_all(open('$file'))" 2>/dev/null; then
                  echo "::error::Invalid YAML syntax in: $file"
                  YAML_ERRORS=$((YAML_ERRORS + 1))
                fi
              fi
            done < /tmp/changed_files.txt
            if [[ $YAML_ERRORS -gt 0 ]]; then
              echo "::error::$YAML_ERRORS operator manifest(s) have invalid YAML syntax."
              exit 1
            fi
            echo "✅  Operator manifests validated."
          else
            echo "No operator files changed – skipping operator validation."
          fi
          echo "operator_changed=$OPERATOR_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Summarize path gate result
        id: gate
        shell: bash
        run: |
          echo "✅  Hyperscaler-lane path policy passed."
          echo "GATE_PASSED=true" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "## 🔒 PR Path Gate — Hyperscaler release lane" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **PASSED** — Hyperscaler-lane validations completed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          HELM_CHANGED="${{ steps.helm-check.outputs.helm_changed }}"
          OPERATOR_CHANGED="${{ steps.operator-check.outputs.operator_changed }}"
          if [[ "$HELM_CHANGED" == "true" ]]; then
            echo "| Helm chart validation | ✅ Validated |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Helm chart validation | ⏭️ Not changed |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$OPERATOR_CHANGED" == "true" ]]; then
            echo "| Operator manifest YAML | ✅ Validated |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Operator manifest YAML | ⏭️ Not changed |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Target branch:** \`hyperscaler\` (Hyperscaler release lane)" >> "$GITHUB_STEP_SUMMARY"
          echo "**PR:** #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> See [RELEASE_STRATEGY.md](../../RELEASE_STRATEGY.md) for the full branch model and PR rules." >> "$GITHUB_STEP_SUMMARY"
