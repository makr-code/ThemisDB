name: Label Governance - Setup & Audit

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'audit'
        type: choice
        options:
          - 'audit'      # Just run audit report
          - 'create'     # Create all missing labels
          - 'migrate'    # Migrate existing labels  
          - 'all'        # Create + Migrate everything

jobs:
  label-governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Audit Report
        if: github.event.inputs.action == 'audit' || github.event.inputs.action == 'all'
        run: |
          python3 .github/scripts/audit-labels.py

      - name: Create Missing Labels
        if: github.event.inputs.action == 'create' || github.event.inputs.action == 'all'
        run: |
          python3 .github/scripts/create-labels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Migrate Existing Labels
        if: github.event.inputs.action == 'migrate' || github.event.inputs.action == 'all'
        run: |
          python3 .github/scripts/migrate-labels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Generate Report
        if: always()
        run: |
          echo "## 📊 Label Governance Workflow Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action performed:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** develop" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  validate-labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    needs: label-governance
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate Label Configuration
        run: |
          python3 .github/scripts/validate-labels.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}