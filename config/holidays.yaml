      - date: "2024-03-29"
        name: "Karfreitag"
      - date: "2024-04-01"
        name: "Ostermontag"
      - date: "2024-05-01"
        name: "Tag der Arbeit"
      - date: "2024-05-09"
        name: "Christi Himmelfahrt"
      - date: "2024-05-20"
        name: "Pfingstmontag"
      - date: "2024-05-30"
        name: "Fronleichnam"
      - date: "2024-08-15"
        name: "Mariä Himmelfahrt"
      - date: "2024-10-03"
        name: "Tag der Deutschen Einheit"
      - date: "2024-11-01"
        name: "Allerheiligen"
      - date: "2024-12-25"
        name: "1. Weihnachtstag"
      - date: "2024-12-26"
        name: "2. Weihnachtstag"

  # Example: NRW regional holidays 2024
  - name: "DE_NRW_2024"
    region: "DE-NW"
    year: 2024
    description: "North Rhine-Westphalia (NRW) Holidays 2024"
    holidays:
      - date: "2024-01-01"
        name: "Neujahr"
      - date: "2024-03-29"
        name: "Karfreitag"
      - date: "2024-04-01"
        name: "Ostermontag"
      - date: "2024-05-01"
        name: "Tag der Arbeit"
      - date: "2024-05-09"
        name: "Christi Himmelfahrt"
      - date: "2024-05-20"
        name: "Pfingstmontag"
      - date: "2024-05-30"
        name: "Fronleichnam"
      - date: "2024-10-03"
        name: "Tag der Deutschen Einheit"
