# ThemisDB Holidays Configuration
# This file defines holiday calendars for time calculation (Zeitberechnung)
#
# Supported formats for dates:
# - YYYY-MM-DD (ISO format)
# - DD.MM.YYYY (German format)
# - YYYY/MM/DD
#
# Usage in AQL:
#   LET holidays = HOLIDAYS("DE_CUSTOM_2024")
#   WORKDAYS(start, end, holidays)
#
# Built-in calendars (hardcoded):
#   DE_2024, DE_2025 - Germany Federal
#   AT_2024 - Austria
#   CH_2024 - Switzerland
#   US_FEDERAL_2024, US_FEDERAL_2025 - US Federal
#   UK_2024 - United Kingdom
#   FR_2024 - France
#
# Custom calendars defined below will be loaded at server startup
# and can be accessed via HOLIDAYS("calendar_name")

calendars:
  # Example: Custom German company holidays 2024
  # (includes federal holidays plus company-specific days)
  - name: "DE_COMPANY_2024"
    region: "DE"
    year: 2024
    description: "German Federal Holidays 2024 plus company-specific days"
    holidays:
      # German Federal Holidays 2024
      - date: "2024-01-01"
        name: "Neujahr"
      - date: "2024-03-29"
        name: "Karfreitag"
      - date: "2024-04-01"
        name: "Ostermontag"
      - date: "2024-05-01"
        name: "Tag der Arbeit"
      - date: "2024-05-09"
        name: "Christi Himmelfahrt"
      - date: "2024-05-20"
        name: "Pfingstmontag"
      - date: "2024-10-03"
        name: "Tag der Deutschen Einheit"
      - date: "2024-12-25"
        name: "1. Weihnachtstag"
      - date: "2024-12-26"
        name: "2. Weihnachtstag"
      # Company-specific days (Betriebsferien)
      - date: "2024-12-24"
        name: "Heiligabend (Betriebsruhe)"
      - date: "2024-12-31"
        name: "Silvester (Betriebsruhe)"

