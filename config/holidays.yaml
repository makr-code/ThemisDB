# Configuration for automatic loading
config:
  # Whether to load this file at server startup
  auto_load: true
  
  # Override built-in calendars with same name (default: false)
  override_builtin: false
  
  # Validation level: "strict" or "lenient"
  # strict: Fail if any date is invalid
  # lenient: Log warning but continue
  validation: "strict"
