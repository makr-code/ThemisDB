# Stop Words Configuration for NLP Text Analyzer
# Language: German (de)
# Version: 1.0
#
# Usage: Place this file in config/nlp/stopwords/de.yaml
# The NLP analyzer will automatically load stop words from this file

language:
  code: "de"
  name: "Deutsch"
  
stopwords:
  # Artikel
  - "der"
  - "die"
  - "das"
  - "den"
  - "dem"
  - "des"
  - "ein"
  - "eine"
  - "einer"
  - "einen"
  - "einem"
  - "eines"
  
  # Konjunktionen
  - "und"
  - "oder"
  - "aber"
  - "denn"
  - "sondern"
  
  # Präpositionen
  - "in"
  - "auf"
  - "an"
  - "zu"
  - "von"
  - "mit"
  - "bei"
  - "aus"
  - "für"
  - "als"
  - "nach"
  - "vor"
  - "über"
  - "unter"
  - "durch"
  - "gegen"
  - "zwischen"
  - "während"
  
  # Pronomen
  - "ich"
  - "du"
  - "er"
  - "sie"
  - "es"
  - "wir"
  - "ihr"
  - "mir"
  - "dir"
  - "ihm"
  - "uns"
  - "euch"
  - "ihnen"
  - "mein"
  - "dein"
  - "sein"
  - "unser"
  - "euer"
  - "dieser"
  - "diese"
  - "dieses"
  - "jener"
  - "jene"
  - "jenes"
  
  # Verben (Hilfsverben)
  - "ist"
  - "bin"
  - "bist"
  - "sind"
  - "war"
  - "waren"
  - "gewesen"
  - "sein"
  - "haben"
  - "hat"
  - "hatte"
  - "hatten"
  - "werden"
  - "wird"
  - "wurde"
  - "wurden"
  - "können"
  - "kann"
  - "konnte"
  - "müssen"
  - "muss"
  - "musste"
  - "sollen"
  - "soll"
  - "sollte"
  - "wollen"
  - "will"
  - "wollte"
  - "mögen"
  - "mag"
  - "mochte"
  - "dürfen"
  - "darf"
  - "durfte"
  
  # Adverbien
  - "nicht"
  - "nein"
  - "ja"
  - "sehr"
  - "auch"
  - "nur"
  - "noch"
  - "schon"
  - "jetzt"
  - "hier"
  - "da"
  - "dort"
  - "dann"
  - "wie"
  - "was"
  - "wo"
  - "wann"
  - "warum"
  - "wer"
  - "wen"
  - "wem"
  
  # Sonstige
  - "alle"
  - "einige"
  - "manche"
  - "viele"
  - "wenige"
  - "mehr"
  - "weniger"
  - "andere"
  - "solche"
  
# Optional: Benutzerdefinierte Stop-Wörter für spezifische Domänen
custom_stopwords:
  database:
    - "abfrage"
    - "auswählen"
    - "einfügen"
    - "aktualisieren"
    - "löschen"
  
  enabled: false
