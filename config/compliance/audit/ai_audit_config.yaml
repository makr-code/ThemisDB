# AI Auditing and Explainability Configuration
# Compliance: EU AI Act, GDPR Article 22, eIDAS

ai_auditing:
  # Enable/disable AI decision auditing
  enabled: true
  
  # Logging Configuration
  logging:
    # Log all AI decisions (required for compliance)
    log_all_decisions: true
    
    # Log intermediate reasoning steps
    log_intermediate_steps: true
    
    # Log alternative responses considered
    log_alternatives: true
    max_alternatives: 3
    
    # Include full context in audit logs
    include_full_context: true
    
    # Truncate long prompts/responses (0 = no truncation)
    max_prompt_length: 10000
    max_response_length: 10000
  
  # Explainability Configuration
  explainability:
    # Generate explanations for all decisions
    generate_explanations: true
    
    # Default explanation format (user_friendly, technical, compliance, json)
    default_format: "user_friendly"
    
    # Maximum reasoning chain steps to log
    reasoning_chain_max_steps: 10
    
    # Confidence threshold for human review flag (0.0-1.0)
    # Decisions below this threshold are flagged for review
    confidence_threshold_review: 0.7
    
    # Auto-generate key factors analysis
    auto_identify_factors: true
  
  # Storage Configuration
  storage:
    # Storage backend (rocksdb, postgres)
    backend: "rocksdb"
    
    # Encrypt audit data at rest
    encryption: true
    
    # Compress audit logs
    compression: true
    
    # Retention period in days (EU AI Act: minimum 6 months = 180 days)
    retention_days: 365
    
    # Auto-cleanup old entries
    auto_cleanup: true
  
  # Compliance Configuration
  compliance:
    # EU AI Act compliance mode
    eu_ai_act_mode: true
    
    # GDPR Article 22 compliance (automated decision-making)
    gdpr_article_22_mode: true
    
    # Cryptographic signature algorithm (ed25519, rsa)
    signature_algorithm: "ed25519"
    
    # Enable hash chain for tamper-proofing
    enable_hash_chain: true
    
    # Generate compliance reports
    enable_compliance_reports: true
    compliance_report_path: "data/reports/ai_compliance"
  
  # Human Oversight Configuration
  human_oversight:
    # Enable human review mechanism
    enable_review: true
    
    # Auto-flag low confidence decisions
    auto_flag_low_confidence: true
    
    # Require review for high-risk decisions
    require_review_high_risk: false
    
    # Alert on human override
    alert_on_override: true
    
    # Maximum pending reviews before alert
    max_pending_reviews: 100
  
  # Model Governance
  model_governance:
    # Track model versions
    track_model_versions: true
    
    # Log model performance metrics
    log_performance_metrics: true
    
    # Monitor for model drift
    monitor_drift: true
    drift_threshold: 0.1
    
    # A/B testing support
    enable_ab_testing: false
    
    # Document training data sources
    document_training_data: true
  
  # Monitoring & Alerting
  monitoring:
    # Enable Prometheus metrics
    prometheus_metrics: true
    
    # Alert on low confidence rate
    alert_low_confidence: true
    low_confidence_threshold: 0.3  # Alert if >30% decisions are low confidence
    
    # Alert on high override rate
    alert_high_override_rate: true
    high_override_threshold: 0.2   # Alert if >20% decisions are overridden
    
    # Alert on signature verification failures
    alert_signature_failures: true
    
    # Metrics export interval (seconds)
    metrics_interval: 60
  
  # Integration
  integration:
    # Integrate with existing LLM pipeline
    hook_llm_inference: true
    
    # Integrate with LoRA framework
    hook_lora_inference: true
    
    # Export to SIEM (Security Information and Event Management)
    export_to_siem: false
    siem_endpoint: ""
    
    # Export to audit database
    export_to_audit_db: false
    audit_db_connection: ""

# Example Usage:
# - All AI decisions are automatically logged with full context
# - Decisions with confidence < 0.7 are flagged for human review
# - Explanations can be retrieved via API for GDPR compliance
# - Cryptographic signatures ensure audit trail integrity
# - Retention policy enforces 365-day storage for compliance
