# Text Processor Configuration
# 
# Extracts text from plain text files and structured formats.
# Supports: TXT, JSON, XML, YAML, Markdown, CSV, etc.
#
# Version: 1.0

processor:
  name: "Text Processor"
  version: "1.0.0"
  library: "themis_proc_text"
  description: "Extract and process plain text and structured text formats"
  
  # Supported MIME types
  mime_types:
    - "text/plain"
    - "text/html"
    - "text/markdown"
    - "text/csv"
    - "text/xml"
    - "application/json"
    - "application/xml"
    - "application/yaml"
    - "application/x-yaml"
    - "text/x-python"
    - "text/x-java"
    - "text/x-c"
    - "text/x-c++"
    - "application/javascript"
    - "text/css"
    - "text/x-log"
    - "text/x-ini"
    - "text/x-properties"
  
  # Supported file extensions
  extensions:
    - ".txt"
    - ".text"
    - ".md"
    - ".markdown"
    - ".csv"
    - ".tsv"
    - ".json"
    - ".xml"
    - ".yaml"
    - ".yml"
    - ".html"
    - ".htm"
    - ".py"
    - ".java"
    - ".c"
    - ".cpp"
    - ".h"
    - ".hpp"
    - ".js"
    - ".ts"
    - ".css"
    - ".scss"
    - ".log"
    - ".ini"
    - ".properties"
    - ".conf"
    - ".cfg"
    - ".toml"
    - ".rst"
    - ".tex"
    - ".sql"
    - ".sh"
    - ".bash"
    - ".ps1"
    - ".bat"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Normalize whitespace
    normalize_whitespace: true
    
    # Remove control characters
    remove_control_chars: true
    
    # Detect encoding
    detect_encoding: true
    
    # Default encoding if detection fails
    default_encoding: utf-8
    
    # Extract code metadata (for source code)
    code_metadata: true
    
    # HTML: strip tags
    html_strip_tags: true
    
    # HTML: extract links
    html_extract_links: true
    
    # JSON: pretty format
    json_pretty: false
    
    # CSV: include headers
    csv_headers: true
    
    # CSV: delimiter detection
    csv_detect_delimiter: true
  
  # ============================================================================
  # Code Analysis (for source code files)
  # ============================================================================
  code_analysis:
    # Enable code analysis
    enabled: true
    
    # Count lines of code
    line_count: true
    
    # Detect language
    language_detection: true
    
    # Extract imports/dependencies
    extract_imports: true
    
    # Extract function/class names
    extract_symbols: true
    
    # Complexity metrics
    complexity_metrics: false
  
  # ============================================================================
  # Chunking Settings
  # ============================================================================
  chunking:
    # Strategy
    # - paragraph: Split by paragraphs
    # - sentence: Split by sentences
    # - line: Split by lines
    # - fixed: Fixed token count
    strategy: paragraph
    
    # Maximum tokens per chunk
    max_tokens: 512
    
    # Token overlap
    overlap_tokens: 50
    
    # Preserve code blocks
    preserve_code_blocks: true
    
    # Markdown: split by headers
    markdown_split_headers: true
    
    # JSON: split by top-level keys
    json_split_keys: false
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Maximum file size (MB)
    max_file_size_mb: 50
    
    # Maximum line length
    max_line_length: 100000
    
    # Maximum lines
    max_lines: 1000000
    
    # Strip potential secrets
    strip_secrets: false
    secret_patterns:
      - "(?i)(password|secret|api_key|token)\\s*[=:]\\s*['\"]?[^'\"\\s]+"
      - "(?i)bearer\\s+[a-zA-Z0-9_-]+"
  
  # ============================================================================
  # Backend Settings
  # ============================================================================
  backend:
    # Use ICU for encoding detection
    use_icu: true
    
    # Markdown parser (cmark, commonmark)
    markdown_parser: cmark
