# Audio Processor Configuration
# 
# Extracts metadata, waveforms, and optional transcription from audio files.
# Backend: FFmpeg
#
# Version: 1.0

processor:
  name: "Audio Processor"
  version: "1.0.0"
  library: "themis_proc_audio"
  description: "Extract metadata and transcription from audio files"
  
  # Supported MIME types
  mime_types:
    - "audio/mpeg"
    - "audio/mp3"
    - "audio/wav"
    - "audio/x-wav"
    - "audio/flac"
    - "audio/x-flac"
    - "audio/aac"
    - "audio/ogg"
    - "audio/opus"
    - "audio/x-m4a"
    - "audio/mp4"
    - "audio/x-ms-wma"
    - "audio/aiff"
    - "audio/x-aiff"
  
  # Supported file extensions
  extensions:
    - ".mp3"
    - ".wav"
    - ".flac"
    - ".aac"
    - ".ogg"
    - ".opus"
    - ".m4a"
    - ".wma"
    - ".aiff"
    - ".aif"
    - ".ape"
    - ".alac"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Extract technical metadata
    metadata: true
    
    # Generate waveform visualization
    waveform: false
    
    # Generate frequency spectrum
    spectrum: false
    
    # ID3/Metadata tags to extract
    tags:
      - title
      - artist
      - album
      - album_artist
      - year
      - genre
      - track_number
      - disc_number
      - duration
      - bitrate
      - sample_rate
      - channels
      - cover_art
      - composer
      - publisher
      - isrc
      - bpm
      - key
      - lyrics
      - comment
  
  # ============================================================================
  # Waveform Settings
  # ============================================================================
  waveform:
    # Enable waveform generation
    enabled: false
    
    # Number of samples in waveform
    samples: 1000
    
    # Output format
    # - json: Array of amplitude values
    # - png: Waveform image
    format: json
    
    # Image dimensions (if format = png)
    width: 800
    height: 200
    
    # Colors (if format = png)
    color: "#3498db"
    background: "#ffffff"
  
  # ============================================================================
  # Spectrum Settings
  # ============================================================================
  spectrum:
    # Enable spectrum analysis
    enabled: false
    
    # Spectrum type
    # - mel: Mel spectrogram
    # - linear: Linear spectrogram
    # - bark: Bark scale
    type: mel
    
    # Number of mel bands
    n_mels: 128
    
    # FFT window size
    n_fft: 2048
    
    # Hop length
    hop_length: 512
    
    # Output format (json, png)
    format: json
  
  # ============================================================================
  # Transcription Settings (Speech-to-Text)
  # ============================================================================
  transcription:
    # Enable transcription
    enabled: false
    
    # Transcription engine
    engine: whisper
    
    # Language (auto for detection)
    language: auto
    
    # Model size (whisper: tiny, base, small, medium, large)
    model: base
    
    # Include timestamps
    timestamps: true
    
    # Timestamp granularity (segment, word)
    timestamp_granularity: segment
    
    # Speaker diarization
    speaker_diarization: false
    
    # Number of speakers (for diarization, 0 = auto)
    num_speakers: 0
    
    # Word-level confidence scores
    word_confidence: false
    
    # Timeout
    timeout_sec: 300
  
  # ============================================================================
  # Music Analysis Settings
  # ============================================================================
  music_analysis:
    # Enable music analysis
    enabled: false
    
    # BPM detection
    bpm_detection: true
    
    # Key detection (musical key)
    key_detection: true
    
    # Mood/genre classification
    mood_classification: false
    
    # Instrument detection
    instrument_detection: false
    
    # Beat grid extraction
    beat_grid: false
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Maximum audio duration (seconds)
    max_duration_sec: 7200  # 2 hours
    
    # Maximum file size (MB)
    max_file_size_mb: 500
    
    # Malware scan
    malware_scan: true
  
  # ============================================================================
  # Backend Settings
  # ============================================================================
  backend:
    # Backend library
    library: ffmpeg
    
    # Minimum version
    version_min: "5.0"
    
    # Number of threads
    threads: 2
