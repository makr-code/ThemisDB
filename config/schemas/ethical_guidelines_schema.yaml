# JSON Schema for Ethical Guidelines YAML
# This schema validates the structure of ethical_guidelines.yaml

$schema: "http://json-schema.org/draft-07/schema#"
title: "ThemisDB Ethical Guidelines Schema"
description: "Schema for validating ethical and moral guidelines configuration"
version: "1.0.0"

type: object
required:
  - core_principles
  - context_detection
  - prompt_augmentation
  - config

properties:
  core_principles:
    type: array
    description: "Core ethical principles that guide the AI"
    items:
      type: object
      required:
        - id
        - name
        - description
        - priority
      properties:
        id:
          type: string
          pattern: "^[a-z_]+$"
          description: "Unique identifier for the principle"
        name:
          type: string
          description: "Name of the principle (bilingual)"
        description:
          type: string
          description: "Description in German"
        description_en:
          type: string
          description: "Description in English"
        priority:
          type: integer
          minimum: 1
          maximum: 10
          description: "Priority level (1 = highest)"
  
  context_detection:
    type: object
    description: "Keywords and patterns for detecting ethical contexts"
    required:
      - ethical_keywords
      - high_autonomy_contexts
    properties:
      ethical_keywords:
        type: object
        properties:
          german:
            type: array
            items:
              type: string
            description: "German keywords that trigger ethical guidelines"
          english:
            type: array
            items:
              type: string
            description: "English keywords that trigger ethical guidelines"
      high_autonomy_contexts:
        type: array
        items:
          type: string
        description: "Contexts where human autonomy is especially critical"
  
  prompt_augmentation:
    type: object
    description: "Templates for augmenting LLM prompts"
    required:
      - default
    properties:
      default:
        $ref: "#/definitions/augmentation_template"
      high_autonomy:
        $ref: "#/definitions/augmentation_template"
      administrative:
        $ref: "#/definitions/augmentation_template"
      bias_prevention:
        $ref: "#/definitions/augmentation_template"
  
  domain_guidelines:
    type: object
    description: "Domain-specific ethical guidelines"
    additionalProperties:
      type: object
      required:
        - name
        - applies_to
        - augmentation
      properties:
        name:
          type: string
          description: "Name of the domain"
        applies_to:
          type: array
          items:
            type: string
          description: "Keywords that trigger this domain's guidelines"
        augmentation:
          type: string
          enum: ["default", "high_autonomy", "administrative", "bias_prevention"]
          description: "Which augmentation template to use"
        additional_notes:
          type: string
          description: "Additional notes for this domain"
  
  config:
    type: object
    description: "Configuration settings"
    required:
      - enabled
      - detection_threshold
      - enable_logging
    properties:
      enabled:
        type: boolean
        description: "Enable/disable ethical guidelines system"
      detection_threshold:
        type: number
        minimum: 0.0
        maximum: 1.0
        description: "Minimum confidence for context detection"
      enable_logging:
        type: boolean
        description: "Log all ethical guideline applications"
      always_apply_default:
        type: boolean
        description: "Apply default guidelines to all requests"
      show_disclaimers:
        type: boolean
        description: "Show ethical disclaimers in responses"
      language_mode:
        type: string
        enum: ["de", "en", "both"]
        description: "Language preference for guidelines"

definitions:
  augmentation_template:
    type: object
    required:
      - system_prefix
    properties:
      system_prefix:
        type: string
        description: "Text to prepend to the system prompt"
      response_suffix:
        type: string
        description: "Text to append to the response"
