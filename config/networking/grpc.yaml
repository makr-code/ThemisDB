# ThemisDB — gRPC API Server Configuration
#
# Settings in this file are loaded by GrpcApiServer::initialize() at startup.
# Values here override the compile-time defaults in GrpcServerConfig without
# requiring a recompile.
#
# Environment variable overrides (highest precedence):
#   (none currently defined – use this file for operator-level tuning)

grpc:
  # Maximum inbound/outbound message size in megabytes.
  # Corresponds to GrpcServerConfig::max_message_size_bytes.
  # Increase for workloads that transfer large documents or wide batch responses.
  # Setting this too high can allow a single request to exhaust server memory.
  # Default: 100 (MB) → 104,857,600 bytes
  max_message_size_mb: 100
