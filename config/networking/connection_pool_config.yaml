# ThemisDB Connection Pool Configuration
# 
# This file contains recommended connection pooling settings for different
# deployment scenarios. Adjust these values based on your workload and resources.
#
# @see docs/knowledge-base/PERFORMANCE_TIPS.md (Connection Pooling section)

# =============================================================================
# gRPC Channel Pool Configuration
# =============================================================================
grpc:
  # Maximum channels per target endpoint
  # Formula: (core_count * 2) + effective_spindle_count
  # Default: 10
  max_channels_per_target: 10
  
  # Channel idle timeout (seconds)
  # Channels idle longer than this will be removed from pool
  # Default: 30s
  idle_timeout: 30
  
  # Connection timeout (seconds)
  # Default: 5s
  connect_timeout: 5
  
  # Timeout for acquiring channel from pool (seconds)
  # Default: 10s
  acquire_timeout: 10
  
  # Enable HTTP/2 keepalive
  # Recommended: true for all production deployments
  enable_keepalive: true
  
  # Keepalive time (seconds)
  # Send keepalive ping after this interval of inactivity
  # Default: 30s
  keepalive_time: 30
  
  # Keepalive timeout (seconds)
  # Wait this long for keepalive response before closing channel
  # Default: 10s
  keepalive_timeout: 10
  
  # Maximum concurrent streams per channel
  # HTTP/2 multiplexing limit
  # Default: 100
  max_concurrent_streams: 100

# =============================================================================
# HTTP Client Pool Configuration
# =============================================================================
http:
  # Maximum pooled connections
  # For web applications: 20-50 per instance
  # Formula: available_connections / number_of_app_instances
  # Default: 50
  max_connections: 50
  
  # Connection idle timeout (seconds)
  # Default: 30s
  idle_timeout: 30
  
  # Connection timeout (seconds)
  # Default: 5s
  connect_timeout: 5
  
  # Request timeout (seconds)
  # Maximum time for entire request/response cycle
  # Default: 30s
  request_timeout: 30
  
  # Timeout for acquiring connection (seconds)
  # Default: 10s
  acquire_timeout: 10
  
  # Enable HTTP Keep-Alive
  # Recommended: true
  enable_keepalive: true
  
  # Number of I/O threads
  # Recommended: Number of CPU cores
  # Default: 4
  io_threads: 4
  
  # Number of lock stripes (reduces contention)
  # Recommended: 8-16 for high concurrency
  # Default: 8
  lock_stripes: 8

# =============================================================================
# TCP Wire Protocol Connection Pool Configuration
# =============================================================================
wire_protocol:
  # Minimum connections per target
  # Pre-created connections for faster request handling
  # Default: 2
  min_connections_per_target: 2
  
  # Maximum connections per target
  # Adjust based on concurrent client requests
  # Default: 20
  max_connections_per_target: 20
  
  # Connection idle timeout (seconds)
  # Default: 60s
  idle_timeout: 60
  
  # Connection timeout (seconds)
  # Default: 5s
  connect_timeout: 5
  
  # Timeout for acquiring connection (seconds)
  # Default: 10s
  acquire_timeout: 10
  
  # Keepalive interval (seconds)
  # Send keepalive ping to detect dead connections
  # Default: 30s
  keepalive_interval: 30
  
  # Enable SSL/TLS
  # NOTE: TLS is not yet implemented for wire protocol - keep disabled
  # Default: false
  enable_ssl: false
  
  # Enable mutual TLS (client certificates)
  # NOTE: TLS is not yet implemented for wire protocol - keep disabled
  # Default: false
  enable_mtls: false
  
  # SSL certificate paths (reserved for future TLS support)
  ssl_cert_path: ""
  ssl_key_path: ""
  ssl_ca_cert_path: ""
  
  # Maximum connection retry attempts
  # Default: 3
  max_retries: 3
  
  # Enable connection warmup
  # Pre-create minimum connections on startup
  # Recommended: true for production
  enable_warmup: true

# =============================================================================
# mTLS Connection Pool Configuration
# =============================================================================
mtls:
  # Minimum connections per endpoint
  # Default: 2
  min_connections_per_endpoint: 2
  
  # Maximum connections per endpoint
  # Default: 50
  max_connections_per_endpoint: 50
  
  # Connection TTL (seconds)
  # Connections are refreshed after this time
  # Default: 300s (5 minutes)
  connection_ttl: 300
  
  # Connection timeout (seconds)
  # Default: 10s
  connection_timeout: 10
  
  # Health check interval (seconds)
  # Default: 30s
  health_check_interval: 30
  
  # Maximum endpoints supported
  # Default: 100
  max_endpoints: 100

# =============================================================================
# Database Connection Pool Configuration
# =============================================================================
database:
  # Minimum connections in pool
  # Default: 2
  min_connections: 2
  
  # Maximum connections in pool
  # Should not exceed database server's max_connections
  # Default: 10
  max_connections: 10
  
  # Health check interval (seconds)
  # Default: 30s
  health_check_interval: 30
  
  # Connection timeout (seconds)
  # Default: 10s
  connection_timeout: 10
  
  # Maximum connection age (seconds)
  # Connections are refreshed after this time
  # Default: 3600s (1 hour)
  max_connection_age: 3600
  
  # Enable automatic reconnection
  # Recommended: true
  enable_auto_reconnect: true

# =============================================================================
# Deployment-Specific Configurations
# =============================================================================

# OLTP Workload (High Throughput, Low Latency)
oltp:
  grpc:
    max_channels_per_target: 20
    keepalive_time: 15
  http:
    max_connections: 100
    idle_timeout: 20
  wire_protocol:
    max_connections_per_target: 50
    enable_warmup: true

# Analytics Workload (Long-Running Queries)
analytics:
  grpc:
    max_channels_per_target: 5
    keepalive_time: 60
  http:
    max_connections: 30
    request_timeout: 300  # 5 minutes
  wire_protocol:
    max_connections_per_target: 10
    idle_timeout: 300

# Development/Testing
development:
  grpc:
    max_channels_per_target: 5
    keepalive_time: 30
  http:
    max_connections: 10
    idle_timeout: 60
  wire_protocol:
    max_connections_per_target: 5
    enable_warmup: false

# Production (Balanced)
production:
  grpc:
    max_channels_per_target: 10
    enable_keepalive: true
    keepalive_time: 30
  http:
    max_connections: 50
    enable_keepalive: true
    io_threads: 8
  wire_protocol:
    max_connections_per_target: 20
    enable_warmup: true
    enable_ssl: false  # NOTE: TLS not yet supported for wire protocol
  mtls:
    min_connections_per_endpoint: 5
    max_connections_per_endpoint: 50

# =============================================================================
# Pool Sizing Guidelines
# =============================================================================
#
# General Formula:
#   pool_size = ((core_count * 2) + effective_spindle_count)
#
# Web Applications:
#   - Minimum: 10
#   - Maximum: (available_connections / number_of_app_instances)
#   - Typical: 20-50 per instance
#
# Example Calculation:
#   System: 8 cores, SSD storage (assume 4 effective spindles)
#   Pool size = (8 * 2) + 4 = 20 connections
#
#   With 5 application instances:
#   Max pool per instance = 100 total connections / 5 instances = 20
#
# Monitoring Guidelines:
#   - Target pool utilization: 60-80%
#   - If utilization > 90%: Increase max_connections
#   - If utilization < 40%: Decrease max_connections
#   - Monitor acquire_timeouts: Should be < 0.1% of requests
#   - Monitor stale_connections: High values indicate idle_timeout too low
