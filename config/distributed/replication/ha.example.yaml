# ThemisDB High Availability Replication Configuration
# 
# This configuration demonstrates enterprise-grade HA setup with:
# - Automatic failure detection
# - Automatic failover
# - Network partition handling
# - Health monitoring
# - Read preference configuration
# - Comprehensive metrics

# Server configuration
server:
  host: "0.0.0.0"
  port: 8765
  worker_threads: 8

# Storage configuration
storage:
  rocksdb_path: "./data/themis_ha_primary"
  memtable_size_mb: 256
  block_cache_size_mb: 512
  enable_blobdb: true
  compression:
    default: "zstd"
    bottommost: "zstd"

# High Availability Replication Configuration
replication:
  # Basic settings
  enabled: true
  mode: "semi_sync"  # Options: sync, semi_sync, async
  
  # Node identification
  node_id: "node-01"
  datacenter: "dc-east-1"
  
  # Replication mode and conflict resolution
  conflict_strategy: "last_write_wins"  # Options: last_write_wins, first_write_wins, vector_clock, custom
  
  # Timing configuration
  heartbeat_interval_ms: 1000         # Heartbeat every 1 second
  election_timeout_min_ms: 3000       # Min election timeout
  election_timeout_max_ms: 5000       # Max election timeout (randomized)
  replication_timeout_ms: 10000       # Replication operation timeout
  
  # Batching for performance
  batch_size: 100                     # Max entries per batch
  batch_timeout_ms: 50                # Max wait time for batch
  
  # WAL settings
  wal_directory: "/var/lib/themisdb/wal"
  wal_segment_size_bytes: 67108864    # 64MB segments
  wal_retention_segments: 100         # Keep 100 segments (~6.4GB)
  wal_sync_on_commit: true            # fsync on every commit (durability)
  
  # Quorum settings
  min_sync_replicas: 2                # Semi-sync waits for 2 replicas
  allow_stale_reads: false            # Reject reads from unhealthy replicas
  max_replication_lag_ms: 10000       # Max acceptable lag (10 seconds)
  
  # ===================================================================
  # HIGH AVAILABILITY CONFIGURATION
  # ===================================================================
  
  # Automatic Failover
  enable_auto_failover: true          # Enable automatic failover on leader failure
  failure_detection_timeout_ms: 5000  # Mark replica as FAILED after 5s timeout
  min_quorum_for_failover: 2          # Minimum healthy replicas needed for failover
  max_consecutive_failures: 3         # Failures before marking as permanently FAILED
  
  # Health Monitoring
  degraded_lag_threshold_ms: 5000     # Mark as DEGRADED if lag > 5 seconds
  
  # Read Preference (query routing)
  # Options: primary, secondary, primary_preferred, secondary_preferred, nearest
  default_read_preference: "primary_preferred"
  
  # TLS/Security (required in production)
  require_mtls: true
  cert_path: "/etc/themisdb/certs/node.crt"
  key_path: "/etc/themisdb/certs/node.key"
  ca_path: "/etc/themisdb/certs/ca.crt"
  
  # Cluster seed nodes (initial members)
  seed_nodes:
    - "node-01.cluster.local:8765"
    - "node-02.cluster.local:8765"
    - "node-03.cluster.local:8765"

# ===================================================================
# REPLICATION TOPOLOGY EXAMPLES
# ===================================================================

# Example 1: Active-Passive (3-node cluster)
# ------------------------------------------------
# node-01: Primary (LEADER)
# node-02: Standby (FOLLOWER, voting, high priority)
# node-03: Read replica (FOLLOWER, voting)
#
# Configuration:
# - mode: "semi_sync"
# - min_sync_replicas: 1
# - enable_auto_failover: true
# - Failover to node-02 if node-01 fails

# Example 2: Active-Active (5-node cluster)
# ------------------------------------------------
# All nodes can accept writes (requires distributed consensus)
# node-01 through node-05: All voting members
#
# Configuration:
# - mode: "sync"
# - min_sync_replicas: 3 (quorum of 5)
# - enable_auto_failover: true
# - Conflict resolution: "vector_clock"

# Example 3: Multi-Datacenter (6-node cluster)
# ------------------------------------------------
# DC-East: node-01 (LEADER), node-02 (FOLLOWER), node-03 (OBSERVER)
# DC-West: node-04 (FOLLOWER), node-05 (FOLLOWER), node-06 (OBSERVER)
#
# Configuration:
# - mode: "semi_sync"
# - min_sync_replicas: 1 per DC
# - degraded_lag_threshold_ms: 10000 (higher for cross-DC)
# - Datacenter-aware failover

# ===================================================================
# MONITORING AND OBSERVABILITY
# ===================================================================

# Prometheus metrics available at /metrics endpoint:
# 
# Replication metrics:
# - themisdb_replication_entries_total       - Total entries replicated
# - themisdb_replication_bytes_total         - Total bytes replicated
# - themisdb_replication_errors_total        - Replication errors
# - themisdb_replication_lag_max_ms          - Maximum replication lag
# - themisdb_replication_lag_avg_ms          - Average replication lag
# 
# HA metrics:
# - themisdb_automatic_failovers_total       - Automatic failovers executed
# - themisdb_manual_failovers_total          - Manual failovers triggered
# - themisdb_replica_failures_detected_total - Replica failures detected
# - themisdb_network_partitions_detected_total - Network partitions detected
# - themisdb_leader_elections_total          - Leader elections performed
# 
# Health metrics:
# - themisdb_replica_health_status{node_id}  - Health status per replica
#                                              (0=UNKNOWN, 1=HEALTHY, 2=DEGRADED, 3=FAILED)

# Grafana Dashboard:
# Use the provided dashboard at: grafana/replication-ha.json

# ===================================================================
# RECOMMENDED ALERTING RULES
# ===================================================================

# Alert on high replication lag:
# - alert: HighReplicationLag
#   expr: themisdb_replication_lag_max_ms > 30000
#   for: 5m
#   annotations:
#     summary: "Replication lag > 30 seconds"

# Alert on replica failures:
# - alert: ReplicaFailed
#   expr: increase(themisdb_replica_failures_detected_total[5m]) > 0
#   annotations:
#     summary: "Replica failure detected"

# Alert on network partition:
# - alert: NetworkPartition
#   expr: increase(themisdb_network_partitions_detected_total[5m]) > 0
#   annotations:
#     summary: "Network partition detected"

# Alert on frequent failovers:
# - alert: FrequentFailovers
#   expr: increase(themisdb_automatic_failovers_total[1h]) > 3
#   annotations:
#     summary: "More than 3 failovers in 1 hour"

# ===================================================================
# OPERATIONAL PROCEDURES
# ===================================================================

# Manual Failover:
# Use the admin API to trigger manual failover to a specific node:
# POST /api/v1/replication/failover
# {
#   "target_node_id": "node-02"
# }

# Check Cluster Health:
# GET /api/v1/replication/health
# Returns health status of all replicas

# Check Replication Status:
# GET /api/v1/replication/status
# Returns:
# - Current role (LEADER/FOLLOWER)
# - Replica health status
# - Replication lag
# - Last heartbeat times

# Promote Node to Leader:
# POST /api/v1/replication/promote
# Manually promote current node to leader (for maintenance)

# Demote Leader:
# POST /api/v1/replication/demote
# Gracefully step down from leader role

# ===================================================================
# PERFORMANCE TUNING
# ===================================================================

# For high-throughput workloads:
# - Increase batch_size to 500-1000
# - Increase batch_timeout_ms to 100-200ms
# - Use async mode for highest throughput (trade durability)
# - Increase wal_segment_size_bytes to 256MB

# For low-latency requirements:
# - Use sync mode for zero data loss
# - Decrease batch_timeout_ms to 10-20ms
# - Enable wal_sync_on_commit
# - Use local/nearby replicas only

# For multi-datacenter:
# - Use semi_sync mode
# - Increase degraded_lag_threshold_ms (50-100ms typical for cross-DC)
# - Set min_sync_replicas to 1 per datacenter
# - Consider datacenter-aware read preferences

# ===================================================================
# RECOVERY TIME OBJECTIVE (RTO) AND RECOVERY POINT OBJECTIVE (RPO)
# ===================================================================

# With this configuration:
# RPO = 0 (zero data loss with semi_sync/sync mode)
# RTO < 30 seconds (automatic failover completes in ~5-15 seconds)
#
# Factors affecting RTO:
# - failure_detection_timeout_ms: 5 seconds to detect failure
# - Election time: ~3-5 seconds (election_timeout_max_ms)
# - Stream reconnection: ~2-5 seconds
# - Application reconnection: depends on client retry logic
#
# Total: ~10-15 seconds for automatic failover
#        + client reconnection time (~5-15 seconds)
#        = ~15-30 seconds total RTO

# Feature flags
features:
  semantic_cache: false
  llm_store: false
  cdc: false
  timeseries: false
