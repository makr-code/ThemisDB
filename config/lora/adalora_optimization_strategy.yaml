# AdaLoRA + Multi-Adapter Optimization Strategy
# ============================================================
# Derives targets directly from PERFORMANCE_EXPECTATIONS.md
# SLO references: L-1…L-8 (§14 LLM-Modul), Appendix B §37.1 Item 4 (PR #4405)
#
# Key improvements introduced in v1.9.0 (PR #4405):
#   - Importance-based rank pruning  (AdaLoRA)
#   - LoRAAdapterMerger with TIES-Merging
#   - Power-Iteration SVD for low-rank factorisation
#   - Multi-adapter batch scheduling
# ============================================================

adalora:
  # ---------------------------------------------------------------
  # 1. Rank Budget & Importance-Based Pruning
  #    Source: PERF §37.1 #4, v1.9.0 — "LoRA Memory-Footprint reduziert"
  # ---------------------------------------------------------------
  rank_budget:
    # Initial rank per adapter layer (before pruning)
    initial_rank: 64                 # L-3 SLO: Hot-Load for 7B @ Rank 64 < 5 s
    # Minimum rank to preserve after pruning
    min_rank: 4
    # Maximum rank (hard cap)
    max_rank: 128
    # Target total rank budget across all layers (sum of per-layer ranks)
    total_rank_budget: 512

  importance_pruning:
    enabled: true
    # Metric used to score singular value importance
    # Options: "gradient_sensitivity" | "magnitude" | "fisher"
    metric: "gradient_sensitivity"
    # Pruning warmup: do not prune during first N steps
    warmup_steps: 200
    # Prune every N training steps
    pruning_interval_steps: 100
    # Fraction of rank budget reallocated per pruning step
    reallocation_rate: 0.05
    # Minimum importance score below which rank is trimmed
    min_importance_threshold: 0.01
    # Use Power-Iteration SVD for efficient singular value estimation
    power_iteration_svd:
      enabled: true
      num_iterations: 8             # Convergence: 8 iterations ≈ 1e-5 residual
      random_seed: 42

  # ---------------------------------------------------------------
  # 2. LoRA Hyperparameters
  #    Derived from: phi3_lora_training.yaml + PERF §14 targets
  # ---------------------------------------------------------------
  hyperparameters:
    # Alpha scaling factor — typically 2 × rank
    alpha_multiplier: 2.0           # alpha = alpha_multiplier × current_rank
    # Dropout (reduced because AdaLoRA prunes low-importance dimensions)
    dropout: 0.05
    # Learning rate — conservative for stability across rank changes
    learning_rate: 0.0002
    # Effective batch size = batch_size × gradient_accumulation_steps
    batch_size: 4
    gradient_accumulation_steps: 4
    # Maximum sequence length
    max_seq_length: 2048
    # Training epochs
    num_epochs: 3

    optimizer:
      type: "adamw"
      weight_decay: 0.01
      beta1: 0.9
      beta2: 0.999
      eps: 1.0e-8

    lr_scheduler:
      type: "cosine_with_warmup"
      warmup_steps: 200
      min_lr_ratio: 0.05

  # Target modules (architecture-agnostic defaults; override per model)
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  # ---------------------------------------------------------------
  # 3. Multi-Adapter Batch Scheduling
  #    Source: PERF §37.1 #4, L-5/L-6/L-7/L-8 SLOs
  # ---------------------------------------------------------------
  multi_adapter:
    enabled: true
    # Maximum number of adapters loaded simultaneously in memory
    max_loaded_adapters: 4
    # SLO: L-5 — Work-Stealing dispatch P99 ≤ 50 µs
    work_stealing_dispatch_slo_us: 50
    # SLO: L-3 — Hot-load a 7B/Rank-64 adapter in < 5 s wall-clock
    hot_load_slo_wall_clock_s: 5.0
    # SLO: L-4 — Serialise adapter in < 2 ms
    serialisation_slo_ms: 2.0
    # SLO: L-6 — Speculative Decoding overhead ≤ 15 % accepted-token latency
    speculative_decoding_overhead_pct: 15.0
    # SLO: L-8 — Speculative Decoding throughput ≥ 2× tokens/s (7B + 0.5B draft)
    speculative_decoding_throughput_multiplier: 2.0

    # Thread-safe hot-swap via unique_lock (PR #4333, v1.8.0)
    hot_swap:
      enabled: true
      lock_type: "unique_lock"
      # Maximum time to hold lock during swap (prevent starvation)
      max_lock_hold_ms: 50

    scheduling:
      # Dispatch strategy for multi-adapter batches
      # Options: "work_stealing" | "round_robin" | "priority"
      strategy: "work_stealing"
      worker_threads: 4
      queue_depth: 64

  # ---------------------------------------------------------------
  # 4. TIES-Merging with Power-Iteration SVD
  #    Source: PERF §37.1 #4 — "Merge ohne separaten Checkpoint"
  # ---------------------------------------------------------------
  adapter_merger:
    enabled: true
    algorithm: "ties"              # TIES = Trim, Elect Sign, Disjoint Merge

    ties:
      # Fraction of parameters trimmed per adapter before merge (top-k kept)
      trim_fraction: 0.2
      # Sign election: "majority" | "magnitude_weighted"
      sign_election: "majority"
      # Interpolation coefficient for merged adapter
      lambda: 1.0

    svd_compression:
      enabled: true
      method: "power_iteration"
      num_iterations: 8
      # Target compression ratio for the merged adapter
      target_rank_fraction: 0.5   # Merged rank ≈ 50 % of sum of input ranks
      # Minimum singular value fraction to retain
      min_sv_fraction: 0.01

    # Storage: no separate checkpoint needed (PERF §37.1 #4)
    checkpoint:
      save_intermediate: false
      save_merged_only: true
      output_format: "safetensors"  # Preferred: smaller + safer than .bin

  # ---------------------------------------------------------------
  # 5. SLO Gates (CI-enforced)
  #    Source: PERFORMANCE_EXPECTATIONS.md §14, §5.4, Appendix B
  # ---------------------------------------------------------------
  slo_gates:
    # L-1: Time-to-First-Token ≤ 200 ms P99 (A10G, 512-token prompt)
    ttft_p99_ms: 200
    # L-2: Streaming overhead ≤ 2 % token/s regression
    streaming_overhead_pct: 2.0
    # L-3: LoRA Adapter Hot-Load (7B, Rank 64) ≤ 5 s wall-clock
    adapter_hot_load_s: 5.0
    # L-4: Adapter serialisation ≤ 2 ms
    adapter_serialisation_ms: 2.0
    # L-5: Work-Stealing dispatch P99 ≤ 50 µs
    work_stealing_p99_us: 50
    # L-6: Speculative Decoding overhead ≤ 15 %
    speculative_overhead_pct: 15.0
    # L-7: GPU Utilisation improvement ≥ 10 % (mixed workloads)
    gpu_utilisation_improvement_pct: 10.0
    # L-8: Speculative Decoding throughput ≥ 2× (7B + 0.5B draft)
    speculative_throughput_multiplier: 2.0
    # LoRA Adapter application overhead ≤ 1 ms (Appendix D §39.20)
    adapter_application_ms: 1.0

    # CI gate: block release if any SLO regression > this fraction
    regression_block_threshold_pct: 5.0

  # ---------------------------------------------------------------
  # 6. Memory & Storage
  # ---------------------------------------------------------------
  memory:
    # FP16 weights for all adapters (required for L-3 hot-load SLO at Rank 64)
    dtype: "float16"
    # Pre-allocate VRAM budget for adapter pool
    vram_budget_gb: 2.0
    # Evict least-recently-used adapter when budget is exceeded
    eviction_policy: "lru"
    # LLMProcessAnalyzer O(1) LRU-Cache-Eviction (PR #4322, v1.8.0)
    lru_implementation: "linked_list_o1"

  storage:
    backend: "themisdb"
    collection_name: "adalora_adapters"
    enable_versioning: true
    max_versions: 10
    compression: "zstd"           # PERF §37.2 #17: ZSTD −30–50 % vs. zlib
    compression_level: 3

  # ---------------------------------------------------------------
  # 7. Distributed Federation (Paper 1 / IMPL-A3)
  #    AdaLoRA rank information shared via lora_federation_coordinator
  # ---------------------------------------------------------------
  federation:
    enabled: false                # Enable when THEMIS_ENABLE_DISTRIBUTED=1
    coordinator: "lora_federation_coordinator"
    # Broadcast importance scores across shards after each pruning step
    broadcast_importance_scores: true
    # Federated rank budget negotiation interval (seconds)
    rank_budget_sync_interval_s: 300
    # Maximum rank delta allowed per federation round
    max_rank_delta_per_round: 8

  # ---------------------------------------------------------------
  # 8. DATABASE_OPTIMIZER AutoLabeler Integration (Paper 1 / IMPL-A1)
  # ---------------------------------------------------------------
  database_optimizer_labeler:
    enabled: false                # Enable when THEMIS_ENABLE_TRAINING=1
    # AQL queries whose execution plans feed the auto-labeler training loop
    query_sources:
      - "slow_query_log"
      - "workload_fingerprint_engine"
    # Minimum query execution time (ms) to consider for labeling
    min_query_time_ms: 10
    # Training trigger: re-train adapter when label buffer exceeds this size
    label_buffer_trigger_size: 1000
