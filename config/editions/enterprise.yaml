# =============================================================================
# ThemisDB ENTERPRISE Edition — Runtime Configuration
# Version: 1.3.5+
# Edition: ENTERPRISE
# Target: Production deployments, regulated industries, multi-shard clusters
# License: REQUIRED — set license.file to a valid enterprise-license.json
# =============================================================================
#
# Features INCLUDED:
#   - All COMMUNITY features
#   - gRPC (REQUIRED — must be ON)
#   - Real HSM for key management (THEMIS_ENABLE_HSM_REAL=ON)
#   - LLM (optional — ALLOWED)
#   - GPU / CUDA (optional — ALLOWED; cap 320 GB VRAM — 4x A100 80 GB)
#   - DiskANN (ALLOWED)
#   - OpenTelemetry tracing (ALLOWED, default OFF)
#   - HTTP/2, HTTP/3, WebSocket, MQTT, PostgreSQL Wire, SSE, MCP (all ALLOWED)
#   - Multi-shard support (up to 100 nodes)
#   - Advanced RBAC + field-level encryption
#   - Cloud backup (S3, Azure, GCS)
#
# Features NOT AVAILABLE:
#   - Distributed training (THEMIS_ENABLE_DISTRIBUTED_TRAINING=OFF)
#
# Hardware limits (enforced by build):
#   GPU VRAM cap : 320 GB (4x A100 80 GB)
#   Max nodes    : 100
#   Max cache    : 4096 MB
#
# Usage:
#   ./themis_server --config config/editions/enterprise.yaml
#   or set THEMIS_CONFIG_ROOT=config/editions/enterprise.yaml
#
# NOTE: The build REQUIRES -DTHEMIS_LICENSE_FILE=/path/to/enterprise-license.json
# =============================================================================

# ---------------------------------------------------------------------------
# Edition identity
# ---------------------------------------------------------------------------
edition: ENTERPRISE

# ---------------------------------------------------------------------------
# Storage (RocksDB) — tuned for production multi-shard workloads
# ---------------------------------------------------------------------------
storage:
  rocksdb_path: "./data/rocksdb"
  wal_dir: ""

  # Memory
  memtable_size_mb: 512
  block_cache_size_mb: 4096       # Matches THEMIS_MAX_CACHE_SIZE_MB=4096
  block_cache_shard_bits: 4       # 16 shards; reduces lock contention
  cache_index_and_filter_blocks: true
  pin_l0_filter_and_index_blocks_in_cache: true
  partition_filters: true
  high_pri_pool_ratio: 0.5
  db_write_buffer_size_mb: 0

  # Write
  enable_wal: true
  max_write_buffer_number: 4
  min_write_buffer_number_to_merge: 1
  allow_concurrent_memtable_write: true

  # Compaction
  max_background_compactions: 8
  max_background_flushes: 4
  level0_file_num_compaction_trigger: 4
  level0_slowdown_writes_trigger: 20
  level0_stop_writes_trigger: 36

  # Bloom filter
  bloom_bits_per_key: 10
  whole_key_filtering: true

  # Compression
  compression_type: lz4
  bottommost_compression_type: zstd

  # File handles
  max_open_files: 10000
  bytes_per_sync: 1048576
  wal_bytes_per_sync: 1048576

# ---------------------------------------------------------------------------
# Server / networking
# ---------------------------------------------------------------------------
server:
  host: "0.0.0.0"
  port: 8080
  worker_threads: 16

# Protocols
protocols:
  grpc:
    enabled: true           # REQUIRED in ENTERPRISE (forced ON by build)
    port: 50051
    max_message_size_mb: 64
    keepalive_time_ms: 10000
    keepalive_timeout_ms: 5000
  http2:
    enabled: true           # ALLOWED; recommended for production APIs
  http3:
    enabled: false          # ALLOWED; enable for edge/CDN scenarios
  websocket:
    enabled: false          # ALLOWED
    port: 8081
  mqtt:
    enabled: false          # ALLOWED
    port: 1883
  postgres_wire:
    enabled: false          # ALLOWED; enable for PostgreSQL-compatible clients
    port: 5432
  mcp:
    enabled: false          # ALLOWED
  sse:
    enabled: false          # ALLOWED

# ---------------------------------------------------------------------------
# Security — advanced; real HSM available
# ---------------------------------------------------------------------------
security:
  enable_tls: true          # Strongly recommended for production
  tls_cert: "/etc/themisdb/tls/cert.pem"
  tls_key:  "/etc/themisdb/tls/key.pem"
  # tls_ca:   "/etc/themisdb/tls/ca.pem"  # mutual TLS
  enable_auth: true
  enable_rbac: true
  enable_field_encryption: true
  enable_hsm: true          # Real HSM available (THEMIS_ENABLE_HSM_REAL=ON)
  hsm:
    provider: software      # software | aws_kms | azure_key_vault | pkcs11
    # pkcs11_library: "/usr/lib/softhsm/libsofthsm2.so"
    # aws_kms_key_arn: "arn:aws:kms:..."
    # azure_vault_url: "https://myvault.vault.azure.net/"

# ---------------------------------------------------------------------------
# Query engine
# ---------------------------------------------------------------------------
query:
  max_query_size_bytes: 16777216  # 16 MB
  query_timeout_seconds: 300
  max_concurrent_queries: 2000

# ---------------------------------------------------------------------------
# Indexes
# ---------------------------------------------------------------------------
index:
  enable_secondary_indexes: true
  max_secondary_indexes_per_table: 50
  enable_graph_indexes: true

  # Vector indexes
  enable_vector_indexes: true
  default_vector_distance_metric: cosine
  hnsw_m: 32
  hnsw_ef_construction: 400
  hnsw_ef_search: 200

  # DiskANN — ALLOWED in ENTERPRISE
  enable_diskann: false      # Set true if DiskANN compiled in

# ---------------------------------------------------------------------------
# Transactions (MVCC)
# ---------------------------------------------------------------------------
transaction:
  enable_mvcc: true
  default_snapshot_isolation_level: serializable
  max_transaction_duration_seconds: 300
  transaction_lock_timeout_seconds: 60

# ---------------------------------------------------------------------------
# LLM — optional; ALLOWED in ENTERPRISE
# ---------------------------------------------------------------------------
llm:
  enabled: true             # ALLOWED; toggle off to save resources
  model_path: "./models"
  context_size: 8192
  batch_size: 512
  gpu_layers: 0             # Set > 0 if gpu.enabled=true and CUDA available
  remote_inference: false

# ---------------------------------------------------------------------------
# GPU / acceleration — optional; ALLOWED; cap 320 GB VRAM — 4x A100 80 GB
# ---------------------------------------------------------------------------
gpu:
  enabled: false            # ALLOWED; set true if GPU available
  backend: CUDA
  device_id: 0
  max_vram_gb: 320           # Hard cap (THEMIS_GPU_MAX_VRAM_GB=320)
  memory_fraction: 0.85

acceleration:
  cuda_enabled: false       # ALLOWED; set true when gpu.enabled=true
  simd_enabled: true

# ---------------------------------------------------------------------------
# Sharding — up to 100 nodes
# ---------------------------------------------------------------------------
sharding:
  enabled: false            # Enable for multi-shard clusters
  max_nodes: 100            # Hard limit from THEMIS_SHARDING_MAX_NODES=100
  shard_id: 0
  total_shards: 1
  # peer_shards:
  #   - id: 1
  #     address: "themis-shard-1:50051"

# ---------------------------------------------------------------------------
# Replication — recommended for production HA
# ---------------------------------------------------------------------------
replication:
  enabled: false
  mode: sync                # sync | async
  # replica_endpoints:
  #   - "themis-replica-1:50051"
  #   - "themis-replica-2:50051"

# ---------------------------------------------------------------------------
# Distributed training — NOT available in ENTERPRISE
# ---------------------------------------------------------------------------
distributed_training:
  enabled: false

# ---------------------------------------------------------------------------
# Observability — tracing ALLOWED (default OFF)
# ---------------------------------------------------------------------------
logging:
  level: info
  format: json
  output: stdout

metrics:
  enabled: true
  prometheus_port: 9090

tracing:
  enabled: false            # ALLOWED; set true to enable OpenTelemetry
  # otlp_endpoint: "http://otel-collector:4317"
  # service_name: "themisdb-enterprise"
  # sampling_ratio: 0.1

# ---------------------------------------------------------------------------
# Backup — local and cloud
# ---------------------------------------------------------------------------
backup:
  enable_automatic_backups: true
  backup_directory: "./backups"
  backup_interval_hours: 6
  max_backups_retained: 30
  cloud_backup: false        # ALLOWED; configure provider below
  # cloud_provider: s3 | azure | gcs
  # s3_bucket: "my-themisdb-backups"
  # s3_region: "eu-central-1"

# ---------------------------------------------------------------------------
# Performance
# ---------------------------------------------------------------------------
performance:
  worker_threads: 16
  enable_mimalloc: true
  enable_huge_pages: false
  enable_rcu: true

# ---------------------------------------------------------------------------
# Licensing
# ---------------------------------------------------------------------------
license:
  # REQUIRED: path to a valid enterprise-license.json
  # Also configure at build time: -DTHEMIS_LICENSE_FILE=/path/to/license.json
  file: "/etc/themisdb/license/enterprise-license.json"
