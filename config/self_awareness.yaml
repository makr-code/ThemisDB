# ThemisDB Self-Awareness Configuration
# System introspection and self-monitoring

self_awareness:
  # Master switch
  enabled: true
  
  # Trigger mechanisms
  on_audit_signing: true          # Trigger snapshot when audit log is signed
  on_schedule: false              # Periodic snapshots (independent of audit)
  schedule_interval_seconds: 3600 # Hourly if on_schedule is true
  
  # Anomaly detection thresholds
  thresholds:
    # CPU thresholds
    cpu_warning: 0.80             # 80% CPU usage
    cpu_critical: 0.95            # 95% CPU usage
    
    # Memory thresholds
    memory_warning: 0.80          # 80% memory usage
    memory_critical: 0.90         # 90% memory usage
    
    # Disk thresholds
    disk_warning: 0.80            # 80% disk usage
    disk_critical: 0.90           # 90% disk usage
    
    # Query performance thresholds
    query_time_warning_ms: 2000   # 2 seconds
    query_time_critical_ms: 5000  # 5 seconds
  
  # Snapshot settings
  snapshots:
    max_retained: 100             # Keep last 100 snapshots
    persist: true                 # Save to disk
    directory: /var/lib/themisdb/self-awareness
    
    # Snapshot pruning
    auto_prune: true              # Automatically remove old snapshots
    prune_interval_hours: 24      # Check for pruning daily
  
  # Self-diagnosis
  diagnosis:
    enabled: true                 # Enable anomaly detection
    auto_remediation: false       # Don't automatically fix issues (yet)
    
    # Alert on anomalies
    alert_on_warning: true
    alert_on_critical: true
  
  # Reporting
  reporting:
    # Generate periodic health reports
    generate_reports: true
    report_interval_hours: 24
    report_directory: /var/log/themisdb/self-awareness-reports
    
    # Report format
    format: json                  # json, yaml, or both
    include_history: true         # Include comparison with previous snapshots
    
  # Integration with other systems
  integration:
    # Prometheus metrics
    prometheus_export: true
    prometheus_prefix: themis_self_awareness_
    
    # Grafana annotations
    grafana_annotations: false
    grafana_api_url: http://localhost:3000/api/annotations
    
    # Email notifications
    email_notifications: false
    email_recipients:
      - admin@example.com
    email_on_critical_only: true

# Advanced settings
advanced:
  # Confidence scoring
  confidence_calculation:
    # Weight factors for confidence score
    data_freshness_weight: 0.3
    metric_quality_weight: 0.3
    historical_consistency_weight: 0.2
    completeness_weight: 0.2
  
  # Self-learning (experimental)
  learning:
    enabled: false                # Machine learning for anomaly detection
    baseline_period_days: 7       # Learn normal behavior over 7 days
    anomaly_sensitivity: 0.95     # 95% confidence for anomaly detection
