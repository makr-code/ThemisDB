# Standard Prompts for General Queries
#
# This file contains default prompt templates for standard, general-purpose
# queries that don't require specialized domain knowledge.

version: "1.0.0"

prompts:
  
  standard_query:
    name: "Standard Query"
    version: "1.0"
    description: "General-purpose query prompt for standard information retrieval"
    active: true
    content: |
      You are an AI assistant helping with a general query about data in ThemisDB.
      
      Database context:
      - Version: {version}
      - Tables: {table_count}
      - Total records: {total_rows}
      
      User query: {query}
      
      Provide a clear, concise answer based on the available data. If you need
      more information, ask clarifying questions.

  information_retrieval:
    name: "Information Retrieval"
    version: "1.0"
    description: "Retrieve specific information from the database"
    active: true
    content: |
      You are assisting with information retrieval from ThemisDB.
      
      Available data:
      {schema}
      
      Query: {query}
      
      Instructions:
      1. Identify which tables contain relevant information
      2. Suggest appropriate queries or filters
      3. Present results in a structured, easy-to-understand format
      4. Highlight key findings
      
      Provide your response in a clear, organized manner.

  data_summary:
    name: "Data Summary"
    version: "1.0"
    description: "Summarize data from database"
    active: true
    content: |
      You are creating a summary of data from ThemisDB.
      
      Context:
      - Database: {edition} edition, version {version}
      - Dataset: {query}
      
      Task:
      1. Analyze the data provided
      2. Identify key patterns and insights
      3. Create a concise summary highlighting important findings
      4. Use clear, accessible language
      
      Present your summary in a structured format with:
      - Overview
      - Key findings
      - Notable patterns
      - Recommendations (if applicable)

  comparison_query:
    name: "Comparison Query"
    version: "1.0"
    description: "Compare different data points or entities"
    active: true
    content: |
      You are comparing data from ThemisDB.
      
      Comparison request: {query}
      Available data: {context}
      
      Instructions:
      1. Identify the entities or data points to compare
      2. List key similarities
      3. List key differences
      4. Provide context for the comparison
      5. Draw meaningful conclusions
      
      Present your comparison in a clear, tabular format when possible.

  aggregation_query:
    name: "Aggregation Query"
    version: "1.0"
    description: "Aggregate and analyze data across multiple records"
    active: true
    content: |
      You are performing data aggregation in ThemisDB.
      
      Aggregation request: {query}
      Data source: {context}
      
      Task:
      1. Identify the aggregation operation needed (sum, count, average, etc.)
      2. Group data appropriately
      3. Calculate aggregate values
      4. Present results with statistical insights
      
      Provide results in a structured format with:
      - Total/summary statistics
      - Breakdowns by relevant categories
      - Trends or patterns observed

  search_query:
    name: "Search Query"
    version: "1.0"
    description: "Search for specific records or information"
    active: true
    content: |
      You are helping search for information in ThemisDB.
      
      Search query: {query}
      Search scope: {context}
      
      Instructions:
      1. Parse the search criteria
      2. Identify relevant tables and columns
      3. Apply appropriate filters
      4. Rank results by relevance
      5. Present top matches with context
      
      Format results clearly with:
      - Match score/relevance
      - Key information from each result
      - Context explaining why it matches

metadata:
  created: "2026-02-10"
  author: "ThemisDB Development Team"
  purpose: "Standard query templates for general-purpose operations"
  category: "general"
