# =============================================================================
# ThemisDB – Index Analyzer Configuration
# File: config/index_analyze.yaml
# =============================================================================
#
# Controls the per-index analyze engine (IndexAnalyzer) that determines
# whether an index needs partial or full maintenance based on fragmentation,
# orphan entries, statistics staleness, and storage tier.
#
# Cron scheduling: standard 5-field POSIX cron syntax is supported.
# AI/ML intervention: set ai_advisor.enabled=true and wire an
#   IIndexAnalysisAdvisor implementation via IndexAnalyzer::setAdvisor().
#
# =============================================================================

index_analyze:

  # ── Global switch ─────────────────────────────────────────────────────────
  enabled: true

  # ── Cron schedule ─────────────────────────────────────────────────────────
  # When to run the scheduled analysis automatically.
  # Standard 5-field POSIX cron:  minute  hour  day  month  weekday
  #   "0 2 * * *"     = every day at 02:00 (default, low-traffic window)
  #   "0 */6 * * *"   = every 6 hours
  #   "*/30 * * * *"  = every 30 minutes (hot-tier SLA-sensitive deployments)
  #   "@daily"        = shortcut for "0 0 * * *"
  #   ""              = disabled (manual trigger only via IndexAnalyzer::analyzeAll())
  cron_expression: "0 2 * * *"

  # ── Per-tier fragmentation & staleness thresholds ─────────────────────────
  # Thresholds are intentionally looser for warm/cold tiers because rebuild
  # overhead is amortised over longer access intervals.
  #
  # Recommendation mapping:
  #   frag < reorganize_pct                     → NONE (or UPDATE_STATS if stats stale)
  #   reorganize_pct  ≤ frag < partial_rebuild_pct → REORGANIZE
  #   partial_rebuild_pct ≤ frag < full_rebuild_pct → PARTIAL_REBUILD
  #   frag ≥ full_rebuild_pct                   → FULL_REBUILD
  #
  thresholds:

    hot:
      # NVMe / fastest local SSD – tight thresholds to preserve query latency
      reorganize_pct: 10.0       # light in-place defragmentation
      partial_rebuild_pct: 20.0  # rebuild most-fragmented segments only
      full_rebuild_pct: 35.0     # discard and rebuild entire index
      stats_stale_hours: 1       # statistics age that triggers UPDATE_STATS

    warm:
      # SATA SSD or spinning disk – balanced thresholds
      reorganize_pct: 18.0
      partial_rebuild_pct: 32.0
      full_rebuild_pct: 50.0
      stats_stale_hours: 6

    cold:
      # Object storage / archive – loose thresholds; rebuilds are expensive
      reorganize_pct: 30.0
      partial_rebuild_pct: 50.0
      full_rebuild_pct: 70.0
      stats_stale_hours: 24

  # ── AI/ML advisor ─────────────────────────────────────────────────────────
  # When enabled, the preliminary rule-based recommendation is forwarded to a
  # registered IIndexAnalysisAdvisor implementation (e.g. a local LLM or a
  # trained classifier) which may override it.
  #
  # Wire the advisor at runtime via:
  #   analyzer.setAdvisor(std::make_shared<MyMLAdvisor>(model_path));
  #
  ai_advisor:
    enabled: false
    # Model identifier forwarded verbatim to the registered advisor.
    # Interpretation is implementation-defined (model path, registry key, etc.).
    model: ""

  # ── Managed indices ────────────────────────────────────────────────────────
  # List every index that should be included in the scheduled analysis.
  # Indices not listed here can still be analysed manually via analyze().
  #
  # Fields per entry:
  #   name            – index identifier (required)
  #   tier            – current storage tier: hot | warm | cold  (default: hot)
  #   enabled         – include in scheduled analyzeAll()  (default: true)
  #   thresholds      – optional per-index overrides for the threshold values
  #                     above; missing fields fall back to the tier defaults.
  #
  indices:
    - name: primary
      tier: hot
      enabled: true

    - name: secondary
      tier: hot
      enabled: true

    - name: vectors
      tier: warm
      enabled: true

    - name: timeseries
      tier: warm
      enabled: true

    - name: graph_edges
      tier: warm
      enabled: true

    - name: archive
      tier: cold
      enabled: true
      # Example per-index threshold override:
      # thresholds:
      #   full_rebuild_pct: 80.0   # archive index: tolerate more fragmentation

  # ── Example: 6-field cron (with year constraint) ──────────────────────────
  # cron_expression: "0 2 1 1 * 2027"   # 1 Jan 2027 at 02:00 only
