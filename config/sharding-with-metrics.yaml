# ThemisDB Sharding Configuration with Prometheus Metrics
# Example configuration showing how to enable and configure metrics

sharding:
  enabled: true
  local_shard_id: "shard-1"
  
  # Prometheus Metrics Configuration
  metrics:
    enabled: true
    http_port: 9090           # Port for metrics endpoint (optional, defaults to main HTTP port)
    http_path: "/metrics"      # Path for metrics endpoint
    enable_histograms: true    # Enable histogram metrics for latency tracking
    histogram_buckets: 10      # Number of histogram buckets
  
  # Shard Router Configuration
  router:
    scatter_timeout_ms: 30000
    max_concurrent_shards: 10
    enable_query_pushdown: true
  
  # Data Migration Configuration
  migration:
    batch_size: 1000
    verify_integrity: true
    max_retries: 3
    retry_delay_ms: 1000
  
  # Gossip Protocol Configuration
  peer_discovery:
    enabled: false              # Set to true to enable P2P gossip
    gossip_interval_sec: 30
    max_peers: 100
    seed_nodes: []
  
  # Health Check Configuration
  health_check:
    enabled: true
    check_interval_sec: 60
    certificate_warning_days: 7
    storage_warning_percent: 90
  
  # TrueTime Clock Configuration
  truetime:
    enabled: true
    node_id: "shard-1"
    
    # Clock source (SYSTEM_CLOCK, NTP, PTP, GPS, ATOMIC)
    source: NTP
    ntp_server: "ptbtime1.ptb.de"  # PTB Braunschweig (Stratum 1)
    ptp_interface: "eth0"
    
    # Uncertainty bounds
    base_uncertainty_us: 100        # Base uncertainty (100µs)
    max_uncertainty_us: 10000       # Max uncertainty (10ms)
    drift_rate_ppm: 200             # Clock drift (200 ppm)
    
    # Synchronization
    sync_interval_ms: 30000         # Sync every 30s
    sync_timeout_ms: 5000           # Timeout for sync requests
    
    # Commit-wait protocol for external consistency
    enable_commit_wait: true        # Enable external consistency
    commit_wait_multiplier: 2       # Wait 2x uncertainty for safety
  
  # Shard Network Latency Monitoring
  latency_monitor:
    enabled: true
    
    # Ping intervals
    ping_interval_ms: 10000         # Ping every 10s
    ping_timeout_ms: 5000           # Timeout for ping response
    
    # Statistics
    history_size: 100               # Keep last 100 measurements
    enable_percentiles: true        # Calculate P95/P99
    
    # Integration with TrueTime
    adjust_truetime_uncertainty: true   # Adjust TrueTime based on network latency
    uncertainty_multiplier: 1.5     # Multiply avg RTT by this for uncertainty
    
    # HTTP endpoint
    ping_endpoint_path: "/shard/ping"
    use_mtls: true                  # Use mTLS for ping requests
  
  # Distributed Transaction Coordination
  distributed_transactions:
    enabled: true
    
    # Transaction settings
    default_isolation: SNAPSHOT_ISOLATION
    default_timeout_ms: 30000       # 30 seconds
    prepare_timeout_ms: 10000       # 10 seconds
    commit_timeout_ms: 10000        # 10 seconds
    
    # 2PC settings
    enable_2pc: true
    max_prepare_retries: 3
    
    # SAGA settings
    enable_saga: true
    max_compensation_retries: 5
    compensation_retry_delay_ms: 1000
    
    # TrueTime integration
    use_truetime: true
    enforce_external_consistency: true  # Use commit-wait

# Example: Accessing Metrics
# 
# 1. Via HTTP:
#    curl http://localhost:8080/metrics
#
# 2. Prometheus scrape config:
#    scrape_configs:
#      - job_name: 'themisdb'
#        static_configs:
#          - targets: ['themisdb-1:8080', 'themisdb-2:8080']
#        metrics_path: /metrics
#        scrape_interval: 15s
#
# 3. Available Metric Categories:
#    - themis_routing_*         (Shard Router metrics)
#    - themis_migration_*       (Data Migration metrics)
#    - themis_gossip_*          (Gossip Protocol metrics)
#    - themis_cross_shard_*     (Cross-Shard Join metrics)
#    - themis_health_check_*    (Health Check metrics)
#    - themis_cloud_agent_*     (Cloud Agent metrics)
#    - themis_shard_*           (Shard health and topology)
#    - themis_pki_*             (PKI/mTLS metrics)
#    - themis_truetime_*        (TrueTime Clock metrics)
#    - themis_shard_latency_*   (Network latency metrics)
#    - themis_dtxn_*            (Distributed transaction metrics)
#    - themis_saga_*            (SAGA pattern metrics)
#
# 4. TrueTime & Clock Metrics:
#    - themis_truetime_sync_count         (Total synchronizations)
#    - themis_truetime_sync_failures      (Failed synchronizations)
#    - themis_truetime_clock_offset_us    (Clock offset from reference)
#    - themis_truetime_uncertainty_us     (Current uncertainty interval)
#    - themis_truetime_max_skew_us        (Maximum observed clock skew)
#    - themis_truetime_drift_rate_ppm     (Clock drift rate)
#
# 5. Network Latency Metrics:
#    - themis_shard_latency_rtt_us{quantile}      (Round-trip time)
#    - themis_shard_latency_one_way_us{quantile}  (One-way latency)
#    - themis_shard_ping_success_rate             (Ping success rate)
#    - themis_shard_reachable                     (Shard reachability)
#
# 6. Distributed Transaction Metrics:
#    - themis_dtxn_started_total                  (Transactions started)
#    - themis_dtxn_committed_total                (Transactions committed)
#    - themis_dtxn_aborted_total                  (Transactions aborted)
#    - themis_dtxn_duration_seconds{quantile}     (Transaction duration)
#    - themis_dtxn_active                         (Active transactions)
#    - themis_dtxn_2pc_prepare_duration_seconds   (2PC prepare phase)
#    - themis_dtxn_2pc_commit_duration_seconds    (2PC commit phase)
#    - themis_dtxn_commit_wait_duration_us        (Commit-wait duration)
#    - themis_dtxn_deadlock_detected_total        (Deadlocks detected)
#
# 7. SAGA Metrics:
#    - themis_saga_started_total                  (SAGAs started)
#    - themis_saga_completed_total                (SAGAs completed)
#    - themis_saga_compensated_total              (SAGAs compensated)
#    - themis_saga_steps_executed_total           (Steps executed)
#    - themis_saga_steps_compensated_total        (Steps compensated)
#    - themis_saga_duration_seconds{quantile}     (SAGA duration)
#
# 8. Example Prometheus Queries:
#
#    # Average transaction latency
#    rate(themis_dtxn_duration_seconds_sum[5m]) / rate(themis_dtxn_duration_seconds_count[5m])
#
#    # Transaction success rate
#    rate(themis_dtxn_committed_total[5m]) / rate(themis_dtxn_started_total[5m])
#
#    # Network latency to specific shard
#    themis_shard_latency_one_way_us{local="shard-1",remote="shard-2",quantile="p95"}
#
#    # Clock uncertainty trend
#    themis_truetime_uncertainty_us
#
#    # Active transactions by isolation level
#    themis_dtxn_active{isolation_level="SNAPSHOT_ISOLATION"}
#
# 9. Grafana Dashboard:
#    Auto-generated dashboard available at:
#    POST /api/grafana/dashboard
