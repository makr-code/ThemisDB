# Customer Service Process Models
# ================================
# Process models for customer service and support workflows
# Based on customer service best practices
#
# Version: 1.1
# Date: 2025-12-24
# Status: Enhanced with LLM Support
#
# LLM Integration: See LLM_INTEGRATION_GUIDE.md for framework details

customer_service_models:
  
  # =========================================================================
  # Customer Complaint Handling
  # =========================================================================
  
  - id: complaint_handling_standard
    name: "Beschwerdemanagement"
    name_en: "Complaint Handling"
    domain: "Kundenservice"
    domain_en: "Customer Service"
    description: "Standard-Beschwerdeprozess"
    description_en: "Standard complaint handling process"
    
    activities:
      - id: "complaint_receipt"
        name: "Beschwerdeeingang"
        name_en: "Complaint Receipt"
        type: "start"
        description: "Eingang der Kundenbeschwerde"
        sla_hours: 0
        
      - id: "complaint_acknowledgment"
        name: "Eingangsbestätigung"
        name_en: "Acknowledgment"
        type: "task"
        description: "Bestätigung des Eingangs an Kunden"
        sla_hours: 4
        responsible_role: "Customer Service"
        
      - id: "complaint_categorization"
        name: "Kategorisierung"
        name_en: "Categorization"
        type: "task"
        description: "Kategorisierung und Priorisierung"
        sla_hours: 8
        responsible_role: "Customer Service"
        
      - id: "investigation"
        name: "Untersuchung"
        name_en: "Investigation"
        type: "task"
        description: "Analyse des Sachverhalts"
        sla_hours: 24
        responsible_role: "Quality Manager"
        
      - id: "root_cause_analysis"
        name: "Ursachenanalyse"
        name_en: "Root Cause Analysis"
        type: "task"
        description: "Ermittlung der Grundursache"
        sla_hours: 16
        responsible_role: "Quality Manager"
        
      - id: "solution_development"
        name: "Lösungsentwicklung"
        name_en: "Solution Development"
        type: "task"
        description: "Entwicklung einer Lösung"
        sla_hours: 24
        responsible_role: "Customer Service Manager"
        
      - id: "customer_response"
        name: "Kundenantwort"
        name_en: "Customer Response"
        type: "task"
        description: "Rückmeldung an Kunden"
        sla_hours: 8
        responsible_role: "Customer Service"
        
      - id: "corrective_action"
        name: "Korrekturmaßnahmen"
        name_en: "Corrective Action"
        type: "task"
        description: "Umsetzung von Korrekturmaßnahmen"
        sla_hours: 72
        responsible_role: "Operations"
        optional: true
        
      - id: "customer_satisfaction_check"
        name: "Zufriedenheitsprüfung"
        name_en: "Satisfaction Check"
        type: "task"
        description: "Überprüfung der Kundenzufriedenheit"
        sla_hours: 24
        responsible_role: "Customer Service"
        
      - id: "complaint_closure"
        name: "Abschluss"
        name_en: "Closure"
        type: "end"
        description: "Abschluss der Beschwerde"
        sla_hours: 8
        responsible_role: "Customer Service"
    
    edges:
      - from: "complaint_receipt"
        to: "complaint_acknowledgment"
      - from: "complaint_acknowledgment"
        to: "complaint_categorization"
      - from: "complaint_categorization"
        to: "investigation"
      - from: "investigation"
        to: "root_cause_analysis"
      - from: "root_cause_analysis"
        to: "solution_development"
      - from: "solution_development"
        to: "customer_response"
      - from: "customer_response"
        to: "corrective_action"
        type: "conditional"
        condition: "requires_corrective_action"
      - from: "customer_response"
        to: "customer_satisfaction_check"
        type: "conditional"
        condition: "no_corrective_action_needed"
      - from: "corrective_action"
        to: "customer_satisfaction_check"
      - from: "customer_satisfaction_check"
        to: "complaint_closure"
    
    complaint_categories:
      - category: "Produktqualität"
        description: "Mängel am Produkt"
        priority: "high"
        
      - category: "Lieferverzögerung"
        description: "Verspätete Lieferung"
        priority: "medium"
        
      - category: "Servicequalität"
        description: "Unzufriedenheit mit Service"
        priority: "medium"
        
      - category: "Abrechnung"
        description: "Fehler in der Rechnung"
        priority: "high"
    
    compliance:
      - rule: "ISO 10002"
        description: "Qualitätsmanagement - Kundenzufriedenheit - Leitfaden Beschwerdebehandlung"
        check_type: "iso_standard"
        
      - rule: "Dokumentationspflicht"
        description: "Vollständige Dokumentation aller Beschwerden"
        check_type: "audit_trail"
    
    semantic_tags:
      - "Kundenservice"
      - "Beschwerdemanagement"
      - "Qualitätsmanagement"
      - "Kundenzufriedenheit"
  
  # =========================================================================
  # Order Processing
  # =========================================================================
  
  - id: order_processing_ecommerce
    name: "Bestellabwicklung (E-Commerce)"
    name_en: "Order Processing (E-Commerce)"
    domain: "Kundenservice"
    domain_en: "Customer Service"
    description: "E-Commerce Bestellprozess"
    
    activities:
      - id: "order_placement"
        name: "Bestellung aufgeben"
        name_en: "Order Placement"
        type: "start"
        description: "Kunde gibt Bestellung auf"
        sla_hours: 0
        
      - id: "order_confirmation"
        name: "Bestellbestätigung"
        name_en: "Order Confirmation"
        type: "task"
        description: "Automatische Bestellbestätigung"
        sla_hours: 0.1
        responsible_role: "System"
        
      - id: "payment_processing"
        name: "Zahlungsabwicklung"
        name_en: "Payment Processing"
        type: "task"
        description: "Verarbeitung der Zahlung"
        sla_hours: 1
        responsible_role: "Payment Gateway"
        
      - id: "inventory_check"
        name: "Lagerprüfung"
        name_en: "Inventory Check"
        type: "task"
        description: "Prüfung der Warenverfügbarkeit"
        sla_hours: 2
        responsible_role: "Warehouse"
        
      - id: "picking"
        name: "Kommissionierung"
        name_en: "Picking"
        type: "task"
        description: "Zusammenstellung der Bestellung"
        sla_hours: 8
        responsible_role: "Warehouse"
        
      - id: "packing"
        name: "Verpackung"
        name_en: "Packing"
        type: "task"
        description: "Verpacken der Ware"
        sla_hours: 2
        responsible_role: "Warehouse"
        
      - id: "shipping"
        name: "Versand"
        name_en: "Shipping"
        type: "task"
        description: "Übergabe an Versanddienstleister"
        sla_hours: 4
        responsible_role: "Warehouse"
        
      - id: "tracking_notification"
        name: "Versandbenachrichtigung"
        name_en: "Tracking Notification"
        type: "task"
        description: "Information an Kunden mit Tracking-Link"
        sla_hours: 1
        responsible_role: "System"
        
      - id: "delivery"
        name: "Zustellung"
        name_en: "Delivery"
        type: "task"
        description: "Lieferung an Kunden"
        sla_hours: 48
        responsible_role: "Carrier"
        
      - id: "delivery_confirmation"
        name: "Zustellbestätigung"
        name_en: "Delivery Confirmation"
        type: "end"
        description: "Bestätigung der Zustellung"
        sla_hours: 1
        responsible_role: "System"
    
    edges:
      - from: "order_placement"
        to: "order_confirmation"
      - from: "order_confirmation"
        to: "payment_processing"
      - from: "payment_processing"
        to: "inventory_check"
      - from: "inventory_check"
        to: "picking"
      - from: "picking"
        to: "packing"
      - from: "packing"
        to: "shipping"
      - from: "shipping"
        to: "tracking_notification"
      - from: "tracking_notification"
        to: "delivery"
      - from: "delivery"
        to: "delivery_confirmation"
    
    milestones:
      - id: "M1"
        name: "Bestellung eingegangen"
        activity: "order_placement"
        
      - id: "M2"
        name: "Zahlung erfolgreich"
        activity: "payment_processing"
        
      - id: "M3"
        name: "Versandt"
        activity: "shipping"
        
      - id: "M4"
        name: "Zugestellt"
        activity: "delivery_confirmation"
    
    compliance:
      - rule: "Widerrufsrecht"
        description: "14 Tage Widerrufsrecht für Verbraucher"
        check_type: "consumer_rights"
        
      - rule: "Datenschutz"
        description: "DSGVO-konforme Verarbeitung von Kundendaten"
        check_type: "data_protection"
    
    semantic_tags:
      - "E-Commerce"
      - "Bestellabwicklung"
      - "Logistik"
      - "Versand"
  
  # =========================================================================
  # Return and Refund Process
  # =========================================================================
  
  - id: return_refund_process
    name: "Rückgabe und Erstattung"
    name_en: "Return and Refund"
    domain: "Kundenservice"
    domain_en: "Customer Service"
    description: "Prozess für Warenrückgaben und Erstattungen"
    
    activities:
      - id: "return_request"
        name: "Rückgabeanfrage"
        name_en: "Return Request"
        type: "start"
        description: "Kunde stellt Rückgabeanfrage"
        sla_hours: 0
        
      - id: "return_authorization"
        name: "Rückgabegenehmigung"
        name_en: "Return Authorization"
        type: "task"
        description: "Prüfung und Genehmigung der Rückgabe"
        sla_hours: 24
        responsible_role: "Customer Service"
        
      - id: "return_label_generation"
        name: "Rücksendeetikett erstellen"
        name_en: "Return Label Generation"
        type: "task"
        description: "Erstellung und Versand des Rücksendeetiketts"
        sla_hours: 4
        responsible_role: "System"
        
      - id: "goods_return_shipment"
        name: "Warenrücksendung"
        name_en: "Goods Return Shipment"
        type: "task"
        description: "Kunde sendet Ware zurück"
        sla_hours: 336  # 14 Tage
        responsible_role: "Customer"
        
      - id: "goods_receipt"
        name: "Wareneingang"
        name_en: "Goods Receipt"
        type: "task"
        description: "Eingang der Rücksendung"
        sla_hours: 8
        responsible_role: "Warehouse"
        
      - id: "quality_inspection"
        name: "Qualitätsprüfung"
        name_en: "Quality Inspection"
        type: "task"
        description: "Prüfung des Warenzustands"
        sla_hours: 24
        responsible_role: "Quality Control"
        
      - id: "refund_processing"
        name: "Erstattung"
        name_en: "Refund Processing"
        type: "task"
        description: "Rückerstattung des Kaufpreises"
        sla_hours: 48
        responsible_role: "Finance"
        
      - id: "customer_notification"
        name: "Kundenbenachrichtigung"
        name_en: "Customer Notification"
        type: "end"
        description: "Information an Kunden über Erstattung"
        sla_hours: 4
        responsible_role: "Customer Service"
    
    edges:
      - from: "return_request"
        to: "return_authorization"
      - from: "return_authorization"
        to: "return_label_generation"
      - from: "return_label_generation"
        to: "goods_return_shipment"
      - from: "goods_return_shipment"
        to: "goods_receipt"
      - from: "goods_receipt"
        to: "quality_inspection"
      - from: "quality_inspection"
        to: "refund_processing"
      - from: "refund_processing"
        to: "customer_notification"
    
    return_reasons:
      - reason: "Defekt"
        refund_type: "full"
        restocking_fee: false
        
      - reason: "Falsche Lieferung"
        refund_type: "full"
        restocking_fee: false
        
      - reason: "Nicht wie beschrieben"
        refund_type: "full"
        restocking_fee: false
        
      - reason: "Gefällt nicht"
        refund_type: "full"
        restocking_fee: false
        
      - reason: "Größe passt nicht"
        refund_type: "full"
        restocking_fee: false
    
    compliance:
      - rule: "Widerrufsrecht §312g BGB"
        description: "Gesetzliches 14-Tage-Widerrufsrecht"
        check_type: "consumer_rights"
        
      - rule: "Gewährleistung §437 BGB"
        description: "Gesetzliche Gewährleistungsrechte"
        check_type: "warranty"
    
    semantic_tags:
      - "Rückgabe"
      - "Erstattung"
      - "Widerrufsrecht"
      - "Kundenservice"

# =============================================================================
# Model Metadata
# =============================================================================

metadata:
  version: "1.0"
  last_updated: "2025-12-24"
  author: "ThemisDB Team"
  license: "MIT"
  language: "de-DE"
  
  categories:
    - id: "complaint_management"
      name: "Beschwerdemanagement"
      name_en: "Complaint Management"
      models: ["complaint_handling_standard"]
      
    - id: "ecommerce"
      name: "E-Commerce"
      name_en: "E-Commerce"
      models: ["order_processing_ecommerce", "return_refund_process"]
  
  standards:
    - name: "ISO 10002"
      description: "Quality management - Customer satisfaction - Guidelines for complaints handling"
      url: "https://www.iso.org/standard/65712.html"
      
    - name: "BGB (Bürgerliches Gesetzbuch)"
      description: "German Civil Code - Consumer rights and warranties"
      url: "https://www.gesetze-im-internet.de/bgb/"

# =============================================================================
# LLM Integration for Customer Service Processes
# =============================================================================

llm_integration:
  complaint_handling:
    llm_prompts:
      - task: "analyze_sentiment"
        prompt: |
          Analysiere die Beschwerde auf Stimmung und Dringlichkeit:
          
          Beschwerdetext: {complaint_text}
          Kategorie: {category}
          
          Bewerte:
          1. Sentiment (positiv/neutral/negativ/sehr negativ)
          2. Dringlichkeitsstufe (niedrig/mittel/hoch/kritisch)
          3. Eskalationsrisiko
          4. Empfohlene Reaktionszeit
      
      - task: "recommend_solution"
        prompt: |
          Basierend auf ähnlichen Beschwerden, empfehle eine Lösung:
          
          Beschwerde: {complaint}
          Kategorie: {category}
          Ähnliche gelöste Fälle: {similar_cases}
          
          Gib zurück:
          1. Top 3 Lösungsvorschläge
          2. Geschätzte Zufriedenheit für jede Lösung
          3. Implementierungsschritte
    
    llm_test_cases:
      - name: "High priority complaint"
        input:
          sentiment: "very_negative"
          urgency: "high"
        expected_behavior:
          escalation_recommended: true
          response_time_hours: "<= 4"
  
  order_processing:
    llm_prompts:
      - task: "predict_delivery_issues"
        prompt: |
          Sage potenzielle Lieferprobleme vorher:
          
          Bestellung: {order_id}
          Zieladresse: {address}
          Wetter: {weather_data}
          Carrier-Performance: {carrier_stats}
          
          Risikoanalyse für:
          1. Verspätung
          2. Beschädigung
          3. Zustellprobleme

llm_benchmarks:
  accuracy_requirements:
    sentiment_analysis: ">= 0.85"
    urgency_classification: ">= 0.80"
    solution_recommendation_relevance: ">= 0.75"
