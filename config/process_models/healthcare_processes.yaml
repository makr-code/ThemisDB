# =============================================================================
# LLM Integration for Healthcare Processes
# =============================================================================

llm_integration:
  common_prompts:
    - task: "check_patient_safety"
      prompt: |
        Prüfe diesen medizinischen Prozess auf Patientensicherheit:
        
        Prozess: {process_type}
        Aktivitäten: {trace}
        Patient-ID: {patient_id}
        
        Überprüfe:
        1. Wurden alle Sicherheitsprotokolle eingehalten?
        2. 5R-Regel bei Medikamentengabe (falls relevant)
        3. Patientenidentifikation korrekt durchgeführt?
        4. Datenschutz (DSGVO Art. 9) eingehalten?
        5. Kritische Sicherheitsrisiken
  
  medication_management:
    llm_prompts:
      - task: "verify_5r_rule"
        prompt: |
          Verifiziere die Einhaltung der 5R-Regel bei Medikamentengabe:
          
          Prozess-Trace: {trace}
          Verordnung: {prescription}
          Dokumentation: {documentation}
          
          Prüfe alle 5 Rechte:
          1. Richtiger Patient (Identifikation durchgeführt?)
          2. Richtiges Medikament (Barcode-Scan?)
          3. Richtige Dosis (Doppelcheck?)
          4. Richtiger Zeitpunkt (Zeitplan eingehalten?)
          5. Richtige Applikationsform (Darreichungsform korrekt?)
          
          Bewerte pro Regel: ✓ eingehalten / ✗ verletzt / ? unklar
        expected_output:
          schema:
            type: "object"
            required: ["five_rights_check", "overall_compliance", "violations"]
            properties:
              five_rights_check:
                type: "object"
                properties:
                  right_patient: {enum: ["compliant", "violated", "unclear"]}
                  right_medication: {enum: ["compliant", "violated", "unclear"]}
                  right_dose: {enum: ["compliant", "violated", "unclear"]}
                  right_time: {enum: ["compliant", "violated", "unclear"]}
                  right_route: {enum: ["compliant", "violated", "unclear"]}
              overall_compliance: {type: "boolean"}
              violations: {type: "array"}
              risk_level: {enum: ["low", "medium", "high", "critical"]}
    
    llm_test_cases:
      - name: "Perfect 5R compliance"
        input:
          trace: ["prescription", "prescription_review", "medication_preparation", "patient_identification", "medication_administration", "documentation"]
          all_checks_completed: true
        expected_behavior:
          overall_compliance: true
          violations_count: 0
          risk_level: "low"
      
      - name: "Missing patient identification"
        input:
          trace: ["prescription", "medication_preparation", "medication_administration"]
          patient_identification_skipped: true
        expected_behavior:
          overall_compliance: false
          violated_right: "right_patient"
          risk_level: "critical"
  
  patient_admission:
    llm_prompts:
      - task: "predict_admission_duration"
        prompt: |
          Basierend auf Patientendaten, sage die voraussichtliche Verweildauer vorher:
          
          Diagnose: {diagnosis}
          Alter: {age}
          Komorbiditäten: {comorbidities}
          Behandlungsplan: {treatment_plan}
          
          Schätze:
          1. Wahrscheinlichste Verweildauer (Tage)
          2. Konfidenzintervall
          3. Hauptfaktoren für Schätzung
          4. Risikofaktoren für verlängerten Aufenthalt
  
  lab_testing:
    llm_prompts:
      - task: "validate_sample_chain"
        prompt: |
          Validiere die Proben-Kette (Chain of Custody):
          
          Trace: {trace}
          Proben-ID: {sample_id}
          Patient-ID: {patient_id}
          
          Prüfe:
          1. Eindeutige Probenidentifikation durchgehend vorhanden?
          2. Lückenlose Dokumentation aller Schritte?
          3. Zeitliche Plausibilität?
          4. Transport-Bedingungen eingehalten?
        expected_output:
          schema:
            type: "object"
            required: ["chain_valid", "issues"]
            properties:
              chain_valid: {type: "boolean"}
              issues: {type: "array"}
              iso15189_compliant: {type: "boolean"}

llm_benchmarks:
  accuracy_requirements:
    patient_safety_check: ">= 0.98"  # Sehr hoch wegen Kritikalität
    5r_rule_verification: ">= 0.95"
    admission_duration_prediction: ">= 0.75"
    privacy_compliance_check: ">= 0.95"
  
  performance_requirements:
    max_response_time_seconds: 3  # Schnell für klinischen Einsatz
  
  quality_requirements:
    false_negative_rate_safety: "< 0.02"  # Sehr niedrig für Sicherheit
    explanation_required: true
