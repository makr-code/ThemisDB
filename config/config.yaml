# =============================================================================
# ThemisDB Complete Configuration Reference
# Version: 1.3.0
# =============================================================================
#
# This file documents all available configuration options for ThemisDB.
# Copy this file to ./config.yaml or /etc/vccdb/config.yaml and adjust
# settings according to your deployment requirements.
#
# Configuration Format: YAML or JSON
# Default search paths:
#   1. ./config.yaml
#   2. ./config/config.yaml  
#   3. /etc/vccdb/config.yaml
#
# Override with: --config /path/to/config.yaml
#
# =============================================================================

# =============================================================================
# STORAGE CONFIGURATION (RocksDB)
# =============================================================================
storage:
  # Database path - where RocksDB stores data
  # Default: ./data/themis_server
  rocksdb_path: "./data/rocksdb"
  
  # WAL (Write-Ahead Log) directory (optional, separate from data)
  # Empty = store WAL in rocksdb_path
  # Use separate fast disk for WAL to improve write performance
  wal_dir: ""
  
  # Multiple paths for SSTables (advanced: distribute across NVMe drives)
  # db_paths:
  #   - path: "/mnt/nvme0/rocksdb"
  #     target_size_bytes: 107374182400  # 100 GB
  #   - path: "/mnt/nvme1/rocksdb"
  #     target_size_bytes: 107374182400  # 100 GB
  
  # ---------------------------------------------------------------------------
  # Memory Configuration
  # ---------------------------------------------------------------------------
  
  # Memtable size per column family (MB)
  # Higher = more memory usage, fewer flushes, better write performance
  # Recommendations: 64-128 MB (low RAM), 256 MB (medium), 512+ MB (high RAM)
  memtable_size_mb: 256
  
  # Block cache size (MB) - shared across all column families
  # Higher = better read performance, more memory usage
  # Recommendations: 512 MB (low RAM), 1024 MB (medium), 2048+ MB (high RAM)
  block_cache_size_mb: 1024
  
  # Block cache sharding (-1 = auto, 4 = 16 shards, 6 = 64 shards)
  # Higher shard count reduces lock contention with 8+ threads
  # -1 = automatic based on cache size
  block_cache_shard_bits: -1
  
  # Cache index and filter blocks in block cache
  # true = better for read-heavy workloads, uses more cache
  cache_index_and_filter_blocks: true
  
  # Pin L0 index/filter blocks in cache (prevents eviction)
  # Reduces L0 read latency at cost of cache space
  pin_l0_filter_and_index_blocks_in_cache: true
  
  # Use partitioned filters (recommended for large databases)
  # Reduces memory usage for bloom filters
  partition_filters: true
  
  # High-priority cache pool ratio (0.0-1.0)
  # Portion of cache reserved for index/filter blocks
  # 0.5 = 50% for index/filter, 50% for data blocks
  high_pri_pool_ratio: 0.5
  
  # Total write buffer size across all column families (MB, 0 = unlimited)
  # Limits total memory used by memtables
  db_write_buffer_size_mb: 0
  
  # ---------------------------------------------------------------------------
  # Write Configuration
  # ---------------------------------------------------------------------------
  
  # Enable Write-Ahead Log (WAL)
  # true = durability guaranteed, slower writes
  # false = faster writes, risk of data loss on crash
  enable_wal: true
  
  # Number of memtables per column family
  # Higher = more memory, better write performance under heavy load
  max_write_buffer_number: 3
  
  # Minimum memtables to merge before flush
  # 1 = flush each memtable separately (default)
  # 2+ = merge multiple memtables before flush (reduces write amplification)
  min_write_buffer_number_to_merge: 1
  
  # Allow concurrent writes to different memtables (v1.3.0)
  # Improves write throughput on multi-core systems
  allow_concurrent_memtable_write: true
  
  # Enable pipelined writes (v1.3.0)
  # Batches writes across multiple threads
  enable_pipelined_write: true
  
  # Allow unordered writes (advanced)
  # Better concurrency, may affect read-your-writes semantics
  allow_unordered_write: false
  
  # Disable WAL for benchmark mode (DANGER: data loss on crash!)
  # Only use for benchmarking, never in production
  disable_wal_for_benchmark: false
  
  # Transaction write policy (WriteCommitted, WritePrepared, WriteUnprepared)
  # WritePrepared = better lock granularity (recommended)
  # WriteCommitted = simpler, may have more contention
  write_policy: "WritePrepared"
  
  # Enable dual write queues (prepare/commit)
  # Reduces lock contention in transactions
  two_write_queues: true
  
  # Write-prepared commit cache size (2^N entries)
  # 23 = ~8M entries (recommended for high throughput)
  wp_commit_cache_bits: 23
  
  # ---------------------------------------------------------------------------
  # BlobDB Configuration (for large values)
  # ---------------------------------------------------------------------------
  
  # Enable BlobDB for large values
  # true = store large values separately from LSM tree
  enable_blobdb: true
  
  # Values larger than this go to BlobDB (bytes)
  # 4096 = 4 KB threshold (recommended)
  blob_size_threshold: 4096
  
  # ---------------------------------------------------------------------------
  # Compaction Configuration
  # ---------------------------------------------------------------------------
  
  # Background jobs (flushes + compactions)
  # Higher = faster compaction, more CPU/IO usage
  # Recommendations: 2-4 (low cores), 4-8 (medium), 8-16 (high cores)
  max_background_jobs: 4
  
  # Granular background thread control (advanced)
  # -1 = use max_background_jobs (auto)
  max_background_compactions: -1
  max_background_flushes: -1
  
  # Parallel sub-compactions per compaction job
  # 1 = single-threaded (default), 2+ = parallel
  max_subcompactions: 1
  
  # Background thread pool sizes
  background_threads_high: 2  # Flush threads
  background_threads_low: 2   # Compaction threads
  
  # Enable automatic high-parallelism tuning
  # Applies optimized settings when worker_threads >= threshold
  enable_high_parallel_tuning: false
  high_parallel_thread_threshold: 16
  
  # Use universal compaction (instead of leveled)
  # Universal = simpler, better for write-heavy workloads
  # Leveled = better for read-heavy, more predictable space amp
  use_universal_compaction: false
  
  # Dynamic level bytes (recommended for leveled compaction)
  # Automatically adjusts level sizes based on data size
  dynamic_level_bytes: true
  
  # Target SSTable file size (MB)
  # Larger = fewer files, slower compaction
  target_file_size_base_mb: 64
  
  # Maximum bytes for level base (MB)
  # First level after L0 size target
  max_bytes_for_level_base_mb: 256
  
  # Level 0 compaction triggers (write stall prevention)
  level0_file_num_compaction_trigger: 4   # Start L0->L1 compaction
  level0_slowdown_writes_trigger: 20      # Slow down writes
  level0_stop_writes_trigger: 36          # Stop writes completely
  
  # ---------------------------------------------------------------------------
  # Bloom Filters
  # ---------------------------------------------------------------------------
  
  # Bloom filter bits per key
  # Higher = better point lookup, more memory
  # 10 = ~1% false positive rate (recommended)
  bloom_bits_per_key: 10
  
  # ---------------------------------------------------------------------------
  # I/O Configuration
  # ---------------------------------------------------------------------------
  
  # Use direct I/O for reads (bypasses OS page cache)
  # Useful with large block cache to avoid double caching
  use_direct_reads: false
  
  # Use direct I/O for flush and compaction
  # Reduces OS page cache pollution
  use_direct_io_for_flush_and_compaction: false
  
  # Async I/O with prefetching (v1.3.0, advanced)
  enable_async_io: false
  async_io_readahead_size_mb: 64
  async_io_multiget_batch_size: 100
  async_io_num_threads: 4
  
  # ---------------------------------------------------------------------------
  # Compression
  # ---------------------------------------------------------------------------
  
  compression:
    # Default compression for all levels
    # Options: none, lz4, zstd, snappy, zlib, bzip2, lz4hc
    # lz4 = fast, good compression ratio (recommended)
    # zstd = better ratio, slower (good for cold data)
    default: "lz4"
    
    # Bottommost level compression (cold data)
    # Use zstd for best compression on rarely accessed data
    bottommost: "zstd"
  
  # ---------------------------------------------------------------------------
  # TTL (Time-To-Live) Configuration
  # ---------------------------------------------------------------------------
  
  # Enable automatic data expiration
  enable_ttl: false
  
  # TTL in seconds (0 = disabled)
  # Data older than this is automatically deleted
  ttl_seconds: 0

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
server:
  # Bind address (0.0.0.0 = all interfaces)
  host: "0.0.0.0"
  
  # HTTP API port
  port: 8765
  
  # Worker threads (0 = auto-detect CPU cores)
  # Higher = better concurrency, more memory usage
  # Recommendations: CPU cores (default), CPU cores * 2 (high load)
  worker_threads: 0
  
  # Maximum HTTP request size (MB)
  max_request_size_mb: 10
  
  # Request timeout (milliseconds)
  request_timeout_ms: 30000
  
  # Maximum concurrent connections
  # Adjust based on expected load and memory
  max_connections: 100
  
  # ---------------------------------------------------------------------------
  # TLS/SSL Configuration (HTTPS)
  # ---------------------------------------------------------------------------
  
  # Enable HTTPS with TLS
  enable_tls: false
  
  # Server certificate path (PEM format)
  tls_cert_path: ""
  
  # Private key path (PEM format)
  tls_key_path: ""
  
  # CA certificate for mTLS client verification (optional)
  tls_ca_cert_path: ""
  
  # Require client certificates (mutual TLS)
  tls_require_client_cert: false
  
  # Minimum TLS version (TLSv1.2 or TLSv1.3)
  tls_min_version: "TLSv1.3"
  
  # OpenSSL cipher list (empty = secure defaults)
  tls_cipher_list: ""
  
  # ---------------------------------------------------------------------------
  # HTTP Protocol Configuration
  # ---------------------------------------------------------------------------
  
  # Enable HTTP/2 protocol (requires TLS with ALPN)
  enable_http2: false
  
  # Enable HTTP/3 (QUIC) protocol
  enable_http3: false
  
  # HTTP/3 UDP port (0 = same as main port)
  http3_port: 0
  
  # Enable WebSocket protocol
  enable_websocket: false
  
  # HTTP/2 settings
  http2_max_concurrent_streams: 100
  http2_initial_window_size: 65535
  
  # HTTP/3 settings
  http3_max_idle_timeout_ms: 30000
  
  # WebSocket settings
  websocket_max_message_size: 1048576  # 1 MB
  websocket_ping_interval_ms: 30000    # 30 seconds
  websocket_cdc_poll_interval_ms: 500  # 500 ms
  
  # ---------------------------------------------------------------------------
  # Health/Error Service Configuration
  # ---------------------------------------------------------------------------
  # Separate lightweight service for health checks and error diagnostics
  # Runs on independent port to ensure observability even when main server fails
  
  # Enable Health/Error service
  health_error_service_enabled: true
  
  # Bind address for Health/Error service (localhost by default for security)
  # Use "0.0.0.0" to expose on all interfaces
  health_error_service_bind_address: "127.0.0.1"
  
  # Port for Health/Error service
  # Default: 9090 (separate from main HTTP port)
  # Override with environment variable: THEMIS_HEALTH_PORT
  health_error_service_port: 9090

# =============================================================================
# PORT MAPPING REFERENCE
# =============================================================================
# ThemisDB uses the following ports by default:
#
# Main Services:
#   - 8765: HTTP API (main REST/AQL endpoint)
#   - 9090: Health/Error Service (diagnostics, separate from main server)
#
# Optional Services (when enabled):
#   - 8080: Alternative HTTP port (configurable)
#   - 50051: gRPC service (when THEMIS_ENABLE_GRPC=ON)
#   - 9091: Prometheus metrics (when metrics enabled)
#   - Custom: HTTP/3 QUIC port (configurable via http3_port)
#
# Environment Variables:
#   - THEMIS_HTTP_PORT: Override main HTTP port (default: 8765)
#   - THEMIS_HEALTH_PORT: Override health service port (default: 9090)
#   - THEMIS_HEALTH_BIND_ADDRESS: Override health service bind address
#
# Docker Port Mapping:
#   Container → Host
#   - 8765:8765  Main HTTP API
#   - 9090:9090  Health/Error Service
#   - 50051:50051 gRPC (if enabled)
#
# Kubernetes Service Configuration:
#   See: docs/deployment/kubernetes-ports.md

# =============================================================================
# VECTOR INDEX CONFIGURATION
# =============================================================================
vector_index:
  # Object name (namespace) for vector index
  # Leave empty to disable auto-initialization
  object_name: "documents"
  
  # Vector dimension
  dimension: 768
  
  # Distance metric (COSINE, L2, DOT)
  # COSINE = cosine similarity (recommended for embeddings)
  # L2 = Euclidean distance
  # DOT = dot product (for normalized vectors)
  metric: "COSINE"
  
  # Index engine (hnsw = Hierarchical Navigable Small World)
  engine: "hnsw"
  
  # ---------------------------------------------------------------------------
  # HNSW Parameters
  # ---------------------------------------------------------------------------
  
  # HNSW M parameter (number of connections per node)
  # Higher = better recall, more memory, slower build
  # Recommendations: 8-16 (low memory), 16-32 (medium), 32-64 (high memory)
  hnsw_m: 16
  
  # HNSW ef_construction (index build time parameter)
  # Higher = better quality, slower build
  # Recommendations: 100-200 (default), 400-800 (high quality)
  hnsw_ef_construction: 200
  
  # HNSW ef_search (search time parameter)
  # Higher = better recall, slower search
  # Can be adjusted at runtime via API
  # Recommendations: 50-64 (default), 100-200 (high recall)
  ef_search: 64
  
  # Maximum number of vectors
  # Pre-allocates memory for this many vectors
  max_elements: 100000
  
  # ---------------------------------------------------------------------------
  # GPU Acceleration (optional)
  # ---------------------------------------------------------------------------
  
  # Enable GPU acceleration (requires CUDA/FAISS GPU)
  use_gpu: false
  
  # ---------------------------------------------------------------------------
  # Persistence
  # ---------------------------------------------------------------------------
  
  # Enable auto-save on shutdown
  auto_save: true
  
  # Path to save/load vector index
  save_path: "./data/vector_indexes"
  
  # Save index on server shutdown
  save_on_shutdown: true
  
  # Load index on server startup
  load_on_startup: true

# =============================================================================
# TRACING CONFIGURATION (OpenTelemetry)
# =============================================================================
tracing:
  # Enable distributed tracing
  enabled: false
  
  # Service name for traces
  service_name: "themis-server"
  
  # OpenTelemetry Protocol (OTLP) endpoint
  # Example: Jaeger collector at http://localhost:4318
  otlp_endpoint: "http://localhost:4318"

# =============================================================================
# FEATURE FLAGS
# =============================================================================
features:
  # Semantic cache for query results
  # Caches query results based on semantic similarity
  semantic_cache: false
  
  # LLM store for embeddings and model management
  llm_store: false
  
  # LLM query enhancement (Enterprise feature)
  # Includes LLM context in queries
  llm_query_enhancement: false
  
  # Change Data Capture (CDC) for real-time replication
  cdc: false
  
  # Time-series data support
  timeseries: false
  
  # PII (Personally Identifiable Information) manager
  # Persistence for PII mappings
  pii_manager: false
  
  # GitHub update checker
  # Checks for new ThemisDB versions
  update_checker: false
  
  # ---------------------------------------------------------------------------
  # Data Retention Policies
  # ---------------------------------------------------------------------------
  retention:
    # Enable automatic data retention
    enabled: false
    
    # Retention check interval (hours)
    # How often to check and apply retention policies
    interval_hours: 24
    
    # Path to retention policies YAML file
    policies_path: "./config/retention_policies.yaml"

# =============================================================================
# SSE/CDC STREAMING CONFIGURATION
# =============================================================================
sse:
  # Maximum events per second per connection (0 = unlimited)
  # Server-side rate limiting for SSE streams
  # Recommended: 100-1000 for production to prevent overwhelming clients
  max_events_per_second: 0
  
  # Maximum buffered events per connection
  # Events are buffered when client can't keep up with changefeed rate
  # Recommended: 1000-10000 depending on memory availability
  max_buffered_events: 1000
  
  # Heartbeat interval (milliseconds)
  # Prevents connection timeout during idle periods
  heartbeat_interval_ms: 15000
  
  # Event poll interval (milliseconds)
  # How often to check changefeed for new events
  event_poll_interval_ms: 500
  
  # Drop oldest events on buffer overflow
  # true: Drop oldest events when buffer full (prevent memory issues)
  # false: Drop newest events (preserve historical order)
  drop_oldest_on_overflow: true

# =============================================================================
# API RATE LIMITING
# =============================================================================
rate_limiting:
  # Audit API rate limit (requests per minute, 0 = unlimited)
  audit_rate_limit_per_minute: 100
  
  # Global rate limiter configuration (RateLimiter V1)
  # For backwards compatibility - prefer V2 for new deployments
  bucket_capacity: 100              # Maximum burst capacity (tokens)
  refill_rate: 100                  # Tokens refilled per minute
  window_seconds: 60                # Time window for rate limit
  per_ip_enabled: true              # Enable per-IP rate limiting
  per_user_enabled: true            # Enable per-user rate limiting (requires auth)
  
  # Rate Limiter V2 configuration (PerClientRateLimiter with priority lanes)
  # Preferred for new deployments - supports priority lanes for VIP clients
  v2:
    enabled: false                  # Enable V2 rate limiter (recommended)
    capacity_per_client: 100        # Tokens per client
    refill_rate_per_client: 10      # Tokens per second per client
    max_clients: 10000              # Maximum tracked clients
    cleanup_interval_minutes: 5     # Idle client cleanup interval
    
    # Priority lane configuration
    enable_priority_lanes: true     # Enable HIGH/NORMAL/LOW priority lanes
    high_capacity: 2000             # VIP client burst capacity
    high_refill_rate: 200           # VIP client sustained rate (tokens/s)
    low_capacity: 500               # Low-priority burst capacity
    low_refill_rate: 50             # Low-priority sustained rate (tokens/s)

# =============================================================================
# TENANT RESOURCE QUOTAS (Multi-tenancy)
# =============================================================================
tenants:
  # Enable tenant-based resource quotas and isolation
  # Set to true to enable quota enforcement in production
  enforce_quotas: false
  
  # Tenant identification
  tenant_header: "X-Tenant-ID"      # HTTP header for tenant ID
  tenant_path_prefix: "/tenants/"   # Path prefix for tenant routing
  
  # Default tenant for single-tenant deployments
  default_tenant_id: "default"
  allow_default_tenant: true        # Allow requests without tenant ID
  
  # Global tenant limits
  max_tenants: 1000                 # Maximum number of tenants
  
  # Default per-tenant resource quotas (can be overridden per tenant)
  default_quotas:
    max_storage_bytes: 0            # 0 = unlimited, otherwise bytes limit
    max_documents: 0                # 0 = unlimited, otherwise document count
    max_collections: 0              # 0 = unlimited, otherwise collection count
    max_concurrent_queries: 100     # Maximum concurrent queries per tenant
    max_connections: 50             # Maximum simultaneous connections per tenant
    requests_per_second: 1000       # Rate limit per tenant (req/s)
    burst_size: 100                 # Token bucket burst size per tenant

# =============================================================================
# LLM CONFIGURATION (Optional - requires llama.cpp integration)
# =============================================================================
# See config/llm_config.example.yaml for detailed LLM configuration
# Uncomment and adjust the following sections if using LLM features:
#
# llm:
#   enabled: true
#   default_plugin: "llamacpp"
#   plugin_paths:
#     - "./plugins"
#   auto_load: true
#
# llm_plugins:
#   llamacpp:
#     type: "llama.cpp"
#     enabled: true
#     model:
#       path: "/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf"
#       auto_load: true
#     gpu:
#       n_layers: 32
#       use_cuda: true
#       max_vram_mb: 14336
#     context:
#       n_ctx: 4096
#       n_batch: 512
#       n_threads: 8
#
# For complete LLM configuration options, see:
# - config/llm_config.example.yaml
# - docs/de/guides/LLM_COMPLETE_SETUP_GUIDE.md

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================
performance:
  # Enable RocksDB statistics collection
  enable_statistics: true
  
  # Optimize for point lookups (trades off range scans)
  # Increases bloom filter size and hash index usage
  optimize_for_point_lookup: false

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  # Log level (DEBUG, INFO, WARN, ERROR)
  level: "INFO"
  
  # Log file path
  file: "./logs/themis_server.log"
  
  # Maximum log file size (MB) before rotation
  max_size_mb: 100
  
  # Maximum number of rotated log files to keep
  max_files: 5

