# ThemisDB Feature Configuration Template
# 
# This file provides a template for runtime feature configuration.
# It shows how compile-time CMake flags map to runtime configuration options.
#
# Usage:
#   1. Copy this file to config/features.yaml
#   2. Edit the settings to match your deployment requirements
#   3. Start ThemisDB with: ./themis_server --config config/features.yaml

# =============================================================================
# EDITION SELECTION
# =============================================================================
# Choose your edition: MINIMAL, COMMUNITY, ENTERPRISE, HYPERSCALER
# This should match your compile-time THEMIS_EDITION setting

edition: COMMUNITY

server:
  # Runtime activation profile (validated against compile-time capabilities)
  # Allowed values: minimal, standard, enterprise
  profile: standard

# =============================================================================
# CORE FEATURES
# =============================================================================
# Features that fundamentally change ThemisDB's capabilities

llm:
  # Compile-time flag: THEMIS_ENABLE_LLM
  enabled: false
  
  # LLM-specific settings (only used if enabled=true)
  model_path: "./models/llama-2-7b.gguf"
  context_size: 4096
  batch_size: 512
  gpu_layers: 35  # Number of layers to offload to GPU (requires THEMIS_ENABLE_CUDA=ON)
  
gpu:
  # Compile-time flag: THEMIS_ENABLE_GPU
  enabled: false
  
  # GPU backend selection (CUDA, HIP, OpenCL, OneAPI)
  # Must match compile-time flags: THEMIS_ENABLE_CUDA, THEMIS_ENABLE_HIP, etc.
  backend: "CUDA"
  
  # Device selection
  device_id: 0  # Which GPU to use (0 = first GPU)
  
  # Memory management
  memory_fraction: 0.8  # Fraction of GPU memory to use (0.0-1.0)
  
distributed:
  # Compile-time flag: THEMIS_ENABLE_GRPC
  # Enables inter-shard communication via gRPC
  enabled: false
  
  # Shard configuration
  shard_id: 0
  total_shards: 1
  
  # gRPC endpoints for other shards
  peer_shards:
    - id: 1
      address: "themis-shard-1:50051"
    - id: 2
      address: "themis-shard-2:50051"

# =============================================================================
# PROTOCOL FEATURES
# =============================================================================
# Network protocol support

protocols:
  http2:
    # Compile-time flag: THEMIS_ENABLE_HTTP2
    enabled: true
    port: 8443
    max_concurrent_streams: 100
    
  http3:
    # Compile-time flag: THEMIS_ENABLE_HTTP3
    enabled: false
    port: 8444
    
  websocket:
    # Compile-time flag: THEMIS_ENABLE_WEBSOCKET
    enabled: true
    port: 8080
    ping_interval: 30  # seconds
    
  mqtt:
    # Compile-time flag: THEMIS_ENABLE_MQTT
    enabled: true
    port: 1883
    max_clients: 1000
    
  postgres_wire:
    # Compile-time flag: THEMIS_ENABLE_POSTGRES_WIRE
    enabled: true
    port: 5432
    
  mcp:
    # Compile-time flag: THEMIS_ENABLE_MCP
    # Model Context Protocol for LLM integrations
    enabled: false
    port: 8090
    
  sse:
    # Compile-time flag: THEMIS_ENABLE_SSE
    # Server-Sent Events for real-time streaming
    enabled: true
    max_connections: 10000

# =============================================================================
# OBSERVABILITY FEATURES
# =============================================================================

tracing:
  # Compile-time flag: THEMIS_ENABLE_TRACING
  enabled: false
  
  # OpenTelemetry settings
  exporter:
    type: "otlp-http"  # or "otlp-grpc", "jaeger", "zipkin"
    endpoint: "http://localhost:4317"
    
  sampling:
    rate: 0.1  # Sample 10% of requests
    
metrics:
  enabled: true
  
  # Prometheus exporter
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
    
  # Push gateway (optional)
  push_gateway:
    enabled: false
    endpoint: "http://localhost:9091"
    interval: 60  # seconds

# =============================================================================
# OPTIMIZATION FEATURES
# =============================================================================

optimizations:
  # Vector search optimization
  diskann:
    # Compile-time flag: THEMIS_ENABLE_DISKANN
    enabled: false
    
  # Memory allocator
  mimalloc:
    # Compile-time flag: THEMIS_ENABLE_MIMALLOC
    enabled: true
    
  # RocksDB WiscKey optimization
  wisckey:
    # Compile-time flag: THEMIS_ENABLE_WISCKEY
    enabled: true
    value_threshold: 1024  # bytes
    
  # SIMD optimizations (compile-time only)
  # These are determined by THEMIS_ENABLE_AVX2, THEMIS_ENABLE_ARM_NEON, etc.
  # Runtime detection will use the best available SIMD instructions
  simd:
    auto_detect: true
    
  # Huge pages (Linux only)
  huge_pages:
    # Compile-time flag: THEMIS_ENABLE_HUGE_PAGES
    enabled: false
    size: 2048  # KB

# =============================================================================
# CONTENT PROCESSING
# =============================================================================

content:
  processors:
    # Compile-time flag: THEMIS_ENABLE_CONTENT_PROCESSORS
    enabled: false
    
    # Which processors to enable
    pdf: true
    office: true
    image: true
    video: false  # Resource intensive
    audio: false
    
  vision:
    # Compile-time flag: THEMIS_ENABLE_VISION
    # Requires THEMIS_ENABLE_LLM=ON
    enabled: false
    model_path: "./models/llava-v1.5-7b.gguf"

# =============================================================================
# SECURITY FEATURES
# =============================================================================

security:
  tls:
    enabled: true
    cert_file: "./certs/server.crt"
    key_file: "./certs/server.key"
    ca_file: "./certs/ca.crt"
    
  authentication:
    methods:
      - "basic"      # Username/password
      - "jwt"        # JSON Web Tokens
      - "kerberos"   # Requires THEMIS_ENABLE_KERBEROS=ON
      - "mtls"       # Mutual TLS
      
  encryption:
    at_rest: true   # Encrypt data on disk
    in_transit: true  # Encrypt network traffic

# =============================================================================
# RESOURCE LIMITS
# =============================================================================

resources:
  # Memory limits
  memory:
    max_cache_size: "4GB"
    max_buffer_pool: "2GB"
    
  # Thread pool sizes
  threads:
    io_threads: 4
    worker_threads: 8
    
  # Network limits
  network:
    max_connections: 10000
    max_request_size: "100MB"
    
# =============================================================================
# LOGGING
# =============================================================================

logging:
  level: "info"  # debug, info, warn, error
  format: "json"  # json, text
  
  # Log destinations
  destinations:
    - type: "console"
      enabled: true
    - type: "file"
      enabled: true
      path: "./logs/themis.log"
      rotation: "daily"
      max_size: "100MB"
    - type: "syslog"
      enabled: false
      address: "localhost:514"

# =============================================================================
# FEATURE FLAG VALIDATION
# =============================================================================
# These are informational - they show which compile-time flags were enabled

build_info:
  # This section is populated at runtime by ThemisDB
  # It shows which features were compiled in
  
  # Example (will be filled by server at startup):
  # compile_flags:
  #   THEMIS_ENABLE_LLM: true
  #   THEMIS_ENABLE_GPU: false
  #   THEMIS_ENABLE_CUDA: false
  #   THEMIS_ENABLE_GRPC: true
  #   ...
  
  # edition: "COMMUNITY"
  # version: "1.3.0"
  # build_date: "2024-01-25"
  # cmake_flags: "-DTHEMIS_EDITION=COMMUNITY -DTHEMIS_ENABLE_GRPC=ON"
