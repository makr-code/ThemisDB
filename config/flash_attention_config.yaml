# Flash Attention v3 Configuration for ThemisDB
# Optimized for LLM inference with paged KV-cache

attention:
  # Backend selection
  backend: "auto"              # Options: auto, cuda_sm90, cuda_sm86, cuda_sm80, vulkan, hip_mi300, hip_rdna, cpu
  
  # Flash Attention version
  version: "v3"                # Use latest Flash Attention v3 (SM90+)
  enable_flash_v2: true        # Enable Flash Attention v2 optimizations
  enable_flash_v3: true        # Enable Flash Attention v3 (H100, RTX 6000 Ada only)
  
  # Kernel optimization flags
  enable_kernel_fusion: true
  enable_async_copy: true
  enable_tensor_cores: true
  enable_warp_specialization: true
  
  # KV-Cache configuration
  use_paged_kv_cache: true
  kv_block_size: 16            # Tokens per block
  num_kv_blocks: 4096          # Total blocks (64K tokens with block_size=16)
  enable_prefix_caching: true   # Enable prefix sharing via Copy-on-Write
  
  # Performance tuning
  tile_size: 64
  block_size: 256
  num_warps: 8
  
  # Quantization
  quantization: "fp16"         # Options: fp32, fp16, bf16, int8, q4

# Model configuration
model:
  batch_size: 32               # Maximum concurrent sequences
  max_seq_length: 4096         # Maximum sequence length
  num_heads: 32                # Number of attention heads
  head_dim: 128                # Dimension per head
  num_kv_heads: 8              # GQA: Number of KV heads (8 for Llama 2/3)
  
  # Attention parameters
  dropout_p: 0.0               # Dropout probability (0.0 for inference)
  use_causal_mask: true        # Enable causal masking for autoregressive models

# Performance settings
performance:
  prefill_chunk_size: 512      # Chunk size for prefill phase
  decode_batch_size: 32        # Batch size for decode phase
  enable_continuous_batching: true

# Optimization levels (presets)
optimization:
  preset: "balanced"           # Options: latency, throughput, balanced, memory_efficient
  
  # Preset configurations:
  # latency: Minimize latency (batch_size=1, aggressive caching)
  # throughput: Maximize throughput (large batches, kernel fusion)
  # balanced: Balance latency and throughput
  # memory_efficient: Minimize memory usage (aggressive KV-cache eviction)

# Hardware-specific tuning
hardware:
  # NVIDIA H100 (SM90)
  h100:
    enable_tma: true           # Tensor Memory Accelerator
    enable_hopper_features: true
    sm_count: 132              # 132 SMs on H100 SXM5
    
  # NVIDIA A100 (SM86)
  a100:
    enable_ampere_features: true
    sm_count: 108              # 108 SMs on A100 80GB
    
  # NVIDIA RTX 4090 (SM89)
  rtx4090:
    enable_ada_features: true
    sm_count: 128              # 128 SMs on RTX 4090

# Monitoring and logging
monitoring:
  enable_metrics: true
  enable_profiling: false      # Enable CUDA/ROCm profiling
  log_level: "info"            # Options: debug, info, warning, error

# Advanced settings
advanced:
  # Memory management
  memory_pool_size_mb: 8192    # Pre-allocate memory pool
  enable_memory_defragmentation: true
  
  # Numerical stability
  epsilon: 1e-6
  softmax_epsilon: 1e-10
  
  # Debug options
  validate_outputs: false       # Validate attention outputs (slow)
  compare_with_reference: false # Compare with reference implementation
