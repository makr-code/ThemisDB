# ThemisDB LLM Mode Pack – Default Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Schema: themis.ai/v1 / ThemisModePack
#
# This file defines all built-in LLM request modes and can be passed to
# themis_server via --mode-spec <path> or the config key:
#   llm.orchestrator.mode_spec_path
#
# Quickstart:
#   modes: ask, edit, rag, agentic, multi_agent, ethics
#
# See docs/llm_orchestration/README.md for full documentation.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: themis.ai/v1
kind: ThemisModePack

metadata:
  name: themisdb-default-modes
  version: "1.0.0"

# ─── Default mode ────────────────────────────────────────────────────────────
# Used when no mode is specified in a request.
default_mode: ask

# ─── Model Registry ──────────────────────────────────────────────────────────
# Models referenced by modes below.  Paths are resolved relative to the
# working directory or as absolute paths.
models:
  - id: default
    path: ""          # empty = use llm.default_plugin configured model
    gpu_layers: 0     # 0 = CPU; set to 32/48/99 for GPU offload
    n_ctx: 4096

# ─── Tool Registry ───────────────────────────────────────────────────────────
# MCP-style tool definitions.  Implementations are registered at runtime via
# AIOrchestrator::toolRegistry().registerTool().
tools:
  - name: docs_search
    description: "Search the ThemisDB documentation database for relevant content"
    timeout_ms: 5000
    schema:
      type: object
      properties:
        query:
          type: string
          description: "Search query"
        top_k:
          type: integer
          description: "Maximum number of results"
          default: 5
      required: [query]

  - name: aql_execute
    description: "Execute a read-only AQL query against the ThemisDB instance"
    timeout_ms: 10000
    # AI Safety Layer: enforce_read_only=true activates AqlSafetyValidator.
    # Any mutation operation (REMOVE, INSERT, UPDATE, REPLACE, UPSERT, DROP, TRUNCATE)
    # in the query string will be rejected with an AQL_READ_ONLY_VIOLATION error.
    # Full documentation: docs/de/security/ai_safety/AI_SAFETY_AQL_VALIDATOR.md
    enforce_read_only: true
    schema:
      type: object
      properties:
        query:
          type: string
          description: "AQL query string (read-only)"
        bind_vars:
          type: object
          description: "Query bind variables"
      required: [query]

  - name: schema_inspect
    description: "Retrieve the schema/structure of a collection or the whole database"
    timeout_ms: 3000
    schema:
      type: object
      properties:
        collection:
          type: string
          description: "Collection name; empty for all collections"

# ─── Modes ───────────────────────────────────────────────────────────────────

modes:

  # ── ask ────────────────────────────────────────────────────────────────────
  - id: ask
    description: "Plain question-answering without retrieval. Fast and direct."
    model: default
    tools_allowed: []        # No tools in ask mode
    retrieval:
      enabled: false
    output:
      format: text
    budgets:
      max_tokens: 512
      timeout_ms: 30000
      temperature: 0.7
      top_p: 0.9
      top_k: 40
    observability:
      log_requests: true
      log_responses: false
      metrics: true
      trace: false
    safety:
      enabled: false

  # ── edit ───────────────────────────────────────────────────────────────────
  - id: edit
    description: "Instruction-following / text editing mode. Lower temperature for determinism."
    model: default
    tools_allowed: []
    retrieval:
      enabled: false
    output:
      format: text
    budgets:
      max_tokens: 1024
      timeout_ms: 45000
      temperature: 0.3     # Lower for more deterministic edits
      top_p: 0.95
      top_k: 20
    observability:
      log_requests: true
      log_responses: false
      metrics: true
    safety:
      enabled: false

  # ── rag ────────────────────────────────────────────────────────────────────
  - id: rag
    description: "Retrieval-Augmented Generation using the documentation database."
    model: default
    tools_allowed:
      - docs_search
    retrieval:
      enabled: true
      strategy: hybrid       # vector + fulltext combined
      top_k: 5
      threshold: 0.35
      rerank: true
      chunking:
        size: 512
        overlap: 64
        strategy: sentence
    output:
      format: text
    budgets:
      max_tokens: 1024
      timeout_ms: 60000
      temperature: 0.5
      top_p: 0.9
    observability:
      log_requests: true
      log_responses: false
      metrics: true
    safety:
      enabled: false
    judge:
      enabled: false          # Enable to activate LLM-as-judge quality scoring
      model: default
      min_score: 0.6

  # ── agentic ────────────────────────────────────────────────────────────────
  - id: agentic
    description: "Single-agent mode with tool-use (ReAct pattern). Supports docs_search and AQL queries."
    model: default
    tools_allowed:
      - docs_search
      - aql_execute
      - schema_inspect
    retrieval:
      enabled: true
      strategy: hybrid
      top_k: 3
      threshold: 0.4
    output:
      format: text
      grammar: react_agent   # Constrain output to ReAct format
    budgets:
      max_tokens: 2048
      timeout_ms: 120000
      max_retries: 2
      temperature: 0.6
    observability:
      log_requests: true
      metrics: true
      trace: true
    # ── AI Safety Layer (Schichten 1–6) ──────────────────────────────────────
    # Prevents AI agents from executing destructive operations without human approval.
    # Full documentation: docs/de/security/ai_safety/AI_SAFETY_ARCHITECTURE.md
    safety:
      enabled: true
      # Operations requiring human approval before execution.
      # DESTRUCTIVE: delete_entity, drop_index, REMOVE @key
      # CRITICAL:    FOR x IN col REMOVE x IN col, DROP COLLECTION, TRUNCATE
      require_approval_for: [DESTRUCTIVE, CRITICAL]
      # Approval token TTL in seconds. Token expires if not approved/denied within this time.
      approval_timeout_s: 60
      # Return a dry-run preview before requesting approval (shows impact estimate).
      dry_run_preview: true
      # Automatically create a RocksDB checkpoint before executing approved destructive ops.
      auto_snapshot: true
      snapshot_dir: "/var/themis/ai-snapshots"

  # ── multi_agent ────────────────────────────────────────────────────────────
  - id: multi_agent
    description: "Multi-agent coordination mode. Skeleton for peer-agent message routing."
    model: default
    tools_allowed:
      - docs_search
    retrieval:
      enabled: false
    output:
      format: json
    budgets:
      max_tokens: 1024
      timeout_ms: 90000
      temperature: 0.5
    observability:
      log_requests: true
      metrics: true
      trace: true

  # ── ethics ─────────────────────────────────────────────────────────────────
  - id: ethics
    description: "Constitutional AI / ethics-aware mode. Integrates Ethics AI plugin."
    model: default
    tools_allowed:
      - docs_search
    retrieval:
      enabled: true
      strategy: hybrid
      top_k: 5
      threshold: 0.4
    output:
      format: text
    budgets:
      max_tokens: 1024
      timeout_ms: 60000
      temperature: 0.4     # More conservative
    observability:
      log_requests: true
      log_responses: true  # Log for ethics audit
      metrics: true
      trace: true
    safety:
      enabled: true
      ethics_profile: config/compliance/ethical_guidelines.yaml
    judge:
      enabled: true
      model: default
      min_score: 0.7       # Higher threshold for ethics mode
