# RAG Judge Configuration
# Phase 1: Core Framework & Prompt Engineering

rag_judge:
  # Enable/disable judge functionality
  enabled: true
  
  # Evaluation mode: fast, balanced, thorough
  # - fast: Quick relevance check only (~100ms)
  # - balanced: Multi-dimension evaluation (~500ms)
  # - thorough: Full evaluation with CoT and verification (~2s)
  mode: balanced
  
  # LLM configuration
  llm:
    # Model to use for judging
    model: "llama-3-70b-instruct"
    
    # Temperature for evaluation (lower = more consistent)
    temperature: 0.3
    
    # Maximum tokens for response
    max_tokens: 1024
    
    # Retry configuration
    max_retries: 3
    timeout_ms: 30000
  
  # Prompt template configuration
  prompts:
    # Directory containing custom templates (optional)
    template_dir: "./config/prompts/judge"
    
    # Individual template files (optional overrides)
    faithfulness: "prompts/faithfulness_v1.txt"
    relevance: "prompts/relevance_v1.txt"
    completeness: "prompts/completeness_v1.txt"
    coherence: "prompts/coherence_v1.txt"
  
  # Scoring weights (must sum to 1.0)
  scoring:
    faithfulness_weight: 0.4
    relevance_weight: 0.3
    completeness_weight: 0.2
    coherence_weight: 0.1
  
  # Quality thresholds
  quality_threshold: 0.7         # Minimum overall score to pass
  faithfulness_threshold: 0.8    # Critical for factual accuracy
  
  # Advanced evaluation options
  advanced:
    # Enable chain-of-thought reasoning
    use_chain_of_thought: true
    
    # Enable claim verification
    enable_claim_verification: true
    
    # Enable citation checking
    enable_citation_check: true
    
    # Maximum claims to verify (for performance)
    max_claims_to_verify: 10
  
  # Response parsing configuration
  parsing:
    # Use regex fallback if JSON parsing fails
    fallback_regex: true
    
    # Strict validation of JSON schema
    strict_validation: true
    
    # Score normalization range (1-5 scale to 0-1)
    score_min_range: 1.0
    score_max_range: 5.0
  
  # Performance optimization
  performance:
    # Cache evaluation results for identical inputs
    cache_evaluations: true
    
    # Run evaluations asynchronously
    async_evaluation: false
    
    # Batch size for batch evaluation
    batch_size: 8
    
    # Cache TTL in seconds
    cache_ttl_seconds: 7200
  
  # Ensemble configuration (advanced)
  ensemble:
    enabled: false
    judges: 3
    voting_strategy: "weighted_average"  # majority_voting, weighted_average, confidence_weighted
  
  # Monitoring and logging
  monitoring:
    # Track parsing success rate
    track_parsing_success: true
    
    # Log malformed responses
    log_malformed_responses: true
    
    # Alert on parsing failures (threshold)
    alert_failure_threshold: 0.1
    
    # Monitor score distributions
    monitor_score_distributions: true
