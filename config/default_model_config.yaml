# ThemisDB Default LLM Model Configuration
# TinyLlama 1.1B Chat - ThemisDB's default local text model
# Version: 1.0.0

default_llm:
  # Model identification
  model_id: "tinyllama"
  model_name: "TinyLlama 1.1B Chat"
  format: "gguf"
  quantization: "Q4_0"
  
  # Download configuration
  auto_download: false
  download_source: "local"
  
  # Ollama download settings
  ollama:
    model_name: "tinyllama:1.1b"
    endpoint: "http://localhost:11434"
    fallback_endpoints:
      - "http://127.0.0.1:11434"
  
  # Direct HuggingFace download (alternative)
  huggingface:
    enabled: false
    model_repo: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    filename: "default.gguf"
    download_url: ""
    checksum_algorithm: "sha256"
    checksum: ""  # To be verified on first download
    size_bytes: 637699456  # Local default.gguf artifact size
    verify_checksum: true
    resume_partial: true
  
  # Model storage
  storage:
    model_dir: "models"
    model_filename: "default.gguf"
    cache_dir: "models/cache"
    enable_compression: false  # GGUF already compressed
  
  # Runtime configuration
  runtime:
    context_size: 2048
    n_gpu_layers: 0  # CPU-only default (auto-detect GPU in production)
    threads: 4
    batch_size: 512
    rope_scaling_type: "default"
    
    # Memory limits
    memory:
      max_ram_mb: 2048
      max_vram_mb: 2048  # 2GB if GPU enabled
      kv_cache_mb: 512
  
  # TinyLlama architecture
  architecture:
    model_type: "llama"
    attention_type: "grouped_query_attention"
    num_attention_heads: 32
    num_key_value_heads: 4
    hidden_size: 2048
    intermediate_size: 5632
    num_hidden_layers: 22
    vocab_size: 32000
    
  # LoRA target modules for Llama-compatible TinyLlama
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  
  # Inference settings
  inference:
    # Sampling defaults
    temperature: 0.7
    top_p: 0.95
    top_k: 40
    repeat_penalty: 1.1
    
    # Performance
    enable_flash_attention: true
    enable_kv_cache: true
    enable_prefix_cache: true
    
    # Safety limits
    max_tokens: 2048
    timeout_seconds: 30
  
  # Lazy loading configuration
  lazy_loading:
    enabled: true
    priority: high  # High priority as default model
    ttl_seconds: 3600  # 1 hour
    pin_to_memory: true  # Keep in memory
    preload_on_startup: false  # Load on first use
  
  # Monitoring
  monitoring:
    enable_metrics: true
    log_inference_time: true
    log_token_usage: true
    prometheus_metrics: true
  
  # Security
  security:
    enable_content_filter: true
    max_prompt_length: 8192
    enable_audit_logging: true
    
# Environment variable overrides
# These can override settings above
environment_overrides:
  THEMIS_DISABLE_AUTO_DOWNLOAD: "auto_download"
  THEMIS_MODEL_DIR: "storage.model_dir"
  THEMIS_GPU_LAYERS: "runtime.n_gpu_layers"
  THEMIS_THREADS: "runtime.threads"
  THEMIS_CONTEXT_SIZE: "runtime.context_size"
  THEMIS_OLLAMA_ENDPOINT: "ollama.endpoint"
