# ThemisDB Content Processors Configuration
# 
# Main configuration file for Content Processor plugins.
# Each processor has its own YAML file in the processors/ subdirectory.
#
# Version: 1.0
# Author: ThemisDB Team

content_processors:
  # Global settings
  enabled: true
  
  # Plugin directory (relative or absolute path)
  plugin_directory: "${THEMIS_HOME}/plugins/processors"
  
  # Auto-load all plugins from directory on startup
  auto_load: true
  
  # Require digital signatures for plugins (security)
  signature_verification: true
  
  # Enable sandboxing for plugin execution
  sandbox_enabled: true
  
  # ============================================================================
  # Resource Limits (per plugin process)
  # ============================================================================
  limits:
    # Maximum memory usage per process
    max_memory_mb: 512
    
    # Maximum CPU time for single extraction
    max_cpu_time_sec: 60
    
    # Maximum input file size
    max_file_size_mb: 100
    
    # Maximum concurrent extractions
    max_concurrent: 4
    
    # Queue size for pending extractions
    queue_size: 100
  
  # ============================================================================
  # Logging
  # ============================================================================
  logging:
    level: info  # debug, info, warn, error
    include_timing: true
    audit_enabled: true
    log_file: "${THEMIS_LOG_DIR}/content_processors.log"
  
  # ============================================================================
  # Caching
  # ============================================================================
  cache:
    enabled: true
    type: memory  # memory, redis, disk
    max_size_mb: 256
    ttl_seconds: 3600
    
    # Cache key includes: content hash + options hash
    key_algorithm: blake2b
  
  # ============================================================================
  # Registered Processors
  # ============================================================================
  processors:
    # PDF Processor
    - name: pdf
      enabled: true
      library: themis_proc_pdf
      config_file: processors/pdf.yaml
      priority: 100  # Higher = preferred when multiple can handle
    
    # Office Document Processor (DOCX, XLSX, PPTX, ODF)
    - name: office
      enabled: true
      library: themis_proc_office
      config_file: processors/office.yaml
      priority: 100
    
    # Geo/GIS Processor (GeoJSON, GPX, Shapefile, GeoTIFF)
    - name: geo
      enabled: true
      library: themis_proc_geo
      config_file: processors/geo.yaml
      priority: 100
    
    # Video Processor (MP4, MKV, WebM, AVI)
    - name: video
      enabled: true
      library: themis_proc_video
      config_file: processors/video.yaml
      priority: 100
    
    # Audio Processor (MP3, WAV, FLAC, AAC)
    - name: audio
      enabled: true
      library: themis_proc_audio
      config_file: processors/audio.yaml
      priority: 100
    
    # Image Processor (JPEG, PNG, TIFF, WebP)
    - name: image
      enabled: true
      library: themis_proc_image
      config_file: processors/image.yaml
      priority: 100
    
    # CAD Processor (STEP, IGES, STL, DXF)
    - name: cad
      enabled: false  # Requires OpenCASCADE
      library: themis_proc_cad
      config_file: processors/cad.yaml
      priority: 100
    
    # Text Processor (TXT, JSON, XML, Markdown)
    - name: text
      enabled: true
      library: themis_proc_text
      config_file: processors/text.yaml
      priority: 50  # Lower priority = fallback
    
    # Binary Processor (fallback for unknown types)
    - name: binary
      enabled: true
      library: themis_proc_binary
      config_file: processors/binary.yaml
      priority: 1  # Lowest priority = last resort

  # ============================================================================
  # MIME Type Overrides
  # ============================================================================
  # Force specific MIME types to use specific processors
  mime_overrides:
    # Example: Force all JSON to use text processor instead of geo
    # "application/json": text
    
    # Example: Force GeoJSON to use geo processor
    "application/geo+json": geo
    
    # Example: Force specific vendor types
    "application/vnd.google-earth.kml+xml": geo
    "application/vnd.google-earth.kmz": geo

  # ============================================================================
  # Extension Overrides
  # ============================================================================
  extension_overrides:
    # Example: Force .geojson files to use geo processor
    ".geojson": geo
    ".gpx": geo
    ".kml": geo
    ".kmz": geo
