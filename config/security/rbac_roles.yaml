# ThemisDB RBAC role-to-scope mapping
# Each role maps to the set of OAuth2 scopes it grants.
# Used by AuthMiddleware to check whether a JWT role or Kerberos role
# satisfies a required_scope during authorization.
#
# Format:
#   roles:
#     <role-name>:
#       scopes:
#         - <scope-string>
#
# Scopes use the "resource:action" convention (e.g. cache:read, config:write).

roles:
  admin:
    scopes:
      - admin
      - cache:read
      - cache:write
      - config:read
      - config:write
      - metrics:read
      - data:read
      - data:write
      - cdc:read
      - audit:read

  operator:
    scopes:
      - cache:read
      - cache:write
      - data:read
      - data:write
      - metrics:read
      - cdc:read
      - audit:read

  analyst:
    scopes:
      - cache:read
      - data:read
      - metrics:read
      - cdc:read
      - audit:read

  cache_reader:
    scopes:
      - cache:read
      - metrics:read

  cache_writer:
    scopes:
      - cache:read
      - cache:write
      - metrics:read

  readonly:
    scopes:
      - metrics:read
      - data:read
      - cache:read

  developer:
    scopes:
      - cache:read
      - cache:write
      - config:read
      - data:read
      - data:write
      - metrics:read
