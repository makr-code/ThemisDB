# ThemisDB Replication Configuration Example
# Enable WAL-based replication for RAID1/10 redundancy modes

# Server configuration
server:
  host: "0.0.0.0"
  port: 8765
  worker_threads: 8

# Storage configuration
storage:
  rocksdb_path: "./data/themis_primary"
  memtable_size_mb: 128
  block_cache_size_mb: 256
  enable_blobdb: false
  compression:
    default: "zstd"
    bottommost: "zstd"

# Replication configuration (leader/primary side)
replication:
  # Enable WALShipper for this node (primary/leader)
  shipper_enabled: true
  
  # Primary node ID
  primary_id: "primary-node-01"
  
  # Batching configuration
  batch_size: 100                 # Max entries per batch
  max_batch_bytes: 1048576        # 1 MB max batch size
  ship_interval_ms: 100           # Ship every 100ms
  
  # Retry and backoff configuration
  retry_delay_ms: 1000            # Initial retry delay
  max_retry_delay_ms: 60000       # Max retry delay (1 min)
  max_retries: 5                  # Max retry attempts
  health_check_interval_ms: 10000 # Health check every 10s
  
  # Compression (none, lz4, zstd)
  compression: "zstd"
  compression_level: 3            # 1-22 for Zstd, 1-12 for LZ4
  
  # mTLS configuration (optional, required in production)
  # Leave commented for dev/testing without mTLS
  # cert_path: "/path/to/client.crt"
  # key_path: "/path/to/client.key"
  # ca_cert_path: "/path/to/ca.crt"
  
  # Replica endpoints
  replicas:
    - replica_id: "replica-node-01"
      endpoint: "http://localhost:8766"  # HTTP apply endpoint on replica
      
    - replica_id: "replica-node-02"
      endpoint: "http://localhost:8767"  # Second replica

# For replica/follower nodes:
# Set shipper_enabled: false and ensure /api/v1/wal/apply endpoint is accessible
# Replica receives batches and applies via WALApplier

# Feature flags
features:
  semantic_cache: false
  llm_store: false
  cdc: false
  timeseries: false

# Prometheus metrics (exported at /metrics)
# Monitor replication lag and throughput:
# - themis_wal_shipper_entries_total
# - themis_wal_shipper_bytes_shipped_total
# - themis_wal_shipper_failures_total
# - themis_wal_applier_entries_applied_total
# - themis_wal_applier_failures_total
# - themis_replication_lag_seconds
