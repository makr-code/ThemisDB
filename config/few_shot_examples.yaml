# Few-Shot Examples Configuration
# Pre-defined examples for various tasks

# Text Summarization Examples
summarization:
  - input: "The Industrial Revolution was a period of major industrialization and innovation that took place during the late 1700s and early 1800s. It began in Great Britain and quickly spread throughout Western Europe and North America."
    output: "The Industrial Revolution (late 1700s-early 1800s) was a major period of industrialization that began in Great Britain and spread across Western Europe and North America."
    context:
      task: "summarization"
      difficulty: "medium"
  
  - input: "Machine learning is a subset of artificial intelligence that enables computers to learn from data without being explicitly programmed. It uses statistical techniques to give computers the ability to learn and improve from experience."
    output: "Machine learning, a subset of AI, allows computers to learn from data using statistical techniques rather than explicit programming."
    context:
      task: "summarization"
      difficulty: "easy"

# Sentiment Classification Examples
sentiment:
  - input: "This product exceeded all my expectations! The quality is outstanding and delivery was fast."
    output: "positive"
    context:
      task: "sentiment"
      sentiment_label: "positive"
  
  - input: "Terrible experience. The product broke after two days and customer service was unhelpful."
    output: "negative"
    context:
      task: "sentiment"
      sentiment_label: "negative"
  
  - input: "The product works as described. Nothing special but gets the job done."
    output: "neutral"
    context:
      task: "sentiment"
      sentiment_label: "neutral"

# Question Answering Examples
qa:
  - input: "What is the capital of France?"
    output: "The capital of France is Paris."
    context:
      task: "qa"
      category: "geography"
  
  - input: "When was Python programming language created?"
    output: "Python was created by Guido van Rossum and first released in 1991."
    context:
      task: "qa"
      category: "technology"
  
  - input: "What is photosynthesis?"
    output: "Photosynthesis is the process by which plants use sunlight, water, and carbon dioxide to produce oxygen and energy in the form of sugar."
    context:
      task: "qa"
      category: "science"

# Code Generation Examples
code_gen:
  - input: "Write a Python function to calculate factorial"
    output: |
      def factorial(n):
          if n == 0 or n == 1:
              return 1
          return n * factorial(n - 1)
    context:
      task: "code_gen"
      language: "python"
  
  - input: "Create a SQL query to find all users with age greater than 25"
    output: "SELECT * FROM users WHERE age > 25;"
    context:
      task: "code_gen"
      language: "sql"

# Database Query Examples
db_query:
  - input: "Show all customers from New York"
    output: "SELECT * FROM customers WHERE city = 'New York';"
    context:
      task: "db_query"
      database: "sql"
  
  - input: "Find the top 5 products by sales"
    output: "SELECT product_name, SUM(sales) as total_sales FROM products GROUP BY product_name ORDER BY total_sales DESC LIMIT 5;"
    context:
      task: "db_query"
      database: "sql"

# Translation Examples
translation:
  - input: "Hello, how are you?"
    output: "Hola, ¿cómo estás?"
    context:
      task: "translation"
      source_lang: "en"
      target_lang: "es"
  
  - input: "Good morning"
    output: "Bonjour"
    context:
      task: "translation"
      source_lang: "en"
      target_lang: "fr"

# RAG (Retrieval Augmented Generation) Examples
rag:
  - input: "What is ThemisDB? Context: ThemisDB is a multi-model database system that supports relational, graph, vector, and document data models with full ACID transactions."
    output: "ThemisDB is a multi-model database system that integrates relational, graph, vector, and document data models while maintaining full ACID transaction support."
    context:
      task: "rag"
      has_context: true
  
  - input: "Explain LLM inference. Context: Large Language Models (LLMs) use transformer architectures to generate text by predicting the next token based on context."
    output: "LLM inference involves using transformer-based architectures to generate text by predicting subsequent tokens based on the provided context."
    context:
      task: "rag"
      has_context: true

# Classification Examples
classification:
  - input: "Fix critical bug in authentication module"
    output: "bug"
    context:
      task: "classification"
      categories: ["feature", "bug", "enhancement", "documentation"]
  
  - input: "Add user profile customization options"
    output: "feature"
    context:
      task: "classification"
      categories: ["feature", "bug", "enhancement", "documentation"]
