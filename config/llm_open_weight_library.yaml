# ThemisDB Open-Weight & Open-Source LLM Model Library
# Version: 1.0.0
# Last Updated: 2026-04-07
#
# Source rankings: Chatbot Arena (lmarena.ai) + HuggingFace Open LLM Leaderboard
# Coverage: Instruction, Reasoning, Code, Embedding, Multimodal, German/EU
#
# License notation:
#   apache2    = Apache 2.0          (commercial use ✅, modifications ✅)
#   mit        = MIT                 (commercial use ✅, modifications ✅)
#   llama3     = Meta Llama 3 Community (commercial use ✅ if <700M MAU)
#   llama31    = Meta Llama 3.1 Community (commercial use ✅ if <700M MAU)
#   llama33    = Meta Llama 3.3 Community (commercial use ✅ if <700M MAU)
#   gemma      = Google Gemma ToU    (commercial use ✅)
#   deepseek   = DeepSeek License (MIT-derived, commercial use ✅)
#   mistral_r  = Mistral Research License (non-commercial)
#   qwen       = Qwen Community (Apache 2.0 for <100B params)
#   cc_by_nc   = CC BY-NC 4.0       (non-commercial only ❌)
#
# Quantization guide:
#   Q4_K_M  – recommended default, best size/quality trade-off
#   Q5_K_M  – better quality, +25% VRAM
#   Q8_0    – near-lossless, 2x VRAM of Q4_K_M
#   F16     – full precision, 4x VRAM of Q4_K_M (use with vLLM/fp16)
#   GGUF    – llama.cpp-compatible (Ollama, ThemisDB native)
#   AWQ     – Activation-aware Weight Quantization (vLLM)
#   GPTQ    – Post-Training Quantization (vLLM/Transformers)

