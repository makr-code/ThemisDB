# =============================================================================
# ThemisDB Deployment Profiles
# Recommended configurations per use case
# =============================================================================

profiles:

  # Recommended configuration for German e-government deployments
  german_egov:
    description: "German e-government, OZG, XDOMEA, Baugenehmigung/BImSchV"
    primary_model: leollm-mistral-7b
    embedding_model: bge-m3
    fallback_model: mistral-7b-instruct-v0.3
    active_loras:
      - german-legal-v1
      - german-egov-v1
      - bdsg-compliance-v1
    resource_pool: default
    gdpr_compliant: true
    data_residency: EU

  # Single GPU / resource-constrained production
  single_gpu_production:
    description: "Production on single 24GB GPU (RTX 3090, A5000, etc.)"
    primary_model: deepseek-r1-distill-qwen-32b
    embedding_model: bge-m3
    code_model: qwen2.5-coder-7b-instruct
    fallback_model: qwen2.5-7b-instruct
    resource_pool: default

  # Multi-GPU / enterprise
  enterprise_multi_gpu:
    description: "Enterprise with 2× A100/H100 80GB"
    primary_model: llama-3.3-70b-instruct
    reasoning_model: deepseek-r1-distill-llama-70b
    embedding_model: bge-m3
    code_model: qwen2.5-coder-32b-instruct
    resource_pool: high_performance

  # Edge / embedded
  edge:
    description: "Edge deployment — CPU, RPi 5, low VRAM"
    primary_model: phi-3-mini-4k-instruct
    embedding_model: nomic-embed-text-v1.5
    fallback_model: smollm2-1.7b-instruct
    resource_pool: development
    cpu_inference: true

  # Full auditability (GDPR AI Act)
  auditable:
    description: "Fully open model stack for AI Act / GDPR auditability"
    primary_model: olmo-2-13b
    embedding_model: multilingual-e5-large-instruct
    fully_open: true
    audit_all_decisions: true

# =============================================================================
# HuggingFace Hub Integration
# =============================================================================

huggingface:
  token: ${HUGGINGFACE_TOKEN}
  download:
    cache_dir: models/huggingface
    resume_download: true
    force_download: false
  auto_convert:
    enabled: true
    target_format: gguf
    quantization: Q4_K_M
    output_dir: models/converted

# =============================================================================
# Ollama Integration
# =============================================================================

ollama:
  server:
    host: localhost
    port: 11434
    timeout_seconds: 600
  auto_pull:
    - qwen2.5:7b-instruct-q4_K_M          # default general
    - deepseek-r1:14b                       # default reasoning
    - qwen2.5-coder:7b-instruct-q4_K_M    # default code
    - nomic-embed-text:v1.5               # default embedding
    - leo-mistral:7b-hessianai            # German/EU default

# =============================================================================
# vLLM Integration (for 70B+ models)
# =============================================================================

vllm:
  server:
    host: localhost
    port: 8000
    api_key: ${VLLM_API_KEY}
  engine:
    model: meta-llama/Llama-3.3-70B-Instruct
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.9
    max_num_seqs: 256
    max_model_len: 131072
    dtype: bfloat16
