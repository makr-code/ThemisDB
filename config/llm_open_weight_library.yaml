  - name: deepseek-r1-distill-llama-70b
    vendor: DeepSeek
    arena_rank: 1         # Top open-weight reasoning model (early 2026)
    arena_elo: ~1380
    version: "1.0"
    type: reasoning
    format: gguf
    size: 70B
    quantization: Q4_K_M
    license: mit
    commercial_use: true
    sources:
      huggingface: deepseek-ai/DeepSeek-R1-Distill-Llama-70B
      ollama: deepseek-r1:70b
      local: models/deepseek-r1-distill-llama-70b-q4.gguf
    parameters:
      context_length: 32768
      max_tokens: 8192
      temperature: 0.6
      top_p: 0.95
      top_k: 40
      repeat_penalty: 1.0
    gpu:
      layers_offload: 80
      vram_required_mb: 38000
      cuda_compute_capability: "8.0"
      tensor_parallel_recommended: 2
    lazy_loading:
      enabled: false
      priority: critical
      pin_to_memory: true
    architecture:
      model_type: llama
      num_layers: 80
      hidden_size: 8192
      num_attention_heads: 64
      num_key_value_heads: 8
      intermediate_size: 28672
    lora_target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    deployment:
      multi_gpu: true
      min_gpus: 2
      vllm_compatible: true
    use_cases:
      - complex reasoning
      - multi-step problem solving
      - legal analysis
      - scientific research
      - AQL query optimization
    notes: >
      R1-Distill: Chain-of-thought reasoning distilled from DeepSeek-R1-671B.
      Best open-weight reasoning model for complex legal/scientific analysis.
      Requires 2× A100/H100 80GB or equivalent.

