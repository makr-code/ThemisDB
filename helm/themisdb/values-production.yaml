# Production availability and network isolation profile.
# Review storage, DNS labels, and external ingress peers for the target cluster.
replicaCount: 3

livenessProbe:
  httpGet:
    path: /health
    port: health
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: health
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: themisdb
          topologyKey: kubernetes.io/hostname

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

networkPolicy:
  enabled: true
  allowAllIngress: false
  prometheusNamespace: monitoring
  additionalIngressPeers: []
  dnsNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: kube-system
  dnsPodSelector:
    matchLabels:
      k8s-app: kube-dns
  storageEgressPorts:
    - 8766
  storageUdpEgressPorts:
    - 8769
  allowHttpsEgress: false
