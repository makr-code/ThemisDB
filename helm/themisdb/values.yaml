# Default values for ThemisDB Helm chart
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ghcr.io/makr-code/themisdb
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # Metrics port for Prometheus
  metricsPort: 4318

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: themisdb.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # existingClaim: ""

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
  # Custom metrics for advanced autoscaling
  customMetrics: []
  # Example custom metric:
  # - name: themisdb_requests_per_second
  #   targetAverageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      percentagePolicyValue: 50
      podsPolicyValue: 1
      periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      percentagePolicyValue: 100
      podsPolicyValue: 2
      periodSeconds: 30
      selectPolicy: Max

# ThemisDB specific configuration
themisdb:
  # Log level: trace, debug, info, warn, error
  logLevel: info
  # Enable metrics endpoint
  metricsEnabled: true
  # Configuration file content (JSON)
  # Note: logLevel above is for documentation; the actual log level is set in the config below
  config: |

# Metrics and monitoring configuration
metrics:
  # Enable Prometheus metrics endpoint
  enabled: true
  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    relabelings: []
    {
      "storage": {
        "path": "/data/themisdb"
      },
      "server": {
        "port": 8080,
        "host": "0.0.0.0"
      },
      "logging": {
        "level": "info"
      }
    }
