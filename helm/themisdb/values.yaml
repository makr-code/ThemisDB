# Default values for ThemisDB Helm chart
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: themisdb/themisdb
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # Prometheus-compatible metrics port (Prometheus scrapes this port).
  # Must match the THEMIS_METRICS_PORT environment variable.
  metricsPort: 9091

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: themisdb.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  # existingClaim: ""

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Optional startup probe — useful when the instance loads large models at boot.
# Uncomment and configure to prevent premature liveness failures during startup.
# startupProbe:
#   httpGet:
#     path: /health
#     port: health
#   failureThreshold: 12
#   periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80
  # Custom metrics for advanced autoscaling
  customMetrics: []
  # Example custom metric:
  # - name: themisdb_requests_per_second
  #   targetAverageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      percentagePolicyValue: 50
      podsPolicyValue: 1
      periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      percentagePolicyValue: 100
      podsPolicyValue: 2
      periodSeconds: 30
      selectPolicy: Max

# ThemisDB specific configuration
themisdb:
  # Log level: trace, debug, info, warn, error
  logLevel: info
  # Enable metrics endpoint
  metricsEnabled: true

  # Health endpoint port (should match THEMIS_HEALTH_PORT env var)
  healthPort: 8081

  # Environment variables injected into the container.
  # For production deployments set at minimum:
  #   THEMIS_PRODUCTION_MODE=1, THEMIS_ENVIRONMENT=production,
  #   THEMIS_TOKEN_ADMIN (from a Secret), THEMIS_PKI_CERTIFICATE/KEY.
  # See docs/production/SECURITY_POSTURE.md for the full list.
  # Example:
  # env:
  #   - name: THEMIS_PRODUCTION_MODE
  #     value: "1"
  #   - name: THEMIS_TOKEN_ADMIN
  #     valueFrom:
  #       secretKeyRef:
  #         name: themisdb-secrets
  #         key: THEMIS_TOKEN_ADMIN
  env: []

  # Name of a Kubernetes Secret containing TLS cert/key for the API server.
  # The secret must have keys: tls.crt and tls.key.
  # When set, the secret is mounted at /etc/themisdb/tls (read-only).
  tlsSecret: ""

  # Name of a Kubernetes Secret containing the WAL gRPC mTLS cert/key/ca.
  # The secret must have keys: tls.crt, tls.key, and ca.crt.
  # When set, the secret is mounted at /etc/themisdb/wal-tls (read-only).
  walTlsSecret: ""

  # Configuration file content (JSON)
  # Note: logLevel above is for documentation; the actual log level is set in the config below
  config: |
    {
      "storage": {
        "path": "/data/themisdb"
      },
      "server": {
        "port": 8080,
        "host": "0.0.0.0"
      },
      "logging": {
        "level": "info"
      }
    }

# Service mesh integration (Istio/Envoy sidecar compatibility)
serviceMesh:
  # Set to true to inject the Istio sidecar into this deployment.
  # Requires Istio to be installed in the cluster.
  istioInject: false

  # Comma-separated ports included in Istio inbound traffic interception.
  # Maps to traffic.sidecar.istio.io/includeInboundPorts pod annotation.
  # Typically the wire protocol port (8766) and the HTTP API port (8080).
  includeInboundPorts: "8766,8080"

  # Comma-separated ports excluded from Istio inbound interception.
  # Maps to traffic.sidecar.istio.io/excludeInboundPorts pod annotation.
  # The probe port (8082) and UDP fast-path (8769) must be excluded so that
  # Kubernetes health checks and UDP traffic bypass Envoy interception.
  excludeInboundPorts: "8082,8769"

  # When true, ThemisDB-level TLS is disabled and mTLS is handled by Envoy.
  # Set THEMIS_ENABLE_TLS=false via themisdb.env when enabling this option.
  trustSidecarMTLS: false

  # Graceful shutdown: wait this many milliseconds for the Envoy sidecar to
  # drain in-flight connections before the process exits.
  drainTimeoutMs: 5000

# Metrics and monitoring configuration
metrics:
  # Enable Prometheus metrics endpoint
  enabled: true
  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
    relabelings: []

# Vertical Pod Autoscaler (VPA) configuration.
# Requires the VPA controller to be installed in the cluster.
# See: https://github.com/kubernetes/autoscaler/tree/master/vertical-pod-autoscaler
vpa:
  enabled: false
  # updateMode controls whether VPA applies recommendations automatically.
  # "Off"      — recommendations only, no changes applied
  # "Initial"  — applies on pod creation only
  # "Recreate" — evicts and recreates pods to apply changes
  # "Auto"     — same as Recreate on most controllers
  updateMode: "Off"
  minAllowed:
    cpu: 100m
    memory: 256Mi
  maxAllowed:
    cpu: 4000m
    memory: 8Gi

# NetworkPolicy configuration.
# When enabled, restricts ingress/egress to the minimum required surface.
networkPolicy:
  enabled: false
  # Allow Prometheus scrape from this namespace (must have label
  # kubernetes.io/metadata.name matching the value below).
  prometheusNamespace: "monitoring"
  # When true, HTTP API ingress is unrestricted (no podSelector from-filter).
  allowAllIngress: false
  # Additional TCP ports to allow in egress (e.g. replication, WAL gRPC).
  storageEgressPorts:
    - 8766   # WAL gRPC
    - 8769   # UDP fast-path (excluded from Istio)
  # Allow HTTPS egress (port 443) — needed if model weights are fetched at runtime.
  allowHttpsEgress: false

# Grafana dashboard integration.
# When enabled, a Kubernetes ConfigMap is created for each dashboard category.
# The Grafana sidecar (grafana-sc-dashboard) discovers ConfigMaps with the
# label grafana_dashboard: "1" and imports them automatically.
# Requires grafana.sidecar.dashboards.enabled=true in the Grafana Helm chart.
grafana:
  dashboards:
    enabled: false
    # Namespace where the Grafana ConfigMaps are created.
    # Leave empty to use the release namespace.
    namespace: ""
    # Label added to each ConfigMap so Grafana's sidecar picks them up.
    label: grafana_dashboard
    labelValue: "1"
    # Per-category toggles — set to false to skip a category.
    categories:
      llm: true
      performance: true
      security: true
      operations: true
      compliance: true
      plugins: false
      bt4: false
