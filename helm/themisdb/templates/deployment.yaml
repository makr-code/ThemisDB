apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "themisdb.fullname" . }}
  labels:
    {{- include "themisdb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "themisdb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.serviceMesh.istioInject }}
        sidecar.istio.io/inject: "true"
        traffic.sidecar.istio.io/includeInboundPorts: {{ .Values.serviceMesh.includeInboundPorts | quote }}
        traffic.sidecar.istio.io/excludeInboundPorts: {{ .Values.serviceMesh.excludeInboundPorts | quote }}
        {{- end }}
      labels:
        {{- include "themisdb.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "themisdb.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort | default 9091 }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.themisdb.healthPort | default 8081 }}
              protocol: TCP
          {{- if .Values.themisdb.env }}
          env:
            {{- toYaml .Values.themisdb.env | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/themis
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.themisdb.tlsSecret }}
            - name: tls
              mountPath: /etc/themisdb/tls
              readOnly: true
            {{- end }}
            {{- if .Values.themisdb.walTlsSecret }}
            - name: wal-tls
              mountPath: /etc/themisdb/wal-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "themisdb.fullname" . }}-config
        - name: tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "themisdb.fullname" .)) }}
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.themisdb.tlsSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.themisdb.tlsSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.themisdb.walTlsSecret }}
        - name: wal-tls
          secret:
            secretName: {{ .Values.themisdb.walTlsSecret }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
