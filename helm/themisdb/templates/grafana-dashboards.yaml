{{- template "themisdb.dashboardConfigMap" (list . "llm" "themisdb-extended-context-dashboard.json" (.Files.Get "dashboards/llm/themisdb-extended-context-dashboard.json") $ns $label $labelVal) }}
{{- template "themisdb.dashboardConfigMap" (list . "llm" "lora-training.json" (.Files.Get "dashboards/llm/lora-training.json") $ns $label $labelVal) }}
