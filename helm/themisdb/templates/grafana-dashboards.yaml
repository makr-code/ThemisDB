{{- if .Values.grafana.dashboards.enabled }}
{{- $ns := .Values.grafana.dashboards.namespace | default .Release.Namespace }}
{{- $label := .Values.grafana.dashboards.label | default "grafana_dashboard" }}
{{- $labelVal := .Values.grafana.dashboards.labelValue | default "1" }}
{{- $cats := .Values.grafana.dashboards.categories }}

{{/* ------------------------------------------------------------------ */}}
{{/* LLM dashboards                                                       */}}
{{/* ------------------------------------------------------------------ */}}
{{- if $cats.llm }}
{{- template "themisdb.dashboardConfigMap" (list . "llm" "themisdb-llm-dashboard.json" (.Files.Get "dashboards/llm/themisdb-llm-dashboard.json") $ns $label $labelVal) }}
{{- template "themisdb.dashboardConfigMap" (list . "llm" "gpu_metrics.json" (.Files.Get "dashboards/llm/gpu_metrics.json") $ns $label $labelVal) }}
{{- template "themisdb.dashboardConfigMap" (list . "llm" "cache-performance.json" (.Files.Get "dashboards/llm/cache-performance.json") $ns $label $labelVal) }}
