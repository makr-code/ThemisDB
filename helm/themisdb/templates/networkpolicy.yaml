{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "themisdb.fullname" . }}
  labels:
    {{- include "themisdb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "themisdb.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow inbound HTTP API traffic from the same namespace (or any namespace
    # when networkPolicy.allowAllIngress is true).
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      {{- if not .Values.networkPolicy.allowAllIngress }}
      from:
        - podSelector: {}
      {{- end }}

    # Allow Prometheus scrape on the metrics port from the monitoring namespace.
    - ports:
        - port: {{ .Values.service.metricsPort | default 9091 }}
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | default "monitoring" }}

    # Allow health probes from kubelet (always required).
    - ports:
        - port: {{ .Values.themisdb.healthPort | default 8081 }}
          protocol: TCP

  egress:
    # Allow DNS resolution.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Allow egress to storage backend ports (RocksDB / WAL / replication).
    {{- if .Values.networkPolicy.storageEgressPorts }}
    - ports:
        {{- range .Values.networkPolicy.storageEgressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}

    # Allow HTTPS egress for external dependency downloads during startup
    # (e.g. model weights).  Disable if not required.
    {{- if .Values.networkPolicy.allowHttpsEgress }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
