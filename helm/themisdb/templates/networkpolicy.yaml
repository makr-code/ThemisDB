{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "themisdb.fullname" . }}
  labels:
    {{- include "themisdb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "themisdb.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow HTTP API traffic from this namespace and explicitly listed peers.
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      {{- if not .Values.networkPolicy.allowAllIngress }}
      from:
        - podSelector: {}
        {{- with .Values.networkPolicy.additionalIngressPeers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

    # Allow Prometheus scrape on the metrics port from the configured namespace.
    - ports:
        - port: {{ .Values.service.metricsPort | default 9091 }}
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.prometheusNamespace | default "monitoring" }}

    # Kubelet health probes need this port. NetworkPolicy source identity for
    # node-originated probes varies by CNI; keep this rule limited to health.
    - ports:
        - port: {{ .Values.themisdb.healthPort | default 8081 }}
          protocol: TCP

  egress:
    # Allow DNS only to the configured cluster DNS pods.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dnsNamespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dnsPodSelector | nindent 12 }}

    # Allow configured peer ports only to pods in this ThemisDB release.
    {{- if .Values.networkPolicy.storageEgressPorts }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "themisdb.selectorLabels" . | nindent 14 }}
      ports:
        {{- range .Values.networkPolicy.storageEgressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    {{- end }}
    {{- if .Values.networkPolicy.storageUdpEgressPorts }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "themisdb.selectorLabels" . | nindent 14 }}
      ports:
        {{- range .Values.networkPolicy.storageUdpEgressPorts }}
        - port: {{ . }}
          protocol: UDP
        {{- end }}
    {{- end }}

    # Optional unrestricted HTTPS egress for runtime downloads; keep disabled
    # unless the deployment has a documented external dependency.
    {{- if .Values.networkPolicy.allowHttpsEgress }}
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
