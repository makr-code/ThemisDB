apiVersion: v1
kind: Service
metadata:
  name: {{ include "themisdb.fullname" . }}
  labels:
    {{- include "themisdb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort | default 9091 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "themisdb.selectorLabels" . | nindent 4 }}
