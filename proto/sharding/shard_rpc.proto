// shard_rpc.proto
// Protocol Buffer definitions for ThemisDB Inter-Shard RPC Communication

syntax = "proto3";

package themis.sharding.proto;

option cc_enable_arenas = true;
option optimize_for = SPEED;
option java_package = "com.themisdb.sharding.rpc";
option java_outer_classname = "ShardRpcProto";
option go_package = "github.com/makr-code/ThemisDB/proto/sharding;sharding";

// Inter-Shard Communication Service
service ShardService {
    // Data Replication
    rpc ReplicateData(ReplicateRequest) returns (ReplicateResponse);
    rpc ReplicateDataStream(stream ReplicateChunk) returns (ReplicateResponse);
    // WAL replication (pull or push from shipper)
    rpc ApplyWalBatch(ApplyWalBatchRequest) returns (ApplyWalBatchResponse);
    
    // Distributed Transactions (2PC)
    rpc PrepareTransaction(PrepareRequest) returns (PrepareResponse);
    rpc CommitTransaction(CommitRequest) returns (CommitResponse);
    rpc AbortTransaction(AbortRequest) returns (AbortResponse);
    
    // Data Migration
    rpc MigrateData(MigrateRequest) returns (stream MigrateChunk);
    
    // RocksDB Snapshot Transfer (NEW)
    rpc TransferSnapshot(SnapshotTransferRequest) returns (stream SnapshotChunk);
    rpc VerifySnapshot(SnapshotVerifyRequest) returns (SnapshotVerifyResponse);
    
    // Blob Transfer for LoRA Adapters and Large Files (NEW)
    rpc TransferBlob(BlobTransferRequest) returns (stream BlobChunk);
    rpc VerifyBlob(BlobVerifyRequest) returns (BlobVerifyResponse);
    
    // Status & Health
    rpc GetShardStatus(StatusRequest) returns (StatusResponse);
    rpc HealthCheck(HealthRequest) returns (HealthResponse);
    
    // Gossip Protocol
    rpc GossipExchange(GossipMessage) returns (GossipMessage);
}

// WAL Apply RPC (mirrors HTTP /api/v1/wal/apply semantics)
message ApplyWalBatchRequest {
    // Either entries is populated, or entries_compressed contains a zstd blob of the JSON array
    repeated WalEntry entries = 1;
    bytes entries_compressed = 2; // zstd-compressed JSON array of WalEntry
}

message ApplyWalBatchResponse {
    bool success = 1;
    uint32 entries_applied = 2;
    string last_applied_lsn = 3;
    repeated string errors = 4;
}

enum WalEntryType {
    WAL_UNKNOWN = 0;
    WAL_INSERT = 1;
    WAL_UPDATE = 2;
    WAL_DELETE = 3;
    WAL_BEGIN_TX = 4;
    WAL_COMMIT_TX = 5;
    WAL_ABORT_TX = 6;
    WAL_CHECKPOINT = 7;
}

message WalEntry {
    string lsn = 1;               // "segment/offset" format
    WalEntryType type = 2;
    uint64 timestamp = 3;         // millis since epoch
    string transaction_id = 4;
    bytes data_json = 5;          // JSON object payload (same shape as HTTP apply)
}

message ReplicateRequest {
    string shard_id = 1;
    repeated Entity entities = 2;
    uint64 timestamp_ns = 3;
    string transaction_id = 4;
}

message ReplicateChunk {
    bytes data = 1;
    uint32 chunk_index = 2;
    bool is_last = 3;
    
    // Enhanced chunking metadata (NEW)
    uint32 total_chunks = 4;
    uint64 uncompressed_size = 5;
    uint64 compressed_size = 6;
    string checksum_crc32 = 7;
    CompressionType compression = 8;
}

// Compression types
enum CompressionType {
    COMPRESSION_NONE = 0;
    COMPRESSION_LZ4 = 1;
    COMPRESSION_ZSTD = 2;
    COMPRESSION_SNAPPY = 3;
}

// Checksum types
enum ChecksumType {
    CHECKSUM_NONE = 0;
    CHECKSUM_CRC32 = 1;
    CHECKSUM_SHA256 = 2;
    CHECKSUM_XXH64 = 3;
}

message ReplicateResponse {
    bool success = 1;
    uint64 replicated_count = 2;
    string error = 3;
}

message PrepareRequest {
    string transaction_id = 1;
    string coordinator_shard_id = 2;
    repeated string participant_shards = 3;
    bytes transaction_data = 4;
}

message PrepareResponse {
    bool vote_commit = 1;
    string error = 2;
}

message CommitRequest {
    string transaction_id = 1;
}

message CommitResponse {
    bool success = 1;
    string error = 2;
}

message AbortRequest {
    string transaction_id = 1;
}

message AbortResponse {
    bool success = 1;
}

message MigrateRequest {
    string source_shard_id = 1;
    string target_shard_id = 2;
    uint64 token_range_start = 3;
    uint64 token_range_end = 4;
}

message MigrateChunk {
    repeated Entity entities = 1;
    uint32 chunk_index = 2;
    bool is_last = 3;
}

message StatusRequest {
    bool include_metrics = 1;
}

message StatusResponse {
    string shard_id = 1;
    string state = 2;
    uint64 token_range_start = 3;
    uint64 token_range_end = 4;
}

message HealthRequest {
}

message HealthResponse {
    string status = 1;
    string version = 2;
    uint64 uptime_seconds = 3;
}

// Gossip-Enhanced Configuration Management (YARN-Inspired)
message GossipMessage {
    string sender_shard_id = 1;
    uint64 timestamp_ns = 2;
    
    // Message type for routing
    string message_type = 3;  // "config_update", "resource_snapshot", "heartbeat", "anti_entropy"
    
    // Vector clock for causality tracking and anti-entropy
    VectorClock vector_clock = 4;
    
    // Payload (one of the following)
    ConfigUpdate config_update = 5;
    ResourceSnapshot resource_snapshot = 6;
    bytes custom_payload = 7;  // For extensibility
}

// Vector Clock for anti-entropy and conflict resolution
message VectorClock {
    map<string, uint64> clocks = 1;  // shard_id -> logical clock
}

// Configuration Update for decentralized config management
message ConfigUpdate {
    string update_id = 1;              // Unique update identifier (UUID)
    string config_key = 2;             // Configuration key (e.g., "shard.replication_factor")
    string config_value = 3;           // Configuration value (JSON-encoded)
    uint64 timestamp_ns = 4;           // Update timestamp
    VectorClock vector_clock = 5;      // Causality tracking
    string originator_shard_id = 6;    // Shard that originated the update
    uint32 ttl = 7;                    // Time-to-live (gossip rounds)
}

// Resource Snapshot for YARN-inspired resource tracking
message ResourceSnapshot {
    string shard_id = 1;
    uint64 timestamp_ns = 2;
    
    // Resource metrics (YARN NodeManager-inspired)
    uint64 available_memory_bytes = 3;
    uint64 total_memory_bytes = 4;
    uint32 available_cpu_cores = 5;
    uint32 total_cpu_cores = 6;
    
    // Storage metrics
    uint64 available_disk_bytes = 7;
    uint64 total_disk_bytes = 8;
    uint64 rocksdb_sst_files_count = 9;
    uint64 rocksdb_total_size_bytes = 10;
    
    // Load metrics
    double cpu_usage_percent = 11;
    double memory_usage_percent = 12;
    double disk_usage_percent = 13;
    uint64 requests_per_second = 14;
    double avg_latency_ms = 15;
    
    // Health status
    bool is_healthy = 16;
    string status = 17;  // "healthy", "degraded", "unhealthy"
    repeated string warnings = 18;
}

message Entity {
    string uuid = 1;
    string collection = 2;
    bytes data = 3;
    uint64 version = 4;
    uint64 timestamp_ns = 5;
}

// ============================================================================
// RocksDB Snapshot Transfer (NEW - v1.3.0)
// ============================================================================

message SnapshotTransferRequest {
    string source_shard_id = 1;
    string target_shard_id = 2;
    uint64 token_range_start = 3;
    uint64 token_range_end = 4;
    
    // Snapshot configuration
    bool incremental = 5;               // Incremental vs full snapshot
    bool include_wal = 6;               // Include WAL files for consistency
    string snapshot_id = 7;             // Unique snapshot identifier
    
    // Compression settings
    CompressionType compression = 8;
    int32 compression_level = 9;        // 1-22 for Zstd, 1-12 for LZ4
    
    // Chunking settings
    uint64 chunk_size_bytes = 10;       // Chunk size (default: 50 MB)
    ChecksumType checksum_type = 11;
    
    // Temporal snapshot metadata (NEW - v1.3.0)
    uint64 snapshot_timestamp_ns = 12;  // Point-in-time when snapshot was created
    uint64 snapshot_sequence = 13;      // Sequence number for ordering
    string base_snapshot_id = 14;       // For incremental: ID of base snapshot
    SnapshotIsolation isolation_level = 15;  // Consistency guarantee
    bool allow_dirty_reads = 16;        // Allow reading uncommitted data (faster but inconsistent)
}

message SnapshotChunk {
    string snapshot_id = 1;
    uint32 chunk_index = 2;
    uint32 total_chunks = 3;
    bytes data = 4;                      // Compressed chunk data
    bool is_last = 5;
    
    // Chunk metadata
    uint64 uncompressed_size = 6;
    uint64 compressed_size = 7;
    string checksum = 8;                 // CRC32 or SHA256 hex string
    
    // File information (for multi-file snapshots)
    string file_name = 9;                // SST file name, WAL file, etc.
    uint64 file_size = 10;               // Total file size
    uint64 file_offset = 11;             // Offset in file
}

message SnapshotVerifyRequest {
    string snapshot_id = 1;
    uint32 expected_chunks = 2;
    string expected_checksum_sha256 = 3;  // Overall snapshot checksum
}

message SnapshotVerifyResponse {
    bool verified = 1;
    uint32 chunks_received = 2;
    string actual_checksum = 3;
    string error = 4;
    uint64 total_bytes_received = 5;
    uint64 total_bytes_uncompressed = 6;
}

// ============================================================================
// Blob Transfer for LoRA Adapters and Large Files (NEW - v1.3.0)
// ============================================================================

message BlobTransferRequest {
    string blob_id = 1;                  // UUID of blob (LoRA adapter, model, etc.)
    string blob_type = 2;                // "lora_adapter", "llm_model", "embedding", etc.
    uint64 blob_size_bytes = 3;          // Total blob size
    string checksum_sha256 = 4;          // Blob checksum (end-to-end integrity)
    
    // Source/Target information
    string source_shard_id = 5;
    string target_shard_id = 6;
    
    // Chunking configuration
    uint64 chunk_size_bytes = 7;         // Chunk size (default: 50-100 MB)
    CompressionType compression = 8;
    int32 compression_level = 9;
    
    // Metadata
    map<string, string> metadata = 10;   // Custom metadata (model_name, version, etc.)
    bool enable_resume = 11;             // Support resume on failure
    string resume_token = 12;            // Token for resuming transfer
    
    // Differential transfer mode (NEW)
    bool enable_differential = 13;       // Enable delta transfer
    DifferentialMode diff_mode = 14;     // Delta algorithm
    repeated ChunkManifest local_chunks = 15;  // Chunks already at target
    
    // Temporal snapshot information (NEW - v1.3.0)
    uint64 snapshot_timestamp_ns = 16;   // When snapshot was taken (nanoseconds since epoch)
    string snapshot_id = 17;             // Unique snapshot identifier (UUID)
    uint64 snapshot_sequence = 18;       // Monotonically increasing sequence number
    string base_version = 19;            // Base version this snapshot is built upon
    bool is_immutable = 20;              // True if source won't change during transfer
    SnapshotIsolation isolation_level = 21;  // Isolation level guarantee
}

message BlobChunk {
    string blob_id = 1;
    uint32 chunk_index = 2;
    uint32 total_chunks = 3;
    bytes data = 4;                      // Compressed chunk data
    bool is_last = 5;
    
    // Chunk metadata
    uint64 uncompressed_size = 6;
    uint64 compressed_size = 7;
    string checksum_crc32 = 8;           // Per-chunk checksum
    
    // Progress information
    uint64 bytes_transferred = 9;        // Total bytes transferred so far
    double progress_percent = 10;        // Progress percentage (0-100)
}

message BlobVerifyRequest {
    string blob_id = 1;
    uint32 expected_chunks = 2;
    string expected_checksum_sha256 = 3;
    uint64 expected_size_bytes = 4;
}

message BlobVerifyResponse {
    bool verified = 1;
    uint32 chunks_received = 2;
    string actual_checksum = 3;
    string error = 4;
    uint64 total_bytes_received = 5;
    uint64 total_bytes_uncompressed = 6;
    double compression_ratio = 7;        // Uncompressed / Compressed
}

// Snapshot isolation levels
enum SnapshotIsolation {
    SNAPSHOT_NONE = 0;                   // No isolation guarantee
    SNAPSHOT_CONSISTENT = 1;             // Snapshot is consistent at point-in-time
    SNAPSHOT_SERIALIZABLE = 2;           // Serializable snapshot isolation
    SNAPSHOT_MVCC = 3;                   // Multi-Version Concurrency Control
}

// Differential update mode
enum DifferentialMode {
    DIFFERENTIAL_NONE = 0;               // Full transfer (default)
    DIFFERENTIAL_CDC = 1;                // Content-Defined Chunking (rsync-like)
    DIFFERENTIAL_FIXED_BLOCK = 2;        // Fixed-size block diff (simple)
    DIFFERENTIAL_BSDIFF = 3;             // Binary diff (for small changes)
}

// Chunk manifest for deduplication
message ChunkManifest {
    string chunk_hash = 1;               // SHA256 of chunk
    uint64 chunk_size = 2;               // Chunk size in bytes
    uint32 chunk_index = 3;              // Chunk index in file
    uint64 offset = 4;                   // Offset in file (for CDC)
    uint64 snapshot_sequence = 5;        // Snapshot when chunk was created
}
