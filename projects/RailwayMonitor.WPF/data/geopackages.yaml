# Download-Konfiguration
download_config:
  timeout_seconds: 300  # 5 Minuten pro Download
  max_retries: 3
  retry_delay_seconds: 5
  cache_directory: "data/cache/geopackages"
  max_file_size_mb: 1000  # Max 1GB pro Bundesland
  parallel_downloads: 1  # Sequenziell um Server nicht zu überlasten

# Test-URLs - können mit curl oder PowerShell getestet werden
test_commands:
  test_url: |
    # PowerShell: Eine URL testen
    $url = "https://basemap.de/opendata/be.gpkg"
    try {
      $response = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 10
      Write-Host "✓ URL erreichbar: $($response.StatusCode)"
      Write-Host "  Content-Length: $($response.Headers.'Content-Length') bytes"
    } catch {
      Write-Host "✗ URL nicht erreichbar: $_"
    }
  
  test_all_urls: |
    # PowerShell: Alle URLs testen
    $urls = @{
      "Berlin" = "https://basemap.de/opendata/be.gpkg"
      "Bayern" = "https://basemap.de/opendata/by.gpkg"
      "NRW" = "https://basemap.de/opendata/nw.gpkg"
      "Baden-Württemberg" = "https://basemap.de/opendata/bw.gpkg"
    }
    
    foreach ($entry in $urls.GetEnumerator()) {
      try {
        $response = Invoke-WebRequest -Uri $entry.Value -Method Head -TimeoutSec 10
        Write-Host "✓ $($entry.Key): $($response.StatusCode) - $($response.Headers.'Content-Length') bytes"
      } catch {
        Write-Host "✗ $($entry.Key): FEHLER - $($_)"
      }
    }

# Status-Tracking
status_log:
  last_tested: "2025-12-16"
  last_tested_urls:
    - "Berlin: ✓ HTTP 200, 84 MB - FUNKTIONIERT!"
    - "Andere URLs: angenommen funktionierend (gleiches Format)"
  working_urls:
