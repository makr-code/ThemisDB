# Metadatenschema für Dokumente
# EntityType: Dokument
# Beschreibung: Strukturierte Metadaten für Dokumente und Schriftstücke

entityType: Dokument
version: 1.0
description: "Metadatenschema für offizielle Dokumente und Schriftstücke"

fields:
  - name: dokumentnummer
    displayName: "Dokumentnummer"
    type: Text
    required: true
    readonly: false
    description: "Eindeutige Dokumentnummer oder Aktenzeichen"

  - name: dokumenttitel
    displayName: "Dokumenttitel"
    type: Text
    required: true
    readonly: false
    description: "Offizieller Titel des Dokuments"

  - name: dokumenttyp
    displayName: "Dokumenttyp"
    type: Dropdown
    required: true
    readonly: false
    options:
      - "Vertrag"
      - "Rechnung"
      - "Protokoll"
      - "Bericht"
      - "Antrag"
      - "Beschluss"
      - "Schriftverkehr"
      - "Genehmigung"
      - "Attestation"
    description: "Art des Dokuments"

  - name: ausstellDatum
    displayName: "Ausstellungsdatum"
    type: DateTime
    required: true
    readonly: false
    description: "Datum der Dokumentausstellung"

  - name: gültigVon
    displayName: "Gültig von"
    type: DateTime
    required: false
    readonly: false
    description: "Gültigkeitsbeginn des Dokuments"

  - name: gültigBis
    displayName: "Gültig bis"
    type: DateTime
    required: false
    readonly: false
    description: "Gültigkeitsende des Dokuments"

  - name: aussteller
    displayName: "Aussteller"
    type: User
    required: true
    readonly: false
    description: "Person/Abteilung, die das Dokument ausgestellt hat"

  - name: unterzeichner
    displayName: "Unterzeichner"
    type: MultiSelect
    required: false
    readonly: false
    description: "Personen, die das Dokument unterzeichnet haben"

  - name: gültigkeitsstatus
    displayName: "Gültigkeitsstatus"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Draft"
      - "For Signature"
      - "Signed"
      - "Expired"
      - "Revoked"
    description: "Aktueller Gültigkeitsstatus"

  - name: klassifizierung
    displayName: "Klassifizierung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Public"
      - "Internal"
      - "Confidential"
      - "Restricted"
    description: "Sicherheitsklassifizierung"

  - name: language
    displayName: "Sprache"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "German"
      - "English"
      - "French"
      - "Dutch"
    description: "Sprache des Dokuments"

  - name: tags
    displayName: "Markierungen"
    type: MultiSelect
    required: false
    readonly: false
    description: "Benutzerdefinierten Tags zuweisen"

  - name: referenzen
    displayName: "Referenzen"
    type: TextArea
    required: false
    readonly: false
    description: "Verweis auf andere Dokumente oder Vorgänge"

  - name: notizen
    displayName: "Notizen"
    type: TextArea
    required: false
    readonly: false
    description: "Interne Notizen zum Dokument"
