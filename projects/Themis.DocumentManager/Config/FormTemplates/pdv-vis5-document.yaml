# PDV VIS 5 Form Template Configuration
# YAML-based configuration for dynamic form generation

form:
  id: pdv-vis5-document
  name: PDV VIS 5 Dokumentenverwaltung
  description: Umfassende Dokumentenverwaltungsmaske basierend auf PDV VIS 5 Standard
  version: "5.0"
  
  metadata:
    category: DocumentManagement
    system: PDV VIS 5
    organization: Öffentliche Verwaltung
    created_date: 2025-01-01
    modified_date: 2025-12-09

  sections:
    - id: grunddaten
      title: "📋 Grunddaten"
      description: "Basisdaten des Dokumentes"
      order: 1
      collapsible: true
      expanded: true
      
      fields:
        - id: document-number
          name: document_number
          label: "Dokumentennummer"
          type: text
          required: true
          readonly: true
          placeholder: "z.B. MU123456"
          help_text: "Eindeutige Dokumentenidentifikation"
          validation:
            pattern: "^[A-Z]{2}\\d{6}$"
            pattern_message: "Format: 2 Großbuchstaben + 6 Ziffern"
          attributes:
            uppercase: true

        - id: document-title
          name: document_title
          label: "Dokumententitel"
          type: text
          required: true
          placeholder: "Titel des Dokumentes eingeben"
          constraints:
            max_length: 255
          order: 2

        - id: document-type
          name: document_type
          label: "Dokumenttyp"
          type: dropdown
          required: true
          order: 3
          options:
            - value: letter
              label: "Schreiben"
            - value: report
              label: "Bericht"
            - value: protocol
              label: "Protokoll"
            - value: contract
              label: "Vertrag"
            - value: decision
              label: "Bescheid"
            - value: other
              label: "Sonstiges"

        - id: classification
          name: classification
          label: "Klassifikation (VS-NfD)"
          type: dropdown
          default_value: "vs-nfd"
          order: 4
          options:
            - value: public
              label: "Veröffentlichung"
            - value: internal
              label: "Nur für den Dienstgebrauch"
            - value: vs-nfd
              label: "Verschlusssache - Nur für den Dienstgebrauch"
            - value: vs-restricted
              label: "Verschlusssache - Geheim"

        - id: document-date
          name: document_date
          label: "Dokumentdatum"
          type: date
          required: true
          default_value: "{{TODAY}}"
          order: 5

        - id: description
          name: description
          label: "Beschreibung"
          type: textarea
          placeholder: "Ausführliche Beschreibung des Dokumentes"
          constraints:
            max_length: 2000
          order: 6

    - id: administration
      title: "⚙️ Verwaltungsdaten"
      description: "Verwaltungs- und Organisationsdaten"
      order: 2
      collapsible: true
      expanded: true
      
      fields:
        - id: department
          name: department
          label: "Abteilung"
          type: combobox
          required: true
          order: 1
          options:
            - value: hr
              label: "Personalwesen"
            - value: finance
              label: "Finanzen"
            - value: legal
              label: "Rechtswesen"
            - value: operations
              label: "Betrieb"

        - id: responsible-person
          name: responsible_person
          label: "Verantwortliche Person"
          type: text
          required: true
          order: 2

        - id: cost-center
          name: cost_center
          label: "Kostenstelle"
          type: text
          order: 3
          validation:
            pattern: "^\\d{6}$"

        - id: priority
          name: priority
          label: "Priorität"
          type: radiobutton
          default_value: "normal"
          order: 4
          options:
            - value: low
              label: "Niedrig"
            - value: normal
              label: "Normal"
            - value: high
              label: "Hoch"
            - value: urgent
              label: "Dringend"

    - id: metadata
      title: "🏷️ Metadaten & Archivierung"
      description: "Metadaten und Archivierungsinformationen"
      order: 3
      collapsible: true
      expanded: false
      
      fields:
        - id: keywords
          name: keywords
          label: "Schlagworte"
          type: textarea
          help_text: "Durch Komma getrennte Schlagworte für die Suche"
          order: 1

        - id: retention-period
          name: retention_period
          label: "Aufbewahrungsfrist (Jahre)"
          type: number
          default_value: 10
          constraints:
            min_value: 0
            max_value: 99
          order: 2

        - id: archive-status
          name: archive_status
          label: "Archivierungsstatus"
          type: dropdown
          default_value: "pending"
          order: 3
          options:
            - value: active
              label: "Aktiv"
            - value: pending
              label: "Ausstehend"
            - value: archived
              label: "Archiviert"
            - value: deleted
              label: "Gelöscht"

        - id: is-confidential
          name: is_confidential
          label: "Vertraulich"
          type: checkbox
          default_value: false
          order: 4

    - id: approval
      title: "✅ Freigabe & Genehmigung"
      description: "Freigabe- und Genehmigungsprozess"
      order: 4
      collapsible: true
      expanded: false
      
      fields:
        - id: approver
          name: approver
          label: "Freigegeben durch"
          type: text
          order: 1

        - id: approval-date
          name: approval_date
          label: "Freigabedatum"
          type: datetime
          order: 2

        - id: approval-status
          name: approval_status
          label: "Status der Freigabe"
          type: dropdown
          default_value: "pending"
          order: 3
          options:
            - value: pending
              label: "Ausstehend"
            - value: approved
              label: "Genehmigt"
            - value: rejected
              label: "Abgelehnt"
            - value: revision
              label: "Überarbeitung erforderlich"

        - id: approval-comment
          name: approval_comment
          label: "Kommentar zur Genehmigung"
          type: textarea
          constraints:
            max_length: 1000
          order: 4

# Style and Layout Configuration
styling:
  theme: modern_office
  colors:
    primary: "#1976D2"
    secondary: "#388E3C"
    error: "#D32F2F"
    warning: "#F57C00"
    info: "#0097A7"
  
  section_style:
    background_color: "#F5F5F5"
    border_radius: 4
    padding: 16
    margin_bottom: 16
    
  field_style:
    label_font_weight: bold
    label_font_size: 12
    input_height: 36
    border_radius: 2
    border_color: "#BDBDBD"

# Database Mapping Configuration
database:
  table: documents
  schema: themis_documents
  
  field_mappings:
    document_number: doc_number
    document_title: title
    document_type: type_id
    classification: classification_code
    document_date: created_date
    description: content
    department: dept_id
    responsible_person: owner_id
    cost_center: cost_center_code
    priority: priority_level
    keywords: tags
    retention_period: retention_years
    archive_status: status
    is_confidential: confidential_flag
    approver: approved_by_id
    approval_date: approval_timestamp
    approval_status: approval_state
    approval_comment: approval_notes
