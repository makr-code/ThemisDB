# Metadatenschema für Vorgänge
# EntityType: Vorgang
# Beschreibung: Strukturierte Metadaten für Geschäftsvorgänge und Prozesse

entityType: Vorgang
version: 1.0
description: "Metadatenschema für Geschäftsvorgänge, Anfragen und Anträge"

fields:
  - name: vorgangsnummer
    displayName: "Vorgangsnummer"
    type: Text
    required: true
    readonly: false
    description: "Eindeutige Vorgangsnummer"

  - name: vorgangstitel
    displayName: "Vorgangstitel"
    type: Text
    required: true
    readonly: false
    description: "Kurztitel des Vorgangs"

  - name: vorgangstyp
    displayName: "Vorgangstyp"
    type: Dropdown
    required: true
    readonly: false
    options:
      - "Anfrage"
      - "Antrag"
      - "Beschwerde"
      - "Genehmigung"
      - "Beschaffung"
      - "Personal"
      - "IT-Support"
      - "Sonstiges"
    description: "Kategorie des Vorgangs"

  - name: status
    displayName: "Status"
    type: Dropdown
    required: true
    readonly: false
    options:
      - "Neu"
      - "In Bearbeitung"
      - "Wartend"
      - "Abgeschlossen"
      - "Abgelehnt"
      - "Abgebrochen"
    description: "Aktueller Bearbeitungsstatus"

  - name: priorität
    displayName: "Priorität"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Niedrig"
      - "Mittel"
      - "Hoch"
      - "Kritisch"
    description: "Prioritätsstufe des Vorgangs"

  - name: erstellDatum
    displayName: "Erstellungsdatum"
    type: DateTime
    required: true
    readonly: true
    description: "Zeitpunkt der Vorgangserstellung"

  - name: bearbeitungsfrist
    displayName: "Bearbeitungsfrist"
    type: DateTime
    required: false
    readonly: false
    description: "Deadline für die Bearbeitung"

  - name: erstellerName
    displayName: "Ersteller"
    type: User
    required: true
    readonly: false
    description: "Person, die den Vorgang eingereicht hat"

  - name: verantwortlichePerson
    displayName: "Verantwortliche Person"
    type: User
    required: true
    readonly: false
    description: "Person, die für die Bearbeitung zuständig ist"

  - name: beteiligte
    displayName: "Beteiligte"
    type: MultiSelect
    required: false
    readonly: false
    description: "Weitere beteiligte Personen"

  - name: abteilung
    displayName: "Abteilung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "HR"
      - "IT"
      - "Finance"
      - "Legal"
      - "Operations"
      - "Sales"
      - "Marketing"
    description: "Zuständige Abteilung"

  - name: kostenstelle
    displayName: "Kostenstelle"
    type: Text
    required: false
    readonly: false
    description: "Kostenstelle für die Abrechnung"

  - name: klassifizierung
    displayName: "Klassifizierung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Public"
      - "Internal"
      - "Confidential"
      - "Restricted"
    description: "Sicherheitsklassifizierung"

  - name: tags
    displayName: "Markierungen"
    type: MultiSelect
    required: false
    readonly: false
    description: "Benutzerdefinierten Tags zuweisen"

  - name: beschreibung
    displayName: "Beschreibung"
    type: TextArea
    required: false
    readonly: false
    description: "Detaillierte Beschreibung des Vorgangs"

  - name: nächsteSchritte
    displayName: "Nächste Schritte"
    type: TextArea
    required: false
    readonly: false
    description: "Geplante nächste Schritte"
