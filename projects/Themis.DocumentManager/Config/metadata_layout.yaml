strategy: HideEmptyFields

groups:
  - id: vorgang
    title: Vorgang
    icon: "📁"
    displayOrder: 1
    fields:
      - name: Aktenzeichen
        path: process.fileReference
        type: Text
        required: true
      - name: Betreff
        path: process.subject
        type: Text
        required: true
      - name: Vorgangsart
        path: process.type
        type: Dropdown
        options: [Baugenehmigung, Betriebsgenehmigung, Gewerbeanmeldung, Umweltgenehmigung, Verkehrsregelung]
      - name: Beschreibung
        path: process.description
        type: RichText

  - id: status
    title: Status & Workflow
    icon: "⚡"
    displayOrder: 2
    fields:
      - name: Status
        path: process.status
        type: Dropdown
        options: [Eingang, In Bearbeitung, Rückfrage, Externe Prüfung, Genehmigt, Abgelehnt]
      - name: Priorität
        path: process.priority
        type: Dropdown
        options: [Niedrig, Normal, Hoch, Dringend]
      - name: Frist
        path: process.dueDate
        type: Date
      - name: Wiedervorlage
        path: process.reminder
        type: Date

  - id: organisation
    title: Organisation
    icon: "🏢"
    displayOrder: 3
    fields:
      - name: Sachbearbeiter
        path: process.assignedTo
        type: Text
      - name: Behörde
        path: authority.name
        type: Text
      - name: Abteilung
        path: process.department
        type: Text
      - name: Geschäftszeichen
        path: file.fileNumber
        type: Text

  - id: zeit
    title: Zeitliche Daten
    icon: "🕒"
    displayOrder: 4
    fields:
      - name: Erstellt am
        path: document.createdAt
        type: Date
      - name: Geändert am
        path: document.modifiedAt
        type: Date

  - id: thematik
    title: Schlagwörter & Themen
    icon: "🏷️"
    displayOrder: 5
    fields:
      - name: Schlagwörter
        path: document.tags
        type: RichText
      - name: Themen
        path: document.topics
        type: RichText
