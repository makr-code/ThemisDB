# Metadatenschema für Akten
# EntityType: Akte
# Beschreibung: Strukturierte Metadaten für Aktendossiers und Sammlungen

entityType: Akte
version: 1.0
description: "Metadatenschema für Aktendossiers und Sammlungen"

fields:
  - name: aktensignatur
    displayName: "Aktensignatur"
    type: Text
    required: true
    readonly: false
    description: "Eindeutige Aktensignatur/Aktenzeichen"

  - name: aktentitel
    displayName: "Aktentitel"
    type: Text
    required: true
    readonly: false
    description: "Offizielle Bezeichnung der Akte"

  - name: aktenart
    displayName: "Aktenart"
    type: Dropdown
    required: true
    readonly: false
    options:
      - "Personenakte"
      - "Fallakte"
      - "Projektakte"
      - "Vertragsakte"
      - "Beschwerdakte"
      - "Verwaltungsakte"
    description: "Art der Akte"

  - name: eröffnungsDatum
    displayName: "Eröffnungsdatum"
    type: DateTime
    required: true
    readonly: false
    description: "Datum der Akteneröffnung"

  - name: abschlußDatum
    displayName: "Abschlußdatum"
    type: DateTime
    required: false
    readonly: false
    description: "Datum des Aktenabschlusses"

  - name: aufbewahrungsFrist
    displayName: "Aufbewahrungsfrist (Jahre)"
    type: Number
    required: false
    readonly: false
    description: "Aufbewahrungsfrist in Jahren"

  - name: vernichtungsDatum
    displayName: "Vernichtungsdatum"
    type: DateTime
    required: false
    readonly: false
    description: "Geplantes Vernichtungsdatum nach Frist"

  - name: verantwortlichePerson
    displayName: "Verantwortliche Person"
    type: User
    required: true
    readonly: false
    description: "Person, die die Akte verwaltet"

  - name: abteilung
    displayName: "Abteilung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "HR"
      - "Finance"
      - "Legal"
      - "Operations"
      - "Compliance"
      - "IT"
    description: "Zuständige Abteilung"

  - name: betreffPerson
    displayName: "Betroffene Person"
    type: Text
    required: false
    readonly: false
    description: "Name der betroffenen Person (bei Personalakten)"

  - name: status
    displayName: "Aktenstatus"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Aktiv"
      - "Inaktiv"
      - "Archiviert"
      - "Vernichtet"
    description: "Aktueller Bearbeitungsstatus der Akte"

  - name: klassifizierung
    displayName: "Klassifizierung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Public"
      - "Internal"
      - "Confidential"
      - "Restricted"
    description: "Sicherheitsklassifizierung"

  - name: aufbewahrungsort
    displayName: "Aufbewahrungsort"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Digital"
      - "Schrank A"
      - "Schrank B"
      - "Archiv"
      - "Extern"
    description: "Physischer oder digitaler Speicherort"

  - name: tags
    displayName: "Markierungen"
    type: MultiSelect
    required: false
    readonly: false
    description: "Benutzerdefinierten Tags zuweisen"

  - name: notizen
    displayName: "Notizen"
    type: TextArea
    required: false
    readonly: false
    description: "Interne Notizen zur Akte"

  - name: rechtlicheGrundlage
    displayName: "Rechtliche Grundlage"
    type: TextArea
    required: false
    readonly: false
    description: "Relevante rechtliche Grundlagen"
