# Metadatenschema für Ablagen/Verzeichnisse
# EntityType: Ablage
# Beschreibung: Strukturierte Metadaten für Ordner und Verzeichnisse

entityType: Ablage
version: 1.0
description: "Metadatenschema für Ablagen, Ordner und Verzeichnisse"

fields:
  - name: ablagebezeichnung
    displayName: "Ablagebezeichnung"
    type: Text
    required: true
    readonly: false
    description: "Name des Ordners/Verzeichnises"

  - name: ablagepfad
    displayName: "Ablagesignatur"
    type: Text
    required: true
    readonly: false
    description: "Hierarchische Signatur (z.B. AA/BB/CC)"

  - name: ablageart
    displayName: "Ablageart"
    type: Dropdown
    required: true
    readonly: false
    options:
      - "Dokumentsammlung"
      - "Prozessordner"
      - "Projektordner"
      - "Persönlicher Ordner"
      - "Archiv"
      - "Temporär"
    description: "Art der Ablage"

  - name: erstellDatum
    displayName: "Erstellungsdatum"
    type: DateTime
    required: true
    readonly: true
    description: "Zeitpunkt der Ordnererstellung"

  - name: ersteller
    displayName: "Ersteller"
    type: User
    required: true
    readonly: true
    description: "Benutzer, der den Ordner erstellt hat"

  - name: verantwortlichePerson
    displayName: "Verantwortliche Person"
    type: User
    required: false
    readonly: false
    description: "Person, die den Ordner verwaltet"

  - name: abteilung
    displayName: "Abteilung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "HR"
      - "IT"
      - "Finance"
      - "Legal"
      - "Operations"
      - "Sales"
      - "Marketing"
    description: "Zuständige Abteilung"

  - name: status
    displayName: "Status"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Aktiv"
      - "Gesperrt"
      - "Archiviert"
      - "Gelöscht"
    description: "Aktueller Status der Ablage"

  - name: klassifizierung
    displayName: "Klassifizierung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Public"
      - "Internal"
      - "Confidential"
      - "Restricted"
    description: "Sicherheitsklassifizierung"

  - name: zugriffsbeschränkung
    displayName: "Zugriffsbeschränkung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Öffentlich"
      - "Abteilungsinternes"
      - "Begrenzte Gruppe"
      - "Nur Verantwortlicher"
    description: "Zugriffsebene"

  - name: erlaubteGruppen
    displayName: "Erlaubte Gruppen"
    type: MultiSelect
    required: false
    readonly: false
    description: "Benutzergruppen mit Zugriff"

  - name: aufbewahrungsFrist
    displayName: "Aufbewahrungsfrist (Jahre)"
    type: Number
    required: false
    readonly: false
    description: "Aufbewahrungsfrist in Jahren"

  - name: tags
    displayName: "Markierungen"
    type: MultiSelect
    required: false
    readonly: false
    description: "Benutzerdefinierten Tags zuweisen"

  - name: beschreibung
    displayName: "Beschreibung"
    type: TextArea
    required: false
    readonly: false
    description: "Detaillierte Beschreibung des Ordnerinhalts"
