# Metadatenschema für Dateien
# EntityType: Datei
# Beschreibung: Strukturierte Metadaten für digitale Dateien/Attachments

entityType: Datei
version: 1.0
description: "Metadatenschema für digitale Dateien und Attachments"

fields:
  - name: dateiName
    displayName: "Datei Name"
    type: Text
    required: true
    readonly: false
    description: "Name der Datei mit Erweiterung"

  - name: dateityp
    displayName: "Dateityp"
    type: Dropdown
    required: true
    readonly: false
    options:
      - "PDF"
      - "DOCX"
      - "XLSX"
      - "Image"
      - "Video"
      - "Audio"
      - "Archive"
      - "Other"
    description: "Kategorie des Dateityps"

  - name: dateigröße
    displayName: "Dateigröße (Bytes)"
    type: Number
    required: false
    readonly: true
    description: "Größe der Datei in Bytes"

  - name: erstellDatum
    displayName: "Erstellungsdatum"
    type: DateTime
    required: true
    readonly: true
    description: "Zeitpunkt der Dateierstellung"

  - name: änderDatum
    displayName: "Änderungsdatum"
    type: DateTime
    required: false
    readonly: true
    description: "Letzte Änderung der Datei"

  - name: ersteller
    displayName: "Ersteller"
    type: User
    required: true
    readonly: true
    description: "Benutzer, der die Datei erstellt hat"

  - name: scan_status
    displayName: "Scan-Status"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Pending"
      - "In Progress"
      - "Completed"
      - "Failed"
    description: "Status der Virenprüfung"

  - name: klassifizierung
    displayName: "Klassifizierung"
    type: Dropdown
    required: false
    readonly: false
    options:
      - "Public"
      - "Internal"
      - "Confidential"
      - "Restricted"
    description: "Sicherheitsklassifizierung"

  - name: tags
    displayName: "Markierungen"
    type: MultiSelect
    required: false
    readonly: false
    description: "Benutzerdefinierten Tags zuweisen"

  - name: beschreibung
    displayName: "Beschreibung"
    type: TextArea
    required: false
    readonly: false
    description: "Detaillierte Beschreibung der Datei"
