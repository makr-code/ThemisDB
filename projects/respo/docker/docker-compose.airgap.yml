# RESPO Air-Gapped Docker Compose Override
# Use with: docker compose -f docker-compose.yml -f docker-compose.airgap.yml up -d

services:
  respo-api:
    image: respo-api:latest
    environment:
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1

  vllm:
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ./models:/models:ro
