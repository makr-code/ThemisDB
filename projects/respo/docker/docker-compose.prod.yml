# RESPO Production Docker Compose Override
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  respo-api:
    restart: always
    environment:
      - LOG_LEVEL=WARNING
      - WORKERS=4
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  vllm:
    restart: always
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
    logging:
      driver: json-file
      options:
        max-size: "500m"
        max-file: "3"
