# =============================================================================
# RESPO LoRA Training - Base Configuration
# =============================================================================
# This is the base configuration for LoRA fine-tuning of code LLMs.
# Override specific settings in language-specific configs.

# Model Configuration
model:
  base_model: "codellama/CodeLlama-13b-Instruct-hf"
  model_type: "llama"
  torch_dtype: "bfloat16"
  trust_remote_code: true
  
# LoRA Configuration
lora:
  r: 64                      # LoRA rank (higher = more parameters)
  lora_alpha: 128            # Alpha scaling factor
  lora_dropout: 0.05         # Dropout rate
  bias: "none"               # Bias training (none, all, lora_only)
  task_type: "CAUSAL_LM"
  target_modules:            # Modules to apply LoRA
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Training Configuration
training:
  output_dir: "./output/respo-base"
  num_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_seq_length: 4096
  
  # Optimization
  optim: "paged_adamw_32bit"
  gradient_checkpointing: true
  fp16: false
  bf16: true
  
  # Logging
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  
  # Reproducibility
  seed: 42

# Data Configuration
data:
  train_file: "./data/train.jsonl"
  eval_file: "./data/eval.jsonl"
  max_samples: null          # Limit samples (null = all)
  instruction_column: "instruction"
  input_column: "input"
  output_column: "output"
  
# Prompt Template
prompt:
  template: |
    ### Instruction:
    {instruction}
    
    ### Input:
    {input}
    
    ### Response:
    {output}
  
  # For inference (without output)
  inference_template: |
    ### Instruction:
    {instruction}
    
    ### Input:
    {input}
    
    ### Response:

# Evaluation
evaluation:
  do_eval: true
  eval_strategy: "steps"
  benchmarks:
    - humaneval
    - mbpp
  
# Hardware
hardware:
  device_map: "auto"
  load_in_8bit: false
  load_in_4bit: false        # Use QLoRA for smaller GPUs

# DeepSpeed (optional)
deepspeed:
  enabled: false
  config_file: "./configs/ds_config.json"
