# RESPO Helm Chart Values

replicaCount: 1

image:
  repository: respo
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  hosts:
    - host: respo.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 1000m
    memory: 2Gi

vectorStore:
  type: chroma  # chroma, qdrant, themis
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: standard

vllm:
  enabled: true
  model: codellama/CodeLlama-7b-Instruct-hf
  gpuCount: 1
  resources:
    limits:
      nvidia.com/gpu: 1

cache:
  enabled: true
  type: redis
  redis:
    host: redis
    port: 6379

monitoring:
  enabled: true
  prometheus:
    enabled: true
    serviceMonitor: true

backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 7  # Keep 7 days

env:
  LOG_LEVEL: INFO
  VECTOR_STORE: chroma
