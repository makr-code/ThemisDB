# =============================================================================
# RESPO LoRA Training - Python Configuration
# =============================================================================
# Configuration for Python-specific code LLM fine-tuning.
# Inherits from base.yaml

# Inherit base configuration
_base_: "base.yaml"

# Model Configuration (override if needed)
model:
  base_model: "codellama/CodeLlama-13b-Python-hf"  # Python-optimized variant

# Training Configuration (Python-specific)
training:
  output_dir: "./output/respo-python"
  num_epochs: 3
  max_seq_length: 4096      # Python code can be longer

# Data Configuration (Python-specific)
data:
  train_file: "./data/python_train.jsonl"
  eval_file: "./data/python_eval.jsonl"
  
  # Data processing
  filter_languages:
    - python
  min_code_length: 50       # Minimum characters
  max_code_length: 8000     # Maximum characters
  
# Python-specific prompt template
prompt:
  template: |
    Du bist ein erfahrener Python-Entwickler. Beantworte die folgende Anfrage.
    
    ### Anfrage:
    {instruction}
    
    ### Kontext:
    {input}
    
    ### Antwort:
    {output}
    
  inference_template: |
    Du bist ein erfahrener Python-Entwickler. Beantworte die folgende Anfrage.
    
    ### Anfrage:
    {instruction}
    
    ### Kontext:
    {input}
    
    ### Antwort:

# Python-specific training data categories
data_categories:
  - name: "implementation"
    weight: 0.3
    description: "Code implementation tasks"
  
  - name: "explanation"
    weight: 0.2
    description: "Code explanation tasks"
    
  - name: "debugging"
    weight: 0.2
    description: "Bug finding and fixing"
    
  - name: "review"
    weight: 0.15
    description: "Code review tasks"
    
  - name: "refactoring"
    weight: 0.15
    description: "Code refactoring tasks"

# Evaluation benchmarks (Python-specific)
evaluation:
  benchmarks:
    - humaneval
    - mbpp
    - apps
  
  custom_tests:
    - "./tests/python_unit_tests.jsonl"
    - "./tests/python_integration_tests.jsonl"
