# =============================================================================
# Timestamp Authority (TSA) Configuration - RFC 3161
# =============================================================================
#
# This file configures the Timestamp Authority client for obtaining
# cryptographic timestamps according to RFC 3161.
#
# Use Cases:
#   - eIDAS qualified electronic timestamps (Art. 42)
#   - Audit compliance (DSGVO Art. 30)
#   - Code signing timestamps
#   - Document timestamping
#
# =============================================================================

timestamp_authority:
  # Enable/disable Timestamp Authority client
  enabled: true
  
  # TSA server URL (must support RFC 3161 Time-Stamp Protocol)
  # Common free TSAs:
  #   - FreeTSA:     https://freetsa.org/tsr (self-signed cert)
  #   - DigiCert:    https://timestamp.digicert.com
  #   - Sectigo:     http://timestamp.sectigo.com
  #   - DFN-Verein:  http://zeitstempel.dfn.de (Germany)
  url: "https://freetsa.org/tsr"
  
  # Hash algorithm for message imprint
  # Options: SHA256, SHA384, SHA512
  # Recommended: SHA256 (widely supported)
  hash_algorithm: "SHA256"
  
  # Request certificate in TSA response
  # true = TSA certificate included in response (recommended for verification)
  # false = no certificate in response (smaller response, requires separate cert)
  cert_req: true
  
  # HTTP timeout in seconds
  # Recommended: 30 seconds (TSA requests can be slow)
  timeout_seconds: 30
  
  # Retry configuration
  retry_attempts: 3
  retry_delay_ms: 1000
  
  # Optional: TSA authentication (if required by TSA)
  # Leave empty if TSA does not require authentication
  # username: ""
  # password: ""
  
  # Optional: Client certificate for mutual TLS (mTLS)
  # Required by some enterprise TSA services
  # client_cert_path: "/path/to/client.crt"
  # client_key_path: "/path/to/client.key"
  
  # Optional: CA certificate for TSA server validation
  # Verify TSA certificate against this CA
  # Leave empty to use system trust store
  # ca_cert_path: "/path/to/ca.crt"
  
  # Verify TSA certificate
  # true = verify TSA certificate (recommended for production)
  # false = skip verification (useful for self-signed certs like FreeTSA)
  verify_tsa_cert: false
  
  # Optional: Policy OID (TSA-specific)
  # Some TSAs require a specific policy OID
  # Leave empty to let TSA choose policy
  # policy_oid: "1.2.3.4.5.6.7.8.9"

# =============================================================================
# eIDAS Compliance Configuration
# =============================================================================

eidas:
  # Enable eIDAS compliance validation
  enabled: true
  
  # Maximum timestamp age for long-term validation (days)
  # eIDAS: 30 years = 10950 days
  max_age_days: 10950
  
  # Qualified Trust Service Providers (QTSP) list
  # These are TSAs that are qualified under eIDAS
  # In production, this should be loaded from the EU Trusted List
  # https://eidas.ec.europa.eu/efda/tl-browser/
  qualified_tsps:
    - "D-TRUST"
    - "DFN-PKI"
    - "Bundesdruckerei"
    - "Deutsche Telekom"
    # Add more qualified TSPs as needed

# =============================================================================
# Logging and Monitoring
# =============================================================================

logging:
  # Log level for TSA operations
  # Options: debug, info, warn, error
  level: info
  
  # Log all TSA requests/responses (for audit)
  log_requests: true
  log_responses: true

monitoring:
  # Prometheus metrics
  enable_metrics: true
  
  # Alert thresholds
  max_latency_ms: 2000  # Alert if TSA response > 2 seconds
  max_error_rate: 0.1   # Alert if error rate > 10%

# =============================================================================
# Performance Tuning
# =============================================================================

performance:
  # Connection pooling (reuse HTTP connections)
  enable_connection_pooling: true
  max_connections: 10
  
  # Request batching (combine multiple timestamp requests)
  enable_batching: false
  batch_size: 10
  batch_timeout_ms: 100

# =============================================================================
# Alternative TSA Servers (for reference)
# =============================================================================

# Uncomment and modify to use alternative TSA servers:

# For DigiCert:
# timestamp_authority:
#   url: "https://timestamp.digicert.com"
#   verify_tsa_cert: true

# For DFN-Verein (Germany):
# timestamp_authority:
#   url: "http://zeitstempel.dfn.de"
#   verify_tsa_cert: true

# For enterprise/private TSA:
# timestamp_authority:
#   url: "https://tsa.example.com/tsr"
#   username: "your-username"
#   password: "your-password"
#   client_cert_path: "/path/to/client.crt"
#   client_key_path: "/path/to/client.key"
#   ca_cert_path: "/path/to/ca.crt"
#   verify_tsa_cert: true
