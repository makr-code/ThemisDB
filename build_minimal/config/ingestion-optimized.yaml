# ThemisDB Ingestion-Optimized Configuration
# 
# Diese Konfiguration ist für High-Throughput Data Ingestion optimiert.
# Geeignet für: Bulk-Import, Streaming-Ingestion, Time Series, RAG/Embeddings
#
# Hardware-Empfehlung:
# - 64GB+ RAM
# - 16+ CPU Cores
# - NVMe SSD für WAL
# - SATA SSD/HDD für Data

# ===== RocksDB Storage Configuration =====
storage:
  # Pfade
  db_path: /data/rocksdb
  wal_dir: /nvme/rocksdb/wal  # Separate WAL auf schnellem Storage
  
  # Tiered storage (hot/warm/cold data)
  db_paths:
    - path: /nvme/rocksdb/hot
      target_size_gb: 100      # Hot data auf NVMe
    - path: /ssd/rocksdb/warm
      target_size_gb: 500      # Warm data auf SATA SSD
    - path: /data/rocksdb/cold
      target_size_gb: 0        # Cold data auf HDD (unlimited)
  
  # ===== Write Buffer (Memtable) Configuration =====
  # Größere Memtables = weniger Flushes = höherer Durchsatz
  memtable_size_mb: 1024        # 1 GB pro Memtable (default: 256 MB)
  max_write_buffer_number: 6    # Bis zu 6 aktive Memtables (default: 3)
  min_write_buffer_number_to_merge: 2  # Merge erst ab 2 Memtables
  db_write_buffer_size_mb: 6144 # 6 GB total für alle Memtables
  
  # ===== Block Cache Configuration =====
  block_cache_size_mb: 4096     # 4 GB Block Cache
  block_cache_shard_bits: 6     # 64 shards für hohe Concurrency
  cache_index_and_filter_blocks: true
  pin_l0_filter_and_index_blocks_in_cache: true
  partition_filters: true
  high_pri_pool_ratio: 0.5
  bloom_bits_per_key: 10
  
  # ===== Compaction Configuration =====
  # Aggressive compaction verhindert Write-Stalls
  max_background_jobs: 16                    # 16 background threads
  max_background_compactions: 8              # 8 für Compaction
  max_background_flushes: 2                  # 2 für Flush
  max_subcompactions: 2                      # Parallel sub-compactions
  background_threads_high: 2                 # Flush thread pool
  background_threads_low: 8                  # Compaction thread pool
  
  # Level0 file control (verhindert Write-Stalls)
  level0_file_num_compaction_trigger: 2      # Frühe Compaction (default: 4)
  level0_slowdown_writes_trigger: 8          # Warnung (default: 20)
  level0_stop_writes_trigger: 16             # Blockierung (default: 36)
  
  # Level-based compaction
  use_universal_compaction: false
  dynamic_level_bytes: true
  target_file_size_base_mb: 64
  max_bytes_for_level_base_mb: 256
  
  # ===== Parallel Write Optimization =====
  allow_concurrent_memtable_write: true      # Parallele Memtable-Writes
  enable_pipelined_write: true               # Gepipelined Writes
  write_policy: WritePrepared                # Beste Lock-Granularität
  two_write_queues: true                     # Dual write queues
  wp_commit_cache_bits: 23                   # 8M commit cache
  
  # ===== WAL Configuration =====
  enable_wal: true
  # Für höchsten Throughput (mit Datenverlust-Risiko):
  # sync: false
  # wal_bytes_per_sync: 67108864  # 64 MB (batch fsync)
  
  # Für Production (volle Durability):
  sync: true
  wal_bytes_per_sync: 0  # Jeder Write synced
  
  # ===== Compression Configuration =====
  # Zstd bietet beste Kompression bei akzeptabler CPU-Last
  compression_default: zstd
  compression_bottommost: zstd
  
  # Parallel compression (RocksDB 10.6+)
  compression_opts:
    parallel_threads: 8
    max_dict_bytes: 16384  # 16 KB dictionary
  
  # ===== I/O Configuration =====
  # Direct I/O für Bulk-Import (bypassed OS cache)
  use_direct_reads: false
  use_direct_io_for_flush_and_compaction: true
  
  # Async I/O mit Prefetching
  enable_async_io: true
  async_io_readahead_size_mb: 64
  async_io_multiget_batch_size: 100
  async_io_num_threads: 4
  
  # ===== TTL Configuration =====
  enable_ttl: false
  ttl_seconds: 0
  
  # ===== BlobDB Configuration =====
  enable_blobdb: true
  blob_size_threshold: 4096  # Files > 4KB gehen zu BlobDB

# ===== Server Configuration =====
server:
  host: 0.0.0.0
  port: 8080
  
  # HTTP/2 für Multiplexing und niedrigere Latenz
  enable_http2: true
  http2_max_concurrent_streams: 1000
  http2_initial_window_size: 65535
  
  # Binary Protocol Port (niedrigere Latenz als HTTP)
  binary_port: 9090
  
  # Compression für HTTP Payloads
  enable_payload_compression: true
  compression_type: zstd  # zstd, gzip, lz4
  compression_level: 3    # 1-22 für zstd
  
  # Connection pooling
  max_connections: 1000
  keepalive_timeout_sec: 300

# ===== Buffer Configuration =====
buffers:
  # Time Series Auto Buffer
  ts_auto_buffer:
    enabled: true
    max_points_per_buffer: 10000
    flush_interval_ms: 5000
    max_memory_mb: 500
    compression: gorilla  # 10-20x compression
  
  # Vector Auto Buffer
  vector_auto_buffer:
    enabled: true
    max_vectors_per_buffer: 1000
    flush_interval_ms: 5000
    max_memory_mb: 500
    compression: none  # PQ in Zukunft
  
  # Graph Auto Buffer
  graph_auto_buffer:
    enabled: true
    max_nodes_per_buffer: 1000
    max_edges_per_buffer: 1000
    flush_interval_ms: 5000
    compress_properties: true

# ===== Batch Processing Configuration =====
batch:
  # Adaptive batch sizing
  enable_adaptive_batching: true
  min_batch_size: 10
  max_batch_size: 10000
  target_batch_latency_ms: 50
  
  # Multi-level buffering
  client_buffer_interval_ms: 100
  server_buffer_interval_ms: 1000

# ===== Replication Configuration =====
replication:
  # Compressed WAL Shipping
  wal_shipping:
    compression: zstd
    compression_level: 3
    batch_size: 100
    max_batch_bytes: 1048576  # 1 MB
    
    # Adaptive batching
    adaptive_batch_size: true
    min_batch_size: 10
    max_batch_size: 1000

# ===== Monitoring Configuration =====
monitoring:
  # Metrics collection
  enable_metrics: true
  metrics_port: 9091
  
  # Low-latency metrics recording
  use_lock_free_metrics: true
  metrics_ring_buffer_size: 10000
  
  # Prometheus export
  prometheus_export_interval_sec: 15

# ===== Feature Flags =====
features:
  # Ingestion features
  enable_memory_mapped_import: true
  enable_zero_copy_network: true
  enable_direct_io_bulk_import: true
  
  # Advanced features
  enable_priority_queues: true
  enable_client_side_batching: true
  enable_payload_pre_compression: true

# ===== Benchmarking Mode =====
# ACHTUNG: Nur für Benchmarks! Deaktiviert Durability-Garantien
benchmark:
  enabled: false
  disable_wal: false
  disable_sync: false
  disable_compression: false

# ===== Logging Configuration =====
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  output: /var/log/themisdb/themisdb.log
  max_size_mb: 100
  max_backups: 10
  
  # Performance logging
  log_slow_queries: true
  slow_query_threshold_ms: 1000
  log_ingestion_stats: true
  stats_interval_sec: 60
