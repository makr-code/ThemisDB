# LoRA Training Configuration
# Complete configuration for LoRA adapter training with feedback integration

# Global LoRA settings
lora:
  # Enable LoRA framework
  enabled: true
  
  # Storage backend
  storage:
    backend: themisdb  # themisdb, filesystem, s3
    collection_name: lora_adapters
    filesystem_path: data/lora_adapters
    enable_versioning: true
    max_versions: 5
    enable_compression: true
    
  # Security
  security:
    enable_encryption: true
    encryption_key_id: lora_adapters
    enable_signatures: true
    
  # RAID/Redundancy
  raid:
    auto_detect: true
    
# Adapter configurations
adapters:
  # ThemisDB Documentation Assistant
  themis_help_lora:
    enabled: true
    
    # Base model
    base_model:
      name: llama-2-7b
      path: models/llama-2-7b-chat.gguf
      type: llama
      
    # LoRA hyperparameters
    hyperparameters:
      # LoRA rank (r) - higher = more capacity but slower
      rank: 8
      
      # LoRA alpha - scaling factor
      alpha: 16.0
      
      # Dropout rate
      dropout: 0.1
      
      # Learning rate
      learning_rate: 0.0003
      
      # Batch size for training
      batch_size: 4
      
      # Number of training epochs
      num_epochs: 3
      
      # Maximum sequence length
      max_seq_length: 512
      
      # Target modules to apply LoRA
      target_modules:
        - q_proj
        - v_proj
        - k_proj
        - o_proj
        
      # Optimizer
      optimizer: adamw
      
      # Weight decay
      weight_decay: 0.01
      
      # Warmup steps
      warmup_steps: 100
      
      # Learning rate scheduler
      lr_scheduler: cosine
      
    # Training data sources
    training_data:
      # Documentation corpus
      documentation:
        enabled: true
        path: data/docs_database.json
        weight: 1.0
        preprocessing:
          max_length: 512
          stride: 128
          
      # User feedback
      feedback:
        enabled: true
        collection: help_feedback
        
        # Feedback filtering
        filters:
          min_rating: 3
          flagged_for_training: true
          
        # Weight configuration
        weighting:
          # Direct (non-cached) responses
          direct_response_weight: 1.0
          
          # Exact cache hits
          exact_cache_weight: 0.4
          
          # Semantic cache hits
          semantic_cache_base_weight: 0.3
          similarity_weight_factor: 0.5
          
          # Disable cached responses completely
          disable_cache_training: false
          
          # Type-based weights (multiply with cache weights)
          type_weights:
            positive: 1.0
            negative: 1.2  # Prioritize corrections
            neutral: 0.8
            
          # Rating-based weights
          rating_weights:
            5: 1.2  # Excellent responses
            4: 1.0  # Good responses
            3: 0.8  # Acceptable
            2: 0.6  # Poor (but learn from mistakes)
            1: 0.4  # Very poor
            
        # Balancing
        balance:
          # Balance positive/negative examples
          enable_balancing: true
          target_ratio: 0.7  # 70% positive, 30% negative/neutral
          
          # Balance cached/direct responses
          balance_cache_types: true
          max_cache_ratio: 0.5  # Max 50% cached responses
          
      # Custom training data
      custom:
        enabled: false
        path: data/custom_training.jsonl
        weight: 0.5
        
    # Training triggers
    triggers:
      # Automatic training
      automatic:
        enabled: true
        
        # Batch size trigger (effective batch size with weights)
        batch_size:
          min: 50
          max: 200
          use_effective_size: true
          
        # Time-based trigger
        time:
          max_wait_hours: 24
          cron_schedule: "0 2 * * *"  # Daily at 2 AM
          
        # Quality-based trigger
        quality:
          min_avg_rating: 3.5
          min_positive_ratio: 0.6
          
      # Manual training
      manual:
        enabled: true
        require_approval: true
        
    # Training pipeline
    pipeline:
      # Preprocessing
      preprocessing:
        # Tokenization
        tokenizer:
          type: sentencepiece
          model_path: models/tokenizer.model
          
        # Data augmentation
        augmentation:
          enabled: true
          techniques:
            - paraphrase
            - synonym_replacement
          probability: 0.1
          
        # Shuffling
        shuffle: true
        seed: 42
        
      # Training execution
      execution:
        # Device
        device: cuda  # cuda, cpu, mps
        device_id: 0
        
        # Precision
        mixed_precision: true
        fp16: true
        
        # Gradient accumulation
        gradient_accumulation_steps: 4
        
        # Checkpointing
        checkpointing:
          enabled: true
          save_steps: 100
          keep_last_n: 3
          
        # Early stopping
        early_stopping:
          enabled: true
          patience: 3
          min_delta: 0.001
          
      # Validation
      validation:
        # Validation split
        split_ratio: 0.1
        
        # Validation frequency
        eval_steps: 50
        
        # Metrics
        metrics:
          - perplexity
          - accuracy
          - f1_score
          
        # Minimum thresholds
        thresholds:
          min_accuracy: 0.80
          max_perplexity: 50.0
          
      # Post-processing
      postprocessing:
        # Merge with base model
        merge_with_base: false
        
        # Quantization
        quantization:
          enabled: false
          method: q4_0  # q4_0, q4_1, q5_0, q5_1, q8_0
          
    # Quality assurance
    quality:
      # A/B testing
      ab_testing:
        enabled: true
        traffic_split: 0.1  # 10% traffic to new version
        duration_hours: 24
        success_metrics:
          - avg_rating
          - response_accuracy
        min_improvement: 0.05
        
      # Auto-rollback
      auto_rollback:
        enabled: true
        triggers:
          - accuracy_drop > 0.1
          - avg_rating < 3.0
          - error_rate > 0.05
        cooldown_hours: 6
        
      # Validation tests
      validation_tests:
        - question: "What is ThemisDB?"
          expected_keywords:
            - database
            - multi-model
          min_confidence: 0.8
          
        - question: "How to create a collection?"
          expected_keywords:
            - CREATE COLLECTION
            - syntax
          min_confidence: 0.7
          
    # Monitoring
    monitoring:
      # Metrics collection
      metrics:
        enabled: true
        export_to_prometheus: true
        
      # Training metrics
      training_metrics:
        - loss
        - learning_rate
        - gradient_norm
        - effective_batch_size
        - cache_weight_distribution
        
      # Performance metrics
      performance_metrics:
        - training_time
        - samples_per_second
        - gpu_utilization
        - memory_usage
        
      # Quality metrics
      quality_metrics:
        - validation_accuracy
        - avg_rating_before
        - avg_rating_after
        - cache_hit_rate
        
    # Audit logging
    audit:
      enabled: true
      log_file: logs/lora_training_audit.jsonl
      events:
        - training_started
        - training_completed
        - training_failed
        - version_deployed
        - version_rolled_back
        - feedback_batch_processed
        
  # Code Assistant LoRA (Example)
  code_assist_lora:
    enabled: false
    base_model:
      name: codellama-7b
      path: models/codellama-7b-instruct.gguf
      type: llama
      
    hyperparameters:
      rank: 16  # Higher rank for code
      alpha: 32.0
      learning_rate: 0.0001
      batch_size: 2
      num_epochs: 5
      
    training_data:
      feedback:
        enabled: true
        weighting:
          direct_response_weight: 1.0
          exact_cache_weight: 0.3  # Lower for code (exact matches less useful)
          semantic_cache_base_weight: 0.2
          
    triggers:
      automatic:
        enabled: true
        batch_size:
          min: 100  # Need more examples for code
          max: 500
          
# Global training settings
training_defaults:
  # Resource limits
  resources:
    max_cpu_cores: 8
    max_memory_gb: 32
    max_gpu_memory_gb: 16
    
  # Concurrency
  concurrency:
    max_concurrent_trainings: 2
    queue_size: 10
    
  # Retry policy
  retry:
    max_attempts: 3
    backoff_seconds: 60
    
  # Cleanup
  cleanup:
    remove_temp_files: true
    keep_failed_runs: false
    archive_old_versions: true
    
# Notification settings
notifications:
  enabled: true
  
  # Email notifications
  email:
    enabled: false
    smtp_host: smtp.example.com
    smtp_port: 587
    from: noreply@example.com
    to:
      - admin@example.com
    events:
      - training_completed
      - training_failed
      - version_deployed
      - auto_rollback_triggered
      
  # Webhook notifications
  webhook:
    enabled: false
    url: https://hooks.example.com/lora-training
    events:
      - training_completed
      - training_failed
      
  # Slack notifications
  slack:
    enabled: false
    webhook_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    channel: "#lora-training"
    events:
      - training_completed
      - training_failed
      - auto_rollback_triggered
