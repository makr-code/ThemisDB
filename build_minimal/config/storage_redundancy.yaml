# ThemisDB Storage Redundancy Configuration
# 
# This file configures redundancy at the binary blob level (RocksDB SST files,
# WAL segments, indexes, etc.). Each blob type can have different redundancy
# settings for optimal performance/redundancy trade-offs.
#
# Hierarchy: Global → Blob Type → Collection → Document → Field
# Lower levels override higher levels.
#
# Version: 1.0
# Documentation: docs/storage/GRANULAR_BLOB_REDUNDANCY.md

# =============================================================================
# Global Defaults
# =============================================================================
global:
  # Default redundancy mode for all blobs
  # Options: NONE, MIRROR, STRIPE, STRIPE_MIRROR, PARITY, GEO_MIRROR
  default_redundancy_mode: MIRROR
  
  # Default replication factor (for MIRROR mode)
  default_replication_factor: 2
  
  # Enable blob-level tracking in metadata store
  enable_blob_tracking: true
  
  # Metadata store for blob tracking
  # Options: etcd, consul, embedded
  blob_metadata_store: etcd
  blob_metadata_endpoint: "http://localhost:2379"
  
  # Background maintenance
  maintenance_interval_seconds: 300
  repair_parallelism: 4
  
  # Checksum algorithm for integrity verification
  # Options: CRC32, SHA256, XXHASH64
  checksum_algorithm: SHA256

# =============================================================================
# Storage Tiers
# =============================================================================
storage_tiers:
  # Hot tier: Local SSD for frequently accessed data
  hot:
    type: LOCAL_SSD
    path: /data/themis/hot
    max_capacity_gb: 500
    min_free_space_percent: 10
    redundancy_mode: MIRROR
    replication_factor: 2
    # Performance settings
    direct_io: true
    sync_writes: false
    compression: NONE
    
  # Warm tier: Local HDD or network storage for less active data
  warm:
    type: LOCAL_HDD
    path: /data/themis/warm
    max_capacity_gb: 2000
    min_free_space_percent: 5
    redundancy_mode: PARITY
    erasure_coding:
      data_shards: 4
      parity_shards: 2
      algorithm: REED_SOLOMON
    # Performance settings
    direct_io: false
    sync_writes: false
    compression: LZ4
    
  # Cold tier: Object storage for archival data
  cold:
    type: OBJECT_STORAGE
    endpoint: "s3://themis-cold-storage"
    region: eu-west-1
    max_capacity_gb: 50000
    redundancy_mode: PARITY
    erasure_coding:
      data_shards: 10
      parity_shards: 4
      algorithm: REED_SOLOMON
    # Performance settings
    compression: ZSTD
    compression_level: 3
    multipart_threshold_mb: 100
    
  # Archive tier: Glacier-like for long-term retention
  archive:
    type: GLACIER
    endpoint: "glacier://themis-archive"
    region: eu-west-1
    redundancy_mode: PARITY
    erasure_coding:
      data_shards: 10
      parity_shards: 6
      algorithm: LRC  # Local Reconstruction Codes
    # Retrieval settings
    retrieval_tier: BULK  # EXPEDITED, STANDARD, BULK
    min_retention_days: 90

# =============================================================================
# Blob Type Configurations
# =============================================================================
blob_types:
  # ---------------------------------------------------------------------------
  # RocksDB SST Files
  # ---------------------------------------------------------------------------
  
  SST_L0:
    description: "Level 0 SST files - freshly flushed memtables"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 2
    sync_write: true
    priority: CRITICAL
    # L0 files are small and frequently accessed
    max_size_mb: 64
    # No auto tier-down - compaction handles this
    auto_tier_down: false
    
  SST_L1:
    description: "Level 1 SST files - first compaction level"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 2
    sync_write: false
    priority: HIGH
    max_size_mb: 256
    auto_tier_down: false
    
  SST_L2_PLUS:
    description: "Level 2+ SST files - compacted, less frequently accessed"
    tier: warm
    redundancy_mode: PARITY
    erasure_coding:
      data_shards: 4
      parity_shards: 2
    priority: NORMAL
    max_size_mb: 256
    # Automatically move to cold tier after 30 days without access
    auto_tier_down: true
    tier_down_after_days: 30
    tier_down_target: cold
    # Move to archive after 180 days
    archive_after_days: 180
    
  # ---------------------------------------------------------------------------
  # Write-Ahead Logs
  # ---------------------------------------------------------------------------
  
  WAL:
    description: "Write-Ahead Log segments - critical for durability"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 3
    sync_write: true
    priority: CRITICAL
    # WAL segments are rotated frequently
    max_size_mb: 128
    # Short retention - WAL is for crash recovery
    retention_hours: 24
    # Geo-replicate for disaster recovery
    geo_replicate: true
    geo_replicate_async: false  # Sync for WAL
    geo_targets:
      - datacenter: us-east
        priority: 1
      - datacenter: eu-west
        priority: 2
        
  # ---------------------------------------------------------------------------
  # RocksDB Metadata
  # ---------------------------------------------------------------------------
  
  MANIFEST:
    description: "RocksDB Manifest - describes database state"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 3
    sync_write: true
    priority: CRITICAL
    geo_replicate: true
    # Backup on every change
    backup_on_change: true
    backup_target: cold
    # Keep version history
    version_history: 100
    
  CURRENT:
    description: "RocksDB CURRENT file - points to latest manifest"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 3
    sync_write: true
    priority: CRITICAL
    geo_replicate: true
    backup_on_change: true
    
  OPTIONS:
    description: "RocksDB OPTIONS file - database configuration"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 3
    sync_write: true
    priority: CRITICAL
    geo_replicate: true
    backup_on_change: true
    version_history: 50
    
  # ---------------------------------------------------------------------------
  # Indexes
  # ---------------------------------------------------------------------------
  
  INDEX_VECTOR:
    description: "HNSW Vector index for similarity search"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 2
    priority: HIGH
    # Vector indexes can be rebuilt from source data
    rebuild_on_loss: true
    rebuild_priority: HIGH
    # Large indexes may need striping
    stripe_if_larger_than_mb: 1024
    stripe_size_mb: 256
    
  INDEX_GRAPH:
    description: "Graph adjacency index for traversals"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 2
    priority: HIGH
    rebuild_on_loss: true
    rebuild_priority: HIGH
    
  INDEX_FTS:
    description: "Full-text search index (inverted index)"
    tier: warm
    redundancy_mode: PARITY
    erasure_coding:
      data_shards: 4
      parity_shards: 2
    priority: NORMAL
    rebuild_on_loss: true
    rebuild_priority: NORMAL
    # FTS indexes can get large
    auto_tier_down: true
    tier_down_after_days: 14
    
  INDEX_SPATIAL:
    description: "R-tree spatial index for geo queries"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 2
    priority: HIGH
    rebuild_on_loss: true
    
  # ---------------------------------------------------------------------------
  # Large Binary Objects
  # ---------------------------------------------------------------------------
  
  BLOB_SMALL:
    description: "Small binary objects (<1MB)"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 2
    priority: NORMAL
    max_size_mb: 1
    
  BLOB_MEDIUM:
    description: "Medium binary objects (1MB-100MB)"
    tier: warm
    redundancy_mode: PARITY
    erasure_coding:
      data_shards: 4
      parity_shards: 2
    priority: NORMAL
    min_size_mb: 1
    max_size_mb: 100
    stripe_size_kb: 512
    
  BLOB_LARGE:
    description: "Large binary objects (>100MB)"
    tier: warm
    redundancy_mode: PARITY
    erasure_coding:
      data_shards: 6
      parity_shards: 2
    priority: NORMAL
    min_size_mb: 100
    stripe_size_kb: 1024
    auto_tier_down: true
    tier_down_after_days: 7
    compression: ZSTD
    
  # ---------------------------------------------------------------------------
  # System Metadata
  # ---------------------------------------------------------------------------
  
  METADATA:
    description: "System metadata and configuration"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 3
    sync_write: true
    priority: CRITICAL
    geo_replicate: true
    backup_on_change: true
    version_history: 1000
    
  SCHEMA:
    description: "Collection schemas and validation rules"
    tier: hot
    redundancy_mode: MIRROR
    replication_factor: 3
    sync_write: true
    priority: CRITICAL
    geo_replicate: true
    backup_on_change: true
    version_history: 500

# =============================================================================
# Geo-Replication Settings
# =============================================================================
geo_replication:
  enabled: true
  
  # Local datacenter identifier
  local_datacenter: eu-central
  
  # Remote datacenters
  datacenters:
    eu-central:
      endpoint: "themis-eu-central.example.com:8443"
      priority: 0  # Primary
      
    us-east:
      endpoint: "themis-us-east.example.com:8443"
      priority: 1
      replication_mode: ASYNC
      max_lag_ms: 5000
      
    ap-south:
      endpoint: "themis-ap-south.example.com:8443"
      priority: 2
      replication_mode: ASYNC
      max_lag_ms: 10000
      
  # Conflict resolution
  conflict_resolution: LAST_WRITE_WINS
  
  # Network settings
  connection_pool_size: 10
  request_timeout_ms: 30000
  retry_attempts: 3

# =============================================================================
# Maintenance and Recovery
# =============================================================================
maintenance:
  # Background scrubbing to verify blob integrity
  scrub:
    enabled: true
    interval_hours: 168  # Weekly
    parallelism: 2
    throttle_mbps: 100
    
  # Automatic repair of degraded blobs
  auto_repair:
    enabled: true
    check_interval_seconds: 60
    repair_parallelism: 4
    repair_throttle_mbps: 200
    
  # Tier transitions
  tier_management:
    enabled: true
    check_interval_hours: 1
    transition_parallelism: 2
    transition_throttle_mbps: 500
    
  # Garbage collection for orphaned blobs
  garbage_collection:
    enabled: true
    interval_hours: 24
    dry_run_first: true
    
# =============================================================================
# Monitoring and Alerting
# =============================================================================
monitoring:
  # Prometheus metrics export
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
    
  # Alert thresholds
  alerts:
    degraded_blob_count: 10
    unhealthy_blob_percent: 1.0
    tier_capacity_percent: 90
    replication_lag_ms: 30000
    repair_queue_size: 100

# =============================================================================
# Hot Reload
# =============================================================================
hot_reload:
  enabled: true
  check_interval_seconds: 30
  # Apply changes only to new blobs (safer)
  apply_to_new_blobs_only: false
  # Notify on config changes
  notify_on_change: true
  notify_endpoint: "http://localhost:8080/api/v1/admin/config/changed"
