# Image Processor Configuration
# 
# Extracts EXIF metadata, generates thumbnails, and analyzes images.
# Backend: libvips (recommended), ImageMagick, or Pillow
#
# Version: 1.0

processor:
  name: "Image Processor"
  version: "1.0.0"
  library: "themis_proc_image"
  description: "Extract metadata and generate thumbnails from images"
  
  # Supported MIME types
  mime_types:
    - "image/jpeg"
    - "image/png"
    - "image/gif"
    - "image/webp"
    - "image/tiff"
    - "image/bmp"
    - "image/svg+xml"
    - "image/heic"
    - "image/heif"
    - "image/avif"
    - "image/x-icon"
    - "image/x-raw"
    - "image/x-canon-cr2"
    - "image/x-nikon-nef"
    - "image/x-sony-arw"
  
  # Supported file extensions
  extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"
    - ".tif"
    - ".tiff"
    - ".bmp"
    - ".svg"
    - ".heic"
    - ".heif"
    - ".avif"
    - ".ico"
    - ".raw"
    - ".cr2"
    - ".nef"
    - ".arw"
    - ".dng"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Extract technical metadata
    metadata: true
    
    # Extract EXIF data
    exif: true
    
    # Extract IPTC data
    iptc: true
    
    # Extract XMP data
    xmp: true
    
    # Extract ICC color profile
    icc_profile: true
    
    # Generate thumbnail
    thumbnail: true
    
    # Analyze dominant colors
    dominant_colors: true
    
    # EXIF fields to extract
    exif_fields:
      - camera_make
      - camera_model
      - lens_make
      - lens_model
      - focal_length
      - focal_length_35mm
      - aperture
      - shutter_speed
      - iso
      - exposure_compensation
      - exposure_mode
      - metering_mode
      - flash
      - white_balance
      - gps_latitude
      - gps_longitude
      - gps_altitude
      - gps_timestamp
      - date_taken
      - date_digitized
      - orientation
      - software
      - artist
      - copyright
  
  # ============================================================================
  # Thumbnail Settings
  # ============================================================================
  thumbnails:
    # Thumbnail sizes to generate
    sizes:
      - name: small
        width: 150
        height: 150
        crop: true  # Crop to exact size
        
      - name: medium
        width: 300
        height: 300
        crop: false  # Fit within bounds
        
      - name: large
        width: 800
        height: 800
        crop: false
    
    # Output format (jpeg, png, webp)
    format: webp
    
    # Quality (1-100)
    quality: 85
    
    # Strip metadata from thumbnails
    strip_metadata: true
    
    # Use EXIF orientation
    auto_orient: true
  
  # ============================================================================
  # Color Analysis Settings
  # ============================================================================
  colors:
    # Number of dominant colors to extract
    palette_size: 5
    
    # Algorithm (kmeans, median_cut, octree)
    algorithm: kmeans
    
    # Include color names
    include_names: true
    
    # Color space for analysis (rgb, lab, hsv)
    color_space: lab
  
  # ============================================================================
  # Computer Vision Settings (optional)
  # ============================================================================
  vision:
    # Enable computer vision features
    enabled: false
    
    # Object detection
    object_detection:
      enabled: false
      model: yolov8n  # yolov8n, yolov8s, yolov8m, yolov8l
      confidence_threshold: 0.5
      max_objects: 100
    
    # Face detection
    face_detection:
      enabled: false
      blur_faces: false  # DSGVO compliance
      min_face_size: 30
      model: retinaface
    
    # OCR (text in images)
    ocr:
      enabled: false
      language: deu+eng
      engine: tesseract  # tesseract, paddleocr, easyocr
    
    # NSFW detection
    nsfw_detection:
      enabled: false
      threshold: 0.8
      categories:
        - explicit
        - suggestive
        - violence
    
    # CLIP embeddings for semantic search
    clip_embeddings:
      enabled: false
      model: openai/clip-vit-base-patch32
      normalize: true
  
  # ============================================================================
  # Image Quality Analysis
  # ============================================================================
  quality:
    # Enable quality metrics
    enabled: false
    
    # Blur detection
    blur_detection: true
    
    # Noise estimation
    noise_estimation: false
    
    # Exposure analysis
    exposure_analysis: true
    
    # Resolution classification
    resolution_class: true  # low, medium, high, 4k, etc.
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Maximum image dimensions
    max_width: 50000
    max_height: 50000
    
    # Maximum file size (MB)
    max_file_size_mb: 100
    
    # Maximum decompressed size (MB) - prevents decompression bombs
    max_decompressed_mb: 500
    
    # Strip sensitive EXIF data
    strip_sensitive_exif: false
    sensitive_fields:
      - gps_latitude
      - gps_longitude
      - serial_number
    
    # Scan for steganography
    stego_scan: false
    
    # Malware scan
    malware_scan: true
  
  # ============================================================================
  # Backend Settings
  # ============================================================================
  backend:
    # Backend library (libvips, imagemagick, pillow)
    library: libvips
    
    # Minimum version
    version_min: "8.12"
    
    # Number of threads
    threads: 4
    
    # Memory limit (MB)
    memory_limit_mb: 512
    
    # Cache size (MB)
    cache_size_mb: 100
