# CAD Processor Configuration
# 
# Extracts geometry, metadata, and BOM from CAD files.
# Backend: OpenCASCADE
#
# NOTE: This processor requires OpenCASCADE to be installed.
# Build with -DTHEMIS_ENABLE_CAD=ON
#
# Version: 1.0

processor:
  name: "CAD Processor"
  version: "1.0.0"
  library: "themis_proc_cad"
  description: "Extract geometry and metadata from CAD files"
  
  # Supported MIME types
  mime_types:
    - "application/step"
    - "application/x-step"
    - "model/step"
    - "application/iges"
    - "application/x-iges"
    - "model/iges"
    - "model/stl"
    - "application/sla"
    - "image/vnd.dxf"
    - "application/x-autocad"
    - "model/3mf"
    - "model/obj"
    - "model/gltf+json"
    - "model/gltf-binary"
  
  # Supported file extensions
  extensions:
    - ".step"
    - ".stp"
    - ".iges"
    - ".igs"
    - ".stl"
    - ".dxf"
    - ".dwg"  # Limited support
    - ".3mf"
    - ".obj"
    - ".gltf"
    - ".glb"
    - ".brep"
    - ".sat"
    - ".x_t"
    - ".x_b"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Extract technical metadata
    metadata: true
    
    # Extract geometry summary
    geometry_summary: true
    
    # Extract Bill of Materials
    bom: true
    
    # Extract assembly tree
    assembly_tree: true
    
    # Generate preview/thumbnail
    thumbnail: true
    
    # Geometry details
    geometry:
      bounding_box: true
      volume: true
      surface_area: true
      center_of_mass: true
      part_count: true
      face_count: true
      edge_count: true
      vertex_count: true
  
  # ============================================================================
  # BOM Extraction Settings
  # ============================================================================
  bom:
    # Include part properties
    include_properties: true
    
    # Include materials
    include_materials: true
    
    # Hierarchical structure
    hierarchical: true
    
    # Include quantities
    include_quantities: true
    
    # Custom property names to extract
    custom_properties:
      - part_number
      - description
      - material
      - supplier
      - cost
  
  # ============================================================================
  # Preview/Thumbnail Settings
  # ============================================================================
  preview:
    # Enable preview generation
    enabled: true
    
    # Output format (png, jpeg, webp)
    format: png
    
    # Image size
    width: 800
    height: 600
    
    # View angle
    # - isometric
    # - front
    # - back
    # - top
    # - bottom
    # - left
    # - right
    view: isometric
    
    # Background color
    background: "#ffffff"
    
    # Render quality (low, medium, high)
    quality: medium
    
    # Show edges
    show_edges: true
    
    # Edge color
    edge_color: "#000000"
  
  # ============================================================================
  # Conversion Settings
  # ============================================================================
  conversion:
    # Enable format conversion
    enabled: false
    
    # Output formats
    output_formats:
      - stl
      - obj
      - gltf
      - step
    
    # STL settings
    stl:
      binary: true
      linear_deflection: 0.1
      angular_deflection: 0.5
    
    # GLTF settings
    gltf:
      binary: true  # GLB format
      embed_textures: true
      draco_compression: false
  
  # ============================================================================
  # Validation Settings
  # ============================================================================
  validation:
    # Validate geometry
    enabled: true
    
    # Check for self-intersections
    self_intersection: true
    
    # Check for manifold
    manifold_check: true
    
    # Heal geometry issues
    auto_heal: false
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Maximum file size (MB)
    max_file_size_mb: 500
    
    # Maximum faces
    max_faces: 10000000
    
    # Maximum parts in assembly
    max_parts: 10000
    
    # Processing timeout (seconds)
    timeout_sec: 300
  
  # ============================================================================
  # Backend Settings
  # ============================================================================
  backend:
    # Backend library
    library: opencascade
    
    # Minimum version
    version_min: "7.6"
    
    # Number of threads
    threads: 4
    
    # Memory limit (MB)
    memory_limit_mb: 2048
