# ═══════════════════════════════════════════════════════════
# Testing and Development
# ═══════════════════════════════════════════════════════════
development:
  # Enable debug logging
  debug: false
  
  # Use smaller models for testing
  use_test_models: false
  
  # Test model path
  test_model_path: "/models/phi-2-q4.gguf"
  
  # Disable GPU for CI/testing
  force_cpu: false
