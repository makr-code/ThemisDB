# ThemisDB LLM Plugin Configuration Example
# Version: 1.3.0
#
# This file shows how to configure LLM plugins for ThemisDB
# Based on AI_ECOSYSTEM_SHARDING_ARCHITECTURE.md design

# ═══════════════════════════════════════════════════════════
# Global LLM Settings
# ═══════════════════════════════════════════════════════════
llm:
  # Enable LLM functionality
  enabled: true
  
  # Default plugin to use
  default_plugin: "llamacpp"
  
  # Plugin discovery paths
  plugin_paths:
    - "/usr/local/lib/themis/plugins"
    - "./plugins"
    - "/opt/themis/plugins"
  
  # Auto-load plugins at startup
  auto_load: true

# ═══════════════════════════════════════════════════════════
# llama.cpp Plugin Configuration
# ═══════════════════════════════════════════════════════════
llm_plugins:
  llamacpp:
    # Plugin type
    type: "llama.cpp"
    
    # Enable this plugin
    enabled: true
    
    # Model configuration
    model:
      # Path to GGUF model file
      path: "/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf"
      
      # Auto-load model at startup
      auto_load: true
    
    # GPU acceleration
    gpu:
      # Number of layers to offload to GPU (0 = CPU only)
      n_layers: 32
      
      # Use CUDA if available
      use_cuda: true
      
      # Use Metal (macOS) if available
      use_metal: true
      
      # Use Vulkan if available
      use_vulkan: false
      
      # Maximum VRAM usage in MB (14GB for Mistral-7B Q4)
      max_vram_mb: 14336
      
      # Use CUDA unified memory
      unified_memory: false
    
    # Performance optimizations (v1.3.1+)
    optimizations:
      # Flash Attention: 15-25% faster inference, 30% less memory
      # Requires llama.cpp b2000+ with CUDA support
      use_flash_attn: true
      
      # KV-Cache Reuse: 10-20x faster first-token for repeated prompts
      # Especially beneficial for RAG workloads with consistent system prompts
      use_kv_cache_reuse: true
      
      # Embeddings Extraction: Use LLM as embedding model
      # Extract embeddings for semantic search, RAG, clustering
      enable_embeddings: false  # Disable by default (separate mode)
      
      # Speculative Decoding (Phase 2.1): 2-3x inference speedup
      # Uses smaller draft model to predict tokens, validated by target model
      # Requires compatible draft model (same tokenizer/vocabulary)
      speculative_decoding:
        enabled: false
        draft_model_path: "/models/llama-2-1b-q4.gguf"
        draft_n_gpu_layers: 16
        speculative_tokens: 5
        acceptance_threshold: 0.8
        enable_draft_kv_cache: true
      
      # Continuous Batching (Phase 2.2): 5-10x throughput improvement
      # vLLM-style dynamic batching for multi-tenant scenarios
      # Adds/removes requests dynamically during batch execution
      continuous_batching:
        enabled: false  # Enable for high-throughput scenarios
        max_batch_size: 32  # Max sequences per batch
        max_concurrent_requests: 128  # Max pending requests
        max_tokens_per_batch: 8192  # Total token budget
        scheduler_policy: "priority"  # fifo, priority, sjf (shortest-job-first)
        enable_preemption: true  # Allow pausing low-priority requests
        enable_chunked_prefill: true  # Split large prompts into chunks
        prefill_chunk_size: 512  # Tokens per chunk
      
      # Prefix Cache Configuration
      prefix_cache:
        similarity_threshold: 0.95  # 95% similarity required for cache hit
        max_entries: 1000           # Maximum cached prefixes
        min_prefix_length: 20       # Minimum prefix length to cache (chars)
        ttl_seconds: 7200           # 2 hours TTL
        enable_kv_caching: true     # Precompute KV cache
      
      # Grammar-Constrained Generation (Phase 3.2): Guarantee valid structured output
      # Forces LLM to generate only tokens that conform to EBNF grammar
      # Eliminates parsing errors, no retry logic needed
      grammar_config:
        enabled: false  # Enable for guaranteed structured outputs
        default_grammar: "json"  # Default built-in grammar
        custom_grammars_path: "/grammars/"  # Path to custom EBNF files
        cache_grammars: true  # Cache compiled grammars
        max_cached_grammars: 100  # Maximum grammars to cache
        
        # Built-in grammars available:
        # - json / json_strict: Strict JSON format
        # - json_relaxed: JSON with trailing commas, unquoted keys
        # - xml: Basic XML with elements and attributes
        # - csv: CSV format with quoted/unquoted fields
        # - react_agent: ReAct agent format (thought/action/observation)
    
    # Context and processing
    context:
      # Maximum context length (tokens)
      # For extended context (32K-128K), see config/llm_extended_context.yaml
      n_ctx: 4096
      
      # Batch size for prompt processing
      n_batch: 512
      
      # CPU threads (for layers not on GPU)
      n_threads: 8
      
      # Extended context window configuration (v1.4.0+)
      # For production use of 32K+ context windows with RoPE/YARN scaling
      # See: config/llm_extended_context.yaml for detailed configuration
      extended_context:
        # Enable extended context support
        enabled: false
        
        # Import extended context configuration
        config_file: "config/llm_extended_context.yaml"
        
        # Quick enable with defaults (for testing)
        # When true, uses YaRN scaling to extend context to 32K
        quick_enable: false
    
    # Memory management
    memory:
      # Memory-map model file
      use_mmap: true
      
      # Lock memory (prevent swapping)
      use_mlock: false
    
    # LoRA configuration
    lora:
      # Number of LoRA adapter cache slots
      cache_slots: 8
      
      # VRAM reserved for LoRA cache (MB)
      cache_vram_mb: 512
      
      # Pre-load these LoRA adapters at startup
      preload:
        - id: "legal-qa-v1"
          path: "/loras/legal-qa-v1.bin"
          scale: 1.0
        
        - id: "medical-diagnosis-v1"
          path: "/loras/medical-diagnosis-v1.bin"
          scale: 1.0
    
    # Inference defaults
    inference:
      # Default generation parameters
      max_tokens: 512
      temperature: 0.7
      top_p: 0.9
      top_k: 40
      repetition_penalty: 1.1
      
      # Stop sequences
      stop_sequences:
        - "</s>"
        - "<|endoftext|>"

# ═══════════════════════════════════════════════════════════
# Distributed Sharding Configuration (v1.3.0+)
# See: AI_ECOSYSTEM_SHARDING_ARCHITECTURE.md
# ═══════════════════════════════════════════════════════════
sharding:
  # Enable distributed LLM sharding
  enabled: false
  
  # This shard's configuration
  shard:
    # Unique shard identifier
    id: "shard-1-legal"
    
    # Domain specialization
    domain: "legal"
    
    # URN prefix for routing
    urn_prefix: "urn:themis:document:legal"
  
  # LoRA registry (etcd-based)
  lora_registry:
    # etcd endpoints for coordination
    etcd_endpoints:
      - "http://etcd-1:2379"
      - "http://etcd-2:2379"
      - "http://etcd-3:2379"
    
    # Cluster ID
    cluster_id: "themis-ai-cluster"
  
  # Cross-shard LoRA transfer
  lora_transfer:
    # gRPC port for LoRA transfer service
    grpc_port: 50051
    
    # Enable mTLS for secure transfer
    use_mtls: true
    
    # TLS certificates
    tls:
      cert_path: "/certs/shard-1.crt"
      key_path: "/certs/shard-1.key"
      ca_cert_path: "/certs/ca.crt"
    
    # Transfer chunk size (1 MB)
    chunk_size_bytes: 1048576
  
  # Federated RAG
  federated_rag:
    # Enable cross-shard queries
    enabled: true
    
    # Timeout for remote queries
    timeout_ms: 5000
    
    # Maximum parallel shard queries
    max_parallel_shards: 5

# ═══════════════════════════════════════════════════════════
# RAG (Retrieval-Augmented Generation) Configuration
# ═══════════════════════════════════════════════════════════
rag:
  # Enable RAG
  enabled: true
  
  # Ethical guidelines integration
  ethical_guidelines:
    # Enable ethical context detection during RAG retrieval
    enabled: true
    # Path to ethical guidelines configuration
    config_path: "config/ethical_guidelines.yaml"
    # Check both query and retrieved documents for ethical context
    check_documents: true
  
  # Context assembly
  context:
    # Maximum tokens for context
    max_tokens: 4096
    
    # Number of documents to retrieve (top-k)
    top_k: 10
    
    # Minimum relevance score
    min_relevance: 0.5
  
  # Prompt templates
  templates:
    # Default RAG template (will be augmented if ethical context detected)
    default: |
      Context:
      {context}
      
      Question: {query}
      
      Answer based on the context provided above:

# ═══════════════════════════════════════════════════════════
# Performance and Monitoring
# ═══════════════════════════════════════════════════════════
performance:
  # Enable performance statistics
  enable_stats: true
  
  # Log inference times
  log_inference: true
  
  # Statistics interval (seconds)
  stats_interval: 60
  
  # Enable Prometheus metrics
  prometheus:
    enabled: true
    port: 9090

# ═══════════════════════════════════════════════════════════
