# Extended Benchmark Environment - Large-Scale Multi-Database Setup
# Includes: Specialized databases for fair hybrid search, geo, time-series, and graph comparisons

version: '3.8'

services:
  # ============================================================================
  # EXISTING DATABASES (from fair_benchmark.py)
  # ============================================================================
  
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark123
      POSTGRES_DB: benchmark
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=2GB -c max_connections=200
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: benchmark
      MONGO_INITDB_ROOT_PASSWORD: benchmark123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: mongod --wiredTigerCacheSizeGB 4
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  neo4j:
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: neo4j/benchmark123
      NEO4J_server_memory_heap_max__size: 4G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    environment:
      CLICKHOUSE_USER: benchmark
      CLICKHOUSE_PASSWORD: benchmark123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  weaviate:
    image: semitechnologies/weaviate:1.23.7
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 100
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data:/var/lib/weaviate
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  surrealdb:
    image: surrealdb/surrealdb:latest
    ports:
      - "8000:8000"
    command: start --log trace --user root --pass benchmark123 memory
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  themis:
    image: themisdb/themis:latest
    ports:
      - "8765:8765"  # HTTP REST API
      - "8766:8766"  # Wire Protocol (Native Binary)
    environment:
      THEMIS_LOG_LEVEL: info
      THEMIS_MAX_MEMORY: 8G
    volumes:
      - themis_data:/data
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G

  # ============================================================================
  # NEW DATABASES (for large-scale hybrid search benchmarks)
  # ============================================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 12G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Pinecone is cloud-only (API-based), no local container
  # Use Qdrant as local alternative for vector benchmarks

  druid:
    image: apache/druid:27.0.0
    ports:
      - "8888:8888"  # Router
      - "8081:8081"  # Coordinator
      - "8082:8082"  # Broker
      - "8083:8083"  # Historical
    environment:
      - DRUID_SINGLE_NODE_CONF=micro-quickstart
      - DRUID_LOG4J=<?xml version="1.0" encoding="UTF-8" ?><Configuration><Appenders><Console name="Console" target="SYSTEM_OUT"><PatternLayout pattern="%d{ISO8601} %p [%t] %c - %m%n"/></Console></Appenders><Loggers><Root level="info"><AppenderRef ref="Console"/></Root></Loggers></Configuration>
    volumes:
      - druid_data:/opt/data
      - druid_var:/opt/druid/var
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/status/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  dgraph-zero:
    image: dgraph/dgraph:latest
    volumes:
      - dgraph_zero:/dgraph
    ports:
      - "5080:5080"
      - "6080:6080"
    command: dgraph zero --my=dgraph-zero:5080

  dgraph-alpha:
    image: dgraph/dgraph:latest
    volumes:
      - dgraph_alpha:/dgraph
    ports:
      - "8000:8080"
      - "9080:9080"
    command: dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080 --security whitelist=0.0.0.0/0
    depends_on:
      - dgraph-zero
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  dgraph-ratel:
    image: dgraph/ratel:latest
    ports:
      - "8001:8000"
    depends_on:
      - dgraph-alpha

  redis-stack:
    image: redis/redis-stack:7.2.0-v6
    ports:
      - "6379:6379"   # Redis
      - "8002:8001"   # RedisInsight
    volumes:
      - redis_data:/data
    environment:
      - REDIS_ARGS=--maxmemory 4gb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6G

  # InfluxDB for time-series benchmarks
  influxdb:
    image: influxdb:2.7-alpine
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=benchmark
      - DOCKER_INFLUXDB_INIT_PASSWORD=benchmark123
      - DOCKER_INFLUXDB_INIT_ORG=benchmark
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=benchmark-token-12345
    volumes:
      - influxdb_data:/var/lib/influxdb2
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # TimescaleDB (PostgreSQL extension for time-series)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark123
      POSTGRES_DB: benchmark
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=2GB -c max_connections=200
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # Milvus for advanced vector search benchmarks
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"

  milvus:
    image: milvusdb/milvus:v2.3.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - milvus-etcd
      - milvus-minio
    volumes:
      - milvus_data:/var/lib/milvus
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 12G

  # ============================================================================
  # MONITORING & TOOLS
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=benchmark123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

volumes:
  postgres_data:
  mongodb_data:
  neo4j_data:
  clickhouse_data:
  qdrant_data:
  weaviate_data:
  themis_data:
  elasticsearch_data:
  druid_data:
  druid_var:
  dgraph_zero:
  dgraph_alpha:
  redis_data:
  influxdb_data:
  timescaledb_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
