# ThemisDB Multi-Shard RAID Benchmark Environment
# Supports RAID0, RAID1, RAID5, RAID6, RAID10 configurations
# Configurable shard count: 3, 6, 12, 24

x-themis-base: &themis-base
  image: themisdb/themisdb:${THEMIS_VERSION:-latest}
  restart: unless-stopped
  networks:
    - themis-cluster
  deploy:
    resources:
      limits:
        cpus: '${SHARD_CPU_LIMIT:-8}'
        memory: ${SHARD_MEMORY_LIMIT:-32G}
      reservations:
        cpus: '${SHARD_CPU_RESERVE:-4}'
        memory: ${SHARD_MEMORY_RESERVE:-16G}

x-monitoring-base: &monitoring-base
  networks:
    - themis-cluster
    - monitoring
  restart: unless-stopped

networks:
  themis-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  # RAID volumes (created externally via setup script)
  shard-0-raid:
  shard-1-raid:
  shard-2-raid:
  shard-3-raid:
  shard-4-raid:
  shard-5-raid:

services:
  # ============================================================================
  # SHARD 0 - Primary in Rack 1
  # ============================================================================
  themis-shard-0:
    <<: *themis-base
    container_name: themis-shard-0
    hostname: shard-0
    ports:
      - "8080:8765"
      - "9080:9090"  # Metrics
    volumes:
      - shard-0-raid:/data
      - ../config/config.json:/etc/themis/config.json:ro
      - ../logs/shard-0:/var/log/themis
    environment:
      SHARD_ID: "shard_0"
      SHARD_ROLE: "primary"
      CLUSTER_NAME: "${CLUSTER_NAME:-themis-benchmark}"
      CLUSTER_SIZE: "${NUM_SHARDS:-6}"
      RAID_LEVEL: "${RAID_LEVEL:-RAID10}"
      RACK_ID: "rack_1"
      DATACENTER: "dc_1"
      REGION: "us-west-2"
      SEED_NODES: "shard-0,shard-1,shard-2"
      REPLICATION_FACTOR: "${REPLICATION_FACTOR:-2}"
      CONSISTENCY_LEVEL: "${CONSISTENCY_LEVEL:-QUORUM}"
      ENABLE_METRICS: "true"
      METRICS_PORT: "9090"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # SHARD 1 - Primary in Rack 1
  # ============================================================================
  themis-shard-1:
    <<: *themis-base
    container_name: themis-shard-1
    hostname: shard-1
    ports:
      - "8081:8765"
      - "9081:9090"
    volumes:
      - shard-1-raid:/data
      - ../config/config.json:/etc/themis/config.json:ro
      - ../logs/shard-1:/var/log/themis
    environment:
      SHARD_ID: "shard_1"
      SHARD_ROLE: "primary"
      CLUSTER_NAME: "${CLUSTER_NAME:-themis-benchmark}"
      CLUSTER_SIZE: "${NUM_SHARDS:-6}"
      RAID_LEVEL: "${RAID_LEVEL:-RAID10}"
      RACK_ID: "rack_1"
      DATACENTER: "dc_1"
      REGION: "us-west-2"
      SEED_NODES: "shard-0,shard-1,shard-2"
      REPLICATION_FACTOR: "${REPLICATION_FACTOR:-2}"
      CONSISTENCY_LEVEL: "${CONSISTENCY_LEVEL:-QUORUM}"
      ENABLE_METRICS: "true"
      METRICS_PORT: "9090"
    depends_on:
      themis-shard-0:
        condition: service_healthy

  # ============================================================================
  # SHARD 2 - Primary in Rack 2
  # ============================================================================
  themis-shard-2:
    <<: *themis-base
    container_name: themis-shard-2
    hostname: shard-2
    ports:
      - "8082:8765"
      - "9082:9090"
    volumes:
      - shard-2-raid:/data
      - ../config/config.json:/etc/themis/config.json:ro
      - ../logs/shard-2:/var/log/themis
    environment:
      SHARD_ID: "shard_2"
      SHARD_ROLE: "primary"
      CLUSTER_NAME: "${CLUSTER_NAME:-themis-benchmark}"
      CLUSTER_SIZE: "${NUM_SHARDS:-6}"
      RAID_LEVEL: "${RAID_LEVEL:-RAID10}"
      RACK_ID: "rack_2"
      DATACENTER: "dc_1"
      REGION: "us-west-2"
      SEED_NODES: "shard-0,shard-1,shard-2"
      REPLICATION_FACTOR: "${REPLICATION_FACTOR:-2}"
      CONSISTENCY_LEVEL: "${CONSISTENCY_LEVEL:-QUORUM}"
      ENABLE_METRICS: "true"
      METRICS_PORT: "9090"
    depends_on:
      themis-shard-0:
        condition: service_healthy

  # ============================================================================
  # SHARD 3 - Primary in Rack 2 (if NUM_SHARDS >= 6)
  # ============================================================================
  themis-shard-3:
    <<: *themis-base
    container_name: themis-shard-3
    hostname: shard-3
    ports:
      - "8083:8765"
      - "9083:9090"
    volumes:
      - shard-3-raid:/data
      - ../config/config.json:/etc/themis/config.json:ro
      - ../logs/shard-3:/var/log/themis
    environment:
      SHARD_ID: "shard_3"
      SHARD_ROLE: "primary"
      CLUSTER_NAME: "${CLUSTER_NAME:-themis-benchmark}"
      CLUSTER_SIZE: "${NUM_SHARDS:-6}"
      RAID_LEVEL: "${RAID_LEVEL:-RAID10}"
      RACK_ID: "rack_2"
      DATACENTER: "dc_1"
      REGION: "us-west-2"
      SEED_NODES: "shard-0,shard-1,shard-2"
      REPLICATION_FACTOR: "${REPLICATION_FACTOR:-2}"
      CONSISTENCY_LEVEL: "${CONSISTENCY_LEVEL:-QUORUM}"
      ENABLE_METRICS: "true"
      METRICS_PORT: "9090"
    profiles:
      - 6-shards
      - 12-shards
      - 24-shards
    depends_on:
      themis-shard-0:
        condition: service_healthy

  # ============================================================================
  # SHARD 4 - Primary in Rack 3 (if NUM_SHARDS >= 6)
  # ============================================================================
  themis-shard-4:
    <<: *themis-base
    container_name: themis-shard-4
    hostname: shard-4
    ports:
      - "8084:8765"
      - "9084:9090"
    volumes:
      - shard-4-raid:/data
      - ../config/config.json:/etc/themis/config.json:ro
      - ../logs/shard-4:/var/log/themis
    environment:
      SHARD_ID: "shard_4"
      SHARD_ROLE: "primary"
      CLUSTER_NAME: "${CLUSTER_NAME:-themis-benchmark}"
      CLUSTER_SIZE: "${NUM_SHARDS:-6}"
      RAID_LEVEL: "${RAID_LEVEL:-RAID10}"
      RACK_ID: "rack_3"
      DATACENTER: "dc_1"
      REGION: "us-west-2"
      SEED_NODES: "shard-0,shard-1,shard-2"
      REPLICATION_FACTOR: "${REPLICATION_FACTOR:-2}"
      CONSISTENCY_LEVEL: "${CONSISTENCY_LEVEL:-QUORUM}"
      ENABLE_METRICS: "true"
      METRICS_PORT: "9090"
    profiles:
      - 6-shards
      - 12-shards
      - 24-shards
    depends_on:
      themis-shard-0:
        condition: service_healthy

  # ============================================================================
  # SHARD 5 - Primary in Rack 3 (if NUM_SHARDS >= 6)
  # ============================================================================
  themis-shard-5:
    <<: *themis-base
    container_name: themis-shard-5
    hostname: shard-5
    ports:
      - "8085:8765"
      - "9085:9090"
    volumes:
      - shard-5-raid:/data
      - ../config/config.json:/etc/themis/config.json:ro
      - ../logs/shard-5:/var/log/themis
    environment:
      SHARD_ID: "shard_5"
      SHARD_ROLE: "primary"
      CLUSTER_NAME: "${CLUSTER_NAME:-themis-benchmark}"
      CLUSTER_SIZE: "${NUM_SHARDS:-6}"
      RAID_LEVEL: "${RAID_LEVEL:-RAID10}"
      RACK_ID: "rack_3"
      DATACENTER: "dc_1"
      REGION: "us-west-2"
      SEED_NODES: "shard-0,shard-1,shard-2"
      REPLICATION_FACTOR: "${REPLICATION_FACTOR:-2}"
      CONSISTENCY_LEVEL: "${CONSISTENCY_LEVEL:-QUORUM}"
      ENABLE_METRICS: "true"
      METRICS_PORT: "9090"
    profiles:
      - 6-shards
      - 12-shards
      - 24-shards
    depends_on:
      themis-shard-0:
        condition: service_healthy

  # ============================================================================
  # MONITORING STACK
  # ============================================================================
  
  prometheus:
    <<: *monitoring-base
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  grafana:
    <<: *monitoring-base
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    depends_on:
      - prometheus

  node-exporter:
    <<: *monitoring-base
    image: prom/node-exporter:latest
    container_name: node-exporter
    hostname: node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # ============================================================================
  # BENCHMARK ORCHESTRATOR
  # ============================================================================
  
  benchmark-controller:
    image: python:3.11-slim
    container_name: benchmark-controller
    hostname: benchmark-controller
    networks:
      - themis-cluster
    volumes:
      - ./benchmarks:/benchmarks
      - ./results:/results
      - ./scripts:/scripts:ro
    working_dir: /benchmarks
    environment:
      SCENARIO: "${SCENARIO:-S1}"
      NUM_SHARDS: "${NUM_SHARDS:-6}"
      RAID_LEVEL: "${RAID_LEVEL:-RAID10}"
      WORKLOAD_TYPE: "${WORKLOAD_TYPE:-OLTP}"
      DURATION_HOURS: "${DURATION_HOURS:-4}"
      TARGET_QPS: "${TARGET_QPS:-10000}"
      CONCURRENT_CLIENTS: "${CONCURRENT_CLIENTS:-128}"
      DATA_SIZE_GB: "${DATA_SIZE_GB:-100}"
      SHARD_ENDPOINTS: "${SHARD_ENDPOINTS:-shard-0:8765,shard-1:8765,shard-2:8765,shard-3:8765,shard-4:8765,shard-5:8765}"
    command: >
      bash -c "
        pip install -q aiohttp asyncio pandas matplotlib numpy &&
        python /benchmarks/run_multi_shard_raid_benchmark.py
      "
    depends_on:
      - themis-shard-0
      - themis-shard-1
      - themis-shard-2
    profiles:
      - benchmark

  # ============================================================================
  # DATA LOADER
  # ============================================================================
  
  data-loader:
    image: python:3.11-slim
    container_name: data-loader
    hostname: data-loader
    networks:
      - themis-cluster
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data
    working_dir: /scripts
    environment:
      NUM_SHARDS: "${NUM_SHARDS:-6}"
      DATA_SIZE_GB: "${DATA_SIZE_GB:-100}"
      DOCUMENTS_TOTAL: "${DOCUMENTS_TOTAL:-5000000}"
      SHARD_ENDPOINTS: "${SHARD_ENDPOINTS:-shard-0:8765,shard-1:8765,shard-2:8765,shard-3:8765,shard-4:8765,shard-5:8765}"
      BATCH_SIZE: "${BATCH_SIZE:-1000}"
    command: >
      bash -c "
        pip install -q aiohttp faker numpy &&
        python /scripts/load_test_data.py
      "
    depends_on:
      - themis-shard-0
      - themis-shard-1
      - themis-shard-2
    profiles:
      - data-load
