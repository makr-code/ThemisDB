# ============================================================================
# ThemisDB Docker Compose - Production Configuration
# ============================================================================
# Usage:
#   docker compose up -d                      # Start all services
#   docker compose logs -f themis             # View logs
#   docker compose down                        # Stop services
#   docker compose down -v                     # Stop and remove volumes

services:
  # ==========================================================================
  # ThemisDB Server - COMMUNITY Edition
  # ==========================================================================
  themis:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        THEMIS_EDITION: COMMUNITY
        ENABLE_LLM: "ON"
        ENABLE_GPU: "ON"
        FORCE_CPU_ONLY: "OFF"
        BUILD_TESTS: "OFF"
        BUILD_BENCHMARKS: "OFF"
    image: themisdb:community
    container_name: themisdb
    restart: unless-stopped
    ports:
      - "18080:8080"       # HTTP API
      - "18081:8081"       # gRPC
      - "19090:9090"       # Metrics
    volumes:
      - themis-data:/var/lib/themis/data
      - ./config:/etc/themis/config:ro
      - ./logs:/var/log/themis
    environment:
      - THEMIS_EDITION=COMMUNITY
      - THEMIS_LOG_LEVEL=info
      - THEMIS_DATA_DIR=/var/lib/themis/data
      - THEMIS_CONFIG=/etc/themis/config/config.yaml
      - THEMIS_METRICS_ENABLED=true
      - THEMIS_TRACING_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-fL", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - themis-net
    # Resource limits (adjust based on workload)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ==========================================================================
  # Prometheus - Metrics Collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: themis-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - themis-net
    depends_on:
      - themis

  # ==========================================================================
  # Grafana - Visualization Dashboard
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: themis-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - themis-net
    depends_on:
      - prometheus

# ============================================================================
# Networks
# ============================================================================
networks:
  themis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes (persistent data)
# ============================================================================
volumes:
  themis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
