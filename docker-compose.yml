# ============================================================================
# ThemisDB Docker Compose - Production Configuration
# ============================================================================
# Usage:
#   docker compose up -d                      # Start all services
#   docker compose logs -f themis             # View logs
#   docker compose down                        # Stop services
#   docker compose down -v                     # Stop and remove volumes

services:
  # ==========================================================================
  # ThemisDB Server - COMMUNITY Edition
  # ==========================================================================
  themis:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        THEMIS_EDITION: COMMUNITY
        ENABLE_LLM: "ON"
        ENABLE_GPU: "ON"
        FORCE_CPU_ONLY: "OFF"
        BUILD_TESTS: "OFF"
        BUILD_BENCHMARKS: "OFF"
    image: themisdb:community
    container_name: themisdb
    hostname: themisdb
    restart: unless-stopped
    ports:
      - "18080:8080"       # HTTP REST/AQL API (+ /health, /metrics)
      - "19090:9090"       # Health/error service (/health, /errors)
      # - "50051:50051"    # gRPC: requires THEMIS_WAL_GRPC_ENABLE_MTLS or THEMIS_WAL_GRPC_ALLOW_INSECURE
    volumes:
      - themis-data:/var/lib/themis/data
      - ./logs:/var/log/themis
      # Optional: replace the image default config (docker/config/config.yaml)
      # - ./docker/config/config.yaml:/etc/themis/config.yaml:ro
    environment:
      - THEMIS_EDITION=COMMUNITY
      # Image defaults (shown for clarity; CLI > env > config file > default):
      - THEMIS_CONFIG=/etc/themis/config.yaml
      - THEMIS_DATA_DIR=/var/lib/themis/data
      - THEMIS_PORT=8080
      - THEMIS_HEALTH_BIND_ADDRESS=0.0.0.0
      - THEMIS_HEALTH_PORT=9090
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - themis-net
    # Resource limits (adjust based on workload)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # ==========================================================================
  # Prometheus - Metrics Collection
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: themis-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - themis-net
    depends_on:
      - themis

  # ==========================================================================
  # Grafana - Visualization Dashboard
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: themis-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    networks:
      - themis-net
    depends_on:
      - prometheus

# ============================================================================
# Networks
# ============================================================================
networks:
  themis-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes (persistent data)
# ============================================================================
volumes:
  themis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
