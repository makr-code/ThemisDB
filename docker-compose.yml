version: "3.8"
services:
  themisdb:
    image: themisdb:1.3.0
    container_name: themisdb-server
    ports:
      # Core ports (always available)
      - "8080:8080"     # HTTP/1.1 REST API, GraphQL, HTTP/2 (if enabled)
      - "18765:18765"   # Binary Wire Protocol, gRPC
      - "4318:4318"     # OpenTelemetry/Prometheus metrics (OTLP)
      
      # Optional protocol ports (uncomment when build flags are enabled):
      # - "1883:1883"   # MQTT plain (requires -DTHEMIS_ENABLE_MQTT=ON)
      # - "8883:8883"   # MQTT over TLS (requires -DTHEMIS_ENABLE_MQTT=ON)
      # - "8083:8083"   # MQTT over WebSocket (requires -DTHEMIS_ENABLE_MQTT=ON)
      # - "5432:5432"   # PostgreSQL Wire Protocol (requires -DTHEMIS_ENABLE_POSTGRES_WIRE=ON)
      # - "3000:3000"   # MCP server for LLM integration (requires -DTHEMIS_ENABLE_MCP=ON)
    volumes:
      - themisdb_data:/var/lib/themisdb
      - ./config/config.json:/etc/themis/config.json:ro
    environment:
      THEMIS_PORT: "18765"
      THEMIS_CONFIG_PATH: "/etc/themis/config.json"
      THEMIS_DATA_DIR: "/var/lib/themisdb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

# Named volumes for persistent data (PostgreSQL-style best practice)
volumes:
  themisdb_data:
    driver: local
