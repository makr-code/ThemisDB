openapi: 3.0.3
info:
  title: ThemisDB LoRA Framework API
  description: |
    REST API for managing LoRA (Low-Rank Adaptation) framework in ThemisDB.
    
    This API provides endpoints for:
    - LLM model management
    - LoRA adapter lifecycle (create, read, update, delete)
    - Adapter loading/unloading
    - Inference with LoRA adapters
    - Health monitoring and statistics
    
    All endpoints require JWT Bearer Token authentication via the Authorization header.
  version: 1.3.0
  contact:
    name: ThemisDB Team
    url: https://github.com/makr-code/ThemisDB
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.themisdb.example.com
    description: Production server

security:
  - BearerAuth: []

tags:
  - name: Models
    description: LLM model management
  - name: Adapters
    description: LoRA adapter CRUD operations
  - name: Lifecycle
    description: Adapter loading and unloading
  - name: Inference
    description: Query execution with adapters
  - name: Monitoring
    description: Health checks and statistics

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained through authentication
  
  schemas:
    Error:
      type: object
      required:
        - error
        - status
      properties:
        error:
          type: string
          description: Error message
        details:
          type: string
          description: Detailed error information
        status:
          type: integer
          description: HTTP status code
    
    Model:
      type: object
      required:
        - model_id
      properties:
        model_id:
          type: string
          description: Unique model identifier
        architecture:
          type: string
          description: Model architecture (e.g., llama, gpt)
        parameter_count:
          type: integer
          format: int64
          description: Number of model parameters
        quantization:
          type: string
          description: Quantization format (e.g., Q4_K_M)
        gguf_path:
          type: string
          description: Path to GGUF model file
        description:
          type: string
          description: Model description
        metadata:
          type: object
          additionalProperties: true
          description: Additional model metadata
    
    Adapter:
      type: object
      required:
        - adapter_id
        - base_model
      properties:
        adapter_id:
          type: string
          description: Unique adapter identifier
        base_model:
          type: string
          description: Base model identifier
        version:
          type: string
          description: Adapter version
        task:
          type: string
          description: Task type (e.g., documentation_qa)
        rank:
          type: integer
          description: LoRA rank (r)
          default: 8
        alpha:
          type: number
          format: float
          description: LoRA alpha scaling factor
          default: 16.0
        description:
          type: string
          description: Adapter description
        training_data:
          type: object
          properties:
            dataset_id:
              type: string
            samples:
              type: integer
        status:
          type: string
          enum: [training, ready, stored, failed]
          description: Current adapter status
        is_loaded:
          type: boolean
          description: Whether adapter is loaded in memory
        metadata:
          type: object
          additionalProperties: true
    
    AdapterStatus:
      type: object
      required:
        - adapter_id
        - is_loaded
      properties:
        adapter_id:
          type: string
        is_loaded:
          type: boolean
        memory_usage_mb:
          type: integer
          description: Memory usage in megabytes
        last_used:
          type: string
          format: date-time
    
    QueryRequest:
      type: object
      required:
        - adapter_id
        - prompt
      properties:
        model_id:
          type: string
          description: Base model to use
        adapter_id:
          type: string
          description: LoRA adapter to apply
        prompt:
          type: string
          description: Input prompt
        max_tokens:
          type: integer
          default: 500
          description: Maximum tokens to generate
        temperature:
          type: number
          format: float
          default: 0.7
          description: Sampling temperature
        user_id:
          type: string
          description: User identifier for audit logging
    
    QueryResponse:
      type: object
      required:
        - response
        - adapter_id
      properties:
        response:
          type: string
          description: Generated response
        model_id:
          type: string
        adapter_id:
          type: string
        tokens_used:
          type: integer
        inference_time_ms:
          type: integer
        audit_id:
          type: string
    
    Stats:
      type: object
      properties:
        total_adapters:
          type: integer
        loaded_adapters:
          type: integer
        cache_hit_rate:
          type: number
          format: float
        total_inferences:
          type: integer
        avg_load_time_ms:
          type: integer
        uptime_seconds:
          type: integer
    
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        storage:
          type: string
        manager:
          type: string
        training:
          type: string
        checks_passed:
          type: integer
        checks_failed:
          type: integer

paths:
  /api/v1/llm/models:
    post:
      tags:
        - Models
      summary: Register a new model
      description: Register metadata for a new LLM model
      operationId: registerModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model'
            example:
              model_id: llama-2-7b
              architecture: llama
              parameter_count: 7000000000
              quantization: Q4_K_M
              gguf_path: /models/llama-2-7b-Q4.gguf
              description: Llama 2 7B model with Q4 quantization
      responses:
        '201':
          description: Model registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_id:
                    type: string
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    get:
      tags:
        - Models
      summary: List models
      description: List all registered models with optional filtering
      operationId: listModels
      parameters:
        - name: architecture
          in: query
          schema:
            type: string
          description: Filter by architecture
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
  
  /api/v1/llm/models/{model_id}:
    get:
      tags:
        - Models
      summary: Get model details
      description: Retrieve detailed information about a specific model
      operationId: getModel
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
          description: Model identifier
      responses:
        '200':
          description: Model details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Models
      summary: Delete model
      description: Delete a model and its metadata
      operationId: deleteModel
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Model deleted successfully
        '404':
          description: Model not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/v1/llm/lora/adapters:
    post:
      tags:
        - Adapters
      summary: Create adapter
      description: Create a new LoRA adapter through training
      operationId: createAdapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Adapter'
            example:
              adapter_id: themis_help_lora
              base_model: llama-2-7b
              task: documentation_qa
              rank: 8
              alpha: 16
              training_data:
                dataset_id: docs_v1
                samples: 10000
              description: Documentation Q&A adapter
      responses:
        '201':
          description: Adapter creation initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapter_id:
                    type: string
                  version:
                    type: string
                  status:
                    type: string
                  job_id:
                    type: string
    
    get:
      tags:
        - Adapters
      summary: List adapters
      description: List all adapters with optional filtering
      operationId: listAdapters
      parameters:
        - name: base_model
          in: query
          schema:
            type: string
          description: Filter by base model
        - name: status
          in: query
          schema:
            type: string
            enum: [ready, stored, training]
          description: Filter by status
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of adapters
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Adapter'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
  
  /api/v1/llm/lora/adapters/{adapter_id}:
    get:
      tags:
        - Adapters
      summary: Get adapter
      description: Get detailed information about an adapter
      operationId: getAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adapter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adapter'
        '404':
          description: Adapter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      tags:
        - Adapters
      summary: Update adapter
      description: Update an adapter with additional training data
      operationId: updateAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                additional_training_data:
                  type: object
                  properties:
                    dataset_id:
                      type: string
                    samples:
                      type: integer
      responses:
        '200':
          description: Adapter update initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapter_id:
                    type: string
                  version:
                    type: string
                  status:
                    type: string
                  job_id:
                    type: string
    
    delete:
      tags:
        - Adapters
      summary: Delete adapter
      description: Delete an adapter and optionally all its versions
      operationId: deleteAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          schema:
            type: string
          description: Specific version to delete (omit to delete all versions)
      responses:
        '204':
          description: Adapter deleted successfully
        '404':
          description: Adapter not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/v1/llm/lora/adapters/{adapter_id}/load:
    post:
      tags:
        - Lifecycle
      summary: Load adapter
      description: Load an adapter into memory
      operationId: loadAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adapter loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapter_id:
                    type: string
                  status:
                    type: string
                  load_time_ms:
                    type: integer
  
  /api/v1/llm/lora/adapters/{adapter_id}/unload:
    post:
      tags:
        - Lifecycle
      summary: Unload adapter
      description: Unload an adapter from memory
      operationId: unloadAdapter
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adapter unloaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapter_id:
                    type: string
                  status:
                    type: string
  
  /api/v1/llm/lora/adapters/{adapter_id}/status:
    get:
      tags:
        - Lifecycle
      summary: Get adapter status
      description: Get the current status of an adapter
      operationId: getAdapterStatus
      parameters:
        - name: adapter_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Adapter status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterStatus'
  
  /api/v1/llm/lora/query:
    post:
      tags:
        - Inference
      summary: Query with LoRA
      description: Execute inference using a LoRA adapter
      operationId: queryWithLoRA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            example:
              model_id: llama-2-7b
              adapter_id: themis_help_lora
              prompt: How do I enable sharding in ThemisDB?
              max_tokens: 500
              temperature: 0.7
              user_id: user_42
      responses:
        '200':
          description: Query response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
              example:
                response: To enable sharding in ThemisDB...
                model_id: llama-2-7b
                adapter_id: themis_help_lora
                tokens_used: 145
                inference_time_ms: 850
                audit_id: audit_789
  
  /api/v1/llm/lora/stats:
    get:
      tags:
        - Monitoring
      summary: Get framework statistics
      description: Get statistics about the LoRA framework
      operationId: getStats
      responses:
        '200':
          description: Framework statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
  
  /api/v1/llm/lora/health:
    get:
      tags:
        - Monitoring
      summary: Health check
      description: Check the health of the LoRA framework
      operationId: healthCheck
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: System is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
