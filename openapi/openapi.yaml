components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # ── Cache Admin API schemas ──────────────────────────────────────────────
    CircuitBreakerStatus:
      type: object
      description: Current state of the L3 (RocksDB) circuit breaker.
      required: [state, enabled]
      properties:
        state:
          type: string
          enum: [CLOSED, OPEN, HALF_OPEN]
          description: Circuit breaker state.
          example: CLOSED
        failure_count:
          type: integer
          format: int64
          description: Number of consecutive failures recorded.
          example: 0
        enabled:
          type: boolean
          description: Whether the circuit breaker is configured and active.
          example: true

    CacheHealthResponse:
      type: object
      description: Health status returned by GET /v1/admin/cache/health.
      required: [healthy, warnings, tiers, circuit_breaker]
      properties:
        healthy:
          type: boolean
          description: True when all tiers are operational and the circuit breaker is CLOSED.
          example: true
        warnings:
          type: array
          description: List of active warning messages (e.g. high utilization, low hit rate).
          items:
            type: string
          example: []
        tiers:
          type: object
          description: Per-tier status details.
          properties:
            l1:
              type: object
              description: L1 in-memory LRU tier status.
              required: [status, entries, max_entries, utilization, ttl_seconds]
              properties:
                status:
                  type: string
                  enum: [OK, DEGRADED]
                  example: OK
                entries:
                  type: integer
                  format: int64
                  example: 12
                max_entries:
                  type: integer
                  format: int64
                  example: 1000
                utilization:
                  type: number
                  format: double
                  example: 0.012
                ttl_seconds:
                  type: integer
                  format: int64
                  example: 300
            l2:
              type: object
              description: L2 compressed tier status.
              required: [status, entries, max_entries, utilization, ttl_seconds]
              properties:
                status:
                  type: string
                  enum: [OK, DEGRADED]
                  example: OK
                entries:
                  type: integer
                  format: int64
                  example: 5
                max_entries:
                  type: integer
                  format: int64
                  example: 5000
                utilization:
                  type: number
                  format: double
                  example: 0.001
                ttl_seconds:
                  type: integer
                  format: int64
                  example: 3600
            l3:
              type: object
              description: L3 RocksDB-backed persistent tier status.
              required: [status, enabled, path, ttl_seconds]
              properties:
                status:
                  type: string
                  enum: [OK, DISABLED, UNAVAILABLE]
                  example: OK
                enabled:
                  type: boolean
                  example: true
                path:
                  type: string
                  example: /var/lib/themis/cache_l3
                ttl_seconds:
                  type: integer
                  format: int64
                  example: 86400
        circuit_breaker:
          $ref: '#/components/schemas/CircuitBreakerStatus'

    CacheAdminStatsResponse:
      type: object
      description: Full cache statistics snapshot returned by GET /v1/admin/cache/stats.
      properties:
        stats:
          type: object
          description: Per-tier hit/miss and size counters.
          additionalProperties: true
        health:
          type: object
          description: Health status summary with per-tier status and warnings.
          additionalProperties: true
        tenant_stats:
          type: object
          description: Per-tenant byte usage.
          additionalProperties: true
        circuit_breaker:
          $ref: '#/components/schemas/CircuitBreakerStatus'
        rate_limiter:
          type: object
          properties:
            total_hits:
              type: integer
              format: int64
            throttled:
              type: integer
              format: int64

    CacheEvictKeyResponse:
      type: object
      description: Response after evicting a single cache key.
      required: [evicted, key]
      properties:
        evicted:
          type: integer
          format: int64
          description: Number of cache entries removed across all tiers.
          example: 1
        key:
          type: string
          description: The decoded SHA-256 fingerprint that was evicted.
          example: a1b2c3d4e5f60718293a4b5c6d7e8f9001234567890abcdef1234567890abcd

    CacheEvictTenantResponse:
      type: object
      description: Response after evicting all entries for a tenant.
      required: [evicted, tenant_id]
      properties:
        evicted:
          type: integer
          format: int64
          description: Total number of cache entries removed for the tenant.
          example: 42
        tenant_id:
          type: string
          description: The tenant whose entries were evicted.
          example: acme

    CacheWarmupRequest:
      type: object
      description: Request body for POST /v1/admin/cache/warmup.
      required: [log_path]
      properties:
        log_path:
          type: string
          description: Absolute path to the NDJSON warmup log file on the server.
          example: /var/lib/themis/cache_warmup.ndjson
        max_entries:
          type: integer
          format: int64
          minimum: 0
          description: Maximum number of entries to load (0 = no cap).
          example: 10000

    CacheWarmupResponse:
      type: object
      description: Result of the warmup operation.
      required: [status, entries_loaded, entries_skipped, entries_total, log_path]
      properties:
        status:
          type: string
          example: ok
        entries_loaded:
          type: integer
          format: int64
          description: Number of entries successfully inserted into the cache.
          example: 9850
        entries_skipped:
          type: integer
          format: int64
          description: Number of entries skipped (malformed, expired, or duplicate).
          example: 150
        entries_total:
          type: integer
          format: int64
          description: Total number of lines processed.
          example: 10000
        log_path:
          type: string
          description: Path of the log file that was processed.

    CacheSnapshotRequest:
      type: object
      description: Request body for POST /v1/admin/cache/snapshot.
      required: [out_path]
      properties:
        out_path:
          type: string
          description: Absolute path on the server where the NDJSON snapshot will be written.
          example: /var/lib/themis/cache_snapshot.ndjson

    CacheSnapshotResponse:
      type: object
      description: Result of the snapshot export operation.
      required: [status, entries_exported, out_path]
      properties:
        status:
          type: string
          example: ok
        entries_exported:
          type: integer
          format: int64
          description: Number of non-expired entries written to the snapshot file.
          example: 1234
        out_path:
          type: string
          description: Path of the snapshot file that was written.

    CacheTenantEntry:
      type: object
      description: Cache statistics for a single tenant.
      properties:
        bytes_used:
          type: integer
          format: int64
          description: Total bytes currently occupied in the cache by this tenant.
          example: 10485760
        quota:
          type: integer
          format: int64
          description: Maximum cache bytes allowed for this tenant (0 = global default).
          example: 104857600
        utilization:
          type: number
          format: double
          description: Fraction of quota in use (bytes_used / quota). 0.0 if quota is unset.
          example: 0.1
        hits:
          type: integer
          format: int64
          description: Number of cache hits recorded for this tenant.
          example: 982301
        misses:
          type: integer
          format: int64
          description: Number of cache misses recorded for this tenant.
          example: 12034
        hit_rate:
          type: number
          format: double
          description: Fraction of lookups that resulted in a cache hit (0.0–1.0).
          example: 0.9879
        evictions:
          type: integer
          format: int64
          description: Number of entries evicted (via invalidateTenant or eviction pressure).
          example: 301

    CacheTenantListResponse:
      type: object
      description: Response from GET /v1/admin/cache/tenants.
      required: [enabled, tenants]
      properties:
        enabled:
          type: boolean
          description: Whether per-tenant isolation is active.
          example: true
        tenants:
          type: object
          description: Map of tenant_id to per-tenant cache statistics.
          additionalProperties:
            $ref: '#/components/schemas/CacheTenantEntry'

    CacheTenantStatsResponse:
      type: object
      description: Response from GET /v1/admin/cache/tenant/{tenant_id}/stats.
      required: [found, tenant_id]
      properties:
        found:
          type: boolean
          description: True when the tenant has recorded cache activity.
          example: true
        tenant_id:
          type: string
          description: The queried tenant identifier.
          example: acme
        bytes_used:
          type: integer
          format: int64
          example: 10485760
        quota:
          type: integer
          format: int64
          example: 104857600
        utilization:
          type: number
          format: double
          example: 0.1
        hits:
          type: integer
          format: int64
          example: 982301
        misses:
          type: integer
          format: int64
          example: 12034
        hit_rate:
          type: number
          format: double
          example: 0.9879
        evictions:
          type: integer
          format: int64
          example: 301

    CacheTenantQuotaRequest:
      type: object
      description: Request body for PATCH /v1/admin/cache/tenant/{tenant_id}/quota.
      required: [quota_bytes]
      properties:
        quota_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            New cache size quota in bytes for the tenant.
            Set to 0 to reset to the global default (`per_tenant_max_bytes`).
          example: 52428800

    CacheTenantQuotaResponse:
      type: object
      description: Response after updating a tenant quota.
      required: [status, tenant_id, quota_bytes]
      properties:
        status:
          type: string
          example: ok
        tenant_id:
          type: string
          example: acme
        quota_bytes:
          type: integer
          format: int64
          description: The quota value that was set (0 means reset to global default).
          example: 52428800

    # ── End Cache Admin API schemas ──────────────────────────────────────────
    CreateSessionRequest:
      type: object
      description: Optionaler Anfragekörper beim Erstellen einer Session.
      properties:
        device_fingerprint:
          type: string
          description: Optionaler Gerätefingerabdruck für Anzeigezwecke.
          example: "fp-abc123"
        user_agent:
          type: string
          description: HTTP User-Agent-String des Clients.
          example: "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"
    SessionInfo:
      type: object
      description: Metadaten einer aktiven Session.
      required: [session_id, user_id, created_at, last_accessed_at]
      properties:
        session_id:
          type: string
          description: Eindeutige Session-ID (Prefix "sess_" + 32 Hex-Zeichen).
          example: "sess_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
        user_id:
          type: string
          description: Benutzer-ID des Session-Eigentümers.
          example: "alice"
        device_fingerprint:
          type: string
          description: Gerätefingerabdruck (sofern beim Erstellen angegeben).
          example: "fp-abc123"
        ip_address:
          type: string
          description: Client-IP-Adresse beim Erstellen der Session.
          example: "192.168.1.1"
        user_agent:
          type: string
          description: HTTP User-Agent des Clients beim Erstellen.
          example: "curl/7.88"
        created_at:
          type: string
          format: date-time
          description: Zeitpunkt der Session-Erstellung (ISO 8601, UTC).
          example: "2026-02-24T12:00:00Z"
        last_accessed_at:
          type: string
          format: date-time
          description: Zeitpunkt des letzten Zugriffs (ISO 8601, UTC).
          example: "2026-02-24T12:05:00Z"
        expires_at:
          type: string
          format: date-time
          description: Absolutes Ablaufdatum der Session (optional; fehlt bei unbegrenzter Lebensdauer).
          example: "2026-03-25T12:00:00Z"
        is_current:
          type: boolean
          description: Gibt an, ob dies die aktuell verwendete Session ist (nur in listSessions).
          example: true
    ListSessionsResponse:
      type: object
      description: Liste aktiver Sessions des Benutzers.
      required: [sessions, total]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionInfo'
          description: Aktive Sessions, sortiert nach Erstellungszeit (älteste zuerst).
        total:
          type: integer
          description: Gesamtanzahl aktiver Sessions.
          example: 3
    RevokeSessionResponse:
      type: object
      description: Ergebnis eines Einzel-Session-Widerrufs.
      required: [success, session_id]
      properties:
        success:
          type: boolean
          example: true
        session_id:
          type: string
          description: ID der widerrufenen Session.
          example: "sess_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
    RevokeAllSessionsResponse:
      type: object
      description: Ergebnis eines Massen-Session-Widerrufs.
      required: [success, terminated]
      properties:
        success:
          type: boolean
          example: true
        terminated:
          type: integer
          description: Anzahl der widerrufenen Sessions.
          example: 4
    AsyncJobSubmitRequest:
      type: object
      description: Request body for submitting an async AQL job.
      required: [query]
      properties:
        query:
          type: string
          description: AQL query string to execute asynchronously.
          example: "FOR doc IN large_collection FILTER doc.active == true RETURN doc"
        bind_vars:
          type: object
          description: Bind variables for the AQL query. Accepted for forward compatibility; note that runtime substitution is not yet applied by the background executor.
          additionalProperties: true
    AsyncJobAccepted:
      type: object
      description: Immediate response after job submission.
      required: [job_id, status]
      properties:
        job_id:
          type: string
          description: Unique job identifier; use with GET /v2/jobs/{id} to poll status.
          example: "job-18c3f2a1-0"
        status:
          type: string
          enum: [pending]
          description: Initial status of the submitted job.
          example: "pending"
    AsyncJobRecord:
      type: object
      description: Full record of an async AQL job, including status and results.
      required: [job_id, status, query, created_at, updated_at]
      properties:
        job_id:
          type: string
          description: Unique job identifier.
          example: "job-18c3f2a1-0"
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
          description: Current lifecycle state of the job.
          example: "completed"
        query:
          type: string
          description: The original AQL query string.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp when the job was submitted.
          example: "2026-02-24T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of the last status transition.
          example: "2026-02-24T10:00:01Z"
        result:
          description: AQL query result; present only when status is `completed`.
          type: object
          additionalProperties: true
        error:
          type: string
          description: Error message; present only when status is `failed`.
          example: "AQL parse error at column 5"
    AsyncJobCancelResponse:
      type: object
      description: Response to a DELETE /v2/jobs/{id} cancellation request.
      required: [job_id, status, message]
      properties:
        job_id:
          type: string
          description: The cancelled job ID.
        status:
          type: string
          enum: [pending, running, cancelled]
          description: Job status after the cancellation request was processed.
        message:
          type: string
          example: "Cancellation requested"
    RateLimitError:
      type: object
      properties:
        error: { type: boolean, example: true }
        message: { type: string, example: "Rate limit exceeded" }
        status_code: { type: integer, example: 429 }
      required: [error, message, status_code]
    ContentMeta:
      type: object
      properties:
        id: { type: string }
        mime_type: { type: string }
        category: { type: integer, description: "Enum: TEXT=0, IMAGE=1, AUDIO=2, VIDEO=3, GEO=4, CAD=5, ARCHIVE=6, STRUCTURED=7, BINARY=8, UNKNOWN=9" }
        original_filename: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        modified_at: { type: integer, format: int64 }
        hash_sha256: { type: string }
        text_extracted: { type: boolean }
        chunked: { type: boolean }
        indexed: { type: boolean }
        chunk_count: { type: integer }
        embedding_dim: { type: integer }
        extracted_metadata: { type: object, additionalProperties: true }
        user_metadata: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string }
        parent_id: { type: string }
        child_ids:
          type: array
          items: { type: string }
    ChunkMeta:
      type: object
      properties:
        id: { type: string }
        content_id: { type: string }
        seq_num: { type: integer }
        chunk_type: { type: string }
        text: { type: string }
        data: { type: object, additionalProperties: true }
        blob_ref: { type: string }
        start_offset: { type: integer }
        end_offset: { type: integer }
        embedding:
          type: array
          items: { type: number }
        embedding_indexed: { type: boolean }
        created_at: { type: integer, format: int64 }
    ContentImportRequest:
      type: object
      properties:
        content: { $ref: '#/components/schemas/ContentMeta' }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/ChunkMeta' }
        edges:
          type: array
          items: { type: object, additionalProperties: true }
        blob: { type: string, description: "Roh-Blob als String" }
        blob_base64: { type: string, description: "Base64-kodierter Blob (im MVP nicht automatisch dekodiert)" }
      required: [content]
    ContentImportResponse:
      type: object
      properties:
        status: { type: string }
        content_id: { type: string }
      required: [status, content_id]
    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [healthy] }
        version: { type: string }
        database: { type: string }
        uptime_seconds: { type: integer, format: int64 }
        repair:
          $ref: '#/components/schemas/ShardRepairHealth'
          description: >
            Present only when a ShardRepairEngine is attached to the server.
            Gives an overview of per-shard repair state, engine running status,
            and aggregate repair counters.
      required: [status, version, database, uptime_seconds]
    StatsResponse:
      type: object
      properties:
        server:
          type: object
          properties:
            uptime_seconds: { type: integer, format: int64 }
            total_requests: { type: integer, format: int64 }
            total_errors: { type: integer, format: int64 }
            queries_per_second: { type: number, format: float }
            threads: { type: integer }
          required: [uptime_seconds, total_requests, total_errors, queries_per_second, threads]
        storage:
          type: object
          properties:
            rocksdb:
              type: object
              properties:
                block_cache_usage_bytes: { type: integer, format: int64 }
                block_cache_capacity_bytes: { type: integer, format: int64 }
                estimate_num_keys: { type: integer, format: int64 }
                estimate_live_data_size_bytes: { type: integer, format: int64 }
                estimate_pending_compaction_bytes: { type: integer, format: int64 }
                num_running_compactions: { type: integer }
                num_running_flushes: { type: integer }
                memtable_size_bytes: { type: integer, format: int64 }
                cur_size_all_mem_tables_bytes: { type: integer, format: int64 }
                files_per_level:
                  type: object
                  additionalProperties:
                    type: integer
                block_cache_hit: { type: integer, format: int64 }
                block_cache_miss: { type: integer, format: int64 }
                cache_hit_rate_percent: { type: number }
                bytes_written: { type: integer, format: int64 }
                bytes_read: { type: integer, format: int64 }
                compaction_keys_dropped: { type: integer, format: int64 }
            raw_stats:
              type: string
              description: Vollständige RocksDB-Statistiken im Textformat
      required: [server, storage]
    PutEntityRequest:
      type: object
      description: Upsert einer Entität. Key kann im Body oder in der URL stehen.
      properties:
        key:
          type: string
          description: Key im Format table:pk (optional wenn in URL)
        blob:
          type: string
          description: Beliebiger JSON-String; Server speichert als Binär-Blob
      required: [blob]
    PutEntityResponse:
      type: object
      properties:
        success: { type: boolean }
        key: { type: string }
        blob_size: { type: integer }
      required: [success, key, blob_size]
    GetEntityResponse:
      type: object
      properties:
        key: { type: string }
        blob: { type: string }
      required: [key, blob]
    DeleteEntityResponse:
      type: object
      properties:
        success: { type: boolean }
        key: { type: string }
      required: [success, key]
    IndexRequest:
      type: object
      properties:
        table: { type: string }
        column: { type: string }
        type:
          type: string
          enum: [equality, range, fulltext]
          default: equality
          description: Index-Typ. equality für Gleichheitsfilter, range für gte/lte und ORDER BY, fulltext für Volltextsuche.
        unique:
          type: boolean
          default: false
          description: Nur für Equality-Indizes. Wenn true, wird eine Unique-Constraint erzwungen.
        config:
          type: object
          description: Nur für fulltext-Indizes. Konfiguration der Tokenisierung/Stemming.
          properties:
            stemming_enabled:
              type: boolean
              default: false
              description: Stemming aktivieren
            language:
              type: string
              enum: [en, de, none]
              default: none
              description: Sprache für Stemming
            stopwords_enabled:
              type: boolean
              default: false
              description: Stopwords entfernen (Default-Liste je Sprache)
            stopwords:
              type: array
              description: Optionale benutzerdefinierte Stopword-Liste (Kleinschreibung)
              items:
                type: string
            normalize_umlauts:
              type: boolean
              default: false
              description: 'German: ä→a, ö→o, ü→u, ß→ss before tokenization/stemming'
      required: [table, column]
    IndexResponse:
      type: object
      properties:
        success: { type: boolean }
        table: { type: string }
        column: { type: string }
      required: [success, table, column]
    QueryPredicate:
      type: object
      properties:
        column: { type: string }
        value: { type: string }
      required: [column, value]
    RangePredicate:
      type: object
      description: Range-Prädikat für Spalten mit Range-Index
      properties:
        column: { type: string }
        gte:
          type: string
          description: Untere Grenze (greater than or equal). Optional.
        lte:
          type: string
          description: Obere Grenze (less than or equal). Optional.
        includeLower:
          type: boolean
          default: true
          description: Untere Grenze inklusiv?
        includeUpper:
          type: boolean
          default: true
          description: Obere Grenze inklusiv?
      required: [column]
    OrderBy:
      type: object
      description: Sortierung über Range-Index
      properties:
        column:
          type: string
          description: Spalte zum Sortieren (muss Range-Index haben)
        desc:
          type: boolean
          default: false
          description: Absteigend sortieren?
        limit:
          type: integer
          default: 1000
          description: Maximale Anzahl zurückgegebener Keys
      required: [column]
    QueryRequest:
      type: object
      properties:
        table: { type: string }
        predicates:
          type: array
          items: { $ref: '#/components/schemas/QueryPredicate' }
          description: AND-verknüpfte Gleichheitsfilter
        range:
          type: array
          items: { $ref: '#/components/schemas/RangePredicate' }
          description: AND-verknüpfte Range-Prädikate (optional)
        order_by:
          $ref: '#/components/schemas/OrderBy'
          description: Sortierung über Range-Index (optional)
        optimize:
          type: boolean
          default: true
        allow_full_scan:
          type: boolean
          default: false
        explain:
          type: boolean
          default: false
        return:
          type: string
          enum: [keys, entities]
          default: entities
      required: [table]
    QueryPlan:
      type: object
      properties:
        mode:
          type: string
          description: index_parallel | index_optimized | range_aware | full_scan_fallback
        order:
          type: array
          items: { $ref: '#/components/schemas/QueryPredicate' }
        estimates:
          type: array
          items:
            type: object
            properties:
              column: { type: string }
              value: { type: string }
              estimatedCount: { type: integer }
              capped: { type: boolean }
    QueryKeysResponse:
      type: object
      properties:
        table: { type: string }
        count: { type: integer }
        keys:
          type: array
          items: { type: string }
        plan:
          $ref: '#/components/schemas/QueryPlan'
      required: [table, count, keys]
    QueryEntitiesResponse:
      type: object
      properties:
        table: { type: string }
        count: { type: integer }
        entities:
          type: array
          description: JSON-Strings, jede Entität als serialisiertes JSON
          items: { type: string }
        plan:
          $ref: '#/components/schemas/QueryPlan'
      required: [table, count, entities]
    AqlQueryRequest:
      type: object
      properties:
        query:
          type: string
          description: AQL-Query (FOR/FILTER/SORT/LIMIT/RETURN)
        explain:
          type: boolean
          default: false
        optimize:
          type: boolean
          default: true
        allow_full_scan:
          type: boolean
          default: false
        use_cursor:
          type: boolean
          default: false
          description: Cursor-basierte Pagination aktivieren (ändert Response-Format)
        cursor:
          type: string
          nullable: true
          description: Cursor-Token der vorherigen Seite (nur wenn use_cursor=true)
        max_rows:
          type: integer
          format: int64
          default: 0
          description: |
            Maximum number of result rows to return. 0 means unlimited.
            When exceeded the request fails with HTTP 400 (Bad Request).
        max_memory_bytes:
          type: integer
          format: int64
          default: 0
          description: |
            Maximum serialised JSON size of the result set in bytes. 0 means unlimited.
            When exceeded the request fails with HTTP 400 (Bad Request).
        timeout_ms:
          type: integer
          format: int64
          default: 0
          description: |
            Maximum wall-clock execution time in milliseconds. 0 means unlimited.
            When exceeded the request fails with HTTP 408 (Request Timeout).
      required: [query]
    AqlExplainPlan:
      type: object
      properties:
        mode:
          type: string
          description: index_parallel | index_optimized | range_aware | full_scan_fallback
        order:
          type: array
          items:
            type: object
            properties:
              column: { type: string }
              value: { type: string }
        estimates:
          type: array
          items:
            type: object
            properties:
              column: { type: string }
              value: { type: string }
              estimatedCount: { type: integer }
              capped: { type: boolean }
        let_pre_extracted:
          type: boolean
          description: true, wenn LET-in-FILTER vor der Übersetzung extrahiert wurde
    AqlStandardResponse:
      type: object
      properties:
        table: { type: string }
        count: { type: integer }
        entities:
          type: array
          items: { type: string }
          description: Jede Entität als JSON-String (serialisiert)
        plan: { $ref: '#/components/schemas/AqlExplainPlan' }
        query: { type: string }
        ast:
          type: object
          description: AST der AQL-Query (nur bei explain=true)
      required: [table, count, entities]
    AqlPaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: { type: string }
          description: Seite von Entitäten (serialisierte JSON-Strings)
        batch_size: { type: integer }
        has_more: { type: boolean }
        next_cursor:
          type: string
          description: Cursor-Token für die nächste Seite (falls has_more=true)
        plan: { $ref: '#/components/schemas/AqlExplainPlan' }
        query: { type: string }
        ast:
          type: object
          description: AST der AQL-Query (nur bei explain=true)
      required: [items, batch_size, has_more]
    GraphTraverseRequest:
      type: object
      description: Graph-Traversierung via BFS
      properties:
        start_vertex:
          type: string
          description: Primärschlüssel des Startknotens
        max_depth:
          type: integer
          minimum: 0
          default: 3
          description: Maximale Traversierungstiefe (0 = nur Startknoten)
      required: [start_vertex, max_depth]
    GraphTraverseResponse:
      type: object
      properties:
        start_vertex: { type: string }
        max_depth: { type: integer }
        visited_count: { type: integer }
        visited:
          type: array
          items: { type: string }
          description: Liste der besuchten Knoten in BFS-Reihenfolge
      required: [start_vertex, max_depth, visited_count, visited]
    VectorSearchRequest:
      type: object
      properties:
        vector:
          type: array
          items: { type: number }
          description: Query-Vektor
        k:
          type: integer
          minimum: 1
          default: 10
        use_cursor:
          type: boolean
          default: false
          description: Aktiviert Cursor-Pagination (ändert das Response-Format)
        cursor:
          type: string
          nullable: true
          description: Cursor-Token (Offset) der vorherigen Seite
      required: [vector]
    VectorSearchHit:
      type: object
      properties:
        pk: { type: string }
        distance: { type: number }
    VectorSearchResponseLegacy:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/VectorSearchHit' }
        k: { type: integer }
        count: { type: integer }
      required: [results, k, count]
    VectorSearchPaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VectorSearchHit' }
        batch_size: { type: integer }
        has_more: { type: boolean }
        next_cursor: { type: string }
      required: [items, batch_size, has_more]
    VectorBatchInsertItem:
      type: object
      properties:
        pk: { type: string }
        vector:
          type: array
          items: { type: number }
        fields:
          type: object
          additionalProperties: true
      required: [pk, vector]
    VectorBatchInsertRequest:
      type: object
      properties:
        vector_field:
          type: string
          default: embedding
          description: Feldname des Vektors in der Entity
        items:
          type: array
          items: { $ref: '#/components/schemas/VectorBatchInsertItem' }
      required: [items]
    VectorBatchInsertResponse:
      type: object
      properties:
        inserted: { type: integer }
        errors: { type: integer }
        objectName: { type: string }
        dimension: { type: integer }
      required: [inserted, errors]
    VectorDeleteByFilterRequest:
      type: object
      properties:
        pks:
          type: array
          items: { type: string }
        prefix:
          type: string
      oneOf:
        - required: [pks]
        - required: [prefix]
    VectorDeleteByFilterResponse:
      type: object
      properties:
        deleted: { type: integer }
        method: { type: string, enum: [pks, prefix] }
        prefix: { type: string }
      required: [deleted, method]
    VectorIndexDirRequest:
      type: object
      properties:
        directory: { type: string }
      required: [directory]
    VectorIndexOpResponse:
      type: object
      properties:
        message: { type: string }
        directory: { type: string }
      required: [message, directory]
    VectorIndexConfig:
      type: object
      properties:
        objectName: { type: string }
        dimension: { type: integer }
        metric: { type: string, enum: [L2, COSINE] }
        efSearch: { type: integer }
        M: { type: integer }
        efConstruction: { type: integer }
        hnswEnabled: { type: boolean }
    ErrorResponse:
      type: object
      properties:
        error: { type: boolean }
        message: { type: string }
        status_code: { type: integer }
      required: [error, message, status_code]
    CacheQueryRequest:
      type: object
      properties:
        key: { type: string, description: Eindeutiger Schlüssel }
        prompt: { type: string, description: Freitext für semantische Suche }
        embedding:
          type: array
          items: { type: number }
          description: Vektor für Semantik-Abgleich
        top_k: { type: integer, minimum: 1, default: 1 }
        allow_insert_on_miss: { type: boolean, default: false }
        ttl_sec: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
      anyOf:
        - required: [key]
        - required: [prompt]
        - required: [embedding]
    CacheHit:
      type: object
      properties:
        key: { type: string }
        value: { type: object, additionalProperties: true }
        score: { type: number }
        metadata: { type: object, additionalProperties: true }
    CacheQueryResponse:
      type: object
      properties:
        hit: { type: boolean }
        hits:
          type: array
          items: { $ref: '#/components/schemas/CacheHit' }
          description: Top‑K Ergebnisse bei semantischer Suche
      required: [hit]
    CachePutRequest:
      type: object
      properties:
        key: { type: string }
        value: { type: object, additionalProperties: true }
        embedding:
          type: array
          items: { type: number }
        ttl_sec: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
      required: [key, value]
    CachePutResponse:
      type: object
      properties:
        success: { type: boolean }
        key: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
      required: [success, key]
    CacheStatsResponse:
      type: object
      properties:
        entries: { type: integer, format: int64 }
        hit_ratio_1m: { type: number }
        hit_ratio_1h: { type: number }
        evictions_total: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
      required: [entries]
    LlmMessage:
      type: object
      properties:
        role: { type: string, enum: [user, system, assistant, tool] }
        content: { type: string }
    ReasoningStep:
      type: object
      properties:
        type: { type: string, description: chain_of_thought | tool_plan | scratchpad }
