        '401': { $ref: '#/components/responses/Unauthorized' }

  /transaction/stats:
    get:
      summary: Transaction statistics
      operationId: getTransactionStats
      tags: [transactions]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transaction stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_transactions: { type: integer }
                  committed_total: { type: integer, format: int64 }
                  rolled_back_total: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transaction/version:
    get:
      summary: Get OCC entity version
      operationId: getTransactionEntityVersion
      tags: [transactions]
      description: >
        Returns the current Optimistic Concurrency Control (OCC) version of an
        entity within an active transaction, without acquiring a pessimistic lock.
        Pass the result as `expected_version` in a subsequent `optimistic_put` or
        `optimistic_erase` operation to perform a conditional write.
        Returns version 0 when the entity does not exist yet.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id, table, key]
              properties:
                transaction_id:
                  type: integer
                  format: int64
                  description: Active transaction ID (from /transaction/begin)
                table:
                  type: string
                  description: Table name
                key:
                  type: string
                  description: Primary key of the entity
      responses:
        '200':
          description: Entity version retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id: { type: integer, format: int64 }
                  table:          { type: string }
                  key:            { type: string }
                  version:
                    type: integer
                    format: int64
                    description: Current entity version (0 = entity does not exist)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Transaction not found or already completed
        '410':
          description: Transaction is no longer active

