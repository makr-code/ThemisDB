  /graph/query/incremental:
    post:
      summary: Register an incremental (live) BFS graph query
      description: |
        Registers a BFS query that is re-executed automatically whenever
        `POST /graph/changes` signals topology mutations.  The response
        contains a numeric `handle` that must be used to unregister the
        query later.  The initial BFS result is also returned immediately.
      operationId: registerIncrementalGraphQuery
      tags: [graph]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_vertex, max_depth]
              properties:
                start_vertex:
                  type: string
                  description: Entity key from which to start the BFS
                  example: "user:42"
                max_depth:
                  type: integer
                  minimum: 1
                  description: Maximum traversal depth
                  example: 3
                edge_type:
                  type: string
                  description: Optional edge-type filter (matches the entity type of edge entities)
                max_results:
                  type: integer
                  minimum: 1
                  description: Soft cap on the number of reachable vertices returned
      responses:
        '201':
          description: Incremental query registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  handle:           { type: integer, format: int64, description: Opaque registration handle }
                  initial_results:  { type: array, items: { type: string }, description: Vertices reachable at registration time }
                required: [handle, initial_results]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /graph/query/incremental/{handle}:
    delete:
      summary: Unregister an incremental BFS graph query
      description: |
        Removes the incremental query registration identified by `handle` and
        stops future re-executions.  The handle is the integer returned by
        `POST /graph/query/incremental`.
      operationId: unregisterIncrementalGraphQuery
      tags: [graph]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: handle
          required: true
          schema: { type: integer, format: int64 }
          description: Registration handle returned by POST /graph/query/incremental
      responses:
        '200':
          description: Query unregistered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  handle: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /graph/changes:
    post:
      summary: Notify graph of topology changes
      description: |
        Pushes a batch of graph topology mutations (vertex/edge add/update/remove)
        to the graph optimizer.  All registered incremental BFS queries whose
        result sets are affected by the changes will be re-executed automatically.
      operationId: notifyGraphChanges
      tags: [graph]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  description: Array of graph change events
                  items:
                    type: object
                    required: [type, key]
                    properties:
                      type:
                        type: string
                        enum: [add_vertex, remove_vertex, add_edge, remove_edge, update_edge]
                        description: Kind of topology mutation
                      key:
                        type: string
                        description: Entity key (vertex or edge) affected by this change
                      from:
                        type: string
                        description: Source vertex key (required for edge changes)
                      to:
                        type: string
                        description: Target vertex key (required for edge changes)
      responses:
        '200':
          description: Changes applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  queries_reexecuted: { type: integer, description: Number of incremental queries that were recomputed }
                  changes_applied:    { type: integer, description: Number of change events processed }
                required: [queries_reexecuted, changes_applied]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/graph/metrics:
    get:
      summary: Graph metrics (JSON)
      operationId: getGraphMetrics
      tags: [graph]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Graph metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }

