                $ref: '#/components/schemas/DeleteEntityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /index/create:
    post:
      summary: Sekundärindex erstellen (Equality, Range oder Fulltext)
      operationId: createIndex
      tags: [indexes]
      description: |
        Erstellt einen Index auf einer Spalte. Typen verfügbar:
        - equality: Für Gleichheitsfilter (default). Optional: unique=true für Unique-Constraint.
        - range: Für gte/lte-Prädikate und ORDER BY.
        - fulltext: Invertierter Index für Volltextsuche (BM25). Optional: config.stemming_enabled und config.language ("en", "de", "none"), sowie Stopwords-Konfiguration (config.stopwords_enabled, config.stopwords[] für benutzerdefinierte Liste).
        
        Ein Range-Index kann unabhängig von einem Equality-Index existieren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
            examples:
              equality_index:
                summary: Equality-Index
                value:
                  table: users
                  column: age
                  type: equality
              range_index:
                summary: Range-Index
                value:
                  table: users
                  column: salary
                  type: range
              unique_index:
                summary: Unique Equality-Index
                value:
                  table: users
                  column: email
                  type: equality
                  unique: true
              fulltext_index_de:
                summary: Fulltext-Index mit deutschem Stemming
                value:
                  table: docs
                  column: text
                  type: fulltext
                  config:
                    stemming_enabled: true
                    language: de
              fulltext_index_en_disabled:
                summary: Fulltext-Index ohne Stemming
                value:
                  table: docs
                  column: text
                  type: fulltext
                  config:
                    stemming_enabled: false
                    language: none
              fulltext_index_stopwords_de:
                summary: Fulltext-Index mit Stopwords (DE, Default-Liste)
                value:
                  table: docs
                  column: text
                  type: fulltext
                  config:
                    stemming_enabled: true
                    language: de
                    stopwords_enabled: true
                    normalize_umlauts: true
              fulltext_index_custom_stopwords:
                summary: Fulltext-Index mit benutzerdefinierten Stopwords
                value:
                  table: docs
                  column: text
                  type: fulltext
                  config:
                    stemming_enabled: false
                    language: none
                    stopwords_enabled: true
                    stopwords: ["foo", "bar", "baz"]
      responses:
        '200':
          description: Index erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /index/drop:
    post:
      summary: Sekundärindex löschen
      operationId: dropIndex
      tags: [indexes]
      description: |
        Löscht einen Index. Der Typ (equality oder range) kann angegeben werden, um
        zwischen Equality- und Range-Index auf derselben Spalte zu unterscheiden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
            examples:
              drop_equality:
                summary: Equality-Index löschen
                value:
                  table: users
                  column: age
                  type: equality
              drop_range:
                summary: Range-Index löschen
                value:
                  table: users
                  column: salary
                  type: range
      responses:
        '200':
          description: Index gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /query:
    post:
      summary: Query mit Gleichheits-, Range-Prädikaten und ORDER BY
      operationId: postQuery
      tags: [query]
      description: |
        Führt eine Abfrage mit AND-Gleichheitsprädikaten, Range-Prädikaten (gte/lte) und
        optionaler Sortierung über Range-Indizes aus. Range- und ORDER BY-Features erfordern
        Range-Indizes auf den jeweiligen Spalten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              equality_only:
                summary: Nur Gleichheitsfilter
                value:
                  table: users
                  predicates:
                    - column: age
                      value: "30"
                    - column: city
                      value: Berlin
                  return: keys
              range_and_order:
                summary: Range-Prädikat mit ORDER BY
                value:
                  table: employees
                  predicates:
                    - column: department
                      value: Engineering
                  range:
                    - column: salary
                      gte: "60000"
                      lte: "100000"
                      includeLower: true
                      includeUpper: true
                  order_by:
                    column: salary
                    desc: false
                    limit: 10
                  return: entities
              order_by_only:
                summary: Top-N via ORDER BY ohne weitere Prädikate
                value:
                  table: products
                  order_by:
                    column: price
                    desc: true
                    limit: 5
                  return: keys
      responses:
        '200':
          description: Abfrage erfolgreich
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QueryKeysResponse'
                  - $ref: '#/components/schemas/QueryEntitiesResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '501':
          description: Nicht implementiert (z. B. Graph/Vector Platzhalter)
  /query/aql:
    post:
      summary: AQL Query (FOR/FILTER/SORT/LIMIT/RETURN, LET, einfacher JOIN)
      operationId: postAqlQuery
      tags: [query]
      description: |
        Führt eine AQL-Query aus. Unterstützt relationale Abfragen (FOR/FILTER/SORT/LIMIT/RETURN),
        LET‑Bindings für Projektionen und einfache Equality‑Joins über zwei FOR‑Klauseln.
        Cursor‑basierte Pagination ist über `use_cursor`/`cursor` verfügbar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AqlQueryRequest'
            examples:
              simple:
                summary: Einfache AQL-Abfrage
                value:
                  query: |
                    FOR user IN users
                      FILTER user.city == "Berlin"
                      SORT user.age ASC
                      LIMIT 10
                      RETURN user
              with_cursor:
                summary: Cursor-Pagination
                value:
                  query: 'FOR user IN users SORT user.name ASC LIMIT 10 RETURN user'
                  use_cursor: true
              join_equality:
                summary: Einfacher Equality-Join über zwei FORs
                value:
                  query: |
                    FOR u IN users
                      FOR o IN orders
                      FILTER u._key == o.user_id
                      RETURN u
                  allow_full_scan: true
              let_projection:
                summary: LET-Binding und Objekt-Projektion
                value:
                  query: |
                    FOR u IN users
                      LET c = u.city
                      RETURN { name: u.name, city: c }
                  allow_full_scan: true
      responses:
        '200':
          description: Abfrage erfolgreich
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AqlStandardResponse'
                  - $ref: '#/components/schemas/AqlPaginatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /graph/traverse:
    post:
      summary: Graph-Traversierung (BFS)
      operationId: graphTraverse
      tags: [graph]
      description: |
        Führt eine Breadth-First-Search (BFS) Traversierung ab einem Startknoten aus.
        Graph-Kanten müssen als Entities mit Feldern `id`, `_from`, `_to` gespeichert sein.
        Die Outdex- und Index-Indizes werden automatisch bei PUT/DELETE aktualisiert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphTraverseRequest'
            examples:
              simple_traverse:
                summary: Einfache Traversierung
                value:
                  start_vertex: user1
                  max_depth: 3
      responses:
        '200':
          description: Traversierung erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphTraverseResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vector/search:
    post:
      summary: Vektor-KNN Suche
      operationId: vectorSearch
      tags: [vector]
      description: |
        Führt eine k-NN Suche im Vektorindex aus. Optional Cursor‑Pagination mit `use_cursor` und `cursor`.
        Ohne Cursor werden die Ergebnisse im Legacy-Format zurückgegeben.
      requestBody:
