                  default: false
                  description: >
                    When true, the live index remains readable throughout the rebuild.
                    New entries are written to a shadow prefix and atomically swapped
                    into the live prefix once the scan completes.
                throttle_us:
                  type: integer
                  format: int32
                  minimum: 0
                  default: 0
                  description: >
                    Microseconds to sleep every 100 entities during an online rebuild
                    (0 = no throttling). Only effective when online=true.
      responses:
        '200':
          description: Index rebuilt
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  table: { type: string }
                  column: { type: string }
                  online: { type: boolean }
                  entry_count: { type: integer, format: int64 }
                  estimated_size_bytes: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

