  # ============================================================================
  # MVCC Features: Diff API (Phase 2)
  # ============================================================================
  /api/v1/diff:
    get:
      summary: Compute structured diff between two database states
      operationId: computeDiff
      tags: [diff]
      description: |
        Computes differences between two points in time with categorization into Added/Modified/Deleted.
        Supports diff by sequence numbers, timestamps, or tags.
        Results are cached for 5 minutes for repeated queries.
      parameters:
        - in: query
          name: from
          schema:
            oneOf:
              - type: integer
                description: Start sequence number
              - type: string
                format: date-time
                description: Start timestamp (ISO 8601)
          description: Start point (sequence or timestamp)
        - in: query
          name: to
          schema:
            oneOf:
              - type: integer
                description: End sequence number
              - type: string
                format: date-time
                description: End timestamp (ISO 8601)
          description: End point (sequence or timestamp)
        - in: query
          name: from_tag
          schema:
            type: string
          description: Start tag name (alternative to from)
        - in: query
          name: to_tag
          schema:
            type: string
          description: End tag name (alternative to to)
        - in: query
          name: table
          schema:
            type: string
          description: Filter by table name
        - in: query
          name: key_prefix
          schema:
            type: string
          description: Filter by key prefix
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Maximum changes to return (0 = all)
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Skip first N changes
      responses:
        '200':
          description: Diff result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResult'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalError' }
  
  /api/v1/diff/cache/stats:
    get:
      summary: Get diff cache statistics
      operationId: getDiffCacheStats
      tags: [diff]
      responses:
        '200':
          description: Cache statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  cached_entries:
                    type: integer
                  cache_hit_rate:
                    type: number
                  ttl_seconds:
                    type: integer
        '500': { $ref: '#/components/responses/InternalError' }
  
  /api/v1/diff/cache:
    delete:
      summary: Clear diff cache
      operationId: clearDiffCache
