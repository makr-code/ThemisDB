                $ref: '#/components/schemas/LlmInteractionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: LLM-Interaktionen auflisten
      operationId: listLlmInteractions
      tags: [llm]
