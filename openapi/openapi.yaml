      responses:
        '200':
          description: Statistiken zum Semantic Cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'
        '500': { $ref: '#/components/responses/InternalError' }
  /llm/interaction:
