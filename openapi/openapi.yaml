openapi: 3.1.0
info:
  title: VCCDB HTTP API
  version: 0.1.0
  description: |
    HTTP API für VCC Multi‑Modell‑Datenbank. Beinhaltet Health, CRUD, Indexverwaltung, Query,
    und Observability (/stats, /metrics). Die Query-Engine unterstützt AND-Gleichheitsprädikate,
    Range-Prädikate (gte/lte) und ORDER BY über Range-Indizes. Optional: Fallback Full-Scan.
servers:
  - url: http://localhost:8765
paths:
  /api/audit:
    get:
      summary: Audit-Logs abfragen
      operationId: getAuditLogs
      tags: [audit]
      description: |
        Liefert Audit-Einträge aus der JSONL-Datei `data/logs/audit.jsonl`.
        Filter erfolgen serverseitig (case-insensitive), Sortierung absteigend nach Zeitstempel.
        Unterstützt erweitertes Zeitformat (ISO 8601 mit Zeitzone & Millisekunden) sowie Epoch-Millis.
        Rate-Limiting pro Token/Route (Header `Retry-After`, `X-RateLimit-Limit`, `X-RateLimit-Remaining`).
      security:
        - bearerAuth: [audit:read]
      parameters:
        - in: query
          name: start
          description: Startzeitpunkt (ms seit Epoch oder ISO 8601 YYYY-MM-DDTHH:MM:SS)
          schema: { type: string }
        - in: query
          name: end
          description: Endzeitpunkt (ms seit Epoch oder ISO 8601 YYYY-MM-DDTHH:MM:SS)
          schema: { type: string }
        - in: query
          name: user
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: entity_type
          schema: { type: string }
        - in: query
          name: entity_id
          schema: { type: string }
        - in: query
          name: success
          description: Nur erfolgreiche Einträge
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Trefferliste
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        timestamp: { type: string, description: ISO 8601 UTC }
                        user: { type: string }
                        action: { type: string }
                        entityType: { type: string }
                        entityId: { type: string }
                        oldValue: { type: string, nullable: true }
                        newValue: { type: string, nullable: true }
                        success: { type: boolean }
                        ipAddress: { type: string, nullable: true }
                        sessionId: { type: string, nullable: true }
                        errorMessage: { type: string, nullable: true }
                  totalCount: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  hasMore: { type: boolean }
                required: [entries, totalCount, page, pageSize, hasMore]
        '429':
          description: Zu viele Anfragen (Rate-Limit erreicht)
          headers:
            Retry-After:
              description: Sekunden bis erneuter Versuch empfohlen
              schema: { type: integer, example: 60 }
            X-RateLimit-Limit:
              description: Maximal erlaubte Requests pro Minute
              schema: { type: integer, example: 100 }
            X-RateLimit-Remaining:
              description: Verbleibende Requests im aktuellen Fenster
              schema: { type: integer, example: 0 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/audit/export/csv:
    get:
      summary: Audit-Logs als CSV exportieren
      operationId: exportAuditLogsCsv
      tags: [audit]
      description: |
        Liefert CSV (Header + Zeilen) der gefilterten Audit-Logs. Unterstützt die gleichen Query-Parameter wie `/api/audit`.
        Rate-Limiting analog zu `/api/audit`.
      security:
        - bearerAuth: [audit:read]
      parameters:
        - in: query
          name: start
          schema: { type: string }
        - in: query
          name: end
          schema: { type: string }
        - in: query
          name: user
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: entity_type
          schema: { type: string }
        - in: query
          name: entity_id
          schema: { type: string }
        - in: query
          name: success
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          description: Für Export bis 10.000 erlaubt
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        '200':
          description: CSV-Datei
          content:
            text/csv:
              schema: { type: string }
        '429':
          description: Zu viele Anfragen (Rate-Limit erreicht)
          headers:
            Retry-After:
              description: Sekunden bis erneuter Versuch empfohlen
              schema: { type: integer, example: 60 }
            X-RateLimit-Limit:
              description: Maximal erlaubte Requests pro Minute
              schema: { type: integer, example: 100 }
            X-RateLimit-Remaining:
              description: Verbleibende Requests im aktuellen Fenster
              schema: { type: integer, example: 0 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /pii/reveal/{uuid}:
    get:
      summary: PII Reveal by UUID
      operationId: piiReveal
      tags: [pii]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Originalwert zur pseudonymisierten UUID
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid: { type: string }
                  value: { type: string }
                required: [uuid, value]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /pii/{uuid}:
    delete:
      summary: PII Delete (soft/hard)
      operationId: piiDelete
      tags: [pii]
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [soft, hard]
            default: soft
      responses:
        '200':
          description: Ergebnis des Löschvorgangs
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status: { type: string, enum: [ok, not_found] }
                      mode: { type: string, enum: [soft] }
                      uuid: { type: string }
                      updated: { type: boolean }
                    required: [status, mode, uuid, updated]
                  - type: object
                    properties:
                      status: { type: string, enum: [ok, not_found] }
                      mode: { type: string, enum: [hard] }
                      uuid: { type: string }
                      deleted: { type: boolean }
                    required: [status, mode, uuid, deleted]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      security:
        - bearerAuth: []
  /health:
    get:
      summary: Health Check
      operationId: getHealth
      tags: [system]
      responses:
        '200':
          description: Server ist gesund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /stats:
    get:
      summary: Statistiken (Server + RocksDB)
      operationId: getStats
      tags: [observability]
      responses:
        '200':
          description: Laufzeitmetriken und RocksDB-Statistiken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
  /metrics:
    get:
      summary: Prometheus Metriken
      operationId: getMetrics
      tags: [observability]
      responses:
        '200':
          description: Prometheus Text Exposition Format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP process_uptime_seconds Process uptime in seconds
                  # TYPE process_uptime_seconds gauge
                  process_uptime_seconds 13
                  # HELP vccdb_requests_total Total HTTP requests handled
                  # TYPE vccdb_requests_total counter
                  vccdb_requests_total 1
                  ...
  /auth/sessions:
    post:
      summary: Session erstellen
      operationId: createSession
      tags: [auth]
      description: |
        Erstellt eine neue authentifizierte Session für den aufrufenden Benutzer.
        Die Session-ID wird nur einmal zurückgegeben und dient als Sitzungs-Token.
      security:
        - bearerAuth: [auth:sessions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            examples:
              with_fingerprint:
                summary: Session mit Gerätefingerabdruck
                value:
                  device_fingerprint: "fp-abc123"
                  user_agent: "Mozilla/5.0 ..."
      responses:
        '200':
          description: Session erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: Aktive Sessions auflisten
      operationId: listSessions
      tags: [auth]
      description: |
        Listet alle aktiven (nicht abgelaufenen) Sessions des authentifizierten Benutzers auf.
        Optionaler Query-Parameter `current_session_id` markiert die aktuelle Session.
      security:
        - bearerAuth: [auth:sessions]
      parameters:
        - in: query
          name: current_session_id
          schema: { type: string }
          description: Optional – Session-ID der aktuellen Sitzung (wird in der Ausgabe als `is_current` markiert)
      responses:
        '200':
          description: Liste der aktiven Sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSessionsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      summary: Alle anderen Sessions widerrufen
      operationId: revokeAllOtherSessions
      tags: [auth]
      description: |
        Widerruft alle aktiven Sessions des authentifizierten Benutzers außer der angegebenen
        aktuellen Session ("Logout Everywhere").
      security:
        - bearerAuth: [auth:sessions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                current_session_id:
                  type: string
                  description: Session-ID, die beibehalten werden soll.
                  example: "sess_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      responses:
        '200':
          description: Alle anderen Sessions widerrufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeAllSessionsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/sessions/{session_id}:
    delete:
      summary: Einzelne Session widerrufen
      operationId: revokeSession
      tags: [auth]
      description: |
        Widerruft eine spezifische Session. Ein Benutzer kann nur eigene Sessions widerrufen.
        Admins (Scope `admin:all`) können beliebige Sessions widerrufen.
      security:
        - bearerAuth: [auth:sessions]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
          description: ID der zu widerrufenden Session
          example: "sess_a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      responses:
        '200':
          description: Session erfolgreich widerrufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeSessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/keys:
    post:
      summary: API-Key erstellen
      operationId: createApiKey
      tags: [auth]
      description: |
        Erstellt einen neuen API-Key mit konfigurierbaren Berechtigungen.
        Der Key wird nur einmal zurückgegeben und sollte sicher gespeichert werden.
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            examples:
              basic_key:
                summary: Basis-Key mit Lesezugriff
                value:
                  name: "Analytics Service Key"
                  permissions: ["audit:read", "stats:read"]
                  expires_in_days: 90
              admin_key:
                summary: Admin-Key ohne Ablauf
                value:
                  name: "Admin Key"
                  permissions: ["*"]
                  expires_in_days: null
                  metadata:
                    service: "internal-admin"
                    environment: "production"
      responses:
        '201':
          description: API-Key erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: API-Keys auflisten
      operationId: listApiKeys
      tags: [auth]
      description: |
        Listet alle API-Keys auf (ohne Anzeige des Secret-Werts).
        Zeigt Status, Permissions und Ablaufdatum.
      security:
        - bearerAuth: [admin]
      parameters:
        - in: query
          name: include_revoked
          schema: { type: boolean, default: false }
          description: Auch widerrufene Keys anzeigen
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Liste der API-Keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/keys/{keyId}:
    get:
      summary: API-Key Details abrufen
      operationId: getApiKey
      tags: [auth]
      security:
        - bearerAuth: [admin]
      parameters:
        - in: path
          name: keyId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Key-Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyDetails'
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      summary: API-Key aktualisieren
      operationId: updateApiKey
      tags: [auth]
      description: |
        Aktualisiert Name, Permissions oder Metadata eines API-Keys.
        Der Secret-Wert kann nicht geändert werden.
      security:
        - bearerAuth: [admin]
      parameters:
        - in: path
          name: keyId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyRequest'
      responses:
        '200':
          description: Key aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyDetails'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      summary: API-Key widerrufen
      operationId: revokeApiKey
      tags: [auth]
      description: Widerruft einen API-Key permanent. Diese Aktion kann nicht rückgängig gemacht werden.
      security:
        - bearerAuth: [admin]
      parameters:
        - in: path
          name: keyId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Key widerrufen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  keyId: { type: string }
                  revoked_at: { type: string, format: date-time }
                required: [success, keyId, revoked_at]
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/classify:
    post:
      summary: Datenschutz-Klassifizierung durchführen
      operationId: classifyContent
      tags: [compliance]
      description: |
        Klassifiziert einen Text oder ein Dokument auf personenbezogene Daten (PII).
        Erkennt: E-Mail, Telefon, IBAN, Kreditkarten, Namen, Adressen (DE/EN).
        Nutzt Regex-basierte Erkennung + optionales NLP-Modell.
      security:
        - bearerAuth: [classify:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
            examples:
              text_classification:
                summary: Text klassifizieren
                value:
                  text: "Kontakt: Max Mustermann, max@example.com, +49 123 456789"
                  include_positions: true
              document_classification:
                summary: Dokument-Klassifizierung
                value:
                  document_id: "doc:12345"
                  include_positions: false
      responses:
        '200':
          description: Klassifizierungsergebnis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: Klassifizierungs-Regeln abrufen
      operationId: getClassificationRules
      tags: [compliance]
      description: |
        Gibt die aktuell konfigurierten Klassifizierungs-Regeln zurück.
        Zeigt PII-Kategorien, Regex-Patterns und NLP-Modell-Konfiguration.
      security:
        - bearerAuth: [classify:read]
      responses:
        '200':
          description: Aktuelle Klassifizierungs-Regeln
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRulesResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reports/audit:
    get:
      summary: Audit-Report generieren
      operationId: getAuditReport
      tags: [reports]
      description: |
        Generiert einen aggregierten Audit-Report für einen Zeitraum.
        Enthält Statistiken zu Aktionen, Benutzern, Erfolgsraten und Top-Entities.
      security:
        - bearerAuth: [audit:read, reports:read]
      parameters:
        - in: query
          name: start
          schema: { type: string }
          description: Start-Zeitpunkt (ISO 8601 oder Epoch ms)
        - in: query
          name: end
          schema: { type: string }
          description: End-Zeitpunkt (ISO 8601 oder Epoch ms)
        - in: query
          name: format
          schema: 
            type: string
            enum: [json, csv, pdf]
            default: json
          description: Report-Format
        - in: query
          name: group_by
          schema:
            type: string
            enum: [user, action, entity_type, hour, day]
            default: action
          description: Gruppierung der Statistiken
      responses:
        '200':
          description: Audit-Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditReportResponse'
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reports/compliance:
    get:
      summary: Compliance-Report (DSGVO/Datenschutz)
      operationId: getApiComplianceReport
      tags: [reports]
      description: |
        Generiert einen Compliance-Report gemäß DSGVO/Datenschutz-Anforderungen.
        Zeigt PII-Verarbeitung, Retention-Status, Löschvorgänge und Sicherheitsmetriken.
      security:
        - bearerAuth: [reports:read, audit:read]
      parameters:
        - in: query
          name: start
          schema: { type: string }
        - in: query
          name: end
          schema: { type: string }
        - in: query
          name: format
          schema:
            type: string
            enum: [json, pdf]
            default: json
      responses:
        '200':
          description: Compliance-Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReportResponse'
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reports/retention:
    get:
      summary: Retention Policy Status Report
      operationId: getRetentionReport
      tags: [reports]
      description: |
        Zeigt den Status der Retention Policies für alle Collections/Tables.
        Beinhaltet Statistiken zu automatischen Löschvorgängen und veralteten Daten.
      security:
        - bearerAuth: [reports:read]
      parameters:
        - in: query
          name: include_stats
          schema: { type: boolean, default: true }
          description: Detaillierte Statistiken pro Collection einbeziehen
      responses:
        '200':
          description: Retention-Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionReportResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /content/import:
    post:
      summary: Content importieren (v0 Bulk)
      operationId: contentImport
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentImportRequest'
      responses:
        '200':
          description: Import erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /content/{id}:
    get:
      summary: Content-Metadaten lesen
      operationId: getContent
      tags: [content]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Content-Metadaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentMeta'
        '404': { $ref: '#/components/responses/NotFound' }
  /content/{id}/chunks:
    get:
      summary: Chunks eines Contents auflisten
      operationId: getContentChunks
      tags: [content]
      parameters:
        - in: path
          name: id
          required: true
