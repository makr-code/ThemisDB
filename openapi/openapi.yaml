      required: [keys, total, page, page_size]
    # Classification Schemas
    ClassifyRequest:
      type: object
      properties:
        text:
          type: string
          description: Zu klassifizierender Text
        document_id:
          type: string
          description: ID eines gespeicherten Dokuments (alternativ zu text)
        include_positions:
          type: boolean
          default: false
          description: PII-Positionen im Text zurückgeben
        categories:
          type: array
          items:
            type: string
            enum: [email, phone, iban, credit_card, name, address, all]
          description: Zu erkennende PII-Kategorien (default = all)
      anyOf:
        - required: [text]
        - required: [document_id]
    PiiMatch:
      type: object
      properties:
        category:
          type: string
          enum: [email, phone, iban, credit_card, name, address]
        value: { type: string }
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        start_pos:
          type: integer
          nullable: true
        end_pos:
          type: integer
          nullable: true
      required: [category, value, confidence]
    ClassifyResponse:
      type: object
      properties:
        contains_pii: { type: boolean }
        matches:
          type: array
          items: { $ref: '#/components/schemas/PiiMatch' }
        summary:
          type: object
          properties:
            total_matches: { type: integer }
            categories_found:
              type: array
              items: { type: string }
            risk_level:
              type: string
              enum: [none, low, medium, high]
              description: Datenschutz-Risiko basierend auf PII-Anzahl und -Typ
          required: [total_matches, categories_found, risk_level]
      required: [contains_pii, matches, summary]
    ClassificationRule:
      type: object
      properties:
        category: { type: string }
        pattern: { type: string }
        enabled: { type: boolean }
        confidence: { type: number }
      required: [category, pattern, enabled]
    ClassificationRulesResponse:
      type: object
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/ClassificationRule' }
        nlp_enabled: { type: boolean }
        nlp_model:
          type: string
          nullable: true
        supported_languages:
          type: array
          items: { type: string }
      required: [rules, nlp_enabled]
    # Report Schemas
    AuditReportResponse:
      type: object
      properties:
        period:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
          required: [start, end]
        summary:
          type: object
          properties:
            total_events: { type: integer, format: int64 }
            successful_events: { type: integer, format: int64 }
            failed_events: { type: integer, format: int64 }
            success_rate: { type: number }
            unique_users: { type: integer }
            unique_entities: { type: integer }
          required: [total_events, successful_events, failed_events, success_rate]
        top_actions:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              count: { type: integer }
              success_rate: { type: number }
        top_users:
          type: array
          items:
            type: object
            properties:
              user: { type: string }
              action_count: { type: integer }
              failed_count: { type: integer }
        top_entities:
          type: array
          items:
            type: object
            properties:
              entity_type: { type: string }
              entity_id: { type: string }
              access_count: { type: integer }
        timeline:
          type: array
          items:
            type: object
            properties:
              timestamp: { type: string, format: date-time }
              event_count: { type: integer }
          description: Zeitliche Verteilung der Events (gruppiert nach group_by Parameter)
      required: [period, summary]
    ComplianceReportResponse:
      type: object
      properties:
        period:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
          required: [start, end]
        pii_processing:
          type: object
          properties:
            total_pii_records: { type: integer, format: int64 }
            pii_access_events: { type: integer, format: int64 }
            pii_deletion_events: { type: integer, format: int64 }
            pseudonymization_active: { type: boolean }
            encryption_enabled: { type: boolean }
          required: [total_pii_records, pii_access_events, pii_deletion_events]
        retention:
          type: object
          properties:
            policies_active: { type: integer }
            auto_deletion_enabled: { type: boolean }
            records_deleted_in_period: { type: integer, format: int64 }
        security:
          type: object
          properties:
            failed_auth_attempts: { type: integer }
            unauthorized_access_attempts: { type: integer }
            data_breaches_detected: { type: integer }
        data_subject_rights:
          type: object
          properties:
            access_requests: { type: integer }
            deletion_requests: { type: integer }
            rectification_requests: { type: integer }
            portability_requests: { type: integer }
          description: DSGVO Art. 15-20 Anfragen
        compliance_score:
          type: number
          minimum: 0.0
          maximum: 100.0
          description: Gesamt-Compliance-Score (0-100)
      required: [period, pii_processing, retention, security, compliance_score]
    RetentionPolicyStatus:
      type: object
      properties:
        collection: { type: string }
        retention_days: { type: integer }
        auto_deletion_enabled: { type: boolean }
        last_cleanup: { type: string, format: date-time, nullable: true }
        records_total: { type: integer, format: int64 }
        records_expired: { type: integer, format: int64 }
        oldest_record_age_days: { type: integer }
      required: [collection, retention_days, auto_deletion_enabled, records_total]
    RetentionReportResponse:
      type: object
      properties:
        policies:
          type: array
          items: { $ref: '#/components/schemas/RetentionPolicyStatus' }
        summary:
          type: object
          properties:
            total_collections: { type: integer }
            collections_with_policy: { type: integer }
            total_expired_records: { type: integer, format: int64 }
            auto_deletion_active: { type: boolean }
            last_global_cleanup: { type: string, format: date-time, nullable: true }
          required: [total_collections, collections_with_policy, total_expired_records]
      required: [policies, summary]
    
    # ============================================================================
    # MVCC Features Schemas
    # ============================================================================
    SnapshotTag:
      type: object
      properties:
        tag_name:
          type: string
          example: 'v1.0.0'
        sequence_number:
          type: integer
          format: int64
          example: 12345
        timestamp_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds
          example: 1736657231000
        description:
          type: string
          example: 'Release 1.0 - Initial production release'
        created_by:
          type: string
          example: 'admin'
      required: [tag_name, sequence_number, timestamp_ms, description, created_by]
    
    SnapshotStats:
      type: object
      properties:
        total_snapshots:
          type: integer
          example: 5
        oldest_timestamp_ms:
          type: integer
          format: int64
          example: 1736657231000
        newest_timestamp_ms:
          type: integer
          format: int64
          example: 1736744231000
        oldest_sequence:
          type: integer
          format: int64
          example: 12345
        newest_sequence:
          type: integer
          format: int64
          example: 50000
      required: [total_snapshots, oldest_timestamp_ms, newest_timestamp_ms, oldest_sequence, newest_sequence]
    
    DiffChange:
      type: object
      properties:
        type:
          type: string
          enum: [added, modified, deleted]
          example: 'modified'
        key:
          type: string
          example: 'users:1'
        old_value:
          type: string
          nullable: true
          description: Value before change (for modified/deleted)
        new_value:
          type: string
          nullable: true
          description: Value after change (for added/modified)
        sequence:
          type: integer
          format: int64
          example: 150
        timestamp_ms:
          type: integer
          format: int64
          example: 1736657250000
        metadata:
          type: object
          additionalProperties: true
      required: [type, key, sequence]
    
    DiffStats:
      type: object
      properties:
        added_count:
          type: integer
          example: 5
        modified_count:
          type: integer
          example: 10
        deleted_count:
          type: integer
          example: 2
        total_changes:
          type: integer
          example: 17
      required: [added_count, modified_count, deleted_count, total_changes]
    
    DiffResult:
      type: object
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/DiffChange'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/DiffChange'
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/DiffChange'
        stats:
          $ref: '#/components/schemas/DiffStats'
        from_sequence:
          type: integer
          format: int64
          example: 100
        to_sequence:
          type: integer
          format: int64
          example: 200
        from_timestamp_ms:
          type: integer
          format: int64
          nullable: true
        to_timestamp_ms:
          type: integer
          format: int64
          nullable: true
      required: [added, modified, deleted, stats, from_sequence, to_sequence]
    # ── Geo Topology schemas ──────────────────────────────────────────────────
    GeoShardInfo:
      type: object
      properties:
        shard_id:        { type: string, example: "shard-0" }
        region:          { type: string, example: "us-east" }
        zone:            { type: string, example: "us-east-1a" }
        datacenter:      { type: string, example: "us-east" }
        rack:            { type: string, example: "" }
        is_healthy:      { type: boolean }
        raft_role:       { type: string, example: "leader" }
        raft_term:       { type: integer, format: int64 }
        raft_leader_id:  { type: string }
        raft_has_quorum: { type: boolean }
        primary_endpoint: { type: string, example: "10.0.0.1:7000" }
        capabilities:    { type: array, items: { type: string } }
      required: [shard_id, region, zone, is_healthy]

    GeoShardUpsertRequest:
      type: object
      properties:
        shard_id:        { type: string, example: "shard-6" }
        region:          { type: string, example: "ap-south" }
        zone:            { type: string, example: "ap-south-1a" }
        datacenter:      { type: string }
        rack:            { type: string }
        primary_endpoint: { type: string }
        is_healthy:      { type: boolean }
      required: [shard_id]

    GeoRegionHealth:
      type: object
      properties:
        region:             { type: string, example: "us-east" }
        total_shards:       { type: integer, example: 3 }
        healthy_shards:     { type: integer, example: 3 }
        has_majority_quorum: { type: boolean }
        zones:              { type: array, items: { type: string } }
      required: [region, total_shards, healthy_shards, has_majority_quorum]

    GeoOverallHealth:
      type: object
      properties:
        overall_status:   { type: string, enum: [healthy, partial, degraded] }
        total_shards:     { type: integer }
        healthy_shards:   { type: integer }
        total_regions:    { type: integer }
        healthy_regions:  { type: array, items: { type: string } }
        degraded_regions: { type: array, items: { type: object } }
        failed_regions:   { type: array, items: { type: string } }
      required: [overall_status, total_shards, healthy_shards, total_regions]

    GeoReplicationConfig:
      type: object
      properties:
        collection:              { type: string }
        mode:                    { type: string, example: "geo_mirror" }
        replication_factor:      { type: integer, example: 6 }
        replication_mode:        { type: string, enum: [sync, semi_sync, async] }
        local_region:            { type: string, example: "us-east" }
        max_staleness_ms:        { type: integer, example: 500 }
        prefer_local_reads:      { type: boolean }
        prefer_local_writes:     { type: boolean }
        enable_geo_failover:     { type: boolean }
        region_failure_threshold: { type: number, format: double, example: 0.5 }
        max_lag_ms:              { type: integer, example: 1000 }
        region_write_quorums:
          type: object
          additionalProperties: { type: integer }
          example: { "us-east": 2, "eu-west": 1 }
        region_read_quorums:
          type: object
          additionalProperties: { type: integer }
          example: { "us-east": 1 }
        failed_regions:
          type: array
          items: { type: string }
      required: [collection, replication_factor, replication_mode]

    GeoReplicationConfigUpdate:
      type: object
      description: >
        Partial update for a collection's GEO_MIRROR configuration.
        Only provided fields will be updated.
      properties:
        replication_factor:      { type: integer, example: 6 }
        replication_mode:        { type: string, enum: [sync, semi_sync, async] }
        local_region:            { type: string, example: "us-east" }
        max_staleness_ms:        { type: integer, example: 500 }
        prefer_local_reads:      { type: boolean }
        prefer_local_writes:     { type: boolean }
        enable_geo_failover:     { type: boolean }
        region_failure_threshold: { type: number, format: double, example: 0.5 }
        max_lag_ms:              { type: integer }
        region_write_quorums:
          type: object
          additionalProperties: { type: integer }
        region_read_quorums:
          type: object
          additionalProperties: { type: integer }


    # ──────────────────────────────────────────────────────────────────────────
    # Shard Repair / Anti-Entropy schemas  (v1.5)
    # ──────────────────────────────────────────────────────────────────────────

    RepairJobResponse:
      type: object
      description: Returned after successfully enqueueing a repair or scan job.
      properties:
        job_id:
          type: string
          description: Unique identifier for this repair job.
          example: repair-1708450000000-42
        status:
          type: string
          enum: [queued, running, completed, failed]
          example: queued
        shard_id:
          type: string
          description: Target shard (empty when repairing all shards).
          example: shard_3
      required: [job_id, status]

    RepairJobStatus:
      type: object
      description: Current status of a repair or scan job.
      properties:
        job_id:
          type: string
          example: repair-1708450000000-42
        status:
          type: string
          enum: [queued, running, completed, failed]
          example: completed
        shard_id:
          type: string
          description: Target shard (empty for full-cluster repairs).
          example: shard_3
        document_id:
          type: string
          description: Set only for single-document repair jobs.
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error:
          type: string
          description: Error message when status is "failed".
      required: [job_id, status]

    ShardRepairShardEntry:
      type: object
      description: Per-shard health information as reported by ShardRepairEngine.
      properties:
        shard_id:
          type: string
          example: shard_1
        status:
          type: string
          enum: [healthy, degraded, failed, rebuilding]
          example: healthy
        documents_scanned:
          type: integer
          format: int64
        documents_healthy:
          type: integer
          format: int64
        documents_degraded:
          type: integer
          format: int64
        documents_unrecoverable:
          type: integer
          format: int64
        last_error:
          type: string
          description: Last error message for this shard, if any.
      required: [shard_id, status]

    ShardRepairHealth:
      type: object
      description: >
        Repair engine health section included in GET /health when a
        ShardRepairEngine is attached. Reports aggregate counters and
        per-shard status.
      properties:
        status:
          type: string
          enum: [healthy, degraded, failed]
          description: Overall cluster-level repair health.
          example: healthy
        engine_running:
          type: boolean
          example: true
        total_scans:
          type: integer
          format: int64
        repairs_attempted:
          type: integer
          format: int64
        repairs_successful:
          type: integer
          format: int64
        repairs_failed:
          type: integer
          format: int64
        avg_repair_ms:
          type: integer
          format: int64
          description: Rolling average repair time in milliseconds.
        shards:
          type: array
          items:
            $ref: '#/components/schemas/ShardRepairShardEntry'
      required: [status, engine_running, shards]

    # ── Serverless Function schemas ───────────────────────────────────────────
    ServerlessFunctionCode:
      type: object
      description: |
        JSON DSL code block executed by a serverless function.
        The `operations` array is processed sequentially on the input payload.
      required: [operations]
      properties:
        operations:
          type: array
          description: Ordered list of pipeline operations
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [passthrough, transform, filter, enrich, validate]
                description: Operation kind
              fields:
                type: object
                additionalProperties: { type: string }
                description: "For 'transform': { src_field: dst_field } mapping"
              keep:
                type: array
                items: { type: string }
                description: "For 'filter': list of top-level fields to retain"
              add:
                type: object
                additionalProperties: {}
                description: "For 'enrich': literal key/value pairs to add to the output"
              required:
                type: array
                items: { type: string }
                description: "For 'validate': fields that must be present in the input"

    # ── UDF API schemas ──────────────────────────────────────────────────────
    UdfArgType:
      type: string
      description: Supported argument / return types for AQL user-defined functions.
      enum:
        - ANY
        - STRING
        - NUMBER
        - INTEGER
        - BOOLEAN
        - ARRAY
        - OBJECT
        - GEOMETRY
        - VECTOR
        - DOCUMENT
        - NULLABLE

    UdfArgSpec:
      type: object
      description: Specification of a single argument accepted by a UDF.
      properties:
        name:
          type: string
          description: Parameter name (informational)
          example: "input"
        type:
          $ref: '#/components/schemas/UdfArgType'
        required:
          type: boolean
          default: true
          description: Whether the argument must be supplied by callers
        description:
          type: string
          description: Human-readable parameter description

    UdfBodyExpr:
      type: object
      description: |
        A single node in the UDF body expression DSL.  The `"type"` field
        selects the node kind; additional fields depend on the kind:

        | type    | required extra fields            |
        |---------|----------------------------------|
        | `const` | `value`                          |
        | `arg`   | `index`                          |
        | `call`  | `function`; optional `args`      |
        | `op`    | `op`, `left`, `right`            |
        | `if`    | `cond`, `then`, `else`           |
      required: [type]
      properties:
        type:
          type: string
          enum: [const, arg, call, op, if]
          description: Expression node kind
        value:
          description: "(`const` nodes) The literal JSON value to return"
        index:
          type: integer
          minimum: 0
          description: "(`arg` nodes) Zero-based argument index"
        function:
          type: string
          description: "(`call` nodes) Name of the built-in or UDF to invoke"
        args:
          type: array
          items:
            $ref: '#/components/schemas/UdfBodyExpr'
          description: "(`call` nodes) Evaluated arguments passed to the function"
        op:
          type: string
          enum: ["+", "-", "*", "/", "%", "==", "!=", "<", "<=", ">", ">=", "&&", "||"]
          description: "(`op` nodes) Binary operator"
        left:
          $ref: '#/components/schemas/UdfBodyExpr'
        right:
          $ref: '#/components/schemas/UdfBodyExpr'
        cond:
          $ref: '#/components/schemas/UdfBodyExpr'
        then:
          $ref: '#/components/schemas/UdfBodyExpr'
        else:
          $ref: '#/components/schemas/UdfBodyExpr'

    UdfCreate:
      type: object
      description: Request body for registering or replacing an AQL user-defined function.
      required: [name, body]
      properties:
        name:
          type: string
          description: |
            Unique function name (UPPER_CASE recommended).  Must not conflict
            with any existing built-in AQL function.
          example: "MY_UPPER"
        description:
          type: string
          description: Human-readable description of what the function does
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/UdfArgSpec'
          description: Ordered list of argument specifications
          default: []
        return_type:
          $ref: '#/components/schemas/UdfArgType'
        is_deterministic:
          type: boolean
          default: true
          description: |
            `true` if the function always returns the same output for the same
            input (enables query-plan caching optimisations)
        body:
          $ref: '#/components/schemas/UdfBodyExpr'

    UdfDefinition:
      allOf:
        - $ref: '#/components/schemas/UdfCreate'
        - type: object
          required: [created_at, updated_at]
          properties:
            created_at:
              type: string
              format: date-time
              description: ISO-8601 UTC timestamp of initial registration
            updated_at:
              type: string
              format: date-time
              description: ISO-8601 UTC timestamp of last update

    ServerlessFunctionCreate:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
          description: Human-readable function name (must be non-empty)
          example: "normalize-address"
        description:
          type: string
          description: Optional free-text description
        tenant_id:
          type: string
          description: Owning tenant identifier (empty = global)
        timeout_ms:
          type: integer
          minimum: 1
          default: 5000
          description: Maximum execution time in milliseconds
        memory_limit_kb:
          type: integer
          minimum: 1
          default: 4096
          description: Soft memory cap for tracked allocations (KB)
        code:
          $ref: '#/components/schemas/ServerlessFunctionCode'

    ServerlessFunction:
      allOf:
        - $ref: '#/components/schemas/ServerlessFunctionCreate'
        - type: object
          required: [id, version, created_at, updated_at]
          properties:
            id:
              type: string
              description: Unique function identifier assigned by the server
              example: "fn-3a9c7b12"
            version:
              type: integer
              minimum: 1
              description: Monotonically increasing version counter
            created_at:
              type: string
              format: date-time
              description: ISO-8601 creation timestamp (UTC)
            updated_at:
              type: string
              format: date-time
              description: ISO-8601 last-update timestamp (UTC)

  responses:
    BadRequest:
      description: Ungültige Anforderung
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Nicht autorisiert
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: Authentifizierungsschema und Realm
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Verboten (fehlende Berechtigung)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service not available (component not initialized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Interner Serverfehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'