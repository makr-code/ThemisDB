  /transaction:
    post:
      summary: Execute atomic transaction operations
      operationId: executeTransaction
      tags: [transactions]
      description: >
        Execute one or more operations atomically within a single transaction.
        Supported operation types: `put`, `delete`, `optimistic_put`, `optimistic_erase`.
        Use `optimistic_put` / `optimistic_erase` for Optimistic Concurrency Control (OCC) –
        the operation only succeeds when the stored entity version matches `expected_version`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                isolation:
                  type: string
                  enum: [read_committed, snapshot, serializable]
                  default: read_committed
                operations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [type, table, key]
                    properties:
                      type:
                        type: string
                        enum: [put, delete, optimistic_put, optimistic_erase]
                      table:    { type: string }
                      key:      { type: string }
                      data:
                        type: object
                        description: Entity fields (required for put / optimistic_put)
                      expected_version:
                        type: integer
                        format: int64
                        description: >
                          Required for optimistic_put and optimistic_erase.
                          The operation fails with an OCC conflict error when the
                          stored version differs from this value.
      responses:
        '200':
          description: Transaction committed
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id: { type: integer, format: int64 }
                  status: { type: string, enum: [committed] }
                  applied: { type: integer }
                  errors:  { type: array }
        '409':
          description: Transaction rolled back due to operation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id: { type: integer, format: int64 }
                  status: { type: string, enum: [rolled_back] }
                  applied: { type: integer }
                  errors:  { type: array }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transaction/begin:
    post:
      summary: Begin transaction
      operationId: beginTransaction
      tags: [transactions]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isolation:
                  type: string
                  enum: [read_committed, snapshot, serializable]
                  default: read_committed
                  description: Isolation level for the transaction
      responses:
        '200':
          description: Transaction started
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id: { type: integer, format: int64 }
                  isolation: { type: string }
                  status: { type: string, enum: [active] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transaction/commit:
    post:
      summary: Commit transaction
      operationId: commitTransaction
      tags: [transactions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                txn_id: { type: string }
              required: [txn_id]
      responses:
        '200':
          description: Transaction committed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  txn_id: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transaction/rollback:
    post:
      summary: Rollback transaction
      operationId: rollbackTransaction
      tags: [transactions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
