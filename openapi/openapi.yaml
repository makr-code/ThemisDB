openapi: 3.1.0
info:
  title: VCCDB HTTP API
  version: 0.1.0
  description: |
    HTTP API für VCC Multi‑Modell‑Datenbank. Beinhaltet Health, CRUD, Indexverwaltung, Query,
    und Observability (/stats, /metrics). Die Query-Engine unterstützt AND-Gleichheitsprädikate,
    Range-Prädikate (gte/lte) und ORDER BY über Range-Indizes. Optional: Fallback Full-Scan.
servers:
  - url: http://localhost:8765
paths:
  /api/audit:
    get:
      summary: Audit-Logs abfragen
      operationId: getAuditLogs
      tags: [audit]
      description: |
        Liefert Audit-Einträge aus der JSONL-Datei `data/logs/audit.jsonl`.
        Filter erfolgen serverseitig (case-insensitive), Sortierung absteigend nach Zeitstempel.
        Unterstützt erweitertes Zeitformat (ISO 8601 mit Zeitzone & Millisekunden) sowie Epoch-Millis.
        Rate-Limiting pro Token/Route (Header `Retry-After`, `X-RateLimit-Limit`, `X-RateLimit-Remaining`).
      security:
        - bearerAuth: [audit:read]
      parameters:
        - in: query
          name: start
          description: Startzeitpunkt (ms seit Epoch oder ISO 8601 YYYY-MM-DDTHH:MM:SS)
          schema: { type: string }
        - in: query
          name: end
          description: Endzeitpunkt (ms seit Epoch oder ISO 8601 YYYY-MM-DDTHH:MM:SS)
          schema: { type: string }
        - in: query
          name: user
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: entity_type
          schema: { type: string }
        - in: query
          name: entity_id
          schema: { type: string }
        - in: query
          name: success
          description: Nur erfolgreiche Einträge
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Trefferliste
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        timestamp: { type: string, description: ISO 8601 UTC }
                        user: { type: string }
                        action: { type: string }
                        entityType: { type: string }
                        entityId: { type: string }
                        oldValue: { type: string, nullable: true }
                        newValue: { type: string, nullable: true }
                        success: { type: boolean }
                        ipAddress: { type: string, nullable: true }
                        sessionId: { type: string, nullable: true }
                        errorMessage: { type: string, nullable: true }
                  totalCount: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  hasMore: { type: boolean }
                required: [entries, totalCount, page, pageSize, hasMore]
        '429':
          description: Zu viele Anfragen (Rate-Limit erreicht)
          headers:
            Retry-After:
              description: Sekunden bis erneuter Versuch empfohlen
              schema: { type: integer, example: 60 }
            X-RateLimit-Limit:
              description: Maximal erlaubte Requests pro Minute
              schema: { type: integer, example: 100 }
            X-RateLimit-Remaining:
              description: Verbleibende Requests im aktuellen Fenster
              schema: { type: integer, example: 0 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/audit/export/csv:
    get:
      summary: Audit-Logs als CSV exportieren
      operationId: exportAuditLogsCsv
      tags: [audit]
      description: |
        Liefert CSV (Header + Zeilen) der gefilterten Audit-Logs. Unterstützt die gleichen Query-Parameter wie `/api/audit`.
        Rate-Limiting analog zu `/api/audit`.
      security:
        - bearerAuth: [audit:read]
      parameters:
        - in: query
          name: start
          schema: { type: string }
        - in: query
          name: end
          schema: { type: string }
        - in: query
          name: user
          schema: { type: string }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: entity_type
          schema: { type: string }
        - in: query
          name: entity_id
          schema: { type: string }
        - in: query
          name: success
          schema: { type: boolean, default: false }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          description: Für Export bis 10.000 erlaubt
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        '200':
          description: CSV-Datei
          content:
            text/csv:
              schema: { type: string }
        '429':
          description: Zu viele Anfragen (Rate-Limit erreicht)
          headers:
            Retry-After:
              description: Sekunden bis erneuter Versuch empfohlen
              schema: { type: integer, example: 60 }
            X-RateLimit-Limit:
              description: Maximal erlaubte Requests pro Minute
              schema: { type: integer, example: 100 }
            X-RateLimit-Remaining:
              description: Verbleibende Requests im aktuellen Fenster
              schema: { type: integer, example: 0 }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /pii/reveal/{uuid}:
  /pii/{uuid}:
    delete:
      summary: PII Delete (soft/hard)
      operationId: piiDelete
      tags: [pii]
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [soft, hard]
            default: soft
      responses:
        '200':
          description: Ergebnis des Löschvorgangs
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      status: { type: string, enum: [ok, not_found] }
                      mode: { type: string, enum: [soft] }
                      uuid: { type: string }
                      updated: { type: boolean }
                    required: [status, mode, uuid, updated]
                  - type: object
                    properties:
                      status: { type: string, enum: [ok, not_found] }
                      mode: { type: string, enum: [hard] }
                      uuid: { type: string }
                      deleted: { type: boolean }
                    required: [status, mode, uuid, deleted]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      security:
        - bearerAuth: []
    get:
      summary: PII Reveal by UUID
      operationId: piiReveal
      tags: [pii]
      parameters:
        - in: path
          name: uuid
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Originalwert zur pseudonymisierten UUID
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid: { type: string }
                  value: { type: string }
                required: [uuid, value]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      security:
        - bearerAuth: []
  /health:
    get:
      summary: Health Check
      operationId: getHealth
      tags: [system]
      responses:
        '200':
          description: Server ist gesund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /stats:
    get:
      summary: Statistiken (Server + RocksDB)
      operationId: getStats
      tags: [observability]
      responses:
        '200':
          description: Laufzeitmetriken und RocksDB-Statistiken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
  /metrics:
    get:
      summary: Prometheus Metriken
      operationId: getMetrics
      tags: [observability]
      responses:
        '200':
          description: Prometheus Text Exposition Format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP process_uptime_seconds Process uptime in seconds
                  # TYPE process_uptime_seconds gauge
                  process_uptime_seconds 13
                  # HELP vccdb_requests_total Total HTTP requests handled
                  # TYPE vccdb_requests_total counter
                  vccdb_requests_total 1
                  ...
  /api/keys:
    post:
      summary: API-Key erstellen
      operationId: createApiKey
      tags: [auth]
      description: |
        Erstellt einen neuen API-Key mit konfigurierbaren Berechtigungen.
        Der Key wird nur einmal zurückgegeben und sollte sicher gespeichert werden.
      security:
        - bearerAuth: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            examples:
              basic_key:
                summary: Basis-Key mit Lesezugriff
                value:
                  name: "Analytics Service Key"
                  permissions: ["audit:read", "stats:read"]
                  expires_in_days: 90
              admin_key:
                summary: Admin-Key ohne Ablauf
                value:
                  name: "Admin Key"
                  permissions: ["*"]
                  expires_in_days: null
                  metadata:
                    service: "internal-admin"
                    environment: "production"
      responses:
        '201':
          description: API-Key erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: API-Keys auflisten
      operationId: listApiKeys
      tags: [auth]
      description: |
        Listet alle API-Keys auf (ohne Anzeige des Secret-Werts).
        Zeigt Status, Permissions und Ablaufdatum.
      security:
        - bearerAuth: [admin]
      parameters:
        - in: query
          name: include_revoked
          schema: { type: boolean, default: false }
          description: Auch widerrufene Keys anzeigen
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Liste der API-Keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/keys/{keyId}:
    get:
      summary: API-Key Details abrufen
      operationId: getApiKey
      tags: [auth]
      security:
        - bearerAuth: [admin]
      parameters:
        - in: path
          name: keyId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Key-Details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyDetails'
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      summary: API-Key aktualisieren
      operationId: updateApiKey
      tags: [auth]
      description: |
        Aktualisiert Name, Permissions oder Metadata eines API-Keys.
        Der Secret-Wert kann nicht geändert werden.
      security:
        - bearerAuth: [admin]
      parameters:
        - in: path
          name: keyId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApiKeyRequest'
      responses:
        '200':
          description: Key aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyDetails'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      summary: API-Key widerrufen
      operationId: revokeApiKey
      tags: [auth]
      description: Widerruft einen API-Key permanent. Diese Aktion kann nicht rückgängig gemacht werden.
      security:
        - bearerAuth: [admin]
      parameters:
        - in: path
          name: keyId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Key widerrufen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  keyId: { type: string }
                  revoked_at: { type: string, format: date-time }
                required: [success, keyId, revoked_at]
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/classify:
    post:
      summary: Datenschutz-Klassifizierung durchführen
      operationId: classifyContent
      tags: [compliance]
      description: |
        Klassifiziert einen Text oder ein Dokument auf personenbezogene Daten (PII).
        Erkennt: E-Mail, Telefon, IBAN, Kreditkarten, Namen, Adressen (DE/EN).
        Nutzt Regex-basierte Erkennung + optionales NLP-Modell.
      security:
        - bearerAuth: [classify:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
            examples:
              text_classification:
                summary: Text klassifizieren
                value:
                  text: "Kontakt: Max Mustermann, max@example.com, +49 123 456789"
                  include_positions: true
              document_classification:
                summary: Dokument-Klassifizierung
                value:
                  document_id: "doc:12345"
                  include_positions: false
      responses:
        '200':
          description: Klassifizierungsergebnis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: Klassifizierungs-Regeln abrufen
      operationId: getClassificationRules
      tags: [compliance]
      description: |
        Gibt die aktuell konfigurierten Klassifizierungs-Regeln zurück.
        Zeigt PII-Kategorien, Regex-Patterns und NLP-Modell-Konfiguration.
      security:
        - bearerAuth: [classify:read]
      responses:
        '200':
          description: Aktuelle Klassifizierungs-Regeln
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationRulesResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reports/audit:
    get:
      summary: Audit-Report generieren
      operationId: getAuditReport
      tags: [reports]
      description: |
        Generiert einen aggregierten Audit-Report für einen Zeitraum.
        Enthält Statistiken zu Aktionen, Benutzern, Erfolgsraten und Top-Entities.
      security:
        - bearerAuth: [audit:read, reports:read]
      parameters:
        - in: query
          name: start
          schema: { type: string }
          description: Start-Zeitpunkt (ISO 8601 oder Epoch ms)
        - in: query
          name: end
          schema: { type: string }
          description: End-Zeitpunkt (ISO 8601 oder Epoch ms)
        - in: query
          name: format
          schema: 
            type: string
            enum: [json, csv, pdf]
            default: json
          description: Report-Format
        - in: query
          name: group_by
          schema:
            type: string
            enum: [user, action, entity_type, hour, day]
            default: action
          description: Gruppierung der Statistiken
      responses:
        '200':
          description: Audit-Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditReportResponse'
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reports/compliance:
    get:
      summary: Compliance-Report (DSGVO/Datenschutz)
      operationId: getComplianceReport
      tags: [reports]
      description: |
        Generiert einen Compliance-Report gemäß DSGVO/Datenschutz-Anforderungen.
        Zeigt PII-Verarbeitung, Retention-Status, Löschvorgänge und Sicherheitsmetriken.
      security:
        - bearerAuth: [reports:read, audit:read]
      parameters:
        - in: query
          name: start
          schema: { type: string }
        - in: query
          name: end
          schema: { type: string }
        - in: query
          name: format
          schema:
            type: string
            enum: [json, pdf]
            default: json
      responses:
        '200':
          description: Compliance-Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceReportResponse'
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/reports/retention:
    get:
      summary: Retention Policy Status Report
      operationId: getRetentionReport
      tags: [reports]
      description: |
        Zeigt den Status der Retention Policies für alle Collections/Tables.
        Beinhaltet Statistiken zu automatischen Löschvorgängen und veralteten Daten.
      security:
        - bearerAuth: [reports:read]
      parameters:
        - in: query
          name: include_stats
          schema: { type: boolean, default: true }
          description: Detaillierte Statistiken pro Collection einbeziehen
      responses:
        '200':
          description: Retention-Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionReportResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /content/import:
    post:
      summary: Content importieren (v0 Bulk)
      operationId: contentImport
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentImportRequest'
      responses:
        '200':
          description: Import erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /content/{id}:
    get:
      summary: Content-Metadaten lesen
      operationId: getContent
      tags: [content]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Content-Metadaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentMeta'
        '404': { $ref: '#/components/responses/NotFound' }
  /content/{id}/chunks:
    get:
      summary: Chunks eines Contents auflisten
      operationId: getContentChunks
      tags: [content]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Liste der Chunks
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  chunks:
                    type: array
                    items: { $ref: '#/components/schemas/ChunkMeta' }
                required: [count, chunks]
        '404': { $ref: '#/components/responses/NotFound' }
  /content/{id}/blob:
    get:
      summary: Original-Blob eines Contents abrufen
      operationId: getContentBlob
      tags: [content]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Raw Blob (Content-Type aus Metadaten)
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404': { $ref: '#/components/responses/NotFound' }
  /cache/query:
    post:
      summary: Semantic Cache Lookup
      operationId: cacheQuery
      tags: [cache]
      description: |
        Führt eine semantische Cache-Abfrage aus. Optional mit Embedding zur Ähnlichkeitssuche.
        Falls kein Treffer vorliegt und `allow_insert_on_miss=true` gesetzt ist, kann der Eintrag direkt (mit optionalem TTL) hinterlegt werden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheQueryRequest'
            examples:
              simple_query:
                value:
                  key: "rag:question:hash123"
                  top_k: 1
              semantic_query:
                value:
                  prompt: "Wie skaliere ich HNSW efSearch?"
                  embedding: [0.01, 0.12, 0.0]
                  top_k: 3
      responses:
        '200':
          description: Ergebnis der Cache-Abfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheQueryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /cache/put:
    post:
      summary: Semantic Cache Put
      operationId: cachePut
      tags: [cache]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CachePutRequest'
            examples:
              put_example:
                value:
                  key: "rag:question:hash123"
                  value: { answer: "Nutze ef_search 64–128 für Latenz/Qualität." }
                  embedding: [0.01, 0.12, 0.0]
                  ttl_sec: 3600
                  metadata: { model: "gpt-4o", topic: "vecsearch" }
      responses:
        '200':
          description: Eintrag erstellt/aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CachePutResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /cache/stats:
    get:
      summary: Semantic Cache Statistiken
      operationId: cacheStats
      tags: [cache]
      responses:
        '200':
          description: Statistiken zum Semantic Cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'
        '500': { $ref: '#/components/responses/InternalError' }
  /llm/interaction:
    post:
      summary: LLM-Interaktion speichern
      operationId: createLlmInteraction
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmInteractionRequest'
            examples:
              basic:
                value:
                  model: "gpt-4o"
                  messages:
                    - role: user
                      content: "Erkläre MVCC kurz"
                  reasoning_steps:
                    - type: chain_of_thought
                      content: ["MVCC erlaubt paralleles Lesen/Schreiben", "Versionen pro Tx"]
                  metadata: { session_id: "abc" }
      responses:
        '201':
          description: Interaktion angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmInteractionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: LLM-Interaktionen auflisten
      operationId: listLlmInteractions
      tags: [llm]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 50 }
        - in: query
          name: after
          schema: { type: string, description: Cursor/ID für Pagination }
      responses:
        '200':
          description: Liste von Interaktionen
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LlmInteraction' }
                  next:
                    type: string
                    nullable: true
                required: [items]
  /llm/interaction/{id}:
    get:
      summary: LLM-Interaktion lesen
      operationId: getLlmInteraction
      tags: [llm]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Interaktion gefunden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmInteraction' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /changefeed:
    get:
      summary: Change Data Capture (CDC) Feed (Long‑Polling)
      operationId: getChangefeed
      tags: [cdc]
      description: |
        Liefert Änderungen ab einer Sequenznummer. Unterstützt optionales Long‑Polling.
        Für Streaming siehe `/changefeed/stream` (SSE).
      parameters:
        - in: query
          name: from_seq
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, default: 100 }
        - in: query
          name: long_poll_ms
          schema: { type: integer, minimum: 0, maximum: 60000, default: 0 }
      responses:
        '200':
          description: Änderungen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangefeedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /changefeed/stream:
    get:
      summary: Change Data Capture (CDC) Stream (SSE)
      operationId: getChangefeedStream
      tags: [cdc]
      description: |
        Streamt Änderungen in Server‑Sent Events (SSE) Format. Jedes Event hat `data:` Zeile mit JSON.
        Unterstützt Keep‑Alive Streaming mit optionalen Heartbeats.
      parameters:
        - in: query
          name: from_seq
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - in: query
          name: key_prefix
          schema: { type: string }
          description: Filtert Events nach Key‑Präfix (z.B. `user:`)
        - in: query
          name: keep_alive
          schema: { type: boolean, default: true }
          description: Verbindung offen halten und neue Events fortlaufend senden
        - in: query
          name: max_seconds
          schema: { type: integer, minimum: 1, maximum: 60, default: 30 }
          description: Maximale Stream‑Dauer (Test/CI hilfreich)
        - in: query
          name: heartbeat_ms
          schema: { type: integer, minimum: 100, maximum: 60000 }
          description: Optionaler Heartbeat‑Override in Millisekunden (nur Test/Dev)
      responses:
        '200':
          description: SSE Stream mit Change Events
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE Format: `data: {json}\n\n` pro Event, Heartbeat als Kommentar `: heartbeat\n\n`.
                  JSON Struktur: `{operation, key, sequence, ...}`.
                example: |
                  data: {"operation":"PUT","key":"doc:1","sequence":42,"old_val":null,"new_val":"{\"x\":1}"}

                  data: {"operation":"DELETE","key":"doc:2","sequence":43,"old_val":"{\"y\":2}","new_val":null}
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /entities:
    post:
      summary: Entity anlegen/ersetzen (Upsert)
      operationId: postEntity
      tags: [entities]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutEntityRequest'
      responses:
        '201':
          description: Entity erstellt/aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutEntityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /entities/{key}:
    get:
      summary: Entity lesen
      operationId: getEntity
      tags: [entities]
      parameters:
        - name: key
          in: path
          required: true
          description: Key im Format table:pk
          schema: { type: string }
      responses:
        '200':
          description: Entity gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEntityResponse'
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      summary: Entity anlegen/ersetzen (Upsert) mit Key in der URL
      operationId: putEntity
      tags: [entities]
      parameters:
        - name: key
          in: path
          required: true
          description: Key im Format table:pk
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                blob:
                  type: string
                  description: Beliebiger JSON-Inhalt als String. Server speichert binär.
              required: [blob]
      responses:
        '201':
          description: Entity erstellt/aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutEntityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      summary: Entity löschen
      operationId: deleteEntity
      tags: [entities]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Entity gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEntityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /index/create:
    post:
      summary: Sekundärindex erstellen (Equality, Range oder Fulltext)
      operationId: createIndex
      tags: [indexes]
      description: |
        Erstellt einen Index auf einer Spalte. Typen verfügbar:
        - equality: Für Gleichheitsfilter (default). Optional: unique=true für Unique-Constraint.
        - range: Für gte/lte-Prädikate und ORDER BY.
        - fulltext: Invertierter Index für Volltextsuche (BM25). Optional: config.stemming_enabled und config.language ("en", "de", "none"), sowie Stopwords-Konfiguration (config.stopwords_enabled, config.stopwords[] für benutzerdefinierte Liste).
        
        Ein Range-Index kann unabhängig von einem Equality-Index existieren.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
            examples:
              equality_index:
                summary: Equality-Index
                value:
                  table: users
                  column: age
                  type: equality
              range_index:
                summary: Range-Index
                value:
                  table: users
                  column: salary
                  type: range
              unique_index:
                summary: Unique Equality-Index
                value:
                  table: users
                  column: email
                  type: equality
                  unique: true
              fulltext_index_de:
                summary: Fulltext-Index mit deutschem Stemming
                value:
                  table: docs
                  column: text
                  type: fulltext
                  config:
                    stemming_enabled: true
                    language: de
              fulltext_index_en_disabled:
                summary: Fulltext-Index ohne Stemming
                value:
                  table: docs
                  column: text
                  type: fulltext
                  config:
                    stemming_enabled: false
                    language: none
              fulltext_index_stopwords_de:
                summary: Fulltext-Index mit Stopwords (DE, Default-Liste)
                value:
                  table: docs
                  column: text
                  type: fulltext
                  config:
                    stemming_enabled: true
                    language: de
                    stopwords_enabled: true
                    normalize_umlauts: true
              fulltext_index_custom_stopwords:
                summary: Fulltext-Index mit benutzerdefinierten Stopwords
                value:
                  table: docs
                  column: text
                  type: fulltext
                  config:
                    stemming_enabled: false
                    language: none
                    stopwords_enabled: true
                    stopwords: ["foo", "bar", "baz"]
      responses:
        '200':
          description: Index erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /index/drop:
    post:
      summary: Sekundärindex löschen
      operationId: dropIndex
      tags: [indexes]
      description: |
        Löscht einen Index. Der Typ (equality oder range) kann angegeben werden, um
        zwischen Equality- und Range-Index auf derselben Spalte zu unterscheiden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndexRequest'
            examples:
              drop_equality:
                summary: Equality-Index löschen
                value:
                  table: users
                  column: age
                  type: equality
              drop_range:
                summary: Range-Index löschen
                value:
                  table: users
                  column: salary
                  type: range
      responses:
        '200':
          description: Index gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /query:
    post:
      summary: Query mit Gleichheits-, Range-Prädikaten und ORDER BY
      operationId: postQuery
      tags: [query]
      description: |
        Führt eine Abfrage mit AND-Gleichheitsprädikaten, Range-Prädikaten (gte/lte) und
        optionaler Sortierung über Range-Indizes aus. Range- und ORDER BY-Features erfordern
        Range-Indizes auf den jeweiligen Spalten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
            examples:
              equality_only:
                summary: Nur Gleichheitsfilter
                value:
                  table: users
                  predicates:
                    - column: age
                      value: "30"
                    - column: city
                      value: Berlin
                  return: keys
              range_and_order:
                summary: Range-Prädikat mit ORDER BY
                value:
                  table: employees
                  predicates:
                    - column: department
                      value: Engineering
                  range:
                    - column: salary
                      gte: "60000"
                      lte: "100000"
                      includeLower: true
                      includeUpper: true
                  order_by:
                    column: salary
                    desc: false
                    limit: 10
                  return: entities
              order_by_only:
                summary: Top-N via ORDER BY ohne weitere Prädikate
                value:
                  table: products
                  order_by:
                    column: price
                    desc: true
                    limit: 5
                  return: keys
      responses:
        '200':
          description: Abfrage erfolgreich
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QueryKeysResponse'
                  - $ref: '#/components/schemas/QueryEntitiesResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '501':
          description: Nicht implementiert (z. B. Graph/Vector Platzhalter)
  /query/aql:
    post:
      summary: AQL Query (FOR/FILTER/SORT/LIMIT/RETURN, LET, einfacher JOIN)
      operationId: postAqlQuery
      tags: [query]
      description: |
        Führt eine AQL-Query aus. Unterstützt relationale Abfragen (FOR/FILTER/SORT/LIMIT/RETURN),
        LET‑Bindings für Projektionen und einfache Equality‑Joins über zwei FOR‑Klauseln.
        Cursor‑basierte Pagination ist über `use_cursor`/`cursor` verfügbar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AqlQueryRequest'
            examples:
              simple:
                summary: Einfache AQL-Abfrage
                value:
                  query: |
                    FOR user IN users
                      FILTER user.city == "Berlin"
                      SORT user.age ASC
                      LIMIT 10
                      RETURN user
              with_cursor:
                summary: Cursor-Pagination
                value:
                  query: 'FOR user IN users SORT user.name ASC LIMIT 10 RETURN user'
                  use_cursor: true
              join_equality:
                summary: Einfacher Equality-Join über zwei FORs
                value:
                  query: |
                    FOR u IN users
                      FOR o IN orders
                      FILTER u._key == o.user_id
                      RETURN u
                  allow_full_scan: true
              let_projection:
                summary: LET-Binding und Objekt-Projektion
                value:
                  query: |
                    FOR u IN users
                      LET c = u.city
                      RETURN { name: u.name, city: c }
                  allow_full_scan: true
      responses:
        '200':
          description: Abfrage erfolgreich
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AqlStandardResponse'
                  - $ref: '#/components/schemas/AqlPaginatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /graph/traverse:
    post:
      summary: Graph-Traversierung (BFS)
      operationId: graphTraverse
      tags: [graph]
      description: |
        Führt eine Breadth-First-Search (BFS) Traversierung ab einem Startknoten aus.
        Graph-Kanten müssen als Entities mit Feldern `id`, `_from`, `_to` gespeichert sein.
        Die Outdex- und Index-Indizes werden automatisch bei PUT/DELETE aktualisiert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphTraverseRequest'
            examples:
              simple_traverse:
                summary: Einfache Traversierung
                value:
                  start_vertex: user1
                  max_depth: 3
      responses:
        '200':
          description: Traversierung erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphTraverseResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vector/search:
    post:
      summary: Vektor-KNN Suche
      operationId: vectorSearch
      tags: [vector]
      description: |
        Führt eine k-NN Suche im Vektorindex aus. Optional Cursor‑Pagination mit `use_cursor` und `cursor`.
        Ohne Cursor werden die Ergebnisse im Legacy-Format zurückgegeben.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorSearchRequest'
      responses:
        '200':
          description: Suchergebnisse
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VectorSearchResponseLegacy'
                  - $ref: '#/components/schemas/VectorSearchPaginatedResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vector/batch_insert:
    post:
      summary: Vektoren im Batch einfügen
      operationId: vectorBatchInsert
      tags: [vector]
      description: |
        Fügt mehrere Vektor-Entities in den aktuellen Vektorindex ein. Das Feld mit dem Vektor
        kann über `vector_field` angegeben werden (Default `embedding`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorBatchInsertRequest'
      responses:
        '200':
          description: Batch-Ergebnis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorBatchInsertResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vector/by-filter:
    delete:
      summary: Vektoren per Filter löschen (PKs oder Prefix)
      operationId: vectorDeleteByFilter
      tags: [vector]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorDeleteByFilterRequest'
      responses:
        '200':
          description: Anzahl gelöschter Einträge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorDeleteByFilterResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vector/index/save:
    post:
      summary: Vektorindex speichern
      operationId: vectorIndexSave
      tags: [vector]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VectorIndexDirRequest' }
      responses:
        '200':
          description: Index gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VectorIndexOpResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vector/index/load:
    post:
      summary: Vektorindex laden
      operationId: vectorIndexLoad
      tags: [vector]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VectorIndexDirRequest' }
      responses:
        '200':
          description: Index geladen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VectorIndexOpResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vector/index/config:
    get:
      summary: Vektorindex Konfiguration lesen
      operationId: vectorIndexConfigGet
      tags: [vector]
      responses:
        '200':
          description: Aktuelle Konfiguration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VectorIndexConfig' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      summary: Vektorindex Konfiguration ändern
      operationId: vectorIndexConfigPut
      tags: [vector]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                efSearch:
                  type: integer
                  minimum: 1
                  maximum: 10000
      responses:
        '200':
          description: Konfiguration aktualisiert
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  updated_fields: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /vector/index/stats:
    get:
      summary: Vektorindex Statistiken
      operationId: vectorIndexStats
      tags: [vector]
      responses:
        '200':
          description: Status und Kennzahlen des Vektorindex
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VectorIndexConfig'
                  - type: object
                    properties:
                      vectorCount: { type: integer }
        '500': { $ref: '#/components/responses/InternalError' }
  
  # ============================================================================
  # MVCC Features: Named Snapshots (Phase 1)
  # ============================================================================
  /api/v1/snapshots/tags:
    post:
      summary: Create a new snapshot tag
      operationId: createSnapshotTag
      tags: [mvcc, snapshots]
      description: |
        Creates a named snapshot/tag for the current database state.
        Tags are persistent and survive database restarts.
        Used for audit trails, deployment checkpoints, and point-in-time recovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_name:
                  type: string
                  pattern: '^[a-zA-Z0-9_.-]{1,128}$'
                  description: Unique tag identifier (1-128 chars, alphanumeric, hyphens, underscores, periods)
                  example: 'v1.0.0'
                description:
                  type: string
                  minLength: 1
                  description: Human-readable description
                  example: 'Release 1.0 - Initial production release'
                created_by:
                  type: string
                  description: User/service that created the tag
                  default: 'system'
                  example: 'admin'
              required: [tag_name, description]
      responses:
        '201':
          description: Snapshot tag created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotTag'
        '400':
          description: Invalid request (missing fields or invalid tag name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Tag already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: List all snapshot tags
      operationId: listSnapshotTags
      tags: [mvcc, snapshots]
      description: |
        Returns all snapshot tags with optional sorting and pagination.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Maximum tags to return (0 = all)
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [timestamp, sequence, name]
            default: timestamp
          description: Sort field
        - in: query
          name: ascending
          schema:
            type: boolean
            default: false
          description: Sort direction
      responses:
        '200':
          description: List of snapshot tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotTag'
        '500': { $ref: '#/components/responses/InternalError' }
  
  /api/v1/snapshots/tags/{name}:
    get:
      summary: Get a specific snapshot tag
      operationId: getSnapshotTag
      tags: [mvcc, snapshots]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Tag name
      responses:
        '200':
          description: Snapshot tag details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotTag'
        '404':
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      summary: Delete a snapshot tag
      operationId: deleteSnapshotTag
      tags: [mvcc, snapshots]
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Tag name
      responses:
        '200':
          description: Tag deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  message:
                    type: string
                    example: 'Tag v1.0.0 deleted successfully'
        '404':
          description: Tag not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalError' }
  
  /api/v1/snapshots/stats:
    get:
      summary: Get snapshot statistics
      operationId: getSnapshotStats
      tags: [mvcc, snapshots]
      description: |
        Returns statistics about all snapshots including counts and sequence ranges.
      responses:
        '200':
          description: Snapshot statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotStats'
        '500': { $ref: '#/components/responses/InternalError' }
  
  # ============================================================================
  # MVCC Features: Diff API (Phase 2)
  # ============================================================================
  /api/v1/diff:
    get:
      summary: Compute structured diff between two database states
      operationId: computeDiff
      tags: [mvcc, diff]
      description: |
        Computes differences between two points in time with categorization into Added/Modified/Deleted.
        Supports diff by sequence numbers, timestamps, or tags.
        Results are cached for 5 minutes for repeated queries.
      parameters:
        - in: query
          name: from
          schema:
            oneOf:
              - type: integer
                description: Start sequence number
              - type: string
                format: date-time
                description: Start timestamp (ISO 8601)
          description: Start point (sequence or timestamp)
        - in: query
          name: to
          schema:
            oneOf:
              - type: integer
                description: End sequence number
              - type: string
                format: date-time
                description: End timestamp (ISO 8601)
          description: End point (sequence or timestamp)
        - in: query
          name: from_tag
          schema:
            type: string
          description: Start tag name (alternative to from)
        - in: query
          name: to_tag
          schema:
            type: string
          description: End tag name (alternative to to)
        - in: query
          name: table
          schema:
            type: string
          description: Filter by table name
        - in: query
          name: key_prefix
          schema:
            type: string
          description: Filter by key prefix
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Maximum changes to return (0 = all)
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Skip first N changes
      responses:
        '200':
          description: Diff result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResult'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalError' }
  
  /api/v1/diff/cache/stats:
    get:
      summary: Get diff cache statistics
      operationId: getDiffCacheStats
      tags: [mvcc, diff]
      responses:
        '200':
          description: Cache statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  cached_entries:
                    type: integer
                  cache_hit_rate:
                    type: number
                  ttl_seconds:
                    type: integer
        '500': { $ref: '#/components/responses/InternalError' }
  
  /api/v1/diff/cache:
    delete:
      summary: Clear diff cache
      operationId: clearDiffCache
      tags: [mvcc, diff]
      responses:
        '200':
          description: Cache cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'success'
                  message:
                    type: string
                    example: 'Cache cleared'
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/geo/topology:
    get:
      summary: List all shards with region/zone/health metadata
      tags: [Geo Topology]
      responses:
        '200':
          description: Full geo topology
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 6
                  shards:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeoShardInfo'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/geo/topology/shard:
    post:
      summary: Add or update a shard's region and zone metadata
      tags: [Geo Topology]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoShardUpsertRequest'
      responses:
        '200':
          description: Shard added or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  shard_id:
                    type: string
                  region:
                    type: string
                  zone:
                    type: string
                  action:
                    type: string
                    enum: [created, updated]
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/geo/regions:
    get:
      summary: Per-region aggregated health summary
      tags: [Geo Topology]
      responses:
        '200':
          description: Region health summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_regions:
                    type: integer
                  regions:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeoRegionHealth'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/geo/health:
    get:
      summary: Overall geo-failover and quorum health
      tags: [Geo Topology]
      responses:
        '200':
          description: Overall geo health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoOverallHealth'
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /api/v1/geo/config/{collection}:
    get:
      summary: Get geo-replication configuration for a collection
      tags: [Geo Topology]
      parameters:
        - name: collection
          in: path
          required: true
          schema:
            type: string
          example: orders
      responses:
        '200':
          description: Geo-replication configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoReplicationConfig'
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      summary: Update geo-replication configuration for a collection
      tags: [Geo Topology]
      parameters:
        - name: collection
          in: path
          required: true
          schema:
            type: string
          example: orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoReplicationConfigUpdate'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  collection:
                    type: string
                  applied:
                    type: boolean
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }


  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RateLimitError:
      type: object
      properties:
        error: { type: boolean, example: true }
        message: { type: string, example: "Rate limit exceeded" }
        status_code: { type: integer, example: 429 }
      required: [error, message, status_code]
  schemas:
    ContentMeta:
      type: object
      properties:
        id: { type: string }
        mime_type: { type: string }
        category: { type: integer, description: "Enum: TEXT=0, IMAGE=1, AUDIO=2, VIDEO=3, GEO=4, CAD=5, ARCHIVE=6, STRUCTURED=7, BINARY=8, UNKNOWN=9" }
        original_filename: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
        modified_at: { type: integer, format: int64 }
        hash_sha256: { type: string }
        text_extracted: { type: boolean }
        chunked: { type: boolean }
        indexed: { type: boolean }
        chunk_count: { type: integer }
        embedding_dim: { type: integer }
        extracted_metadata: { type: object, additionalProperties: true }
        user_metadata: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string }
        parent_id: { type: string }
        child_ids:
          type: array
          items: { type: string }
    ChunkMeta:
      type: object
      properties:
        id: { type: string }
        content_id: { type: string }
        seq_num: { type: integer }
        chunk_type: { type: string }
        text: { type: string }
        data: { type: object, additionalProperties: true }
        blob_ref: { type: string }
        start_offset: { type: integer }
        end_offset: { type: integer }
        embedding:
          type: array
          items: { type: number }
        embedding_indexed: { type: boolean }
        created_at: { type: integer, format: int64 }
    ContentImportRequest:
      type: object
      properties:
        content: { $ref: '#/components/schemas/ContentMeta' }
        chunks:
          type: array
          items: { $ref: '#/components/schemas/ChunkMeta' }
        edges:
          type: array
          items: { type: object, additionalProperties: true }
        blob: { type: string, description: "Roh-Blob als String" }
        blob_base64: { type: string, description: "Base64-kodierter Blob (im MVP nicht automatisch dekodiert)" }
      required: [content]
    ContentImportResponse:
      type: object
      properties:
        status: { type: string }
        content_id: { type: string }
      required: [status, content_id]
    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [healthy] }
        version: { type: string }
        database: { type: string }
        uptime_seconds: { type: integer, format: int64 }
      required: [status, version, database, uptime_seconds]
    StatsResponse:
      type: object
      properties:
        server:
          type: object
          properties:
            uptime_seconds: { type: integer, format: int64 }
            total_requests: { type: integer, format: int64 }
            total_errors: { type: integer, format: int64 }
            queries_per_second: { type: number, format: float }
            threads: { type: integer }
          required: [uptime_seconds, total_requests, total_errors, queries_per_second, threads]
        storage:
          type: object
          properties:
            rocksdb:
              type: object
              properties:
                block_cache_usage_bytes: { type: integer, format: int64 }
                block_cache_capacity_bytes: { type: integer, format: int64 }
                estimate_num_keys: { type: integer, format: int64 }
                estimate_live_data_size_bytes: { type: integer, format: int64 }
                estimate_pending_compaction_bytes: { type: integer, format: int64 }
                num_running_compactions: { type: integer }
                num_running_flushes: { type: integer }
                memtable_size_bytes: { type: integer, format: int64 }
                cur_size_all_mem_tables_bytes: { type: integer, format: int64 }
                files_per_level:
                  type: object
                  additionalProperties:
                    type: integer
                block_cache_hit: { type: integer, format: int64 }
                block_cache_miss: { type: integer, format: int64 }
                cache_hit_rate_percent: { type: number }
                bytes_written: { type: integer, format: int64 }
                bytes_read: { type: integer, format: int64 }
                compaction_keys_dropped: { type: integer, format: int64 }
            raw_stats:
              type: string
              description: Vollständige RocksDB-Statistiken im Textformat
      required: [server, storage]
    PutEntityRequest:
      type: object
      description: Upsert einer Entität. Key kann im Body oder in der URL stehen.
      properties:
        key:
          type: string
          description: Key im Format table:pk (optional wenn in URL)
        blob:
          type: string
          description: Beliebiger JSON-String; Server speichert als Binär-Blob
      required: [blob]
    PutEntityResponse:
      type: object
      properties:
        success: { type: boolean }
        key: { type: string }
        blob_size: { type: integer }
      required: [success, key, blob_size]
    GetEntityResponse:
      type: object
      properties:
        key: { type: string }
        blob: { type: string }
      required: [key, blob]
    DeleteEntityResponse:
      type: object
      properties:
        success: { type: boolean }
        key: { type: string }
      required: [success, key]
    IndexRequest:
      type: object
      properties:
        table: { type: string }
        column: { type: string }
        type:
          type: string
          enum: [equality, range, fulltext]
          default: equality
          description: Index-Typ. equality für Gleichheitsfilter, range für gte/lte und ORDER BY, fulltext für Volltextsuche.
        unique:
          type: boolean
          default: false
          description: Nur für Equality-Indizes. Wenn true, wird eine Unique-Constraint erzwungen.
        config:
          type: object
          description: Nur für fulltext-Indizes. Konfiguration der Tokenisierung/Stemming.
          properties:
            stemming_enabled:
              type: boolean
              default: false
              description: Stemming aktivieren
            language:
              type: string
              enum: [en, de, none]
              default: none
              description: Sprache für Stemming
            stopwords_enabled:
              type: boolean
              default: false
              description: Stopwords entfernen (Default-Liste je Sprache)
            stopwords:
              type: array
              description: Optionale benutzerdefinierte Stopword-Liste (Kleinschreibung)
              items:
                type: string
            normalize_umlauts:
              type: boolean
              default: false
              description: Deutsch: ä→a, ö→o, ü→u, ß→ss vor Tokenisierung/Stemming
      required: [table, column]
    IndexResponse:
      type: object
      properties:
        success: { type: boolean }
        table: { type: string }
        column: { type: string }
      required: [success, table, column]
    QueryPredicate:
      type: object
      properties:
        column: { type: string }
        value: { type: string }
      required: [column, value]
    RangePredicate:
      type: object
      description: Range-Prädikat für Spalten mit Range-Index
      properties:
        column: { type: string }
        gte:
          type: string
          description: Untere Grenze (greater than or equal). Optional.
        lte:
          type: string
          description: Obere Grenze (less than or equal). Optional.
        includeLower:
          type: boolean
          default: true
          description: Untere Grenze inklusiv?
        includeUpper:
          type: boolean
          default: true
          description: Obere Grenze inklusiv?
      required: [column]
    OrderBy:
      type: object
      description: Sortierung über Range-Index
      properties:
        column:
          type: string
          description: Spalte zum Sortieren (muss Range-Index haben)
        desc:
          type: boolean
          default: false
          description: Absteigend sortieren?
        limit:
          type: integer
          default: 1000
          description: Maximale Anzahl zurückgegebener Keys
      required: [column]
    QueryRequest:
      type: object
      properties:
        table: { type: string }
        predicates:
          type: array
          items: { $ref: '#/components/schemas/QueryPredicate' }
          description: AND-verknüpfte Gleichheitsfilter
        range:
          type: array
          items: { $ref: '#/components/schemas/RangePredicate' }
          description: AND-verknüpfte Range-Prädikate (optional)
        order_by:
          $ref: '#/components/schemas/OrderBy'
          description: Sortierung über Range-Index (optional)
        optimize:
          type: boolean
          default: true
        allow_full_scan:
          type: boolean
          default: false
        explain:
          type: boolean
          default: false
        return:
          type: string
          enum: [keys, entities]
          default: entities
      required: [table]
    QueryPlan:
      type: object
      properties:
        mode:
          type: string
          description: index_parallel | index_optimized | range_aware | full_scan_fallback
        order:
          type: array
          items: { $ref: '#/components/schemas/QueryPredicate' }
        estimates:
          type: array
          items:
            type: object
            properties:
              column: { type: string }
              value: { type: string }
              estimatedCount: { type: integer }
              capped: { type: boolean }
    QueryKeysResponse:
      type: object
      properties:
        table: { type: string }
        count: { type: integer }
        keys:
          type: array
          items: { type: string }
        plan:
          $ref: '#/components/schemas/QueryPlan'
      required: [table, count, keys]
    QueryEntitiesResponse:
      type: object
      properties:
        table: { type: string }
        count: { type: integer }
        entities:
          type: array
          description: JSON-Strings, jede Entität als serialisiertes JSON
          items: { type: string }
        plan:
          $ref: '#/components/schemas/QueryPlan'
      required: [table, count, entities]
    AqlQueryRequest:
      type: object
      properties:
        query:
          type: string
          description: AQL-Query (FOR/FILTER/SORT/LIMIT/RETURN)
        explain:
          type: boolean
          default: false
        optimize:
          type: boolean
          default: true
        allow_full_scan:
          type: boolean
          default: false
        use_cursor:
          type: boolean
          default: false
          description: Cursor-basierte Pagination aktivieren (ändert Response-Format)
        cursor:
          type: string
          nullable: true
          description: Cursor-Token der vorherigen Seite (nur wenn use_cursor=true)
      required: [query]
    AqlExplainPlan:
      type: object
      properties:
        mode:
          type: string
          description: index_parallel | index_optimized | range_aware | full_scan_fallback
        order:
          type: array
          items:
            type: object
            properties:
              column: { type: string }
              value: { type: string }
        estimates:
          type: array
          items:
            type: object
            properties:
              column: { type: string }
              value: { type: string }
              estimatedCount: { type: integer }
              capped: { type: boolean }
        let_pre_extracted:
          type: boolean
          description: true, wenn LET-in-FILTER vor der Übersetzung extrahiert wurde
    AqlStandardResponse:
      type: object
      properties:
        table: { type: string }
        count: { type: integer }
        entities:
          type: array
          items: { type: string }
          description: Jede Entität als JSON-String (serialisiert)
        plan: { $ref: '#/components/schemas/AqlExplainPlan' }
        query: { type: string }
        ast:
          type: object
          description: AST der AQL-Query (nur bei explain=true)
      required: [table, count, entities]
    AqlPaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: { type: string }
          description: Seite von Entitäten (serialisierte JSON-Strings)
        batch_size: { type: integer }
        has_more: { type: boolean }
        next_cursor:
          type: string
          description: Cursor-Token für die nächste Seite (falls has_more=true)
        plan: { $ref: '#/components/schemas/AqlExplainPlan' }
        query: { type: string }
        ast:
          type: object
          description: AST der AQL-Query (nur bei explain=true)
      required: [items, batch_size, has_more]
    GraphTraverseRequest:
      type: object
      description: Graph-Traversierung via BFS
      properties:
        start_vertex:
          type: string
          description: Primärschlüssel des Startknotens
        max_depth:
          type: integer
          minimum: 0
          default: 3
          description: Maximale Traversierungstiefe (0 = nur Startknoten)
      required: [start_vertex, max_depth]
    GraphTraverseResponse:
      type: object
      properties:
        start_vertex: { type: string }
        max_depth: { type: integer }
        visited_count: { type: integer }
        visited:
          type: array
          items: { type: string }
          description: Liste der besuchten Knoten in BFS-Reihenfolge
      required: [start_vertex, max_depth, visited_count, visited]
    VectorSearchRequest:
      type: object
      properties:
        vector:
          type: array
          items: { type: number }
          description: Query-Vektor
        k:
          type: integer
          minimum: 1
          default: 10
        use_cursor:
          type: boolean
          default: false
          description: Aktiviert Cursor-Pagination (ändert das Response-Format)
        cursor:
          type: string
          nullable: true
          description: Cursor-Token (Offset) der vorherigen Seite
      required: [vector]
    VectorSearchHit:
      type: object
      properties:
        pk: { type: string }
        distance: { type: number }
    VectorSearchResponseLegacy:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/VectorSearchHit' }
        k: { type: integer }
        count: { type: integer }
      required: [results, k, count]
    VectorSearchPaginatedResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/VectorSearchHit' }
        batch_size: { type: integer }
        has_more: { type: boolean }
        next_cursor: { type: string }
      required: [items, batch_size, has_more]
    VectorBatchInsertItem:
      type: object
      properties:
        pk: { type: string }
        vector:
          type: array
          items: { type: number }
        fields:
          type: object
          additionalProperties: true
      required: [pk, vector]
    VectorBatchInsertRequest:
      type: object
      properties:
        vector_field:
          type: string
          default: embedding
          description: Feldname des Vektors in der Entity
        items:
          type: array
          items: { $ref: '#/components/schemas/VectorBatchInsertItem' }
      required: [items]
    VectorBatchInsertResponse:
      type: object
      properties:
        inserted: { type: integer }
        errors: { type: integer }
        objectName: { type: string }
        dimension: { type: integer }
      required: [inserted, errors]
    VectorDeleteByFilterRequest:
      type: object
      properties:
        pks:
          type: array
          items: { type: string }
        prefix:
          type: string
      oneOf:
        - required: [pks]
        - required: [prefix]
    VectorDeleteByFilterResponse:
      type: object
      properties:
        deleted: { type: integer }
        method: { type: string, enum: [pks, prefix] }
        prefix: { type: string }
      required: [deleted, method]
    VectorIndexDirRequest:
      type: object
      properties:
        directory: { type: string }
      required: [directory]
    VectorIndexOpResponse:
      type: object
      properties:
        message: { type: string }
        directory: { type: string }
      required: [message, directory]
    VectorIndexConfig:
      type: object
      properties:
        objectName: { type: string }
        dimension: { type: integer }
        metric: { type: string, enum: [L2, COSINE] }
        efSearch: { type: integer }
        M: { type: integer }
        efConstruction: { type: integer }
        hnswEnabled: { type: boolean }
  responses:
    BadRequest:
      description: Ungültige Anforderung
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Nicht autorisiert
      headers:
        WWW-Authenticate:
          schema: { type: string }
          description: Authentifizierungsschema und Realm
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Verboten (fehlende Berechtigung)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service not available (component not initialized)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Interner Serverfehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: boolean }
        message: { type: string }
        status_code: { type: integer }
      required: [error, message, status_code]
    CacheQueryRequest:
      type: object
      properties:
        key: { type: string, description: Eindeutiger Schlüssel }
        prompt: { type: string, description: Freitext für semantische Suche }
        embedding:
          type: array
          items: { type: number }
          description: Vektor für Semantik-Abgleich
        top_k: { type: integer, minimum: 1, default: 1 }
        allow_insert_on_miss: { type: boolean, default: false }
        ttl_sec: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
      anyOf:
        - required: [key]
        - required: [prompt]
        - required: [embedding]
    CacheHit:
      type: object
      properties:
        key: { type: string }
        value: { type: object, additionalProperties: true }
        score: { type: number }
        metadata: { type: object, additionalProperties: true }
    CacheQueryResponse:
      type: object
      properties:
        hit: { type: boolean }
        hits:
          type: array
          items: { $ref: '#/components/schemas/CacheHit' }
          description: Top‑K Ergebnisse bei semantischer Suche
      required: [hit]
    CachePutRequest:
      type: object
      properties:
        key: { type: string }
        value: { type: object, additionalProperties: true }
        embedding:
          type: array
          items: { type: number }
        ttl_sec: { type: integer, minimum: 0 }
        metadata: { type: object, additionalProperties: true }
      required: [key, value]
    CachePutResponse:
      type: object
      properties:
        success: { type: boolean }
        key: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
      required: [success, key]
    CacheStatsResponse:
      type: object
      properties:
        entries: { type: integer, format: int64 }
        hit_ratio_1m: { type: number }
        hit_ratio_1h: { type: number }
        evictions_total: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
      required: [entries]
    LlmMessage:
      type: object
      properties:
        role: { type: string, enum: [user, system, assistant, tool] }
        content: { type: string }
    ReasoningStep:
      type: object
      properties:
        type: { type: string, description: chain_of_thought | tool_plan | scratchpad }
        content:
          type: array
          items: { type: string }
    LlmInteractionRequest:
      type: object
      properties:
        model: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/LlmMessage' }
        reasoning_steps:
          type: array
          items: { $ref: '#/components/schemas/ReasoningStep' }
        metadata: { type: object, additionalProperties: true }
      required: [model, messages]
    LlmInteraction:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        model: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/LlmMessage' }
        reasoning_steps:
          type: array
          items: { $ref: '#/components/schemas/ReasoningStep' }
        metadata: { type: object, additionalProperties: true }
    LlmInteractionResponse:
      type: object
      properties:
        id: { type: string }
        success: { type: boolean }
      required: [id, success]
    ChangeEntry:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        ts: { type: string, format: date-time }
        op: { type: string, enum: [put, delete] }
        key: { type: string }
        table: { type: string }
        value: { type: object, additionalProperties: true, nullable: true }
        prev: { type: object, additionalProperties: true, nullable: true }
        txn_id: { type: string, nullable: true }
    ChangefeedResponse:
      type: object
      properties:
        from_seq: { type: integer, format: int64 }
        next_seq: { type: integer, format: int64 }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ChangeEntry' }
      required: [from_seq, next_seq, entries]
    # API Key Management Schemas
    CreateApiKeyRequest:
      type: object
      properties:
        name:
          type: string
          description: Beschreibender Name für den API-Key
        permissions:
          type: array
          items: { type: string }
          description: Liste von Berechtigungen (z.B. "audit:read", "stats:read", "*")
          example: ["audit:read", "query:execute"]
        expires_in_days:
          type: integer
          nullable: true
          minimum: 1
          maximum: 3650
          description: Ablauf in Tagen (null = kein Ablauf)
        metadata:
          type: object
          additionalProperties: true
          description: Optionale Metadaten (Service-Name, Environment, etc.)
      required: [name, permissions]
    CreateApiKeyResponse:
      type: object
      properties:
        keyId: { type: string }
        secret:
          type: string
          description: API-Key Secret (nur einmal zurückgegeben!)
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true
      required: [keyId, secret, name, permissions, created_at]
    ApiKeyDetails:
      type: object
      properties:
        keyId: { type: string }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        revoked: { type: boolean }
        revoked_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
      required: [keyId, name, permissions, created_at, revoked]
    UpdateApiKeyRequest:
      type: object
      properties:
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
    ListApiKeysResponse:
      type: object
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/ApiKeyDetails' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
      required: [keys, total, page, page_size]
    # Classification Schemas
    ClassifyRequest:
      type: object
      properties:
        text:
          type: string
          description: Zu klassifizierender Text
        document_id:
          type: string
          description: ID eines gespeicherten Dokuments (alternativ zu text)
        include_positions:
          type: boolean
          default: false
          description: PII-Positionen im Text zurückgeben
        categories:
          type: array
          items:
            type: string
            enum: [email, phone, iban, credit_card, name, address, all]
          description: Zu erkennende PII-Kategorien (default = all)
      anyOf:
        - required: [text]
        - required: [document_id]
    PiiMatch:
      type: object
      properties:
        category:
          type: string
          enum: [email, phone, iban, credit_card, name, address]
        value: { type: string }
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        start_pos:
          type: integer
          nullable: true
        end_pos:
          type: integer
          nullable: true
      required: [category, value, confidence]
    ClassifyResponse:
      type: object
      properties:
        contains_pii: { type: boolean }
        matches:
          type: array
          items: { $ref: '#/components/schemas/PiiMatch' }
        summary:
          type: object
          properties:
            total_matches: { type: integer }
            categories_found:
              type: array
              items: { type: string }
            risk_level:
              type: string
              enum: [none, low, medium, high]
              description: Datenschutz-Risiko basierend auf PII-Anzahl und -Typ
          required: [total_matches, categories_found, risk_level]
      required: [contains_pii, matches, summary]
    ClassificationRule:
      type: object
      properties:
        category: { type: string }
        pattern: { type: string }
        enabled: { type: boolean }
        confidence: { type: number }
      required: [category, pattern, enabled]
    ClassificationRulesResponse:
      type: object
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/ClassificationRule' }
        nlp_enabled: { type: boolean }
        nlp_model:
          type: string
          nullable: true
        supported_languages:
          type: array
          items: { type: string }
      required: [rules, nlp_enabled]
    # Report Schemas
    AuditReportResponse:
      type: object
      properties:
        period:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
          required: [start, end]
        summary:
          type: object
          properties:
            total_events: { type: integer, format: int64 }
            successful_events: { type: integer, format: int64 }
            failed_events: { type: integer, format: int64 }
            success_rate: { type: number }
            unique_users: { type: integer }
            unique_entities: { type: integer }
          required: [total_events, successful_events, failed_events, success_rate]
        top_actions:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              count: { type: integer }
              success_rate: { type: number }
        top_users:
          type: array
          items:
            type: object
            properties:
              user: { type: string }
              action_count: { type: integer }
              failed_count: { type: integer }
        top_entities:
          type: array
          items:
            type: object
            properties:
              entity_type: { type: string }
              entity_id: { type: string }
              access_count: { type: integer }
        timeline:
          type: array
          items:
            type: object
            properties:
              timestamp: { type: string, format: date-time }
              event_count: { type: integer }
          description: Zeitliche Verteilung der Events (gruppiert nach group_by Parameter)
      required: [period, summary]
    ComplianceReportResponse:
      type: object
      properties:
        period:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
          required: [start, end]
        pii_processing:
          type: object
          properties:
            total_pii_records: { type: integer, format: int64 }
            pii_access_events: { type: integer, format: int64 }
            pii_deletion_events: { type: integer, format: int64 }
            pseudonymization_active: { type: boolean }
            encryption_enabled: { type: boolean }
          required: [total_pii_records, pii_access_events, pii_deletion_events]
        retention:
          type: object
          properties:
            policies_active: { type: integer }
            auto_deletion_enabled: { type: boolean }
            records_deleted_in_period: { type: integer, format: int64 }
        security:
          type: object
          properties:
            failed_auth_attempts: { type: integer }
            unauthorized_access_attempts: { type: integer }
            data_breaches_detected: { type: integer }
        data_subject_rights:
          type: object
          properties:
            access_requests: { type: integer }
            deletion_requests: { type: integer }
            rectification_requests: { type: integer }
            portability_requests: { type: integer }
          description: DSGVO Art. 15-20 Anfragen
        compliance_score:
          type: number
          minimum: 0.0
          maximum: 100.0
          description: Gesamt-Compliance-Score (0-100)
      required: [period, pii_processing, retention, security, compliance_score]
    RetentionPolicyStatus:
      type: object
      properties:
        collection: { type: string }
        retention_days: { type: integer }
        auto_deletion_enabled: { type: boolean }
        last_cleanup: { type: string, format: date-time, nullable: true }
        records_total: { type: integer, format: int64 }
        records_expired: { type: integer, format: int64 }
        oldest_record_age_days: { type: integer }
      required: [collection, retention_days, auto_deletion_enabled, records_total]
    RetentionReportResponse:
      type: object
      properties:
        policies:
          type: array
          items: { $ref: '#/components/schemas/RetentionPolicyStatus' }
        summary:
          type: object
          properties:
            total_collections: { type: integer }
            collections_with_policy: { type: integer }
            total_expired_records: { type: integer, format: int64 }
            auto_deletion_active: { type: boolean }
            last_global_cleanup: { type: string, format: date-time, nullable: true }
          required: [total_collections, collections_with_policy, total_expired_records]
      required: [policies, summary]
    
    # ============================================================================
    # MVCC Features Schemas
    # ============================================================================
    SnapshotTag:
      type: object
      properties:
        tag_name:
          type: string
          example: 'v1.0.0'
        sequence_number:
          type: integer
          format: int64
          example: 12345
        timestamp_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds
          example: 1736657231000
        description:
          type: string
          example: 'Release 1.0 - Initial production release'
        created_by:
          type: string
          example: 'admin'
      required: [tag_name, sequence_number, timestamp_ms, description, created_by]
    
    SnapshotStats:
      type: object
      properties:
        total_snapshots:
          type: integer
          example: 5
        oldest_timestamp_ms:
          type: integer
          format: int64
          example: 1736657231000
        newest_timestamp_ms:
          type: integer
          format: int64
          example: 1736744231000
        oldest_sequence:
          type: integer
          format: int64
          example: 12345
        newest_sequence:
          type: integer
          format: int64
          example: 50000
      required: [total_snapshots, oldest_timestamp_ms, newest_timestamp_ms, oldest_sequence, newest_sequence]
    
    DiffChange:
      type: object
      properties:
        type:
          type: string
          enum: [added, modified, deleted]
          example: 'modified'
        key:
          type: string
          example: 'users:1'
        old_value:
          type: string
          nullable: true
          description: Value before change (for modified/deleted)
        new_value:
          type: string
          nullable: true
          description: Value after change (for added/modified)
        sequence:
          type: integer
          format: int64
          example: 150
        timestamp_ms:
          type: integer
          format: int64
          example: 1736657250000
        metadata:
          type: object
          additionalProperties: true
      required: [type, key, sequence]
    
    DiffStats:
      type: object
      properties:
        added_count:
          type: integer
          example: 5
        modified_count:
          type: integer
          example: 10
        deleted_count:
          type: integer
          example: 2
        total_changes:
          type: integer
          example: 17
      required: [added_count, modified_count, deleted_count, total_changes]
    
    DiffResult:
      type: object
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/DiffChange'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/DiffChange'
        deleted:
          type: array
          items:
            $ref: '#/components/schemas/DiffChange'
        stats:
          $ref: '#/components/schemas/DiffStats'
        from_sequence:
          type: integer
          format: int64
          example: 100
        to_sequence:
          type: integer
          format: int64
          example: 200
        from_timestamp_ms:
          type: integer
          format: int64
          nullable: true
        to_timestamp_ms:
          type: integer
          format: int64
          nullable: true
      required: [added, modified, deleted, stats, from_sequence, to_sequence]
    
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        status:
          type: integer
      required: [error, status]

    # ── Geo Topology schemas ──────────────────────────────────────────────────
    GeoShardInfo:
      type: object
      properties:
        shard_id:        { type: string, example: "shard-0" }
        region:          { type: string, example: "us-east" }
        zone:            { type: string, example: "us-east-1a" }
        datacenter:      { type: string, example: "us-east" }
        rack:            { type: string, example: "" }
        is_healthy:      { type: boolean }
        raft_role:       { type: string, example: "leader" }
        raft_term:       { type: integer, format: int64 }
        raft_leader_id:  { type: string }
        raft_has_quorum: { type: boolean }
        primary_endpoint: { type: string, example: "10.0.0.1:7000" }
        capabilities:    { type: array, items: { type: string } }
      required: [shard_id, region, zone, is_healthy]

    GeoShardUpsertRequest:
      type: object
      properties:
        shard_id:        { type: string, example: "shard-6" }
        region:          { type: string, example: "ap-south" }
        zone:            { type: string, example: "ap-south-1a" }
        datacenter:      { type: string }
        rack:            { type: string }
        primary_endpoint: { type: string }
        is_healthy:      { type: boolean }
      required: [shard_id]

    GeoRegionHealth:
      type: object
      properties:
        region:             { type: string, example: "us-east" }
        total_shards:       { type: integer, example: 3 }
        healthy_shards:     { type: integer, example: 3 }
        has_majority_quorum: { type: boolean }
        zones:              { type: array, items: { type: string } }
      required: [region, total_shards, healthy_shards, has_majority_quorum]

    GeoOverallHealth:
      type: object
      properties:
        overall_status:   { type: string, enum: [healthy, partial, degraded] }
        total_shards:     { type: integer }
        healthy_shards:   { type: integer }
        total_regions:    { type: integer }
        healthy_regions:  { type: array, items: { type: string } }
        degraded_regions: { type: array, items: { type: object } }
        failed_regions:   { type: array, items: { type: string } }
      required: [overall_status, total_shards, healthy_shards, total_regions]

    GeoReplicationConfig:
      type: object
      properties:
        collection:              { type: string }
        mode:                    { type: string, example: "geo_mirror" }
        replication_factor:      { type: integer, example: 6 }
        replication_mode:        { type: string, enum: [sync, semi_sync, async] }
        local_region:            { type: string, example: "us-east" }
        max_staleness_ms:        { type: integer, example: 500 }
        prefer_local_reads:      { type: boolean }
        prefer_local_writes:     { type: boolean }
        enable_geo_failover:     { type: boolean }
        region_failure_threshold: { type: number, format: double, example: 0.5 }
        max_lag_ms:              { type: integer, example: 1000 }
        region_write_quorums:
          type: object
          additionalProperties: { type: integer }
          example: { "us-east": 2, "eu-west": 1 }
        region_read_quorums:
          type: object
          additionalProperties: { type: integer }
          example: { "us-east": 1 }
        failed_regions:
          type: array
          items: { type: string }
      required: [collection, replication_factor, replication_mode]

    GeoReplicationConfigUpdate:
      type: object
      description: >
        Partial update for a collection's GEO_MIRROR configuration.
        Only provided fields will be updated.
      properties:
        replication_factor:      { type: integer, example: 6 }
        replication_mode:        { type: string, enum: [sync, semi_sync, async] }
        local_region:            { type: string, example: "us-east" }
        max_staleness_ms:        { type: integer, example: 500 }
        prefer_local_reads:      { type: boolean }
        prefer_local_writes:     { type: boolean }
        enable_geo_failover:     { type: boolean }
        region_failure_threshold: { type: number, format: double, example: 0.5 }
        max_lag_ms:              { type: integer }
        region_write_quorums:
          type: object
          additionalProperties: { type: integer }
        region_read_quorums:
          type: object
          additionalProperties: { type: integer }
