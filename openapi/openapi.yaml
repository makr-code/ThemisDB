              schema:
                $ref: '#/components/schemas/PutEntityResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /entities/{key}:
    get:
      summary: Entity lesen
      operationId: getEntity
