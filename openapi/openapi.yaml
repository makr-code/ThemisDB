  # ──────────────────────────────────────────────────────────────────────────────
  # Shard Repair / Anti-Entropy endpoints  (v1.5)
  # ──────────────────────────────────────────────────────────────────────────────
  /admin/repair:
    post:
      summary: Trigger shard repair / rebuild
      operationId: triggerShardRepair
      tags: [Shard Repair]
      description: |
        Enqueues an asynchronous repair job for one shard (or all shards when
        `shard_id` is omitted). The engine will check data consistency via the
        configured redundancy strategy (RAID-5/6, Mirror) and reconstruct any
        missing or corrupt chunks.

        Returns a `job_id` that can be polled with `GET /admin/repair/{job_id}`.
      security:
        - bearerAuth: [admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shard_id:
                  type: string
                  description: Target shard to repair. Omit to repair all shards.
                  example: shard_3
      responses:
        '200':
          description: Repair job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairJobResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /admin/repair/scan:
    post:
      summary: Trigger full anti-entropy scan
      operationId: triggerRepairScan
      tags: [Shard Repair]
      description: |
        Triggers an immediate full cluster-wide anti-entropy scan. All shards are
        inspected for degraded or missing chunks. Degraded documents are
        automatically queued for repair if `enable_auto_repair` is set in the
        engine configuration.

        Returns a `job_id` for status polling.
      security:
        - bearerAuth: [admin]
      responses:
        '200':
          description: Scan job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairJobResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/repair/{job_id}:
    get:
      summary: Get repair job status
      operationId: getRepairJobStatus
      tags: [Shard Repair]
      description: Poll the status of a repair or scan job by its `job_id`.
      security:
        - bearerAuth: [admin]
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
          example: repair-1708450000000-42
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairJobStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

