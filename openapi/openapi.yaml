      description: |
        Submits a long-running AQL query as an asynchronous background job.
        The response immediately returns a `job_id` that can be polled with
        `GET /v2/jobs/{id}`. The job runs in a background thread; results are
        available once `status` transitions to `completed`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncJobSubmitRequest'
            examples:
              simple:
                summary: Long-running AQL scan
                value:
                  query: "FOR doc IN large_collection FILTER doc.active == true RETURN doc"
      responses:
        '202':
          description: Job accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: List all async jobs
      operationId: listAsyncJobs
      tags: [async-jobs]
      description: Returns a JSON array of all known async job records (pending, running, completed, failed, cancelled).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of async job records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AsyncJobRecord'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v2/jobs/{id}:
    get:
      summary: Poll async job status / result
      operationId: getAsyncJob
      tags: [async-jobs]
      description: |
        Returns the full `AsyncJobRecord` for the given `id`. Poll this endpoint
        until `status` is `completed`, `failed`, or `cancelled`.
        On `completed`, the response includes a `result` field with the AQL output.
        On `failed`, the response includes an `error` field with the error message.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Job ID returned by `POST /v2/jobs`
      responses:
        '200':
          description: Full async job record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobRecord'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Cancel async job
      operationId: cancelAsyncJob
      tags: [async-jobs]
      description: |
        Signals cancellation of the specified job. If the job is already in a
        terminal state (`completed`, `failed`, `cancelled`), the endpoint returns
        HTTP 409 Conflict. Pending jobs are cancelled immediately; running jobs
        receive a cooperative cancellation signal.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Job ID to cancel
      responses:
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobCancelResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Job is already in a terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/query/stream:
    get:
      summary: Stream AQL query results via Server-Sent Events (SSE)
      description: |
        Executes an AQL query and streams the results to the client as a
        Server-Sent Events (SSE) stream.  Each result document is emitted as
        a separate `data:` event.  A heartbeat comment (`:heartbeat`) is sent
        every `heartbeat_ms` milliseconds to keep the connection alive.
        The stream terminates automatically once all results have been
        emitted or after `max_seconds` seconds.
      operationId: queryStreamSse
      tags: [query]
      security:
        - bearerAuth: [data:read]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
          description: URL-encoded AQL query string
          example: "FOR doc IN users FILTER doc.active == true RETURN doc"
        - in: query
          name: max_seconds
          required: false
          schema: { type: integer, minimum: 1, maximum: 60, default: 30 }
          description: Maximum time the SSE stream stays open before the server closes it
        - in: query
          name: heartbeat_ms
          required: false
          schema: { type: integer, minimum: 100, maximum: 60000, default: 15000 }
          description: Interval in milliseconds between heartbeat keep-alive comments
        - in: query
          name: retry_ms
          required: false
          schema: { type: integer, minimum: 100, maximum: 120000, default: 3000 }
          description: Reconnection interval sent to the client in the SSE `retry:` field
      responses:
        '200':
          description: SSE stream of AQL result documents
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE stream.  Each result document is delivered as:
                    `data: <JSON document>\n\n`
                  Heartbeat events are delivered as:
                    `:heartbeat\n\n`
                  The stream ends with:
                    `data: [DONE]\n\n`
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/functions:
    post:
      summary: Register a serverless function
      description: |
        Registers a new in-process serverless function defined by a JSON DSL
        code block.  The function is stored in memory and can be invoked via
        `POST /api/v1/functions/{id}/invoke`.
      operationId: registerServerlessFunction
      tags: [serverless]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerlessFunctionCreate'
            examples:
              passthrough:
                summary: Identity function
                value:
                  name: "my-identity"
                  description: "Returns input unchanged"
                  code:
                    operations:
                      - type: passthrough
      responses:
        '201':
          description: Function registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerlessFunction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: List registered serverless functions
      description: Returns all registered functions, optionally filtered by tenant.
      operationId: listServerlessFunctions
      tags: [serverless]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: tenant_id
          required: false
          schema: { type: string }
          description: Filter to functions owned by this tenant
      responses:
        '200':
          description: List of registered functions
          content:
            application/json:
              schema:
                type: object
                properties:
                  functions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerlessFunction'
                required: [functions]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/functions/{id}:
    get:
      summary: Get serverless function definition
      operationId: getServerlessFunction
      tags: [serverless]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Function ID returned by POST /api/v1/functions
      responses:
        '200':
          description: Function definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerlessFunction'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update serverless function definition
      description: |
        Replaces the function definition.  The version counter is incremented
        automatically and the previous version is saved to version history.
      operationId: updateServerlessFunction
      tags: [serverless]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerlessFunctionCreate'
      responses:
        '200':
          description: Function updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerlessFunction'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a serverless function
      operationId: deleteServerlessFunction
      tags: [serverless]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Function deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/functions/{id}/invoke:
    post:
      summary: Invoke a serverless function
      description: |
        Executes the function identified by `id` with the supplied JSON payload.
        The function pipeline is run synchronously; if the function exceeds its
        `timeout_ms` the request fails with HTTP 504.
      operationId: invokeServerlessFunction
      tags: [serverless]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Function ID to invoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary JSON payload passed to the function pipeline
      responses:
        '200':
          description: Function executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:     { description: Output of the function pipeline }
                  elapsed_ms: { type: integer, description: Wall-clock execution time }
                required: [result, elapsed_ms]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '504':
          description: Function execution timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/functions/{id}/versions:
    get:
      summary: List version history of a serverless function
      description: Returns all saved snapshots of the function, ordered oldest-first.
      operationId: listServerlessFunctionVersions
      tags: [serverless]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerlessFunction'
                required: [versions]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/cache/health:
    get:
      summary: Get cache health status
      description: |
        Returns per-tier status (L1/L2/L3), circuit breaker state, and overall health.
        Responds with HTTP 200 when healthy, 503 when degraded or unavailable.
        Requires `admin:cache:read` scope.
      operationId: adminCacheHealth
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:read]
      responses:
        '200':
          description: Cache health status (healthy)
          content:
            application/json:
              schema:
                type: object
                properties:
                  healthy:
                    type: boolean
                    description: True when all tiers are operational and circuit breaker is CLOSED.
                  warnings:
                    type: array
                    items: { type: string }
                    description: List of non-fatal warnings (e.g. high memory pressure).
                  tiers:
                    type: object
                    description: Per-tier operational status.
                    properties:
                      l1:
                        type: object
                        properties:
                          status: { type: string, example: OK }
                          entries: { type: integer }
                          max_entries: { type: integer }
                          utilization: { type: number, format: double }
                          ttl_seconds: { type: integer }
                      l2:
                        type: object
                        properties:
                          status: { type: string, example: OK }
                          entries: { type: integer }
                          max_entries: { type: integer }
                          utilization: { type: number, format: double }
                          ttl_seconds: { type: integer }
                      l3:
                        type: object
                        properties:
                          status: { type: string, example: OK }
                          enabled: { type: boolean }
                          path: { type: string }
                          ttl_seconds: { type: integer }
                  circuit_breaker:
                    type: object
                    properties:
                      state: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
                      enabled: { type: boolean }
                      failure_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Cache is degraded or unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/admin/cache/stats:
    get:
      summary: Get cache statistics
      description: Returns a JSON snapshot of all cache metrics, health status, tenant stats, and circuit breaker state. Requires `admin:cache:read` scope.
      operationId: adminCacheStats
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:read]
      responses:
        '200':
          description: Cache statistics snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheAdminStatsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/key/{encoded_key}:
    delete:
      summary: Evict cache entry by key
      description: Evicts all cache entries (L1, L2, and L3) whose fingerprint matches the provided key. The key must be base64-encoded SHA-256 fingerprint. Requires `admin:cache:write` scope.
      operationId: adminCacheEvictKey
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:write]
      parameters:
        - in: path
          name: encoded_key
          required: true
          schema:
            type: string
          description: Base64-encoded SHA-256 fingerprint of the cache key
      responses:
        '200':
          description: Key evicted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheEvictKeyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/tenant/{tenant_id}:
    delete:
      summary: Evict all cache entries for a tenant
      description: Evicts all cache entries belonging to the specified tenant across all cache tiers (L1, L2, L3). Requires `admin:cache:write` scope.
      operationId: adminCacheEvictTenant
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:write]
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: string
          description: Tenant ID whose cache entries should be evicted
      responses:
        '200':
          description: Tenant cache evicted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheEvictTenantResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/circuit-breaker:
    get:
      summary: Get circuit breaker status
      description: Returns the current state of the L3 (RocksDB) circuit breaker. Requires `admin:cache:read` scope.
      operationId: adminCacheCircuitBreakerStatus
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:read]
      responses:
        '200':
          description: Circuit breaker status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CircuitBreakerStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/circuit-breaker/reset:
    post:
      summary: Reset circuit breaker to CLOSED state
      description: Forces the L3 circuit breaker back to CLOSED state and resets the failure counter. Requires `admin:cache:write` scope.
      operationId: adminCacheCircuitBreakerReset
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:write]
      responses:
        '200':
          description: Circuit breaker reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  circuit_breaker:
                    $ref: '#/components/schemas/CircuitBreakerStatus'
                required: [status, circuit_breaker]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/warmup:
    post:
      summary: Warm up cache from NDJSON log file
      description: |
        Loads cache entries from a newline-delimited JSON (NDJSON) log file.
        Each line must be a JSON object with fields: `key` (SHA-256 hex), `value_b64` (base64-encoded JSON result), `ttl_remaining_s` (seconds), and optionally `tenant`.
        Requires `admin:cache:write` scope.
      operationId: adminCacheWarmup
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheWarmupRequest'
            examples:
              basic:
                value:
                  log_path: /var/lib/themis/cache_warmup.ndjson
                  max_entries: 10000
      responses:
        '200':
          description: Warmup completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheWarmupResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/snapshot:
    post:
      summary: Export live cache entries to NDJSON file
      description: |
        Exports all non-expired L1 and L2 cache entries to a newline-delimited JSON file.
        The output format is compatible with `/v1/admin/cache/warmup` for cache pre-population after a restart.
        Requires `admin:cache:write` scope.
      operationId: adminCacheSnapshot
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheSnapshotRequest'
            examples:
              basic:
                value:
                  out_path: /var/lib/themis/cache_snapshot.ndjson
      responses:
        '200':
          description: Snapshot exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheSnapshotResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/tenants:
    get:
      summary: List all tenants with cache statistics
      description: |
        Returns aggregated cache statistics for all known tenants: bytes used,
        quota, utilization ratio, hit/miss counts, hit rate, and eviction count.
        Requires `admin:cache:read` scope.
      operationId: adminCacheListTenants
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:read]
      responses:
        '200':
          description: Tenant list with cache statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheTenantListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/tenant/{tenant_id}/stats:
    get:
      summary: Get cache statistics for a specific tenant
      description: |
        Returns per-tenant cache statistics including bytes used, quota, utilization,
        hit/miss counts, hit rate, and eviction count.
        Returns 404 when the tenant has no recorded cache activity.
        Requires `admin:cache:read` scope.
      operationId: adminCacheTenantStats
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:read]
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: string
          description: Tenant ID to query statistics for
      responses:
        '200':
          description: Per-tenant cache statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheTenantStatsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/admin/cache/tenant/{tenant_id}/quota:
    patch:
      summary: Update cache quota for a specific tenant
      description: |
        Updates the cache size quota for the specified tenant.
        A `quota_bytes` value of 0 resets the tenant to the global default quota
        (configured via `per_tenant_max_bytes`).
        Requires `admin:cache:write` scope.
      operationId: adminCacheUpdateTenantQuota
      tags: [cache-admin]
      security:
        - bearerAuth: [admin:cache:write]
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema:
            type: string
          description: Tenant ID whose quota should be updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CacheTenantQuotaRequest'
            examples:
              set_50mb:
                value:
                  quota_bytes: 52428800
              reset_to_default:
                value:
                  quota_bytes: 0
      responses:
        '200':
          description: Quota updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheTenantQuotaResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  # ── UDF Registration API ─────────────────────────────────────────────────
  /api/v1/query/udfs:
    post:
      summary: Register a user-defined function (UDF)
      description: |
        Registers a new AQL user-defined function (or replaces an existing one
        with the same name).  Once registered the function is immediately
        callable from AQL queries via the global FunctionRegistry:

        ```aql
        RETURN MY_FUNC("hello")
        ```

        ### Body expression DSL

        The `body` field is a JSON expression tree evaluated at query time.
        Each node is an object with a `"type"` field:

        | type    | description                               | extra fields                  |
        |---------|-------------------------------------------|-------------------------------|
        | `const` | literal value                             | `"value"`: any JSON           |
        | `arg`   | positional argument (0-based)             | `"index"`: integer            |
        | `call`  | call a built-in or registered UDF         | `"function"`, `"args"`: array |
        | `op`    | binary arithmetic / comparison / logical  | `"op"`, `"left"`, `"right"`   |
        | `if`    | conditional expression                    | `"cond"`, `"then"`, `"else"`  |

        Supported operators for `op`: `+`, `-`, `*`, `/`, `%`, `==`, `!=`,
        `<`, `<=`, `>`, `>=`, `&&`, `||`
      operationId: registerUdf
      tags: [query-udf]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UdfCreate'
            examples:
              upper_wrapper:
                summary: Wrap the built-in UPPER function
                value:
                  name: "MY_UPPER"
                  description: "Converts a string to upper-case"
                  arguments:
                    - name: "s"
                      type: "STRING"
                      required: true
                  return_type: "STRING"
                  is_deterministic: true
                  body:
                    type: "call"
                    function: "UPPER"
                    args:
                      - type: "arg"
                        index: 0
              add_numbers:
                summary: Add two numbers
                value:
                  name: "ADD_TWO"
                  arguments:
                    - name: "a"
                      type: "NUMBER"
                      required: true
                    - name: "b"
                      type: "NUMBER"
                      required: true
                  return_type: "NUMBER"
                  body:
                    type: "op"
                    op: "+"
                    left:
                      type: "arg"
                      index: 0
                    right:
                      type: "arg"
                      index: 1
      responses:
        '201':
          description: UDF registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UdfDefinition'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      summary: List all registered UDFs
      description: Returns definitions for every user-defined function currently registered in the AQL FunctionRegistry.
      operationId: listUdfs
      tags: [query-udf]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of registered UDFs
          content:
            application/json:
              schema:
                type: object
                required: [udfs, count]
                properties:
                  udfs:
                    type: array
                    items:
                      $ref: '#/components/schemas/UdfDefinition'
                  count:
                    type: integer
                    minimum: 0
                    description: Total number of registered UDFs
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/query/udfs/{name}:
    get:
      summary: Get a single UDF definition
      description: Returns the full definition of a specific user-defined function by its registered name.
      operationId: getUdf
      tags: [query-udf]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Registered UDF name (case-sensitive, e.g. `MY_UPPER`)
      responses:
        '200':
          description: UDF definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UdfDefinition'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Unregister a UDF
      description: |
        Removes the named user-defined function from the AQL FunctionRegistry.
        After deletion the function is no longer callable from AQL queries.
        Built-in functions cannot be deleted via this endpoint.
      operationId: deleteUdf
      tags: [query-udf]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: Registered UDF name to remove
      responses:
        '204':
          description: UDF unregistered successfully (no content)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

