        '500': { $ref: '#/components/responses/InternalError' }
    put:
      summary: Entity anlegen/ersetzen (Upsert) mit Key in der URL
      operationId: putEntity
      tags: [entities]
      parameters:
        - name: key
          in: path
          required: true
          description: Key im Format table:pk
          schema: { type: string }
      requestBody:
        required: true
