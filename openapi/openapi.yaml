        '200':
          description: Status und Kennzahlen des Vektorindex
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/VectorIndexConfig'
                  - type: object
                    properties:
                      vectorCount: { type: integer }
        '500': { $ref: '#/components/responses/InternalError' }
  
  # ============================================================================
  # MVCC Features: Named Snapshots (Phase 1)
  # ============================================================================
  /api/v1/snapshots/tags:
    post:
      summary: Create a new snapshot tag
      operationId: createSnapshotTag
      tags: [snapshots]
      description: |
        Creates a named snapshot/tag for the current database state.
        Tags are persistent and survive database restarts.
        Used for audit trails, deployment checkpoints, and point-in-time recovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_name:
                  type: string
                  pattern: '^[a-zA-Z0-9_.-]{1,128}$'
                  description: Unique tag identifier (1-128 chars, alphanumeric, hyphens, underscores, periods)
                  example: 'v1.0.0'
                description:
                  type: string
                  minLength: 1
                  description: Human-readable description
                  example: 'Release 1.0 - Initial production release'
                created_by:
                  type: string
                  description: User/service that created the tag
                  default: 'system'
                  example: 'admin'
              required: [tag_name, description]
      responses:
        '201':
          description: Snapshot tag created successfully
          content:
            application/json:
