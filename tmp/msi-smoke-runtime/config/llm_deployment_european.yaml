# ThemisDB LLM Deployment - European Language Models
# Version: 1.0.0
#
# This configuration defines European language models compatible with llama.cpp
# Optimized for multilingual European use cases and GDPR compliance

# ═══════════════════════════════════════════════════════════
# Deployment Configuration for European Models
# ═══════════════════════════════════════════════════════════
deployment:
  mode: auto
  cache_directory: "./models/european"
  enable_cache: true
  max_cache_size_gb: 150
  
  # Ollama integration
  ollama_url: "http://localhost:11434"
  ollama_timeout_seconds: 900  # Longer timeout for larger models
  
  # European proxy/compliance settings
  proxy_url: ""
  verify_checksums: true
  allow_insecure: false
  
  # GDPR-compliant audit logging
  enable_audit_log: true
  audit_log_path: "./logs/european_models_deployment.log"
  
  # Cleanup for European data retention policies
  auto_cleanup: true
  max_model_age_days: 180
  keep_versions: 3
  
  # Model sources
  sources:
    # Ollama (European mirrors preferred)
    - type: ollama
      location: "http://localhost:11434"
      priority: 100
    
    # NOTE: Base URLs like "https://huggingface.co" cannot be used directly.
    # The current implementation expects direct file URLs or directories.
    # For HuggingFace models, use local mirrors or configure per-model URLs.
    
    # Local European data centers (directory path - model filename appended automatically)
    - type: local
      location: "/mnt/eu-models"
      priority: 95

# ═══════════════════════════════════════════════════════════
# European Language Model Definitions
# ═══════════════════════════════════════════════════════════
models:
  # ---------------------------------------------------------------------------
  # Multilingual European Models (Pan-European)
  # ---------------------------------------------------------------------------
  
  # Mistral Models (French Origin - Excellent for European languages)
  mistral-7b-instruct-eu:
    version: v0.2
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Mistral 7B optimized for European languages"
    languages:
      - en  # English
      - de  # German
      - fr  # French
      - es  # Spanish
      - it  # Italian
      - nl  # Dutch
      - pt  # Portuguese
      - pl  # Polish
      - cs  # Czech
      - ro  # Romanian
    sources:
      ollama: mistral:7b-instruct-v0.2-q4_K_M
      huggingface: mistralai/Mistral-7B-Instruct-v0.2
      local: /models/european/mistral-7b-instruct-eu.gguf
    parameters:
      context_length: 8192
      max_tokens: 4096
      temperature: 0.7
      top_p: 0.95
    gpu:
      layers_offload: 32
      vram_required_mb: 4096
    deployment:
      gdpr_compliant: true
      european_data_residency: true
      data_retention_days: 90
  
  # Mixtral 8x7B (Advanced Multilingual)
  mixtral-8x7b-instruct-eu:
    version: v0.1
    type: instruction
    format: gguf
    size: 47B
    quantization: Q4_K_M
    description: "Mixture of Experts model - excellent multilingual performance"
    languages:
      - en
      - de
      - fr
      - es
      - it
      - nl
      - pt
      - pl
      - sv  # Swedish
      - da  # Danish
      - fi  # Finnish
      - no  # Norwegian
      - el  # Greek
      - hu  # Hungarian
    sources:
      ollama: mixtral:8x7b-instruct-v0.1-q4_K_M
      huggingface: mistralai/Mixtral-8x7B-Instruct-v0.1
      local: /models/european/mixtral-8x7b-instruct-eu.gguf
    parameters:
      context_length: 32768
      max_tokens: 8192
      temperature: 0.7
    gpu:
      layers_offload: 56
      vram_required_mb: 24000
      tensor_parallel: 2
    deployment:
      gdpr_compliant: true
      multi_gpu: true
      min_gpus: 2

  # ---------------------------------------------------------------------------
  # German Language Models (Deutsch)
  # ---------------------------------------------------------------------------
  
  # LeoLM by LAION (German focused)
  leo-mistral-7b-hessianai:
    version: v1.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "LeoLM - German language model based on Mistral 7B"
    primary_language: de
    languages:
      - de
      - en
    sources:
      huggingface: LeoLM/leo-mistral-hessianai-7b
      ollama: leo-mistral:7b-hessianai
      local: /models/european/leo-mistral-7b-de.gguf
    parameters:
      context_length: 8192
      max_tokens: 4096
      temperature: 0.7
    gpu:
      layers_offload: 32
      vram_required_mb: 4096
    specialization:
      domains:
        - german_law
        - german_business
        - german_education
        - technical_german
    deployment:
      gdpr_compliant: true
      recommended_for:
        - German legal documents
        - German business correspondence
        - German technical documentation

  # DiscoLM (German from DFKI)
  discolm-german-7b:
    version: v1.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "DiscoLM - German LLM by DFKI"
    primary_language: de
    sources:
      huggingface: DiscoResearch/DiscoLM-German-7b-v1
      local: /models/european/discolm-german-7b.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
      temperature: 0.7
    gpu:
      layers_offload: 32
      vram_required_mb: 4096

  # ---------------------------------------------------------------------------
  # French Language Models (Français)
  # ---------------------------------------------------------------------------
  
  # Vigogne (French Alpaca)
  vigogne-7b-instruct:
    version: v2.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Vigogne - French instruction-tuned model"
    primary_language: fr
    languages:
      - fr
      - en
    sources:
      huggingface: bofenghuang/vigogne-2-7b-instruct
      local: /models/european/vigogne-7b-instruct.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
      temperature: 0.7
    gpu:
      layers_offload: 32
      vram_required_mb: 4096
    specialization:
      domains:
        - french_literature
        - french_law
        - french_business

  # CroissantLLM (French by CNRS)
  croissantllm-13b:
    version: v1.0
    type: base
    format: gguf
    size: 13B
    quantization: Q4_K_M
    description: "CroissantLLM - French LLM by CNRS"
    primary_language: fr
    sources:
      huggingface: croissantllm/CroissantLLMChat-v0.1
      local: /models/european/croissantllm-13b.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
    gpu:
      layers_offload: 40
      vram_required_mb: 7000

  # ---------------------------------------------------------------------------
  # Spanish Language Models (Español)
  # ---------------------------------------------------------------------------
  
  # Aguila (Spanish by Projecte AINA)
  aguila-7b:
    version: v1.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Aguila - Spanish language model"
    primary_language: es
    languages:
      - es
      - ca  # Catalan
      - en
    sources:
      huggingface: projecte-aina/aguila-7b
      local: /models/european/aguila-7b.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
      temperature: 0.7
    gpu:
      layers_offload: 32
      vram_required_mb: 4096
    specialization:
      regions:
        - spain
        - latin_america
        - catalonia

  # ---------------------------------------------------------------------------
  # Italian Language Models (Italiano)
  # ---------------------------------------------------------------------------
  
  # Camoscio (Italian Alpaca)
  camoscio-7b-llama2:
    version: v1.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Camoscio - Italian instruction model"
    primary_language: it
    sources:
      huggingface: teelinsan/camoscio-7b-llama2
      local: /models/european/camoscio-7b.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
    gpu:
      layers_offload: 32
      vram_required_mb: 4096

  # ---------------------------------------------------------------------------
  # Nordic Language Models (Scandinavian)
  # ---------------------------------------------------------------------------
  
  # ScandEval Nordic Model
  scandeval-7b:
    version: v1.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Nordic languages model (Swedish, Danish, Norwegian, Finnish)"
    languages:
      - sv  # Swedish
      - da  # Danish
      - no  # Norwegian
      - fi  # Finnish
      - en
    sources:
      huggingface: scandeval/scandeval-7b
      local: /models/european/scandeval-7b.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
    gpu:
      layers_offload: 32
      vram_required_mb: 4096

  # ---------------------------------------------------------------------------
  # Eastern European Models
  # ---------------------------------------------------------------------------
  
  # Polish LLM
  polish-mistral-7b:
    version: v1.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Polish language model based on Mistral"
    primary_language: pl
    sources:
      huggingface: eryk-mazus/polka-1.1b
      local: /models/european/polish-mistral-7b.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
    gpu:
      layers_offload: 32
      vram_required_mb: 4096

  # Czech LLM
  czert-7b:
    version: v1.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Czech language model"
    primary_language: cs
    sources:
      local: /models/european/czert-7b.gguf
    parameters:
      context_length: 4096
      max_tokens: 2048
    gpu:
      layers_offload: 32
      vram_required_mb: 4096

  # ---------------------------------------------------------------------------
  # Multilingual European Embedding Models
  # ---------------------------------------------------------------------------
  
  # Multilingual E5
  e5-mistral-7b-instruct-eu:
    version: v1.0
    type: embedding
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Multilingual embedding model for European languages"
    languages:
      - en
      - de
      - fr
      - es
      - it
      - nl
      - pt
      - pl
      - sv
      - da
      - fi
      - no
    sources:
      huggingface: intfloat/multilingual-e5-large
      local: /models/european/e5-mistral-7b-eu.gguf
    parameters:
      embedding_dim: 1024
      max_sequence_length: 512
    gpu:
      vram_required_mb: 2048

# ═══════════════════════════════════════════════════════════
# European LoRA Adapters
# ═══════════════════════════════════════════════════════════
loras:
  # German Legal LoRA
  german-legal-gdpr-v1:
    base_model: leo-mistral-7b-hessianai
    domain: legal
    language: de
    description: "German legal texts with GDPR compliance focus"
    format: safetensors
    sources:
      local: /loras/european/german-legal-gdpr-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    size_mb: 50
    compliance:
      gdpr: true
      german_bdsg: true
  
  # French Medical LoRA
  french-medical-hipaa-v1:
    base_model: vigogne-7b-instruct
    domain: medical
    language: fr
    description: "French medical terminology"
    format: safetensors
    sources:
      local: /loras/european/french-medical-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    size_mb: 50
  
  # EU Multilingual Business LoRA
  eu-business-multilingual-v1:
    base_model: mistral-7b-instruct-eu
    domain: business
    languages:
      - de
      - fr
      - es
      - it
      - en
    description: "European business communications"
    format: safetensors
    sources:
      local: /loras/european/eu-business-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    size_mb: 60

# ═══════════════════════════════════════════════════════════
# Integration with ThemisDB LLM Plugin
# ═══════════════════════════════════════════════════════════
llm:
  enabled: true
  default_plugin: "llamacpp"
  
  # Auto-deploy European models at startup
  auto_deploy:
    enabled: false
    models:
      - "mistral-7b-instruct-eu"
      - "leo-mistral-7b-hessianai"
      - "vigogne-7b-instruct"

llm_plugins:
  llamacpp:
    type: "llama.cpp"
    enabled: true
    
    model:
      path: ""
      auto_load: false
    
    gpu:
      n_layers: 32
      use_cuda: true
    
    context:
      n_ctx: 8192
      n_batch: 512
      n_threads: 8

# ═══════════════════════════════════════════════════════════
# GDPR & European Compliance Settings
# ═══════════════════════════════════════════════════════════
compliance:
  gdpr:
    enabled: true
    data_residency: eu
    data_retention_days: 90
    audit_logging: true
    right_to_deletion: true
    
  regional:
    germany:
      bdsg_compliant: true
      bsi_recommendations: true
    
    france:
      cnil_compliant: true
    
    eu_wide:
      schrems_ii_compliant: true
      standard_contractual_clauses: true

# ═══════════════════════════════════════════════════════════
# European Data Centers Configuration
# ═══════════════════════════════════════════════════════════
data_centers:
  primary:
    region: eu-central-1
    location: Frankfurt, Germany
    
  secondary:
    region: eu-west-1
    location: Paris, France
    
  tertiary:
    region: eu-south-1
    location: Milan, Italy
