# Office Processor Configuration
# 
# Extracts text, metadata, and structure from Office documents.
# Supports: DOCX, XLSX, PPTX, ODF, RTF
# Backend: libzip + pugixml
#
# Version: 1.0

processor:
  name: "Office Processor"
  version: "1.0.0"
  library: "themis_proc_office"
  description: "Extract text and metadata from Office documents"
  
  # Supported MIME types
  mime_types:
    # OOXML (Office 2007+)
    - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
    # ODF (OpenDocument Format)
    - "application/vnd.oasis.opendocument.text"
    - "application/vnd.oasis.opendocument.spreadsheet"
    - "application/vnd.oasis.opendocument.presentation"
    # Legacy Office
    - "application/msword"
    - "application/vnd.ms-excel"
    - "application/vnd.ms-powerpoint"
    # RTF
    - "application/rtf"
    - "text/rtf"
  
  # Supported file extensions
  extensions:
    - ".docx"
    - ".xlsx"
    - ".pptx"
    - ".odt"
    - ".ods"
    - ".odp"
    - ".doc"
    - ".xls"
    - ".ppt"
    - ".rtf"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Extract plain text
    text: true
    
    # Extract document metadata
    metadata: true
    
    # Extract comments and annotations
    comments: true
    
    # Extract track changes / revisions
    track_changes: true
    
    # Extract headers and footers
    headers_footers: true
    
    # Extract embedded objects metadata
    embedded_objects: false
  
  # ============================================================================
  # Word (DOCX) Settings
  # ============================================================================
  word:
    # Extract document structure
    structure: true
    
    # Extract styles
    styles: false
    
    # Extract footnotes and endnotes
    notes: true
    
    # Extract table of contents
    toc: true
    
    # Extract bibliography
    bibliography: true
    
    # Preserve formatting hints
    formatting_hints: false
  
  # ============================================================================
  # Excel (XLSX) Settings
  # ============================================================================
  excel:
    # Extract formulas (not just values)
    formulas: true
    
    # Extract named ranges
    named_ranges: true
    
    # Extract chart metadata
    charts_metadata: true
    
    # Maximum rows to process per sheet
    max_rows: 100000
    
    # Maximum columns to process
    max_columns: 1000
    
    # Maximum total cells
    max_cells: 1000000
    
    # Extract hidden sheets
    hidden_sheets: false
    
    # Cell reference format in output
    cell_references: true
  
  # ============================================================================
  # PowerPoint (PPTX) Settings
  # ============================================================================
  powerpoint:
    # Extract speaker notes
    speaker_notes: true
    
    # Extract slide layout info
    slide_layout: true
    
    # Extract animations metadata
    animations_metadata: false
    
    # Extract transitions metadata
    transitions_metadata: false
    
    # Include slide numbers
    slide_numbers: true
    
    # Extract master slides
    master_slides: false
  
  # ============================================================================
  # Chunking Settings
  # ============================================================================
  chunking:
    # Strategy per document type
    word_strategy: paragraph  # paragraph, section, page
    excel_strategy: sheet     # sheet, row_range
    powerpoint_strategy: slide
    
    # Maximum tokens per chunk
    max_tokens: 512
    
    # Token overlap
    overlap_tokens: 50
    
    # Include structure in chunks
    preserve_structure: true
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Allow macro-enabled documents
    allow_macros: false
    
    # Allow encrypted documents (with password)
    allow_encrypted: true
    
    # Scan embedded objects
    scan_embedded: true
    
    # Maximum file size (MB)
    max_file_size_mb: 100
    
    # Malware scan
    malware_scan: true
    
    # Block OLE objects
    block_ole: true
  
  # ============================================================================
  # Backend Settings
  # ============================================================================
  backend:
    # Libraries used
    zip_library: libzip
    xml_library: pugixml
    
    # Legacy format support (requires LibreOffice)
    legacy_support: false
    libreoffice_path: "/usr/bin/soffice"
