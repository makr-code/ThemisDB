# Video Processor Configuration
# 
# Extracts metadata, thumbnails, and optional transcription from video files.
# Backend: FFmpeg
#
# Version: 1.0

processor:
  name: "Video Processor"
  version: "1.0.0"
  library: "themis_proc_video"
  description: "Extract metadata and thumbnails from video files"
  
  # Supported MIME types
  mime_types:
    - "video/mp4"
    - "video/x-matroska"
    - "video/webm"
    - "video/x-msvideo"
    - "video/quicktime"
    - "video/x-ms-wmv"
    - "video/mpeg"
    - "video/x-flv"
    - "video/3gpp"
    - "video/3gpp2"
    - "video/ogg"
  
  # Supported file extensions
  extensions:
    - ".mp4"
    - ".mkv"
    - ".webm"
    - ".avi"
    - ".mov"
    - ".wmv"
    - ".mpg"
    - ".mpeg"
    - ".flv"
    - ".3gp"
    - ".ogv"
    - ".m4v"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Extract technical metadata
    metadata: true
    
    # Generate thumbnail image
    thumbnail: true
    
    # Extract keyframes (multiple thumbnails)
    keyframes: false
    
    # Extract embedded subtitles
    subtitles: true
    
    # List audio tracks
    audio_tracks: true
    
    # Extract chapter markers
    chapters: true
    
    # Metadata fields to extract
    metadata_fields:
      - duration
      - resolution
      - video_codec
      - audio_codec
      - bitrate
      - framerate
      - aspect_ratio
      - creation_date
      - gps_location
      - rotation
      - color_space
      - hdr_info
  
  # ============================================================================
  # Thumbnail Settings
  # ============================================================================
  thumbnails:
    # Number of thumbnails to generate
    count: 1
    
    # Position for single thumbnail
    # - start: First frame
    # - middle: Middle of video
    # - end: Last frame
    # - percentage: Specific percentage (e.g., 0.25)
    position: middle
    
    # Thumbnail size
    width: 320
    height: 240
    
    # Maintain aspect ratio
    preserve_aspect: true
    
    # Output format
    format: jpeg
    
    # JPEG quality (1-100)
    quality: 85
  
  # ============================================================================
  # Keyframe Settings
  # ============================================================================
  keyframes:
    # Enable keyframe extraction
    enabled: false
    
    # Interval between keyframes
    interval_sec: 30
    
    # Maximum keyframes to extract
    max_count: 10
    
    # Keyframe selection strategy
    # - interval: Fixed time interval
    # - scene: Scene change detection
    # - i_frames: Only I-frames
    strategy: interval
    
    # Scene detection threshold (0-100)
    scene_threshold: 30
  
  # ============================================================================
  # Transcription Settings (Speech-to-Text)
  # ============================================================================
  transcription:
    # Enable audio transcription
    enabled: false
    
    # Transcription engine
    # - whisper: OpenAI Whisper
    # - vosk: Vosk offline
    # - azure: Azure Speech Services
    engine: whisper
    
    # Language detection
    language: auto
    
    # Whisper model size (tiny, base, small, medium, large)
    model: base
    
    # Include timestamps in transcription
    timestamps: true
    
    # Speaker diarization (identify different speakers)
    speaker_diarization: false
    
    # Timeout for transcription
    timeout_sec: 300
  
  # ============================================================================
  # Scene Detection Settings
  # ============================================================================
  scene_detection:
    # Enable scene detection
    enabled: false
    
    # Detection threshold (0-100, higher = fewer scenes)
    threshold: 30
    
    # Minimum scene length
    min_scene_length_sec: 2
    
    # Maximum scenes to detect
    max_scenes: 100
    
    # Generate thumbnail for each scene
    scene_thumbnails: false
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Maximum video duration to process (seconds, 0 = unlimited)
    max_duration_sec: 7200  # 2 hours
    
    # Maximum file size (MB)
    max_file_size_mb: 2048  # 2 GB
    
    # Allowed codecs (empty = all)
    allowed_codecs: []
    
    # Scan for malicious content
    malware_scan: true
  
  # ============================================================================
  # Backend Settings
  # ============================================================================
  backend:
    # Backend library
    library: ffmpeg
    
    # Minimum FFmpeg version
    version_min: "5.0"
    
    # Hardware acceleration
    # - auto: Auto-detect
    # - cuda: NVIDIA CUDA
    # - vaapi: Intel VA-API
    # - videotoolbox: macOS VideoToolbox
    # - none: Software only
    hardware_accel: auto
    
    # Number of decoder threads
    threads: 2
    
    # Memory limit for decoding
    memory_limit_mb: 512
