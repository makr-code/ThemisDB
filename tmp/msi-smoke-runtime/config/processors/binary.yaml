# Binary Processor Configuration
# 
# Fallback processor for unknown binary formats.
# Extracts basic metadata (size, hash, magic bytes).
#
# Version: 1.0

processor:
  name: "Binary Processor"
  version: "1.0.0"
  library: "themis_proc_binary"
  description: "Fallback processor for unknown binary formats"
  
  # Supported MIME types (catch-all)
  mime_types:
    - "application/octet-stream"
    - "application/x-binary"
  
  # Supported file extensions (none - fallback only)
  extensions: []
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Compute file hash
    hash: true
    hash_algorithm: sha256
    
    # Extract magic bytes
    magic_bytes: true
    magic_bytes_length: 16
    
    # Detect file type from magic
    detect_type: true
    
    # Extract entropy
    entropy: true
    
    # Check if text
    is_text_check: true
    text_threshold: 0.95  # Ratio of printable characters
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Maximum file size (MB)
    max_file_size_mb: 100
    
    # Malware scan
    malware_scan: true
    
    # Scan for known file signatures
    signature_scan: true
