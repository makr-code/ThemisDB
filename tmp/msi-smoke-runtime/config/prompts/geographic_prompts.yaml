# Geographic Prompts
#
# This file contains prompt templates for geographic queries, spatial analysis,
# location-based services, and GIS operations.

version: "1.0.0"

prompts:
  
  location_query:
    name: "Location Query"
    version: "1.0"
    description: "Query geographic locations and places"
    active: true
    content: |
      You are answering a geographic location query.
      
      Query: {query}
      Geographic context: {context}
      
      Location analysis:
      1. **Identification**: What locations are relevant?
      2. **Properties**: What are the characteristics?
      3. **Coordinates**: What are the coordinates (if applicable)?
      4. **Relations**: How do locations relate spatially?
      5. **Context**: What is the geographic context?
      
      Geographic information:
      - Coordinates (latitude, longitude)
      - Administrative divisions (country, state, city)
      - Physical features (mountains, rivers, etc.)
      - Points of interest
      - Distances and directions
      
      Present information:
      - Location identification
      - Geographic coordinates
      - Key features
      - Spatial relationships
      - Additional context

  spatial_analysis:
    name: "Spatial Analysis"
    version: "1.0"
    description: "Perform spatial analysis on geographic data"
    active: true
    content: |
      You are performing spatial analysis.
      
      Analysis objective: {query}
      Spatial data: {context}
      
      Spatial analysis methods:
      1. **Distribution**: How are features distributed?
      2. **Density**: Where are concentrations?
      3. **Proximity**: What is near what?
      4. **Clustering**: What patterns exist?
      5. **Networks**: How are things connected?
      6. **Overlays**: How do layers intersect?
      
      Spatial operations:
      - Buffer analysis (create zones around features)
      - Nearest neighbor (find closest points)
      - Spatial join (combine by location)
      - Hot spot analysis (identify clusters)
      - Viewshed analysis (visibility)
      - Route optimization
      
      Present analysis:
      - Analysis question
      - Data used
      - Methods applied
      - Spatial patterns found
      - Visualizations (describe)
      - Conclusions

  distance_calculation:
    name: "Distance Calculation"
    version: "1.0"
    description: "Calculate distances between geographic locations"
    active: true
    content: |
      You are calculating geographic distances.
      
      Distance query: {query}
      Locations: {context}
      
      Distance calculations:
      1. **Method**: Euclidean, great circle (haversine), or network?
      2. **Coordinates**: Extract coordinates for locations
      3. **Calculation**: Apply distance formula
      4. **Units**: Convert to appropriate units (km, miles)
      5. **Routes**: If network distance, find route
      
      Distance types:
      - Straight-line (as the crow flies)
      - Great circle (spherical Earth)
      - Network/road distance
      - Travel time distance
      
      Present calculation:
      - Locations identified
      - Coordinates used
      - Distance method
      - Calculated distance
      - Route (if applicable)
      - Interpretation

  region_analysis:
    name: "Regional Analysis"
    version: "1.0"
    description: "Analyze geographic regions and areas"
    active: true
    content: |
      You are analyzing a geographic region.
      
      Region: {query}
      Regional data: {context}
      
      Regional analysis:
      1. **Boundaries**: What defines the region?
      2. **Area**: What is the size?
      3. **Demographics**: Population, density
      4. **Physical**: Terrain, climate, resources
      5. **Economic**: Industries, development
      6. **Connectivity**: Transport, infrastructure
      
      Regional characteristics:
      - Physical geography (topography, climate)
      - Human geography (population, culture)
      - Economic geography (industries, trade)
      - Political geography (borders, governance)
      - Urban/rural characteristics
      
      Present analysis:
      - Region overview
      - Key characteristics
      - Statistical data
      - Spatial patterns
      - Comparisons (if applicable)
      - Insights

  map_generation:
    name: "Map Description"
    version: "1.0"
    description: "Describe or generate geographic map information"
    active: true
    content: |
      You are describing a geographic map.
      
      Map subject: {query}
      Map data: {context}
      
      Map elements:
      1. **Extent**: What area is covered?
      2. **Features**: What is shown? (roads, rivers, cities, etc.)
      3. **Scale**: What is the scale?
      4. **Layers**: What data layers are included?
      5. **Symbols**: How are features represented?
      6. **Legend**: What do symbols mean?
      
      Map types:
      - Topographic (elevation, terrain)
      - Political (boundaries, capitals)
      - Thematic (population, climate, etc.)
      - Navigation (roads, routes)
      - Satellite/aerial imagery
      
      Describe map:
      - Map type and purpose
      - Geographic extent
      - Key features shown
      - Legend/symbols
      - Scale and orientation
      - Notable patterns

  route_planning:
    name: "Route Planning"
    version: "1.0"
    description: "Plan routes between geographic locations"
    active: true
    content: |
      You are planning a route.
      
      Route request: {query}
      Network data: {context}
      
      Route planning:
      1. **Origin**: Start location
      2. **Destination**: End location
      3. **Waypoints**: Intermediate stops
      4. **Constraints**: Avoid highways, fastest, shortest, etc.
      5. **Route**: Calculate optimal route
      6. **Directions**: Provide turn-by-turn directions
      
      Route optimization criteria:
      - Shortest distance
      - Fastest time
      - Avoid tolls
      - Avoid highways
      - Scenic route
      - Multiple stops (TSP)
      
      Present route:
      - Start and end points
      - Route overview
      - Total distance
      - Estimated time
      - Key waypoints/landmarks
      - Turn-by-turn directions
      - Alternative routes

  geospatial_statistics:
    name: "Geospatial Statistics"
    version: "1.0"
    description: "Analyze statistical patterns in geographic data"
    active: true
    content: |
      You are performing geospatial statistical analysis.
      
      Analysis: {query}
      Spatial dataset: {context}
      
      Geospatial statistics:
      1. **Spatial Autocorrelation**: Are nearby values similar? (Moran's I)
      2. **Hot Spots**: Where are significant clusters? (Getis-Ord Gi*)
      3. **Point Patterns**: Random, clustered, or dispersed?
      4. **Spatial Regression**: Model spatial relationships
      5. **Interpolation**: Estimate values at unsampled locations
      
      Statistical methods:
      - Global spatial autocorrelation
      - Local indicators of spatial association (LISA)
      - Kernel density estimation
      - Kriging interpolation
      - Geographically weighted regression
      
      Present analysis:
      - Research question
      - Data description
      - Statistical methods used
      - Results and significance
      - Spatial patterns identified
      - Interpretation

  geocoding:
    name: "Geocoding"
    version: "1.0"
    description: "Convert addresses to coordinates or vice versa"
    active: true
    content: |
      You are performing geocoding.
      
      Geocoding request: {query}
      Reference data: {context}
      
      Geocoding process:
      1. **Input**: Address or coordinates
      2. **Parsing**: Parse address components
      3. **Matching**: Match to reference data
      4. **Coordinates**: Return lat/long (or address)
      5. **Quality**: Assess match quality
      
      Geocoding types:
      - Forward geocoding: Address → Coordinates
      - Reverse geocoding: Coordinates → Address
      - Batch geocoding: Multiple locations
      
      Present results:
      - Input
      - Matched location
      - Coordinates (latitude, longitude)
      - Match quality/confidence
      - Administrative details (city, state, country)
      - Alternative matches (if applicable)

metadata:
  created: "2026-02-10"
  author: "ThemisDB Development Team"
  purpose: "Geographic and spatial analysis prompt templates"
  category: "geographic"
  areas:
    - "location_queries"
    - "spatial_analysis"
    - "distance_calculation"
    - "region_analysis"
    - "route_planning"
    - "geospatial_statistics"
    - "geocoding"
