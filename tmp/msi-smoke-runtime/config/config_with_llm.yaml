# ThemisDB Configuration Example with LLM Support
# Save as config.yaml in your ThemisDB root directory

# Storage Configuration
storage:
  rocksdb_path: "./data/themis_server"
  memtable_size_mb: 128
  block_cache_size_mb: 512
  enable_blobdb: false
  enable_high_parallel_tuning: false
  high_parallel_thread_threshold: 8
  compression:
    default: "lz4"
    bottommost: "zstd"

# Server Configuration  
server:
  host: "0.0.0.0"
  port: 8765
  worker_threads: 4  # 0 = auto-detect

# LLM Configuration (v1.3.0+)
llm:
  enabled: true  # Set to false to disable LLM features
  required: false  # If true, server won't start if LLM init fails
  
  # Model Configuration
  model_path: "models/tinyllama-1.1b-q4_0.gguf"  # Path to GGUF model file
  model_id: "tinyllama"  # Identifier for this model
  
  # Performance Settings
  gpu_layers: 32  # Number of layers to offload to GPU (0 = CPU only)
  context_size: 4096  # Maximum context window size
  threads: 4  # CPU threads for inference
  
  # Features
  enable_caching: true  # Enable response caching (future)
# Feature Flags
features:
  semantic_cache: false
  llm_store: false
  cdc: false
  timeseries: false

# Vector Index Configuration
vector_index:
  object_name: "embeddings"
  dimension: 384  # Match your embedding model dimension
  metric: "COSINE"  # or "L2"
  hnsw_m: 16
  hnsw_ef_construction: 200
  ef_search: 64
  load_on_startup: true
  save_on_shutdown: true
  save_path: "./data/vector_index_embeddings.bin"

# Server-Sent Events (SSE)
sse:
  max_events_per_second: 0  # 0 = unlimited

# Distributed Tracing (OpenTelemetry)
tracing:
  enabled: false
  service_name: "themis-server"
  otlp_endpoint: "http://localhost:4318"
