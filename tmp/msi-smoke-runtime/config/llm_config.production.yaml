# LLM Production Configuration
# Optimized for production workloads with maximum performance

llm:
  llama_wrapper:
    # =====================================================
    # Performance Optimizations
    # =====================================================
    use_flash_attn: true          # Always enabled in production
    use_kv_cache_reuse: true      # Always enabled in production
    enable_embeddings: false      # Separate mode for embeddings
    
    # Speculative Decoding (Phase 2.1)
    use_speculative_decoding: true
    draft_model_path: "/models/llama-2-1b-q4.gguf"
    draft_n_gpu_layers: 32         # More GPU layers in production
    speculative_tokens: 7          # Aggressive speculation
    acceptance_threshold: 0.75     # Lower threshold for speed
    enable_draft_kv_cache: true
    
    # Continuous Batching (Phase 2.2 - Production)
    use_continuous_batching: true
    max_batch_size: 64              # Large batch for high throughput
    max_concurrent_requests: 256    # Handle many requests
    max_tokens_per_batch: 16384     # Large token budget
    scheduler_policy: "priority"    # Priority-based scheduling
    enable_preemption: true         # Preempt low-priority
    enable_chunked_prefill: true    # Handle large prompts
    prefill_chunk_size: 1024        # Larger chunks in production
    
    # Prefix Cache (aggressive for production)
    prefix_cache_config:
      similarity_threshold: 0.98  # Stricter for production
      max_entries: 5000           # More entries
      min_prefix_length: 10       # Cache shorter prefixes
      ttl_seconds: 14400          # 4 hours TTL
      enable_kv_caching: true
    
    # Grammar-Constrained Generation (Phase 3.2)
    # Enabled in production for guaranteed structured outputs
    grammar_config:
      enabled: true                  # Always enabled for APIs
      default_grammar: "json"        # JSON by default
      custom_grammars_path: "/grammars/"
      cache_grammars: true           # Always cache
      max_cached_grammars: 200       # More cache in production
    
    # =====================================================
    # GPU Settings (Production)
    # =====================================================
    n_gpu_layers: 99               # All layers on GPU
    use_mmap: true                 # Fast loading
    use_mlock: false               # Don't lock (let OS manage)
    
    # =====================================================
    # Context Settings (Extended)
    # =====================================================
    n_ctx: 8192                    # Extended context for complex queries
    n_batch: 2048                  # Larger batch for higher throughput
    n_threads: 16                  # More CPU threads
    
    # =====================================================
    # Memory Management (High-End GPU)
    # =====================================================
    max_vram_mb: 81920             # 80GB VRAM (A100)
    unified_memory: false
    
    # =====================================================
    # Lazy Loading (Aggressive Caching)
    # =====================================================
    lazy_loader_config:
      max_vram_mb: 81920           # Full VRAM
      max_ram_mb: 262144           # 256GB RAM
      max_models: 10               # Many models
      model_ttl: 7200              # 2 hours TTL
      enable_lazy_load: true
    
    # =====================================================
    # Multi-LoRA (High Capacity)
    # =====================================================
    multi_lora_config:
      max_adapters: 64             # Many adapters
      adapter_cache_mb: 8192       # 8GB cache
      enable_dynamic_loading: true
