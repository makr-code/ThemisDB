# IT Service Process Models
# =========================
# Process models for IT service management and digital workflows
# Based on ITIL v4 and best practices
#
# Version: 1.1
# Date: 2025-12-24
# Status: Enhanced with LLM Support
#
# LLM Integration: See LLM_INTEGRATION_GUIDE.md for details
# Each model includes prompts, expected outputs, and validation criteria

it_service_models:
  
  # =========================================================================
  # Incident Management (ITIL)
  # =========================================================================
  
  - id: incident_management_standard
    name: "Incident Management (ITIL v4)"
    name_en: "Incident Management (ITIL v4)"
    domain: "IT Service Management"
    domain_en: "IT Service Management"
    description: "Standard-Incident-Management nach ITIL v4"
    description_en: "Standard incident management process according to ITIL v4"
    
    activities:
      - id: "incident_detection"
        name: "Störungserkennung"
        name_en: "Incident Detection"
        type: "start"
        description: "Erkennung und Meldung einer Störung"
        sla_hours: 0
        
      - id: "incident_logging"
        name: "Störungserfassung"
        name_en: "Incident Logging"
        type: "task"
        description: "Erfassung der Störung im System"
        sla_hours: 0.25  # 15 Minuten
        responsible_role: "Service Desk"
        
      - id: "incident_categorization"
        name: "Kategorisierung"
        name_en: "Categorization"
        type: "task"
        description: "Kategorisierung und Priorisierung der Störung"
        sla_hours: 0.5  # 30 Minuten
        responsible_role: "Service Desk"
        
      - id: "initial_diagnosis"
        name: "Erste Diagnose"
        name_en: "Initial Diagnosis"
        type: "task"
        description: "Erste Fehlerdiagnose und -analyse"
        sla_hours: 1
        responsible_role: "Service Desk"
        
      - id: "escalation_l2"
        name: "Eskalation Level 2"
        name_en: "Escalation L2"
        type: "task"
        description: "Eskalation an Second-Level-Support"
        sla_hours: 2
        responsible_role: "L2 Support"
        optional: true
        
      - id: "escalation_l3"
        name: "Eskalation Level 3"
        name_en: "Escalation L3"
        type: "task"
        description: "Eskalation an Third-Level-Support / Entwicklung"
        sla_hours: 8
        responsible_role: "L3 Support"
        optional: true
        
      - id: "resolution"
        name: "Lösung implementieren"
        name_en: "Resolution"
        type: "task"
        description: "Implementierung der Lösung"
        sla_hours: 4
        responsible_role: "Support Team"
        
      - id: "verification"
        name: "Verifizierung"
        name_en: "Verification"
        type: "task"
        description: "Überprüfung der Lösung mit Nutzer"
        sla_hours: 1
        responsible_role: "Service Desk"
        
      - id: "closure"
        name: "Abschluss"
        name_en: "Closure"
        type: "end"
        description: "Abschluss der Störung"
        sla_hours: 0.5
        responsible_role: "Service Desk"
    
    edges:
      - from: "incident_detection"
        to: "incident_logging"
      - from: "incident_logging"
        to: "incident_categorization"
      - from: "incident_categorization"
        to: "initial_diagnosis"
      - from: "initial_diagnosis"
        to: "escalation_l2"
        type: "conditional"
        condition: "requires_escalation"
      - from: "initial_diagnosis"
        to: "resolution"
        type: "conditional"
        condition: "can_resolve"
      - from: "escalation_l2"
        to: "escalation_l3"
        type: "conditional"
        condition: "requires_further_escalation"
      - from: "escalation_l2"
        to: "resolution"
        type: "conditional"
        condition: "can_resolve"
      - from: "escalation_l3"
        to: "resolution"
      - from: "resolution"
        to: "verification"
      - from: "verification"
        to: "closure"
    
    priorities:
      - level: "Critical"
        sla_resolution_hours: 4
        description: "Systemausfall, kritischer Business-Impact"
        
      - level: "High"
        sla_resolution_hours: 8
        description: "Schwerwiegender Fehler, hoher Business-Impact"
        
      - level: "Medium"
        sla_resolution_hours: 24
        description: "Moderater Fehler, mittlerer Business-Impact"
        
      - level: "Low"
        sla_resolution_hours: 72
        description: "Geringer Fehler, niedriger Business-Impact"
    
    compliance:
      - rule: "ITIL v4"
        description: "Incident Management nach ITIL Framework"
        check_type: "process_framework"
        
      - rule: "ISO 20000"
        description: "IT Service Management Standard"
        check_type: "iso_standard"
    
    semantic_tags:
      - "ITIL"
      - "Incident Management"
      - "Service Desk"
      - "IT Support"
      - "SLA Management"
  
  # =========================================================================
  # Change Management
  # =========================================================================
  
  - id: change_management_standard
    name: "Change Management (ITIL v4)"
    name_en: "Change Management (ITIL v4)"
    domain: "IT Service Management"
    domain_en: "IT Service Management"
    description: "Change-Management-Prozess nach ITIL v4"
    
    activities:
      - id: "change_request"
        name: "Change Request erstellen"
        name_en: "Create Change Request"
        type: "start"
        description: "Erstellung eines Change Requests"
        sla_hours: 0
        
      - id: "change_assessment"
        name: "Change-Bewertung"
        name_en: "Change Assessment"
        type: "task"
        description: "Bewertung von Risiken und Auswirkungen"
        sla_hours: 8
        responsible_role: "Change Manager"
        
      - id: "change_authorization"
        name: "Change-Genehmigung"
        name_en: "Change Authorization"
        type: "task"
        description: "Genehmigung durch Change Advisory Board"
        sla_hours: 24
        responsible_role: "CAB"
        
      - id: "change_planning"
        name: "Change-Planung"
        name_en: "Change Planning"
        type: "task"
        description: "Detaillierte Planung der Umsetzung"
        sla_hours: 16
        responsible_role: "Change Manager"
        
      - id: "change_implementation"
        name: "Change-Umsetzung"
        name_en: "Change Implementation"
        type: "task"
        description: "Durchführung der Änderung"
        sla_hours: 8
        responsible_role: "Technical Team"
        
      - id: "change_verification"
        name: "Change-Überprüfung"
        name_en: "Change Verification"
        type: "task"
        description: "Überprüfung der erfolgreichen Umsetzung"
        sla_hours: 4
        responsible_role: "Change Manager"
        
      - id: "change_review"
        name: "Post-Implementation Review"
        name_en: "Post-Implementation Review"
        type: "task"
        description: "Review nach der Umsetzung"
        sla_hours: 24
        responsible_role: "CAB"
        
      - id: "change_closure"
        name: "Change-Abschluss"
        name_en: "Change Closure"
        type: "end"
        description: "Abschluss des Change Requests"
        sla_hours: 2
        responsible_role: "Change Manager"
    
    edges:
      - from: "change_request"
        to: "change_assessment"
      - from: "change_assessment"
        to: "change_authorization"
      - from: "change_authorization"
        to: "change_planning"
      - from: "change_planning"
        to: "change_implementation"
      - from: "change_implementation"
        to: "change_verification"
      - from: "change_verification"
        to: "change_review"
      - from: "change_review"
        to: "change_closure"
    
    change_types:
      - type: "Standard"
        approval_required: false
        description: "Vordefinierte, risikoarme Änderungen"
        
      - type: "Normal"
        approval_required: true
        description: "Reguläre Änderungen mit CAB-Genehmigung"
        
      - type: "Emergency"
        approval_required: true
        description: "Notfall-Änderungen mit verkürztem Prozess"
    
    compliance:
      - rule: "ITIL v4 Change Management"
        description: "Change Management nach ITIL Framework"
        
      - rule: "Separation of Duties"
        description: "Antragsteller und Genehmiger sind verschiedene Personen"
        check_type: "separation_of_duties"
    
    semantic_tags:
      - "ITIL"
      - "Change Management"
      - "CAB"
      - "Release Management"
  
  # =========================================================================
  # Software Development Lifecycle
  # =========================================================================
  
  - id: sdlc_agile_scrum
    name: "Agile Development (Scrum)"
    name_en: "Agile Development (Scrum)"
    domain: "Software Engineering"
    domain_en: "Software Engineering"
    description: "Agiler Entwicklungsprozess nach Scrum Framework"
    
    activities:
      - id: "product_backlog_creation"
        name: "Product Backlog erstellen"
        name_en: "Create Product Backlog"
        type: "start"
        description: "Erstellung und Priorisierung des Product Backlogs"
        sla_hours: 0
        responsible_role: "Product Owner"
        
      - id: "sprint_planning"
        name: "Sprint Planning"
        name_en: "Sprint Planning"
        type: "task"
        description: "Planung des kommenden Sprints"
        sla_hours: 4
        responsible_role: "Scrum Team"
        
      - id: "daily_standup"
        name: "Daily Standup"
        name_en: "Daily Standup"
        type: "task"
        description: "Tägliches Synchronisationstreffen (15 Min.)"
        sla_hours: 0.25
        responsible_role: "Scrum Team"
        recurring: true
        
      - id: "development"
        name: "Entwicklung"
        name_en: "Development"
        type: "task"
        description: "Implementierung der User Stories"
        sla_hours: 160  # 2 Wochen Sprint
        responsible_role: "Development Team"
        
      - id: "code_review"
        name: "Code Review"
        name_en: "Code Review"
        type: "task"
        description: "Peer Review des entwickelten Codes"
        sla_hours: 4
        responsible_role: "Development Team"
        
      - id: "testing"
        name: "Testing"
        name_en: "Testing"
        type: "task"
        description: "Unit-, Integration- und Akzeptanztests"
        sla_hours: 16
        responsible_role: "QA Team"
        
      - id: "sprint_review"
        name: "Sprint Review"
        name_en: "Sprint Review"
        type: "task"
        description: "Vorstellung der Ergebnisse an Stakeholder"
        sla_hours: 2
        responsible_role: "Scrum Team"
        
      - id: "sprint_retrospective"
        name: "Sprint Retrospektive"
        name_en: "Sprint Retrospective"
        type: "task"
        description: "Reflexion und Verbesserung des Prozesses"
        sla_hours: 1.5
        responsible_role: "Scrum Team"
        
      - id: "deployment"
        name: "Deployment"
        name_en: "Deployment"
        type: "end"
        description: "Auslieferung in Produktion"
        sla_hours: 4
        responsible_role: "DevOps Team"
    
    edges:
      - from: "product_backlog_creation"
        to: "sprint_planning"
      - from: "sprint_planning"
        to: "daily_standup"
      - from: "daily_standup"
        to: "development"
      - from: "development"
        to: "code_review"
      - from: "code_review"
        to: "testing"
      - from: "testing"
        to: "sprint_review"
      - from: "sprint_review"
        to: "sprint_retrospective"
      - from: "sprint_retrospective"
        to: "deployment"
      - from: "deployment"
        to: "sprint_planning"
        type: "loop"
    
    scrum_artifacts:
      - name: "Product Backlog"
        description: "Priorisierte Liste aller Anforderungen"
        
      - name: "Sprint Backlog"
        description: "Für den Sprint ausgewählte Items"
        
      - name: "Increment"
        description: "Potenziell auslieferbares Produktinkrement"
    
    compliance:
      - rule: "Scrum Guide"
        description: "Prozess folgt dem offiziellen Scrum Framework"
        
      - rule: "Definition of Done"
        description: "Alle Items erfüllen die Definition of Done"
    
    semantic_tags:
      - "Agile"
      - "Scrum"
      - "Software Development"
      - "DevOps"
      - "Sprint"

# =============================================================================
# Model Metadata
# =============================================================================

metadata:
  version: "1.0"
  last_updated: "2025-12-24"
  author: "ThemisDB Team"
  license: "MIT"
  language: "de-DE"
  
  categories:
    - id: "itsm"
      name: "IT Service Management"
      name_en: "IT Service Management"
      models: ["incident_management_standard", "change_management_standard"]
      
    - id: "software_engineering"
      name: "Software Engineering"
      name_en: "Software Engineering"
      models: ["sdlc_agile_scrum"]
  
  frameworks:
    - name: "ITIL v4"
      description: "IT Infrastructure Library Version 4"
      url: "https://www.axelos.com/certifications/itil-service-management"
      
    - name: "ISO 20000"
      description: "IT Service Management System Standard"
      url: "https://www.iso.org/standard/70636.html"
      
    - name: "Scrum Guide"
      description: "The Definitive Guide to Scrum"
      url: "https://scrumguides.org/"

# =============================================================================
# LLM Integration for IT Service Processes
# =============================================================================

llm_integration:
  # Common prompts for all IT service models
  common_prompts:
    - task: "analyze_sla_compliance"
      prompt: |
        Prüfe die SLA-Einhaltung für diesen IT-Service-Prozess:
        
        Prozess: {process_type}
        Priorität: {priority}
        Trace: {trace}
        SLA: {sla_hours} Stunden
        
        Bewerte:
        1. Wurde das SLA eingehalten?
        2. Wenn nein, um wie viele Stunden wurde es überschritten?
        3. Welche Aktivität verursachte die Verzögerung?
        4. Empfehlungen zur SLA-Verbesserung
      
    - task: "predict_escalation"
      prompt: |
        Basierend auf dem Incident-Verlauf, sage vorher ob eine Eskalation nötig ist:
        
        Bisherige Aktivitäten: {activities}
        Zeit seit Eingang: {elapsed_hours} Stunden
        Priorität: {priority}
        Bisherige Eskalationsstufe: {current_level}
        
        Gib zurück:
        1. Eskalation empfohlen? (ja/nein)
        2. Ziel-Eskalationsstufe (L1/L2/L3)
        3. Begründung
        4. Geschätzte Lösungszeit
    
    - task: "recommend_automation"
      prompt: |
        Analysiere diesen IT-Prozess auf Automatisierungspotenzial:
        
        Prozess: {process_type}
        Häufigkeit: {frequency_per_month}
        Durchschnittliche Dauer: {avg_duration_hours} Stunden
        Manuelle Schritte: {manual_activities}
        
        Identifiziere:
        1. Automatisierbare Aktivitäten
        2. Geschätzte Zeitersparnis
        3. Benötigte Tools/Technologien
        4. Implementierungsaufwand
  
  # Model-specific LLM configurations
  incident_management:
    llm_prompts:
      - task: "categorize_incident"
        prompt: |
          Kategorisiere diesen IT-Incident automatisch:
          
          Beschreibung: {incident_description}
          Betroffene Systeme: {affected_systems}
          Symptome: {symptoms}
          
          Bestimme:
          1. Kategorie (Hardware, Software, Netzwerk, Sicherheit, etc.)
          2. Priorität (Critical, High, Medium, Low)
          3. Zuständiges Team
          4. Geschätzte Lösungszeit basierend auf historischen Daten
        expected_output:
          schema:
            type: "object"
            required: ["category", "priority", "assigned_team"]
            properties:
              category: {enum: ["Hardware", "Software", "Network", "Security", "User_Error", "Other"]}
              priority: {enum: ["Critical", "High", "Medium", "Low"]}
              assigned_team: {type: "string"}
              estimated_resolution_hours: {type: "number"}
              similar_past_incidents: {type: "array"}
    
    llm_test_cases:
      - name: "Critical incident with SLA breach"
        input:
          priority: "Critical"
          trace: ["incident_detection", "incident_logging", "initial_diagnosis", "escalation_l2", "escalation_l3"]
          duration_hours: 6
          sla_hours: 4
        expected_behavior:
          sla_violation: true
          escalation_level: "L3"
          critical_severity: true
      
      - name: "Low priority incident resolved at L1"
        input:
          priority: "Low"
          trace: ["incident_detection", "incident_logging", "initial_diagnosis", "resolution", "closure"]
          duration_hours: 48
          sla_hours: 72
        expected_behavior:
          sla_violation: false
          escalation_needed: false
          resolution_level: "L1"
  
  change_management:
    llm_prompts:
      - task: "assess_change_risk"
        prompt: |
          Bewerte das Risiko dieser IT-Änderung:
          
          Change Request: {change_description}
          Betroffene Systeme: {affected_systems}
          Change-Typ: {change_type}
          Rollback-Plan vorhanden: {has_rollback}
          
          Analysiere:
          1. Risikobewertung (Low, Medium, High, Critical)
          2. Potenzielle Auswirkungen
          3. Empfohlene Zusatzmaßnahmen
          4. Optimaler Zeitpunkt für Durchführung (Wartungsfenster?)
        expected_output:
          schema:
            type: "object"
            required: ["risk_level", "impacts", "recommendations"]
            properties:
              risk_level: {enum: ["Low", "Medium", "High", "Critical"]}
              impacts: {type: "array"}
              recommendations: {type: "array"}
              optimal_timing: {type: "string"}
    
    llm_test_cases:
      - name: "Emergency change without rollback plan"
        input:
          change_type: "Emergency"
          has_rollback: false
          affected_systems: ["production_database"]
        expected_behavior:
          risk_level: "High"
          recommendations_count: ">= 1"
          rollback_warning: true
  
  agile_scrum:
    llm_prompts:
      - task: "predict_sprint_completion"
        prompt: |
          Basierend auf dem Sprint-Fortschritt, sage vorher ob Sprint-Ziele erreicht werden:
          
          Sprint: {sprint_number}
          Geplante Story Points: {planned_points}
          Abgeschlossene Story Points: {completed_points}
          Verbleibende Tage: {days_remaining}
          Team-Velocity: {team_velocity}
          
          Bewerte:
          1. Wahrscheinlichkeit der Sprint-Zielerreichung (%)
          2. Risikofaktoren
          3. Empfohlene Maßnahmen
          4. Anpassungsvorschläge für nächsten Sprint
        expected_output:
          schema:
            type: "object"
            required: ["completion_probability", "risk_factors", "recommendations"]
            properties:
              completion_probability: {type: "number", minimum: 0, maximum: 100}
              at_risk_stories: {type: "array"}
              risk_factors: {type: "array"}
              recommendations: {type: "array"}
    
    llm_test_cases:
      - name: "Sprint on track"
        input:
          planned_points: 40
          completed_points: 35
          days_remaining: 2
          team_velocity: 38
        expected_behavior:
          completion_probability: ">= 80"
          risk_level: "Low"
      
      - name: "Sprint at risk"
        input:
          planned_points: 50
          completed_points: 20
          days_remaining: 2
          team_velocity: 35
        expected_behavior:
          completion_probability: "< 60"
          risk_level: "High"
          recommendations_count: ">= 2"

# LLM Benchmark Criteria for IT Service Models
llm_benchmarks:
  accuracy_requirements:
    incident_categorization: ">= 0.90"
    priority_assignment: ">= 0.85"
    escalation_prediction: ">= 0.80"
    sla_violation_detection: ">= 0.95"
    change_risk_assessment: ">= 0.85"
  
  performance_requirements:
    max_response_time_seconds: 5
    min_throughput_per_minute: 10
  
  quality_requirements:
    explanation_min_length: 50
    recommendation_relevance_score: ">= 0.80"
    false_positive_rate: "< 0.10"
