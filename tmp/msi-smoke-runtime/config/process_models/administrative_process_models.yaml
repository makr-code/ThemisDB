      - "Budget"
      - "Haushaltsplan"
      - "Controlling"
      - "Jährlicher Zyklus"
  
  # =========================================================================
  # Dokumentenfreigabe (Document Approval)
  # =========================================================================
  
  - id: dokumenten_freigabe
    name: "Dokumentenfreigabe (Mehrstufig)"
    name_en: "Document Approval (Multi-Stage)"
    domain: "Dokumentenmanagement"
    domain_en: "Document Management"
    description: "Mehrstufiger Freigabeprozess für Dokumente"
    
    activities:
      - id: "entwurf_erstellen"
        name: "Entwurf erstellen"
        name_en: "Create Draft"
        type: "start"
        sla_hours: 0
        responsible_role: "Autor"
        
      - id: "fachliche_pruefung"
        name: "Fachliche Prüfung"
        name_en: "Technical Review"
        type: "task"
        sla_hours: 48
        responsible_role: "Fachexperte"
        
      - id: "ueberarbeitung"
        name: "Überarbeitung"
        name_en: "Revision"
        type: "task"
        sla_hours: 24
        responsible_role: "Autor"
        optional: true
        
      - id: "rechtliche_pruefung"
        name: "Rechtliche Prüfung"
        name_en: "Legal Review"
        type: "task"
        sla_hours: 72
        responsible_role: "Rechtsabteilung"
        optional: true
        
      - id: "freigabe_abteilungsleiter"
        name: "Freigabe Abteilungsleiter"
        name_en: "Department Head Approval"
        type: "task"
        sla_hours: 48
        responsible_role: "Abteilungsleiter"
        
      - id: "freigabe_geschaeftsfuehrung"
        name: "Freigabe Geschäftsführung"
        name_en: "Management Approval"
        type: "task"
        sla_hours: 72
        responsible_role: "Geschäftsführung"
        optional: true
        
      - id: "veroeffentlichung"
        name: "Veröffentlichung"
        name_en: "Publication"
        type: "end"
        sla_hours: 24
        responsible_role: "Dokumentenmanagement"
    
    edges:
      - from: "entwurf_erstellen"
        to: "fachliche_pruefung"
      - from: "fachliche_pruefung"
        to: "ueberarbeitung"
        type: "conditional"
        condition: "revision_required"
      - from: "fachliche_pruefung"
        to: "rechtliche_pruefung"
        type: "conditional"
        condition: "legal_review_required"
      - from: "fachliche_pruefung"
        to: "freigabe_abteilungsleiter"
        type: "conditional"
        condition: "approved"
      - from: "ueberarbeitung"
        to: "fachliche_pruefung"
      - from: "rechtliche_pruefung"
        to: "freigabe_abteilungsleiter"
      - from: "freigabe_abteilungsleiter"
        to: "freigabe_geschaeftsfuehrung"
        type: "conditional"
        condition: "requires_management_approval"
      - from: "freigabe_abteilungsleiter"
        to: "veroeffentlichung"
        type: "conditional"
        condition: "approved"
      - from: "freigabe_geschaeftsfuehrung"
        to: "veroeffentlichung"
    
    compliance:
      - rule: "Vier-Augen-Prinzip"
        description: "Autor und Genehmiger sind verschiedene Personen"
        check_type: "separation_of_duties"
        activities: ["entwurf_erstellen", "freigabe_abteilungsleiter"]
        
      - rule: "Versionskontrolle"
        description: "Alle Änderungen nachvollziehbar dokumentieren"
        check_type: "audit_trail"
    
    semantic_tags:
      - "Dokumentenmanagement"
      - "Freigabeprozess"
      - "Approval Workflow"
      - "Qualitätssicherung"
      - "Dokumentenverwaltung"

