# Administrative Process Models
# =================================
# Predefined process models for governance and administrative workflows
# Focus: German public administration (Verwaltung) best practices
#
# Version: 1.1
# Date: 2025-12-24
# Status: Enhanced with LLM Support
#
# LLM Integration:
# Each process model includes:
# - llm_prompts: Prompts for LLM to analyze and assist with process
# - expected_outputs: What the LLM should return
# - llm_validation: Criteria to evaluate LLM behavior

administrative_models:
  
  # =========================================================================
  # Bauantragsverfahren (Building Permit Processes)
  # =========================================================================
  
  - id: bauantrag_standard
    name: "Bauantrag (Standard)"
    name_en: "Building Permit (Standard)"
    domain: "Bauwesen"
    domain_en: "Construction"
    description: "Standard-Bauantragsverfahren nach §34 BauO"
    description_en: "Standard building permit process according to §34 BauO"
    
    activities:
      - id: "antragstellung"
        name: "Antragstellung"
        name_en: "Application Submission"
        type: "start"
        description: "Eingang des Bauantrags"
        sla_hours: 0
        
      - id: "vollstaendigkeitspruefung"
        name: "Vollständigkeitsprüfung"
        name_en: "Completeness Check"
        type: "task"
        description: "Prüfung der Vollständigkeit der Unterlagen"
        sla_hours: 48
        responsible_role: "Sachbearbeiter"
        
      - id: "nachforderung"
        name: "Nachforderung fehlender Unterlagen"
        name_en: "Request Missing Documents"
        type: "task"
        description: "Anfordern fehlender Dokumente beim Antragsteller"
        sla_hours: 24
        optional: true
        
      - id: "fachliche_pruefung"
        name: "Fachliche Prüfung"
        name_en: "Technical Review"
        type: "task"
        description: "Technische und rechtliche Prüfung des Bauvorhabens"
        sla_hours: 2160  # 90 Tage
        responsible_role: "Fachprüfer"
        
      - id: "stellungnahmen"
        name: "Einholung von Stellungnahmen"
        name_en: "Obtain Statements"
        type: "task"
        description: "Stellungnahmen von Behörden und Nachbarn"
        sla_hours: 720  # 30 Tage
        optional: true
        
      - id: "genehmigung"
        name: "Genehmigung"
        name_en: "Approval"
        type: "end"
        description: "Erteilung der Baugenehmigung"
        sla_hours: 24
        responsible_role: "Amtsleiter"
        
      - id: "ablehnung"
        name: "Ablehnung"
        name_en: "Rejection"
        type: "end"
        description: "Ablehnung des Bauantrags"
        sla_hours: 24
        responsible_role: "Amtsleiter"
    
    edges:
      - from: "antragstellung"
        to: "vollstaendigkeitspruefung"
        type: "sequence"
        
      - from: "vollstaendigkeitspruefung"
        to: "nachforderung"
        type: "conditional"
        condition: "incomplete"
        
      - from: "vollstaendigkeitspruefung"
        to: "fachliche_pruefung"
        type: "conditional"
        condition: "complete"
        
      - from: "nachforderung"
        to: "vollstaendigkeitspruefung"
        type: "sequence"
        
      - from: "fachliche_pruefung"
        to: "stellungnahmen"
        type: "conditional"
        condition: "requires_statements"
        
      - from: "fachliche_pruefung"
        to: "genehmigung"
        type: "conditional"
        condition: "approved"
        
      - from: "fachliche_pruefung"
        to: "ablehnung"
        type: "conditional"
        condition: "rejected"
        
      - from: "stellungnahmen"
        to: "fachliche_pruefung"
        type: "sequence"
    
    milestones:
      - id: "M1"
        name: "Antragseingang"
        activity: "antragstellung"
        sla_hours: 0
        
      - id: "M2"
        name: "Vollständigkeit bestätigt"
        activity: "vollstaendigkeitspruefung"
        sla_hours: 168  # 7 Tage nach Eingang
        
      - id: "M3"
        name: "Bescheid erteilt"
        activity: ["genehmigung", "ablehnung"]
        sla_hours: 2160  # 90 Tage nach Eingang
    
    compliance:
      - rule: "§34 BauO"
        description: "Genehmigung binnen 3 Monaten nach Antragseingang"
        check_type: "sla"
        max_duration_hours: 2160
        
      - rule: "Vier-Augen-Prinzip"
        description: "Prüfung und Genehmigung durch unterschiedliche Personen"
        check_type: "separation_of_duties"
        activities: ["fachliche_pruefung", "genehmigung"]
        
      - rule: "Dokumentationspflicht"
        description: "Alle Entscheidungen müssen dokumentiert werden"
        check_type: "audit_trail"
        activities: ["all"]
    
    semantic_tags:
      - "öffentliche Verwaltung"
      - "Baugenehmigung"
      - "Baurecht"
      - "Behördenverfahren"
      - "Genehmigungsverfahren"
    
    # =========================================================================
    # LLM Integration for Process Support
    # =========================================================================
    
    llm_prompts:
      # Process Analysis Prompt
      - task: "analyze_process"
        prompt: |
          Analysiere den folgenden Bauantrags-Prozess und identifiziere:
          1. Abweichungen vom Standard-Prozessmodell (Bauantrag Standard nach §34 BauO)
          2. Fehlende oder übersprungene Aktivitäten
          3. Compliance-Verstöße (Vier-Augen-Prinzip, Dokumentationspflicht, SLA-Überschreitungen)
          4. Mögliche Prozessoptimierungen
          
          Prozessdaten:
          {process_trace}
          
          Erwartete Aktivitäten: Antragstellung → Vollständigkeitsprüfung → Fachliche Prüfung → Genehmigung/Ablehnung
        context:
          model_id: "bauantrag_standard"
          compliance_rules: ["§34 BauO", "Vier-Augen-Prinzip", "Dokumentationspflicht"]
          max_sla_days: 90
      
      # Conformance Checking Prompt
      - task: "check_conformance"
        prompt: |
          Prüfe die Konformität dieses Bauantrags-Prozesses:
          
          Prozess-Trace: {trace}
          
          Erwarteter Standard-Ablauf:
          1. Antragstellung (Start)
          2. Vollständigkeitsprüfung (innerhalb 48h)
          3. Optional: Nachforderung fehlender Unterlagen
          4. Fachliche Prüfung (innerhalb 90 Tagen)
          5. Optional: Einholung von Stellungnahmen
          6. Genehmigung oder Ablehnung (Ende)
          
          Bewerte:
          - Fitness Score (0-1): Wie gut passt der Trace zum Modell?
          - Precision Score (0-1): Wie präzise folgt der Trace dem Modell?
          - Liste aller Abweichungen mit Schweregrad (critical, major, minor)
        context:
          model_type: "building_permit"
          strictness: "high"
      
      # Prediction Prompt
      - task: "predict_next_activity"
        prompt: |
          Basierend auf dem bisherigen Prozessverlauf, sage die nächste Aktivität vorher:
          
          Bisherige Aktivitäten: {completed_activities}
          Aktuelle Aktivität: {current_activity}
          Prozessmodell: Bauantrag Standard (§34 BauO)
          
          Gib zurück:
          1. Top 3 wahrscheinlichste nächste Aktivitäten mit Wahrscheinlichkeiten
          2. Begründung für jede Vorhersage
          3. Geschätzte Dauer bis zur nächsten Aktivität
          4. Risikofaktoren oder Warnungen
        context:
          use_historical_data: true
          consider_sla: true
      
      # Recommendation Prompt  
      - task: "recommend_optimization"
        prompt: |
          Analysiere den Bauantrags-Prozess und gib Optimierungsempfehlungen:
          
          Prozessdaten: {process_data}
          Performance-Metriken: {performance_metrics}
          
          Identifiziere:
          1. Bottlenecks (Aktivitäten mit längsten Wartezeiten)
          2. Parallelisierungsmöglichkeiten
          3. Automatisierungspotenziale
          4. SLA-Risiken
          
          Priorisiere Empfehlungen nach:
          - Zeitersparnis
          - Implementierungsaufwand
          - Compliance-Sicherheit
        context:
          focus_areas: ["efficiency", "compliance", "customer_satisfaction"]
    
    expected_outputs:
      analyze_process:
        format: "json"
        schema:
          type: "object"
          required: ["conformance_score", "deviations", "compliance_issues", "recommendations"]
          properties:
            conformance_score:
              type: "number"
              minimum: 0
              maximum: 1
              description: "Overall conformance score (0-1)"
            deviations:
              type: "array"
              items:
                type: "object"
                properties:
                  activity: {type: "string"}
                  issue: {type: "string"}
                  severity: {enum: ["critical", "major", "minor"]}
                  expected: {type: "string"}
                  actual: {type: "string"}
            compliance_issues:
              type: "array"
              items:
                type: "object"
                properties:
                  rule: {type: "string"}
                  violated: {type: "boolean"}
                  description: {type: "string"}
            recommendations:
              type: "array"
              items:
                type: "object"
                properties:
                  type: {enum: ["process_change", "automation", "training"]}
                  priority: {enum: ["high", "medium", "low"]}
                  description: {type: "string"}
                  expected_impact: {type: "string"}
        
        validation_criteria:
          - check: "conformance_score_range"
            description: "Conformance score must be between 0 and 1"
            test: "0 <= output.conformance_score <= 1"
          
          - check: "deviations_completeness"
            description: "All deviations must have activity, issue, and severity"
            test: "all(d.activity and d.issue and d.severity for d in output.deviations)"
          
          - check: "compliance_coverage"
            description: "Must check all compliance rules"
            test: "set(c.rule for c in output.compliance_issues) >= {'§34 BauO', 'Vier-Augen-Prinzip', 'Dokumentationspflicht'}"
          
          - check: "recommendations_quality"
            description: "Recommendations must be actionable and prioritized"
            test: "all(r.priority and r.description for r in output.recommendations)"
      
      check_conformance:
        format: "json"
        schema:
          type: "object"
          required: ["fitness", "precision", "deviations"]
          properties:
            fitness: {type: "number", minimum: 0, maximum: 1}
            precision: {type: "number", minimum: 0, maximum: 1}
            deviations: {type: "array"}
        
        validation_criteria:
          - check: "fitness_accuracy"
            description: "Fitness should reflect actual conformance"
            test: "0 <= output.fitness <= 1"
          
          - check: "deviation_detection"
            description: "Must identify critical deviations"
            test: "any(d.severity == 'critical' for d in output.deviations if not conformant)"
      
      predict_next_activity:
        format: "json"
        schema:
          type: "object"
          required: ["predictions", "reasoning"]
          properties:
            predictions:
              type: "array"
              minItems: 1
              maxItems: 3
              items:
                type: "object"
                properties:
                  activity: {type: "string"}
                  probability: {type: "number", minimum: 0, maximum: 1}
                  estimated_duration_hours: {type: "number"}
            reasoning: {type: "string"}
            warnings: {type: "array", items: {type: "string"}}
        
        validation_criteria:
          - check: "probability_sum"
            description: "Probabilities should sum to approximately 1"
            test: "0.95 <= sum(p.probability for p in output.predictions) <= 1.05"
          
          - check: "valid_activities"
            description: "Predicted activities must exist in process model"
            test: "all(p.activity in valid_activities for p in output.predictions)"
      
      recommend_optimization:
        format: "json"
        schema:
          type: "object"
          required: ["bottlenecks", "recommendations"]
          properties:
            bottlenecks:
              type: "array"
              items:
                type: "object"
                properties:
                  activity: {type: "string"}
                  avg_duration_hours: {type: "number"}
                  impact: {enum: ["high", "medium", "low"]}
            recommendations:
              type: "array"
              items:
                type: "object"
                properties:
                  title: {type: "string"}
                  description: {type: "string"}
                  priority: {enum: ["high", "medium", "low"]}
                  time_savings_percent: {type: "number"}
                  implementation_effort: {enum: ["low", "medium", "high"]}
        
        validation_criteria:
          - check: "bottleneck_identification"
            description: "Must identify at least top bottleneck if exists"
            test: "len(output.bottlenecks) > 0 if process_has_bottlenecks"
          
          - check: "recommendation_feasibility"
            description: "Recommendations must be realistic"
            test: "all(0 <= r.time_savings_percent <= 80 for r in output.recommendations)"
    
    llm_test_cases:
      - name: "Standard conformant process"
        input_trace: ["antragstellung", "vollstaendigkeitspruefung", "fachliche_pruefung", "genehmigung"]
        expected_behavior:
          conformance_score: ">= 0.95"
          deviations_count: "== 0"
          compliance_issues_count: "== 0"
      
      - name: "Process with missing completeness check"
        input_trace: ["antragstellung", "fachliche_pruefung", "genehmigung"]
        expected_behavior:
          conformance_score: "< 0.7"
          deviations_count: ">= 1"
          critical_deviation: "vollstaendigkeitspruefung skipped"
      
      - name: "Process exceeding SLA"
        input_trace: ["antragstellung", "vollstaendigkeitspruefung", "fachliche_pruefung", "genehmigung"]
        duration_days: 120
        expected_behavior:
          compliance_issues_count: ">= 1"
          sla_violation_detected: true
          violated_rule: "§34 BauO"
      
      - name: "Four-eyes principle violation"
        input_trace: ["antragstellung", "vollstaendigkeitspruefung", "fachliche_pruefung", "genehmigung"]
        same_person: ["fachliche_pruefung", "genehmigung"]
        expected_behavior:
          compliance_issues_count: ">= 1"
          violated_rule: "Vier-Augen-Prinzip"
          severity: "critical"
  
  # =========================================================================
  # Beschaffungsprozesse (Procurement)
  # =========================================================================
  
  - id: beschaffung_vergaberecht
    name: "Beschaffung (Vergaberecht konform)"
    name_en: "Procurement (Compliant with Public Procurement Law)"
    domain: "Beschaffung"
    domain_en: "Procurement"
    description: "Beschaffungsprozess nach GWB und VOB/A"
    
    activities:
      - id: "bedarfsanforderung"
        name: "Bedarfsanforderung"
        name_en: "Purchase Request"
        type: "start"
        description: "Fachabteilung meldet Bedarf an"
        sla_hours: 0
        
      - id: "budgetpruefung"
        name: "Budgetprüfung"
        name_en: "Budget Check"
        type: "task"
        description: "Prüfung der Budgetverfügbarkeit"
        sla_hours: 24
        responsible_role: "Controlling"
        
      - id: "vergabeart_festlegen"
        name: "Vergabeart festlegen"
        name_en: "Determine Procurement Type"
        type: "task"
        description: "Entscheidung: Direktauftrag, beschränkte Ausschreibung, offenes Verfahren"
        sla_hours: 48
        responsible_role: "Vergabestelle"
        
      - id: "angebotseinholung"
        name: "Angebotseinholung"
        name_en: "Request for Proposals"
        type: "task"
        description: "Einholen von Angeboten"
        sla_hours: 336  # 14 Tage
        responsible_role: "Einkauf"
        
      - id: "angebotspruefung"
        name: "Angebotsprüfung"
        name_en: "Proposal Evaluation"
        type: "task"
        description: "Technische und wirtschaftliche Prüfung"
        sla_hours: 120  # 5 Tage
        responsible_role: "Einkauf + Fachabteilung"
        
      - id: "zuschlag"
        name: "Zuschlagserteilung"
        name_en: "Award Contract"
        type: "task"
        description: "Vergabeentscheidung und Zuschlag"
        sla_hours: 48
        responsible_role: "Vergabestelle"
        
      - id: "bestellung"
        name: "Bestellung"
        name_en: "Purchase Order"
        type: "task"
        description: "Formelle Bestellung auslösen"
        sla_hours: 24
        responsible_role: "Einkauf"
        
      - id: "wareneingang"
        name: "Wareneingang"
        name_en: "Goods Receipt"
        type: "end"
        description: "Lieferung und Wareneingang prüfen"
        sla_hours: 0
    
    edges:
      - from: "bedarfsanforderung"
        to: "budgetpruefung"
      - from: "budgetpruefung"
        to: "vergabeart_festlegen"
      - from: "vergabeart_festlegen"
        to: "angebotseinholung"
      - from: "angebotseinholung"
        to: "angebotspruefung"
      - from: "angebotspruefung"
        to: "zuschlag"
      - from: "zuschlag"
        to: "bestellung"
      - from: "bestellung"
        to: "wareneingang"
    
    compliance:
      - rule: "GWB §119 Schwellenwerte"
        description: "Bei Überschreiten der EU-Schwellenwerte offenes Verfahren"
        check_type: "threshold"
        threshold_eur: 214000
        
      - rule: "VOB/A Dokumentation"
        description: "Vollständige Dokumentation des Vergabeverfahrens"
        check_type: "audit_trail"
        
      - rule: "Vier-Augen-Prinzip"
        description: "Angebotsprüfung und Zuschlag durch verschiedene Personen"
        check_type: "separation_of_duties"
        activities: ["angebotspruefung", "zuschlag"]
    
    semantic_tags:
      - "Beschaffung"
      - "Vergaberecht"
      - "GWB"
      - "VOB/A"
      - "öffentlicher Einkauf"
  
