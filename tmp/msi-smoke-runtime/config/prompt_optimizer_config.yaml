# Prompt Optimizer Configuration
# Settings for the prompt engineering and optimization framework

optimizer:
  # Maximum number of optimization iterations
  max_iterations: 5
  
  # Minimum improvement threshold to continue optimization (0.0-1.0)
  min_improvement: 0.05
  
  # Target quality score to achieve (0.0-1.0)
  target_score: 0.9
  
  # Enable version control and history tracking
  enable_version_control: true
  
  # Number of test cases for evaluation
  num_test_cases: 10

evaluator:
  # Weight for semantic similarity metric (0.0-1.0)
  similarity_weight: 0.5
  
  # Weight for exact match metric (0.0-1.0)
  exact_match_weight: 0.3
  
  # Weight for relevance metric (0.0-1.0)
  relevance_weight: 0.2
  
  # Minimum score threshold to pass evaluation (0.0-1.0)
  pass_threshold: 0.7
  
  # Enable statistical significance testing
  enable_statistical_tests: true
  
  # Confidence level for statistical tests (e.g., 0.95 for 95%)
  confidence_level: 0.95

fewshot:
  # Maximum number of examples to select
  max_examples: 5
  
  # Minimum number of examples required
  min_examples: 1
  
  # Weight for diversity in selection (0.0-1.0)
  diversity_weight: 0.4
  
  # Weight for relevance in selection (0.0-1.0)
  relevance_weight: 0.6
  
  # Enable example caching for performance
  enable_caching: true
  
  # Maximum number of cached examples
  cache_size: 1000

meta_prompt:
  # Improvement strategy: "iterative", "analytical", or "creative"
  improvement_strategy: "iterative"
  
  # Include few-shot examples in meta-prompt
  include_examples: true
  
  # Include constraints in meta-prompt
  include_constraints: true
  
  # Maximum length of generated meta-prompt (characters)
  max_prompt_length: 2000

# Performance tuning
performance:
  # Enable parallel evaluation for large test sets
  enable_parallel_eval: false
  
  # Number of threads for parallel evaluation
  num_threads: 4
  
  # Batch size for evaluation
  batch_size: 100

# Logging and monitoring
logging:
  # Log level: "debug", "info", "warning", "error"
  level: "info"
  
  # Log optimization progress
  log_iterations: true
  
  # Log evaluation metrics
  log_metrics: true
  
  # Export metrics for monitoring (Prometheus, etc.)
  export_metrics: false
