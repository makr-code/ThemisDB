# =============================================================================
# ThemisDB Legal Training Data Schema
# =============================================================================
# Multi-model schema for training domain-specific LoRA adapters on German
# legal language. Combines document storage, knowledge graph relationships,
# and vector embeddings in a unified architecture.
#
# Version: 1.0.0
# Author: ThemisDB Team
# Created: 2026-02-12
# =============================================================================

version: "1.0.0"

metadata:
  name: legal-training-schema
  description: "Schema for legal LoRA training with multi-model support"
  author: "themisdb-team@example.com"
  created_at: "2026-02-12T10:00:00Z"
  use_case: "Legal language LoRA training and knowledge graph"

# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================
config:
  storage:
    engine: rocksdb
    compression: zstd
    cache_size_mb: 2048
  
  transaction:
    isolation_level: snapshot
    timeout_ms: 10000
    max_retries: 3
  
  vector:
    default_dimensions: 768
    default_metric: cosine
    default_index_type: hnsw

# =============================================================================
# DOCUMENT MODEL: Legal Texts and Training Data
# =============================================================================
tables:
  # Legal documents (source texts)
  legal_documents:
    description: "Source legal texts (laws, regulations, case law, custom documents)"
    primary_key: document_id
    
    fields:
      document_id:
        type: string
        format: uuid
        required: true
      
      text:
        type: text
        required: true
        description: "Full text of the legal document"
      
      source:
        type: string
        required: true
        description: "Source identifier (e.g., HuggingFace dataset ID, file path)"
      
      source_type:
        type: string
        required: false
        enum: ["huggingface", "filesystem", "api", "custom"]
        description: "Type of data source"
      
      title:
        type: string
        required: false
      
      document_type:
        type: string
        required: false
        enum: ["law", "regulation", "case_law", "custom"]
      
      date:
        type: string
        format: iso8601
        required: false
      
      authority:
        type: string
        required: false
        description: "Issuing authority (e.g., Bundesministerium)"
      
      tags:
        type: array
        items: string
        required: false
      
      priority:
        type: integer
        default: 0
        description: "Processing priority (higher = process first)"
      
      raw_data:
        type: boolean
        default: true
        description: "True if not yet labeled/processed"
      
      labeled_at:
        type: timestamp
        required: false
      
      samples_created:
        type: integer
        default: 0
      
      metadata:
        type: object
        required: false
      
      embedding:
        type: vector
        dimensions: 768
        required: false
        description: "E5-multilingual-base embedding"
      
      created_at:
        type: timestamp
        required: true
        default: now()
      
      updated_at:
        type: timestamp
        required: false
    
    indexes:
      - name: idx_legal_documents_source
        columns: [source]
        type: secondary
      
      - name: idx_legal_documents_source_type
        columns: [source_type]
        type: secondary
      
      - name: idx_legal_documents_tags
        columns: [tags]
        type: secondary
      
      - name: idx_legal_documents_raw_data
        columns: [raw_data]
        type: secondary
      
      - name: idx_legal_documents_date
        columns: [date]
        type: secondary
      
      - name: idx_legal_documents_priority
        columns: [priority]
        type: secondary
      
      - name: idx_legal_documents_text
        columns: [text]
        type: fulltext
        language: de
      
      - name: idx_legal_documents_title
        columns: [title]
        type: fulltext
        language: de
      
      - name: idx_legal_documents_embedding
        columns: [embedding]
        type: vector
        algorithm: hnsw
        config:
          m: 16
          ef_construction: 200
          ef_search: 100
          metric: cosine

  # Structural elements: paragraphs
  paragraphs:
    description: "Document paragraphs for structural analysis"
    primary_key: paragraph_id
    
    fields:
      paragraph_id:
        type: string
        format: uuid
        required: true
      
      document_id:
        type: string
        format: uuid
        required: true
      
      index:
        type: integer
        required: true
        description: "Paragraph number within document"
      
      text:
        type: text
        required: true
      
      start_char:
        type: integer
        required: false
      
      end_char:
        type: integer
        required: false
    
    indexes:
      - name: idx_paragraphs_document
        columns: [document_id]
        type: secondary
    
    relationships:
      - name: belongs_to_document
        target_table: legal_documents
        type: many_to_one
        foreign_key: document_id
        target_key: document_id
        on_delete: cascade

  # Structural elements: sentences
  sentences:
    description: "Individual sentences for fine-grained analysis"
    primary_key: sentence_id
    
    fields:
      sentence_id:
        type: string
        format: uuid
        required: true
      
      paragraph_id:
        type: string
        format: uuid
        required: true
      
      index:
        type: integer
        required: true
      
      text:
        type: text
        required: true
      
      start_char:
        type: integer
        required: false
      
      end_char:
        type: integer
        required: false
    
    indexes:
      - name: idx_sentences_paragraph
        columns: [paragraph_id]
        type: secondary
    
    relationships:
      - name: belongs_to_paragraph
        target_table: paragraphs
        type: many_to_one
        foreign_key: paragraph_id
        target_key: paragraph_id
        on_delete: cascade

  # Legal entities: provisions
  legal_provisions:
    description: "Legal provisions and regulations (e.g., § 242 BGB)"
    primary_key: provision_id
    
    fields:
      provision_id:
        type: string
        required: true
      
      law:
        type: string
        required: false
        description: "Law code (e.g., BGB, StGB, GG)"
      
      section:
        type: string
        required: false
        description: "Section/article reference (e.g., § 242)"
      
      text:
        type: text
        required: false
      
      interpretation:
        type: text
        required: false
      
      created_at:
        type: timestamp
        required: true
        default: now()
    
    indexes:
      - name: idx_legal_provisions_law
        columns: [law]
        type: secondary
      
      - name: idx_legal_provisions_section
        columns: [section]
        type: secondary

  # Modal verbs for normative analysis
  modal_verbs:
    description: "Modal verbs extracted from sentences for normative analysis"
    primary_key: modal_verb_id
    
    fields:
      modal_verb_id:
        type: string
        format: uuid
        required: true
      
      verb:
        type: string
        required: true
      
      category:
        type: string
        required: true
        enum: ["obligation", "permission", "prohibition"]
      
      strength:
        type: float
        required: false
        description: "Normative strength [0, 1]"
        validation:
          min: 0.0
          max: 1.0
      
      deontic_logic:
        type: string
        required: false
        enum: ["MUST", "MAY", "MUST_NOT", "SHOULD", "SHOULD_NOT"]
      
      interpretation:
        type: text
        required: false
      
      position:
        type: integer
        required: false
      
      sentence_id:
        type: string
        format: uuid
        required: false
    
    indexes:
      - name: idx_modal_verbs_category
        columns: [category]
        type: secondary
      
      - name: idx_modal_verbs_sentence
        columns: [sentence_id]
        type: secondary
    
    relationships:
      - name: appears_in_sentence
        target_table: sentences
        type: many_to_one
        foreign_key: sentence_id
        target_key: sentence_id
        on_delete: set_null

  # Case law
  case_law:
    description: "Court decisions and case law"
    primary_key: case_id
    
    fields:
      case_id:
        type: string
        required: true
      
      court:
        type: string
        required: false
      
      date:
        type: string
        format: iso8601
        required: false
      
      summary:
        type: text
        required: false
      
      full_text:
        type: text
        required: false
      
      provisions_cited:
        type: array
        items: string
        required: false
      
      created_at:
        type: timestamp
        required: true
        default: now()
    
    indexes:
      - name: idx_case_law_court
        columns: [court]
        type: secondary
      
      - name: idx_case_law_date
        columns: [date]
        type: secondary

  # Training samples (auto-labeled and enriched)
  legal_training_samples:
    description: "Training data for LoRA adapters (auto-labeled and enriched)"
    primary_key: sample_id
    
    fields:
      sample_id:
        type: string
        format: uuid
        required: true
      
      input:
        type: text
        required: true
      
      output:
        type: text
        required: true
      
      category:
        type: string
        required: true
        enum: ["obligation", "permission", "prohibition"]
      
      strength:
        type: float
        required: false
        validation:
          min: 0.0
          max: 1.0
      
      source_doc_id:
        type: string
        format: uuid
        required: false
      
      source_type:
        type: string
        required: false
        enum: ["huggingface", "custom", "legacy"]
      
      auto_labeled:
        type: boolean
        default: true
      
      confidence:
        type: float
        required: false
        description: "Confidence score [0, 1]"
        validation:
          min: 0.0
          max: 1.0
      
      needs_review:
        type: boolean
        default: false
      
      reviewed_by:
        type: string
        required: false
      
      review_date:
        type: timestamp
        required: false
      
      context:
        type: text
        required: false
        description: "Legal interpretation context"
      
      graph_context:
        type: text
        required: false
        description: "Added by graph enricher"
      
      enrichment_sources:
        type: integer
        default: 0
      
      context_quality_score:
        type: float
        required: false
        validation:
          min: 0.0
          max: 1.0
      
      embedding:
        type: vector
        dimensions: 768
        required: false
      
      created_at:
        type: timestamp
        required: true
        default: now()
      
      updated_at:
        type: timestamp
        required: false
    
    indexes:
      - name: idx_training_samples_category
        columns: [category]
        type: secondary
      
      - name: idx_training_samples_source_type
        columns: [source_type]
        type: secondary
      
      - name: idx_training_samples_confidence
        columns: [confidence]
        type: secondary
      
      - name: idx_training_samples_needs_review
        columns: [needs_review]
        type: secondary
      
      - name: idx_training_samples_auto_labeled
        columns: [auto_labeled]
        type: secondary
      
      - name: idx_training_samples_input
        columns: [input]
        type: fulltext
        language: de
      
      - name: idx_training_samples_embedding
        columns: [embedding]
        type: vector
        algorithm: hnsw
        config:
          m: 16
          ef_construction: 200
          ef_search: 100
          metric: cosine
    
    relationships:
      - name: derived_from_document
        target_table: legal_documents
        type: many_to_one
        foreign_key: source_doc_id
        target_key: document_id
        on_delete: set_null

  # Modal verb annotations
  modal_verb_annotations:
    description: "Annotations extracted by NLP Analyzer"
    primary_key: annotation_id
    
    fields:
      annotation_id:
        type: string
        format: uuid
        required: true
      
      document_id:
        type: string
        format: uuid
        required: true
      
      verb:
        type: string
        required: true
      
      category:
        type: string
        required: true
        enum: ["obligation", "permission", "prohibition"]
      
      position:
        type: integer
        required: false
      
      context_before:
        type: string
        required: false
      
      context_after:
        type: string
        required: false
      
      deontic_logic:
        type: string
        required: false
        enum: ["MUST", "MAY", "MUST_NOT", "SHOULD", "SHOULD_NOT"]
      
      interpretation:
        type: text
        required: false
      
      confidence:
        type: float
        required: false
        validation:
          min: 0.0
          max: 1.0
      
      sentence_index:
        type: integer
        required: false
      
      created_at:
        type: timestamp
        required: true
        default: now()
    
    indexes:
      - name: idx_annotations_document
        columns: [document_id]
        type: secondary
      
      - name: idx_annotations_category
        columns: [category]
        type: secondary
    
    relationships:
      - name: annotates_document
        target_table: legal_documents
        type: many_to_one
        foreign_key: document_id
        target_key: document_id
        on_delete: cascade

  # Ingestion metadata
  ingestion_metadata:
    description: "Track data ingestion from various sources"
    primary_key: ingestion_id
    
    fields:
      ingestion_id:
        type: string
        format: uuid
        required: true
      
      source_id:
        type: string
        required: true
      
      source_type:
        type: string
        required: false
        enum: ["huggingface", "filesystem", "api", "custom"]
      
      last_ingested:
        type: timestamp
        required: false
      
      documents_count:
        type: integer
        default: 0
      
      status:
        type: string
        required: false
        enum: ["pending", "in_progress", "completed", "failed"]
      
      error_message:
        type: text
        required: false
      
      config:
        type: object
        required: false
      
      created_at:
        type: timestamp
        required: true
        default: now()
      
      updated_at:
        type: timestamp
        required: false
    
    indexes:
      - name: idx_ingestion_source
        columns: [source_id]
        type: secondary
      
      - name: idx_ingestion_status
        columns: [status]
        type: secondary

  # LoRA adapter metadata
  lora_adapters:
    description: "Metadata for trained LoRA adapters"
    primary_key: adapter_id
    
    fields:
      adapter_id:
        type: string
        required: true
      
      base_model:
        type: string
        required: true
      
      domain:
        type: string
        required: false
        description: "Legal domain (e.g., 'Verwaltungsrecht', 'Strafrecht')"
      
      rank:
        type: integer
        required: false
        description: "LoRA rank parameter"
      
      alpha:
        type: float
        required: false
        description: "LoRA alpha parameter"
      
      training_samples:
        type: integer
        default: 0
      
      validation_accuracy:
        type: float
        required: false
        validation:
          min: 0.0
          max: 1.0
      
      embedding:
        type: vector
        dimensions: 768
        required: false
        description: "Adapter embedding for semantic routing"
      
      metadata:
        type: object
        required: false
      
      created_at:
        type: timestamp
        required: true
        default: now()
      
      version:
        type: string
        required: false
    
    indexes:
      - name: idx_lora_adapters_base_model
        columns: [base_model]
        type: secondary
      
      - name: idx_lora_adapters_domain
        columns: [domain]
        type: secondary
      
      - name: idx_lora_adapters_embedding
        columns: [embedding]
        type: vector
        algorithm: hnsw
        config:
          m: 16
          ef_construction: 200
          ef_search: 100
          metric: cosine

# =============================================================================
# GRAPH MODEL: Relationships
# =============================================================================
graphs:
  legal_knowledge_graph:
    description: "Knowledge graph connecting legal entities"
    
    vertices:
      - legal_documents
      - paragraphs
      - sentences
      - modal_verbs
      - legal_provisions
      - case_law
    
    edges:
      contains_paragraphs:
        description: "Document contains paragraphs"
        from: legal_documents
        to: paragraphs
        type: one_to_many
      
      contains_sentences:
        description: "Paragraph contains sentences"
        from: paragraphs
        to: sentences
        type: one_to_many
      
      has_modality_sentences:
        description: "Sentence has modal verbs"
        from: sentences
        to: modal_verbs
        type: one_to_many
        properties:
          confidence:
            type: float
      
      has_modality_paragraphs:
        description: "Paragraph has modal verbs"
        from: paragraphs
        to: modal_verbs
        type: one_to_many
        properties:
          confidence:
            type: float
      
      references:
        description: "Document references legal provisions"
        from: legal_documents
        to: legal_provisions
        type: many_to_many
        properties:
          context:
            type: text
      
      interprets:
        description: "Case law interprets provisions"
        from: case_law
        to: legal_provisions
        type: many_to_many
        properties:
          interpretation_type:
            type: string
      
      similar_to:
        description: "Documents similar to each other"
        from: legal_documents
        to: legal_documents
        type: many_to_many
        properties:
          similarity_score:
            type: float
            validation:
              min: 0.0
              max: 1.0
      
      supersedes:
        description: "Document version history"
        from: legal_documents
        to: legal_documents
        type: one_to_many
        properties:
          effective_date:
            type: string
            format: iso8601
      
      cited_in:
        description: "Provision cited in case law"
        from: legal_provisions
        to: case_law
        type: one_to_many

# =============================================================================
# VIEWS: Convenient Data Access
# =============================================================================
views:
  legal_training_view:
    description: "Training data enriched with graph context"
    query: |
      FOR sample IN legal_training_samples
        LET doc = DOCUMENT(legal_documents, sample.source_doc_id)
        LET modalities = (
          FOR v, e IN 1..2 OUTBOUND doc GRAPH 'legal_knowledge_graph'
            FILTER IS_SAME_COLLECTION('modal_verbs', v)
            RETURN v
        )
        LET related = (
          FOR v, e IN 1..2 OUTBOUND doc GRAPH 'legal_knowledge_graph'
            FILTER e._collection IN ['references', 'similar_to']
            LIMIT 5
            RETURN v
        )
        RETURN MERGE(sample, {
          document: doc,
          modalities: modalities,
          related_docs: related
        })
  
  samples_needing_review:
    description: "Samples that need human review"
    query: |
      FOR sample IN legal_training_samples
        FILTER sample.needs_review == true
        FILTER sample.reviewed_by == null OR sample.reviewed_by == ""
        SORT sample.confidence ASC
        RETURN sample
  
  documents_by_source:
    description: "Document statistics grouped by source"
    query: |
      FOR doc IN legal_documents
        COLLECT source = doc.source WITH COUNT INTO count
        RETURN {
          source: source,
          count: count
        }
  
  samples_by_category:
    description: "Training sample distribution by category"
    query: |
      FOR sample IN legal_training_samples
        COLLECT category = sample.category WITH COUNT INTO count
        RETURN {
          category: category,
          count: count
        }
  
  recent_ingestion_activity:
    description: "Recent ingestion activity"
    query: |
      FOR meta IN ingestion_metadata
        SORT meta.last_ingested DESC
        LIMIT 20
        RETURN meta

# =============================================================================
# PERFORMANCE & OPTIMIZATION
# =============================================================================
performance:
  vector_search:
    hnsw_parameters:
      m: 16
      ef_construction: 200
      ef_search: 100
    dimensions: 768
    metric: cosine
  
  caching:
    enable_query_cache: true
    cache_ttl_seconds: 300
    max_cache_size_mb: 512
  
  batch_operations:
    batch_size: 1000
    parallel_workers: 4

# =============================================================================
# DATA QUALITY & VALIDATION
# =============================================================================
validation:
  confidence_threshold: 0.8
  auto_label_review_threshold: 0.7
  required_fields_strict: true
  
  data_quality_checks:
    - name: "text_not_empty"
      description: "Ensure text fields are not empty"
      severity: error
    
    - name: "valid_confidence_scores"
      description: "Confidence scores must be [0, 1]"
      severity: error
    
    - name: "valid_categories"
      description: "Categories must be from enum"
      severity: error
    
    - name: "valid_embeddings"
      description: "Embeddings must be 768 dimensions"
      severity: warning

# =============================================================================
# SECURITY & COMPLIANCE
# =============================================================================
security:
  encryption:
    at_rest: true
    in_transit: true
  
  audit:
    enabled: true
    log_path: "logs/legal_training_audit.jsonl"
    track_changes: true
    track_access: true
  
  data_retention:
    training_samples_days: 730
    documents_days: 3650
    ingestion_metadata_days: 365

# =============================================================================
# BACKUP & RECOVERY
# =============================================================================
backup:
  enabled: true
  schedule: "0 3 * * *"  # Daily at 3 AM
  retention_days: 30
  
  pitr:
    enabled: true
    wal_retention_days: 7

# =============================================================================
# MONITORING & METRICS
# =============================================================================
monitoring:
  metrics:
    - documents_ingested_total
    - training_samples_created_total
    - auto_label_confidence_avg
    - samples_needing_review_count
    - vector_search_latency_p95
  
  alerting:
    - name: "low_confidence_samples"
      condition: "avg(auto_label_confidence) < 0.7"
      severity: warning
    
    - name: "high_review_backlog"
      condition: "count(samples_needing_review) > 1000"
      severity: warning
    
    - name: "ingestion_failures"
      condition: "count(ingestion_status == 'failed') > 0"
      severity: error
