# ThemisDB Updates Configuration
# This file configures the update checker and hot-reload system

updates:
  # Update Checker Settings
  checker:
    # Enable the update checker
    enabled: true
    
    # How often to check for updates (in seconds)
    # Default: 3600 (1 hour)
    check_interval_seconds: 3600
    
    # GitHub repository settings
    github_owner: makr-code
    github_repo: ThemisDB
    github_api_url: https://api.github.com
    
    # Optional: GitHub API token for higher rate limits
    # Without token: 60 requests/hour
    # With token: 5000 requests/hour
    # github_api_token: ghp_xxxxxxxxxxxxx
    
    # Optional: Proxy URL for GitHub API requests
    # proxy_url: http://proxy.example.com:8080
  
  # Auto-Update Settings
  auto_update:
    # Enable automatic updates
    # WARNING: Be careful with auto-updates in production!
    enabled: false
    
    # Only auto-apply critical security updates
    # If false, all updates will be auto-applied (not recommended)
    critical_only: true
    
    # Require manual approval even for critical updates
    # If true, critical updates will be downloaded but not applied automatically
    require_approval: true
    
    # Auto-approve timeout (in seconds)
    # If set > 0, critical updates will be auto-applied after this timeout
    # Set to 0 to never auto-approve
    approval_timeout_seconds: 300
    
    # Use scheduled updates instead of immediate application
    scheduled: false
    
    # Time to apply updates (HH:MM format, 24-hour)
    schedule_time: "02:00"
    
    # Days of week to apply updates
    schedule_days:
      - Sunday
  
  # Hot-Reload Settings
  hot_reload:
    # Enable hot-reload capability
    enabled: true
    
    # Directory for downloaded release files
    download_directory: /tmp/themis_updates
    
    # Directory for rollback backups
    backup_directory: /var/lib/themisdb/rollback
    
    # Installation directory (where ThemisDB is installed)
    # Use "." for current directory
    install_directory: .
    
    # Always verify digital signatures
    # NEVER disable this in production!
    verify_signatures: true
    
    # Always create backup before applying updates
    # NEVER disable this in production!
    create_backup: true
    
    # Number of rollback points to keep
    # Older rollback points will be automatically cleaned
    keep_rollback_points: 3
    
    # Download timeout per file (in seconds)
    download_timeout_seconds: 300
    
    # Maximum number of download retries on failure
    max_retries: 3
    
    # Delay between retries (in seconds)
    retry_delay_seconds: 5
  
  # Notification Settings
  notifications:
    # Enable notifications
    enabled: false
    
    # Events to send notifications for
    on_events:
      - update_available      # New update detected
      - critical_update       # Critical security update detected
      - update_applied        # Update successfully applied
      - update_failed         # Update application failed
      - rollback_performed    # Rollback was performed
    
    # Optional: Webhook URL for notifications (e.g., Slack, Discord)
    # webhook_url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    
    # Optional: Email address for notifications
    # email_to: admin@example.com

  # ──────────────────────────────────────────────────────────────────────────
  # Anonymous Hardware Telemetry
  # ──────────────────────────────────────────────────────────────────────────
  # Sends a small, anonymous JSON snapshot of the host's hardware profile to
  # the ThemisDB project so the maintainers can better understand deployment
  # environments.  NO hostname, IP address, database content, or any
  # personally identifiable information is ever collected.
  #
  # The only data sent is:
  #   • A random, ephemeral instance UUID (regenerated on every restart)
  #   • ThemisDB version string
  #   • CPU model name  (can be disabled via include_cpu_model: false)
  #   • Logical CPU core count  (include_cpu_cores: false to disable)
  #   • Total RAM in MiB, rounded to nearest 1 024 MiB bucket  (include_ram_mb)
  #   • OS family: "Linux" / "Windows" / "macOS"  (include_os)
  #   • CPU architecture: "x86_64" / "aarch64" / …  (include_arch)
  #
  # This feature is DISABLED by default.  Set enabled: true to opt in.
  telemetry:
    # Master switch – must be explicitly set to true to enable.
    enabled: false

    # PHP receiver script hosted at https://api.themisdb.org/
    # You can point this at your own collector by changing this URL.
    endpoint_url: https://api.themisdb.org/telemetry.php

    # How often to send a telemetry report (seconds).
    # Minimum enforced at runtime: 86400 (24 h).  Values below 86400 are
    # automatically clamped to 86400 by ThemisDB.
    send_interval_seconds: 86400

    # Fine-grained field switches – set any to false to strip that field.
    include_cpu_model: true
    include_cpu_cores: true
    include_ram_mb:    true
    include_os:        true
    include_arch:      true

    # Anonymous runtime performance metrics (query latency, QPS, cache hit
    # rate, process RSS, uptime, active connections, DB size – all bucketed).
    # Requires a performance provider to be wired in code; has no effect
    # without one.  Disabled by default even when telemetry is enabled.
    include_performance: false

    # HTTP connection settings
    http_timeout_seconds: 10
    max_retries: 2
