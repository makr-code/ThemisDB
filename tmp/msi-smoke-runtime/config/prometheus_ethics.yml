# ============================================================================
# Prometheus Configuration for Ethics AI Framework
# ============================================================================
# Metrics collection and monitoring for ethical AI services
# ============================================================================

global:
  scrape_interval: 15s      # Scrape targets every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  scrape_timeout: 10s       # Timeout for scrapes
  
  # External labels - attached to all time series and alerts
  external_labels:
    cluster: 'ethics-ai-production'
    monitor: 'ethics-ai-monitor'
    environment: 'production'
    project: 'themisdb'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'
      timeout: 10s
      api_version: v2

# Load alerting rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'
  - '/etc/prometheus/recording_rules/*.yml'

# Scrape configurations
scrape_configs:
  # ============================================================================
  # Prometheus self-monitoring
  # ============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ============================================================================
  # ThemisDB metrics
  # ============================================================================
  - job_name: 'themisdb'
    static_configs:
      - targets: 
          - 'themisdb:9090'
          - 'ethics-themisdb:9090'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__address__]
        regex: '([^:]+).*'
        target_label: host
        replacement: '${1}'
    
    metric_relabel_configs:
      # Add service label
      - source_labels: [__name__]
        target_label: service
        replacement: 'themisdb'

  # ============================================================================
  # Ethics AI application metrics
  # ============================================================================
  - job_name: 'ethics-ai'
    
    # Kubernetes service discovery (if running in K8s)
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - ethics-ai
    
    # Static targets (if running in Docker)
    static_configs:
      - targets:
          - 'ethics-ai-1:8081'
          - 'ethics-ai-2:8081'
          - 'ethics-ai-service-1:8081'
          - 'ethics-ai-service-2:8081'
    
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    
    relabel_configs:
      # Keep only pods with metrics port
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: 'metrics'
        action: keep
      
      # Add pod name label
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      
      # Add namespace label
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      
      # Add node label
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      
      # Add version label from pod label
      - source_labels: [__meta_kubernetes_pod_label_version]
        target_label: version
      
      # Add replica label
      - source_labels: [__meta_kubernetes_pod_label_replica]
        target_label: replica
      
      # Set instance to pod IP
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: instance
        replacement: '${1}:8081'
    
    metric_relabel_configs:
      # Add service label
      - source_labels: [__name__]
        target_label: service
        replacement: 'ethics-ai'
      
      # Drop high-cardinality metrics
      - source_labels: [__name__]
        regex: 'go_gc_.*|go_memstats_.*|process_.*'
        action: drop

  # ============================================================================
  # NGINX metrics (if using nginx-prometheus-exporter)
  # ============================================================================
  - job_name: 'nginx'
    static_configs:
      - targets:
          - 'nginx:9113'
    metrics_path: '/metrics'
    scrape_interval: 15s
    
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: service
        replacement: 'nginx'

  # ============================================================================
  # Redis metrics (if using redis_exporter)
  # ============================================================================
  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'
    metrics_path: '/metrics'
    scrape_interval: 15s
    
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: service
        replacement: 'redis'

  # ============================================================================
  # Node Exporter metrics (system metrics)
  # ============================================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - 'node-exporter:9100'
    metrics_path: '/metrics'
    scrape_interval: 30s
    
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+).*'
        target_label: instance
        replacement: '${1}'

  # ============================================================================
  # cAdvisor metrics (container metrics)
  # ============================================================================
  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'cadvisor:8080'
    metrics_path: '/metrics'
    scrape_interval: 30s
    
    metric_relabel_configs:
      # Drop unnecessary metrics
      - source_labels: [__name__]
        regex: 'container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|cpu_load_average_10s)'
        action: drop

  # ============================================================================
  # Grafana metrics
  # ============================================================================
  - job_name: 'grafana'
    static_configs:
      - targets:
          - 'grafana:3000'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # ============================================================================
  # Blackbox exporter - endpoint monitoring
  # ============================================================================
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://ethics-ai-1:8080/health
          - http://ethics-ai-2:8080/health
          - http://themisdb:8529/api/version
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

