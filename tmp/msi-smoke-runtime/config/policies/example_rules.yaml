# ThemisDB PolicyManager Configuration Example
# This file defines RBAC-based governance rules for resource access control

rules:
  # Rule 1: Sensitive Data Protection
  - id: "rule_sensitive_data"
    name: "Sensitive Data Protection"
    description: "Enforce encryption and restrict export for sensitive data"
    classification_level: "geheim"
    enabled: true
    resources:
      - "data/sensitive/*"
      - "data/personal/*"
    actions:
      - "*"
    required_roles:
      - "operator"
      - "admin"
    require_encryption: true
    require_signature: false
    allow_export: false
    allow_cache: false
    retention_days: 90
    redaction_level: "strict"
    audit_access: true
    audit_changes: true
    priority: 100
    created_by: "system"
    
  # Rule 2: Key Management Access
  - id: "rule_key_management"
    name: "Key Management Access"
    description: "Control access to encryption keys"
    classification_level: "streng-geheim"
    enabled: true
    resources:
      - "keys/*"
    actions:
      - "read"
      - "write"
      - "delete"
      - "rotate"
    required_roles:
      - "key_admin"
      - "security_admin"
    require_encryption: true
    require_signature: true
    allow_export: false
    allow_cache: false
    retention_days: 365
    redaction_level: "strict"
    audit_access: true
    audit_changes: true
    priority: 150
    created_by: "system"
    
  # Rule 3: Public Data Access
  - id: "rule_public_data"
    name: "Public Data Access"
    description: "Allow broad access to public data"
    classification_level: "offen"
    enabled: true
    resources:
      - "data/public/*"
    actions:
      - "read"
    required_roles:
      - "*"
    require_encryption: false
    require_signature: false
    allow_export: true
    allow_cache: true
    retention_days: 365
    redaction_level: "none"
    audit_access: false
    audit_changes: false
    priority: 10
    created_by: "system"
    
  # Rule 4: Analyst Read Access
  - id: "rule_analyst_read"
    name: "Analyst Read Access"
    description: "Allow analysts to read non-sensitive data"
    classification_level: "vs-nfd"
    enabled: true
    resources:
      - "data/*"
    actions:
      - "read"
    required_roles:
      - "analyst"
      - "operator"
      - "admin"
    require_encryption: false
    require_signature: false
    allow_export: true
    allow_cache: true
    retention_days: 180
    redaction_level: "standard"
    audit_access: false
    audit_changes: false
    priority: 50
    created_by: "system"
    
  # Rule 5: Admin Full Access
  - id: "rule_admin_full"
    name: "Admin Full Access"
    description: "Admins have full access to all resources"
    classification_level: "vs-nfd"
    enabled: true
    resources:
      - "*"
    actions:
      - "*"
    required_roles:
      - "admin"
    require_encryption: false
    require_signature: false
    allow_export: true
    allow_cache: true
    retention_days: 365
    redaction_level: "standard"
    audit_access: true
    audit_changes: true
    priority: 200
    created_by: "system"
