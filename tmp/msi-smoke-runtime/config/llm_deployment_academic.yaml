# ═══════════════════════════════════════════════════════════
# Academic LoRA Adapters
# ═══════════════════════════════════════════════════════════
loras:
  # Scientific paper writing
  scientific-writing-v1:
    base_model: galactica-6.7b
    domain: scientific_writing
    description: "Scientific paper writing and LaTeX generation"
    format: safetensors
    sources:
      local: /loras/academic/scientific-writing-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    academic_use:
      use_cases:
        - paper_drafting
        - latex_generation
        - bibliography_formatting
  
  # Medical research
  medical-research-v1:
    base_model: biogpt-large
    domain: medical_research
    description: "Medical research literature analysis"
    format: safetensors
    sources:
      local: /loras/academic/medical-research-v1.safetensors
    parameters:
      rank: 8
      alpha: 16
    academic_use:
      use_cases:
        - literature_review
        - clinical_trial_analysis
        - drug_interaction_research
  
  # Mathematics
  mathematics-proof-v1:
    base_model: wizardmath-7b
    domain: mathematics
    description: "Mathematical proof generation and verification"
    format: safetensors
    sources:
      local: /loras/academic/mathematics-proof-v1.safetensors
    parameters:
      rank: 16
      alpha: 32
    academic_use:
      use_cases:
        - proof_generation
        - theorem_verification
        - mathematical_tutoring

# ═══════════════════════════════════════════════════════════
# Integration with ThemisDB LLM Plugin
# ═══════════════════════════════════════════════════════════
llm:
  enabled: true
  default_plugin: "llamacpp"
  
  # Auto-deploy academic models at startup
  auto_deploy:
    enabled: false
    models:
      - "vicuna-7b-v1.5"
      - "galactica-6.7b"
      - "pythia-6.9b"

llm_plugins:
  llamacpp:
    type: "llama.cpp"
    enabled: true
    
    model:
      path: ""
      auto_load: false
    
    gpu:
      n_layers: 32
      use_cuda: true
    
    context:
      n_ctx: 8192
      n_batch: 512
      n_threads: 8

# ═══════════════════════════════════════════════════════════
# Research & Reproducibility Settings
# ═══════════════════════════════════════════════════════════
research:
  reproducibility:
    enabled: true
    seed_tracking: true
    parameter_logging: true
    version_pinning: true
  
  benchmarking:
    enabled: true
    standard_benchmarks:
      - MMLU
      - HellaSwag
      - TruthfulQA
      - GSM8K
      - HumanEval
      - MT-Bench
  
  citation:
    bibtex_generation: true
    doi_tracking: true
    
  collaboration:
    multi_institution_support: true
    dataset_sharing: true
    model_sharing: true

# ═══════════════════════════════════════════════════════════
# Academic License Compliance
# ═══════════════════════════════════════════════════════════
licensing:
  enforcement: true
  allowed_licenses:
    - Apache 2.0
    - MIT
    - CC BY-NC 4.0
    - CC BY-SA 3.0
    - BigScience RAIL
  
  commercial_use_warning: true
  citation_requirement_tracking: true

# ═══════════════════════════════════════════════════════════
# University Infrastructure Integration
# ═══════════════════════════════════════════════════════════
university:
  hpc_integration:
    enabled: true
    slurm_compatible: true
    pbs_compatible: true
  
  storage:
    shared_filesystem: true
    quota_management: true
    
  compute:
    gpu_cluster_support: true
    multi_node_training: true
    
  authentication:
    ldap_integration: true
    shibboleth_support: true
