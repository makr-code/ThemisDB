# ThemisDB LLM Deployment - Academic & University Models
# Version: 1.0.0
#
# This configuration defines academic/research models compatible with llama.cpp
# Optimized for scientific research, education, and academic use cases

# ═══════════════════════════════════════════════════════════
# Deployment Configuration for Academic Models
# ═══════════════════════════════════════════════════════════
deployment:
  mode: auto
  cache_directory: "./models/academic"
  enable_cache: true
  max_cache_size_gb: 200
  
  # University infrastructure settings
  ollama_url: "http://localhost:11434"
  ollama_timeout_seconds: 1200  # Longer timeout for research models
  
  # Academic network settings
  proxy_url: ""  # Configure for university proxy if needed
  verify_checksums: true
  allow_insecure: false
  
  # Research audit logging
  enable_audit_log: true
  audit_log_path: "./logs/academic_models_deployment.log"
  
  # Model retention for research reproducibility
  auto_cleanup: false  # Keep models for reproducibility
  max_model_age_days: 365
  keep_versions: 5  # Keep more versions for research
  
  # Model sources (academic repositories)
  sources:
    # Ollama
    - type: ollama
      location: "http://localhost:11434"
      priority: 100
    
    # NOTE: Base URLs like "https://huggingface.co" or "https://github.com" cannot be used directly.
    # The current implementation treats source.location as a direct file/directory path,
    # not a base URL for model resolution. Using base URLs would attempt to download
    # the homepage and fail.
    #
    # WORKAROUND: Use local model directories or configure specific model file URLs
    # under individual model definitions in the `models:` section (future enhancement).
    
    # University model repository (directory path - model filename appended automatically)
    - type: local
      location: "/research/models"
      priority: 90

# ═══════════════════════════════════════════════════════════
# Academic & Research Model Definitions
# ═══════════════════════════════════════════════════════════
models:
  # ---------------------------------------------------------------------------
  # Stanford Models
  # ---------------------------------------------------------------------------
  
  # Alpaca (Stanford - First instruction-following model)
  alpaca-7b:
    version: v1.0
    type: instruction
    format: gguf
    size: 7B
    quantization: Q4_K_M
    description: "Stanford Alpaca - instruction-following LLaMA model"
    institution: Stanford University
    research_paper: "Self-Instruct: Aligning Language Models with Self-Generated Instructions"
    sources:
      huggingface: chavinlo/alpaca-native
      local: /models/academic/stanford/alpaca-7b.gguf
    parameters:
      context_length: 2048
      max_tokens: 1024
      temperature: 0.7
    gpu:
      layers_offload: 32
      vram_required_mb: 4096
    academic_use:
      research_areas:
        - instruction_following
        - zero_shot_learning
        - model_alignment
      citation_required: true
      license: CC BY-NC 4.0

