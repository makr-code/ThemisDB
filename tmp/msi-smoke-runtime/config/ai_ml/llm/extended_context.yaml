    "16K context": "+4-8GB"
    "32K context": "+8-16GB"
    "64K context": "+16-32GB"
    "128K context": "+32-64GB"
  
  # RoPE scaling quality guide
  quality_guide:
    linear: "Good for 2x scaling, degrades at higher factors"
    ntk: "Good for 4x scaling, stable quality"
    yarn: "Best for 8x+ scaling, preserves quality"
    dynamic: "Experimental, adapts to input"
