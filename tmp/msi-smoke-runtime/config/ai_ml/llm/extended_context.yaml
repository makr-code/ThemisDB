# ThemisDB LLM Extended Context Configuration
# Version: 1.4.0-stable (Production-Ready)
#
# This configuration enables extended context windows (32K-128K tokens)
# with RoPE/YARN scaling for production use.
#
# ⚠️ PRODUCTION CONSIDERATIONS:
# - Extended context increases memory usage significantly
# - RoPE/YARN scaling may affect model quality
# - Test thoroughly before deploying to production
# - Monitor RAM/VRAM usage closely

# ═══════════════════════════════════════════════════════════
# Extended Context Window Configuration
# ═══════════════════════════════════════════════════════════
extended_context:
  # Enable extended context window support
  # Default: false (use model's native context window)
  enabled: false
  
  # Feature maturity status
  # Options: "experimental", "beta", "stable"
  # Current: "stable" (v1.4.0+)
  maturity_status: "stable"
  
  # Backward compatibility mode
  # When true, falls back to native context if extended fails
  backward_compatible: true
  
  # Context window validation
  validation:
    # Enforce minimum context window
    min_context: 512
    
    # Enforce maximum context window (safety limit)
    max_context: 131072  # 128K tokens
    
    # Warn when context exceeds this threshold
    warn_threshold: 32768  # 32K tokens
    
    # Reject requests exceeding memory budget
    enforce_memory_limits: true

# ═══════════════════════════════════════════════════════════
# RoPE (Rotary Position Embedding) Scaling Configuration
# ═══════════════════════════════════════════════════════════
rope_scaling:
  # Enable RoPE scaling for extended context
  # Required for context windows beyond model's native size
  enabled: false
  
  # RoPE scaling method
  # Options: "linear", "ntk", "yarn", "dynamic"
  # Recommended: "yarn" for best quality at high scaling factors
  method: "yarn"
  
  # Original context window size (model-specific)
  # Common values:
  # - LLaMA/Mistral 7B: 4096
  # - LLaMA 2 13B/70B: 4096
  # - CodeLLaMA: 16384
  # - Mistral-8x7B: 32768
  original_context: 4096
  
  # Target extended context window
  # Must be larger than original_context
  # Common targets: 8192, 16384, 32768, 65536, 131072
  max_context: 32768
  
  # YaRN-specific parameters (method: "yarn")
  # These provide fine-grained control over scaling quality
  yarn:
    # Extension factor (1.0 = no extension)
    # Controls preservation of high-frequency information
    # Range: 1.0-4.0 (Recommended: 1.0-2.0 for most use cases)
    # Values > 2.0: Better detail preservation but may affect coherence
    # Values < 1.0: Not recommended (degrades quality)
    # Default: 1.0
    ext_factor: 1.0
    
    # Attention factor (1.0 = no adjustment)
    # Adjusts attention temperature for long contexts
    # Range: 0.5-2.0, Default: 1.0
    attn_factor: 1.0
    
    # Beta fast (high-frequency cutoff)
    # Lower values preserve more high-frequency details
    # Range: 16.0-64.0, Default: 32.0
    beta_fast: 32.0
    
    # Beta slow (low-frequency cutoff)
    # Higher values preserve more low-frequency patterns
    # Range: 0.5-2.0, Default: 1.0
    beta_slow: 1.0
  
  # NTK-Aware scaling parameters (method: "ntk")
  # NTK dynamically adjusts frequency base
  ntk:
    # Frequency base multiplier
    # Calculated automatically based on scaling ratio
    # Manual override (0 = auto)
    freq_base_override: 0
  
  # Linear scaling parameters (method: "linear")
  # Simplest method, may lose quality at high factors
  linear:
    # Frequency scale factor
    # Calculated automatically: original/max_context
    # Manual override (0 = auto)
    freq_scale_override: 0.0
  
  # Dynamic scaling parameters (method: "dynamic")
  # Adapts to actual input length at runtime
  dynamic:
    # Use linear scaling as base
    use_linear_base: true

# ═══════════════════════════════════════════════════════════
# Memory Management for Extended Context
# ═══════════════════════════════════════════════════════════
memory:
  # Memory profiling and monitoring
  profiling:
    # Enable detailed memory profiling
    enabled: true
    
    # Log memory usage per request
    log_per_request: false
    
    # Log memory usage interval (seconds)
    log_interval: 60
    
    # Enable Prometheus metrics for memory
    prometheus_metrics: true
  
  # RAM/VRAM limits for extended context
  limits:
    # Maximum RAM per model (MB)
    # Extended context can use 2-4x more RAM
    # Default: 0 (no limit)
    max_ram_mb: 0
    
    # Maximum VRAM per model (MB)
    # Extended context significantly increases VRAM usage
    # Example: 7B model @ 32K context ≈ 16-24GB VRAM
    # Default: 0 (no limit)
    max_vram_mb: 0
    
    # Maximum context cache size (MB)
    # KV cache grows linearly with context size
    # Default: 0 (no limit)
    max_cache_mb: 0
  
  # Memory estimation formulas
  # Used for validation before loading model
  estimation:
    # Base memory per parameter (bytes)
    # Q4: ~0.5, Q5: ~0.6, Q6: ~0.75, Q8: ~1.0, F16: ~2.0
    bytes_per_param: 0.5
    
    # KV cache memory per token (bytes)
    # Depends on model architecture and dtype
    # LLaMA 7B F16: ~256 bytes/token
    bytes_per_token: 256
    
    # Safety margin multiplier
    # Actual usage can exceed estimates
    safety_margin: 1.2

# ═══════════════════════════════════════════════════════════
# Thread Safety and Concurrency
# ═══════════════════════════════════════════════════════════
thread_safety:
  # Context scaling with LoRA/Adapters
  # ⚠️ WARNING: Concurrent LoRA adapter switching with extended
  # context may cause race conditions in some configurations
  lora_adapter_warnings:
    # Show warnings when using LoRA with extended context
    enabled: true
    
    # Enforce sequential LoRA operations
    # Prevents concurrent adapter loads/unloads
    sequential_only: false
    
    # Lock duration for adapter operations (ms)
    # Higher values reduce race conditions but impact throughput
    lock_timeout_ms: 1000
  
  # Context access synchronization
  synchronization:
    # Use mutex for context access
    # Recommended: true for extended context
    use_mutex: true
    
    # Reader-writer lock for better concurrency
    # Only enable if thoroughly tested
    use_rwlock: false

# ═══════════════════════════════════════════════════════════
# Production Deployment Settings
# ═══════════════════════════════════════════════════════════
production:
  # Pre-deployment validation
  validation:
    # Run validation checks before enabling extended context
    enabled: true
    
    # Checks to perform:
    # - Memory availability check
    check_memory: true
    
    # - Model compatibility check
    check_model_support: true
    
    # - RoPE/YARN configuration validation
    check_rope_config: true
    
    # - Thread safety verification
    check_thread_safety: true
    
    # Fail deployment if validation fails
    fail_on_validation_error: true
  
  # Monitoring and alerting
  monitoring:
    # Enable production monitoring
    enabled: true
    
    # Alert thresholds
    alerts:
      # Alert when memory usage exceeds threshold (%)
      memory_threshold: 85
      
      # Alert when context length exceeds threshold
      context_threshold: 90000  # 90K tokens
      
      # Alert on RoPE scaling errors
      rope_errors: true
      
      # Alert on OOM (Out of Memory) events
      oom_events: true
  
  # Performance tracking
  performance:
    # Track inference latency by context length
    track_latency: true
    
    # Track memory usage trends
    track_memory: true
    
    # Track quality metrics (perplexity, etc.)
    track_quality: false
  
  # Fallback behavior
  fallback:
    # Automatically reduce context on memory pressure
    auto_reduce_context: true
    
    # Reduce by this factor (e.g., 0.5 = cut in half)
    reduction_factor: 0.5
    
    # Minimum context after reduction
    min_context: 4096
    
    # Disable extended context on repeated failures
    disable_on_failures: true
    
    # Number of failures before disabling
    failure_threshold: 3

# ═══════════════════════════════════════════════════════════
# Model-Specific Configurations
# ═══════════════════════════════════════════════════════════
models:
  # Override settings per model
  # Model ID matches LLM configuration
  
  # Example: LLaMA 2 7B with 32K context
  llama-2-7b:
    rope_scaling:
      enabled: true
      method: "yarn"
      original_context: 4096
      max_context: 32768
    memory:
      max_vram_mb: 24576  # 24GB
      max_ram_mb: 16384   # 16GB
  
  # Example: Mistral 7B with 128K context
  mistral-7b:
    rope_scaling:
      enabled: true
      method: "yarn"
      original_context: 8192
      max_context: 131072
      yarn:
        ext_factor: 2.0
        attn_factor: 1.0
    memory:
      max_vram_mb: 40960  # 40GB
      max_ram_mb: 32768   # 32GB
  
  # Example: CodeLLaMA with native 16K, extended to 64K
  codellama-13b:
    rope_scaling:
      enabled: true
      method: "ntk"
      original_context: 16384
      max_context: 65536
    memory:
      max_vram_mb: 32768  # 32GB
      max_ram_mb: 24576   # 24GB

# ═══════════════════════════════════════════════════════════
# Experimental Features (Not for Production)
# ═══════════════════════════════════════════════════════════
experimental:
  # Ultra-long context (>128K tokens)
  # ⚠️ EXPERIMENTAL - Not recommended for production
  ultra_long_context:
    enabled: false
    max_context: 262144  # 256K tokens
    
    # Requires special handling
    use_sliding_window: true
    window_size: 131072  # 128K tokens
    overlap_size: 16384  # 16K token overlap
  
  # Adaptive RoPE scaling
  # Dynamically adjusts based on prompt characteristics
  adaptive_rope:
    enabled: false
    
    # Analyze prompt to determine optimal scaling
    analyze_prompt: true
    
    # Adjust scaling factor based on prompt length
    length_based_scaling: true

