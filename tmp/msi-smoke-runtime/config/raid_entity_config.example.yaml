# ThemisDB Entity-Level RAID Configuration Example
#
# This configuration enables RAID-style redundancy for entity write operations
# using the RedundancyStrategy integration in EntityApiHandler.
#
# Prerequisites:
# - THEMIS_ENABLE_GRPC=ON (for distributed shard communication)
# - Multiple shard nodes configured in sharding.shards section
# - Config file loaded by main_server (default paths checked automatically)
#
# Version: 1.5.0-dev
# Documentation: See docs/PRODUCTION_READINESS_RAID_HTTP_GRPC.md

# =============================================================================
# NOTE: The server does NOT parse the `entity_api` section from YAML.
# Runtime RAID control is via `raid.enabled` in the `raid` section below.
# The `entity_api` section here is DOCUMENTATION-ONLY to illustrate features.
# =============================================================================
entity_api:
  # Illustrative flag for "Entity API RAID feature" (NOT PARSED BY SERVER)
  # Real runtime control is via `raid.enabled` (see below)
  feature_raid: true
  
  # Illustrative toggles for other optional Entity API features (NOT PARSED)
  # Actual feature flags must be provided under `features.*` in main config
  feature_cdc: true          # Change data capture
  feature_geo: true          # Geo/spatial indexing
  feature_replication: true  # WAL replication and write concerns

# =============================================================================
# RAID Redundancy Configuration
# =============================================================================
raid:
  # Enable RAID redundancy globally
  enabled: true
  
  # Default redundancy configuration (can be overridden per collection)
  default:
    # Redundancy mode
    # Options: NONE, MIRROR, STRIPE, STRIPE_MIRROR, PARITY, RAID6, GEO_MIRROR
    mode: MIRROR
    
    # Replication factor (for MIRROR, STRIPE_MIRROR, GEO_MIRROR modes)
    replication_factor: 3
    
    # Read preference
    # Options: PRIMARY, NEAREST, ROUND_ROBIN, RANDOM, SECONDARY_ONLY
    read_preference: NEAREST
    
    # Write concern
    # Options: ONE, MAJORITY, ALL, QUORUM
    write_concern: MAJORITY
    
    # Quorum settings
    read_quorum: 1
    write_quorum: 2
    enable_quorum_enforcement: false  # Disabled by default for RC1
    
    # Timeouts
    replication_timeout_ms: 5000
    health_check_interval_ms: 1000
    
    # Recovery
    auto_recovery: true
    recovery_parallelism: 4

  # Collection-specific configurations
  collections:
    # Critical data: MIRROR with high replication factor
    users:
      mode: MIRROR
      replication_factor: 3
      write_concern: ALL
      read_preference: NEAREST
      
    orders:
      mode: MIRROR
      replication_factor: 3
      write_concern: MAJORITY
      
    # Analytics data: STRIPE for high throughput
    events:
      mode: STRIPE
      stripe:
        stripe_size_kb: 64
        min_stripe_shards: 4
        parallel_stripe_io: true
        max_parallel_io: 8
        
    # Large files: PARITY for space efficiency
    documents:
      mode: PARITY
      erasure_coding:
        data_shards: 4
        parity_shards: 2
        algorithm: REED_SOLOMON
        min_document_size_kb: 1024
        
    # RAID 10 equivalent: STRIPE_MIRROR
    metrics:
      mode: STRIPE_MIRROR
      replication_factor: 2
      stripe:
        stripe_size_kb: 32
        min_stripe_shards: 2
        
    # Geo-distributed critical data
    transactions:
      mode: GEO_MIRROR
      geo_replication:
        primary_datacenter: "eu-central"
        replica_datacenters:
          - "us-east"
          - "ap-south"
        replication_mode: SEMI_SYNC  # Wait for one remote DC
        conflict_resolution: LAST_WRITE_WINS
        max_lag_ms: 10000

# =============================================================================
# Shard Configuration
# =============================================================================
sharding:
  # Local shard identifier
  local_shard_id: "shard-0"
  
  # Shard topology (list of all shards in the cluster)
  shards:
    - id: "shard-0"
      host: "themis-shard-0.local"
      port: 8080
      grpc_port: 50051
      datacenter: "eu-central"
      
    - id: "shard-1"
      host: "themis-shard-1.local"
      port: 8080
      grpc_port: 50051
      datacenter: "eu-central"
      
    - id: "shard-2"
      host: "themis-shard-2.local"
      port: 8080
      grpc_port: 50051
      datacenter: "eu-central"
      
    - id: "shard-3"
      host: "themis-shard-3.local"
      port: 8080
      grpc_port: 50051
      datacenter: "us-east"
      
    - id: "shard-4"
      host: "themis-shard-4.local"
      port: 8080
      grpc_port: 50051
      datacenter: "ap-south"
  
  # Consistent hash ring configuration
  hash_ring:
    virtual_nodes_per_shard: 100
    hash_function: "xxhash64"

# =============================================================================
# gRPC Configuration (for inter-shard communication)
# =============================================================================
grpc:
  # Enable gRPC for shard-to-shard communication
  enabled: true
  
  # WAL Apply service configuration
  wal_apply_service:
    host: "0.0.0.0"
    port: 50051
    max_message_size_mb: 100
    
  # Connection pool settings
  connection_pool:
    max_connections_per_shard: 10
    connection_timeout_ms: 5000
    keepalive_time_ms: 30000
    keepalive_timeout_ms: 10000
    
  # Security (production should use TLS)
  security:
    enable_tls: false  # WARNING: Development only!
    # For production:
    # enable_tls: true
    # ca_cert_path: "/path/to/ca.pem"
    # server_cert_path: "/path/to/server.pem"
    # server_key_path: "/path/to/server-key.pem"

# =============================================================================
# HTTP Server Configuration
# =============================================================================
http_server:
  host: "0.0.0.0"
  port: 8080
  num_threads: 8
  max_request_size_mb: 10
  request_timeout_ms: 30000

# =============================================================================
# Monitoring
# =============================================================================
monitoring:
  prometheus:
    enabled: true
    port: 9090
    
  # RAID-specific metrics
  raid_metrics:
    enabled: true
    # Metrics exported:
    # - raid_write_total
    # - raid_write_latency_ms
    # - raid_shards_written
    # - raid_mode (gauge per collection)
    # - raid_degraded_documents
    # - raid_recovery_operations

# =============================================================================
# Logging
# =============================================================================
logging:
  level: "info"  # debug, info, warn, error
  
  # Enable detailed RAID logging
  raid_verbose: true
  
  # Log RAID operations
  log_raid_writes: true
  log_raid_reads: true
  log_raid_recovery: true
