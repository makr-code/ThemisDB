# AWS EBS Encryption Configuration Example for ThemisDB
# This file provides example Terraform/CloudFormation configurations
# for deploying ThemisDB with encrypted EBS volumes on AWS

---

## Terraform Configuration

terraform_configuration: |
  # Provider configuration
  provider "aws" {
    region = "eu-central-1"
  }

  # KMS Key for EBS encryption
  resource "aws_kms_key" "themisdb_ebs" {
    description             = "KMS key for ThemisDB EBS encryption"
    deletion_window_in_days = 30
    enable_key_rotation     = true
    
    tags = {
      Name        = "themisdb-ebs-encryption-key"
      Application = "ThemisDB"
      Environment = "production"
    }
  }

  resource "aws_kms_alias" "themisdb_ebs" {
    name          = "alias/themisdb-ebs"
    target_key_id = aws_kms_key.themisdb_ebs.key_id
  }

  # EC2 Instance with encrypted root volume
  resource "aws_instance" "themisdb" {
    # IMPORTANT: Update AMI ID for your region. Use this command to find current Ubuntu 22.04 LTS AMI:
    # aws ec2 describe-images --owners 099720109477 \
    #   --filters "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*" \
    #   --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text
    ami           = "ami-XXXXXXXXXXXX"  # REPLACE: Current Ubuntu 22.04 LTS AMI for your region
    instance_type = "r6i.2xlarge"       # 8 vCPU, 64 GB RAM
    
    # Encrypted root volume
    root_block_device {
      volume_type           = "gp3"
      volume_size           = 100
      encrypted             = true
      kms_key_id            = aws_kms_key.themisdb_ebs.arn
      delete_on_termination = false
      
      tags = {
        Name = "themisdb-root-volume"
      }
    }
    
    # Additional encrypted data volume for RocksDB
    ebs_block_device {
      device_name           = "/dev/sdf"
      volume_type           = "io2"
      volume_size           = 1000        # 1 TB
      iops                  = 64000       # Max IOPS for io2
      throughput            = 1000        # 1000 MB/s
      encrypted             = true
      kms_key_id            = aws_kms_key.themisdb_ebs.arn
      delete_on_termination = false
      
      tags = {
        Name = "themisdb-data-volume"
      }
    }
    
    # IAM role for KMS access
    iam_instance_profile = aws_iam_instance_profile.themisdb.name
    
    user_data = <<-EOF
      #!/bin/bash
      # Mount encrypted data volume
      mkfs.ext4 /dev/sdf
      mkdir -p /var/lib/themisdb
      mount /dev/sdf /var/lib/themisdb
      echo "/dev/sdf /var/lib/themisdb ext4 defaults,nofail 0 2" >> /etc/fstab
    EOF
    
    tags = {
      Name        = "themisdb-server"
      Application = "ThemisDB"
      Environment = "production"
    }
  }

  # IAM role for EC2 instance
  resource "aws_iam_role" "themisdb" {
    name = "themisdb-ec2-role"
    
    assume_role_policy = jsonencode({
      Version = "2012-10-17"
      Statement = [{
        Action = "sts:AssumeRole"
        Effect = "Allow"
        Principal = {
          Service = "ec2.amazonaws.com"
        }
      }]
    })
  }

  # KMS key policy for EC2 role
  resource "aws_iam_role_policy" "themisdb_kms" {
    name = "themisdb-kms-policy"
    role = aws_iam_role.themisdb.id
    
    policy = jsonencode({
      Version = "2012-10-17"
      Statement = [{
        Effect = "Allow"
        Action = [
          "kms:Decrypt",
          "kms:Encrypt",
          "kms:ReEncrypt*",
          "kms:GenerateDataKey*",
          "kms:CreateGrant",
          "kms:DescribeKey"
        ]
        Resource = aws_kms_key.themisdb_ebs.arn
      }]
    })
  }

  resource "aws_iam_instance_profile" "themisdb" {
    name = "themisdb-instance-profile"
    role = aws_iam_role.themisdb.name
  }

  # S3 Bucket for backups with SSE-KMS
  resource "aws_s3_bucket" "themisdb_backups" {
    bucket = "themisdb-backups-encrypted"
    
    tags = {
      Name        = "themisdb-backups"
      Application = "ThemisDB"
      Environment = "production"
    }
  }

  resource "aws_s3_bucket_server_side_encryption_configuration" "themisdb_backups" {
    bucket = aws_s3_bucket.themisdb_backups.id
    
    rule {
      apply_server_side_encryption_by_default {
        sse_algorithm     = "aws:kms"
        kms_master_key_id = aws_kms_key.themisdb_ebs.arn
      }
      bucket_key_enabled = true
    }
  }

  # Outputs
  output "kms_key_id" {
    value       = aws_kms_key.themisdb_ebs.id
    description = "KMS Key ID for EBS encryption"
  }

  output "kms_key_arn" {
    value       = aws_kms_key.themisdb_ebs.arn
    description = "KMS Key ARN for EBS encryption"
  }

  output "instance_id" {
    value       = aws_instance.themisdb.id
    description = "ThemisDB EC2 Instance ID"
  }

---

## CloudFormation Configuration

cloudformation_configuration: |
  AWSTemplateFormatVersion: '2010-09-09'
  Description: 'ThemisDB with encrypted EBS volumes'
  
  Parameters:
    InstanceType:
      Type: String
      Default: r6i.2xlarge
      Description: EC2 instance type
    
    DataVolumeSize:
      Type: Number
      Default: 1000
      Description: Size of data volume in GB
  
  Resources:
    # KMS Key for encryption
    ThemisDBKMSKey:
      Type: AWS::KMS::Key
      Properties:
        Description: KMS key for ThemisDB EBS encryption
        EnableKeyRotation: true
        KeyPolicy:
          Version: '2012-10-17'
          Statement:
            - Sid: Enable IAM User Permissions
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action: 'kms:*'
              Resource: '*'
    
    ThemisDBKMSKeyAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/themisdb-ebs
        TargetKeyId: !Ref ThemisDBKMSKey
    
    # EC2 Instance
    ThemisDBInstance:
      Type: AWS::EC2::Instance
      Properties:
        # IMPORTANT: Update AMI ID for your region. Find current Ubuntu 22.04 LTS AMI:
        # aws ec2 describe-images --owners 099720109477 \
        #   --filters "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*" \
        #   --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text
        ImageId: ami-XXXXXXXXXXXX  # REPLACE with current AMI for your region
        InstanceType: !Ref InstanceType
        IamInstanceProfile: !Ref ThemisDBInstanceProfile
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              Encrypted: true
              KmsKeyId: !Ref ThemisDBKMSKey
              DeleteOnTermination: false
          - DeviceName: /dev/sdf
            Ebs:
              VolumeSize: !Ref DataVolumeSize
              VolumeType: io2
              Iops: 64000
              Throughput: 1000
              Encrypted: true
              KmsKeyId: !Ref ThemisDBKMSKey
              DeleteOnTermination: false
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            mkfs.ext4 /dev/sdf
            mkdir -p /var/lib/themisdb
            mount /dev/sdf /var/lib/themisdb
            echo "/dev/sdf /var/lib/themisdb ext4 defaults,nofail 0 2" >> /etc/fstab
        Tags:
          - Key: Name
            Value: themisdb-server
    
    # IAM Role
    ThemisDBRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: ec2.amazonaws.com
              Action: 'sts:AssumeRole'
        Policies:
          - PolicyName: KMSAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - 'kms:Decrypt'
                    - 'kms:Encrypt'
                    - 'kms:ReEncrypt*'
                    - 'kms:GenerateDataKey*'
                    - 'kms:CreateGrant'
                    - 'kms:DescribeKey'
                  Resource: !GetAtt ThemisDBKMSKey.Arn
    
    ThemisDBInstanceProfile:
      Type: AWS::IAM::InstanceProfile
      Properties:
        Roles:
          - !Ref ThemisDBRole
  
  Outputs:
    KMSKeyId:
      Description: KMS Key ID
      Value: !Ref ThemisDBKMSKey
    
    InstanceId:
      Description: EC2 Instance ID
      Value: !Ref ThemisDBInstance

---

## Configuration Verification

verification_commands: |
  # Verify EBS encryption status
  aws ec2 describe-volumes \
    --region eu-central-1 \
    --filters "Name=attachment.instance-id,Values=<instance-id>" \
    --query 'Volumes[*].[VolumeId,Encrypted,KmsKeyId]' \
    --output table
  
  # Expected output:
  # |  VolumeId     | Encrypted | KmsKeyId                                    |
  # | vol-xxxxx     | True      | arn:aws:kms:eu-central-1:xxx:key/xxxx      |
  
  # Verify KMS key rotation
  aws kms get-key-rotation-status \
    --key-id alias/themisdb-ebs \
    --region eu-central-1
  
  # Expected output:
  # {
  #   "KeyRotationEnabled": true
  # }
  
  # Check S3 bucket encryption
  aws s3api get-bucket-encryption \
    --bucket themisdb-backups-encrypted
  
  # Expected output shows SSE-KMS configuration

---

## Performance Considerations

performance_notes: |
  AWS EBS Encryption Performance:
  - No measurable performance impact (hardware-accelerated)
  - Encryption handled at hypervisor level (AWS Nitro System)
  - Zero CPU overhead on EC2 instance
  - Same IOPS and throughput as unencrypted volumes
  
  Recommended Volume Types:
  - io2: Best for production databases (up to 64,000 IOPS, 1000 MB/s)
  - gp3: Good balance of cost and performance (16,000 IOPS, 1000 MB/s)
  - io1: Legacy option (up to 64,000 IOPS, 1000 MB/s)
  
  KMS Considerations:
  - KMS requests are rate-limited (1,200 req/s shared across regions)
  - Use EBS encryption with KMS for automatic key management
  - Enable key rotation for compliance

---

## Cost Estimation

cost_breakdown: |
  Monthly costs for ThemisDB on AWS (eu-central-1):
  
  1. EC2 Instance (r6i.2xlarge):
     - On-Demand: ~$500/month
     - Reserved (1-year): ~$300/month
     - Reserved (3-year): ~$200/month
  
  2. EBS Storage:
     - Root volume (100 GB gp3): ~$10/month
     - Data volume (1 TB io2, 64k IOPS): ~$900/month
     - Total: ~$910/month
  
  3. KMS:
     - Key storage: $1/month
     - API requests: $0.03 per 10,000 requests
     - Estimated: ~$5/month
  
  4. S3 Backup Storage (optional):
     - Standard: $0.023/GB (~$23 for 1 TB)
     - Intelligent-Tiering: Automatic cost optimization
  
  Total Estimated Monthly Cost: ~$1,400-$1,700
  
  Notes:
  - EBS encryption: No additional cost
  - Data transfer within same AZ: Free
  - Snapshots: ~$0.05/GB/month (incremental)

---

## Security Best Practices

security_recommendations: |
  1. KMS Key Management:
     - Enable automatic key rotation
     - Use separate keys for different environments
     - Implement key policies for least-privilege access
     - Enable CloudTrail logging for all KMS operations
  
  2. IAM Permissions:
     - Use instance profiles instead of access keys
     - Implement least-privilege IAM policies
     - Enable MFA for KMS key deletion
     - Regularly audit IAM permissions
  
  3. Network Security:
     - Place ThemisDB in private subnet
     - Use security groups for access control
     - Enable VPC Flow Logs
     - Use AWS PrivateLink for S3 access
  
  4. Backup Security:
     - Enable S3 versioning for backups
     - Use S3 Object Lock for immutability
     - Encrypt backups with same KMS key
     - Test restore procedures regularly
  
  5. Monitoring:
     - Enable CloudWatch for EBS metrics
     - Set up alarms for KMS throttling
     - Monitor CloudTrail for suspicious activity
     - Use AWS Security Hub for compliance

---

## Disaster Recovery

disaster_recovery: |
  Automated Backup Strategy:
  
  1. EBS Snapshots:
     - Daily automated snapshots with lifecycle policy
     - Retain 7 daily, 4 weekly, 12 monthly snapshots
     - Cross-region snapshot copies for DR
     - Encryption preserved in snapshots
  
  2. Application-Level Backups:
     - ThemisDB RocksDB backup to S3 (encrypted)
     - Incremental backups every 6 hours
     - Full backup daily at 2 AM UTC
     - Retention: 30 days
  
  3. Recovery Testing:
     - Monthly restore drills
     - Automated validation of backup integrity
     - Document RTO (4 hours) and RPO (6 hours)
  
  Sample Terraform for automated snapshots:
  ```hcl
  resource "aws_dlm_lifecycle_policy" "themisdb_snapshots" {
    description        = "ThemisDB EBS snapshot policy"
    execution_role_arn = aws_iam_role.dlm_lifecycle_role.arn
    state              = "ENABLED"
    
    policy_details {
      resource_types = ["VOLUME"]
      
      schedule {
        name = "Daily snapshots"
        
        create_rule {
          interval      = 24
          interval_unit = "HOURS"
          times         = ["02:00"]
        }
        
        retain_rule {
          count = 7
        }
        
        copy_tags = true
      }
      
      target_tags = {
        Application = "ThemisDB"
      }
    }
  }
  ```
