# ============================================================================
# Kubernetes Service - Ethics AI Framework
# ============================================================================
# Load balancing service for Ethics AI application
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: ethics-ai
  namespace: ethics-ai
  labels:
    app: ethics-ai
    component: application
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8081"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP  # Use LoadBalancer for external access
  selector:
    app: ethics-ai
    component: application
  
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 8081
      targetPort: metrics
      protocol: TCP
  
  # Session affinity (optional)
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

---
