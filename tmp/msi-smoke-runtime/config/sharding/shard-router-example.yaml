# Example shard router + rebalance policy for Themis v1.4
# Scope: demo/test; adjust for prod (TLS, auth, limits).

cluster:
  id: themis-shard-cluster-1
  router_endpoint: 0.0.0.0:7000
  orchestrator_endpoint: 0.0.0.0:7001
  replication_factor: 2
  shards:
    - id: shard-01
      range: [0, 2147483647]
      primaries:
        - host: 10.0.0.11
          port: 9000
      replicas:
        - host: 10.0.0.12
          port: 9000
    - id: shard-02
      range: [2147483648, 4294967295]
      primaries:
        - host: 10.0.0.13
          port: 9000
      replicas:
        - host: 10.0.0.14
          port: 9000

routing:
  strategy: hash-range
  hash_fn: murmur3
  rebalance_mode: incremental  # options: incremental, full-migration
  cross_shard_joins:
    enable: true
    max_join_depth: 2
    timeout_ms: 250

rebalance:
  trigger:
    load_skew_threshold_pct: 15   # rebalance if hottest shard >15% above median
    disk_util_threshold_pct: 70   # rebalance when disk usage exceeds 70%
  execution:
    max_parallel_moves: 2
    throttle_ops_per_sec: 200000  # reduce to 100k for HDDs
    pause_writes_during_cutover: true
    max_downtime_ms: 500
  safety:
    min_replicas_healthy: 2
    abort_on_lag_ms: 5000
    metrics_guardrails:
      p99_latency_max_ms: 2.5
      throughput_drop_max_pct: 15

vector_index:
  recall_target: 0.995
  pruning_enabled: true
  shard_local_cache_mb: 512
  prefetch_candidates: 64
  cross_shard_candidate_cap: 256

observability:
  metrics_endpoint: 0.0.0.0:9100
  tracing:
    enabled: true
    provider: otlp
    endpoint: http://otel-collector:4317
  logging:
    level: info
    slow_query_ms: 200
