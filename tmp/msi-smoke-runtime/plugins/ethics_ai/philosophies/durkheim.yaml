## Kritische Perspektiven / Critical Perspectives
critiques:
  libertarian_critique: "Social welfare undermines individual responsibility and market efficiency"
  marxist_critique: "Social democracy merely manages capitalism, doesn't transform it"
  feminist_critique: "Traditional social ethics neglects gender dimensions of care"
