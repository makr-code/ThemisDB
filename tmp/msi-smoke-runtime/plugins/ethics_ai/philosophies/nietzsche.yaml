# Friedrich Nietzsche - Lebensphilosophie
# Wille zur Macht, Übermensch, Umwertung aller Werte

school: lebensphilosophie_nietzsche
name: "Nietzscheanische Lebensphilosophie"
philosopher_name: "Friedrich Nietzsche"
philosopher_life: "1844-1900"
nationality: "Deutsch"

description: |
  Lebensphilosophie mit Betonung des Willens zur Macht, Perspektivismus und der 
  Umwertung aller Werte. Kritik der traditionellen Moral als "Sklavenmoral".

# Hauptthesen
main_theses:
  will_to_power:
    title: "Wille zur Macht"
    description: |
      Der fundamentale Trieb alles Lebendigen ist der Wille zur Macht - das Streben 
      nach Selbststeigerung, Wachstum und Überwindung von Widerständen.
    key_concepts:
      - "Grundtrieb des Lebens"
      - "Selbststeigerung und Wachstum"
      - "Macht als Schaffenskraft"
      - "Überwindung von Hindernissen"
  
  uebermensch:
    title: "Übermensch (Overman)"
    description: |
      Der Übermensch ist derjenige, der eigene Werte schafft, sich selbst überwindet 
      und das Leben in allen Aspekten bejaht. Er ist das Ziel der menschlichen Entwicklung.
    key_concepts:
      - "Selbstüberwindung"
      - "Schöpfung eigener Werte"
      - "Jenseits von Gut und Böse"
      - "Affirmation des Lebens"
  
  eternal_recurrence:
    title: "Ewige Wiederkunft"
    description: |
      Die Vorstellung, dass alles ewig wiederkehrt. Teste deine Entscheidungen: 
      Würdest du wollen, dass sie sich ewig wiederholen? Amor fati - liebe dein Schicksal.
    key_concepts:
      - "Ewige Wiederkehr des Gleichen"
      - "Amor fati - Liebe zum Schicksal"
      - "Test der Lebensentscheidungen"
      - "Bejahung der Existenz"
  
  perspectivism:
    title: "Perspektivismus"
    description: |
      Es gibt keine absolute Wahrheit, nur Interpretationen aus verschiedenen Perspektiven. 
      Erkenntnis ist perspektivisch gebunden.
    key_concepts:
      - "Keine absoluten Wahrheiten"
      - "Interpretationen statt Fakten"
      - "Wille zur Wahrheit als Wille zur Macht"
      - "Vielfalt der Perspektiven"
  
  master_slave_morality:
    title: "Herren- und Sklavenmoral"
    description: |
      Herrenmoral: gut = edel, mächtig, schön; schlecht = gemein, schwach, hässlich.
      Sklavenmoral: gut = demütig, mitleidig, gehorsam; böse = mächtig, egoistisch.
      Das Christentum ist Sklavenmoral.
    key_concepts:
      - "Herrenmoral der Aristokraten"
      - "Sklavenmoral der Schwachen"
      - "Ressentiment als Quelle der Sklavenmoral"
      - "Umwertung durch Judentum/Christentum"

# Nebenthesen
secondary_theses:
  death_of_god:
    title: "Tod Gottes"
    description: |
      "Gott ist tot" - die christlich-metaphysische Weltordnung ist zusammengebrochen. 
      Nihilismus droht, aber auch neue Möglichkeiten der Wertsetzung.
  
  transvaluation:
    title: "Umwertung aller Werte"
    description: |
      Die bestehenden Werte (christlich, demokratisch) müssen umgewertet werden. 
      Neue, lebensaffirmierende Werte sind nötig.
  
  dionysian_apollonian:
    title: "Dionysisch und Apollinisch"
    description: |
      Zwei Grundtriebe der Kunst und des Lebens: Das Dionysische (Rausch, Chaos, Einheit) 
      und das Apollinische (Traum, Form, Individuation).
  
  nihilism:
    title: "Nihilismus"
    description: |
      Der Zusammenbruch aller Werte führt zunächst zum Nihilismus. Dieser muss aber 
      überwunden werden durch aktive Wertsetzung.
  
  genealogy_of_morals:
    title: "Genealogie der Moral"
    description: |
      Historische Untersuchung der Entstehung moralischer Werte aus Machtkonstellationen 
      und psychologischen Motiven (Ressentiment).

# Stärken
strengths:
  - "Radikale Hinterfragung traditioneller Werte und Moral"
  - "Psychologische Tiefe in der Analyse menschlicher Motive"
  - "Betonung von Individualität und Selbstschöpfung"
  - "Lebensaffirmation statt asketischer Verneinung"
  - "Kritik des Dogmatismus und der 'Herdenmoral'"

# Schwächen
weaknesses:
  - "Gefahr des moralischen Relativismus und Nihilismus"
  - "Elitismus - Verachtung der 'Schwachen'"
  - "Fehlende konkrete ethische Orientierung"
  - "Missbrauchspotential durch autoritäre Ideologien (Faschismus)"
  - "Überschätzung individueller Autonomie"

# Anwendungsbeispiel
example_application: |
  Selbstoptimierungskultur: Die moderne Obsession mit Selbstoptimierung kann als Ausdruck 
  des Willens zur Macht verstanden werden. Aber wird hier der Übermensch angestrebt oder 
  nur die Konformität zu Leistungsidealen der Herdenmoral? Echte Selbstüberwindung würde 
  bedeuten, eigene Werte zu schaffen, nicht die Werte des Marktes zu internalisieren.

# Entscheidungsrahmen
decision_framework: |
  Bejahe das Leben in allen seinen Aspekten. Schaffe deine eigenen Werte. Strebe nach 
  Selbstüberwindung und Exzellenz. Frage: Würde ich wollen, dass diese Entscheidung 
  sich ewig wiederholt? Vermeide Herdenmoral und Ressentiment.

# Kernprinzipien für Debatten
core_principles:
  - "Wille zur Macht als Grundtrieb des Lebens"
  - "Übermensch - Schöpfung eigener Werte"
  - "Ewige Wiederkunft - Amor fati"
  - "Perspektivismus - keine absoluten Wahrheiten"
  - "Kritik der Sklavenmoral"
  - "Umwertung aller Werte"
  - "Lebensbejahung über Nihilismus hinaus"

# Wichtige Werke
key_works:
  - title: "Also sprach Zarathustra"
    year: 1883-1885
    description: "Philosophischer Roman über den Übermenschen"
  
  - title: "Jenseits von Gut und Böse"
    year: 1886
    description: "Kritik der Moral und Perspektivismus"
  
  - title: "Zur Genealogie der Moral"
    year: 1887
    description: "Historische Analyse der Moralentstehung"
  
  - title: "Die fröhliche Wissenschaft"
    year: 1882
    description: "Tod Gottes und Lebensbejahung"
  
  - title: "Der Antichrist"
    year: 1888
    description: "Radikale Kritik des Christentums"

# Relevante Dimensionen
relevant_dimensions:
  - "ethical"           # Ethik und Moral
  - "metaphysical"      # Metaphysik des Willens
  - "existential"       # Existenzielle Fragen
  - "psychological"     # Psychologische Analyse
  - "cultural"          # Kulturkritik
