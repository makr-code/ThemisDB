# Aldo Leopold - Environmental Ethics / Umweltethik

school_id: leopold
name: "Environmental Ethics (Leopold)"
name_de: "Umweltethik (Leopold)"

## Hauptvertreter / Main Representatives
founders:
  - name: "Aldo Leopold"
    years: "1887-1948"
    nationality: "American"
    key_works:
      - title: "A Sand County Almanac"
        year: 1949
        significance: "Introduced 'land ethic' - ecocentric ethics"
    biography: "Forester and conservationist, pioneer of environmental ethics and wilderness protection"
  
  - name: "Hans Jonas"
    years: "1903-1993"
    nationality: "German-American"
    key_works:
      - title: "The Imperative of Responsibility"
        year: 1979
        significance: "Ethics for technological civilization, precautionary principle"
    biography: "Philosopher who extended ethics to include responsibility for future generations and nature"
  
  - name: "Peter Singer"
    years: "1946-present"
    nationality: "Australian"
    key_works:
      - title: "Animal Liberation"
        year: 1975
        significance: "Expanded moral consideration to animals"
      - title: "Practical Ethics"
        year: 1979
        significance: "Applied ethics including environmental issues"
    biography: "Utilitarian philosopher, pioneer of animal rights and environmental ethics"

## Historischer Kontext / Historical Context
historical_context:
  period: "20th Century - Present"
  philosophical_movement: "Environmental Philosophy, Deep Ecology"
  zeitgeist: "Environmental crisis, sustainability, climate change, biodiversity loss"
  influences:
    - source: "Conservation Movement"
      thinkers: ["Muir", "Leopold"]
      impact: "Value of wilderness and nature"
    - source: "Systems Thinking"
      thinkers: ["Carson", "Lovelock"]
      impact: "Interconnectedness of ecosystems"
    - source: "Indigenous Philosophy"
      impact: "Respect for nature, interconnectedness"
  reactions_against:
    - "Anthropocentrism (human-centered ethics)"
    - "Unlimited economic growth paradigm"
    - "Environmental degradation"
    - "Species extinction"

## Hauptthesen / Main Theses
main_theses:
  - thesis_id: "land_ethic"
    name: "Land Ethic (Leopold)"
    description: "Expand ethical community to include land, animals, and plants"
    explanation: |
      'A thing is right when it tends to preserve the integrity, stability, 
      and beauty of the biotic community. It is wrong when it tends otherwise.'
      Ethics must extend beyond humans to encompass entire ecosystems.
  
  - thesis_id: "precautionary_principle"
    name: "Precautionary Principle (Jonas)"
    description: "In face of uncertainty, err on side of caution regarding environmental harm"
    explanation: |
      When activities may lead to serious or irreversible environmental harm,
      lack of full scientific certainty should not prevent protective measures.
      Future generations have rights we must respect.
  
  - thesis_id: "intrinsic_value"
    name: "Intrinsic Value of Nature"
    description: "Nature has value independent of human utility"
    explanation: |
      Species, ecosystems, and nature itself have inherent worth,
      not merely instrumental value for human purposes.
      This grounds obligations to preserve biodiversity and wilderness.

