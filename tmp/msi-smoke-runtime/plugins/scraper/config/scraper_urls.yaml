# ============================================================================
# ThemisDB Scraper Plugin – User Configuration
# ============================================================================
# This file configures a single scraper run targeting one data gap.
# Copy and adapt this template for each gap you want to fill.
#
# For the government source catalog (Bund / Bundesländer / EU),
# see gov_sources.yaml and set the gov_sources section below.
# ============================================================================

# ---------------------------------------------------------------------------
# Gap context – describes the data gap being filled
# ---------------------------------------------------------------------------
gap_context:
  gap_id: "GAP-001"
  description: "Fehlende Primärdaten zu Baugenehmigungsverfahren in Bayern"
  keywords:
    - "Baugenehmigung"
    - "BauGB"
    - "Bebauungsplan"
    - "Baugenehmigungsverfahren"
    - "§ 34 BauGB"

# ---------------------------------------------------------------------------
# Crawl options
# ---------------------------------------------------------------------------
crawl_options:
  max_depth: 3
  max_pages: 500
  user_agent: "ThemisDB-Scraper/1.0 (+https://github.com/makr-code/ThemisDB)"
  respect_robots: true
  same_domain_only: true
  request_delay_ms: 300          # polite delay between requests (ms)

  # Render mode: static | js_rendered | api_json | api_graphql
  render_mode: static

  # JS renderer command (only used when render_mode: js_rendered)
  # Example: "node /opt/themis/scripts/renderer.js"
  js_renderer_cmd: ""
  js_timeout_ms: 10000

# ---------------------------------------------------------------------------
# Search options – drive search-form submission and result-list parsing
# ---------------------------------------------------------------------------
search_options:
  enabled: true
  # Explicit queries override gap_context.keywords when non-empty
  queries: []
  max_result_pages: 10
  results_per_page: 20
  # Optional CSS selector hint for result list container (empty = auto-detect)
  result_list_selector: ""

# ---------------------------------------------------------------------------
# API options – for api_json / api_graphql render modes
# ---------------------------------------------------------------------------
api_options:
  pagination_mode: page          # page | cursor | offset | none
  page_param: "p"
  cursor_field: ""
  results_field: "results"
  max_pages: 20
  headers: {}
  # POST body template: {{QUERY}}, {{PAGE}}, {{CURSOR}} are substituted
  body_template: ""

# ---------------------------------------------------------------------------
# LLM evaluation options
# ---------------------------------------------------------------------------
llm_options:
  # Documents with quality_score below this are discarded
  quality_threshold: 0.65
  # Path to GGUF model file; empty = use LLM plugin manager from environment
  model_path: ""
  temperature: 0.1

# ---------------------------------------------------------------------------
# Government source groups (from built-in catalog)
# ---------------------------------------------------------------------------
gov_sources:
  bund_enabled: true
  bundeslaender_enabled: false   # set true to include all 16 Bundesländer
  eu_enabled: false              # set true to include EUR-Lex, CURIA, etc.

  # Optional: restrict to specific source IDs from the catalog
  # (overrides bund_enabled / bundeslaender_enabled / eu_enabled when non-empty)
  source_ids:
    - "openjur"
    - "gesetze_im_internet"
    - "rechtsprechung_im_internet"

  # Path to a custom gov_sources YAML overlay; empty = built-in catalog only
  custom_catalog_path: ""

# ---------------------------------------------------------------------------
# Additional seed URLs (crawled directly, in addition to gov sources)
# ---------------------------------------------------------------------------
seed_urls:
  - "https://www.stmb.bayern.de/buw/bauen/"

# ---------------------------------------------------------------------------
# URL whitelist – only URLs matching at least one entry are crawled.
# Empty list means all URLs (that pass the blacklist) are allowed.
# Supports prefix match and simple glob (* at start or end).
# ---------------------------------------------------------------------------
whitelist:
  - "https://openjur.de"
  - "https://www.gesetze-im-internet.de"
  - "https://www.rechtsprechung-im-internet.de"
  - "https://www.stmb.bayern.de"

# ---------------------------------------------------------------------------
# URL blacklist – URLs matching any entry are blocked regardless of whitelist.
# ---------------------------------------------------------------------------
blacklist:
  - "*.pdf"
  - "*.zip"
  - "*.doc"
  - "*.docx"
  - "https://www.stmb.bayern.de/intern"
