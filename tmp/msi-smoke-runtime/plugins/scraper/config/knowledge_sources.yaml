# ============================================================================
# ThemisDB Scraper Plugin – Comprehensive Knowledge Source Catalog
# ============================================================================
#
# This file defines RELIABLE sources for legal, regulatory, standards and
# general-knowledge data.  Every URL is public and freely accessible.
# The scraper plugin loads this file when gov_sources.yaml includes an
# `overlay_path` pointing here, or when the user sets `sources_file` in
# scraper_urls.yaml.
#
# ── CATEGORY CODES ──────────────────────────────────────────────────────────
#   LAW_EU         EU primary/secondary law
#   CASE_EU        EU case law
#   LAW_BUND       German federal statutes & regulations
#   CASE_BUND      German federal courts
#   LAW_LAND_*     German state law (BW, BY, BE, BB, HB, HH, HE, MV,
#                  NI, NW, RP, SL, SN, ST, SH, TH)
#   STANDARD       Technical standards (DIN, ISO, CEN, VDE, IEC)
#   WIKI           Encyclopedic / general knowledge
#   DATA           Structured open data / statistics
#   SCIENTIFIC     Peer-reviewed journals / preprint servers
# ============================================================================

# ============================================================================
# EU SOURCES
# ============================================================================
sources:

  # --------------------------------------------------------------------------
  # Primary EU Law
  # --------------------------------------------------------------------------
  - id: eurlex
    name: "EUR-Lex – Europäisches Recht"
    category: LAW_EU
    base_url: "https://eur-lex.europa.eu"
    search_url: "https://eur-lex.europa.eu/search.html"
    render_mode: static
    search_style: html_form
    search_param: "text"
    result_list_selector: ".SearchResult"
    next_page_selector: ".next"
    license: "CC BY 4.0 (open data)"
    language: ["de", "en", "fr"]
    notes: "Amtsblatt der EU, Verordnungen, Richtlinien, Beschlüsse"

  - id: eurlex_sparql
    name: "EUR-Lex CELLAR SPARQL Endpoint"
    category: LAW_EU
    base_url: "https://publications.europa.eu/webapi/rdf/sparql"
    render_mode: api_graphql
    search_style: sparql
    license: "CC BY 4.0"
    notes: "Strukturierte RDF-Abfragen; Work-URI → Titel/Datum/Typ"

  - id: ep_open_data
    name: "Europäisches Parlament – Open Data Portal"
    category: LAW_EU
    base_url: "https://data.europarl.europa.eu/api/v1"
    render_mode: api_json
    search_style: rest_api
    pagination_type: page
    page_param: "page-number"
    license: "CC BY 4.0"
    notes: "Beschlüsse, Berichte, Tätigkeitsberichte des EP"

  - id: eu_publications_office
    name: "EU Publications Office – OP Portal"
    category: LAW_EU
    base_url: "https://op.europa.eu/en/publication-detail"
    render_mode: static
    search_style: html_form
    license: "CC BY 4.0"

  - id: curia
    name: "CURIA – Europäischer Gerichtshof"
    category: CASE_EU
    base_url: "https://curia.europa.eu"
    search_url: "https://curia.europa.eu/juris/recherche.jsf"
    render_mode: js_rendered
    search_style: html_form
    search_param: "text"
    result_list_selector: ".resultContent"
    next_page_selector: "a.ecl-link--icon-after"
    license: "© EU (free use)"
    notes: "EuGH + EuG Urteile, Schlussanträge"

  - id: echr_hudoc
    name: "EGMR HUDOC – Europäischer Gerichtshof für Menschenrechte"
    category: CASE_EU
    base_url: "https://hudoc.echr.coe.int"
    render_mode: api_json
    search_style: rest_api
    api_url: "https://hudoc.echr.coe.int/app/query/results"
    pagination_type: cursor
    cursor_param: "start"
    license: "© Europarat (free use)"
    notes: "EMRK-Urteile; cursor-basierte Pagination mit start-Parameter"

  - id: eur_lex_treaties
    name: "EUR-Lex – Gründungsverträge"
    category: LAW_EU
    base_url: "https://eur-lex.europa.eu/collection/eu-law/treaties.html"
    render_mode: static
    license: "CC BY 4.0"
    notes: "AEUV, EUV, Charta der Grundrechte"

  # --------------------------------------------------------------------------
  # EU Data & Statistics
  # --------------------------------------------------------------------------
  - id: eurostat
    name: "Eurostat – EU-Statistiken"
    category: DATA
    base_url: "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1"
    render_mode: api_json
    search_style: rest_api
    license: "CC BY 4.0"
    notes: "Statistiken zu Wirtschaft, Bevölkerung, Umwelt"

  - id: eu_open_data_portal
    name: "EU Open Data Portal"
    category: DATA
    base_url: "https://data.europa.eu/api/hub/search"
    render_mode: api_json
    pagination_type: page
    page_param: "page"
    license: "CC BY 4.0"

  - id: eea
    name: "Europäische Umweltagentur (EEA)"
    category: DATA
    base_url: "https://www.eea.europa.eu"
