# Geo/GIS Processor Configuration
# 
# Extracts coordinates, metadata, and spatial data from geospatial files.
# Backend: GDAL/OGR
#
# Version: 1.0

processor:
  name: "Geo/GIS Processor"
  version: "1.0.0"
  library: "themis_proc_geo"
  description: "Extract spatial data from geospatial files"
  
  # Supported MIME types
  mime_types:
    - "application/geo+json"
    - "application/json"  # Can contain GeoJSON
    - "application/vnd.google-earth.kml+xml"
    - "application/vnd.google-earth.kmz"
    - "application/gpx+xml"
    - "application/x-shapefile"
    - "application/x-esri-shapefile"
    - "image/tiff"  # GeoTIFF
    - "application/geopackage+sqlite3"
    - "application/x-sqlite3"  # Can be GeoPackage
    - "application/wkt"
    - "application/x-wkb"
  
  # Supported file extensions
  extensions:
    - ".geojson"
    - ".json"
    - ".kml"
    - ".kmz"
    - ".gpx"
    - ".shp"
    - ".shx"
    - ".dbf"
    - ".prj"
    - ".tif"
    - ".tiff"
    - ".gpkg"
    - ".gdb"
    - ".mif"
    - ".tab"
    - ".osm"
    - ".pbf"
    - ".wkt"
    - ".wkb"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Extract coordinates
    coordinates: true
    
    # Extract feature properties
    properties: true
    
    # Extract CRS (Coordinate Reference System)
    crs: true
    
    # Calculate bounding box
    bounds: true
    
    # Extract topological relationships
    topology: false
    
    # Include geometry WKT
    include_wkt: false
    
    # Include geometry GeoJSON
    include_geojson: true
    
    # Simplify geometries (Douglas-Peucker)
    simplify: false
    simplify_tolerance: 0.0001
  
  # ============================================================================
  # Format-Specific Settings
  # ============================================================================
  formats:
    # GeoJSON settings
    geojson:
      validate_schema: true
      fix_winding_order: true
    
    # Shapefile settings
    shapefile:
      encoding: utf-8
      include_dbf: true
      include_prj: true
    
    # GPX settings
    gpx:
      tracks: true
      waypoints: true
      routes: true
      timestamps: true
      elevations: true
      extensions: true
    
    # KML/KMZ settings
    kml:
      placemarks: true
      styles: false
      network_links: false
      tours: false
    
    # GeoTIFF settings
    geotiff:
      extract_bands: false
      compute_statistics: true
      extract_metadata: true
      max_resolution: 10000  # Max pixels per dimension
    
    # GeoPackage settings
    geopackage:
      all_layers: true
      layer_filter: []  # Empty = all layers
  
  # ============================================================================
  # Spatial Indexing
  # ============================================================================
  indexing:
    # Enable spatial indexing
    enabled: true
    
    # Index type
    # - rtree: R-Tree spatial index
    # - quadtree: Quadtree index
    # - h3: Uber H3 hexagonal index
    # - s2: Google S2 index
    index_type: rtree
    
    # H3 resolution (0-15, only for h3 type)
    h3_resolution: 9
    
    # S2 level (0-30, only for s2 type)
    s2_level: 12
  
  # ============================================================================
  # Coordinate Transformation
  # ============================================================================
  transformation:
    # Default output CRS
    default_crs: "EPSG:4326"
    
    # Allow automatic reprojection
    allow_reprojection: true
    
    # Supported input CRS (empty = all)
    supported_crs: []
    
    # Transformation accuracy (meters)
    accuracy: 0.01
  
  # ============================================================================
  # Chunking Settings
  # ============================================================================
  chunking:
    # Chunking strategy
    # - feature: One chunk per feature
    # - tile: Spatial tiles
    # - none: No chunking (single chunk)
    strategy: feature
    
    # Maximum features per chunk (for feature strategy)
    max_features: 100
    
    # Tile size in degrees (for tile strategy)
    tile_size: 1.0
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Maximum file size (MB)
    max_file_size_mb: 500
    
    # Maximum features to process
    max_features: 1000000
    
    # Maximum coordinates per geometry
    max_coordinates: 100000
    
    # Allow network resources (KML network links)
    allow_network: false
    
    # Validate geometries
    validate_geometry: true
  
  # ============================================================================
  # Backend Settings
  # ============================================================================
  backend:
    # Backend library
    library: gdal
    
    # Minimum GDAL version
    version_min: "3.0"
    
    # GDAL configuration options
    options:
      OGR_GEOJSON_MAX_OBJ_SIZE: "200MB"
      GDAL_HTTP_TIMEOUT: "30"
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff,.vrt"
