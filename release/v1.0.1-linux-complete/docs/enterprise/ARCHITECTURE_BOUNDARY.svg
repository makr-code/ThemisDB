<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    ThemisDB Architecture: Core vs. Plugin Layer
  </text>
  
  <!-- Client Layer -->
  <rect x="50" y="60" width="1100" height="80" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="600" y="90" font-size="16" font-weight="bold" text-anchor="middle" fill="#1976D2">Client Layer</text>
  <text x="600" y="115" font-size="12" text-anchor="middle" fill="#555">
    Python SDK | JavaScript SDK | HTTP REST | AQL Console
  </text>
  
  <!-- Arrow -->
  <line x1="600" y1="140" x2="600" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="650" y="160" font-size="11" fill="#555">HTTP REST / AQL</text>
  
  <!-- ThemisDB Core Container -->
  <rect x="50" y="180" width="700" height="620" fill="#FFF9C4" stroke="#F57C00" stroke-width="3"/>
  <text x="400" y="205" font-size="18" font-weight="bold" text-anchor="middle" fill="#E65100">
    ThemisDB Core (Always Present)
  </text>
  
  <!-- Query Engine -->
  <rect x="80" y="220" width="640" height="100" fill="#FFF" stroke="#F57C00" stroke-width="2"/>
  <text x="400" y="245" font-size="14" font-weight="bold" text-anchor="middle">Query Engine</text>
  <text x="100" y="270" font-size="11" fill="#555">• AQL Parser & Optimizer</text>
  <text x="100" y="290" font-size="11" fill="#555">• Function Registry</text>
  <text x="100" y="310" font-size="11" fill="#555">• Execution Engine</text>
  <text x="450" y="290" font-size="11" fill="#E65100" font-weight="bold">← GPU_ANALYZE_IMPACT() registered here</text>
  
  <!-- Index Layer -->
  <rect x="80" y="340" width="640" height="120" fill="#FFF" stroke="#F57C00" stroke-width="2"/>
  <text x="400" y="365" font-size="14" font-weight="bold" text-anchor="middle">Index Layer</text>
  
  <rect x="100" y="380" width="160" height="60" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="180" y="395" font-size="12" font-weight="bold" text-anchor="middle">Graph Index</text>
  <text x="180" y="415" font-size="10" text-anchor="middle">Adjacency Lists</text>
  <text x="180" y="430" font-size="10" text-anchor="middle">Edge Types</text>
  
  <rect x="280" y="380" width="160" height="60" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="360" y="395" font-size="12" font-weight="bold" text-anchor="middle">Vector Index</text>
  <text x="360" y="415" font-size="10" text-anchor="middle">HNSW</text>
  
  <rect x="460" y="380" width="160" height="60" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="540" y="395" font-size="12" font-weight="bold" text-anchor="middle">Secondary Index</text>
  <text x="540" y="415" font-size="10" text-anchor="middle">B-Tree, Range</text>
  
  <!-- Analytics Layer (part of core) -->
  <rect x="80" y="480" width="640" height="100" fill="#FFF" stroke="#F57C00" stroke-width="2"/>
  <text x="400" y="505" font-size="14" font-weight="bold" text-anchor="middle">Analytics Layer (Built-in)</text>
  <text x="100" y="530" font-size="11" fill="#555">• OLAP (GROUP BY, HAVING)</text>
  <text x="100" y="550" font-size="11" fill="#555">• Process Mining</text>
  <text x="100" y="570" font-size="11" fill="#555">• Time Series Analysis</text>
  <text x="450" y="550" font-size="10" fill="#E65100">✓ Part of core binary</text>
  
  <!-- Plugin Manager -->
  <rect x="80" y="600" width="640" height="80" fill="#FFF" stroke="#F57C00" stroke-width="2"/>
  <text x="400" y="625" font-size="14" font-weight="bold" text-anchor="middle">Plugin Manager</text>
  <text x="100" y="650" font-size="11" fill="#555">• Plugin Discovery</text>
  <text x="100" y="670" font-size="11" fill="#555">• DLL Loading (Windows/Linux/macOS)</text>
  <text x="450" y="650" font-size="11" fill="#555">• Lifecycle Management</text>
  
  <!-- Storage Layer -->
  <rect x="80" y="700" width="640" height="80" fill="#FFF" stroke="#F57C00" stroke-width="2"/>
  <text x="400" y="725" font-size="14" font-weight="bold" text-anchor="middle">Storage Layer</text>
  <text x="180" y="750" font-size="11" fill="#555">RocksDB LSM-Tree</text>
  <text x="180" y="770" font-size="11" fill="#555">• MVCC Transactions</text>
  <text x="480" y="750" font-size="11" fill="#555">• Write-Ahead Log</text>
  <text x="480" y="770" font-size="11" fill="#555">• Compaction</text>
  
  <!-- Plugin Layer Container -->
  <rect x="800" y="180" width="350" height="620" fill="#FCE4EC" stroke="#C2185B" stroke-width="3"/>
  <text x="975" y="205" font-size="18" font-weight="bold" text-anchor="middle" fill="#880E4F">
    Plugin Layer (Optional)
  </text>
  
  <!-- GPU Impact Analysis Plugin -->
  <rect x="820" y="220" width="310" height="260" fill="#FFF" stroke="#C2185B" stroke-width="2"/>
  <text x="975" y="245" font-size="14" font-weight="bold" text-anchor="middle">GPU Impact Analysis Plugin</text>
  <text x="975" y="265" font-size="11" text-anchor="middle" fill="#880E4F">(Enterprise DLL/SO)</text>
  
  <text x="840" y="290" font-size="11" fill="#555">• analyzeImpact()</text>
  <text x="840" y="310" font-size="11" fill="#555">• monteCarloRisk()</text>
  <text x="840" y="330" font-size="11" fill="#555">• temporalImpact()</text>
  <text x="840" y="350" font-size="11" fill="#555">• detectPatterns()</text>
  
  <rect x="840" y="370" width="270" height="90" fill="#FFEBEE" stroke="#C2185B" stroke-width="1"/>
  <text x="975" y="390" font-size="11" font-weight="bold" text-anchor="middle">GPU Backends</text>
  <text x="860" y="415" font-size="10" fill="#555">• CUDA (NVIDIA)</text>
  <text x="860" y="435" font-size="10" fill="#555">• Vulkan (Cross-platform)</text>
  <text x="860" y="455" font-size="10" fill="#555">• HIP (AMD)</text>
  
  <!-- Other Plugins -->
  <rect x="820" y="500" width="310" height="100" fill="#FFF" stroke="#C2185B" stroke-width="2"/>
  <text x="975" y="525" font-size="14" font-weight="bold" text-anchor="middle">Other Enterprise Plugins</text>
  <text x="840" y="550" font-size="11" fill="#555">• Legal Compliance Checker</text>
  <text x="840" y="570" font-size="11" fill="#555">• Financial Risk Models</text>
  <text x="840" y="590" font-size="11" fill="#555">• ML-based Anomaly Detection</text>
  
  <!-- Plugin Features -->
  <rect x="820" y="620" width="310" height="160" fill="#FFF" stroke="#C2185B" stroke-width="2"/>
  <text x="975" y="645" font-size="13" font-weight="bold" text-anchor="middle">Plugin Characteristics</text>
  <text x="840" y="670" font-size="10" fill="#555">✓ Separate DLL/SO binary</text>
  <text x="840" y="690" font-size="10" fill="#555">✓ Optional deployment</text>
  <text x="840" y="710" font-size="10" fill="#555">✓ Enterprise license</text>
  <text x="840" y="730" font-size="10" fill="#555">✓ GPU hardware required</text>
  <text x="840" y="750" font-size="10" fill="#555">✓ Independent versioning</text>
  <text x="840" y="770" font-size="10" fill="#555">✓ Data access via REST API only</text>
  
  <!-- Connection arrow between Core and Plugin -->
  <line x1="750" y1="640" x2="800" y2="640" stroke="#C2185B" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="775" y="630" font-size="10" text-anchor="middle" fill="#C2185B">IThemisPlugin</text>
  <text x="775" y="660" font-size="10" text-anchor="middle" fill="#C2185B">Interface</text>
  
  <!-- Data flow arrows -->
  <line x1="820" y1="400" x2="750" y2="400" stroke="#FF5722" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="785" y="390" font-size="9" text-anchor="middle" fill="#FF5722">REST API</text>
  <text x="785" y="420" font-size="9" text-anchor="middle" fill="#FF5722">(GET /graph/neighbors)</text>
  
  <!-- Legend -->
  <rect x="50" y="820" width="1100" height="60" fill="#F5F5F5" stroke="#999" stroke-width="1"/>
  <text x="100" y="845" font-size="14" font-weight="bold">Legend:</text>
  
  <rect x="180" y="835" width="15" height="15" fill="#FFF9C4" stroke="#F57C00" stroke-width="2"/>
  <text x="205" y="847" font-size="12">ThemisDB Core (Always)</text>
  
  <rect x="400" y="835" width="15" height="15" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
  <text x="425" y="847" font-size="12">Plugin Layer (Optional)</text>
  
  <rect x="650" y="835" width="15" height="15" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1"/>
  <text x="675" y="847" font-size="12">Indexes</text>
  
  <line x1="850" y1="842" x2="900" y2="842" stroke="#FF5722" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="910" y="847" font-size="12">Data Flow (REST API)</text>
  
  <text x="100" y="870" font-size="11" fill="#666">
    Key Principle: Plugins have NO direct RocksDB access. All data access via REST API.
  </text>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#C2185B" />
    </marker>
  </defs>
</svg>
