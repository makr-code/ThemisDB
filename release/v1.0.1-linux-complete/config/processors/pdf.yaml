# PDF Processor Configuration
# 
# Extracts text, metadata, and structure from PDF documents.
# Backend: poppler-cpp or pdfium
#
# Version: 1.0

processor:
  name: "PDF Processor"
  version: "1.0.0"
  library: "themis_proc_pdf"
  description: "Extract text and metadata from PDF documents"
  
  # Supported MIME types
  mime_types:
    - "application/pdf"
    - "application/x-pdf"
    - "application/x-bzpdf"
    - "application/x-gzpdf"
  
  # Supported file extensions
  extensions:
    - ".pdf"
  
  # ============================================================================
  # Extraction Settings
  # ============================================================================
  extraction:
    # Extract plain text
    text: true
    
    # Extract document metadata (title, author, etc.)
    metadata: true
    
    # Extract embedded images (requires additional processing)
    images: false
    
    # Extract font information
    fonts: false
    
    # Extract PDF annotations (comments, highlights)
    annotations: true
    
    # Extract form field values
    form_fields: true
    
    # Extract document outline/bookmarks
    bookmarks: true
    
    # Extract hyperlinks
    links: true
    
    # Maintain text positioning (for layout analysis)
    maintain_layout: false
  
  # ============================================================================
  # OCR Settings (for scanned PDFs)
  # ============================================================================
  ocr:
    # Enable OCR for image-based pages
    enabled: false
    
    # OCR engine (tesseract, paddleocr)
    engine: tesseract
    
    # Languages for OCR (ISO 639-3 codes)
    languages:
      - deu
      - eng
    
    # DPI for rendering pages before OCR
    dpi: 300
    
    # Timeout for OCR per page
    timeout_per_page_sec: 30
    
    # Skip OCR if text layer detected
    skip_if_text_present: true
  
  # ============================================================================
  # Chunking Settings
  # ============================================================================
  chunking:
    # Chunking strategy
    # - page: One chunk per page
    # - paragraph: Split by paragraphs
    # - sentence: Split by sentences
    # - fixed: Fixed token count
    strategy: page
    
    # Maximum tokens per chunk
    max_tokens: 512
    
    # Token overlap between chunks
    overlap_tokens: 50
    
    # Preserve document structure in chunks
    preserve_structure: true
    
    # Include page numbers in chunk metadata
    include_page_numbers: true
  
  # ============================================================================
  # Security Settings
  # ============================================================================
  security:
    # Allow processing of encrypted PDFs (with password)
    allow_encrypted: true
    
    # Maximum pages to process (0 = unlimited)
    max_pages: 1000
    
    # Allow JavaScript execution in PDFs
    javascript_enabled: false
    
    # Allow external link resolution
    external_links_allowed: false
    
    # Scan for malicious content
    malware_scan: true
  
  # ============================================================================
  # Backend Settings
  # ============================================================================
  backend:
    # Backend library (poppler, pdfium, mupdf)
    library: poppler
    
    # Minimum version required
    version_min: "22.0"
    
    # Thread-safe mode
    thread_safe: true
    
    # Memory limit for backend
    memory_limit_mb: 256
