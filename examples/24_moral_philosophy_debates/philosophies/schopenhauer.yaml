# Arthur Schopenhauer - Lebensphilosophie
# Welt als Wille und Vorstellung, Pessimismus, Mitleidsethik

school: lebensphilosophie_schopenhauer
name: "Schopenhauersche Lebensphilosophie"
philosopher_name: "Arthur Schopenhauer"
philosopher_life: "1788-1860"
nationality: "Deutsch"

description: |
  Pessimistische Lebensphilosophie, die die Welt als blinden Willen und Leiden versteht. 
  Ethik des Mitleids als Überwindung des Egoismus. Einfluss von Kant und indischer Philosophie.

# Hauptthesen
main_theses:
  world_as_will:
    title: "Welt als Wille und Vorstellung"
    description: |
      Die Welt ist einerseits unsere Vorstellung (erscheinende Welt, Phänomen), 
      andererseits ist ihr Wesen der blinde, zielloser Wille (Ding an sich).
    key_concepts:
      - "Phänomen (Vorstellung) vs. Ding an sich (Wille)"
      - "Blinder, irrationaler Wille als Weltwesen"
      - "Wille manifestiert sich in allen Erscheinungen"
      - "Satz vom Grund gilt nur für Vorstellung, nicht für Wille"
  
  life_is_suffering:
    title: "Leben ist Leiden"
    description: |
      Der Wille führt zu endlosem Streben und Begehren, das nie dauerhaft befriedigt werden kann. 
      Leben ist wesentlich Leiden - zwischen Entbehrung, momentaner Befriedigung und Langeweile.
    key_concepts:
      - "Endloses Begehren ohne Erfüllung"
      - "Leiden als Wesen des Lebens"
      - "Pendeln zwischen Schmerz und Langeweile"
      - "Pessimistische Anthropologie"
  
  principium_individuationis:
    title: "Principium Individuationis"
    description: |
      Die Individuation (Trennung in einzelne Wesen) ist Illusion der Vorstellung. 
      In Wahrheit sind alle Wesen Manifestationen desselben einen Willens.
    key_concepts:
      - "Individuation als Schein (Maya)"
      - "Einheit allen Seins im Willen"
      - "Raum und Zeit als Prinzip der Individuation"
      - "Durchschauung der Individuation führt zu Mitleid"
  
  compassion_ethics:
    title: "Mitleidsethik"
    description: |
      Echte Moral entspringt dem Mitleid (Mitleid), der Erkenntnis, dass das Leiden anderer 
      mein eigenes Leiden ist, weil wir alle derselbe Wille sind.
    key_concepts:
      - "Mitleid als Grundlage der Moral"
      - "Erkenntnis der metaphysischen Identität"
      - "Leiden anderer als eigenes Leiden"
      - "Gegen Egoismus und Bosheit"
  
  aesthetic_contemplation:
    title: "Ästhetische Kontemplation"
    description: |
      In der Kunst können wir vorübergehend dem Willen entkommen, indem wir zu willenlosem 
      Subjekt des Erkennens werden und die Ideen anschauen.
    key_concepts:
      - "Willenloses Subjekt des Erkennens"
      - "Anschauung der platonischen Ideen"
      - "Vorübergehende Erlösung vom Leiden"
      - "Musik als höchste Kunst"

# Nebenthesen
secondary_theses:
  denial_of_will:
    title: "Verneinung des Willens zum Leben"
    description: |
      Der Weg zur echten Erlösung ist die Askese - die Verneinung des eigenen Willens 
      zum Leben. Dies führt ins Nirwana.
  
  four_root_principle:
    title: "Vierfache Wurzel des Satzes vom zureichenden Grund"
    description: |
      Vier Formen des Grundes: Werden, Erkennen, Sein, Handeln. Sie gelten nur für 
      die Vorstellung, nicht für das Ding an sich.
  
  genius:
    title: "Genie"
    description: |
      Das Genie ist fähig, die Ideen zu erkennen und in Kunstwerken darzustellen. 
      Es übersteigt die gewöhnliche Erkenntnis.
  
  sexual_love:
    title: "Metaphysik der Geschlechtsliebe"
    description: |
      Die romantische Liebe ist List des Willens der Gattung, um Fortpflanzung 
      zu sichern. Individuen sind Spielbälle des Gattungswillens.

# Stärken
strengths:
  - "Tiefgründige Analyse des menschlichen Leidens"
  - "Metaphysisch fundierte Ethik des Mitleids"
  - "Philosophie der Kunst und ästhetischen Erfahrung"
  - "Integration östlicher (buddhistischer) Weisheit"
  - "Ehrlichkeit über die dunklen Seiten der Existenz"

# Schwächen
weaknesses:
  - "Extremer Pessimismus unterschätzt positive Aspekte des Lebens"
  - "Metaphysik des Willens schwer zu verifizieren"
  - "Askese als Ideal ist für die meisten unpraktikabel"
  - "Deterministisch - wenig Raum für Freiheit"
  - "Misogynie in seinen Schriften"

# Anwendungsbeispiel
example_application: |
  Tier ethik: Alle fühlenden Wesen - Menschen und Tiere - sind Manifestationen desselben 
  Willens und leiden auf gleiche Weise. Das Leiden eines Tieres ist metaphysisch identisch 
  mit menschlichem Leiden. Daher verlangt das Mitleid, Tiere ebenso zu behandeln wie Menschen. 
  Tierausbeutung ist moralisch verwerflich, weil sie auf der Illusion der radikalen Trennung 
  zwischen Mensch und Tier beruht.

# Entscheidungsrahmen
decision_framework: |
  Erkenne, dass alles Leiden geteilt wird - die Trennung zwischen Wesen ist Illusion. 
  Handle aus Mitleid, minimiere Leiden für alle fühlenden Wesen. Strebe nach Überwindung 
  des Egoismus durch Einsicht in die metaphysische Einheit. In extremis: Verneine den 
  Willen zum Leben.

# Kernprinzipien für Debatten
core_principles:
  - "Welt als Wille (blind, irrational) und Vorstellung"
  - "Leben ist wesentlich Leiden"
  - "Principium individuationis als Illusion"
  - "Mitleid als Grundlage der Moral"
  - "Ästhetische Kontemplation als Befreiung"
  - "Verneinung des Willens als Erlösung"
  - "Metaphysische Identität aller Wesen"

# Wichtige Werke
key_works:
  - title: "Die Welt als Wille und Vorstellung"
    year: 1818
    description: "Hauptwerk zur Willensmetaphysik"
  
  - title: "Über die Grundlage der Moral"
    year: 1840
    description: "Mitleidsethik"
  
  - title: "Parerga und Paralipomena"
    year: 1851
    description: "Aphorismen zur Lebensweisheit"
  
  - title: "Über die vierfache Wurzel des Satzes vom zureichenden Grunde"
    year: 1813
    description: "Erkenntnistheorie"

# Relevante Dimensionen
relevant_dimensions:
  - "ethical"          # Mitleidsethik
  - "metaphysical"     # Willensmetaphysik
  - "existential"      # Pessimismus, Leiden
  - "aesthetic"        # Kunstphilosophie
  - "moral"            # Moralphilosophie
