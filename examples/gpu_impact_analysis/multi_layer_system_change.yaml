# Multi-Layer Impact Analysis Configuration Example
# ThemisDB GPU Impact Analysis Plugin

analysis:
  name: "Multi-Layer System Change Analysis"
  type: "multi_layer_impact"

# Document change with layer metadata
document_change:
  document_id: "api/v2/payment/process"
  change_type: "breaking_change"
  magnitude: 0.95
  source_layer: "api"
  timestamp: "2025-12-07T17:00:00Z"
  
# Target layers to analyze (empty = all layers)
target_layers:
  - "process"     # Business process layer (BPMN workflows)
  - "api"         # API/Service layer
  - "database"    # Database schema layer
  - "ui"          # User interface layer
  - "document"    # Document/data layer

# FEM configuration with layer-specific settings
fem_config:
  damping_factor: 0.85
  impact_threshold: 0.01
  max_iterations: 100
  convergence_threshold: 0.001
  enable_cross_layer_propagation: true
  
  # Layer-specific damping factors
  # Lower values = more damping (less impact propagation)
  # Higher values = less damping (more impact propagation)
  layer_damping_factors:
    document: 0.90    # Documents propagate well within layer
    process: 0.85     # Process workflows propagate well
    api: 0.95         # API changes have high propagation
    database: 0.80    # Database changes are more contained
    ui: 0.75          # UI changes are more localized
    infrastructure: 0.70
  
  # Cross-layer damping factors
  # Format: "from_layer->to_layer": damping_factor
  cross_layer_damping:
    "api->process": 0.90      # API changes heavily impact processes
    "api->database": 0.85     # API changes impact database
    "api->ui": 0.80           # API changes impact UI
    "process->api": 0.75      # Process changes impact API less
    "process->database": 0.70 # Process changes impact DB moderately
    "database->api": 0.85     # Database changes impact API
    "database->process": 0.65 # Database changes impact processes less
    "ui->api": 0.60           # UI changes have limited API impact
    "document->process": 0.55 # Document changes impact processes moderately

# Analysis options
options:
  max_depth: 10
  impact_threshold: 0.01
  use_gpu: false
  collect_metrics: true
  track_cross_layer_transitions: true

# Expected output structure
expected_results:
  affected_nodes_per_layer:
    api: 5
    process: 12
    database: 3
    ui: 8
  cross_layer_transitions: 18
  layer_transition_paths:
    - ["api", "process"]
    - ["api", "database"]
    - ["process", "ui"]

# Layer metadata schema
layer_metadata_schema:
  # Document layer
  document:
    _layer: "document"
    _layer_metadata:
      document_type: "markdown|code|config"
      criticality: 0.0-1.0
      
  # Process layer (BPMN)
  process:
    _layer: "process"
    _layer_metadata:
      process_id: "order_workflow"
      task_type: "USER_TASK|SERVICE_TASK|GATEWAY"
      criticality: 0.0-1.0
      
  # API layer
  api:
    _layer: "api"
    _layer_metadata:
      api_version: "v1|v2"
      endpoint_type: "REST|GraphQL|gRPC"
      public_facing: true|false
      criticality: 0.0-1.0
      
  # Database layer
  database:
    _layer: "database"
    _layer_metadata:
      schema_name: "customers|orders|products"
      table_type: "fact|dimension|staging"
      criticality: 0.0-1.0
      
  # UI layer
  ui:
    _layer: "ui"
    _layer_metadata:
      component_type: "page|widget|form"
      framework: "react|vue|angular"
      criticality: 0.0-1.0

# Edge types for cross-layer connections
cross_layer_edge_types:
  - DOCUMENT_USES_API          # document -> api
  - PROCESS_CALLS_API          # process -> api
  - API_QUERIES_DATABASE       # api -> database
  - UI_CALLS_API               # ui -> api
  - UI_TRIGGERS_PROCESS        # ui -> process
  - PROCESS_UPDATES_DOCUMENT   # process -> document
  - DATABASE_SCHEMA_FOR_API    # database -> api
  - API_RETURNS_TO_UI          # api -> ui
