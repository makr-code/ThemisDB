schema_version: 1
sources:
  primary:
    type: github_releases
    owner: makr-code
    repo: ThemisDB
    channel_mapping:
      stable: stable
      beta: prerelease
      nightly: nightly
  mirrors: []

network:
  connect_timeout_seconds: 15
  read_timeout_seconds: 60
  max_retries: 3
  retry_backoff_seconds: 2
  enable_resume: true
