version: '3.8'

services:
  # ThemisDB Backend
  themisdb:
    image: themisdb/themisdb:latest
    container_name: railway-themisdb
    ports:
      - "8765:8765"      # REST API
      - "9090:9090"      # WebSocket
    environment:
      - THEMIS_LOG_LEVEL=INFO
      - THEMIS_ENABLE_CEP=true
      - THEMIS_ENABLE_LLM=true
    volumes:
      - themisdb-data:/var/lib/themisdb
      - ./data:/data
    networks:
      - railway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: railway-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - railway-net
    command: serve
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Pull Llama model (runs once)
  ollama-setup:
    image: ollama/ollama:latest
    container_name: railway-ollama-setup
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - railway-net
    entrypoint: /bin/sh
    command: 
      - -c
      - |
        ollama pull llama3.2:latest
        echo "Ollama model pulled successfully"
    restart: "no"

  # Train Simulator Service
  train-simulator:
    build:
      context: ../../scripts/railway
      dockerfile: Dockerfile.simulator
    container_name: railway-simulator
    depends_on:
      themisdb:
        condition: service_healthy
    environment:
      - THEMISDB_URL=http://themisdb:8765
      - NUM_TRAINS=50
      - UPDATE_INTERVAL=1.0
      - ENABLE_ENERGY_CALC=true
      - LOG_LEVEL=INFO
    volumes:
      - ../../data:/data
      - ../../scripts/railway:/app
    networks:
      - railway-net
    command: python train_simulator.py --trains 50 --themisdb-url http://themisdb:8765
    restart: unless-stopped

  # Web Interface (Nginx serving static HTML)
  web-ui:
    image: nginx:alpine
    container_name: railway-web-ui
    ports:
      - "8080:80"
    volumes:
      - ./live_map.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - railway-net
    depends_on:
      - themisdb
    restart: unless-stopped

volumes:
  themisdb-data:
    driver: local
  ollama-data:
    driver: local

networks:
  railway-net:
    driver: bridge
