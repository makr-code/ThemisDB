# ThemisDB Bench-Source Allowlist
# =================================
#
# This file lists bench_*.cpp source files that are explicitly permitted to
# be absent from a given build profile without causing CI to fail.
#
# Format
# ------
# Each entry is a line with the benchmark stem followed by an optional reason:
#
#   bench_<name>  # <reason>
#
# TOML key=value syntax is also accepted:
#
#   bench_<name> = "<reason>"
#
# Rules for adding an entry
# -------------------------
# Only add a benchmark to this allowlist when at least one of the following
# conditions is met:
#
#   GPU_ONLY        The benchmark requires specialised GPU hardware
#                   (CUDA, HIP, Vulkan compute) that is not available on
#                   standard CI runners.  The CMake gate is controlled by
#                   THEMIS_ENABLE_CUDA / THEMIS_ENABLE_HIP / THEMIS_ENABLE_VULKAN.
#
#   PLATFORM        The benchmark is platform-specific (e.g. ARM SIMD, DPDK,
#                   Windows-only, Linux-only) and cannot be built on all
#                   operating systems used by the CI matrix.
#
#   EXPERIMENTAL    The benchmark is a work-in-progress that is not yet wired
#                   into the CMake build.  It MUST be removed from this list
#                   once the corresponding add_executable() entry is added.
#
#   THIRD_PARTY     The benchmark requires a third-party library that is
#                   intentionally not installed in the standard CI environment
#                   (e.g. llama.cpp model weights, Whisper weights, RAID
#                   hardware).
#
#   DEPRECATED      The source exists for historical reference but is no longer
#                   built.  Schedule removal from the repository within one
#                   minor release cycle.
#
# Reviewing entries
# -----------------
# Every entry SHOULD be reviewed when a new release milestone is cut.
# Entries with reason EXPERIMENTAL must be actioned (wired or deleted) before
# the corresponding feature is marked as PRODUCTION-READY.
#
# CI integration
# --------------
# The guard script reads this file automatically when it is present at
# tools/bench_source_allowlist.toml.  Pass a different path with:
#
#   python3 tools/check_bench_targets.py --allowlist path/to/allowlist.toml
#
# To temporarily disable allowlist filtering and see ALL gaps, run:
#
#   python3 tools/check_bench_targets.py --allowlist /dev/null


# ────────────────────────────────────────────────────────────────────────────
# GPU_ONLY – require CUDA / HIP hardware not available on standard CI runners
# ────────────────────────────────────────────────────────────────────────────

bench_cuda_vs_cpu = "GPU_ONLY: requires CUDA device; built only in gpu-enabled profile"
bench_gpu_vector_index = "GPU_ONLY: requires CUDA/HIP; built only in gpu-enabled profile"
bench_active_vram_allocator = "GPU_ONLY: VRAM allocation benchmarks require physical GPU"
bench_acceleration_dispatch = "GPU_ONLY: multi-backend dispatch requires at least one GPU backend"


# ────────────────────────────────────────────────────────────────────────────
# PLATFORM – platform-specific; cannot build on all CI OS targets
# ────────────────────────────────────────────────────────────────────────────

bench_arm_simd = "PLATFORM: ARM SIMD intrinsics; only built on AArch64 runners"
