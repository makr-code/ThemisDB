# ThemisDB Enterprise Pricing Server - Production Configuration

server:
  # Production hosting configuration
  host: "0.0.0.0"
  port: 6734
  domain: "service.themisdb.org"
  base_url: "https://service.themisdb.org"
  
  # Application
  app_name: "ThemisDB Enterprise Pricing Server"
  version: "1.0.0"
  debug: false
  workers: 4  # Number of uvicorn workers

# Database Configuration (PostgreSQL for production)
database:
  # PostgreSQL connection
  url: "postgresql+asyncpg://themis_pricing:CHANGE_PASSWORD@localhost:5432/themis_pricing"
  
  # Connection pool settings
  pool_size: 20
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 3600
  
  # SQLite fallback (development only)
  sqlite_url: "sqlite+aiosqlite:///./pricing_server.db"

# Security Configuration
security:
  # JWT Settings
  # IMPORTANT: Change this secret key in production!
  # Generate with: openssl rand -hex 32
  secret_key: "CHANGE-THIS-SECRET-KEY-IN-PRODUCTION-OPENSSL-RAND-HEX-32"
  algorithm: "HS256"
  access_token_expire_minutes: 1440  # 24 hours
  
  # CORS Settings
  cors_origins:
    - "https://service.themisdb.org"
    - "https://themisdb.org"
    - "https://www.themisdb.org"
  cors_allow_credentials: true
  cors_allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  cors_allow_headers: ["*"]

# Payment Provider Configuration
payment:
  # Stripe (Primary)
  stripe:
    api_key: ""  # Set via environment: STRIPE_API_KEY
    webhook_secret: ""  # Set via environment: STRIPE_WEBHOOK_SECRET
  
  # Banking API (Alternative)
  banking:
    api_url: ""  # Set via environment: BANKING_API_URL
    api_key: ""  # Set via environment: BANKING_API_KEY
  
  # Mock mode for testing
  mock_mode: false

# Pricing Tiers (EUR per month)
pricing:
  community: 0.0
  enterprise: 5000.0
  hyperscaler: 25000.0
  reseller: 15000.0

# License Validation
license:
  # License verification endpoint for ThemisDB instances
  verification_enabled: true
  
  # Rate limiting for license checks
  rate_limit_per_minute: 60
  
  # Cache settings
  cache_duration_minutes: 60

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # json or text
  file: "/var/log/themisdb/pricing_server.log"
  max_size_mb: 100
  backup_count: 10

# Monitoring
monitoring:
  prometheus_enabled: true
  prometheus_port: 9090
  health_check_interval: 60  # seconds

# SSL/TLS (Handled by reverse proxy)
# Configure nginx or caddy for HTTPS termination
# Example nginx config provided in deploy/nginx/

# Environment Variables Override
# All settings can be overridden via environment variables:
# THEMIS_SERVER_HOST, THEMIS_SERVER_PORT, THEMIS_DATABASE_URL, etc.
