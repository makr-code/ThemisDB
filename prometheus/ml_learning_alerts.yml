/**
 * @file ml_learning_alerts.yml
 * @brief Prometheus alerting rules for ML & Continuous Learning observability
 *
 * These rules provide proactive monitoring and early warning for:
 * - Learning loop failures and high error rates
 * - Provider unavailability
 * - Performance degradation
 * - Retraining stalls
 * - Circuit breaker activation
 */

groups:
  - name: ml_learning_operations
    interval: 30s
    rules:
      # ========================================================================
      # High Error Rates
      # ========================================================================

      - alert: MLLearningLoopHighErrorRate
        expr: |
          (rate(themisdb_ml_loop_errors_total[5m]) > 0.1)
          or
          (increase(themisdb_ml_loop_errors_total[5m]) >= 5)
        for: 5m
        annotations:
          summary: "High error rate in ML learning loop"
          description: |
            Loop {{ $labels.loop_id }} has error rate > 10% or >= 5 errors in 5 minutes.
            Current rate: {{ $value | humanizePercentage }}
          severity: warning

      - alert: MLLearningLoopCriticalErrorRate
        expr: |
          (rate(themisdb_ml_loop_errors_total[5m]) > 0.5)
          or
          (increase(themisdb_ml_loop_errors_total[5m]) >= 20)
        for: 2m
        annotations:
          summary: "CRITICAL error rate in ML learning loop"
          description: |
            Loop {{ $labels.loop_id }} has CRITICAL error rate > 50% or >= 20 errors.
            Current rate: {{ $value | humanizePercentage }}
          severity: critical

      # ========================================================================
      # Provider Unavailability
      # ========================================================================

      - alert: MLProviderUnavailable
        expr: |
          increase(themisdb_ml_errors_total{error_type="provider_unavailable"}[5m]) > 0
        for: 1m
        annotations:
          summary: "ML signal provider unavailable"
          description: |
            Provider for {{ $labels.component }} is unavailable or not wired.
            In production mode, this must be resolved immediately.
          severity: critical

      - alert: MLMultipleProvidersFailing
        expr: |
          count(increase(themisdb_ml_errors_total{error_type="provider_unavailable"}[5m]) > 0) >= 2
        for: 1m
        annotations:
          summary: "Multiple ML providers are failing"
          description: |
            {{ $value }} ML signal providers are failing.
            This indicates systemic issues in the learning infrastructure.
          severity: critical

      # ========================================================================
      # Circuit Breaker
      # ========================================================================

      - alert: MLCircuitBreakerOpen
        expr: |
          increase(themisdb_ml_warnings_total{warning_type="circuit_breaker_open"}[5m]) > 0
        for: 1m
        annotations:
          summary: "ML learning loop circuit breaker opened"
          description: |
            Circuit breaker opened for {{ $labels.component }}.
            Too many consecutive failures have been detected.
            Learning is temporarily disabled to prevent cascading failures.
          severity: warning

      # ========================================================================
      # Performance Degradation
      # ========================================================================

      - alert: MLAccuracyDegradation
        expr: |
          (rate(themisdb_ml_accuracy[10m]) < -0.005)
          and
          (themisdb_ml_accuracy < 0.80)
        for: 15m
        annotations:
          summary: "Model accuracy is degrading"
          description: |
            Model accuracy is degrading at rate > 0.5% per 10 minutes.
            Current accuracy: {{ $value | humanizePercentage }}
          severity: warning

      - alert: MLAccuracyCriticalDegradation
        expr: |
          (rate(themisdb_ml_accuracy[5m]) < -0.01)
          or
          (themisdb_ml_accuracy < 0.60)
        for: 5m
        annotations:
          summary: "CRITICAL model accuracy degradation"
          description: |
            Model accuracy is critically degraded or degrading rapidly.
            Current accuracy: {{ $value | humanizePercentage }}
          severity: critical

      # ========================================================================
      # Retraining Issues
      # ========================================================================

      - alert: MLRetrainingStalled
        expr: |
          (
            (rate(themisdb_ml_retraining_progress_percent{adapter_id!=""}[15m]) == 0)
            and
            (themisdb_ml_retraining_progress_percent < 100)
          )
          or
          (increase(themisdb_ml_errors_total{error_type="retraining_failed"}[10m]) > 0)
        for: 30m
        annotations:
          summary: "LoRA retraining appears stalled"
          description: |
            Retraining for adapter {{ $labels.adapter_id }} has made no progress for 30 minutes.
            Or retraining has failed.
            Investigate if training data pipeline is blocked.
          severity: warning

      - alert: MLRetrainingFailed
        expr: |
          increase(themisdb_ml_errors_total{error_type="retraining_failed"}[5m]) > 0
        for: 1m
        annotations:
          summary: "LoRA retraining failed"
          description: |
            Retraining for adapter {{ $labels.component }} has failed.
            Check training logs for details about the failure.
          severity: critical

      # ========================================================================
      # Feedback Collection Issues
      # ========================================================================

      - alert: MLFeedbackCollectionStalled
        expr: |
          (
            (rate(themisdb_ml_feedback_count[30m]) == 0)
            and
            (themisdb_ml_feedback_count > 0)
          )
        for: 60m
        annotations:
          summary: "Feedback collection appears stalled"
          description: |
            No new feedback has been collected for adapter {{ $labels.adapter_id }} in 60 minutes.
            Check if feedback pipeline is connected and operational.
          severity: warning

      # ========================================================================
      # A/B Test Issues
      # ========================================================================

      - alert: MLABTestDegradation
        expr: |
          (themisdb_ml_ab_test_improvement_percent < -0.05)
          and
          (themisdb_ml_ab_test_state{status="running"} == 1)
        for: 10m
        annotations:
          summary: "A/B test shows degradation"
          description: |
            A/B test {{ $labels.test_id }} shows >= 5% degradation.
            Treatment: {{ $value | humanizePercentage }}
            Consider rolling back or investigating root cause.
          severity: warning

      # ========================================================================
      # Latency Warnings
      # ========================================================================

      - alert: MLLoopHighLatency
        expr: |
          histogram_quantile(0.95, rate(themisdb_ml_loop_duration_ms_bucket[5m])) > 500
        for: 5m
        annotations:
          summary: "ML learning loop latency is high"
          description: |
            P95 latency for loop {{ $labels.loop_id }} is > 500ms.
            This may indicate resource constraints or blocking operations.
          severity: warning

      - alert: MLInferenceHighLatency
        expr: |
          histogram_quantile(0.95, rate(themisdb_ml_inference_latency_ms_bucket[5m])) > 1000
        for: 5m
        annotations:
          summary: "Model inference latency is high"
          description: |
            P95 inference latency for adapter {{ $labels.adapter_id }} is > 1 second.
            This may impact end-user experience.
          severity: warning

      # ========================================================================
      # General Warnings
      # ========================================================================

      - alert: MLWarningRateHigh
        expr: |
          rate(themisdb_ml_warnings_total[5m]) > 0.5
        for: 10m
        annotations:
          summary: "High warning rate in ML learning paths"
          description: |
            Warning rate: {{ $value | humanizePercentage }}
            This indicates recurring issues that should be investigated.
          severity: warning

      # ========================================================================
      # SLO Violations
      # ========================================================================

      - alert: MLErrorRateSLOViolation
        expr: |
          (rate(themisdb_ml_loop_errors_total[5m]) / rate(themisdb_ml_loop_executions_total[5m])) > 0.05
        for: 15m
        annotations:
          summary: "ML error rate SLO violated"
          description: |
            Error rate for loop {{ $labels.loop_id }} exceeds 5% SLO.
            Current rate: {{ $value | humanizePercentage }}
          severity: warning

      - alert: MLAvailabilitySLOViolation
        expr: |
          (rate(themisdb_ml_loop_errors_total[1h]) / rate(themisdb_ml_loop_executions_total[1h])) > 0.01
        for: 30m
        annotations:
          summary: "ML availability SLO violated"
          description: |
            1-hour error rate for loop {{ $labels.loop_id }} exceeds 1% SLO.
            Current rate: {{ $value | humanizePercentage }}
          severity: critical

# ============================================================================
# Recording Rules (optional - for performance optimization)
# ============================================================================

  - name: ml_learning_recordings
    interval: 30s
    rules:
      # Pre-compute common queries for Grafana dashboards
      - record: ml:loop:error_rate:5m
        expr: |
          rate(themisdb_ml_loop_errors_total[5m]) / rate(themisdb_ml_loop_executions_total[5m])

      - record: ml:loop:latency:p95:5m
        expr: |
          histogram_quantile(0.95, rate(themisdb_ml_loop_duration_ms_bucket[5m]))

      - record: ml:inference:latency:p95:5m
        expr: |
          histogram_quantile(0.95, rate(themisdb_ml_inference_latency_ms_bucket[5m]))

      - record: ml:adapter:accuracy:avg:5m
        expr: |
          avg without(adapter_id) (themisdb_ml_model_accuracy)
