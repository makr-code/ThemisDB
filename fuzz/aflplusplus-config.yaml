# ThemisDB AFL++ Fuzzing Configuration
# Version: 1.0.0
# Description: Configuration for AFL++ fuzzing of ThemisDB components

---
# Fuzzing Engine Configuration
fuzzing:
  engine: "AFL++"
  version: "4.09c"
  mode: persistent

  # Fuzzing Targets
  targets:
    - name: aql_parser
      description: "AQL Query Parser Fuzzing"
      source: src/aql/parser.cpp
      harness: fuzz/harnesses/aql_parser_harness.cpp
      input_corpus: fuzz/corpus/aql/
      dictionary: fuzz/dictionaries/aql.dict
      timeout: 1000  # ms
      memory_limit: 512MB
      priority: high
      sanitizers:
        - address
        - undefined
      coverage_guided: true

    - name: json_parser
      description: "JSON Document Parser Fuzzing"
      source: src/storage/json_parser.cpp
      harness: fuzz/harnesses/json_parser_harness.cpp
      input_corpus: fuzz/corpus/json/
      dictionary: fuzz/dictionaries/json.dict
      timeout: 500
      memory_limit: 256MB
      priority: high
      sanitizers:
        - address
        - undefined
        - memory
      coverage_guided: true

    - name: crypto_operations
      description: "Cryptographic Operations Fuzzing"
      source: src/security/crypto.cpp
      harness: fuzz/harnesses/crypto_harness.cpp
      input_corpus: fuzz/corpus/crypto/
      dictionary: fuzz/dictionaries/crypto.dict
      timeout: 2000
      memory_limit: 1GB
      priority: critical
      sanitizers:
        - address
        - undefined
      coverage_guided: true

    - name: network_protocol
      description: "Network Protocol Parser Fuzzing"
      source: src/server/protocol.cpp
      harness: fuzz/harnesses/protocol_harness.cpp
      input_corpus: fuzz/corpus/protocol/
      dictionary: fuzz/dictionaries/protocol.dict
      timeout: 1000
      memory_limit: 512MB
      priority: high
      sanitizers:
        - address
        - undefined
      coverage_guided: true

    - name: storage_engine
      description: "Storage Engine I/O Fuzzing"
      source: src/storage/engine.cpp
      harness: fuzz/harnesses/storage_harness.cpp
      input_corpus: fuzz/corpus/storage/
      dictionary: fuzz/dictionaries/storage.dict
      timeout: 5000
      memory_limit: 2GB
      priority: medium
      sanitizers:
        - address
      coverage_guided: true

    - name: auth_handler
      description: "Authentication Handler Fuzzing"
      source: src/auth/handler.cpp
      harness: fuzz/harnesses/auth_harness.cpp
      input_corpus: fuzz/corpus/auth/
      dictionary: fuzz/dictionaries/auth.dict
      timeout: 1000
      memory_limit: 256MB
      priority: critical
      sanitizers:
        - address
        - undefined
      coverage_guided: true

    - name: pii_redaction
      description: "PII Redaction Pipeline Fuzzing – ensures no PII leaks through redactForLog/redactAttributes/redactLabels and that the pipeline is crash-free and idempotent on arbitrary input"
      source: src/security/pii_redaction_policy.cpp
      harness: fuzz/harnesses/pii_redaction_harness.cpp
      input_corpus: fuzz/corpus/pii/
      dictionary: fuzz/dictionaries/pii.dict
      timeout: 1000
      memory_limit: 256MB
      priority: critical
      sanitizers:
        - address
        - undefined
      coverage_guided: true

  # Compiler Configuration
  compiler:
    cc: afl-clang-lto
    cxx: afl-clang-lto++
    flags:
      - "-O2"
      - "-g"
      - "-fno-omit-frame-pointer"
      - "-fprofile-instr-generate"
      - "-fcoverage-mapping"
    sanitizer_flags:
      address: "-fsanitize=address"
      undefined: "-fsanitize=undefined"
      memory: "-fsanitize=memory"
      thread: "-fsanitize=thread"
    instrumentation: LTO
    cmplog: true
    compcov: true

  # Runtime Configuration
  runtime:
    parallel_instances: 8
    main_instance:
      mode: master
      power_schedule: explore
    secondary_instances:
      count: 7
      power_schedules:
        - fast
        - coe
        - lin
        - quad
        - exploit
        - rare
        - seek
    sync_interval: 60  # seconds
    stats_interval: 30  # seconds

  # Corpus Management
  corpus:
    initial_seeds:
      aql:
        - "SELECT * FROM collection"
        - 'INSERT { "key": "value" } INTO collection'
        - 'UPDATE doc WITH { "updated": true } IN collection'
        - "FOR doc IN collection FILTER doc.active == true RETURN doc"
      json:
        - "{}"
        - '{"key": "value"}'
        - '{"nested": {"array": [1, 2, 3]}}'
        - '[{"id": 1}, {"id": 2}]'
      pii:
        - "Contact alice@example.com for details."
        - "SSN: 123-45-6789"
        - "Card: 4242-4242-4242-4242"
        - "IBAN DE89370400440532013000"
        - "Phone +49-123-456789"
        - "Query completed in 42 ms, 7 rows."
        - "Invoice bob@corp.de card 4532-1488-0343-6467 SSN 987-65-4321"
    minimization:
      enabled: true
      tool: afl-cmin
      options:
        - "-C"
        - "-i"
        - corpus_full
        - "-o"
        - corpus_min
    tmin:
      enabled: true
      tool: afl-tmin
      options:
        - "-e"
        - "@@"

  # Crash Analysis
  crash_analysis:
    dedup:
      enabled: true
      method: stack_hash
    triage:
      enabled: true
      tool: casr
      severity_levels:
        - exploitable
        - probably_exploitable
        - probably_not_exploitable
        - not_exploitable
    output_dir: fuzz/crashes
    hang_dir: fuzz/hangs

  # Coverage Tracking
  coverage:
    enabled: true
    tool: llvm-cov
    format:
      - html
      - lcov
    output_dir: fuzz/coverage
    threshold:
      line: 80
      branch: 70
      function: 85

  # Reporting
  reporting:
    format:
      - json
      - html
      - markdown
    output_dir: fuzz/reports
    metrics:
      - total_execs
      - execs_per_sec
      - paths_total
      - paths_found
      - crashes_total
      - crashes_unique
      - hangs_total
      - coverage_percentage
    notifications:
      enabled: true
      on_crash: true
      on_hang: false
      channels:
        - slack
        - email

---
# Dictionaries
dictionaries:
  aql:
    description: "AQL keywords and operators"
    tokens:
      - "SELECT"
      - "FROM"
      - "WHERE"
      - "INSERT"
      - "UPDATE"
      - "DELETE"
      - "FOR"
      - "IN"
      - "FILTER"
      - "RETURN"
      - "LET"
      - "COLLECT"
      - "SORT"
      - "LIMIT"
      - "DISTINCT"
      - "AND"
      - "OR"
      - "NOT"
      - "=="
      - "!="
      - "<"
      - ">"
      - "<="
      - ">="
      - "LIKE"
      - "INTO"
      - "WITH"
      - "REMOVE"
      - "UPSERT"
      - "GRAPH"

  json:
    description: "JSON syntax tokens"
    tokens:
      - "{"
      - "}"
      - "["
      - "]"
      - ":"
      - ","
      - "null"
      - "true"
      - "false"
      - '\"'
      - "\\"
      - "\\n"
      - "\\r"
      - "\\t"
      - "\\u"

  crypto:
    description: "Cryptographic test vectors"
    tokens:
      - "AES"
      - "GCM"
      - "CBC"
      - "256"
      - "128"
      - "IV"
      - "TAG"
      - "KEY"
      - "ENCRYPT"
      - "DECRYPT"
      - "SIGN"
      - "VERIFY"
      - "HASH"
      - "SHA256"
      - "SHA384"
      - "SHA512"
      - "HMAC"
      - "RSA"
      - "ECDSA"
      - "Ed25519"

  protocol:
    description: "Network protocol tokens"
    tokens:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "PATCH"
      - "HEAD"
      - "OPTIONS"
      - "HTTP/1.1"
      - "HTTP/2"
      - "Content-Type"
      - "Authorization"
      - "Bearer"
      - "application/json"

  auth:
    description: "Authentication tokens"
    tokens:
      - "Bearer"
      - "Basic"
      - "token"
      - "password"
      - "username"
      - "grant_type"
      - "client_id"
      - "client_secret"
      - "refresh_token"
      - "access_token"
      - "expires_in"
      - "scope"

  pii:
    description: "PII pattern tokens for redaction fuzzing"
    tokens:
      - "@"
      - ".com"
      - ".de"
      - "123-45-"
      - "-6789"
      - "4242-4242"
      - "4532-1488"
      - "DE89"
      - "GB29"
      - "+49-"
      - "(555)"
      - "192.168."
      - "https://"
      - "email"
      - "phone"
      - "ssn"
      - "credit_card"
      - "iban"

---
# Environment Variables
environment:
  AFL_SKIP_CPUFREQ: "1"
  AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: "1"
  AFL_AUTORESUME: "1"
  AFL_TESTCACHE_SIZE: "500"
  AFL_CMPLOG_ONLY_NEW: "1"
  AFL_FAST_CAL: "1"
  AFL_MAP_SIZE: "10000000"
  AFL_DISABLE_TRIM: "0"
  AFL_KEEP_TIMEOUTS: "1"
  AFL_NO_AFFINITY: "0"
  AFL_TRY_AFFINITY: "1"
  AFL_PRELOAD: ""
  AFL_DEBUG: "0"
  AFL_QUIET: "0"

---
# CI/CD Integration
ci_integration:
  github_actions:
    enabled: true
    workflow: .github/workflows/fuzzing.yml
    schedule: "0 0 * * 0"  # Weekly on Sunday
    timeout_minutes: 360
    artifacts:
      - crashes
      - coverage
      - reports

  oss_fuzz:
    enabled: false
    project: themisdb
    sanitizers:
      - address
      - undefined
      - memory

---
# Build Configuration
build:
  cmake:
    preset: fuzz
    options:
      CMAKE_C_COMPILER: afl-clang-lto
      CMAKE_CXX_COMPILER: afl-clang-lto++
      CMAKE_BUILD_TYPE: Debug
      ENABLE_FUZZING: ON
      ENABLE_SANITIZERS: ON
      BUILD_SHARED_LIBS: OFF

  # Persistent Mode Build
  persistent_mode:
    enabled: true
    loop_count: 10000
    shared_memory: true

---
# Advanced Options
advanced:
  # CMPLOG (comparison operand logging)
  cmplog:
    enabled: true
    level: 2  # 0-3

  # MOpt (mutation scheduling)
  mopt:
    enabled: true
    schedule: havoc

  # Custom Mutators
  custom_mutators:
    - name: grammar_mutator
      path: fuzz/mutators/aql_grammar_mutator.so
      enabled: false
    - name: protobuf_mutator
      path: fuzz/mutators/protobuf_mutator.so
      enabled: false

  # Structure-aware Fuzzing
  structure_aware:
    enabled: true
    grammar_file: fuzz/grammars/aql.g4

  # Persistent Mode Hooks
  hooks:
    init: __afl_fuzz_init
    deinit: __afl_fuzz_deinit
    testcase: __afl_fuzz_testcase
